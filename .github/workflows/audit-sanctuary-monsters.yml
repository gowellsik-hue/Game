name: "audit-sanctuary-monsters.yml | V46 | Full SPR Representative Images"
run-name: "audit-sanctuary-monsters.yml | V46 | Full SPR Representative Images"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/audit-sanctuary-monsters.yml"]

permissions:
  contents: read
  actions: read

jobs:
  original-text:
    name: "V46 | All original SPR IDs"
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare existing original SPR decoder
        shell: bash
        run: |
          set -euo pipefail

          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full python3-pil python3-yaml

          mkdir -p downloads original reports packages representatives

          git show 6777026ae76858dfffbf510a6539c76e2bc217e6:.github/workflows/extract-sanctuary-magic-casts-review.yml > /tmp/verified-v18.yml

          python3 - <<'PY'
          import ast,yaml
          from pathlib import Path

          wf=yaml.safe_load(
              Path('/tmp/verified-v18.yml').read_text('utf-8')
          )

          marker="cat > /tmp/sanctuary_extract.py <<'PY'\n"

          matches=[
              s['run']
              for s in wf['jobs']['extract']['steps']
              if marker in s.get('run','')
          ]

          assert len(matches)==1

          source=matches[0].split(
              marker,1
          )[1].split('\nPY\n',1)[0]

          classes=[
              n for n in ast.parse(source).body
              if isinstance(n,ast.ClassDef)
              and n.name=='Reader'
          ]

          assert len(classes)==1

          reader=ast.get_source_segment(
              source,classes[0]
          )

          assert reader and 'def decode(self)' in reader

          Path('/tmp/verified_spr_reader.py').write_text(
              'import struct\nfrom PIL import Image\n'
              +reader+'\n',
              'utf-8'
          )
          PY

          python3 -m py_compile /tmp/verified_spr_reader.py

      - name: Restore original Sprite IDX and PAK files from release
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if gh release download v1.0.0 \
                --repo "$GITHUB_REPOSITORY" \
                --pattern 'Sanctuary.of.Aden.-.Copy.*' \
                --dir downloads; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            rm -rf downloads
            mkdir -p downloads
            sleep 3
          done

          python3 - <<'PY'
          from pathlib import Path

          base='Sanctuary.of.Aden.-.Copy'

          expected={
              f'{base}.z{i:02d}':100000000
              for i in range(1,46)
          }

          expected[f'{base}.zip']=38808950

          found={
              p.name:p.stat().st_size
              for p in Path('downloads').iterdir()
              if p.is_file()
          }

          assert found==expected,(
              'Original release volumes incomplete',
              found
          )

          assert sum(found.values())==4538808950
          PY

          7z x 'downloads/Sanctuary.of.Aden.-.Copy.zip' \
            'Sanctuary of Aden - Copy/Sprite*.idx' \
            'Sanctuary of Aden - Copy/Sprite*.pak' \
            "-o${PWD}/original" -y \
            > reports/original-extract.log 2>&1 || {
              tail -n 100 reports/original-extract.log
              exit 1
            }

          tail -n 15 reports/original-extract.log

          rm -rf downloads

          df -h .

      - name: Inspect every SPR record and generate one PNG per ID
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/v46_extract.py <<'PY'
          import base64,csv,hashlib,json,re,struct
          from pathlib import Path
          from collections import Counter,defaultdict
          from PIL import Image
          from verified_spr_reader import Reader

          ROOT=Path('original/Sanctuary of Aden - Copy')
          REPORT=Path('reports')
          PNG=Path('representatives')
          OUT=Path('packages')

          stems=['Sprite']+[
              f'Sprite{i:02d}'
              for i in range(16)
          ]

          expected={
              f'{stem}.{ext}'
              for stem in stems
              for ext in ('idx','pak')
          }

          actual={
              p.name
              for p in ROOT.iterdir()
              if p.is_file()
              and re.fullmatch(
                  r'Sprite(?:\d+)?\.(idx|pak)',
                  p.name,
                  re.I
              )
          }

          assert actual==expected,(
              'Sprite archive mismatch',
              sorted(actual^expected)
          )

          groups={}
          ids=set()
          regular_ids=set()

          index_total=regular=irregular=0

          for stem in stems:

              idx=ROOT/f'{stem}.idx'
              pak=ROOT/f'{stem}.pak'

              raw=idx.read_bytes()
              pak_size=pak.stat().st_size

              count=struct.unpack_from('<I',raw)[0]

              assert len(raw)==4+28*count,idx.name

              rows=[]

              for entry in range(count):

                  pos=4+28*entry

                  offset=struct.unpack_from(
                      '<I',raw,pos
                  )[0]

                  name=raw[pos+4:pos+24].split(
                      b'\0',1
                  )[0].decode('cp949','replace')

                  size=struct.unpack_from(
                      '<I',raw,pos+24
                  )[0]

                  assert 0<size and offset+size<=pak_size,(
                      idx.name,entry,name
                  )

                  index_total+=1

                  if not name.lower().endswith('.spr'):
                      continue

                  match=re.fullmatch(
                      r'(\d+)(?:-(\d+)_?)?\.spr',
                      name,
                      re.I
                  )

                  assert match,(
                      'Unhandled SPR filename',
                      name
                  )

                  aid=int(match[1])

                  sub=(
                      int(match[2])
                      if match[2] is not None
                      else None
                  )

                  ids.add(aid)

                  if re.fullmatch(
                      r'\d+-\d+\.spr',
                      name,
                      re.I
                  ):
                      regular+=1
                      regular_ids.add(aid)
                  else:
                      irregular+=1

                  rows.append(
                      (offset,entry,size,name,aid,sub)
                  )

              groups[pak]=sorted(rows)

          assert (
              index_total,
              regular,
              irregular
          )==(172369,157978,62)

          assert len(regular_ids)==8233
          assert len(ids)==8234

          targets=sorted(ids-{0})

          assert len(targets)==8233
          assert targets[0]==1
          assert targets[-1]==13269

          total=sum(
              len(rows)
              for rows in groups.values()
          )

          assert total==158040

          best={}
          states=Counter()
          per_id=defaultdict(Counter)

          frames_total=0

          with (REPORT/'SPR-record-audit.csv').open(
              'w',
              encoding='utf-8-sig',
              newline=''
          ) as f:

              writer=csv.writer(f)

              writer.writerow([
                  'pak',
                  'entry',
                  'filename',
                  'id',
                  'sub',
                  'offset',
                  'bytes',
                  'sha256',
                  'frames',
                  'visible_frames',
                  'status',
                  'error'
              ])

              for pak,rows in groups.items():

                  with pak.open('rb') as stream:

                      for offset,entry,size,name,aid,sub in rows:

                          stream.seek(offset)
                          raw=stream.read(size)

                          assert len(raw)==size,(
                              pak.name,entry,name
                          )

                          digest=hashlib.sha256(
                              raw
                          ).hexdigest()

                          n=visible=0
                          error=''
                          candidate=None
                          rank=None

                          try:

                              frames=Reader(raw).decode()

                              n=len(frames)
                              frames_total+=n

                              for frame,im in enumerate(frames):

                                  if im is None:
                                      continue

                                  alpha=im.getchannel('A')
                                  bbox=alpha.getbbox()

                                  if bbox is None:
                                      continue

                                  visible+=1

                                  score=(
                                      int(
                                          sub is not None
                                          and 0<=sub<8
                                      ),
                                      sum(alpha.histogram()[1:]),
                                      -(
                                          sub
                                          if sub is not None
                                          else 999999
                                      ),
                                      -frame
                                  )

                                  if rank is None or score>rank:

                                      rank=score
                                      candidate=(im,bbox,frame)

                              state=(
                                  'visible'
                                  if candidate is not None
                                  else 'empty'
                              )

                          except (
                              ValueError,
                              IndexError,
                              OverflowError,
                              struct.error,
                              OSError
                          ) as exc:

                              state='decode_error'
                              error=str(exc)
                              candidate=None

                          if (
                              candidate is not None
                              and aid!=0
                              and (
                                  aid not in best
                                  or rank>best[aid]['rank']
                              )
                          ):

                              im,bbox,frame=candidate

                              image=im.crop(bbox)

                              image.save(
                                  PNG/f'{aid}.png',
                                  format='PNG',
                                  compress_level=6
                              )

                              best[aid]={
                                  'rank':rank,
                                  'pak':pak.name,
                                  'entry':entry,
                                  'filename':name,
                                  'sub':sub,
                                  'frame':frame,
                                  'width':image.width,
                                  'height':image.height,
                                  'source_sha256':digest
                              }

                          states[state]+=1
                          per_id[aid][state]+=1

                          writer.writerow([
                              pak.name,
                              entry,
                              name,
                              aid,
                              sub,
                              offset,
                              size,
                              digest,
                              n,
                              visible,
                              state,
                              error
                          ])

                  print(
                      'Processed',
                      pak.name,
                      sum(states.values()),
                      '/',
                      total,
                      'PNG IDs',
                      len(best),
                      flush=True
                  )

          assert sum(states.values())==total
          assert set(per_id)==ids

          missing=sorted(
              set(targets)-set(best)
          )

          assert {
              int(p.stem)
              for p in PNG.glob('*.png')
          }==set(best)

          assert len(best)+len(missing)==len(targets)

          html=OUT/'SLKnight_SPR_Representative_Images.html'

          with html.open(
              'w',
              encoding='utf-8'
          ) as out, (REPORT/'SPR-ID-manifest.csv').open(
              'w',
              encoding='utf-8-sig',
              newline=''
          ) as f:

              w=csv.writer(f)

              w.writerow([
                  'id',
                  'pak',
                  'entry',
                  'filename',
                  'sub',
                  'frame',
                  'width',
                  'height',
                  'source_sha256',
                  'png_sha256',
                  'visible_records',
                  'empty_records',
                  'decode_errors',
                  'status'
              ])

              out.write('''<!doctype html>
          <html lang="ko">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>SPR</title>
          <style>
          *{box-sizing:border-box}
          body{
              margin:0;
              background:#20242b;
              color:#fff;
              font:14px system-ui,sans-serif
          }
          main{
              display:grid;
              grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
              gap:6px;
              padding:8px
          }
          article{
              min-height:138px;
              background:#303741;
              border:1px solid #48505c;
              border-radius:4px;
              padding:6px;
              display:flex;
              flex-direction:column;
              align-items:center;
              justify-content:center;
              gap:4px
          }
          img{
              max-width:100%;
              max-height:110px;
              object-fit:contain;
              image-rendering:pixelated;
              cursor:zoom-in
          }
          article[hidden]{display:none}
          header{
              position:sticky;
              top:0;
              background:#20242b;
              z-index:2;
              padding:8px;
              display:flex;
              gap:10px;
              align-items:center
          }
          dialog{
              background:#303741;
              color:#fff;
              border:1px solid #667;
              padding:12px;
              text-align:center
          }
          dialog img{
              max-width:85vw;
              max-height:80vh;
              width:auto;
              height:auto;
              cursor:default
          }
          dialog::backdrop{background:#000b}
          </style>
          </head>
          <body>
          <header>
          <input id="search" type="search" placeholder="SPR ID">
          <span id="count"></span>
          </header>
          <main id="grid">''')

              for aid in targets:

                  counts=per_id[aid]

                  if aid not in best:

                      w.writerow(
                          [aid]+['']*9+[
                              counts['visible'],
                              counts['empty'],
                              counts['decode_error'],
                              'no_image'
                          ]
                      )

                      out.write(
                          f'<article data-id="{aid}">'
                          f'<span>추출 실패</span>'
                          f'<b>{aid}</b>'
                          f'</article>\n'
                      )

                      continue

                  m=best[aid]

                  p=PNG/f'{aid}.png'

                  with Image.open(p) as im:

                      im.load()

                      assert im.format=='PNG'
                      assert im.mode=='RGBA'
                      assert im.getchannel('A').getbbox()

                      assert im.size==(
                          m['width'],
                          m['height']
                      )

                  data=p.read_bytes()

                  b64=base64.b64encode(
                      data
                  ).decode('ascii')

                  w.writerow([
                      aid,
                      m['pak'],
                      m['entry'],
                      m['filename'],
                      m['sub'],
                      m['frame'],
                      m['width'],
                      m['height'],
                      m['source_sha256'],
                      hashlib.sha256(data).hexdigest(),
                      counts['visible'],
                      counts['empty'],
                      counts['decode_error'],
                      'ok'
                  ])

                  out.write(
                      f'<article data-id="{aid}">'
                      f'<img loading="lazy" decoding="async" '
                      f'src="data:image/png;base64,{b64}" '
                      f'alt="SPR {aid}">'
                      f'<b>{aid}</b>'
                      f'</article>\n'
                  )

              out.write('''
          </main>
          <dialog id="zoom">
          <b id="zoomid"></b>
          <p><img id="zoomimg" alt=""></p>
          <button id="close">닫기</button>
          </dialog>
          <script>
          const cards=[
              ...document.querySelectorAll('article[data-id]')
          ];
          const q=document.getElementById('search');
          const count=document.getElementById('count');
          const zoom=document.getElementById('zoom');
          const zoomimg=document.getElementById('zoomimg');
          const zoomid=document.getElementById('zoomid');

          function filter(){
              let n=0;
              for(const card of cards){
                  card.hidden=!card.dataset.id.includes(
                      q.value.trim()
                  );
                  if(!card.hidden)n++;
              }
              count.textContent=n+' / '+cards.length;
          }

          q.addEventListener('input',filter);

          filter();

          document.getElementById('grid').addEventListener(
              'click',e=>{
                  if(e.target.tagName==='IMG'){
                      zoomimg.src=e.target.src;
                      zoomid.textContent=e.target.closest(
                          'article'
                      ).dataset.id;
                      zoom.showModal();
                  }
              }
          );

          document.getElementById('close').addEventListener(
              'click',()=>zoom.close()
          );
          </script>
          </body>
          </html>''')

          body=html.read_bytes()

          assert body.count(
              b'<article data-id='
          )==len(targets)

          assert body.count(
              b'src="data:image/png;base64,'
          )==len(best)

          summary={
              'indexed_records':index_total,
              'spr_records':total,
              'regular_spr':regular,
              'irregular_spr':irregular,
              'ids_including_zero':len(ids),
              'target_ids':len(targets),
              'processed_records':sum(states.values()),
              'record_status':dict(states),
              'decoded_frames':frames_total,
              'representative_images':len(best),
              'ids_without_image':missing,
              'complete':not missing
          }

          (REPORT/'summary.json').write_text(
              json.dumps(
                  summary,
                  ensure_ascii=False,
                  indent=2
              ),
              'utf-8'
          )

          print(
              json.dumps(
                  summary,
                  ensure_ascii=False
              ),
              flush=True
          )
          PY

          python3 -m py_compile /tmp/v46_extract.py

          python3 /tmp/v46_extract.py

      - name: Upload single-scroll representative HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-sanctuary-monsters-v46-all-spr-html
          path: packages/SLKnight_SPR_Representative_Images.html
          if-no-files-found: error
          retention-days: 30

      - name: Upload full SPR audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-sanctuary-monsters-v46-all-spr-audit
          path: reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Verify complete representative extraction
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          s=json.loads(
              Path('reports/summary.json').read_text('utf-8')
          )

          assert s['processed_records']==158040

          assert s['target_ids']==8233

          assert s['representative_images']==8233,(
              s['ids_without_image']
          )

          assert s['complete']

          print(
              'PASS: all 8233 positive SPR IDs '
              'have one verified representative PNG.'
          )
          PY
