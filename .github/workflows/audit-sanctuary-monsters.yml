
name: Sanctuary of Aden Verified XML Recovery V8

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/audit-sanctuary-monsters.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: sanctuary-monster-audit
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Prepare environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previous/v4 previous/v2 reports/xml reports/tables
          openssl version
          python3 --version

      - name: Restore verified V4 XML samples and V2 sprite index
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 38828891785 \
            --repo "$GITHUB_REPOSITORY" \
            --name Sanctuary-V4-Binary-Animation-Analysis \
            --dir previous/v4
          gh run download 38784834277 \
            --repo "$GITHUB_REPOSITORY" \
            --name Sanctuary-V2-Reports \
            --dir previous/v2
          test -s previous/v4/raw/000000_Actions.xml
          test -s previous/v4/raw/000002_QMotionInfo.xml
          test -n "$(find previous/v2 -name sprite_id_groups.csv -print -quit)"

      - name: Decrypt, validate and map original XML files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import hashlib
          import json
          import os
          import re
          import subprocess
          import xml.etree.ElementTree as ET
          from collections import Counter, defaultdict
          from pathlib import Path

          ROOT = Path.cwd()
          RAW = ROOT / "previous/v4/raw"
          OUT = ROOT / "reports"
          XML = OUT / "xml"
          TABLES = OUT / "tables"
          KEY = "dc8401212a40200add25b9a70db9c94e"
          IV = bytes.fromhex("3e0978aac4d53063300c5f9a807f2246")

          XML.mkdir(parents=True, exist_ok=True)
          TABLES.mkdir(parents=True, exist_ok=True)

          def write_csv(name, fields, rows):
              with (TABLES / name).open("w", encoding="utf-8-sig", newline="") as handle:
                  writer = csv.DictWriter(handle, fieldnames=fields, extrasaction="ignore")
                  writer.writeheader()
                  writer.writerows(rows)

          def decrypt_layer(source):
              if len(source) <= 4 or source[0] != 0x58:
                  raise ValueError("Not an encrypted XML layer")
              blocks_len = (len(source) - 4) // 16 * 16
              cipher_blocks = source[4:4 + blocks_len]
              if cipher_blocks:
                  result = subprocess.run(
                      ["openssl", "enc", "-aes-128-ecb", "-d", "-nopad", "-nosalt", "-K", KEY],
                      input=cipher_blocks,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      check=True
                  )
                  decoded_blocks = result.stdout
                  if len(decoded_blocks) != blocks_len:
                      raise ValueError("Unexpected AES result size")
              else:
                  decoded_blocks = b""
              result = bytearray(source)
              feedback = IV
              for start in range(0, blocks_len, 16):
                  end = start + 16
                  result[4 + start:4 + end] = bytes(
                      a ^ b for a, b in zip(decoded_blocks[start:end], feedback)
                  )
                  feedback = cipher_blocks[start:end]
              for offset in range(blocks_len, len(source) - 4):
                  result[4 + offset] = source[4 + offset] ^ feedback[offset - blocks_len]
              result[0] = 0x3c
              return bytes(result)

          def recover(original):
              data = original
              steps = []
              layers = 0
              for _ in range(8):
                  try:
                      root = ET.fromstring(data)
                      return data, root, layers, steps
                  except ET.ParseError:
                      pass
                  if data.startswith(b"\x3c\xbb\xbf\x3c"):
                      data = b"\xef" + data[1:]
                      steps.append("RESTORE_UTF8_BOM")
                      continue
                  if data.startswith(b"<?xm") and layers > 0:
                      data = b"X" + data[1:]
                      steps.append("RESTORE_NESTED_MARKER")
                      continue
                  if data.startswith(b"X") and len(data) > 4:
                      data = decrypt_layer(data)
                      layers += 1
                      steps.append("AES_DECRYPT")
                      continue
                  raise ValueError("Unrecognized XML wrapper " + repr(data[:16]))
              raise ValueError("Exceeded maximum XML recovery steps")

          src = sorted(RAW.glob("*.xml"))
          if not src:
              raise SystemExit("No XML samples restored from V4")

          grouped = defaultdict(dict)
          recover_rows = []
          failures = []
          layer_counts = Counter()

          for path in src:
              match = re.fullmatch(r"\d{6}_(.+)", path.name)
              if not match:
                  failures.append({"source": path.name, "reason": "UNKNOWN_V4_FILENAME"})
                  continue
              file_name = match.group(1)
              is_double = file_name.endswith("_e.xml")
              base_name = file_name[:-6] if is_double else file_name
              variant = "extra_layer" if is_double else "normal"
              original = path.read_bytes()
              try:
                  decoded, root, layers, steps = recover(original)
                  grouped[base_name][variant] = (decoded, root)
                  layer_counts[layers] += 1
                  recover_rows.append({
                      "source": path.name,
                      "xml_name": base_name,
                      "variant": variant,
                      "original_bytes": len(original),
                      "recovered_bytes": len(decoded),
                      "layers": layers,
                      "root": root.tag,
                      "sha256": hashlib.sha256(decoded).hexdigest(),
                      "steps": ",".join(steps)
                  })
              except Exception as exc:
                  failures.append({"source": path.name, "reason": str(exc)})

          write_csv("01_decryption_manifest.csv", [
              "source", "xml_name", "variant", "original_bytes", "recovered_bytes",
              "layers", "root", "sha256", "steps"
          ], recover_rows)
          write_csv("02_decryption_failures.csv", ["source", "reason"], failures)

          pair_rows = []
          primary = {}
          for name, variants in sorted(grouped.items()):
              a = variants.get("normal")
              b = variants.get("extra_layer")
              identical = a is not None and b is not None and a[0] == b[0]
              pair_rows.append({
                  "xml_name": name,
                  "has_normal": bool(a),
                  "has_extra_layer": bool(b),
                  "recovered_bytes_identical": identical,
                  "sha256": hashlib.sha256((a or b)[0]).hexdigest()
              })
              primary[name] = (a or b)[1]
              output_name = XML / name
              if output_name.resolve().parent != XML.resolve():
                  raise ValueError("Invalid output XML name")
              output_name.write_bytes((a or b)[0])

          write_csv("03_pair_verification.csv", [
              "xml_name", "has_normal", "has_extra_layer",
              "recovered_bytes_identical", "sha256"
          ], pair_rows)

          v2_indexes = list((ROOT / "previous/v2").rglob("sprite_id_groups.csv"))
          if len(v2_indexes) != 1:
              raise SystemExit("V2 sprite ID inventory missing or ambiguous")
          with v2_indexes[0].open(encoding="utf-8-sig", newline="") as handle:
              sprite_groups = {
                  int(row["sprite_id"]): int(row["files"])
                  for row in csv.DictReader(handle)
              }

          action_rows = []
          quick_rows = []
          poly_rows = []
          rate_rows = []
          target_rows = []

          actions = primary.get("Actions.xml")
          if actions is not None:
              for node in actions.iter("Action"):
                  action_rows.append(dict(node.attrib))

          quick = primary.get("QMotionInfo.xml")
          if quick is not None:
              for node in quick:
                  quick_rows.append({
                      "tag": node.tag,
                      "id": node.get("id", ""),
                      "name": node.get("name", ""),
                      "action": node.get("action", ""),
                      "icon": node.get("icon", ""),
                      "attributes": json.dumps(node.attrib, ensure_ascii=False)
                  })

          polymorph = primary.get("Polymorphlist2.xml")
          if polymorph is not None:
              for node in polymorph.iter("monster"):
                  poly_rows.append({
                      "id": node.get("id", ""),
                      "level": node.get("level", ""),
                      "action_name": node.get("action", ""),
                      "surf_ui_image": node.get("surf", ""),
                      "desc_text_id": node.get("desc", ""),
                      "classification": "POLYMORPH_MENU_ENTRY_NOT_MONSTER_SPRITE_ID"
                  })

          frame = primary.get("PolyFrameRate.xml")
          if frame is not None:
              frame_block = frame.find("PolyFrameRate")
              if frame_block is not None:
                  for row in frame_block.findall("Frame"):
                      rate_rows.append({
                          "section": "PolyFrameRate",
                          "action_ids": row.get("action", ""),
                          "frame_rates_by_level": row.get("rate", "")
                      })
              exception = frame.find("PolyFrameException")
              if exception is not None:
                  for node in exception.findall("Frame"):
                      rate_rows.append({
                          "section": "PolyFrameException",
                          "action_ids": node.get("action", ""),
                          "frame_rates_by_level": node.get("rate", "")
                      })
                  for node in exception.findall("Sprite"):
                      for text in node.get("target", "").split(","):
                          value = text.strip()
                          if value.isdigit():
                              number = int(value)
                              target_rows.append({
                                  "xml_section": "PolyFrameException",
                                  "sprite_id": number,
                                  "in_v2_sprite_index": number in sprite_groups,
                                  "sprite_files_in_v2": sprite_groups.get(number, 0)
                              })
              targets = frame.find("TargetSprite")
              if targets is not None:
                  for node in targets.findall("Target"):
                      value = (node.text or "").strip()
                      if value.isdigit():
                          number = int(value)
                          target_rows.append({
                              "xml_section": "TargetSprite",
                              "sprite_id": number,
                              "in_v2_sprite_index": number in sprite_groups,
                              "sprite_files_in_v2": sprite_groups.get(number, 0)
                          })

          write_csv("04_action_menu.csv", [
              "action", "category", "control", "icon", "target", "domain"
          ], action_rows)
          write_csv("05_quick_motion_ui.csv", [
              "tag", "id", "name", "action", "icon", "attributes"
          ], quick_rows)
          write_csv("06_polymorph_menu.csv", [
              "id", "level", "action_name", "surf_ui_image", "desc_text_id", "classification"
          ], poly_rows)
          write_csv("07_polymorph_frame_rates.csv", [
              "section", "action_ids", "frame_rates_by_level"
          ], rate_rows)
          write_csv("08_explicit_target_sprite_ids.csv", [
              "xml_section", "sprite_id", "in_v2_sprite_index", "sprite_files_in_v2"
          ], target_rows)

          summary = {
              "phase": "VERIFIED_XML_DECRYPTION_AND_DATA_EXTRACTION",
              "v4_xml_inputs": len(src),
              "valid_decrypted_files": len(recover_rows),
              "failed_decryptions": len(failures),
              "unique_xml_names": len(primary),
              "complete_pairs": sum(r["has_normal"] and r["has_extra_layer"] for r in pair_rows),
              "matching_decrypted_pairs": sum(r["recovered_bytes_identical"] for r in pair_rows),
              "layer_counts": dict(layer_counts),
              "actions_xml_root": actions.tag if actions is not None else None,
              "quickmotion_xml_root": quick.tag if quick is not None else None,
              "polyframe_xml_root": frame.tag if frame is not None else None,
              "action_menu_entries": len(action_rows),
              "quick_motion_entries": len(quick_rows),
              "polymorph_menu_entries": len(poly_rows),
              "frame_rate_rows": len(rate_rows),
              "explicit_target_sprite_rows": len(target_rows),
              "target_sprite_rows_in_v2": sum(x["in_v2_sprite_index"] for x in target_rows),
              "monster_identity_verified": False,
              "monster_attack_frame_order_verified": False
          }
          (OUT / "summary_v8.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8"
          )

          report = [
              "Sanctuary of Aden V8: Verified XML recovery",
              "Decrypted XML files: " + str(len(recover_rows)),
              "Decryption failures: " + str(len(failures)),
              "Verified identical pairs: " + str(summary["matching_decrypted_pairs"]),
              "Unique XML documents: " + str(len(primary)),
              "Polymorph frame-rate rows: " + str(len(rate_rows)),
              "Explicit sprite target rows: " + str(len(target_rows)),
              "Targets matching V2 IDs: " + str(summary["target_sprite_rows_in_v2"]),
              "Actions.xml is an action-menu definition, not verified monster attacks.",
              "QMotionInfo.xml is quick-motion UI data, not verified monster animation.",
              "No sprite-to-monster identity or frame sequence is inferred."
          ]
          (OUT / "REPORT.txt").write_text("\n".join(report) + "\n", encoding="utf-8")

          print("=== V8 SUMMARY ===")
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          for line in report:
              print(line)
          summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_file:
              with open(summary_file, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(report) + "\n")

          if failures:
              raise SystemExit("XML recovery incomplete; check 02_decryption_failures.csv")
          if any(row["has_normal"] and row["has_extra_layer"] and not row["recovered_bytes_identical"] for row in pair_rows):
              raise SystemExit("Recovered XML pair mismatch")
          if actions is None or quick is None or frame is None:
              raise SystemExit("Important recovered XML documents are missing")
          PY

      - name: Upload V8 decrypted XML and motion tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-V8-Recovered-XML-and-Animation-Tables
          path: reports/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
