      - name: "V32 | Validate 492 complete, Lv 0-10 only, correct directions and source SHA"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          from PIL import Image
          root=Path('reports')
          s=json.loads((root/'V32-summary.json').read_text(encoding='utf-8'))
          assert s['version']=='V32' and s['all_monster_rows']==492
          assert s['low_level_rows']==23 and s['all_runtime_map_files']>=40
          assert s['all_runtime_events']>=800
          assert s['source_indexed_spr']==158040
          assert s['source_inventory_actor_ids']>=8233
          assert s['selected_cardinal_spr']>=15000
          assert s['sha_checked_cardinal_spr']==s['selected_cardinal_spr']
          assert s['gif_count']>=1000, 'GIF decoder failed: inspect V32-decoding-errors.csv'
          assert not s['runtime_stats_applied'] and not s['motion_assignment_approved']
          manifest=root/'V32-all-cardinal-gif-manifest.csv'
          assert manifest.is_file() and len(list((root/'gifs').rglob('*.gif')))==s['gif_count']
          html_file=root/'audit-sanctuary-monsters-V32-level-0-10-integrated.html'
          html=html_file.read_text(encoding='utf-8')
          assert len(html.encode('utf-8'))>30000
          assert '상하좌우' not in html or '1' in html
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S)
          assert len(scripts)==1
          Path('/tmp/v32-ui.js').write_text(scripts[0],encoding='utf-8')
          subprocess.run(['node','--check','/tmp/v32-ui.js'],check=True)
          assert 'V32' in html and '0~10' in html
          print('V32_FULL_AUDIT_OK',s)
          PY
          cat reports/V32-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: "V32 | Upload full monster data, source GIF library and Lv 0-10 HTML"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-sanctuary-monsters-v32-all-monsters-level-0-10
          path: reports/
          retention-days: 30
          if-no-files-found: warn
          compression-level: 0
