
name: "audit-sanctuary-monsters.yml | V30 | 61CE Physical Motion ID and Bank Review"
run-name: "audit-sanctuary-monsters.yml | V30 | Sanctuary Source 4-Dir Multi-Bank Audit"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/audit-sanctuary-monsters.yml"]

permissions:
  contents: read
  actions: read

jobs:
  v30-five-motion-review:
    name: "V30 | Verify V29 1144 GIFs and review five motions"
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: "V30 | Download V29 preserved original SPR bank GIFs"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          mkdir -p v29 reports
          gh run download 39203575145 -R "$GITHUB_REPOSITORY" \
            -n audit-sanctuary-monsters-v29-physical-review-61CE -D v29
          test -s v29/V29-summary.json
          test -s v29/V29-bank-manifest.json
          test -s v29/V29-ce-candidates.json
          test -d v29/gifs

      - name: "V30 | Source SHA verification and four-direction five-motion workstation"
        run: |
          set -euo pipefail
          cat > /tmp/v30_generator.py <<'PY'
          #!/usr/bin/env python3
          """V30 - V29 source-only five-motion classification workstation.
          Does not alter SPR/CE mapping or apply actions to a game.
          """
          import base64
          import csv
          import hashlib
          import json
          import shutil
          from collections import defaultdict
          from pathlib import Path

          SRC = Path('v29')
          OUT = Path('reports')
          OUT.mkdir(exist_ok=True)
          read = lambda name: json.loads((SRC / name).read_text('utf-8'))
          summary = read('V29-summary.json')
          assert (summary['version'], summary['total_ce'], summary['v28_ce_mapped'], summary['unresolved_ce'], summary['preserved_ce']) == ('V29', 61, 46, 14, 1)
          old = read('V29-ce-candidates.json')
          audit = read('V29-bank-manifest.json')
          assert len(old['roster']) == 61
          valid = [x for x in audit['audits'] if 'gif_sha256' in x]
          assert len(valid) == summary['source_banks_verified_hashes'] == 1144
          assert all(x['bank'] in (0,8,16,24,32,40,48,56) and x['dir'] in (0,2,4,6) for x in valid)

          banks = defaultdict(lambda: defaultdict(dict))
          for x in valid:
              actor, bank, direction = (int(x[k]) for k in ('actor', 'bank', 'dir'))
              rel = Path('gifs') / str(actor) / f'{actor}-bank{bank}-dir{direction}.gif'
              raw = (SRC / rel).read_bytes()
              assert hashlib.sha256(raw).hexdigest() == x['gif_sha256'], f'V29 GIF mismatch: {rel}'
              banks[str(actor)][str(bank)][str(direction)] = {'file':str(rel),'frames':x['frames'],'sha256':x['gif_sha256']}
          shutil.copytree(SRC/'gifs', OUT/'gifs', dirs_exist_ok=True)

          rows=[]
          for r in old['roster']:
              ce = int(r['ce'])
              originals={}
              for direction,payload in r['single'].items():
                  raw=base64.b64decode(payload,validate=True)
                  assert raw[:6] in (b'GIF89a',b'GIF87a')
                  path=Path('single')/f'{ce}-dir{direction}.gif'
                  (OUT/'single').mkdir(exist_ok=True)
                  (OUT/path).write_bytes(raw)
                  originals[direction]=str(path)
              rows.append({'ce':ce,'name':r['name'],'game_graphic':r['game_graphic'],
                           'actor':r['actor'],'candidates':r['candidates'],'protected':r['protected'],
                           'note':r['warning'],'originals':originals,
                           'identity_approved':False,'motion_bank_approved':bool(r['protected'])})
          assert sum(x['actor'] is None for x in rows)==14
          assert sum(x['actor'] is not None and not x['protected'] for x in rows)==46
          assert sum(bool(x['protected']) for x in rows)==1

          view={'version':'V30','source_run':39203575145,'review_only':True,'game_modified':False,
                'motion_labels':['wait','walk','attack','hit','death','other','unknown'],
                'rows':rows,'names':old['names'],'banks':banks}
          (OUT/'V30-source-review.json').write_text(json.dumps(view,ensure_ascii=False,separators=(',',':')),'utf-8')
          with (OUT/'V30-source-frame-matrix.csv').open('w',encoding='utf-8-sig',newline='') as f:
              writer=csv.writer(f)
              writer.writerow(['SPR_ID','bank','dir','frames','SHA256','role','role_approved'])
              for actor in sorted(banks,key=int):
                  for bank in sorted(banks[actor],key=int):
                      for direction in sorted(banks[actor][bank],key=int):
                          x=banks[actor][bank][direction]
                          writer.writerow([actor,bank,direction,x['frames'],x['sha256'],'UNCLASSIFIED','NO'])

          HTML = r'''<!doctype html><html lang="ko"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>audit-sanctuary-monsters.yml | V30 | 61CE Physical Motion ID and Bank Review</title>
          <style>
          :root{font-family:system-ui,'Malgun Gothic',sans-serif;color-scheme:dark;color:#e9f2fd;background:#101b27}
          *{box-sizing:border-box}body{max-width:1260px;margin:auto;padding:15px}h1{font-size:1.3rem}h2{font-size:1rem}
          p{line-height:1.6}.muted{color:#adc1d5;font-size:.86rem}.warn{color:#ffd1a0}
          .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#172b3d;padding:12px;border-radius:8px;position:sticky;top:0;z-index:5}
          input,select,button{background:#24394d;color:#fff;border:1px solid #55728a;padding:9px;border-radius:6px;max-width:100%}
          button{cursor:pointer}button:disabled{opacity:.45}input{flex:1;min-width:130px}label{font-size:.82rem}
          article{background:#172736;border:1px solid #3f5870;border-radius:8px;padding:11px;margin-top:12px}
          .dirs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.frame{background:#0b1722;padding:4px;border-radius:5px;text-align:center;font-size:.75rem;min-width:0}
          .frame img{display:block;margin:auto;max-width:100%;height:100px;object-fit:contain;image-rendering:pixelated}
          .frame.none{padding-top:35px}.bank-head{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:8px}
          .bank-row{display:flex;gap:8px;flex-wrap:wrap}.bank{flex:1 1 295px;min-width:0}
          .heading{border-bottom:1px solid #405a70;padding-bottom:8px}.badge{font-size:.78rem;background:#2c4a61;padding:4px 9px;border-radius:5px}
          @media(max-width:480px){.dirs{grid-template-columns:repeat(2,minmax(0,1fr))}.frame img{height:78px}.toolbar{position:static}}
          </style></head><body>
          <header><h1>audit-sanctuary-monsters.yml | V30 | 생추어리 동작 확인</h1>
          <p>V29에서 해시 검증한 원본 SPR GIF 1,144개를 그대로 표시합니다. 61CE 중 46CE 기존 연결, 14CE 미확정, 성공본 1CE 보호. <strong>뱅크 번호는 동작 이름이 아닙니다.</strong> 대기·이동·공격·피격·사망 분류는 사람이 확인해야 합니다.</p>
          <p class="muted">원본 싱글리니지 외형과 생추어리 4방향 GIF를 대조합니다. 아래 선택 결과는 검토 JSON으로만 내려받으며 게임·CE 연결·성공본을 변경하지 않습니다. ZIP 압축을 푼 뒤 HTML을 실행하세요.</p></header>
          <div class="toolbar"><input id="query" placeholder="CE·몬스터명 검색"><select id="filter"><option value="all">전체 61CE</option><option value="pending">미확정 14CE</option><option value="mapped">기존 연결 46CE</option><option value="protected">성공본 보호 1CE</option></select>
          <select id="ce" aria-label="몬스터 선택"></select><button id="export">검토 선택 JSON 내보내기</button></div>
          <main><article><div class="heading"><h2 id="name"></h2><div class="muted" id="detail"></div><div class="warn" id="warning"></div></div>
          <p><label>검토 SPR <select id="actor" aria-label="검토할 원본 SPR"></select></label> <span class="muted" id="candidate"></span></p>
          <h2>싱글리니지 기존 외형 (참고용)</h2><div id="original" class="dirs"></div></article>
          <article><h2>원본 SPR 동작 뱅크 · 4방향 개별 표시</h2>
          <p class="muted">각 뱅크의 움직임을 확인한 후 해당하는 동작을 지정하세요. 부정확하거나 중복된 동작은 '미확정'으로 두세요. 보호 성공본에는 선택값을 저장하지 않습니다.</p>
          <div id="banks" class="bank-row"></div></article></main>
          <script id="dataset" type="application/json">__DATA__</script><script>
          'use strict';
          const DATA=JSON.parse(document.getElementById('dataset').textContent);
          const $=x=>document.getElementById(x);
          const all=DATA.rows;
          const roles=[['unknown','미확정'],['wait','대기'],['walk','이동'],['attack','공격'],['hit','피격'],['death','사망'],['other','기타/마법']];
          const choices={}; const actorSelections={}; let current=[];
          const dirLabel=['0','2','4','6'];
          const origLabel=['0','1','2','3'];
          function loadSaved(){try{const s=JSON.parse(localStorage.getItem('sanctuary_v30_review')||'{}');if(s&&typeof s==='object')Object.assign(choices,s);const a=JSON.parse(localStorage.getItem('sanctuary_v30_actor')||'{}');if(a&&typeof a==='object')Object.assign(actorSelections,a)}catch(e){}}
          function save(){try{localStorage.setItem('sanctuary_v30_review',JSON.stringify(choices));localStorage.setItem('sanctuary_v30_actor',JSON.stringify(actorSelections))}catch(e){}}
          function matches(r){const f=$('filter').value;return (f==='all'||(f==='pending'&&r.actor===null)||(f==='mapped'&&r.actor!==null&&!r.protected)||(f==='protected'&&r.protected))&&(r.ce+' '+r.name+' '+(r.actor??'')).toLowerCase().includes($('query').value.toLowerCase().trim())}
          function fillList(){const keep=$('ce').value;current=all.filter(matches);$('ce').replaceChildren();current.forEach(r=>{const o=new Option('CE '+r.ce+' · '+r.name,r.ce);$('ce').append(o)});if(current.some(r=>String(r.ce)===keep))$('ce').value=keep;draw()}
          function media(container,directions,original){container.replaceChildren();(original?origLabel:dirLabel).forEach((d,i)=>{const cell=document.createElement('div');cell.className='frame';
          const rec=directions?.[d];const title=document.createElement('div');title.textContent=(original?['↑','→','↓','←'][i]:'원본 방향 '+d)+(rec?.frames?' · '+rec.frames+'프레임':'');cell.append(title);
          const src=original?rec:rec?.file;if(src){const im=document.createElement('img');im.loading='lazy';im.src=src;im.alt=title.textContent;cell.append(im)}else{cell.classList.add('none');cell.append('없음')}container.append(cell)})}
          function draw(){const r=all.find(x=>String(x.ce)===$('ce').value);$('banks').replaceChildren();$('original').replaceChildren();$('actor').replaceChildren();
          if(!r){$('name').textContent='검색 결과 없음';$('detail').textContent='';$('warning').textContent='';$('candidate').textContent='';return}
          $('name').textContent='CE '+r.ce+' | '+r.name+' | '+(r.protected?'성공본 보호':r.actor===null?'SPR 미확정':'기존 SPR '+r.actor);
          $('detail').textContent='게임 그래픽: '+(r.game_graphic||'기록 없음')+' / V29 기반 대조';$('warning').textContent=r.note||'';
          media($('original'),r.originals,true);
          const ids=[r.actor,...r.candidates].filter((v,i,a)=>v!==null&&a.indexOf(v)===i);
          if(!ids.length){$('actor').append(new Option('원본 SPR 후보 없음',''));$('actor').disabled=true}else{$('actor').disabled=false;ids.forEach(n=>$('actor').append(new Option('SPR '+n+(n===r.actor?' (V28 연결)':' (미확정 후보)'),n)))}
          const saved=actorSelections[r.ce];if(saved&&ids.map(String).includes(String(saved)))$('actor').value=String(saved);
          $('candidate').textContent=r.protected?'기존 성공본에 대한 변경 금지':r.actor===null?'이름 기반 후보는 몬스터 동일성을 보증하지 않음':'외형·동작 연결 최종 미승인';showBanks()}
          function showBanks(){const r=all.find(x=>String(x.ce)===$('ce').value);if(!r)return;const actor=$('actor').value;const root=$('banks');root.replaceChildren();
          const dat=DATA.banks[actor]||{};const bkeys=Object.keys(dat).sort((a,b)=>Number(a)-Number(b));
          if(!bkeys.length){root.textContent='이 SPR에 대한 추출 동작이 없습니다.';return}
          for(const b of bkeys){const box=document.createElement('section');box.className='bank';box.innerHTML='<div class="bank-head"><strong>뱅크 '+b+'</strong></div>';
          const h=box.querySelector('.bank-head');const select=document.createElement('select');select.ariaLabel='뱅크 '+b+' 동작 분류';const key=actor+'-'+b;roles.forEach(([v,label])=>select.append(new Option(label,v)));
          select.value=choices[key]||'unknown';select.disabled=r.protected;select.onchange=()=>{choices[key]=select.value;save()};h.append(select);
          const dirs=document.createElement('div');dirs.className='dirs';media(dirs,dat[b],false);box.append(dirs);root.append(box)}}
          $('query').addEventListener('input',fillList);$('filter').addEventListener('change',fillList);$('ce').addEventListener('change',draw);$('actor').addEventListener('change',()=>{const r=all.find(x=>String(x.ce)===$('ce').value);if(r&&!r.protected&&$('actor').value){actorSelections[r.ce]=$('actor').value;save()}showBanks()});
          $('export').addEventListener('click',()=>{
          const out={version:'V30',source_run:DATA.source_run,review_only:true,game_modified:false,identity_approved:false,motion_bank_approved:false,
            note:'사람의 검토 선택. 몬스터 동일성·게임 적용 승인 아님.',identity_candidates:[],assignments:[]};
          for(const [ce,v] of Object.entries(actorSelections)){const r=all.find(x=>String(x.ce)===ce);if(r&&r.actor===null&&r.candidates.map(String).includes(String(v)))out.identity_candidates.push({ce:Number(ce),proposed_actor:Number(v),identity_approved:false,applied:false})}
          for(const [k,v] of Object.entries(choices)){if(v==='unknown')continue;const [actor,bank]=k.split('-').map(Number);if(!all.some(r=>r.protected&&r.actor===actor))out.assignments.push({actor,bank,proposed_role:v,approved:false,applied:false})}
          const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='V30-motion-review-selections.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});
          loadSaved();fillList();
          </script></body></html>'''
          payload=json.dumps(view,ensure_ascii=False,separators=(',',':')).replace('<','\\u003c')
          html=HTML.replace('__DATA__',payload)
          (OUT/'V30-61CE-FiveMotionReview.html').write_text(html,encoding='utf-8')
          review={'version':'V30','source_run':39203575145,'total_ce':len(rows),'v29_verified_gifs':len(valid),
                  'v29_mapped_ce':46,'unresolved_ce':14,'protected_ce':1,'source_actor_count':len(banks),
                  'no_auto_action_assignment':True,'game_modified':False}
          (OUT/'V30-summary.json').write_text(json.dumps(review,ensure_ascii=False,indent=2),'utf-8')
          print('V30_REVIEW',json.dumps(review,ensure_ascii=False))
          PY
          python3 /tmp/v30_generator.py

      - name: "V30 | Validate classification interface, exact source counts and read-only output"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          p=Path('reports')
          s=json.loads((p/'V30-summary.json').read_text('utf-8'))
          assert s['version']=='V30' and s['total_ce']==61
          assert s['v29_verified_gifs']==1144 and s['source_actor_count']==48
          assert s['v29_mapped_ce']==46 and s['unresolved_ce']==14 and s['protected_ce']==1
          assert s['no_auto_action_assignment'] and not s['game_modified']
          html=(p/'V30-61CE-FiveMotionReview.html').read_text('utf-8')
          assert len(html.encode('utf-8'))<500_000, 'HTML must not embed the GIF library'
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S)
          assert len(scripts)==1
          Path('/tmp/v30_ui.js').write_text(scripts[0],encoding='utf-8')
          subprocess.run(['node','--check','/tmp/v30_ui.js'],check=True)
          assert len(list((p/'gifs').rglob('*.gif')))==1144
          print('V30_VALIDATED',json.dumps(s,ensure_ascii=False))
          PY
          cat reports/V30-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: "V30 | Upload original 4-direction GIFs and motion classification review"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-sanctuary-monsters-v30-five-motion-review-61CE
          path: reports/
          retention-days: 90
          if-no-files-found: warn
