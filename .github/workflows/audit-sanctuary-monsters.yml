
name: Sanctuary of Aden Animation Loader Audit V5

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/audit-sanctuary-monsters.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: sanctuary-monster-audit
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Prepare environment
        shell: bash
        run: |
          set -euo pipefail

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc

          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full

          mkdir -p \
            previous/v4 \
            downloads \
            client \
            reports

          df -h .

      - name: Restore verified V4 binary evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh run download 38828891785 \
            --repo "$GITHUB_REPOSITORY" \
            --name Sanctuary-V4-Binary-Animation-Analysis \
            --dir previous/v4

          test -n "$(
            find previous/v4/raw \
              -name '*_Actions.xml' \
              -print -quit
          )"

          test -n "$(
            find previous/v4/raw \
              -name '*_QMotionInfo.xml' \
              -print -quit
          )"

          echo "V4 ORIGINAL BINARY DATA RESTORED"

      - name: Download original 46 client parts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release download v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Sanctuary.of.Aden.-.Copy.*" \
            --dir downloads

          python3 - <<'PY'
          from pathlib import Path

          root = Path("downloads")
          base = "Sanctuary.of.Aden.-.Copy"

          expected = [
              f"{base}.z{i:02d}"
              for i in range(1, 46)
          ] + [f"{base}.zip"]

          missing = [
              name for name in expected
              if not (root / name).is_file()
          ]

          if missing:
              raise SystemExit(
                  f"Missing archive parts: {missing}"
              )

          print("VERIFIED PARTS:", len(expected))
          print("TOTAL BYTES:", sum(
              (root / name).stat().st_size
              for name in expected
          ))
          PY

      - name: Extract original game client
        shell: bash
        run: |
          set -euo pipefail

          7z x \
            "downloads/Sanctuary.of.Aden.-.Copy.zip" \
            "-o${PWD}/client" \
            -y > reports/extraction.log 2>&1

          rm -rf downloads

          echo "EXTRACTED FILE COUNT:"
          find client -type f | wc -l

          df -h .

      - name: Trace XML decoder and animation loader
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import csv
          import hashlib
          import json
          import math
          import os
          import re
          import struct

          from collections import Counter
          from pathlib import Path

          ROOT = Path.cwd()
          CLIENT = ROOT / "client"
          V4 = ROOT / "previous/v4/raw"
          REPORT = ROOT / "reports"

          REPORT.mkdir(exist_ok=True)

          MAX_BINARY = 150 * 1024 * 1024
          MAX_FILE_HITS = 700
          MAX_TOTAL_HITS = 30000

          IMPORTANT_FILES = (
              "Actions.xml",
              "QMotionInfo.xml"
          )

          EXEC_EXTENSIONS = {
              ".exe", ".dll", ".ocx",
              ".pyd", ".so", ".sys"
          }

          SCRIPT_EXTENSIONS = {
              ".py", ".js", ".lua",
              ".cs", ".rb", ".ini"
          }

          REFERENCE_PATTERN = re.compile(
              r"X\?xm|"
              r"QMotionInfo|Actions\.xml|"
              r"Tile\.pak|Sprite[^ ]*\.pak|"
              r"sprite|animation|animate|"
              r"motion|action|"
              r"decrypt|encrypt|"
              r"decode|decryptor|"
              r"CryptDecrypt|CryptEncrypt|"
              r"BCryptDecrypt|BCryptEncrypt|"
              r"CryptAcquireContext|"
              r"RtlDecompressBuffer|"
              r"RC4|AES|Rijndael|"
              r"inflate|deflate|"
              r"zlib|LZ4|LZMA|"
              r"QMotion",
              re.I
          )

          ASCII_PATTERN = re.compile(
              rb"[\x20-\x7e]{5,220}"
          )

          WIDE_PATTERN = re.compile(
              rb"(?:[\x20-\x7e]\x00){5,220}"
          )

          def csv_write(name, rows, fields):
              with (REPORT / name).open(
                  "w",
                  encoding="utf-8-sig",
                  newline=""
              ) as f:
                  writer = csv.DictWriter(
                      f,
                      fieldnames=fields,
                      extrasaction="ignore"
                  )
                  writer.writeheader()
                  writer.writerows(rows)

          def sha256(data):
              return hashlib.sha256(
                  data
              ).hexdigest()

          def entropy(data):
              sample = data[:65536]

              if not sample:
                  return 0.0

              counts = Counter(sample)
              total = len(sample)

              return -sum(
                  (n / total)
                  * math.log2(n / total)
                  for n in counts.values()
              )

          # --------------------------------------------
          # Part 1: Verify known encoded XML originals
          # --------------------------------------------

          raw_results = {}
          xml_rows = []

          for filename in IMPORTANT_FILES:
              paths = sorted(
                  V4.glob("*_" + filename)
              )

              if len(paths) != 1:
                  raise SystemExit(
                      f"Expected one original: {filename}. "
                      f"Found {len(paths)}"
                  )

              path = paths[0]
              data = path.read_bytes()

              raw_results[filename] = data

              xml_rows.append({
                  "file": filename,
                  "bytes": len(data),
                  "first_4_hex": data[:4].hex(" "),
                  "first_4_ascii": data[:4].decode(
                      "ascii", errors="replace"
                  ),
                  "first_64_hex": data[:64].hex(" "),
                  "sha256": sha256(data),
                  "entropy": round(entropy(data), 5),
                  "starts_X_question_xm": (
                      data.startswith(b"X?xm")
                  ),
                  "starts_standard_xml": (
                      data.startswith(b"<?xm")
                  ),
                  "payload_mod_16": (
                      (len(data) - 4) % 16
                  )
              })

          csv_write(
              "01_encoded_xml_fingerprints.csv",
              xml_rows,
              [
                  "file", "bytes",
                  "first_4_hex", "first_4_ascii",
                  "first_64_hex", "sha256",
                  "entropy",
                  "starts_X_question_xm",
                  "starts_standard_xml",
                  "payload_mod_16"
              ]
          )

          a = raw_results["Actions.xml"]
          b = raw_results["QMotionInfo.xml"]

          common_prefix = 0

          for left, right in zip(a, b):
              if left != right:
                  break

              common_prefix += 1

          # --------------------------------------------
          # Part 2: Find actual client loaders and DLLs
          # --------------------------------------------

          binaries = sorted(
              [
                  p for p in CLIENT.rglob("*")
                  if (
                      p.is_file()
                      and not p.is_symlink()
                      and p.suffix.lower()
                      in EXEC_EXTENSIONS
                  )
              ],
              key=lambda p: str(p).lower()
          )

          scripts = sorted(
              [
                  p for p in CLIENT.rglob("*")
                  if (
                      p.is_file()
                      and not p.is_symlink()
                      and p.suffix.lower()
                      in SCRIPT_EXTENSIONS
                  )
              ],
              key=lambda p: str(p).lower()
          )

          scan_files = binaries + scripts

          binary_inventory = []
          string_hits = []
          magic_hits = []

          total_scanned = 0
          skipped_large = 0

          def pe_machine(data):
              if len(data) < 64:
                  return ""

              if data[:2] != b"MZ":
                  return ""

              offset = struct.unpack_from(
                  "<I", data, 0x3C
              )[0]

              if offset + 6 > len(data):
                  return "INVALID_PE_HEADER"

              if data[offset:offset + 4] != b"PE\x00\x00":
                  return "MZ_WITHOUT_PE"

              machine = struct.unpack_from(
                  "<H", data, offset + 4
              )[0]

              return {
                  0x014c: "x86",
                  0x8664: "x64",
                  0x01c0: "ARM",
                  0xaa64: "ARM64"
              }.get(machine, f"UNKNOWN_{machine:04X}")

          for path in scan_files:
              relative = str(
                  path.relative_to(CLIENT)
              ).replace("\\", "/")

              size = path.stat().st_size

              if size == 0 or size > MAX_BINARY:
                  skipped_large += 1

                  binary_inventory.append({
                      "file": relative,
                      "bytes": size,
                      "status": "SKIPPED_SIZE",
                      "pe_architecture": "",
                      "sha256": "",
                      "reference_hits": 0,
                      "magic_hits": 0
                  })

                  continue

              data = path.read_bytes()
              total_scanned += 1

              local_hits = 0

              # Search exact encoded XML signature in code.
              position = 0
              local_magic = 0

              while True:
                  position = data.find(
                      b"X?xm", position
                  )

                  if position < 0:
                      break

                  local_magic += 1

                  magic_hits.append({
                      "file": relative,
                      "offset": position,
                      "signature": "X?xm"
                  })

                  position += 4

              # Search plain ASCII and UTF-16LE strings.
              for encoding, pattern in (
                  ("ascii", ASCII_PATTERN),
                  ("utf16le", WIDE_PATTERN)
              ):
                  for match in pattern.finditer(data):
                      if (
                          local_hits >= MAX_FILE_HITS
                          or len(string_hits)
                          >= MAX_TOTAL_HITS
                      ):
                          break

                      raw = match.group()

                      if encoding == "utf16le":
                          decoded = raw[::2].decode(
                              "ascii", errors="replace"
                          )
                      else:
                          decoded = raw.decode(
                              "ascii", errors="replace"
                          )

                      found = REFERENCE_PATTERN.search(
                          decoded
                      )

                      if not found:
                          continue

                      string_hits.append({
                          "file": relative,
                          "offset": match.start(),
                          "encoding": encoding,
                          "matched_keyword": found.group(),
                          "string": decoded[:220]
                      })

                      local_hits += 1

              binary_inventory.append({
                  "file": relative,
                  "bytes": size,
                  "status": "SCANNED",
                  "pe_architecture": pe_machine(data),
                  "sha256": sha256(data),
                  "reference_hits": local_hits,
                  "magic_hits": local_magic
              })

              del data

          csv_write(
              "02_client_loader_inventory.csv",
              binary_inventory,
              [
                  "file", "bytes", "status",
                  "pe_architecture", "sha256",
                  "reference_hits", "magic_hits"
              ]
          )

          csv_write(
              "03_loader_string_references.csv",
              string_hits,
              [
                  "file", "offset", "encoding",
                  "matched_keyword", "string"
              ]
          )

          csv_write(
              "04_encoded_xml_magic_references.csv",
              magic_hits,
              [
                  "file", "offset", "signature"
              ]
          )

          # --------------------------------------------
          # Part 3: Prioritize real evidence
          # --------------------------------------------

          STRONG_MARKERS = re.compile(
              r"X\?xm|QMotionInfo|Actions\.xml|"
              r"CryptDecrypt|BCryptDecrypt|"
              r"CryptEncrypt|BCryptEncrypt|"
              r"RtlDecompressBuffer",
              re.I
          )

          strong_hits = [
              row for row in string_hits
              if STRONG_MARKERS.search(
                  row["string"]
              )
          ]

          csv_write(
              "05_high_priority_loader_evidence.csv",
              strong_hits,
              [
                  "file", "offset", "encoding",
                  "matched_keyword", "string"
              ]
          )

          file_hit_counts = Counter(
              row["file"] for row in string_hits
          )

          ranked_files = sorted(
              binary_inventory,
              key=lambda row: (
                  -sum(
                      x["file"] == row["file"]
                      for x in strong_hits
                  ),
                  -row["reference_hits"],
                  row["file"]
              )
          )

          csv_write(
              "06_priority_binary_targets.csv",
              [
                  {
                      "file": row["file"],
                      "reference_hits": (
                          file_hit_counts[row["file"]]
                      ),
                      "strong_hits": sum(
                          x["file"] == row["file"]
                          for x in strong_hits
                      ),
                      "magic_hits": row["magic_hits"],
                      "bytes": row["bytes"],
                      "pe_architecture": (
                          row["pe_architecture"]
                      )
                  }
                  for row in ranked_files
              ],
              [
                  "file", "reference_hits",
                  "strong_hits", "magic_hits",
                  "bytes", "pe_architecture"
              ]
          )

          # --------------------------------------------
          # Part 4: Final results and next investigation
          # --------------------------------------------

          summary = {
              "phase": "STATIC_ANIMATION_LOADER_ANALYSIS",
              "v4_run_id": 38828891785,
              "original_xml_files_verified": len(
                  raw_results
              ),
              "shared_xml_prefix_bytes": common_prefix,
              "both_have_X_question_xm": all(
                  row["starts_X_question_xm"]
                  for row in xml_rows
              ),
              "client_executables_and_libraries": len(
                  binaries
              ),
              "script_candidates": len(scripts),
              "files_scanned": total_scanned,
              "files_skipped_due_to_size": skipped_large,
              "total_reference_hits": len(string_hits),
              "high_priority_string_hits": len(
                  strong_hits
              ),
              "encoded_header_occurrences": len(
                  magic_hits
              ),
              "candidate_loader_files": len({
                  row["file"]
                  for row in strong_hits
              }),
              "decoder_algorithm_verified": False,
              "monster_identity_verified": False,
              "animation_sequences_verified": False
          }

          (REPORT / "07_summary_v5.json").write_text(
              json.dumps(
                  summary,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          report_lines = [
              "# Sanctuary of Aden V5 Loader Analysis",
              "",
              "## Binary XML evidence",
              "",
              f"Shared header bytes: {common_prefix}",
              f"EXE/DLL candidates: {len(binaries)}",
              f"Scripts: {len(scripts)}",
              f"Scanned files: {total_scanned}",
              f"Matching strings: {len(string_hits)}",
              f"Strong references: {len(strong_hits)}",
              f"Encoded header occurrences: {len(magic_hits)}",
              "",
              "## Interpretation",
              "",
              "X?xm is an observed signature,",
              "not yet a confirmed encryption algorithm.",
              "",
              "Static strings are investigative evidence.",
              "They do not prove that a function is called.",
              "",
              "No client executable was run.",
              "No unknown decryption key was assumed.",
              "Monster identity remains unverified.",
              "Animation frame order remains unverified.",
              "",
              "## Next step",
              "",
              "Examine strong references and related PE code.",
              "Verify the file loader and decoding algorithm.",
              "Only then parse actual actor and motion data."
          ]

          (REPORT / "REPORT.md").write_text(
              "\n".join(report_lines),
              encoding="utf-8"
          )

          print("=== V5 SUMMARY ===")
          print(json.dumps(
              summary,
              ensure_ascii=False,
              indent=2
          ))

          print("=== ENCODED XML HEADERS ===")
          for row in xml_rows:
              print(json.dumps(
                  row, ensure_ascii=False
              ))

          print("=== HIGH PRIORITY REFERENCES ===")
          for row in strong_hits[:100]:
              print(json.dumps(
                  row, ensure_ascii=False
              ))

          print("=== FIRST 40 CANDIDATE FILES ===")
          for row in ranked_files[:40]:
              print(json.dumps(
                  row, ensure_ascii=False
              ))

          if "GITHUB_STEP_SUMMARY" in os.environ:
              with open(
                  os.environ["GITHUB_STEP_SUMMARY"],
                  "a", encoding="utf-8"
              ) as f:
                  f.write("\n".join(report_lines))

          if len(raw_results) != 2:
              raise SystemExit(
                  "Missing required original XML samples"
              )

          if total_scanned == 0:
              raise SystemExit(
                  "No client executable or script inspected"
              )

          PY

      - name: Upload V5 loader analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-V5-Animation-Loader-Evidence
          path: reports/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
