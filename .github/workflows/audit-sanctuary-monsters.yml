
name: Sanctuary of Aden XML Loader Investigation V7

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/audit-sanctuary-monsters.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: sanctuary-monster-audit
  cancel-in-progress: false

jobs:
  investigate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Prepare environment
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          mkdir -p downloads client previous/v4
          mkdir -p reports/samples reports/contexts
          df -h .

      - name: Restore V4 verified XML originals
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 38828891785 \
            --repo "$GITHUB_REPOSITORY" \
            --name Sanctuary-V4-Binary-Animation-Analysis \
            --dir previous/v4
          test -d previous/v4/raw
          echo "V4 ORIGINALS RESTORED"

      - name: Download original client archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Sanctuary.of.Aden.-.Copy.*" \
            --dir downloads

          python3 - <<'PY'
          from pathlib import Path

          root = Path("downloads")
          base = "Sanctuary.of.Aden.-.Copy"

          names = [
              f"{base}.z{i:02d}"
              for i in range(1, 46)
          ]
          names.append(f"{base}.zip")

          missing = [
              name for name in names
              if not (root / name).is_file()
          ]

          if missing:
              raise SystemExit(
                  "Missing archive parts: " + repr(missing)
              )

          print("VERIFIED PARTS:", len(names))
          PY

      - name: Extract original client
        shell: bash
        run: |
          set -euo pipefail
          7z x \
            "downloads/Sanctuary.of.Aden.-.Copy.zip" \
            "-o${PWD}/client" \
            -y > reports/extraction.log 2>&1
          rm -rf downloads
          echo "CLIENT EXTRACTED"
          df -h .

      - name: Investigate X question xm loader signatures
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import csv
          import hashlib
          import json
          import os
          import shutil
          import struct

          from pathlib import Path

          ROOT = Path.cwd()
          CLIENT = ROOT / "client"
          V4 = ROOT / "previous/v4/raw"
          REPORT = ROOT / "reports"
          SAMPLES = REPORT / "samples"
          CONTEXT = REPORT / "contexts"

          SAMPLES.mkdir(parents=True, exist_ok=True)
          CONTEXT.mkdir(parents=True, exist_ok=True)

          MAGIC = b"X?xm"

          EXPECTED_XML = {
              "Actions.xml":
                  "b79e4058e0b6e27111fd469bf0249ec1321da7d3f55c5009d42fb0369edec27f",
              "QMotionInfo.xml":
                  "5672c352dfcca91f2cad57bcaceb273aafdc9a80fd97118bc9ac996c7e4913f2"
          }

          EXPECTED_DLL_SHA = (
              "34f438999d3415e1f0b63e204ea180"
              "7a223e3dafea9199137d44f55b77cc22ab"
          )

          def digest(data):
              return hashlib.sha256(data).hexdigest()

          def save_csv(filename, rows, fields):
              with (REPORT / filename).open(
                  "w",
                  encoding="utf-8-sig",
                  newline=""
              ) as f:
                  writer = csv.DictWriter(
                      f,
                      fieldnames=fields,
                      extrasaction="ignore"
                  )
                  writer.writeheader()
                  writer.writerows(rows)

          def occurrences(data, token):
              result = []
              start = 0

              while True:
                  offset = data.find(token, start)

                  if offset < 0:
                      break

                  result.append(offset)
                  start = offset + 1

              return result

          def get_sections(data):
              if len(data) < 64 or data[:2] != b"MZ":
                  raise ValueError("Not an MZ executable")

              pe_offset = struct.unpack_from(
                  "<I", data, 0x3c
              )[0]

              if pe_offset + 24 > len(data):
                  raise ValueError("Invalid PE offset")

              if data[
                  pe_offset:pe_offset + 4
              ] != b"PE\x00\x00":
                  raise ValueError("Missing PE signature")

              section_count = struct.unpack_from(
                  "<H", data, pe_offset + 6
              )[0]

              optional_size = struct.unpack_from(
                  "<H", data, pe_offset + 20
              )[0]

              optional_offset = pe_offset + 24

              optional_magic = struct.unpack_from(
                  "<H", data, optional_offset
              )[0]

              if optional_magic == 0x10b:
                  pointer_size = 4
                  image_base = struct.unpack_from(
                      "<I", data, optional_offset + 28
                  )[0]
              elif optional_magic == 0x20b:
                  pointer_size = 8
                  image_base = struct.unpack_from(
                      "<Q", data, optional_offset + 24
                  )[0]
              else:
                  raise ValueError(
                      "Unsupported PE optional header"
                  )

              section_table = (
                  optional_offset + optional_size
              )

              sections = []

              for i in range(section_count):
                  pos = section_table + i * 40

                  if pos + 40 > len(data):
                      raise ValueError(
                          "Truncated PE section table"
                      )

                  name = data[
                      pos:pos + 8
                  ].split(b"\x00")[0].decode(
                      "ascii", errors="replace"
                  )

                  rva = struct.unpack_from(
                      "<I", data, pos + 12
                  )[0]

                  raw_size = struct.unpack_from(
                      "<I", data, pos + 16
                  )[0]

                  raw_offset = struct.unpack_from(
                      "<I", data, pos + 20
                  )[0]

                  flags = struct.unpack_from(
                      "<I", data, pos + 36
                  )[0]

                  sections.append({
                      "name": name,
                      "rva": rva,
                      "raw_offset": raw_offset,
                      "raw_size": raw_size,
                      "flags": flags
                  })

              return image_base, pointer_size, sections

          def locate_offset(offset, sections):
              for section in sections:
                  begin = section["raw_offset"]
                  end = begin + section["raw_size"]

                  if begin <= offset < end:
                      rva = (
                          section["rva"]
                          + offset - begin
                      )

                      return section["name"], rva

              return "UNMAPPED", None

          def context_dump(data, offset, radius=128):
              start = max(0, offset - radius)
              end = min(len(data), offset + radius)

              chunk = data[start:end]

              return {
                  "start": start,
                  "end": end,
                  "hex": chunk.hex(" "),
                  "ascii": "".join(
                      chr(x) if 32 <= x <= 126 else "."
                      for x in chunk
                  )
              }

          # -------------------------------------------
          # Confirm encoded originals from V4
          # -------------------------------------------

          xml_rows = []

          for name, expected_sha in EXPECTED_XML.items():
              paths = list(
                  V4.glob("*_" + name)
              )

              if len(paths) != 1:
                  raise SystemExit(
                      "Missing V4 XML original: " + name
                  )

              raw = paths[0].read_bytes()
              sha = digest(raw)

              if sha != expected_sha:
                  raise SystemExit(
                      "XML SHA mismatch: " + name
                  )

              if not raw.startswith(MAGIC):
                  raise SystemExit(
                      "Unexpected XML signature: " + name
                  )

              xml_rows.append({
                  "filename": name,
                  "bytes": len(raw),
                  "sha256": sha,
                  "header": raw[:16].hex(" "),
                  "magic": raw[:4].decode("ascii")
              })

          save_csv(
              "01_verified_xml_origins.csv",
              xml_rows,
              [
                  "filename", "bytes",
                  "sha256", "header", "magic"
              ]
          )

          # -------------------------------------------
          # Locate the actual original DLL files
          # -------------------------------------------

          dll_names = (
              "Login.dll",
              "Redemption.dll"
          )

          binary_files = []

          for name in dll_names:
              matches = list(CLIENT.rglob(name))

              if len(matches) != 1:
                  raise SystemExit(
                      f"Expected one {name}, found {len(matches)}"
                  )

              binary_files.append(matches[0])

          dll_a = binary_files[0].read_bytes()
          dll_b = binary_files[1].read_bytes()

          if digest(dll_a) != EXPECTED_DLL_SHA:
              raise SystemExit(
                  "Login.dll differs from V5"
              )

          if digest(dll_b) != EXPECTED_DLL_SHA:
              raise SystemExit(
                  "Redemption.dll differs from V5"
              )

          if dll_a != dll_b:
              raise SystemExit(
                  "Previously identical DLLs now differ"
              )

          # Save the exact DLL for future direct analysis.
          shutil.copyfile(
              binary_files[0],
              SAMPLES / "Login.dll"
          )

          # Keep the actual game executable as well.
          lineage = list(
              CLIENT.rglob("Lineage.exe")
          )

          if len(lineage) == 1:
              shutil.copyfile(
                  lineage[0],
                  SAMPLES / "Lineage.exe"
              )

          # -------------------------------------------
          # Classify X?xm locations and look for xrefs
          # -------------------------------------------

          marker_rows = []
          xref_rows = []
          section_rows = []

          image_base, ptr_size, sections = get_sections(
              dll_a
          )

          for section in sections:
              section_rows.append({
                  "section": section["name"],
                  "rva": section["rva"],
                  "raw_offset": section["raw_offset"],
                  "raw_size": section["raw_size"],
                  "flags": hex(section["flags"])
              })

          marker_offsets = occurrences(
              dll_a, MAGIC
          )

          for marker_index, marker_offset in enumerate(
              marker_offsets
          ):
              section_name, rva = locate_offset(
                  marker_offset, sections
              )

              va = (
                  image_base + rva
                  if rva is not None
                  else None
              )

              evidence = context_dump(
                  dll_a, marker_offset, 256
              )

              context_path = CONTEXT / (
                  f"marker_{marker_index + 1:02d}.json"
              )

              context_path.write_text(
                  json.dumps(
                      evidence,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              marker_rows.append({
                  "file": "Login.dll",
                  "offset": marker_offset,
                  "section": section_name,
                  "rva": (
                      hex(rva) if rva is not None else ""
                  ),
                  "virtual_address": (
                      hex(va) if va is not None else ""
                  ),
                  "context": str(
                      context_path.relative_to(REPORT)
                  )
              })

              if va is None:
                  continue

              code_sections = [
                  section
                  for section in sections
                  if section["flags"] & 0x20
              ]

              for value_type, value in (
                  ("absolute_va", va),
                  ("rva", rva)
              ):
                  fmt = (
                      "<I" if ptr_size == 4
                      else "<Q"
                  )

                  pointer = struct.pack(fmt, value)

                  for code_section in code_sections:
                      start = code_section["raw_offset"]
                      end = min(
                          len(dll_a),
                          start + code_section["raw_size"]
                      )

                      code = dll_a[start:end]

                      for local_pos in occurrences(
                          code, pointer
                      )[:100]:
                          reference_offset = (
                              start + local_pos
                          )

                          reference_section, reference_rva = (
                              locate_offset(
                                  reference_offset,
                                  sections
                              )
                          )

                          xref_rows.append({
                              "marker_offset": marker_offset,
                              "reference_offset": reference_offset,
                              "reference_section": reference_section,
                              "reference_rva": (
                                  hex(reference_rva)
                                  if reference_rva is not None
                                  else ""
                              ),
                              "reference_type": value_type,
                              "evidence": dll_a[
                                  max(0, reference_offset - 16):
                                  reference_offset + 24
                              ].hex(" ")
                          })

          save_csv(
              "02_dll_pe_sections.csv",
              section_rows,
              [
                  "section", "rva",
                  "raw_offset", "raw_size", "flags"
              ]
          )

          save_csv(
              "03_xml_magic_locations.csv",
              marker_rows,
              [
                  "file", "offset", "section",
                  "rva", "virtual_address", "context"
              ]
          )

          save_csv(
              "04_possible_code_references.csv",
              xref_rows,
              [
                  "marker_offset",
                  "reference_offset",
                  "reference_section",
                  "reference_rva",
                  "reference_type",
                  "evidence"
              ]
          )

          # These are candidate references, not proof
          # that the executable uses an XML decoder.

          expected_offsets = {311840, 320536}
          discovered_offsets = set(marker_offsets)

          summary = {
              "phase": "STATIC_LOADER_REFERENCE_INVESTIGATION",
              "v4_original_xml_verified": 2,
              "login_redemption_dll_identical": True,
              "original_dll_sha256": digest(dll_a),
              "xml_marker_offsets": marker_offsets,
              "v5_offsets_confirmed": (
                  discovered_offsets == expected_offsets
              ),
              "pe_image_base": hex(image_base),
              "pe_pointer_size": ptr_size,
              "pe_sections": len(sections),
              "candidate_code_references": len(xref_rows),
              "dll_sample_exported": True,
              "decoder_algorithm_verified": False,
              "xml_recovered": False,
              "monster_motion_mapping_verified": False
          }

          (REPORT / "05_summary_v7.json").write_text(
              json.dumps(
                  summary,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          report_text = [
              "# Sanctuary of Aden V7 Loader Investigation",
              "",
              "## Verified",
              "",
              "- V4 XML originals verified by SHA256",
              "- Login.dll and Redemption.dll identical",
              f"- X?xm occurrences: {len(marker_offsets)}",
              f"- Candidate code references: {len(xref_rows)}",
              "",
              "## Limits",
              "",
              "A matching pointer is not proof of execution.",
              "A marker in a DLL is not proof of decryption.",
              "No client executable or DLL was executed.",
              "No decrypted XML has been established.",
              "",
              "## Preserved samples",
              "",
              "- samples/Login.dll",
              "- samples/Lineage.exe if present",
              "",
              "The next investigation can examine these",
              "samples without downloading all 46 parts."
          ]

          (REPORT / "REPORT.md").write_text(
              "\n".join(report_text),
              encoding="utf-8"
          )

          print("=== V7 SUMMARY ===")
          print(json.dumps(
              summary,
              ensure_ascii=False,
              indent=2
          ))

          print("=== PE SECTIONS ===")
          for row in section_rows:
              print(row)

          print("=== XML MAGIC LOCATIONS ===")
          for row in marker_rows:
              print(row)

          print("=== CANDIDATE REFERENCES ===")
          for row in xref_rows[:50]:
              print(row)

          summary_path = os.environ.get(
              "GITHUB_STEP_SUMMARY"
          )

          if summary_path:
              with open(
                  summary_path,
                  "a",
                  encoding="utf-8"
              ) as f:
                  f.write("\n".join(report_text))

          PY

      - name: Upload V7 investigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-V7-XML-Loader-References
          path: reports/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
