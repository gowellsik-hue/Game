
# .github/workflows/audit-sanctuary-monsters.yml
# V35: source-first, read-only, original Sanctuary client inspection + independently
# sourced L1J 3.80c NPC server reference. NEVER mislabel reference as Sanctuary stats.
# Audit ALL monster rows; EXP inversion creates a 0..10 HTML VIEW only.
name: "audit-sanctuary-monsters.yml | V35 | 61CE Physical Motion ID and Bank Review"
run-name: "audit-sanctuary-monsters.yml | V35 | Sanctuary Full Monster Data Audit / EXP 0-10"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/audit-sanctuary-monsters.yml"]

permissions:
  contents: read
  actions: read

jobs:
  v35-full-source-and-reference-audit:
    name: "V35 | Original Sanctuary inspection + whole NPC EXP / spawn / drop DB"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "V35 | Restore ALL V34 original SPR IDs, never the SLKnight 492 dataset"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          mkdir -p v34-database reference-sql v35-output original-client v34-gifs downloads
          gh run download 39386289505 -R "$GITHUB_REPOSITORY" \
            -n audit-sanctuary-monsters-v34-all-source-database -D v34-database
          test -s v34-database/V34-Sanctuary-ALL-8233-actor-inventory.csv
          test -s v34-database/V34-ALL-client-archive-files.txt
          python3 - <<'PY'
          import csv
          with open('v34-database/V34-Sanctuary-ALL-8233-actor-inventory.csv',encoding='utf-8-sig') as f:
              assert len(list(csv.DictReader(f)))==8233
          print('SANCTUARY SOURCE: 8233 actor IDs confirmed; original client stats NOT yet asserted')
          PY

      - name: "V35 | Fetch genuine full 3.80c reference server SQL, pinned commit"
        run: |
          set -euo pipefail
          BASE='https://raw.githubusercontent.com/nonono44/l1j-tw-99nets/8aa24617476a7d8f6a7072687279c77cf9f3d405/L1J-TW_3.80c/db/Taiwan'
          for t in npc spawnlist spawnlist_boss droplist mobskill mapids; do
            curl -fLSs --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 180 \
              "$BASE/$t.sql" -o "reference-sql/$t.sql"
            test -s "reference-sql/$t.sql"
            echo "L1J-TW REFERENCED $t $(wc -c < reference-sql/$t.sql) bytes"
          done
          test "$(wc -c < reference-sql/npc.sql)" -gt 1000000
          test "$(wc -c < reference-sql/spawnlist.sql)" -gt 1000000
          echo 'SQL files: EXTERNAL REFERENCE, NEVER Sanctuary original server data'

      - name: "V35 | Recover Sanctuary original client TEXT, TILE, XML and metadata"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          gh release download v1.0.0 -R "$GITHUB_REPOSITORY" \
            --pattern 'Sanctuary.of.Aden.-.Copy.*' -D downloads
          # No sprite regeneration: the original 73,041 verified GIFs already exist in V34.
          7z x downloads/Sanctuary.of.Aden.-.Copy.zip \
            'Sanctuary of Aden - Copy/xml/*' \
            'Sanctuary of Aden - Copy/*.txt' \
            'Sanctuary of Aden - Copy/*.ncl' \
            'Sanctuary of Aden - Copy/*.ini' \
            'Sanctuary of Aden - Copy/*.cfg' \
            'Sanctuary of Aden - Copy/*.lmp' \
            'Sanctuary of Aden - Copy/Text*.pak' \
            'Sanctuary of Aden - Copy/Text.idx' \
            'Sanctuary of Aden - Copy/Tile.pak' \
            'Sanctuary of Aden - Copy/Tile.idx' \
            '-o./original-client' -y > v35-output/V35-original-client-extract.log
          test -s 'original-client/Sanctuary of Aden - Copy/Text.idx'
          test -s 'original-client/Sanctuary of Aden - Copy/Tile.idx'
          rm -rf downloads
          echo 'Original client loaded: Text/Tile IDX and PAK, root text, XML'

      - name: "V35 | Parse ALL NPC records, reverse EXP, join spawns, skills and Adena"
        run: |
          set -euo pipefail
          cat > /tmp/v35_data.py <<'V35_PYDB'
          #!/usr/bin/env python3
          # audit-sanctuary-monsters.yml | V35 | READ-ONLY. Source provenance is mandatory.
          from __future__ import annotations
          import ast, base64, collections, csv, hashlib, html, io, json, math, os, re, sys, zipfile
          from pathlib import Path

          ROOT=Path('.')
          SOURCE=ROOT/'reference-sql'
          PRIOR=ROOT/'v34-database'
          OUT=ROOT/'v35-output'
          OUT.mkdir(parents=True,exist_ok=True)
          BASE='https://raw.githubusercontent.com/nonono44/l1j-tw-99nets/8aa24617476a7d8f6a7072687279c77cf9f3d405/L1J-TW_3.80c/db/Taiwan/'
          FIELDS=['npcid','name','nameid','impl','gfxid','original_sql_lvl','hp','mp','ac','str','con','dex','wis','intel','mr','reference_pre_def_physical_min','reference_pre_def_physical_max','reference_attack_formula_note','exp','exp_inferred_level','exp_basis','exp_vs_sql_level','passispeed','atkspeed','alt_atk_speed','atk_magic_speed','sub_magic_speed','randomlevel','randomhp','randomexp','damage_reduction','mobskill_count','adena_min','adena_max','adena_chance_per_million','spawn_count','spawn_rows','has_cardinal_source_spr','spr_actor_id','identity','source']
          URL_NAME='L1J-TW 3.80c external SQL reference (NPC 2013, spawn/drop 2011); NOT Sanctuary original server'

          def output_csv(path,fields,items):
              with path.open('w',encoding='utf-8-sig',newline='') as f:
                  writer=csv.DictWriter(f,fieldnames=fields,extrasaction='ignore');writer.writeheader();writer.writerows(items)

          def schema_and_rows(name):
              f=SOURCE/(name+'.sql')
              s=f.read_text('utf-8-sig')
              # MySQL dumps may have 1 INSERT per line. Handle quoted commas, apostrophes and escaped text.
              schema=[]
              found=False
              for line in s.splitlines():
                  if re.match(r'\s*CREATE\s+TABLE\s+',line,re.I):found=True;continue
                  if found:
                      if re.match(r'\s*\)',line):break
                      m=re.match(r'\s*`([^`]+)`\s+\w+',line)
                      if m:schema.append(m.group(1))
              if not schema:raise ValueError(f'{name}: no CREATE TABLE columns')
              result=[]
              for lineno,line in enumerate(s.splitlines(),1):
                  if not re.match(r'\s*INSERT\s+INTO\s+',line,re.I):continue
                  m=re.search(r'\bVALUES\s*(.+?)\s*;?\s*$',line,re.I)
                  if not m:raise ValueError((name,lineno,'INSERT missing VALUES'))
                  valstr=m.group(1).strip().rstrip(';')
                  # csv.reader respects quoted delimiters and escape sequences in real dumps.
                  import csv as csvmod
                  # comma-delimited single parenthesized row; MySQL NULL tokens remain plain text.
                  if not (valstr.startswith('(') and valstr.endswith(')')):
                      raise ValueError((name,lineno,'unexpected multi-row INSERT; parse explicitly'))
                  values=next(csvmod.reader([valstr[1:-1]], delimiter=',',quotechar="'",escapechar='\\',skipinitialspace=True))
                  if len(values)!=len(schema):
                      raise ValueError((name,lineno,'schema/value mismatch',len(schema),len(values)))
                  row={k:None if v.upper()=='NULL' else v for k,v in zip(schema,values)}
                  result.append(row)
              if not result:raise ValueError(name+': no parsed INSERT records')
              return schema,result

          def nint(v):
              if v is None or v=='':return None
              try:return int(str(v))
              except ValueError:return None

          def level_from_exp(e):
              if e is None or e<1:return None,'NO_EXP'
              x=math.isqrt(e-1)
              if x*x==e-1:return x,'EXACT_EXP_SQUARE_PLUS_ONE'
              return None,'EXP_EXCEPTION_NOT_SQUARE_PLUS_ONE'

          def list_sprites():
              f=PRIOR/'V34-Sanctuary-ALL-8233-actor-inventory.csv'
              with f.open(encoding='utf-8-sig',newline='') as h:
                  items={int(r['sanctuary_sprite_actor_id']):r for r in csv.DictReader(h)}
              assert len(items)==8233,'V34 source inventory unexpectedly changed'
              return items

          def generate():
              inventory=list_sprites()
              names=['npc','spawnlist','spawnlist_boss','droplist','mobskill','mapids']
              tables={}
              for tab in names:
                  cols,rows=schema_and_rows(tab)
                  tables[tab]=rows
                  print('SQL TABLE',tab,'rows',len(rows),'columns',len(cols),flush=True)
              assert len(tables['npc'])>=3000
              # Full spawnlist rows, not just display subset; DO NOT treat count=0 as actual spawn.
              spawns=collections.defaultdict(list)
              for label in ('spawnlist','spawnlist_boss'):
                  for r in tables[label]:
                      npc=nint(r.get('npc_templateid') or r.get('npc_id'))
                      if npc is None:raise AssertionError((label,'no npc_templateid',list(r)[:10]))
                      e={**r,'spawn_source':label,'spawn_status':'ACTIVE_NONZERO' if (nint(r.get('count')) or 0)>0 else 'ZERO_DISABLED'}
                      spawns[npc].append(e)
              spawn_fields=list(dict.fromkeys([*tables['spawnlist'][0].keys(),*tables['spawnlist_boss'][0].keys(),'spawn_source','spawn_status']))
              output_csv(OUT/'V35-reference-ALL-spawn-rows.csv',spawn_fields,
                   [x for a in sorted(spawns) for x in spawns[a]])
              drop=collections.defaultdict(list)
              for r in tables['droplist']:
                  if nint(r.get('itemId'))==40308:
                      drop[nint(r['mobId'])].append(r)
              skill=collections.Counter(nint(r.get('mobid') or r.get('mobId') or r.get('mobid')) for r in tables['mobskill'])
              all_rows=[]
              for r in tables['npc']:
                  if str(r.get('impl'))!='L1Monster':continue
                  npc=nint(r.get('npcid'));gid=nint(r.get('gfxid'));exp=nint(r.get('exp'))
                  inferred,basis=level_from_exp(exp)
                  declared=nint(r.get('lvl'))
                  total_spawn=sum(max(0,nint(x.get('count')) or 0) for x in spawns.get(npc,[]))
                  aden=drop.get(npc,[])
                  mapped=gid in inventory
                  if len(aden)==1:
                      a_min=nint(aden[0].get('min'));a_max=nint(aden[0].get('max'));a_chance=nint(aden[0].get('chance'))
                  else:a_min=a_max=a_chance=None
                  # L1J 3.80c L1Attack.calcNpcPcDamage: a reference-only component before
                  # AC, buffs, damage reduction, weapon/pet adjustments, and other target factors.
                  # This is NOT a verified Sanctuary attack or monster-specific hit random.
                  stat_lvl=declared
                  strength=nint(r.get('str'))
                  if stat_lvl is None or stat_lvl<=0 or strength is None:
                      low_phys=high_phys=None
                  else:
                      low_phys=(10 if stat_lvl<10 else 0)+(strength//2)+1
                      high_phys=low_phys+stat_lvl-1
                  d={
                      'npcid':npc,'name':r.get('name'),'nameid':r.get('nameid'),'impl':r.get('impl'),
                      'gfxid':gid,'original_sql_lvl':declared,'hp':nint(r.get('hp')),'mp':nint(r.get('mp')),
                      'ac':nint(r.get('ac')),'str':nint(r.get('str')),'con':nint(r.get('con')),
                      'dex':nint(r.get('dex')),'wis':nint(r.get('wis')),'intel':nint(r.get('intel')),
                      'mr':nint(r.get('mr')),'reference_pre_def_physical_min':low_phys, 'reference_pre_def_physical_max':high_phys, 'reference_attack_formula_note':'L1J 3.80c only; pre-target-defense component, not final attack', 'exp':exp,'exp_inferred_level':inferred,
                      'exp_basis':basis,'exp_vs_sql_level':('MATCH' if inferred==declared else 'MISMATCH_OR_UNKNOWN'),
                      'passispeed':nint(r.get('passispeed')),'atkspeed':nint(r.get('atkspeed')),
                      'alt_atk_speed':nint(r.get('alt_atk_speed')),
                      'atk_magic_speed':nint(r.get('atk_magic_speed')),
                      'sub_magic_speed':nint(r.get('sub_magic_speed')),
                      'randomlevel':nint(r.get('randomlevel')),'randomhp':nint(r.get('randomhp')),
                      'randomexp':nint(r.get('randomexp')),
                      'damage_reduction':nint(r.get('damage_reduction')),
                      'mobskill_count':skill.get(npc,0),
                      'adena_min':a_min,'adena_max':a_max,'adena_chance_per_million':a_chance,
                      'spawn_count':total_spawn,'spawn_rows':len(spawns.get(npc,[])),
                      'has_cardinal_source_spr':mapped and (nint(inventory[gid]['cardinal_files']) or 0)>0,
                      'spr_actor_id':gid if mapped else None,
                      'identity':'NUMBER_MATCH_EXTERNAL_REFERENCE_ONLY' if mapped else 'NO_SANCTUARY_SPR_ID_MATCH',
                      'source':URL_NAME,
                  }
                  all_rows.append(d)
              # Join EVERY spawn row with NPC statistics and map names, including zero-count entries.
              mapname={nint(r['mapid']):r.get('locationname') for r in tables['mapids']}
              by_npc={int(r['npcid']):r for r in all_rows}
              spawn_linked=[]
              for npc,records in spawns.items():
                  mob=by_npc.get(npc)
                  for item in records:
                      mapid=nint(item.get('mapid'))
                      spawn_linked.append({
                          'npcid':npc,'npc_name': mob['name'] if mob else '',
                          'exp_inferred_level':mob['exp_inferred_level'] if mob else None,
                          'gfxid':mob['gfxid'] if mob else None,
                          'source':URL_NAME,'spawn_source':item['spawn_source'],
                          'spawn_status':item['spawn_status'],'mapid':mapid,'map_name':mapname.get(mapid,''),
                          'count':nint(item.get('count')),'locx':nint(item.get('locx')),
                          'locy':nint(item.get('locy')),'randomx':nint(item.get('randomx')),
                          'randomy':nint(item.get('randomy')),'locx1':nint(item.get('locx1')),
                          'locy1':nint(item.get('locy1')),'locx2':nint(item.get('locx2')),
                          'locy2':nint(item.get('locy2')),
                          'min_respawn_delay':nint(item.get('min_respawn_delay')),
                          'max_respawn_delay':nint(item.get('max_respawn_delay')),
                      })
              output_csv(OUT/'V35-reference-ALL-spawn-linked.csv',
                    list(spawn_linked[0].keys()),spawn_linked)
              assert len({r['npcid'] for r in all_rows})==len(all_rows), 'Duplicate NPC template IDs: distinguish before counting'
              # This is a complete reference DB. 0-10 is a VIEW, not an extraction limit.
              low=[r for r in all_rows if r['exp_inferred_level'] is not None and 0<=r['exp_inferred_level']<=10]
              low_graphics=[r for r in low if r['has_cardinal_source_spr']]
              exceptions=[r for r in all_rows if r['exp_basis']!='EXACT_EXP_SQUARE_PLUS_ONE' or r['exp_vs_sql_level']!='MATCH']
              # Include source records for all, including those without graphics, for audit completeness.
              output_csv(OUT/'V35-reference-ALL-mons-exp-inferred.csv',FIELDS,all_rows)
              output_csv(OUT/'V35-reference-0-10-by-exp.csv',FIELDS,low)
              output_csv(OUT/'V35-reference-0-10-with-sanctuary-spr.csv',FIELDS,low_graphics)
              output_csv(OUT/'V35-reference-exp-exceptions.csv',FIELDS,exceptions)
              counts={
                  'scope':'FULL L1J 3.80c reference; Sanctuary original client SPR index; source-separated',
                  'sanctuary_original_sprite_ids':len(inventory),
                  'reference_all_monster_npc_ids':len(all_rows),
                  'reference_all_unique_gfx_ids':len({r['gfxid'] for r in all_rows}),
                  'reference_exp_exact_level_0_10_npc_ids':len(low),
                  'reference_exp_exact_level_0_10_unique_gfx':len({r['gfxid'] for r in low}),
                  'reference_exp_exact_level_0_10_distinct_names':len({r['name'] for r in low}),
                  'reference_exp_exact_level_0_10_sanctuary_spr_matched_npc_ids':len(low_graphics),
                  'reference_exp_exact_level_0_10_sanctuary_spr_matched_unique_gfx':len({r['gfxid'] for r in low_graphics}),
                  'reference_exp_exact_level_0_10_spawn_count_sum':sum(r['spawn_count'] for r in low),
                  'reference_exp_exact_level_0_10_with_spr_spawn_count_sum':sum(r['spawn_count'] for r in low_graphics),
                  'reference_exp_exception_or_level_conflict_npc_ids':len(exceptions),
                  'reference_adena_40308_rows':sum(len(a) for a in drop.values()),
                  'sanctuary_original_monster_name_hp_exp_adena_verified':False,
                  'sanctuary_original_level_0_10_count_verified':False,
                  'all_reference_sql_pinned_commit':'8aa24617476a7d8f6a7072687279c77cf9f3d405',
                  'external_sql_snapshot_dates':{'npc':'2013-10-29','spawnlist':'2011-06-11','spawnlist_boss':'2011-02-04','droplist':'2011-05-25','mobskill':'2011-06-11','mapids':'2012-02-04'},
                  'cross_snapshot_join_reliability':'REFERENCE_ONLY__DIFFERENT_SQL_SNAPSHOTS__UNVERIFIED_AGAINST_SANCTUARY'
              }
              (OUT/'V35-full-data-summary.json').write_text(json.dumps(counts,ensure_ascii=False,indent=2),'utf-8')
              print('V35_DATA_RESULT',json.dumps(counts,ensure_ascii=False),flush=True)
              return all_rows,low,low_graphics,counts,spawns

          if __name__=='__main__':generate()
          V35_PYDB
          python3 /tmp/v35_data.py

      - name: "V35 | Audit original archive contents; do not invent server EXP"
        run: |
          set -euo pipefail
          cat > /tmp/v35_client_audit.py <<'V35_PYCLIENT'
          #!/usr/bin/env python3
          """Read-only evidence audit of original Sanctuary client XML/Text/Tile resources.
          Does NOT confuse client assets with a server database or guess monster stats.
          """
          import collections,csv,json,os,re,zipfile
          from pathlib import Path
          ROOT=Path('.')
          AUD=ROOT/'v35-output';SRC=ROOT/'original-client'
          AUD.mkdir(parents=True,exist_ok=True)
          listing=(ROOT/'v34-database/V34-ALL-client-archive-files.txt').read_text('utf-8',errors='replace')
          file_records=[]
          for line in listing.splitlines():
           m=re.match(r'^\d{4}-\d\d-\d\d\s+\S+\s+[A-Z.]{5}\s+\d+\s+\d+\s+Sanctuary of Aden - Copy/(.*)$',line)
           if m:file_records.append(m.group(1))
          server_candidates=[f for f in file_records if re.search(r'(npc|mob|monster|spawn|server|exp|adena|droplist|\.sql$|\.db$|\.sqlite$)',f,re.I)]
          # Detect actual server tables by structure, not matching an incidental UI word.
          patterns={
           'npc_sql_schema':re.compile(rb'CREATE\s+TABLE\s+[`\[]?npc\b',re.I),
           'monster_field_schema':re.compile(rb'(?:`|\")?(?:npcid|gfxid|passispeed|atkspeed|randomexp|spawnlist|droplist)(?:`|\")?',re.I),
           'server_exp_table':re.compile(rb'(?:<\s*monster[^>]*exp\s*=|<\s*npc[^>]*level\s*=)',re.I),
           'npc_binary_terms':re.compile(rb'\b(?:exp|experience|adena|npcid|gfxid|spawnlist|monster_id)\b',re.I)
          }
          scanned=[];matches=[]
          for path in sorted(SRC.rglob('*')):
           if not path.is_file():continue
           if path.stat().st_size>600_000_000:continue
           # For large pack binaries, search bounded chunks with 100 bytes overlap.
           counts=collections.Counter();examples={}
           with path.open('rb') as f:
            previous=b'';total=0
            while True:
             data=f.read(1024*1024)
             if not data:break
             stream=previous+data
             for key,rx in patterns.items():
              found=list(rx.finditer(stream))
              counts[key]+=len(found)
              if found and key not in examples:
               a=found[0].start();examples[key]=stream[max(0,a-35):a+60].decode('utf-8','replace')
             previous=stream[-96:];total+=len(data)
             # Binaries that are obviously graphics/audio are excluded by selective extraction pattern.
            if total!=path.stat().st_size:raise AssertionError(path)
           relative=str(path.relative_to(SRC))
           result={'file':relative,'size_bytes':path.stat().st_size,**{k:counts[k] for k in patterns}}
           scanned.append(result)
           if sum(counts.values()):
            matches.append({**result,'examples':json.dumps(examples,ensure_ascii=False)[:500]})
          fields=['file','size_bytes',*patterns]
          for filename,rows,head in [('V35-original-client-files-scanned.csv',scanned,fields),('V35-original-client-keyword-candidates.csv',matches,[*fields,'examples'])]:
           with (AUD/filename).open('w',encoding='utf-8-sig',newline='') as f:
            w=csv.DictWriter(f,fieldnames=head,extrasaction='ignore');w.writeheader();w.writerows(rows)
          res={
           'source':'Sanctuary of Aden - Copy v1.0.0 original 46-piece client archive',
           'archive_file_count':len(file_records),
           'archive_extension_counts':dict(collections.Counter(Path(x).suffix.lower() for x in file_records)),
           'server_like_named_paths':server_candidates[:150],
           'server_sql_or_db_file_paths':[x for x in file_records if x.lower().endswith(('.sql','.db','.sqlite','.sqlite3'))],
           'selectively_extracted_client_file_count':len(scanned),
           'files_with_any_keyword':len(matches),
           'conclusion':'No complete authenticated Sanctuary SERVER NPC EXP/HP/spawn database found in audited CLIENT archive; keyword hits are candidates only',
           'source_is_server_db':False,
          }
          (AUD/'V35-original-client-audit.json').write_text(json.dumps(res,ensure_ascii=False,indent=2),'utf-8')
          print('V35_ORIGINAL_CLIENT_AUDIT',json.dumps({k:v for k,v in res.items() if k not in ('archive_extension_counts','server_like_named_paths')},ensure_ascii=False),flush=True)
          V35_PYCLIENT
          python3 /tmp/v35_client_audit.py

      - name: "V35 | Parse every Text/Tile PAK index and scan source candidates"
        run: |
          set -euo pipefail
          cat > /tmp/v35_pack_audit.py <<'V35_PYPACK'
          #!/usr/bin/env python3
          """V35: exhaustive INDEX records for original client Text/Tile PAKs; read-only candidate extraction."""
          import collections,csv,io,json,re,struct,hashlib
          from pathlib import Path
          SRC=Path('original-client');OUT=Path('v35-output');OUT.mkdir(exist_ok=True)
          def dec(b):
           for enc in ('utf-8','cp949','euc-kr','cp1252'):
            try:return b.decode(enc)
            except UnicodeError:pass
           return b.decode('latin-1','replace')
          indexes=[];sources=[];candidate_contents=[]
          # Stronger matches use full field labels, not arbitrary substring EXP inside other words.
          namepattern=re.compile(r'npc|monster|spawn|droplist|adena|experience|exp(_|\b)|level|server|\.sql$|mob',re.I)
          valuepattern=re.compile(rb'(?i)(?:npcid|gfxid|spawnlist|droplist|adena|<npc|<monster|\bexp\b|experience|monster[_ ]level|monster[_ ]hp)')
          for f in sorted(SRC.rglob('*.idx')):
           p=f.with_suffix('.pak')
           if not p.exists():continue
           data=f.read_bytes()
           if len(data)<4:continue
           n=struct.unpack_from('<I',data,0)[0]
           if len(data)!=4+28*n:
            indexes.append({'idx':str(f),'pak':str(p),'index_records':None,'valid_records':0,'data_candidate_entries':0,'string_evidence_files':0,'status':'UNRECOGNIZED_IDX_RECORD_LAYOUT','raw_bytes':len(data)})
            continue
           maxlen=p.stat().st_size
           stats={'idx':str(f),'pak':str(p),'index_records':n,'valid_records':0,'data_candidate_entries':0,'string_evidence_files':0}
           with p.open('rb') as stream:
            for i in range(n):
             pos=4+28*i;offset=struct.unpack_from('<I',data,pos)[0]
             name=dec(data[pos+4:pos+24].split(b'\0',1)[0]);size=struct.unpack_from('<I',data,pos+24)[0]
             valid=offset<=maxlen and size<=maxlen-offset
             stats['valid_records']+=bool(valid)
             source={'pak':str(p),'file':name,'offset':offset,'bytes':size,'valid':valid}
             sources.append(source)
             # scan ALL manageable text-like resources, not just names that appear relevant.
             textlike=Path(name.lower()).suffix in {'.txt','.xml','.csv','.sql','.json','.ini','.cfg','.dat','.lst','.tbl','.properties','.htm','.html'}
             if not valid or not (0<size<=3_000_000) or not textlike:continue
             stats['data_candidate_entries']+=1
             stream.seek(offset);raw=stream.read(size)
             if len(raw)!=size:raise RuntimeError('Corrupt raw PAK read '+name)
             match=valuepattern.search(raw)
             if match or namepattern.search(name):
              stats['string_evidence_files']+=1
              candidate_contents.append({'pak':str(p),'file':name,'bytes':size,'sha256':hashlib.sha256(raw).hexdigest(),
                  'structured_stat_value_evidence':bool(match),
                  'first_candidate_excerpt':dec(raw[max(0,match.start()-35):match.start()+80]) if match else ''})
           indexes.append(stats)
          headers=['pak','file','offset','bytes','valid']
          with (OUT/'V35-original-client-Text-Tile-PAK-all-index.csv').open('w',encoding='utf-8-sig',newline='') as w:
           wr=csv.DictWriter(w,fieldnames=headers);wr.writeheader();wr.writerows(sources)
          with (OUT/'V35-original-client-Text-Tile-contents-candidates.csv').open('w',encoding='utf-8-sig',newline='') as w:
           wr=csv.DictWriter(w,fieldnames=['pak','file','bytes','sha256','structured_stat_value_evidence','first_candidate_excerpt']);wr.writeheader();wr.writerows(candidate_contents)
          (OUT/'V35-original-client-PACK-idx-summary.json').write_text(json.dumps({'source':'Sanctuary actual Text/Tile client PAK records','indexes':indexes,'candidate_file_count':len(candidate_contents),'original_monster_server_stats_verified':False},ensure_ascii=False,indent=2),'utf-8')
          print('V35_ORIGINAL_PACK_AUDIT',json.dumps(indexes,ensure_ascii=False),flush=True)
          V35_PYPACK
          python3 /tmp/v35_pack_audit.py

