
name: SLKnight 492EV Four Direction Motion V23

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-sanctuary-monsters.yml"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Restore verified V229R7 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39050634920
          name: github-pages
          github-token: ${{ github.token }}
          path: previous

      - name: Prepare original RPG Maker game
        run: |
          set -euo pipefail
          mkdir -p site reports
          test -s previous/artifact.tar
          tar -xf previous/artifact.tar -C site
          test -s site/knight/gameasync/Data/Scripts.rxdata
          test -d site/knight/gameasync/Graphics/Characters
          sudo apt-get update -qq
          sudo apt-get install -y -qq ruby python3-pil

      - name: Recover actual graphics for all 492 events
        run: |
          set -euo pipefail
          cat > /tmp/events.rb <<'RB'
          require 'base64'
          require 'json'

          class RGSSOpaque
            def self._load(data)
              allocate
            end
          end
          class Table < RGSSOpaque; end
          class Color < RGSSOpaque; end
          class Tone < RGSSOpaque; end
          class Rect < RGSSOpaque; end

          module RPG
            class Map; end
            class Event
              class Page
                class Condition; end
                class Graphic; end
              end
            end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
            class AudioFile; end
            class Animation
              class Frame; end
              class Timing; end
            end
          end

          def iv(obj,field)
            obj && obj.instance_variable_get("@#{field}")
          end

          def utf(obj)
            text=obj.to_s.dup.force_encoding('UTF-8')
            return text if text.valid_encoding?
            text.force_encoding('CP949')
            text.encode('UTF-8',invalid: :replace,undef: :replace)
          end

          names='불타는 전사|라바 골렘|드래곤 플라이|아시타지오|혼 켈베로스|사라만다|파이어 에그|이프리트|에틴|트롤|드레이크|리자드맨|라이칸스로프|바실리스크|사이클롭스|웅골리언트|라미아|셸로브|화염의 고스트|레서 드래곤|본 드래곤|공포의 아이언 골렘|화염의 네크로맨서|버그베어|킹 버그베어|하피|코카트리스|미노타우르스|공포의 파이어 에그|키메라|나이트메어|공포의 켈베로스|난폭한 구울|난폭한 스파토이|난폭한 해골돌격병|저주의 엘모어 병사|저주의 엘모어 장군|냉혹한 샤벨타이거|화염의 아시타지오|어둠의 라이칸스로프|화염의 혼 켈베로스|암흑의 서큐버스 퀸|암흑의 흑기사|어둠의 불타는 전사|나이트발드|스파토이|스콜피온|거대 개미|거대 병정 개미|해골|좀비|오크 전사|거대 여왕 개미|바포메트|흑장로|데스나이트|카스파|세마|메르키오르|발터자르|오우거|아이스 골렘|좀비 엘모어 병사|좀비 엘모어 장군|예티|샤벨 타이거|구울|눈사람|아투바 오크|오크 마법사|간디 오크|로바 오크|두다-마라 오크|네루가 오크|켈베로스|해골돌격병|해골근위병|흑기사 대장 커츠|무리안|서큐버스|서큐버스 퀸|메두사|변종 웅골리언트|변종 라미아|놀|흑기사|홉고블린|터틀 드래곤|경비병|물의 대정령|불의 대정령|바람의 대정령|땅의 대정령|*반왕*켄라우헬|그림리퍼|*반왕*아크위자드|*반왕*아크나이트|선택받지 못한 자|파우스트의 악령|화염의 이빨|바람의 이빨|빙하의 이빨|대지의 이빨|심연의 수령|심연의 화령|심연의 지령|심연의 풍령|화령의 주인|심연의 구울|테베 갑충석|테베 칼비스|테베 스핑크스|테베 오벨리스크|기르타스|지저 리자드맨|지저 일렉카둠|지저 전갈 파이탄|지저 전갈 미스틱|지저 크랩맨|지저 대왕 거북|지저 비홀더|꿈의 혼령|아이스맨|가디언 아머|바알'.split('|')

          encoded=<<~DATA
          AgEAAgIBAgMCAgQDAgUEAggFAgkAAgoBAgsCAgwGAg0GAg8HAwMIAwQIAwUJAwYKAwcJAwgLAwoLAw0MAw4MAw8NAxAOAxEO
          AxYPAxcQAxkQAxoRBAUSBAYTBAcSBAgSBAkSBAoUBAsVBAwVBA0WBA4VBA8WBQEXBQMYBQQYBQUZBQYXBQcXBQgXBQwKBQ0Z
          BQ4JBQ8JBRgIBRsIBgMaBgYKBg4aBg8aBhIbBhMbBhQbBhUbCAQcCAYdCAcdCAkeCAoeCAweCA0dCA8fCBEcCBQfCBUfCBcc
          CQUgCQYhCQchCQggCQkhCQwiCQ0iCQ4iCQ8iCRAhCgQjCgUkCgcjCgkjCgojCgskCg0kCg4kCwQlCwUlCwYlCwcmCwgnCwkn
          CwonCwsmCwwoCw0oDAQpDAUpDAYqDAcqDAgrDAkrDAosDQEtDQItDQMtDQUuDQYuDRALDRELDRILDRMLDRQLDRUZDRYZDRcv
          DRgvDRkwDRowDRsNDgMxDgQxDgUxDgYyDggyDgkyDgotDgstDgwtDwMtDwQtDwUtDwYxDwcxDwgxDwkxDwsyDwwyDw0zDw4z
          DxctEAEKEAIKEAMHEAQHEAU0EAY1EAc2EAg3EAk4EAo5EAs6EAw7EA0sEBE8EBI8EBM8EBQ8EBU8EBY9EBc9EBg9EBkiEBoi
          EBsiEBwVEB0VEB4VEB8kECAkECEjECIjEQI9EQM9EQQ+EQU+EQY+EQc/EQg/EQk/EQo9EQ5AEQ9AERBBERFBERIyERMyERRC
          ERVCERZDERdDEgI8EgM8EgQ8EgtEEg08Eg88EhBFEhFGEhJHEhRGEhVIEhZHEhdIEhhEEhlFEhpJEhtJEwM4EwQ5EwU6EwY7
          EwgYEwkYEwoXEwsXEw1KEw5KEw9KExEXExI3ExUXFAQXFAUXFAYYFAhKFAlKFApKFAwXFA8YFQJLFQRLFQVLFQZMFQdMFQhM
          FQkKFQo8FQs8FQw2FQ0KFRAuFREuFRIaFRMaFRQtFRUtFRYZFRcZFRtNFgFLFgVLFggJFgkJFgpLFgtMFgxMFg1MFwMJFwQJ
          FwhLFwlLFwpOFwtOFwxOFw1MFw5MGAMIGARPGAUIGAYIGAhPGAlOGApOGAtQGAxQGQNRGQhRGQlSGQtRGQxSGQ1SGQ5SGQ9S
          GRJRGRNTGRRTGRVTGRdTGgMvGgQvGgUvGgYvGggwGgkwGgowGgswGwE0GwMvGwQvGwUvGwYvGwgwGwkwGwowGwswHQZUHQpU
          HQ1UHQ9VHRJWHRMzHRRWHRUzHRZWHRdVHRhXHRtYHgRZHgVZHgZaHgdaHghbHglbHgpcHgtcHwtdHwxeHw1fHw9fHxJgHxNg
          HxRgHxVgHxZgIQJhIQRhIQVhIQZhIQdhIQhhIQlhIQphIQthIQxhIgFiIgJiIgNiIgRiIgViIgZiIgdiIghiIgliIgpiIgti
          IgxiIwJjIwRjIwVkIwZkIwdlIwhlIwlmIwpmIwxnIw1oIw5pIw9qIxBrIxFsJQFtJQRtJQVuJQZuJQdvJQhvJQlwJQpwKAVx
          KQFyKQJzKQRzKQV0KQZ1KQd2KQhzKQl3KQp4KQt4KQxyKQ1yKRB1KRF0KRJ4KRd2KgJ5KgMeKgZ5Kgc9Kgg9Kgk9Kgp5KgsG
          KgwGKg15Kg55Kg95KhB5KhF5KhIGKhMFKhRZKhV6KhZ6KhdbKhhaKhlcKhp7Kht7Khx7KwF8KwlZKwpbKwtaKwxcKw1lKw5m
          Kw8rKxArKxEpKxIlKxMlKxQmKxUjKxYkKxcjKxgkKxkTKxoUKxsSKxwVKx0VKx4hKx8gKyAiKyE2KyIKKyY4Kyc5Kyg6Kyk7
          Kyo3KysHKywsKy00Ky41Ky9NKzAJKzEOKzIIKzMOKzQQKzUXKzYZKzcYKzgJKzkJKzoNKzsbKzwbKz0aKz4aKz88K0A8K0E8
          K0I8K0M8K0QiK0UiK0YiK0cVK0gVK0kVK0oIK0sIK0xQK01P
