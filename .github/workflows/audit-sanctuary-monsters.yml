
name: Sanctuary of Aden Four Monster Motions V16

on:
  workflow_dispatch:
    inputs:
      sprite_id:
        description: Optional monster SPR ID, blank for automatic selection
        required: false
        type: string
        default: ""
  push:
    paths:
      - ".github/workflows/audit-sanctuary-monsters.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: sanctuary-monster-audit
  cancel-in-progress: false

jobs:
  four-motions:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Prepare environment
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full python3-pil
          mkdir -p previous/v2 previous/v12 previous/v13
          mkdir -p downloads client reports/site/sheets
          python3 -c "from PIL import Image; print('PIL READY')"

      - name: Restore full sprite indexes and monster references
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 38784834277 \
            --repo "$GITHUB_REPOSITORY" \
            --name Sanctuary-V2-Reports \
            --dir previous/v2
          gh run download 38872552732 \
            --repo "$GITHUB_REPOSITORY" \
            --name Sanctuary-V12-External-Action-and-NPC-Crosscheck \
            --dir previous/v12
          gh run download 38874270054 \
            --repo "$GITHUB_REPOSITORY" \
            --name Sanctuary-V13-Expanded-Monster-Motion-Lab \
            --dir previous/v13
          test -n "$(find previous/v2 -name all_sprite_candidates.csv -print -quit)"
          test -n "$(find previous/v2 -name exported_sprite_manifest.csv -print -quit)"
          test -s previous/v12/03_external_npc_gfx_candidates.csv
          test -s previous/v13/01_selected_sprite_ids.csv

      - name: Select one monster with distinct eight-direction groups
        shell: bash
        env:
          REQUESTED_ID: ${{ inputs.sprite_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import json
          import os
          import re
          from collections import defaultdict
          from pathlib import Path

          ROOT=Path.cwd()
          OUT=ROOT/"reports"

          def load(root,pattern):
              paths=list(root.rglob(pattern))
              if len(paths)!=1:
                  raise RuntimeError("Missing or duplicated "+pattern)
              with paths[0].open(encoding="utf-8-sig",newline="") as f:
                  return list(csv.DictReader(f))

          sources=load(ROOT/"previous/v2","all_sprite_candidates.csv")
          hashes=load(ROOT/"previous/v2","exported_sprite_manifest.csv")
          npcs=load(ROOT/"previous/v12","03_external_npc_gfx_candidates.csv")
          previous=load(ROOT/"previous/v13","01_selected_sprite_ids.csv")

          known={int(r["sprite_id"]) for r in previous}
          sha={
              (r["pak"],r["sprite_file"].lower(),int(r["bytes"])):r["sha256"]
              for r in hashes
          }

          names=defaultdict(set)
          for r in npcs:
              if "monster" not in r["implementation"].lower():
                  continue
              try:
                  aid=int(r["gfx_id"])
              except ValueError:
                  continue
              if r["npc_name"].strip():
                  names[aid].add(r["npc_name"].strip())

          pattern=re.compile(r"^(\d+)-(\d+)\.spr$",re.I)
          indexed=defaultdict(list)
          banks=defaultdict(lambda:defaultdict(set))

          for r in sources:
              filename=r["file"].replace("\\","/").split("/")[-1]
              m=pattern.fullmatch(filename)
              if not m:
                  continue
              aid,sub=map(int,m.groups())
              pak=r["pak"]
              if not Path(pak).name.lower().startswith("sprite"):
                  continue
              size=int(r["bytes"])
              digest=sha.get((pak,filename.lower(),size),"")
              item={
                  "actor":aid,
                  "sub":sub,
                  "file":filename,
                  "pak":pak,
                  "offset":int(r["offset"]),
                  "bytes":size,
                  "sha256":digest
              }
              indexed[(aid,pak)].append(item)
              banks[(aid,pak)][sub//8*8].add(sub)

          requested=os.environ.get("REQUESTED_ID","").strip()
          if requested and not re.fullmatch(r"\d+",requested):
              raise RuntimeError("sprite_id must be numeric")

          candidate_keys=[]
          for key,items in indexed.items():
              aid,pak=key
              if requested:
                  if aid!=int(requested):
                      continue
              elif aid not in names:
                  continue

              groups=banks[key]
              complete=sum(len(s)==8 for s in groups.values())
              total=sum(len(s) for s in groups.values())
              score=(
                  int(complete>=4),
                  int(aid in known),
                  complete,
                  total,
                  -aid
              )
              candidate_keys.append((score,key))

          if not candidate_keys:
              raise RuntimeError("No sprite ID/package candidate found")

          candidate_keys.sort(reverse=True)
          _,(actor,pak)=candidate_keys[0]

          groups=banks[(actor,pak)]
          complete=sorted(
              b for b,s in groups.items() if len(s)==8
          )
          partial=sorted(
              (b for b,s in groups.items() if len(s)<8),
              key=lambda b:(-len(groups[b]),b)
          )
          chosen_bands=(complete+partial)[:8]
          wanted={
              n for b in chosen_bands for n in range(b,b+8)
          }

          files=[
              r for r in indexed[(actor,pak)]
              if r["sub"] in wanted
          ]
          files.sort(key=lambda r:(r["sub"],r["offset"]))

          package=Path(pak)
          if not package.parts or package.parts[0]!="outer":
              raise RuntimeError("Unexpected source package path")

          archive_path=package.relative_to("outer").as_posix()

          selection={
              "sprite_id":actor,
              "external_name_candidates":sorted(names[actor]),
              "name_verified":False,
              "pak":pak,
              "archive_path":archive_path,
              "package_priority_verified":False,
              "complete_bands_in_package":len(complete),
              "four_complete_bands_available":len(complete)>=4,
              "selected_bands":[
                  {
                      "base":b,
                      "complete":len(groups[b])==8,
                      "present":len(groups[b])
                  }
                  for b in chosen_bands
              ],
              "source_files":files
          }

          (OUT/"selection_v16.json").write_text(
              json.dumps(selection,ensure_ascii=False,indent=2),
              encoding="utf-8"
          )
          (OUT/"selected_package.txt").write_text(
              archive_path+"\n",encoding="utf-8"
          )

          print("=== V16 SELECTED MONSTER ===")
          print(json.dumps({
              k:v for k,v in selection.items() if k!="source_files"
          },ensure_ascii=False,indent=2))
          print("Indexed SPR files selected:",len(files))
          PY

      - name: Download original client archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Sanctuary.of.Aden.-.Copy.*" \
            --dir downloads
          python3 - <<'PY'
          from pathlib import Path
          root=Path("downloads")
          base="Sanctuary.of.Aden.-.Copy"
          expected=[f"{base}.z{i:02d}" for i in range(1,46)]
          expected.append(base+".zip")
          missing=[n for n in expected if not (root/n).is_file()]
          if missing:
              raise RuntimeError("Missing archive parts: "+str(missing))
          print("Verified archive parts:",len(expected))
          PY

      - name: Extract selected original Sprite PAK
        shell: bash
        run: |
          set -euo pipefail
          archive="downloads/Sanctuary.of.Aden.-.Copy.zip"
          package="$(cat reports/selected_package.txt)"
          7z x "$archive" "$package" \
            "-o${PWD}/client" -y \
            > reports/extraction_v16.log 2>&1
          test -s "client/$package"
          rm -rf downloads
          df -h .

      - name: Decode source SPR files into full motion atlases
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import hashlib
          import json
          import math
          import struct
          from collections import defaultdict
          from pathlib import Path
          from PIL import Image

          ROOT=Path.cwd()
          OUT=ROOT/"reports"
          SITE=OUT/"site"
          SHEETS=SITE/"sheets"
          SHEETS.mkdir(parents=True,exist_ok=True)

          selection=json.loads(
              (OUT/"selection_v16.json").read_text(encoding="utf-8")
          )
          actor=selection["sprite_id"]
          pak=ROOT/"client"/selection["archive_path"]

          MAX_FRAMES=128
          MAX_DIMENSION=1000
          MAX_ATLAS_PIXELS=10000000

          class Reader:
              def __init__(self,data):
                  self.data=data
                  self.pos=0

              def read(self,fmt):
                  size=struct.calcsize(fmt)
                  if self.pos+size>len(self.data):
                      raise ValueError("Truncated SPR structure")
                  value=struct.unpack_from(fmt,self.data,self.pos)
                  self.pos+=size
                  return value[0] if len(value)==1 else value

              def decode(self):
                  count=self.read("<B")
                  palette=None

                  if count==255:
                      n=self.read("<B") or 256
                      palette=[self.read("<H") for _ in range(n)]
                      count=self.read("<B")

                  if not 1<=count<=MAX_FRAMES:
                      raise ValueError("Unsupported frame count "+str(count))

                  descriptions=[]
                  for _ in range(count):
                      self.read("<hhhh")
                      self.read("<HH")
                      n=self.read("<H")
                      if n>1500:
                          raise ValueError("Excessive SPR blocks")
                      blocks=[self.read("<bbBH") for _ in range(n)]
                      descriptions.append(blocks)

                  nblocks=self.read("<i")
                  if not 0<=nblocks<=20000:
                      raise ValueError("Invalid block table")

                  offsets=[self.read("<i") for _ in range(nblocks)]
                  self.read("<i")
                  base=self.pos

                  used={
                      block[3]
                      for frame in descriptions
                      for block in frame
                  }
                  if any(i>=nblocks for i in used):
                      raise ValueError("Invalid block reference")

                  decoded={}

                  for block_id in sorted(used):
                      position=base+offsets[block_id]
                      if position<base or position+4>len(self.data):
                          raise ValueError("Invalid pixel offset")

                      def byte():
                          nonlocal position
                          if position>=len(self.data):
                              raise ValueError("Truncated SPR pixels")
                          value=self.data[position]
                          position+=1
                          return value

                      sx=byte()
                      sy=byte()
                      byte()
                      line_count=byte()
                      pixels=[]

                      for line in range(line_count):
                          x=sx
                          for _ in range(byte()):
                              x+=byte()//2
                              for _ in range(byte()):
                                  if palette is None:
                                      color=byte()|(byte()<<8)
                                  else:
                                      index=byte()
                                      if index>=len(palette):
                                          raise ValueError("Bad palette index")
                                      color=palette[index]

                                  if x>=24 or sy+line>=24:
                                      raise ValueError("Bad block coordinate")

                                  if color!=32768:
                                      pixels.append((x,sy+line,color))
                                  x+=1

                      decoded[block_id]=pixels

                  images=[]

                  for blocks in descriptions:
                      if not blocks:
                          images.append(None)
                          continue

                      placements=[]
                      for a,b,kind,block_id in blocks:
                          adjusted=a-1 if a<0 else a
                          half=int(adjusted/2)
                          placements.append((
                              24*(b+a-half),
                              12*(b-half),
                              block_id
                          ))

                      minx=min(x for x,y,i in placements)
                      miny=min(y for x,y,i in placements)
                      maxx=max(x+24 for x,y,i in placements)
                      maxy=max(y+24 for x,y,i in placements)

                      width=maxx-minx
                      height=maxy-miny

                      if not (
                          1<=width<=MAX_DIMENSION
                          and 1<=height<=MAX_DIMENSION
                      ):
                          raise ValueError("Oversized sprite frame")

                      image=Image.new(
                          "RGBA",(width,height),(0,0,0,0)
                      )
                      pixels=image.load()

                      for x,y,block_id in placements:
                          for px,py,color in decoded[block_id]:
                              pixels[
                                  x+px-minx,
                                  y+py-miny
                              ]=(
                                  ((color>>10)&31)*255//31,
                                  ((color>>5)&31)*255//31,
                                  (color&31)*255//31,
                                  255
                              )

                      images.append(image)

                  return images

          def save_atlas(images,path):
              visible=[im for im in images if im is not None]
              if not visible:
                  raise ValueError("No visible frames")

              cw=max(im.width for im in visible)
              ch=max(im.height for im in visible)
              cols=min(4,len(images))
              rows=math.ceil(len(images)/cols)

              if cw*ch*cols*rows>MAX_ATLAS_PIXELS:
                  raise ValueError("Atlas exceeds pixel limit")

              atlas=Image.new(
                  "RGBA",(cw*cols,ch*rows),(0,0,0,0)
              )

              for index,image in enumerate(images):
                  if image is None:
                      continue
                  x=(index%cols)*cw+(cw-image.width)//2
                  y=(index//cols)*ch+(ch-image.height)//2
                  atlas.alpha_composite(image,(x,y))

              path.parent.mkdir(parents=True,exist_ok=True)
              atlas.save(path,optimize=True)

              return {
                  "frames":len(images),
                  "cols":cols,
                  "cellW":cw,
                  "cellH":ch,
                  "path":path.relative_to(SITE).as_posix()
              }

          output=[]
          errors=[]
          seen=set()

          with pak.open("rb") as source:
              for row in selection["source_files"]:
                  sub=int(row["sub"])
                  if sub in seen:
                      continue
                  seen.add(sub)

                  try:
                      size=int(row["bytes"])
                      if not 0<size<=4194304:
                          raise ValueError("Invalid SPR file size")
                      if not row["sha256"]:
                          raise ValueError("Missing V2 SHA256")

                      source.seek(int(row["offset"]))
                      data=source.read(size)

                      if len(data)!=size:
                          raise ValueError("Short PAK read")

                      digest=hashlib.sha256(data).hexdigest()

                      if digest!=row["sha256"]:
                          raise ValueError("SHA256 mismatch")

                      frames=Reader(data).decode()
                      target=SHEETS/(
                          f"{actor}-{sub}_{digest[:12]}.png"
                      )
                      info=save_atlas(frames,target)

                      output.append({
                          "actor":actor,
                          "sub":sub,
                          "package":Path(selection["pak"]).name,
                          "sha256":digest,
                          **info
                      })

                  except Exception as exc:
                      errors.append({
                          "sprite_id":actor,
                          "subid":sub,
                          "reason":str(exc)
                      })

          available={row["sub"] for row in output}
          groups=[]

          for group in selection["selected_bands"]:
              base=group["base"]
              missing=[
                  base+i for i in range(8)
                  if base+i not in available
              ]
              groups.append({
                  "base":base,
                  "complete":len(missing)==0,
                  "present":8-len(missing),
                  "missing":missing
              })

          groups.sort(key=lambda g:(not g["complete"],g["base"]))

          def save_csv(name,rows,fields):
              with (OUT/name).open(
                  "w",encoding="utf-8-sig",newline=""
              ) as file:
                  writer=csv.DictWriter(
                      file,fieldnames=fields,extrasaction="ignore"
                  )
                  writer.writeheader()
                  writer.writerows(rows)

          save_csv(
              "01_extracted_original_spr.csv",
              output,
              [
                  "actor","sub","package","sha256",
                  "frames","cols","cellW","cellH","path"
              ]
          )
          save_csv(
              "02_spr_extraction_errors.csv",
              errors,["sprite_id","subid","reason"]
          )

          manifest={
              "version":"V16",
              "spriteId":actor,
              "externalNames":selection["external_name_candidates"],
              "sourcePak":selection["pak"],
              "sourceVerifiedBySHA256":True,
              "sourceActionDefinitionVerified":False,
              "originalDirectionMappingVerified":False,
              "originalTimingVerified":False,
              "originalMonsterNameVerified":False,
              "groups":groups,
              "sprites":sorted(output,key=lambda r:r["sub"])
          }

          (OUT/"manifest_v16.json").write_text(
              json.dumps(manifest,ensure_ascii=False,indent=2),
              encoding="utf-8"
          )

          print("=== V16 SPR EXTRACTION ===")
          print(json.dumps({
              "sprite_id":actor,
              "original_spr_rendered":len(output),
              "extraction_errors":len(errors),
              "available_banks":len(groups),
              "complete_eight_direction_banks":sum(
                  g["complete"] for g in groups
              )
          },ensure_ascii=False,indent=2))

          if not output:
              raise SystemExit("No original SPR frames decoded")
          PY

      - name: Generate four simultaneous motion animations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          ROOT=Path.cwd()
          REPORT=ROOT/"reports"
          SITE=REPORT/"site"

          manifest=json.loads(
              (REPORT/"manifest_v16.json").read_text(
                  encoding="utf-8"
              )
          )

          complete=[
              group["base"]
              for group in manifest["groups"]
              if group["complete"]
          ]
          partial=[
              group["base"]
              for group in manifest["groups"]
              if not group["complete"]
          ]
          all_banks=complete+partial

          actions=["wait","walk","attack","death"]
          defaults={
              action:all_banks[i] if i<len(all_banks) else None
              for i,action in enumerate(actions)
          }

          html=r'''<!doctype html>
          <html lang="ko">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Sanctuary V16 Four Monster Motions</title>
          <style>
          :root{font-family:system-ui,sans-serif;color-scheme:dark;background:#101722;color:#edf4fc}
          *{box-sizing:border-box}
          body{max-width:1150px;margin:auto;padding:12px}
          h1{font-size:1.35rem;margin:8px 0}
          h2{font-size:1rem;margin:16px 0 9px}
          p{font-size:.82rem;color:#b5c9dc;line-height:1.5}
          .warning{color:#ffd099}
          .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:12px 0}
          label{display:flex;flex-direction:column;gap:5px;font-size:.79rem}
          select,input,button{font:inherit;background:#26394d;color:#fff;border:1px solid #536d87;border-radius:8px;padding:9px;min-width:0}
          button{cursor:pointer;touch-action:manipulation}
          .active{border-color:#a1e0ff;background:#35638a}
          .motions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
          .panel{background:#1a2737;border:1px solid #374e65;border-radius:10px;padding:9px;min-width:0}
          .panel h2{margin:0 0 8px}
          canvas{display:block;width:100%;aspect-ratio:1;background:#25364a;image-rendering:pixelated;border-radius:6px}
          .motion-controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;margin-top:8px;align-items:end}
          .meta{font-size:.72rem;color:#adc6dc;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;margin-top:7px;min-height:50px}
          .confirm{display:flex;flex-direction:row;align-items:center;gap:6px;margin-top:7px}
          .confirm input{width:17px;height:17px}
          .directions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
          .direction-card{border:1px solid #3b526b;background:#1b2b3c;border-radius:8px;padding:5px;min-width:0}
          .direction-card canvas{width:100%}
          .direction-label{font-size:.7rem;color:#c9daeb;margin-bottom:4px}
          .info{font-size:.78rem;color:#c8d9ed;white-space:pre-wrap;line-height:1.6}
          .actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
          .actions button{flex:1}
          @media(max-width:550px){.motions{gap:7px}.panel{padding:6px}.motion-controls{grid-template-columns:1fr}.motions h2{font-size:.92rem}}
          </style>
          </head>
          <body>
          <h1>Sanctuary V16 · 몬스터 4대 모션</h1>
          <p id="identity"></p>
          <p class="warning">네 화면은 원본 SPR에서 추출한 서로 다른 모션 묶음의 후보입니다. 원본 액션 정의가 확인되지 않았으므로 동작 이름은 육안으로 검증해야 합니다.</p>
          <div class="toolbar">
          <label>방향 번호<select id="direction"></select></label>
          <label>방향 시작 오프셋<select id="rotation"></select></label>
          <label>방향 순서<select id="reverse"><option value="0">기본 순서</option><option value="1">역순</option></select></label>
          <button id="pause">전체 일시정지</button>
          <button id="previous">이전 프레임</button>
          <button id="next">다음 프레임</button>
          </div>
          <div class="motions" id="motions"></div>
          <h2>8방향 원본 동시 확인</h2>
          <label>비교할 동작<select id="inspect"><option value="wait">정지</option><option value="walk">이동</option><option value="attack">공격</option><option value="death">사망</option></select></label>
          <div class="directions" id="directionGrid"></div>
          <div class="actions">
          <button id="export">4대 모션 매핑 JSON 저장</button>
          </div>
          <div class="panel info" id="summary"></div>
          <script type="application/json" id="inventory">__INVENTORY__</script>
          <script>__SCRIPT__</script>
          </body>
          </html>'''

          script=r'''
          'use strict';

          const DATA=JSON.parse(document.getElementById('inventory').textContent);
          const $=id=>document.getElementById(id);
          const ACTIONS=['wait','walk','attack','death'];
          const LABELS={wait:'정지',walk:'이동',attack:'공격',death:'사망'};
          const LOOP={wait:true,walk:true,attack:false,death:false};
          const INDEX=new Map(DATA.sprites.map(x=>[x.sub,x]));
          const CACHE=new Map();
          const CONTROLS={};
          const START={};
          const FROZEN={};
          const VALIDATED={};
          let paused=false;
          let previousTick=0;

          function addOption(select,value,label){
            const o=document.createElement('option');
            o.value=String(value);
            o.textContent=label;
            select.append(o);
          }

          function nowMs(){return performance.now()}

          function currentDirection(){
            return Number($('direction').value);
          }

          function spriteSub(base,direction){
            const reverse=$('reverse').value==='1';
            const rotation=Number($('rotation').value);
            const mapped=reverse?(8-direction)%8:direction;
            return base+(mapped+rotation)%8;
          }

          function findSprite(action,direction){
            const base=CONTROLS[action].bank.value;
            if(base==='')return null;
            return INDEX.get(spriteSub(Number(base),direction))||null;
          }

          function getImage(row){
            if(!row)return null;
            if(!CACHE.has(row.path)){
              const img=new Image();
              img.onload=()=>draw(nowMs());
              img.src=DATA.assets?.[row.path]||row.path;
              CACHE.set(row.path,img);
            }
            return CACHE.get(row.path);
          }

          function frameNumber(action,row,t){
            if(!row)return 0;
            if(paused){
              const value=FROZEN[action]||0;
              return LOOP[action]?value%row.frames:Math.min(value,row.frames-1);
            }
            const interval=Number(CONTROLS[action].interval.value);
            const raw=Math.max(0,Math.floor((t-START[action])/interval));
            return LOOP[action]?raw%row.frames:Math.min(raw,row.frames-1);
          }

          function paint(canvas,action,direction,t){
            const ctx=canvas.getContext('2d');
            ctx.clearRect(0,0,canvas.width,canvas.height);
            const row=findSprite(action,direction);
            if(!row){
              ctx.font='15px system-ui';
              ctx.fillStyle='#b5c9dd';
              ctx.textAlign='center';
              ctx.fillText('모션 미지정 또는 SPR 없음',canvas.width/2,canvas.height/2);
              return {row:null,frame:0};
            }
            const img=getImage(row);
            const frame=frameNumber(action,row,t);
            if(!img||!img.complete||!img.naturalWidth){
              return {row,frame};
            }
            const sx=(frame%row.cols)*row.cellW;
            const sy=Math.floor(frame/row.cols)*row.cellH;
            const scale=Math.min(
              3,
              canvas.width/row.cellW,
              canvas.height/row.cellH
            );
            const w=row.cellW*scale;
            const h=row.cellH*scale;
            ctx.imageSmoothingEnabled=false;
            ctx.drawImage(
              img,sx,sy,row.cellW,row.cellH,
              (canvas.width-w)/2,
              canvas.height-h-10,
              w,h
            );
            return {row,frame};
          }

          function resetMotion(action){
            START[action]=nowMs();
            FROZEN[action]=0;
            CONTROLS[action].confirmed.checked=false;
            VALIDATED[action]=false;
            updateSummary();
          }

          function buildMotions(){
            const root=$('motions');
            root.replaceChildren();

            for(const action of ACTIONS){
              const panel=document.createElement('section');
              panel.className='panel';
              panel.innerHTML=`
                <h2>${LABELS[action]}</h2>
                <canvas width="280" height="280"></canvas>
                <div class="motion-controls">
                  <label>원본 SPR 8슬롯 묶음<select class="bank"></select></label>
                  <button class="restart">다시 재생</button>
                  <label>검사용 프레임 간격
                    <select class="interval">
                      <option value="80">80 ms</option>
                      <option value="120">120 ms</option>
                      <option value="160">160 ms</option>
                      <option value="200" selected>200 ms</option>
                      <option value="260">260 ms</option>
                      <option value="350">350 ms</option>
                    </select>
                  </label>
                </div>
                <label class="confirm">
                  <input type="checkbox" class="confirmed">
                  육안으로 동작 확인
                </label>
                <div class="meta"></div>`;

              const bank=panel.querySelector('.bank');
              addOption(bank,'','미지정');

              for(const group of DATA.groups){
                addOption(
                  bank,
                  group.base,
                  `${group.base}~${group.base+7} · ${group.present}/8`
                );
              }

              const initial=DATA.defaults[action];
              if(initial!==null && initial!==undefined){
                bank.value=String(initial);
              }

              CONTROLS[action]={
                canvas:panel.querySelector('canvas'),
                bank,
                interval:panel.querySelector('.interval'),
                restart:panel.querySelector('.restart'),
                confirmed:panel.querySelector('.confirmed'),
                meta:panel.querySelector('.meta')
              };

              START[action]=nowMs();
              FROZEN[action]=0;
              VALIDATED[action]=false;

              bank.onchange=()=>resetMotion(action);
              CONTROLS[action].interval.onchange=()=>resetMotion(action);
              CONTROLS[action].restart.onclick=()=>{
                resetMotion(action);
                if(paused)FROZEN[action]=0;
              };
              CONTROLS[action].confirmed.onchange=()=>{
                VALIDATED[action]=CONTROLS[action].confirmed.checked;
                updateSummary();
              };

              root.append(panel);
            }
          }

          function buildDirections(){
            for(let i=0;i<8;i++){
              addOption($('direction'),i,`방향 ${i}`);
              addOption($('rotation'),i,String(i));
            }
            $('direction').value='0';
            $('rotation').value='0';

            const grid=$('directionGrid');
            for(let i=0;i<8;i++){
              const card=document.createElement('div');
              card.className='direction-card';
              const label=document.createElement('div');
              label.className='direction-label';
              label.textContent='방향 '+i;
              const canvas=document.createElement('canvas');
              canvas.width=180;
              canvas.height=180;
              canvas.dataset.direction=String(i);
              card.append(label,canvas);
              card.onclick=()=>{
                $('direction').value=String(i);
                draw(nowMs());
              };
              grid.append(card);
            }
          }

          function draw(t){
            const direction=currentDirection();

            for(const action of ACTIONS){
              const c=CONTROLS[action];
              const result=paint(c.canvas,action,direction,t);
              const row=result.row;
              const base=c.bank.value;

              c.meta.textContent=row
                ?`서브 ID ${row.sub} · 프레임 ${result.frame+1}/${row.frames}
          원본 SHA ${row.sha256.slice(0,16)} · ${LOOP[action]?'반복':'마지막 프레임 유지'}
          현재 배정: ${base}~${Number(base)+7} · 원본 액션 미확정`
                :'선택한 방향에 해당하는 원본 SPR이 없습니다.';
            }

            const inspected=$('inspect').value;
            document.querySelectorAll('#directionGrid canvas').forEach(canvas=>{
              paint(canvas,inspected,Number(canvas.dataset.direction),t);
            });
          }

          function updateSummary(){
            const lines=[
              'SPR ID: '+DATA.spriteId,
              '원본 PAK: '+DATA.sourcePak,
              '외부 참고 이름: '+(DATA.externalNames.join(' / ')||'없음'),
              '원본 액션 정의: 미확정',
              '방향의 실제 방위 대응: 미확정',
              ''
            ];
            for(const action of ACTIONS){
              const bank=CONTROLS[action].bank.value;
              const missing=[];
              for(let dir=0;dir<8;dir++){
                if(!findSprite(action,dir))missing.push(dir);
              }
              lines.push(
                `${LABELS[action]}: ${bank===''?'미지정':bank+'~'+(Number(bank)+7)} · `+
                `누락 방향 ${missing.length} · `+
                `${VALIDATED[action]?'사용자 육안 확인':'미확인'}`
              );
            }
            $('summary').textContent=lines.join('\n');
          }

          function exportMapping(){
            const motions={};
            const used=[];

            for(const action of ACTIONS){
              const c=CONTROLS[action];
              const base=c.bank.value;
              const dirs=[];

              for(let i=0;i<8;i++){
                const row=findSprite(action,i);
                dirs.push({
                  direction:i,
                  subId:row?.sub??null,
                  sha256:row?.sha256??null,
                  frameCount:row?.frames??0,
                  sheet:row?.path??null
                });
              }

              if(base!=='')used.push(base);

              motions[action]={
                sourceBank:base===''?null:Number(base),
                frameIntervalMs:Number(c.interval.value),
                loop:LOOP[action],
                holdLastFrame:!LOOP[action],
                userVisualConfirmed:VALIDATED[action],
                directions:dirs
              };
            }

            const result={
              schema:'sanctuary-four-motions-v16',
              spriteId:DATA.spriteId,
              referenceName:DATA.externalNames,
              sourcePak:DATA.sourcePak,
              sourceOriginalSPR:true,
              originalActionDefinitionVerified:false,
              originalFrameTimingVerified:false,
              actualCompassOrientationVerified:false,
              directionRotation:Number($('rotation').value),
              directionReversed:$('reverse').value==='1',
              fourDistinctBanks:used.length===4&&new Set(used).size===4,
              motions
            };

            const blob=new Blob(
              [JSON.stringify(result,null,2)],
              {type:'application/json'}
            );
            const url=URL.createObjectURL(blob);
            const link=document.createElement('a');
            link.href=url;
            link.download=`sanctuary-monster-${DATA.spriteId}-four-motions.json`;
            link.click();
            setTimeout(()=>URL.revokeObjectURL(url),1000);
          }

          function boot(){
            $('identity').textContent=
              '선정 SPR ID '+DATA.spriteId+
              ' · 외부 참고 이름: '+(DATA.externalNames.join(', ')||'미확인')+
              ' · 추출 SPR '+DATA.sprites.length+'개';

            buildDirections();
            buildMotions();

            $('direction').onchange=()=>draw(nowMs());
            $('rotation').onchange=()=>{
              for(const action of ACTIONS)VALIDATED[action]=false;
              for(const action of ACTIONS)CONTROLS[action].confirmed.checked=false;
              updateSummary();
            };
            $('reverse').onchange=$('rotation').onchange;
            $('inspect').onchange=()=>draw(nowMs());

            $('pause').onclick=()=>{
              const now=nowMs();
              if(!paused){
                for(const action of ACTIONS){
                  const row=findSprite(action,currentDirection());
                  FROZEN[action]=row?frameNumber(action,row,now):0;
                }
                paused=true;
              }else{
                for(const action of ACTIONS){
                  START[action]=now-FROZEN[action]*
                    Number(CONTROLS[action].interval.value);
                }
                paused=false;
              }
              $('pause').textContent=paused?'전체 재생':'전체 일시정지';
            };

            function step(amount){
              if(!paused)$('pause').click();
              for(const action of ACTIONS){
                FROZEN[action]=Math.max(0,FROZEN[action]+amount);
              }
              draw(nowMs());
            }

            $('previous').onclick=()=>step(-1);
            $('next').onclick=()=>step(1);
            $('export').onclick=exportMapping;
            updateSummary();

            function tick(t){
              if(t-previousTick>=40){
                previousTick=t;
                draw(t);
              }
              requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
          }

          boot();
          '''

          inventory={
              **manifest,
              "defaults":defaults
          }

          def write_page(destination,sprites,groups,embedded):
              assets={}
              if embedded:
                  for row in sprites:
                      path=SITE/row["path"]
                      assets[row["path"]]=(
                          "data:image/png;base64,"
                          +base64.b64encode(path.read_bytes()).decode("ascii")
                      )

              data={
                  **inventory,
                  "sprites":sprites,
                  "groups":groups,
                  "assets":assets
              }

              encoded=json.dumps(
                  data,ensure_ascii=False,separators=(",",":")
              ).replace("<","\\u003c")

              destination.write_text(
                  html.replace("__INVENTORY__",encoded)
                      .replace("__SCRIPT__",script),
                  encoding="utf-8"
              )

          (SITE/"app.js").write_text(
              script,encoding="utf-8"
          )

          write_page(
              SITE/"index.html",
              manifest["sprites"],
              manifest["groups"],
              False
          )

          standalone_banks={
              b for b in defaults.values() if b is not None
          }
          standalone_sprites=[
              row for row in manifest["sprites"]
              if row["sub"]//8*8 in standalone_banks
          ]
          standalone_groups=[
              group for group in manifest["groups"]
              if group["base"] in standalone_banks
          ]

          write_page(
              REPORT/"V16-Monster-Four-Motions-Standalone.html",
              standalone_sprites,
              standalone_groups,
              True
          )

          full_banks=sum(g["complete"] for g in manifest["groups"])

          summary={
              "version":"V16",
              "phase":"FOUR_ORIGINAL_SPR_MOTION_HTML",
              "selected_sprite_id":manifest["spriteId"],
              "original_spr_sheets":len(manifest["sprites"]),
              "candidate_banks":len(manifest["groups"]),
              "complete_eight_direction_banks":full_banks,
              "four_distinct_default_banks":len(standalone_banks)==4,
              "four_complete_direction_banks":full_banks>=4,
              "standalone_spr_sheets":len(standalone_sprites),
              "wait_walk_attack_death_panels":4,
              "attack_ends_at_final_frame":True,
              "death_holds_final_frame":True,
              "original_motion_identity_verified":False,
              "original_animation_timing_verified":False,
              "manual_review_supported":True,
              "build_web_modified":False
          }

          (REPORT/"summary_v16.json").write_text(
              json.dumps(summary,ensure_ascii=False,indent=2),
              encoding="utf-8"
          )

          print("=== V16 SUMMARY ===")
          print(json.dumps(summary,ensure_ascii=False,indent=2))

          path=os.environ.get("GITHUB_STEP_SUMMARY")
          if path:
              with open(path,"a",encoding="utf-8") as f:
                  f.write("## V16 Four Monster Motions\n\n")
                  for key,value in summary.items():
                      f.write(f"- {key}: {value}\n")
          PY

      - name: Validate animation HTML and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check reports/site/app.js
          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path("reports")
          data=json.loads(
              (root/"manifest_v16.json").read_text(encoding="utf-8")
          )
          summary=json.loads(
              (root/"summary_v16.json").read_text(encoding="utf-8")
          )

          required=[
              root/"site/index.html",
              root/"site/app.js",
              root/"V16-Monster-Four-Motions-Standalone.html",
              root/"01_extracted_original_spr.csv",
              root/"02_spr_extraction_errors.csv"
          ]

          for path in required:
              if not path.is_file() or path.stat().st_size==0:
                  raise RuntimeError("Missing output: "+str(path))

          for sprite in data["sprites"]:
              file=root/"site"/sprite["path"]
              if not file.is_file():
                  raise RuntimeError("Missing PNG: "+str(file))
              with file.open("rb") as f:
                  if f.read(8)!=b"\x89PNG\r\n\x1a\n":
                      raise RuntimeError("Invalid PNG: "+str(file))

          html=(root/"V16-Monster-Four-Motions-Standalone.html").read_text(
              encoding="utf-8"
          )

          if "__SCRIPT__" in html or "__INVENTORY__" in html:
              raise RuntimeError("Unresolved HTML template")

          print("V16 PNG files:",len(data["sprites"]))
          print("Eight-direction banks:",summary["complete_eight_direction_banks"])
          print("Four complete banks:",summary["four_complete_direction_banks"])
          print("HTML validation passed")
          PY

      - name: Upload V16 original four-motion HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-V16-Monster-Four-Motions
          path: reports/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
