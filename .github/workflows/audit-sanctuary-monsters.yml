
name: Sanctuary of Aden Mobile Motion Sandbox V15

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/audit-sanctuary-monsters.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: sanctuary-monster-audit
  cancel-in-progress: false

jobs:
  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Prepare directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previous/v13 previous/v14
          mkdir -p reports/site/assets
          node --version
          python3 --version

      - name: Restore original sprite evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh run download 38874270054 \
            --repo "$GITHUB_REPOSITORY" \
            --name Sanctuary-V13-Expanded-Monster-Motion-Lab \
            --dir previous/v13

          gh run download 38908557785 \
            --repo "$GITHUB_REPOSITORY" \
            --name Sanctuary-V14-Interactive-Motion-Mapping \
            --dir previous/v14

          test -s previous/v13/01_selected_sprite_ids.csv
          test -s previous/v13/02_all_rendered_sprite_images.csv
          test -s previous/v14/04_unassigned_motion_candidates.json
          test -s previous/v14/05_summary_v14.json
          test -d previous/v14/viewer/sheets

      - name: Build motion sandbox and mapping adapter
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import csv
          import json
          import os
          import shutil
          from collections import defaultdict
          from pathlib import Path

          ROOT = Path.cwd()
          V13 = ROOT / "previous/v13"
          V14 = ROOT / "previous/v14"
          REPORT = ROOT / "reports"
          SITE = REPORT / "site"

          def load_csv(path):
              with path.open(
                  encoding="utf-8-sig",
                  newline=""
              ) as file:
                  return list(csv.DictReader(file))

          source = load_csv(
              V13 / "02_all_rendered_sprite_images.csv"
          )

          selected = load_csv(
              V13 / "01_selected_sprite_ids.csv"
          )

          motion_groups = json.loads(
              (
                  V14 /
                  "04_unassigned_motion_candidates.json"
              ).read_text(encoding="utf-8")
          )["reviewGroups"]

          v14_summary = json.loads(
              (
                  V14 / "05_summary_v14.json"
              ).read_text(encoding="utf-8")
          )

          if len(source) != 1095:
              raise SystemExit(
                  "Unexpected V13 sprite inventory count"
              )

          if len(source) != v14_summary[
              "validated_sprite_sheets"
          ]:
              raise SystemExit(
                  "V13 and V14 sprite evidence mismatch"
              )

          if len(motion_groups) != v14_summary[
              "package_specific_bands"
          ]:
              raise SystemExit(
                  "V14 motion group count mismatch"
              )

          shutil.copytree(
              V14 / "viewer/sheets",
              SITE / "assets/sheets",
              dirs_exist_ok=True
          )

          metadata = {}

          for row in selected:
              actor = int(row["sprite_id"])

              metadata[str(actor)] = {
                  "referenceName": row[
                      "external_npc_names"
                  ],
                  "selection": row["selection"],
                  "identityVerified": False
              }

          entries = []

          for row in source:
              path = Path(row["sheet"])

              if (
                  not path.parts
                  or path.parts[0] != "sheets"
                  or path.is_absolute()
                  or ".." in path.parts
              ):
                  raise RuntimeError(
                      "Invalid sprite asset path"
                  )

              image_path = SITE / "assets" / path

              if not image_path.is_file():
                  raise RuntimeError(
                      "Missing original PNG: "
                      + str(path)
                  )

              with image_path.open("rb") as file:
                  signature = file.read(8)

              if signature != b"\x89PNG\r\n\x1a\n":
                  raise RuntimeError(
                      "Invalid original PNG header"
                  )

              entries.append({
                  "actor": int(row["actor"]),
                  "sub": int(row["sub"]),
                  "package": row["package"],
                  "sha256": row["sha256"],
                  "frames": int(row["frames"]),
                  "renderedFrames": int(
                      row["renderedFrames"]
                  ),
                  "cols": int(row["cols"]),
                  "cellW": int(row["cellW"]),
                  "cellH": int(row["cellH"]),
                  "sheet": path.as_posix(),
                  "asset": (
                      "assets/" + path.as_posix()
                  ),
                  "origin": row["origin"]
              })

          entries.sort(
              key=lambda x: (
                  x["actor"],
                  x["package"],
                  x["sub"],
                  x["sha256"]
              )
          )

          actors = sorted({
              x["actor"] for x in entries
          })

          if len(actors) != 45:
              raise RuntimeError(
                  "V14 actor inventory mismatch"
              )

          adapter = r'''
          export function resolveSanctuaryMotion(
            mapping,
            inventory,
            spriteId,
            action,
            direction,
            elapsedMs
          ) {
            const assignment =
              mapping?.assignments?.[String(spriteId)]?.[action];

            if (!assignment) return null;

            if (
              !Number.isInteger(direction) ||
              direction < 0 ||
              direction > 7
            ) return null;

            const rotated = assignment.mirror
              ? (8 - direction) % 8
              : direction;

            const subId = assignment.base +
              (rotated + assignment.rotation) % 8;

            const expected = assignment.directionMap
              ?.find(x => x.engineDirection === direction);

            const sprite = inventory.entries.find(x =>
              x.actor === Number(spriteId) &&
              x.package === assignment.package &&
              x.sub === subId &&
              (!expected?.sha256 ||
                expected.sha256 === x.sha256)
            );

            if (!sprite) return null;

            const interval = Math.max(
              40,
              Number(assignment.intervalMs) || 200
            );

            const frame = Math.floor(
              Math.max(0, elapsedMs) / interval
            ) % sprite.renderedFrames;

            return {
              spriteId: Number(spriteId),
              action,
              engineDirection: direction,
              sourceSubId: subId,
              image: sprite.asset,
              imageSha256: sprite.sha256,
              frame,
              sourceX: (frame % sprite.cols) * sprite.cellW,
              sourceY: Math.floor(frame / sprite.cols) *
                sprite.cellH,
              width: sprite.cellW,
              height: sprite.cellH,
              intervalMs: interval,
              originalActionVerified: false,
              originalTimingVerified: false
            };
          }
          '''

          (REPORT / "sanctuary-motion-adapter.js").write_text(
              adapter.strip() + "\n",
              encoding="utf-8"
          )

          (SITE / "motion-manifest.json").write_text(
              json.dumps(
                  {
                      "version": "V15",
                      "assetSource": "V13_V14_VERIFIED_SPR",
                      "actors": actors,
                      "actorMetadata": metadata,
                      "entries": entries,
                      "groups": motion_groups,
                      "originalMotionMappingsVerified": False
                  },
                  ensure_ascii=False,
                  separators=(",", ":")
              ),
              encoding="utf-8"
          )

          (REPORT / "motion-mapping-template.json").write_text(
              json.dumps(
                  {
                      "version": "V15",
                      "kind": "USER_TESTED_MOTION_CANDIDATES",
                      "verification": {
                          "originalActionDefinition": False,
                          "originalDirection": False,
                          "originalTiming": False,
                          "packagePrecedence": False
                      },
                      "assignments": {}
                  },
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          html = r'''<!doctype html>
          <html lang="ko">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Sanctuary V15 Motion Sandbox</title>
          <style>
          :root{
            font-family:system-ui,sans-serif;
            color-scheme:dark;
            background:#101722;
            color:#edf4ff
          }
          *{box-sizing:border-box}
          body{
            max-width:1050px;
            margin:auto;
            padding:12px
          }
          h1{font-size:1.35rem}
          h2{font-size:1rem;margin:18px 0 9px}
          p{
            font-size:.82rem;
            color:#b6c9dc;
            line-height:1.5
          }
          .warning{color:#ffd098}
          .toolbar{
            display:grid;
            grid-template-columns:
              repeat(auto-fit,minmax(min(100%,170px),1fr));
            gap:8px
          }
          label{
            display:flex;
            flex-direction:column;
            gap:5px;
            font-size:.8rem
          }
          select,input,button{
            background:#26394e;
            color:#f2f7ff;
            border:1px solid #536c86;
            border-radius:8px;
            padding:10px;
            font:inherit;
            min-width:0
          }
          button{
            cursor:pointer;
            touch-action:manipulation
          }
          button.active{
            background:#37698b;
            border-color:#96ddff
          }
          .panel{
            border:1px solid #344c63;
            border-radius:10px;
            background:#192635;
            padding:10px;
            margin:12px 0
          }
          .game{
            width:100%;
            display:block;
            aspect-ratio:16/9;
            background:#213142;
            image-rendering:pixelated;
            border-radius:7px
          }
          .line{
            display:flex;
            flex-wrap:wrap;
            align-items:center;
            gap:8px;
            margin:9px 0
          }
          .line button{flex:1}
          .pad{
            display:grid;
            grid-template-columns:repeat(3,62px);
            grid-template-rows:repeat(3,51px);
            gap:5px;
            justify-content:center;
            margin:12px auto;
            touch-action:none
          }
          .pad button{
            padding:5px;
            font-size:1.05rem;
            touch-action:none
          }
          .grid{
            display:grid;
            grid-template-columns:
              repeat(auto-fill,minmax(130px,1fr));
            gap:8px
          }
          .card{
            background:#1b2b3c;
            border:1px solid #36516b;
            border-radius:8px;
            padding:6px;
            min-width:0
          }
          .card canvas{
            width:100%;
            aspect-ratio:1;
            background:#293b4f;
            image-rendering:pixelated
          }
          .small{
            font-size:.72rem;
            color:#b9cde0;
            overflow-wrap:anywhere
          }
          .info{
            font-size:.8rem;
            color:#cadcf0;
            white-space:pre-wrap;
            line-height:1.6;
            overflow-wrap:anywhere
          }
          .mapping{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:6px
          }
          .mapping button{padding:9px 5px}
          .file{
            display:block;
            width:100%;
            max-width:100%
          }
          @media(min-width:750px){
            .play-layout{
              display:grid;
              grid-template-columns:minmax(0,1fr) 210px;
              gap:12px
            }
            .pad{margin-top:8px}
          }
          </style>
          </head>
          <body>
          <h1>Sanctuary V15 · 모바일 모션 전투 테스트</h1>
          <p class="warning">
          원본 SPR 이미지를 사용하지만 원본 액션 정의는
          확보되지 않았습니다. 지정하지 않은 동작은
          검사용 후보를 재생하며, 타이밍과 전투 수치는
          테스트용입니다.
          </p>

          <h2>캐릭터와 모션 선택</h2>
          <div class="toolbar">
          <label>스프라이트 ID
          <select id="actor"></select>
          </label>
          <label>원본 PAK
          <select id="pak"></select>
          </label>
          <label>현재 지정할 동작
          <select id="action">
          <option value="idle">대기</option>
          <option value="walk">이동</option>
          <option value="attack">공격</option>
          <option value="hit">피격</option>
          <option value="death">사망</option>
          <option value="magic">마법</option>
          </select>
          </label>
          <label>서브 ID 8슬롯 그룹
          <select id="bank"></select>
          </label>
          <label>방향 시작번호
          <select id="rotation"></select>
          </label>
          <label>방향 순서
          <select id="reverse">
          <option value="0">정방향</option>
          <option value="1">역방향</option>
          </select>
          </label>
          <label>검사용 프레임 간격
          <select id="interval">
          <option value="80">80ms</option>
          <option value="120">120ms</option>
          <option value="160">160ms</option>
          <option value="200" selected>200ms</option>
          <option value="260">260ms</option>
          <option value="350">350ms</option>
          </select>
          </label>
          </div>

          <div class="panel">
          <div class="line">
          <button id="assign">현재 동작에 지정</button>
          <button id="clear">현재 동작 지정 해제</button>
          </div>
          <div class="info" id="mappingInfo"></div>
          </div>

          <h2>모바일 전투 검사</h2>
          <div class="play-layout">
          <div class="panel">
          <canvas id="game" class="game"
            width="720" height="405"></canvas>
          <div class="line">
          <button id="attack">공격</button>
          <button id="hit">피격</button>
          <button id="magic">마법</button>
          <button id="death">사망</button>
          <button id="revive">회복</button>
          </div>
          <div class="info" id="gameStatus"></div>
          </div>

          <div class="panel">
          <div class="pad" id="pad">
          <button data-dir="7">↖</button>
          <button data-dir="0">↑</button>
          <button data-dir="1">↗</button>
          <button data-dir="6">←</button>
          <button id="padAttack">⚔</button>
          <button data-dir="2">→</button>
          <button data-dir="5">↙</button>
          <button data-dir="4">↓</button>
          <button data-dir="3">↘</button>
          </div>
          <p>
          방향패드로 이동하고 공격 버튼으로
          모션을 시험합니다. 키보드는 WASD·방향키를
          지원합니다.
          </p>
          </div>
          </div>

          <h2>8방향 원본 이미지 비교</h2>
          <div class="grid" id="previews"></div>

          <h2>매핑 JSON 저장·불러오기</h2>
          <div class="panel">
          <div class="line">
          <button id="export">매핑 JSON 저장</button>
          </div>
          <label>V14 또는 V15 매핑 JSON 불러오기
          <input class="file" id="import"
            type="file" accept=".json,application/json">
          </label>
          <p>
          매핑은 현재 화면에서 지정한 후보입니다.
          다른 동작을 검증하려면 지정한 뒤 JSON으로
          저장하세요.
          </p>
          <div class="info" id="importStatus"></div>
          </div>

          <script type="application/json"
            id="inventory">__DATA__</script>
          __APP__
          </body>
          </html>'''

          js = r'''
          'use strict';

          const DB = JSON.parse(
            document.getElementById('inventory').textContent
          );

          const $ = id => document.getElementById(id);

          const ACTIONS = [
            'idle','walk','attack','hit','death','magic'
          ];

          const LABELS = {
            idle:'대기',
            walk:'이동',
            attack:'공격',
            hit:'피격',
            death:'사망',
            magic:'마법'
          };

          const ACTORS = DB.actors;
          const ENTRIES = DB.entries;
          const GROUPS = DB.groups;

          const index = new Map();
          const imageCache = new Map();

          const assignments = {};

          for(const row of ENTRIES){
            const key=[
              row.actor,row.package,row.sub
            ].join('|');

            if(!index.has(key))index.set(key,[]);
            index.get(key).push(row);
          }

          for(const values of index.values()){
            values.sort(
              (a,b)=>a.sha256.localeCompare(b.sha256)
            );
          }

          const state = {
            x:285,
            y:240,
            direction:4,
            keySet:new Set(),
            pointerDirection:null,
            oneShot:null,
            dead:false,
            motion:'idle',
            elapsed:0,
            last:performance.now(),
            targetHp:100,
            message:'대기'
          };

          function addOption(select,value,title){
            const item=document.createElement('option');
            item.value=String(value);
            item.textContent=title;
            select.append(item);
          }

          function selectedActor(){
            return Number($('actor').value);
          }

          function currentPackage(){
            return $('pak').value;
          }

          function currentAction(){
            return $('action').value;
          }

          function candidateConfig(){
            return {
              package:currentPackage(),
              base:Number($('bank').value),
              rotation:Number($('rotation').value),
              mirror:$('reverse').value==='1',
              intervalMs:Number($('interval').value)
            };
          }

          function lookup(actor,pack,sub){
            return index.get(
              [actor,pack,sub].join('|')
            )?.[0]||null;
          }

          function spriteSub(config,dir){
            const physical=config.mirror
              ?(8-dir)%8
              :dir;

            return config.base+
              (physical+config.rotation)%8;
          }

          function resolveRow(config,dir){
            if(!config)return null;

            return lookup(
              selectedActor(),
              config.package,
              spriteSub(config,dir)
            );
          }

          function mappedConfig(action){
            return assignments[
              String(selectedActor())
            ]?.[action]||null;
          }

          function activeConfig(action){
            return mappedConfig(action)||
              candidateConfig();
          }

          function isMapped(action){
            return Boolean(mappedConfig(action));
          }

          function actorLabel(actor){
            const name=DB.metadata[
              String(actor)
            ]?.referenceName||'';

            return String(actor)+(
              name?' · '+name.slice(0,45):''
            );
          }

          function buildActors(){
            $('actor').replaceChildren();

            ACTORS.forEach(id=>{
              addOption(
                $('actor'),id,actorLabel(id)
              );
            });

            if(ACTORS.includes(29)){
              $('actor').value='29';
            }

            buildPackages();
          }

          function buildPackages(preferred){
            const id=selectedActor();

            const packages=[
              ...new Set(
                ENTRIES.filter(x=>x.actor===id)
                  .map(x=>x.package)
              )
            ].sort();

            $('pak').replaceChildren();

            packages.forEach(name=>{
              addOption($('pak'),name,name);
            });

            if(packages.includes(preferred)){
              $('pak').value=preferred;
            }

            buildBanks();
          }

          function buildBanks(preferred){
            const groups=GROUPS.filter(g=>
              g.actor===selectedActor() &&
              g.package===currentPackage()
            ).sort(
              (a,b)=>b.reviewPriority-a.reviewPriority
            );

            $('bank').replaceChildren();

            for(const group of groups){
              addOption(
                $('bank'),
                group.base,
                `${group.base}~${group.end} · `+
                `${group.present}/8`
              );
            }

            if(groups.some(g=>g.base===Number(preferred))){
              $('bank').value=String(preferred);
            }

            drawPreviews();
            updateMappingInfo();
          }

          function applyConfig(config){
            if(!config)return;

            if($('pak').value!==config.package){
              buildPackages(config.package);
            }

            buildBanks(config.base);

            $('rotation').value=String(
              config.rotation
            );
            $('reverse').value=config.mirror?'1':'0';

            const available=[
              ...$('interval').options
            ].some(x=>Number(x.value)===config.intervalMs);

            if(available){
              $('interval').value=String(
                config.intervalMs
              );
            }

            drawPreviews();
          }

          function selectAction(action){
            $('action').value=action;

            applyConfig(mappedConfig(action));

            updateMappingInfo();
            drawPreviews();
          }

          function validateConfig(actor,action,raw){
            if(!ACTIONS.includes(action))return null;
            if(!ACTORS.includes(Number(actor)))return null;
            if(!raw||typeof raw!=='object')return null;

            const config={
              package:String(raw.package||''),
              base:Number(raw.base),
              rotation:Number(raw.rotation),
              mirror:Boolean(raw.mirror),
              intervalMs:Number(raw.intervalMs)
            };

            if(
              !Number.isInteger(config.base) ||
              !Number.isInteger(config.rotation) ||
              config.rotation<0 ||
              config.rotation>7 ||
              !Number.isFinite(config.intervalMs) ||
              config.intervalMs<40 ||
              config.intervalMs>1000
            )return null;

            if(!GROUPS.some(g=>
              g.actor===Number(actor) &&
              g.package===config.package &&
              g.base===config.base
            ))return null;

            const directionMap=[];

            for(let dir=0;dir<8;dir++){
              const sub=spriteSub(config,dir);
              const row=lookup(
                Number(actor),
                config.package,
                sub
              );

              const old=Array.isArray(raw.directionMap)
                ?raw.directionMap.find(
                  x=>x.engineDirection===dir
                )
                :null;

              if(
                old?.sha256 &&
                row?.sha256!==old.sha256
              )return null;

              directionMap.push({
                engineDirection:dir,
                sourceSubId:sub,
                sha256:row?.sha256||null,
                renderedFrames:row?.renderedFrames||0
              });
            }

            return {
              ...config,
              spriteId:Number(actor),
              action,
              directionMap,
              allDirectionsPresent:directionMap.every(
                x=>Boolean(x.sha256)
              ),
              mappingStatus:'USER_SELECTED_CANDIDATE',
              originalActionDefinitionVerified:false,
              originalFrameTimingVerified:false
            };
          }

          function saveAssignment(){
            const actor=selectedActor();
            const action=currentAction();

            const config=validateConfig(
              actor,action,candidateConfig()
            );

            if(!config){
              $('mappingInfo').textContent=
                '잘못된 모션 그룹 설정';
              return;
            }

            const key=String(actor);

            if(!assignments[key]){
              assignments[key]={};
            }

            assignments[key][action]=config;

            updateMappingInfo();
          }

          function clearAssignment(){
            const key=String(selectedActor());

            if(assignments[key]){
              delete assignments[key][currentAction()];
            }

            updateMappingInfo();
          }

          function updateMappingInfo(){
            const actor=selectedActor();
            const action=currentAction();
            const config=mappedConfig(action);
            const candidate=candidateConfig();

            const active=config||candidate;

            const missing=[];

            for(let dir=0;dir<8;dir++){
              if(!resolveRow(active,dir)){
                missing.push(dir);
              }
            }

            const mapped=Object.keys(
              assignments[String(actor)]||{}
            );

            $('mappingInfo').textContent=[
              'SPR ID: '+actor,
              '현재 동작: '+LABELS[action],
              '상태: '+(
                config?'지정한 후보':'미지정 · 검사용 후보'
              ),
              '서브 ID 그룹: '+active.base+
                '~'+(active.base+7),
              '누락 방향: '+(
                missing.length?missing.join(', '):'없음'
              ),
              '지정된 동작: '+(
                mapped.map(x=>LABELS[x]).join(', ')||
                '없음'
              ),
              '원본 액션 정의: 미확정'
            ].join('\n');
          }

          function loadImage(row){
            if(!row)return null;

            const src=row.asset;

            if(!imageCache.has(src)){
              const img=new Image();
              img.onload=drawPreviews;
              img.src=src;
              imageCache.set(src,img);
            }

            return imageCache.get(src);
          }

          function spriteFrame(
            ctx,row,elapsed,interval,
            x,y,maxWidth,maxHeight,
            oneShot
          ){
            if(!row)return false;

            const image=loadImage(row);

            if(
              !image ||
              !image.complete ||
              !image.naturalWidth
            )return false;

            const count=row.renderedFrames;

            if(count<1)return false;

            let frame=Math.floor(
              Math.max(0,elapsed)/interval
            );

            frame=oneShot
              ?Math.min(frame,count-1)
              :frame%count;

            const sx=(frame%row.cols)*row.cellW;
            const sy=Math.floor(frame/row.cols)*
              row.cellH;

            const scale=Math.min(
              2,
              maxWidth/row.cellW,
              maxHeight/row.cellH
            );

            const width=row.cellW*scale;
            const height=row.cellH*scale;

            ctx.imageSmoothingEnabled=false;

            ctx.drawImage(
              image,
              sx,sy,row.cellW,row.cellH,
              x-width/2,y-height,
              width,height
            );

            return true;
          }

          function drawPreviews(){
            $('previews').replaceChildren();

            const config=candidateConfig();

            for(let dir=0;dir<8;dir++){
              const sub=spriteSub(config,dir);
              const row=resolveRow(config,dir);

              const card=document.createElement('div');
              card.className='card';

              const caption=document.createElement('div');
              caption.className='small';
              caption.textContent=
                '방향 '+dir+' · 서브 ID '+sub;

              const canvas=document.createElement('canvas');
              canvas.width=160;
              canvas.height=160;
              canvas.dataset.direction=dir;

              const meta=document.createElement('div');
              meta.className='small';
              meta.textContent=row
                ?row.renderedFrames+'프레임 · '+
                  row.package
                :'해당 원본 없음';

              card.append(caption,canvas,meta);

              card.onclick=()=>{
                state.direction=dir;
                drawGame();
              };

              $('previews').append(card);
            }

            renderPreviews();
          }

          function renderPreviews(){
            const config=candidateConfig();

            document.querySelectorAll(
              '#previews canvas'
            ).forEach(canvas=>{
              const dir=Number(
                canvas.dataset.direction
              );

              const ctx=canvas.getContext('2d');
              ctx.clearRect(0,0,160,160);

              const row=resolveRow(config,dir);

              spriteFrame(
                ctx,row,state.elapsed,
                config.intervalMs,
                80,145,145,135,false
              );
            });
          }

          function keyVector(){
            let x=0;
            let y=0;

            const keys=state.keySet;

            if(keys.has('arrowleft')||keys.has('a')){
              x--;
            }
            if(keys.has('arrowright')||keys.has('d')){
              x++;
            }
            if(keys.has('arrowup')||keys.has('w')){
              y--;
            }
            if(keys.has('arrowdown')||keys.has('s')){
              y++;
            }

            if(state.pointerDirection!==null){
              const angle=state.pointerDirection*
                Math.PI/4-Math.PI/2;

              x+=Math.round(Math.cos(angle));
              y+=Math.round(Math.sin(angle));
            }

            if(x===0&&y===0){
              return {x:0,y:0,moving:false};
            }

            const length=Math.hypot(x,y);

            return {
              x:x/length,
              y:y/length,
              moving:true
            };
          }

          function vectorDirection(x,y){
            if(!x&&!y)return state.direction;

            const angle=Math.atan2(y,x);
            return (
              Math.round(
                (angle+Math.PI/2)/(Math.PI/4)
              )+8
            )%8;
          }

          function startOneShot(action){
            if(state.dead&&action!=='death')return;

            state.oneShot=action;
            state.motion=action;
            state.elapsed=0;
            state.message=LABELS[action]+' 입력';
          }

          function revive(){
            state.dead=false;
            state.oneShot=null;
            state.motion='idle';
            state.elapsed=0;
            state.targetHp=100;
            state.message='테스트 초기화';
          }

          function actorReset(){
            state.x=285;
            state.y=240;
            state.direction=4;
            state.elapsed=0;
            state.oneShot=null;
            state.dead=false;
            state.targetHp=100;
            state.message='캐릭터 변경';
          }

          function update(dt){
            const vector=keyVector();

            let motion='idle';

            if(state.dead){
              motion='death';
            }else if(state.oneShot){
              motion=state.oneShot;
            }else if(vector.moving){
              motion='walk';
            }

            if(motion!==state.motion){
              state.motion=motion;
              state.elapsed=0;
            }

            if(
              !state.dead &&
              !state.oneShot &&
              vector.moving
            ){
              state.direction=vectorDirection(
                vector.x,vector.y
              );

              state.x=Math.max(
                45,
                Math.min(
                  675,
                  state.x+vector.x*155*dt/1000
                )
              );

              state.y=Math.max(
                155,
                Math.min(
                  370,
                  state.y+vector.y*155*dt/1000
                )
              );
            }

            state.elapsed+=dt;

            const config=activeConfig(motion);
            const row=resolveRow(
              config,state.direction
            );

            if(
              state.oneShot &&
              state.oneShot!=='death'
            ){
              const duration=(
                row?.renderedFrames||4
              )*config.intervalMs;

              if(state.elapsed>=duration){
                if(state.oneShot==='attack'){
                  const distance=Math.hypot(
                    state.x-485,
                    state.y-240
                  );

                  if(distance<180){
                    state.targetHp=Math.max(
                      0,state.targetHp-10
                    );
                    state.message='공격 입력 테스트: 명중';
                  }else{
                    state.message='공격 입력 테스트: 거리 밖';
                  }
                }

                state.oneShot=null;
                state.elapsed=0;
              }
            }

            if(
              state.oneShot==='death' &&
              state.elapsed>=(
                (row?.renderedFrames||4)*
                config.intervalMs
              )
            ){
              state.dead=true;
              state.oneShot=null;
              state.elapsed=0;
            }
          }

          function drawGame(){
            const canvas=$('game');
            const ctx=canvas.getContext('2d');

            ctx.clearRect(
              0,0,canvas.width,canvas.height
            );

            ctx.fillStyle='#273a41';
            ctx.fillRect(0,0,720,405);

            ctx.strokeStyle='#40545a';
            ctx.lineWidth=1;

            for(let x=0;x<720;x+=40){
              ctx.beginPath();
              ctx.moveTo(x,0);
              ctx.lineTo(x,405);
              ctx.stroke();
            }

            for(let y=0;y<405;y+=40){
              ctx.beginPath();
              ctx.moveTo(0,y);
              ctx.lineTo(720,y);
              ctx.stroke();
            }

            ctx.fillStyle='#a34c40';
            ctx.beginPath();
            ctx.ellipse(
              485,234,27,18,0,0,Math.PI*2
            );
            ctx.fill();

            ctx.fillStyle='#eed7be';
            ctx.font='16px system-ui';
            ctx.textAlign='center';
            ctx.fillText(
              '테스트 대상',
              485,190
            );

            ctx.fillStyle='#28313d';
            ctx.fillRect(437,201,96,8);

            ctx.fillStyle='#82d36d';
            ctx.fillRect(
              437,201,
              96*state.targetHp/100,8
            );

            const motion=state.dead
              ?'death'
              :state.oneShot||state.motion;

            const config=activeConfig(motion);
            const row=resolveRow(
              config,state.direction
            );

            const oneshot=[
              'attack','hit','death','magic'
            ].includes(motion);

            const drawn=spriteFrame(
              ctx,row,state.elapsed,
              config.intervalMs,
              state.x,state.y,
              165,165,
              oneshot
            );

            if(!drawn){
              ctx.fillStyle='#e2ebf9';
              ctx.fillRect(
                state.x-13,
                state.y-45,
                26,45
              );
            }

            ctx.textAlign='left';
            ctx.fillStyle='#eef4ff';
            ctx.font='14px system-ui';

            const label=isMapped(motion)
              ?'사용자 지정 후보'
              :'미지정 · 검사용 후보';

            ctx.fillText(
              LABELS[motion]+' / '+label,
              15,25
            );

            $('gameStatus').textContent=[
              'ID '+selectedActor(),
              '방향 '+state.direction,
              '동작 '+LABELS[motion],
              '원본 매핑: 미확정',
              '대상 체력 '+state.targetHp,
              state.message
            ].join(' · ');
          }

          function makeExport(){
            return {
              version:'V15',
              kind:'USER_TESTED_MOTION_CANDIDATES',
              source:'V13_V14_VERIFIED_SPR',
              verification:{
                originalActionDefinition:false,
                originalDirection:false,
                originalTiming:false,
                packagePrecedence:false
              },
              assignments
            };
          }

          function exportMapping(){
            const blob=new Blob(
              [
                JSON.stringify(
                  makeExport(),null,2
                )
              ],
              {type:'application/json'}
            );

            const url=URL.createObjectURL(blob);
            const link=document.createElement('a');

            link.href=url;
            link.download='sanctuary-v15-motion-mapping.json';
            link.click();

            setTimeout(
              ()=>URL.revokeObjectURL(url),
              1000
            );
          }

          async function importMapping(file){
            if(!file)return;

            if(file.size>2*1024*1024){
              $('importStatus').textContent=
                '매핑 JSON 크기 제한 초과';
              return;
            }

            try{
              const loaded=JSON.parse(
                await file.text()
              );

              const incoming=loaded.assignments;

              if(
                !incoming ||
                typeof incoming!=='object' ||
                Array.isArray(incoming)
              ){
                throw new Error(
                  'assignments 항목 없음'
                );
              }

              let accepted=0;
              let rejected=0;

              for(const [actor,actionMap] of Object.entries(
                incoming
              )){
                if(
                  !actionMap ||
                  typeof actionMap!=='object'
                )continue;

                for(const [action,raw] of Object.entries(
                  actionMap
                )){
                  const value=validateConfig(
                    actor,action,raw
                  );

                  if(!value){
                    rejected++;
                    continue;
                  }

                  if(!assignments[actor]){
                    assignments[actor]={};
                  }

                  assignments[actor][action]=value;
                  accepted++;
                }
              }

              $('importStatus').textContent=
                '불러온 모션 '+accepted+
                '개 · 제외 '+rejected+'개';

              selectAction(currentAction());
            }catch(error){
              $('importStatus').textContent=
                'JSON 불러오기 실패: '+
                error.message;
            }
          }

          function bindPad(){
            document.querySelectorAll(
              '[data-dir]'
            ).forEach(button=>{
              const dir=Number(
                button.dataset.dir
              );

              button.addEventListener(
                'pointerdown',event=>{
                  event.preventDefault();
                  state.pointerDirection=dir;

                  button.setPointerCapture?.(
                    event.pointerId
                  );
                }
              );

              const release=()=>{
                if(state.pointerDirection===dir){
                  state.pointerDirection=null;
                }
              };

              button.addEventListener(
                'pointerup',release
              );
              button.addEventListener(
                'pointercancel',release
              );
              button.addEventListener(
                'lostpointercapture',release
              );
            });

            $('padAttack').onclick=()=>{
              startOneShot('attack');
            };
          }

          function bindKeyboard(){
            const keys=new Set([
              'w','a','s','d',
              'arrowup','arrowdown',
              'arrowleft','arrowright'
            ]);

            document.addEventListener(
              'keydown',event=>{
                if(
                  ['INPUT','SELECT','TEXTAREA'].includes(
                    document.activeElement?.tagName
                  )
                )return;

                const key=event.key.toLowerCase();

                if(keys.has(key)){
                  event.preventDefault();
                  state.keySet.add(key);
                }

                if(
                  key===' ' &&
                  !event.repeat
                ){
                  event.preventDefault();
                  startOneShot('attack');
                }
              }
            );

            document.addEventListener(
              'keyup',event=>{
                state.keySet.delete(
                  event.key.toLowerCase()
                );
              }
            );

            window.addEventListener(
              'blur',()=>{
                state.keySet.clear();
                state.pointerDirection=null;
              }
            );
          }

          function boot(){
            for(let i=0;i<8;i++){
              addOption(
                $('rotation'),i,String(i)
              );
            }

            buildActors();

            $('actor').onchange=()=>{
              actorReset();
              buildPackages();
              selectAction('idle');
            };

            $('pak').onchange=()=>{
              buildBanks();
            };

            $('bank').onchange=()=>{
              drawPreviews();
              updateMappingInfo();
            };

            $('rotation').onchange=drawPreviews;
            $('reverse').onchange=drawPreviews;
            $('interval').onchange=drawPreviews;

            $('action').onchange=()=>{
              selectAction(currentAction());
            };

            $('assign').onclick=saveAssignment;
            $('clear').onclick=clearAssignment;

            $('attack').onclick=()=>{
              startOneShot('attack');
            };

            $('hit').onclick=()=>{
              startOneShot('hit');
            };

            $('magic').onclick=()=>{
              startOneShot('magic');
            };

            $('death').onclick=()=>{
              startOneShot('death');
            };

            $('revive').onclick=revive;
            $('export').onclick=exportMapping;

            $('import').onchange=event=>{
              importMapping(
                event.target.files?.[0]
              );
            };

            bindPad();
            bindKeyboard();

            selectAction('idle');

            requestAnimationFrame(tick);
          }

          function tick(now){
            const dt=Math.min(
              50,
              Math.max(0,now-state.last)
            );

            state.last=now;

            update(dt);
            drawGame();
            renderPreviews();

            requestAnimationFrame(tick);
          }

          boot();
