
name: Sanctuary of Aden External Action Crosscheck V12

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/audit-sanctuary-monsters.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: sanctuary-monster-audit
  cancel-in-progress: false

jobs:
  crosscheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Prepare directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previous/v10 previous/v11 reference reports

      - name: Restore verified V10 and V11 results
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh run download 38866558914 \
            --repo "$GITHUB_REPOSITORY" \
            --name Sanctuary-V10-Full-SPR-Structure-and-Motion-Lab \
            --dir previous/v10

          gh run download 38869270863 \
            --repo "$GITHUB_REPOSITORY" \
            --name Sanctuary-V11-Original-Animation-Definitions \
            --dir previous/v11

          test -s previous/v10/01_all_sprite_id_groups.csv
          test -s previous/v10/Sanctuary-V10-Mobile-Motion-Lab.html
          test -s previous/v11/06_summary_v11.json

          cp previous/v10/Sanctuary-V10-Mobile-Motion-Lab.html \
            reports/V10-Original-Sprite-Viewer.html

      - name: Download pinned external reference tables
        shell: bash
        run: |
          set -euo pipefail

          base="https://raw.githubusercontent.com/tpai/docker-l1jtw-server/0212802a625b36af3a0df2c513acc2713902f4d0/L1J-TW_3.80c/db"

          curl --fail --location --silent --show-error \
            --retry 3 \
            "$base/Japan/MyISAM/spr_action.sql" \
            -o reference/jp_spr_action.sql

          curl --fail --location --silent --show-error \
            --retry 3 \
            "$base/Japan/MyISAM/npc.sql" \
            -o reference/jp_npc.sql

          curl --fail --location --silent --show-error \
            --retry 3 \
            "$base/Taiwan/spr_action.sql" \
            -o reference/tw_spr_action.sql

          curl --fail --location --silent --show-error \
            --retry 3 \
            "$base/Taiwan/npc.sql" \
            -o reference/tw_npc.sql

          for file in reference/*.sql; do
            test -s "$file"
            sha256sum "$file"
          done

      - name: Cross-check action and NPC identity references
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import csv
          import hashlib
          import json
          import os
          import re
          from collections import Counter, defaultdict
          from pathlib import Path

          ROOT = Path.cwd()
          REF = ROOT / "reference"
          REPORT = ROOT / "reports"
          V10 = ROOT / "previous/v10"
          V11 = ROOT / "previous/v11"

          def csv_load(path):
              with path.open(
                  encoding="utf-8-sig",
                  newline=""
              ) as f:
                  return list(csv.DictReader(f))

          def csv_save(name, rows, columns):
              with (REPORT / name).open(
                  "w",
                  encoding="utf-8-sig",
                  newline=""
              ) as f:
                  writer = csv.DictWriter(
                      f,
                      fieldnames=columns,
                      extrasaction="ignore"
                  )
                  writer.writeheader()
                  writer.writerows(rows)

          def read_source(path):
              return path.read_text(
                  encoding="utf-8-sig",
                  errors="replace"
              )

          def sql_tuples(text):
              pos = text.lower().find("insert into")
              if pos < 0:
                  return

              text = text[pos:]
              depth = 0
              start = -1
              quoted = False
              i = 0

              while i < len(text):
                  ch = text[i]

                  if quoted:
                      if ch == "\\":
                          i += 2
                          continue

                      if ch == "'":
                          if (
                              i + 1 < len(text)
                              and text[i + 1] == "'"
                          ):
                              i += 2
                              continue
                          quoted = False

                  elif ch == "'":
                      quoted = True

                  elif ch == "(":
                      if depth == 0:
                          start = i + 1
                      depth += 1

                  elif ch == ")" and depth:
                      depth -= 1
                      if depth == 0:
                          yield text[start:i]

                  i += 1

          def parse_cells(source):
              try:
                  return next(csv.reader(
                      [source],
                      delimiter=",",
                      quotechar="'",
                      escapechar="\\",
                      skipinitialspace=True
                  ))
              except (csv.Error, StopIteration):
                  return None

          reference_sources = {
              "JP_380c": {
                  "actions": REF / "jp_spr_action.sql",
                  "npcs": REF / "jp_npc.sql"
              },
              "TW_380c": {
                  "actions": REF / "tw_spr_action.sql",
                  "npcs": REF / "tw_npc.sql"
              }
          }

          actor_rows = csv_load(
              V10 / "01_all_sprite_id_groups.csv"
          )

          actors = {
              int(row["sprite_id"]): row
              for row in actor_rows
          }

          v11_summary = json.loads(
              (V11 / "06_summary_v11.json").read_text(
                  encoding="utf-8"
              )
          )

          if len(actors) < 1000:
              raise SystemExit(
                  "Incomplete V10 sprite inventory"
              )

          if v11_summary["original_list_candidates"] != 0:
              raise SystemExit(
                  "V11 evidence changed; recheck original actions"
              )

          action_rows = []
          npc_rows = []
          source_stats = []

          action_hints = {
              0: "walk",
              1: "attack",
              2: "damage",
              3: "idle/breath",
              8: "death"
          }

          for source_name, paths in reference_sources.items():
              action_text = read_source(paths["actions"])
              npc_text = read_source(paths["npcs"])

              action_count = 0
              npc_count = 0

              for item in sql_tuples(action_text):
                  fields = parse_cells(item)

                  if fields is None or len(fields) != 4:
                      continue

                  try:
                      sprite_id, action_id, framecount, framerate = (
                          int(x.strip()) for x in fields
                      )
                  except ValueError:
                      continue

                  if not (
                      0 <= sprite_id <= 200000
                      and 0 <= action_id <= 512
                      and 0 <= framecount <= 10000
                      and 0 <= framerate <= 10000
                  ):
                      continue

                  action_count += 1

                  action_rows.append({
                      "reference": source_name,
                      "sprite_id": sprite_id,
                      "action_id": action_id,
                      "action_hint": action_hints.get(
                          action_id, ""
                      ),
                      "reference_framecount": framecount,
                      "reference_framerate": framerate,
                      "id_present_in_our_v10": (
                          sprite_id in actors
                      ),
                      "verification": "EXTERNAL_REFERENCE_ONLY"
                  })

              schema_end = npc_text.lower().find(
                  "insert into"
              )

              schema = (
                  npc_text[:schema_end]
                  if schema_end >= 0
                  else npc_text
              )

              columns = re.findall(
                  r"(?m)^\s*`([^`]+)`\s+",
                  schema
              )

              required = (
                  "npcid",
                  "name",
                  "gfxid",
                  "impl"
              )

              if not all(
                  col in columns for col in required
              ):
                  raise SystemExit(
                      "Unknown NPC SQL schema: " + source_name
                  )

              indices = {
                  key: columns.index(key)
                  for key in required
              }

              note_index = (
                  columns.index("note")
                  if "note" in columns
                  else None
              )

              for item in sql_tuples(npc_text):
                  fields = parse_cells(item)

                  if fields is None:
                      continue

                  if len(fields) < len(columns):
                      continue

                  try:
                      npc_id = int(
                          fields[indices["npcid"]].strip()
                      )
                      gfx_id = int(
                          fields[indices["gfxid"]].strip()
                      )
                  except ValueError:
                      continue

                  npc_count += 1

                  npc_rows.append({
                      "reference": source_name,
                      "npc_id": npc_id,
                      "npc_name": fields[indices["name"]],
                      "gfx_id": gfx_id,
                      "implementation": fields[
                          indices["impl"]
                      ],
                      "note": (
                          fields[note_index]
                          if note_index is not None
                          else ""
                      ),
                      "id_present_in_our_v10": (
                          gfx_id in actors
                      ),
                      "identity_verified": False
                  })

              source_stats.append({
                  "reference": source_name,
                  "action_rows": action_count,
                  "npc_rows": npc_count,
                  "action_sha256": hashlib.sha256(
                      paths["actions"].read_bytes()
                  ).hexdigest(),
                  "npc_sha256": hashlib.sha256(
                      paths["npcs"].read_bytes()
                  ).hexdigest()
              })

              print(
                  source_name,
                  "ACTION_ROWS", action_count,
                  "NPC_ROWS", npc_count
              )

              if action_count < 1000:
                  raise SystemExit(
                      "Insufficient action data: " + source_name
                  )

          csv_save(
              "01_external_reference_sources.csv",
              source_stats,
              [
                  "reference",
                  "action_rows",
                  "npc_rows",
                  "action_sha256",
                  "npc_sha256"
              ]
          )

          csv_save(
              "02_external_action_records.csv",
              action_rows,
              [
                  "reference",
                  "sprite_id",
                  "action_id",
                  "action_hint",
                  "reference_framecount",
                  "reference_framerate",
                  "id_present_in_our_v10",
                  "verification"
              ]
          )

          csv_save(
              "03_external_npc_gfx_candidates.csv",
              npc_rows,
              [
                  "reference",
                  "npc_id",
                  "npc_name",
                  "gfx_id",
                  "implementation",
                  "note",
                  "id_present_in_our_v10",
                  "identity_verified"
              ]
          )

          action_groups = defaultdict(list)
          npc_groups = defaultdict(list)

          for row in action_rows:
              key = (
                  row["sprite_id"],
                  row["action_id"]
              )
              action_groups[key].append(row)

          for row in npc_rows:
              npc_groups[row["gfx_id"]].append(row)

          combined = []
          actions_by_id = defaultdict(list)

          for key, records in sorted(
              action_groups.items()
          ):
              sprite_id, action_id = key

              if sprite_id not in actors:
                  continue

              sources = sorted({
                  row["reference"]
                  for row in records
              })

              values = sorted({
                  (
                      row["reference_framecount"],
                      row["reference_framerate"]
                  )
                  for row in records
              })

              if len(sources) >= 2 and len(values) == 1:
                  status = "REGIONAL_REFERENCE_AGREEMENT"
              elif len(sources) >= 2:
                  status = "REGIONAL_REFERENCE_CONFLICT"
              else:
                  status = "ONE_EXTERNAL_REFERENCE"

              entry = {
                  "sprite_id": sprite_id,
                  "action_id": action_id,
                  "action_hint": action_hints.get(
                      action_id, ""
                  ),
                  "reference_sources": ",".join(sources),
                  "reference_values": json.dumps(
                      values
                  ),
                  "comparison_status": status,
                  "sprite_id_present": True,
                  "original_frame_order_verified": False,
                  "actual_action_verified": False
              }

              combined.append(entry)
              actions_by_id[sprite_id].append(entry)

          csv_save(
              "04_external_action_crosscheck.csv",
              combined,
              [
                  "sprite_id",
                  "action_id",
                  "action_hint",
                  "reference_sources",
                  "reference_values",
                  "comparison_status",
                  "sprite_id_present",
                  "original_frame_order_verified",
                  "actual_action_verified"
              ]
          )

          summary_rows = []
          browser_rows = []

          for sprite_id, actor in sorted(
              actors.items()
          ):
              actions = actions_by_id.get(
                  sprite_id, []
              )

              npcs = npc_groups.get(
                  sprite_id, []
              )

              names = sorted({
                  row["npc_name"]
                  for row in npcs
                  if row["npc_name"].strip()
              })

              regions = sorted({
                  row["reference"]
                  for row in npcs
              })

              conflicting = sum(
                  x["comparison_status"]
                  == "REGIONAL_REFERENCE_CONFLICT"
                  for x in actions
              )

              summary_rows.append({
                  "sprite_id": sprite_id,
                  "actual_spr_files": actor["file_records"],
                  "actual_subids": actor["unique_subids"],
                  "actual_packages": actor["packages"],
                  "external_action_records": len(actions),
                  "external_npc_names": len(names),
                  "external_name_candidates": " | ".join(
                      names[:20]
                  ),
                  "external_regions": ",".join(regions),
                  "reference_action_conflicts": conflicting,
                  "verified_original_action_names": 0,
                  "verified_original_frame_sequences": 0,
                  "identity_status": "NUMERIC_ID_MATCH_ONLY"
              })

              browser_rows.append({
                  "id": sprite_id,
                  "files": int(actor["file_records"]),
                  "subids": int(actor["unique_subids"]),
                  "packages": actor["package_names"],
                  "names": names[:20],
                  "npcs": [
                      {
                          "name": row["npc_name"],
                          "region": row["reference"],
                          "npcid": row["npc_id"],
                          "impl": row["implementation"],
                          "note": row["note"]
                      }
                      for row in npcs[:40]
                  ],
                  "actions": [
                      {
                          "id": entry["action_id"],
                          "hint": entry["action_hint"],
                          "sources": entry["reference_sources"],
                          "values": entry["reference_values"],
                          "status": entry["comparison_status"]
                      }
                      for entry in actions
                  ]
              })

          csv_save(
              "05_full_sprite_identity_candidates.csv",
              summary_rows,
              [
                  "sprite_id",
                  "actual_spr_files",
                  "actual_subids",
                  "actual_packages",
                  "external_action_records",
                  "external_npc_names",
                  "external_name_candidates",
                  "external_regions",
                  "reference_action_conflicts",
                  "verified_original_action_names",
                  "verified_original_frame_sequences",
                  "identity_status"
              ]
          )

          summary = {
              "phase": "EXTERNAL_REFERENCE_CROSSCHECK",
              "actual_sprite_id_groups": len(actors),
              "external_action_rows": len(action_rows),
              "external_npc_rows": len(npc_rows),
              "client_ids_with_external_actions": sum(
                  bool(row["external_action_records"])
                  for row in summary_rows
              ),
              "client_ids_with_external_npc_names": sum(
                  bool(row["external_npc_names"])
                  for row in summary_rows
              ),
              "external_action_pairs_on_client_ids": len(
                  combined
              ),
              "regional_reference_conflicts": sum(
                  x["comparison_status"]
                  == "REGIONAL_REFERENCE_CONFLICT"
                  for x in combined
              ),
              "client_list_spr_found_in_v11": False,
              "verified_original_monster_names": 0,
              "verified_original_action_sequences": 0,
              "pak_priority_verified": False,
              "reference_version": "L1J 3.80c",
              "reference_provenance": (
                  "Third-party JP and TW server SQL; "
                  "not the current game's original client"
              )
          }

          (REPORT / "06_summary_v12.json").write_text(
              json.dumps(
                  summary,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          data = json.dumps(
              browser_rows,
              ensure_ascii=False,
              separators=(",", ":")
          ).replace("<", "\\u003c")

          html = r'''<!doctype html>
          <html lang="ko">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Sanctuary V12 ID Reference</title>
          <style>
          :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101721;color:#e9f1fa}
          *{box-sizing:border-box}
          body{max-width:1050px;margin:auto;padding:14px}
          h1{font-size:1.35rem}
          h2{font-size:1rem}
          p{font-size:.85rem;color:#adbed2;line-height:1.5}
          input,select{width:100%;background:#223244;color:white;border:1px solid #49617b;padding:10px;border-radius:7px;font:inherit}
          .controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
          .panel{background:#192635;border:1px solid #354b62;border-radius:9px;padding:12px;margin:13px 0}
          .warn{color:#ffcc8f}
          .meta{font-size:.82rem;color:#bacbe0}
          table{border-collapse:collapse;width:100%;font-size:.8rem}
          th,td{text-align:left;padding:8px;border-bottom:1px solid #33485c;overflow-wrap:anywhere}
          th{color:#a9bed5}
          .scroll{overflow-x:auto}
          a{color:#a8ceff}
          @media(max-width:620px){.controls{grid-template-columns:1fr}th,td{padding:6px}}
          </style>
          </head>
          <body>
          <h1>Sanctuary V12 · SPR ID 교차검증</h1>
          <p class="warn">이름과 액션 번호는 별도 L1J 3.80c 서버 자료에서 가져온 참고 후보입니다. 현재 클라이언트에서 원본 액션 정의나 몬스터 이름이 확인된 것은 아닙니다.</p>
          <p><a href="V10-Original-Sprite-Viewer.html">V10 실제 SPR 이미지 검사기 열기</a></p>
          <div class="controls">
          <label>스프라이트 ID·이름 검색<input id="query" placeholder="예: 29, orc, skeleton"></label>
          <label>검색 결과 선택<select id="sprite"></select></label>
          </div>
          <div class="panel" id="info"></div>
          <h2>외부 NPC 이름 후보</h2>
          <div class="panel scroll"><table><thead><tr><th>참고 지역</th><th>NPC ID</th><th>이름</th><th>구현형</th><th>비고</th></tr></thead><tbody id="npcs"></tbody></table></div>
          <h2>외부 액션 표 비교</h2>
          <div class="panel scroll"><table><thead><tr><th>액션 ID</th><th>참고 분류</th><th>출처</th><th>framecount / framerate</th><th>대조</th></tr></thead><tbody id="actions"></tbody></table></div>
          <p class="warn">framecount·framerate는 참고 SQL의 필드값 그대로입니다. SPR 내부 프레임 수나 원본 재생시간으로 해석하지 않습니다. 액션별 실제 서브 ID·프레임 순서는 미확정입니다.</p>
          <script type="application/json" id="inventory">__DATA__</script>
          <script>
          'use strict';
          const DB=JSON.parse(document.getElementById('inventory').textContent);
          const $=id=>document.getElementById(id);
          const select=$('sprite');
          const query=$('query');

          function cell(tr,value){
            const td=document.createElement('td');
            td.textContent=String(value??'');
            tr.append(td);
          }

          function tableRows(target,rows,keys){
            const body=$(target);
            body.replaceChildren();
            for(const row of rows){
              const tr=document.createElement('tr');
              keys.forEach(key=>cell(tr,row[key]));
              body.append(tr);
            }
          }

          function choices(){
            const q=query.value.trim().toLowerCase();
            const previous=select.value;
            const matches=DB.filter(x=>
              !q ||
              String(x.id).includes(q) ||
              x.names.some(name=>name.toLowerCase().includes(q))
            ).slice(0,200);

            select.replaceChildren();

            matches.forEach(x=>{
              const option=document.createElement('option');
              option.value=String(x.id);
              option.textContent=`${x.id} ${x.names.slice(0,2).join(' / ')}`;
              select.append(option);
            });

            if(matches.some(x=>String(x.id)===previous)){
              select.value=previous;
            }

            render();
          }

          function render(){
            const item=DB.find(x=>String(x.id)===select.value);

            if(!item){
              $('info').textContent='검색 결과 없음';
              $('npcs').replaceChildren();
              $('actions').replaceChildren();
              return;
            }

            $('info').textContent=
              `SPR ${item.id} · 현재 원본 ${item.files}건 · 서브 ID ${item.subids}종 · `+
              `원본 PAK: ${item.packages} · 외부 이름 후보 ${item.names.length}종 · 외부 액션 후보 ${item.actions.length}건`;

            tableRows('npcs',item.npcs.map(x=>({
              region:x.region,
              npcid:x.npcid,
              name:x.name,
              impl:x.impl,
              note:x.note
            })),['region','npcid','name','impl','note']);

            tableRows('actions',item.actions.map(x=>({
              id:x.id,
              hint:x.hint,
              sources:x.sources,
              values:x.values,
              status:x.status
            })),['id','hint','sources','values','status']);
          }

          query.addEventListener('input',choices);
          select.addEventListener('change',render);

          choices();
          </script>
          </body>
          </html>'''

          (REPORT / "V12-Reference-Comparison.html").write_text(
              html.replace("__DATA__", data),
              encoding="utf-8"
          )

          explanation = [
              "Sanctuary of Aden V12",
              "",
              "V11 confirmed no original list.spr/list.spz candidate.",
              "V12 uses third-party regional L1J 3.80c SQL tables.",
              "Matching graphics IDs are numerical correspondences only.",
              "NPC names and action labels are candidate references.",
              "Different regional source values are reported as conflicts.",
              "The original game package precedence is unknown.",
              "The original per-frame sequences are not recovered.",
              "The original frame duration units are not established.",
              "",
              "Open V12-Reference-Comparison.html for external metadata.",
              "Open V10-Original-Sprite-Viewer.html for actual images."
          ]

          (REPORT / "REPORT.txt").write_text(
              "\n".join(explanation) + "\n",
              encoding="utf-8"
          )

          print("=== V12 SUMMARY ===")
          print(json.dumps(
              summary,
              ensure_ascii=False,
              indent=2
          ))

          path = os.environ.get("GITHUB_STEP_SUMMARY")
          if path:
              with open(
                  path, "a", encoding="utf-8"
              ) as f:
                  f.write("\n".join(explanation) + "\n")
                  f.write(
                      json.dumps(
                          summary,
                          ensure_ascii=False,
                          indent=2
                      )
                  )

          if not combined:
              raise SystemExit(
                  "No external reference IDs matched the V10 inventory"
              )

          PY

      - name: Upload V12 ID crosscheck and HTML viewers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-V12-External-Action-and-NPC-Crosscheck
          path: reports/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
