          </style>
          </head>
          <body>
          <h1>SLKnight V23 · 492개 몬스터 이벤트 동작 전수검사</h1>
          <p>이름이 아닌 실제 그래픽으로 동작을 연결합니다. 같은 그래픽을 사용하는 다른 이름의 몬스터는 동일 동작 계열로 분류합니다.</p>
          <p class="warning">정지·이동은 RPG Maker XP의 4방향 캐릭터 시트에서 추출한 검사용 GIF입니다. 공격·사망은 아직 원본 매핑 미확인입니다.</p>
          <p id="stats"></p>
          <div class="layout">
          <section>
          <div class="toolbar">
          <input id="search" placeholder="몬스터 / 그래픽 검색">
          <select id="filter">
          <option value="all">전체 이벤트</option>
          <option value="issues">점검 필요</option>
          <option value="shared">그래픽 공유</option>
          </select>
          </div>
          <div id="list" class="entries"></div>
          </section>
          <section>
          <h2 id="name"></h2>
          <p id="info"></p>
          <div class="toolbar">
          <select id="direction">
          <option value="0">아래 ↓</option>
          <option value="1">왼쪽 ←</option>
          <option value="2">오른쪽 →</option>
          <option value="3">위 ↑</option>
          </select>
          </div>
          <div class="motions">
          <div class="panel">
          <h2>정지 WAIT</h2>
          <div id="wait" class="stage"></div>
          </div>
          <div class="panel">
          <h2>이동 WALK</h2>
          <div id="walk" class="stage"></div>
          </div>
          <div class="panel">
          <h2>공격 ATTACK</h2>
          <p class="warning">원본 모션 연결 미확인</p>
          </div>
          <div class="panel">
          <h2>사망 DEATH</h2>
          <p class="warning">원본 모션 연결 미확인</p>
          </div>
          </div>
          <h2>4방향 걷기 동시 비교</h2>
          <div id="directions" class="directions"></div>
          <h2>동일 그래픽 공유 몬스터</h2>
          <p id="aliases"></p>
          <h2>유사 실루엣 검토 후보</h2>
          <p id="similar"></p>
          <h2>점검 결과</h2>
          <p id="issues"></p>
          </section>
          </div>'''

          payload=json.dumps(
              {'rows':rows,'assets':assets,'stats':stats},
              ensure_ascii=False,separators=(',',':')
          ).replace('<','\\u003c')

          js=r'''
          const db=JSON.parse(document.getElementById('data').textContent);
          const rows=db.rows,assets=db.assets;
          const E=id=>document.getElementById(id);
          const directionNames=['아래','왼쪽','오른쪽','위'];
          let selected=0;

          E('stats').textContent=
            db.stats.events+' EV · '+
            db.stats.unique_names+'개 이름 · '+
            db.stats.usable_graphics+'개 그래픽 · '+
            db.stats.linked_events+' EV 연결';

          function createGIF(base64){
            const img=document.createElement('img');
            img.src='data:image/gif;base64,'+base64;
            return img;
          }

          function setStage(id,asset,dir,mode){
            const stage=E(id);
            stage.replaceChildren();

            if(asset&&asset.motions[dir]){
              stage.appendChild(createGIF(asset.motions[dir][mode]));
            }else{
              stage.textContent='사용 가능한 원본 그래픽 없음';
            }
          }

          function render(){
            const r=rows[selected];
            const asset=assets[r.primary_asset];
            const dir=E('direction').value;

            E('name').textContent=
              r.monster+' · MAP '+r.map_id+' / EV '+r.event_id;

            E('info').textContent=
              '게임 이벤트: '+r.actual_event_name+
              ' · 그래픽: '+(r.graphics.join(', ')||'미설정');

            E('aliases').textContent=
              (r.shared_monsters.join(' / ')||'없음')+
              ' · 공유 EV '+r.shared_events+'개';

            E('similar').textContent=
              r.possible_same_shape.join(' / ')||'없음';

            E('issues').textContent=
              r.issues.join(' / ')||
              '정지·이동 그래픽 연결됨. 공격·사망 추가 검증 필요.';

            setStage('wait',asset,dir,'wait');
            setStage('walk',asset,dir,'walk');

            const gallery=E('directions');
            gallery.replaceChildren();

            for(let d=0;d<4;d++){
              const box=document.createElement('div');
              box.className='dir';

              const label=document.createElement('div');
              label.className='small';
              label.textContent=directionNames[d];

              box.appendChild(label);

              if(asset&&asset.motions[String(d)]){
                box.appendChild(
                  createGIF(asset.motions[String(d)].walk)
                );
              }else{
                box.appendChild(document.createTextNode('미연결'));
              }

              gallery.appendChild(box);
            }
          }

          function refresh(){
            const q=E('search').value.toLowerCase();
            const filter=E('filter').value;
            const list=E('list');

            list.replaceChildren();

            rows.forEach((r,index)=>{
              const haystack=[
                r.monster,r.actual_event_name,
                ...r.graphics,...r.shared_monsters
              ].join(' ').toLowerCase();

              if(!haystack.includes(q))return;
              if(filter==='issues'&&!r.issues.length)return;
              if(filter==='shared'&&r.shared_events<2)return;

              const button=document.createElement('button');
              button.className='entry';

              const sub=document.createElement('small');
              button.textContent=r.monster;
              sub.textContent=
                'MAP '+r.map_id+' / EV '+r.event_id+
                ' · '+(r.graphics[0]||'그래픽 없음');

              button.appendChild(sub);
              button.onclick=()=>{
                selected=index;
                render();
              };

              list.appendChild(button);
            });
          }

          E('search').oninput=refresh;
          E('filter').onchange=refresh;
          E('direction').onchange=render;

          refresh();
          render();
          '''

          page=(
              html+
              '<script id="data" type="application/json">'+payload+
              '</script><script>'+js+'</script></body></html>'
          )

          (report/'SLKnight-492-Motion-Integrated.html').write_text(
              page,encoding='utf-8'
          )
          (report/'app-check.js').write_text(
              js,encoding='utf-8'
          )

          print(json.dumps(stats,ensure_ascii=False))
          PY

          python3 /tmp/motions.py

      - name: Validate 492 events and integrated HTML
        run: |
          set -euo pipefail
          node --check reports/app-check.js
          python3 - <<'PY'
          from pathlib import Path
          import csv
          import json

          root=Path('reports')
          stats=json.loads(
              (root/'summary.json').read_text(encoding='utf-8')
          )

          assert stats['events']==492
          assert stats['unique_names']==125
          assert stats['maps']==36

          with (root/'492-motion-audit.csv').open(
                  encoding='utf-8-sig') as f:
              assert len(list(csv.DictReader(f)))==492

          html=root/'SLKnight-492-Motion-Integrated.html'
          assert html.exists()
          assert html.stat().st_size>10000

          print('V23_492_EVENT_AUDIT_VALIDATED')
          PY

      - name: Upload unified HTML and motion audit
        uses: actions/upload-artifact@v4
        with:
          name: SLKnight-V23-492EV-Motion-Audit
          path: reports/
          retention-days: 30
          if-no-files-found: error
