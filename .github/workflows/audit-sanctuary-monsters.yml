
name: Sanctuary of Aden Original Animation Definitions V11

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/audit-sanctuary-monsters.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: sanctuary-monster-audit
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Prepare environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previous/v1 previous/v2 previous/v9
          mkdir -p reports/raw client downloads

      - name: Restore verified indexes and frame manifests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh run download 38782357687 \
            --repo "$GITHUB_REPOSITORY" \
            --name Sanctuary-Monster-Audit \
            --dir previous/v1

          gh run download 38784834277 \
            --repo "$GITHUB_REPOSITORY" \
            --name Sanctuary-V2-Reports \
            --dir previous/v2

          gh run download 38838415568 \
            --repo "$GITHUB_REPOSITORY" \
            --name Sanctuary-V9-Original-SPR-Visual-Lab \
            --dir previous/v9

          test -s previous/v1/01_all_client_files.csv
          test -s previous/v1/02_pak_records.csv
          test -n "$(find previous/v2 -name all_sprite_candidates.csv -print -quit)"
          test -s previous/v9/02_rendered_sprite_manifest.csv

      - name: Find original sprite action definition sources
        id: scan
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import csv
          import json
          import os
          import re
          from collections import Counter
          from pathlib import PurePosixPath, Path

          REPORT = Path("reports")

          def read_csv(path):
              with path.open(
                  encoding="utf-8-sig",
                  newline=""
              ) as f:
                  return list(csv.DictReader(f))

          def write_csv(name, rows, fields):
              with (REPORT / name).open(
                  "w", encoding="utf-8-sig", newline=""
              ) as f:
                  writer = csv.DictWriter(
                      f, fieldnames=fields,
                      extrasaction="ignore"
                  )
                  writer.writeheader()
                  writer.writerows(rows)

          def archive_path(value):
              value = value.replace("\\", "/")
              parts = PurePosixPath(value).parts

              if "Sanctuary of Aden - Copy" not in parts:
                  return None

              at = parts.index("Sanctuary of Aden - Copy")
              selected = parts[at:]

              if any(p in (".", "..") for p in selected):
                  return None

              return "/".join(selected)

          exact_names = {
              "list.spr", "wlist.spr",
              "list.spz", "wlist.spz",
              "list.sprlist", "wlist.sprlist"
          }

          def classify(filename):
              name = filename.replace(
                  "\\", "/"
              ).split("/")[-1].lower()

              if name in exact_names:
                  return "EXACT_ANIMATION_LIST"

              if "sprlist" in name or "spr_list" in name:
                  return "SPR_LIST_CANDIDATE"

              if (
                  ("sprite" in name or "spr" in name)
                  and ("action" in name or "motion" in name)
                  and Path(name).suffix.lower()
                  in {".spr", ".spz", ".txt", ".lst", ".tbl"}
              ):
                  return "MOTION_METADATA_CANDIDATE"

              return None

          direct = read_csv(
              Path("previous/v1/01_all_client_files.csv")
          )

          indexed = read_csv(
              Path("previous/v1/02_pak_records.csv")
          )

          candidates = []
          unresolvable = []
          counts = Counter()

          for row in direct:
              reason = classify(row["path"])
              if not reason:
                  continue

              location = archive_path(row["path"])

              if not location:
                  unresolvable.append(row["path"])
                  continue

              candidates.append({
                  "kind": "direct",
                  "name": Path(location).name,
                  "source": row["path"],
                  "archive_path": location,
                  "offset": 0,
                  "bytes": int(row["bytes"]),
                  "category": reason
              })

              counts["direct"] += 1

          for row in indexed:
              reason = classify(row["file"])
              if not reason:
                  continue

              if str(row["valid"]).lower() != "true":
                  counts["invalid_index"] += 1
                  continue

              location = archive_path(row["pak"])

              if not location:
                  unresolvable.append(row["pak"])
                  continue

              candidates.append({
                  "kind": "pak",
                  "name": row["file"],
                  "source": row["pak"],
                  "archive_path": location,
                  "offset": int(row["offset"]),
                  "bytes": int(row["bytes"]),
                  "category": reason
              })

              counts["indexed"] += 1

          candidates.sort(
              key=lambda r: (
                  r["category"] != "EXACT_ANIMATION_LIST",
                  r["name"].lower(),
                  r["source"]
              )
          )

          (REPORT / "candidates.json").write_text(
              json.dumps(
                  candidates,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          write_csv(
              "01_animation_source_candidates.csv",
              candidates,
              [
                  "kind", "name", "source",
                  "archive_path", "offset",
                  "bytes", "category"
              ]
          )

          selections = sorted({
              row["archive_path"]
              for row in candidates
          })

          (REPORT / "archive_selections.txt").write_text(
              "\n".join(selections) + (
                  "\n" if selections else ""
              ),
              encoding="utf-8"
          )

          summary = {
              "phase": "ORIGINAL_ANIMATION_SOURCE_DISCOVERY",
              "direct_file_inventory": len(direct),
              "indexed_file_inventory": len(indexed),
              "source_candidates": len(candidates),
              "candidate_categories": dict(
                  Counter(r["category"] for r in candidates)
              ),
              "package_files_to_extract": len(selections),
              "unresolvable_paths": unresolvable[:30],
              "actions_verified": False
          }

          (REPORT / "02_scan_summary.json").write_text(
              json.dumps(
                  summary,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          with open(
              os.environ["GITHUB_OUTPUT"], "a"
          ) as f:
              f.write(
                  "has_sources="
                  + ("true" if candidates else "false")
                  + "\n"
              )

          print("=== V11 SOURCE DISCOVERY ===")
          print(json.dumps(
              summary,
              ensure_ascii=False,
              indent=2
          ))

          for row in candidates[:60]:
              print("CANDIDATE", row)
          PY

      - name: Prepare selective extraction
        if: steps.scan.outputs.has_sources == 'true'
        shell: bash
        run: |
          set -euo pipefail

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc

          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full

          df -h .

      - name: Download verified original archive
        if: steps.scan.outputs.has_sources == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release download v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Sanctuary.of.Aden.-.Copy.*" \
            --dir downloads

          python3 - <<'PY'
          from pathlib import Path

          directory = Path("downloads")
          base = "Sanctuary.of.Aden.-.Copy"

          expected = [
              f"{base}.z{i:02d}"
              for i in range(1, 46)
          ] + [f"{base}.zip"]

          missing = [
              name for name in expected
              if not (directory / name).is_file()
          ]

          if missing:
              raise SystemExit(
                  "Missing release parts: " + repr(missing)
              )

          print("VERIFIED ARCHIVE PARTS:", len(expected))
          PY

      - name: Extract animation metadata source packages
        if: steps.scan.outputs.has_sources == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t requested < reports/archive_selections.txt

          if [ "${#requested[@]}" -eq 0 ]; then
            exit 0
          fi

          archive="downloads/Sanctuary.of.Aden.-.Copy.zip"

          if ! 7z x "$archive" \
            "${requested[@]}" \
            "-o${PWD}/client" \
            -y > reports/selective_extraction.log 2>&1; then
            echo "SELECTIVE_EXTRACTION_RETURNED_ERROR" \
              >> reports/selective_extraction.log
          fi

          rm -rf downloads
          df -h .

      - name: Parse original actions and verify SPR references
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import bz2
          import csv
          import hashlib
          import json
          import lzma
          import math
          import os
          import re
          import zlib

          from collections import Counter, defaultdict
          from pathlib import Path

          ROOT = Path.cwd()
          REPORT = ROOT / "reports"
          CLIENT = ROOT / "client"

          MAX_RAW = 64 * 1024 * 1024
          MAX_DECODED = 96 * 1024 * 1024
          MAX_FRAME_ROWS = 500000

          def read_csv(path):
              with path.open(
                  encoding="utf-8-sig",
                  newline=""
              ) as f:
                  return list(csv.DictReader(f))

          def write_csv(name, rows, fields):
              with (REPORT / name).open(
                  "w", encoding="utf-8-sig", newline=""
              ) as f:
                  writer = csv.DictWriter(
                      f,
                      fieldnames=fields,
                      extrasaction="ignore"
                  )
                  writer.writeheader()
                  writer.writerows(rows)

          candidates = json.loads(
              (REPORT / "candidates.json").read_text(
                  encoding="utf-8"
              )
          )

          v2_paths = list(
              (ROOT / "previous/v2").rglob(
                  "all_sprite_candidates.csv"
              )
          )

          if len(v2_paths) != 1:
              raise SystemExit("V2 sprite index missing")

          v2 = read_csv(v2_paths[0])

          sprite_pattern = re.compile(
              r"^(\d+)-(\d+)\.(?:spr|spx|sp2|fspr)$",
              re.I
          )

          sprite_lookup = defaultdict(set)

          for row in v2:
              filename = row["file"].replace(
                  "\\", "/"
              ).split("/")[-1]

              match = sprite_pattern.fullmatch(filename)
              if not match:
                  continue

              sprite_id = int(match.group(1))
              subid = int(match.group(2))

              sprite_lookup[(sprite_id, subid)].add(
                  Path(row["pak"]).name
              )

          rendered_rows = read_csv(
              ROOT / "previous/v9/02_rendered_sprite_manifest.csv"
          )

          known_frames = defaultdict(list)

          for row in rendered_rows:
              known_frames[
                  (int(row["actor"]), int(row["sub"]))
              ].append({
                  "package": row["package"],
                  "frames": int(row["frames"])
              })

          HEADER = re.compile(
              r"(?m)^[ \t]*#(\d+)[ \t]+(\d+)"
              r"(?:=(\d+))?"
              r"(?:[ \t]+([^\r\n]*))?"
          )

          ACTION = re.compile(
              r"(-?\d+)\.([A-Za-z_][A-Za-z0-9_\s-]*)?"
              r"\((-?\d+)[ \t]+(-?\d+),([^)]*)\)"
          )

          FRAME = re.compile(
              r"(-?\d+)\.(-?\d+):(-?\d+)([^\s,]*)"
          )

          def parse_standard(content):
              entries = []
              headers = list(HEADER.finditer(content))

              for i, header in enumerate(headers):
                  end = (
                      headers[i + 1].start()
                      if i + 1 < len(headers)
                      else len(content)
                  )

                  entry_id = int(header.group(1))
                  image_count = int(header.group(2))
                  linked_id = (
                      int(header.group(3))
                      if header.group(3)
                      else None
                  )

                  sprite_id = (
                      linked_id
                      if linked_id is not None
                      else entry_id
                  )

                  tail = header.group(4) or ""
                  section = tail + "\n" + content[
                      header.end():end
                  ]

                  actions = []

                  for match in ACTION.finditer(section):
                      action_id = int(match.group(1))
                      name = (match.group(2) or "").strip()
                      directional = int(match.group(3))
                      expected_count = int(match.group(4))

                      if (
                          directional not in (0, 1)
                          or expected_count < 0
                          or expected_count > 500
                      ):
                          continue

                      frames = []

                      for item in FRAME.finditer(
                          match.group(5)
                      ):
                          frames.append({
                              "image_id": int(item.group(1)),
                              "frame_index": int(item.group(2)),
                              "duration": int(item.group(3)),
                              "modifiers": item.group(4)
                          })

                      if len(frames) != expected_count:
                          continue

                      actions.append({
                          "action_id": action_id,
                          "action_name": name,
                          "directional": directional,
                          "frames": frames,
                          "declared_frame_count": expected_count,
                          "format": "STANDARD"
                      })

                  if actions:
                      entries.append({
                          "entry_id": entry_id,
                          "sprite_id": sprite_id,
                          "image_count": image_count,
                          "actions": actions
                      })

              return entries

          def parse_compact(content):
              entries = []
              headers = list(HEADER.finditer(content))

              for i, header in enumerate(headers):
                  end = (
                      headers[i + 1].start()
                      if i + 1 < len(headers)
                      else len(content)
                  )

                  entry_id = int(header.group(1))
                  linked_id = (
                      int(header.group(3))
                      if header.group(3)
                      else None
                  )
                  sprite_id = (
                      linked_id
                      if linked_id is not None
                      else entry_id
                  )

                  section = (
                      (header.group(4) or "")
                      + "\n"
                      + content[header.end():end]
                  )

                  actions = []

                  for line in section.splitlines():
                      tokens = line.strip().split()

                      if len(tokens) < 6:
                          continue

                      try:
                          action_id = int(tokens[0])
                          directional = int(tokens[1])
                          count = int(tokens[2])
                      except ValueError:
                          continue

                      if (
                          not 0 <= action_id < 100
                          or directional not in (0, 1)
                          or not 1 <= count <= 128
                          or len(tokens) < 3 + 3 * count
                      ):
                          continue

                      frames = []
                      valid = True

                      for n in range(count):
                          pos = 3 + n * 3
                          duration_token = tokens[pos + 2]
                          duration_match = re.match(
                              r"^(-?\d+)(.*)$",
                              duration_token
                          )

                          if not duration_match:
                              valid = False
                              break

                          try:
                              image_id = int(tokens[pos])
                              index = int(tokens[pos + 1])
                          except ValueError:
                              valid = False
                              break

                          frames.append({
                              "image_id": image_id,
                              "frame_index": index,
                              "duration": int(
                                  duration_match.group(1)
                              ),
                              "modifiers": duration_match.group(2)
                          })

                      if valid and len(frames) == count:
                          actions.append({
                              "action_id": action_id,
                              "action_name": "",
                              "directional": directional,
                              "frames": frames,
                              "declared_frame_count": count,
                              "format": "COMPACT_CANDIDATE"
                          })

                  if actions:
                      entries.append({
                          "entry_id": entry_id,
                          "sprite_id": sprite_id,
                          "image_count": int(
                              header.group(2)
                          ),
                          "actions": actions
                      })

              return entries

          def bounded_zlib(data, wbits):
              try:
                  decoder = zlib.decompressobj(wbits)
                  result = decoder.decompress(
                      data, MAX_DECODED + 1
                  )
                  if (
                      decoder.eof
                      and 0 < len(result) <= MAX_DECODED
                  ):
                      return result
              except zlib.error:
                  pass
              return None

          def variants(raw):
              results = [("raw", raw)]
              seen = {
                  hashlib.sha256(raw).digest()
              }

              def add(name, data):
                  if data is None:
                      return

                  if not 0 < len(data) <= MAX_DECODED:
                      return

                  digest = hashlib.sha256(
                      data
                  ).digest()

                  if digest not in seen:
                      seen.add(digest)
                      results.append((name, data))

              for offset in (0, 4, 8, 12, 16):
                  if offset >= len(raw):
                      continue

                  chunk = raw[offset:]

                  for name, wbits in (
                      ("zlib", 15),
                      ("gzip", 31),
                      ("deflate", -15)
                  ):
                      add(
                          f"{name}_{offset}",
                          bounded_zlib(chunk, wbits)
                      )

              for offset in (0, 4):
                  if offset >= len(raw):
                      continue

                  chunk = raw[offset:]

                  if chunk.startswith(b"BZh"):
                      try:
                          obj = bz2.BZ2Decompressor()
                          decoded = obj.decompress(
                              chunk,
                              max_length=MAX_DECODED + 1
                          )
                          if obj.eof:
                              add(
                                  f"bzip2_{offset}",
                                  decoded
                              )
                      except (OSError, EOFError):
                          pass

                  if chunk.startswith(b"\xfd7zXZ\x00"):
                      try:
                          obj = lzma.LZMADecompressor()
                          decoded = obj.decompress(
                              chunk,
                              max_length=MAX_DECODED + 1
                          )
                          if obj.eof:
                              add(
                                  f"xz_{offset}",
                                  decoded
                              )
                      except (lzma.LZMAError, EOFError):
                          pass

              return results

          def decode_text(data):
              for encoding in (
                  "utf-8-sig", "cp949",
                  "big5", "utf-16"
              ):
                  try:
                      content = data.decode(
                          encoding
                      )
                  except UnicodeError:
                      continue

                  if HEADER.search(content):
                      return content, encoding

              return None, None

          source_rows = []
          action_rows = []
          frame_rows = []
          recovered_entries = 0
          truncated = False

          for n, candidate in enumerate(candidates):
              path = CLIENT / candidate["archive_path"]

              record = {
                  "source": candidate["source"],
                  "name": candidate["name"],
                  "kind": candidate["kind"],
                  "bytes": candidate["bytes"],
                  "status": "",
                  "first_32_hex": "",
                  "sha256": "",
                  "variant": "",
                  "encoding": "",
                  "parsed_entries": 0,
                  "parsed_actions": 0,
                  "reason": ""
              }

              try:
                  if not path.is_file():
                      raise FileNotFoundError(
                          "SOURCE_PACKAGE_NOT_EXTRACTED"
                      )

                  if candidate["bytes"] > MAX_RAW:
                      raise ValueError(
                          "METADATA_EXCEEDS_SIZE_LIMIT"
                      )

                  with path.open("rb") as f:
                      f.seek(candidate["offset"])
                      raw = f.read(
                          candidate["bytes"]
                      )

                  if len(raw) != candidate["bytes"]:
                      raise IOError(
                          "SHORT_SOURCE_READ"
                      )

                  sha = hashlib.sha256(raw).hexdigest()

                  record["first_32_hex"] = raw[
                      :32
                  ].hex(" ")
                  record["sha256"] = sha

                  safe_name = re.sub(
                      r"[^A-Za-z0-9_.-]",
                      "_",
                      Path(candidate["name"]).name
                  )[:75]

                  output = REPORT / "raw" / (
                      f"{n:04d}_{sha[:12]}_{safe_name}"
                  )

                  output.write_bytes(raw)

                  best = None

                  for method, decoded in variants(raw):
                      content, encoding = decode_text(
                          decoded
                      )

                      if content is None:
                          continue

                      entries = parse_standard(
                          content
                      )

                      if not entries:
                          entries = parse_compact(
                              content
                          )

                      count = sum(
                          len(e["actions"])
                          for e in entries
                      )

                      if (
                          best is None
                          or count > best["count"]
                      ):
                          best = {
                              "count": count,
                              "entries": entries,
                              "method": method,
                              "encoding": encoding
                          }

                  if best is None:
                      record["status"] = (
                          "BINARY_OR_ENCRYPTED_FORMAT"
                      )
                      record["reason"] = (
                          "No recognized plaintext "
                          "sprite-action list"
                      )
                      source_rows.append(record)
                      continue

                  if best["count"] == 0:
                      record["status"] = (
                          "TEXT_WITHOUT_VALID_ACTIONS"
                      )
                      source_rows.append(record)
                      continue

                  record["status"] = (
                      "PARSED_SOURCE_ACTIONS"
                  )
                  record["variant"] = best["method"]
                  record["encoding"] = best["encoding"]
                  record["parsed_entries"] = len(
                      best["entries"]
                  )
                  record["parsed_actions"] = best["count"]

                  recovered_entries += len(
                      best["entries"]
                  )

                  for entry in best["entries"]:
                      sprite_id = entry["sprite_id"]

                      for action in entry["actions"]:
                          action_rows.append({
                              "source": candidate["source"],
                              "entry_id": entry["entry_id"],
                              "sprite_id": sprite_id,
                              "action_id": action["action_id"],
                              "source_action_name": (
                                  action["action_name"]
                              ),
                              "directional": action["directional"],
                              "frame_count": len(
                                  action["frames"]
                              ),
                              "format": action["format"],
                              "source_sha256": sha
                          })

                          directions = (
                              range(8)
                              if action["directional"] == 1
                              else (0,)
                          )

                          for direction in directions:
                              for order, frame in enumerate(
                                  action["frames"]
                              ):
                                  if len(frame_rows) >= MAX_FRAME_ROWS:
                                      truncated = True
                                      break

                                  subid = (
                                      frame["image_id"]
                                      + direction
                                  )

                                  packages = sorted(
                                      sprite_lookup.get(
                                          (sprite_id, subid), ()
                                      )
                                  )

                                  inspected = known_frames.get(
                                      (sprite_id, subid), []
                                  )

                                  if inspected:
                                      within = any(
                                          0 <= frame["frame_index"]
                                          < x["frames"]
                                          for x in inspected
                                      )

                                      check = (
                                          "FRAME_INDEX_CONFIRMED"
                                          if within
                                          else "FRAME_INDEX_NOT_FOUND_IN_V9"
                                      )
                                  elif packages:
                                      check = (
                                          "SPR_FILE_EXISTS_"
                                          "FRAME_COUNT_UNVERIFIED"
                                      )
                                  else:
                                      check = "SPR_FILE_NOT_IN_V2"

                                  frame_rows.append({
                                      "source": candidate["source"],
                                      "entry_id": entry["entry_id"],
                                      "sprite_id": sprite_id,
                                      "action_id": action["action_id"],
                                      "source_action_name": (
                                          action["action_name"]
                                      ),
                                      "directional": (
                                          action["directional"]
                                      ),
                                      "direction": direction,
                                      "sequence_index": order,
                                      "image_id": frame["image_id"],
                                      "subid": subid,
                                      "frame_index": (
                                          frame["frame_index"]
                                      ),
                                      "original_duration_value": (
                                          frame["duration"]
                                      ),
                                      "modifiers": frame["modifiers"],
                                      "available_spr_packages": (
                                          ",".join(packages)
                                      ),
                                      "verification": check
                                  })

                              if truncated:
                                  break

                          if truncated:
                              break

                      if truncated:
                          break

                  source_rows.append(record)

              except Exception as exc:
                  record["status"] = "READ_OR_PARSE_ERROR"
                  record["reason"] = str(exc)
                  source_rows.append(record)

          write_csv(
              "03_extracted_source_status.csv",
              source_rows,
              [
                  "source", "name", "kind", "bytes",
                  "status", "first_32_hex",
                  "sha256", "variant", "encoding",
                  "parsed_entries", "parsed_actions",
                  "reason"
              ]
          )

          write_csv(
              "04_original_action_definitions.csv",
              action_rows,
              [
                  "source", "entry_id",
                  "sprite_id", "action_id",
                  "source_action_name", "directional",
                  "frame_count", "format",
                  "source_sha256"
              ]
          )

          write_csv(
              "05_original_action_frame_sequences.csv",
              frame_rows,
              [
                  "source", "entry_id",
                  "sprite_id", "action_id",
                  "source_action_name",
                  "directional", "direction",
                  "sequence_index", "image_id",
                  "subid", "frame_index",
                  "original_duration_value",
                  "modifiers",
                  "available_spr_packages",
                  "verification"
              ]
          )

          status_counts = Counter(
              x["status"] for x in source_rows
          )

          frame_status = Counter(
              x["verification"] for x in frame_rows
          )

          summary = {
              "phase": "ORIGINAL_ANIMATION_DEFINITION_ANALYSIS",
              "indexed_sprite_files": len(v2),
              "indexed_sprite_subid_pairs": len(
                  sprite_lookup
              ),
              "original_list_candidates": len(candidates),
              "source_status_counts": dict(status_counts),
              "parsed_actor_entries": recovered_entries,
              "parsed_action_records": len(action_rows),
              "expanded_action_frame_rows": len(frame_rows),
              "frame_verification": dict(frame_status),
              "frame_rows_truncated": truncated,
              "action_names_from_original_source_only": True,
              "pak_precedence_verified": False,
              "duration_unit_verified": False,
              "monster_identity_crosscheck_complete": False
          }

          (REPORT / "06_summary_v11.json").write_text(
              json.dumps(
                  summary,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          report = [
              "Sanctuary of Aden V11",
              "",
              "Original animation-definition candidates: "
              + str(len(candidates)),
              "Parsed action definitions: "
              + str(len(action_rows)),
              "Frame-direction references: "
              + str(len(frame_rows)),
              "",
              "Source files were discovered from the V1 inventory.",
              "Only candidate packages were selectively extracted.",
              "Binary or unrecognized list.spz sources remain raw.",
              "Action names are taken only from parsed source text.",
              "Frame timing units are not assumed.",
              "PAK precedence is not assumed.",
              "Absent sources do not imply absent sprite images."
          ]

          (REPORT / "REPORT.txt").write_text(
              "\n".join(report) + "\n",
              encoding="utf-8"
          )

          print("=== V11 SUMMARY ===")
          print(json.dumps(
              summary,
              ensure_ascii=False,
              indent=2
          ))

          for row in source_rows:
              print("SOURCE", row)

          path = os.environ.get("GITHUB_STEP_SUMMARY")
          if path:
              with open(
                  path, "a", encoding="utf-8"
              ) as f:
                  f.write("\n".join(report) + "\n")

          PY

      - name: Upload V11 original motion source analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-V11-Original-Animation-Definitions
          path: reports/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
