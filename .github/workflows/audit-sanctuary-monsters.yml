
name: audit-sanctuary-monsters.yml

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-sanctuary-monsters.yml"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    name: "V24 | 492EV Attack and Death Motion Audit"
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: "V24 | Restore verified V23 integrated monster HTML"
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39097070350
          name: SLKnight-V23-492EV-Motion-Audit
          github-token: ${{ github.token }}
          path: previous-v23

      - name: "V24 | Restore verified V229R7 original game"
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39050634920
          name: github-pages
          github-token: ${{ github.token }}
          path: previous-game

      - name: "V24 | Verify sources and prepare original assets"
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p site reports

          test -s previous-v23/events.json
          test -s previous-v23/summary.json
          test -s previous-v23/SLKnight-492-Motion-Integrated.html
          test -s previous-game/artifact.tar

          tar -xf previous-game/artifact.tar -C site

          test -s site/knight/gameasync/Data/Scripts.rxdata
          test -d site/knight/gameasync/Graphics/Characters

          sudo apt-get update -qq
          sudo apt-get install -y -qq ruby python3-pil

          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path('previous-v23')
          rows=json.loads((root/'events.json').read_text())
          stats=json.loads((root/'summary.json').read_text())

          assert len(rows)==492
          assert stats['events']==492
          assert stats['unique_names']==125
          assert stats['usable_graphics']==83
          assert stats['unlinked_events']==0

          print('V24_BASE_V23_VERIFIED')
          print('492 EV / 125 NAMES / 83 GRAPHICS')
          PY

      - name: "V24 | Inspect RPG Maker attack and death commands"
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/v24_source.rb <<'RUBY'
          require 'json'
          require 'zlib'

          class RGSSOpaque
            def self._load(_raw)
              allocate
            end
          end

          class Table < RGSSOpaque; end
          class Color < RGSSOpaque; end
          class Tone < RGSSOpaque; end
          class Rect < RGSSOpaque; end

          module RPG
            class Map; end
            class Event
              class Page
                class Condition; end
                class Graphic; end
              end
            end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
            class CommonEvent; end
            class AudioFile; end
            class Animation
              class Frame; end
              class Timing; end
            end
          end

          def iv(object,key)
            object && object.instance_variable_get("@#{key}")
          end

          def utf(value)
            s=value.to_s.dup.force_encoding('UTF-8')
            return s if s.valid_encoding?
            s.force_encoding('CP949')
            s.encode('UTF-8',invalid: :replace,undef: :replace)
          end

          root='site/knight/gameasync/Data'
          rows=JSON.parse(
            File.read('previous-v23/events.json')
          )

          map_files={}
          Dir.glob("#{root}/**/*Map*.rxdata").each do |path|
            m=File.basename(path).match(/Map(\d+)\.rxdata$/i)
            next unless m
            id=m[1].to_i
            if !map_files[id] || File.size(path)>File.size(map_files[id])
              map_files[id]=path
            end
          end

          raise 'MAP_DATA_MISSING' if map_files.empty?

          cache={}
          results=[]

          rows.each do |row|
            mid=row['map_id'].to_i
            eid=row['event_id'].to_i
            event=nil
            errors=[]

            if map_files[mid]
              unless cache.key?(mid)
                begin
                  cache[mid]=Marshal.load(
                    File.binread(map_files[mid])
                  )
                rescue => e
                  cache[mid]=nil
                  warn "MAP_LOAD_ERROR #{mid}: #{e.message}"
                end
              end

              event=(iv(cache[mid],:events)||{})[eid]
              errors << 'EVENT_MISSING' unless event
            else
              errors << 'MAP_MISSING'
            end

            direct_animations=[]
            changed_graphics=[]
            script_hints=[]
            common_events=[]

            if event
              (iv(event,:pages)||[]).each_with_index do |page,pi|
                page_graphic=utf(
                  iv(iv(page,:graphic),:character_name)
                ).strip

                routes=[iv(page,:move_route)]

                (iv(page,:list)||[]).each_with_index do |cmd,ci|
                  code=iv(cmd,:code).to_i
                  params=iv(cmd,:parameters)||[]

                  if code==207
                    aid=params[1]
                    if aid.is_a?(Integer) && aid>0
                      direct_animations << {
                        'id'=>aid,
                        'page'=>pi+1,
                        'command'=>ci,
                        'kind'=>'EVENT_COMMAND_207'
                      }
                    end
                  end

                  if code==209
                    routes << params[1]
                  end

                  if code==117
                    ce=params[0]
                    common_events << ce if ce.is_a?(Integer)
                  end

                  if [355,655,108,408].include?(code)
                    str=utf(params[0])
                    if str.match?(
                      /attack|death|die|animation|sprite|공격|사망|피격/i
                    )
                      script_hints << {
                        'page'=>pi+1,
                        'code'=>code,
                        'text'=>str[0,180]
                      }
                    end
                  end
                end

                routes.compact.each do |route|
                  (iv(route,:list)||[]).each do |move|
                    next unless iv(move,:code).to_i==41

                    name=utf(
                      (iv(move,:parameters)||[])[0]
                    ).strip

                    next if name.empty?

                    changed_graphics << {
                      'page'=>pi+1,
                      'source'=>page_graphic,
                      'target'=>name
                    }
                  end
                end
              end
            end

            results << {
              'map_id'=>mid,
              'event_id'=>eid,
              'monster'=>row['monster'],
              'actual_event_name'=>utf(iv(event,:name)),
              'direct_animations'=>direct_animations.uniq,
              'changed_graphics'=>changed_graphics.uniq,
              'script_hints'=>script_hints.uniq,
              'common_events'=>common_events.uniq,
              'errors'=>errors
            }
          end

          animation_db={}
          animation_files=Dir.glob(
            "#{root}/**/*Animations.rxdata"
          )

          animation_file=animation_files.max_by do |p|
            File.size(p)
          end

          if animation_file
            begin
              animations=Marshal.load(
                File.binread(animation_file)
              )

              animations.each_with_index do |anim,i|
                next unless anim

                id=iv(anim,:id)||i

                animation_db[id.to_s]={
                  'id'=>id,
                  'name'=>utf(iv(anim,:name)),
                  'sheet1'=>utf(iv(anim,:animation1_name)),
                  'sheet2'=>utf(iv(anim,:animation2_name)),
                  'frames'=>(iv(anim,:frames)||[]).size,
                  'position'=>iv(anim,:position)
                }
              end
            rescue => e
              warn "ANIMATION_DB_ERROR #{e.message}"
            end
          end

          script_matches=[]
          scripts_file=Dir.glob(
            "#{root}/**/Scripts.rxdata"
          ).max_by{|p|File.size(p)}

          if scripts_file
            begin
              Marshal.load(
                File.binread(scripts_file)
              ).each do |entry|
                next unless entry.is_a?(Array)
                next unless entry.size>=3

                name=utf(entry[1])

                begin
                  code=utf(
                    Zlib::Inflate.inflate(entry[2])
                  )
                rescue
                  next
                end

                attack=code.scan(
                  /attack|공격|atk/i
                ).size

                death=code.scan(
                  /death|die|dead|사망|죽음/i
                ).size

                animation=code.scan(
                  /animation_id|animation_name/i
                ).size

                next if attack+death+animation==0

                script_matches << {
                  'name'=>name,
                  'attack_hits'=>attack,
                  'death_hits'=>death,
                  'animation_hits'=>animation
                }
              end
            rescue => e
              warn "SCRIPTS_SCAN_ERROR #{e.message}"
            end
          end

          raise '492_EVENT_COUNT_CHANGED' unless results.size==492

          File.write(
            'reports/v24-event-evidence.json',
            JSON.pretty_generate(results)
          )

          File.write(
            'reports/v24-animation-database.json',
            JSON.pretty_generate(animation_db)
          )

          File.write(
            'reports/v24-script-evidence.json',
            JSON.pretty_generate(script_matches)
          )

          puts "V24_EVENTS #{results.size}"
          puts "V24_DIRECT_ANIMATION_CALLS " +
            results.sum{|r|r['direct_animations'].size}.to_s
          puts "V24_GRAPHIC_CHANGES " +
            results.sum{|r|r['changed_graphics'].size}.to_s
          puts "V24_ANIMATION_DATABASE #{animation_db.size}"
          puts "V24_SCRIPT_CANDIDATES #{script_matches.size}"
          RUBY

          ruby /tmp/v24_source.rb

      - name: "V24 | Build four-direction attack and death candidate previews"
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/v24_integrate.py <<'PY'
          from pathlib import Path
          from collections import defaultdict
          from io import BytesIO
          from PIL import Image
          import base64
          import csv
          import hashlib
          import json
          import re
          import unicodedata

          root=Path('reports')
          previous=Path('previous-v23')
          game=Path('site/knight/gameasync')

          original=(
              previous/'SLKnight-492-Motion-Integrated.html'
          ).read_text(encoding='utf-8')

          match=re.search(
              r'<script id="data" type="application/json">(.*?)</script>',
              original,re.S
          )

          if not match:
              raise RuntimeError('V23 embedded monster database missing')

          db=json.loads(match.group(1))
          rows=db['rows']
          assets=db['assets']

          assert len(rows)==492
          assert len(assets)==83
          assert all(r['primary_asset'] for r in rows)

          evidence=json.loads(
              (root/'v24-event-evidence.json').read_text()
          )

          animations=json.loads(
              (root/'v24-animation-database.json').read_text()
          )

          script_evidence=json.loads(
              (root/'v24-script-evidence.json').read_text()
          )

          event_by_key={
              f"{r['map_id']}:{r['event_id']}":r
              for r in evidence
          }

          def norm(name):
              name=str(name).replace('\\','/').split('/')[-1]
              if name.lower().endswith('.png'):
                  name=name[:-4]
              return unicodedata.normalize('NFC',name).casefold()

          character_root=game/'Graphics/Characters'
          animation_root=game/'Graphics/Animations'

          characters={}
          for file in character_root.rglob('*'):
              if file.is_file() and file.suffix.lower()=='.png':
                  characters.setdefault(norm(file.stem),file)

          animation_sheets={}
          if animation_root.exists():
              for file in animation_root.rglob('*'):
                  if file.is_file() and file.suffix.lower()=='.png':
                      animation_sheets.setdefault(norm(file.stem),file)

          def gif(frames,delay=145):
              indexed=[]

              for rgba in frames:
                  rgba=rgba.convert('RGBA')
                  pal=rgba.convert('RGB').quantize(colors=255)
                  mask=rgba.getchannel('A').point(
                      lambda a:255 if a<128 else 0
                  )
                  pal.paste(255,mask=mask)
                  indexed.append(pal)

              data=BytesIO()

              indexed[0].save(
                  data,
                  format='GIF',
                  save_all=True,
                  append_images=indexed[1:],
                  duration=delay,
                  loop=0,
                  transparency=255,
                  disposal=2,
                  optimize=False
              )

              return base64.b64encode(
                  data.getvalue()
              ).decode('ascii')

          def four_directions(file):
              with Image.open(file) as img:
                  sheet=img.convert('RGBA')

              w,h=sheet.size

              if w<8 or h<8 or w%4 or h%4:
                  return None

              cw,ch=w//4,h//4

              if cw>512 or ch>512:
                  return None

              result={}

              for direction in range(4):
                  frames=[
                      sheet.crop((
                          i*cw,direction*ch,
                          (i+1)*cw,(direction+1)*ch
                      ))
                      for i in range(4)
                  ]

                  result[str(direction)]=gif(frames)

              return result

          families=defaultdict(list)

          for row in rows:
              families[row['primary_asset']].append(row)

          attack_re=re.compile(
              r'attack|atk|attk|공격|타격',
              re.I
          )

          death_re=re.compile(
              r'death|dead|die|dying|사망|죽음',
              re.I
          )

          candidate_families={}
          preview_cache={}

          for sha,members in families.items():
              base_names=assets[sha].get('source_files',[])
              base_keys=[norm(x) for x in base_names]

              known_names=set()

              for member in members:
                  for name in member.get('graphics',[]):
                      known_names.add(name)

                  key=f"{member['map_id']}:{member['event_id']}"
                  event=event_by_key.get(key,{})

                  for change in event.get('changed_graphics',[]):
                      known_names.add(change['target'])

              # Same graphic is authoritative.
              # Similar names create review candidates, not verified links.
              candidates={'attack':[],'death':[]}

              for name in known_names:
                  file=characters.get(norm(name))
                  if file is None:
                      continue

                  if attack_re.search(name):
                      candidates['attack'].append(file)

                  if death_re.search(name):
                      candidates['death'].append(file)

              for filename,file in characters.items():
                  if not base_keys:
                      continue

                  related=any(
                      filename.startswith(base+'_') or
                      filename.startswith(base+'-')
                      for base in base_keys
                  )

                  if not related:
                      continue

                  if attack_re.search(filename):
                      candidates['attack'].append(file)

                  if death_re.search(filename):
                      candidates['death'].append(file)

              result={'attack':[],'death':[]}

              for kind in ('attack','death'):
                  used=set()

                  for file in candidates[kind]:
                      if str(file) in used:
                          continue

                      used.add(str(file))

                      if len(result[kind])>=3:
                          break

                      if str(file) not in preview_cache:
                          preview_cache[str(file)]=four_directions(file)

                      frames=preview_cache[str(file)]

                      if frames:
                          result[kind].append({
                              'file':file.stem,
                              'directions':frames,
                              'status':'CANDIDATE_NOT_VERIFIED'
                          })

              candidate_families[sha]=result

          def thumbnail(file):
              try:
                  with Image.open(file) as img:
                      im=img.convert('RGBA')

                  im.thumbnail((340,340))

                  stream=BytesIO()
                  im.save(stream,format='PNG')

                  return base64.b64encode(
                      stream.getvalue()
                  ).decode('ascii')
              except Exception:
                  return ''

          referenced_ids=set()

          for event in evidence:
              for call in event['direct_animations']:
                  referenced_ids.add(call['id'])

          effect_previews={}

          for aid in sorted(referenced_ids):
              meta=animations.get(str(aid),{})
              thumbs=[]

              for field in ('sheet1','sheet2'):
                  name=meta.get(field,'')
                  file=animation_sheets.get(norm(name))

                  if file:
                      encoded=thumbnail(file)
                      if encoded:
                          thumbs.append({
                              'name':file.stem,
                              'png':encoded
                          })

              effect_previews[str(aid)]={
                  'name':meta.get('name',''),
                  'frames':meta.get('frames',0),
                  'sheets':thumbs
              }

          family_effects={}

          for sha,members in families.items():
              group_effects={}

              for member in members:
                  key=f"{member['map_id']}:{member['event_id']}"
                  ev=event_by_key.get(key,{})

                  for call in ev.get('direct_animations',[]):
                      aid=call['id']

                      group_effects.setdefault(
                          aid,[]
                      ).append(
                          f"MAP {member['map_id']} EV {member['event_id']}"
                      )

              family_effects[sha]=[
                  {
                      'id':aid,
                      'sources':sorted(set(sources))
                  }
                  for aid,sources in sorted(group_effects.items())
              ]

          report_rows=[]

          for row in rows:
              key=f"{row['map_id']}:{row['event_id']}"
              ev=event_by_key.get(key,{})
              family=candidate_families[row['primary_asset']]

              report_rows.append({
                  'map_id':row['map_id'],
                  'event_id':row['event_id'],
                  'monster':row['monster'],
                  'graphic':row['primary_asset'],
                  'attack_candidates':len(family['attack']),
                  'death_candidates':len(family['death']),
                  'direct_animation_calls':len(
                      ev.get('direct_animations',[])
                  ),
                  'shared_graphic_events':row['shared_events'],
                  'errors':' | '.join(ev.get('errors',[]))
              })

          with (root/'V24-492EV-Motion-Evidence.csv').open(
              'w',encoding='utf-8-sig',newline=''
          ) as f:
              cols=list(report_rows[0])
              writer=csv.DictWriter(f,fieldnames=cols)
              writer.writeheader()
              writer.writerows(report_rows)

          stats={
              'version':'V24',
              'source_version':'V23',
              'target_events':len(rows),
              'original_graphics':len(assets),
              'unlinked_events':sum(
                  not r['primary_asset'] for r in rows
              ),
              'attack_candidate_graphics':sum(
                  bool(x['attack'])
                  for x in candidate_families.values()
              ),
              'death_candidate_graphics':sum(
                  bool(x['death'])
                  for x in candidate_families.values()
              ),
              'event_animation_references':sum(
                  len(e['direct_animations'])
                  for e in evidence
              ),
              'animation_database_entries':len(animations),
              'script_evidence_entries':len(script_evidence),
              'verified_attack_links':0,
              'verified_death_links':0,
              'original_game_modified':False
          }

          (root/'V24-summary.json').write_text(
              json.dumps(stats,ensure_ascii=False,indent=2),
              encoding='utf-8'
          )

          supplement={
              'families':candidate_families,
              'effects':effect_previews,
              'family_effects':family_effects,
              'events':event_by_key,
              'stats':stats
          }

          panel='''
          <section id="v24-panel">
          <h2>V24 · 원본 공격·사망 모션 대조</h2>
          <p class="warning">
          실제 이벤트 및 그래픽 데이터에서 찾은 후보입니다.
          원본 동작 연결이 확인되지 않은 후보는 확정 처리하지 않습니다.
          </p>
          <div class="motions">
          <div class="panel">
          <h2>공격 ATTACK · 4방향 후보</h2>
          <p id="v24-attack-label"></p>
          <div id="v24-attack" class="stage"></div>
          </div>
          <div class="panel">
          <h2>사망 DEATH · 4방향 후보</h2>
          <p id="v24-death-label"></p>
          <div id="v24-death" class="stage"></div>
          </div>
          </div>
          <h2>이벤트에서 직접 호출하는 애니메이션</h2>
          <p id="v24-effect-label"></p>
          <div id="v24-effects"></div>
          <h2>원본 이벤트 동작 근거</h2>
          <p id="v24-source-status"></p>
          </section>
          '''

          marker='<h2>점검 결과</h2>'

          if marker not in original:
              raise RuntimeError('V23 HTML panel anchor changed')

          original=original.replace(
              marker,panel+marker,1
          )

          script=r'''
          const v24=JSON.parse(
            document.getElementById('v24-data').textContent
          );

          function v24Text(id,value){
            document.getElementById(id).textContent=value;
          }

          function v24Frame(id,items,dir,labelId){
            const stage=document.getElementById(id);
            stage.replaceChildren();

            if(!items||!items.length){
              stage.textContent='원본 4방향 동작 미확인';
              v24Text(labelId,'연결 후보 없음');
              return;
            }

            const item=items[0];
            const src=item.directions[String(dir)];

            if(!src){
              stage.textContent='해당 방향 프레임 없음';
              return;
            }

            const img=document.createElement('img');
            img.src='data:image/gif;base64,'+src;
            img.alt=item.file+' · 후보 동작';
            stage.appendChild(img);

            v24Text(
              labelId,
              item.file+' · 후보 '+items.length+
              '개 · 원본 동작 여부 미확인'
            );
          }

          function renderV24(){
            const row=db.rows[selected];
            const key=row.map_id+':'+row.event_id;
            const source=v24.events[key]||{};
            const family=v24.families[row.primary_asset]||{
              attack:[],death:[]
            };

            const dir=document.getElementById('direction').value;

            v24Frame(
              'v24-attack',
              family.attack,
              dir,
              'v24-attack-label'
            );

            v24Frame(
              'v24-death',
              family.death,
              dir,
              'v24-death-label'
            );

            const effectList=v24.family_effects[
              row.primary_asset
            ]||[];

            const box=document.getElementById('v24-effects');
            box.replaceChildren();

            if(!effectList.length){
              v24Text(
                'v24-effect-label',
                '해당 그래픽 계열에서 직접 호출한 이펙트 없음'
              );
            }else{
              v24Text(
                'v24-effect-label',
                '동일 그래픽 계열의 이벤트 명령 207 근거 · '+
                effectList.length+'종'
              );

              for(const item of effectList){
                const meta=v24.effects[String(item.id)]||{};
                const container=document.createElement('div');
                container.className='panel';

                const title=document.createElement('p');
                title.textContent=
                  '이펙트 #'+item.id+' · '+
                  (meta.name||'이름 미확인')+
                  ' · 원본 '+(meta.frames||0)+'프레임';

                container.appendChild(title);

                const sources=document.createElement('p');
                sources.textContent='호출 위치: '+item.sources.join(', ');
                container.appendChild(sources);

                const description=document.createElement('p');
                description.textContent=
                  '아래 이미지는 원본 이펙트 시트입니다. '+
                  '몬스터의 공격 모션으로 확정한 것은 아닙니다.';
                container.appendChild(description);

                for(const sheet of (meta.sheets||[])){
                  const img=document.createElement('img');
                  img.src='data:image/png;base64,'+sheet.png;
                  img.alt=sheet.name;
                  img.style.maxWidth='100%';
                  img.style.imageRendering='pixelated';
                  container.appendChild(img);
                }

                box.appendChild(container);
              }
            }

            const changes=source.changed_graphics||[];
            const scripts=source.script_hints||[];

            v24Text(
              'v24-source-status',
              '그래픽 변경 '+changes.length+
              '건 / 직접 애니메이션 호출 '+
              (source.direct_animations||[]).length+
              '건 / 이벤트 스크립트 단서 '+
              scripts.length+'건 / '+
              '공격·사망 확정 연결은 별도 검증 필요'
            );
          }

          const v23Render=render;

          render=function(){
            v23Render();
            renderV24();
          };

          renderV24();
          '''

          payload=json.dumps(
              supplement,
              ensure_ascii=False,
              separators=(',',':')
          ).replace('<','\\u003c')

          injection=(
              '<script id="v24-data" type="application/json">'+
              payload+
              '</script><script>'+script+'</script>'
          )

          if '</body>' not in original:
              raise RuntimeError('V23 HTML closing tag missing')

          result=original.replace(
              '</body>',
              injection+'</body>',
              1
          )

          output=root/'SLKnight-492-Motion-Integrated-V24.html'
          output.write_text(result,encoding='utf-8')

          (root/'v24-ui.js').write_text(
              script,encoding='utf-8'
          )

          assert output.stat().st_size>10000

          print(json.dumps(stats,ensure_ascii=False))
          print('V24_INTEGRATED_HTML_CREATED',output.stat().st_size)
          PY

          python3 /tmp/v24_integrate.py

      - name: "V24 | Validate all 492 events and unified HTML"
        shell: bash
        run: |
          set -euo pipefail

          node --check reports/v24-ui.js

          python3 - <<'PY'
          from pathlib import Path
          import json
          import csv

          root=Path('reports')

          stats=json.loads(
              (root/'V24-summary.json').read_text()
          )

          evidence=json.loads(
              (root/'v24-event-evidence.json').read_text()
          )

          assert stats['version']=='V24'
          assert stats['target_events']==492
          assert stats['original_graphics']==83
          assert stats['unlinked_events']==0
          assert len(evidence)==492

          keys={
              (r['map_id'],r['event_id'])
              for r in evidence
          }

          assert len(keys)==492

          with (root/'V24-492EV-Motion-Evidence.csv').open(
              encoding='utf-8-sig'
          ) as f:
              assert len(list(csv.DictReader(f)))==492

          page=root/'SLKnight-492-Motion-Integrated-V24.html'
          assert page.stat().st_size>10000

          text=page.read_text(encoding='utf-8')

          for label in (
              'V24 · 원본 공격·사망 모션 대조',
              '공격 ATTACK',
              '사망 DEATH',
              'v24-attack',
              'v24-death',
              'v24-effect-label'
          ):
              assert label in text,label

          assert stats['original_game_modified'] is False

          print('V24_ALL_492_EVENTS_VALIDATED')
          print('V24_83_GRAPHIC_FAMILIES_PRESERVED')
          print('V24_ATTACK_DEATH_EVIDENCE_EXPORTED')
          PY

