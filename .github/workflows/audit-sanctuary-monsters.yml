
name: "audit-sanctuary-monsters.yml | V33 | 61CE Physical Motion ID and Bank Review"
run-name: "audit-sanctuary-monsters.yml | V33 | Sanctuary Source 4-Dir Multi-Bank Audit"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/audit-sanctuary-monsters.yml"]

permissions:
  contents: read
  actions: read

jobs:
  v33-audit:
    name: "V33 | Full monster source inventory, 492-event stats and Lv 0-10 HTML"
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "V33 | Restore V32 verified sources and exact historical decoder"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full python3-pil python3-yaml ruby
          mkdir -p source/v2 source/v12 v30 previous game reports downloads paks
          # Both workflows are pinned immutable committed source, not a moving branch.
          git show 312eb3417871916e7337fec8f93ad665f1b03160:.github/workflows/audit-sanctuary-monsters.yml > source/v32-pinned.yml
          git show 69d266d1a8b0d53b1bb4a8ca60b539b204f805c7:.github/workflows/audit-sanctuary-monsters.yml > source/v29-pinned.yml
          git show 5c40dc3de28ee879182c6f60802a89432072c138:.github/workflows/audit-sanctuary-monsters.yml > source/decoder.yml
          gh run download 38784834277 -R "$GITHUB_REPOSITORY" -n Sanctuary-V2-Reports -D source/v2
          gh run download 38872552732 -R "$GITHUB_REPOSITORY" -n Sanctuary-V12-External-Action-and-NPC-Crosscheck -D source/v12
          gh run download 39362135443 -R "$GITHUB_REPOSITORY" -n audit-sanctuary-monsters-v30-five-motion-review-61CE -D v30
          gh run download 39364651925 -R "$GITHUB_REPOSITORY" -n github-pages -D previous
          cp source/v2/all_sprite_candidates.csv source/all_sprite_candidates.csv
          cp source/v2/exported_sprite_manifest.csv source/exported_sprite_manifest.csv
          cp source/v12/03_external_npc_gfx_candidates.csv source/03_external_npc_gfx_candidates.csv
          test -s v30/V30-source-review.json
          test -s previous/artifact.tar
          test -s source/decoder.yml
          tar -xf previous/artifact.tar -C game --wildcards './knight/gameasync/Data/*.rxdata'
          test -s game/knight/gameasync/Data/Scripts.rxdata
          test -s game/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMapInfos.rxdata

      - name: "V33 | Reconstruct tested V32 audit logic and missing V29 decoder"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml,re,ast,sys
          from pathlib import Path
          v32=yaml.safe_load(Path('source/v32-pinned.yml').read_text(encoding='utf-8'))
          v29=yaml.safe_load(Path('source/v29-pinned.yml').read_text(encoding='utf-8'))
          old=v32['jobs']['v32-audit']['steps']
          def run_with(fragment):
              return next(x['run'] for x in old if fragment in x.get('name',''))
          def extract(run,filename,tag):
              rx=r"cat > "+re.escape(filename)+r" <<'"+tag+r"'\n(.*?)\n"+tag+r"(?:\n|$)"
              # Literal newlines, not backslash-n strings.
              rx=rx.replace('\\n',r'\n')
              match=re.search(rx,run,re.S)
              if not match:raise RuntimeError('Missing embedded source '+filename)
              return match.group(1)+'\n'
          ruby=extract(run_with('Read all V229 map event positions'),'/tmp/v32_events.rb','RUBY')
          processor=extract(run_with('Extract all monster candidate SPR banks'),'/tmp/v32_processor.py','PY')
          b64=extract(run_with('Extract all monster candidate SPR banks'),'source/V32-V230-review.b64','B64')
          assert len(processor)>18000 and len(b64)>11000 and len(ruby)>1500
          Path('/tmp/v33_events.rb').write_text(ruby,encoding='utf-8')
          Path('/tmp/v33_processor.py').write_text(processor.replace('V32','V33'),encoding='utf-8')
          Path('source/V33-V230-review.b64').write_text(b64,encoding='ascii')
          stage=next(x['run'] for x in v29['jobs'][next(iter(v29['jobs']))]['steps']
                     if 'Inspect all source motion banks' in x.get('name',''))
          decoder=extract(stage,'/tmp/v29_core.py','PY')
          assert all(('def '+fn+'(') in decoder for fn in ('original_reader','gif_encode'))
          ast.parse(decoder)
          ast.parse(processor.replace('V32','V33'))
          Path('/tmp/v29_core.py').write_text(decoder,encoding='utf-8')
          print('V33 VERIFIED: V32 Ruby, 492-row baseline, processor and V29 Reader/GIF decoder restored')
          PY
          ruby -c /tmp/v33_events.rb
          python3 -m py_compile /tmp/v29_core.py /tmp/v33_processor.py
          ruby /tmp/v33_events.rb game/knight/gameasync/Data source/V33-runtime-events.json
          test -s source/V33-runtime-events.json
          # Check decoder can load the original V17 Reader class before full extraction.
          python3 - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('verified_v29','/tmp/v29_core.py')
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          reader=mod.original_reader()
          assert callable(reader) and callable(mod.gif_encode)
          print('V33 VERIFIED: original SPR Reader and GIF encoder are available')
          PY

      - name: "V33 | Restore original Sanctuary SPR source PAKs"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          gh release download v1.0.0 -R "$GITHUB_REPOSITORY" --pattern "Sanctuary.of.Aden.-.Copy.*" -D downloads
          7z x downloads/Sanctuary.of.Aden.-.Copy.zip "Sanctuary of Aden - Copy/Sprite*.pak" "-o${PWD}/paks" -y > reports/V33-original-pak-extract.log
          test "$(find paks -type f -name 'Sprite*.pak' | wc -l)" -ge 17
          rm -rf downloads
          echo 'V33: all 17 original Sprite PAK archives extracted'

      - name: "V33 | Extract ALL candidates, validate original SHA and render Lv 0-10 HTML"
        run: |
          set -euo pipefail
          python3 /tmp/v33_processor.py
          test -s reports/V33-summary.json
          test -s reports/audit-sanctuary-monsters-V33-level-0-10-integrated.html

      - name: "V33 | Validate 492, cardinal directions, source hashes and integrated HTML"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,json,re,subprocess,collections
          from pathlib import Path
          p=Path('reports')
          s=json.loads((p/'V33-summary.json').read_text(encoding='utf-8'))
          assert s['version']=='V33'
          assert s['all_monster_rows']==492 and s['low_level_rows']==23
          assert s['all_runtime_map_files']>=40 and s['all_runtime_events']>=800
          assert s['source_indexed_spr']==158040 and s['source_inventory_actor_ids']>=8233
          assert s['monsters_source_candidate_ids']>=723
          assert s['selected_cardinal_spr']>=15000
          assert s['sha_checked_cardinal_spr']==s['selected_cardinal_spr']
          assert s['gif_count']>=1000,('Too few decoded original animations',s)
          assert not s['runtime_stats_applied'] and not s['motion_assignment_approved']
          g=list((p/'gifs').rglob('*.gif'))
          assert len(g)==s['gif_count']
          with (p/'V33-all-cardinal-gif-manifest.csv').open(encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==len(g)
          assert {int(x['direction']) for x in rows}=={1,3,5,7}
          assert all(x['byte_verified']=='True' and x['motion']=='UNCLASSIFIED' for x in rows)
          for f in [p/'V33-full-492-monster-db-review.csv',p/'V33-level-0-10-monster-db-review.csv']:
              assert f.is_file() and f.stat().st_size>2000
          h=(p/'audit-sanctuary-monsters-V33-level-0-10-integrated.html').read_text(encoding='utf-8')
          match=re.search(r'<script id="payload" type="application/json">(.*?)</script>',h,re.S)
          assert match and len(json.loads(match.group(1))['rows'])==23
          client=re.search(r'<script>(.*?)</script>',h,re.S)
          assert client
          Path('/tmp/v33-client.js').write_text(client.group(1),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/v33-client.js'],check=True)
          print('V33 COMPLETE',json.dumps(s,ensure_ascii=False))
          PY
          cat reports/V33-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: "V33 | Upload original 4-direction GIFs, complete DB and level 0-10 integrated HTML"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-sanctuary-monsters-v33-all-monsters-level-0-10
          path: reports/
          retention-days: 30
          if-no-files-found: warn
          compression-level: 0
