
# FILE: .github/workflows/audit-sanctuary-monsters.yml
# V36: Reuse verified V35 extraction logic.
# Fix the invalid >2000 NPC assertion.
# L1J reference stats are NOT original Sanctuary server stats.

name: "audit-sanctuary-monsters.yml | V36 | 61CE Physical Motion ID and Bank Review"
run-name: "audit-sanctuary-monsters.yml | V36 | Sanctuary Full Monster Data Audit / EXP 0-10"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/audit-sanctuary-monsters.yml"]

permissions:
  contents: read
  actions: read

jobs:
  v36-full-source-and-reference-audit:
    name: "V36 | Full source audit and corrected EXP verification"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "V36 | Restore exact V35 extraction code and check patch target"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-yaml

          git show 881d1701faf9053c4c2b29301c7f33672fdf6c1b:.github/workflows/audit-sanctuary-monsters.yml > /tmp/v35-pinned.yml

          cat > /tmp/v36-run-step.py <<'PY'
          #!/usr/bin/env python3
          """Replay V35 extraction with corrected validation."""
          import os
          import subprocess
          import sys
          from pathlib import Path
          import yaml

          pinned = Path('/tmp/v35-pinned.yml').read_text(
              encoding='utf-8'
          )
          wf = yaml.safe_load(pinned)
          stages = wf['jobs'][
              'v35-full-source-and-reference-audit'
          ]['steps']

          expected = [
              'Restore ALL V34 original SPR IDs',
              'Fetch genuine full 3.80c reference server SQL',
              'Recover Sanctuary original client TEXT',
              'Parse ALL NPC records, reverse EXP',
              'Audit original archive contents',
              'Parse every Text/Tile PAK index',
              'Reuse all 17 complete source GIF packages',
              'Render 0..10 EXP view',
              'Audit completeness, source labels',
          ]

          assert len(sys.argv) == 2
          number = int(sys.argv[1])
          assert 1 <= number <= len(expected)

          token = expected[number - 1]
          found = [
              s for s in stages
              if token in s.get('name', '')
          ]

          assert len(found) == 1, token
          assert isinstance(found[0].get('run'), str)

          script = found[0]['run']

          # Preserve all working extraction logic.
          # Only advance versioned paths and report names.
          script = script.replace('V35', 'V36')
          script = script.replace('v35', 'v36')

          if number == 9:
              old = (
                  "assert s['reference_all_monster_npc_ids']>2000"
              )
              new = (
                  "assert s['reference_all_monster_npc_ids']>0\n"
                  "assert s['reference_all_monster_npc_ids']"
                  ">=s['reference_exp_exact_level_0_10_npc_ids']"
              )

              assert script.count(old) == 1, (
                  'Missing V35 validation bug'
              )
              script = script.replace(old, new, 1)
          else:
              assert (
                  'reference_all_monster_npc_ids' not in script
                  or number == 4
              )

          print(
              f'V36 stage {number}/9: {token}',
              flush=True
          )

          subprocess.run(
              ['bash', '-euo', 'pipefail', '-c', script],
              check=True,
              cwd=os.getcwd(),
              env=os.environ.copy()
          )
          PY

          python3 -m py_compile /tmp/v36-run-step.py

          python3 - <<'PY'
          import yaml

          wf = yaml.safe_load(
              open('/tmp/v35-pinned.yml', encoding='utf-8')
          )
          scripts = [
              s.get('run', '')
              for s in wf['jobs'][
                  'v35-full-source-and-reference-audit'
              ]['steps']
          ]

          needle = (
              "assert s['reference_all_monster_npc_ids']>2000"
          )

          assert sum(
              s.count(needle) for s in scripts
          ) == 1

          print('V35 original code and patch target verified')
          PY

      - name: "V36 | Restore ALL 8233 Sanctuary SPR IDs"
        run: python3 /tmp/v36-run-step.py 1

      - name: "V36 | Fetch all pinned L1J NPC / spawn / drop SQL"
        run: python3 /tmp/v36-run-step.py 2

      - name: "V36 | Inspect original Sanctuary client assets"
        run: python3 /tmp/v36-run-step.py 3

      - name: "V36 | Extract ALL NPC data and reverse EXP to infer levels"
        run: python3 /tmp/v36-run-step.py 4

      - name: "V36 | Audit original Sanctuary file metadata"
        run: python3 /tmp/v36-run-step.py 5

      - name: "V36 | Audit Text and Tile PAK indexes"
        run: python3 /tmp/v36-run-step.py 6

      - name: "V36 | Reuse V34 original GIFs from all 17 PAKs"
        run: python3 /tmp/v36-run-step.py 7

      - name: "V36 | Build HTML for only EXP-inferred levels 0..10"
        run: python3 /tmp/v36-run-step.py 8

      - name: "V36 | Validate actual DB totals, EXP and HTML JavaScript"
        run: python3 /tmp/v36-run-step.py 9

      - name: "V36 | Upload 0..10 HTML only"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-sanctuary-monsters-v36-exp-0-10-html
          path: v36-output/audit-sanctuary-monsters-V36-EXP-0-10-reference.html
          retention-days: 30
          if-no-files-found: warn
          compression-level: 0

      - name: "V36 | Upload complete NPC, spawn, drop and source audit"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-sanctuary-monsters-v36-all-data-source-separated
          path: |
            v36-output/*.csv
            v36-output/*.json
            v36-output/*.log
            reference-sql/*.sql
          retention-days: 30
          if-no-files-found: warn
          compression-level: 6
