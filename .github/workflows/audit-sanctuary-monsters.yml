
# FILE: .github/workflows/audit-sanctuary-monsters.yml
# V44: Correct V43 missing GIF archive path; continue original SPR recheck.
name: "audit-sanctuary-monsters.yml | V44 | 61CE Physical Motion ID and Bank Review"
run-name: "audit-sanctuary-monsters.yml | V44 | Sanctuary Full Monster Data Audit / EXP 0-10"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/audit-sanctuary-monsters.yml"]

permissions:
  contents: read
  actions: read

jobs:
  original-text:
    name: "V44 | Original SPR recheck and missing GIF recovery"
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "V44 | Restore V34 original indexes and GIFs"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full python3-pil python3-yaml
          mkdir -p source packages v44-output
          gh run download 39386289505 -R "$GITHUB_REPOSITORY" \
            -n audit-sanctuary-monsters-v34-all-source-database -D source
          gh run download 39386289505 -R "$GITHUB_REPOSITORY" \
            -n audit-sanctuary-monsters-v34-all-original-cardinal-gifs -D packages
          test -s source/V34-decoding-errors.csv
          test -s source/V34-all-source-sprite-index.csv
          test -s source/V34-all-cardinal-gif-manifest.csv
          test "$(find packages -type f -name 'V34-*-cardinal-gifs.zip' | wc -l)" -eq 17

      - name: "V44 | Restore the 39 already verified missing actors"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, hashlib, zipfile
          from pathlib import Path

          wanted = {
              33, 51, 335, 816, 1520, 2728, 2968, 4478, 4480, 4486,
              4490, 4826, 4831, 4888, 4933, 4944, 5063, 5085, 5114,
              5197, 5203, 5244, 5246, 5249, 5256, 5300, 5645, 5767,
              5802, 7351, 7590, 7621, 7720, 8047, 8057, 8175, 8229,
              8239, 11490,
          }
          manifest = {}
          with open('source/V34-all-cardinal-gif-manifest.csv', encoding='utf-8-sig', newline='') as f:
              for row in csv.DictReader(f):
                  if int(row['actor']) in wanted and row['gif'] and row['byte_verified'] == 'True':
                      manifest[row['gif'].removeprefix('gifs/')] = (int(row['actor']), row['gif_sha256'])
          restored = set()
          recovered_files = 0
          for path in sorted(Path('packages').rglob('V34-*-cardinal-gifs.zip')):
              with zipfile.ZipFile(path) as pack:
                  for name in pack.namelist():
                      if name not in manifest:
                          continue
                      actor, expected = manifest[name]
                      raw = pack.read(name)
                      if hashlib.sha256(raw).hexdigest() != expected:
                          raise RuntimeError('Original GIF digest mismatch: ' + name)
                      target = Path('v44-output/gifs') / name
                      target.parent.mkdir(parents=True, exist_ok=True)
                      if target.exists() and target.read_bytes() != raw:
                          raise RuntimeError('Conflicting original GIF: ' + name)
                      target.write_bytes(raw)
                      restored.add(actor)
                      recovered_files += 1
          if restored != wanted:
              raise RuntimeError('Missing source GIF actors: ' + str(sorted(wanted - restored)))
          if recovered_files != len(manifest):
              raise RuntimeError(f'Missing original GIF files: {len(manifest)-recovered_files}')
          print('Restored original sprite IDs:', len(restored))
          print('Restored verified GIFs:', recovered_files)
          PY
          rm -rf packages

      - name: "V44 | Restore original Sanctuary SPR packs"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p archive original
          gh release download v1.0.0 -R "$GITHUB_REPOSITORY" \
            --pattern 'Sanctuary.of.Aden.-.Copy.*' -D archive
          7z x archive/Sanctuary.of.Aden.-.Copy.zip \
            'Sanctuary of Aden - Copy/Sprite*.pak' \
            -o./original -y
          test -s 'original/Sanctuary of Aden - Copy/Sprite.pak'
          test "$(find original -type f -name 'Sprite*.pak' | wc -l)" -eq 17
          rm -rf archive
          git show 5c40dc3de28ee879182c6f60802a89432072c138:.github/workflows/audit-sanctuary-monsters.yml > /tmp/v44-original-decoder.yml

      - name: "V44 | Recheck failed SPRs, missing IDs and identical sprites"
        run: |
          set -euo pipefail
          cat > /tmp/v44-recheck.py <<'PY'
          import ast, csv, io, re, struct
          from collections import defaultdict
          from pathlib import Path
          from PIL import Image
          import yaml

          OUT = Path('v44-output')
          SOURCE = Path('source')
          SRCROOT = Path('original')
          # IDs with no V34 four-direction GIF, not all original actors.
          missing = set(map(int, '''
            144 146 148 824 1093 1236 2240 2714 2907 2917 2976 3101
            3136 3520 3783 3860 3864 3867 4003 4516 4786 4787 4800
            4801 4802 4803 4804 4806 4854 4855 5224 5596 5683 5684
            5685 5687 5688 5689 5690 5691 5693 5694 5695 5708 5938
            5939 6283 7557 7558 7845 7869 7870 8054 8115 8416 8429
            8457 8459 8785 8899 10354 10609 10610 10611 10612 10613
            10614 10621 10622 10623 10624 10625 10626 10790 10792
            10793 10794 10796 10797 10798 10800
          '''.split()))

          def rows(filename):
              with (SOURCE / filename).open(encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f))

          # Reuse the original Sanctuary decoder, not an unrelated sprite renderer.
          wf = yaml.safe_load(Path('/tmp/v44-original-decoder.yml').read_text('utf-8'))
          step = next(s for s in wf['jobs']['identify']['steps']
                      if s.get('name') == 'Decode all selected monster animation frames')
          script = step['run'].split("python3 - <<'PY'\n", 1)[1].split('\nPY', 1)[0]
          cls = next(n for n in ast.parse(script).body
                     if isinstance(n, ast.ClassDef) and n.name == 'Reader')

          def original_reader(relaxed=False):
              node = cls
              if relaxed:
                  import copy
                  node = copy.deepcopy(cls)
                  for n in ast.walk(node):
                      if isinstance(n, ast.Compare) and len(n.comparators) == 1:
                          c = n.comparators[0]
                          if isinstance(c, ast.Constant) and c.value == 1500:
                              c.value = 4096
                  ast.fix_missing_locations(node)
              env = {'struct': struct, 'Image': Image,
                     'MAX_FRAMES': 255 if relaxed else 240,
                     'MAX_DIM': 1600 if relaxed else 1000}
              exec(compile(ast.Module(body=[node], type_ignores=[]),
                           'original-sanctuary-reader', 'exec'), env)
              return env['Reader']

          Reader = original_reader()
          RelaxedReader = original_reader(relaxed=True)
          index = {}
          actor_subs = defaultdict(set)
          for r in rows('V34-all-source-sprite-index.csv'):
              m = re.fullmatch(r'(\d+)-(\d+)\.spr', r['file'], re.I)
              if not m:
                  continue
              actor, sub = map(int, m.groups())
              pak = r['pak'].removeprefix('outer/')
              key = (pak, r['file'].lower())
              entry = (int(r['offset']), int(r['bytes']), actor, sub)
              if key not in index or entry[0] < index[key][0]:
                  index[key] = entry
              actor_subs[actor].add(sub)

          candidates = {}
          for r in rows('V34-decoding-errors.csv'):
              key = (r['pak'], r['filename'].lower())
              candidates[key] = (int(r['actor']), r['decode_error'], 'failed_four_direction')
          for (pak, filename), (_, _, actor, sub) in index.items():
              if actor in missing and sub % 8 in (0, 2, 4, 6):
                  candidates[(pak, filename)] = (actor, 'Previously unexamined', 'other_direction')

          def gif_bytes(frames):
              visible = [f for f in frames if f is not None and f.getbbox()]
              if not visible:
                  return None
              w = max(x.width for x in visible)
              h = max(x.height for x in visible)
              if w * h > 1600000 or len(visible) > 255:
                  return None
              frames_out = []
              for frame in visible:
                  canv = Image.new('RGBA', (w, h))
                  canv.alpha_composite(frame, ((w-frame.width)//2, (h-frame.height)//2))
                  pal = canv.convert('RGB').quantize(colors=255)
                  pal.paste(255, mask=canv.getchannel('A').point(lambda v: 255 if v < 128 else 0))
                  frames_out.append(pal)
              target = io.BytesIO()
              frames_out[0].save(target, 'GIF', save_all=True,
                  append_images=frames_out[1:], duration=140, loop=0,
                  disposal=2, transparency=255, optimize=False)
              return target.getvalue()

          results = []
          opened = {}
          rescued = 0
          try:
              for (pak, filename), (actor, prior, _) in sorted(candidates.items()):
                  item = index.get((pak, filename))
                  if not item:
                      results.append([actor, filename, 'no_index_entry', prior])
                      continue
                  offset, size, _, sub = item
                  path = SRCROOT / pak
                  if pak not in opened:
                      opened[pak] = path.open('rb')
                  stream = opened[pak]
                  if not (0 < size <= 4194304) or offset + size > path.stat().st_size:
                      results.append([actor, filename, 'invalid_original_bounds', prior])
                      continue
                  stream.seek(offset)
                  raw = stream.read(size)
                  if len(raw) != size:
                      results.append([actor, filename, 'short_original_read', prior])
                      continue
                  try:
                      frames = Reader(raw).decode()
                  except Exception:
                      try:
                          frames = RelaxedReader(raw).decode()
                      except Exception as second:
                          results.append([actor, filename, 'unreadable_structure', str(second)[:100]])
                          continue
                  if not any(f is not None and f.getbbox() for f in frames):
                      results.append([actor, filename, 'no_visible_original_frames', prior])
                      continue
                  gif = gif_bytes(frames)
                  if gif is None:
                      results.append([actor, filename, 'oversized_frames', prior])
                      continue
                  out = OUT / 'rechecked' / Path(pak).stem / str(actor) / filename.replace('.spr', '.gif')
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(gif)
                  rescued += 1
                  status = 'recovered_cardinal' if sub % 8 in (1,3,5,7) else 'other_direction_only'
                  results.append([actor, filename, status, prior])
          finally:
              for fp in opened.values():
                  fp.close()

          with (OUT/'V44-rechecked-sprites.csv').open('w',encoding='utf-8-sig',newline='') as f:
              w = csv.writer(f)
              w.writerow(['sprite_id', 'source_spr', 'result', 'previous_result'])
              w.writerows(results)

          with (OUT/'V44-missing-sprite-source.csv').open('w',encoding='utf-8-sig',newline='') as f:
              w = csv.writer(f)
              w.writerow(['sprite_id', 'original_spr_files'])
              for actor in sorted(missing):
                  w.writerow([actor, len(actor_subs.get(actor, set()))])

          # Only report four-direction sets with identical original GIF hashes.
          all_banks = defaultdict(dict)
          for row in rows('V34-all-cardinal-gif-manifest.csv'):
              if row['gif'] and row['byte_verified'] == 'True':
                  key = (int(row['actor']), row['pak'], int(row['bank']))
                  all_banks[key][int(row['direction'])] = row['gif_sha256']
          signatures = defaultdict(set)
          for (actor, pak, bank), directions in all_banks.items():
              if all(d in directions for d in (1,3,5,7)):
                  signature = tuple(directions[d] for d in (1,3,5,7))
                  signatures[signature].add(actor)
          identical = sorted({tuple(sorted(group)) for group in signatures.values()
                             if len(group) > 1})
          with (OUT/'V44-identical-four-direction-IDs.csv').open('w',encoding='utf-8-sig',newline='') as f:
              w = csv.writer(f)
              w.writerow(['same_four_direction_image_sprite_ids'])
              for group in identical:
                  w.writerow([', '.join(map(str, group))])

          print('V44 original SPR candidates checked:', len(candidates))
          print('V44 visible SPR files recovered:', rescued)
          print('V44 missing actor IDs without source SPR:', sum(not actor_subs.get(a) for a in missing))
          print('V44 verified identical-image ID groups:', len(identical))
          PY
          python3 /tmp/v44-recheck.py

      - name: "V44 | Upload original image findings"
        uses: actions/upload-artifact@v4
        with:
          name: audit-sanctuary-monsters-v44-original-spr-recheck
          path: v44-output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
