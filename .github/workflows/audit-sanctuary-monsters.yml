
name: "audit-sanctuary-monsters.yml | V26 | 492EV 원본 외형 대조"
run-name: "audit-sanctuary-monsters.yml | V26 | 83종 SPR 자동 비교"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/audit-sanctuary-monsters.yml"]
permissions: {contents: read, actions: read}
jobs:
  compare:
    name: "V26 | 83종 외형 대조 및 24종 누락 복구"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: "V26 | V25 성공 결과 복원"
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39122782107
          name: audit-sanctuary-monsters-v25-five-motions
          github-token: ${{ github.token }}
          path: v25
      - name: "V26 | 원본 SPR 인덱스 및 디코더 복원"
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full python3-pil python3-numpy python3-yaml
          mkdir -p source/v2 source/v12 downloads paks reports
          gh run download 38784834277 -R "$GITHUB_REPOSITORY" -n Sanctuary-V2-Reports -D source/v2
          gh run download 38872552732 -R "$GITHUB_REPOSITORY" -n Sanctuary-V12-External-Action-and-NPC-Crosscheck -D source/v12
          git show 5c40dc3de28ee879182c6f60802a89432072c138:.github/workflows/audit-sanctuary-monsters.yml > source/decoder.yml
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('v25/V25-selected.json').read_text())
          paks={r['pak'] for r in rows.values() if r['pak']}
          assert len(rows)==83 and len(paks)==1,paks
          Path('reports/source-pak.txt').write_text(next(iter(paks)))
          PY
          gh release download v1.0.0 -R "$GITHUB_REPOSITORY" --pattern "Sanctuary.of.Aden.-.Copy.*" -D downloads
          pak="$(cat reports/source-pak.txt)"
          7z x downloads/Sanctuary.of.Aden.-.Copy.zip "${pak#outer/}" "-o${PWD}/paks" -y > reports/extract.log
          test -s "paks/${pak#outer/}"
          rm -rf downloads
      - name: "V26 | 83종 이미지 비교 및 누락 동작 추출"
        run: |
          set -euo pipefail
          cat > /tmp/v26.py <<'PY'
          import ast,base64,csv,hashlib,json,re,struct
          from pathlib import Path
          from collections import defaultdict
          from io import BytesIO
          import numpy as np,yaml
          from PIL import Image

          O=Path('reports')
          html=Path('v25/SLKnight-492EV-Five-Motions-V25.html').read_text()
          found=re.search(r'<script id="dataset" type="application/json">(.*?)</script>',html,re.S)
          if not found:raise RuntimeError('V25 database missing')
          db=json.loads(found.group(1));rows=db['rows'];groups=db['families']
          assert len(rows)==492 and len(groups)==83
          pak=Path('reports/source-pak.txt').read_text().strip()
          path=Path('paks')/pak.removeprefix('outer/')

          def load(folder,name):
              files=list(Path(folder).rglob(name))
              if len(files)!=1:raise RuntimeError('Missing index '+name)
              with files[0].open(encoding='utf-8-sig',newline='') as f:return list(csv.DictReader(f))

          spr=load('source/v2','all_sprite_candidates.csv')
          manifest=load('source/v2','exported_sprite_manifest.csv')
          npc=load('source/v12','03_external_npc_gfx_candidates.csv')
          checks={(r['pak'],r['sprite_file'].lower(),int(r['bytes'])):r['sha256'] for r in manifest}
          actors=defaultdict(dict);names=defaultdict(set)
          for r in npc:
              try:actor=int(r['gfx_id'])
              except (ValueError,KeyError):continue
              if actor>0 and 'monster' in r.get('implementation','').lower():
                  if r.get('npc_name'):names[actor].add(r['npc_name'])
          for r in spr:
              if r['pak']!=pak:continue
              file=Path(r['file'].replace('\\','/')).name
              m=re.fullmatch(r'(\d+)-(\d+)\.spr',file,re.I)
              if not m:continue
              actor,sub=map(int,m.groups())
              if actor<=0 or sub>=40:continue
              sha=checks.get((pak,file.lower(),int(r['bytes'])))
              if not sha:continue
              rec={'offset':int(r['offset']),'size':int(r['bytes']),'sha':sha}
              if sub not in actors[actor] or rec['offset']<actors[actor][sub]['offset']:
                  actors[actor][sub]=rec

          wf=yaml.safe_load(Path('source/decoder.yml').read_text())
          step=next(s for s in wf['jobs']['identify']['steps']
                    if s['name']=='Decode all selected monster animation frames')
          code=step['run'].split("python3 - <<'PY'\n",1)[1].split('\nPY',1)[0]
          node=next(n for n in ast.parse(code).body if isinstance(n,ast.ClassDef) and n.name=='Reader')
          scope={'struct':struct,'Image':Image,'MAX_FRAMES':240,'MAX_DIM':1000}
          exec(compile(ast.Module(body=[node],type_ignores=[]),'<V17 Reader>','exec'),scope)
          Reader=scope['Reader'];errors=[]

          def first(frames):
              return next((x for x in frames if x is not None and x.getbbox()),None)

          def feature(image):
              if image is None or not image.getbbox():return None
              image=image.convert('RGBA').crop(image.getbbox())
              image.thumbnail((40,40),Image.Resampling.NEAREST)
              canvas=Image.new('RGBA',(48,48))
              canvas.alpha_composite(image,((48-image.width)//2,48-image.height))
              p=np.asarray(canvas,dtype=np.float32)/255
              alpha=p[:,:,3];luma=p[:,:,:3].mean(axis=2)
              v=np.concatenate([alpha.ravel(),(alpha*luma).ravel()]).astype(np.float32)
              length=np.linalg.norm(v)
              return v/length if length>0 else None

          def png(image):
              if image is None:return ''
              image=image.copy();image.thumbnail((100,100))
              b=BytesIO();image.save(b,format='PNG')
              return base64.b64encode(b.getvalue()).decode()

          def gif(frames):
              frames=[x for x in frames if x is not None and x.getbbox()]
              if not frames:return None
              w=max(x.width for x in frames);h=max(x.height for x in frames)
              if w>512 or h>512:return None
              result=[]
              for frame in frames:
                  c=Image.new('RGBA',(w,h))
                  c.alpha_composite(frame,((w-frame.width)//2,h-frame.height))
                  p=c.convert('RGB').quantize(colors=255)
                  p.paste(255,mask=c.getchannel('A').point(lambda a:255 if a<128 else 0))
                  result.append(p)
              b=BytesIO()
              result[0].save(b,format='GIF',save_all=True,append_images=result[1:],
                             duration=150,loop=0,transparency=255,disposal=2,optimize=False)
              return base64.b64encode(b.getvalue()).decode()

          def wait_image(encoded):
              with Image.open(BytesIO(base64.b64decode(encoded))) as im:
                  return im.convert('RGBA')

          def decode(stream,rec):
              stream.seek(rec['offset']);raw=stream.read(rec['size'])
              if len(raw)!=rec['size'] or hashlib.sha256(raw).hexdigest()!=rec['sha']:
                  raise ValueError('Original SPR hash mismatch')
              return Reader(raw).decode()

          source_vectors=[];source_ids=[];thumbnails={}
          with path.open('rb') as f:
              for actor,recs in sorted(actors.items()):
                  if not all(32+d in recs for d in (0,2,4,6)):continue
                  try:
                      frames=[first(decode(f,recs[32+d])) for d in (0,2,4,6)]
                      vectors=[feature(x) for x in frames]
                      if any(x is None for x in vectors):continue
                      source_ids.append(actor);source_vectors.extend(vectors)
                      thumbnails[actor]=png(frames[0])
                  except Exception as e:errors.append({'actor':actor,'stage':'wait','error':str(e)})
          if not source_ids:raise RuntimeError('No visual SPR candidates found')

          hashes=list(groups);ref_vectors=[];ref_images={}
          for sha in hashes:
              g=groups[sha];images=[
                  wait_image(g['fallback'][str(d)]['wait'])
                  for d in range(4)
              ]
              vectors=[feature(x) for x in images]
              if any(x is None for x in vectors):raise RuntimeError('Empty reference '+sha)
              ref_vectors.extend(vectors);ref_images[sha]=png(images[0])

          source_matrix=np.stack(source_vectors)
          reference_matrix=np.stack(ref_vectors)
          comparison=reference_matrix@source_matrix.T
          scores=comparison.reshape(len(hashes),4,len(source_ids),4).max(axis=3).mean(axis=1)
          source_lookup={actor:i for i,actor in enumerate(source_ids)}

          matches={};missing=0;new_previews=0
          with path.open('rb') as f:
              for index,sha in enumerate(hashes):
                  g=groups[sha]
                  order=np.argsort(-scores[index])[:3]
                  ranked=[{
                      'id':source_ids[int(j)],
                      'score':round(float(scores[index,j]),4),
                      'names':sorted(names[source_ids[int(j)]])[:4],
                      'thumb':thumbnails[source_ids[int(j)]]
                  } for j in order]
                  current=g['sprite_id'];idx=source_lookup.get(current)
                  old_score=round(float(scores[index,idx]),4) if idx is not None else None
                  preview={}
                  if current is None:
                      missing+=1;actor=ranked[0]['id'];recs=actors[actor]
                      for action,base in [('attack',8),('hit',16),('death',24)]:
                          dirs={}
                          for d in (0,2,4,6):
                              if base+d not in recs:continue
                              try:
                                  data=gif(decode(f,recs[base+d]))
                                  if data:dirs[str(d)]=data
                              except Exception as e:
                                  errors.append({'actor':actor,'action':action,'dir':d,'error':str(e)})
                          preview[action]=dirs
                      if all(len(preview.get(a,{}))==4 for a in ('attack','hit','death')):
                          new_previews+=1
                  matches[sha]={
                      'reference':ref_images[sha],
                      'existing':current,
                      'existing_score':old_score,
                      'ranked':ranked,
                      'preview':preview,
                      'needs_review':current is None or (
                          old_score is not None and ranked[0]['score']>old_score+0.07
                      )
                  }

          summary={
              'version':'V26','events':len(rows),'graphics':len(groups),
              'previous_source_matches':len(groups)-missing,
              'previous_missing':missing,'visual_candidate_pool':len(source_ids),
              'new_complete_motion_previews':new_previews,
              'families_requiring_review':sum(x['needs_review'] for x in matches.values()),
              'decoding_errors':len(errors),
              'visual_identity_confirmed':0,'game_modified':False
          }
          (O/'V26-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          (O/'V26-errors.json').write_text(json.dumps(errors,ensure_ascii=False,indent=2))
          with (O/'V26-83-graphics.csv').open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.writer(f);w.writerow(['graphic','monsters','V25_SPR','V25_similarity','V26_candidate_1','score_1','V26_candidate_2','score_2','needs_review'])
              for sha,g in groups.items():
                  m=matches[sha]
                  w.writerow([sha,' | '.join(g['monsters']),m['existing'],m['existing_score'],
                              m['ranked'][0]['id'],m['ranked'][0]['score'],
                              m['ranked'][1]['id'] if len(m['ranked'])>1 else '',
                              m['ranked'][1]['score'] if len(m['ranked'])>1 else '',
                              m['needs_review']])
          with (O/'V26-492EV.csv').open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.writer(f);w.writerow(['map','EV','monster','graphic','V25_SPR','V26_candidate','score','review'])
              for r in rows:
                  m=matches[r['primary_asset']]
                  w.writerow([r['map_id'],r['event_id'],r['monster'],r['primary_asset'],
                              m['existing'],m['ranked'][0]['id'],m['ranked'][0]['score'],m['needs_review']])

          panel='''<section style="padding:12px;margin-top:16px;border:1px solid #536b80;border-radius:9px">
          <h2>V26 · 원본 SPR 외형 자동 비교</h2>
          <p>유사도는 자동 추천 점수이며 몬스터 외형 일치가 확정됐다는 뜻이 아닙니다.</p>
          <p id="v26-status"></p><div id="v26-images" style="display:flex;flex-wrap:wrap;gap:10px"></div>
          <h2>V25에서 미연결된 몬스터의 공격·피격·사망 미리보기</h2>
          <div id="v26-motions" class="motions"></div></section>'''
          script=r'''
          const V26=JSON.parse(document.getElementById('v26-data').textContent);
          function renderV26(){
            const row=DB.rows[selected],match=V26[row.primary_asset];
            const status=document.getElementById('v26-status');
            const images=document.getElementById('v26-images');
            const motions=document.getElementById('v26-motions');
            images.replaceChildren();motions.replaceChildren();
            status.textContent='V25 SPR: '+(match.existing??'미연결')+
              ' · 기존 유사도: '+(match.existing_score??'-')+
              ' · 재검토: '+(match.needs_review?'필요':'보류 가능');
            const items=[{id:'게임 원본',score:null,thumb:match.reference},...match.ranked];
            for(const item of items){
              const box=document.createElement('div');
              box.style.cssText='background:#20354b;padding:9px;border-radius:8px;width:130px';
              const label=document.createElement('p');
              label.textContent=item.id+' '+(item.score===null?'':item.score);
              box.appendChild(label);
              const img=document.createElement('img');
              img.src='data:image/png;base64,'+item.thumb;
              img.style.cssText='width:100%;height:110px;object-fit:contain;image-rendering:pixelated';
              box.appendChild(img);images.appendChild(box);
            }
            const dir=document.getElementById('direction').value;
            for(const [action,title] of [['attack','공격'],['hit','피격'],['death','사망']]){
              const p=document.createElement('section');p.className='panel';
              const h=document.createElement('h2');h.textContent=title+' · 원본 후보';
              p.appendChild(h);
              const box=document.createElement('div');box.className='stage';
              const code=(match.preview[action]||{})[dir];
              if(code){
                const img=document.createElement('img');
                img.src='data:image/gif;base64,'+code;
                box.appendChild(img);
              }else box.textContent=match.existing!==null?'기존 V25 동작 유지':'후보 프레임 없음';
              p.appendChild(box);motions.appendChild(p);
            }
          }
          const previousDraw=draw;
          draw=function(){previousDraw();renderV26()};
          document.getElementById('direction').addEventListener('change',renderV26);
          renderV26();
          '''
          payload=json.dumps(matches,ensure_ascii=False,separators=(',',':')).replace('<','\\u003c')
          html=html.replace('</body>',panel+
              '<script id="v26-data" type="application/json">'+payload+'</script>'+
              '<script>'+script+'</script></body>',1)
          (O/'SLKnight-492EV-V26-Motion-Matching.html').write_text(html,encoding='utf-8')
          (O/'V26-ui.js').write_text(script)
          print('V26_RESULT',json.dumps(summary,ensure_ascii=False))
          PY
          python3 /tmp/v26.py
      - name: "V26 | 492EV 결과 검증"
        run: |
          set -euo pipefail
          node --check reports/V26-ui.js
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path('reports');s=json.loads((p/'V26-summary.json').read_text())
          assert s['version']=='V26' and s['events']==492 and s['graphics']==83
          assert not s['game_modified']
          assert (p/'SLKnight-492EV-V26-Motion-Matching.html').stat().st_size>10000
          with (p/'V26-83-graphics.csv').open(encoding='utf-8-sig') as f:
              assert len(list(csv.DictReader(f)))==83
          with (p/'V26-492EV.csv').open(encoding='utf-8-sig') as f:
              assert len(list(csv.DictReader(f)))==492
          print('V26_VALIDATED',json.dumps(s,ensure_ascii=False))
          PY
          cat reports/V26-summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: "V26 | 통합 HTML 및 외형 대조 결과"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-sanctuary-monsters-v26
          path: reports/
          retention-days: 30
          if-no-files-found: warn
