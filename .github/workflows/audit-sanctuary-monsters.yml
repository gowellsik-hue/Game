
name: Sanctuary of Aden Sprite Extraction V2

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/audit-sanctuary-monsters-v2.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: sanctuary-sprite-v2
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Prepare environment
        shell: bash
        run: |
          set -euo pipefail

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc

          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full

          mkdir -p downloads client previous reports sprite_chunks

          df -h .

      - name: Download successful V1 inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh run download 38782357687 \
            --repo "$GITHUB_REPOSITORY" \
            --name Sanctuary-Monster-Audit \
            --dir previous

          test -n "$(find previous -name '02_pak_records.csv' -print -quit)"

          echo "V1 INDEX REPORT RESTORED"

      - name: Download original client
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release download v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Sanctuary.of.Aden.-.Copy.*" \
            --dir downloads

          python3 - <<'PY'
          from pathlib import Path

          root = Path("downloads")
          base = "Sanctuary.of.Aden.-.Copy"

          expected = [
              f"{base}.z{i:02d}"
              for i in range(1, 46)
          ]
          expected.append(f"{base}.zip")

          missing = [
              x for x in expected
              if not (root / x).is_file()
          ]

          if missing:
              raise SystemExit(f"Missing: {missing}")

          print("ALL 46 PARTS PRESENT")
          print("TOTAL BYTES:", sum(
              (root / x).stat().st_size
              for x in expected
          ))
          PY

      - name: Restore original client
        shell: bash
        run: |
          set -euo pipefail

          7z x \
            "downloads/Sanctuary.of.Aden.-.Copy.zip" \
            "-o${PWD}/client" \
            -y > reports/extraction.log 2>&1

          rm -rf downloads

          echo "CLIENT EXTRACTED"

          find client -type f | wc -l

          df -h .

      - name: Export every indexed sprite
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import csv
          import hashlib
          import json
          import re
          import zipfile

          from pathlib import Path
          from collections import Counter, defaultdict

          ROOT = Path.cwd()
          CLIENT = ROOT / "client"
          REPORT = ROOT / "reports"
          OUT = ROOT / "sprite_chunks"

          REPORT.mkdir(exist_ok=True)
          OUT.mkdir(exist_ok=True)

          indexes = list(
              (ROOT / "previous").rglob("02_pak_records.csv")
          )

          if len(indexes) != 1:
              raise SystemExit(
                  "V1 index report not uniquely found"
              )

          with indexes[0].open(
              encoding="utf-8-sig", newline=""
          ) as f:
              records = list(csv.DictReader(f))

          def save_csv(name, rows, fields):
              with (REPORT / name).open(
                  "w",
                  encoding="utf-8-sig",
                  newline=""
              ) as f:
                  writer = csv.DictWriter(
                      f,
                      fieldnames=fields,
                      extrasaction="ignore"
                  )
                  writer.writeheader()
                  writer.writerows(rows)

          def resolve_pak(record):
              old = Path(record["pak"])
              parts = old.parts

              if not parts or parts[0] != "outer":
                  return None

              return CLIENT.joinpath(*parts[1:])

          def safe_name(value):
              return re.sub(
                  r"[^A-Za-z0-9_.-]+",
                  "_",
                  value
              )

          sprite_ext = (".spr", ".spx", ".sp2", ".fspr")

          candidates = []
          metadata = []

          for row in records:
              name = row["file"].replace("\\", "/")
              low = name.lower()
              pak = resolve_pak(row)

              if not pak:
                  continue

              if any(x in low for x in (
                  "list.spr",
                  "wlist.spr",
                  "sprite",
                  "action",
                  "motion",
                  "animation",
                  "monster",
                  "npc",
                  "desc.tbl"
              )):
                  metadata.append({
                      "pak": row["pak"],
                      "file": name,
                      "offset": row["offset"],
                      "bytes": row["bytes"]
                  })

              if not low.endswith(sprite_ext):
                  continue

              if row["valid"].lower() != "true":
                  continue

              candidates.append({
                  "pak": pak,
                  "pak_original": row["pak"],
                  "name": name,
                  "offset": int(row["offset"]),
                  "size": int(row["bytes"])
              })

          save_csv(
              "metadata_candidates.csv",
              metadata,
              ["pak", "file", "offset", "bytes"]
          )

          # Never assume numeric sprite IDs are monsters.
          # All sprite actors are retained for later identification.

          candidate_rows = []
          for c in candidates:
              candidate_rows.append({
                  "pak": c["pak_original"],
                  "file": c["name"],
                  "offset": c["offset"],
                  "bytes": c["size"]
              })

          save_csv(
              "all_sprite_candidates.csv",
              candidate_rows,
              ["pak", "file", "offset", "bytes"]
          )

          # Group sprite files by the numeric ID before the
          # first hyphen, without merging different IDs.

          groups = defaultdict(list)
          ungrouped = []

          pattern = re.compile(
              r"^(\d+)-(\d+)\.(spr|spx|sp2|fspr)$",
              re.IGNORECASE
          )

          for c in candidates:
              filename = c["name"].split("/")[-1]
              match = pattern.match(filename)

              if match:
                  actor_id = int(match.group(1))
                  groups[actor_id].append(c)
              else:
                  ungrouped.append(c)

          group_rows = []

          for actor_id in sorted(groups):
              items = groups[actor_id]

              group_rows.append({
                  "sprite_id": actor_id,
                  "files": len(items),
                  "total_bytes": sum(
                      x["size"] for x in items
                  ),
                  "status": "ACTOR_TYPE_NOT_YET_IDENTIFIED"
              })

          save_csv(
              "sprite_id_groups.csv",
              group_rows,
              [
                  "sprite_id",
                  "files",
                  "total_bytes",
                  "status"
              ]
          )

          # Export raw SPR/SPX assets in bounded ZIP chunks.
          # This avoids collecting all sprites uncompressed
          # in the runner's working directory.

          MAX_CHUNK = 350 * 1024 * 1024
          MAX_ENTRY = 256 * 1024 * 1024

          chunk_no = 0
          chunk_bytes = 0
          archive = None

          exported = []
          rejected = []
          total_exported_bytes = 0

          def new_chunk():
              global chunk_no, chunk_bytes, archive

              if archive is not None:
                  archive.close()

              chunk_no += 1
              chunk_bytes = 0

              path = OUT / f"sprites-{chunk_no:03d}.zip"

              archive = zipfile.ZipFile(
                  path,
                  mode="w",
                  compression=zipfile.ZIP_STORED,
                  allowZip64=True
              )

          ordered = sorted(
              candidates,
              key=lambda x: (
                  x["name"].split("/")[-1].lower(),
                  x["pak_original"],
                  x["offset"]
              )
          )

          for c in ordered:
              src = c["pak"]
              size = c["size"]

              if size <= 0 or size > MAX_ENTRY:
                  rejected.append({
                      "file": c["name"],
                      "reason": "INVALID_OR_OVERSIZED_ENTRY"
                  })
                  continue

              if not src.is_file():
                  rejected.append({
                      "file": c["name"],
                      "reason": "SOURCE_PAK_MISSING"
                  })
                  continue

              if chunk_bytes + size > MAX_CHUNK:
                  new_chunk()

              if archive is None:
                  new_chunk()

              try:
                  with src.open("rb") as f:
                      f.seek(c["offset"])
                      data = f.read(size)

                  if len(data) != size:
                      raise ValueError("Incomplete PAK entry")

                  filename = c["name"].split("/")[-1]
                  match = pattern.match(filename)

                  if match:
                      directory = "sprite_id_" + match.group(1)
                  else:
                      directory = "unidentified"

                  package_name = safe_name(
                      Path(c["pak_original"]).stem
                  )

                  entry_name = (
                      package_name + "/" +
                      directory + "/" +
                      safe_name(filename)
                  )

                  # Prevent overwriting archive entries
                  # with identical sprite filenames.
                  entry_name = (
                      f"{len(exported):07d}_" +
                      entry_name
                  )

                  archive.writestr(entry_name, data)

                  exported.append({
                      "sprite_file": c["name"],
                      "pak": c["pak_original"],
                      "archive": f"sprites-{chunk_no:03d}.zip",
                      "entry": entry_name,
                      "bytes": size,
                      "sha256": hashlib.sha256(data).hexdigest()
                  })

                  chunk_bytes += size
                  total_exported_bytes += size

              except Exception as ex:
                  rejected.append({
                      "file": c["name"],
                      "reason": str(ex)
                  })

          if archive is not None:
              archive.close()

          save_csv(
              "exported_sprite_manifest.csv",
              exported,
              [
                  "sprite_file",
                  "pak",
                  "archive",
                  "entry",
                  "bytes",
                  "sha256"
              ]
          )

          save_csv(
              "unresolved_sprite_entries.csv",
              rejected,
              ["file", "reason"]
          )

          summary = {
              "indexed_pak_records": len(records),
              "sprite_candidates": len(candidates),
              "sprite_id_groups": len(groups),
              "ungrouped_sprites": len(ungrouped),
              "exported_files": len(exported),
              "exported_bytes": total_exported_bytes,
              "failed_exports": len(rejected),
              "zip_chunks": chunk_no,
              "action_classification": "NOT_YET_VERIFIED"
          }

          (REPORT / "summary_v2.json").write_text(
              json.dumps(
                  summary,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("=== SANCTUARY V2 RESULT ===")
          print(json.dumps(
              summary,
              ensure_ascii=False,
              indent=2
          ))

          print("=== FIRST 40 SPRITE GROUPS ===")
          for row in group_rows[:40]:
              print(row)

          print("=== METADATA CANDIDATE SAMPLE ===")
          for row in metadata[:100]:
              print(row)

          if not exported:
              raise SystemExit(
                  "No raw sprites exported. Check report."
              )

          PY

      - name: Upload V2 investigation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-V2-Reports
          path: reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload complete raw sprite archive chunks
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-V2-Raw-Sprites
          path: sprite_chunks/*.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
