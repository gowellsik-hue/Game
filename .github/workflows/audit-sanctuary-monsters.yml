
name: Sanctuary of Aden XML Header Test V6

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/audit-sanctuary-monsters.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: sanctuary-monster-audit
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Prepare environment
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p previous/v4 previous/v5
          mkdir -p reports/patches

      - name: Restore V4 original XML and V5 loader evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh run download 38828891785 \
            --repo "$GITHUB_REPOSITORY" \
            --name Sanctuary-V4-Binary-Animation-Analysis \
            --dir previous/v4

          gh run download 38830296261 \
            --repo "$GITHUB_REPOSITORY" \
            --name Sanctuary-V5-Animation-Loader-Evidence \
            --dir previous/v5

          test -d previous/v4/raw

          echo "V4 AND V5 EVIDENCE RESTORED"

      - name: Test original and modified XML headers
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import csv
          import hashlib
          import json
          import math
          import xml.etree.ElementTree as ET

          from collections import Counter
          from pathlib import Path

          ROOT = Path.cwd()
          V4 = ROOT / "previous/v4"
          V5 = ROOT / "previous/v5"
          REPORT = ROOT / "reports"
          PATCHES = REPORT / "patches"

          REPORT.mkdir(exist_ok=True)
          PATCHES.mkdir(exist_ok=True)

          TARGETS = {
              "Actions.xml":
                  "b79e4058e0b6e27111fd469bf0249ec1321da7d3f55c5009d42fb0369edec27f",
              "QMotionInfo.xml":
                  "5672c352dfcca91f2cad57bcaceb273aafdc9a80fd97118bc9ac996c7e4913f2"
          }

          def save_csv(name, rows, fields):
              with (REPORT / name).open(
                  "w",
                  encoding="utf-8-sig",
                  newline=""
              ) as f:
                  writer = csv.DictWriter(
                      f,
                      fieldnames=fields,
                      extrasaction="ignore"
                  )
                  writer.writeheader()
                  writer.writerows(rows)

          def entropy(data):
              if not data:
                  return 0.0

              counts = Counter(data)
              size = len(data)

              return -sum(
                  (count / size)
                  * math.log2(count / size)
                  for count in counts.values()
              )

          def printable_ratio(data):
              if not data:
                  return 0.0

              printable = sum(
                  32 <= b <= 126 or b in (9, 10, 13)
                  for b in data
              )

              return printable / len(data)

          def try_xml(data):
              try:
                  root = ET.fromstring(data)

                  return {
                      "valid": True,
                      "root": str(root.tag),
                      "error": ""
                  }

              except ET.ParseError as ex:
                  return {
                      "valid": False,
                      "root": "",
                      "error": str(ex)
                  }

              except (ValueError, UnicodeError) as ex:
                  return {
                      "valid": False,
                      "root": "",
                      "error": str(ex)
                  }

          test_rows = []
          original_rows = []
          successful = []
          raw_samples = {}

          for filename, expected_sha in TARGETS.items():
              candidates = list(
                  (V4 / "raw").glob("*_" + filename)
              )

              if len(candidates) != 1:
                  raise SystemExit(
                      f"Missing unique original: {filename}"
                  )

              original = candidates[0].read_bytes()

              digest = hashlib.sha256(
                  original
              ).hexdigest()

              if digest != expected_sha:
                  raise SystemExit(
                      f"SHA256 mismatch: {filename}"
                  )

              if not original.startswith(b"X?xm"):
                  raise SystemExit(
                      f"Unexpected header: {filename}"
                  )

              raw_samples[filename] = original

              original_rows.append({
                  "file": filename,
                  "bytes": len(original),
                  "sha256": digest,
                  "first_16_hex": original[:16].hex(" "),
                  "first_64_hex": original[:64].hex(" "),
                  "header_ascii": repr(original[:5]),
                  "full_entropy": round(
                      entropy(original), 5
                  ),
                  "body_entropy": round(
                      entropy(original[4:]), 5
                  ),
                  "printable_ratio": round(
                      printable_ratio(original), 5
                  ),
                  "after_header_printable_ratio": round(
                      printable_ratio(original[4:]), 5
                  ),
                  "internal_xml_prolog_count": (
                      original.count(b"<?xml")
                  )
              })

              variants = {
                  "01_original":
                      original,

                  "02_replace_question_mark_only":
                      original[:1]
                      + b"<"
                      + original[2:],

                  "03_replace_X_with_less_than":
                      b"<" + original[1:],

                  "04_force_first_four_to_xml":
                      b"<?xm" + original[4:],

                  "05_force_first_five_to_xml":
                      b"<?xml" + original[5:],

                  "06_remove_first_byte":
                      original[1:],

                  "07_remove_first_four_bytes":
                      original[4:]
              }

              for method, data in variants.items():
                  result = try_xml(data)

                  record = {
                      "file": filename,
                      "method": method,
                      "first_16_hex": data[:16].hex(" "),
                      "first_32_ascii": repr(data[:32]),
                      "xml_valid": result["valid"],
                      "xml_root": result["root"],
                      "parse_error": result["error"],
                      "printable_ratio": round(
                          printable_ratio(data), 5
                      ),
                      "bytes": len(data)
                  }

                  test_rows.append(record)

                  if method in (
                      "03_replace_X_with_less_than",
                      "05_force_first_five_to_xml"
                  ):
                      destination = PATCHES / (
                          filename.replace(".xml", "")
                          + "_"
                          + method
                          + ".xml"
                      )

                      destination.write_bytes(data)

                  if result["valid"]:
                      successful.append({
                          "file": filename,
                          "method": method,
                          "root": result["root"]
                      })

                  print(
                      "TEST",
                      filename,
                      method,
                      "VALID =", result["valid"],
                      "ERROR =", result["error"]
                  )

          save_csv(
              "01_original_binary_diagnostics.csv",
              original_rows,
              [
                  "file", "bytes", "sha256",
                  "first_16_hex", "first_64_hex",
                  "header_ascii", "full_entropy",
                  "body_entropy", "printable_ratio",
                  "after_header_printable_ratio",
                  "internal_xml_prolog_count"
              ]
          )

          save_csv(
              "02_header_patch_results.csv",
              test_rows,
              [
                  "file", "method",
                  "first_16_hex",
                  "first_32_ascii",
                  "xml_valid", "xml_root",
                  "parse_error",
                  "printable_ratio", "bytes"
              ]
          )

          # Read V5's evidence for the identical X?xm
          # signature observed in client executables.

          evidence_files = list(
              V5.rglob(
                  "04_encoded_xml_magic_references.csv"
              )
          )

          magic_evidence = []

          if len(evidence_files) == 1:
              with evidence_files[0].open(
                  "r",
                  encoding="utf-8-sig",
                  newline=""
              ) as f:
                  magic_evidence = list(
                      csv.DictReader(f)
                  )

          save_csv(
              "03_v5_magic_references.csv",
              magic_evidence,
              ["file", "offset", "signature"]
          )

          # Compare the bytes after the common marker.
          a = raw_samples["Actions.xml"]
          b = raw_samples["QMotionInfo.xml"]

          shared_prefix = 0

          for x, y in zip(a, b):
              if x != y:
                  break

              shared_prefix += 1

          # Test whether changing the header is enough.
          first_byte_tests = [
              row for row in test_rows
              if row["method"]
              == "03_replace_X_with_less_than"
          ]

          forced_xml_tests = [
              row for row in test_rows
              if row["method"]
              == "05_force_first_five_to_xml"
          ]

          summary = {
              "phase": "XML_HEADER_PATCH_VERIFICATION",
              "verified_originals": len(raw_samples),
              "total_tests": len(test_rows),
              "valid_xml_results": len(successful),
              "shared_original_prefix_bytes": shared_prefix,
              "first_byte_patch_both_valid": all(
                  row["xml_valid"]
                  for row in first_byte_tests
              ),
              "force_xml_prefix_both_valid": all(
                  row["xml_valid"]
                  for row in forced_xml_tests
              ),
              "v5_magic_references": len(
                  magic_evidence
              ),
              "successful_variants": successful
          }

          (REPORT / "04_summary_v6.json").write_text(
              json.dumps(
                  summary,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          report_lines = [
              "# Sanctuary of Aden XML Header Test V6",
              "",
              "## Results",
              "",
              f"Original files: {len(raw_samples)}",
              f"Header experiments: {len(test_rows)}",
              f"Valid XML variants: {len(successful)}",
              f"V5 loader signature references: {len(magic_evidence)}",
              "",
              "## First-byte repair",
              "",
              "Both XML files parsed: "
              + str(
                  summary["first_byte_patch_both_valid"]
              ),
              "",
              "## Five-byte header repair",
              "",
              "Both XML files parsed: "
              + str(
                  summary["force_xml_prefix_both_valid"]
              ),
              "",
              "## Interpretation",
              "",
              "A successful XML parse proves this specific",
              "transformation produces well-formed XML.",
              "A failed parse disproves only that specific",
              "transformation, not all decoding methods.",
              "",
              "Original binary files were not modified.",
              "Patched copies are available in patches/."
          ]

          (REPORT / "REPORT.md").write_text(
              "\n".join(report_lines),
              encoding="utf-8"
          )

          print("=== V6 FINAL SUMMARY ===")
          print(json.dumps(
              summary,
              ensure_ascii=False,
              indent=2
          ))

          for row in original_rows:
              print(
                  "ORIGINAL_HEADER",
                  row["file"],
                  row["first_16_hex"]
              )

          for row in magic_evidence:
              print("V5_MAGIC", row)

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8"
          ) as f:
              f.write("\n".join(report_lines))

          PY
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload V6 patch test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-V6-XML-Header-Test
          path: reports/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
