
name: Sanctuary of Aden Interactive Motion Mapping V14

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/audit-sanctuary-monsters.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: sanctuary-monster-audit
  cancel-in-progress: false

jobs:
  motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Prepare environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil
          mkdir -p previous/v13 reports/viewer
          python3 -c "from PIL import Image; print('PIL_READY')"

      - name: Restore V13 original sprite evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh run download 38874270054 \
            --repo "$GITHUB_REPOSITORY" \
            --name Sanctuary-V13-Expanded-Monster-Motion-Lab \
            --dir previous/v13

          test -s previous/v13/01_selected_sprite_ids.csv
          test -s previous/v13/02_all_rendered_sprite_images.csv
          test -s previous/v13/05_external_action_numeric_comparison.csv
          test -s previous/v13/06_summary_v13.json
          test -d previous/v13/viewer/sheets

      - name: Measure all rendered frames and build mapping editor
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import csv
          import json
          import math
          import os
          import shutil
          import statistics
          from collections import defaultdict
          from pathlib import Path
          from PIL import Image

          ROOT = Path.cwd()
          SOURCE = ROOT / "previous/v13"
          REPORT = ROOT / "reports"
          VIEW = REPORT / "viewer"
          SHEETS = VIEW / "sheets"

          def read_csv(name):
              with (SOURCE / name).open(
                  encoding="utf-8-sig", newline=""
              ) as handle:
                  return list(csv.DictReader(handle))

          def write_csv(name, rows, fields):
              with (REPORT / name).open(
                  "w", encoding="utf-8-sig", newline=""
              ) as handle:
                  writer = csv.DictWriter(
                      handle,
                      fieldnames=fields,
                      extrasaction="ignore"
                  )
                  writer.writeheader()
                  writer.writerows(rows)

          original_summary = json.loads(
              (SOURCE / "06_summary_v13.json").read_text(
                  encoding="utf-8"
              )
          )

          source_images = read_csv(
              "02_all_rendered_sprite_images.csv"
          )
          selected = read_csv(
              "01_selected_sprite_ids.csv"
          )
          references = read_csv(
              "05_external_action_numeric_comparison.csv"
          )

          if len(source_images) != int(
              original_summary["all_image_variants"]
          ):
              raise RuntimeError(
                  "V13 image manifest count mismatch"
              )

          shutil.copytree(
              SOURCE / "viewer/sheets",
              SHEETS,
              dirs_exist_ok=True
          )

          actor_names = {
              int(row["sprite_id"]): {
                  "name": row["external_npc_names"],
                  "selection": row["selection"],
                  "reference_count": int(
                      row["external_action_candidates"]
                  )
              }
              for row in selected
          }

          entries = []
          frame_rows = []
          errors = []

          for row in source_images:
              actor = int(row["actor"])
              sub = int(row["sub"])
              count = int(row["renderedFrames"])
              total = int(row["frames"])
              cols = int(row["cols"])
              cw = int(row["cellW"])
              ch = int(row["cellH"])

              relative = Path(row["sheet"])

              if (
                  not relative.parts
                  or relative.parts[0] != "sheets"
                  or ".." in relative.parts
              ):
                  raise RuntimeError(
                      "Invalid original sprite path"
                  )

              path = VIEW / relative

              if not path.is_file():
                  errors.append({
                      "sprite_id": actor,
                      "subid": sub,
                      "package": row["package"],
                      "reason": "MISSING_IMAGE"
                  })
                  continue

              try:
                  with Image.open(path) as image:
                      atlas = image.convert("RGBA")

                  expected_width = cw * cols
                  expected_height = (
                      math.ceil(count / cols) * ch
                  )

                  if (
                      atlas.width != expected_width
                      or atlas.height != expected_height
                  ):
                      raise ValueError(
                          "PNG atlas dimensions mismatch"
                      )

                  if (
                      count < 1 or total < count
                      or cols < 1 or cw < 1 or ch < 1
                  ):
                      raise ValueError(
                          "Invalid sprite frame metadata"
                      )

                  changes = []
                  centers = []
                  visible = 0
                  previous = None

                  for frame in range(count):
                      sx = (frame % cols) * cw
                      sy = (frame // cols) * ch

                      crop = atlas.crop((
                          sx, sy, sx + cw, sy + ch
                      ))

                      alpha = crop.getchannel("A")
                      bounds = alpha.getbbox()

                      if bounds:
                          visible += 1
                          cx = (bounds[0] + bounds[2]) / 2
                          cy = (bounds[1] + bounds[3]) / 2
                          centers.append((cx, cy))
                          width = bounds[2] - bounds[0]
                          height = bounds[3] - bounds[1]
                      else:
                          width = 0
                          height = 0

                      thumb = alpha.resize(
                          (16, 16),
                          Image.Resampling.BOX
                      ).tobytes()

                      if previous is not None:
                          change = sum(
                              abs(a - b)
                              for a, b in zip(
                                  thumb, previous
                              )
                          ) / (256 * 255)

                          changes.append(change)

                      previous = thumb

                      frame_rows.append({
                          "sprite_id": actor,
                          "subid": sub,
                          "package": row["package"],
                          "sha256": row["sha256"],
                          "frame_index": frame,
                          "visible": bool(bounds),
                          "visible_width": width,
                          "visible_height": height,
                          "alpha_change_from_previous": (
                              round(changes[-1], 6)
                              if changes else 0
                          )
                      })

                  drift = []

                  for a, b in zip(
                      centers, centers[1:]
                  ):
                      drift.append(
                          math.dist(a, b)
                          / max(cw, ch)
                      )

                  mean_change = (
                      statistics.mean(changes)
                      if changes else 0
                  )

                  mean_drift = (
                      statistics.mean(drift)
                      if drift else 0
                  )

                  entries.append({
                      "actor": actor,
                      "sub": sub,
                      "package": row["package"],
                      "sha256": row["sha256"],
                      "frames": total,
                      "renderedFrames": count,
                      "cols": cols,
                      "cellW": cw,
                      "cellH": ch,
                      "sheet": relative.as_posix(),
                      "origin": row["origin"],
                      "visibleFrames": visible,
                      "meanAlphaChange": round(
                          mean_change, 6
                      ),
                      "meanCenterDrift": round(
                          mean_drift, 6
                      )
                  })

              except Exception as exc:
                  errors.append({
                      "sprite_id": actor,
                      "subid": sub,
                      "package": row["package"],
                      "reason": str(exc)
                  })

          write_csv(
              "01_actual_sprite_frame_features.csv",
              frame_rows,
              [
                  "sprite_id", "subid", "package",
                  "sha256", "frame_index", "visible",
                  "visible_width", "visible_height",
                  "alpha_change_from_previous"
              ]
          )

          write_csv(
              "02_image_validation_errors.csv",
              errors,
              [
                  "sprite_id", "subid",
                  "package", "reason"
              ]
          )

          by_group = defaultdict(list)

          for entry in entries:
              key = (
                  entry["actor"],
                  entry["package"],
                  entry["sub"] // 8 * 8
              )
              by_group[key].append(entry)

          by_reference = defaultdict(list)

          for row in references:
              key = (
                  int(row["sprite_id"]),
                  row["package"],
                  int(row["band_start"])
              )
              by_reference[key].append(row)

          groups = []
          duplicate_variants = 0

          for key, rows in sorted(
              by_group.items()
          ):
              actor, package, start = key

              by_sub = defaultdict(list)

              for row in rows:
                  by_sub[row["sub"]].append(row)

              subids = sorted(by_sub)
              complete = all(
                  n in by_sub
                  for n in range(start, start + 8)
              )

              framecounts = [
                  by_sub[n][0]["frames"]
                  for n in subids
              ]

              changes = [
                  x["meanAlphaChange"]
                  for x in rows
              ]

              drifts = [
                  x["meanCenterDrift"]
                  for x in rows
              ]

              conflicts = sum(
                  len({
                      x["sha256"]
                      for x in versions
                  }) > 1
                  for versions in by_sub.values()
              )

              duplicate_variants += conflicts

              ref = by_reference.get(key, [])

              exact = [
                  r for r in ref
                  if r["comparison_status"]
                  == "FRAMECOUNT_EQUAL_NUMERIC_ONLY"
              ]

              variability = (
                  statistics.pstdev(framecounts)
                  if len(framecounts) > 1
                  else 0
              )

              priority = (
                  (100 if complete else 0)
                  + len(subids) * 10
                  + (20 if exact else 0)
                  - min(variability, 40)
              )

              group = {
                  "actor": actor,
                  "package": package,
                  "base": start,
                  "end": start + 7,
                  "present": len(subids),
                  "complete": complete,
                  "variants": len(rows),
                  "duplicateSubids": conflicts,
                  "framecountStd": round(
                      variability, 3
                  ),
                  "meanAlphaChange": round(
                      statistics.mean(changes), 6
                  ),
                  "meanCenterDrift": round(
                      statistics.mean(drifts), 6
                  ),
                  "numericMatches": len(exact),
                  "reviewPriority": round(
                      priority, 3
                  ),
                  "referenceHints": [
                      {
                          "actionId": int(r["action_id"]),
                          "hint": r["external_action_hint"],
                          "values": r[
                              "external_reference_values"
                          ],
                          "status": r["comparison_status"]
                      }
                      for r in ref
                  ]
              }

              groups.append(group)

          groups.sort(
              key=lambda x: (
                  -x["reviewPriority"],
                  x["actor"],
                  x["package"],
                  x["base"]
              )
          )

          write_csv(
              "03_review_priority_groups.csv",
              groups,
              [
                  "actor", "package", "base", "end",
                  "present", "complete", "variants",
                  "duplicateSubids", "framecountStd",
                  "meanAlphaChange", "meanCenterDrift",
                  "numericMatches", "reviewPriority"
              ]
          )

          candidate_manifest = {
              "version": "V14",
              "source": "V13_SHA256_VERIFIED_SPR",
              "actionDefinitionRecovered": False,
              "gameActionMappingVerified": False,
              "packagePrecedenceVerified": False,
              "reviewGroups": groups
          }

          (REPORT / "04_unassigned_motion_candidates.json").write_text(
              json.dumps(
                  candidate_manifest,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          summary = {
              "phase": "INTERACTIVE_MOTION_ASSIGNMENT_PREPARATION",
              "v13_original_sprite_variants": len(
                  source_images
              ),
              "validated_sprite_sheets": len(entries),
              "analyzed_individual_frames": len(frame_rows),
              "image_errors": len(errors),
              "sprite_actor_ids": len({
                  x["actor"] for x in entries
              }),
              "package_specific_bands": len(groups),
              "complete_eight_direction_candidates": sum(
                  x["complete"] for x in groups
              ),
              "numeric_reference_matched_bands": sum(
                  x["numericMatches"] > 0
                  for x in groups
              ),
              "same_package_duplicate_subids": (
                  duplicate_variants
              ),
              "original_action_definition_verified": False,
              "original_monster_identity_verified": False,
              "original_direction_orientation_verified": False,
              "original_frame_timing_verified": False,
              "user_mapping_required": True
          }

          (REPORT / "05_summary_v14.json").write_text(
              json.dumps(
                  summary,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          html = r'''<!doctype html>
          <html lang="ko">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Sanctuary V14 Motion Workbench</title>
          <style>
          :root{font-family:system-ui,sans-serif;color-scheme:dark;background:#101722;color:#edf3fb}
          *{box-sizing:border-box}
          body{max-width:1120px;margin:auto;padding:12px}
          h1{font-size:1.3rem}
          h2{font-size:1rem;margin:20px 0 9px}
          p{color:#adc3d9;font-size:.82rem;line-height:1.5}
          .warn{color:#ffc48b}
          .toolbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px}
          label{display:flex;flex-direction:column;gap:5px;font-size:.78rem}
          select,input,button{background:#26384c;color:#fff;border:1px solid #536a83;border-radius:8px;padding:9px;font:inherit;min-width:0}
          button{cursor:pointer}
          .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
          .controls label{flex-direction:row;align-items:center}
          .actions{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
          .actions button{flex:1;min-width:75px}
          .directions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
          .directions button{min-height:43px}
          .active{border-color:#92e2ff;background:#315672}
          .panel{padding:10px;border:1px solid #344d65;background:#192737;border-radius:10px;margin:12px 0}
          .stage{max-width:380px;margin:0 auto}
          canvas{display:block;width:100%;aspect-ratio:1;background:#25364a;image-rendering:pixelated;border-radius:7px}
          .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px}
          .card{padding:7px;background:#192737;border:1px solid #34495e;border-radius:9px;min-width:0}
          .heading{font-size:.8rem;font-weight:700;margin-bottom:6px}
          .meta{font-size:.7rem;color:#b4c8de;overflow-wrap:anywhere;margin-top:5px}
          .info{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.78rem;line-height:1.6;color:#cddff2}
          .save{display:flex;flex-wrap:wrap;gap:8px}
          .save button{flex:1}
          </style>
          </head>
          <body>
          <h1>Sanctuary V14 · 실제 SPR 모션 매핑</h1>
          <p class="warn">실제 SPR 이미지로 대기·이동·공격·피격·사망 후보를 지정하는 검사기입니다. 외부 액션 정보는 참고자료이며, 확인하지 않은 모션을 자동 확정하지 않습니다.</p>
          <div class="toolbar">
          <label>ID·참고 이름 검색<input id="search" placeholder="ID 또는 이름"></label>
          <label>스프라이트 ID<select id="actor"></select></label>
          <label>원본 PAK<select id="pak"></select></label>
          <label>8방향 후보 그룹<select id="bank"></select></label>
          <label>방향 시작번호<select id="rotation"></select></label>
          <label>방향 순서 반전<select id="mirror"><option value="0">반전 없음</option><option value="1">역순</option></select></label>
          <label>검사용 프레임 간격<select id="speed"><option value="80">80 ms</option><option value="120">120 ms</option><option value="160">160 ms</option><option value="200" selected>200 ms</option><option value="260">260 ms</option><option value="350">350 ms</option></select></label>
          </div>

          <h2>동작 선택·재생</h2>
          <div class="actions">
          <button data-action="idle">대기</button>
          <button data-action="walk">이동</button>
          <button data-action="attack">공격</button>
          <button data-action="hit">피격</button>
          <button data-action="death">사망</button>
          <button data-action="magic">마법</button>
          </div>

          <div class="panel">
          <div class="stage"><canvas id="stage" width="320" height="320"></canvas></div>
          <div class="controls">
          <button id="play">일시정지</button>
          <button id="previous">이전 프레임</button>
          <button id="next">다음 프레임</button>
          <span id="status">프레임 0</span>
          </div>
          <div class="directions" id="directions"></div>
          </div>

          <div class="panel info" id="info"></div>

          <h2>8방향 동시 재생</h2>
          <div class="grid" id="grid"></div>

          <h2>현재 모션 후보 지정</h2>
          <p>선택한 PAK·서브 ID·방향 회전·프레임 간격을 각 동작별로 기록합니다. 불완전한 8방향 그룹도 저장할 수 있지만 누락 방향은 표시됩니다.</p>
          <div class="save">
          <button id="assign">현재 동작에 지정</button>
          <button id="export">게임 연동 후보 JSON 저장</button>
          </div>
          <p class="warn">JSON의 동작명은 사용자가 선택한 후보입니다. 원본 list.spr의 프레임 순서나 재생시간을 복원했다는 의미는 아닙니다.</p>

          <script type="application/json" id="inventory">__DATA__</script>
          <script>
          'use strict';
          const DATA=JSON.parse(document.getElementById('inventory').textContent);
          const ROWS=DATA.entries;
          const BANKS=DATA.groups;
          const NAMES=DATA.names;
          const ASSETS=DATA.assets||{};
          const $=id=>document.getElementById(id);
          const cache=new Map();
          const index=new Map();
          const mappings={};
          const actions=['idle','walk','attack','hit','death','magic'];
          const actionNames={idle:'대기',walk:'이동',attack:'공격',hit:'피격',death:'사망',magic:'마법'};
          const controls={actor:$('actor'),pak:$('pak'),bank:$('bank'),rotation:$('rotation'),mirror:$('mirror'),speed:$('speed')};
          let activeAction='idle';
          let direction=0;
          let frame=0;
          let playing=true;
          let last=performance.now();

          for(const row of ROWS){
            const key=[row.actor,row.package,row.sub].join('|');
            if(!index.has(key))index.set(key,[]);
            index.get(key).push(row);
          }
          for(const values of index.values())values.sort((a,b)=>a.sha256.localeCompare(b.sha256));

          function addOption(parent,value,title){
            const item=document.createElement('option');
            item.value=String(value);
            item.textContent=title;
            parent.append(item);
          }

          function currentActor(){
            return Number(controls.actor.value);
          }

          function findRows(actor,packageName,sub){
            return index.get([actor,packageName,sub].join('|'))||[];
          }

          function currentGroup(){
            return BANKS.find(x=>
              x.actor===currentActor() &&
              x.package===controls.pak.value &&
              x.base===Number(controls.bank.value)
            );
          }

          function activeConfig(){
            return {
              package:controls.pak.value,
              base:Number(controls.bank.value),
              rotation:Number(controls.rotation.value),
              mirror:controls.mirror.value==='1',
              intervalMs:Number(controls.speed.value)
            };
          }

          function sourceSub(config,dir){
            const physical=config.mirror?(8-dir)%8:dir;
            return config.base+(physical+config.rotation)%8;
          }

          function sourceRow(config,dir){
            return findRows(
              currentActor(),
              config.package,
              sourceSub(config,dir)
            )[0]||null;
          }

          function imageFor(row){
            if(!row)return null;
            if(!cache.has(row.sheet)){
              const image=new Image();
              image.onload=drawAll;
              image.src=ASSETS[row.sheet]||'viewer/'+row.sheet;
              cache.set(row.sheet,image);
            }
            return cache.get(row.sheet);
          }

          function paint(canvas,row,step){
            const ctx=canvas.getContext('2d');
            ctx.clearRect(0,0,canvas.width,canvas.height);
            if(!row)return;
            const image=imageFor(row);
            if(!image||!image.complete||!image.naturalWidth)return;

            const oneshot=['attack','hit','death','magic'].includes(activeAction);
            const f=oneshot
              ?Math.min(step,row.renderedFrames-1)
              :step%row.renderedFrames;
            const sx=(f%row.cols)*row.cellW;
            const sy=Math.floor(f/row.cols)*row.cellH;
            const scale=Math.min(
              canvas.width/row.cellW,
              canvas.height/row.cellH,
              3
            );
            const w=row.cellW*scale;
            const h=row.cellH*scale;

            ctx.imageSmoothingEnabled=false;
            ctx.drawImage(
              image,sx,sy,row.cellW,row.cellH,
              (canvas.width-w)/2,
              (canvas.height-h)/2,
              w,h
            );
          }

          function drawAll(){
            const config=activeConfig();
            paint($('stage'),sourceRow(config,direction),frame);
            document.querySelectorAll('[data-dir-canvas]').forEach(canvas=>{
              const dir=Number(canvas.dataset.dirCanvas);
              paint(canvas,sourceRow(config,dir),frame);
            });
            $('status').textContent=
              actionNames[activeAction]+' · 방향 '+direction+' · 프레임 '+frame;
          }

          function buildGrid(){
            $('grid').replaceChildren();
            for(let dir=0;dir<8;dir++){
              const config=activeConfig();
              const row=sourceRow(config,dir);
              const card=document.createElement('div');
              card.className='card';
              const title=document.createElement('div');
              title.className='heading';
              title.textContent='방향 '+dir+' · SPR '+sourceSub(config,dir);
              const canvas=document.createElement('canvas');
              canvas.width=220;
              canvas.height=220;
              canvas.dataset.dirCanvas=String(dir);
              const meta=document.createElement('div');
              meta.className='meta';
              meta.textContent=row
                ?row.package+' · '+row.renderedFrames+'/'+row.frames+'프레임 · '+row.sha256.slice(0,10)
                :'원본 없음';
              card.append(title,canvas,meta);
              card.onclick=()=>selectDirection(dir);
              $('grid').append(card);
            }
            updateInfo();
            drawAll();
          }

          function updateInfo(){
            const group=currentGroup();
            if(!group){
              $('info').textContent='선택 가능한 그룹 없음';
              return;
            }
            const ref=group.referenceHints
              .filter(x=>x.status==='FRAMECOUNT_EQUAL_NUMERIC_ONLY')
              .map(x=>x.actionId+(x.hint?' '+x.hint:''))
              .join(', ')||'없음';
            const missing=[];
            for(let i=0;i<8;i++){
              if(!sourceRow(activeConfig(),i))missing.push(i);
            }
            const mapped=mappings[String(currentActor())]||{};
            $('info').textContent=[
              '스프라이트 ID: '+currentActor(),
              '외부 참고 이름: '+(NAMES[String(currentActor())]?.name||'없음'),
              '원본 PAK: '+group.package,
              '서브 ID: '+group.base+'~'+group.end,
              '실제 존재하는 슬롯: '+group.present+'/8',
              '프레임 변화량: '+group.meanAlphaChange,
              '중심 변화량: '+group.meanCenterDrift,
              '수치상 일치하는 외부 액션: '+ref,
              '방향 누락: '+(missing.length?missing.join(', '):'없음'),
              '이 ID에 기록한 동작: '+Object.keys(mapped).join(', '),
              '원본 액션 매핑: 미확정'
            ].join('\n');
          }

          function selectDirection(n){
            direction=n;
            document.querySelectorAll('[data-direction]').forEach(b=>{
              b.classList.toggle('active',Number(b.dataset.direction)===n);
            });
            frame=0;
            drawAll();
          }

          function setupDirections(){
            for(let i=0;i<8;i++){
              const button=document.createElement('button');
              button.textContent='방향 '+i;
              button.dataset.direction=String(i);
              button.onclick=()=>selectDirection(i);
              $('directions').append(button);
            }
            selectDirection(0);
          }

          function actorLabel(id){
            const info=NAMES[String(id)];
            const names=info?.name||'';
            return id+(names?' · '+names.slice(0,45):'');
          }

          function setupActors(){
            const q=$('search').value.trim().toLowerCase();
            const previous=controls.actor.value;
            const ids=[...new Set(ROWS.map(x=>x.actor))].sort((a,b)=>a-b);
            const matches=ids.filter(id=>
              !q ||
              String(id).includes(q) ||
              (NAMES[String(id)]?.name||'').toLowerCase().includes(q)
            );
            controls.actor.replaceChildren();
            matches.forEach(id=>addOption(controls.actor,id,actorLabel(id)));
            if(matches.some(id=>String(id)===previous))controls.actor.value=previous;
            setupPaks();
          }

          function setupPaks(){
            const names=[...new Set(
              ROWS.filter(x=>x.actor===currentActor()).map(x=>x.package)
            )].sort();
            controls.pak.replaceChildren();
            names.forEach(name=>addOption(controls.pak,name,name));
            setupBanks();
          }

          function setupBanks(){
            const groups=BANKS.filter(x=>
              x.actor===currentActor()&&x.package===controls.pak.value
            ).sort((a,b)=>b.reviewPriority-a.reviewPriority);
            controls.bank.replaceChildren();
            groups.forEach(g=>{
              const status=g.complete?'8/8':'부분 '+g.present+'/8';
              const candidate=g.numericMatches?' · 외부 수치 일치':'';
              addOption(
                controls.bank,g.base,
                g.base+'~'+g.end+' · '+status+candidate
              );
            });
            frame=0;
            buildGrid();
          }

          function assignAction(){
            const actor=String(currentActor());
            if(!mappings[actor])mappings[actor]={};
            const config=activeConfig();

            config.spriteId=currentActor();
            config.action=activeAction;
            config.directionMap=[];

            for(let dir=0;dir<8;dir++){
              const row=sourceRow(config,dir);
              config.directionMap.push({
                engineDirection:dir,
                sourceSubId:sourceSub(config,dir),
                sha256:row?.sha256||null,
                totalInternalFrames:row?.frames||0,
                renderedFrames:row?.renderedFrames||0,
                imageSheet:row?.sheet||null
              });
            }

            config.allDirectionsPresent=config.directionMap.every(x=>x.sha256);
            config.source='V13_SHA256_VERIFIED_SPR';
            config.mappingStatus='USER_SELECTED_CANDIDATE';
            config.originalActionDefinitionVerified=false;
            config.originalFrameTimingVerified=false;

            mappings[actor][activeAction]=config;
            updateInfo();
          }

          function selectAction(name){
            activeAction=name;
            frame=0;
            const existing=mappings[String(currentActor())]?.[name];

            if(existing){
              controls.pak.value=existing.package;
              setupBanks();
              controls.bank.value=String(existing.base);
              controls.rotation.value=String(existing.rotation);
              controls.mirror.value=existing.mirror?'1':'0';
              controls.speed.value=String(existing.intervalMs);
            }

            document.querySelectorAll('[data-action]').forEach(button=>{
              button.classList.toggle('active',button.dataset.action===name);
            });
            buildGrid();
          }

          function exportJson(){
            const payload={
              version:'V14',
              schema:'sanctuary-motion-candidates-v1',
              source:'V13_ORIGINAL_SPR',
              sourceActionOrderRecovered:false,
              sourceDurationUnitRecovered:false,
              packagePrecedenceVerified:false,
              requiresVisualReview:true,
              assignments:mappings
            };

            const blob=new Blob(
              [JSON.stringify(payload,null,2)],
              {type:'application/json'}
            );

            const url=URL.createObjectURL(blob);
            const link=document.createElement('a');
            link.href=url;
            link.download='sanctuary-v14-motion-mapping.json';
            link.click();
            setTimeout(()=>URL.revokeObjectURL(url),1000);
          }

          $('search').oninput=setupActors;
          controls.actor.onchange=setupPaks;
          controls.pak.onchange=setupBanks;
          controls.bank.onchange=buildGrid;
          controls.rotation.onchange=buildGrid;
          controls.mirror.onchange=buildGrid;
          controls.speed.onchange=()=>{
            frame=0;
            drawAll();
          };

          document.querySelectorAll('[data-action]').forEach(button=>{
            button.onclick=()=>selectAction(button.dataset.action);
          });

          $('assign').onclick=assignAction;
          $('export').onclick=exportJson;

          $('play').onclick=()=>{
            playing=!playing;
            $('play').textContent=playing?'일시정지':'재생';
          };

          $('previous').onclick=()=>{
            frame=Math.max(0,frame-1);
            drawAll();
          };

          $('next').onclick=()=>{
            frame++;
            drawAll();
          };

          document.addEventListener('keydown',event=>{
            if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;
            const dirs={
              ArrowUp:0,
              ArrowRight:2,
              ArrowDown:4,
              ArrowLeft:6
            };
            if(event.key in dirs){
              event.preventDefault();
              selectDirection(dirs[event.key]);
            }
            if(event.key.toLowerCase()==='a')selectAction('attack');
            if(event.key.toLowerCase()==='h')selectAction('hit');
            if(event.key.toLowerCase()==='d')selectAction('death');
            if(event.key.toLowerCase()==='w')selectAction('walk');
            if(event.key.toLowerCase()==='s')selectAction('idle');
          });

          function tick(now){
            if(playing&&now-last>=Number(controls.speed.value)){
              frame++;
              last=now;
              drawAll();
            }
            requestAnimationFrame(tick);
          }

          for(let i=0;i<8;i++){
            addOption(controls.rotation,i,String(i));
          }

          setupDirections();
          setupActors();
          selectAction('idle');
          requestAnimationFrame(tick);
          </script>
          </body>
          </html>'''

          def make_html(name, payload):
              encoded = json.dumps(
                  payload,
                  ensure_ascii=False,
                  separators=(",", ":")
              ).replace("<", "\\u003c")

              (REPORT / name).write_text(
                  html.replace("__DATA__", encoded),
                  encoding="utf-8"
              )

          def payload(rows, bands, embed=False):
              assets = {}

              if embed:
                  for row in rows:
                      path = VIEW / row["sheet"]
                      assets[row["sheet"]] = (
                          "data:image/png;base64,"
                          + base64.b64encode(
                              path.read_bytes()
                          ).decode("ascii")
                      )

              actors = {
                  row["actor"] for row in rows
              }

              return {
                  "entries": rows,
                  "groups": [
                      group for group in bands
                      if group["actor"] in actors
                  ],
                  "names": {
                      str(actor): actor_names.get(
                          actor, {}
                      )
                      for actor in actors
                  },
                  "assets": assets
              }

          make_html(
              "V14-Full-Motion-Workbench.html",
              payload(entries, groups)
          )

          mini_entries = []
          mini_actors = set()
          mini_size = 0
          mini_limit = 6 * 1024 * 1024

          for group in groups:
              if not group["complete"]:
                  continue

              if group["actor"] in mini_actors:
                  continue

              rows = [
                  row for row in entries
                  if (
                      row["actor"] == group["actor"]
                      and row["package"] == group["package"]
                      and group["base"] <= row["sub"] <= group["end"]
                  )
              ]

              size = sum(
                  (VIEW / row["sheet"]).stat().st_size
                  for row in rows
              )

              if mini_size + size > mini_limit:
                  continue

              mini_entries.extend(rows)
              mini_size += size
              mini_actors.add(group["actor"])

              if len(mini_actors) >= 5:
                  break

          if not mini_entries:
              raise RuntimeError(
                  "No self-contained motion sample available"
              )

          make_html(
              "V14-Standalone-Mobile-Motion-Test.html",
              payload(mini_entries, groups, True)
          )

          report = [
              "Sanctuary of Aden V14",
              "",
              "Original SPR image sheets: "
              + str(len(entries)),
              "Individual frames analyzed: "
              + str(len(frame_rows)),
              "Complete eight-slot groups: "
              + str(
                  summary["complete_eight_direction_candidates"]
              ),
              "Image errors: " + str(len(errors)),
              "Standalone sample actor IDs: "
              + str(len(mini_actors)),
              "",
              "Full workbench requires viewer/sheets images.",
              "Standalone workbench embeds selected source images.",
              "Action labels are manual visual-review selections.",
              "Direction rotation and reversal are test settings.",
              "Exported JSON does not prove original animation timing.",
              "No changes are applied to the playable game."
          ]

          (REPORT / "REPORT.txt").write_text(
              "\n".join(report) + "\n",
              encoding="utf-8"
          )

          print("=== V14 SUMMARY ===")
          print(json.dumps(
              summary,
              ensure_ascii=False,
              indent=2
          ))

          print("=== V14 STANDALONE ACTORS ===")
          print(sorted(mini_actors))

          output = os.environ.get(
              "GITHUB_STEP_SUMMARY"
          )

          if output:
              with open(
                  output, "a",
                  encoding="utf-8"
              ) as handle:
                  handle.write("\n".join(report) + "\n")

          if errors:
              raise SystemExit(
                  "Some verified V13 image sheets failed V14 validation"
              )

          PY

      - name: Upload V14 motion workbench
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-V14-Interactive-Motion-Mapping
          path: reports/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
