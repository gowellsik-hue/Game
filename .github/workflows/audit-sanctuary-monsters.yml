           <div class="panel"><div class="scroll"><table><thead><tr><th>Lv(EXP)</th><th>원본 이름(외부참조)</th><th>NPC ID</th><th>SPR ID</th><th>HP</th><th>EXP</th><th>아데나</th><th>스폰 총수</th><th>그래픽</th></tr></thead><tbody id="items"></tbody></table></div></div>
           <section class="panel"><h2 id="head">몬스터 선택</h2><p id="source" class="muted"></p><div id="stats" class="stats"></div><p class="muted">최종 공격력·명중난수·피격난수는 몬스터 DB에 단일 고정값으로 저장되지 않아 미확인. L1J 공격 계산은 대상 AC 및 상태에 따라 달라집니다. 데이터 미확인 항목은 임의 계산하지 않습니다.</p><h2>맵·소환 좌표 (L1J 외부 참조)</h2><div class="scroll"><table><thead><tr><th>맵</th><th>맵ID</th><th>X</th><th>Y</th><th>개체수</th><th>영역(X1,Y1~X2,Y2)</th><th>리스폰</th></tr></thead><tbody id="spawns"></tbody></table></div><h2>생추어리 원본 그래픽 — 동작 뱅크 원형 (역할 미확정)</h2><p class="warnings">뱅크 번호를 정지·공격·사망이라고 임의로 붙이지 않습니다. 같은 SPR 번호가 외부 이름과 동일 개체인지 시각적으로 검토해야 합니다.</p><div class="rawbanks" id="banks"></div><div class="frames" id="frames"></div></section>
           <script type="application/json" id="dataset">__DATA__</script><script>(()=>{'use strict';const d=JSON.parse(document.getElementById('dataset').textContent),$=id=>document.getElementById(id);let shown=d.rows.slice(),current=null,bank=null;const dash=v=>(v==null||v===''?'미확인':v),S=d.summary,cell=(a,b)=>{let q=document.createElement('div');q.className='stat';let x=document.createElement('small');x.textContent=a;let y=document.createElement('strong');y.textContent=dash(b);q.append(x,y);return q};
           $('counts').innerHTML='<span><b>'+S.reference_exp_exact_level_0_10_npc_ids+'</b> NPC ID</span><span><b>'+S.reference_exp_exact_level_0_10_unique_gfx+'</b> SPR 번호</span><span><b>'+S.reference_exp_exact_level_0_10_sanctuary_spr_matched_npc_ids+'</b> SPR 번호 일치 NPC</span><span><b>'+S.reference_exp_exact_level_0_10_spawn_count_sum+'</b> 출현 설정 총수(외부 자료)</span>';
           for(let i=0;i<=10;i++)$('lvl').add(new Option('Lv '+i,String(i)));
           function list(){let q=$('search').value.trim().toLowerCase(),l=$('lvl').value,mode=$('place').value;shown=d.rows.filter(r=>(!q||[r.name,r.npcid,r.gfxid].some(x=>String(x).toLowerCase().includes(q)))&&(!l||r.exp_inferred_level===l)&&(!mode||(mode==='spawn'?Number(r.spawn_count)>0:Number(r.spawn_count)===0)));$('items').replaceChildren();for(let r of shown){const tr=document.createElement('tr');tr.dataset.npc=r.npcid;if(current?.npcid===r.npcid)tr.className='sel';for(let key of ['exp_inferred_level','name','npcid','gfxid','hp','exp','adena_min','spawn_count','asset_available']){let td=document.createElement('td');td.textContent=key==='adena_min'?(r.adena_min?`${r.adena_min}~${r.adena_max}`:'-'):key==='asset_available'?(r.asset_available?'GIF':'미확인'):dash(r[key]);tr.append(td)}tr.onclick=()=>{current=r;bank=null;list();detail()};$('items').append(tr)}if(!current&&shown.length){current=shown[0];detail()}}
           function detail(){if(!current)return;let r=current;$('head').textContent=`${r.name} / Lv ${r.exp_inferred_level} / NPC ${r.npcid} / SPR ${r.gfxid}`;$('source').textContent=`EXP ${r.exp} = ${r.exp_inferred_level}² + 1 · 레벨 원문 ${r.original_sql_lvl} (${r.exp_vs_sql_level}) · ${r.identity} · 소스: 외부 L1J 3.80c`;$('stats').replaceChildren();[['HP',r.hp],['MP',r.mp],['기본 물리피해(AC전/L1J 참고)',r.reference_pre_def_physical_min?`${r.reference_pre_def_physical_min}~${r.reference_pre_def_physical_max}`:'미확인'],['STR',r.str],['DEX',r.dex],['AC',r.ac],['MR',r.mr],['명중난수','미확인'],['피격난수','미확인'],['공격속도(서버 DB 수치)',r.atkspeed],['대체 공격속도 (ms)',r.alt_atk_speed],['이동속도(서버 DB 수치)',r.passispeed],['마법속도 (ms)',r.atk_magic_speed],['EXP (서버참조)',r.exp],['아데나 최소~최대',r.adena_min?`${r.adena_min}~${r.adena_max}`:'없음/미확인'],['아데나 확률 (백만분율)',r.adena_chance_per_million],['스폰 설정 수',r.spawn_count],['스폰 레코드 수',r.spawn_rows],['SPR 출처 패키지',r.gfx_asset_origin||'없음']].forEach(x=>$('stats').append(cell(...x)));$('spawns').replaceChildren();for(const x of (d.spawns[r.npcid]||[])){const tr=document.createElement('tr');for(const v of [x.map_name,x.mapid,x.locx,x.locy,x.count,`${x.locx1||'-'},${x.locy1||'-'} ~ ${x.locx2||'-'},${x.locy2||'-'}`,x.min_respawn_delay?`${x.min_respawn_delay}~${x.max_respawn_delay}초`:'-']){let td=document.createElement('td');td.textContent=dash(v);tr.append(td)}$('spawns').append(tr)}let source=d.sprites[r.gfxid]||{},names=Object.keys(source).sort((a,b)=>Number(a)-Number(b));$('banks').replaceChildren();if(!names.length){$('frames').textContent='해당 SPR 원본 4방향 GIF 확인 불가';return}bank=(bank&&names.includes(bank))?bank:names[0];for(let b of names){let btn=document.createElement('button');btn.textContent='원본 뱅크 '+b;btn.className=b===bank?'active':'';btn.onclick=()=>{bank=b;detail()};$('banks').append(btn)}$('frames').replaceChildren();for(let [dir,label] of [['1','↑'],['3','→'],['5','↓'],['7','←']]){let p=document.createElement('div');p.className='frame';let t=document.createElement('p');t.textContent=label;p.append(t);let b64=source[bank][dir];if(b64){let img=document.createElement('img');img.src='data:image/gif;base64,'+b64;p.append(img)}else p.append('원본 없음');$('frames').append(p)}}$('search').oninput=list;$('lvl').onchange=list;$('place').onchange=list;list()})();</script></body></html>'''
           out.write_text(source.replace('__DATA__',payload),'utf-8')
           print('V35_HTML',out,out.stat().st_size,'matched sprite actors',len(graphics),'embed gifs',meta['embedded_gifs'],flush=True)
           (REPORT/'V35-html-asset-summary.json').write_text(json.dumps({**meta,'actors_embedded':len(graphics),'html_bytes':out.stat().st_size},ensure_ascii=False,indent=2),'utf-8')

          if __name__=='__main__':main()
          V35_PYHTML
