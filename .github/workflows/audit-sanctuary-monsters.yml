
# FILE: .github/workflows/audit-sanctuary-monsters.yml
# V34 Scope: ALL 8233 Sanctuary SPR actor IDs and ALL 158040 source SPR files.
# Original client assets, NOT a verified server monster-statistics or spawn database.
# HTML alone remains 0..10 SLKnight-review reference, never an original Sanctuary Lv claim.
name: "audit-sanctuary-monsters.yml | V34 | 61CE Physical Motion ID and Bank Review"
run-name: "audit-sanctuary-monsters.yml | V34 | Sanctuary Source 4-Dir Multi-Bank Audit"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/audit-sanctuary-monsters.yml"]

permissions:
  contents: read
  actions: read

jobs:
  v34-audit:
    name: "V34 | ALL Sanctuary original sprites; HTML Lv 0-10 only"
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "V34 | Restore pinned sources and original game event reference"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full python3-pil python3-yaml ruby
          mkdir -p source/v2 source/v12 v30 previous game reports downloads paks
          git show 312eb3417871916e7337fec8f93ad665f1b03160:.github/workflows/audit-sanctuary-monsters.yml > source/v32-pinned.yml
          git show 69d266d1a8b0d53b1bb4a8ca60b539b204f805c7:.github/workflows/audit-sanctuary-monsters.yml > source/v29-pinned.yml
          git show 5c40dc3de28ee879182c6f60802a89432072c138:.github/workflows/audit-sanctuary-monsters.yml > source/decoder.yml
          gh run download 38784834277 -R "$GITHUB_REPOSITORY" -n Sanctuary-V2-Reports -D source/v2
          gh run download 38872552732 -R "$GITHUB_REPOSITORY" -n Sanctuary-V12-External-Action-and-NPC-Crosscheck -D source/v12
          gh run download 39362135443 -R "$GITHUB_REPOSITORY" -n audit-sanctuary-monsters-v30-five-motion-review-61CE -D v30
          gh run download 39364651925 -R "$GITHUB_REPOSITORY" -n github-pages -D previous
          cp source/v2/all_sprite_candidates.csv source/all_sprite_candidates.csv
          cp source/v2/exported_sprite_manifest.csv source/exported_sprite_manifest.csv
          cp source/v12/03_external_npc_gfx_candidates.csv source/03_external_npc_gfx_candidates.csv
          test -s previous/artifact.tar
          tar -xf previous/artifact.tar -C game --wildcards './knight/gameasync/Data/*.rxdata'
          test -s game/knight/gameasync/Data/Scripts.rxdata

      - name: "V34 | Reconstruct tested scripts and validate original decoder"
        run: |
          set -euo pipefail
          python3 - <<'PY_SCRIPT'
          import ast, re, yaml
          from pathlib import Path
          v32=yaml.safe_load(Path('source/v32-pinned.yml').read_text('utf-8'))
          v29=yaml.safe_load(Path('source/v29-pinned.yml').read_text('utf-8'))
          steps=v32['jobs']['v32-audit']['steps']
          def run_with(token):
              matches=[x['run'] for x in steps if token in x.get('name','')]
              assert len(matches)==1,(token,len(matches))
              return matches[0]
          def extract(run, filename, tag):
              pattern=r'cat > '+re.escape(filename)+r" <<'"+tag+r"'\n(.*?)\n"+tag+r'(?:\n|$)'
              m=re.search(pattern,run,re.S)
              if not m:raise RuntimeError('Missing pinned source '+filename)
              return m.group(1)+'\n'
          def patch_once(s,old,new,label):
              assert s.count(old)==1,(label,s.count(old))
              return s.replace(old,new,1)
          ruby=extract(run_with('Read all V229 map event positions'),'/tmp/v32_events.rb','RUBY')
          processor=extract(run_with('Extract all monster candidate SPR banks'),'/tmp/v32_processor.py','PY')
          baseline=extract(run_with('Extract all monster candidate SPR banks'),'source/V32-V230-review.b64','B64')
          assert len(processor)>18000 and len(baseline)>11000 and len(ruby)>1500
          p=processor.replace('V32','V34')
          # No L1Monster restriction for original Sanctuary extraction.
          old=' actors,external_names=identity_candidates()\n records,actors=build_animations(actors,external_names,offline=args.offline)'
          new=''' actors,external_names=identity_candidates()
           # ALL actual Sanctuary SPR actor IDs. External reference never filters the source.
           external_candidate_ids=set(actors)
           full_sprite_rows=readcsv(SRC/'all_sprite_candidates.csv')
           sanctuary_actor_ids={int(m.group(1)) for r in full_sprite_rows
                                if (m:=re.fullmatch(r'(\\d+)-(\\d+)\\.spr',r['file'],re.I))}
           assert len(sanctuary_actor_ids)==8233,len(sanctuary_actor_ids)
           actors=sanctuary_actor_ids
           records,actors=build_animations(actors,external_names,offline=args.offline)'''
          p=patch_once(p,old,new,'full Sanctuary actor set')
          p=patch_once(p,
              "'monsters_source_candidate_ids':len(actors),'source_indexed_spr':records['inventory_count'],",
              "'monsters_source_candidate_ids':len(external_candidate_ids), 'sanctuary_original_actor_ids':len(actors), 'sanctuary_actors_in_external_monster_refs':len(actors & external_candidate_ids), 'source_indexed_spr':records['inventory_count'],",
              'separate external references from original source')
          p=patch_once(p,
              'assert len(fullids)>=8000 and len(candidates)>=15000,(len(fullids),len(candidates))',
              'assert len(fullids)==8233 and len(candidates)>=76000,(len(fullids),len(candidates))',
              'full coverage gate')
          p=patch_once(p,
              "'review_baseline':'V230 workbook not game applied','offline':args.offline}",
              "'review_baseline':'SLKnight V230 workbook; NOT Sanctuary monster server DB', 'sanctuary_server_stats_available':False, 'source_extraction_complete_but_actor_classes_unverified':True,'offline':args.offline}",
              'original stats provenance')
          p=patch_once(p,
              'assert len(low)==23 and len(merged)==492',
              'assert len(low)==23 and len(merged)==492 and len(actors)==8233',
              'full original actor assert')
          p=p.replace("'monster_reference_ids',len(actors)","'ALL_SANCTUARY_actor_ids',len(actors)")
          assert 'sanctuary_original_actor_ids' in p and "len(candidates)>=76000" in p
          oldstep=next(x['run'] for x in v29['jobs'][next(iter(v29['jobs']))]['steps'] if 'Inspect all source motion banks' in x.get('name',''))
          decoder=extract(oldstep,'/tmp/v29_core.py','PY')
          assert 'def original_reader(' in decoder and 'def gif_encode(' in decoder
          for text in (p,decoder):ast.parse(text)
          Path('/tmp/v34_events.rb').write_text(ruby,'utf-8')
          Path('/tmp/v34_processor.py').write_text(p,'utf-8')
          Path('/tmp/v29_core.py').write_text(decoder,'utf-8')
          Path('source/V34-V230-review.b64').write_text(baseline,'ascii')
          print('V34 reconstructed full Sanctuary source processor and original Reader')
          PY_SCRIPT
          ruby -c /tmp/v34_events.rb
          python3 -m py_compile /tmp/v34_processor.py /tmp/v29_core.py
          ruby /tmp/v34_events.rb game/knight/gameasync/Data source/V34-runtime-events.json
          python3 - <<'PY_PROBE'
          import importlib.util
          spec=importlib.util.spec_from_file_location('verified_v29','/tmp/v29_core.py')
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          assert callable(mod.original_reader()) and callable(mod.gif_encode)
          print('V34 PRECHECK: original SPR Reader/GIF decoder ready')
          PY_PROBE

      - name: "V34 | Index all 8233 original actors without name-based exclusions"
        run: |
          set -euo pipefail
          python3 - <<'PY_CATALOG'
          import csv,json,re
          from collections import defaultdict,Counter
          from pathlib import Path
          S=Path('source');R=Path('reports');R.mkdir(exist_ok=True)
          def csvrows(p):
              with p.open(encoding='utf-8-sig',newline='') as f:return list(csv.DictReader(f))
          rows=csvrows(S/'all_sprite_candidates.csv')
          refs=csvrows(S/'03_external_npc_gfx_candidates.csv')
          source_groups=defaultdict(lambda:{'count':0,'banks':set(),'dirs':set(),'paks':set(),'cardinal':0})
          for r in rows:
              m=re.fullmatch(r'(\d+)-(\d+)\.spr',r['file'],re.I)
              if m is None:continue
              a,s=map(int,m.groups());v=source_groups[a];v['count']+=1
              v['banks'].add(s//8*8);v['dirs'].add(s%8);v['paks'].add(r['pak'])
              if s%8 in (1,3,5,7):v['cardinal']+=1
          names=defaultdict(set)
          for r in refs:
              if r.get('implementation','').lower()!='l1monster':continue
              try:aid=int(r['gfx_id'])
              except (KeyError,ValueError):continue
              if r.get('npc_name','').strip():names[aid].add(r['npc_name'].strip())
          assert len(source_groups)==8233
          with (R/'V34-Sanctuary-ALL-8233-actor-inventory.csv').open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.writer(f);w.writerow(['sanctuary_sprite_actor_id','all_raw_SPR_files','cardinal_files','banks','directions','source_PAK_count','external_L1J_names_UNVERIFIED','original_monster_identity_verified'])
              for a,g in sorted(source_groups.items()):
                  w.writerow([a,g['count'],g['cardinal'],','.join(map(str,sorted(g['banks']))),','.join(map(str,sorted(g['dirs']))),len(g['paks']),' | '.join(sorted(names[a])),False])
          with (R/'V34-Sanctuary-original-vs-game-data-sources.txt').open('w',encoding='utf-8') as f:
              f.write('Sanctuary original: 8233 SPR actor IDs, 158040 SPR file records, 17 PAK packages.\n')
              f.write('Original monster class/name/action labels are NOT verified from this original client.\n')
              f.write('Third-party L1J 3.80c references are comparison hints, not Sanctuary original evidence.\n')
              f.write('Level 0..10 preview uses a separate SLKnight V230 REVIEW roster (23 rows), not verified original Sanctuary server levels.\n')
              f.write('Map coordinates in preview originate from SLKnight V229R37, NOT the Sanctuary original server spawn DB.\n')
              f.write('Sanctuary source does not yet supply verified server HP/attack/hit/speed/EXP/adena/spawn rows in audited assets.\n')
              f.write('Source manifests preserve all file IDs, source PAK variants, and full checksums without conflating client/server datasets.\n')
          print('V34 catalog ready',len(source_groups),'source identities; external L1J named actors present',sum(bool(names[a]) for a in source_groups))
          PY_CATALOG

      - name: "V34 | Restore ALL original Sanctuary sprite PAKs"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          gh release download v1.0.0 -R "$GITHUB_REPOSITORY" --pattern "Sanctuary.of.Aden.-.Copy.*" -D downloads
          7z l downloads/Sanctuary.of.Aden.-.Copy.zip > reports/V34-ALL-client-archive-files.txt
          7z x downloads/Sanctuary.of.Aden.-.Copy.zip "Sanctuary of Aden - Copy/Sprite*.pak" "-o${PWD}/paks" -y > reports/V34-original-pak-extract.log
          test "$(find paks -type f -name 'Sprite*.pak' | wc -l)" -eq 17
          rm -rf downloads

      - name: "V34 | Verify raw SHA256 of every original SPR file"
        run: |
          set -euo pipefail
          python3 - <<'PY_HASH'
          import csv,hashlib,json
          from pathlib import Path
          src=Path('source');read=lambda p:list(csv.DictReader(p.open(encoding='utf-8-sig',newline='')))
          idx=read(src/'all_sprite_candidates.csv');ref=read(src/'exported_sprite_manifest.csv')
          sha={(r['pak'],r['sprite_file'].lower(),int(r['bytes'])):r['sha256'] for r in ref}
          opened={};verified=0;seen_pk=set()
          try:
              for r in sorted(idx,key=lambda x:(x['pak'],int(x['offset']))):
                  key=(r['pak'],r['file'].lower(),int(r['bytes']))
                  wanted=sha.get(key)
                  if not wanted:raise RuntimeError('Missing original SPR hash '+str(key))
                  pack=r['pak'].removeprefix('outer/')
                  path=Path('paks')/pack
                  if pack not in opened:opened[pack]=path.open('rb')
                  fh=opened[pack];fh.seek(int(r['offset']));raw=fh.read(int(r['bytes']))
                  if len(raw)!=int(r['bytes']) or hashlib.sha256(raw).hexdigest()!=wanted:
                      raise RuntimeError('Original SPR corrupted '+str(key))
                  verified+=1;seen_pk.add(pack)
          finally:
              for f in opened.values():f.close()
          assert verified==158040,verified
          assert len(seen_pk)==17,len(seen_pk)
          out={'version':'V34','raw_spr_sha_verified':verified,'original_paks':len(seen_pk),'actor_type_and_server_stats_verified':False}
          Path('reports/V34-ALL-original-raw-sha256-check.json').write_text(json.dumps(out,indent=2),'utf-8')
          print('V34 full original SHA PASS',out)
          PY_HASH

      - name: "V34 | Render GIF for EVERY source actor 4 cardinal directions"
        run: |
          set -euo pipefail
          python3 /tmp/v34_processor.py
          test -s reports/V34-summary.json
          test -s reports/audit-sanctuary-monsters-V34-level-0-10-integrated.html

      - name: "V34 | Fix skeleton 30 original motion mapping and freeze death"
        run: |
          set -euo pipefail
          cat > /tmp/v34_fix_html.py <<'PY_FIX'
          #!/usr/bin/env python3
          """Keep actual Sanctuary source GIFs, normalize anchor, fix skeleton animation mapping in 0..10 review UI.
          No modification to any game or approved CE.
          """
          from __future__ import annotations
          import base64, io, json, re, sys
          from pathlib import Path
          from PIL import Image


          def replace_once(src, old, new, label):
              cnt=src.count(old)
              if cnt != 1:
                  raise AssertionError(f'{label}: needed one match, got {cnt}: {old[:80]}')
              return src.replace(old,new,1)


          def gif_on_standard_canvas(raw:bytes,w:int,h:int)->bytes:
              gif=Image.open(io.BytesIO(raw))
              frames=[]
              for i in range(gif.n_frames):
                  gif.seek(i)
                  fr=gif.convert('RGBA')
                  assert fr.width <= w and fr.height <= h
                  canv=Image.new('RGBA',(w,h),(0,0,0,0))
                  canv.alpha_composite(fr,((w-fr.width)//2, h-fr.height))
                  pal=canv.convert('RGB').quantize(colors=255)
                  pal.paste(255,mask=canv.getchannel('A').point(lambda a:255 if a<128 else 0))
                  frames.append(pal)
              stream=io.BytesIO()
              frames[0].save(stream,format='GIF',save_all=True,append_images=frames[1:],duration=150,
                             loop=0,disposal=2,transparency=255,optimize=False)
              out=stream.getvalue()
              with Image.open(io.BytesIO(out)) as chk:
                  assert chk.n_frames>=1 and chk.info.get('loop')==0
              return out


          def frame_as_png(raw,frame_index=0):
              g=Image.open(io.BytesIO(raw));g.seek(frame_index)
              out=io.BytesIO();g.convert('RGBA').save(out,format='PNG');return base64.b64encode(out.getvalue()).decode('ascii')


          def fix(path, output):
              html=Path(path).read_text('utf-8')
              m=re.search(r'(<script id="payload" type="application/json">)(.*?)(</script>)',html,re.S)
              assert m,'V33 / V34 payload missing'
              data=json.loads(m.group(2))
              assert len(data['rows'])==23
              assert '30' in data['assets']
              originals=0;replaced=0
              # Keep every original source GIF outside preview (library artifact); normalize only embedded mini-preview copies.
              for actor,bankmap in data['assets'].items():
                  all_gif=[Image.open(io.BytesIO(base64.b64decode(x[0]))) for bank in bankmap.values() for x in bank.values()]
                  max_w=max(im.width for im in all_gif)
                  max_h=max(im.height for im in all_gif)
                  assert max_w>0 and max_h>0
                  for bank in bankmap.values():
                      for d,record in bank.items():
                          orig=base64.b64decode(record[0]);old=Image.open(io.BytesIO(orig))
                          res=gif_on_standard_canvas(orig,max_w,max_h)
                          rec=Image.open(io.BytesIO(res))
                          assert old.n_frames==rec.n_frames,(actor,d)
                          record[0]=base64.b64encode(res).decode('ascii');originals+=1;replaced+=1

              data['actor_role_overrides']={
                  '30':{'wait':8,'walk':40,'attack':0,'hit':16,'death':24,'reappear':32}
              }
              # Skeleton stand still: freeze native wait-source pose, DO NOT loop any walking sprite as idle.
              data['skeleton_wait_static']={d:frame_as_png(base64.b64decode(record[0]),0)
                                           for d,record in data['assets']['30']['8'].items()}
              data['skeleton_death_final']={d:frame_as_png(base64.b64decode(record[0]),int(record[1])-1)
                                           for d,record in data['assets']['30']['24'].items()}
              data['skeleton_review']={
                  'wait':'Still pose (bank 8 first frame), no independent motion asserted',
                  'walk':'Bank 40, motion visually consistent with walking; role remains unapproved',
                  'attack':'Bank 0, visually consistent with striking; role remains unapproved',
                  'hit':'Bank 16, single frame; unverified',
                  'death':'Bank 24 falling apart, visual verified',
                  'reappear':'Bank 32 reconstructing the skeleton, visual verified'
              }
              data['preview_source_note']='Actual Sanctuary extracted Sprite.pak. V230 levels/stats are separate review values, NOT original Sanctuary server statistics.'
              data['assignment_approved']=False
              payload=json.dumps(data,ensure_ascii=False,separators=(',',':')).replace('<','\\u003c')
              html=html[:m.start(2)]+payload+html[m.end(2):]

              old="ROLES=[['wait','정지'],['walk','걷기'],['attack','공격'],['hit','피격'],['death','사망']]"
              new="ROLES=[['wait','정지(고정 자세)'],['walk','걷기'],['attack','공격(검토)'],['hit','피격(검토)'],['death','사망'],['reappear','숨었다 나옴']]"
              html=replace_once(html,old,new,'roles')
              old="function chooseBank(k){const p=D.role_proposals[k],b=Object.keys(lib()).map(Number).sort((a,b)=>a-b);return String(selection[k]??(b.includes(p)?p:-1))}"
              new="function chooseBank(k){const p=D.actor_role_overrides?.[actor]?.[k]??D.role_proposals[k],b=Object.keys(lib()).map(Number).sort((a,b)=>a-b);return String(selection[k]??(b.includes(p)?p:-1))}"
              html=replace_once(html,old,new,'actor motion map')
              old="n.append(image(rec[0],title+' · bank '+bank));"
              new="const el=image(rec[0],title+' · bank '+bank);if(which==='wait'&&actor==='30'&&D.skeleton_wait_static?.[d])el.src='data:image/png;base64,'+D.skeleton_wait_static[d];n.append(el);"
              html=replace_once(html,old,new,'static comparison pane')
              html=replace_once(html,"function four(box,bank){","function four(box,bank,which){",'four argument')
              html=replace_once(html,"four(g,chooseBank(key));if(role===key)","four(g,chooseBank(key),key);if(role===key)",'role onchange')
              html=replace_once(html,"four(g,chooseBank(key));pane.append(g)","four(g,chooseBank(key),key);pane.append(g)",'role initial')
              html=replace_once(html,"for(const [key,title] of ROLES){const pane=", "for(const [key,title] of ROLES){if(key==='reappear'&&actor!=='30')continue;const pane=",'special motion')
              old="else{h.style.display='block';h.src='data:image/gif;base64,'+rec[0]+'#'+(++ticks)}"
              new="else{h.style.display='block';h.src=(actor==='30'&&role==='wait'&&D.skeleton_wait_static?.[dir])?('data:image/png;base64,'+D.skeleton_wait_static[dir]):('data:image/gif;base64,'+rec[0]+'#'+(++ticks))}"
              html=replace_once(html,old,new,'static hero')
              old="if(role==='attack'||role==='hit'){timer=setTimeout(()=>{role='wait';refreshHero()},Math.max(450,rec?rec[1]*150:450))}}"
              new="if(role==='attack'||role==='hit'){timer=setTimeout(()=>{role='wait';refreshHero()},Math.max(450,rec?rec[1]*150:450))}else if(role==='death'&&actor==='30'&&rec){const a=actor,d=dir;timer=setTimeout(()=>{if(actor===a&&dir===d&&role==='death'){h.src='data:image/png;base64,'+D.skeleton_death_final[d]}},Math.max(450,rec[1]*150))}}"
              html=replace_once(html,old,new,'death freeze')
              old='<button data-action="death">사망</button>'
              new='<button data-action="death">사망</button><button data-action="reappear" id="skeleton-reappear">해골 다시 일어남</button>'
              html=replace_once(html,old,new,'spawn button')
              old="$('status').textContent=row.name+' | Lv '+row.level+' | 492개 중 0~10 23개체 | V230 검토 수치 / 미승인 SPR 후보 '+actor;"
              new="$('status').textContent=row.name+' | Lv '+row.level+' (SLKnight V230 추정) | 0~10레벨 23개체 | 생추어리 SPR 후보 '+actor+' / 미승인 연결 / 게임 미적용';$('skeleton-reappear').hidden=actor!=='30';"
              html=replace_once(html,old,new,'review source note')
              html=html.replace('5동작 × 4방향 비교 (검토용 뱅크)', '5동작 × 4방향 비교 + 해골 재등장 (검토용 뱅크)')
              html=html.replace('원본 전체 뱅크 검토','생추어리 원본 뱅크 전체 비교')
              html=html.replace('레벨은 EXP 역산값이며 직접 선언된 값이 아닙니다.', '레벨은 SLKnight 자료의 EXP 역산값으로, 생추어리 서버 원본 레벨이라고 주장하지 않습니다.')
              html=html.replace('실제 원본', '실제 생추어리 스프라이트 원본')
              html=html.replace('audit-sanctuary-monsters.yml | V33 |', 'audit-sanctuary-monsters.yml | V34 preview |')
              html=html.replace('audit-sanctuary-monsters.yml | V32 |', 'audit-sanctuary-monsters.yml | V34 preview |')
              html=html.replace('audit-sanctuary-monsters.yml | V34 |', 'audit-sanctuary-monsters.yml | V34 preview |')
              # Detect unsafe semantic regression before writing.
              assert all(('\"'+k+'\":'+str(v)) in html for k,v in [('walk',40),('death',24),('reappear',32)])
              assert 'skeleton_wait_static' in html and 'skeleton_death_final' in html
              assert 'name="mobile' not in html
              Path(output).write_text(html,'utf-8')
              print('V34 PREVIEW PATCHED',output,'embedded GIFs',originals,'bytes',len(html.encode('utf-8')))


          if __name__ == '__main__':
              assert len(sys.argv)==3, 'usage: python v34_fix_html.py in.html out.html'
              fix(sys.argv[1],sys.argv[2])
          PY_FIX
          python3 /tmp/v34_fix_html.py reports/audit-sanctuary-monsters-V34-level-0-10-integrated.html reports/audit-sanctuary-monsters-V34-level-0-10-integrated.html
          python3 - <<'PY_TITLE'
          from pathlib import Path
          p=Path('reports/audit-sanctuary-monsters-V34-level-0-10-integrated.html')
          s=p.read_text('utf-8')
          s=s.replace('V34 preview','V34 full-source extraction / Lv0-10 view')
          p.write_text(s,'utf-8')
          PY_TITLE

      - name: "V34 | Validate full source data versus limited HTML"
        run: |
          set -euo pipefail
          python3 - <<'PY_VALIDATE'
          import csv,json,re,subprocess,hashlib,io,base64
          from pathlib import Path
          from PIL import Image
          root=Path('reports')
          s=json.loads((root/'V34-summary.json').read_text('utf-8'))
          assert s['version']=='V34'
          assert s['sanctuary_original_actor_ids']==8233
          assert s['source_inventory_actor_ids']==8233
          assert s['source_indexed_spr']==158040
          assert s['selected_cardinal_spr']==76650
          assert s['sha_checked_cardinal_spr']==s['selected_cardinal_spr']
          assert s['monsters_source_candidate_ids']==723
          assert s['low_level_rows']==23 and s['all_monster_rows']==492
          assert s['all_runtime_map_files']==46 and s['all_runtime_events']==872
          assert s['gif_count']>=1000
          assert not s['runtime_stats_applied'] and not s['motion_assignment_approved']
          assert not s['sanctuary_server_stats_available']
          sha=json.loads((root/'V34-ALL-original-raw-sha256-check.json').read_text('utf-8'))
          assert sha['raw_spr_sha_verified']==158040
          paths=list((root/'gifs').rglob('*.gif'))
          assert len(paths)==s['gif_count']
          with (root/'V34-all-cardinal-gif-manifest.csv').open(encoding='utf-8-sig',newline='') as f:rows=list(csv.DictReader(f))
          assert len(rows)==len(paths) and {int(r['direction']) for r in rows}=={1,3,5,7}
          assert all(r['byte_verified']=='True' and r['motion']=='UNCLASSIFIED' for r in rows)
          with (root/'V34-Sanctuary-ALL-8233-actor-inventory.csv').open(encoding='utf-8-sig',newline='') as f:actors=list(csv.DictReader(f))
          assert len(actors)==8233
          h=(root/'audit-sanctuary-monsters-V34-level-0-10-integrated.html').read_text('utf-8')
          m=re.search(r'<script id="payload" type="application/json">(.*?)</script>',h,re.S)
          assert m
          d=json.loads(m[1]);assert len(d['rows'])==23
          assert d['actor_role_overrides']['30']['walk']==40
          assert d['actor_role_overrides']['30']['death']==24
          assert d['actor_role_overrides']['30']['reappear']==32
          assert len(d['skeleton_wait_static'])==4
          assert len(d['skeleton_death_final'])==4
          for actor,banks in d['assets'].items():
              sz=set()
              for dirs in banks.values():
                  for record in dirs.values():
                      gif=Image.open(io.BytesIO(base64.b64decode(record[0])))
                      sz.add(gif.size)
              assert len(sz)==1,(actor,sz)
          code=re.search(r'<script>(.*?)</script>',h,re.S)
          assert code
          Path('/tmp/v34-preview-client.js').write_text(code[1],'utf-8')
          subprocess.run(['node','--check','/tmp/v34-preview-client.js'],check=True)
          print('V34 FULL ORIGINAL ASSETS + LIMITED HTML validated',json.dumps(s,ensure_ascii=False))
          PY_VALIDATE
          cat reports/V34-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: "V34 | Package all 4-direction source GIFs per original PAK"
        run: |
          set -euo pipefail
          python3 - <<'PY_PACK'
          import shutil,zipfile
          from pathlib import Path
          root=Path('reports');src=root/'gifs';out=root/'gif-packages';out.mkdir(exist_ok=True)
          packs=sorted(p for p in src.iterdir() if p.is_dir())
          assert len(packs)==17,len(packs)
          for pak in packs:
              files=sorted(p for p in pak.rglob('*.gif'))
              with zipfile.ZipFile(out/('V34-'+pak.name+'-cardinal-gifs.zip'),'w',compression=zipfile.ZIP_STORED,allowZip64=True) as z:
                  for p in files:z.write(p,arcname=str(p.relative_to(src)))
              print('V34 GIF PACKAGE',pak.name,len(files),flush=True)
              shutil.rmtree(pak)
          assert len(list(out.glob('*.zip')))==17
          src.rmdir()
          print('All original source GIFs are in 17 per-PAK ZIPs; all source manifests retained.')
          PY_PACK

      - name: "V34 | Upload 0-10 HTML only, separate from full source GIFs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-sanctuary-monsters-v34-level-0-10-html
          path: reports/audit-sanctuary-monsters-V34-level-0-10-integrated.html
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: "V34 | Upload COMPLETE Sanctuary source manifests and reviewed 492 reference rows"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-sanctuary-monsters-v34-all-source-database
          path: |
            reports/*.csv
            reports/*.json
            reports/*.txt
            reports/*.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      - name: "V34 | Upload ALL original 4-direction GIFs from all 17 PAKs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-sanctuary-monsters-v34-all-original-cardinal-gifs
          path: reports/gif-packages/*.zip
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
