
name: Sanctuary of Aden Original Monster GIF V18

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/audit-sanctuary-monsters.yml"

permissions:
  contents: read
  actions: read

jobs:
  gif-extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil

      - name: Restore original Orc SPR images from successful V17
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous/v17 reports
          gh run download 39027677273 --repo "$GITHUB_REPOSITORY" --name Sanctuary-V17-Monster-Motion-Identification --dir previous/v17
          test -s previous/v17/manifest_v17.json
          test -d previous/v17/site/sheets

      - name: Convert 40 original sprite animations into transparent GIFs and standalone HTML
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import base64, json, hashlib

          SRC = Path('previous/v17')
          OUT = Path('reports')
          manifest = json.loads((SRC/'manifest_v17.json').read_text(encoding='utf-8'))
          assert manifest['spriteId'] == 56, 'V18 uses the visually reviewed Orc ID 56'
          rows = {int(x['sub']): x for x in manifest['sprites']}
          assert len(rows) == 40
          ACTIONS = {'wait':(32,220,True),'walk':(0,145,True),'attack':(8,135,False),'death':(24,170,False),'hit':(16,220,False)}
          LABELS = {'wait':'정지 WAIT','walk':'이동 WALK','attack':'공격 ATTACK','death':'사망 DEATH','hit':'피격 HIT'}
          OUT.mkdir(exist_ok=True)
          (OUT/'gifs').mkdir(exist_ok=True)

          def gif_palette(rgba):
              rgb = rgba.convert('RGB')
              indexed = rgb.quantize(colors=255, method=Image.Quantize.MEDIANCUT)
              transparent = rgba.getchannel('A').point(lambda v:255 if v<128 else 0)
              indexed.paste(255, mask=transparent)
              palette = indexed.getpalette() or []
              if len(palette)<768: indexed.putpalette(palette + [0]*(768-len(palette)))
              return indexed

          def extract_frames(row):
              with Image.open(SRC/'site'/row['path']) as img:
                  sheet=img.convert('RGBA')
                  frames=[]
                  for i in row['playableFrames']:
                      x=(i%row['cols'])*row['cellW']
                      y=(i//row['cols'])*row['cellH']
                      frames.append(sheet.crop((x,y,x+row['cellW'],y+row['cellH'])))
                  return frames

          mapping={'version':'V18','actorId':56,'candidateNames':manifest['externalNames'],
                   'originalSpriteHashesVerified':True,'actionDefinitionsVerified':False,
                   'directionOrientationVerified':False,'frameDurationsVerified':False,
                   'classificationMethod':'visual examination of original V17 SPR frame progression',
                   'actions':{}}
          embedded={}
          for action,(base,delay,loop) in ACTIONS.items():
              mapping['actions'][action]={'base':base,'delayMs':delay,'loop':loop,'directions':[],'visualClassification':'reviewed_candidate'}
              embedded[action]=[]
              for direction in range(8):
                  sub=base+direction
                  row=rows[sub]
                  frames=extract_frames(row)
                  assert len(frames)==row['frames'],(sub,len(frames),row['frames'])
                  gif_frames=[gif_palette(frame) for frame in frames]
                  path=OUT/'gifs'/f'orc56_{action}_dir{direction}.gif'
                  options=dict(format='GIF', save_all=True, append_images=gif_frames[1:],
                               duration=[delay]*len(gif_frames), transparency=255,
                               disposal=([2]*(len(gif_frames)-1)+[1] if len(gif_frames)>1 else 1), optimize=False)
                  if loop: options['loop']=0
                  gif_frames[0].save(path,**options)
                  with Image.open(path) as check:
                      assert check.n_frames == len(frames), (action,direction,check.n_frames,len(frames))
                      assert check.info.get('loop')==(0 if loop else None),(action,direction,check.info)
                      assert 'transparency' in check.info
                  blob=path.read_bytes()
                  embedded[action].append(base64.b64encode(blob).decode('ascii'))
                  mapping['actions'][action]['directions'].append({
                      'directionSlot':direction,'sourceSubId':sub,'sourceSHA256':row['sha256'],
                      'frames':len(frames),'gif':path.relative_to(OUT).as_posix(),
                      'gifSHA256':hashlib.sha256(blob).hexdigest()})

          css='''
          :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101a26;color:#eef5ff}*{box-sizing:border-box}
          body{max-width:1100px;margin:auto;padding:12px}h1{font-size:1.35rem;margin:6px 0}h2{font-size:1rem;margin:8px 0 3px}
          p{font-size:.85rem;line-height:1.5;color:#bdd0e2}button,select{font:inherit;color:#edf7ff;background:#263d53;border:1px solid #54718b;border-radius:7px;padding:10px;cursor:pointer}
          .head{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}.head label{display:flex;gap:8px;align-items:center}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
          .panel,.slot{background:#1b2b3d;border:1px solid #3a516a;border-radius:10px;padding:9px;min-width:0}
          .stage{height:185px;display:flex;justify-content:center;align-items:flex-end;background:#283a4b;border-radius:7px;overflow:hidden;padding:6px}
          .stage img{display:block;width:auto;height:auto;max-width:98%;max-height:175px;image-rendering:pixelated;object-fit:contain}
          .meta{font-size:.76rem;color:#b1cbdd;margin:5px 0}.buttons{display:flex;justify-content:space-between;gap:6px;align-items:center;margin-top:7px}.buttons button{padding:7px 10px}
          .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.slot{padding:5px}.slot img{width:100%;height:110px;object-fit:contain;image-rendering:pixelated}
          .slot b{font-size:.76rem}.slot small{display:block;font-size:.71rem;color:#afc6d9}.warn{color:#ffd6a3}.ok{color:#8ee1c0}
          @media(max-width:490px){.actions{gap:6px}.panel{padding:6px}.stage{height:145px}.stage img{max-height:135px}.grid{gap:5px}.slot img{height:88px}}
          '''
          js=r'''
          'use strict';
          const SOURCE=JSON.parse(document.getElementById('encoded').textContent);
          const ACTIONS=['wait','walk','attack','death'];
          const TXT={wait:'정지',walk:'이동',attack:'공격',death:'사망',hit:'피격'};
          const DATA=SOURCE.gif;
          const pick=id=>document.getElementById(id);
          let direction=0;
          function gifUrl(action,dir){
           const base64=DATA[action][dir];
           const raw=atob(base64),u=new Uint8Array(raw.length);
           for(let i=0;i<raw.length;i++)u[i]=raw.charCodeAt(i);
           return URL.createObjectURL(new Blob([u],{type:'image/gif'}));
          }
          function restart(img,action,dir){
           const old=img.dataset.url;
           const url=gifUrl(action,dir);
           img.onload=()=>{if(old) URL.revokeObjectURL(old)};
           img.src=url;img.dataset.url=url;
          }
          function drawPanels(){
           direction=Number(pick('direction').value);
           for(const action of ACTIONS){
            restart(pick('img-'+action),action,direction);
            pick('sub-'+action).textContent='SPR '+(SOURCE.meta[action].base+direction)+' · '+SOURCE.meta[action].frames[direction]+'프레임';
           }
           drawGrid();
          }
          function drawGrid(){
           const action=pick('inspect').value;
           const root=pick('grid');for(const img of root.querySelectorAll('img[data-url]'))URL.revokeObjectURL(img.dataset.url);root.replaceChildren();
           for(let i=0;i<8;i++){
            const node=document.createElement('div');node.className='slot';
            node.innerHTML='<b>방향 슬롯 '+i+'</b><img alt="'+TXT[action]+' 방향'+i+'"><small>SPR '+(SOURCE.meta[action].base+i)+'</small>';
            const img=node.querySelector('img');restart(img,action,i);
            node.onclick=()=>{pick('direction').value=i;drawPanels()};
            root.append(node);
           }
          }
          function boot(){
           const select=pick('direction');
           for(let d=0;d<8;d++)select.add(new Option('방향 슬롯 '+d,d));
           select.onchange=drawPanels;
           pick('inspect').onchange=drawGrid;
           for(const a of ACTIONS) pick('replay-'+a).onclick=()=>restart(pick('img-'+a),a,direction);
           pick('replay-hit').onclick=()=>restart(pick('img-hit'),'hit',direction);
           select.onchange=()=>{drawPanels();restart(pick('img-hit'),'hit',direction)};
           drawPanels();restart(pick('img-hit'),'hit',0);
          }
          boot();
          '''
          js_data={
            'gif':embedded,
            'meta':{a:{'base':v[0],'frames':[rows[v[0]+d]['frames'] for d in range(8)]} for a,v in ACTIONS.items()},
          }
          json_data=json.dumps(js_data,separators=(',',':')).replace('<','\\u003c')

          panels=[]
          for a in ['wait','walk','attack','death']:
              base,delay,loop=ACTIONS[a]
              how='반복 재생' if loop else ('1회 재생 후 마지막 프레임 유지' if a=='death' else '1회 재생')
              panels.append(f'<section class="panel"><h2>{LABELS[a]}</h2><div class="stage"><img id="img-{a}" alt="{LABELS[a]} 원본 GIF"></div><div class="buttons"><span class="meta" id="sub-{a}"></span><button id="replay-{a}">다시 재생</button></div><div class="meta">{how} · 검사용 {delay}ms/프레임</div></section>')
          html=f'''<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orc ID 56 • Original Sprite GIF Motions</title><style>{css}</style></head><body>
          <h1>오크 ID 56 · 원본 SPR GIF 모션</h1><p>V17의 원본 SPR 해시 검증 이미지에서 추출한 정지·이동·공격·사망 4종, 8방향 애니메이션. GIF 40개가 이 HTML에 내장되어 있어 인터넷·외부 폴더 없이 재생됩니다.</p>
          <p class="warn">동작은 실제 프레임을 육안으로 판별한 결과이며 원본 액션 정의 파일 및 방향 방위·프레임 타이밍은 미확인입니다. 방향 숫자는 원본 SPR의 슬롯 번호입니다.</p>
          <div class="head"><label>방향 선택 <select id="direction"></select></label><label>8방향 확대 <select id="inspect"><option value="wait">정지</option><option value="walk">이동</option><option value="attack">공격</option><option value="death">사망</option><option value="hit">피격</option></select></label></div>
          <div class="actions">{''.join(panels)}</div><h2>추가: 피격 HIT (1프레임)</h2><div class="panel"><div class="stage"><img id="img-hit" alt="피격 원본 GIF"></div><div class="buttons"><span class="meta">SPR 16~23 · 1프레임</span><button id="replay-hit">다시 재생</button></div></div>
          <h2>8방향 GIF 동시 비교</h2><p>이미지를 누르면 위 4개 동작의 방향도 함께 바뀝니다.</p><div class="grid" id="grid"></div>
          <p class="ok">원본 SPR 이미지 해시 확인 · 원본 이미지 사용 · 각 GIF 별도 저장 · 단독 HTML</p>
          <script id="encoded" type="application/json">{json_data}</script><script>{js}</script></body></html>'''
          (OUT/'Monster-56-Orc-GIF-Motions.html').write_text(html,encoding='utf-8')
          (OUT/'mapping-v18.json').write_text(json.dumps(mapping,ensure_ascii=False,indent=2),encoding='utf-8')
          summary={'version':'V18','actor':56,'gifCount':sum(len(x) for x in embedded.values()),'originalSprites':40,'fourActions':['wait','walk','attack','death'],'extraAction':'hit','standaloneHTMLBytes':len(html.encode()),'visualActionClassification':True,'originalActionDefinitionsVerified':False,'gifSourceOriginalShaVerified':True,'originalFrameTimingVerified':False,'browserPlaybackManuallyTested':False}
          (OUT/'summary-v18.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - name: Verify standalone HTML and GIF frame counts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          from PIL import Image
          p=Path('reports')
          manifest=json.loads((p/'mapping-v18.json').read_text())
          assert manifest['actorId']==56
          assert len(manifest['actions'])==5
          for act,info in manifest['actions'].items():
              assert len(info['directions'])==8
              for record in info['directions']:
                  with Image.open(p/record['gif']) as gif:
                      assert gif.n_frames==record['frames']
                      assert gif.info.get('loop')==(0 if info['loop'] else None)
                      assert 'transparency' in gif.info
          page=(p/'Monster-56-Orc-GIF-Motions.html').read_text()
          assert page.count('id="img-')>=5
          assert len(page)>100000
          match=re.search(r'<script>(.*?)</script>',page,re.S)
          assert match
          Path('/tmp/v18-check.js').write_text(match.group(1))
          print('V18 verified: 40 GIFs, 8 directions, standalone HTML')
          PY
          node --check /tmp/v18-check.js

      - name: Upload Monster GIF motions
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-V18-Orc-GIF-Motions
          path: reports/
          if-no-files-found: error
          retention-days: 30
