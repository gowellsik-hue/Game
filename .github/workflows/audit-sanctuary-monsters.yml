
name: "audit-sanctuary-monsters.yml | V32 | 61CE Physical Motion ID and Bank Review"
run-name: "audit-sanctuary-monsters.yml | V32 | Sanctuary Source 4-Dir Multi-Bank Audit"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/audit-sanctuary-monsters.yml"]

permissions:
  contents: read
  actions: read

jobs:
  v32-audit:
    name: "V32 | Full monster source inventory, 492-event stats and Lv 0-10 HTML"
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "V32 | Restore approved source archives and 492-event V229 snapshot"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full python3-pil python3-yaml ruby
          mkdir -p source/v2 source/v12 v30 previous game reports downloads paks
          gh run download 38784834277 -R "$GITHUB_REPOSITORY" -n Sanctuary-V2-Reports -D source/v2
          gh run download 38872552732 -R "$GITHUB_REPOSITORY" -n Sanctuary-V12-External-Action-and-NPC-Crosscheck -D source/v12
          gh run download 39362135443 -R "$GITHUB_REPOSITORY" -n audit-sanctuary-monsters-v30-five-motion-review-61CE -D v30
          gh run download 39364651925 -R "$GITHUB_REPOSITORY" -n github-pages -D previous
          git show 5c40dc3de28ee879182c6f60802a89432072c138:.github/workflows/audit-sanctuary-monsters.yml > source/decoder.yml
          cp source/v2/all_sprite_candidates.csv source/all_sprite_candidates.csv
          cp source/v2/exported_sprite_manifest.csv source/exported_sprite_manifest.csv
          cp source/v12/03_external_npc_gfx_candidates.csv source/03_external_npc_gfx_candidates.csv
          test -s v30/V30-source-review.json
          test -s previous/artifact.tar
          test -s source/decoder.yml
          tar -xf previous/artifact.tar -C game --wildcards './knight/gameasync/Data/*.rxdata'
          test -s game/knight/gameasync/Data/Scripts.rxdata
          test -s game/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMapInfos.rxdata
          echo "R37 map/stats/event snapshot restored; no game data written"

      - name: "V32 | Extract all original Sanctuary Sprite PAK packages"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          gh release download v1.0.0 -R "$GITHUB_REPOSITORY" --pattern "Sanctuary.of.Aden.-.Copy.*" -D downloads
          7z x downloads/Sanctuary.of.Aden.-.Copy.zip "Sanctuary of Aden - Copy/Sprite*.pak" "-o${PWD}/paks" -y > reports/V32-original-pak-extract.log
          test "$(find paks -type f -name 'Sprite*.pak' | wc -l)" -ge 17
          rm -rf downloads
          echo "Original Sprite.pak and Sprite00..15.pak restored; indexed PAK bytes stay original"

      - name: "V32 | Read all V229 map event positions without executing game scripts"
        run: |
          set -euo pipefail
          cat > /tmp/v32_events.rb <<'RUBY'
          # encoding: utf-8
          require 'json'
          module RPG
            class Map;end; class MapInfo;end; class AudioFile;end
            class Event;end; class Event::Page;end; class Event::Page::Condition;end
            class Event::Page::Graphic;end; class EventCommand;end; class MoveRoute;end; class MoveCommand;end
            class CommonEvent;end; class Enemy;end; class Enemy::Action;end
          end
          class Table;def self._load(s);s;end;end
          class Color;def self._load(s);s;end;end
          class Tone;def self._load(s);s;end;end
          root=ARGV.fetch(0)
          out=ARGV.fetch(1)
          fix=lambda{|v|v.is_a?(String) ? v.dup.force_encoding('UTF-8').scrub : v}
          files=Dir[File.join(root,'*Map[0-9][0-9][0-9].rxdata')]
          files.select!{|f| File.basename(f).start_with?('MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO')}
          raise 'Missing V229 obfuscated Map source' if files.length<40
          infofile=Dir[File.join(root,'*MapInfos.rxdata')].find{|f|File.basename(f).start_with?('MMUQ')}
          infos=Marshal.load(File.binread(infofile))
          records=[]
          files.sort.each do |f|
            mapid=File.basename(f)[/Map(\d{3})\.rxdata$/,1].to_i
            map=Marshal.load(File.binread(f))
            events=map.instance_variable_get(:@events) || {}
            events.each do |evnum,e|
              pages=(e.instance_variable_get(:@pages)||[]).each_with_index.map do |page,idx|
                g=page.instance_variable_get(:@graphic)
                commands=(page.instance_variable_get(:@list)||[]).map do |cmd|
                  code=cmd.instance_variable_get(:@code)
                  next unless [111,117,121,122,125,315,355,655,106].include?(code)
                  raw=cmd.instance_variable_get(:@parameters)||[]
                  {code:code,values:raw.map{|x|fix[x]}}
                end.compact
                {page:idx,graphic:g ? fix[g.instance_variable_get(:@character_name)] : '',
                 move_speed:page.instance_variable_get(:@move_speed),move_frequency:page.instance_variable_get(:@move_frequency),
                 commands:commands}
              end
              records<<{map_id:mapid,map_name:fix[infos[mapid]&.instance_variable_get(:@name)],
                event_id:evnum,name:fix[e.instance_variable_get(:@name)],
                x:e.instance_variable_get(:@x),y:e.instance_variable_get(:@y),pages:pages}
            end
          end
          File.write(out,JSON.generate({source:'V229R37 deploy (R38 audio only)',map_files:files.size,events:records}))
          STDERR.puts "V32 event map files #{files.size}, events #{records.size}"
          RUBY
          ruby /tmp/v32_events.rb game/knight/gameasync/Data source/V32-runtime-events.json
          test -s source/V32-runtime-events.json

      - name: "V32 | Extract all monster candidate SPR banks and build 0-10 integrated HTML"
        run: |
          set -euo pipefail
          cat > /tmp/v32_processor.py <<'PY'
          #!/usr/bin/env python3
          """V32 source-first monster audit: full V230 roster, candidate SPR animations, 0-10 preview.
          READ ONLY. No runtime data patch; name candidate is NEVER an accepted identity.
          """
          from __future__ import annotations
          import argparse,base64,csv,gzip,hashlib,html,importlib.util,io,json,re,shutil,sys
          from pathlib import Path
          from collections import defaultdict,Counter
          from PIL import Image

          P=Path('.')
          SRC=P/'source'
          OUT=P/'reports'
          OUT.mkdir(exist_ok=True)
          DIRECTIONS=(1,3,5,7)
          ROLE_KEYS=('wait','walk','attack','hit','death')
          HISTORICAL_CANDIDATES={
            '해골':30,'좀비':52,'오크 전사':4472,'간디 오크':56,'놀':1477
          }

          def sha(v):return hashlib.sha256(v).hexdigest()
          def readcsv(path):
           with path.open(encoding='utf-8-sig',newline='') as f:return list(csv.DictReader(f))
          def putcsv(path,fields,rows):
           path.parent.mkdir(parents=True,exist_ok=True)
           with path.open('w',encoding='utf-8-sig',newline='') as f:
            writer=csv.DictWriter(f,fieldnames=fields,extrasaction='ignore');writer.writeheader();writer.writerows(rows)

          def load_game_and_baseline():
           packed=''.join((SRC/'V32-V230-review.b64').read_text('ascii').split())
           baseline=json.loads(gzip.decompress(base64.b64decode(packed)))
           assert baseline['source_kind']=='V230 REVIEW_NOT_GAME_APPLIED'
           assert len(baseline['rows'])==492
           original=(SRC/'V32-runtime-events.json')
           events=json.loads(original.read_text('utf-8'))
           assert events['map_files']>=40
           index={(int(e['map_id']),int(e['event_id'])):e for e in events['events']}
           merged=[]
           for values in baseline['rows']:
            row=dict(zip(baseline['schema'],values))
            key=(int(row['맵ID']),int(row['EV']))
            runtime=index.get(key)
            assert runtime is not None,('Missing runtime map/EV; refuse silent merge',key)
            if str(row['몬스터']).strip() not in str(runtime['name']):
             raise AssertionError(('Runtime event is a different entity',key,row['몬스터'],runtime['name']))
            pages=runtime.get('pages',[])
            body=next((x for x in pages if x.get('graphic') and not any(bad in x['graphic'] for bad in ('좌표','죽음'))),pages[0] if pages else {})
            row.update({
             'runtime_map_name':runtime.get('map_name'),
             'runtime_event_name':runtime.get('name'),
             'spawn_x':runtime.get('x'), 'spawn_y':runtime.get('y'),
             'runtime_graphic':body.get('graphic'),
             'runtime_move_speed':body.get('move_speed'),
             'runtime_move_frequency':body.get('move_frequency'),
             'status':'V230_REVIEW_NOT_APPLIED',
             'origin':'V230 review + deployed V229R37 event coordinates',
            })
            merged.append(row)
           low=[r for r in merged if isinstance(r.get('Lv'),(float,int)) and 0<=r['Lv']<=10]
           assert len(low)==23, ('0-10 roster drift',len(low))
           return merged,low,events

          def identity_candidates():
           records=readcsv(SRC/'03_external_npc_gfx_candidates.csv')
           found=defaultdict(list)
           actors=set()
           for r in records:
            if r.get('implementation','').strip().lower()!='l1monster':continue
            try:actor=int(r['gfx_id'])
            except (ValueError,KeyError):continue
            actors.add(actor)
            found[actor].append({'name':r.get('npc_name',''),'reference':r.get('reference','')})
           assert len(actors)>=700, ('Unexpectedly short monster identity references',len(actors))
           actors.update(HISTORICAL_CANDIDATES.values())
           actorExtra=json.loads((P/'v30/V30-source-review.json').read_text('utf-8'))
           actors.update(map(int,actorExtra['banks'].keys()))
           return actors,found

          def build_animations(actors,legacy,offline=False):
           source_records=readcsv(SRC/'all_sprite_candidates.csv')
           checksum_records=readcsv(SRC/'exported_sprite_manifest.csv')
           raw_hashes={(r['pak'],r['sprite_file'].lower(),int(r['bytes'])):r['sha256'] for r in checksum_records}
           assert len(source_records)>=150000
           raw_manifest=OUT/'V32-all-source-sprite-index.csv'
           shutil.copyfile(SRC/'all_sprite_candidates.csv',raw_manifest)
           fullids=set(); candidates={}; unverified=[]; duplicates=[]; pack_counts=Counter()
           for r in source_records:
            m=re.fullmatch(r'(\d+)-(\d+)\.spr',r['file'],re.I)
            if not m:continue
            aid,sub=map(int,m.groups());fullids.add(aid)
            if aid not in actors or sub%8 not in DIRECTIONS:continue
            key=(r['pak'],r['file'].lower(),int(r['bytes']))
            digest=raw_hashes.get(key)
            if not digest:
             unverified.append((aid,r['pak'],r['file']))
             continue
            pack=r['pak'].removeprefix('outer/')
            info={'actor':aid,'bank':sub//8*8,'direction':sub%8,
                  'pak':pack,'filename':r['file'],'offset':int(r['offset']),
                  'bytes':int(r['bytes']),'expected_sha256':digest}
            # Never coalesce actors across distinct source PAK variants.
            candkey=(pack,aid,sub//8*8,sub%8)
            if candkey in candidates:
             duplicates.append({'actor':aid,'pak':pack,'bank':sub//8*8,'direction':sub%8,'offset':int(r['offset']),'sha256':digest})
             if info['offset']<candidates[candkey]['offset']:
              candidates[candkey]=info
            else:
             candidates[candkey]=info
             pack_counts[pack]+=1
           if unverified:raise RuntimeError(('Missing verification manifest entries',len(unverified),unverified[:12]))
           putcsv(OUT/'V32-multiple-source-records.csv',['actor','pak','bank','direction','offset','sha256'],duplicates)
           assert len(fullids)>=8000 and len(candidates)>=15000,(len(fullids),len(candidates))
           print('SOURCE_INDEX',len(source_records),'source_ids',len(fullids),'monster_reference_ids',len(actors),'candidate_four_way_files',len(candidates),'paks',len(pack_counts),flush=True)
           entries=[]; low_assets={};error=[];files={}
           if offline:
            return {'inventory_count':len(source_records),'actor_inventory':len(fullids),
                    'expected_spr':len(candidates),'source_duplicate_variants':len(duplicates),'sha_checked':0,'gif_count':0,
                    'records':entries,'missing':[],'errors':[],'low':{}},actors

           # Load the already verified original binary decoder from historical workflow.
           spec=importlib.util.spec_from_file_location('v29_decoder','/tmp/v29_core.py')
           decoder=importlib.util.module_from_spec(spec);spec.loader.exec_module(decoder)
           Reader=decoder.original_reader()
           opened={}
           low_actors=set(HISTORICAL_CANDIDATES.values())
           try:
            for i,x in enumerate(sorted(candidates.values(),key=lambda v:(v['pak'],v['actor'],v['bank'],v['direction']))):
             fp=P/'paks'/x['pak']
             if not fp.is_file():raise FileNotFoundError('Required source PAK missing: '+str(fp))
             if x['pak'] not in opened:opened[x['pak']]=fp.open('rb')
             stream=opened[x['pak']]
             stream.seek(x['offset']);raw=stream.read(x['bytes'])
             if len(raw)!=x['bytes'] or sha(raw)!=x['expected_sha256']:
              raise RuntimeError('Original SPR checksum mismatch '+x['filename']+' @ '+x['pak'])
             try:
              gif,frames=decoder.gif_encode(Reader(raw).decode())
             except Exception as exc:  # Record unsupported sprites; do not pretend they decoded.
              error.append({**x,'decode_error':str(exc)[:350]});continue
             pak_stem=Path(x['pak']).stem
             rel=Path('gifs')/pak_stem/str(x['actor'])/f"{x['actor']}-bank{x['bank']}-dir{x['direction']}.gif"
             dest=OUT/rel;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(gif)
             item={**x,'gif':str(rel),'frames':frames,'gif_sha256':sha(gif),'byte_verified':True,
                   'motion':'UNCLASSIFIED','direction_label':{1:'up',3:'right',5:'down',7:'left'}[x['direction']]}
             entries.append(item)
             if x['actor'] in low_actors and pak_stem=='Sprite':
              low_assets.setdefault(str(x['actor']),{}).setdefault(str(x['bank']),{})[str(x['direction'])]=[base64.b64encode(gif).decode(),frames]
             if (i+1)%2000==0:print('GIFS',i+1,'of',len(candidates),'decoded',len(entries),'errors',len(error),flush=True)
           finally:
            for f in opened.values():f.close()
           missing_actor=sorted(actors-{x['actor'] for x in entries})
           putcsv(OUT/'V32-all-cardinal-gif-manifest.csv',
                  ['actor','pak','bank','direction','direction_label','filename','bytes','expected_sha256','gif','frames','gif_sha256','motion','byte_verified'],entries)
           putcsv(OUT/'V32-decoding-errors.csv',
                  ['actor','pak','bank','direction','filename','decode_error'],error)
           putcsv(OUT/'V32-source-actor-unavailable.csv',['actor'],[{'actor':a} for a in missing_actor])
           return {'inventory_count':len(source_records),'actor_inventory':len(fullids),
                   'expected_spr':len(candidates),'source_duplicate_variants':len(duplicates),'sha_checked':len(entries)+len(error),
                   'gif_count':len(entries),'records':entries,'missing':missing_actor,
                   'errors':error,'low':low_assets,'pack_count':len(pack_counts)},actors

          def render_html(low,assetdata,summary):
           # Store ONLY 0-10 levels in the HTML, not whole 492 roster or all 723 candidate actor animations.
           rows=[]
           for x in low:
            actor=HISTORICAL_CANDIDATES.get(str(x['몬스터']).strip())
            rows.append({
             'map':x['지역'],'map_id':x['맵ID'],'ev':x['EV'],
             'name':x['몬스터'],'level':x['Lv'],'level_basis':x['레벨 근거'],
             'x':x['spawn_x'],'y':x['spawn_y'], 'runtime_graphic':x['runtime_graphic'],
             'hp':x['HP'],'attack':x['공격 값 요약'],'attack_delay':x['공격대기'],
             'move_speed_review':x['이동속도'],'move_speed_runtime':x['runtime_move_speed'],
             'move_frequency_runtime':x['runtime_move_frequency'],
             'hit_random':x['명중 난수'],'damage_random':x['피격 난수'],
             'exp_runtime_referenced':x['원본 EXP'],'exp_review':x['설계 EXP'],
             'adena_review':x['V230 아데나 평균'],'adena_min':x['아데나 최소'],
             'adena_max':x['아데나 최대'], 'actor_candidate':actor,
             'character_note':'SPR candidate from V25, identity NOT verified/NOT approved',
            })
           data={'version':'V32','only_level_range':[0,10],
                 'rows':rows,'assets':assetdata,'summary':summary,
                 'roles':['wait','walk','attack','hit','death'],
                 'role_proposals':{'wait':0,'walk':8,'attack':16,'hit':24,'death':32},
                 'cardinal_directions':{'up':1,'right':3,'down':5,'left':7},
                 'assignment_approved':False,'game_modified':False}
           payload=json.dumps(data,ensure_ascii=False,separators=(',',':')).replace('<','\\u003c')
           template=r'''<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>audit-sanctuary-monsters.yml | V32 | 레벨 0~10 추출 통합</title>
          <style>:root{color-scheme:dark;background:#0e1724;color:#e9f2ff;font:15px system-ui,'Malgun Gothic',sans-serif}*{box-sizing:border-box}body{max-width:1320px;margin:auto;padding:16px}h1{font-size:1.3rem}h2{font-size:1.05rem}h3{font-size:.95rem}header,.pane{border:1px solid #395169;background:#172739;border-radius:10px;padding:15px;margin-bottom:12px}p{line-height:1.6}.muted{color:#adbed0;font-size:.86rem}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}select,button,input{background:#263d55;color:white;border:1px solid #5b7790;border-radius:6px;padding:9px;font:inherit}select{max-width:100%}button{cursor:pointer}.toolbar>label{flex:1 1 220px}.toolbar>label>select{width:100%}.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.stat{padding:9px;background:#102337;border-radius:5px;min-width:0}.stat small{display:block;color:#abcee4}.stat strong{font-size:1rem;overflow-wrap:anywhere}.rowgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.sprite{background:#0d1b2a;border-radius:6px;text-align:center;padding:8px;min-width:0}.sprite img{height:110px;max-width:100%;object-fit:contain;image-rendering:pixelated}.motion{border-top:1px solid #40566f;padding:10px 0}.motionhead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}.motionhead select{max-width:140px}.arena{height:220px;position:relative;background:linear-gradient(#1f384a,#0e2131);border-radius:7px;overflow:hidden}.arena img{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);max-width:180px;max-height:155px;image-rendering:pixelated}.controls{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.controls button{flex:1 1 60px}.hint{padding:7px 10px;border-left:3px solid #d5b168;background:#2b2c36}.none{padding:15px;color:#ffccaa}.pill{background:#324759;padding:4px 8px;border-radius:5px}.small{font-size:.78rem}@media(max-width:750px){.statgrid{grid-template-columns:repeat(2,1fr)}.rowgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.sprite img{height:80px}.arena{height:190px}}</style></head><body>
          <header><h1>audit-sanctuary-monsters.yml | V32 | 0~10레벨 몬스터</h1><p>전체 492개체는 추출·별도 기록하고, 이 HTML에는 <b>0~10레벨 23개체</b>만 표시합니다. 실제 맵 좌표는 게임 V229R37에서, 수치와 레벨은 V230 <b>검토 명세(게임 적용값 아님)</b>에서 가져왔습니다. 레벨은 EXP 역산값이며 직접 선언된 값이 아닙니다.</p><p class="hint">생추어리 SPR은 V25의 <b>미승인 후보 번호</b>와 대조합니다. 동작 뱅크의 대기·걷기·공격·피격·사망 연결도 <b>검토용 기본값</b>으로 게임에 반영되지 않았습니다. 원본 방향은 ↑1 →3 ↓5 ←7이며 대각 GIF를 사용하지 않습니다.</p><div class="toolbar"><label>몬스터/맵 선택 <select id="monster"></select></label><label>생추어리 SPR 후보 <select id="actor"></select></label></div><p id="status" class="muted"></p></header>
          <section class="pane"><h2>맵·스폰·전투·보상 데이터</h2><div class="statgrid" id="stats"></div><p class="muted">공격 대기 값과 이동속도 값은 V230 검토 명세입니다. 이벤트 좌표와 이벤트 이동속도는 실제 원본 별도 표시. EXP와 아데나는 원본 확인/검토 설계를 혼동하지 않도록 분리했습니다.</p></section>
          <section class="pane"><h2>4방향 이동·동작 테스트</h2><div class="arena"><img id="hero" alt="원본 몬스터 GIF"><div id="coords" style="position:absolute;left:10px;bottom:8px"></div></div><div class="controls"><button data-dir="1">↑</button><button data-dir="7">←</button><button data-dir="5">↓</button><button data-dir="3">→</button><button data-action="wait">정지</button><button data-action="walk">걷기</button><button data-action="attack">공격</button><button data-action="hit">피격</button><button data-action="death">사망</button></div><p id="action" class="muted"></p></section>
          <section class="pane"><h2>5동작 × 4방향 비교 (검토용 뱅크)</h2><div id="motions"></div><p class="muted">사망동작을 포함한 역할 지정은 확정이 아닙니다. 아래 셀렉터로 원본 뱅크를 개별 비교할 수 있습니다.</p></section>
          <section class="pane"><h2>원본 전체 뱅크 검토</h2><div class="toolbar"><label>뱅크 선택 <select id="bank"></select></label></div><div class="rowgrid" id="raw"></div></section>
          <script id="payload" type="application/json">__PAYLOAD__</script><script>
          (()=>{'use strict';const D=JSON.parse(document.getElementById('payload').textContent),$=s=>document.getElementById(s),DIR=[['1','↑ 위'],['3','→ 오른쪽'],['5','↓ 아래'],['7','← 왼쪽']],ROLES=[['wait','정지'],['walk','걷기'],['attack','공격'],['hit','피격'],['death','사망']];
          let row=D.rows[0], actor=String(row.actor_candidate||''),dir='5',role='wait',selection={},X=50,Y=50,move=null,timer=null,last=0,ticks=0;
          const val=x=>x==null||x===''?'미확인':String(x),lib=()=>D.assets[actor]||{},get=(b,d)=>lib()[String(b)]?.[String(d)]||null;
          function chooseBank(k){const p=D.role_proposals[k],b=Object.keys(lib()).map(Number).sort((a,b)=>a-b);return String(selection[k]??(b.includes(p)?p:-1))}
          function image(src,alt){const i=document.createElement('img');i.alt=alt;i.src='data:image/gif;base64,'+src;return i}
          function four(box,bank){box.replaceChildren();for(const [d,title] of DIR){const n=document.createElement('div');n.className='sprite';const c=document.createElement('div');c.textContent=title;n.append(c);const rec=get(bank,d);if(rec){n.append(image(rec[0],title+' · bank '+bank));const small=document.createElement('div');small.className='muted small';small.textContent=rec[1]+' 프레임';n.append(small)}else{const s=document.createElement('div');s.className='none';s.textContent='원본 없음';n.append(s)}box.append(n)}}
          function refreshHero(){const b=chooseBank(role),rec=get(b,dir),h=$('hero');if(!rec){h.removeAttribute('src');h.style.display='none'}else{h.style.display='block';h.src='data:image/gif;base64,'+rec[0]+'#'+(++ticks)}$('action').textContent=role+' | '+DIR.find(x=>x[0]===dir)[1]+' | 뱅크 '+b+' · 역할 미승인';h.style.left=X+'%';h.style.top=Y+'%';$('coords').textContent='이동 '+Math.round(X)+'%, '+Math.round(Y)+'%';clearTimeout(timer);if(role==='attack'||role==='hit'){timer=setTimeout(()=>{role='wait';refreshHero()},Math.max(450,rec?rec[1]*150:450))}}
          function render(){if(!D.rows.length){$('status').textContent='0~10레벨 데이터 없음';return}row=D.rows.find(x=>$('monster').value===String(x.map_id)+':'+x.ev)||D.rows[0];actor=String(row.actor_candidate||'');$('actor').replaceChildren();Object.keys(D.assets).sort((a,b)=>Number(a)-Number(b)).forEach(a=>{$('actor').add(new Option('SPR '+a+(a===actor?' · 이전 후보':' · 비교용'),a))});$('actor').value=actor;if(!$('actor').value)actor=$('actor').value||'';selection={};renderActor();}
          function renderActor(){const st=[['맵',row.map+' (#'+row.map_id+')'],['이벤트',row.ev],['몬스터',row.name],['레벨',row.level+' ('+row.level_basis+')'],['스폰 좌표',row.x+', '+row.y],['HP (검토)',row.hp],['공격력 (검토)',row.attack],['명중난수 (검토)',row.hit_random],['피격난수 (검토)',row.damage_random],['공격대기 (검토)',row.attack_delay],['이동속도 (검토)',row.move_speed_review],['이동속도 (실제 이벤트)',row.move_speed_runtime],['이동빈도 (실제 이벤트)',row.move_frequency_runtime],['EXP 원본참조',row.exp_runtime_referenced],['EXP 설계',row.exp_review],['아데나 설계평균',row.adena_review],['아데나 설계범위',val(row.adena_min)+' ~ '+val(row.adena_max)],['게임 그래픽',row.runtime_graphic]];$('stats').replaceChildren();st.forEach(([a,b])=>{let n=document.createElement('div');n.className='stat';let k=document.createElement('small');k.textContent=a;let v=document.createElement('strong');v.textContent=val(b);n.append(k,v);$('stats').append(n)});$('status').textContent=row.name+' | Lv '+row.level+' | 492개 중 0~10 23개체 | V230 검토 수치 / 미승인 SPR 후보 '+actor;
          const root=$('motions');root.replaceChildren();for(const [key,title] of ROLES){const pane=document.createElement('section');pane.className='motion';const hdr=document.createElement('div');hdr.className='motionhead';const h=document.createElement('h3');h.textContent=title+' (은행별 확인)';const s=document.createElement('select');s.dataset.role=key;s.add(new Option('미확정 / 없음','-1'));Object.keys(lib()).sort((a,b)=>Number(a)-Number(b)).forEach(b=>s.add(new Option('뱅크 '+b,b)));s.value=chooseBank(key);s.onchange=()=>{selection[key]=Number(s.value);four(g,chooseBank(key));if(role===key)refreshHero()};hdr.append(h,s);pane.append(hdr);const g=document.createElement('div');g.className='rowgrid';four(g,chooseBank(key));pane.append(g);root.append(pane)}
          $('bank').replaceChildren();Object.keys(lib()).sort((a,b)=>Number(a)-Number(b)).forEach(b=>$('bank').add(new Option('뱅크 '+b,b)));$('bank').onchange=()=>four($('raw'),$('bank').value);$('bank').onchange();X=50;Y=50;move=null;role='wait';refreshHero();}
          D.rows.forEach(x=>$('monster').add(new Option(x.name+' Lv'+x.level+' · '+x.map+' / EV'+x.ev,x.map_id+':'+x.ev)));
          $('monster').onchange=render;$('actor').onchange=()=>{actor=$('actor').value;selection={};renderActor()};document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{move=null;role=b.dataset.action;refreshHero()});document.querySelectorAll('[data-dir]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();move=b.dataset.dir;dir=move;role='walk';refreshHero();b.setPointerCapture?.(e.pointerId)};b.onpointerup=()=>{move=null;role='wait';refreshHero()};b.onpointercancel=()=>{move=null;role='wait';refreshHero()}});
          const codes={ArrowUp:'1',ArrowRight:'3',ArrowDown:'5',ArrowLeft:'7',KeyW:'1',KeyD:'3',KeyS:'5',KeyA:'7'};window.onkeydown=e=>{if(e.target.closest?.('select,input,textarea'))return;const v=codes[e.code];if(v&&move!==v){e.preventDefault();move=v;dir=v;role='walk';refreshHero()}};window.onkeyup=e=>{if(codes[e.code]){move=null;role='wait';refreshHero()}};window.onblur=()=>{move=null;role='wait';refreshHero()};function tick(ms){const dt=last?Math.min(.08,(ms-last)/1000):0;last=ms;if(move){const m={'1':[0,-1],'3':[1,0],'5':[0,1],'7':[-1,0]}[move];X=Math.max(10,Math.min(90,X+m[0]*22*dt));Y=Math.max(12,Math.min(88,Y+m[1]*22*dt));$('hero').style.left=X+'%';$('hero').style.top=Y+'%';$('coords').textContent='이동 '+Math.round(X)+'%, '+Math.round(Y)+'%'}requestAnimationFrame(tick)}$('monster').selectedIndex=0;render();requestAnimationFrame(tick);window.__V32_AUDIT={rows:()=>D.rows.length,directions:()=>Object.keys(D.cardinal_directions),sourceGifs:()=>D.summary.gif_count,motionRows:()=>document.querySelectorAll('.motion').length};})();
          </script></body></html>'''
           rendered=template.replace('__PAYLOAD__',payload)
           filename='audit-sanctuary-monsters-V32-level-0-10-integrated.html'
           (OUT/filename).write_text(rendered,'utf-8')
           return filename,len(rendered.encode('utf-8'))

          def main():
           ap=argparse.ArgumentParser();ap.add_argument('--offline',action='store_true');args=ap.parse_args()
           merged,low,source=load_game_and_baseline()
           actors,external_names=identity_candidates()
           records,actors=build_animations(actors,external_names,offline=args.offline)
           header=list(merged[0].keys())
           putcsv(OUT/'V32-full-492-monster-db-review.csv',header,merged)
           putcsv(OUT/'V32-level-0-10-monster-db-review.csv',header,low)
           putcsv(OUT/'V32-runtime-map-events.csv',
             ['map_id','map_name','event_id','name','x','y','graphic','move_speed','move_frequency'],[
             {'map_id':r['map_id'],'map_name':r['map_name'],'event_id':r['event_id'],
              'name':r['name'],'x':r['x'],'y':r['y'],
              'graphic':r['pages'][0]['graphic'] if r['pages'] else '',
              'move_speed':r['pages'][0]['move_speed'] if r['pages'] else '',
              'move_frequency':r['pages'][0]['move_frequency'] if r['pages'] else ''} for r in source['events']])
           (OUT/'V32-monster-candidate-identities.json').write_text(json.dumps({str(k):v for k,v in external_names.items()},ensure_ascii=False),encoding='utf-8')
           summary={'version':'V32','all_monster_rows':len(merged),'low_level_rows':len(low),
                    'all_runtime_map_files':source['map_files'],'all_runtime_events':len(source['events']),
                    'monsters_source_candidate_ids':len(actors),'source_indexed_spr':records['inventory_count'],
                    'source_inventory_actor_ids':records['actor_inventory'],
                    'selected_cardinal_spr':records['expected_spr'],'duplicate_variants_logged':records['source_duplicate_variants'],'sha_checked_cardinal_spr':records['sha_checked'],
                    'gif_count':records['gif_count'],'failed_decodes':len(records['errors']),
                    'candidate_actors_with_no_animation':len(records['missing']),
                    'runtime_stats_applied':False,'motion_assignment_approved':False,
                    'review_baseline':'V230 workbook not game applied','offline':args.offline}
           outname,bytes_=render_html(low,records['low'],summary)
           summary.update({'html':outname,'html_bytes':bytes_})
           (OUT/'V32-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),'utf-8')
           assert len(low)==23 and len(merged)==492
           if not args.offline:
            assert records['sha_checked']==records['expected_spr'],(records['sha_checked'],records['expected_spr'])
            assert len(records['low'])>=4,'At least 4 low-level SPR candidate animations must decode successfully'
            assert all(set(d.keys())<=set(map(str,DIRECTIONS)) for a in records['low'].values() for d in a.values())
           print('V32_DONE',json.dumps(summary,ensure_ascii=False),flush=True)

          if __name__=='__main__':main()
