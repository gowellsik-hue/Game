
# FILE: .github/workflows/audit-sanctuary-maps.yml
# VERSION: V6.3
# PURPOSE: original S32 directional passage + wall-group handoff for SLKnight integration.
# INPUT: successful V6.1 and V6.2 map audit, verified V4.1 visual projection.
# Never modify Game pages, R41 gameplay, existing native map or portal coordinates.
# IMPORTANT: S32 directional rule is supported by community MapTool, NOT confirmed
# as Sanctuary executable logic. Layer5 group opacity ACTUATION is unverified.
name: audit-sanctuary-maps.yml | V6.3 | Original Knight Scale Audit

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/audit-sanctuary-maps.yml]

permissions:
  contents: read
  actions: read

jobs:
  original-map-integration-handoff:
    name: V6.3 | Native directional map, portal routes and wall-group handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: V6.3 Download exact successful V6.1 raw S32 layers
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39381626131
          name: Sanctuary-Map-V6.1-Original-Collision-and-Wall-Rule-Evidence
          github-token: ${{ github.token }}
          path: v61

      - name: V6.3 Download successful V6.2 native directional evidence
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39383241136
          name: Sanctuary-Map-V6.2-Original-Directional-and-Opacity-Link-Evidence
          github-token: ${{ github.token }}
          path: v62

      - name: V6.3 Download verified V4.1 original terrain coordinate basis
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39100619927
          name: Sanctuary-TI-Dungeon-V4.1-Original-Terrain-Walk
          github-token: ${{ github.token }}
          path: v41

      - name: V6.3 Extract integration-ready source grid, path and wall objects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handoff
          cat > /tmp/v63_handoff.py <<'PY_V63'
          from pathlib import Path
          from collections import Counter,deque,defaultdict
          import csv,hashlib,json,math,re,shutil,struct,sys

          v61=Path(sys.argv[1]);v62=Path(sys.argv[2]);v41=Path(sys.argv[3]);out=Path(sys.argv[4])
          out.mkdir(parents=True,exist_ok=True)
          (out/'native').mkdir(exist_ok=True)
          (out/'occlusion').mkdir(exist_ok=True)
          (out/'routes').mkdir(exist_ok=True)
          def sha(path):return hashlib.sha256(path.read_bytes()).hexdigest()
          def dump(path,data):path.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          def load(path):return json.loads(path.read_text(encoding='utf-8'))
          src=load(v61/'summary/v61-main.json')
          evidence=load(v62/'summary-v6.2.json')
          assert src['version']=='V6.1' and evidence['version']=='V6.2'
          assert src['sourceBlocks']['s32']==28 and src['sourceBlocks']['seg']==10
          assert evidence['layer5Total']==39789
          assert evidence['layer5AllReferencesResolveInSameBlock']
          terrain_html=(v41/'preview/terrain-walk-v4.1.html').read_text(encoding='utf-8')
          found=re.search(r'<script id="data" type="application/json">(.*?)</script>',terrain_html,re.S)
          assert found,'V4.1 original map coordinate data missing'
          terrain=json.loads(found.group(1))
          assert set(terrain)>={'1','2'}

          # Original S32 Layer3 coordinate mapping is a 64x64 world grid; the two
          # 16-bit attributes encode candidate North/South and West/East edges.
          # DO NOT reinterpret them as a single blocked/unblocked tile mask.
          maps={}
          projectors={}
          for floor,rgss_map in ((1,45),(2,46)):
              t=terrain[str(floor)]
              block=t['tiles'][0];stem=Path(block['src']).stem
              bx=int(stem[:4],16);by=int(stem[4:8],16)
              x0=32704+(bx-32767)*64;y0=32704+(by-32767)*64
              a=block['x']-12*(x0+y0)
              b=block['y']+378-6*(y0-x0)
              minx=min(i['x'] for i in t['tiles']);miny=min(i['y'] for i in t['tiles'])
              assert a==-783360 and minx==768 and miny==384
              assert b==(762 if floor==1 else 1146)
              # Visual source is at original pixels, rendered 2x in the Game R38 base.
              def pixels(x,y,a=a,b=b,minx=minx,miny=miny):return (a+12*(x+y)-minx,b+6*(y-x)-miny)
              def rgss(x,y,pixels=pixels):
                  px,py=pixels(x,y)
                  return (math.floor(px/16),math.floor(py/16))
              projectors[floor]={'floor':floor,'rgssMapID':rgss_map,
                  'pixelFormula':{'xSumMultiplier':12,'yDifferenceMultiplier':6,
                                  'xOffset':a-minx,'yOffset':b-miny},
                  'sourcePixelsAreDoubledInR38':True,
                  'nativeToRGSSCell':'floor(sourcePixelX / 16), floor(sourcePixelY / 16)',
                  'rgssDimensions':[288,144] if floor==1 else [336,168]}
              old=evidence['floorResults'][str(floor)]
              width,height=old['width'],old['height']
              originx,originy=old['originX'],old['originY']
              data=(v62/f'directional/map-{floor}.bin').read_bytes()
              assert len(data)==width*height
              maps[floor]=(originx,originy,width,height,data,rgss,pixels)
              shutil.copyfile(v62/f'directional/map-{floor}.bin',out/f'native/floor-{floor}-4way.bin')
              def flag(x,y):
                  if not(originx<=x<originx+width and originy<=y<originy+height):return 255
                  return data[(y-originy)*width+x-originx]
              edges=0
              for iy in range(height):
                  for ix in range(width):
                      x=originx+ix;y=originy+iy;value=flag(x,y)
                      if value==255:continue
                      for dx,dy,bit,reverse in ((0,-1,1,2),(0,1,2,1),(-1,0,4,8),(1,0,8,4)):
                          if value&bit:
                              assert flag(x+dx,y+dy)&reverse,(floor,x,y,bit)
                              edges+=1
              assert edges//2==old['candidateEdgesUndirected']
              meta={'floor':floor,'nativeMapID':floor,'rgssMapID':rgss_map,
                  'origin':[originx,originy],'size':[width,height],
                  'passageBytes':f'floor-{floor}-4way.bin','passageSHA256':sha(out/f'native/floor-{floor}-4way.bin'),
                  'encoding':'uint8 row-major; 255=outside; bit0=N, bit1=S, bit2=W, bit3=E; bit SET means passable',
                  'undirectedEdges':edges//2,'directionalEdgeReciprocityVerified':True,
                  'basedOnCommunityMapToolNotSanctuaryExecutable':True,'visualProjection':projectors[floor]}
              dump(out/f'native/floor-{floor}-index.json',meta)
              print('FLOOR',floor,'edges',edges//2,'dimensions',width,height,'projection',projectors[floor],flush=True)

          # Two route tests require the engine-candidate graph to preserve real corridors.
          # They are NOT proof of original server-side movement, nor proof of portal warp.
          source_routes=[(1,'entrance_to_2f',(32669,32802),(32737,32877),551),
                         (2,'return_stairs_to_baphomet',(32665,32788),(32706,32846),109)]
          route_reports=[]
          for floor,name,start,end,expected in source_routes:
              x0,y0,w,h,grid,project,pixels=maps[floor]
              def mask(x,y):
                  return grid[(y-y0)*w+x-x0] if x0<=x<x0+w and y0<=y<y0+h else 255
              dirs=((0,-1,1),(0,1,2),(-1,0,4),(1,0,8))
              queue=deque([start]);parents={start:None}
              while queue and end not in parents:
                  x,y=queue.popleft();bits=mask(x,y)
                  for dx,dy,bit in dirs:
                      xy=(x+dx,y+dy)
                      if bits&bit and mask(*xy)!=255 and xy not in parents:
                          parents[xy]=(x,y);queue.append(xy)
              assert end in parents,(floor,name,'UNREACHABLE')
              coords=[];cur=end
              while cur is not None:
                  coords.append(cur);cur=parents[cur]
              coords.reverse();length=len(coords)-1
              assert length==expected,(floor,length,expected)
              path=out/f'routes/{name}.csv'
              with path.open('w',newline='',encoding='utf-8-sig') as fp:
                  writer=csv.writer(fp);writer.writerow(['step','nativeX','nativeY','sourcePixelX','sourcePixelY','rgssX','rgssY'])
                  for i,(x,y) in enumerate(coords):
                      writer.writerow([i,x,y,*pixels(x,y),*project(x,y)])
              route_reports.append({'name':name,'floor':floor,'start':start,'end':end,
                  'moves':length,'native4WayConnectivity':True,
                  'routeCSV':path.name,'startRGSS':project(*start),'endRGSS':project(*end),
                  'verifiedOriginalWarp':False})
          # Sanity check that the R37 Baphomet event was placed at the projected world point.
          assert maps[1][5](32669,32802)==(95,73)
          assert maps[1][5](32737,32877)==(202,76)
          assert maps[2][5](32706,32846)==(156,100)
          dump(out/'routes/route-checks.json',route_reports)

          # Layer5 is a record of references to Layer4 building groups. Export actual
          # tile OBJECT records; never invent a wall polygon or opacity percentage.
          group_statistics=Counter();types=Counter();sum_l5=0;sum_objects=0
          output_files={f:(out/f'occlusion/floor-{f}-source-groups.jsonl').open('w',encoding='utf-8') for f in (1,2)}
          try:
              for folder in sorted((v61/'raw-layers').glob('*-s32')):
                  floor_str,block,_=folder.name.split('-');floor=int(floor_str)
                  if floor not in (1,2):continue
                  bx=int(block[:4],16);by=int(block[4:8],16)
                  world_x=32704+(bx-32767)*64;world_y=32704+(by-32767)*64
                  raw=(folder/'layer4.bin').read_bytes();num=struct.unpack_from('<i',raw,0)[0]
                  group_members={};p=4
                  for _ in range(num):
                      gid,count=struct.unpack_from('<hH',raw,p);p+=4
                      objects=[]
                      for k in range(count):
                          item=list(struct.unpack_from('<BBBBhB',raw,p+k*7))
                          objects.append(item)
                      p+=count*7
                      assert gid not in group_members
                      group_members[gid]=objects
                      sum_objects+=count
                  assert p==len(raw),'Source Layer4 was only partially decoded'
                  remaining=(folder/'post-layer4.bin').read_bytes()
                  n5=struct.unpack_from('<i',remaining,0)[0]
                  assert 0<=n5<=100000 and 4+5*n5<=len(remaining)
                  triggers=defaultdict(list)
                  for i in range(n5):
                      x,y,gid,typ=struct.unpack_from('<BBHB',remaining,4+i*5)
                      assert gid in group_members,(floor,block,gid)
                      triggers[gid].append([x,y,typ]);types[typ]+=1;sum_l5+=1
                  for gid,positions in triggers.items():
                      objects=group_members[gid]
                      obj_points={(i[0],i[1]) for i in objects}
                      overlaps=sum((x,y) in obj_points for x,y,t in positions)
                      # Exact source object (x,y,layer,indexId,tileId,UK) and selector bytes.
                      row={'floor':floor,'s32':block,'blockWorldOrigin':[world_x,world_y],
                           'layer4GroupID':gid,'objects':objects,'layer5Selectors':positions,
                           'selectorOnObjectTileCount':overlaps,
                           'attributeScope':'RAW_S32_LOCAL; effect and draw order NOT YET VERIFIED'}
                      output_files[floor].write(json.dumps(row,ensure_ascii=False,separators=(',',':'))+'\n')
                      group_statistics[floor]+=1
              assert sum_l5==39789 and sum_objects>150000
              assert group_statistics[1]==2164 and group_statistics[2]==3041
              assert types==Counter({0:39789})
          finally:
              for fp in output_files.values():fp.close()
          report={'version':'V6.3','state':'INTEGRATION_HANDOFF_NOT_APPLIED',
              'sourceRuns':{'v61':39381626131,'v62':39383241136,'v41':39100619927},
              'passabilityIsOriginalMapToolCandidate':True,
              'SanctuaryExecutableRulesVerified':False,
              'originalWallOpacityEventVerified':False,
              'R41GameplayModified':False,
              'nativeRoutes':route_reports,
              'wallLayer5SelectorRecords':sum_l5,
              'layer5GroupCountByFloor':dict(group_statistics),
              'allLayer5GroupsMatchedToLayer4':True,
              'sourceLayer4Objects':sum_objects,
              'baphometProjectionVerifiedRGSS':[156,100],
              'warnings':['4-way connectivity verified, but diagonal rules are NOT VERIFIED',
                          'Original S32 Layer5 group selector does not prove fade timing, opacity or sprite Z-order',
                          'Mapping formula alone must not replace the R41 movement engine']}
          dump(out/'handoff-manifest.json',report)
          (out/'README.txt').write_text('''V6.3 | Original Sanctuary integration inputs, not applied to Game.
          native/floor-N-4way.bin = four-direction per-original-map-coordinate passability.
          native/floor-N-index.json = source origin, byte schema, image-to-RGSS projection.
          routes/*.csv = reachable original-coordinate 4-direction paths with screen projection.
          occlusion/floor-N-source-groups.jsonl = exact Layer4 visual tile objects joined to Layer5 opacity-candidate selectors by group ID.
          Layer4 object tuple is [localX, localY, layer, indexID, tileID, unknownByte].
          Layer5 selector tuple is [rawX, rawY, type]. Preserve raw coords; do NOT confuse x/2 with exact collision geometry.
          The community MapTool four-way formula is promising but NOT verified with Sanctuary native client executable.
          DO NOT flatten wall groups into the ground, guess opacity alpha or block RGSS tiles based on this report.
          Two tests: 1F entrance to to2=551 four-way moves; 2F to1 to Baphomet=109 four-way moves.
          No changes to build-slknight-web.yml, R41 executable, portal destinations or gameplay.
          ''',encoding='utf-8')
          print('SUCCESS V6.3: corridors',[(p['name'],p['moves']) for p in route_reports],
                'layer4 Objects',sum_objects,'layer5 records',sum_l5,'groups',dict(group_statistics),flush=True)
          PY_V63
          python3 /tmp/v63_handoff.py v61 v62 v41 handoff

      - name: V6.3 Verify Game remains unchanged and integration evidence is complete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CHECK'
          import json,csv
          from pathlib import Path
          root=Path('handoff')
          r=json.loads((root/'handoff-manifest.json').read_text(encoding='utf-8'))
          assert r['state']=='INTEGRATION_HANDOFF_NOT_APPLIED'
          assert not r['R41GameplayModified']
          assert not r['SanctuaryExecutableRulesVerified']
          assert r['wallLayer5SelectorRecords']==39789
          assert r['layer5GroupCountByFloor']=={'1':2164,'2':3041}
          assert [(z['name'],z['moves']) for z in r['nativeRoutes']]==[
            ('entrance_to_2f',551),('return_stairs_to_baphomet',109)]
          assert r['baphometProjectionVerifiedRGSS']==[156,100]
          for floor in ('1','2'):
              meta=json.loads((root/f'native/floor-{floor}-index.json').read_text(encoding='utf-8'))
              assert (root/f'native/floor-{floor}-4way.bin').stat().st_size==meta['size'][0]*meta['size'][1]
              path=root/f'occlusion/floor-{floor}-source-groups.jsonl'
              with path.open(encoding='utf-8') as fp:
                  count=0
                  for line in fp:
                      rec=json.loads(line)
                      assert rec['objects'] and rec['layer5Selectors']
                      count+=1
              assert count==r['layer5GroupCountByFloor'][floor]
          print('PASS: directional binary integrity, native connectivity, all original wall selectors, no game modifications')
          PY_CHECK

      - name: V6.3 Upload complete direct-integration handoff (NO deployment)
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Map-V6.3-Native-Passage-and-Wall-Groups-Handoff
          path: handoff/
          if-no-files-found: error
          retention-days: 60
