
# FILE: .github/workflows/audit-sanctuary-monsters.yml
# V38: Five fields only. EXP-based level, Korean reference data, original Sanctuary cardinal GIFs.
name: "audit-sanctuary-monsters.yml | V38 | 61CE Physical Motion ID and Bank Review"
run-name: "audit-sanctuary-monsters.yml | V38 | Sanctuary Full Monster Data Audit / EXP 0-10"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/audit-sanctuary-monsters.yml"]

permissions:
  contents: read
  actions: read

jobs:
  original-text:
    name: "V38 | Monster name, EXP level, HP, spawn, cardinal motion"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: "V38 | Restore original Sanctuary client text"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          mkdir -p archive original reference v34 v38-output
          gh release download v1.0.0 -R "$GITHUB_REPOSITORY" --pattern 'Sanctuary.of.Aden.-.Copy.*' -D archive
          7z x archive/Sanctuary.of.Aden.-.Copy.zip \
            'Sanctuary of Aden - Copy/TW13032701.txt' \
            'Sanctuary of Aden - Copy/TW13032701.bin' \
            'Sanctuary of Aden - Copy/Text.idx' \
            'Sanctuary of Aden - Copy/Text.pak' \
            'Sanctuary of Aden - Copy/Text - Copy.pak' \
            'Sanctuary of Aden - Copy/Source.lmp' \
            'Sanctuary of Aden - Copy/Info.txt' \
            'Sanctuary of Aden - Copy/aegise*.ncl' \
            'Sanctuary of Aden - Copy/aegisp*.ncl' \
            'Sanctuary of Aden - Copy/xml/*' \
            -o./original -y
          test -s 'original/Sanctuary of Aden - Copy/TW13032701.txt'
          test -s 'original/Sanctuary of Aden - Copy/Text.idx'
          test -s 'original/Sanctuary of Aden - Copy/Text.pak'
          rm -rf archive

      - name: "V38 | Restore verified Sanctuary sprites and Korean comparison data"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 39386289505 -R "$GITHUB_REPOSITORY" \
            -n audit-sanctuary-monsters-v34-all-source-database -D v34
          test -s v34/V34-all-cardinal-gif-manifest.csv
          gh run download 39386289505 -R "$GITHUB_REPOSITORY" \
            -n audit-sanctuary-monsters-v34-all-original-cardinal-gifs -D v34-gifs
          test "$(find v34-gifs -type f -name 'V34-*-cardinal-gifs.zip' | wc -l)" -eq 17
          curl -fL --retry 4 --retry-delay 3 \
            'https://raw.githubusercontent.com/hillpath/L1J-KR_3.80/486aa43985b1383c9d402fe2f44f97e8d132ce4e/db/anfro.sql' \
            -o reference/anfro.sql
          test "$(wc -c < reference/anfro.sql)" -gt 9000000

      - name: "V38 | Build five-field audit and four-direction animations"
        run: |
          set -euo pipefail
          cat > /tmp/v38.py <<'PY'
          import csv, json, math, re, zipfile
          from collections import defaultdict
          from pathlib import Path

          OUT = Path('v38-output')
          OUT.mkdir(exist_ok=True)
          sql = Path('reference/anfro.sql').read_text('utf-8-sig')

          def parse_table(table):
              match = re.search(r'(?ms)^CREATE TABLE `' + re.escape(table) +
                  r'` \(\s*(.*?)^\)\s*ENGINE=', sql)
              if not match:
                  raise RuntimeError('Table not found: ' + table)
              fields = re.findall(r'^\s*`([^`]+)`\s+', match.group(1), re.M)
              if not fields:
                  raise RuntimeError('Table fields missing: ' + table)
              rows = []
              rx = re.compile(r'^INSERT INTO `' + re.escape(table) + r'` VALUES \((.*)\);$', re.M)
              for found in rx.finditer(sql):
                  values = next(csv.reader([found.group(1)], delimiter=',',
                      quotechar="'", escapechar='\\', skipinitialspace=True))
                  if len(values) != len(fields):
                      raise RuntimeError(f'{table}: field count {len(fields)} != {len(values)}')
                  rows.append(dict(zip(fields, values)))
              if not rows:
                  raise RuntimeError('No rows: ' + table)
              return rows

          def num(x, default=0):
              try:
                  return int(x)
              except (ValueError, TypeError):
                  return default

          def exp_level(exp):
              if exp < 1:
                  return '역산 불가 (EXP 0)'
              x = math.isqrt(exp - 1)
              if x * x == exp - 1:
                  return str(x)
              return f'약 {round(math.sqrt(exp - 1))} (EXP {exp} 불일치)'

          npc = [r for r in parse_table('npc') if r.get('impl') == 'L1Monster']
          maps = {num(r['mapid']): r['locationname']
                  for r in parse_table('mapids')}
          spawns = defaultdict(list)
          for table, id_key in [('spawnlist', 'npc_templateid'),
                                ('spawnlist_boss', 'npc_id')]:
              for r in parse_table(table):
                  if num(r.get('count')) < 1:
                      continue
                  spawns[num(r[id_key])].append(r)

          banks = defaultdict(lambda: defaultdict(dict))
          with Path('v34/V34-all-cardinal-gif-manifest.csv').open(
                  encoding='utf-8-sig', newline='') as f:
              for r in csv.DictReader(f):
                  if r['gif'] and r['byte_verified'] == 'True':
                      actor, bank, direction = (num(r[k]) for k in ('actor', 'bank', 'direction'))
                      pak = Path(r['pak']).stem
                      if direction in (1, 3, 5, 7):
                          banks[actor][(pak, bank)][direction] = r['gif']

          def best_groups(actor):
              groups = [(pak, bank, dirs) for (pak, bank), dirs in banks.get(actor, {}).items()]
              groups.sort(key=lambda x: (x[0] != 'Sprite', x[0], x[1]))
              chosen = {}
              for pak, bank, dirs in groups:
                  if bank not in chosen or len(dirs) > len(chosen[bank][1]):
                      chosen[bank] = (pak, dirs)
              return chosen

          rows = []
          low = []
          selected = {}
          for n in npc:
              npcid = num(n['npcid'])
              actor = num(n['gfxid'])
              exp = num(n['exp'])
              groups = best_groups(actor)
              complete = sum(set(dirs) == {1, 3, 5, 7} for _, dirs in groups.values())
              motion = f'원본 4방향 {complete}개 동작 묶음' if complete else '원본 4방향 미확인'
              record = {
                  '이름': f"{n['name']} (NPC {npcid})",
                  '레벨': exp_level(exp),
                  'HP': str(num(n['hp'])),
                  '스폰 지역': '',
                  '4방향 동작': motion,
              }
              places = defaultdict(list)
              for spawn in spawns.get(npcid, []):
                  mapid = num(spawn['mapid'])
                  point = f"({num(spawn['locx'])},{num(spawn['locy'])})"
                  places[(mapid, maps.get(mapid, f'맵 {mapid}'))].append(point)
              if places:
                  for (mapid, mapname), points in sorted(places.items()):
                      rows.append({**record, '스폰 지역':
                          f'{mapname} [맵 {mapid}] ' + ', '.join(points)})
              else:
                  rows.append({**record, '스폰 지역': '스폰 설정 없음'})
              if exp >= 1 and round(math.sqrt(exp - 1)) <= 10:
                  low.append({**record,
                      '스폰 지역': ', '.join(name for _, name in sorted(places)) or '스폰 설정 없음',
                      '_npc': npcid, '_actor': actor})
                  selected[actor] = groups

          fields = ['이름', '레벨', 'HP', '스폰 지역', '4방향 동작']
          with (OUT / 'V38-monsters-five-fields.csv').open(
                  'w', encoding='utf-8-sig', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              writer.writerows(rows)

          gif_root = OUT / 'gif'
          wanted = defaultdict(dict)
          for actor, groups in selected.items():
              for bank, (pak, dirs) in groups.items():
                  for direction, src in dirs.items():
                      wanted[pak][src] = (actor, bank, direction)

          extracted = set()
          for path in sorted(Path('v34-gifs').glob('V34-*-cardinal-gifs.zip')):
              pak = path.name.removeprefix('V34-').removesuffix('-cardinal-gifs.zip')
              if pak not in wanted:
                  continue
              with zipfile.ZipFile(path) as z:
                  for source, (actor, bank, direction) in wanted[pak].items():
                      if source not in z.namelist():
                          continue
                      dest = gif_root / str(actor) / f'{bank}-{direction}.gif'
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      if not dest.exists():
                          dest.write_bytes(z.read(source))
                      extracted.add((actor, bank, direction))

          data = []
          for row in low:
              actor = row.pop('_actor')
              row.pop('_npc')
              groups = selected.get(actor, {})
              row['banks'] = {}
              for bank, (_, dirs) in sorted(groups.items()):
                  row['banks'][str(bank)] = {
                      str(direction): f'gif/{actor}/{bank}-{direction}.gif'
                      for direction in dirs if (actor, bank, direction) in extracted
                  }
              data.append(row)

          payload = json.dumps(data, ensure_ascii=False).replace('<', '\\u003c')
          page = '''<!doctype html><html lang="ko"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>audit-sanctuary-monsters.yml | V38 | EXP 0-10</title>
          <style>body{font:14px system-ui,sans-serif;max-width:1100px;margin:auto;padding:12px;background:#101b2a;color:#eaf2ff}
          input,button{font:inherit;padding:9px;margin:3px;background:#243b54;color:inherit;border:1px solid #58708b;border-radius:5px}
          .scroll{overflow:auto}table{border-collapse:collapse;width:100%}th,td{padding:8px;border-bottom:1px solid #43546c;text-align:left}
          tr{cursor:pointer}tr:hover{background:#243b54}.directions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
          .directions div{text-align:center;background:#203246;padding:8px}.directions img{width:100%;height:145px;object-fit:contain;image-rendering:pixelated}
          .notice{color:#f3dcab;line-height:1.6}@media(max-width:600px){.directions img{height:90px}}</style></head>
          <body><h2>audit-sanctuary-monsters.yml | V38 | EXP 0~10</h2>
          <p class="notice">이름·EXP·HP·스폰은 한국어 L1J 3.80 외부 비교 자료입니다. 4방향 GIF만 생추어리 원본입니다.
          EXP로 레벨을 역산하며, 정규식에 맞지 않는 EXP도 목록에서 제외하지 않습니다.</p>
          <input id="search" placeholder="몬스터 이름 검색"><div class="scroll"><table><thead><tr>
          <th>이름</th><th>레벨</th><th>HP</th><th>스폰 지역</th><th>4방향 동작</th>
          </tr></thead><tbody id="items"></tbody></table></div>
          <h3 id="selected">몬스터 선택</h3><div id="tabs"></div><div id="frames" class="directions"></div>
          <script id="data" type="application/json">__DATA__</script>
          <script>(()=>{const rows=JSON.parse(document.getElementById('data').textContent);
          const el=id=>document.getElementById(id);let picked=null,bank='';
          function show(){el('tabs').replaceChildren();el('frames').replaceChildren();if(!picked)return;
          el('selected').textContent=picked['이름'];const bs=Object.keys(picked.banks);
          if(!bs.length){el('frames').textContent='원본 4방향 GIF 없음';return}
          if(!bs.includes(bank))bank=bs[0];for(const b of bs){const btn=document.createElement('button');btn.textContent='원본 동작 묶음 '+b;
          btn.onclick=()=>{bank=b;show()};el('tabs').append(btn)}
          for(const [dir,title] of [['1','↑'],['3','→'],['5','↓'],['7','←']]){const box=document.createElement('div');
          const label=document.createElement('div');label.textContent=title;box.append(label);
          const url=picked.banks[bank][dir];if(url){const img=document.createElement('img');img.src=url;box.append(img)}
          else{const msg=document.createElement('p');msg.textContent='원본 없음';box.append(msg)}el('frames').append(box)}}
          function list(){const query=el('search').value.trim().toLowerCase();el('items').replaceChildren();
          for(const row of rows.filter(r=>r['이름'].toLowerCase().includes(query))){const tr=document.createElement('tr');
          for(const key of ['이름','레벨','HP','스폰 지역','4방향 동작']){const td=document.createElement('td');td.textContent=row[key];tr.append(td)}
          tr.onclick=()=>{picked=row;bank='';show()};el('items').append(tr)}}
          el('search').oninput=list;list();if(rows.length){picked=rows[0];show()}})();</script></body></html>'''
          (OUT / 'V38-EXP-0-10.html').write_text(page.replace('__DATA__', payload), 'utf-8')
          print('V38 Korean reference monster templates:', len(npc))
          print('V38 CSV rows:', len(rows), 'EXP 0..10 view:', len(low), 'original GIFs:', len(extracted))
          PY
          python3 /tmp/v38.py

      - name: "V38 | Upload five-field source-separated results"
        uses: actions/upload-artifact@v4
        with:
          name: audit-sanctuary-monsters-v38-five-fields
          path: v38-output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
