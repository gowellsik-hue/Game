      - name: Validate generated JavaScript and files
        shell: bash
        run: |
          set -euo pipefail

          node --check reports/site/app.js
          node --check reports/sanctuary-motion-adapter.js

          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path("reports")

          required=[
              "site/index.html",
              "site/app.js",
              "site/motion-manifest.json",
              "V15-Standalone-Mobile-Sandbox.html",
              "sanctuary-motion-adapter.js",
              "motion-mapping-template.json",
              "summary_v15.json"
          ]

          for relative in required:
              path=root/relative

              if not path.is_file():
                  raise SystemExit(
                      "Missing V15 output: "+relative
                  )

              if path.stat().st_size==0:
                  raise SystemExit(
                      "Empty V15 output: "+relative
                  )

          manifest=json.loads(
              (root/"site/motion-manifest.json").read_text()
          )

          for item in manifest["entries"]:
              if not (
                  root/"site"/item["asset"]
              ).is_file():
                  raise SystemExit(
                      "Missing referenced PNG: "
                      +item["asset"]
                  )

          print(
              "V15 FILES VALIDATED:",
              len(manifest["entries"])
          )
