
name: "audit-sanctuary-monsters.yml | V31 | 61CE Physical Motion ID and Bank Review"
run-name: "audit-sanctuary-monsters.yml | V31 | Sanctuary Source 4-Dir Multi-Bank Audit"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/audit-sanctuary-monsters.yml"]

permissions:
  contents: read
  actions: read

jobs:
  v31-five-motion-review:
    name: "V31 | Verify V29 1144 GIFs and review five motions"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "V31 | Download V29 preserved original SPR bank GIFs"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full python3-pil python3-yaml
          mkdir -p v30 source/v2 paks downloads reports
          gh run download 39362135443 -R "$GITHUB_REPOSITORY" \
            -n audit-sanctuary-monsters-v30-five-motion-review-61CE -D v30
          gh run download 38784834277 -R "$GITHUB_REPOSITORY" \
            -n Sanctuary-V2-Reports -D source/v2
          git show 69d266d1a8b0d53b1bb4a8ca60b539b204f805c7:.github/workflows/audit-sanctuary-monsters.yml > source/v29.yml
          git show 5c40dc3de28ee879182c6f60802a89432072c138:.github/workflows/audit-sanctuary-monsters.yml > source/decoder.yml
          test -s v30/V30-source-review.json
          test -s source/v2/all_sprite_candidates.csv
          test -s source/v2/exported_sprite_manifest.csv
          test -s source/decoder.yml

      - name: "V31 | Restore source SPR for corrected 4 directions"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          gh release download v1.0.0 -R "$GITHUB_REPOSITORY" \
            --pattern "Sanctuary.of.Aden.-.Copy.*" -D downloads
          7z x downloads/Sanctuary.of.Aden.-.Copy.zip \
            "Sanctuary of Aden - Copy/Sprite.pak" "-o${PWD}/paks" -y > reports/spr-extract.log
          test -s "paks/Sanctuary of Aden - Copy/Sprite.pak"
          rm -rf downloads

      - name: "V31 | Source SHA verification and four-direction five-motion workstation"
        run: |
          set -euo pipefail
          cat > /tmp/v31_extract.py <<'PY'
          #!/usr/bin/env python3
          """Extract real N/E/S/W Sanctuary SPR directions; preserve game data unchanged."""
          import base64, csv, hashlib, importlib.util, io, json, re, os
          from collections import defaultdict
          from pathlib import Path
          import yaml
          from PIL import Image

          P = Path('.')
          OUT = P / 'reports'
          OUT.mkdir(exist_ok=True)
          V30 = json.loads((P/'v30/V30-source-review.json').read_text('utf-8'))
          assert len(V30['rows']) == 61 and len(V30['banks']) == 48

          # Reuse the exact V29 decoder and checksum-index parser, changing only directions.
          yml = yaml.safe_load((P/'source/v29.yml').read_text('utf-8'))
          job = next(iter(yml['jobs'].values()))
          step = next(x['run'] for x in job['steps'] if 'Inspect all source motion banks' in x.get('name',''))
          code = step.split("cat > /tmp/v29_core.py <<'PY'\n", 1)[1].split('\nPY', 1)[0]
          Path('/tmp/v29_core.py').write_text(code, 'utf-8')
          spec = importlib.util.spec_from_file_location('verified_v29', '/tmp/v29_core.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          # Cardinal directions, not the V30 diagonal directions.
          mod.DIRECTIONS = (1,3,5,7)
          actors = set(map(int,V30['banks'].keys()))
          new, logs, missing = mod.extract(actors)
          valid = [r for r in logs if 'gif_sha256' in r]
          assert len(missing) == 0, ('Missing cardinal SPR source files:', missing[:15])
          assert len(valid) == 1144, ('Cardinal decode was incomplete:',len(valid),logs[:5])
          assert all(r['dir'] in (1,3,5,7) for r in valid)

          MEDIA, ENDS = {}, {}
          for actor in sorted(actors):
              key = str(actor)
              MEDIA[key] = {}
              for bank,dirs in sorted(new[actor].items()):
                  MEDIA[key][str(bank)] = {}
                  assert set(dirs) == {1,3,5,7}
                  for direction, raw in sorted(dirs.items()):
                      gif = Image.open(io.BytesIO(raw))
                      assert gif.format == 'GIF' and gif.info.get('loop') == 0
                      MEDIA[key][str(bank)][str(direction)] = [
                          base64.b64encode(raw).decode('ascii'),gif.n_frames
                      ]
                      path=OUT/'gifs'/key
                      path.mkdir(parents=True,exist_ok=True)
                      (path/f'{actor}-bank{bank}-dir{direction}.gif').write_bytes(raw)

              # V30 review proposals only; never automatically approved or applied.
              guess={'wait':8,'walk':0,'attack':16,'hit':32,'death':40}
              override={
                 29:(32,0,8,16,24),49:(32,0,8,16,24),
                 52:(32,0,8,16,24),56:(32,0,8,16,24),
                 95:(32,0,8,16,24),145:(8,0,16,32,24),
                 152:(0,8,16,40,48),894:(0,8,16,32,40),
                 1024:(8,0,16,32,56),
                 1037:(8,0,16,24,32),1039:(8,0,16,24,32),
                 1108:(24,0,8,32,40),1202:(24,0,16,32,40),
                 1390:(8,0,16,24,32),2064:(24,0,16,32,40),
                 4005:(0,8,16,24,32),5317:(0,8,16,40,48)
              }
              if actor in override:
                  guess=dict(zip(('wait','walk','attack','hit','death'),override[actor]))
              for role,bank in list(guess.items()):
                  if bank not in new[actor]:
                      guess[role]=sorted(new[actor])[0]

              ENDS[key] = {'roles':guess,'death':{}}
              for direction in (1,3,5,7):
                  raw = new[actor][guess['death']][direction]
                  with Image.open(io.BytesIO(raw)) as im:
                      im.seek(im.n_frames-1)
                      final=io.BytesIO()
                      im.convert('RGBA').save(final,format='PNG')
                      ENDS[key]['death'][str(direction)]=base64.b64encode(
                          final.getvalue()).decode('ascii')

          # Previous game comparison: front=0, left=1, right=2, rear=3.
          LEGACY = {}
          for row in V30['rows']:
              LEGACY[str(row['ce'])] = {}
              for dst,orig in {'1':'3','3':'2','5':'0','7':'1'}.items():
                  f = row['originals'].get(orig)
                  if f:
                      LEGACY[str(row['ce'])][dst]=base64.b64encode(
                          (P/'v30'/f).read_bytes()).decode('ascii')

          body={
              'version':'V31',
              'source_run':os.environ.get('GITHUB_RUN_ID','local'),
              'based_on_v30_run':39362135443,
              'source_hashes_verified':1144,
              'rows':[
                  {k:r[k] for k in (
                      'ce','name','actor','candidates','protected','game_graphic'
                  )} for r in V30['rows']
              ],
              'media':MEDIA,
              'defaults':ENDS,
              'legacy':LEGACY,
              'cardinal':{'up':1,'right':3,'down':5,'left':7},
              'review_only':True,
              'game_modified':False,
              'approval_changed':False
          }

          TEMPLATE = r'''<!doctype html><html lang="ko">
          <head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>audit-sanctuary-monsters.yml | V31 | 61CE Physical Motion ID and Bank Review</title>
          <style>
          :root{font:15px system-ui,'Malgun Gothic',sans-serif;background:#101a27;color:#e9f2ff}
          *{box-sizing:border-box}
          body{max-width:1250px;margin:auto;padding:12px}
          h1{font-size:1.28rem}h2{font-size:1.03rem}h3{font-size:.95rem;margin:0}
          p{line-height:1.55}
          small,.muted{color:#aac0d4}
          header,.panel{background:#18293c;border:1px solid #40576e;border-radius:8px;padding:12px;margin:10px 0}
          .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
          .bar>*{flex:1 1 180px}
          select,button{font:inherit;border:1px solid #637b95;border-radius:6px;padding:8px;background:#2b435b;color:#f0f7ff;cursor:pointer}
          select{width:100%}
          .arena{position:relative;height:235px;background:linear-gradient(#1d3648,#0e1b2a);overflow:hidden;border-radius:8px;border:1px solid #53748c}
          .arena img{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);height:150px;width:180px;object-fit:contain;image-rendering:pixelated}
          .arena p{position:absolute;bottom:4px;left:10px;margin:0;font-size:.8rem;color:#b1c5df}
          .pad{display:grid;grid-template-columns:repeat(3,55px);gap:5px;justify-content:center;user-select:none;touch-action:none}
          .pad button{height:46px}
          .buttons{display:flex;gap:6px;flex-wrap:wrap}
          .buttons button{flex:1 1 85px}
          .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
          .tile{min-width:0;background:#0e1c2b;border:1px solid #31495e;padding:5px;text-align:center;border-radius:5px}
          .tile img{width:100%;height:93px;object-fit:contain;image-rendering:pixelated}
          .tile div{font-size:.78rem;color:#d6e8ff}
          .motion{padding:10px 0;border-top:1px solid #31495e}
          .head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
          .head select{width:auto}
          @media(max-width:550px){
            .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
            .tile img{height:75px}
            .bar>*{flex:1 1 120px}
          }
          </style></head><body>
          <header>
          <h1>audit-sanctuary-monsters.yml | V31 | 생추어리 원본 4방향·5동작</h1>
          <p>이번 추출은 <b>↑ 원본1 · → 원본3 · ↓ 원본5 · ← 원본7</b>입니다.
          기존 대각선 0·2·4·6은 사용하지 않습니다.
          동작 뱅크 연결은 검토안이며 게임에 적용하지 않았습니다.</p>
          <div class="bar">
          <label>몬스터 <select id="monster"></select></label>
          <label>원본 SPR <select id="sprite"></select></label>
          </div>
          <p id="identity" class="muted"></p></header>

          <section class="panel">
          <h2>실제 움직임 테스트 — 위·오른쪽·아래·왼쪽</h2>
          <div class="arena">
            <img id="hero" alt="움직이는 몬스터">
            <p id="coord">위치 50%, 50%</p>
          </div>
          <div class="bar" style="margin-top:9px">
          <div class="pad">
            <span></span><button data-dir="1">↑</button><span></span>
            <button data-dir="7">←</button><button id="stop">■</button><button data-dir="3">→</button>
            <span></span><button data-dir="5">↓</button><span></span>
          </div>
          <div class="buttons">
            <button data-action="wait">정지</button>
            <button data-action="walk">걷기</button>
            <button data-action="attack">공격</button>
            <button data-action="hit">피격</button>
            <button data-action="death">사망</button>
          </div></div>
          <p id="state" class="muted">대기</p></section>

          <section class="panel">
          <h2>5동작 × 4방향 원본 GIF 동시 재생</h2>
          <div id="motions"></div></section>

          <section class="panel">
          <h2>원본 전체 뱅크 비교</h2>
          <label>뱅크 <select id="bank"></select></label>
          <div class="grid" id="raw"></div></section>

          <section class="panel">
          <h2>기존 싱글리니지 그래픽 참고</h2>
          <div class="grid" id="legacy"></div>
          <p class="muted">기존 게임 이미지는 생추어리 추출로 대체하지 않았습니다.</p>
          </section>

          <script id="dataset" type="application/json">__DATA__</script>
          <script>
          (()=>{'use strict';
          const D=JSON.parse(document.getElementById('dataset').textContent),
                $=id=>document.getElementById(id);
          const DIR=[['1','↑ 위'],['3','→ 오른쪽'],['5','↓ 아래'],['7','← 왼쪽']];
          const ACT=[
            ['wait','정지'],['walk','걷기'],['attack','공격'],
            ['hit','피격'],['death','사망']
          ];
          let S={
            ce:'916',actor:'152',dir:'5',action:'wait',
            x:50,y:50,move:null,last:0,serial:0,timer:null
          },choice={};

          const asset=(a,b,d)=>D.media[a]?.[String(b)]?.[String(d)]||null;
          const def=a=>D.defaults[a]?.roles||{};
          const bank=a=>choice[a]??def(S.actor)[a]??Object.keys(D.media[S.actor]||{})[0];
          const stopTimer=()=>{
            S.serial++;
            if(S.timer){clearTimeout(S.timer);S.timer=null}
          };

          function tile(target,fn){
            target.replaceChildren();
            for(const [dir,label] of DIR){
              let node=document.createElement('div');
              node.className='tile';
              let head=document.createElement('div');
              head.textContent=label;
              node.append(head);
              let item=fn(dir);
              if(item){
                let img=document.createElement('img');
                img.loading='lazy';
                img.src='data:image/gif;base64,'+item[0];
                node.append(img);
                let footer=document.createElement('div');
                footer.textContent=item[1]+'프레임';
                node.append(footer);
              }else{
                node.append('원본 없음');
              }
              target.append(node);
            }
          }

          function hero(action,automatic=false){
            stopTimer();
            S.action=action;
            let b=bank(action),
                rec=asset(S.actor,b,S.dir),
                im=$('hero');

            if(rec){
              im.style.display='block';
              im.src='data:image/gif;base64,'+rec[0];
            }else{
              im.removeAttribute('src');
              im.style.display='none';
            }

            $('state').textContent=
              (ACT.find(a=>a[0]===action)||[])[1]+
              ' / '+DIR.find(a=>a[0]===S.dir)[1]+
              ' / SPR '+S.actor+' / 뱅크 '+b;

            if((action==='attack'||action==='hit')&&rec&&!automatic){
              let n=S.serial;
              S.timer=setTimeout(()=>{
                if(S.serial===n)hero('wait');
              },Math.max(350,rec[1]*150));
            }

            if(action==='death'&&rec){
              let n=S.serial;
              S.timer=setTimeout(()=>{
                if(S.serial!==n)return;
                let p=D.defaults[S.actor]?.death?.[S.dir];
                if(p&&Number(b)===Number(def(S.actor).death)){
                  im.src='data:image/png;base64,'+p;
                }
              },Math.max(300,rec[1]*150));
            }
          }

          function stagePos(){
            let im=$('hero');
            im.style.left=S.x+'%';
            im.style.top=S.y+'%';
            $('coord').textContent=
              '위치 '+Math.round(S.x)+'%, '+Math.round(S.y)+'%';
          }

          function down(d){
            if(!D.media[S.actor])return;
            S.dir=d;
            S.move=d;
            hero('walk',true);
          }
          function up(){
            if(!S.move)return;
            S.move=null;
            hero('wait');
          }

          function motions(){
            let root=$('motions');
            root.replaceChildren();
            for(const [a,label] of ACT){
              let row=document.createElement('section');
              row.className='motion';
              let head=document.createElement('div');
              head.className='head';
              let t=document.createElement('h3');
              t.textContent=label+' · '+a;
              head.append(t);

              let sel=document.createElement('select');
              for(const b of Object.keys(D.media[S.actor]||{})
                    .sort((a,b)=>Number(a)-Number(b))){
                sel.add(new Option('뱅크 '+b,b));
              }
              sel.value=String(bank(a));
              sel.onchange=()=>{
                choice[a]=Number(sel.value);
                show();
              };
              head.append(sel);
              row.append(head);

              let g=document.createElement('div');
              g.className='grid';
              tile(g,d=>asset(S.actor,bank(a),d));
              row.append(g);
              root.append(row);
            }
          }

          function show(){
            motions();
            let bb=Object.keys(D.media[S.actor]||{})
              .sort((a,b)=>Number(a)-Number(b));

            $('bank').replaceChildren();
            for(const b of bb){
              $('bank').add(new Option('원본 '+b,b));
            }
            $('bank').onchange=()=>{
              tile($('raw'),d=>asset(S.actor,$('bank').value,d));
            };
            if(bb.length){
              $('bank').value=bb.includes('16')?'16':bb[0];
              $('bank').onchange();
            }else{
              $('raw').replaceChildren();
            }

            tile($('legacy'),d=>D.legacy[S.ce]?.[d]
              ?[D.legacy[S.ce][d],'기존']:null);
            S.x=50;
            S.y=50;
            S.move=null;
            stagePos();
            hero('wait');

            let r=D.rows.find(x=>String(x.ce)===S.ce);
            $('identity').textContent=
              'CE '+S.ce+' '+(r?.name||'')+
              ' / SPR '+(S.actor||'미확정')+
              (r?.protected?' / 기존 성공본 보호':' / 검토안·미적용');
          }

          for(const r of D.rows){
            $('monster').add(new Option(
              'CE '+r.ce+' · '+r.name+(r.protected?' [보호]':''),
              r.ce
            ));
          }
          for(const a of Object.keys(D.media)
              .sort((a,b)=>Number(a)-Number(b))){
            $('sprite').add(new Option('SPR '+a,a));
          }

          $('monster').value=S.ce;
          $('sprite').value=S.actor;

          $('monster').onchange=()=>{
            S.ce=$('monster').value;
            let r=D.rows.find(x=>String(x.ce)===S.ce);
            S.actor=String(r?.actor??'');
            choice={};
            $('sprite').value=S.actor;
            show();
          };

          $('sprite').onchange=()=>{
            S.actor=$('sprite').value;
            choice={};
            show();
          };

          document.querySelectorAll('[data-action]').forEach(b=>{
            b.onclick=()=>{
              S.move=null;
              hero(b.dataset.action);
            };
          });

          document.querySelectorAll('[data-dir]').forEach(b=>{
            b.addEventListener('pointerdown',e=>{
              e.preventDefault();
              b.setPointerCapture?.(e.pointerId);
              down(b.dataset.dir);
            });
            b.addEventListener('pointerup',up);
            b.addEventListener('lostpointercapture',up);
            b.addEventListener('pointercancel',up);
          });

          $('stop').onclick=()=>{
            S.move=null;
            hero('wait');
          };

          const KEYS={
            ArrowUp:'1',ArrowRight:'3',
            ArrowDown:'5',ArrowLeft:'7',
            KeyW:'1',KeyD:'3',KeyS:'5',KeyA:'7'
          };

          window.addEventListener('keydown',e=>{
            if(e.target.closest?.('input,select,textarea'))return;
            let d=KEYS[e.code];
            if(d){
              e.preventDefault();
              if(S.move!==d)down(d);
            }
          });
          window.addEventListener('keyup',e=>{
            if(KEYS[e.code]){
              e.preventDefault();
              up();
            }
          });
          window.addEventListener('blur',up);

          function tick(t){
            let dt=S.last?Math.min(.07,(t-S.last)/1000):0;
            S.last=t;
            if(S.move){
              let v={
                '1':[0,-1],'3':[1,0],
                '5':[0,1],'7':[-1,0]
              }[S.move];
              S.x=Math.min(90,Math.max(10,S.x+dt*v[0]*23));
              S.y=Math.min(87,Math.max(13,S.y+dt*v[1]*23));
              stagePos();
            }
            requestAnimationFrame(tick);
          }

          show();
          requestAnimationFrame(tick);
          window.__V31_QA={
            state:()=>({...S}),
            source:()=>Object.values(D.media).reduce(
              (a,b)=>a+Object.values(b).reduce(
                (c,d)=>c+Object.keys(d).length,0
              ),0
            ),
            roles:()=>document.querySelectorAll('.motion').length
          };
          })()
          </script></body></html>'''

          serialized=json.dumps(
              body,ensure_ascii=False,separators=(',',':')
          ).replace('<','\\u003c')
          html=TEMPLATE.replace('__DATA__',serialized)
          assert len(html.encode('utf-8'))>1000000

          (OUT/'audit-sanctuary-monsters-V31-cardinal-4direction-5motion.html').write_text(
              html,'utf-8'
          )

          summary={
              'version':'V31',
              'source_spr':48,
              'ce':61,
              'cardinal_gifs':len(valid),
              'directions':[1,3,5,7],
              'source_verified':True,
              'game_modified':False,
              'motion_approved':False
          }
          (OUT/'V31-summary.json').write_text(
              json.dumps(summary,ensure_ascii=False,indent=2),'utf-8'
          )

          with (OUT/'V31-cardinal-manifest.csv').open(
              'w',encoding='utf-8-sig',newline=''
          ) as f:
              w=csv.writer(f)
              w.writerow(['SPR','bank','direction','frames','sha256'])
              for x in valid:
                  w.writerow([
                      x['actor'],x['bank'],x['dir'],
                      x['frames'],x['gif_sha256']
                  ])

          print('V31_EXTRACTED',json.dumps(summary,ensure_ascii=False))
          PY
          python3 /tmp/v31_extract.py

      - name: "V31 | Validate classification interface, exact source counts and read-only output"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          p=Path('reports')
          s=json.loads((p/'V31-summary.json').read_text('utf-8'))
          assert s['version']=='V31' and s['ce']==61 and s['source_spr']==48
          assert s['cardinal_gifs']==1144 and s['directions']==[1,3,5,7]
          assert s['source_verified'] and not s['game_modified'] and not s['motion_approved']
          files=list((p/'gifs').rglob('*.gif'))
          assert len(files)==1144
          assert {int(f.stem.rsplit('dir',1)[1]) for f in files}=={1,3,5,7}
          html=p/'audit-sanctuary-monsters-V31-cardinal-4direction-5motion.html'
          h=html.read_text('utf-8')
          assert len(h.encode())>1000000
