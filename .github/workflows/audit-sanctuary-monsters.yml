          cat > /tmp/v35_html.py <<'V35_PYHTML'
          #!/usr/bin/env python3
          # V35: portable 0-10 HTML from L1J reference EXP, with real Sanctuary SPR raw banks.
          import base64,csv,html,io,json,re,zipfile,collections
          from pathlib import Path
          ROOT=Path('.')
          REPORT=ROOT/'v35-output';PACKAGES=ROOT/'v34-gifs'

          def csvrows(name):
           with (REPORT/name).open(encoding='utf-8-sig',newline='') as f:return list(csv.DictReader(f))

          def base64_gifs(actors):
           res=collections.defaultdict(lambda:collections.defaultdict(dict))
           origins=collections.defaultdict(set)
           skipped=[]; indexed=0; loaded=0
           zips=sorted(PACKAGES.glob('*.zip'),key=lambda f:(f.name!='V34-Sprite-cardinal-gifs.zip',f.name))
           if len(zips)!=17:raise ValueError(('expected original 17 PAK zipped GIF archives',len(zips)))
           # Give original Sprite.pak priority, but do not assert which PAK the running client uses.
           for zpath in zips:
            pack=zpath.name[len('V34-'):-len('-cardinal-gifs.zip')]
            with zipfile.ZipFile(zpath) as z:
             for name in z.namelist():
              m=re.search(r'/(\d+)/(\d+)-bank(\d+)-dir([1357])\.gif$',name)
              if not m:continue
              actor=int(m[1]); a2=int(m[2]); bank=int(m[3]); direction=int(m[4])
              if actor not in actors or actor!=a2:continue
              indexed+=1;origins[str(actor)].add(pack)
              a=res[str(actor)][str(bank)]
              if str(direction) in a:continue
              raw=z.read(name)
              if len(raw)>2_000_000:
               skipped.append({'actor':actor,'bank':bank,'direction':direction,'reason':'GIF larger than 2 MB','source_pak':pack})
               continue
              a[str(direction)]=base64.b64encode(raw).decode('ascii')
              loaded+=1
           # Drop empty actor banks.
           return {k:dict(v) for k,v in res.items()},dict(origins),{'references':indexed,'embedded_gifs':loaded,'skipped_too_large':skipped,'priority':'Sprite then Sprite00..15; original runtime priority UNVERIFIED'}

          def main():
           r=csvrows('V35-reference-0-10-by-exp.csv')
           low_ids={int(x['npcid']) for x in r}
           all_spawns=[x for x in csvrows('V35-reference-ALL-spawn-linked.csv') if x.get('npcid') and int(x['npcid']) in low_ids]
           by_spawn=collections.defaultdict(list)
           for x in all_spawns:by_spawn[str(x['npcid'])].append(x)
           allnames=set(); actors=set()
           for row in r:
            if str(row.get('has_cardinal_source_spr','')).lower()=='true':actors.add(int(row['gfxid']))
           graphics,origin,meta=base64_gifs(actors)
           for r0 in r:
            r0['gfx_asset_origin']=' | '.join(sorted(origin.get(str(r0['gfxid']),[])))
            r0['asset_available']=str(r0['gfxid']) in graphics
           summary=json.loads((REPORT/'V35-full-data-summary.json').read_text('utf-8'))
           payload=json.dumps({'summary':summary,'rows':r,'spawns':dict(by_spawn),'sprites':graphics,'media_meta':meta},ensure_ascii=False,separators=(',',':')).replace('<','\\u003c')
           out=REPORT/'audit-sanctuary-monsters-V35-EXP-0-10-reference.html'
           source='''<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>audit-sanctuary-monsters.yml | V35 | EXP 0~10 · Reference</title>
           <style>:root{color-scheme:dark;font:14px system-ui,'Malgun Gothic',sans-serif;background:#0b1421;color:#ebf3ff}*{box-sizing:border-box}body{max-width:1350px;margin:0 auto;padding:14px}.panel{border:1px solid #405775;background:#152638;border-radius:9px;padding:14px;margin:8px 0}h1{font-size:1.22rem;margin:0 0 10px}h2{font-size:1.06rem}.muted{color:#9db4cb}p{line-height:1.6}.tool{display:flex;gap:9px;flex-wrap:wrap}.tool>*{flex:1 1 210px}select,input,button{padding:10px;background:#1c344a;color:#e8f3ff;border:1px solid #536a84;border-radius:5px;font:inherit}button{cursor:pointer}.counts{display:flex;gap:10px;flex-wrap:wrap}.counts span{padding:8px 11px;background:#1c344a;border-radius:6px}.scroll{overflow:auto;max-height:390px}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{padding:7px;border-bottom:1px solid #334861;text-align:left}tr{cursor:pointer}tr.sel{background:#1d4a61}tr:hover{background:#18354d}.big{font-size:1.03rem;font-weight:650}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.stat{background:#0d1b2b;padding:8px;border-radius:5px;min-width:0}.stat small{display:block;color:#a6bfd7}.stat strong{overflow-wrap:anywhere}.frames{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.frame{text-align:center;background:#0c1b2c;border:1px solid #2e4560;border-radius:6px;padding:8px}.frame img{max-width:100%;height:135px;object-fit:contain;image-rendering:pixelated}.main{display:flex;align-items:center;justify-content:center;height:190px;border-radius:6px;background:#0a1a2b}.main img{max-width:90%;max-height:180px;image-rendering:pixelated}.directions,.rawbanks{display:flex;gap:8px;flex-wrap:wrap}.rawbanks button.active{border-color:#a0dbdf;background:#1c536b}.note{padding:8px 10px;border-left:3px solid #dabd74;background:#36302a}.badge{font-size:11px;color:#b4d9e6}.warnings{color:#ecd6a6}@media(max-width:650px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.frame img{height:92px}.tool>*{flex:1 1 130px}.panel{padding:10px}}</style>
           </head><body><header class="panel"><h1>audit-sanctuary-monsters.yml | V35 | EXP 역산 0~10레벨 전체 목록</h1>
           <p class="note">이 표의 <b>레벨·HP·EXP·속도·아데나·스폰 위치는 외부 L1J 3.80c 서버 참조값</b>입니다. 생추어리 원본에서 확인한 것은 동일 숫자의 SPR ID와 이미지뿐입니다. 따라서 숫자 일치가 해당 몬스터의 신원 또는 생추어리 실제 서버 능력치를 증명하지 않습니다.</p>
           <div class="counts" id="counts"></div><p class="muted">EXP가 1 이상이고 EXP−1이 완전제곱수인 개체만 레벨을 확정 역산했습니다. 불일치 및 EXP=0은 별도 예외 CSV에 보존합니다. NPC ID 개수와 종류(이름·SPR), 실제 소환 수를 분리 표시합니다.</p>
