
name: "audit-sanctuary-monsters.yml | V25 | 492EV Original SPR Five Motions"
run-name: "audit-sanctuary-monsters.yml | V25 | Full Motion Extraction"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-sanctuary-monsters.yml"

permissions:
  contents: read
  actions: read

jobs:
  extract:
    name: "V25 | Extract Wait Walk Attack Hit Death"
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: "V25 | Checkout previous verified source"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "V25 | Restore 492 monster event inventory"
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39097070350
          name: SLKnight-V23-492EV-Motion-Audit
          github-token: ${{ github.token }}
          path: previous/v23

      - name: "V25 | Prepare original sprite sources"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc || true

          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            p7zip-full \
            python3-pil

          python3 -m pip install \
            --break-system-packages -q \
            'PyYAML==6.0.2'

          mkdir -p \
            previous/v2 \
            previous/v12 \
            reports \
            downloads \
            original-paks

          gh run download 38784834277 \
            -R "$GITHUB_REPOSITORY" \
            -n Sanctuary-V2-Reports \
            -D previous/v2

          gh run download 38872552732 \
            -R "$GITHUB_REPOSITORY" \
            -n Sanctuary-V12-External-Action-and-NPC-Crosscheck \
            -D previous/v12

          git show \
            5c40dc3de28ee879182c6f60802a89432072c138:.github/workflows/audit-sanctuary-monsters.yml \
            > reports/verified-v17-source.yml

          test -s previous/v23/events.json
          test -s previous/v23/SLKnight-492-Motion-Integrated.html
          test -s reports/verified-v17-source.yml

      - name: "V25 | Match 83 graphics with original SPR identifiers"
        run: |
          set -euo pipefail

          cat > /tmp/v25_select.py <<'PY'
          import csv
          import json
          import re
          import unicodedata

          from pathlib import Path
          from collections import defaultdict

          OUT=Path("reports")

          def load(root,name):
              files=list(Path(root).rglob(name))

              if len(files)!=1:
                  raise RuntimeError(
                      f"Source missing or ambiguous: {name}"
                  )

              with files[0].open(
                  encoding="utf-8-sig",
                  newline=""
              ) as f:
                  return list(csv.DictReader(f))

          def norm(value):
              return unicodedata.normalize(
                  "NFKC",str(value)
              ).lower().replace(
                  " ",""
              ).replace(
                  "ー",""
              ).replace(
                  "・",""
              )

          html=Path(
              "previous/v23/SLKnight-492-Motion-Integrated.html"
          ).read_text(encoding="utf-8")

          found=re.search(
              r'<script id="data" type="application/json">(.*?)</script>',
              html,re.S
          )

          if not found:
              raise RuntimeError("V23 database missing")

          database=json.loads(found.group(1))
          events=database["rows"]
          assets=database["assets"]

          assert len(events)==492
          assert len(assets)==83

          sprites=load(
              "previous/v2",
              "all_sprite_candidates.csv"
          )

          hashes=load(
              "previous/v2",
              "exported_sprite_manifest.csv"
          )

          npcs=load(
              "previous/v12",
              "03_external_npc_gfx_candidates.csv"
          )

          signatures={
              (
                  row["pak"],
                  row["sprite_file"].lower(),
                  int(row["bytes"])
              ):row["sha256"]
              for row in hashes
          }

          pattern=re.compile(
              r"^(\d+)-(\d+)\.spr$",re.I
          )

          records=defaultdict(dict)
          banks=defaultdict(
              lambda:defaultdict(set)
          )

          for row in sprites:
              filename=Path(
                  row["file"].replace("\\","/")
              ).name

              match=pattern.fullmatch(filename)

              if not match:
                  continue

              if not Path(
                  row["pak"]
              ).name.lower().startswith("sprite"):
                  continue

              actor,sub=map(int,match.groups())
              length=int(row["bytes"])

              sha=signatures.get((
                  row["pak"],
                  filename.lower(),
                  length
              ))

              if actor<=0 or not sha:
                  continue

              key=(actor,row["pak"])

              banks[key][sub//8*8].add(sub)

              rec={
                  "offset":int(row["offset"]),
                  "bytes":length,
                  "sha256":sha
              }

              old=records[key].get(sub)

              if old is None or rec["offset"]<old["offset"]:
                  records[key][sub]=rec

          npc_names=defaultdict(set)

          for row in npcs:
              try:
                  actor=int(row["gfx_id"])
              except (ValueError,KeyError):
                  continue

              if actor<=0:
                  continue

              if "monster" not in row.get(
                  "implementation",""
              ).lower():
                  continue

              name=row.get("npc_name","").strip()

              if name:
                  npc_names[actor].add(name)

          # Name matches are lookup candidates only.
          # They are not proof of identical sprites.
          aliases={
              "오크 전사":["オークファイター","オーク戦士"],
              "오크 마법사":["オークウィザード","オークメイジ"],
              "오크":["オーク","妖魔"],
              "킹 버그베어":["キングバグベア"],
              "버그베어":["バグベア","バグベアー"],
              "켈베로스":["ケルベロス"],
              "해골":["スケルトン"],
              "좀비":["ゾンビ"],
              "데스나이트":["デスナイト"],
              "흑기사":["ブラックナイト","黒騎士"],
              "드레이크":["ドレイク"],
              "리자드맨":["リザードマン"],
              "에틴":["エティン"],
              "트롤":["トロール"],
              "오우거":["オーガ"],
              "파이어 에그":["ファイアーエッグ"],
              "아시타지오":["アシタジオ"],
              "이프리트":["イフリート"],
              "사라만다":["サラマンダー"],
              "라바 골렘":["ラヴァゴーレム","ラバゴーレム"],
              "사이클롭스":["サイクロプス"],
              "미노타우르스":["ミノタウルス"],
              "바실리스크":["バシリスク"],
              "키메라":["キメラ"],
              "하피":["ハーピー"],
              "라이칸스로프":["ライカンスロープ"],
              "라미아":["ラミア"],
              "셸로브":["シェロブ"],
              "놀":["ノール"],
              "구울":["グール"],
              "스파토이":["スパルトイ"],
              "서큐버스":["サキュバス"],
              "코카트리스":["コカトリス"],
              "거대 개미":["ジャイアントアント"],
              "여왕 개미":["クイーンアント"],
              "스콜피온":["スコーピオン"],
              "전갈":["スコーピオン"],
              "아이스 골렘":["アイスゴーレム"],
              "가디언 아머":["ガーディアンアーマー"],
              "예티":["イエティ"],
              "나이트메어":["ナイトメア"],
              "비홀더":["ビホルダー"],
              "터틀 드래곤":["タートルドラゴン"],
              "스핑크스":["スフィンクス"],
              "아이언 골렘":["アイアンゴーレム"],
              "골렘":["ゴーレム"],
              "바포메트":["バフォメット"],
              "흑장로":["ブラックエルダー"],
              "그림리퍼":["グリムリーパー"],
              "기르타스":["ギルタス"],
              "무리안":["ムリアン"],
              "정령":["エレメンタル"],
              "거북":["タートル"],
              "갑충":["ビートル"],
              "전사":["ウォーリア"],
              "고스트":["ゴースト"],
              "본 드래곤":["ボーンドラゴン"],
              "레서 드래곤":["レッサードラゴン"],
              "눈사람":["スノーマン"],
              "커츠":["カーツ"],
              "나이트발드":["ナイトバルド"],
              "파우스트":["ファウスト"],
              "메두사":["メデューサ"],
              "아이스맨":["アイスマン"]
          }

          members=defaultdict(set)

          for event in events:
              members[
                  event["primary_asset"]
              ].add(event["monster"])

          selected={}
          needed={}

          for digest,asset in assets.items():
              names=sorted(members[digest])
              hints=[]

              for monster in names:
                  for korean,japanese in sorted(
                      aliases.items(),
                      key=lambda item:-len(item[0])
                  ):
                      if korean.replace(" ","") in monster.replace(" ",""):
                          hints.extend(map(norm,japanese))
                          break

              candidates=[]

              for key,subs in records.items():
                  actor,pak=key

                  if actor not in npc_names:
                      continue

                  full=sum(
                      len(items)==8
                      for items in banks[key].values()
                  )

                  if full<3:
                      continue

                  score=0

                  for candidate in npc_names[actor]:
                      value=norm(candidate)

                      for hint in hints:
                          if hint==value:
                              score=max(
                                  score,100+len(hint)
                              )
                          elif (
                              len(hint)>=4
                              and hint in value
                          ):
                              score=max(
                                  score,70+len(hint)
                              )

                  if score:
                      candidates.append((
                          score,full,len(subs),actor,pak
                      ))

              candidates.sort(reverse=True)

              if candidates:
                  score,full,count,actor,pak=candidates[0]

                  selected[digest]={
                      "monsters":names,
                      "graphics":asset["source_files"],
                      "sprite_id":actor,
                      "pak":pak,
                      "candidate_score":score,
                      "source_names":sorted(npc_names[actor]),
                      "identity_verified":False,
                      "candidate_count":len(candidates)
                  }

                  key=(actor,pak)

                  needed[f"{actor}|{pak}"]={
                      "sprite_id":actor,
                      "pak":pak,
                      "records":{
                          str(sub):record
                          for sub,record in records[key].items()
                          if 0<=sub<40
                      }
                  }
              else:
                  selected[digest]={
                      "monsters":names,
                      "graphics":asset["source_files"],
                      "sprite_id":None,
                      "pak":None,
                      "candidate_score":0,
                      "source_names":[],
                      "identity_verified":False,
                      "candidate_count":0
                  }

          packages=sorted({
              item["pak"].removeprefix("outer/")
              for item in needed.values()
          })

          if not packages:
              raise RuntimeError(
                  "No original SPR candidates matched"
              )

          (OUT/"V25-selected.json").write_text(
              json.dumps(
                  selected,ensure_ascii=False,indent=2
              ),
              encoding="utf-8"
          )

          (OUT/"V25-records.json").write_text(
              json.dumps(
                  needed,ensure_ascii=False
              ),
              encoding="utf-8"
          )

          (OUT/"V25-packages.json").write_text(
              json.dumps(
                  packages,ensure_ascii=False
              ),
              encoding="utf-8"
          )

          print("V25_EVENTS",len(events))
          print("V25_GRAPHICS",len(assets))
          print(
              "V25_SOURCE_CANDIDATES",
              sum(
                  x["sprite_id"] is not None
                  for x in selected.values()
              )
          )
          print("V25_SPR_ACTORS",len(needed))
          PY

          python3 /tmp/v25_select.py

      - name: "V25 | Extract original sprite PAK archives"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release download v1.0.0 \
            -R "$GITHUB_REPOSITORY" \
            --pattern "Sanctuary.of.Aden.-.Copy.*" \
            -D downloads

          test -s downloads/Sanctuary.of.Aden.-.Copy.zip

          python3 - <<'PY'
          import json
          import subprocess

          from pathlib import Path

          packages=json.loads(
              Path("reports/V25-packages.json").read_text()
          )

          target=Path("original-paks").absolute()
          target.mkdir(parents=True,exist_ok=True)

          with Path(
              "reports/V25-archive-extraction.log"
          ).open("w") as log:
              subprocess.run(
                  [
                      "7z","x",
                      "downloads/Sanctuary.of.Aden.-.Copy.zip",
                      "-o"+str(target),
                      "-y",
                      *packages
                  ],
                  stdout=log,
                  stderr=subprocess.STDOUT,
                  check=True
              )

          for package in packages:
              if not (target/package).is_file():
                  raise RuntimeError(
                      "Original PAK not found: "+package
                  )

          print("V25_EXTRACTED_PACKAGES",len(packages))
          PY

          rm -rf downloads

      - name: "V25 | Decode original SPR five motion banks"
        run: |
          set -euo pipefail

          cat > /tmp/v25_build.py <<'PY'
          import ast
          import base64
          import csv
          import hashlib
          import json
          import re
          import struct

          from pathlib import Path
          from io import BytesIO

          import yaml
          from PIL import Image

          OUT=Path("reports")

          html=Path(
              "previous/v23/SLKnight-492-Motion-Integrated.html"
          ).read_text(encoding="utf-8")

          match=re.search(
              r'<script id="data" type="application/json">(.*?)</script>',
              html,re.S
          )

          if not match:
              raise RuntimeError(
                  "V23 monster database missing"
              )

          database=json.loads(match.group(1))
          events=database["rows"]
          assets=database["assets"]

          assert len(events)==492
          assert len(assets)==83

          selected=json.loads(
              (OUT/"V25-selected.json").read_text()
          )

          records=json.loads(
              (OUT/"V25-records.json").read_text()
          )

          # Recover the Reader class from the successful V17
          # workflow instead of inventing a new SPR format.
          original_workflow=yaml.safe_load(
              (OUT/"verified-v17-source.yml").read_text()
          )

          steps=original_workflow["jobs"]["identify"]["steps"]

          original_step=next(
              step for step in steps
              if step["name"]==
              "Decode all selected monster animation frames"
          )

          source=original_step["run"].split(
              "python3 - <<'PY'\n",1
          )[1].split("\nPY",1)[0]

          tree=ast.parse(source)

          reader_node=next(
              node for node in tree.body
              if isinstance(node,ast.ClassDef)
              and node.name=="Reader"
          )

          namespace={
              "struct":struct,
              "Image":Image,
              "MAX_FRAMES":240,
              "MAX_DIM":1000
          }

          exec(
              compile(
                  ast.Module(
                      body=[reader_node],
                      type_ignores=[]
                  ),
                  "<verified_v17_reader>",
                  "exec"
              ),
              namespace
          )

          Reader=namespace["Reader"]

          ACTIONS={
              "walk":0,
              "attack":8,
              "hit":16,
              "death":24,
              "wait":32
          }

          # Four source indices, not asserted as
          # final in-game compass orientations.
          DIRECTIONS=(0,2,4,6)

          errors=[]

          def make_gif(frames,action):
              visible=[
                  frame for frame in frames
                  if frame is not None
                  and frame.getbbox()
              ]

              if not visible:
                  return None

              width=max(f.width for f in visible)
              height=max(f.height for f in visible)

              if width>512 or height>512:
                  return None

              images=[]

              for frame in visible:
                  canvas=Image.new(
                      "RGBA",
                      (width,height),
                      (0,0,0,0)
                  )

                  canvas.alpha_composite(
                      frame,
                      (
                          (width-frame.width)//2,
                          height-frame.height
                      )
                  )

                  indexed=canvas.convert(
                      "RGB"
                  ).quantize(colors=255)

                  alpha=canvas.getchannel(
                      "A"
                  ).point(
                      lambda a:255 if a<128 else 0
                  )

                  indexed.paste(
                      255,mask=alpha
                  )

                  images.append(indexed)

              output=BytesIO()

              options={
                  "format":"GIF",
                  "save_all":True,
                  "append_images":images[1:],
                  "duration":150,
                  "transparency":255,
                  "disposal":2,
                  "optimize":False
              }

              if action in ("walk","wait"):
                  options["loop"]=0

              images[0].save(output,**options)

              return base64.b64encode(
                  output.getvalue()
              ).decode("ascii")

          decoded={}

          for key,item in records.items():
              source_path=Path(
                  "original-paks"
              )/item["pak"].removeprefix("outer/")

              motions={}
              verified_count=0

              with source_path.open("rb") as stream:
                  for action,base in ACTIONS.items():
                      direction_gifs={}

                      for direction in DIRECTIONS:
                          sub=str(base+direction)
                          record=item["records"].get(sub)

                          if not record:
                              continue

                          try:
                              stream.seek(record["offset"])

                              raw=stream.read(
                                  record["bytes"]
                              )

                              if len(raw)!=record["bytes"]:
                                  raise ValueError(
                                      "Truncated SPR"
                                  )

                              sha=hashlib.sha256(
                                  raw
                              ).hexdigest()

                              if sha!=record["sha256"]:
                                  raise ValueError(
                                      "Original SPR SHA mismatch"
                                  )

                              verified_count+=1

                              frames=Reader(
                                  raw
                              ).decode()

                              animation=make_gif(
                                  frames,action
                              )

                              if animation:
                                  direction_gifs[
                                      str(direction)
                                  ]=animation

                          except Exception as exc:
                              errors.append({
                                  "source":key,
                                  "sub":sub,
                                  "action":action,
                                  "error":str(exc)
                              })

                      motions[action]=direction_gifs

              decoded[key]={
                  "motions":motions,
                  "hash_checks":verified_count
              }

          families={}

          for graphic_hash,source in selected.items():
              sprite_id=source["sprite_id"]
              pak=source["pak"]

              key=(
                  f"{sprite_id}|{pak}"
                  if sprite_id is not None
                  else ""
              )

              original=decoded.get(key,{})

              families[graphic_hash]={
                  **source,
                  "motions":original.get(
                      "motions",{}
                  ),
                  "verified_hashes":original.get(
                      "hash_checks",0
                  ),
                  "fallback":assets[
                      graphic_hash
                  ]["motions"]
              }

          summary={
              "version":"V25",
              "events":len(events),
              "graphics":len(assets),
              "candidate_graphics":sum(
                  x["sprite_id"] is not None
                  for x in families.values()
              ),
              "attack_4dirs":sum(
                  len(
                      x["motions"].get("attack",{})
                  )==4
                  for x in families.values()
              ),
              "hit_4dirs":sum(
                  len(
                      x["motions"].get("hit",{})
                  )==4
                  for x in families.values()
              ),
              "death_4dirs":sum(
                  len(
                      x["motions"].get("death",{})
                  )==4
                  for x in families.values()
              ),
              "five_motions_4dirs":sum(
                  all(
                      len(x["motions"].get(
                          action,{}
                      ))==4
                      for action in ACTIONS
                  )
                  for x in families.values()
              ),
              "extraction_errors":len(errors),
              "monster_identity_verified":0,
              "original_game_modified":False
          }

          (OUT/"V25-summary.json").write_text(
              json.dumps(
                  summary,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          (OUT/"V25-errors.json").write_text(
              json.dumps(
                  errors,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          with (
              OUT/"V25-492EV-five-motions.csv"
          ).open(
              "w",
              encoding="utf-8-sig",
              newline=""
          ) as stream:
              writer=csv.writer(stream)

              writer.writerow([
                  "map_id",
                  "event_id",
                  "monster",
                  "original_graphic",
                  "sprite_id",
                  "walk",
                  "attack",
                  "hit",
                  "death",
                  "wait"
              ])

              for event in events:
                  family=families[
                      event["primary_asset"]
                  ]

                  writer.writerow([
                      event["map_id"],
                      event["event_id"],
                      event["monster"],
                      " | ".join(
                          family["graphics"]
                      ),
                      family["sprite_id"],
                      *[
                          len(
                              family["motions"].get(
                                  action,{}
                              )
                          )
                          for action in ACTIONS
                      ]
                  ])

          page=r'''<!doctype html>
          <html lang="ko">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>SLKnight V25 · 492EV Original Five Motions</title>
          <style>
          :root{
            font-family:system-ui,sans-serif;
            color-scheme:dark;
            background:#111a26;
            color:#eef5ff
          }
          *{box-sizing:border-box}
          body{max-width:1100px;margin:auto;padding:12px}
          h1{font-size:1.35rem}
          h2{font-size:1rem}
          p{font-size:.82rem;color:#c2d2e2;line-height:1.5}
          input,select,button{
            background:#294258;
            color:white;
            border:1px solid #56768e;
            border-radius:8px;
            padding:9px;
            font:inherit
          }
          .layout{
            display:grid;
            grid-template-columns:280px minmax(0,1fr);
            gap:10px
          }
          .entries{max-height:78vh;overflow:auto}
          .entry{
            display:block;
            width:100%;
            text-align:left;
            margin:3px 0
          }
          .motions{
            display:grid;
            grid-template-columns:repeat(2,minmax(0,1fr));
            gap:9px
          }
          .panel{
            background:#1c2d40;
            padding:9px;
            border-radius:9px
          }
          .stage{
            min-height:155px;
            display:flex;
            align-items:flex-end;
            justify-content:center
          }
          .stage img{
            max-height:150px;
            max-width:98%;
            image-rendering:pixelated;
            object-fit:contain
          }
          .warning{color:#ffda98}
          @media(max-width:700px){
            .layout{grid-template-columns:1fr}
            .entries{max-height:200px}
            .stage{min-height:120px}
            .stage img{max-height:115px}
          }
          </style>
          </head>
          <body>
          <h1>SLKnight V25 · 492EV 원본 SPR 5동작</h1>
          <p>
          원본 SHA 검증 · 정지 · 걷기 · 공격 · 피격 · 사망.
          몬스터명으로 찾아낸 SPR 후보는 실제 외형과 일치 여부를
          확인하기 전까지 확정 연결로 취급하지 않습니다.
          </p>
          <p id="statistics"></p>
          <div class="layout">
            <section>
              <input id="search" placeholder="몬스터 검색">
              <select id="filter">
                <option value="all">전체</option>
                <option value="linked">SPR 후보 연결</option>
                <option value="missing">SPR 후보 미연결</option>
              </select>
              <div id="entries" class="entries"></div>
            </section>
            <section>
              <h2 id="monster"></h2>
              <p id="source"></p>
              <label>
                원본 SPR 방향
                <select id="direction">
                  <option value="0">SPR 0</option>
                  <option value="2">SPR 2</option>
                  <option value="4">SPR 4</option>
                  <option value="6">SPR 6</option>
                </select>
              </label>
              <div id="motions" class="motions"></div>
              <p id="warning" class="warning"></p>
            </section>
          </div>'''

          script=r'''
          const DB=JSON.parse(
            document.getElementById('dataset').textContent
          );

          const $=id=>document.getElementById(id);

          let selected=0;

          $('statistics').textContent=
            DB.summary.events+' EV · '+
            DB.summary.graphics+'개 그래픽 · '+
            '원본 공격 4방향 후보 '+
            DB.summary.attack_4dirs+'종 · '+
            '피격 '+DB.summary.hit_4dirs+'종 · '+
            '사망 '+DB.summary.death_4dirs+'종';

          const ACTIONS=[
            ['wait','정지'],
            ['walk','걷기'],
            ['attack','공격'],
            ['hit','피격'],
            ['death','사망']
          ];

          function draw(){
            const row=DB.rows[selected];
            const family=DB.families[row.primary_asset];
            const dir=$('direction').value;

            $('monster').textContent=
              row.monster+
              ' · MAP '+row.map_id+
              ' / EV '+row.event_id;

            $('source').textContent=
              '게임 그래픽: '+family.graphics.join(', ')+
              ' · 원본 SPR 후보: '+
              (family.sprite_id??'미연결')+
              ' · 원본 해시 검증: '+
              family.verified_hashes;

            $('warning').textContent=
              family.sprite_id!==null
              ? '원본 SPR 프레임 추출 완료. 몬스터 외형 일치와 동작 명칭은 최종 확인 전입니다.'
              : '일치하는 원본 SPR 후보 없음. 기존 정지·걷기만 표시합니다.';

            const area=$('motions');
            area.replaceChildren();

            const mapDirection={
              '0':'0',
              '2':'1',
              '4':'2',
              '6':'3'
            };

            for(const [action,label] of ACTIONS){
              const panel=document.createElement('section');
              panel.className='panel';

              const heading=document.createElement('h2');
              heading.textContent=label+' '+action.toUpperCase();

              panel.appendChild(heading);

              const stage=document.createElement('div');
              stage.className='stage';

              const original=(
                family.motions[action]||{}
              )[dir];

              const fallback=(
                family.fallback[mapDirection[dir]]||{}
              )[action];

              const imageData=original||fallback;

              if(imageData){
                const img=document.createElement('img');

                img.src=
                  'data:image/gif;base64,'+
                  imageData;

                img.alt=label;

                stage.appendChild(img);
              }else{
                stage.textContent='원본 모션 미추출';
              }

              panel.appendChild(stage);

              const note=document.createElement('p');

              note.textContent=original
                ? '원본 SPR 프레임'
                : fallback
                ? '기존 V23 그래픽'
                : '추출 데이터 없음';

              panel.appendChild(note);
              area.appendChild(panel);
            }
          }

          function refresh(){
            const query=$('search').value.toLowerCase();
            const filter=$('filter').value;
            const list=$('entries');

            list.replaceChildren();

            DB.rows.forEach((row,index)=>{
              const family=DB.families[row.primary_asset];

              const text=[
                row.monster,
                ...family.graphics,
                ...family.monsters
              ].join(' ').toLowerCase();

              if(!text.includes(query))return;

              if(
                filter==='linked' &&
                family.sprite_id===null
              )return;

              if(
                filter==='missing' &&
                family.sprite_id!==null
              )return;

              const button=document.createElement('button');
              button.className='entry';

              button.textContent=
                row.monster+
                ' · MAP '+row.map_id+
                ' / EV '+row.event_id;

              button.onclick=()=>{
                selected=index;
                draw();
              };

              list.appendChild(button);
            });
          }

          $('search').oninput=refresh;
          $('filter').onchange=refresh;
          $('direction').onchange=draw;

          refresh();
          draw();
          '''

          payload=json.dumps(
              {
                  "rows":[
                      {
                          k:event[k]
                          for k in (
                              "map_id",
                              "event_id",
                              "monster",
                              "primary_asset"
                          )
                      }
                      for event in events
                  ],
                  "families":families,
                  "summary":summary
              },
              ensure_ascii=False,
              separators=(",",":")
          ).replace("<","\\u003c")

          page+=(
              '<script id="dataset" type="application/json">'+
              payload+
              '</script><script>'+
              script+
              '</script></body></html>'
          )

          (OUT/"SLKnight-492EV-Five-Motions-V25.html").write_text(
              page,
              encoding="utf-8"
          )

          (OUT/"V25-ui.js").write_text(
              script,
              encoding="utf-8"
          )

          print(
              "V25_EXTRACTION_RESULT",
              json.dumps(
                  summary,ensure_ascii=False
              )
          )
          PY

          python3 /tmp/v25_build.py

      - name: "V25 | Validate all 492 events and 5 motion previews"
        run: |
          set -euo pipefail

          node --check reports/V25-ui.js

          python3 - <<'PY'
          import csv
          import json

          from pathlib import Path

          root=Path("reports")

          stats=json.loads(
              (root/"V25-summary.json").read_text()
          )

          assert stats["version"]=="V25"
          assert stats["events"]==492
          assert stats["graphics"]==83
          assert stats["original_game_modified"] is False

          with (
              root/"V25-492EV-five-motions.csv"
          ).open(encoding="utf-8-sig") as f:
              assert len(list(csv.DictReader(f)))==492

          html=root/"SLKnight-492EV-Five-Motions-V25.html"

          assert html.exists()
          assert html.stat().st_size>10000

          for name in (
              "wait","walk","attack","hit","death"
          ):
              assert name in html.read_text(encoding="utf-8")

          print("V25_492EV_VALIDATED")
          print("V25_83_GRAPHICS_PRESERVED")
          print("V25_FIVE_MOTION_PREVIEWS_CREATED")
          PY

          cat reports/V25-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: "V25 | Upload unified HTML and full extraction report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-sanctuary-monsters-v25-five-motions
          path: reports/
          retention-days: 30
          if-no-files-found: warn
