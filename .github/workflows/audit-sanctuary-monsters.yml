
name: "audit-sanctuary-monsters.yml | V29 | 61CE Physical Motion ID and Bank Review"
run-name: "audit-sanctuary-monsters.yml | V29 | Sanctuary Source 4-Dir Multi-Bank Audit"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/audit-sanctuary-monsters.yml"]

permissions:
  contents: read
  actions: read

jobs:
  v29-review:
    name: "V29 | Preserve V28, audit 46CE mappings and 14CE unmapped"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "V29 | Restore V28 success, source reports, V25 display baselines"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full python3-pil python3-yaml
          mkdir -p v28 v25 source/v2 source/v12 paks downloads reports
          gh run download 39200555087 -R "$GITHUB_REPOSITORY" \
            -n audit-sanctuary-monsters-v28-physical-61CE -D v28
          gh run download 39122782107 -R "$GITHUB_REPOSITORY" \
            -n audit-sanctuary-monsters-v25-five-motions -D v25
          gh run download 38784834277 -R "$GITHUB_REPOSITORY" \
            -n Sanctuary-V2-Reports -D source/v2
          gh run download 38872552732 -R "$GITHUB_REPOSITORY" \
            -n Sanctuary-V12-External-Action-and-NPC-Crosscheck -D source/v12
          git show 5c40dc3de28ee879182c6f60802a89432072c138:.github/workflows/audit-sanctuary-monsters.yml \
            > source/decoder.yml
          test -s v28/V28-61CE-physical-source.json
          test -s v25/SLKnight-492EV-Five-Motions-V25.html
          test -s source/v2/all_sprite_candidates.csv
          test -s source/v2/exported_sprite_manifest.csv
          test -s source/v12/03_external_npc_gfx_candidates.csv
          test -s source/decoder.yml

      - name: "V29 | Extract original Sanctuary Sprite.pak"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          gh release download v1.0.0 -R "$GITHUB_REPOSITORY" \
            --pattern "Sanctuary.of.Aden.-.Copy.*" -D downloads
          7z x downloads/Sanctuary.of.Aden.-.Copy.zip \
            "Sanctuary of Aden - Copy/Sprite.pak" "-o${PWD}/paks" -y > reports/SPR-source-extract.log
          test -s "paks/Sanctuary of Aden - Copy/Sprite.pak"
          rm -rf downloads

      - name: "V29 | Inspect all source motion banks without changing V28 results"
        run: |
          set -euo pipefail
          cat > source/v28-game-graphic.json <<'JSON'
          {
            "784": "실제 맵 그래픽 미확정",
            "827": "꿈의혼령",
            "852": "홉고블린",
            "863": "눈사람",
            "864": "아이스골렘",
            "865": "에티이동모션",
            "866": "좀비 엘모어 장군",
            "867": "좀비 엘모어 병사",
            "868": "좀비",
            "869": "좀비",
            "870": "샤벨타이거",
            "871": "해골 근위병",
            "872": "해골 돌격병",
            "873": "하피",
            "874": "스콜피온",
            "875": "코카트리스",
            "879": "트롤",
            "887": "드래곤플라이",
            "888": "불타는 전사",
            "889": "라바골렘",
            "891": "아시타지오",
            "894": "킹버그베어",
            "902": "거대개미",
            "903": "거대병정개미",
            "904": "거대여왕개미",
            "906": "트롤",
            "907": "에틴",
            "908": "리자드맨",
            "909": "라이칸스로프",
            "910": "웅골리언트",
            "911": "바실리스크",
            "912": "라미아",
            "913": "싸이클롭스",
            "914": "웅골리언트",
            "915": "하피",
            "916": "버그베어",
            "918": "코카트리스",
            "919": "미노타우르스",
            "920": "라미아",
            "921": "웅골리언트",
            "922": "메두사",
            "923": "키메라",
            "924": "나이트메어",
            "927": "해골 돌격병",
            "928": "스파토이",
            "929": "좀비",
            "930": "아이언골렘",
            "931": "유령",
            "934": "레서드래곤",
            "935": "본드래곤",
            "936": "좀비 엘모어 장군",
            "937": "좀비 엘모어 병사",
            "938": "라이칸스로프",
            "939": "샤벨타이거",
            "940": "아시타지오",
            "942": "나이트발드",
            "943": "흑기사",
            "944": "불타는 전사",
            "951": "바실리스크",
            "952": "리자드맨",
            "954": "선택받지 못한자(데몬)"
          }
          JSON
          cat > /tmp/v29_core.py <<'PY'
          #!/usr/bin/env python3
          """V29 - Original Sanctuary SPR multi-bank *review*, not automatic replacement.

          Verifies source byte SHA against V2 manifests. Preserves the V28 extracted
          attack previews. Compares all available banks in four original file directions;
          no action or direction labels are asserted without manual acceptance.
          """
          from __future__ import annotations
          import argparse,ast,base64,csv,hashlib,io,json,re,struct,html,os
          from pathlib import Path
          from collections import defaultdict
          from PIL import Image
          import yaml

          P=Path('.')
          OUT=P/'reports'
          OUT.mkdir(exist_ok=True,parents=True)
          DIRECTIONS=(0,2,4,6)
          BANKS=(0,8,16,24,32,40,48,56)
          PROTECTED={29,49,56,152}
          # Candidates are lookups from external NPC names, not CE -> sprite assignments.
          CANDIDATES={
            784:[],
            827:[],
            869:[4005],       # 'Abyss Ghoul'; ordinary ghoul is not proven identical
            872:[1104,1106,1132], # skeleton axe/pike/fighter, not proven soldier
            907:[],          # Etin: no exact named match in available source
            912:[1597,1600], # Lamia variants
            914:[95],        # giant spider, Ungoliant identity unproven
            920:[1597,1600],
            921:[95],
            927:[1104,1106,1132],
            929:[4005],
            931:[1318,1321],# infernal ghost variants
            943:[],          # not guardian armor 2771
            954:[5317],      # source name 'The Unchosen' exact match
          }
          # Known *review* action bank evidence from previous V20 examples.
          # This is NOT a mapping rule for arbitrary monsters.
          REFERENCE_BANKS={29:8,49:8,56:8,152:16}
          # Visual differences observed by comparing SingleLineage V25 baseline vs V28 first frames.
          # These are *review flags*, not assertions of a wrong identity.
          VISUAL_DIFFERENCES={
            1770:'기존 불타는 전사는 불꽃형, 생추어리 1770은 검붉은 인간형: 외형 차이가 큼. 공격만 혼합하면 안 됨.',
            1841:'아시타지오 원래 불꽃/팔 연출과 생추어리 붉은 본체 차이 확인 필요.',
            1390:'거대여왕개미의 장식/몸체 외형 차이가 큼. 동일 몬스터인지 시각 재검증.',
            4097:'메두사 체형/꼬리 외형이 크게 달라 확인 필요.',
            4088:'나이트메어의 색상·체형이 다르므로 외형 및 움직임 대조 필요.',
          }
          INVALID_PREVIOUS={
            '구울':'V25 zombie 52 assigned to ghoul group; identity not checked',
            '해골돌격병':'V25 skeleton 30 assigned to shock trooper; identity not checked',
            '암흑의 흑기사':'V25 guardian armor 2771 assigned to black knight; different monster',
            '오만 암흑흑기사':'V25 guardian armor 2771 assigned to black knight; different monster',
          }


          def sha(raw):return hashlib.sha256(raw).hexdigest()
          def load_csv(root,name):
              found=list(root.rglob(name))
              if len(found)!=1:raise RuntimeError('Missing or ambiguous data: '+name)
              with found[0].open(encoding='utf-8-sig',newline='') as f:return list(csv.DictReader(f))

          def load_v28():
              matches=list((P/'v28').rglob('V28-61CE-physical-source.json'))
              if len(matches)!=1:raise RuntimeError('V28 61CE artifact missing')
              dat=json.loads(matches[0].read_text('utf-8'))
              assert dat['version']=='V28' and len(dat['rows'])==61
              old={}
              for f in (P/'v28').rglob('*bank8-dir*.gif'):
                  m=re.fullmatch(r'(\d+)-bank8-dir(\d)\.gif',f.name)
                  if m:old.setdefault(int(m[1]),{})[int(m[2])]=f.read_bytes()
              assert len(old)==35 and all(set(v)==set(DIRECTIONS) for v in old.values())
              for actor,dirs in old.items():
                  for d,raw in dirs.items():
                      with Image.open(io.BytesIO(raw)) as im:
                          if im.format!='GIF' or im.n_frames<1 or im.info.get('loop')!=0:
                              raise RuntimeError(f'Corrupt or nonlooping V28 GIF: {actor} {d}')
              return dat['rows'],old

          def npc_names():
              names=defaultdict(lambda:defaultdict(set))
              for r in load_csv(P/'source'/'v12','03_external_npc_gfx_candidates.csv'):
                  if r.get('implementation','').lower()!='l1monster':continue
                  try:actor=int(r['gfx_id'])
                  except (ValueError,KeyError):continue
                  name=r.get('npc_name','').strip()
                  if name:names[actor][r.get('reference','unknown')].add(name)
              return names

          def read_v25():
              source=list((P/'v25').rglob('SLKnight-492EV-Five-Motions-V25.html'))
              if len(source)!=1:return {}
              text=source[0].read_text('utf-8')
              m=re.search(r'<script id="dataset" type="application/json">(.*?)</script>',text,re.S)
              if not m:return {}
              db=json.loads(m[1]);out={}
              for family in db['families'].values():
                  for g in family['graphics']:
                      if g not in out:out[g]=family.get('fallback',{})
              return out

          def original_reader():
              wf=yaml.safe_load((P/'source'/'decoder.yml').read_text('utf-8'))
              steps=wf['jobs']['identify']['steps']
              src=next(x['run'] for x in steps if x.get('name')=='Decode all selected monster animation frames')
              code=src.split("python3 - <<'PY'\n",1)[1].split('\nPY',1)[0]
              klass=next(x for x in ast.parse(code).body if isinstance(x,ast.ClassDef) and x.name=='Reader')
              scope={'struct':struct,'Image':Image,'MAX_FRAMES':240,'MAX_DIM':1000}
              exec(compile(ast.Module(body=[klass],type_ignores=[]),'<verified V17 Reader>','exec'),scope)
              return scope['Reader']

          def source_index(actors):
              index=load_csv(P/'source'/'v2','all_sprite_candidates.csv')
              manifests=load_csv(P/'source'/'v2','exported_sprite_manifest.csv')
              hashes={(x['pak'],x['sprite_file'].lower(),int(x['bytes'])):x['sha256'] for x in manifests}
              files=defaultdict(dict); pakset=set()
              for r in index:
                  pak=r['pak']
                  if not pak.endswith('/Sprite.pak'):continue
                  name=Path(r['file'].replace('\\','/')).name
                  m=re.fullmatch(r'(\d+)-(\d+)\.spr',name,re.I)
                  if not m:continue
                  actor,sub=map(int,m.groups())
                  if actor not in actors or sub//8*8 not in BANKS or sub%8 not in DIRECTIONS:continue
                  size=int(r['bytes']);digest=hashes.get((pak,name.lower(),size))
                  if digest is None:raise RuntimeError('No checksum '+name)
                  rec={'file':name,'pak':pak,'offset':int(r['offset']),'size':size,'sha256':digest}
                  if sub not in files[actor] or rec['offset']<files[actor][sub]['offset']:
                      files[actor][sub]=rec
                  pakset.add(pak)
              if len(pakset)!=1:raise RuntimeError('Ambiguous source PAK: '+str(pakset))
              return next(iter(pakset)),files

          def gif_encode(frames):
              frames=[f for f in frames if f is not None and f.getbbox()]
              if not frames:raise ValueError('No visible frames')
              w=max(x.width for x in frames);h=max(x.height for x in frames)
              if w>1000 or h>1000:raise ValueError('Unreasonably large decoded frame')
              imgs=[]
              for fr in frames:
                  canv=Image.new('RGBA',(w,h))
                  canv.alpha_composite(fr,((w-fr.width)//2,h-fr.height))
                  pal=canv.convert('RGB').quantize(colors=255)
                  pal.paste(255,mask=canv.getchannel('A').point(lambda a:255 if a<128 else 0))
                  imgs.append(pal)
              out=io.BytesIO()
              imgs[0].save(out,format='GIF',save_all=True,append_images=imgs[1:],duration=150,
                           loop=0,disposal=2,transparency=255,optimize=False)
              raw=out.getvalue()
              with Image.open(io.BytesIO(raw)) as im:
                  if im.format!='GIF' or im.info.get('loop')!=0:raise ValueError('GIF looping failed')
              return raw,len(frames)

          def extract(actors):
              Reader=original_reader();pak,index=source_index(actors)
              source=P/'paks'/pak.removeprefix('outer/')
              if not source.is_file():raise RuntimeError('No original Sanctuary Sprite.pak '+str(source))
              bank_data=defaultdict(lambda:defaultdict(dict));audits=[];missing=[]
              with source.open('rb') as f:
                  for actor in sorted(actors):
                      for bank in BANKS:
                          for d in DIRECTIONS:
                              sub=bank+d;rec=index[actor].get(sub)
                              if rec is None:
                                  missing.append([actor,bank,d]);continue
                              f.seek(rec['offset']);raw=f.read(rec['size'])
                              if len(raw)!=rec['size'] or sha(raw)!=rec['sha256']:
                                  raise RuntimeError('Original source hash mismatch: '+rec['file'])
                              try:
                                  gif,frames=gif_encode(Reader(raw).decode())
                              except (ValueError,IndexError,OverflowError) as exc:
                                  audits.append({'actor':actor,'bank':bank,'dir':d,'source_sha256':rec['sha256'],
                                                 'error':str(exc),'frames':0});continue
                              bank_data[actor][bank][d]=gif
                              audits.append({'actor':actor,'bank':bank,'dir':d,'source_sha256':rec['sha256'],
                                             'gif_sha256':sha(gif),'frames':frames,'preview_ms_per_frame':150})
              return bank_data,audits,missing

          def read_gfx_map():
              # Exact graphics recorded from SingleLineage map-event audit, not inferred by name.
              m=P/'source'/'v28-game-graphic.json'
              if not m.exists():return {}
              d=json.loads(m.read_text('utf-8'))
              return {int(k):v for k,v in d.items()}

          def b64gif(raw):return base64.b64encode(raw).decode('ascii')
          def extract_original_images(gfx,lookup):
              fallback=lookup.get(gfx)
              if not fallback:return {}
              result={}
              for d in range(4):
                  if str(d) not in fallback:continue
                  x=fallback[str(d)].get('wait')
                  if not x:continue
                  result[str(d)]=x
              return result

          def make_html(view):
              payload=json.dumps(view,ensure_ascii=False,separators=(',',':')).replace('<','\\u003c')
              return '''<!doctype html><html lang="ko"><head><meta charset="utf-8">
              <meta name="viewport" content="width=device-width,initial-scale=1">
              <title>audit-sanctuary-monsters.yml | V29 | 물리 61CE 원본 다중뱅크 검증</title>
              <style>
              :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101922;color:#f2f6ff}
              *{box-sizing:border-box}body{max-width:1320px;margin:auto;padding:18px}
              header{border-bottom:1px solid #536479;margin-bottom:13px}h1{font-size:1.35rem}
              .muted,.meta{color:#aebcd0;font-size:.86rem;line-height:1.55}.intro{color:#d6dfe8;line-height:1.6}
              .controls{position:sticky;top:0;z-index:10;background:#142333;padding:10px;display:flex;gap:8px;flex-wrap:wrap;border-radius:8px}
              input,select{padding:8px;background:#27394c;color:#fff;border:1px solid #57718a;border-radius:5px;min-width:90px}
              input{flex:1;min-width:160px}.card{background:#1a2a3b;border:1px solid #3d5871;border-radius:9px;margin:10px 0;padding:12px}
              .card h2{font-size:1.05rem;margin:0 0 7px}.head{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
              .images{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
              .panel{border:1px solid #425567;padding:7px;background:#12212e;min-width:0;border-radius:7px}
              .panel h3{font-size:.9rem;margin:0 0 6px}.dirs{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
              .dir{background:#182633;min-height:120px;padding:4px;text-align:center;border:1px solid #37495b;border-radius:5px;font-size:.75rem}
              .dir img{height:108px;width:100%;object-fit:contain;image-rendering:pixelated}.warn{color:#ffc68b}
              .state{font-size:.81rem;color:#c0d7e8}.empty{font-size:.8rem;color:#d9a98a;padding:15px}
              @media(max-width:820px){.images{grid-template-columns:1fr}.dirs{grid-template-columns:repeat(4,1fr)}.dir img{height:80px}}
              @media(max-width:550px){.dirs{grid-template-columns:repeat(2,1fr)}}
              </style></head><body><header>
              <h1>V29 · 싱글리니지 물리공격 61CE × 생추어리 원본 SPR 검증</h1>
              <p class="intro">V28에서 확보한 35종 SPR(46개 CE에 대응)은 <b>바이트/해시 검증 상태</b>이지 외형·공격모션 최종 승인 상태가 아닙니다. V29에서는 원본 0·8·16·24·32·40·48·56 뱅크를 4방향씩 개별 미리보기로 표시합니다. 다른 이름의 SPR을 자동 적용하지 않습니다.</p>
              <p class="muted">프레임당 150ms는 검사용 GIF 재생속도이며 원작 공격속도가 아닙니다. 원본 방향 인덱스 0/2/4/6이 실제 상·우·하·좌와 일치하는지 별도 검토가 필요합니다.</p>
              </header><div class="controls">
              <input id="q" placeholder="CE, 몬스터명, SPR 번호 검색">
              <select id="status"><option value="all">전체 61CE</option><option value="pending">ID 미확정 14CE</option><option value="mapped">기존 연결 46CE</option><option value="protected">성공본 보호 1CE</option></select>
              <select id="bank"><option value="8">뱅크 8 (V28 사용)</option><option value="0">뱅크 0</option><option value="16">뱅크 16</option><option value="24">뱅크 24</option><option value="32">뱅크 32</option><option value="40">뱅크 40</option><option value="48">뱅크 48</option><option value="56">뱅크 56</option></select>
              <span id="count"></span></div><main id="cards"></main>
              <script id="dataset" type="application/json">'''+payload+'''</script><script>
              const D=JSON.parse(document.getElementById('dataset').textContent),$=x=>document.getElementById(x);
              const tag=['0','2','4','6'],native=['0','1','2','3'];
              function panel(title,frames,keyPrefix,rawIndices){
                const wrap=document.createElement('section');wrap.className='panel';
                const h=document.createElement('h3');h.textContent=title;wrap.append(h);
                const grid=document.createElement('div');grid.className='dirs';
                (rawIndices?tag:native).forEach((d,i)=>{
                  const cell=document.createElement('div');cell.className='dir';
                  const l=document.createElement('div');l.textContent=(rawIndices?'SPR 서브방향 '+d:['↑','→','↓','←'][i]);cell.append(l);
                  if(frames&&frames[d]){
                    const im=document.createElement('img');im.loading='lazy';
                    im.src='data:image/'+'gif'+';base64,'+frames[d];cell.append(im);
                  }else{const t=document.createElement('span');t.textContent='없음/보류';cell.append(t)}
                  grid.append(cell);
                });wrap.append(grid);return wrap;
              }
              function draw(){
                const q=$('q').value.toLowerCase().trim(),stat=$('status').value,bank=$('bank').value;
                const root=$('cards');root.replaceChildren();let cnt=0;
                for(const r of D.rows){
                  if(stat==='pending'&&r.actor!==null)continue;
                  if(stat==='mapped'&&(r.actor===null||r.protected))continue;
                  if(stat==='protected'&&!r.protected)continue;
                  if(!(r.ce+' '+r.name+' '+(r.actor||'')+' '+r.candidates.join(',')).toLowerCase().includes(q))continue;
                  cnt++;
                  const card=document.createElement('article');card.className='card';
                  const h=document.createElement('h2');h.textContent='CE '+r.ce+' · '+r.name+' · '+(r.actor===null?'SPR 미확정':'SPR '+r.actor);card.append(h);
                  const meta=document.createElement('div');meta.className='meta';meta.textContent='싱글리니지 그래픽: '+(r.game_graphic||'기록 없음')+' / '+(r.protected?'기존 성공본 수정 금지':r.actor===null?'번호 미확정, 후보만 표시':'V28 ID 연결됨, 외형·공격모션 미확정');card.append(meta);
                  const cand=document.createElement('div');cand.className='meta';cand.textContent='생추어리 이름 기반 후보: '+(r.candidates.map(x=>x+' ('+(D.actor_names[x]||[]).slice(0,2).join(' / ')+')').join('; ')||'확인된 후보 없음');card.append(cand);
                  const choice=document.createElement('select');choice.style.marginTop='6px';
                  const choices=[r.actor,...r.candidates].filter((x,i,a)=>x!==null&&a.indexOf(x)===i);
                  choices.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent='원본 SPR '+x+(r.actor!==x?' · 미확정 후보':' · V28 연결');choice.append(o)});
                  if(!choices.length){choice.disabled=true;const o=document.createElement('option');o.textContent='후보 없음';choice.append(o)}
                  card.append(choice);
                  const warnings=document.createElement('div');warnings.className='meta warn';warnings.textContent=(r.warning||'')+(r.actor!==null?' · V28 뱅크8 공격동작 승인 아님':' · 후보를 선택해도 CE 연결값은 바뀌지 않습니다.');card.append(warnings);
                  const stages=document.createElement('div');stages.className='images';card.append(stages);
                  const refresh=()=>{
                    const src=choice.value;
                    const images=D.multi[src]||{},b=images[bank]||{};
                    stages.replaceChildren();
                    stages.append(panel('싱글리니지 기존 외형',r.single,'game',false));
                    stages.append(panel('V28 기존 뱅크8 미리보기',D.previous[src],src,true));
                    stages.append(panel('생추어리 SPR '+src+' 원본 뱅크 '+bank+' · 아직 공격인지 미확정',b,src,true));
                  };
                  choice.onchange=refresh;refresh();root.append(card);
                }
                $('count').textContent=cnt+'개 표시';
              }
              $('q').oninput=draw;$('status').onchange=draw;$('bank').onchange=draw;draw();
              </script></body></html>'''

          def run(args):
              roster,previous=load_v28()
              pending={r['ce'] for r in roster if r['actor'] is None}
              assert pending==set(CANDIDATES),f'CE drift {pending ^ set(CANDIDATES)}'
              actors=set(previous)|{a for c in CANDIDATES.values() for a in c}
              # 152 known special action bank 16; only preview if permitted (not modifying V20).
              actors.update({29,49,56,152})
              names=npc_names()
              if args.offline:
                  bank_data=defaultdict(lambda:defaultdict(dict));audit=[];missing=[]
                  for a,dirs in previous.items():bank_data[a][8].update(dirs)
              else:
                  bank_data,audit,missing=extract(actors)
              game_map=read_gfx_map();singlelineage=read_v25();rows=[]
              for r in roster:
                  ce=r['ce'];actor=r['actor'];pr=r['protected']
                  img=extract_original_images(game_map.get(ce,''),singlelineage)
                  rows.append(dict(ce=ce,name=r['name'],actor=actor,game_graphic=game_map.get(ce,''),
                                   protected=pr,candidates=CANDIDATES.get(ce,[]),single=img,
                                   warning=(INVALID_PREVIOUS.get(r['name'],'') if actor is None else VISUAL_DIFFERENCES.get(actor,'')),
                                   identity_approved=False,attack_bank_approved=bool(pr)))
              display={str(a):sorted({v for values in names[a].values() for v in values})[:8] for a in actors}
              if not args.offline:
                  gifs=OUT/'gifs'; n=0
                  for a,banks in bank_data.items():
                      for b,dirs in banks.items():
                          for d,raw in dirs.items():
                              dest=gifs/str(a);dest.mkdir(parents=True,exist_ok=True)
                              (dest/f'{a}-bank{b}-dir{d}.gif').write_bytes(raw);n+=1
              view={'rows':rows,'actor_names':display,
                    'previous':{str(a):{str(d):b64gif(raw) for d,raw in dd.items()} for a,dd in previous.items()},
                    'multi':{str(a):{str(b):{str(d):b64gif(raw) for d,raw in dd.items()} for b,dd in banks.items()}
                             for a,banks in bank_data.items()},
                    'comparison_only':True,'game_modified':False}
              OUT.joinpath('V29-61CE-VisualReview.html').write_text(make_html(view),'utf-8')
              summary={'version':'V29','total_ce':len(rows),'v28_ce_mapped':sum(x['actor'] is not None and not x['protected'] for x in rows),
                       'v28_actor_count':len(previous),'unresolved_ce':len(pending),'preserved_ce':sum(x['protected'] for x in rows),
                       'candidate_actors':len(actors),'source_banks_verified_hashes':sum('gif_sha256' in x for x in audit),
                       'no_claim_of_motion_identity':True,'game_modified':False,'offline_preview':args.offline}
              OUT.joinpath('V29-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),'utf-8')
              OUT.joinpath('V29-bank-manifest.json').write_text(json.dumps({'audits':audit,'missing':missing},ensure_ascii=False,indent=2),'utf-8')
              OUT.joinpath('V29-ce-candidates.json').write_text(json.dumps({'roster':rows,'names':display,'protected_source_banks':REFERENCE_BANKS,'invalid_prior_matching':INVALID_PREVIOUS},ensure_ascii=False,indent=2),'utf-8')
              with OUT.joinpath('V29-61CE-status.csv').open('w',encoding='utf-8-sig',newline='') as f:
                  w=csv.writer(f);w.writerow(['CE','SingleLineage','OldGraphic','V28_SPR','Source_Name_Candidates','Source_Verified','Visual_Identity_Confirmed','Physical_Attack_Action_Confirmed'])
                  for x in rows:w.writerow([x['ce'],x['name'],x['game_graphic'],x['actor'] or '',','.join(map(str,x['candidates'])),x['actor'] in previous,'NO','NO'])
              if not args.offline:
                  assert len(rows)==61 and len(previous)==35 and len(pending)==14 and len(audit)>0
              print('V29_SUMMARY',json.dumps(summary,ensure_ascii=False))

          if __name__=='__main__':
              parser=argparse.ArgumentParser();parser.add_argument('--offline',action='store_true');run(parser.parse_args())
          PY
          python3 /tmp/v29_core.py

      - name: "V29 | Validate SHA logs, 61CE UI, no automatic SPR replacement"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,json,re,subprocess
          from pathlib import Path
          p=Path('reports')
          s=json.loads((p/'V29-summary.json').read_text('utf-8'))
          assert s['version']=='V29' and s['total_ce']==61
          assert s['v28_ce_mapped']==46 and s['unresolved_ce']==14
          assert s['preserved_ce']==1 and s['v28_actor_count']==35
          assert s['no_claim_of_motion_identity'] and not s['game_modified']
          assert not s['offline_preview']
          z=json.loads((p/'V29-bank-manifest.json').read_text('utf-8'))
          assert s['source_banks_verified_hashes']>100, s
          bank8={(v['actor'],v['dir']) for v in z['audits'] if v.get('gif_sha256') and v['bank']==8}
          previous=json.loads(Path('v28/V28-61CE-physical-source.json').read_text())['rows']
          ids={v['actor'] for v in previous if v['actor'] is not None and not v['protected']}
          assert len(ids)==35
          assert all((actor,d) in bank8 for actor in ids for d in (0,2,4,6))
          with (p/'V29-61CE-status.csv').open(encoding='utf-8-sig') as f:
              assert len(list(csv.DictReader(f)))==61
          h=(p/'V29-61CE-VisualReview.html').read_text('utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',h,re.S)
          assert len(scripts)==1
          Path('/tmp/v29-ui.js').write_text(scripts[0],encoding='utf-8')
          subprocess.run(['node','--check','/tmp/v29-ui.js'],check=True)
          print('V29_REVIEW_GENERATED',s)
          PY
          cat reports/V29-summary.json >> "$GITHUB_STEP_SUMMARY"

