
name: Sanctuary of Aden SPR Structure and Motion Lab V10

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/audit-sanctuary-monsters.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: sanctuary-monster-audit
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Prepare analysis environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil
          mkdir -p previous/v2 previous/v8 previous/v9 reports
          python3 -c "from PIL import Image; print('PIL_OK')"

      - name: Restore successful V2 V8 and V9 artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh run download 38784834277 \
            --repo "$GITHUB_REPOSITORY" \
            --name Sanctuary-V2-Reports \
            --dir previous/v2

          gh run download 38835390184 \
            --repo "$GITHUB_REPOSITORY" \
            --name Sanctuary-V8-Recovered-XML-and-Animation-Tables \
            --dir previous/v8

          gh run download 38838415568 \
            --repo "$GITHUB_REPOSITORY" \
            --name Sanctuary-V9-Original-SPR-Visual-Lab \
            --dir previous/v9

          test -n "$(find previous/v2 -name all_sprite_candidates.csv -print -quit)"
          test -n "$(find previous/v8 -name 08_explicit_target_sprite_ids.csv -print -quit)"
          test -s previous/v9/02_rendered_sprite_manifest.csv
          test -s previous/v9/summary_v9.json
          test -d previous/v9/viewer/sheets

          echo "V2 V8 V9 VERIFIED INPUTS RESTORED"

      - name: Analyze all sprite IDs and verified frame images
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import csv
          import hashlib
          import json
          import math
          import os
          import re
          import statistics

          from collections import Counter, defaultdict
          from pathlib import Path
          from PIL import Image

          ROOT = Path.cwd()
          V2 = ROOT / "previous/v2"
          V8 = ROOT / "previous/v8"
          V9 = ROOT / "previous/v9"
          REPORT = ROOT / "reports"

          REPORT.mkdir(parents=True, exist_ok=True)

          def read_csv(root, name):
              files = list(root.rglob(name))
              if len(files) != 1:
                  raise RuntimeError(
                      f"Expected one {name}, found {len(files)}"
                  )
              with files[0].open(
                  "r",
                  encoding="utf-8-sig",
                  newline=""
              ) as f:
                  return list(csv.DictReader(f))

          def write_csv(name, fields, rows):
              with (REPORT / name).open(
                  "w",
                  encoding="utf-8-sig",
                  newline=""
              ) as f:
                  writer = csv.DictWriter(
                      f,
                      fieldnames=fields,
                      extrasaction="ignore"
                  )
                  writer.writeheader()
                  writer.writerows(rows)

          all_sprites = read_csv(
              V2, "all_sprite_candidates.csv"
          )

          rendered = read_csv(
              V9, "02_rendered_sprite_manifest.csv"
          )

          duplicate_rows = read_csv(
              V9, "01_duplicate_spr_filenames.csv"
          )

          xml_targets = read_csv(
              V8, "08_explicit_target_sprite_ids.csv"
          )

          v9_summary = json.loads(
              (V9 / "summary_v9.json").read_text(
                  encoding="utf-8"
              )
          )

          if len(rendered) != int(
              v9_summary["renderedSPRVariants"]
          ):
              raise RuntimeError(
                  "V9 manifest does not match successful run"
              )

          xml_ids = {
              int(row["sprite_id"])
              for row in xml_targets
              if str(
                  row["in_v2_sprite_index"]
              ).lower() == "true"
          }

          sprite_pattern = re.compile(
              r"^(\d+)-(\d+)\.(spr|spx|sp2|fspr)$",
              re.I
          )

          actors = defaultdict(list)
          bands = defaultdict(list)
          parse_skipped = 0

          for row in all_sprites:
              filename = row["file"].replace(
                  "\\", "/"
              ).split("/")[-1]

              match = sprite_pattern.fullmatch(
                  filename
              )

              if not match:
                  parse_skipped += 1
                  continue

              actor = int(match.group(1))
              subid = int(match.group(2))
              extension = match.group(3).lower()
              package = Path(
                  row["pak"]
              ).name

              record = {
                  "actor": actor,
                  "subid": subid,
                  "package": package,
                  "extension": extension,
                  "filename": filename
              }

              actors[actor].append(record)

              band = subid // 8 * 8

              bands[
                  (actor, package, extension, band)
              ].append(record)

          all_actor_rows = []

          for actor, rows in sorted(actors.items()):
              subids = {
                  row["subid"] for row in rows
              }

              packages = {
                  row["package"] for row in rows
              }

              extensions = {
                  row["extension"] for row in rows
              }

              all_actor_rows.append({
                  "sprite_id": actor,
                  "file_records": len(rows),
                  "unique_subids": len(subids),
                  "packages": len(packages),
                  "package_names": ",".join(
                      sorted(packages)
                  ),
                  "extensions": ",".join(
                      sorted(extensions)
                  ),
                  "min_subid": min(subids),
                  "max_subid": max(subids),
                  "eight_slot_bands": len({
                      n // 8 * 8 for n in subids
                  }),
                  "in_v8_xml_targets": actor in xml_ids,
                  "motion_identity_verified": False
              })

          write_csv(
              "01_all_sprite_id_groups.csv",
              [
                  "sprite_id",
                  "file_records",
                  "unique_subids",
                  "packages",
                  "package_names",
                  "extensions",
                  "min_subid",
                  "max_subid",
                  "eight_slot_bands",
                  "in_v8_xml_targets",
                  "motion_identity_verified"
              ],
              all_actor_rows
          )

          band_rows = []

          for key, records in sorted(
              bands.items()
          ):
              actor, package, extension, band = key

              present = sorted({
                  x["subid"] for x in records
              })

              expected = list(
                  range(band, band + 8)
              )

              missing = [
                  x for x in expected
                  if x not in present
              ]

              band_rows.append({
                  "sprite_id": actor,
                  "package": package,
                  "extension": extension,
                  "band_start": band,
                  "band_end": band + 7,
                  "slots_present": len(present),
                  "subids_present": ",".join(
                      map(str, present)
                  ),
                  "missing_subids": ",".join(
                      map(str, missing)
                  ),
                  "file_records": len(records),
                  "all_eight_present": (
                      len(present) == 8
                  ),
                  "meaning": "UNVERIFIED_SUBID_GROUP"
              })

          write_csv(
              "02_all_eight_slot_bands.csv",
              [
                  "sprite_id",
                  "package",
                  "extension",
                  "band_start",
                  "band_end",
                  "slots_present",
                  "subids_present",
                  "missing_subids",
                  "file_records",
                  "all_eight_present",
                  "meaning"
              ],
              band_rows
          )

          write_csv(
              "03_duplicate_package_conflicts.csv",
              [
                  "file",
                  "copies",
                  "distinct_sha256",
                  "different_contents",
                  "packages"
              ],
              duplicate_rows
          )

          feature_rows = []
          display_entries = []
          render_bands = defaultdict(list)
          image_errors = []

          for row in rendered:
              actor = int(row["actor"])
              subid = int(row["sub"])
              package = row["package"]

              frames = int(
                  row["frameCountRendered"]
              )

              cols = int(row["cols"])
              cw = int(row["cellW"])
              ch = int(row["cellH"])

              sheet_relative = row["sheet"]

              if (
                  not sheet_relative.startswith("sheets/")
                  or ".." in Path(sheet_relative).parts
              ):
                  raise RuntimeError(
                      "Unsafe V9 sheet path"
                  )

              path = (
                  V9 / "viewer" / sheet_relative
              )

              if not path.is_file():
                  image_errors.append({
                      "actor": actor,
                      "subid": subid,
                      "package": package,
                      "error": "MISSING_V9_SHEET"
                  })
                  continue

              try:
                  with Image.open(path) as source:
                      atlas = source.convert("RGBA")

                  expected_width = cols * cw
                  expected_rows = math.ceil(
                      frames / cols
                  )

                  if atlas.width != expected_width:
                      raise ValueError(
                          "Sheet width mismatch"
                      )

                  if atlas.height != expected_rows * ch:
                      raise ValueError(
                          "Sheet height mismatch"
                      )

                  previous_pixels = None
                  changes = []
                  visible_frames = 0

                  for frame in range(frames):
                      x = (frame % cols) * cw
                      y = (frame // cols) * ch

                      image = atlas.crop((
                          x, y, x + cw, y + ch
                      ))

                      alpha = image.getchannel("A")
                      bbox = alpha.getbbox()

                      if bbox is None:
                          width = 0
                          height = 0
                          cx = 0
                          cy = 0
                      else:
                          visible_frames += 1
                          width = bbox[2] - bbox[0]
                          height = bbox[3] - bbox[1]
                          cx = (
                              bbox[0] + bbox[2]
                          ) / 2
                          cy = (
                              bbox[1] + bbox[3]
                          ) / 2

                      small = alpha.resize(
                          (16, 16),
                          Image.Resampling.BOX
                      )

                      pixels = list(
                          small.getdata()
                      )

                      if previous_pixels is None:
                          change = 0.0
                      else:
                          change = sum(
                              abs(a - b)
                              for a, b in zip(
                                  pixels,
                                  previous_pixels
                              )
                          ) / (256 * 255)

                      previous_pixels = pixels
                      changes.append(change)

                      feature_rows.append({
                          "sprite_id": actor,
                          "subid": subid,
                          "package": package,
                          "sha256": row["sha256"],
                          "frame_index": frame,
                          "visible": bbox is not None,
                          "width": width,
                          "height": height,
                          "center_x": round(cx, 2),
                          "center_y": round(cy, 2),
                          "difference_from_previous": (
                              round(change, 6)
                          )
                      })

                  mean_change = (
                      statistics.mean(changes[1:])
                      if len(changes) > 1
                      else 0.0
                  )

                  display = {
                      "actor": actor,
                      "sub": subid,
                      "package": package,
                      "sha256": row["sha256"],
                      "frames": int(row["frames"]),
                      "renderedFrames": frames,
                      "cols": cols,
                      "cellW": cw,
                      "cellH": ch,
                      "visibleFrames": visible_frames,
                      "meanChange": round(
                          mean_change, 5
                      ),
                      "sheet": (
                          "data:image/png;base64,"
                          + base64.b64encode(
                              path.read_bytes()
                          ).decode("ascii")
                      )
                  }

                  display_entries.append(display)

                  key = (
                      actor,
                      package,
                      subid // 8 * 8
                  )

                  render_bands[key].append(display)

              except Exception as exc:
                  image_errors.append({
                      "actor": actor,
                      "subid": subid,
                      "package": package,
                      "error": str(exc)
                  })

          write_csv(
              "04_original_frame_features.csv",
              [
                  "sprite_id",
                  "subid",
                  "package",
                  "sha256",
                  "frame_index",
                  "visible",
                  "width",
                  "height",
                  "center_x",
                  "center_y",
                  "difference_from_previous"
              ],
              feature_rows
          )

          rendered_band_rows = []
          action_candidates = []

          for key, entries in sorted(
              render_bands.items()
          ):
              actor, package, band = key

              subids = sorted({
                  x["sub"] for x in entries
              })

              counts = [
                  x["renderedFrames"]
                  for x in entries
              ]

              motion = [
                  x["meanChange"]
                  for x in entries
              ]

              record = {
                  "sprite_id": actor,
                  "package": package,
                  "band_start": band,
                  "band_end": band + 7,
                  "present_slots": len(subids),
                  "subids": ",".join(
                      map(str, subids)
                  ),
                  "rendered_variants": len(entries),
                  "mean_frame_count": round(
                      statistics.mean(counts), 3
                  ),
                  "mean_frame_change": round(
                      statistics.mean(motion), 6
                  ),
                  "eight_slots_complete": (
                      len(subids) == 8
                  ),
                  "action_name_verified": False,
                  "actual_direction_verified": False,
                  "package_priority_verified": False
              }

              rendered_band_rows.append(
                  record
              )

              action_candidates.append({
                  "sprite_id": actor,
                  "package": package,
                  "subid_band_start": band,
                  "subid_band_end": band + 7,
                  "possible_action": None,
                  "verification": "NOT_YET_CLASSIFIED",
                  "known_frame_count": counts,
                  "original_timing": None,
                  "original_direction_mapping": None
              })

          write_csv(
              "05_rendered_band_analysis.csv",
              [
                  "sprite_id",
                  "package",
                  "band_start",
                  "band_end",
                  "present_slots",
                  "subids",
                  "rendered_variants",
                  "mean_frame_count",
                  "mean_frame_change",
                  "eight_slots_complete",
                  "action_name_verified",
                  "actual_direction_verified",
                  "package_priority_verified"
              ],
              rendered_band_rows
          )

          write_csv(
              "06_image_analysis_errors.csv",
              [
                  "actor",
                  "subid",
                  "package",
                  "error"
              ],
              image_errors
          )

          (REPORT / "07_action_candidate_structure.json").write_text(
              json.dumps(
                  action_candidates,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          summary = {
              "phase": "GLOBAL_SPR_STRUCTURE_AND_VISUAL_ANALYSIS",
              "v2_sprite_records": len(all_sprites),
              "parsed_sprite_id_groups": len(actors),
              "all_package_eight_slot_groups": len(band_rows),
              "unparsed_candidate_records": parse_skipped,
              "duplicate_filenames": len(duplicate_rows),
              "conflicting_duplicate_filenames": sum(
                  str(row["different_contents"]).lower()
                  == "true"
                  for row in duplicate_rows
              ),
              "v9_rendered_variants": len(rendered),
              "v10_verified_image_sheets": len(display_entries),
              "v10_image_errors": len(image_errors),
              "analyzed_individual_frames": len(feature_rows),
              "rendered_eight_slot_groups": len(rendered_band_rows),
              "v8_matched_target_ids": sorted(xml_ids),
              "verified_monster_action_mappings": 0,
              "verified_pak_priority": False,
              "verified_original_animation_timing": False
          }

          (REPORT / "08_summary_v10.json").write_text(
              json.dumps(
                  summary,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          payload = {
              "actors": sorted({
                  x["actor"]
                  for x in display_entries
              }),
              "entries": display_entries,
              "bands": rendered_band_rows,
              "xmlIds": sorted(xml_ids),
              "summary": summary
          }

          encoded = json.dumps(
              payload,
              ensure_ascii=False,
              separators=(",", ":")
          ).replace("<", "\\u003c")

          html = r'''<!doctype html>
          <html lang="ko">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Sanctuary V10 Motion Matrix</title>
          <style>
          :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101722;color:#eaf2fc}
          *{box-sizing:border-box}
          body{max-width:1180px;margin:auto;padding:12px}
          h1{font-size:1.3rem}
          h2{font-size:1rem;margin-top:20px}
          p{font-size:.83rem;color:#afc2d7;line-height:1.5}
          .toolbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
          .field{display:flex;flex-direction:column;gap:5px;font-size:.8rem}
          select,button{background:#26384d;color:white;border:1px solid #536b84;border-radius:7px;padding:9px;font:inherit}
          button{cursor:pointer}
          .controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
          .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:9px}
          .card{border:1px solid #34475d;background:#192636;border-radius:10px;padding:7px;min-width:0}
          .heading{font-weight:700;font-size:.83rem}
          .meta{font-size:.72rem;color:#b2c5da;overflow-wrap:anywhere;margin-top:6px}
          canvas{display:block;width:100%;aspect-ratio:1;background:#253343;border-radius:5px;image-rendering:pixelated}
          .notice{color:#ffc889}
          .details{margin:12px 0;font-size:.82rem;color:#cadbea}
          </style>
          </head>
          <body>
          <h1>Sanctuary of Aden V10 · SPR 원본 모션 비교</h1>
          <p>이 HTML 하나에 V9에서 검증한 원본 SPR 시트가 포함돼 있습니다. 외부 이미지 파일이나 네트워크 연결이 필요하지 않습니다.</p>
          <p class="notice">8개 슬롯은 비교용 서브 ID 묶음입니다. 실제 방향·대기·공격·피격·사망 동작으로 확정한 것이 아닙니다. 재생 간격도 원본 타이밍이 아닙니다.</p>

          <div class="toolbar">
          <label class="field">스프라이트 ID<select id="actor"></select></label>
          <label class="field">PAK 원본<select id="package"></select></label>
          <label class="field">8개 슬롯 묶음<select id="band"></select></label>
          <label class="field">중복 비교 서브 ID<select id="subid"></select></label>
          </div>

          <div class="controls">
          <button id="play">일시정지</button>
          <button id="prev">이전 프레임</button>
          <button id="next">다음 프레임</button>
          <label>간격 <input id="speed" type="range" min="80" max="600" step="20" value="180"></label>
          <span id="clock">180 ms</span>
          <span id="frame">0</span>
          </div>

          <div class="details" id="details"></div>

          <h2>원본 서브 ID 8슬롯 동시 비교</h2>
          <div class="grid" id="slots"></div>

          <h2>같은 서브 ID의 PAK별 원본</h2>
          <div class="grid" id="comparisons"></div>

          <h2>동작 검증 결과 임시 기록</h2>
          <p>확인 전에는 동작을 자동으로 지정하지 않습니다. 아래 표기는 사용자가 확인한 후보를 별도 JSON으로 내보내는 용도입니다.</p>

          <div class="toolbar">
          <label class="field">후보 동작
          <select id="action">
          <option value="">미확정</option>
          <option value="idle">대기 후보</option>
          <option value="walk">이동 후보</option>
          <option value="attack">공격 후보</option>
          <option value="damage">피격 후보</option>
          <option value="death">사망 후보</option>
          <option value="magic">마법 후보</option>
          <option value="other">기타 동작</option>
          </select>
          </label>
          <button id="save">현재 그룹 임시 기록</button>
          <button id="export">기록한 후보 JSON 저장</button>
          </div>

          <script type="application/json" id="data">__DATA__</script>
          <script>
          'use strict';

          const DATA=JSON.parse(document.getElementById('data').textContent);
          const rows=DATA.entries;
          const $=id=>document.getElementById(id);
          const actor=$('actor');
          const pack=$('package');
          const band=$('band');
          const subid=$('subid');

          const images=new Map();
          const labels={};

          let counter=0;
          let playing=true;
          let interval=180;
          let last=performance.now();

          function option(el,value,label){
            const item=document.createElement('option');
            item.value=String(value);
            item.textContent=label;
            el.append(item);
          }

          function activeRows(){
            return rows.filter(r=>r.actor===Number(actor.value));
          }

          function setupActors(){
            actor.replaceChildren();
            DATA.actors.forEach(id=>{
              const count=rows.filter(r=>r.actor===id).length;
              option(actor,id,`${id} (${count}종 원본)`);
            });
            if(DATA.actors.length)setupPacks();
          }

          function setupPacks(){
            pack.replaceChildren();
            option(pack,'ALL','전체 PAK 비교');
            const names=[...new Set(activeRows().map(r=>r.package))].sort();
            names.forEach(name=>option(pack,name,name));
            setupBands();
          }

          function visibleRows(){
            return activeRows().filter(r=>
              pack.value==='ALL'||r.package===pack.value
            );
          }

          function setupBands(){
            band.replaceChildren();
            const starts=[...new Set(
              visibleRows().map(r=>Math.floor(r.sub/8)*8)
            )].sort((a,b)=>a-b);
            starts.forEach(start=>option(band,start,`${start} ~ ${start+7}`));
            setupSubs();
            renderSlots();
          }

          function setupSubs(){
            subid.replaceChildren();
            const ids=[...new Set(activeRows().map(r=>r.sub))]
              .sort((a,b)=>a-b);
            ids.forEach(id=>option(subid,id,String(id)));
            if(ids.includes(Number(band.value)))subid.value=String(band.value);
            renderComparison();
          }

          function getImage(row){
            if(!images.has(row.sheet)){
              const img=new Image();
              img.onload=drawAll;
              img.src=row.sheet;
              images.set(row.sheet,img);
            }
            return images.get(row.sheet);
          }

          function card(row,title){
            const node=document.createElement('div');
            node.className='card';

            const head=document.createElement('div');
            head.className='heading';
            head.textContent=title;

            const canvas=document.createElement('canvas');
            canvas.width=240;
            canvas.height=240;

            const meta=document.createElement('div');
            meta.className='meta';

            if(row){
              meta.textContent=
                `${row.package} · ${row.renderedFrames}프레임 · 변화량 ${row.meanChange} · SHA ${row.sha256.slice(0,12)}`;
              node._row=row;
            }else{
              meta.textContent='해당 서브 ID의 원본 없음';
            }

            node.append(head,canvas,meta);
            return node;
          }

          function renderSlots(){
            $('slots').replaceChildren();
            const base=Number(band.value);

            for(let i=0;i<8;i++){
              const n=base+i;
              const matches=visibleRows()
                .filter(r=>r.sub===n)
                .sort((a,b)=>a.package.localeCompare(b.package));

              const title=`서브 ${n}`+
                (matches.length>1?` · 원본 ${matches.length}종`:'');

              const node=card(matches[0]||null,title);

              node.onclick=()=>{
                if([...subid.options].some(o=>o.value===String(n))){
                  subid.value=String(n);
                  renderComparison();
                }
              };

              $('slots').append(node);
            }

            const group=DATA.bands.filter(r=>
              r.sprite_id===Number(actor.value) &&
              r.band_start===Number(band.value) &&
              (pack.value==='ALL'||r.package===pack.value)
            );

            $('details').textContent=
              `ID ${actor.value} · 슬롯 ${band.value}~${Number(band.value)+7} · `+
              `PAK 그룹 ${group.length}개 · 원본 타이밍 미확정`;

            counter=0;
            drawAll();
          }

          function renderComparison(){
            $('comparisons').replaceChildren();

            activeRows()
              .filter(r=>r.sub===Number(subid.value))
              .sort((a,b)=>a.package.localeCompare(b.package))
              .forEach(row=>{
                $('comparisons').append(card(row,
                  `${row.package} / ${row.sub}`
                ));
              });

            drawAll();
          }

          function drawAll(){
            document.querySelectorAll('.card').forEach(node=>{
              const canvas=node.querySelector('canvas');
              const ctx=canvas.getContext('2d');
              ctx.clearRect(0,0,240,240);

              const row=node._row;
              if(!row)return;

              const image=getImage(row);

              if(!image.complete||!image.naturalWidth)return;

              const frame=counter%row.renderedFrames;
              const sx=(frame%row.cols)*row.cellW;
              const sy=Math.floor(frame/row.cols)*row.cellH;
              const scale=Math.min(240/row.cellW,240/row.cellH,3);
              const width=row.cellW*scale;
              const height=row.cellH*scale;

              ctx.imageSmoothingEnabled=false;

              ctx.drawImage(
                image,
                sx,sy,row.cellW,row.cellH,
                (240-width)/2,(240-height)/2,width,height
              );
            });

            $('frame').textContent=`프레임 ${counter}`;
          }

          actor.onchange=setupPacks;
          pack.onchange=setupBands;
          band.onchange=()=>{
            setupSubs();
            renderSlots();
          };
          subid.onchange=renderComparison;

          $('play').onclick=()=>{
            playing=!playing;
            $('play').textContent=playing?'일시정지':'재생';
          };

          $('prev').onclick=()=>{
            counter=Math.max(0,counter-1);
            drawAll();
          };

          $('next').onclick=()=>{
            counter++;
            drawAll();
          };

          $('speed').oninput=e=>{
            interval=Number(e.target.value);
            $('clock').textContent=interval+' ms';
          };

          $('save').onclick=()=>{
            const key=`${actor.value}|${pack.value}|${band.value}`;
            labels[key]={
              sprite_id:Number(actor.value),
              package:pack.value,
              subid_band_start:Number(band.value),
              subid_band_end:Number(band.value)+7,
              candidate_action:$('action').value||null,
              verification:'USER_MARKED_UNVERIFIED',
              original_frame_timing:null,
              original_direction_mapping:null,
              actual_package_precedence:null
            };
            $('details').textContent=
              `현재 그룹 후보 기록 완료 · ${key}`;
          };

          $('export').onclick=()=>{
            const content=JSON.stringify({
              version:'V10',
              type:'VISUAL_CANDIDATE_MAPPING',
              verified_by_original_action_metadata:false,
              entries:Object.values(labels)
            },null,2);

            const blob=new Blob(
              [content],
              {type:'application/json'}
            );

            const url=URL.createObjectURL(blob);
            const link=document.createElement('a');
            link.href=url;
            link.download='sanctuary-v10-action-candidates.json';
            link.click();
            URL.revokeObjectURL(url);
          };

          function tick(now){
            if(playing&&now-last>=interval){
              counter++;
              last=now;
              drawAll();
            }
            requestAnimationFrame(tick);
          }

          setupActors();
          requestAnimationFrame(tick);
          </script>
          </body>
          </html>'''

          html = html.replace(
              "__DATA__", encoded
          )

          (REPORT / "Sanctuary-V10-Mobile-Motion-Lab.html").write_text(
              html,
              encoding="utf-8"
          )

          report_lines = [
              "Sanctuary of Aden V10",
              "",
              f"Full sprite records: {len(all_sprites)}",
              f"Sprite ID groups: {len(actors)}",
              f"All PAK/subid bands: {len(band_rows)}",
              f"V9 PNG variants: {len(rendered)}",
              f"Verified image sheets: {len(display_entries)}",
              f"Individual rendered frames analyzed: {len(feature_rows)}",
              f"Image errors: {len(image_errors)}",
              "",
              "Action labels are not inferred from sub ID order.",
              "Package ordering is not considered client priority.",
              "All eight-slot groups are comparison structures only.",
              "Original animation timing remains unverified."
          ]

          (REPORT / "REPORT.txt").write_text(
              "\n".join(report_lines) + "\n",
              encoding="utf-8"
          )

          print("=== V10 SUMMARY ===")
          print(json.dumps(
              summary,
              ensure_ascii=False,
              indent=2
          ))

          summary_path=os.environ.get(
              "GITHUB_STEP_SUMMARY"
          )

          if summary_path:
              with open(
                  summary_path,
                  "a",
                  encoding="utf-8"
              ) as f:
                  f.write("\n".join(report_lines)+"\n")

          if not display_entries:
              raise SystemExit(
                  "No original SPR images available"
              )

          if image_errors:
              raise SystemExit(
                  "V9 sprite image validation failed"
              )

          PY

      - name: Upload V10 all-ID reports and offline motion lab
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-V10-Full-SPR-Structure-and-Motion-Lab
          path: reports/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
