          bytes=Base64.strict_decode64(encoded.gsub(/\s+/,'')).bytes
          rows=bytes.each_slice(3).to_a

          raise '492 entries required' unless rows.size==492
          raise '125 unique names required' unless names.size==125
          raise 'Invalid reference name index' unless rows.all?{|r|r.size==3 && r[2]<names.size}
          raise 'Duplicate map and EV reference' unless rows.map{|r|r[0..1]}.uniq.size==492
          raise 'Expected 36 source maps' unless rows.map{|r|r[0]}.uniq.size==36

          paths={}
          Dir.glob('site/knight/gameasync/Data/**/*Map*.rxdata').each do |path|
            match=File.basename(path).match(/Map(\d+)\.rxdata$/i)
            next unless match
            id=match[1].to_i
            paths[id]=path if !paths[id] || File.size(path)>File.size(paths[id])
          end

          raise 'No RPG Maker maps found' if paths.empty?

          cache={}
          results=[]

          rows.each_with_index do |ref,index|
            map_id,event_id,name_id=ref
            issues=[]
            event=nil

            if paths[map_id]
              unless cache.key?(map_id)
                begin
                  cache[map_id]=Marshal.load(File.binread(paths[map_id]))
                rescue => e
                  cache[map_id]=nil
                  warn "MAP_LOAD_ERROR #{map_id}: #{e.message}"
                end
              end

              event=(iv(cache[map_id],:events)||{})[event_id]
              issues << 'EVENT_NOT_FOUND' unless event
            else
              issues << 'MAP_NOT_FOUND'
            end

            graphics=[]

            if event
              (iv(event,:pages)||[]).each do |page|
                main=utf(iv(iv(page,:graphic),:character_name)).strip
                graphics << main unless main.empty?

                routes=[iv(page,:move_route)]
                (iv(page,:list)||[]).each do |cmd|
                  next unless iv(cmd,:code).to_i==209
                  routes << (iv(cmd,:parameters)||[])[1]
                end

                routes.compact.each do |route|
                  (iv(route,:list)||[]).each do |move|
                    next unless iv(move,:code).to_i==41
                    alt=utf((iv(move,:parameters)||[])[0]).strip
                    graphics << alt unless alt.empty?
                  end
                end
              end
            end

            graphics.uniq!
            issues << 'NO_PAGE_GRAPHIC' if event && graphics.empty?

            results << {
              index:index,
              map_id:map_id,
              event_id:event_id,
              monster:names[name_id],
              actual_event_name:utf(iv(event,:name)),
              graphics:graphics,
              issues:issues
            }
          end

          File.write('reports/events.json',JSON.generate(results))
          puts "V23_SOURCE_492_EVENTS #{results.size}"
          puts "V23_SOURCE_MAP_FILES #{paths.size}"
          RB
          ruby /tmp/events.rb

      - name: Create shared sprite families and four-direction GIFs
        run: |
          set -euo pipefail
          cat > /tmp/motions.py <<'PY'
          from pathlib import Path
          from collections import defaultdict
          from io import BytesIO
          from PIL import Image
          import base64
          import hashlib
          import unicodedata
          import json
          import csv

          root=Path('site/knight/gameasync/Graphics/Characters')
          report=Path('reports')
          rows=json.loads((report/'events.json').read_text(encoding='utf-8'))

          def normalize(name):
              value=str(name).replace('\\','/').split('/')[-1]
              if value.lower().endswith('.png'):
                  value=value[:-4]
              return unicodedata.normalize('NFC',value).casefold()

          paths={}
          for p in root.rglob('*'):
              if p.is_file() and p.suffix.lower()=='.png':
                  paths.setdefault(normalize(p.stem),p)

          if not paths:
              raise RuntimeError('Original character PNG files missing')

          def gif(frames,delay=150):
              indexed=[]
              for frame in frames:
                  rgba=frame.convert('RGBA')
                  palette=rgba.convert('RGB').quantize(colors=255)
                  transparent=rgba.getchannel('A').point(
                      lambda a:255 if a<128 else 0
                  )
                  palette.paste(255,mask=transparent)
                  indexed.append(palette)

              buf=BytesIO()
              indexed[0].save(
                  buf,format='GIF',save_all=True,
                  append_images=indexed[1:],
                  duration=delay,loop=0,
                  transparency=255,disposal=2,
                  optimize=False
              )
              return base64.b64encode(buf.getvalue()).decode('ascii')

          assets={}
          invalid={}
          file_hashes={}

          for row in rows:
              row['primary_asset']=''
              row['missing_files']=[]

              for name in row['graphics']:
                  file=paths.get(normalize(name))

                  if file is None:
                      row['missing_files'].append(name)
                      continue

                  if str(file) in invalid:
                      continue

                  try:
                      with Image.open(file) as original:
                          sheet=original.convert('RGBA')

                      w,h=sheet.size
                      if w<8 or h<8 or w%4 or h%4:
                          invalid[str(file)]='NOT_4X4'
                          continue

                      cw,ch=w//4,h//4
                      if cw>512 or ch>512:
                          invalid[str(file)]='CELL_TOO_LARGE'
                          continue

                      if str(file) in file_hashes:
                          sha=file_hashes[str(file)]
                      else:
                          sha=hashlib.sha256(
                              f'{w}x{h}:'.encode()+sheet.tobytes()
                          ).hexdigest()
                          file_hashes[str(file)]=sha

                      if sha not in assets:
                          motions={}
                          static=[]

                          for direction in range(4):
                              frames=[
                                  sheet.crop((
                                      x*cw,direction*ch,
                                      (x+1)*cw,(direction+1)*ch
                                  ))
                                  for x in range(4)
                              ]

                              if len({
                                  hashlib.sha256(f.tobytes()).digest()
                                  for f in frames
                              })==1:
                                  static.append(direction)

                              motions[str(direction)]={
                                  'wait':gif([frames[0]],220),
                                  'walk':gif(frames,150)
                              }

                          alpha=sheet.getchannel('A')
                          extrema=alpha.getextrema()
                          silhouette=''
                          if extrema[0]<128 and extrema[1]>=128:
                              mask=alpha.point(
                                  lambda a:255 if a>=128 else 0
                              )
                              silhouette=hashlib.sha256(
                                  f'{w}x{h}:'.encode()+mask.tobytes()
                              ).hexdigest()

                          assets[sha]={
                              'source_files':[],
                              'size':[w,h],
                              'cell_size':[cw,ch],
                              'silhouette':silhouette,
                              'static_directions':static,
                              'motions':motions
                          }

                      if file.stem not in assets[sha]['source_files']:
                          assets[sha]['source_files'].append(file.stem)

                      row['primary_asset']=sha
                      break

                  except Exception as exc:
                      invalid[str(file)]=str(exc)

              if not row['primary_asset']:
                  row['issues'].append('NO_USABLE_SPRITE')

              if row['missing_files']:
                  row['issues'].append('MISSING_GRAPHIC_FILE')

          families=defaultdict(list)
          silhouettes=defaultdict(set)

          for sha,asset in assets.items():
              if asset['silhouette']:
                  silhouettes[asset['silhouette']].add(sha)

          for row in rows:
              if row['primary_asset']:
                  families[row['primary_asset']].append(row)

          for row in rows:
              sha=row['primary_asset']
              group=families.get(sha,[])

              row['shared_monsters']=sorted({
                  m['monster'] for m in group
              })
              row['shared_events']=len(group)
              row['possible_same_shape']=[]

              if sha:
                  asset=assets[sha]
                  shape=asset['silhouette']
                  other_hashes=silhouettes.get(shape,set())-{sha}

                  candidates=[]
                  for other in other_hashes:
                      candidates.extend(
                          m['monster']
                          for m in families.get(other,[])
                      )

                  row['possible_same_shape']=sorted(set(candidates))

                  if asset['static_directions']:
                      row['issues'].append('STATIC_WALK_FRAMES')

              row['attack']='UNVERIFIED'
              row['death']='UNVERIFIED'

          with (report/'492-motion-audit.csv').open(
              'w',encoding='utf-8-sig',newline=''
          ) as f:
              writer=csv.writer(f)
              writer.writerow([
                  'index','map_id','event_id','monster',
                  'actual_event_name','original_graphic',
                  'shared_names','shared_EV',
                  'possible_same_shape','issues'
              ])

              for r in rows:
                  graphic=assets.get(
                      r['primary_asset'],{}
                  ).get('source_files',[])

                  writer.writerow([
                      r['index'],r['map_id'],r['event_id'],
                      r['monster'],r['actual_event_name'],
                      ' | '.join(graphic),
                      ' | '.join(r['shared_monsters']),
                      r['shared_events'],
                      ' | '.join(r['possible_same_shape']),
                      ' | '.join(r['issues'])
                  ])

          stats={
              'version':'V23',
              'events':len(rows),
              'unique_names':len({r['monster'] for r in rows}),
              'maps':len({r['map_id'] for r in rows}),
              'usable_graphics':len(assets),
              'linked_events':sum(
                  bool(r['primary_asset']) for r in rows
              ),
              'unlinked_events':sum(
                  not r['primary_asset'] for r in rows
              ),
              'shared_events':sum(
                  r['shared_events']>1 for r in rows
              ),
              'original_attack_mapping_verified':False,
              'original_death_mapping_verified':False,
              'modified_game_files':False,
              'invalid_sheets':invalid
          }

          assert stats['events']==492
          assert stats['unique_names']==125
          assert stats['maps']==36

          (report/'summary.json').write_text(
              json.dumps(stats,ensure_ascii=False,indent=2),
              encoding='utf-8'
          )

          html='''<!doctype html>
          <html lang="ko">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>SLKnight 492EV Motion Audit V23</title>
          <style>
          :root{font-family:system-ui,sans-serif;color-scheme:dark;background:#101821;color:#edf5ff}
          *{box-sizing:border-box}
          body{max-width:1200px;margin:auto;padding:12px}
          h1{font-size:1.35rem}
          h2{font-size:1rem}
          p{font-size:.83rem;color:#b8c9da;line-height:1.5}
          input,select,button{font:inherit;background:#263d51;color:#fff;border:1px solid #55718a;border-radius:8px;padding:9px}
          .layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:12px}
          .toolbar{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
          .entries{max-height:75vh;overflow:auto}
          .entry{width:100%;display:block;text-align:left;margin:3px 0}
          .entry:hover{background:#3a5771}
          .entry small{display:block;font-size:.72rem;opacity:.75}
          .motions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
          .panel{padding:9px;background:#1c2e40;border-radius:10px}
          .stage{height:175px;background:#31475b;border-radius:8px;display:flex;align-items:flex-end;justify-content:center}
          .stage img{max-height:165px;max-width:98%;object-fit:contain;image-rendering:pixelated}
          .warning{color:#ffd4a0}
          .directions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
          .dir{background:#223648;border-radius:8px;text-align:center;padding:5px;min-width:0}
          .dir img{width:100%;height:100px;object-fit:contain;image-rendering:pixelated}
          .small{font-size:.78rem;color:#b5cadd}
          @media(max-width:700px){
          .layout{grid-template-columns:1fr}
          .entries{max-height:210px}
          .stage{height:145px}
          .stage img{max-height:135px}
          .dir img{height:80px}
