name: build-slknight-web.yml | V4.8 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Restore V4.8 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45841521771
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify V4.8 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib,json,re
          root=Path('site')
          game=root/'knight/gameasync'
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(before)==6033,len(before)
          assert (root/'knight/js/sl-assets-v229r115.js').read_bytes().count(b"var version='V4.8';")==1
          scripts=game/'Data/Scripts.rxdata'
          digest=hashlib.md5(scripts.read_bytes()).hexdigest()
          mapping=(game/'mapping.js').read_bytes()
          assert re.findall(rb'Data/Scripts\.rxdata\?h=[0-9a-f]{32}',mapping)==[('Data/Scripts.rxdata?h='+digest).encode('ascii')]
          Path('/tmp/sl48-menu-before.json').write_text(json.dumps(before,sort_keys=True),'utf8')
          Path('/tmp/sl48-menu-md5.txt').write_text(digest,'ascii')
          print('PASS V4.8 baseline',len(before))
          PYTHON

      - name: Complete visible terrain before opening menus
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/sl48-menu-patch.rb <<'RUBY'
          # encoding: UTF-8
          require 'zlib'
          require 'digest'
          path=ARGV.fetch(0)
          rows=Marshal.load(File.binread(path))
          before=rows.map{|r|Marshal.dump(r)}
          expected={
            '해상도'=>'2da77cae6f97dbfc46e2183c7491ab353a5c6ae40e268d0e0630c835a0c7fcd4',
            '메뉴 투명화'=>'8e1d724ae244b29997a6d3137af7c2fc5e5fa9ea31b70f67125519eaecf7b3d9',
            'SLNativeLayerV241'=>'bfa846a424d2b327501897c8e0938ff29b38de4d845b878fb4967809775e8ef7'
          }

          expected.each do |name,sha|
            found=rows.select{|r|r && r[1].to_s.dup.force_encoding('UTF-8')==name}
            raise "Source count #{name}" unless found.size==1
            raise "Unexpected source #{name}" unless Digest::SHA256.hexdigest(Zlib::Inflate.inflate(found[0][2]))==sha
          end

          index=rows.index{|r|r && r[1].to_s.dup.force_encoding('UTF-8')=='메뉴 투명화'}
          row=rows[index]
          src=Zlib::Inflate.inflate(row[2]).force_encoding('UTF-8')

          raise 'Menu source encoding' unless src.valid_encoding?

          old="    @spriteset = Spriteset_Map.new\r\n"

          raise 'Menu creation anchor' unless src.scan(old).size==1 && src.scan('    create_spriteset').size==8 && src.scan('  include XRXS_MP7_Module').size==8

          insert=[
            '    if [47,48,49,50].include?($game_map.map_id)',
            '      4.times do',
            '        @spriteset.slti_update_terrain',
            '        @spriteset.sl_v241_refresh',
            '      end',
            '    end',
            '    @spriteset'
          ].join("\r\n")+"\r\n"

          updated=src.sub(old){old+insert}

          raise 'Unexpected menu change' unless updated.sub(old+insert,old)==src

          RubyVM::InstructionSequence.compile(updated)

          row[2]=Zlib::Deflate.deflate(updated)

          raise 'Unexpected script changes' unless rows.each_index.select{|i|Marshal.dump(rows[i])!=before[i]}==[index]

          raw=Marshal.dump(rows)
          File.binwrite(path,raw)

          raise 'Script roundtrip' unless Marshal.dump(Marshal.load(File.binread(path)))==raw

          puts 'PASS one menu script; eight existing menu scenes; unchanged renderer source'
          RUBY

          ruby -c /tmp/sl48-menu-patch.rb
          ruby /tmp/sl48-menu-patch.rb site/knight/gameasync/Data/Scripts.rxdata

      - name: Update script mapping and verify exact changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib,json,re

          root=Path('site')
          game=root/'knight/gameasync'

          old=Path('/tmp/sl48-menu-md5.txt').read_text('ascii')
          new=hashlib.md5((game/'Data/Scripts.rxdata').read_bytes()).hexdigest()

          assert new!=old

          mapper=game/'mapping.js'
          s=mapper.read_bytes()

          marker=b'Data/Scripts.rxdata?h='
          pattern=re.escape(marker)+rb'[0-9a-f]{32}'

          assert re.findall(pattern,s)==[marker+old.encode('ascii')]

          out=re.sub(pattern,lambda _:marker+new.encode('ascii'),s)

          assert out.replace(marker+new.encode('ascii'),marker+old.encode('ascii'),1)==s

          mapper.write_bytes(out)

          before=json.loads(Path('/tmp/sl48-menu-before.json').read_text('utf8'))

          after={
              str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          assert set(before)==set(after) and len(after)==6033

          changed={p for p in before if before[p]!=after[p]}

          allowed={
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/mapping.js'
          }

          assert changed==allowed,sorted(changed^allowed)

          print('PASS modified files',len(changed))
          print('PASS unchanged files',len(before)-len(changed))
          print('PASS V4.8 menu terrain')
          PYTHON

          node --check site/knight/gameasync/mapping.js

      - name: Upload V4.8 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
