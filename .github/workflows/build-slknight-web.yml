             val=384 if attr&1==0 else 385
             land+=1
             passed+=(val==384);blocked+=(val==385)
            elif inland and not covered:uncovered+=1
            struct.pack_into('<H',walk,2*(ty*W+tx),val)
          assert passed>0 and blocked>0
          (OUT/'map48-full-walk.bin').write_bytes(walk)
          report=dict(stats=stats,sourceFiles=790,sourceBlocks=602,sourceMissingBlocks=94,riverPoints=194,viewOnlyOriginalCells=44,generated_images=len(images),ground=288,upper=len(fg),gid=1,layer5_groups=len(ordered),collision_land_covered=land,collision_land_uncovered=uncovered,collision_passable=passed,collision_blocked=blocked,missing_original_tile_ids=sorted({k[1] for k in missing_tiles if k[0]=='file'}),missing_tile_count=len(missing_tiles),missing_tile_examples=missing_tiles.most_common(15),time_sec=round(time.time()-start,1))
          (OUT/'map48-build-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),'utf8')
