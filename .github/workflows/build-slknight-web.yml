      - name: V257 Refresh native resource hashes
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re

          root=Path('site')
          data=root/'knight/gameasync/Data'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          mapping=root/'knight/gameasync/mapping.js'
          text=mapping.read_text('utf-8')

          files=[
            data/(pre+'Map025.rxdata'),
            data/(pre+'CommonEvents.rxdata'),
            data/'Scripts.rxdata'
          ]

          for path in files:
            key='Data/'+path.name
            digest=hashlib.md5(
              path.read_bytes()
            ).hexdigest()

            pattern=(
              '('+re.escape(key)+
              r'\?h=)[0-9a-f]{32}'
            )

            text,count=re.subn(
              pattern,
              lambda m:m.group(1)+digest,
              text
            )

            assert count==1,(key,count)

          mapping.write_text(text,'utf-8')

          loader=root/'knight/js/sl-assets-v229r115.js'
          js=loader.read_text('utf-8')

          old="var version='V254';"

          assert js.count(old)==1

          loader.write_text(
            js.replace(
              old,"var version='V257';"
            ),
            'utf-8'
          )

          for rel in ('index.html','knight/index.html'):
            path=root/rel
            html=path.read_text('utf-8')

            assert 'V254' in html

            html=html.replace('V254','V257')
            html=html.replace('?v=v254','?v=v257')

            assert not re.search(
              r'\bid\s*=\s*["\']'
              r'(?:sl-build-version|slknight-v252-version)'
              r'["\']',
              html,re.I
            )

            path.write_text(html,'utf-8')

          print('PASS three native RXData hashes')
          print('PASS V257 internal cache version')
          print('PASS version labels stay removed')
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: V257 Verify original game protection
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json

          root=Path('site')

          before=json.loads(
            Path('build/before.json').read_text()
          )

          after={
            str(p.relative_to(root)):
            hashlib.sha256(p.read_bytes()).hexdigest()
            for p in root.rglob('*') if p.is_file()
          }

          pre=(
            'knight/gameasync/Data/'
            'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          )

          allowed={
            pre+'Map025.rxdata',
            pre+'CommonEvents.rxdata',
            'knight/gameasync/Data/Scripts.rxdata',
            'knight/gameasync/mapping.js',
            'knight/js/sl-assets-v229r115.js',
            'index.html',
            'knight/index.html'
          }

          changed={
            k for k in before
            if before[k]!=after.get(k)
          }

          assert changed==allowed,(
            'Unexpected modifications',
            sorted(changed^allowed)
          )

          assert set(before)==set(after)
          assert len(after)==5610

          for name in (
            pre+'Map016.rxdata',
            pre+'Map047.rxdata',
            'knight/assets/map-047-v241.pack'
          ):
            assert before[name]==after[name],name

          for action in (
            'Walk','Idle','Attack','AltAttack',
            'Spell','Hit','Death'
          ):
            name=(
              'knight/gameasync/Graphics/'
              'Characters/SLZenith'+action+'.png'
            )
            assert before[name]==after[name],name

          for name in (
            '이펙트마법',
            '물의 대정령 마법',
            '불의 대정령 마법',
            '땅의 대정령 마법'
          ):
            path=(
              'knight/gameasync/Graphics/'
              'Animations/'+name+'.png'
            )
            assert before[path]==after[path],path

          assert not (
            root/'knight/gameasync/Graphics/'
            'Characters/SLMonsterAtlas.png'
          ).exists()

          print('PASS Map016 Death Knight unchanged')
          print('PASS other maps and NPCs unchanged')
          print('PASS all 7 original motion sheets unchanged')
          print('PASS original magic effects unchanged')
          print('PASS no oversized atlas')
          print('PASS 5610 original asset paths retained')
          PY

