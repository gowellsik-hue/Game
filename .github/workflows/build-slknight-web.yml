
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V276.9
# BASE: Working V276.6, run 41607845656
# SOURCE: Original V247 SPR2807 images, run 41382471524
# NO NEW RGSS SCRIPT
# NO Game_Event.update OR Sprite_Character.update OVERRIDES
# NO SEPARATE ATTACK RNG
# NATIVE MOVEMENT AND SCREEN POSITION ONLY
# ATTACK: Original 5 normal / 1 strong / 1 magic branches
# DEATH: 17 original pictures, one native graphic command per frame
# POST-DEATH: Original 200-frame wait
# DELETE: Three private SLDK2F image copies
# KEEP: HP52, speed2, attack25, EXP, Adena, 20 drops

name: build-slknight-web.yml | V276.9 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: V276.9 Restore working V276.6
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41607845656
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V276.9 Retrieve original V247 sprite sheets
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41382471524
          name: github-pages
          github-token: ${{ github.token }}
          path: sprite-baseline

      - name: V276.9 Restore and protect original files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build sprites
          test -s baseline/artifact.tar
          test -s sprite-baseline/artifact.tar

          tar -xf baseline/artifact.tar -C site

          tar -xf sprite-baseline/artifact.tar -C sprites \
            ./knight/gameasync/Graphics/Characters/SLZenithWalk.png \
            ./knight/gameasync/Graphics/Characters/SLZenithIdle.png \
            ./knight/gameasync/Graphics/Characters/SLZenithAttack.png \
            ./knight/gameasync/Graphics/Characters/SLZenithAltAttack.png \
            ./knight/gameasync/Graphics/Characters/SLZenithSpell.png \
            ./knight/gameasync/Graphics/Characters/SLZenithHit.png \
            ./knight/gameasync/Graphics/Characters/SLZenithDeath.png

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json

          root=Path('site')
          before={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          assert len(before)==5606,(
              'Wrong V276.6 baseline',len(before)
          )
          assert 'V276.6' in (
              root/'knight/index.html'
          ).read_text('utf-8')

          for n in (1,2,3):
              p=root/'knight/gameasync/Graphics/Characters'/(
                  f'SLDK2F{n:02d}.png'
              )
              assert p.is_file(),p

          Path('build/before.json').write_text(
              json.dumps(before)
          )
          print('PASS original V276.6 inventory')
          PY

      - name: V276.9 Install native image conversion dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil
          python3 -c "from PIL import Image; print('Pillow ready')"

      - name: V276.9 Prepare aligned original Zenith images
        shell: bash
        run: |
          set -euo pipefail

          cat > build/images.py <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib,json

          source=Path(
              'sprites/knight/gameasync/Graphics/Characters'
          )
          target=Path(
              'site/knight/gameasync/Graphics/Characters'
          )

          specifications={
              'Walk':(
                  12,
                  '2a2ba621711dd02d754a7e5cd56954e4045c8609e9781e72a914bf5cec231cb4'
              ),
              'Idle':(
                  11,
                  'dc5d453681ba72f148bc5341d847c6baa007d448d223162a6fe857feffb1a4d0'
              ),
              'Attack':(
                  13,
                  '34fc818726622d37e5d93d31a805738ef283f87eef3d33ec46cd772fee15a425'
              ),
              'AltAttack':(
                  14,
                  'ee7664745495d2de0fa7ab7e132cbcedc525a3aa7c4537776b51927968a4dd90'
              ),
              'Spell':(
                  14,
                  'ffe2ae5755e7c3ed4a25cd70fa84afdff78069c5052ab6f20939d7c9849b2749'
              ),
              'Hit':(
                  2,
                  '9c2eaa2eb3f22a60266a4a8e0f6793a97592ce35b847d0469e2ee32190fa40e4'
              ),
              'Death':(
                  17,
                  'e5e59ced0d42ccf0f1e99ffa7bb8b3f7f4e1c80f3d880c0875d122c039ec009c'
              )
          }

          sheets={}
          sizes={}

          for action,(count,digest) in specifications.items():
              path=source/f'SLZenith{action}.png'
              assert path.is_file(),path
              assert hashlib.sha256(
                  path.read_bytes()
              ).hexdigest()==digest,(
                  'Original sprite SHA mismatch',action
              )

              image=Image.open(path).convert('RGBA')
              assert image.width%count==0,action
              assert image.height%4==0,action

              sheets[action]=image
              sizes[action]=(
                  image.width//count,
                  image.height//4
              )

          # Every graphic uses exactly the same cell canvas.
          # Native screen positioning is never overridden.
          W=max(v[0] for v in sizes.values())
          H=max(v[1] for v in sizes.values())

          def create(action,indices,filename):
              image=sheets[action]
              sw,sh=sizes[action]
              count=specifications[action][0]

              assert len(indices)==4,filename
              assert all(0<=i<count for i in indices)

              result=Image.new(
                  'RGBA',(W*4,H*4),(0,0,0,0)
              )

              for row in range(4):
                  for column,frame_number in enumerate(indices):
                      frame=image.crop((
                          frame_number*sw,
                          row*sh,
                          (frame_number+1)*sw,
                          (row+1)*sh
                      ))

                      result.alpha_composite(frame,(
                          column*W+(W-sw)//2,
                          row*H+(H-sh)
                      ))

              path=target/(filename+'.png')
              assert not path.exists(),(
                  'Image already exists',filename
              )
              result.save(path,optimize=True)

          def static(action,index,filename):
              # Native engine expects four columns.
              # Identical columns guarantee one fixed image,
              # regardless of the original animation pattern.
              create(action,[index]*4,filename)

          # Only the three private copies are deleted.
          # Original Death Knight images are untouched.
          for n in (1,2,3):
              old=target/f'SLDK2F{n:02d}.png'
              assert old.is_file(),old
              old.unlink()

          # Native 4-frame walking is handled by the original
          # engine, including position interpolation.
          create('Walk',[0,3,6,9],'SLZ9WALK')
          create('Attack',[0,4,8,12],'SLZ9ATK')
          create('Death',[13,14,15,16],'SLZ9DEAD')

          # One static native character graphic per original
          # animation picture. No RGSS playback script.
          prefixes={
              'Idle':'I',
              'Attack':'A',
              'AltAttack':'B',
              'Spell':'M',
              'Death':'D'
          }

          for action,prefix in prefixes.items():
              frames=specifications[action][0]
              for i in range(frames):
                  static(
                      action,i,
                      f'SLZ9{prefix}{i:02d}'
                  )

          created=sorted(
              p.stem for p in target.glob('SLZ9*.png')
          )

          assert len(created)==72,(
              'Wrong Zenith image count',len(created)
          )

          for n in (1,2,3):
              assert not (
                  target/f'SLDK2F{n:02d}.png'
              ).exists()

          Path('build/zenith-images.json').write_text(
              json.dumps({
                  'names':created,
                  'cell':[W,H],
                  'walk':'native four-column animation',
                  'attack':'native route per image',
                  'death':'17 separate native route images'
              },indent=2)
          )

          print('PASS 72 fixed-canvas Zenith images')
          print('PASS no private Death Knight image copies')
          PY

          python3 build/images.py

      - name: V276.9 Replace only private native event graphics
        shell: bash
        run: |
          set -euo pipefail

          cat > build/events.rb <<'RUBY'
          # encoding: UTF-8
          # Build-time RXData editing only.
          # No script is added to Scripts.rxdata.

          require 'json'

          module RPG
            class Map;end
            class CommonEvent;end
            class AudioFile;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end

          class Table
            def self._load(s)
              o=allocate
              o.instance_variable_set(:@raw,s)
              o
            end
            def _dump(n=0);@raw;end
          end

          class Tone
            def self._load(s)
              o=allocate
              o.instance_variable_set(:@raw,s)
              o
            end
            def _dump(n=0);@raw;end
          end
          class Color<Tone;end

          def iv(obj,name)
            obj.instance_variable_get('@'+name.to_s)
          end

          def put(obj,name,value)
            obj.instance_variable_set(
              '@'+name.to_s,value
            )
          end

          def ck(value,message)
            raise message unless value
          end

          def event_command(code,params=[],indent=0)
            result=RPG::EventCommand.allocate
            put(result,:code,code)
            put(result,:parameters,params)
            put(result,:indent,indent)
            result
          end

          def move_command(code,params=[])
            result=RPG::MoveCommand.allocate
            put(result,:code,code)
            put(result,:parameters,params)
            result
          end

          def graphic_route(names)
            result=RPG::MoveRoute.allocate
            put(result,:repeat,false)
            put(result,:skippable,true)

            commands=names.map do |name|
              move_command(41,[name,0])
            end

            commands << move_command(0,[])
            put(result,:list,commands)
            result
          end

          def show_frames(names,indent=0)
            event_command(
              209,[29,graphic_route(names)],indent
            )
          end

          SWAPS={
            'SLDK2F01'=>'SLZ9WALK',
            'SLDK2F02'=>'SLZ9ATK',
            'SLDK2F03'=>'SLZ9DEAD'
          }

          def replace_names(text)
            return text unless text.is_a?(String)
            result=text.dup
            SWAPS.each do |old,new_name|
              result=result.gsub(old,new_name)
            end
            result
          end

          def rewrite_route(route)
            return unless route.is_a?(RPG::MoveRoute)
            (iv(route,:list)||[]).each do |move|
              next unless iv(move,:code)==41
              params=iv(move,:parameters)
              next unless params.is_a?(Array)
              params[0]=replace_names(params[0])
            end
          end

          def rewrite_commands(list)
            (list||[]).each do |cmd|
              params=iv(cmd,:parameters)
              next unless params.is_a?(Array)
              params.map! do |value|
                if value.is_a?(String)
                  replace_names(value)
                elsif value.is_a?(RPG::MoveRoute)
                  rewrite_route(value)
                  value
                else
                  value
                end
              end
            end
          end

          ROOT='site/knight/gameasync/Data/'
          PRE='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          map_path=ROOT+PRE+'Map025.rxdata'
          ce_path=ROOT+PRE+'CommonEvents.rxdata'
          scripts_path=ROOT+'Scripts.rxdata'

          original_scripts=File.binread(scripts_path)

          map=Marshal.load(File.binread(map_path))
          common=Marshal.load(File.binread(ce_path))

          ck(common.length==1067,'Wrong native CE count')

          original_common=common.map do |ce|
            ce.nil? ? nil : Marshal.dump(ce)
          end

          events=iv(map,:events)
          boss=events.fetch(29)

          ck(
            iv(boss,:name)=='제니스 퀸',
            'Wrong Tower boss'
          )

          original_other_events={}
          events.each do |id,object|
            next if id==29
            original_other_events[id]=Marshal.dump(object)
          end

          pages=iv(boss,:pages)
          ck(pages.length==5,'Native five-page event missing')

          ck(
            iv(iv(pages[2],:condition),:variable_value)==52,
            'HP52 setting changed'
          )

          ck(
            iv(pages[2],:list).map{|c|iv(c,:code)}==
            [122,117,0],
            'Native death page changed'
          )

          ck(
            iv(iv(pages[3],:list)[2],:parameters)==[200],
            'Post-death wait changed'
          )

          # Rename only the private sprite references.
          # Do not change any original Game_Event method.
          pages.each do |page|
            graphic=iv(page,:graphic)
            put(
              graphic,:character_name,
              replace_names(iv(graphic,:character_name))
            )
            rewrite_route(iv(page,:move_route))
            rewrite_commands(iv(page,:list))
          end

          (1061..1066).each do |id|
            rewrite_commands(iv(common.fetch(id),:list))
          end

          # Death page starts on its original first frame.
          # Corpse page holds its last frame.
          put(
            iv(pages[2],:graphic),
            :character_name,'SLZ9D00'
          )
          put(
            iv(pages[3],:graphic),
            :character_name,'SLZ9D16'
          )

          # Native original attack:
          # 5 frames startup, CE1066, 20 frames recovery.
          # Add native image commands, NOT a new random branch.
          cycle=iv(common.fetch(1064),:list)

          ck(
            cycle.map{|c|iv(c,:code)}==
            [355,106,117,106,121,0],
            'Original attack cycle changed'
          )

          ck(
            iv(cycle[1],:parameters)==[5] &&
            iv(cycle[3],:parameters)==[20],
            'Original 25-frame attack timing changed'
          )

          ck(
            iv(cycle[2],:parameters)==[1066],
            'Original attack CE link changed'
          )

          first_idle=(0..4).map do |i|
            format('SLZ9I%02d',i)
          end

          # Five preparation pictures in original first 5 ticks.
          cycle.insert(1,show_frames(first_idle))

          # Return to native movement graphics after 20 ticks.
          cycle.insert(
            5,show_frames(['SLZ9WALK'])
          )

          ck(
            cycle.map{|c|iv(c,:code)}==
            [355,209,106,117,106,209,121,0],
            'Attack commands connected incorrectly'
          )

          # The original CE1066 determines physical/magic.
          # Its seven-way RNG and damage calculations remain.
          attack=iv(common.fetch(1066),:list)

          ck(
            attack.count do |c|
              iv(c,:code)==122 &&
              iv(c,:parameters)==[26,26,0,2,0,6]
            end==1,
            'Original 0..6 selector missing'
          )

          rest_idle=(5..10).map do |i|
            format('SLZ9I%02d',i)
          end

          # 6 idle + 14 attacking images = 20 ticks.
          # Normal physical has 13 source frames:
          # final picture is held for the remaining slot.
          attacks={
            50=>('A'..'A'),
            100=>('B'..'B'),
            150=>('M'..'M'),
            300=>('M'..'M')
          }

          prefixes={
            50=>'A',
            100=>'B',
            150=>'M',
            300=>'M'
          }

          updated=[]
          counts=Hash.new(0)

          attack.each do |cmd|
            updated << cmd

            next unless iv(cmd,:code)==122

            params=iv(cmd,:parameters)
            next unless params.is_a?(Array)
            next unless params[0,4]==[26,26,0,0]

            damage=params[4]
            next unless prefixes.key?(damage)

            counts[damage]+=1
            prefix=prefixes[damage]

            frames=(0...14).map do |i|
              source_index=(
                prefix=='A' ? [i,12].min : i
              )
              format('SLZ9%s%02d',prefix,source_index)
            end

            updated << show_frames(
              rest_idle+frames,
              iv(cmd,:indent)
            )
          end

          ck(
            [50,100,150,300].all?{|n|counts[n]==1},
            'Unexpected native attack damage branch layout'
          )

          ck(
            updated.count{|c|iv(c,:code)==209}>=4,
            'Native attack picture routes missing'
          )

          put(common.fetch(1066),:list,updated)

          # Original death reward CE1065.
          # Remove only its call to native DK death effect CE105.
          # Play seventeen original Zenith images once.
          reward=iv(common.fetch(1065),:list)

          ck(
            reward.length==245,
            'Original reward CE length changed'
          )

          ck(
            iv(reward[241],:code)==117 &&
            iv(reward[241],:parameters)==[105],
            'Expected native death FX105 missing'
          )

          ck(
            iv(reward[242],:code)==355,
            'Original 20-item reward command missing'
          )

          ck(
            iv(reward[243],:code)==123 &&
            iv(reward[243],:parameters)==['A',0],
            'Original self-switch A missing'
          )

          death_frames=(0...17).map do |i|
            format('SLZ9D%02d',i)
          end

          indent=iv(reward[241],:indent)

          reward[241]=show_frames(death_frames,indent)
          reward.insert(
            242,event_command(106,[17],indent)
          )

          ck(
            reward.length==246,
            'Unexpected death command length'
          )

          ck(
            iv(reward[244],:parameters)==['A',0],
            'Native self-switch order changed'
          )

          ck(
            !reward.any? do |cmd|
              iv(cmd,:code)==117 &&
              iv(cmd,:parameters)==[105]
            end,
            'Overlapping native DK death FX remains'
          )

          # No private Death Knight image name is allowed.
          ck(
            !Marshal.dump(boss).include?('SLDK2F'),
            'Private DK graphic remains on boss'
          )

          (1061..1066).each do |id|
            ck(
              !Marshal.dump(common[id]).include?('SLDK2F'),
              "Private DK graphic remains in CE#{id}"
            )
          end

          # All original common events remain byte-identical.
          (0..1060).each do |id|
            current=common[id]
            data=current.nil? ? nil : Marshal.dump(current)
            ck(
              data==original_common[id],
              "Original CE#{id} changed"
            )
          end

          # No other Tower monster or event is changed.
          original_other_events.each do |id,data|
            ck(
              Marshal.dump(events.fetch(id))==data,
              "Unrelated Map025 EV#{id} changed"
            )
          end

          ck(
            iv(iv(pages[3],:list)[2],:parameters)==[200],
            'Original post-death 200 changed'
          )

          ck(
            File.binread(scripts_path)==original_scripts,
            'Original Scripts.rxdata was changed'
          )

          File.binwrite(map_path,Marshal.dump(map))
          File.binwrite(ce_path,Marshal.dump(common))

          report={
            'version'=>'V276.9',
            'base'=>'V276.6',
            'new_rgss_scripts'=>0,
            'attack_random'=>'original 0..6',
            'attack_start'=>5,
            'attack_recovery'=>20,
            'death_route_frames'=>17,
            'post_death_wait'=>200,
            'test_hp'=>52,
            'normal_attack_source_frames'=>13,
            'strong_attack_source_frames'=>14,
            'magic_attack_source_frames'=>14,
            'original_common_events_unchanged'=>1061
          }

          File.write(
            'build/zenith-v2769.json',
            JSON.pretty_generate(report)
          )

          puts 'PASS no new RGSS script'
          puts 'PASS native attack damage and selector retained'
          puts 'PASS original 5+20 attack timing'
          puts 'PASS 17 native death image commands'
          puts 'PASS no duplicate death effect CE105'
          puts 'PASS original 200-frame post-death wait'
          puts 'PASS unrelated map events and CEs untouched'
          RUBY

          ruby -c build/events.rb
          ruby build/events.rb

      - name: V276.9 Register native character graphics
        shell: bash
        run: |
          set -euo pipefail

          cat > build/mapping.py <<'PY'
          from pathlib import Path
          import hashlib,re,json

          root=Path('site')
          game=root/'knight/gameasync'
          mapping=game/'mapping.js'

          text=mapping.read_text('utf-8')

          # Remove V276.6 private Death Knight sprite mappings.
          for n in (1,2,3):
              name=f'SLDK2F{n:02d}'
              pattern=(
                  r'^[ \t]*\["graphics/characters/'
                  +name.lower()+
                  r'", "Graphics/Characters/'
                  +name+
                  r'\.png\?h=[0-9a-f]{32}"\],\r?\n'
              )
              text,count=re.subn(
                  pattern,'',text,flags=re.MULTILINE
              )
              assert count==1,(
                  'Private DK image mapping not removed',name
              )

          names=json.loads(
              Path('build/zenith-images.json').read_text()
          )['names']

          assert len(names)==72

          anchor='];\n\nvar mapping = {}'
          assert text.count(anchor)==1,(
              'Original mapping anchor changed'
          )

          entries=[]
          image_urls=[]

          for name in names:
              path=game/'Graphics/Characters'/(name+'.png')
              assert path.is_file(),name

              digest=hashlib.md5(
                  path.read_bytes()
              ).hexdigest()

              entries.append(
                  '["graphics/characters/'
                  +name.lower()+
                  '", "Graphics/Characters/'
                  +name+
                  '.png?h='+digest+'"],'
              )

              image_urls.append(
                  'gameasync/Graphics/Characters/'
                  +name+'.png?h='+digest
              )

          text=text.replace(
              anchor,
              '\n'+'\n'.join(entries)+'\n'+anchor
          )

          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          for filename in (
              pre+'Map025.rxdata',
              pre+'CommonEvents.rxdata'
          ):
              path=game/'Data'/filename
              digest=hashlib.md5(
                  path.read_bytes()
              ).hexdigest()

              pattern=(
                  '('+re.escape('Data/'+filename)
                  +r'\?h=)[0-9a-f]{32}'
              )

              text,count=re.subn(
                  pattern,
                  lambda m:m.group(1)+digest,
                  text
              )

              assert count==1,filename

          mapping.write_text(text,encoding='utf-8')

          # Keep the original loader, change its version only.
          loader=root/'knight/js/sl-assets-v229r115.js'
          contents=loader.read_text('utf-8')

          old="var version='V276.6';"
          assert contents.count(old)==1

          loader.write_text(
              contents.replace(
                  old,"var version='V276.9';"
              ),
              encoding='utf-8'
          )

          for relative in ('index.html','knight/index.html'):
              path=root/relative
              contents=path.read_text('utf-8')
              assert 'V276.6' in contents,relative

              contents=contents.replace(
                  'V276.6','V276.9'
              ).replace(
                  '?v=v276.6','?v=v276.9'
              )

              # Preload graphic files so they are not first
              # requested during the boss attack.
              if relative=='knight/index.html':
                  links='\n'.join(
                      '<link rel="preload" as="image" href="'
                      +url+'">'
                      for url in image_urls
                  )

                  match=re.search(
                      r'</head\s*>',contents,re.IGNORECASE
                  )

                  assert match,(
                      'HTML head for sprite preload missing'
                  )

                  contents=(
                      contents[:match.start()]
                      +links+'\n'
                      +contents[match.start():]
                  )

              path.write_text(
                  contents,encoding='utf-8'
              )

          assert 'SLDK2F' not in text

          print('PASS no private DK sprite URL')
          print('PASS 72 native Zenith graphic URLs')
          print('PASS original JS engine unchanged')
          print('PASS V276.9 cache labels')
          PY

          python3 build/mapping.py

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: V276.9 Verify minimal game changes
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib

          root=Path('site')

          before=json.loads(
              Path('build/before.json').read_text()
          )

          after={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          pre=(
              'knight/gameasync/Data/'
              'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          )

          allowed_changes={
              pre+'Map025.rxdata',
              pre+'CommonEvents.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html',
              'knight/index.html'
          }

          removed={
              'knight/gameasync/Graphics/Characters/'
              +f'SLDK2F{n:02d}.png'
              for n in (1,2,3)
          }

          asset_names=json.loads(
              Path('build/zenith-images.json').read_text()
          )['names']

          added={
              'knight/gameasync/Graphics/Characters/'
              +name+'.png'
              for name in asset_names
          }

          changed={
              p for p in before
              if p in after and before[p]!=after[p]
          }

          assert len(before)==5606
          assert len(after)==5675,(
              'Unexpected final inventory',len(after)
          )

          assert set(before)-set(after)==removed,(
              'Unexpected original file deletion'
          )

          assert set(after)-set(before)==added,(
              'Unexpected added file'
          )

          assert changed==allowed_changes,(
              'Unexpected existing-file changes',
              sorted(changed^allowed_changes)
          )

          # Original game scripts must stay byte-identical.
          scripts='knight/gameasync/Data/Scripts.rxdata'
          assert before[scripts]==after[scripts],(
              'New engine code was introduced'
          )

          # All existing original monster images stay intact.
          for filename,digest in before.items():
              if filename.startswith(
                  'knight/gameasync/Graphics/'
              ) and filename not in removed:
                  assert after[filename]==digest,(
                      'Original sprite modified',filename
                  )

          # Map016 Death Knight stays unchanged.
          assert (
              before[pre+'Map016.rxdata']==
              after[pre+'Map016.rxdata']
          )

          # No other map may change.
          for filename,digest in before.items():
              if (
                  filename.startswith(pre+'Map')
                  and filename!=pre+'Map025.rxdata'
              ):
                  assert after[filename]==digest,filename

          for filename in (
              'knight/js/drive.js',
              'knight/js/dpad.js',
              'knight/assets/map-047-v241.pack'
          ):
              assert before[filename]==after[filename],filename

          print('PASS no new game runtime scripts')
          print('PASS no movement engine changes')
          print('PASS original Death Knight preserved')
          print('PASS no private SLDK2F copies')
          print('PASS only Zenith event data and images changed')
          PY

      - name: V276.9 Publish
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
