
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V276.7.2
# BASE: successful V276.7.1, run 41790334490.
# BASE FILES: 5622 verified deployed game files.
# CHANGE: native Sprite_Character 4/8-frame selection.
# LEGACY: original 4-frame monsters unchanged.
# NEW: SLZQWalk and SL8_ prefixed graphics use 8 frames.
# DIRECTIONS: native 4 directions only.
# RUNTIME: one original Sprite_Character.update.
# REMOVE: queen-only duplicate update registration.
# KEEP: all existing combat, animations, drops and respawn.
# ROLLBACK: delete the single V276.7.2 patch step.
# SAFETY: no direct GitHub source modification.
# WARNING: runtime gameplay validation not yet performed.

name: build-slknight-web.yml | V276.7.2 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Restore verified V276.7.1 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41790334490
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify original V276.7.1 baseline
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p site build
          test -s baseline/artifact.tar
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          root=Path('site')
          files={
            str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
            for p in root.rglob('*') if p.is_file()
          }

          assert len(files)==5622,(
            'V276.7.1 baseline inventory mismatch',
            len(files)
          )

          data=root/'knight/gameasync/Data'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          for name in (
            'Scripts.rxdata',
            pre+'Map025.rxdata',
            pre+'Map019.rxdata',
            pre+'CommonEvents.rxdata',
            pre+'Animations.rxdata'
          ):
            assert (data/name).is_file(),name

          assert (
            root/'knight/gameasync/Graphics/Characters/'
            'SLZQWalk.png'
          ).is_file()

          for name in ('index.html','knight/index.html'):
            assert 'V276.7.1' in (
              root/name
            ).read_text('utf-8')

          Path('build/original_sha256.json').write_text(
            json.dumps(files),encoding='utf-8'
          )

          print('PASS V276.7.1 5622 files restored')
          print('PASS existing queen and native game retained')
          PY

      - name: V276.7.2 Native 4 and 8 frame branch
        shell: bash
        run: |
          set -euo pipefail

          cat > build/slwalk8.rb <<'SLWALK8_RUBY'
          require 'zlib'
          require 'fileutils'

          module RPG
            class Map;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class AudioFile;end
            class MoveRoute;end
            class MoveCommand;end
          end

          class Table
            def self._load(bytes)
              obj=allocate
              obj.instance_variable_set(:@raw,bytes)
              obj
            end
            def _dump(level=0)
              @raw
            end
          end

          class Tone
            def self._load(bytes)
              obj=allocate
              obj.instance_variable_set(:@raw,bytes)
              obj
            end
            def _dump(level=0)
              @raw
            end
          end

          class Color<Tone;end

          def check(value,message)
            raise message unless value
          end

          root='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          scripts_path=root+'Scripts.rxdata'
          map_path=root+pre+'Map025.rxdata'

          # ------------------------------------------
          # 1. Patch native Sprite_Character source.
          # No alias, no extra update, no timer.
          # ------------------------------------------

          script_before=File.binread(scripts_path)
          scripts=Marshal.load(script_before)

          check(
            scripts.length==137,
            'Original RGSS script count mismatch'
          )

          matches=scripts.each_index.select do |i|
            scripts[i][1]=='Sprite_Character'
          end

          check(
            matches.length==1,
            'Sprite_Character must occur once'
          )

          script_id=matches.first
          original=Zlib::Inflate.inflate(
            scripts[script_id][2]
          )

          code=original.dup

          width_anchor=
            /^([ \t]*)@cw[ \t]*=[ \t]*(?:self\.)?bitmap\.width[ \t]*\/[ \t]*4[ \t]*$/

          frame_anchor=
            /^([ \t]*)sx[ \t]*=[ \t]*@character\.pattern[ \t]*\*[ \t]*@cw[ \t]*$/

          check(
            code.scan(width_anchor).length==1,
            'Native frame-width anchor mismatch'
          )

          check(
            code.scan(frame_anchor).length==1,
            'Native frame-selection anchor mismatch'
          )

          # Calculate image layout only when the native
          # character bitmap is initialized or changed.

          code.sub!(width_anchor) do
            indent=$1
            [
              '@sl_walk8 = (',
              '  @character_name == "SLZQWalk" ||',
              '  @character_name[0,4] == "SL8_"',
              ')',
              '@cw = bitmap.width / (@sl_walk8 ? 8 : 4)'
            ].map{|line|indent+line}.join("\n")
          end

          # Preserve the original 4-frame pattern.
          # Only 8-frame characters use movement progress.

          code.sub!(frame_anchor) do
            indent=$1
            [
              'sx = if @sl_walk8',
              '  attacking = (',
              '    @character.respond_to?(:sl_attack_active?) &&',
              '    @character.sl_attack_active?',
              '  )',
              '  if @character.moving? && !attacking',
              '    rx = @character.instance_variable_get(:@real_x)',
              '    ry = @character.instance_variable_get(:@real_y)',
              '    if rx && ry',
              '      remaining = (',
              '        (@character.x * 128 - rx).abs +',
              '        (@character.y * 128 - ry).abs',
              '      )',
              '      progress = 128 - remaining',
              '      progress = 0 if progress < 0',
              '      progress = 127 if progress > 127',
              '      (progress / 16) * @cw',
              '    else',
              '      0',
              '    end',
              '  else',
              '    0',
              '  end',
              'else',
              '  @character.pattern * @cw',
              'end'
            ].map{|line|indent+line}.join("\n")
          end

          check(
            code!=original,
            'Native character source was not changed'
          )

          check(
            code.include?('@sl_walk8') &&
            code.include?('@character.pattern * @cw'),
            'Both frame branches were not preserved'
          )

          scripts[script_id][2]=Zlib::Deflate.deflate(code)

          File.binwrite(
            scripts_path,
            Marshal.dump(scripts)
          )

          saved=Marshal.load(File.binread(scripts_path))

          check(
            saved.length==137,
            'Patched RGSS inventory mismatch'
          )

          saved.each_with_index do |row,i|
            next if i==script_id
            check(
              row==Marshal.load(script_before)[i],
              'Unrelated original RGSS script changed'
            )
          end

          check(
            Zlib::Inflate.inflate(saved[script_id][2])==code,
            'Patched native script mismatch'
          )

          # ------------------------------------------
          # 2. Remove the old queen-only update hook.
          # The original 22 spawn commands remain.
          # ------------------------------------------

          map_before=File.binread(map_path)
          map=Marshal.load(map_before)

          events=map.instance_variable_get(:@events)

          queen=events.fetch(29)
          pages=queen.instance_variable_get(:@pages)

          check(
            pages.length==5,
            'Queen functional pages changed'
          )

          page0=pages[0]
          commands=page0.instance_variable_get(:@list)

          check(
            commands.length==23,
            'Original queen spawn command count mismatch'
          )

          old_hook=commands.first

          check(
            old_hook.instance_variable_get(:@code)==355,
            'Expected queen runtime installer not found'
          )

          text=old_hook.instance_variable_get(
            :@parameters
          )[0].to_s

          check(
            text.include?('class Sprite_Character') &&
            text.include?('slzq_v2767_original_update'),
            'Unexpected queen runtime installer'
          )

          commands.shift

          check(
            commands.length==22,
            'Original 22 spawn commands not restored'
          )

          page0.instance_variable_set(:@list,commands)

          File.binwrite(map_path,Marshal.dump(map))

          verify=Marshal.load(File.binread(map_path))
          saved_pages=verify.instance_variable_get(
            :@events
          ).fetch(29).instance_variable_get(:@pages)

          check(
            saved_pages[0].instance_variable_get(
              :@list
            ).length==22,
            'Duplicate queen runtime remains'
          )

          check(
            saved_pages.map{|p|
              p.instance_variable_get(:@list).length
            }==[22,1,217,2,20],
            'Original queen event structure damaged'
          )

          puts 'PASS native 4/8-frame selection'
          puts 'PASS original Sprite_Character.update retained'
          puts 'PASS no additional update method'
          puts 'PASS original 4-frame pattern preserved'
          puts 'PASS old queen-only renderer removed'
          puts 'PASS original queen combat pages preserved'

          SLWALK8_RUBY

          ruby -c build/slwalk8.rb
          ruby build/slwalk8.rb

          # ------------------------------------------
          # 3. Update only changed asset hashes and
          #    display versions.
          # ------------------------------------------

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,json

          root=Path('site')
          game=root/'knight/gameasync'
          data=game/'Data'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          mapping=game/'mapping.js'
          content=mapping.read_text('utf-8')

          for name in (
            'Scripts.rxdata',
            pre+'Map025.rxdata'
          ):
            path=data/name
            digest=hashlib.md5(path.read_bytes()).hexdigest()

            token=re.escape('Data/'+name)+r'\?h=[0-9a-f]{32}'

            content,count=re.subn(
              token,
              'Data/'+name+'?h='+digest,
              content
            )

            assert count==1,(
              'Expected exactly one original mapping',
              name,count
            )

          mapping.write_text(content,encoding='utf-8')

          loader=root/'knight/js/sl-assets-v229r115.js'
          text=loader.read_text('utf-8')

          old="var version='V276.7.1';"
          new="var version='V276.7.2';"

          assert text.count(old)==1
          loader.write_text(
            text.replace(old,new),encoding='utf-8'
          )

          for name in (
            'index.html',
            'knight/index.html'
          ):
            path=root/name
            text=path.read_text('utf-8')

            assert 'V276.7.1' in text,name

            text=(
              text.replace('V276.7.1','V276.7.2')
                  .replace('?v=v276.7.1','?v=v276.7.2')
            )

            path.write_text(text,encoding='utf-8')

          old_hashes=json.loads(
            Path('build/original_sha256.json').read_text('utf-8')
          )

          current={
            str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
            for p in root.rglob('*') if p.is_file()
          }

          assert len(current)==5622
          assert set(current)==set(old_hashes),(
            'Unexpected files added or deleted'
          )

          changed={
            name for name in old_hashes
            if current[name]!=old_hashes[name]
          }

          expected={
            'knight/gameasync/Data/Scripts.rxdata',
            'knight/gameasync/Data/'+pre+'Map025.rxdata',
            'knight/gameasync/mapping.js',
            'knight/js/sl-assets-v229r115.js',
            'index.html',
            'knight/index.html'
          }

          assert changed==expected,(
            'Unexpected original file modification',
            changed^expected
          )

          print('PASS six expected generated files changed')
          print('PASS all remaining 5616 files unchanged')
          print('PASS V276.7.2 display version')
          print('PASS native Script and Map025 hashes updated')
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Publish verified draft game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
