name: build-slknight-web.yml | V4.14 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Restore V4.13 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45953980268
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify V4.13 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib,json

          root=Path('site')

          before={
              p.relative_to(root).as_posix():{
                  'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                  'md5':hashlib.md5(p.read_bytes()).hexdigest()
              }
              for p in root.rglob('*') if p.is_file()
          }

          assert len(before)==6085,len(before)

          assert (
              root/'knight/js/sl-assets-v229r115.js'
          ).read_bytes().count(
              b"var version='V4.13';"
          )==1

          for name in ('index.html','knight/index.html'):
              assert b'V4.13' in (root/name).read_bytes(),name

          Path('/tmp/sl414-before.json').write_text(
              json.dumps(before,sort_keys=True),'utf8'
          )

          print('PASS V4.13 baseline',len(before))
          PYTHON

      - name: Connect designated items and native HUD
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl414-runtime.rb <<'RUBY'
          # encoding: UTF-8

          module SL414
            HEAL=__HEAL__
            IDS=(HEAL.keys+[1006]).sort
            SLOTS=[4,5,6]

            def self.eligible?(item)
              item.is_a?(RPG::Item) && IDS.include?(item.id)
            end

            def self.store
              h=$game_party.instance_variable_get(:@sl414_items)
              unless h.is_a?(Hash)
                h={}
                $game_party.instance_variable_set(:@sl414_items,h)
              end
              h
            end

            def self.entry(id,item)
              (store[id] || {})[item]
            end

            def self.count(id,item)
              r=entry(id,item)
              r ? r[0] : 0
            end

            def self.member(id)
              a=$game_actors[id]
              a if a &&
                a.instance_variable_get(:@sl43_hired) &&
                $game_party.actors.include?(a)
            end

            def self.active_ids
              SLOTS.select{|id|a=member(id);a && a.hp>0}
            end

            def self.selected(item)
              active_ids.select{|id|entry(id,item)}
            end

            def self.retained?(item)
              IDS.include?(item) &&
                SLOTS.any?{|id|entry(id,item)}
            end

            def self.owner(item)
              $game_party.item_number(item)
            end

            def self.capacity(item)
              [$item_maximum.to_i-owner(item),0].max
            end

            def self.set_owner(item,n)
              $game_party.instance_variable_get(:@items)[item]=n
            end

            def self.designate(id,item)
              return false unless IDS.include?(item) &&
                active_ids.include?(id)

              (store[id]||={})[item] ||=
                [0,HEAL.key?(item)]

              true
            end

            def self.give(id,item,n)
              return false unless n>0 &&
                n<=owner(item) &&
                designate(id,item)

              set_owner(item,owner(item)-n)
              entry(id,item)[0]+=n

              true
            end

            def self.recall(id,item,n)
              r=entry(id,item)

              return false unless r &&
                n>0 &&
                n<=r[0] &&
                n<=capacity(item)

              $game_party.gain_item(item,n)
              r[0]-=n

              true
            end

            def self.undesignate(id,item)
              r=entry(id,item)

              return false unless r

              return false if r[0]>0 &&
                !recall(id,item,r[0])

              store[id].delete(item)

              true
            end

            def self.equalize(item)
              ids=selected(item)
              return false if ids.empty?

              total=owner(item)+ids.inject(0){
                |sum,id|sum+count(id,item)
              }

              share=total/(ids.size+1)
              own=total-share*ids.size

              return false if own>owner(item) &&
                own-owner(item)>capacity(item)

              set_owner(item,own)
              ids.each{|id|entry(id,item)[0]=share}

              true
            end

            def self.buy(item,n)
              ids=IDS.include?(item) ? selected(item) : []

              return $game_party.gain_item(item,n) if ids.empty?

              share=n/(ids.size+1)

              $game_party.gain_item(
                item,n-share*ids.size
              )

              ids.each{|id|entry(id,item)[0]+=share}
            end

            def self.ammo(a)
              r=entry(a.id,1006) if SLOTS.include?(a.id)
              r ? r[0] : owner(1006)
            end

            def self.spend_arrow(a)
              r=entry(a.id,1006) if SLOTS.include?(a.id)

              if r
                r[0]-=1 if r[0]>0
              else
                $game_party.lose_item(1006,1)
              end
            end

            def self.drink(a,e)
              return unless a.hp>0 &&
                a.hp*100<=a.maxhp*70

              now=Graphics.frame_count

              last=a.instance_variable_get(
                :@sl414_potion_frame
              )

              wait=a.instance_variable_get(
                :@sl414_potion_wait
              ).to_i

              return if last &&
                now>=last &&
                now-last<wait

              missing=a.maxhp-a.hp

              ids=HEAL.keys.select do |id|
                r=entry(a.id,id)
                r && r[1] && r[0]>0
              end

              return if ids.empty?

              id=ids.min_by do |i|
                h=HEAL[i][0]

                [
                  h>=missing ? 0 : 1,
                  (h-missing).abs,
                  HEAL[i][1],
                  i
                ]
              end

              hp,wait,anim=HEAL[id]

              armor=a.armor_ids

              ring=(645..653).find{
                |i|armor.include?(i)
              }

              if ring
                rate=(ring-644)*2
                hp+=hp*rate/100+rate
              end

              entry(a.id,id)[0]-=1

              a.hp+=hp

              a.instance_variable_set(
                :@sl414_potion_frame,now
              )

              a.instance_variable_set(
                :@sl414_potion_wait,wait*2
              )

              e.animation_id=anim
            end

            def self.draw(w)
              return unless w &&
                !w.disposed? &&
                w.contents &&
                $game_party &&
                $game_actors

              w.visible=!$game_temp.message_window_showing

              return unless w.visible

              actors=[$game_actors[1]]+
                SLOTS.map{|id|member(id)}

              info=actors.map do |a|
                next nil unless a

                items=a.id==1 ? [] :
                  IDS.select{
                    |i|entry(a.id,i)
                  }.map{
                    |i|[i,count(a.id,i),entry(a.id,i)[1]]
                  }

                extra=a.id==1 ? [
                  10-a.pdef,
                  a.mdef,
                  $game_switches[171]||$game_switches[368],
                  $game_switches[172]
                ] : []

                [
                  a.name,
                  a.level,
                  a.hp,
                  a.maxhp,
                  a.sp,
                  a.maxsp,
                  (a.exp_rate*1000).to_i,
                  items,
                  extra
                ]
              end

              return if w.instance_variable_get(
                :@sl414_info
              )==info

              w.instance_variable_set(
                :@sl414_info,info
              )

              b=w.contents
              b.clear

              b.font.name='NanumGothic'
              b.font.bold=false

              info.each_with_index do |v,i|
                x=122+i*86
                y=365

                b.fill_rect(
                  x,y,85,98,
                  Color.new(20,18,16,255)
                )

                b.fill_rect(
                  x+85,y,1,98,
                  Color.new(110,94,76,220)
                )

                next unless v

                name,lv,hp,mhp,mp,mmp,xp,items,extra=v

                b.font.size=11
                b.font.color=Color.new(240,224,190)

                b.draw_text(
                  x+2,y,82,13,
                  "#{name} Lv.#{lv}",1
                )

                [
                  [hp,mhp,'HP',Color.new(130,44,40)],
                  [mp,mmp,'MP',Color.new(48,75,132)]
                ].each_with_index do |q,j|

                  n,m,label,c=q
                  yy=y+14+j*13

                  b.fill_rect(
                    x+2,yy,81,12,
                    Color.new(35,31,30)
                  )

                  b.fill_rect(
                    x+2,yy,
                    [[81*n/[m,1].max,0].max,81].min,
                    12,c
                  )

                  b.font.color=Color.new(255,255,255)

                  b.draw_text(
                    x+2,yy,81,12,
                    "#{label} #{n}/#{m}",1
                  )
                end

                b.font.color=Color.new(226,210,150)

                b.draw_text(
                  x+2,y+40,82,12,
                  sprintf('EXP %.1f%%',xp/10.0),1
                )

                if i==0
                  b.font.color=Color.new(220,220,220)

                  b.draw_text(
                    x+2,y+55,82,13,
                    "AC #{extra[0]} MR #{extra[1]}",1
                  )

                  buffs=[]
                  buffs << '촐기' if extra[2]
                  buffs << '용기' if extra[3]

                  b.draw_text(
                    x+2,y+70,82,13,
                    buffs.join(' '),1
                  )

                else
                  items.each_with_index do |q,j|
                    id,n,auto=q

                    ix=x+2+(j%3)*28
                    iy=y+52+(j/3)*23

                    icon=RPG::Cache.icon(
                      $data_items[id].icon_name
                    )

                    b.stretch_blt(
                      Rect.new(ix,iy,25,23),
                      icon,
                      Rect.new(0,0,icon.width,icon.height),
                      n>0 ? 255 : 85
                    )

                    b.fill_rect(
                      ix,iy,4,4,
                      Color.new(70,200,90)
                    ) if auto

                    b.font.size=10

                    b.font.color=Color.new(0,0,0)

                    b.draw_text(
                      ix-1,iy+12,26,11,
                      n.to_s,2
                    )

                    b.font.color=Color.new(255,255,255)

                    b.draw_text(
                      ix-2,iy+11,26,11,
                      n.to_s,2
                    )
                  end
                end
              end
            end

            class Menu
              def initialize(item)
                @item=item
                @id=item.id
                @actor=nil
                @number=nil

                rebuild
              end

              def close
                @number.dispose if @number &&
                  !@number.disposed?

                @window.dispose if @window &&
                  !@window.disposed?

                @number=nil
                @window=nil
              end

              def rebuild
                index=@window ? @window.index : 0

                @window.dispose if @window &&
                  !@window.disposed?

                @options=[]

                if @actor
                  r=SL414.entry(@actor,@id)

                  @options << [
                    :toggle,
                    r ?
                      '분배 지정 해제 (회수)' :
                      '구매 시 자동 분배 지정'
                  ]

                  @options << [
                    :give,
                    "지급 (본캐 #{SL414.owner(@id)}개)"
                  ] if SL414.active_ids.include?(@actor)

                  @options << [
                    :recall,
                    "회수 (보유 #{SL414.count(@actor,@id)}개)"
                  ] if r

                  @options << [
                    :auto,
                    "자동 회복: #{r[1] ? 'ON' : 'OFF'}"
                  ] if r && HEAL.key?(@id)

                  @options << [:back,'뒤로']

                else
                  @options << [
                    :use,
                    "기존 사용 (본캐 #{SL414.owner(@id)}개)"
                  ]

                  @options << [
                    :equal,
                    '지정 인원 균등 재분배'
                  ]

                  SLOTS.each do |id|
                    a=$game_actors[id]

                    r=SL414.entry(id,@id)

                    next unless SL414.member(id) || r

                    text="#{a.name} #{SL414.count(id,@id)}개"

                    text+=' [지정]' if r

                    text+=' (미고용)' unless SL414.member(id)

                    @options << [id,text]
                  end

                  @options << [:close,'닫기']
                end

                @window=Window_Command.new(
                  280,@options.map{|q|q[1]}
                )

                @window.x=260
                @window.y=160
                @window.z=999999
                @window.opacity=255
                @window.back_opacity=255
                @window.active=true

                @window.index=[
                  [index,0].max,
                  @options.size-1
                ].min
              end

              def sound(ok)
                $game_system.se_play(
                  ok ?
                    $data_system.decision_se :
                    $data_system.buzzer_se
                )
              end

              def begin_number(action)
                max=action==:give ?
                  SL414.owner(@id) :
                  [
                    SL414.count(@actor,@id),
                    SL414.capacity(@id)
                  ].min

                return sound(false) if max<=0

                @action=action
                @max=max

                @number=Window_InputNumber.new(
                  [max.to_s.size,1].max
                )

                @number.number=max

                @number.x=260
                @number.y=@window.y+@window.height
                @number.z=1000000
                @number.opacity=255
                @number.back_opacity=255

                @window.active=false
              end

              def update
                if @number
                  @number.update

                  if Input.trigger?(Input::B)
                    @number.dispose
                    @number=nil
                    @window.active=true

                  elsif Input.trigger?(Input::C)
                    n=@number.number

                    unless n>0 && n<=@max
                      sound(false)
                      return nil
                    end

                    ok=@action==:give ?
                      SL414.give(@actor,@id,n) :
                      SL414.recall(@actor,@id,n)

                    sound(ok)

                    @number.dispose
                    @number=nil

                    rebuild
                  end

                  return nil
                end

                @window.update

                if Input.trigger?(Input::B)
                  if @actor
                    @actor=nil
                    rebuild
                    return nil
                  end

                  return :close
                end

                return nil unless Input.trigger?(Input::C)

                action=@options[@window.index][0]

                case action

                when :use,:close
                  return action

                when :equal
                  sound(SL414.equalize(@id))

                when :back
                  @actor=nil

                when :toggle
                  r=SL414.entry(@actor,@id)

                  sound(
                    r ?
                      SL414.undesignate(@actor,@id) :
                      SL414.designate(@actor,@id)
                  )

                when :auto
                  r=SL414.entry(@actor,@id)
                  r[1]=!r[1] if r

                when :give,:recall
                  begin_number(action)
                  return nil

                else
                  @actor=action
                end

                rebuild

                nil
              end
            end

            def self.open_inventory(scene,w)
              return false unless Input.trigger?(Input::C) &&
                !$game_temp.in_battle

              item=w.item

              return false unless eligible?(item) &&
                (!active_ids.empty? || retained?(item.id))

              scene.instance_variable_set(
                :@sl414_menu,
                Menu.new(item)
              )

              w.active=false

              true
            end

            def self.update_inventory(scene,w)
              menu=scene.instance_variable_get(:@sl414_menu)

              return false unless menu

              result=menu.update

              if result
                close_inventory(scene)

                w.active=true

                if result==:use
                  scene.sl_hotbar_update_item

                else
                  index=w.index

                  w.refresh

                  size=w.instance_variable_get(:@item_max)

                  w.index=size>0 ?
                    [[index,0].max,size-1].min :
                    -1
                end
              end

              true
            end

            def self.close_inventory(scene)
              menu=scene.instance_variable_get(:@sl414_menu)

              menu.close if menu

              scene.instance_variable_set(
                :@sl414_menu,nil
              )
            end
          end
          RUBY

          cat > /tmp/sl414-patch.rb <<'RUBY'
          # encoding: UTF-8
          require 'zlib'

          module RPG
            %w[
              Item CommonEvent EventCommand MoveRoute
              MoveCommand AudioFile Animation
            ].each{|n|const_set(n,Class.new)}

            Animation.const_set(:Frame,Class.new)
            Animation.const_set(:Timing,Class.new)
          end

          %w[Table Tone Color].each do |n|
            Object.const_set(n,Class.new do
              def self._load(raw)
                o=allocate
                o.instance_variable_set(:@raw,raw)
                o
              end
            end)
          end

          def iv(o,k)
            o.instance_variable_get(k)
          end

          def check(ok,msg)
            raise msg unless ok
          end

          def one(s,a,b)
            check(
              s.scan(a).size==1,
              "Anchor #{a.inspect[0,100]}"
            )

            s.sub(a){b}
          end

          def method_source(s,name)
            nodes=[]

            walk=lambda do |n|
              if n.is_a?(RubyVM::AbstractSyntaxTree::Node)
                nodes<<n if n.type==:DEFN &&
                  n.children[0]==name.to_sym

                n.children.each{|c|walk.call(c)}
              end
            end

            walk.call(
              RubyVM::AbstractSyntaxTree.parse(s)
            )

            check(
              nodes.size==1,
              "Method #{name}: #{nodes.size}"
            )

            n=nodes[0]

            s.lines[
              (n.first_lineno-1)..(n.last_lineno-1)
            ].join
          end

          def heal_specs(root)
            pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

            items=Marshal.load(
              File.binread(
                File.join(root,pre+'Items.rxdata')
              )
            )

            ce=Marshal.load(
              File.binread(
                File.join(root,pre+'CommonEvents.rxdata')
              )
            )

            anim=Marshal.load(
              File.binread(
                File.join(root,pre+'Animations.rxdata')
              )
            )

            list=iv(ce[51],:@list)

            h={}

            [1,16,70,71,86].each do |id|
              hits=list.each_index.select do |i|
                iv(list[i],:@code)==126 &&
                iv(list[i],:@parameters)==[id,1,0,1]
              end

              check(
                hits.size==1,
                "Potion route #{id}"
              )

              i=hits[0]

              p=iv(list[i+1],:@parameters)

              check(
                iv(list[i+1],:@code)==311 &&
                p[0,3]==[1,0,0] &&
                p[4]==false,
                "Potion HP #{id}"
              )

              check(
                iv(list[i+3],:@code)==117 &&
                iv(list[i+3],:@parameters)==[782],
                "Potion bonus #{id}"
              )

              check(
                iv(list[i+4],:@code)==117,
                "Potion effect call #{id}"
              )

              a=iv(
                ce[iv(list[i+4],:@parameters)[0]],
                :@list
              )

              check(
                a.map{|c|iv(c,:@code)}==[106,207,0],
                "Potion effect route #{id}"
              )

              h[id]=[
                p[3],
                iv(a[0],:@parameters)[0],
                iv(a[1],:@parameters)[1]
              ]

              check(
                iv(a[1],:@parameters)[0]==-1 &&
                anim[h[id][2]],
                "Potion animation #{id}"
              )
            end

            check(
              h=={
                1=>[25,10,29],
                16=>[90,12,19],
                70=>[60,12,30],
                71=>[90,6,19],
                86=>[1000,10,29]
              },
              'Original recovery values'
            )

            l=iv(ce[782],:@list)

            (645..653).each do |id|
              i=l.index do |c|
                iv(c,:@code)==111 &&
                iv(c,:@parameters)==[4,1,4,id]
              end

              check(
                i &&
                iv(l[i+4],:@code)==311 &&
                iv(l[i+4],:@parameters)==[1,0,1,781,false] &&
                iv(l[i+5],:@code)==311 &&
                iv(l[i+5],:@parameters)==[
                  1,0,0,(id-644)*2,false
                ],
                "Original ring effect #{id}"
              )

              check(
                iv(l[i+2],:@parameters)[0].to_s.include?(
                  "* #{(id-644)*2}"
                ),
                "Original ring rate #{id}"
              )
            end

            (h.keys+[1006]).each do |id|
              check(
                items[id] &&
                !iv(items[id],:@icon_name).to_s.empty?,
                "Original item icon #{id}"
              )
            end

            h
          end

          def edit(s,i,runtime)
            case i

            when 26
              s=one(
                s,
                "    SL411.starter(a)\n",
                "    SL411.starter(a)\n    SL414.drink(a,self)\n"
              )

              one(
                s,
                '$game_party.item_number(1006)<1',
                'SL414.ammo(a)<1'
              )

            when 42,43
              one(
                s,
                'if $game_party.item_number(i) > 0',
                'if $game_party.item_number(i) > 0 || (!$game_temp.in_battle && SL414.retained?(i))'
              )

            when 71
              check(
                s.include?('@wait_count = @parameters[0] * 2'),
                'Native wait conversion'
              )

              s=one(
                s,
                'return nil if bow && $game_party.item_number(1006)<1',
                'return nil if bow && SL414.ammo(a)<1'
              )

              one(
                s,
                '$game_party.lose_item(1006,1) if bow',
                'SL414.spend_arrow(a) if bow'
              )

            when 78
              one(
                s,
                "    @message_window.update\n",
                "    @message_window.update\n    SL414.draw($메세지)\n"
              )

            when 80,81
              s=one(
                s,
                "  def update\n",
                "  def update\n    return if SL414.update_inventory(self,@item_window)\n"
              )

              one(
                s,
                /^( +)def dispose\n/,
                s[/^( +)def dispose\n/]+
                  "      SL414.close_inventory(self)\n"
              )

            when 93
              one(
                s,
                '$game_party.gain_item(@item.id, @number_window.number)',
                'SL414.buy(@item.id, @number_window.number)'
              )

            when 100
              one(
                s,
                method_source(s,'set_text2'),
                "  def set_text2(text)\n    SL414.draw(self)\n  end\n"
              )

            when 127
              a=/^[ \t]*#도움말 출력\n.*?(?=^[ \t]*#스텟 출력)/m

              block=s[a]

              check(
                block &&
                block.scan(
                  'self.contents.draw_text(143, 441, 500, 32'
                ).size==19,
                'Original help lines'
              )

              one(
                s,
                a,
                "    self.contents.font.name = \"NanumGothic\"\n    self.contents.font.size = 12\n    self.contents.font.bold = false\n\n"
              )

            when 130
              a='    return if SLHotbar.assign_from_window(@item_window)'

              check(
                s.scan(a).size==2,
                'Both native inventory paths'
              )

              s=s.gsub(
                a,
                a+"\n    return if SL414.open_inventory(self,@item_window)"
              )

              runtime+"\n"+s

            else
              raise "Unexpected script #{i}"
            end
          end

          if __FILE__==$0
            root=ARGV.fetch(0)

            file=File.join(root,'Scripts.rxdata')

            h=heal_specs(root)

            runtime=File.read(
              '/tmp/sl414-runtime.rb',
              encoding:'UTF-8'
            ).sub('__HEAL__',h.inspect)

            rows=Marshal.load(
              File.binread(file)
            )

            check(rows.size==137,'Script count')

            targets={
              26=>'Game_Event',
              42=>'Window_Item',
              43=>'★Window_Item2',
              71=>'Interpreter 3',
              78=>'Scene_Map',
              80=>'Scene_Item',
              81=>'★Scene_Item2',
              93=>'Scene_Shop',
              100=>'Window_Help2',
              127=>'게이지',
              130=>'Mobile Hotbar'
            }

            before=rows.map{|r|Marshal.dump(r)}

            targets.each do |i,name|
              check(
                rows[i][1].dup.force_encoding('UTF-8')==name,
                "Script #{i}"
              )

              original=Zlib::Inflate.inflate(
                rows[i][2]
              ).force_encoding('UTF-8')

              s=original.gsub("\r\n","\n")

              t=edit(s,i,runtime)

              check(s!=t,"Edit #{i}")

              RubyVM::InstructionSequence.compile(t)

              rows[i][2]=Zlib::Deflate.deflate(
                (
                  original.include?("\r\n") ?
                  t.gsub("\n","\r\n") :
                  t
                ).b
              )
            end

            check(
              rows.each_index.select{
                |i|Marshal.dump(rows[i])!=before[i]
              }==targets.keys.sort,
              'Script change scope'
            )

            File.binwrite(
              file,Marshal.dump(rows)
            )

            check(
              Marshal.dump(
                Marshal.load(File.binread(file))
              )==Marshal.dump(rows),
              'Roundtrip'
            )

            puts 'PASS original CE recovery/animation/ring data'
            puts 'PASS eleven approved script edits'
          end
          RUBY

          ruby -c /tmp/sl414-patch.rb

          ruby /tmp/sl414-patch.rb \
            site/knight/gameasync/Data

