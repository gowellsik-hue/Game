
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R57
# CAUSE: confirmed R56 save-load NoMethodError: undefined method 'defined?'.
# R56 Game_Event refresh and Interpreter reward commands contain 6 mruby-incompatible
# defined?(SLV541) guards. R57 replaces only these guards with direct calls.
# BASE: last successful R56 GitHub Pages artifact, exact pinned commit below.
# Keeps original R56 R49 initialize fix, all 491 V5.41-v2 reward records,
# 106 TI monsters, walls, maps, graphics, common loot, saves, and movement.
# Only original scripts 26,72,74 changed, and visible versions + scripts digest.
name: build-slknight-web.yml | V229R57 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R57 Find last successful R56 source artifact
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY_RESOLVE'
          import json,os,urllib.request
          repo='gowellsik-hue/Game'
          commit='b10be26b64c12c5beb59af2c379f9c36b8ad2e4d'
          base=f'https://api.github.com/repos/{repo}'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                   'Accept':'application/vnd.github+json',
                   'X-GitHub-Api-Version':'2022-11-28'}
          def api(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers),timeout=30) as r:
                  return json.load(r)
          records=api('/actions/workflows/build-slknight-web.yml/runs?status=success&per_page=100')['workflow_runs']
          runs=[x for x in records if x.get('head_sha')==commit and x.get('conclusion')=='success' and x.get('head_branch')=='main']
          assert runs,'No successful V229R56 workflow run found at pinned commit'
          run=max(runs,key=lambda x:x['run_number'])
          items=api(f"/actions/runs/{run['id']}/artifacts")['artifacts']
          found=[x for x in items if x['name']=='github-pages' and not x['expired']]
          assert found,'V229R56 GitHub Pages source artifact has expired'
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f"run_id={run['id']}\n")
          print('PASS: verified successful R56 run and unexpired github-pages source artifact:',run['id'])
          PY_RESOLVE
      - name: V229R57 Download original R56 GitHub Pages artifact
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: ${{ steps.source.outputs.run_id }}
          name: github-pages
          github-token: ${{ github.token }}
          path: r56
      - name: V229R57 Verify exact 5517 R56 source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s r56/artifact.tar
          tar -xf r56/artifact.tar -C site
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          for name in ('index.html','knight/index.html'):
              assert 'V229R56' in (root/name).read_text('utf-8'),name
          scripts=root/'knight/gameasync/Data/Scripts.rxdata'
          assert scripts.is_file() and scripts.stat().st_size>10000
          pre='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          for mid in (43,44,45,46):
              assert (root/(pre+f'Map{mid:03d}.rxdata')).is_file(),mid
          before={str(f.relative_to(root)):hashlib.sha256(f.read_bytes()).hexdigest()
                  for f in root.rglob('*') if f.is_file()}
          assert len(before)==5517,len(before)
          Path('build/r57-baseline.json').write_text(json.dumps(before,sort_keys=True))
          print('PASS: original 5517 V229R56 files recovered, including all 491EV maps')
          PY_BASE
      - name: V229R57 Remove six unsupported mruby defined? guards only
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r57_patch.rb <<'R57_PATCH'
          require 'zlib'
          require 'digest'
          require 'json'
          root=ARGV.fetch(0)
          out=ARGV.fetch(1)
          path=File.join(root,'knight/gameasync/Data/Scripts.rxdata')
          original_bytes=File.binread(path)
          original_sha=Digest::SHA256.hexdigest(original_bytes)
          scripts=Marshal.load(original_bytes)
          raise 'Unexpected scripts count' unless scripts.length==136
          original=Marshal.load(original_bytes)
          get=lambda{|i| Zlib::Inflate.inflate(scripts[i][2]).force_encoding('UTF-8')}
          put=lambda{|i,t| scripts[i][2]=Zlib::Deflate.deflate(t.b)}
          # Pin the exact six bad guards seen in R56. No guessing, no new aliases.
          changes={
            26=>['SLV541.observe(self) if defined?(SLV541)', 'SLV541.observe(self)', 3],
            72=>['defined?(SLV541) && SLV541.rewarded?', 'SLV541.rewarded?', 2],
            74=>['defined?(SLV541) && SLV541.rewarded?', 'SLV541.rewarded?', 1]
          }
          changes.each do |i,(old,new,count)|
            text=get.call(i)
            found=text.scan(old).length
            raise "Unexpected R56 guard count at script #{i}: #{found}/#{count}" unless found==count
            patched=text.gsub(old,new)
            raise "unsupported defined? remains in script #{i}" if patched.include?('defined?(SLV541)')
            put.call(i,patched)
          end
          # R56 runtime was already loaded when Game_Map.setup starts. Thus direct
          # references to its module are valid, and mruby's missing 'defined?' is avoided.
          module_text=get.call(134)
          raise 'R56 reward module missing' unless module_text.include?('module SLV541') && module_text.include?('DATA={2=>{')
          raise 'R56 source runtime was unexpectedly modified' unless scripts[134]==original[134]
          raise 'R56 native initializer regression' unless get.call(26).include?("    super()\r\n    @map_id = map_id\r\n")
          raise 'Extra scripts modified' unless scripts.each_index.all?{|i|changes.key?(i) || scripts[i]==original[i]}
          File.binwrite(path,Marshal.dump(scripts))
          [26,72,74,134].each{|i|File.binwrite(File.join(out,"r57-script#{i}.rb"),get.call(i))}
          File.write(File.join(out,'r57-runtime.rb'),module_text[module_text.index('# V229R56:')..-1])
          File.write(File.join(out,'r57-fix.json'),JSON.pretty_generate({
            version:'V229R57',source_version:'V229R56',source_sha256:original_sha,
            changed_script_indexes:changes.keys.sort,removed_unsupported_guards:6,
            preserve_original_event_initializer:true,preserve_reward_module:true,
            preserve_491_balance_records:true,map_files_modified:false
          }))
          puts 'PASS: all 6 unsupported defined? guards removed from scripts 26,72,74; R56 reward module unchanged'
          R57_PATCH
          ruby -c /tmp/r57_patch.rb
          ruby /tmp/r57_patch.rb site build
          for i in 26 72 74 134; do ruby -c "build/r57-script${i}.rb"; done
          ruby -c build/r57-runtime.rb
      - name: V229R57 Test original Game_Event, 490 kills and saved game payouts
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r57_test.rb <<'R57_TEST'
          require 'json'
          module RPG
            class Map;end
            class MapInfo;end
            class AudioFile;end
            class Tileset;end
            class CommonEvent;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end
          [RPG::Event,RPG::Event::Page,RPG::Event::Page::Condition,RPG::Event::Page::Graphic].each do |klass|
            klass.class_eval do
              def method_missing(m,*a)
                key='@'+m.to_s
                return instance_variable_get(key) if a.empty? && instance_variable_defined?(key)
                super
              end
            end
          end
          class Table
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(d=0);@raw;end
          end
          class Tone
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(d=0);@raw;end
          end
          class Color<Tone;end
          class Game_Character
            attr_accessor :x,:y
            def initialize
              @x=0;@y=0;@move_route_forcing=false;@original_direction=2;@original_pattern=0
              $native_init_calls=($native_init_calls||0)+1
            end
            def moveto(x,y);@x=x;@y=y;end
          end
          class Interpreter;end
          class MockParty
            attr_accessor :gold
            def initialize;@gold=0;end
            def gain_gold(n);@gold+=n;end
          end
          class Actor
            attr_accessor :exp
            def initialize;@exp=0;end
          end
          class MapMock
            attr_accessor :map_id,:events
            def initialize(id);@map_id=id;@events={};end
          end
          $game_player=Game_Character.new
          $game_player.x=-1000;$game_player.y=-1000
          $game_party=MockParty.new;$game_actors={1=>Actor.new}
          $game_variables=Hash.new(0)
          $game_switches=Hash.new(false)
          $game_self_switches=Hash.new(false)
          $game_map=MapMock.new(2)
          [26,72,74].each{|i|load File.join(ENV.fetch('R57_BUILD'),"r57-script#{i}.rb")}
          load File.join(ENV.fetch('R57_BUILD'),'r57-runtime.rb')
          raise 'R49 event initialize alias remains' if Game_Event.instance_methods(false).include?(:slti_r49_original_initialize)
          raise 'R52 event initialize alias remains' if Game_Event.instance_methods(false).include?(:slv541_original_initialize)
          raise 'R52 event refresh alias remains' if Game_Event.instance_methods(false).include?(:slv541_original_refresh)
          raise 'R52 interpreter command alias remains' if Interpreter.instance_methods(false).include?(:slv541_original_gold_command)

          records=SLV541::DATA.flat_map do |mid,mobs|
            mobs.map do |id,s|
              [mid,id,s[0],s[1],s[2],s[3],(s[0]==0 && s[1]==0)]
            end
          end
          root=ARGV.fetch(0);pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          count=0;paid=0;cases=0;boss_rng=0;normal_rng=0;fixed=0;missing=[]
          records.group_by{|r|r[0]}.each do |mid,items|
            m=Marshal.load(File.binread(File.join(root,'knight/gameasync/Data',pre+format('Map%03d.rxdata',mid))))
            $game_map=MapMock.new(mid)
            $game_variables=Hash.new(0)
            $game_switches=Hash.new(false)
            $game_self_switches=Hash.new(false)
            items.each do |row|
              id,xp,cash,low,high,nonhunt=row[1..-1]
              event=m.instance_variable_get(:@events)[id]
              stat=SLV541.stat(mid,id)
              raise "Data mismatch #{mid}:#{id}" unless event!=nil && stat && stat[0]==xp && stat[1]==cash
              var,maxhp,pidx=stat[6],stat[4],stat[5]
              $game_variables[var]=0
              before_exp=$game_actors[1].exp;before_cash=$game_party.gold;before_init=$native_init_calls
              obj=Game_Event.new(mid,event)
              raise "Native super not invoked exactly once #{mid}:#{id}" unless $native_init_calls==before_init+1
              $game_map.events[id]=obj
              obj.refresh
              $game_variables[var]=maxhp
              obj.refresh
              unless nonhunt
                unless obj.instance_variable_get(:@slv541_rewarded)==true
                  missing<<[mid,id,pidx];next
                end
                paid+=1
                delta_cash=$game_party.gold-before_cash
                delta_exp=$game_actors[1].exp-before_exp
                raise "Wrong XP #{mid}:#{id}: #{delta_exp}/#{xp}" unless delta_exp==xp
                if !low.nil?
                  raise "Boss money #{mid}:#{id}: #{delta_cash} outside #{low}..#{high}" unless (low..high).include?(delta_cash)
                  boss_rng+=1
                elsif stat[14] && stat[15] && cash>0
                  nlo,nhi=stat[14],stat[15];den=nlo+nhi
                  lo=(cash*2*nlo+den/2)/den;hi=(cash*2*nhi+den/2)/den
                  raise "Normal money #{mid}:#{id}: #{delta_cash} outside #{lo}..#{hi}" unless (lo..hi).include?(delta_cash)
                  normal_rng+=1
                else
                  raise "Fixed money #{mid}:#{id}: #{delta_cash}/#{cash}" unless delta_cash==cash
                  fixed+=1 if cash>0
                end
                3.times{obj.refresh}
                int=Interpreter.new
                int.instance_variable_set(:@event_id,id);int.instance_variable_set(:@map_id,mid)
                int.instance_variable_set(:@parameters,[0,0,1]);int.command_125
                int.instance_variable_set(:@parameters,[0,0,0,1]);int.command_315
                int.instance_variable_set(:@parameters,[333,333,0,2,200,400]);int.command_122
                int.instance_variable_set(:@parameters,[1926,1926,0,0,2501]);int.command_122
                raise "Message payout #{mid}:#{id}" unless $game_variables[333]==delta_cash && $game_variables[1926]==xp
                raise "Duplicate payout #{mid}:#{id}" unless $game_party.gold==before_cash+delta_cash && $game_actors[1].exp==before_exp+xp
                cases+=1
                $game_variables[var]=0;obj.refresh
                $game_variables[var]=maxhp;obj.refresh
                raise "Respawn XP #{mid}:#{id}" unless $game_actors[1].exp==before_exp+2*xp
              end
              $game_variables[var]=0
              count+=1
            end
          end
          raise "Coverage #{count} #{paid} #{cases} #{boss_rng} #{normal_rng} #{fixed} #{missing.inspect}" unless [count,paid,cases,boss_rng,normal_rng,fixed]==[491,490,490,62,212,162] && missing.empty?
          puts "PASS 491 records #{count}; kills #{paid}; boss ranges #{boss_rng}; normal rng #{normal_rng}; fixed #{fixed}"
          # Cold dead load / alive-save reload / dead-save reload should not create extra payouts.
          mid=16;eid=1;stat=SLV541.stat(mid,eid)
          m=Marshal.load(File.binread(File.join(root,'knight/gameasync/Data',pre+format('Map%03d.rxdata',mid))))
          event=m.instance_variable_get(:@events)[eid]
          $game_map=MapMock.new(mid);$game_variables=Hash.new(0);$game_switches=Hash.new(false);$game_self_switches=Hash.new(false)
          var,maxhp=stat[6],stat[4]
          $game_variables[var]=maxhp
          before_exp=$game_actors[1].exp;before_cash=$game_party.gold
          obj=Game_Event.new(mid,event);$game_map.events[eid]=obj;obj.refresh
          raise 'Cold dead page paid' unless $game_actors[1].exp==before_exp && $game_party.gold==before_cash
          $game_variables[var]=0;obj.refresh
          obj=Marshal.load(Marshal.dump(obj));$game_map.events[eid]=obj
          $game_variables[var]=maxhp;obj.refresh
          raise 'Alive save reload failed payout' unless $game_actors[1].exp==before_exp+stat[0]
          obj=Marshal.load(Marshal.dump(obj));$game_map.events[eid]=obj
          3.times{obj.refresh}
          raise 'Dead save reload double-paid' unless $game_actors[1].exp==before_exp+stat[0]
          puts 'PASS cold-dead, alive-save reload, dead-save reload'
          # Verify R49 switch gate survives directly in original initializer for TI events.
          [[45,16],[46,16]].each do |mid,id|
            map=Marshal.load(File.binread(File.join(root,'knight/gameasync/Data',pre+format('Map%03d.rxdata',mid))))
            event=map.instance_variable_get(:@events)[id]
            raise "TI fixture #{mid} #{id}" unless event && event.name.to_s[0,3]=='[ID'
            gate=event.pages[1].condition
            if gate.switch1_valid
              $game_switches[gate.switch1_id]=true
              Game_Event.new(mid,event)
              raise "TI gate reset missing #{mid}" unless $game_switches[gate.switch1_id]==false
            end
          end
          puts 'PASS original TI gate handling and native super constructor'
          R57_TEST
          ruby -c /tmp/r57_test.rb
          R57_BUILD=build ruby /tmp/r57_test.rb site | tee build/r57-kill-regression.txt
          grep -q 'PASS 491 records 491; kills 490; boss ranges 62; normal rng 212; fixed 162' build/r57-kill-regression.txt
          grep -q 'PASS cold-dead, alive-save reload, dead-save reload' build/r57-kill-regression.txt
          grep -q 'PASS original TI gate handling and native super constructor' build/r57-kill-regression.txt
      - name: V229R57 Update R57 script digest and browser labels
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_MANIFEST'
          from pathlib import Path
          import re,hashlib
          root=Path('site')
          mapping=root/'knight/gameasync/mapping.js'
          scripts=root/'knight/gameasync/Data/Scripts.rxdata'
          text,n=re.subn(r'Data/Scripts\.rxdata\?h=[0-9a-f]{32}',
                         lambda m:'Data/Scripts.rxdata?h='+hashlib.md5(scripts.read_bytes()).hexdigest(),
                         mapping.read_text('utf-8'))
          assert n==1,'Unexpected mapping script digest reference'
          mapping.write_text(text,encoding='utf-8')
          for name in ('index.html','knight/index.html'):
              page=root/name
              content=page.read_text('utf-8')
              assert 'V229R56' in content,name
              page.write_text(content.replace('V229R56','V229R57').replace('v229r56','v229r57'),encoding='utf-8')
          print('PASS only script digest and R57 labels updated')
          PY_MANIFEST
          node --check site/knight/gameasync/mapping.js
      - name: V229R57 Verify untouched maps, loot and 491EV source data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          old=json.loads(Path('build/r57-baseline.json').read_text('utf-8'))
          new={str(f.relative_to(root)):hashlib.sha256(f.read_bytes()).hexdigest()
               for f in root.rglob('*') if f.is_file()}
          assert len(old)==len(new)==5517 and old.keys()==new.keys()
          changed={k for k in old if old[k]!=new[k]}
          allowed={'index.html','knight/index.html','knight/gameasync/mapping.js',
                   'knight/gameasync/Data/Scripts.rxdata'}
          assert changed==allowed,('Unexpected changes',changed^allowed)
          meta=json.loads(Path('build/r57-fix.json').read_text('utf-8'))
          assert meta['changed_script_indexes']==[26,72,74]
          assert meta['removed_unsupported_guards']==6
          assert meta['preserve_491_balance_records'] and meta['preserve_original_event_initializer']
          for name in ('index.html','knight/index.html'):
              assert 'V229R57' in (root/name).read_text('utf-8')
          print('PASS: 5517 source files preserved, 4 allowed web files changed; 491EV data untouched')
          PY_FINAL
      - name: V229R57 Upload Ruby-compatibility and payout regression report
        uses: actions/upload-artifact@v4
        with:
          name: SLKnight-V229R57-Remove-mruby-defined-Guards
          path: |
            build/r57-fix.json
            build/r57-kill-regression.txt
          retention-days: 30
          if-no-files-found: error

      - name: V229R57 Upload repaired complete game to SAME GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
