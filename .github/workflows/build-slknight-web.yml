
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R151
# BASE: Successful V229R150 deployment (run 41090135570).
# PURPOSE: Download the complete Talking Island (Map047) terrain before map entry.
# PRESERVE: Talking Island dungeon Map045/Map046 removal from V229R150.
# PRESERVE: Map047 tiles/collision/graphics, original NPC data, all other maps,
#           monsters, V230 reward logic, mobile controls, and saves.
# CHANGES: Build one Map047 pack from the 96 verified 512x512 PNG chunks and the
#          transparent collision tileset. Stage every byte before Map047 opens.
# HOUSE INTERIORS/NPC: NO unverified location, event, or interior is added here.

name: build-slknight-web.yml | V229R151 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R151 Download preserved V229R150 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41090135570
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V229R151 Extract original and hash-protect files
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          prefix='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          if 'V229R150' not in (root/'knight/index.html').read_text('utf-8'):
              raise ValueError('Wrong game base: expected successful V229R150')
          if prefix+'Map047.rxdata' not in before or any(prefix+f'Map{mid:03d}.rxdata' in before for mid in (45,46)):
              raise ValueError('Dungeon removal or Map047 original was not preserved')
          if 'knight/assets/map-047-v229r115.pack' in before:
              raise ValueError('Unexpected pre-existing Map047 pack')
          Path('build/before.json').write_text(json.dumps(before,sort_keys=True),'utf-8')
          print('PASS R150 preserved base: Map047 remains, dungeon 45/46 absent')
          PY

      - name: V229R151 Build complete Map047 map-entry download pack
        shell: bash
        run: |
          set -euo pipefail
          cat > build/create_map047_pack.py <<'PY'
          from pathlib import Path
          import hashlib, json, re, struct

          root=Path('site/knight')
          base=root/'gameasync'
          mapping=(base/'mapping.js').read_text('utf-8')
          out=root/'assets/map-047-v229r151.pack'
          entries=[]
          payload=bytearray()
          files=[]
          for cx in range(12):
              for cy in range(8):
                  files.append(('graphics/panoramas/slti_47_c%d_%d'%(cx,cy),
                                'Graphics/Panoramas/SLTI_47_C%d_%d.png'%(cx,cy)))
          files.append(('graphics/tilesets/slti_collision_transparent',
                        'Graphics/Tilesets/SLTI_Collision_Transparent.png'))
          if len(files)!=97:raise ValueError('Incorrect Map047 file list')

          for key,name in files:
              path=base/name
              if not path.is_file():raise FileNotFoundError('Missing Map047 original asset '+name)
              raw=path.read_bytes()
              if raw[:8]!=b'\x89PNG\r\n\x1a\n':
                  raise ValueError('Not an original PNG: '+name)
              match=re.findall(r'\["'+re.escape(key)+r'",\s*"'+re.escape(name)+r'\?h=([0-9a-f]{32})"\]',mapping)
              if len(match)!=1 or hashlib.md5(raw).hexdigest()!=match[0]:
                  raise ValueError('Map047 resource mapping or exact original MD5 mismatch: '+name)
              entries.append([key,len(payload),len(raw)])
              payload.extend(raw)
          index=json.dumps({'kind':'map','map_id':47,'files':entries},
                           separators=(',',':'),ensure_ascii=False).encode('utf-8')
          out.write_bytes(struct.pack('<I',len(index))+index+payload)
          if len(entries)!=97:raise ValueError('Map047 pack incomplete')
          print('PASS Map047 all 96 terrain PNGs and 1 collision tileset, pre-bundled: ',len(payload),'bytes')
          print('PASS only exact pre-existing map graphics are bundled; no map or NPC modifications')
          PY
          python3 -m py_compile build/create_map047_pack.py
          python3 build/create_map047_pack.py

      - name: V229R151 Stage complete Map047 before game movement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('site')
          path=root/'knight/js/sl-assets-v229r115.js'
          original=path.read_text('utf-8')
          edits={
              "var version='V229R150';":"var version='V229R151';",
              "if(mid<1||mid>46)return nativeMapLoad.apply(self,args);":
                  "if(mid<1||mid>47)return nativeMapLoad.apply(self,args);",
              "'map-'+String(mid).padStart(3,'0')+'-v229r115.pack'":
                  "(mid===47?'map-047-v229r151.pack':'map-'+String(mid).padStart(3,'0')+'-v229r115.pack')",
          }
          for old,new in edits.items():
              if original.count(old)!=1:
                  raise ValueError('Loader original pattern missing or ambiguous: '+old)
              original=original.replace(old,new)
          path.write_text(original,'utf-8')
          for file in ('index.html','knight/index.html'):
              page=root/file
              text=page.read_text('utf-8')
              if 'V229R150' not in text:raise ValueError('Unexpected page version '+file)
              text=text.replace('V229R150','V229R151').replace('v229r150','v229r151')
              page.write_text(text,'utf-8')
          game=(root/'knight/index.html').read_text('utf-8')
          if 'js/sl-assets-v229r115.js?v=v229r151' not in game:
              raise ValueError('Map loader has stale browser cache version')
          print('PASS Map047 loads the complete 97-file pack before its map data enters the engine')
          print('PASS other maps retain existing map pack behavior')
          PY
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/dpad.js
          node --check site/knight/js/drive.js

      - name: V229R151 Audit map coverage and unchanged gameplay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,struct,re
          root=Path('site')
          before=json.loads(Path('build/before.json').read_text('utf-8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          new=set(after)-set(before)
          gone=set(before)-set(after)
          changed={p for p in before.keys()&after.keys() if before[p]!=after[p]}
          expected_new={'knight/assets/map-047-v229r151.pack'}
          expected_changed={'index.html','knight/index.html','knight/js/sl-assets-v229r115.js'}
          if new!=expected_new or gone or changed!=expected_changed:
              raise ValueError('Unapproved game file changes: new='+repr(sorted(new))+
                               ' removed='+repr(sorted(gone))+' changed='+repr(sorted(changed)))
          source=(root/'knight/assets/map-047-v229r151.pack').read_bytes()
          size=struct.unpack_from('<I',source,0)[0]
          index=json.loads(source[4:4+size])
          rows=index['files']
          if index['kind']!='map' or index['map_id']!=47 or len(rows)!=97:
              raise ValueError('Map047 pack header incomplete')
          if len([r for r in rows if re.fullmatch(r'graphics/panoramas/slti_47_c(?:[0-9]|10|11)_[0-7]',r[0])])!=96:
              raise ValueError('Map047 missing terrain chunks')
          for key,off,n in rows:
              if n<8 or source[4+size+off:4+size+off+8]!=b'\x89PNG\r\n\x1a\n':
                  raise ValueError('Packed Map047 original image not valid: '+key)
          if 4+size+sum(r[2] for r in rows)!=len(source):
              raise ValueError('Packed asset byte length incorrect')
          loader=(root/'knight/js/sl-assets-v229r115.js').read_text('utf-8')
          if 'mid>47' not in loader or 'map-047-v229r151.pack' not in loader:
              raise ValueError('Map047 not included in pre-enter hook')
          print('PASS all 96 Map047 chunks downloaded as 1 request before map activation')
          print('PASS Map045/046 remain removed; original Map047 and other maps remain byte-identical')
          print('PASS only one new pack and 3 version/loader files changed')
          PY

      - name: V229R151 Publish preloaded Talking Island
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
