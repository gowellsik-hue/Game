name: V224 | Knight Combat Fixes + Portable Ettin Audio
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: slknight-github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Restore exact V219 deployment
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: github-pages
          run-id: 38539537249
          github-token: ${{ github.token }}
          path: previous
      - name: Restore and lock complete V219 source
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          if test -s previous/artifact.tar; then
            tar -xf previous/artifact.tar -C site
            echo RESTORED_V219_PAGES_ARTIFACT
          else
            echo V219_ARTIFACT_EXPIRED_RECOVER_VERIFIED_PUBLIC_SITE
            python3 - <<'PY_RECOVER'
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request,urlopen
          from concurrent.futures import ThreadPoolExecutor,as_completed
          import hashlib,json,re,time
          root=Path('site');base='https://gowellsik-hue.github.io/Game/'
          fixed=('index.html','COPYING-mkxp-web.txt','manifest.webmanifest','mkxp.js','mkxp.wasm',
                 'js/drive.js','js/dpad.js','js/localforage.min.js')
          def get(url):
              for attempt in range(6):
                  try:
                      with urlopen(Request(url,headers={'Accept-Encoding':'identity','User-Agent':'SLKnight-V224'}),timeout=60) as r:return r.read()
                  except Exception:
                      if attempt==5:raise
                      time.sleep(1+attempt*2)
          files={'index.html':(base+'index.html',None)}
          for game in ('knight','elf'):
              for rel in fixed:files[game+'/'+rel]=(base+game+'/'+quote(rel,safe='/'),None)
              name=game+'/gameasync/mapping.js'
              blob=get(base+name+'?restore=v219')
              f=root/name;f.parent.mkdir(parents=True,exist_ok=True);f.write_bytes(blob)
              body=blob.decode('utf-8').split('var mappingArray = ',1)[1].split('];',1)[0]+']'
              for _,mapped in json.loads(re.sub(r',\s*\]$',']',body)):
                  rel,sep,md5=mapped.partition('?h=')
                  if '.' not in Path(rel).name:continue
                  if rel.startswith('/') or '..' in Path(rel).parts:raise RuntimeError('Unsafe asset '+rel)
                  name=game+'/gameasync/'+rel
                  if name in files:raise RuntimeError('Duplicate asset '+name)
                  files[name]=(base+game+'/gameasync/'+quote(rel,safe='/')+('?h='+md5 if sep else ''),md5 if sep else None)
          if len(files)!=5354:raise RuntimeError('Incomplete public V219 manifest')
          def fetch(item):
              name,(url,digest)=item;blob=get(url)
              if digest and hashlib.md5(blob).hexdigest()!=digest:raise RuntimeError('MD5 mismatch '+name)
              f=root/name;f.parent.mkdir(parents=True,exist_ok=True);f.write_bytes(blob)
          with ThreadPoolExecutor(max_workers=16) as pool:
              for done in as_completed([pool.submit(fetch,item) for item in files.items() if not (root/item[0]).is_file()]):done.result()
          actual={str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}
          if actual!=set(files):raise RuntimeError('Missing or extra published files')
          PY_RECOVER
          fi
          if grep -Fq 'gameasync/mapping.js?v=v224' site/knight/index.html; then
            python3 - <<'PY_ALREADY'
          from pathlib import Path
          import hashlib
          root=Path('site')
          if sum(p.is_file() for p in root.rglob('*'))!=5354:raise SystemExit('Incomplete published V224')
          known={
            'index.html':'cb972e363a37790bef24aafceae5bd12aaa686934acc4a4c052402006341a3ba',
            'knight/index.html':'555a384433f971ac53c0fb2e1621de947d25062d5b956e5f602cc519d1da477a',
            'knight/gameasync/Data/Scripts.rxdata':'8966a677a9789f3e9c95a058659dcf22b51d98fb1c68dd946a4e6879cf2bbaec',
            'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata':'82d9fda990188d8bef837a9506890c3a6200b04be39a8cb5671d1d37a7bf7665',
            'elf/index.html':'c4a3b2556c05dad54317168eca7a2421c961139bc3f500ca33a4bae74b7b387a'
          }
          for name,digest in known.items():
              if hashlib.sha256((root/name).read_bytes()).hexdigest()!=digest:
                  raise SystemExit('Published V224 mismatch '+name)
          import hashlib
          mp=(root/'knight/gameasync/mapping.js').read_text()
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          assets=['Data/'+prefix+'Map%03d.rxdata'%n for n in (3,13,15,17,18,20,21,27,29,35,41,43)]
          assets+=['Data/'+prefix+'CommonEvents.rxdata','Audio/SE/\uC5D0\uD2F4 \uACF5\uACA9.ogg']
          for asset in assets:
              digest=hashlib.md5((root/'knight/gameasync'/asset).read_bytes()).hexdigest()
              if mp.count(asset+'?h='+digest)!=1:
                  raise SystemExit('Published V224 asset mismatch '+asset)
          print('V224_ALREADY_PUBLISHED_REUSE_VERIFIED_NO_DOUBLE_PATCH')
          PY_ALREADY
            echo 'skip_patch=true' >> "${GITHUB_OUTPUT:-/tmp/slv224_job_output}"
            exit 0
          fi
          echo 'skip_patch=false' >> "${GITHUB_OUTPUT:-/tmp/slv224_job_output}"
          python3 - <<'PY_LOCK'
          from pathlib import Path
          import hashlib,json,shutil
          root=Path('site')
          original={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if len(original)!=5354:raise SystemExit('V219 site file count mismatch')
          fixed={
           'index.html':'cb972e363a37790bef24aafceae5bd12aaa686934acc4a4c052402006341a3ba',
           'knight/index.html':'38b008e7e31b5a7f8eee1aac255641adf1c38a6927ecd8a2b4a29e71e7f1b8a4',
           'knight/gameasync/Data/Scripts.rxdata':'8966a677a9789f3e9c95a058659dcf22b51d98fb1c68dd946a4e6879cf2bbaec',
           'knight/gameasync/mapping.js':'764453d72365622f63b84f7af52e93c909b00d4092b7445ed17408e3ca15cac9',
           'knight/gameasync/Audio/SE/에틴 공격.ogg':'50077318d1b6bc2d38ad0fb1ee111c78ec80e1eed015152469dd934e7b5902c0',
           'knight/js/dpad.js':'c137842818acf76a036127a0ffbae88e22affcba78ca70c3f1b4c76b52f86908',
           'elf/index.html':'c4a3b2556c05dad54317168eca7a2421c961139bc3f500ca33a4bae74b7b387a',
           'elf/gameasync/Data/Scripts.rxdata':'2a5e29ecbc5d2954c79a0122a81168fa1737fe846955cd8b35eb73d5d33d713e',
           'elf/gameasync/mapping.js':'c0a84d321b3b655443546f3369f8958400db145db3af083f4bcfe3285655e409',
           'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap020.rxdata':'ceb99ed2dee7d0c951142709d3657a60135397d3e6f8bd2e2cc008fe301072aa',
           'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap029.rxdata':'025cfdb63457be8f52e9f42ea6e62b3c1b03ca48fe26275a5a21d9362346edd0',
           'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap041.rxdata':'28dcde55d375828c865c8a059b31f11234390cc5686ce6dce8f2b53c71407f7e',
           'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap043.rxdata':'0a2a63fb9434d598ed7e9a94aeb0454717fd49253b81e2c69572b8123bf20b4b'}
          for name,digest in fixed.items():
              if original.get(name)!=digest:raise SystemExit('V224 refuses unknown baseline '+name)
          Path('/tmp/v224_before.json').write_text(json.dumps(original))
          for n in (3,13,15,17,18,20,21,27,29,35,41,43):
              fn='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap%03d.rxdata'%n
              dest=Path('/tmp/v224_original/knight/gameasync/Data')/fn
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(root/'knight/gameasync/Data'/fn,dest)
          Path('/tmp/v224_knight_index.html').write_bytes((root/'knight/index.html').read_bytes())
          print('V224_EXACT_V219_BASELINE_LOCKED')
          PY_LOCK

      - name: Restore confirmed Knight event corrections
        if: steps.restore.outputs.skip_patch != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ruby - site <<'RB_PATCH'
          # encoding: utf-8
          # V224: only verified omissions/cross-mob HP accumulator sharing.
          module RPG
            class Map; end
            class Event; end
            class Event::Page; end
            class Event::Page::Condition; end
            class Event::Page::Graphic; end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
            class AudioFile; end
          end
          class DummyRPGValue
            def self._load(data); new(data); end
            def initialize(data); @payload = data; end
            def _dump(_limit); @payload; end
          end
          class Color < DummyRPGValue; end
          class Tone < DummyRPGValue; end
          class Table < DummyRPGValue; end

          root = ARGV.fetch(0)
          files = {}
          maps = {}
          [20,29,41,43].each do |n|
            path = "#{root}/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap%03d.rxdata" % n
            abort "Map data absent: #{n}" unless File.size?(path)
            files[n] = path
            maps[n] = Marshal.load(File.binread(path))
          end

          def assert!(good, label)
            abort "V224_MISMATCH #{label}" unless good
          end

          def get_event(map, id, korean)
            e = map.instance_variable_get(:@events)[id]
            assert!(e && e.instance_variable_get(:@name).to_s.dup.force_encoding('UTF-8') == "[ID#{korean}]", "event #{id} #{korean}")
            e
          end

          def pages(event)
            event.instance_variable_get(:@pages)
          end

          def commands(page)
            page.instance_variable_get(:@list)
          end

          def cm?(cmd, code, params)
            cmd && cmd.instance_variable_get(:@code) == code && cmd.instance_variable_get(:@parameters) == params
          end

          def copy_command(src, indent)
            c = Marshal.load(Marshal.dump(src))
            c.instance_variable_set(:@indent,indent)
            c
          end

          agi = [334,334,0,4,1,8]
          rand2 = [335,335,0,0,2]
          hit = [1,334,1,335,1]
          # Gnolls: ID 13 is the complete local reference; IDs 6/10 lack AGI assignment
          ref = get_event(maps.fetch(29),13,'놀')
          ref0 = commands(pages(ref)[0])
          agi_template = ref0.find { |c| cm?(c,122,agi) }
          assert!(agi_template, 'Gnoll AGI reference')
          [6,10].each do |id|
            e = get_event(maps.fetch(29),id,'놀')
            [0,1].each do |pi|
              list = commands(pages(e)[pi]); expected = pi == 0 ? 1 : 4
              assert!(list.size == (pi == 0 ? 31 : 147), "Gnoll #{id} page #{pi} size")
              assert!(list.count{|c|cm?(c,122,agi)} == 0,"Gnoll #{id} already patched")
              positions = list.each_index.select{|i|cm?(list[i],122,rand2)}
              assert!(positions.length == expected,"Gnoll #{id} RNG count")
              positions.reverse_each do |i|
                assert!(cm?(list[i+1],111,hit),"Gnoll #{id} compare after RNG")
                assert!(list[i].instance_variable_get(:@indent)==list[i+1].instance_variable_get(:@indent),"Gnoll #{id} indent")
                list.insert(i,copy_command(agi_template,list[i].instance_variable_get(:@indent)))
              end
              positions2=list.each_index.select{|i|cm?(list[i],122,rand2)}
              assert!(positions2.all?{|i|cm?(list[i-1],122,agi)},"Gnoll #{id} AGI linkage")
            end
          end
          puts 'V224_GNOLL_6_10_AGI_10_COMMANDS_RESTORED'

          # Beholder 18: two directions compare stale global V334/V335; duplicate healthy data
          b18 = get_event(maps.fetch(41),18,'지저 비홀더')
          b10 = get_event(maps.fetch(41),10,'지저 비홀더')
          bref = commands(pages(b10)[1]); blist = commands(pages(b18)[1])
          assert!(blist.size==135,'Beholder18 original list length')
          ref_agi=bref.find{|c|cm?(c,122,agi)}
          ref_rng=bref.find{|c|cm?(c,122,[335,335,0,2,10,40])}
          assert!(ref_agi && ref_rng,'Beholder reference commands')
          positions=blist.each_index.select{|i|cm?(blist[i],111,hit)}
          assert!(positions.size==4,'Beholder four directions')
          missing=[]
          positions.each do |i|
            if cm?(blist[i-2],122,agi) && cm?(blist[i-1],122,[335,335,0,2,10,40])
              next
            end
            assert!(blist[i-1].instance_variable_get(:@code)==111 &&
                    blist[i-1].instance_variable_get(:@parameters).first==6,
                    'Beholder unexpected missing-input branch')
            missing << i
          end
          assert!(missing.size==2,'Beholder precisely two faulty directions')
          missing.reverse_each do |i|
            indent=blist[i].instance_variable_get(:@indent)
            blist.insert(i,copy_command(ref_agi,indent),copy_command(ref_rng,indent))
          end
          assert!(blist.size==139,'Beholder new list length')
          assert!(blist.each_index.select{|i|cm?(blist[i],111,hit)}.all?{|i|
            cm?(blist[i-2],122,agi)&&cm?(blist[i-1],122,[335,335,0,2,10,40])},'Beholder four complete directions')
          puts 'V224_BEHOLDER_18_TWO_DIRECTIONS_4_COMMANDS_RESTORED'

          # Bugbear 5: south branch misses V619 increment, unlike same mob's other directions
          bear = get_event(maps.fetch(20),5,'버그베어')
          list = commands(pages(bear)[1]); assert!(list.size==168,'Bugbear5 original list length')
          rand10=[224,224,1,4,1,10]; bonus=[224,224,1,1,619]
          indices=list.each_index.select{|i|cm?(list[i],122,rand10)}
          assert!(indices.size==4,'Bugbear5 four directions')
          missing=[]
          indices.each do |i|
            if cm?(list[i+1],122,bonus)
              next
            end
            assert!(cm?(list[i+1],121,[427,427,0]),'Bugbear5 unexpected follow-up')
            missing << i
          end
          assert!(missing.size==1 && missing.first==indices.first,'Bugbear5 direction8-only omission')
          copy=list.find{|c|cm?(c,122,bonus)}
          assert!(copy,'Bugbear5 healthy branch')
          i=missing.first
          list.insert(i+1,copy_command(copy,list[i].instance_variable_get(:@indent)))
          assert!(list.size==169 && list.count{|c|cm?(c,122,bonus)}==4,'Bugbear5 postcondition')
          puts 'V224_BUGBEAR_5_DIRECTION8_V619_RESTORED'

          # 43: 56/57 troll and 59/60 minotaur are distinct, concurrently active events.
          # Restore allocated HP slots already used by the same species on Maps 005/006.
          m43=maps.fetch(43)
          [[57,'트롤',567,568,20,330],[59,'미노타우르스',379,378,16,440]].each do |id,name,oldv,newv,expected_count,hp|
            ev=get_event(m43,id,name)
            all=m43.instance_variable_get(:@events)
            occupied=all.values.any? do |other|
              pages(other).any? do |page|
                condition=page.instance_variable_get(:@condition)
                present=condition.instance_variable_get(:@variable_valid) && condition.instance_variable_get(:@variable_id)==newv
                commands(page).each do |c|
                  code=c.instance_variable_get(:@code); p=c.instance_variable_get(:@parameters)
                  present||=(code==122 && p[0].is_a?(Integer) && p[1].is_a?(Integer) && p[0]<=newv && newv<=p[1])
                  present||=(code==111 && p[0]==1 && p[1]==newv)
                end
                present
              end
            end
            assert!(!occupied,"Map043 variable #{newv} already assigned")
            condition=pages(ev)[2].instance_variable_get(:@condition)
            assert!(condition.instance_variable_get(:@variable_valid) && condition.instance_variable_get(:@variable_id)==oldv && condition.instance_variable_get(:@variable_value)==hp,"#{name} #{id} death condition")
            list=commands(pages(ev)[1]);changed=0
            list.each do |cmd|
              next unless cmd.instance_variable_get(:@code)==122
              p=cmd.instance_variable_get(:@parameters)
              next unless p[0]==oldv && p[1]==oldv
              p[0]=p[1]=newv
              changed+=1
            end
            assert!(changed==expected_count,"#{name} #{id} damage accumulator edits=#{changed}")
            condition.instance_variable_set(:@variable_id,newv)
            assert!(list.none?{|c|c.instance_variable_get(:@code)==122 && c.instance_variable_get(:@parameters)[0]==oldv},"#{name} #{id} old accumulator remains")
          end
          [[56,'트롤',567],[57,'트롤',568],[59,'미노타우르스',378],[60,'미노타우르스',379]].each do |id,name,v|
            e=get_event(m43,id,name)
            c=pages(e)[2].instance_variable_get(:@condition)
            assert!(c.instance_variable_get(:@variable_id)==v,"#{name} #{id} independent death variable")
          end
          puts 'V224_MAP043_TROLL_56_57_AND_MINOTAUR_59_60_HP_SEPARATED'

          files.each do |n,p|
            File.binwrite(p,Marshal.dump(maps[n]))
          end
          puts 'V224_ONLY_MAP020_029_041_043_PATCHED'
          RB_PATCH
          python3 - site <<'PY_CACHE'
          from pathlib import Path
          import hashlib,re,sys
          site=Path(sys.argv[1])
          root=site/'knight'
          mapping=root/'gameasync/mapping.js'
          s=mapping.read_text(encoding='utf-8')
          for n in (3,13,15,17,18,20,21,27,29,35,41,43):
              name='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap%03d.rxdata'%n
              file=root/'gameasync/Data'/name
              digest=hashlib.md5(file.read_bytes()).hexdigest()
              token='Data/'+name+'?h='
              patt=re.escape(token)+r'[0-9a-f]{32}'
              s,count=re.subn(patt,lambda _:token+digest,s)
              if count!=1:raise SystemExit('V224_MISSING_ASSET_MAPPING_'+name)
          mapping.write_text(s,encoding='utf-8')
          htmlfile=root/'index.html'
          html=htmlfile.read_text(encoding='utf-8')
          old='gameasync/mapping.js?v=v209'
          if html.count(old)!=1:raise SystemExit('V224_UNKNOWN_KNIGHT_HTML_VERSION')
          htmlfile.write_text(html.replace(old,'gameasync/mapping.js?v=v224'),encoding='utf-8')
          print('V224_MAP020_029_041_043_HASHES_AND_KNIGHT_CACHE_ONLY')
          PY_CACHE
          node --check site/knight/js/dpad.js

      - name: Complete damage and direction corrections; repair Ettin voice
        if: steps.restore.outputs.skip_patch != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ruby - site/knight/gameasync/Data <<'RB_EXTRA'
          # encoding: utf-8
          require 'zlib'
          module RPG
            class Map;end;class Event;end;class Event::Page;end
            class Event::Page::Condition;end;class Event::Page::Graphic;end
            class EventCommand;end;class MoveRoute;end;class MoveCommand;end
            class AudioFile;end;class CommonEvent;end
          end
          class LockedBinary
            def self._load(s);new(s);end
            def initialize(s);@raw=s;end
            def _dump(_limit);@raw;end
          end
          class Table<LockedBinary;end
          class Color<LockedBinary;end
          class Tone<LockedBinary;end
          root=ARGV.fetch(0)
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          groups={
            13=>{5=>[1,5,1,10],6=>[1,5,1,10]},
            18=>{2=>[1,8,1,12],3=>[1,8,1,12],4=>[1,8,1,12],13=>[1,8,1,12],15=>[1,8,1,12]},
            21=>{16=>[1,5,1,10],17=>[1,5,1,10]},
            35=>{16=>[10,18,1,10]},
            41=>{5=>[1,5,1,10],6=>[1,5,1,10],16=>[1,5,1,10],17=>[1,5,1,10]}}
          count=0
          groups.each do |map_id,entries|
            file="#{root}/#{prefix}Map%03d.rxdata"%map_id
            map=Marshal.load(File.binread(file))
            entries.each do |id,ranges|
              ev=map.instance_variable_get(:@events).fetch(id)
              list=ev.instance_variable_get(:@pages).flat_map{|pg|[pg.instance_variable_get(:@list)]}
              selected=list.find do |cmds|
                cmds.count{|c|c.instance_variable_get(:@code)==122 &&
                   c.instance_variable_get(:@parameters)[0,4]==[335,335,0,2]}==4
              end
              abort "RNG four directions missing #{map_id}/#{id}" unless selected
              rolls=selected.select{|c|c.instance_variable_get(:@code)==122 &&
                   c.instance_variable_get(:@parameters)[0,4]==[335,335,0,2]}
              low,high,normal_low,normal_high=*ranges
              abort "RNG wrong south #{map_id}/#{id}" unless rolls[0].instance_variable_get(:@parameters)[4,2]==[low,high]
              abort "RNG wrong other directions #{map_id}/#{id}" unless
                rolls[1..3].all?{|c|c.instance_variable_get(:@parameters)[4,2]==[normal_low,normal_high]}
              rolls[0].instance_variable_get(:@parameters)[4]=normal_low
              rolls[0].instance_variable_get(:@parameters)[5]=normal_high
              count+=1
            end
            File.binwrite(file,Marshal.dump(map))
          end
          abort 'Not fourteen directional fixes' unless count==14
          puts 'V224_FOURTEEN_SOUTH_DIRECTION_ROLLS_MATCH_OTHER_THREE'

          # Confirmed wrong HP variable writes and inconsistent damage commands.
          repairs={
            3=>{23=>[[[381,381,2,2,0,34],[381,381,2,1,186]]]},
            15=>{4=>[[[519,519,2,2,0,34],[519,519,2,1,186]]]},
            17=>{19=>[[[531,531,1,2,1,10],[531,531,1,2,1,20]],
                      [[531,531,1,4,1,6],[531,531,1,1,619]]]},
            18=>{18=>[[[269,269,1,4,1,6],[269,269,1,1,619]]]},
            27=>{8=>[[[611,611,1,1,314],[604,604,1,1,314]],
                      [[611,611,2,1,187],[604,604,2,1,187]]]},
            29=>{15=>[[[536,536,2,1,19],[536,536,2,1,187]]],
                 21=>[[[27,27,1,1,314],[176,176,1,1,314]]]},
            41=>{8=>[[[187,187,2,1,186],[67,67,2,1,186]]]},
            43=>{32=>[[[433,433,1,2,1,20],[433,433,1,2,1,10]]]}}
          nfixed=0
          repairs.each do |map_id,entries|
            filename="#{root}/#{prefix}Map%03d.rxdata"%map_id
            map=Marshal.load(File.binread(filename))
            entries.each do |id,ops|
              event=map.instance_variable_get(:@events).fetch(id)
              event_name=event.instance_variable_get(:@name).to_s.dup.force_encoding('UTF-8')
              abort 'Not a monster event' unless event_name.start_with?('[ID')
              pages=event.instance_variable_get(:@pages)
              page=pages.find do |pg|
                list=pg.instance_variable_get(:@list)
                ops.all?{|old,novo|list.count{|c|c.instance_variable_get(:@code)==122 && c.instance_variable_get(:@parameters)==old}==4}
              end
              abort "Wrong baseline at #{map_id}/#{id}" unless page
              list=page.instance_variable_get(:@list)
              ops.each do |old,novo|
                matches=list.select{|c|c.instance_variable_get(:@code)==122 && c.instance_variable_get(:@parameters)==old}
                abort "Wrong old calc count #{map_id}/#{id}" unless matches.size==4
                matches.each{|cmd|cmd.instance_variable_set(:@parameters,novo.dup)}
                nfixed+=matches.size
              end
            end
            File.binwrite(filename,Marshal.dump(map))
          end
          abort 'Expected precisely 44 damage formula corrections' unless nfixed==44
          puts 'V224_ELEVEN_DAMAGE_CORRECTIONS_FIXED_IN_TWELVE_MAPS'

          # Crabman #7 has four 20..50 rolls; the other identical #23 uses 1..2.
          # Attack damage is deliberately NOT changed.
          file="#{root}/#{prefix}Map041.rxdata"
          map=Marshal.load(File.binread(file))
          monsters=map.instance_variable_get(:@events)
          a=monsters.fetch(7);b=monsters.fetch(23)
          abort 'Wrong Crabman pair' unless [a,b].all?{|e|e.instance_variable_get(:@name).to_s.dup.force_encoding('UTF-8')=='[ID지저 크랩맨]'}
          page=lambda{|e|e.instance_variable_get(:@pages)[1].instance_variable_get(:@list)}
          rng=lambda{|e|page.call(e).select{|c|c.instance_variable_get(:@code)==122 && c.instance_variable_get(:@parameters)[0,4]==[335,335,0,2]}}
          target=rng.call(a);healthy=rng.call(b)
          abort 'Crabman reference is not uniformly 1..2' unless healthy.size==4 && healthy.all?{|c|c.instance_variable_get(:@parameters)[4,2]==[1,2]}
          abort 'Crabman abnormal rolls not 20..50' unless target.size==4 && target.all?{|c|c.instance_variable_get(:@parameters)[4,2]==[20,50]}
          target.each{|c|c.instance_variable_get(:@parameters)[4,2]=[1,2]}
          File.binwrite(file,Marshal.dump(map))
          puts 'V224_CRABMAN_7_HIT_ROLLS_FOUR_DIRECTIONS_MATCH_23; ATTACK_DAMAGE_UNCHANGED'

          path="#{root}/#{prefix}CommonEvents.rxdata"
          events=Marshal.load(File.binread(path))
          {445=>428,538=>342}.each do |id,sw|
            ev=events.fetch(id)
            abort 'Unexpected common event switch' unless
              ev.instance_variable_get(:@switch_id)==sw && ev.instance_variable_get(:@trigger)==2
            first=ev.instance_variable_get(:@list).first
            abort 'King Bugbear not using Bugbear CE' unless
              first.instance_variable_get(:@code)==117 && first.instance_variable_get(:@parameters)==[895]
            first.instance_variable_set(:@parameters,[894])
          end
          abort 'King Bugbear attack CE unavailable' unless events.fetch(894).instance_variable_get(:@name).to_s.dup.force_encoding('UTF-8').include?("\u{D0B9}\u{BC84}\u{ADF8}")
          File.binwrite(path,Marshal.dump(events))
          puts 'V224_KING_BUGBEAR_TWO_WRONG_ATTACK_CE_LINKS_FIXED'

          # Preserve Ettin event timing and engine audio behavior.
          [882,907].each do |ce_id|
            event=events.fetch(ce_id)
            label=event.instance_variable_get(:@name).to_s.dup.force_encoding('UTF-8')
            abort 'Wrong Ettin CE' unless label.include?('에틴')
            sounds=event.instance_variable_get(:@list).select do |cmd|
              cmd.instance_variable_get(:@code)==250 &&
                cmd.instance_variable_get(:@parameters)[0].instance_variable_get(:@name).to_s.dup.force_encoding('UTF-8')=='에틴 공격'
            end
            abort "Wrong Ettin SE count #{ce_id}" unless sounds.size==2
            abort 'Wrong native pitch' unless sounds.all?{|c|
              c.instance_variable_get(:@parameters)[0].instance_variable_get(:@pitch)==100
            }
          end
          puts 'V224_ORIGINAL_ETTIN_ATTACK_CE882_CE907_INPUT_AND_TIMING_PRESERVED'
          RB_EXTRA

          # Portable FFmpeg filters: no rubberband dependency.
          audio='site/knight/gameasync/Audio/SE/에틴 공격.ogg'
          test -s "$audio"
          test "$(sha256sum "$audio" | cut -d ' ' -f 1)" = '50077318d1b6bc2d38ad0fb1ee111c78ec80e1eed015152469dd934e7b5902c0' || { echo 'Wrong Ettin source audio'; exit 1; }
          ffmpeg -nostdin -hide_banner -loglevel error -y -i "$audio" \
            -af 'asetrate=22050*0.55,aresample=22050,atempo=1.86,volume=0.65' \
            -c:a libvorbis -q:a 5 -ar 22050 -ac 1 "$audio.new.ogg"
          python3 - "$audio" "$audio.new.ogg" <<'PY_AUDIO'
          from pathlib import Path
          from subprocess import check_output
          import hashlib,sys
          before=Path(sys.argv[1]);after=Path(sys.argv[2])
          duration=lambda p:float(check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(p)]).decode().strip())
          a,b=duration(before),duration(after)
          if abs(a-b)>0.04:raise SystemExit('Ettin sound duration changed')
          if before.read_bytes()==after.read_bytes():raise SystemExit('Ettin sound unchanged')
          if after.stat().st_size<2000:raise SystemExit('Ettin output is empty')
          print('V224_ETTIN_LOWER_PITCH_SAME_DURATION',round(a,3),round(b,3))
          PY_AUDIO
          mv "$audio.new.ogg" "$audio"

          python3 - <<'PY_EXTRA_CACHE'
          from pathlib import Path
          import hashlib,re
          root=Path('site/knight')
          mapping=root/'gameasync/mapping.js'
          src=mapping.read_text()
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          names=[prefix+'Map%03d.rxdata'%n for n in (3,13,15,17,18,20,21,27,29,35,41,43)]
          names += [prefix+'CommonEvents.rxdata']
          for name in names:
              filename='Data/'+name
              md5=hashlib.md5((root/'gameasync'/filename).read_bytes()).hexdigest()
              src,n=re.subn(re.escape(filename+'?h=')+r'[a-f0-9]{32}',lambda m:filename+'?h='+md5,src)
              if n!=1:raise SystemExit('Missing asset map '+filename)
          et='Audio/SE/에틴 공격.ogg'
          digest=hashlib.md5((root/'gameasync'/et).read_bytes()).hexdigest()
          src,count=re.subn(re.escape(et+'?h=')+r'[a-f0-9]{32}',lambda m:et+'?h='+digest,src)
          if count!=1:raise SystemExit('Ettin sound asset mapping missing')
          mapping.write_text(src)
          PY_EXTRA_CACHE

      - name: Verify all untouched assets, map geometry and event scope
        if: steps.restore.outputs.skip_patch != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ruby - /tmp/v224_original site <<'RB_VERIFY'
          # encoding: utf-8
          module RPG
           class Map;end
           class Event;end
           class Event::Page;end
           class Event::Page::Condition;end
           class Event::Page::Graphic;end
           class EventCommand;end
           class MoveRoute;end
           class MoveCommand;end
           class AudioFile;end
          end
          class DummyRPGValue
           def self._load(data);new(data);end
           def initialize(data);@payload=data;end
           def _dump(_limit);@payload;end
          end
          class Color<DummyRPGValue;end
          class Tone<DummyRPGValue;end
          class Table<DummyRPGValue;end
          original,edited=ARGV
          change={
            3=>[23],
            13=>[5,6],
            15=>[4],
            17=>[19],
            18=>[2,3,4,13,15,18],
            20=>[5],
            21=>[16,17],
            27=>[8],
            29=>[6,10,15,21],
            35=>[16],
            41=>[5,6,7,8,16,17,18],
            43=>[32,57,59]
          }
          change.each do |n,ids|
            fn="/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap%03d.rxdata"%n
            raw0=File.binread(original+fn)
            m0=Marshal.load(raw0)
            m1=Marshal.load(File.binread(edited+fn))
            p0=m0.instance_variable_get(:@events)
            p1=m1.instance_variable_get(:@events)
            abort "V224_EVENT_ID_MISMATCH_MAP#{n}" unless p0.keys==p1.keys
            diffs=p0.keys.select{|id|Marshal.dump(p0[id])!=Marshal.dump(p1[id])}
            abort "V224_UNEXPECTED_EVENT_MUTATION_MAP#{n}:#{diffs}" unless diffs.sort==ids.sort
            ids.each{|id|p1[id]=p0[id]}
            assert_raw=Marshal.dump(m1)
            abort "V224_UNEXPECTED_TILES_OR_GEOMETRY_MAP#{n}" unless assert_raw==raw0
            puts "V224_MAP%03d_ONLY_EVENTS_%s_CHANGED_ALL_OTHER_DATA_BIT_IDENTICAL"%[n,ids.join('_')]
          end
          RB_VERIFY

          python3 - <<'PY_FINAL'
          from pathlib import Path
          import hashlib,json,re
          root=Path('site')
          old=json.loads(Path('/tmp/v224_before.json').read_text())
          new={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if old.keys()!=new.keys() or len(new)!=5354:raise SystemExit('V224 site inventory changed')
          changed={name for name in old if old[name]!=new[name]}
          allowed={
              'knight/index.html',
              'knight/gameasync/mapping.js',
              'knight/gameasync/Audio/SE/에틴 공격.ogg',
              'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata'
          }|{
              'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap%03d.rxdata'%n
              for n in (3,13,15,17,18,20,21,27,29,35,41,43)
          }
          if changed!=allowed:raise SystemExit('V224 forbidden changes '+repr(changed^allowed))
          html=(root/'knight/index.html').read_text()
          prior=Path('/tmp/v224_knight_index.html').read_text()
          if html!=prior.replace('gameasync/mapping.js?v=v209','gameasync/mapping.js?v=v224'):
              raise SystemExit('Knight HTML changed outside mapping cache token')
          mp=(root/'knight/gameasync/mapping.js').read_text()
          for n in (3,13,15,17,18,20,21,27,29,35,41,43):
              name='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap%03d.rxdata'%n
              md5=hashlib.md5((root/'knight/gameasync/Data'/name).read_bytes()).hexdigest()
              if mp.count('Data/'+name+'?h='+md5)!=1:
                  raise SystemExit('Map hash cache missing '+name)
          if new['knight/gameasync/Data/Scripts.rxdata']!=old['knight/gameasync/Data/Scripts.rxdata']:
              raise SystemExit('Unintended audio engine change')
          voice='knight/gameasync/Audio/SE/에틴 공격.ogg'
          md5=hashlib.md5((root/voice).read_bytes()).hexdigest()
          if mp.count('Audio/SE/에틴 공격.ogg?h='+md5)!=1:
              raise SystemExit('Ettin voice cache missing')
          print('V224_ONLY_SIXTEEN_KNIGHT_FILES_CHANGED; 5338_FILES_IDENTICAL_TO_V219')
          PY_FINAL

      - name: Upload verified complete Pages game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
