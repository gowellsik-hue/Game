name: build-slknight-web.yml | V4.13 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Restore V4.12 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45951348846
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify V4.12 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib,json

          root=Path('site')

          before={
              p.relative_to(root).as_posix():{
                  'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                  'md5':hashlib.md5(p.read_bytes()).hexdigest()
              }
              for p in root.rglob('*') if p.is_file()
          }

          assert len(before)==6085,len(before)

          assert (
              root/'knight/js/sl-assets-v229r115.js'
          ).read_bytes().count(
              b"var version='V4.12';"
          )==1

          for name in ('index.html','knight/index.html'):
              assert b'V4.12' in (root/name).read_bytes(),name

          Path('/tmp/sl413-before.json').write_text(
              json.dumps(before,sort_keys=True),'utf8'
          )

          print('PASS V4.12 baseline',len(before))
          PYTHON

      - name: Adjust original experience distribution
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl413-patch.rb <<'RUBY'
          # encoding: UTF-8
          require 'zlib'

          def check(ok,msg)
            raise msg unless ok
          end

          def once(s,a,b)
            check(
              s.scan(a).size==1,
              "Anchor #{a.inspect[0,120]}"
            )
            s.sub(a){b}
          end

          def patch(s)

            old=s[
              /^  def self\.distribute_exp\(event,xp,info\)\n.*?^  end\n/m
            ]

            check(old,'Original distribute_exp')

            t=once(
              old,
              "    base=(xp*20)/100\n",
              <<~'SRC'.gsub(/^/,'    ')
              bonus=[0,0,10,16,20][[actors.size,4].min]
              xp+=xp*bonus/100
              base=xp/2
            SRC
            )

            support=<<~'SRC'.gsub(/^/,'    ')
              support=actors.select{|a|a.id==3 || a.instance_variable_get(:@slv117_support_member)==true}
              if !support.empty?
                bonus=(xp*20)/100
                support.each{|a|amounts[a.id]+=bonus/support.size}
                (bonus%support.size).times{|i|amounts[support[i].id]+=1}
              end
            SRC

            t=once(t,support,'')

            once(s,old,t)

          end

          if __FILE__==$0

            file=ARGV.fetch(0)

            rows=Marshal.load(
              File.binread(file)
            )

            check(rows.size==137,'Script count')

            idx=rows.each_index.select{
              |i|rows[i][1].to_s=='V230 Boss Respawn 60s 180s'
            }

            check(idx==[134],'Reward script identity')

            before=rows.map{|r|Marshal.dump(r)}

            original=Zlib::Inflate.inflate(
              rows[134][2]
            ).force_encoding('UTF-8')

            check(
              original.valid_encoding?,
              'Script encoding'
            )

            s=original.gsub("\r\n","\n")

            t=patch(s)

            check(t!=s,'Reward script change')

            RubyVM::InstructionSequence.compile(t)

            rows[134][2]=Zlib::Deflate.deflate(
              (
                original.include?("\r\n") ?
                t.gsub("\n","\r\n") :
                t
              ).b
            )

            check(
              rows.each_index.select{
                |i|Marshal.dump(rows[i])!=before[i]
              }==[134],
              'Script scope'
            )

            File.binwrite(
              file,
              Marshal.dump(rows)
            )

            check(
              Marshal.dump(
                Marshal.load(File.binread(file))
              )==Marshal.dump(rows),
              'Marshal roundtrip'
            )

            puts 'PASS only original EXP distribution modified'

          end
          RUBY

          ruby -c /tmp/sl413-patch.rb

          ruby /tmp/sl413-patch.rb \
            site/knight/gameasync/Data/Scripts.rxdata

      - name: Verify all original experience records
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl413-test.rb <<'RUBY'
          # encoding: UTF-8
          require_relative 'sl413-patch'

          rows=Marshal.load(
            File.binread(ARGV.fetch(0))
          )

          s=Zlib::Inflate.inflate(
            rows[134][2]
          ).force_encoding('UTF-8').gsub("\r\n","\n")

          source=s[/^module SLV541\n.*?^end\n/m]

          check(source,'Original reward module')

          eval(
            source,
            TOPLEVEL_BINDING,
            'SLV541'
          )

          Actor=Struct.new(:id,:hp,:exp)
          Party=Struct.new(:actors)

          $game_player=Object.new
          $game_map=Object.new
          $game_switches=Hash.new(false)
          $game_actors={}

          [1,4,5,6].each do |id|

            $game_actors[id]=Actor.new(id,100,0)

          end

          $game_party=Party.new([])

          records=SLV541::DATA.values.flat_map{
            |m|m.values
          }

          check(
            records.size==491,
            'Original reward count'
          )

          check(
            records.count{|r|r[0]>0}==490,
            'Positive reward count'
          )

          cases=0

          [1,2,3,4].each do |n|

            actors=[1,4,5,6].first(n).map{
              |id|$game_actors[id]
            }

            $game_party.actors=actors

            [
              Array.new(n,0),
              Array.new(n,1),
              [100]+Array.new(n-1,0),
              [40,30,25,5].first(n)
            ].each do |weights|

              records.each do |info|

                actors.each{|a|a.exp=0}

                ledger={}

                actors.each_with_index do |a,i|

                  ledger[a.id]=weights[i]

                end

                $game_map.instance_variable_set(
                  :@slv117_damage,
                  {info[6]=>ledger}
                )

                xp=info[0]

                SLV541.distribute_exp(nil,xp,info)

                total=xp+xp*[0,10,16,20][n-1]/100

                check(
                  actors.inject(0){|v,a|v+a.exp}==total,
                  "Total #{n}:#{xp}"
                )

                base=total/2

                if n>1

                  check(
                    actors.all?{|a|a.exp>=base/n},
                    'Equal pool floor'
                  )

                  if weights.all?{|w|w==0}

                    check(
                      actors.first.exp>=total-base+base/n,
                      'No-ledger leader fallback'
                    )

                  end

                else

                  check(
                    actors.first.exp==xp,
                    'Solo unchanged'
                  )

                end

                cases+=1

              end

            end

          end

          actors=[1,4,5,6].map{
            |id|$game_actors[id]
          }

          $game_party.actors=actors

          info=[1000,0,nil,nil,1,0,9999]

          actors.each{|a|a.exp=0}

          actors.last.instance_variable_set(
            :@slv117_support_member,true
          )

          $game_map.instance_variable_set(
            :@slv117_damage,
            {
              9999=>{
                1=>40,
                4=>30,
                5=>25,
                6=>5
              }
            }
          )

          SLV541.distribute_exp(nil,1000,info)

          check(
            actors.map{|a|a.exp}==[390,330,300,180],
            'Exact 4-person 50:50 distribution; no obsolete bonus'
          )

          actors.each{|a|a.exp=0}

          actors.last.hp=0

          SLV541.distribute_exp(nil,1000,info)

          check(
            actors.last.exp==0 &&
            actors.inject(0){|v,a|v+a.exp}==1160,
            'Dead actor excluded from original membership'
          )

          check(cases==7856,'Full reward test count')

          puts "PASS #{cases} reward tests across all 491 records"
          puts 'PASS exact 4-person distribution'
          puts 'PASS no duplicate legacy bonus'
          puts 'PASS dead-member exclusion'
          RUBY

          ruby -c /tmp/sl413-test.rb

          ruby /tmp/sl413-test.rb \
            site/knight/gameasync/Data/Scripts.rxdata

      - name: Update original checksum and verify V4.13 scope
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib,json,re

          root=Path('site')

          mapper=root/'knight/gameasync/mapping.js'

          script=root/'knight/gameasync/Data/Scripts.rxdata'

          before=json.loads(
              Path('/tmp/sl413-before.json').read_text('utf8')
          )

          old=before[
              script.relative_to(root).as_posix()
          ]['md5']

          new=hashlib.md5(
              script.read_bytes()
          ).hexdigest()

          s=mapper.read_text('utf8')

          marker='Data/Scripts.rxdata?h='

          assert old!=new

          assert re.findall(
              re.escape(marker)+r'[0-9a-f]{32}',
              s
          )==[marker+old]

          mapper.write_text(
              s.replace(marker+old,marker+new),
              'utf8'
          )

          loader=root/'knight/js/sl-assets-v229r115.js'

          s=loader.read_bytes()

          assert s.count(
              b"var version='V4.12';"
          )==1

          loader.write_bytes(
              s.replace(
                  b"var version='V4.12';",
                  b"var version='V4.13';"
              )
          )

          for name in ('index.html','knight/index.html'):

              p=root/name

              s=p.read_bytes()

              assert b'V4.12' in s,name

              p.write_bytes(
                  s.replace(b'V4.12',b'V4.13')
                   .replace(b'v4.12',b'v4.13')
              )

          after={
              p.relative_to(root).as_posix():
                hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          assert len(after)==6085

          assert set(after)==set(before)

          changed={
              k for k in before
              if before[k]['sha256']!=after[k]
          }

          allowed={
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html',
              'knight/index.html'
          }

          assert changed==allowed,sorted(changed^allowed)

          print('PASS only EXP script, checksum and version files changed')
          print('PASS 50 percent equal distribution')
          print('PASS 50 percent damage contribution')
          print('PASS party bonuses 0, 10, 16, 20 percent')
          print('PASS 6080 unchanged files')
          print('PASS V4.13 candidate')
          PYTHON

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Upload V4.13 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
