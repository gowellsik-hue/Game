
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R66
# BASE: confirmed R65 successful run 40101972208.
# ORIGINAL: Sanctuary S32 Layer3 four-way attributes, V6.3 run 39385472903.
# FIX: original native WORLD tile movement in dungeon maps 45/46; no 5-cell
# detour translated to a direct RGSS step. Native collision shared by
# monsters and player, including 4-pad fallback to one legal native step.
# GRAPHICS: existing separated foreground wall renderer is preserved.
# EVIDENCE: original Layer4 object groups and Layer5 selectors validated,
# but original protected executable's opacity timing remains unproven:
# do NOT invent a layer5 transparency trigger.
# KEEP: engine, monsters, rewards, maps, all 5517 published game files.
name: build-slknight-web.yml | V229R66 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R66 Restore deployed R65 full game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40101972208
          name: github-pages
          github-token: ${{ github.token }}
          path: r65

      - name: V229R66 Restore original Sanctuary S32 and wall group evidence
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39385472903
          name: Sanctuary-Map-V6.3-Native-Passage-and-Wall-Groups-Handoff
          github-token: ${{ github.token }}
          path: source

      - name: V229R66 Verify R65 and authentic S32 source inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          [ -s r65/artifact.tar ]
          tar -xf r65/artifact.tar -C site
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          assert 'V229R65' in (root/'index.html').read_text('utf-8')
          scripts=root/'knight/gameasync/Data/Scripts.rxdata'
          assert hashlib.sha256(scripts.read_bytes()).hexdigest()=='56b498bac624f0b457189cddbb277e8701fd32d4cd5216376dc83ae9ae70d2cb'
          base={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(base)==5517,len(base)
          Path('build/r66-baseline.json').write_text(json.dumps(base,sort_keys=True))
          print('PASS exact deployed R65 baseline, 5517 files')
          PY_BASE

      - name: V229R66 Validate original Layer3 passage and Layer4 Layer5 grouping
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_NATIVE'
          from pathlib import Path
          import json,csv,hashlib
          root=Path('source')
          m=json.loads((root/'handoff-manifest.json').read_text('utf-8'))
          assert m['version']=='V6.3' and m['state']=='INTEGRATION_HANDOFF_NOT_APPLIED'
          assert m['passabilityIsOriginalMapToolCandidate']
          assert not m['SanctuaryExecutableRulesVerified']
          report={'version':'V229R66','source':'Sanctuary V6.3 raw S32 Layer3 and Layer4/Layer5 groups','original_executable_rule_verified':False,'floors':{}}
          for floor,mid,expected_nodes,expected_edges,group_count,selector_count in ((1,45,5955,9857,2164,16646),(2,46,11665,20876,3041,23143)):
           cfg=json.loads((root/f'native/floor-{floor}-index.json').read_text('utf-8'))
           raw=(root/f'native/floor-{floor}-4way.bin').read_bytes()
           assert hashlib.sha256(raw).hexdigest()==cfg['passageSHA256']
           assert len(raw)==cfg['size'][0]*cfg['size'][1]
           assert cfg['rgssMapID']==mid and cfg['directionalEdgeReciprocityVerified']
           numgroups=0;selectors=0;objs=0
           for line in (root/f'occlusion/floor-{floor}-source-groups.jsonl').open(encoding='utf-8'):
            g=json.loads(line);numgroups+=1;selectors+=len(g['layer5Selectors']);objs+=len(g['objects'])
            assert g['floor']==floor and 'blockWorldOrigin' in g and 'layer4GroupID' in g
           assert (numgroups,selectors)==(group_count,selector_count)
           report['floors'][str(mid)]={'native_width':cfg['size'][0],'native_height':cfg['size'][1],
              'native_connected_route_reference':expected_nodes,'source_undirected_edges':expected_edges,
              'layer4_groups':numgroups,'layer4_objects':objs,'layer5_selector_records':selectors,
              'native_sha256':cfg['passageSHA256']}
           print(f'PASS original floor {floor}: {numgroups} Layer4 groups, {selectors} Layer5 selectors, {len(raw)} S32 cells')
          Path('build/r66-source-audit.json').write_text(json.dumps(report,indent=2))
          PY_NATIVE

      - name: V229R66 Write source-native movement adapter
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r66_native_template.rb <<'R66_ADAPTER'
          # V229R66: preserve original Sanctuary four-way native tile coordinates.
          # All collision bits come from the original S32 Layer3 Attribute1/2 candidate.
          # No R42 <=5-cell detour, image-alpha collision, or 384/385 inferred walls.
          module SLTI_Native66
            ORIGIN_X=32576
            ORIGIN_Y=32704
            WIDTH={45=>256,46=>320}
            HEIGHT={45=>256,46=>256}
            YOFFSET={45=>378,46=>762}
            EDGES={
              #%%NATIVE_EDGES%%
            }
            def self.active_map?(mid)
              mid==45 || mid==46
            end
            def self.value(mid,x,y)
              w=WIDTH[mid]
              return 0 if w==nil || x<ORIGIN_X || y<ORIGIN_Y ||
                x>=ORIGIN_X+w || y>=ORIGIN_Y+HEIGHT[mid]
              s=EDGES[mid]
              p=(y-ORIGIN_Y)*w+(x-ORIGIN_X)
              v=s[p,1]
              return 0 if v==nil
              c=v.unpack('C')[0]
              return (c==255 ? 0 : c)
            end
            def self.edge?(mid,x,y,dx,dy)
              return false unless dx.abs+dy.abs==1
              b=dx>0 ? 8 : dx<0 ? 4 : dy>0 ? 2 : 1
              reverse=dx>0 ? 4 : dx<0 ? 8 : dy>0 ? 1 : 2
              return (value(mid,x,y)&b)!=0 && (value(mid,x+dx,y+dy)&reverse)!=0
            end
            def self.move_path?(mid,x,y,dx,dy)
              return edge?(mid,x,y,dx,dy) if dx==0 || dy==0
              return false unless dx.abs==1 && dy.abs==1
              return true if edge?(mid,x,y,dx,0) && edge?(mid,x+dx,y,0,dy)
              return true if edge?(mid,x,y,0,dy) && edge?(mid,x,y+dy,dx,0)
              return false
            end
            def self.project(mid,x,y)
              px=12*(x+y)-784128
              py=6*(y-x)+YOFFSET[mid]
              return [px,py]
            end
            def self.real(mid,x,y)
              px,py=project(mid,x,y)
              # screen_x=real_x/4+16, screen_y=real_y/4+32, terrain=source x2
              return [px*8-64,py*8-128]
            end
            def self.to_rgss(mid,x,y)
              px,py=project(mid,x,y)
              return [px/16,py/16]
            end
            def self.nearest(mid,rx,ry,radius=16)
              return nil unless active_map?(mid)
              u=rx*16+8
              v=ry*16+16
              a=(u+784128).to_f/12
              b=(v-YOFFSET[mid]).to_f/6
              x0=((a-b)/2).round
              y0=((a+b)/2).round
              best=nil
              for dx in -4..4
                for dy in -4..4
                  x=x0+dx;y=y0+dy
                  next if value(mid,x,y)==0
                  px,py=project(mid,x,y)
                  dist2=(u-px)*(u-px)+(v-py)*(v-py)
                  next if dist2>radius*radius
                  candidate=[dist2,x,y]
                  best=candidate if best==nil || candidate[0]<best[0]
                end
              end
              return nil if best==nil
              return [best[1],best[2]]
            end
            def self.native_target(mid,x,y,dir)
              # Isometric source: screen diagonals are one native S32 cardinal move.
              moves={2=>[-1,1],4=>[-1,-1],6=>[1,1],8=>[1,-1],
                1=>[-1,0],3=>[0,1],7=>[0,-1],9=>[1,0]}
              d=moves[dir]
              return nil if d==nil
              dx,dy=d
              if dx==0 || dy==0
                return edge?(mid,x,y,dx,dy) ? [x+dx,y+dy] : nil
              end
              if move_path?(mid,x,y,dx,dy)
                return [x+dx,y+dy]
              end
              # Input pad has four buttons: use ONE original open edge to slide
              # along a wall; never pretend a route through the blocked wall exists.
              if edge?(mid,x,y,dx,0)
                return [x+dx,y]
              end
              if edge?(mid,x,y,0,dy)
                return [x,y+dy]
              end
              return nil
            end
            def self.native_line?(mid,ax,ay,bx,by)
              return false unless value(mid,ax,ay)!=0 && value(mid,bx,by)!=0
              x=ax;y=ay
              dx=(bx-ax).abs;dy=(by-ay).abs
              sx=bx>=ax ? 1 : -1
              sy=by>=ay ? 1 : -1
              err=dx-dy
              steps=0
              until x==bx && y==by
                return false if steps>512
                e=err*2
                nx=x;ny=y
                if e > -dy
                  err-=dy;nx+=sx
                end
                if e < dx
                  err+=dx;ny+=sy
                end
                return false unless move_path?(mid,x,y,nx-x,ny-y)
                x=nx;y=ny;steps+=1
              end
              return true
            end
          end

          class Game_Character
            alias slti_native66_original_moveto moveto
            alias slti_native66_original_moving moving?
            alias slti_native66_original_update_move update_move
            def slti_native66_character?
              return false if $game_map==nil
              mid=$game_map.map_id
              return false unless SLTI_Native66.active_map?(mid)
              return true if self==$game_player
              return SLTI_V229R49.monster?(self)
            end
            def slti_native66_prepare
              return false unless slti_native66_character?
              mid=$game_map.map_id
              if @slti_native66_map!=mid || @slti_native66_x==nil || @slti_native66_y==nil
                spot=SLTI_Native66.nearest(mid,@x,@y,16)
                return false if spot==nil
                @slti_native66_map=mid
                @slti_native66_x,@slti_native66_y=spot
                @slti_native66_tx,@slti_native66_ty=SLTI_Native66.real(mid,spot[0],spot[1])
                @real_x=@slti_native66_tx
                @real_y=@slti_native66_ty
              end
              return true
            end
            def moveto(x,y)
              @slti_native66_map=nil
              @slti_native66_x=nil
              @slti_native66_y=nil
              slti_native66_original_moveto(x,y)
              slti_native66_prepare
            end
            def moving?
              if slti_native66_prepare
                return @real_x!=@slti_native66_tx || @real_y!=@slti_native66_ty
              end
              slti_native66_original_moving
            end
            def update_move
              unless slti_native66_prepare
                return slti_native66_original_update_move
              end
              distance=2**@move_speed
              @real_x=[@real_x+distance,@slti_native66_tx].min if @real_x<@slti_native66_tx
              @real_x=[@real_x-distance,@slti_native66_tx].max if @real_x>@slti_native66_tx
              @real_y=[@real_y+distance,@slti_native66_ty].min if @real_y<@slti_native66_ty
              @real_y=[@real_y-distance,@slti_native66_ty].max if @real_y>@slti_native66_ty
              if @walk_anime
                @anime_count+=1.5
              elsif @step_anime
                @anime_count+=1
              end
            end
            def slti_native66_move(dir,turn=true)
              return false unless slti_native66_prepare
              mid=@slti_native66_map
              target=SLTI_Native66.native_target(mid,@slti_native66_x,@slti_native66_y,dir)
              return false if target==nil
              nx,ny=SLTI_Native66.to_rgss(mid,target[0],target[1])
              return false unless $game_map.valid?(nx,ny)
              # Preserve original event occupancy, independent of wall geometry.
              unless @through
                $game_map.events.values.each do |other|
                  next if other==self || other.through
                  return false if other.x==nx && other.y==ny && other.character_name!=''
                end
                if self!=$game_player && $game_player!=nil && !$game_player.through
                  return false if $game_player.x==nx && $game_player.y==ny
                end
              end
              @slti_native66_x=target[0]
              @slti_native66_y=target[1]
              @slti_native66_tx,@slti_native66_ty=SLTI_Native66.real(mid,target[0],target[1])
              @x=nx;@y=ny
              increase_steps
              return true
            end
            alias slti_native66_original_down move_down
            alias slti_native66_original_left move_left
            alias slti_native66_original_right move_right
            alias slti_native66_original_up move_up
            alias slti_native66_original_ll move_lower_left
            alias slti_native66_original_lr move_lower_right
            alias slti_native66_original_ul move_upper_left
            alias slti_native66_original_ur move_upper_right
            def move_down(turn_enabled=true)
              return slti_native66_original_down(turn_enabled) unless slti_native66_prepare
              turn_down if turn_enabled
              slti_native66_move(2)
            end
            def move_left(turn_enabled=true)
              return slti_native66_original_left(turn_enabled) unless slti_native66_prepare
              turn_left if turn_enabled
              slti_native66_move(4)
            end
            def move_right(turn_enabled=true)
              return slti_native66_original_right(turn_enabled) unless slti_native66_prepare
              turn_right if turn_enabled
              slti_native66_move(6)
            end
            def move_up(turn_enabled=true)
              return slti_native66_original_up(turn_enabled) unless slti_native66_prepare
              turn_up if turn_enabled
              slti_native66_move(8)
            end
            def move_lower_left
              return slti_native66_original_ll unless slti_native66_prepare
              slti_native66_move(1)
            end
            def move_lower_right
              return slti_native66_original_lr unless slti_native66_prepare
              slti_native66_move(3)
            end
            def move_upper_left
              return slti_native66_original_ul unless slti_native66_prepare
              slti_native66_move(7)
            end
            def move_upper_right
              return slti_native66_original_ur unless slti_native66_prepare
              slti_native66_move(9)
            end
          end

          # Replace the old R42/R44 graph used by monster first-sight/attack ray tests.
          module SLTI_V229R49
            def self.direct_line?(mid,ax,ay,bx,by)
              return false unless SLTI_Native66.active_map?(mid)
              a=SLTI_Native66.nearest(mid,ax,ay,16)
              b=SLTI_Native66.nearest(mid,bx,by,16)
              return false if a==nil || b==nil
              SLTI_Native66.native_line?(mid,a[0],a[1],b[0],b[1])
            end
            def self.first_sight?(mid,ax,ay,bx,by,distance)
              return false if (ax-bx).abs+(ay-by).abs>=distance
              direct_line?(mid,ax,ay,bx,by)
            end
            def self.attack_open?(e)
              return true unless monster?(e) && $game_player!=nil
              return direct_line?($game_map.map_id,e.x,e.y,$game_player.x,$game_player.y)
            end
          end

          # Any remaining movement query must consult the same native wall-base edges.
          # The current Game_Map and Game_Character implementation used separate R65
          # coarse graphs; those are no longer authoritative on the two native floors.
          class Game_Map
            alias slti_native66_original_passable passable?
            def passable?(x,y,d,self_event=nil)
              if SLTI_Native66.active_map?(@map_id) && (d==2 || d==4 || d==6 || d==8)
                cell=SLTI_Native66.nearest(@map_id,x,y,16)
                return false if cell==nil
                return SLTI_Native66.native_target(@map_id,cell[0],cell[1],d)!=nil
              end
              slti_native66_original_passable(x,y,d,self_event)
            end
          end
          class Game_Character
            alias slti_native66_original_passable passable?
            def passable?(x,y,d)
              if SLTI_Native66.active_map?($game_map.map_id) &&
                 (d==2 || d==4 || d==6 || d==8) && slti_native66_prepare
                return SLTI_Native66.native_target(
                  @slti_native66_map,@slti_native66_x,@slti_native66_y,d)!=nil
              end
              slti_native66_original_passable(x,y,d)
            end
          end
          R66_ADAPTER

          python3 - <<'PY_POPULATE'
          from pathlib import Path
          import base64
          base=Path('source/native')
          source=Path('/tmp/r66_native_template.rb').read_text('utf-8')
          assert source.count('    #%%NATIVE_EDGES%%')==1
          chunks=[]
          for mid,floor in ((45,1),(46,2)):
           blob=(base/f'floor-{floor}-4way.bin').read_bytes()
           enc=base64.b64encode(blob).decode('ascii')
           rows=',\n      '.join('"'+enc[i:i+120]+'"' for i in range(0,len(enc),120))
           chunks.append(f'{mid}=>[\n      {rows}\n    ].join.unpack(\'m\')[0]')
          source=source.replace('    #%%NATIVE_EDGES%%',',\n    '.join(chunks))
          Path('build/r66-native.rb').write_text(source,encoding='utf-8')
          print('PASS exact original native S32 bytes embedded for the runtime')
          PY_POPULATE
          ruby -c build/r66-native.rb

          ruby - <<'RB_PATCH'
          require 'zlib'
          path='site/knight/gameasync/Data/Scripts.rxdata'
          a=Marshal.load(File.binread(path));before=Marshal.load(File.binread(path))
          raise 'Unexpected script count' unless a.size==136
          current=Zlib::Inflate.inflate(a[134][2]).force_encoding('UTF-8')
          raise 'Native adapter already exists' if current.include?('module SLTI_Native66')
          raise 'Existing wall renderer missing' unless current.include?('def slti_r49_update_walls')
          raise 'Original monster reward runtime missing' unless current.include?('module SLV541')
          adapter=File.read('build/r66-native.rb',encoding:'utf-8')
          newcode=current+"\n"+adapter
          File.write('build/r66-script134.rb',newcode)
          a[134][2]=Zlib::Deflate.deflate(newcode.b)
          raise 'Changed other game scripts' unless a.each_index.all?{|i| i==134 || a[i]==before[i]}
          File.binwrite(path,Marshal.dump(a))
          check=Marshal.load(File.binread(path))
          raise 'Missing adapter after marshal' unless Zlib::Inflate.inflate(check[134][2]).include?('module SLTI_Native66')
          raise 'Original graphics and reward prefix modified' unless Zlib::Inflate.inflate(check[134][2]).force_encoding('UTF-8').start_with?(current)
          puts 'PASS native movement source installed after original game methods; all other scripts preserved'
          RB_PATCH
          ruby -c build/r66-script134.rb

      - name: V229R66 Test original source routes, coordinate sync and wall crossings
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r66_test.rb <<'RB_TEST'
          require 'csv'
          text=File.read('build/r66-native.rb')
          eval(text[0...text.index("\nclass Game_Character")])
          source='source/routes/'
          [45,46].each do |mid|
            route=(mid==45 ? 'entrance_to_2f.csv' : 'return_stairs_to_baphomet.csv')
            rows=CSV.read(source+route,headers:true,encoding:'UTF-8')
            prev=nil
            count=0
            rows.each do |r|
              x=r['nativeX'].to_i;y=r['nativeY'].to_i
              if prev!=nil
                dx=x-prev[0];dy=y-prev[1]
                raise 'Non-cardinal original route' unless dx.abs+dy.abs==1
                raise 'Native wall crossed' unless SLTI_Native66.edge?(mid,prev[0],prev[1],dx,dy)
                count+=1
              end
              prev=[x,y]
            end
            raise "Unexpected original route length #{mid}" unless count==(mid==45 ? 551 : 109)
            puts "PASS native original #{mid} route through #{count} S32 steps"
          end
          [45,46].each do |mid|
            w=SLTI_Native66::WIDTH[mid];h=SLTI_Native66::HEIGHT[mid]
            checked=0
            h.times do |y|
              w.times do |x|
                nx=x+SLTI_Native66::ORIGIN_X
                ny=y+SLTI_Native66::ORIGIN_Y
                next if SLTI_Native66.value(mid,nx,ny)==0
                [2,4,6,8].each do |d|
                  t=SLTI_Native66.native_target(mid,nx,ny,d)
                  next if t==nil
                  raise 'Wall bypass' unless SLTI_Native66.move_path?(mid,nx,ny,t[0]-nx,t[1]-ny)
                  checked+=1
                end
              end
            end
            puts "PASS every open source step on Map#{mid}; #{checked} four-pad movements, no five-tile detours"
          end
          RB_TEST
          ruby /tmp/r66_test.rb

      - name: V229R66 Refresh original script hash and verify preservation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import hashlib,re,json
          root=Path('site');game=root/'knight/gameasync';mapping=game/'mapping.js'
          s=mapping.read_text('utf-8')
          digest=hashlib.md5((game/'Data/Scripts.rxdata').read_bytes()).hexdigest()
          s,n=re.subn(r'Data/Scripts\.rxdata\?h=[0-9a-f]{32}',lambda m:'Data/Scripts.rxdata?h='+digest,s)
          assert n==1,n
          mapping.write_text(s,encoding='utf-8')
          for name in ('index.html','knight/index.html'):
           f=root/name;old=f.read_text('utf-8')
           assert 'V229R65' in old
           f.write_text(old.replace('V229R65','V229R66').replace('v229r65','v229r66'),encoding='utf-8')
          base=json.loads(Path('build/r66-baseline.json').read_text('utf-8'))
          now={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert now.keys()==base.keys() and len(now)==5517
          changes={p for p in base if base[p]!=now[p]}
          allowed={'index.html','knight/index.html','knight/gameasync/mapping.js','knight/gameasync/Data/Scripts.rxdata'}
          assert changes==allowed,('Unexpected game edits',changes^allowed)
          report=json.loads(Path('build/r66-source-audit.json').read_text('utf-8'))
          assert report['floors']['45']['layer4_groups']==2164
          assert report['floors']['46']['layer4_groups']==3041
          print('PASS full 5517-file game; only script, manifest and version labels changed')
          PY_FINAL
          node --check site/knight/gameasync/mapping.js

      - name: V229R66 Upload original native passage and wall-group validation
        uses: actions/upload-artifact@v4
        with:
          name: SLKnight-V229R66-Native-S32-Wall-Layers-Audit
          path: build/r66-source-audit.json
          retention-days: 30
          if-no-files-found: error

      - name: V229R66 Upload full game to existing GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
