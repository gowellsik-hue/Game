           file=File.join(PREFIX,PRE+format('Map%03d.rxdata',mid))
           old=File.binread(file);m=Marshal.load(old)
           events=iv(m,'events')
           group.each do |r|
            _mid,id,name,lv,hp,dodge,phys,magic,floor,wait,hit,speed,freq,exp,gold,low,high,cls,ce=r
            ev=events[id];check(ev!=nil,"Missing V230 event #{mid}:#{id}")
            ename=iv(ev,'name').to_s.dup.force_encoding('UTF-8').scrub
            check(ename.include?(name),"V230 monster name mismatched #{mid}:#{id}: #{name} / #{ename}")
            check(hp.to_i>0 && hp.to_s.match(/\A\d+\z/),"Non-numeric HP #{mid}:#{id}")
            check(exp.is_a?(Integer) && exp>=0,"Non-numeric EXP #{mid}:#{id}")
            check(gold.is_a?(Integer) && gold>=0,"Non-numeric Adena #{mid}:#{id}")
            if low!=nil || high!=nil
              check(low.is_a?(Integer) && high.is_a?(Integer) && low>=0 && low<=gold && gold<=high,"Bad Adena interval #{mid}:#{id}")
            end
            pages=iv(ev,'pages')
            keyed=pages.each_with_index.select{|p,i|iv(iv(p,'condition'),'variable_valid')}
            check(!keyed.empty?,"No HP death condition #{mid}:#{id}")
            death,deathindex=keyed.max_by{|p,i|iv(iv(p,'condition'),'variable_value')}
             original_range=nil
             if cls=='일반' && gold>0
               original_range=native_money_random(death,common_events)
               if original_range==nil
                 normal_fixed+=1
               else
                 normal_native+=1
               end
               native_money<<[mid,id,name,gold,original_range]
             end
             cond=iv(death,'condition')
            oldhp=iv(cond,'variable_value')
            if oldhp!=hp.to_i
              set(cond,'variable_value',hp.to_i)
              updatedHP<<[mid,id,oldhp,hp.to_i]
            end
            # Keep all move route/event commands; only change monster motion-page speeds.
            if speed.is_a?(Integer) && freq.is_a?(Integer)
              pages.each_with_index do |page,j|
                next if j==deathindex
                graphic=iv(page,'graphic')
                char=iv(graphic,'character_name').to_s.dup.force_encoding('UTF-8').scrub
                next if char.empty? || char.include?('죽음') || char.include?('피격')
                next unless iv(page,'move_type')!=0
                from=[iv(page,'move_speed'),iv(page,'move_frequency')]
                if from!=[speed,freq]
                  set(page,'move_speed',speed);set(page,'move_frequency',freq)
                  updatedSpeed<<[mid,id,j,from,[speed,freq]]
                end
              end
            end
            # V230 dodgeActual is generated in monster attack pages via var335.
            dd=dodge.to_s
            pair=dd.match(/\A(\d+)~(\d+)\z/)
            fixed=dd.match(/\A고정 (\d+)\z/)
            if pair || fixed
              target=pair ? [0,2,pair[1].to_i,pair[2].to_i] : [0,0,fixed[1].to_i]
              pages.each_with_index do |page,j|
                next if j==deathindex
                iv(page,'list').each do |command|
                  next unless iv(command,'code')==122
                  p=iv(command,'parameters')
                  next unless p[0]==335 && p[1]==335 && p[2]==0 && (p[3]==2 || p[3]==0)
                  after=[335,335]+target
                  if p!=after
                    set(command,'parameters',after)
                    updatedDodge<<[mid,id,j,p,after]
                  end
                end
              end
            end
            # Fix numeric MAX HP shown above monsters without touching other HUD text.
            pages.each_with_index do |page,i|
             iv(page,'list').each do |command|
              next unless iv(command,'code')==355
              p=iv(command,'parameters');next unless p.length==1 && p[0].is_a?(String)
              next unless p[0].include?('$m.drawMHP(')
              source=p[0]
