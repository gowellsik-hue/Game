
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V276.7.2
# BASE: successful V276.7.1, run 41790334490.
# BASE FILES: 5622 verified game files.
# CHANGE: native Sprite_Character 4/8-frame selection.
# WALK FIX: align SLZQWalk frame positions inside each cell.
# LEGACY: original 4-frame monsters unchanged.
# NEW: SLZQWalk and SL8_ graphics use 8 frames.
# DIRECTIONS: original four directions only.
# RUNTIME: one native Sprite_Character.update.
# REMOVE: queen-only duplicate update registration.
# KEEP: combat, animations, drops and respawn.
# ROLLBACK: remove alignment step to restore prior walking PNG.
# VERSION: retain V276.7.2.

name: build-slknight-web.yml | V276.7.2 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Restore verified V276.7.1 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41790334490
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify original V276.7.1 baseline
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p site build
          test -s baseline/artifact.tar
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          root=Path('site')

          files={
            str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
            for p in root.rglob('*') if p.is_file()
          }

          assert len(files)==5622,(
            'V276.7.1 baseline inventory mismatch',
            len(files)
          )

          data=root/'knight/gameasync/Data'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          for name in (
            'Scripts.rxdata',
            pre+'Map025.rxdata',
            pre+'Map019.rxdata',
            pre+'CommonEvents.rxdata',
            pre+'Animations.rxdata'
          ):
            assert (data/name).is_file(),name

          assert (
            root/'knight/gameasync/Graphics/Characters/'
            'SLZQWalk.png'
          ).is_file()

          for name in ('index.html','knight/index.html'):
            assert 'V276.7.1' in (
              root/name
            ).read_text('utf-8')

          Path('build/original_sha256.json').write_text(
            json.dumps(files),encoding='utf-8'
          )

          print('PASS V276.7.1 baseline restored')
          print('PASS 5622 original files')
          PY

      - name: Align queen walk frames without map movement
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install \
            --disable-pip-version-check pillow

          cat > build/align_slzq_walk.py <<'SLZQ_ALIGN'
          from pathlib import Path
          from statistics import median
          from PIL import Image
          import json

          path=Path(
            'site/knight/gameasync/Graphics/'
            'Characters/SLZQWalk.png'
          )

          assert path.is_file(),path

          original=Image.open(path).convert('RGBA')

          COLS=8
          ROWS=4

          assert original.width%COLS==0
          assert original.height%ROWS==0

          CW=original.width//COLS
          CH=original.height//ROWS

          assert (CW,CH)==(168,144),(
            'Unexpected original queen walk dimensions',
            CW,CH
          )

          output=Image.new(
            'RGBA',
            original.size,
            (0,0,0,0)
          )

          def analyze(frame):
            alpha=frame.getchannel('A')
            raw=alpha.getbbox()

            assert raw is not None,(
              'Empty walking frame'
            )

            mask=alpha.point(
              lambda value:255 if value>=24 else 0
            )

            bbox=mask.getbbox()
            assert bbox is not None

            left,top,right,bottom=bbox

            height=bottom-top

            # Measure upper body rather than
            # swinging arms and legs.
            y1=top+round(height*0.12)
            y2=top+round(height*0.60)

            y1=max(top,min(y1,bottom-1))
            y2=max(y1+1,min(y2,bottom))

            pixels=alpha.load()

            weight=0
            sum_x=0

            for y in range(y1,y2):
              for x in range(left,right):
                a=pixels[x,y]

                if a<24:
                  continue

                weight+=a
                sum_x+=x*a

            body_x=(
              sum_x/weight if weight
              else (left+right-1)/2
            )

            return {
              'body_x':body_x,
              'foot_y':bottom-1,
              'raw_bbox':raw
            }

          report=[]
          corrected_count=0

          for direction in range(ROWS):
            frames=[]
            metrics=[]

            for index in range(COLS):
              box=(
                index*CW,
                direction*CH,
                (index+1)*CW,
                (direction+1)*CH
              )

              frame=original.crop(box)
              frames.append(frame)
              metrics.append(analyze(frame))

            # Shared fixed reference for this direction.
            # Each frame retains its own limb pose.
            target_x=median(
              item['body_x'] for item in metrics
            )

            target_y=median(
              item['foot_y'] for item in metrics
            )

            row_report=[]

            for index,(frame,item) in enumerate(
              zip(frames,metrics)
            ):
              dx=round(target_x-item['body_x'])
              dy=round(target_y-item['foot_y'])

              left,top,right,bottom=(
                item['raw_bbox']
              )

              # Prevent pixel clipping at cell edges.
              min_dx=-left
              max_dx=CW-right
              min_dy=-top
              max_dy=CH-bottom

              dx=max(min_dx,min(dx,max_dx))
              dy=max(min_dy,min(dy,max_dy))

              if dx!=0 or dy!=0:
                corrected_count+=1

              aligned=Image.new(
                'RGBA',(CW,CH),(0,0,0,0)
              )

              aligned.paste(frame,(dx,dy))

              # Verify that no visible pixel was lost.
              source_alpha=sum(
                frame.getchannel('A').getdata()
              )
              result_alpha=sum(
                aligned.getchannel('A').getdata()
              )

              assert source_alpha==result_alpha,(
                'Clipped visible walk pixels',
                direction,index
              )

              output.paste(
                aligned,
                (index*CW,direction*CH)
              )

              row_report.append({
                'frame':index,
                'dx':dx,
                'dy':dy,
                'body_x_after':
                  round(item['body_x']+dx,3),
                'foot_y_after':
                  item['foot_y']+dy
              })

            before_x=[
              v['body_x'] for v in metrics
            ]
            before_y=[
              v['foot_y'] for v in metrics
            ]

            after_x=[
              v['body_x_after']
              for v in row_report
            ]
            after_y=[
              v['foot_y_after']
              for v in row_report
            ]

            x_before=max(before_x)-min(before_x)
            y_before=max(before_y)-min(before_y)

            x_after=max(after_x)-min(after_x)
            y_after=max(after_y)-min(after_y)

            assert x_after<=x_before+1,(
              'Horizontal alignment regressed',
              direction
            )

            assert y_after<=y_before+1,(
              'Vertical alignment regressed',
              direction
            )

            report.append({
              'direction':[2,4,6,8][direction],
              'before_x_range':round(x_before,3),
              'before_y_range':round(y_before,3),
              'after_x_range':round(x_after,3),
              'after_y_range':round(y_after,3),
              'frames':row_report
            })

          assert corrected_count>0,(
            'No original frame-position variation '
            'was detected; source may require '
            'a different walking correction'
          )

          # Generated site only.
          # The restored baseline remains untouched.
          output.save(path,optimize=True)

          saved=Image.open(path).convert('RGBA')

          assert saved.size==original.size
          assert corrected_count<=32

          Path(
            'build/slzq_walk_alignment.json'
          ).write_text(
            json.dumps(
              {
                'frame_size':[CW,CH],
                'corrected_frames':corrected_count,
                'directions':report
              },
              indent=2
            ),
            encoding='utf-8'
          )

          for item in report:
            print(
              'Direction',item['direction'],
              'X range',
              item['before_x_range'],'->',
              item['after_x_range'],
              'Y range',
              item['before_y_range'],'->',
              item['after_y_range']
            )

          print(
            'PASS queen walk alignment',
            corrected_count,'of 32 frames'
          )
          print(
            'PASS original poses and alpha preserved'
          )
          print(
            'PASS no map-position changes'
          )

          SLZQ_ALIGN

          python3 build/align_slzq_walk.py

      - name: V276.7.2 Native 4 and 8 frame branch
        shell: bash
        run: |
          set -euo pipefail

          cat > build/slwalk8.rb <<'SLWALK8_RUBY'
          require 'zlib'
          require 'fileutils'

          module RPG
            class Map;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class AudioFile;end
            class MoveRoute;end
            class MoveCommand;end
          end

          class Table
            def self._load(bytes)
              obj=allocate
              obj.instance_variable_set(:@raw,bytes)
              obj
            end

            def _dump(level=0)
              @raw
            end
          end

          class Tone
            def self._load(bytes)
              obj=allocate
              obj.instance_variable_set(:@raw,bytes)
              obj
            end

            def _dump(level=0)
              @raw
            end
          end

          class Color<Tone;end

          def check(value,message)
            raise message unless value
          end

          root='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          scripts_path=root+'Scripts.rxdata'
          map_path=root+pre+'Map025.rxdata'

          # ------------------------------------------
          # Native Sprite_Character.
          # No alias, no extra update, no timer.
          # ------------------------------------------

          script_before=File.binread(scripts_path)
          scripts=Marshal.load(script_before)

          check(
            scripts.length==137,
            'Original RGSS script count mismatch'
          )

          matches=scripts.each_index.select do |i|
            scripts[i][1]=='Sprite_Character'
          end

          check(
            matches.length==1,
            'Sprite_Character must occur once'
          )

          script_id=matches.first

          original=Zlib::Inflate.inflate(
            scripts[script_id][2]
          )

          code=original.dup

          # Find the existing native assignments.
          # Accept bitmap or charbitmap and CRLF.
          # Preserve the original expression.

          width_lines=code.lines.select do |line|
            line.match?(/^[ \t]*@cw[ \t]*=/) &&
            line.match?(/\bwidth[ \t]*\/[ \t]*4\b/)
          end

          frame_lines=code.lines.select do |line|
            line.match?(/^[ \t]*sx[ \t]*=/) &&
            line.include?('@character.pattern')
          end

          check(
            width_lines.length==1,
            'Native width lines: '+
            code.lines.grep(/@cw[ \t]*=/).
              map(&:strip).inspect
          )

          check(
            frame_lines.length==1,
            'Native frame lines: '+
            code.lines.grep(/sx[ \t]*=/).
              map(&:strip).inspect
          )

          eol=code.include?("\r\n") ? "\r\n" : "\n"

          width_line=width_lines.first
          frame_line=frame_lines.first

          indent=width_line[/\A[ \t]*/]
          frame_indent=frame_line[/\A[ \t]*/]

          # Replace only the original divisor 4.
          # The original bitmap source is retained.

          width_new=width_line.chomp.sub(
            /(\bwidth[ \t]*\/[ \t]*)4\b/,
            '\1(@sl_walk8 ? 8 : 4)'
          )

          check(
            width_new!=width_line.chomp,
            'Native width divisor not patched'
          )

          width_replacement=[
            indent+'@sl_walk8 = (',
            indent+'  @character.character_name == "SLZQWalk" ||',
            indent+'  @character.character_name[0,4] == "SL8_"',
            indent+')',
            width_new
          ].join(eol)+eol

          check(
            code.sub!(width_line,width_replacement),
            'Native width replacement failed'
          )

          # Replace only native frame selection.
          # Legacy pattern expression is preserved.

          original_frame=frame_line.strip.sub(
            /\Asx[ \t]*=[ \t]*/,
            ''
          )

          frame_replacement=[
            'sx = if @sl_walk8',
            '  attacking = (',
            '    @character.respond_to?(:sl_attack_active?) &&',
            '    @character.sl_attack_active?',
            '  )',
            '  if @character.moving? && !attacking',
            '    rx = @character.instance_variable_get(:@real_x)',
            '    ry = @character.instance_variable_get(:@real_y)',
            '    if rx && ry',
            '      remaining = (',
            '        (@character.x * 128 - rx).abs +',
            '        (@character.y * 128 - ry).abs',
            '      )',
            '      progress = 128 - remaining',
            '      progress = 0 if progress < 0',
            '      progress = 127 if progress > 127',
            '      (progress / 16) * @cw',
            '    else',
            '      0',
            '    end',
            '  else',
            '    0',
            '  end',
            'else',
            '  '+original_frame,
            'end'
          ].map{|line|frame_indent+line}.join(eol)+eol

          check(
            code.sub!(frame_line,frame_replacement),
            'Native frame replacement failed'
          )

          check(
            code!=original,
            'Native source was not changed'
          )

          check(
            code.include?('@sl_walk8') &&
            code.include?('@character.pattern'),
            'Original and new selectors missing'
          )

          # Only the existing Sprite_Character
          # script contents are replaced.
          # No extra script entry is added.

          scripts[script_id][2]=Zlib::Deflate.deflate(code)

          File.binwrite(
            scripts_path,
            Marshal.dump(scripts)
          )

          saved=Marshal.load(File.binread(scripts_path))
          original_scripts=Marshal.load(script_before)

          check(
            saved.length==137,
            'Patched RGSS count mismatch'
          )

          saved.each_with_index do |row,i|
            next if i==script_id

            check(
              row==original_scripts[i],
              'Unrelated RGSS script changed'
            )
          end

          check(
            Zlib::Inflate.inflate(
              saved[script_id][2]
            )==code,
            'Patched native source mismatch'
          )

          # ------------------------------------------
          # Remove queen-only runtime installer.
          # Keep all original 22 spawn commands.
          # ------------------------------------------

          map_before=File.binread(map_path)
          map=Marshal.load(map_before)

          events=map.instance_variable_get(:@events)
          queen=events.fetch(29)
          pages=queen.instance_variable_get(:@pages)

          check(
            pages.length==5,
            'Queen functional pages changed'
          )

          page0=pages[0]
          commands=page0.instance_variable_get(:@list)

          check(
            commands.length==23,
            'Original queen spawn count mismatch'
          )

          old_hook=commands.first

          check(
            old_hook.instance_variable_get(:@code)==355,
            'Queen runtime installer not found'
          )

          old_text=old_hook.instance_variable_get(
            :@parameters
          )[0].to_s

          check(
            old_text.include?('class Sprite_Character') &&
            old_text.include?('slzq_v2767_original_update'),
            'Unexpected queen runtime installer'
          )

          commands.shift

          check(
            commands.length==22,
            'Original 22 spawn commands missing'
          )

          page0.instance_variable_set(:@list,commands)

          File.binwrite(
            map_path,
            Marshal.dump(map)
          )

          verify=Marshal.load(File.binread(map_path))

          saved_pages=verify.instance_variable_get(
            :@events
          ).fetch(29).instance_variable_get(:@pages)

          check(
            saved_pages[0].instance_variable_get(
              :@list
            ).length==22,
            'Duplicate queen runtime remains'
          )

          check(
            saved_pages.map{|p|
              p.instance_variable_get(:@list).length
            }==[22,1,217,2,20],
            'Original queen event pages damaged'
          )

          puts 'PASS native 4/8-frame branch'
          puts 'PASS original width expression preserved'
          puts 'PASS original Sprite_Character.update retained'
          puts 'PASS no additional update method'
          puts 'PASS legacy 4-frame pattern preserved'
          puts 'PASS queen-only duplicate renderer removed'
          puts 'PASS original queen combat pages preserved'

          SLWALK8_RUBY

          ruby -c build/slwalk8.rb
          ruby build/slwalk8.rb

          # ------------------------------------------
          # Update changed hashes and display version.
          # ------------------------------------------

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,json

          root=Path('site')
          game=root/'knight/gameasync'
          data=game/'Data'

          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          mapping=game/'mapping.js'
          content=mapping.read_text('utf-8')

          for name in (
            'Scripts.rxdata',
            pre+'Map025.rxdata'
          ):
            path=data/name
            digest=hashlib.md5(path.read_bytes()).hexdigest()

            token=(
              re.escape('Data/'+name)+
              r'\?h=[0-9a-f]{32}'
            )

            content,count=re.subn(
              token,
              'Data/'+name+'?h='+digest,
              content
            )

            assert count==1,(
              'Expected one original mapping',
              name,count
            )

          # Refresh the corrected walk PNG cache hash.
          walk=(
            game/'Graphics/Characters/SLZQWalk.png'
          )

          walk_digest=hashlib.md5(
            walk.read_bytes()
          ).hexdigest()

          walk_token=(
            re.escape(
              'Graphics/Characters/SLZQWalk.png'
            )+r'\?h=[0-9a-f]{32}'
          )

          content,count=re.subn(
            walk_token,
            'Graphics/Characters/SLZQWalk.png'
            '?h='+walk_digest,
            content
          )

          assert count==1,(
            'Queen walk image mapping not unique',
            count
          )

          mapping.write_text(
            content,encoding='utf-8'
          )

          loader=root/'knight/js/sl-assets-v229r115.js'
          text=loader.read_text('utf-8')

          old="var version='V276.7.1';"
          new="var version='V276.7.2';"

          assert text.count(old)==1

          loader.write_text(
            text.replace(old,new),
            encoding='utf-8'
          )

          for name in (
            'index.html',
            'knight/index.html'
          ):
            path=root/name
            text=path.read_text('utf-8')

            assert 'V276.7.1' in text,name

            text=(
              text.replace('V276.7.1','V276.7.2').
                   replace('?v=v276.7.1','?v=v276.7.2')
            )

            path.write_text(
              text,encoding='utf-8'
            )

          original_hashes=json.loads(
            Path('build/original_sha256.json').
              read_text('utf-8')
          )

          current={
            str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
            for p in root.rglob('*') if p.is_file()
          }

          assert len(current)==5622

          assert set(current)==set(original_hashes),(
            'Unexpected files added or removed'
          )

          changed={
            name for name in original_hashes
            if current[name]!=original_hashes[name]
          }

          expected={
            'knight/gameasync/Data/Scripts.rxdata',
            'knight/gameasync/Data/'+pre+'Map025.rxdata',
            'knight/gameasync/Graphics/Characters/SLZQWalk.png',
            'knight/gameasync/mapping.js',
            'knight/js/sl-assets-v229r115.js',
            'index.html',
            'knight/index.html'
          }

          assert changed==expected,(
            'Unexpected original modification',
            changed^expected
          )

          print('PASS seven expected generated files changed')
          print('PASS 5615 remaining files unchanged')
          print('PASS corrected queen walk PNG mapping')
          print('PASS V276.7.2 version retained')
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Publish verified draft game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
