
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R155
# BASE: Last successfully verified pre-NPC game V229R151, run 41098409849.
# FIX: R153 wrongly projected 8 NPCs into sea and changed 367 collision cells.
# ACTION: Revert R153's 367 unapproved collision changes by using original R151 Map047,
#         add NPCs only at visually checked village / pier ground positions.
# LAND CHECK: Exact SHA256 of five original terrain PNGs, original 384/385 data,
#             all NPC positions reachable from entrance via four-direction steps.
# PRESERVE: Removed Map045/046, original Map047 preload package, other maps,
#           original graphics, controls, monsters, rewards, services, and saves.
# NPC: Lucas is the only village teleporter; Case's duplicate event is removed.
# NPC: Lucas is grouped near Dorin between the warehouse and the village centre.
# NPC: Pandora stands outside at the northeast approach, not in an invented shop interior.
# NPC: Gereng is provisionally placed outside an existing isolated southeast field house.
# IMPORTANT: The isolated house is NOT verified as the native Sanctuary Gereng house.
# NPC ACTION: Name/role dialogue only; do not invent teleports, training, or shop stock.
# PRESERVE: No terrain or movement/collision change. Building interiors remain unimplemented.
name: build-slknight-web.yml | V229R155 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R155 Download clean V229R151 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41098409849
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V229R155 Extract and protect every original game resource
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          prefix='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          if len(before)!=5504:
              raise ValueError(f'Wrong original file count {len(before)}, expected 5504')
          if 'V229R151' not in (root/'knight/index.html').read_text('utf8'):
              raise ValueError('Wrong game baseline: expected successful V229R151')
          if prefix+'Map047.rxdata' not in before:
              raise ValueError('Original Talking Island Map047 missing')
          if prefix+'Map045.rxdata' in before or prefix+'Map046.rxdata' in before:
              raise ValueError('Deleted Talking Island dungeon was restored')
          if 'knight/assets/map-047-v229r151.pack' not in before:
              raise ValueError('Original full map preload package missing')
          Path('build/before.json').write_text(json.dumps(before,sort_keys=True),'utf8')
          print('PASS original V229R151 game, removed dungeon and preload pack preserved')
          PY

      - name: V229R155 Keep one teleporter and separate outdoor NPC locations
        shell: bash
        run: |
          set -euo pipefail
          cat > build/fix_talking_island_npcs.rb <<'RUBY'
          require 'digest'
          module RPG
            class Map; end
            class MapInfo; end
            class Event; end
            class Event::Page; end
            class Event::Page::Condition; end
            class Event::Page::Graphic; end
            class EventCommand; end
            class MoveCommand; end
            class MoveRoute; end
            class AudioFile; end
            class Tileset; end
          end
          class Table
            def self._load(raw); o=allocate; o.instance_variable_set(:@raw,raw); o; end
            def _dump(_depth); @raw; end
          end
          class Tone
            def self._load(raw); o=allocate; o.instance_variable_set(:@raw,raw); o; end
            def _dump(_depth); @raw; end
          end
          class Color
            def self._load(raw); o=allocate; o.instance_variable_set(:@raw,raw); o; end
            def _dump(_depth); @raw; end
          end

          root='site/knight/gameasync'
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          data=File.join(root,'Data')
          field=File.join(data,prefix+'Map047.rxdata')
          reference=File.join(data,prefix+'Map029.rxdata')
          original_bytes=File.binread(field)
          expected='e27d4df6c0e7179a21ad7de257036be8e0b84e52dfabf8da23e8c9517b42d4f0'
          raise 'Wrong Map047 base: never place NPCs on R153 water collision' unless
            Digest::SHA256.hexdigest(original_bytes)==expected
          map=Marshal.load(original_bytes)
          raise 'Wrong original Map047 binary' unless Marshal.dump(map)==original_bytes
          w=map.instance_variable_get(:@width)
          h=map.instance_variable_get(:@height)
          raise 'Original Map047 dimensions changed' unless [w,h]==[363,238]
          events=map.instance_variable_get(:@events)
          raise 'Map047 is not the original no-NPC source' unless events.empty?
          original_table=map.instance_variable_get(:@data).instance_variable_get(:@raw).b
          raise 'Original Map047 terrain geometry mismatch' unless
            original_table[0,20].unpack('V5')==[3,w,h,3,w*h*3]
          ground=original_table[20,w*h*2]
          raise 'Original collision source changed' unless
            Digest::SHA256.hexdigest(ground)=='01e647ea7825d94808596cb601d597d99cbd4cef32ea3261d7290359538561d0'
          tiles=ground.unpack('v*')
          raise 'Unexpected terrain values' unless tiles.all?{|v|v==384 || v==385}

          # Proven exact PNGs sampled and visually checked against the village image.
          # Any different PNG requires new visual review, not automatic NPC placement.
          chunks={
            'SLTI_47_C5_4.png'=>'1917355f217978f56e39161dd5c0fbd50f1585c123ebb1faa01c45aa9d4f11de',
            'SLTI_47_C6_3.png'=>'321e9a9e646a4f776e14134a1f79e348607a118155c890c450bd40c5d9b83017',
            'SLTI_47_C6_4.png'=>'fdec7285631344cb70b3a392f5bd92ba6ba0e64289d0280712fb8ebe21c3114e',
            'SLTI_47_C7_4.png'=>'d1f321ba3012e9422e909b2ba4865dfcfaf188cb0671c459597f935537a26991',
            'SLTI_47_C8_3.png'=>'bb5be266bf9e3a6c0fb79f7958dbb444cc79f36fadf457888df438fbfdce908e',
            'SLTI_47_C7_3.png'=>'6bf6ae8ca33535e8543ebf2401842b242b526557b701efd906de91c8608ce033',
            'SLTI_47_C9_5.png'=>'742eecf706085ac50e24fa1ab93aeaa5e82e26fe6ba3c55545fa9770a823be0c'
          }
          chunks.each do |name,digest|
            path=File.join(root,'Graphics/Panoramas',name)
            raise "Missing original village image #{name}" unless File.file?(path)
            raise "Changed original village image #{name}" unless
              Digest::SHA256.file(path).hexdigest==digest
          end

          # Four-direction connected walkable area from the existing Map047 entrance.
          entrance=[197,128]
          index=->(x,y){y*w+x}
          raise 'Original entrance blocked' unless tiles[index.call(*entrance)]==384
          reached=Array.new(w*h,false)
          queue=[index.call(*entrance)]
          reached[queue[0]]=true
          head=0
          while head<queue.length
            p=queue[head];head+=1
            x=p%w;y=p/w
            [[x,y-1],[x-1,y],[x+1,y],[x,y+1]].each do |xx,yy|
              next unless xx>=0 && yy>=0 && xx<w && yy<h
              q=index.call(xx,yy)
              next if reached[q] || tiles[q]!=384
              reached[q]=true
              queue << q
            end
          end
          raise 'Unusual original walkable network' unless queue.length>40000

          # Coordinates are visibly checked placements on the existing Map047 panorama.
          # They are NOT exact verified native Sanctuary server NPC locations.
          # Gereng is beside an isolated southeast field house matching the historical
          # direction, but that building's original identity is not verified.
          # Never infer original NPC identity from geometry or passage alone.
          npcs=[
            ['도린','창고지기',211,117,'창고'],
            ['게렝','마법 교육',297,183,'오크마법사'],
            ['판도라','잡화상',229,119,'메티스'],
            ['선착장 관리인','선착장',264,120,'텔레포터'],
            ['루카스','공간 이동사',204,123,'텔레포터'],
            ['라다르','제작 담당',187,151,'창고'],
            ['라이엔','제작 담당',214,152,'창고']
          ]
          base=Marshal.load(File.binread(reference))
          prototype=base.instance_variable_get(:@events).fetch(32)
          pages=prototype.instance_variable_get(:@pages)
          raise 'NPC template page count mismatch' unless pages.length==1
          prototype_codes=pages[0].instance_variable_get(:@list).map{|cmd|cmd.instance_variable_get(:@code)}
          raise 'NPC template does not contain only dialogue' unless prototype_codes==[101,0]
          used={}
          npcs.each_with_index do |(name,role,x,y,sprite),i|
            raise "NPC coordinate out of bounds: #{name}" unless x>=0&&y>=0&&x<w&&y<h
            pos=index.call(x,y)
            raise "NPC placed on blocked tile: #{name}" unless tiles[pos]==384
            raise "NPC unreachable from original entrance: #{name}" unless reached[pos]
            raise "Duplicate NPC cell: #{name}" if used[pos]
            used[pos]=true
            neighbors=[[x,y-1],[x-1,y],[x+1,y],[x,y+1]]
            accessible=neighbors.count do |xx,yy|
              xx>=0&&yy>=0&&xx<w&&yy<h&&reached[index.call(xx,yy)]
            end
            raise "NPC has no walkable approach: #{name}" unless accessible>=2
            # Ensure this verified position is inside an unchanged original image.
            chunk="SLTI_47_C#{x/32}_#{y/32}.png"
            raise "Unverified NPC art chunk for #{name}" unless chunks.key?(chunk)
            sprite_path=File.join(root,'Graphics/Characters',sprite+'.png')
            raise "Existing NPC character image missing: #{sprite}" unless File.file?(sprite_path)
            ev=Marshal.load(Marshal.dump(prototype))
            ev.instance_variable_set(:@id,i+1)
            ev.instance_variable_set(:@x,x)
            ev.instance_variable_set(:@y,y)
            ev.instance_variable_set(:@name,'TI_NPC_'+name)
            page=ev.instance_variable_get(:@pages)[0]
            page.instance_variable_get(:@graphic).instance_variable_set(:@character_name,sprite)
            page.instance_variable_set(:@move_type,0)
            page.instance_variable_set(:@trigger,0)
            page.instance_variable_get(:@list)[0].instance_variable_set(:@parameters,[name+' - '+role])
            events[i+1]=ev
            puts "PASS #{name}: (#{x},#{y}) dry reachable Map047 cell, #{accessible} approaches"
          end
          raise 'NPC count wrong' unless events.length==7 &&
            events.values.none?{|e|e.instance_variable_get(:@name)=='TI_NPC_케이스'}
          raise 'Original collision bytes were altered' unless
            map.instance_variable_get(:@data).instance_variable_get(:@raw)==original_table
          result=Marshal.dump(map)
          File.binwrite(field,result)
          loaded=Marshal.load(File.binread(field))
          raise 'Saved NPC map mismatch' unless Marshal.dump(loaded)==result
          raise 'Map047 original terrain changed during save' unless
            loaded.instance_variable_get(:@data).instance_variable_get(:@raw)==original_table
          puts 'PASS 7 NPCs, exactly one village teleporter Lucas, Case removed'
          puts 'PASS outdoor Pandora / separate southeast Gereng placement, no collision changes'
          puts 'PASS wrong R153 sea NPCs and 367 passage edits are absent'
          RUBY
          ruby -c build/fix_talking_island_npcs.rb
          ruby build/fix_talking_island_npcs.rb

      - name: V229R155 Update Map047 reference and ready status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          site=Path('site')
          game=site/'knight/gameasync'
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          filename=prefix+'Map047.rxdata'
          digest=hashlib.md5((game/'Data'/filename).read_bytes()).hexdigest()
          mapping=game/'mapping.js'
          original=mapping.read_text('utf8')
          pattern=r'(Data/'+re.escape(filename)+r'\?h=)[0-9a-f]{32}'
          changed,n=re.subn(pattern,lambda m:m.group(1)+digest,original)
          if n!=1:raise ValueError('Map047 resource hash not unique')
          mapping.write_text(changed,'utf8')
          for name in ('index.html','knight/index.html'):
              path=site/name
              source=path.read_text('utf8')
              if 'V229R151' not in source:raise ValueError('Wrong baseline page version: '+name)
              path.write_text(source.replace('V229R151','V229R155')
                                    .replace('v229r151','v229r155'),'utf8')
          asset=site/'knight/js/sl-assets-v229r115.js'
          js=asset.read_text('utf8')
          old="var version='V229R151';"
          if js.count(old)!=1:raise ValueError('Wrong asset version token')
          js=js.replace(old,"var version='V229R155';")
          # Map-entry callback completed, but R151 left misleading "opening" status visible.
          old='finished=true;clearTimeout(guard);hide();'
          new="finished=true;clearTimeout(guard);hide();label('Map '+mid+' ready');"
          if js.count(old)!=1:raise ValueError('Map-entry completion callback not unique')
          js=js.replace(old,new)
          if 'map-047-v229r151.pack' not in js:raise ValueError('Map047 preload was removed')
          asset.write_text(js,'utf8')
          if 'js/sl-assets-v229r115.js?v=v229r155' not in (site/'knight/index.html').read_text('utf8'):
              raise ValueError('Browser cached old loader version')
          print('PASS Map047 MD5 reference, R155 versions, completion status, preload preserved')
          PY
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/dpad.js
          node --check site/knight/js/drive.js

      - name: V229R155 Audit entire game and original Map047 terrain
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before=json.loads(Path('build/before.json').read_text('utf8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          prefix='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          allowed={prefix+'Map047.rxdata','knight/gameasync/mapping.js',
                   'knight/js/sl-assets-v229r115.js','index.html','knight/index.html'}
          if before.keys()!=after.keys():raise ValueError('Unapproved files created or deleted')
          changed={name for name in before if before[name]!=after[name]}
          if changed!=allowed:
              raise ValueError('Unapproved modified files: '+repr(sorted(changed^allowed)))
          for mid in (45,46):
              if prefix+f'Map{mid:03d}.rxdata' in after:
                  raise ValueError('Removed dungeon came back')
          if before['knight/assets/map-047-v229r151.pack']!=after['knight/assets/map-047-v229r151.pack']:
              raise ValueError('Map047 preload package changed')
          if before['knight/gameasync/Data/Scripts.rxdata']!=after['knight/gameasync/Data/Scripts.rxdata']:
              raise ValueError('Unexpected engine or monster modifications')
          print('PASS only 5 authorized files modified, other 5,499 resources untouched')
          print('PASS Map047 NPC dialogue only; original map passage and panorama unchanged')
          print('PASS old dungeon absent; original preloaded map and all controls retained')
          PY

      - name: V229R155 Publish single teleporter and corrected outdoor NPCs
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
