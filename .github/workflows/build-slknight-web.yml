
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V259
#
# Source: Immutable V258 commit
# 29c232dce4d9ffd1ff39648e058115b017ec493e
#
# Base game: V254 run 41394237945
#
# FIX:
# - Provide build-only engine stubs before runtime inspection
# - Do not embed validation stubs in the shipped runtime
# - Permit nil tile ID in character sprite rendering
#
# PRESERVE:
# - Tower of Insolence 2F, Map025 EV29
# - Physical 6 : Magic 1
# - Magic minimum final damage 80
# - Monster HP 5200, Level 60
# - Original seven motion sprites
# - Twenty Zenith Queen drop entries
# - Items ID18 as item, not weapon
# - Deleted Death Knight event copies
# - All unrelated native maps and monsters

name: build-slknight-web.yml | V259 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: V259 Load immutable V258 build source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: 29c232dce4d9ffd1ff39648e058115b017ec493e
          path: v258-source
          persist-credentials: false

      - name: V259 Restore original V254 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41394237945
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V259 Build verify install and test
        shell: bash
        run: |
          set -euo pipefail

          ruby <<'RB'
          require 'yaml'
          require 'fileutils'

          VERSION='V259'

          source=File.join(
            'v258-source',
            '.github',
            'workflows',
            'build-slknight-web.yml'
          )

          abort 'Pinned V258 source missing' unless
            File.file?(source)

          raw=File.read(source)

          unless raw.include?('# VERSION: V258') &&
                 raw.include?('Map025 EV29')
            abort 'Wrong pinned source'
          end

          workflow=YAML.load_file(source)

          steps=workflow.fetch('jobs')
            .fetch('build')
            .fetch('steps')

          steps=steps.select do |step|
            step.is_a?(Hash) && step['run']
          end

          expected=[
            'V258 Verify original files',
            'V258 Create reusable monster registry and core',
            'V258 Install independent event and check item links',
            'V258 Test combat and reward invariants',
            'V258 Refresh native resource mapping',
            'V258 Verify original game protection'
          ]

          actual=steps.map{|step|step['name']}

          unless actual==expected
            abort(
              "Source workflow steps changed: " +
              actual.inspect
            )
          end

          FileUtils.mkdir_p('build')

          # Build-only method definitions.
          # The original game engine supplies these
          # methods during actual gameplay.
          #
          # These classes are defined only inside
          # build/install.rb, never inside the
          # deployed monster runtime.

          validation_stubs=<<'STUB'
          class Game_Map
            def setup(*args)
            end
          end

          class Game_Event
            def update
            end
          end

          class Sprite_Character
            def update
            end
          end
          STUB

          modified_install=false
          modified_sprite=false

          steps.each_with_index do |step,index|
            name=step.fetch('name')
            script=step.fetch('run')

            script=script.gsub('V258','V259')
            script=script.gsub('v258','v259')
            script=script.gsub('99825801','99825901')

            if name.include?('Create reusable monster')
              old='return if @tile_id!=0'
              replacement='return if @tile_id.to_i!=0'

              unless script.scan(old).length==1
                abort 'Sprite fix target missing'
              end

              script=script.sub(old,replacement)
              modified_sprite=true
            end

            if name.include?('Install independent event')
              target="load 'build/monster-runtime.rb'"

              unless script.scan(target).length==1
                abort 'Installer validation target mismatch'
              end

              replacement=(
                validation_stubs+
                "\n"+
                target
              )

              script=script.sub(target,replacement)
              modified_install=true
            end

            path=File.join(
              'build',
              format('v259-step-%02d.sh',index+1)
            )

            File.write(path,script)

            puts
            puts(
              "========== V259 STEP #{index+1} =========="
            )
            puts name.gsub('V258','V259')
            STDOUT.flush

            ok=system('bash',path)

            unless ok
              abort(
                "V259 failed at step #{index+1}: "+
                name
              )
            end
          end

          abort 'Installer fix not applied' unless
            modified_install

          abort 'Sprite fix not applied' unless
            modified_sprite

          runtime=File.read('build/monster-runtime.rb')

          required=[
            ':physical_weight=>6',
            ':magic_weight=>1',
            ':magic_floor=>80',
            ':max_hp=>5200',
            ':attack_wait=>20',
            '[:item,18,50]',
            '[:armor,492,3]'
          ]

          required.each do |value|
            unless runtime.include?(value)
              abort "Missing combat invariant: #{value}"
            end
          end

          if runtime.include?('[:weapon,18,50]')
            abort 'Invalid Items ID18 link'
          end

          if runtime.include?(
            "target.hp=[current-damage,0].max"
          )
            abort 'Unsafe direct player HP subtraction'
          end

          if runtime.include?(
            'class Game_Map' + "\n" +
            '  def setup(*args)'
          )
            abort 'Build-only stub leaked into runtime'
          end

          puts
          puts 'PASS V259 installation correction'
          puts 'PASS V259 sprite correction'
          puts 'PASS physical/magic ratio 6:1'
          puts 'PASS magic minimum final damage 80'
          puts 'PASS Items ID18 corrected'
          puts 'PASS Zenith ring ID492 retained'
          puts 'PASS build-only stubs excluded'
          puts 'PASS original game protection checks'
          RB

      - name: V259 Publish game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
