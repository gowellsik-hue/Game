# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R153
# BASE: successful V229R151 artifact, run 41098409849.
# FIX FROM V229R152: Restore full original 2,580-character native village blob; verify copy length and SHA256.
# SCOPE: Talking Island Map047 village original S32 passage correction and NPC events.
# HOUSE INTERIORS: not implemented; original layered interior source is not available.
# NPC PROVENANCE: published Talking Island Map0 reference coordinates (not Sanctuary server records).
# NPC INTERACTION: simple name/role dialogue only, no unverified services or shop lists.
# PRESERVE: Map045/046 removed, original Map047 terrain PNG pack and all other maps,
#          monsters, equipment, reward/economy rules, saves and mobile controls.

name: build-slknight-web.yml | V229R153 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R153 Download preserved V229R151 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41098409849
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V229R153 Verify original files and protect existing game
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          prefix='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          assert len(before)==5504, ('Unexpected game resource count',len(before))
          assert 'V229R151' in (root/'knight/index.html').read_text('utf-8')
          assert prefix+'Map047.rxdata' in before
          assert prefix+'Map045.rxdata' not in before and prefix+'Map046.rxdata' not in before
          assert 'knight/assets/map-047-v229r151.pack' in before
          Path('build/before.json').write_text(json.dumps(before,sort_keys=True),'utf-8')
          print('PASS V229R151 baseline, Map047 pack and dungeon deletion preserved')
          PY

      - name: V229R153 Restore native village passage and eight NPC events
        shell: bash
        run: |
          set -euo pipefail
          cat > build/talking_island_npcs.rb <<'RUBY'
          require 'base64'
          require 'zlib'
          require 'digest'
          module RPG
           class Map;end;class MapInfo;end;class Event;end;class Event::Page;end
           class Event::Page::Condition;end;class Event::Page::Graphic;end
           class EventCommand;end;class MoveCommand;end;class MoveRoute;end
           class AudioFile;end;class Tileset;end
          end
          class Table
           def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
           def _dump(_depth);@raw;end
          end
          class Tone
           def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
           def _dump(_depth);@raw;end
          end
          class Color
           def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
           def _dump(_depth);@raw;end
          end

          root=ENV.fetch('SL_SITE','site')
          base=File.join(root,'knight/gameasync')
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          target=File.join(base,'Data',prefix+'Map047.rxdata')
          template_file=File.join(base,'Data',prefix+'Map029.rxdata')
          raise 'Missing original Map047 or Map029' unless File.file?(target) && File.file?(template_file)
          source=Marshal.load(File.binread(target))
          raise 'Map047 contains previously modified events' unless source.instance_variable_get(:@events).empty?
          w=source.instance_variable_get(:@width)
          h=source.instance_variable_get(:@height)
          raise "Unexpected Map047 dimensions #{w}x#{h}" unless [w,h]==[363,238]
          raw=source.instance_variable_get(:@data).instance_variable_get(:@raw).b
          raise 'Unexpected Map047 table header' unless raw[0,20].unpack('V5')==[3,w,h,3,w*h*3]
          original_raw=raw.dup
          terrain=raw[20,w*h*2].unpack('v*')
          raise 'Unexpected original terrain codes' unless terrain.all?{|v|v==384 || v==385}

          # Exact local map-tile deltas extracted from the original Sanctuary S32 Layer3.
          # Only the native village cells and coordinates recorded in this blob may change.
          BLOB=''
          raise "Native village Base64 incomplete: #{BLOB.bytesize}/2580" unless BLOB.bytesize==2580
          raise 'Native village Base64 copy mismatch' unless Digest::SHA256.hexdigest(BLOB)=='8e11150141b80b54b7e6b0be4e72419bb3be431177b4ed08d4770af090db8e46'
          bytes=Zlib::Inflate.inflate(Base64.strict_decode64(BLOB))
          raise 'Original-native terrain table checksum mismatch' unless Digest::SHA256.hexdigest(bytes)=='f2ddce465057c0eb0c35f552eacb445f2ef823968777dc09bea13ee18643c889'
          raise 'Wrong extracted number of native cells' unless bytes.bytesize==367*12
          changes=[]
          bytes.unpack('v*').each_slice(6) do |cx,cy,wx,wy,v,t|
            raise 'Wrong native village region' unless wx.between?(32555,32650) && wy.between?(32912,32988)
            raise 'Invalid native terrain codes' unless [4,5,8,9,12,13,65,69].include?(v)
            raise 'Native S32 bit mask mismatch' unless t==(v.odd? ? 385 : 384)
            raise 'RPG coordinate outside Map047' unless cx.between?(0,w-1) && cy.between?(0,h-1)
            expected_x=(6*(wx+wy-65024)-1400)
            expected_y=(3*(wy-wx)-83)
            # One RPG source-cell centre may correspond to any native source point within it.
            raise 'Native-to-RPG coordinate mismatch' unless (expected_x/16-cx).abs<=1 && (expected_y/16-cy).abs<=1
            pos=cy*w+cx
            raise 'Duplicate RPG cell in native list' if changes.any?{|p|p[0]==pos}
            raise 'Map047 source terrain already modified' if terrain[pos]==t
            terrain[pos]=t
            changes << [pos,cx,cy,wx,wy,v,t]
          end
          raise 'Wrong exact number of native changes' unless changes.length==367
          edited_raw=raw.dup
          edited_raw[20,w*h*2]=terrain.pack('v*')
          raise 'Map047 upper layers changed' unless edited_raw[20+w*h*2,w*h*4]==original_raw[20+w*h*2,w*h*4]
          source.instance_variable_get(:@data).instance_variable_set(:@raw,edited_raw)

          # Published Talking Island NPC coordinates, mapped to the actual Panorama projection.
          # These spawn coordinates are reference placements, not claimed to be Sanctuary server packets.
          # The only enabled interaction is a role-identifying message. No unverified shops, spells,
          # teleport destinations, prices, or inventory changes are introduced.
          npcs=[
            ['도린','창고지기',32575,32946,'창고'],
            ['게렝','마법 교육',32593,32958,'오크마법사'],
            ['판도라','잡화상',32643,32951,'메티스'],
            ['선착장 관리인','선착장',32633,32968,'텔레포터'],
            ['루카스','공간 이동사',32583,32922,'텔레포터'],
            ['케이스','공간 이동사',32577,32957,'텔레포터'],
            ['라다르','제작 담당',32589,32957,'창고'],
            ['라이엔','제작 담당',32575,32920,'창고']
          ]
          base_map=Marshal.load(File.binread(template_file))
          prototype=base_map.instance_variable_get(:@events).fetch(32)
          raise 'Unexpected NPC template' unless prototype.instance_variable_get(:@pages).length==1
          prototype_page=prototype.instance_variable_get(:@pages)[0]
          proto_cmds=prototype_page.instance_variable_get(:@list)
          raise 'Unexpected message-only NPC template' unless proto_cmds.map{|c|c.instance_variable_get(:@code)}==[101,0]
          events=source.instance_variable_get(:@events)
          npcs.each_with_index do |(name,role,wx,wy,sprite),idx|
            px=6*(wx+wy-65024)-1400
            py=3*(wy-wx)-83
            cx=px.div(16)
            cy=py.div(16)
            raise "NPC outside map #{name}" unless cx.between?(0,w-1)&&cy.between?(0,h-1)
            if terrain[cy*w+cx]!=384
              # Projection of a native 12x6 pixel diamond onto a 16x16 RPG sample may
              # alias a native-open point into an RPG wall cell. Keep the NPC in the
              # closest walkable neighbouring RPG cell, at most one tile away.
              candidates=[[cx,cy-1],[cx-1,cy],[cx+1,cy],[cx,cy+1]]
              open=candidates.find{|xx,yy| xx.between?(0,w-1)&&yy.between?(0,h-1)&&terrain[yy*w+xx]==384}
              raise "No original walkable tile near NPC #{name}" unless open
              cx,cy=open
            end
            sprite_file=File.join(base,'Graphics/Characters',sprite+'.png')
            raise "NPC sprite missing #{sprite_file}" unless File.file?(sprite_file)
            event=Marshal.load(Marshal.dump(prototype))
            event.instance_variable_set(:@id,idx+1)
            event.instance_variable_set(:@x,cx)
            event.instance_variable_set(:@y,cy)
            event.instance_variable_set(:@name,'TI_NPC_'+name)
            page=event.instance_variable_get(:@pages)[0]
            page.instance_variable_get(:@graphic).instance_variable_set(:@character_name,sprite)
            page.instance_variable_set(:@move_type,0)
            page.instance_variable_set(:@trigger,0)
            commands=page.instance_variable_get(:@list)
            commands[0].instance_variable_set(:@parameters,[name+' - '+role])
            events[idx+1]=event
            puts "PASS NPC #{name}: native (#{wx},#{wy}) -> RPG (#{cx},#{cy}), action talk"
          end
          raise 'Map047 NPC count mismatches' unless events.length==npcs.length
          out=Marshal.dump(source)
          File.binwrite(target,out)
          reloaded=Marshal.load(File.binread(target))
          raise 'Map047 reread differs' unless Marshal.dump(reloaded)==out
          raise 'Map047 upper layers differ after save' unless reloaded.instance_variable_get(:@data).instance_variable_get(:@raw)[20+w*h*2,w*h*4]==original_raw[20+w*h*2,w*h*4]
          puts "PASS original S32 village #{changes.length} exact collision cells restored; 8 talkable NPCs"
          puts 'PASS original Map047 graphics, events in all other maps, economy and game scripts unchanged'
          RUBY
          ruby -c build/talking_island_npcs.rb
          ruby build/talking_island_npcs.rb

      - name: V229R153 Update only Map047 cache and version labels
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          root=Path('site')
          base=root/'knight/gameasync'
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          filename=prefix+'Map047.rxdata'
          digest=hashlib.md5((base/'Data'/filename).read_bytes()).hexdigest()
          path=base/'mapping.js'
          source=path.read_text('utf-8')
          pat=r'(Data/'+re.escape(filename)+r'\?h=)[0-9a-f]{32}'
          source,n=re.subn(pat,lambda m:m.group(1)+digest,source)
          if n!=1:raise ValueError('Map047 cache reference not unique')
          path.write_text(source,'utf-8')
          for label in ('index.html','knight/index.html'):
              target=root/label
              old=target.read_text('utf-8')
              if 'V229R151' not in old:raise ValueError('Unexpected page version: '+label)
              target.write_text(old.replace('V229R151','V229R153')
                                   .replace('v229r151','v229r153'),'utf-8')
          asset=root/'knight/js/sl-assets-v229r115.js'
          text=asset.read_text('utf-8')
          old="var version='V229R151';"
          if text.count(old)!=1:raise ValueError('Unexpected map preload script')
          asset.write_text(text.replace(old,"var version='V229R153';"),'utf-8')
          if 'map-047-v229r151.pack' not in asset.read_text('utf-8'):
              raise ValueError('Existing 97-file Map047 preload pack missing')
          if 'js/sl-assets-v229r115.js?v=v229r153' not in (root/'knight/index.html').read_text('utf-8'):
              raise ValueError('Browser cache version update missing')
          print('PASS Map047 hash and version labels updated; preloaded art package unchanged')
          PY
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/dpad.js
          node --check site/knight/js/drive.js

      - name: V229R153 Verify no other map, scripts, art, or system changed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('site')
          before=json.loads(Path('build/before.json').read_text('utf-8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          prefix='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          allowed={prefix+'Map047.rxdata','knight/gameasync/mapping.js',
                   'knight/js/sl-assets-v229r115.js','index.html','knight/index.html'}
          if set(before)!=set(after):raise ValueError('Game files added or removed')
          changed={p for p in before if before[p]!=after[p]}
          if changed!=allowed:raise ValueError('Unauthorized modified files: '+repr(sorted(changed^allowed)))
          for map_id in (45,46):
              assert prefix+f'Map{map_id:03d}.rxdata' not in after
          assert before['knight/assets/map-047-v229r151.pack']==after['knight/assets/map-047-v229r151.pack']
          assert before['knight/gameasync/Data/Scripts.rxdata']==after['knight/gameasync/Data/Scripts.rxdata']
          print('PASS only Map047 binary, mapping hash, HTML and build version changed')
          print('PASS Map045/046 remain absent and preload 97-file pack remains intact')
          print('PASS all 44 other maps, sprites, game scripts, services, balance and controls preserved')
          PY

      - name: V229R153 Publish Talking Island native passage and NPCs
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
