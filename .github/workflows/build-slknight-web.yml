      - name: V229R38 Refresh exactly two sound asset hashes and displayed version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_INDEX'
          from pathlib import Path
          import hashlib,re
          root=Path('site')
          game=root/'knight/gameasync'
          mapping=game/'mapping.js'
          s=mapping.read_text(encoding='utf-8')
          for name in ('대장간 소리','대장간 소리2'):
            rel=f'Audio/SE/{name}.ogg'
            digest=hashlib.md5((game/rel).read_bytes()).hexdigest()
            s,n=re.subn(re.escape(rel+'?h=')+r'[0-9a-f]{32}',lambda _:rel+'?h='+digest,s)
            assert n==1,(name,n)
            assert s.count(rel+'?h='+digest)==1
          mapping.write_text(s,encoding='utf-8')
          for rel in ('index.html','knight/index.html'):
            p=root/rel
            html=p.read_text(encoding='utf-8')
            assert 'V229R37' in html,rel
            p.write_text(html.replace('V229R37','V229R38').replace('v229r37','v229r38'),encoding='utf-8')
          print('PASS: both changed Ogg files mapped, R38 cache bust applied')
          PY_INDEX
          node --check site/knight/gameasync/mapping.js

      - name: V229R38 Test BGM/BGS browser volume and strict asset integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_TEST'
          from pathlib import Path
          import hashlib,json,re
          root=Path('site')
          orig=json.loads(Path('build/r37-original-hashes.json').read_text(encoding='utf-8'))
          out={str(f.relative_to(root)):hashlib.sha256(f.read_bytes()).hexdigest()
               for f in root.rglob('*') if f.is_file()}
          assert orig.keys()==out.keys() and len(out)==5472
          allowed={
            'index.html','knight/index.html','knight/gameasync/mapping.js',
            'knight/gameasync/Audio/SE/대장간 소리.ogg',
            'knight/gameasync/Audio/SE/대장간 소리2.ogg'
          }
          modified={name for name in orig if orig[name]!=out[name]}
          assert modified==allowed,('Unexpected modified files',modified ^ allowed)
          for rel in ('index.html','knight/index.html'):
            assert 'V229R38' in (root/rel).read_text(encoding='utf-8')
          html=(root/'knight/index.html').read_text(encoding='utf-8')
          assert html.count("var gain=k==='BGS'?0.20:(k==='BGM'?0.40:1);")==1
          bridge=html.split('<script>',1)[1].split('</script>',1)[0]
          Path('build/r38-audio-bridge.js').write_text(bridge,encoding='utf-8')
          mapping=(root/'knight/gameasync/mapping.js').read_text(encoding='utf-8')
          for name in ('대장간 소리','대장간 소리2'):
            rel=f'Audio/SE/{name}.ogg'
            blob=(root/'knight/gameasync'/rel).read_bytes()
            assert blob[:4]==b'OggS'
            digest=hashlib.md5(blob).hexdigest()
            assert mapping.count(rel+'?h='+digest)==1
          print('PASS 5-file change only; all maps, monster events, combat, control, and other SE/BGS intact')
          PY_TEST
          node --check build/r38-audio-bridge.js
          cat > build/r38-bridge-test.js <<'JS_TEST'
          const fs=require('fs'),vm=require('vm');
          class FakeAudio {
            constructor(){this.src='';this.volume=0;this.attrs={};}
            setAttribute(k,v){this.attrs[k]=v;}
            getAttribute(k){return this.attrs[k];}
            pause(){}
            load(){}
            play(){return undefined;}
          }
          const fakeConsole={log(){}};
          const window={addEventListener(){}};
          vm.runInNewContext(fs.readFileSync('build/r38-audio-bridge.js','utf8'),{
            Audio:FakeAudio,console:fakeConsole,window,document:{},
            encodeURI,setTimeout(){},Math,Number,String
          });
          fakeConsole.log('SLAUDIO|BGM_PLAY|Audio/BGM/TEST|80|100');
          fakeConsole.log('SLAUDIO|BGS_PLAY|Audio/BGS/TEST|80|100');
          if(Math.abs(window.slAudioBridge.BGM.volume-0.32)>1e-8)throw Error('BGM 40% gain missing');
          if(Math.abs(window.slAudioBridge.BGS.volume-0.16)>1e-8)throw Error('BGS gain changed');
          process.stdout.write('PASS Browser BGM 80 x 0.40=32%, BGS 80 x 0.20=16%; no other audio channel touched.\n');
          JS_TEST
          node build/r38-bridge-test.js

      - name: V229R38 Upload audio modification audit
        uses: actions/upload-artifact@v4
        with:
          name: SLKnight-V229R38-BGM-and-Blacksmith-Audio-Audit
          path: |
            build/r38-audio-bridge.js
            build/r38-bridge-test.js
          if-no-files-found: error
          retention-days: 30

      - name: V229R38 Upload game to existing GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
