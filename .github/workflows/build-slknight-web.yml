
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R64
# BASE: successful deployed V229R63, run 40089622278.
# FIX: original displayed textured rock floor and wall-front alpha determine
# physical movement; do not re-use mismatched S32 or move global coordinates.
# EXCEPTION: existing visible Map045 arched doorway x133..134, y58..60.
# DEPTH: wall z from its painted bounding-box bottom, never fixed z=4096;
# fade only when wall is actually IN FRONT of the hero, not when hero is ahead.
# KEEP: 106 TI monsters, all event pages, loot/EXP/Adena, original PNG art,
# native Game_Map and Game_Character code, 491EV balance and saves.
name: build-slknight-web.yml | V229R64 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R64 Restore complete successful R63 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40089622278
          name: github-pages
          github-token: ${{ github.token }}
          path: r63
      - name: V229R64 Verify 5517 original game files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s r63/artifact.tar
          tar -xf r63/artifact.tar -C site
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          for name in ('index.html','knight/index.html'):
              assert 'V229R63' in (root/name).read_text('utf-8'),name
          scripts=root/'knight/gameasync/Data/Scripts.rxdata'
          assert hashlib.sha256(scripts.read_bytes()).hexdigest()=='882dea21be577f57d09bb4cd72b2920e3709a1f28bfe3990c1473b9a83f02554'
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(files)==5517,len(files)
          Path('build/r64-baseline.json').write_text(json.dumps(files,sort_keys=True))
          print('PASS verified complete deployed R63 game')
          PY_BASE
      - name: V229R64 Install image processing Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: V229R64 Install pinned image processing libraries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.12.0.88
      - name: V229R64 Preserve original RGSS direction graph for comparison
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r64_export_old.rb <<'R64_RB_OLD'
          require 'zlib'
          path='site/knight/gameasync/Data/Scripts.rxdata'
          a=Marshal.load(File.binread(path))
          src=Zlib::Inflate.inflate(a[21][2]).force_encoding('UTF-8')
          x=src.index('module SLTI_V229R44');y=src.index("\nclass Game_Map",x)
          raise 'R63 graph missing' unless x && y
          eval(src[x...y])
          [45,46].each do |mid|
           raw=SLTI_V229R44.const_get("EDGES_#{mid}")
           raise 'invalid old graph' unless raw.bytesize==(mid==45 ? 288*144 : 336*168)
           File.binwrite("build/r64-old-#{mid}.bin",raw)
          end
          puts 'PASS R63 original graphs captured for reference and preservation checks'
          R64_RB_OLD
          ruby /tmp/r64_export_old.rb
      - name: V229R64 Build floor and wall layer aligned movement graph
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r64_visual.py <<'R64_PY_VISUAL'
          from pathlib import Path
          import numpy as np,cv2,json
          from PIL import Image

          root=Path('site/knight/gameasync/Graphics/Panoramas')
          out=Path('build');out.mkdir(exist_ok=True)
          report={'version':'V229R64','source':'V229R63','method':'ground pixels + foreground wall foot occupancy (no S32 offset)','maps':{}}
          for mid,(w,h) in [(45,(288,144)),(46,(336,168))]:
              walk=np.zeros((h,w),np.bool_)
              foot_map=np.zeros((h,w),np.float32);mean_map=np.zeros((h,w),np.float32)
              metrics={'flat_wall':0,'rough_floor':0,'missing_chunk':0}
              for cy in range((h+31)//32):
                  for cx in range((w+31)//32):
                      ground=root/f'SLTI_{mid}_C{cx}_{cy}.png'
                      wall=root/f'SLTI_{mid}_W_C{cx}_{cy}.png'
                      if not ground.exists():
                          metrics['missing_chunk']+=1
                          continue
                      G=np.asarray(Image.open(ground).convert('RGB'))
                      assert G.shape==(512,512,3),ground
                      gray=cv2.cvtColor(G,cv2.COLOR_RGB2GRAY).astype(np.float32)
                      b=gray.reshape(32,16,32,16).transpose(0,2,1,3)
                      std=b.std((2,3));grad=np.abs(b[:,:,:,1:]-b[:,:,:,:-1]).mean((2,3));mean=b.mean((2,3))
                      if wall.exists():
                          A=np.asarray(Image.open(wall).convert('RGBA').getchannel('A'),np.float32)/255.0
                          ab=A.reshape(32,16,32,16).transpose(0,2,1,3)
                          foot=ab[:,:,12:16,5:11].mean((2,3))
                      else:
                          foot=np.zeros((32,32),np.float32)
                      # Floors are textured rock. Solid wall bases are uniform brown,
                      # with painted foreground wall in the same physical footprint.
                      ok=(grad>=5.0)&(std>=9.0)&(mean>20.0)&((foot<0.80)|(grad>14.0))
                      yy=min(32,h-cy*32);xx=min(32,w-cx*32)
                      walk[cy*32:cy*32+yy,cx*32:cx*32+xx]=ok[:yy,:xx]
                      foot_map[cy*32:cy*32+yy,cx*32:cx*32+xx]=foot[:yy,:xx]
                      mean_map[cy*32:cy*32+yy,cx*32:cx*32+xx]=mean[:yy,:xx]
                      metrics['flat_wall']+=int(((grad<5)&(std<9)&(foot>.80))[:yy,:xx].sum())
              if mid==45:
                  # The existing visual stone-arch doorway is explicitly traversable.
                  # Upper rough floor: y57; lower rough floor: y61.
                  for x in (133,134):
                      assert walk[57,x] and walk[61,x],(x,'door ends not on floor')
                      for y in (58,59,60):
                          walk[y,x]=True
                  assert not walk[59,132] and not walk[59,135],'door jamb would be open'
                  metrics['door_tiles']=6
              else:
                  metrics['door_tiles']=0
                  # 2F still has damaged brown ground art: retain an old passage only
                  # if no foreground wall exists at the actor's feet.
                  old=np.fromfile(out/f'r64-old-{mid}.bin',np.uint8).reshape(h,w)
                  repaired_holes=(old>0)&(~walk)&(foot_map<0.05)&(mean_map>20)
                  walk|=repaired_holes
                  metrics['floor_hole_passages_preserved']=int(repaired_holes.sum())
              # Game_Map and Game_Character both consult R44.allowed?; symmetric edges.
              edges=np.zeros((h,w),np.uint8)
              linked=walk[:,:-1]&walk[:,1:]
              edges[:,:-1][linked]|=8;edges[:,1:][linked]|=4
              linked=walk[:-1,:]&walk[1:,:]
              edges[:-1,:][linked]|=2;edges[1:,:][linked]|=1
              assert np.count_nonzero(edges[~walk])==0
              assert np.array_equal((edges[:,:-1]&8)>0,(edges[:,1:]&4)>0)
              assert np.array_equal((edges[:-1,:]&2)>0,(edges[1:,:]&1)>0)
              if mid==45:
                  assert edges[68,97]==0,'Screenshot: actor must not stand inside painted wall'
                  assert edges[58,90]!=0,'Upper room must be walkable'
                  assert edges[74,97]!=0,'Lower room must be walkable'
                  for x in (133,134):
                      assert all((edges[y,x]&2)>0 and (edges[y+1,x]&1)>0 for y in (57,58,59,60))
              else:
                  assert edges[94,81]!=0,'2F entrance must remain walkable'
                  assert edges[100,156]!=0,'2F boss-room event floor must remain walkable'
              edges.tofile(out/f'r64-edges-{mid}.bin')
              walk.tofile(out/f'r64-walk-{mid}.bin')
              metrics.update(cells=w*h,walkable_tiles=int(walk.sum()),linked_tiles=int(np.count_nonzero(edges)),min_border=0)
              report['maps'][str(mid)]=metrics
              print('PASS Map',mid,metrics)
          (out/'r64-visual.json').write_text(json.dumps(report,indent=2))
          R64_PY_VISUAL
          python3 /tmp/r64_visual.py
      - name: V229R64 Patch game passage and fix inverted wall drawing depth
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r64_patch.rb <<'R64_RB_PATCH'
          # encoding: UTF-8
          require 'zlib'
          require 'json'
          require 'digest'
          root='site/knight/gameasync/Data'
          path=File.join(root,'Scripts.rxdata')
          original=File.binread(path)
          scripts=Marshal.load(original)
          saved=Marshal.load(original)
          raise 'Unexpected scripts archive' unless scripts.size==136
          read=lambda{|i|Zlib::Inflate.inflate(scripts[i][2]).force_encoding('UTF-8')}
          write=lambda{|i,s|scripts[i][2]=Zlib::Deflate.deflate(s.b)}

          s21=read.call(21)
          marker=s21.index('module SLTI_V229R44')
          raise 'Missing actual collision module' unless marker
          prefix=s21[0...marker]
          body=s21[marker..-1]
          [45,46].each do |mid|
            raw=File.binread("build/r64-edges-#{mid}.bin")
            expected=mid==45 ? 288*144 : 336*168
            raise 'Wrong visual collision grid length' unless raw.bytesize==expected
            regex=/^  EDGES_#{mid} = \[\r?\n.*?\r?\n  \]\.join\.unpack\('m'\)\[0\]/m
            n=body.scan(regex).size
            raise "Wrong collision match count Map#{mid}: #{n}" unless n==1
            b64=[raw].pack('m0').scan(/.{1,120}/).map{|line|'    '+line.inspect}.join(",\n")
            body=body.sub(regex,"  EDGES_#{mid} = [\n#{b64}\n  ].join.unpack('m')[0]")
          end
          s21=prefix+body
          write.call(21,s21)

          s134=read.call(134)
          s134_original=s134.dup
          old=<<'OLD'
                  # All original wall faces are foreground over actor AND monster sprites.
                  # Fade only the wall piece actually covering the player sprite.
                  s.z=4096 if s.z!=4096
                  wanted_opacity=overlap ? 148 : 255
                  s.opacity=wanted_opacity if s.opacity!=wanted_opacity
          OLD
          new=<<'NEW'
                  # RGSS characters are depth-sorted by their feet Y. The old static
                  # 4096 put walls in front even when the player stood on their FRONT.
                  wall_depth=wall_y+by1*2+32
                  s.z=wall_depth if s.z!=wall_depth
                  # Fade only when the wall really sits IN FRONT of the hero.
                  covered=overlap && actor_depth<wall_depth
                  wanted_opacity=covered ? 148 : 255
                  s.opacity=wanted_opacity if s.opacity!=wanted_opacity
          NEW
          raise 'Wall draw method mismatch' unless s134.scan(old).size==1
          s134=s134.sub(old,new)
          raise 'Unrelated reward/AI code changed' unless s134.sub(new,old)==s134_original
          write.call(134,s134)
          raise 'Unrequested scripts changed' unless scripts.each_index.all?{|i| [21,134].include?(i)||scripts[i]==saved[i]}
          raise 'Original monster balance changed' unless scripts[134][1]==saved[134][1]
          File.binwrite(path,Marshal.dump(scripts))

          # Replay actual runtime graph decoding; do not trust the encoded text alone.
          verify=Marshal.load(File.binread(path))
          source=Zlib::Inflate.inflate(verify[21][2]).force_encoding('UTF-8')
          a=source.index('module SLTI_V229R44')
          b=source.index("\nclass Game_Map",a)
          raise 'No live map class' unless a && b
          eval(source[a...b])
          [45,46].each do |mid|
           raw=File.binread("build/r64-edges-#{mid}.bin")
           raise "Live graph differs #{mid}" unless SLTI_V229R44.const_get("EDGES_#{mid}")==raw
          end
          wall=Zlib::Inflate.inflate(verify[134][2]).force_encoding('UTF-8')
          raise 'Wall remains fixed depth' if wall.include?('s.z=4096')
          raise 'Depth comparison missing' unless wall.include?('covered=overlap && actor_depth<wall_depth')
          File.binwrite('build/r64-wall-script.rb',wall)
          File.write('build/r64-script-report.json',JSON.pretty_generate({version:'V229R64',source_script_sha256:Digest::SHA256.hexdigest(original),changed_scripts:[21,134],monster_combat_runtime_preserved:true,wall_depth_rule:'by1*2+32',wall_fade_rule:'overlap and actor_depth<wall_depth'}))
          puts 'PASS RGSS map45/map46 visual floor graph and dynamic wall depth; other scripts intact'
          R64_RB_PATCH
          ruby /tmp/r64_patch.rb
          ruby -c build/r64-wall-script.rb
      - name: V229R64 Test behind and front actor rendering with actual wall code
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r64_depth_test.rb <<'R64_RB_DEPTH'
          # encoding: UTF-8
          src=File.binread('build/r64-wall-script.rb').force_encoding('UTF-8')
          a=src.index("  def slti_r49_update_walls\n")
          b=src.index("  alias slti_r49_original_dispose dispose",a)
          raise 'Original wall code not present' unless a && b
          class Spriteset_Map;end
          eval("class Spriteset_Map\n"+src[a...b]+"end\n")
          MapMock=Struct.new(:display_x,:display_y)
          View=Struct.new(:rect)
          Rect=Struct.new(:width,:height)
          SrcRect=Struct.new(:width,:height)
          Sprite=Struct.new(:x,:y,:visible,:opacity,:z)
          Hero=Struct.new(:x,:y,:ox,:oy,:src_rect,:bitmap,:z)
          $game_map=MapMock.new(0,0)
          spr=Sprite.new(0,0,true,255,0)
          hero=Hero.new(100,100,20,60,SrcRect.new(48,80),Object.new,131)
          ss=Spriteset_Map.allocate
          ss.instance_variable_set(:@slti_chunks,{[0,0]=>true})
          ss.instance_variable_set(:@slti_r49_walls,{[0,0]=>[nil,[[spr,0,0,0,128,64]]]})
          ss.instance_variable_set(:@viewport2,View.new(Rect.new(640,480)))
          ss.instance_variable_set(:@character_sprites,[hero])
          ss.slti_r49_update_walls
          raise 'Wall not in front of hero when behind' unless spr.z>hero.z && spr.opacity==148
          puts 'PASS wall behind-character test: wall covers behind hero and fades'
          hero.y=147;hero.z=178
          ss.slti_r49_update_walls
          raise 'Wall is still in front of hero who stands ahead' unless spr.z<hero.z && spr.opacity==255
          puts 'PASS player in front: hero renders ahead of fully opaque wall'
          R64_RB_DEPTH
          ruby /tmp/r64_depth_test.rb
      - name: V229R64 Update cache and prove preservation of all other data
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r64_finish.py <<'R64_PY_FINISH'
          from pathlib import Path
          import hashlib,json,re
          root=Path('site');engine=root/'knight/gameasync';mapping=engine/'mapping.js'
          old=Path('build/r64-baseline.json')
          assert old.is_file(),'Missing original inventory'
          source=mapping.read_text('utf-8')
          uri='Data/Scripts.rxdata'
          md5=hashlib.md5((engine/uri).read_bytes()).hexdigest()
          text,n=re.subn(re.escape(uri)+r'\?h=[0-9a-f]{32}',lambda m:uri+'?h='+md5,source)
          assert n==1,('Unexpected Scripts cache hash occurrences',n)
          mapping.write_text(text,encoding='utf-8')
          for n in ('index.html','knight/index.html'):
           f=root/n;s=f.read_text('utf-8')
           assert 'V229R63' in s,n
           f.write_text(s.replace('V229R63','V229R64').replace('v229r63','v229r64'),encoding='utf-8')
          baseline=json.loads(old.read_text())
          actual={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(actual)==len(baseline)==5517
          assert actual.keys()==baseline.keys()
          changed={n for n in actual if actual[n]!=baseline[n]}
          allowed={'index.html','knight/index.html','knight/gameasync/mapping.js','knight/gameasync/Data/Scripts.rxdata'}
          assert changed==allowed,('Unexpected changed game file',changed^allowed)
          report=json.loads(Path('build/r64-visual.json').read_text())
          assert report['maps']['45']['walkable_tiles']>20000
          assert report['maps']['46']['walkable_tiles']>25000
          print('PASS entire 5517-file source preserved; only Ruby Scripts, mapping, 2 label files changed')
          print('PASS all original Map045/046 event files, wall and floor PNGs untouched')
          R64_PY_FINISH
          python3 /tmp/r64_finish.py
          node --check site/knight/gameasync/mapping.js
      - name: V229R64 Upload visual collision and wall depth audit
        uses: actions/upload-artifact@v4
        with:
          name: SLKnight-V229R64-Visual-Wall-Collision-Audit
          path: |
            build/r64-visual.json
            build/r64-script-report.json
          retention-days: 30
          if-no-files-found: error

      - name: V229R64 Upload full game to existing GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
