name: Deploy SLKnight V14.3z10.6g + SLFairy SAVE BOOT BUFF FIX

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  F106_SHA: 0eb5b9776827f25860a37209d1bdb248d01cb7d3
  Z105_SHA: e19659507b466b87a671949532b02484bc1faaef
  Z104_SHA: e044e1b6c53646b4c4f21f2dfee4967a68fabbc4
  DUAL_BASE_SHA: 04ce66ec99abc10f77143de53650685db8949532
  CURRENT_Z10_SHA: f545634bafbe1e1e55aaf6489126ad17b07da382
  BASELINE_SHA: c6815cd461dba60ec131898e6d5dd8690dd915ae
  X2_SHA: 6d941bd643dda87b8267ba466e108d1904c22331
  Z1_SHA: 008b6abe81074b7af877806b45f2314004a74f66
  Z3_SHA: 5a46988b048764e8a99700998c1f4ab96a3ec5c1
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  FAIRY_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLFairy_Source_v1.zip
  FAIRY_SHA256: 67b88b5fe0cde3c9f2fada889815f9aa7d0fc94b378025529e9950d55151c70e
  FAIRY_7Z_PASSWORD: http://nemo838.tistory.com/
  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout frozen 10.6f workflow
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.F106_SHA }}
          path: f106src

      - name: Checkout z10.5 source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z105_SHA }}
          path: z105src

      - name: Checkout z10.4 source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z104_SHA }}
          path: z104src

      - name: Checkout dual base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.DUAL_BASE_SHA }}
          path: dualbase

      - name: Checkout z10 source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.CURRENT_Z10_SHA }}
          path: z10src

      - name: Checkout V14.3l baseline
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.BASELINE_SHA }}
          path: baseline

      - name: Checkout V14.3x2 auto base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.X2_SHA }}
          path: x2

      - name: Checkout V14.3z1 monster base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z1_SHA }}
          path: z1

      - name: Checkout V14.3z3 monster base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z3_SHA }}
          path: z3

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake cmake curl ffmpeg freepats git imagemagick libtool make mm-common patch pkg-config python3 rake ruby timidity unzip wget xz-utils fonts-nanum p7zip-full nodejs

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.MKXP_SRC_REF }}
          path: engine

      - name: Cache engine dependencies
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-${{ runner.os }}-${{ env.EMSDK_VER }}-onig25b

      - name: Run frozen 10.6f stable preparation only
        run: |
          set -euo pipefail
          ruby -ryaml - <<'RB'
          doc=YAML.load_file('f106src/.github/workflows/build-slknight-web.yml')
          steps=doc.fetch('jobs').fetch('build').fetch('steps')
          names=['Extract stable preparation scripts','Build Knight and prepare Fairy','Patch Fairy boot once']
          names.each_with_index do |name,i|
            step=steps.find{|s|s['name']==name}
            abort "F106 STEP MISSING: #{name}" unless step&&step['run']
            File.write(format('/tmp/f106_%02d.sh',i),step['run'])
          end
          RB
          for i in 0 1 2; do bash -e "$(printf '/tmp/f106_%02d.sh' "$i")"; done
          echo F106_STABLE_PREP_OK

      - name: Fix Knight CE4 CE10 CE68 CE107 only
        run: |
          set -euo pipefail
          ruby -EUTF-8:UTF-8 - player/gameasync <<'RB'
          game=ARGV.fetch(0)

          class RawMarshalObject
            def self._load(data); o=allocate; o.instance_variable_set(:@raw,data); o; end
            def _dump(_depth); @raw; end
          end

          class Tone < RawMarshalObject; end
          class Color < RawMarshalObject; end
          class Rect < RawMarshalObject; end
          class Table < RawMarshalObject; end

          module RPG
            class AudioFile; end
            class CommonEvent; end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
          end

          def iv(o,n); o.instance_variable_get("@#{n}"); end
          def setiv(o,n,v); o.instance_variable_set("@#{n}",v); end

          def cmd(code,indent=0,params=[])
            c=RPG::EventCommand.new
            setiv(c,:code,code)
            setiv(c,:indent,indent)
            setiv(c,:parameters,params)
            c
          end

          def sw(indent,id,on)
            cmd(121,indent,[id,id,on ? 0 : 1])
          end

          def vset(indent,id,val)
            cmd(122,indent,[id,id,0,0,val])
          end

          def vadd(indent,id,val)
            cmd(122,indent,[id,id,1,0,val])
          end

          def speed(indent,value)
            route=RPG::MoveRoute.new
            setiv(route,:repeat,false)
            setiv(route,:skippable,false)

            m=RPG::MoveCommand.new
            setiv(m,:code,29)
            setiv(m,:parameters,[value])

            z=RPG::MoveCommand.new
            setiv(z,:code,0)
            setiv(z,:parameters,[])

            setiv(route,:list,[m,z])

            [
              cmd(209,indent,[-1,route]),
              cmd(509,indent,[m])
            ]
          end

          def branch(indent,expr,yes,no=nil)
            out=[
              cmd(111,indent,[12,expr])
            ] + yes + [
              cmd(0,indent+1,[])
            ]

            if no
              out += [
                cmd(411,indent,[])
              ] + no + [
                cmd(0,indent+1,[])
              ]
            end

            out + [
              cmd(412,indent,[])
            ]
          end

          def ui(indent)
            [
              cmd(355,indent,['Guage.show']),
              cmd(355,indent,['$KeyIcon.ShowIcon'])
            ]
          end

          def call(indent,id)
            [
              cmd(117,indent,[id])
            ]
          end

          def speed_tree(indent)
            other='[58,138,189,264,265,311,390,627,628,629].any?{|i|$game_variables[i].to_i==1}'

            normal=branch(
              indent+4,
              '$game_switches[171] || $game_switches[368]',
              speed(indent+5,3),
              speed(indent+5,2)
            )

            courage=branch(
              indent+3,
              '$game_switches[172]',
              speed(indent+4,4),
              normal
            )

            others=branch(
              indent+2,
              other,
              speed(indent+3,4),
              courage
            )

            assassin=branch(
              indent+1,
              '$game_variables[309].to_i==1',
              speed(indent+2,3),
              others
            )

            branch(
              indent,
              '$game_variables[263].to_i==1',
              speed(indent+1,5),
              assassin
            )
          end

          cp=Dir.glob(
            File.join(
              game,
              'Data',
              '*CommonEvents.rxdata'
            )
          ).max_by{|p|File.size(p)}

          abort 'CommonEvents missing' unless cp&&File.size(cp)>1000

          ce=Marshal.load(
            File.binread(cp)
          )

          [3,4,6,8,10,17,33,34,59,60,68,107].each do |id|
            abort "CE#{id} missing" unless ce[id]
          end

          frozen=[
            3,
            6,
            8,
            17,
            33,
            34,
            59,
            60
          ].to_h do |id|
            [
              id,
              Marshal.dump(ce[id])
            ]
          end

          warn4=[
            cmd(355,1,['$BufTime = 1']),
            cmd(355,1,['$메세지.set_text2("***용기의 물약 해제 : 10초전***")']),
            cmd(655,1,['Guage.show']),
            cmd(355,1,['$BufTime = 0'])
          ]

          expire4=[
            vset(1,109,0),
            sw(1,172,false),
            sw(1,1002,false),
            cmd(355,1,['a = "***당신의 기분이 보통으로 돌아왔습니다.***"']),
            cmd(655,1,['$메세지.set_text2(a)'])
          ] +
            ui(1) +
            call(1,589) +
            call(1,68)

          list4=[
            cmd(106,0,[20]),
            vadd(0,109,1)
          ] +
            branch(
              0,
              '$game_variables[109].to_i == 290',
              warn4
            ) +
            branch(
              0,
              '$game_variables[109].to_i >= 300',
              expire4
            ) +
            [
              cmd(0,0,[])
            ]

          setiv(ce[4],:list,list4)
          setiv(ce[4],:trigger,2)
          setiv(ce[4],:switch_id,1002)

          warn10=[
            cmd(355,1,['$BufTime = 1']),
            cmd(355,1,['$메세지.set_text2("***속도 향상 물약 해제 : 10초전***")']),
            cmd(655,1,['Guage.show']),
            cmd(355,1,['$BufTime = 0'])
          ]

          expire10=[
            vset(1,110,0),
            sw(1,171,false),
            cmd(355,1,['$메세지.set_text2("***느려지는 것을 느낍니다.***")'])
          ] +
            ui(1) +
            call(1,68)

          list10=[
            cmd(106,0,[20]),
            vadd(0,110,1)
          ] +
            branch(
              0,
              '$game_variables[110].to_i == 290',
              warn10
            ) +
            branch(
              0,
              '$game_variables[110].to_i >= 300',
              expire10
            ) +
            [
              cmd(0,0,[])
            ]

          setiv(ce[10],:list,list10)
          setiv(ce[10],:trigger,2)
          setiv(ce[10],:switch_id,171)

          warn107=[
            cmd(355,1,['$BufTime = 1']),
            cmd(355,1,['$메세지.set_text2("***강화 속도 향상 물약 해제 : 10초전***")']),
            cmd(655,1,['Guage.show']),
            cmd(355,1,['$BufTime = 0'])
          ]

          expire107=[
            vset(1,110,0),
            sw(1,368,false),
            cmd(355,1,['$메세지.set_text2("***느려지는 것을 느낍니다.***")'])
          ] +
            ui(1) +
            call(1,68)

          list107=[
            cmd(106,0,[20]),
            vadd(0,110,1)
          ] +
            branch(
              0,
              '$game_variables[110].to_i == 1790',
              warn107
            ) +
            branch(
              0,
              '$game_variables[110].to_i >= 1800',
              expire107
            ) +
            [
              cmd(0,0,[])
            ]

          setiv(ce[107],:list,list107)
          setiv(ce[107],:trigger,2)
          setiv(ce[107],:switch_id,368)

          setiv(
            ce[68],
            :list,
            speed_tree(0) +
              [
                sw(0,998,false),
                cmd(0,0,[])
              ]
          )

          setiv(ce[68],:trigger,2)
          setiv(ce[68],:switch_id,998)

          frozen.each do |id,raw|
            abort "UNRELATED CE CHANGED #{id}" unless
              Marshal.dump(ce[id])==raw
          end

          abort 'CE4 CE589 missing' unless
            iv(ce[4],:list).any? do |c|
              iv(c,:code)==117 &&
                iv(c,:parameters)==[589]
            end

          [4,10,107].each do |id|
            abort "CE#{id} CE68 missing" unless
              iv(ce[id],:list).any? do |c|
                iv(c,:code)==117 &&
                  iv(c,:parameters)==[68]
              end
          end

          abort 'CE4 changed green state' if
            iv(ce[4],:list).any? do |c|
              iv(c,:code)==121 &&
                [171,368].include?(
                  iv(c,:parameters)[0].to_i
                )
            end

          [10,107].each do |id|
            abort "CE#{id} changed courage state" if
              iv(ce[id],:list).any? do |c|
                iv(c,:code)==121 &&
                  [172,1002].include?(
                    iv(c,:parameters)[0].to_i
                  )
              end
          end

          iv(ce[68],:list).each do |c|
            code=iv(c,:code)
            p=iv(c,:parameters)||[]

            abort 'CE68 writes variable' if code==122

            abort 'CE68 writes non-998 switch' if
              code==121 &&
              p[0].to_i!=998

            if code==209
              (
                iv(
                  p[1],
                  :list
                )||[]
              ).each do |m|
                abort 'CE68 non-speed route' unless
                  [0,29].include?(
                    iv(m,:code).to_i
                  )
              end

            elsif code==509
              abort 'CE68 non-speed continuation' if
                p[0] &&
                iv(p[0],:code).to_i!=29
            end
          end

          File.binwrite(
            cp,
            Marshal.dump(ce)
          )

          puts 'KNIGHT_CE4_10_68_107_FIX_OK'
          RB

      - name: Rebuild mappings
        run: |
          set -euo pipefail

          (
            cd player/gameasync
            bash "$GITHUB_WORKSPACE/engine/extra/make_mapping.sh"
          )

          (
            cd fairy_player/gameasync
            bash "$GITHUB_WORKSPACE/engine/extra/make_mapping.sh"
          )

          test -s player/gameasync/mapping.js
          test -s fairy_player/gameasync/mapping.js

      - name: Build safe transform preload and preserve save namespaces
        run: |
          set -euo pipefail

          ruby -EUTF-8:UTF-8 -rjson - player/gameasync fairy_player/gameasync <<'RB'
          class RawMarshalObject
            def self._load(data); o=allocate; o.instance_variable_set(:@raw,data); o; end
            def _dump(_depth); @raw; end
          end

          class Tone < RawMarshalObject; end
          class Color < RawMarshalObject; end
          class Rect < RawMarshalObject; end
          class Table < RawMarshalObject; end

          module RPG
            class AudioFile; end
            class CommonEvent; end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
          end

          def iv(o,n)
            o.instance_variable_get("@#{n}")
          end

          def names(game)
            cp=Dir.glob(
              File.join(
                game,
                'Data',
                '*CommonEvents.rxdata'
              )
            ).max_by{|p|File.size(p)}

            abort "CommonEvents missing #{game}" unless cp

            ce=Marshal.load(
              File.binread(cp)
            )

            out=[]

            [6,17,34].each do |id|
              (
                iv(
                  ce[id],
                  :list
                )||[]
              ).each do |c|

                next unless iv(c,:code)==209

                route=(
                  iv(
                    c,
                    :parameters
                  )||[]
                )[1]

                next unless route

                (
                  iv(
                    route,
                    :list
                  )||[]
                ).each do |m|

                  next unless iv(m,:code)==41

                  n=(
                    iv(
                      m,
                      :parameters
                    )||[]
                  )[0].to_s.dup

                  n.force_encoding(
                    Encoding::UTF_8
                  )

                  abort "bad utf8 transform name #{n.bytes.inspect}" unless
                    n.valid_encoding?

                  out << n unless n.empty?
                end
              end
            end

            list=out.uniq.sort

            list.each do |n|
              file=File.join(
                game,
                'Graphics',
                'Characters',
                n+'.png'
              )

              abort "missing transform #{file}" unless
                File.size?(file)
            end

            list
          end

          File.write(
            '/tmp/knight_transform.json',
            JSON.generate(
              names(ARGV[0])
            ),
            mode:'w:UTF-8'
          )

          File.write(
            '/tmp/fairy_transform.json',
            JSON.generate(
              names(ARGV[1])
            ),
            mode:'w:UTF-8'
          )
          RB

          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          configs=[
              (
                  Path('player/index.html'),
                  Path('player/js/drive.js'),
                  Path('/tmp/knight_transform.json'),
                  'slknight_v14_engine',
                  'SLKnight V14.3z100',
                  'SLKnight V14.3z10.6g',
                  'v143z100',
                  'v143z106gknight',
                  [
                      'slknight_v106d_engine',
                      'slknight_v106e_engine',
                      'slknight_v106f_engine'
                  ]
              ),
              (
                  Path('fairy_player/index.html'),
                  Path('fairy_player/js/drive.js'),
                  Path('/tmp/fairy_transform.json'),
                  'slfairy_v105_engine',
                  'SLFairy V14.3z10.5',
                  'SLFairy V14.3z10.6g',
                  'v143z105elf',
                  'v143z106gelf',
                  [
                      'slfairy_v106_engine',
                      'slfairy_v106a_engine',
                      'slfairy_v106b_engine',
                      'slfairy_v106d_engine',
                      'slfairy_v106e_engine',
                      'slfairy_v106f_engine'
                  ]
              )
          ]

          def remove_legacy(s,name):
              start="        if (!is_touch_device()) {"
              end="        resize();"

              if s.count(start)!=1:
                  raise SystemExit(
                      f'legacy touch marker {name} '
                      f'count={s.count(start)}'
                  )

              a=s.index(start)
              b=s.index(end,a)+len(end)
              s=s[:a]+s[b:]

              if (
                  'is_touch_device()' in s
                  or
                  "bindKey('d-up'" in s
              ):
                  raise SystemExit(
                      'legacy touch remains '+name
                  )

              return s

          def preload_js(names,tag):
              arr=json.dumps(
                  names,
                  ensure_ascii=True,
                  separators=(',',':')
              )

              return """(function(){
  var names=%s;
  Module.preRun=Module.preRun||[];
  Module.preRun.push(function(){
    names.forEach(function(name){
      var file=name+'.png',p='/game/Graphics/Characters/'+file;
      try{if(FS.analyzePath(p).exists)FS.unlink(p);}catch(e){}
      FS.createPreloadedFile('/game/Graphics/Characters',file,encodeURI('gameasync/Graphics/Characters/'+file+'?v=%s'),true,true,function(){},function(){console.error('SLTRANSFORMERR|'+file);});
    });
  });
})();
"""%(arr,tag)

          def patch_drive(path,legacy):
              s=path.read_text(
                  encoding='utf-8'
              )

              marker='// SL_SAVE_NAMESPACE_MIGRATION_V106G'

              if marker in s:
                  return

              old=json.dumps(
                  legacy,
                  separators=(',',':')
              )

              s += f'''
{marker}
(function(){{
  var base=window.restoreLocalFilesBeforeRun,old={old};
  window.restoreLocalFilesBeforeRun=function(){{
    var dep='sl-save-migrate-v106g';
    addRunDependency(dep);

    localforage.getItem(namespace).then(function(cur){{
      cur=cur||{{}};

      return old.reduce(function(chain,ns){{
        return chain.then(function(){{
          return localforage.getItem(ns).then(function(folder){{
            folder=folder||{{}};

            return Object.keys(folder).reduce(function(c,key){{
              return c.then(function(){{
                var om=folder[key]||{{}};
                var cm=cur[key]||null;

                if(
                  cm &&
                  Number(cm.t||0)>=Number(om.t||0)
                )return;

                return localforage.getItem(ns+key).then(function(buf){{
                  if(!buf)return;

                  return localforage.setItem(namespace+key,buf).then(function(){{
                    cur[key]=om;
                  }});
                }});
              }});
            }},Promise.resolve());
          }});
        }});
      }},Promise.resolve()).then(function(){{
        return localforage.setItem(namespace,cur);
      }});
    }}).then(function(){{
      base();
      removeRunDependency(dep);
    }}).catch(function(e){{
      console.error('SLSAVEMIGRATEERR|'+e);
      base();
      removeRunDependency(dep);
    }});
  }};
}})();
'''

              path.write_text(
                  s,
                  encoding='utf-8'
              )

          for (
              html,
              drive,
              jfile,
              namespace,
              oldtitle,
              title,
              oldtag,
              tag,
              legacy
          ) in configs:

              s=html.read_text(
                  encoding='utf-8'
              )

              if namespace not in s:
                  raise SystemExit(
                      'permanent namespace missing '+
                      str(html)
                  )

              s=remove_legacy(
                  s,
                  str(html)
              )

              s=s.replace(
                  'position:fixed;left:8px;top:8px;',
                  'position:fixed;left:8px;bottom:8px;'
              )

              s=s.replace(
                  oldtitle,
                  title
              )

              s=s.replace(
                  oldtag,
                  tag
              )

              js=html.parent/'sl-transform-preload.js'

              js.write_text(
                  preload_js(
                      json.loads(
                          jfile.read_text(
                              encoding='utf-8'
                          )
                      ),
                      tag
                  ),
                  encoding='utf-8'
              )

              taghtml=(
                  f'<script src="sl-transform-preload.js'
                  f'?v={tag}"></script>'
              )

              if taghtml not in s:
                  if '</body>' not in s:
                      raise SystemExit(
                          'body end missing '+
                          str(html)
                      )

                  s=s.replace(
                      '</body>',
                      taghtml+'\n</body>',
                      1
                  )

              html.write_text(
                  s,
                  encoding='utf-8'
              )

              patch_drive(
                  drive,
                  legacy
              )

          p=Path(
              'fairy_player/index.html'
          )

          s=p.read_text(
              encoding='utf-8'
          )

          old="""  var log=console.log.bind(console);
            console.log=function(){
              var a=[].slice.call(arguments),t=a.join(' ');
              try{marker(t);}catch(e){log('SLAUDIOJSERR|'+e);}
              if(/SLRUNTIMEERR|SLSCRIPTERR/.test(t))err(t);
              log.apply(console,a);
            };
            window.addEventListener('error',function(e){err('JS ERROR | '+e.message);});"""

          old=old.replace(
              '            ',
              ''
          )

          new="""  function report(t){
            t=String(t||'');
            if(/SLRUNTIMEERR|SLSCRIPTERR|Message:|NO SUCH FILE|PHYSFS ERROR|Skipping loading| - err(?:$|\\s)|SLFONTERR|SLAUDIOJSERR|SLTRANSFORMERR/i.test(t))err(t);
          }
          var log=console.log.bind(console),elog=console.error.bind(console);
          console.log=function(){
            var a=[].slice.call(arguments),t=a.join(' ');
            try{marker(t);}catch(e){
              report('SLAUDIOJSERR|'+e);
              log('SLAUDIOJSERR|'+e);
            }
            report(t);
            log.apply(console,a);
          };
          console.error=function(){
            var a=[].slice.call(arguments),t=a.join(' ');
            report(t);
            elog.apply(console,a);
          };
          window.addEventListener('error',function(e){
            err('JS ERROR | '+e.message);
          });
          window.addEventListener('unhandledrejection',function(e){
            var r=e&&e.reason;
            err(
              'PROMISE ERROR | '+
              (
                r&&r.message
                  ?r.message
                  :String(r)
              )
            );
          });"""

          new=new.replace(
              '          ',
              ''
          )

          if s.count(old)!=1:
              raise SystemExit(
                  'fairy error bridge count='+
                  str(s.count(old))
              )

          p.write_text(
              s.replace(
                  old,
                  new,
                  1
              ),
              encoding='utf-8'
          )

          print(
              'SAFE_PRELOAD_SAVE_NAMESPACE_OK'
          )
          PY

          node --check player/sl-transform-preload.js
          node --check fairy_player/sl-transform-preload.js
          node --check player/js/drive.js
          node --check fairy_player/js/drive.js

          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          for html in (
              'player/index.html',
              'fairy_player/index.html'
          ):
              s=Path(html).read_text(
                  encoding='utf-8'
              )

              blocks=[]

              for m in re.finditer(
                  r'<script(?P<a>[^>]*)>(?P<b>.*?)</script>',
                  s,
                  re.S|re.I
              ):
                  if (
                      'src=' not in m.group('a').lower()
                      and
                      m.group('b').strip()
                  ):
                      blocks.append(
                          m.group('b')
                      )

              for i,b in enumerate(blocks):
                  p=Path(
                      f'/tmp/'
                      f'{Path(html).parent.name}_{i}.js'
                  )

                  p.write_text(
                      b,
                      encoding='utf-8'
                  )

                  subprocess.run(
                      [
                          'node',
                          '--check',
                          str(p)
                      ],
                      check=True
                  )

              print(
                  'INLINE_JS_OK',
                  html,
                  len(blocks)
              )
          PY

      - name: Build dual site
        run: |
          set -euo pipefail

          rm -rf site
          mkdir -p site/knight site/elf

          cp -a player/. site/knight/
          cp -a fairy_player/. site/elf/

          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="ko">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
            <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
            <title>SLKnight + SLFairy</title>
            <style>
              html,body{margin:0;width:100%;height:100%;background:#080808;color:#fff;font-family:system-ui,sans-serif}
              .wrap{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px}
              .choices{display:flex;gap:16px}
              button{width:150px;height:160px;border:1px solid #777;border-radius:14px;background:#171717;color:#fff;font-size:25px}
            </style>
          </head>
          <body>
            <div class="wrap">
              <h1>캐릭터 선택</h1>
              <div class="choices">
                <button onclick="location.href='knight/?v='+Date.now()">기사</button>
                <button onclick="location.href='elf/?v='+Date.now()">요정</button>
              </div>
            </div>
          </body>
          </html>
          HTML

          touch site/.nojekyll

          rm -rf player
          mv site player

      - name: Sanity check
        run: |
          set -euo pipefail

          for side in knight elf; do
            test -s player/$side/index.html
            test -s player/$side/mkxp.js
            test -s player/$side/mkxp.wasm
            test -s player/$side/gameasync/Data/Scripts.rxdata
            test -s player/$side/gameasync/mapping.js
            test -s player/$side/sl-transform-preload.js
          done

          grep -Fq 'slknight_v14_engine' player/knight/index.html
          grep -Fq 'SLKnight V14.3z10.6g' player/knight/index.html
          grep -Fq 'v143z106gknight' player/knight/index.html

          grep -Fq 'slfairy_v105_engine' player/elf/index.html
          grep -Fq 'SLFairy V14.3z10.6g' player/elf/index.html
          grep -Fq 'v143z106gelf' player/elf/index.html

          grep -Fq 'SL_SAVE_NAMESPACE_MIGRATION_V106G' player/knight/js/drive.js
          grep -Fq 'SL_SAVE_NAMESPACE_MIGRATION_V106G' player/elf/js/drive.js

          ! grep -Fq 'slknight_v106f_engine' player/knight/index.html
          ! grep -Fq 'slfairy_v106f_engine' player/elf/index.html

          ! grep -Fq 'var slTransformSheets=' player/knight/index.html
          ! grep -Fq 'var slTransformSheets=' player/elf/index.html

          grep -Fq 'function report(t)' player/elf/index.html

          ruby -rzlib - player/knight/gameasync/Data/*CommonEvents.rxdata <<'RB'
          class RawMarshalObject
            def self._load(data);o=allocate;o.instance_variable_set(:@raw,data);o;end
            def _dump(_depth);@raw;end
          end

          class Tone < RawMarshalObject;end
          class Color < RawMarshalObject;end
          class Rect < RawMarshalObject;end
          class Table < RawMarshalObject;end

          module RPG
            class AudioFile;end
            class CommonEvent;end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end

          def iv(o,n)
            o.instance_variable_get("@#{n}")
          end

          ce=Marshal.load(
            File.binread(ARGV[0])
          )

          abort 'CE4 trigger' unless
            iv(ce[4],:trigger)==2 &&
            iv(ce[4],:switch_id)==1002

          abort 'CE10 trigger' unless
            iv(ce[10],:trigger)==2 &&
            iv(ce[10],:switch_id)==171

          abort 'CE107 trigger' unless
            iv(ce[107],:trigger)==2 &&
            iv(ce[107],:switch_id)==368

          abort 'CE68 trigger' unless
            iv(ce[68],:trigger)==2 &&
            iv(ce[68],:switch_id)==998

          puts 'FINAL_BUFF_VERIFY_OK'
          RB

          echo V106G_SAVE_BOOT_BUFF_FIX_OK

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player

