          an=Marshal.load(File.binread(ap))

          expected={852=>4,866=>3,867=>4,871=>4,872=>4}
          expected.each do |id,count|
            found=an.compact.select do |a|
              iv(a,:name).to_s.dup.force_encoding(Encoding::UTF_8).start_with?("SLV #{id} ")
            end
            abort "remaining animation count #{id}=#{found.length}, expected=#{count}" unless found.length==count
          end

          names=an.compact.map{|a|iv(a,:name).to_s.dup.force_encoding(Encoding::UTF_8)}
          required=[
            'SLV 852 홉고블린모션 D4 ',
            'SLV 866 좀비엘모어장군모션 D4 ',
            'SLV 867 좀비엘모어병사모션 D4 ',
