
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V245
# BASE: V241 successful run 41293648580
# SOURCE: Native Death Knight Map016 EV8 / CE901
# TARGET: Zenith Queen, Map025
# GRAPHICS: Sanctuary SPR2807, 7 banks x 4 directions
# KEEP: All original maps, NPCs, items, engine and Map047
# STATUS: Source-checked; GitHub Actions execution not verified

name: build-slknight-web.yml | V245 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: V245 Restore verified V241 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41293648580
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V245 Verify baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build original packages
          test -s baseline/artifact.tar
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json

          root=Path("site")
          files={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob("*") if p.is_file()
          }

          assert len(files)==5603, "Wrong V241 inventory"

          scripts="knight/gameasync/Data/Scripts.rxdata"
          expected=(
              "f43507920c57e81ec1d219bae492f5e"
              "6191f6471f733d8d471f81e8515f7d167"
          )
          assert files[scripts]==expected

          pre=(
              "knight/gameasync/Data/"
              "MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"
          )

          for mid in (16,25,47):
              assert pre+f"Map{mid:03d}.rxdata" in files

          for mid in (45,46):
              assert pre+f"Map{mid:03d}.rxdata" not in files

          assert "knight/assets/map-047-v241.pack" in files

          Path("build/before.json").write_text(
              json.dumps(files,sort_keys=True)
          )
          print("PASS V241 baseline")
          PY

      - name: V245 Download verified Sanctuary motions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh run download 39386289505 \
            -R "$GITHUB_REPOSITORY" \
            -n audit-sanctuary-monsters-v34-all-source-database \
            -D original

          gh run download 39386289505 \
            -R "$GITHUB_REPOSITORY" \
            -n audit-sanctuary-monsters-v34-all-original-cardinal-gifs \
            -D packages

          test -s original/V34-all-cardinal-gif-manifest.csv

          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil

      - name: V245 Assemble all seven original motion banks
        shell: bash
        run: |
          set -euo pipefail

          cat > build/graphics.py <<'PY'
          import csv,io,zipfile,hashlib
          from pathlib import Path
          from PIL import Image

          root=Path(
              "site/knight/gameasync/Graphics/Characters"
          )
          root.mkdir(parents=True,exist_ok=True)

          banks={
              0:"Walk",
              8:"Attack",
              16:"Hit",
              24:"Death",
              32:"Idle",
              40:"Spell40",
              48:"Spell48"
          }
          directions=(1,3,5,7)

          with open(
              "original/V34-all-cardinal-gif-manifest.csv",
              encoding="utf-8-sig",newline=""
          ) as f:
              wanted={
                  r["gif"].removeprefix("gifs/"):r
                  for r in csv.DictReader(f)
                  if int(r["actor"])==2807
                  and int(r["bank"]) in banks
                  and int(r["direction"]) in directions
                  and r["byte_verified"]=="True"
              }

          assert len(wanted)==28, (
              "Expected 28 verified original GIFs",
              len(wanted)
          )

          found={}
          archives=sorted(
              Path("packages").rglob(
                  "V34-*-cardinal-gifs.zip"
              )
          )
          assert len(archives)==17

          for archive in archives:
              with zipfile.ZipFile(archive) as z:
                  for name in z.namelist():
                      if name not in wanted:
                          continue
                      raw=z.read(name)
                      assert hashlib.sha256(raw).hexdigest()==(
                          wanted[name]["gif_sha256"]
                      )
                      found[name]=raw

          assert set(found)==set(wanted)

          for bank,action in banks.items():
              rows={}

              for direction in directions:
                  matches=[
                      name for name,r in wanted.items()
                      if int(r["bank"])==bank
                      and int(r["direction"])==direction
                  ]
                  assert len(matches)==1

                  with Image.open(
                      io.BytesIO(found[matches[0]])
                  ) as gif:
                      count=max(1,gif.n_frames)
                      frames=[]

                      for i in range(4):
                          index=min(
                              count-1,(i*count)//4
                          )
                          gif.seek(index)
                          frames.append(
                              gif.convert("RGBA").copy()
                          )

                      rows[direction]=frames

              width=max(
                  im.width for seq in rows.values()
                  for im in seq
              )
              height=max(
                  im.height for seq in rows.values()
                  for im in seq
              )

              sheet=Image.new(
                  "RGBA",(width*4,height*4),
                  (0,0,0,0)
              )

              for row,direction in enumerate(directions):
                  for col,im in enumerate(
                      rows[direction]
                  ):
                      x=col*width+(width-im.width)//2
                      y=row*height+(height-im.height)
                      sheet.alpha_composite(im,(x,y))

              output=root/("SLZenith"+action+".png")
              sheet.save(output,optimize=True)
              assert output.stat().st_size>100

              print(
                  "PASS SPR2807",
                  bank,action,
                  output.name
              )

          assert len(list(root.glob("SLZenith*.png")))==7
          print("PASS seven banks, 28 originals")
          PY

          python3 build/graphics.py

      - name: V245 Install native hybrid combat and boss event
        shell: bash
        run: |
          set -euo pipefail

          cat > build/zenith.rb <<'RUBY'
          require 'zlib'
          require 'digest'

          module RPG
            class Map;end
            class MapInfo;end
            class AudioFile;end
            class CommonEvent;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end

          class Table
            def self._load(raw)
              o=allocate
              o.instance_variable_set(:@raw,raw)
              o
            end
            def _dump(level=0);@raw;end
          end

          class Tone
            def self._load(raw)
              o=allocate
              o.instance_variable_set(:@raw,raw)
              o
            end
            def _dump(level=0);@raw;end
          end

          class Color<Tone;end

          def iv(o,key)
            o.instance_variable_get("@"+key.to_s)
          end

          def put(o,key,value)
            o.instance_variable_set("@"+key.to_s,value)
          end

          def cmd(code,params=[],indent=0)
            o=RPG::EventCommand.allocate
            put(o,:code,code)
            put(o,:parameters,params)
            put(o,:indent,indent)
            o
          end

          ROOT="site/knight/gameasync/Data/"
          PRE="MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"

          SOURCE_MAP=ROOT+PRE+"Map016.rxdata"
          TARGET_MAP=ROOT+PRE+"Map025.rxdata"
          COMMON=Dir.glob(ROOT+"*CommonEvents.rxdata")
          SCRIPTS=ROOT+"Scripts.rxdata"

          raise "CommonEvents source missing" unless
            COMMON.length==1
          COMMON=COMMON.first

          HP_VAR=7001
          MAGIC_SWITCH=7010
          SOURCE_HP=1980
          SOURCE_CE=901
          SOURCE_MAGIC_SWITCH=135
          MAX_HP=5200

          source_map=Marshal.load(
              File.binread(SOURCE_MAP)
          )
          target_map=Marshal.load(
              File.binread(TARGET_MAP)
          )
          common=Marshal.load(
              File.binread(COMMON)
          )

          raise "Invalid native common events" unless
            common.is_a?(Array) &&
            common[SOURCE_CE]

          source_events=iv(source_map,:events)
          events=iv(target_map,:events)

          source=source_events.fetch(8)
          source_name=iv(source,:name).to_s.dup
          source_name.force_encoding("UTF-8")
          source_name=source_name.scrub

          raise "Wrong native template" unless
            source_name.include?("데스나이트")

          original_events=events.transform_values{
            |e| Marshal.dump(e)
          }
          original_ce=Marshal.dump(common[SOURCE_CE])

          # The native CE901 includes physical and magic
          # damage, accuracy, MDEF, and HP command 311.
          attack_ce=Marshal.load(original_ce)
          new_ce_id=common.length
          put(attack_ce,:id,new_ce_id)
          put(attack_ce,:name,"[공격]제니스 퀸")

          ce_list=iv(attack_ce,:list)
          raise "Missing native attack list" unless
            ce_list.is_a?(Array)

          physical_low=0
          physical_high=0
          magic_low=0
          magic_high=0
          magic_trigger=0
          native_damage=0

          ce_list.each do |c|
            code=iv(c,:code)
            p=iv(c,:parameters)
            next unless p.is_a?(Array)

            if code==122 &&
               p[0]==26 && p[1]==26 &&
               p[2]==0 && p[3]==0

              case p[4]
              when 35
                p[4]=50
                physical_low+=1
              when 70
                p[4]=100
                physical_high+=1
              when 150
                magic_low+=1
              when 300
                magic_high+=1
              end
            end

            if code==121 &&
               p[0]==SOURCE_MAGIC_SWITCH &&
               p[1]==SOURCE_MAGIC_SWITCH
              put(c,:code,355)
              put(c,:parameters,[
                "SLZenith.magic_animation"
              ])
              magic_trigger+=1
            end

            # Keep native damage and defense commands.
            native_damage+=1 if code==311

            # A Death Knight-specific sound must not be
            # presented as an original Zenith sound.
            if code==250
              audio=p[0]
              name=iv(audio,:name).to_s rescue ""
              if name.include?("데스나이트")
                put(c,:code,355)
                put(c,:parameters,["nil"])
              end
            end
          end

          raise "Wrong physical branches" unless
            physical_low==1 && physical_high==1

          raise "Wrong magic branches" unless
            magic_low==1 && magic_high==1

          raise "Native damage pipeline missing" unless
            native_damage>=2

          raise "Native magic branch missing" unless
            magic_trigger>=1

          # Keep original event command indentation.
          ce_list.unshift(
            cmd(355,["SLZenith.attack_animation"])
          )

          common << attack_ce
          File.binwrite(COMMON,Marshal.dump(common))

          # Follow the original native event/common-event
          # switch dispatch to CE901 without guessing IDs.
          def reaches_ce?(id,common,target,seen={})
            return true if id==target
            return false if seen[id]
            seen[id]=true

            ce=common[id]
            return false unless ce
            list=iv(ce,:list)
            return false unless list.is_a?(Array)

            list.any? do |c|
              code=iv(c,:code)
              p=iv(c,:parameters)
              next false unless p.is_a?(Array)

              if code==117
                reaches_ce?(
                  p[0],common,target,seen.dup
                )
              elsif code==121 &&
                    p[0]==p[1] && p[2]==0
                switch=p[0]
                common.compact.any? do |other|
                  next false unless
                    iv(other,:switch_id)==switch &&
                    iv(other,:trigger).to_i>0

                  reaches_ce?(
                    iv(other,:id),common,
                    target,seen.dup
                  )
                end
              else
                false
              end
            end
          end

          def reaches_switch?(switch,common,target)
            common.compact.any? do |ce|
              next false unless
                iv(ce,:switch_id)==switch &&
                iv(ce,:trigger).to_i>0

              reaches_ce?(
                iv(ce,:id),common,target
              )
            end
          end

          # Use the proven hybrid boss event, not Medusa.
          boss=Marshal.load(
              Marshal.dump(source)
          )
          boss_id=events.keys.max+1

          put(boss,:id,boss_id)
          put(boss,:name,"제니스 퀸")

          # Use a free location near an existing
          # Map025 monster, preserving all originals.
          reference=events.fetch(11)
          sx=iv(reference,:x)
          sy=iv(reference,:y)
          width=iv(target_map,:width)
          height=iv(target_map,:height)

          occupied=events.values.map{
            |e| [iv(e,:x),iv(e,:y)]
          }

          spawn=nil
          (1..10).each do |radius|
            break if spawn
            (-radius..radius).each do |dy|
              break if spawn
              (-radius..radius).each do |dx|
                x=sx+dx
                y=sy+dy
                next unless
                  [dx.abs,dy.abs].max==radius
                next if x<2 || y<2
                next if x>=width-2 || y>=height-2
                next if occupied.include?([x,y])
                spawn=[x,y]
                break
              end
            end
          end

          raise "No boss spawn tile" unless spawn

          put(boss,:x,spawn[0])
          put(boss,:y,spawn[1])

          pages=iv(boss,:pages)
          raise "Invalid original boss pages" unless
            pages.is_a?(Array) && pages.size>=3

          active=pages[1]
          active_condition=iv(active,:condition)

          # Remove the original colosseum wave gate.
          original_gate=(
            iv(active_condition,:switch1_valid) ?
            iv(active_condition,:switch1_id) : nil
          )
          put(active_condition,:switch1_valid,false)

          death=pages.find do |page|
            c=iv(page,:condition)
            iv(c,:variable_valid) &&
            iv(c,:variable_id)==SOURCE_HP &&
            iv(c,:variable_value)==4000
          end

          raise "Native death page missing" unless death

          attack_routes=0
          hp_rewrites=0
          bar_removed=0
          wait_adjusted=0

          pages.each do |page|
            condition=iv(page,:condition)

            if iv(condition,:variable_valid) &&
               iv(condition,:variable_id)==SOURCE_HP
              put(condition,:variable_id,HP_VAR)
            end

            graphic=iv(page,:graphic)
            put(
              graphic,:character_name,
              "SLZenithWalk"
            )
            put(page,:move_speed,3)
            put(page,:move_frequency,6)

            list=iv(page,:list)
            next unless list.is_a?(Array)

            list.each do |c|
              code=iv(c,:code)
              p=iv(c,:parameters)
              next unless p.is_a?(Array)

              # Replace genuine native attack dispatch
              # with the independent cloned CE901.
              if page.equal?(active)
                if code==117 &&
                   reaches_ce?(
                     p[0],common,SOURCE_CE
                   )
                  put(c,:parameters,[new_ce_id])
                  attack_routes+=1
                  next
                end

                if code==121 &&
                   p[0]==p[1] &&
                   p[2]==0 &&
                   reaches_switch?(
                     p[0],common,SOURCE_CE
                   )
                  put(c,:code,117)
                  put(c,:parameters,[new_ce_id])
                  attack_routes+=1
                  next
                end
              end

              case code
              when 121
                if original_gate &&
                   p[0]==original_gate &&
                   p[1]==original_gate
                  put(c,:code,355)
                  put(c,:parameters,["nil"])
                end

              when 122
                if p[0]==SOURCE_HP &&
                   p[1]==SOURCE_HP
                  p[0]=HP_VAR
                  p[1]=HP_VAR
                  hp_rewrites+=1
                end

                if p[3]==1 && p[4]==SOURCE_HP
                  p[4]=HP_VAR
                end

              when 111
                if p[0]==1 &&
                   p[1]==SOURCE_HP
                  p[1]=HP_VAR
                end

              when 230
                # Native source: 5 + 7 = 12.
                # Preserve the first wait and extend
                # the second wait to total 20.
                if page.equal?(active) && p[0]==7
                  p[0]=15
                  wait_adjusted+=1
                end

              when 355,655
                next unless p[0].is_a?(String)

                script=p[0].dup

                if script.include?("drawMHP")
                  put(c,:parameters,["nil"])
                  bar_removed+=1
                  next
                end

                script.gsub!(
                  "$game_variables[#{SOURCE_HP}]",
                  "$game_variables[#{HP_VAR}]"
                )

                script.gsub!(
                  "$game_map.events[8]",
                  "$game_map.events[#{boss_id}]"
                )

                # Do not register an old colosseum
                # attacker or its original event ID.
                script.gsub!(
                  /SLMonsterAttackContext\.register\([^\)]*\)/,
                  "nil"
                )

                p[0]=script
              end
            end
          end

          raise "Native attack route not connected" unless
            attack_routes>0

          raise "Boss HP not isolated" unless
            hp_rewrites>0

          raise "Native attack wait not located" unless
            wait_adjusted>0

          # Dedicated death and reward path.
          death_condition=iv(death,:condition)
          put(death_condition,:variable_valid,true)
          put(death_condition,:variable_id,HP_VAR)
          put(death_condition,:variable_value,MAX_HP)
          put(death_condition,:switch1_valid,false)
          put(death_condition,:switch2_valid,false)

          put(death,:list,[
            cmd(355,["SLZenith.reward"]),
            cmd(230,[45]),
            cmd(116,[]),
            cmd(0,[])
          ])

          original_events.each do |id,raw|
            raise "Original Map025 event modified #{id}" unless
              Marshal.dump(events[id])==raw
          end

          raise "Original CE901 modified" unless
            Marshal.dump(common[SOURCE_CE])==original_ce

          events[boss_id]=boss

          File.binwrite(
            TARGET_MAP,Marshal.dump(target_map)
          )

          runtime=<<'SOURCE'
          module SLZenith
            MAP_ID=25
            EVENT_ID=__EVENT_ID__
            HP_VAR=7001
            LEVEL=60
            MAX_HP=5200
            PHYSICAL=[50,100]
            MAGIC=[150,300]
            ACCURACY=9999
            ATTACK_WAIT=20
            HIT_RANDOM=[15,35]
            EXP=43212
            ADENA=[64800,151200]

            # Original approved V244 reward IDs.
            # Probability is per 1000 rolls.
            DROPS=[
              [:item,35,30],
              [:item,34,20],
              [:item,33,100],
              [:item,37,100],
              [:armor,169,50],
              [:item,116,3],
              [:item,32,100],
              [:item,38,100],
              [:armor,289,30],
              [:weapon,123,30],
              [:weapon,18,50],
              [:item,3,200],
              [:weapon,1,50],
              [:armor,72,50],
              [:item,2,250],
              [:armor,303,2],
              [:item,43,100],
              [:armor,280,30],
              [:armor,12,50],
              [:armor,492,3]
            ]

            @engaged=false
            @paid=false
            @special_index=0

            def self.event
              return nil unless $game_map
              return nil unless
                $game_map.map_id==MAP_ID
              return nil unless $game_map.events
              $game_map.events[EVENT_ID]
            end

            def self.actor
              $game_actors[1] if $game_actors
            end

            def self.roll(range)
              range[0]+rand(range[1]-range[0]+1)
            end

            def self.animate(action)
              ev=event
              return unless ev

              ev.instance_variable_set(
                :@character_name,
                "SLZenith"+action
              )
              ev.instance_variable_set(:@pattern,0)
              ev.instance_variable_set(
                :@slz_anim_frames,
                action=="Death" ? -1 : 24
              )
            end

            def self.show_hp
              return unless @engaged
              return unless $game_variables
              return unless
                $m && $m.respond_to?(:drawMHP)

              damage=$game_variables[HP_VAR].to_i

              $m.drawMHP(
                "제니스 퀸",
                damage,
                MAX_HP,
                2
              )
            end

            def self.engage
              return unless event
              return if @paid
              first=!@engaged
              @engaged=true
              show_hp if first
            end

            def self.attack_animation
              return if @paid
              engage
              animate("Attack")
            end

            def self.magic_animation
              return if @paid
              engage

              action=(
                @special_index.to_i.even? ?
                "Spell40" : "Spell48"
              )
              @special_index=@special_index.to_i+1

              animate(action)

              # Use an existing native animation only
              # when a matching source name exists.
              if defined?($data_animations) &&
                 $data_animations
                key=(
                  action=="Spell40" ?
                  /독|poison|venom/i :
                  /거미|web|spider/i
                )

                pair=$data_animations.each_with_index.find{
                  |a,i| a &&
                  a.respond_to?(:name) &&
                  a.name.to_s.match(key)
                }

                if pair && $game_player &&
                   $game_player.respond_to?(:animation_id=)
                  $game_player.animation_id=pair[1]
                end
              end
            end

            def self.hit
              return if @paid
              engage
              animate("Hit")
              show_hp
            end

            def self.reward
              return unless $game_map &&
                $game_map.map_id==MAP_ID
              return unless $game_variables
              return if @paid
              return if
                $game_variables[HP_VAR].to_i<MAX_HP

              @paid=true
              @engaged=true

              gold=roll(ADENA)
              $game_party.gain_gold(gold)

              target=actor
              target.exp=target.exp+EXP if target

              $game_variables[333]=gold
              $game_variables[1926]=EXP

              DROPS.each do |kind,id,chance|
                next unless rand(1000)<chance

                case kind
                when :item
                  $game_party.gain_item(id,1)
                when :weapon
                  $game_party.gain_weapon(id,1)
                when :armor
                  $game_party.gain_armor(id,1)
                end
              end

              show_hp
              animate("Death")
            end

            def self.reset(map_id)
              @paid=false
              @engaged=false
              @special_index=0

              if map_id==MAP_ID && $game_variables
                $game_variables[HP_VAR]=0
              end
            end
          end

          # Native common events remain responsible
          # for physical and magic player damage.
          # No direct player HP subtraction is added.

          class Game_Event
            alias slz_v245_native_update update

            def update
              slz_v245_native_update

              return unless
                @map_id==SLZenith::MAP_ID &&
                @id==SLZenith::EVENT_ID

              frames=@slz_anim_frames.to_i

              if frames>0
                @slz_anim_frames=frames-1

                if @slz_anim_frames==0
                  @character_name="SLZenithWalk"
                end
              end

              return unless $game_variables
              hp=$game_variables[
                SLZenith::HP_VAR
              ].to_i

              if @slz_last_hp.nil?
                @slz_last_hp=hp
                return
              end

              if hp>@slz_last_hp
                SLZenith.hit if
                  hp<SLZenith::MAX_HP
              end

              @slz_last_hp=hp
            end
          end

          class Game_Map
            alias slz_v245_native_setup setup

            def setup(map_id)
              SLZenith.reset(map_id)
              slz_v245_native_setup(map_id)
            end
          end
          SOURCE

          runtime=runtime.sub(
            "__EVENT_ID__",boss_id.to_s
          )

          scripts=Marshal.load(
            File.binread(SCRIPTS)
          )

          raise "Unexpected RGSS structure" unless
            scripts.is_a?(Array) &&
            scripts.size>=130

          raise "Already installed" if scripts.any?{
            |r| r.is_a?(Array) &&
            r[1].to_s.start_with?("SLZenithV")
          }

          main_index=scripts.index{
            |r| r.is_a?(Array) &&
            r[1].to_s=="Main"
          }

          raise "Main script missing" unless main_index

          scripts.insert(
            main_index,
            [
              99824501,
              "SLZenithV245",
              Zlib::Deflate.deflate(runtime,9)
            ]
          )

          File.binwrite(
            SCRIPTS,Marshal.dump(scripts)
          )

          File.write(
            "build/zenith-runtime.rb",runtime
          )

          report=[
            "Version=V245",
            "Map=025",
            "BossEvent=#{boss_id}",
            "Spawn=#{spawn.inspect}",
            "Template=Map016_EV8_DeathKnight",
            "SourceCE=901",
            "NewCE=#{new_ce_id}",
            "HPVariable=#{HP_VAR}",
            "MaxHP=#{MAX_HP}",
            "NativeAttackRoutes=#{attack_routes}",
            "HPRewrites=#{hp_rewrites}",
            "OldHPBarCallsRemoved=#{bar_removed}",
            "NativeWaitRewrites=#{wait_adjusted}",
            "Physical=50/100",
            "Magic=150/300",
            "MotionBanks=0,8,16,24,32,40,48"
          ].join("\n")+"\n"

          File.write(
            "build/zenith-report.txt",report
          )

          puts report
          puts "PASS original Map025 events retained"
          puts "PASS original CE901 retained"
          puts "PASS independent native hybrid CE"
          RUBY

          ruby -c build/zenith.rb
          ruby build/zenith.rb
          ruby -c build/zenith-runtime.rb

      - name: V245 Verify actual native combat data
        shell: bash
        run: |
          set -euo pipefail

          cat > build/verify.rb <<'RUBY'
          require 'zlib'

          module RPG
            class CommonEvent;end
            class EventCommand;end
          end

          path=Dir.glob(
            "site/knight/gameasync/Data/*CommonEvents.rxdata"
          ).first

          raise "Missing common events" unless path

          events=Marshal.load(File.binread(path))
          source=events[901]

          boss=events.compact.find{
            |ce|
            ce.instance_variable_get(:@name).to_s==
              "[공격]제니스 퀸"
          }

          raise "New CE missing" unless boss

          src=source.instance_variable_get(:@list)
          dst=boss.instance_variable_get(:@list)

          def commands(list,code)
            list.select{
              |c| c.instance_variable_get(:@code)==code
            }.map{
              |c| c.instance_variable_get(:@parameters)
            }
          end

          original_values=commands(src,122)
          new_values=commands(dst,122)

          raise "Source physical changed" unless
            original_values.any?{|p|
              p[0]==26 && p[4]==35
            } &&
            original_values.any?{|p|
              p[0]==26 && p[4]==70
            }

          raise "Physical 50 missing" unless
            new_values.any?{|p|
              p[0]==26 && p[4]==50
            }

          raise "Physical 100 missing" unless
            new_values.any?{|p|
              p[0]==26 && p[4]==100
            }

          for value in (150,300)
            raise "Native magic branch missing" unless
              new_values.any?{|p|
                p[0]==26 && p[4]==value
              }
          end

          raise "Native CE311 missing" unless
            commands(dst,311).size>=2

          raise "Native MDEF CE117 missing" unless
            commands(dst,117).any?{|p|p[0]==57}

          raise "Native magic action missing" unless
            commands(dst,355).any?{|p|
              p[0].to_s.include?(
                "SLZenith.magic_animation"
              )
            }

          runtime=File.read(
            "build/zenith-runtime.rb"
          )

          raise "Bad boss HP" unless
            runtime.include?("MAX_HP=5200")

          raise "Missing ring" unless
            runtime.include?("[:armor,492,3]")

          raise "Wrong reward count" unless
            runtime.scan(/^\s+\[:(?:item|weapon|armor),/).size==20

          raise "Wrong source route" unless
            File.read("build/zenith-report.txt")
              .include?("SourceCE=901")

          puts "PASS native physical 50/100"
          puts "PASS native magic 150/300"
          puts "PASS original accuracy and MDEF pipeline"
          puts "PASS native player damage CE311"
          puts "PASS distinct Zenith common event"
          puts "PASS all 20 reward records"
          RUBY

          ruby -c build/verify.rb
          ruby build/verify.rb

      - name: V245 Refresh mappings and version
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re

          root=Path("site")
          mapping=root/"knight/gameasync/mapping.js"
          text=mapping.read_text("utf-8")

          anchor="];\n\nvar mapping = {}"
          assert text.count(anchor)==1

          motions=[
              "Walk","Attack","Hit","Death",
              "Idle","Spell40","Spell48"
          ]

          entries=[]

          for motion in motions:
              name="SLZenith"+motion
              path=root/(
                  "knight/gameasync/Graphics/"
                  "Characters/"+name+".png"
              )

              assert path.is_file()
              digest=hashlib.md5(
                  path.read_bytes()
              ).hexdigest()

              entries.append(
                  '["graphics/characters/'+
                  name.lower()+
                  '", "Graphics/Characters/'+
                  name+'.png?h='+digest+'"],'
              )

          text=text.replace(
              anchor,
              "\n"+"\n".join(entries)+"\n"+anchor
          )

          pre="MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"

          data=root/"knight/gameasync/Data"
          common=list(
              data.glob("*CommonEvents.rxdata")
          )
          assert len(common)==1

          changed=[
              data/(pre+"Map025.rxdata"),
              data/"Scripts.rxdata",
              common[0]
          ]

          for path in changed:
              key="Data/"+path.name
              digest=hashlib.md5(
                  path.read_bytes()
              ).hexdigest()

              pattern=(
                  "("+re.escape(key)+
                  r"\?h=)[0-9a-f]{32}"
              )

              text,count=re.subn(
                  pattern,
                  lambda m:m.group(1)+digest,
                  text
              )

              assert count==1, (
                  "Missing unique data mapping",
                  key,count
              )

          mapping.write_text(text,"utf-8")

          loader=root/"knight/js/sl-assets-v229r115.js"
          script=loader.read_text("utf-8")

          old="var version='V241';"
          assert script.count(old)==1
          loader.write_text(
              script.replace(
                  old,"var version='V245';"
              ),
              "utf-8"
          )

          for relative in (
              "index.html","knight/index.html"
          ):
              path=root/relative
              html=path.read_text("utf-8")
              assert "V241" in html

              html=html.replace("V241","V245")
              html=html.replace(
                  "?v=v241","?v=v245"
              )
              path.write_text(html,"utf-8")

          print("PASS seven graphic mappings")
          print("PASS native CommonEvents mapping")
          print("PASS Map025 and Scripts mapping")
          print("PASS V245 version labels")
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: V245 Verify unrelated resources unchanged
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json

          root=Path("site")
          before=json.loads(
              Path("build/before.json").read_text("utf-8")
          )

          after={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob("*") if p.is_file()
          }

          pre=(
              "knight/gameasync/Data/"
              "MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"
          )

          common=[
              name for name in before
              if name.endswith("CommonEvents.rxdata")
          ]
          assert len(common)==1

          allowed={
              pre+"Map025.rxdata",
              "knight/gameasync/Data/Scripts.rxdata",
              common[0],
              "knight/gameasync/mapping.js",
              "knight/js/sl-assets-v229r115.js",
              "index.html",
              "knight/index.html"
          }

          motions=(
              "Walk","Attack","Hit","Death",
              "Idle","Spell40","Spell48"
          )

          expected_new={
              "knight/gameasync/Graphics/"
              "Characters/SLZenith"+motion+".png"
              for motion in motions
          }

          changed={
              name for name in before
              if before[name]!=after.get(name)
          }

          added=set(after)-set(before)
          removed=set(before)-set(after)

          assert changed==allowed, (
              "Unexpected modified files",
              sorted(changed^allowed)
          )

          assert added==expected_new, (
              "Unexpected new files",
              sorted(added^expected_new)
          )

          assert not removed, (
              "Original files deleted",sorted(removed)
          )

          assert len(after)==5610

          for mid in (45,46):
              assert pre+f"Map{mid:03d}.rxdata" not in after

          protected="knight/assets/map-047-v241.pack"
          assert after[protected]==before[protected]

          # The original native hybrid boss is protected.
          assert (
              after[pre+"Map016.rxdata"]==
              before[pre+"Map016.rxdata"]
          )

          print("PASS all original events preserved")
          print("PASS Map016 Death Knight unchanged")
          print("PASS Map047 and NPCs unchanged")
          print("PASS only seven original motion sheets added")
          print("PASS inventory 5603 -> 5610")
          PY

