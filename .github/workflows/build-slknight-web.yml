name: Deploy SLKnight V14.3z10.5b + SLFairy CANONICAL BOOT FIX

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions: {contents: read, pages: write, id-token: write}

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  Z105_SHA: e19659507b466b87a671949532b02484bc1faaef
  Z104_SHA: e044e1b6c53646b4c4f21f2dfee4967a68fabbc4
  DUAL_BASE_SHA: 04ce66ec99abc10f77143de53650685db8949532
  CURRENT_Z10_SHA: f545634bafbe1e1e55aaf6489126ad17b07da382
  BASELINE_SHA: c6815cd461dba60ec131898e6d5dd8690dd915ae
  X2_SHA: 6d941bd643dda87b8267ba466e108d1904c22331
  Z1_SHA: 008b6abe81074b7af877806b45f2314004a74f66
  Z3_SHA: 5a46988b048764e8a99700998c1f4ab96a3ec5c1

  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a

  FAIRY_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLFairy_Source_v1.zip
  FAIRY_SHA256: 67b88b5fe0cde3c9f2fada889815f9aa7d0fc94b378025529e9950d55151c70e
  FAIRY_7Z_PASSWORD: http://nemo838.tistory.com/

  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout frozen z10.5 failed only at verifier
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z105_SHA }}
          path: z105src

      - name: Checkout frozen z10.4 successful workflow
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z104_SHA }}
          path: z104src

      - name: Checkout frozen z10.2 dual base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.DUAL_BASE_SHA }}
          path: dualbase

      - name: Checkout frozen z10 workflow source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.CURRENT_Z10_SHA }}
          path: z10src

      - name: Checkout frozen V14.3l baseline
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.BASELINE_SHA }}
          path: baseline

      - name: Checkout frozen V14.3x2 native auto base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.X2_SHA }}
          path: x2

      - name: Checkout frozen V14.3z1 verified monster base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z1_SHA }}
          path: z1

      - name: Checkout frozen V14.3z3 current success
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z3_SHA }}
          path: z3

      - name: Install tools
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            autoconf \
            automake \
            cmake \
            curl \
            ffmpeg \
            freepats \
            git \
            imagemagick \
            libtool \
            make \
            mm-common \
            patch \
            pkg-config \
            python3 \
            rake \
            ruby \
            timidity \
            unzip \
            wget \
            xz-utils \
            fonts-nanum \
            p7zip-full \
            nodejs

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.MKXP_SRC_REF }}
          path: engine

      - name: Cache engine dependencies
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-${{ runner.os }}-${{ env.EMSDK_VER }}-onig25b

      - name: Extract exact z10.5 build scripts
        run: |
          set -euo pipefail

          ruby -ryaml - <<'RB'
          doc=YAML.load_file(
            'z105src/.github/workflows/build-slknight-web.yml'
          )

          steps=doc
            .fetch('jobs')
            .fetch('build')
            .fetch('steps')

          wanted={
            'Extract already-passed z10.4 build steps'=>
              '/tmp/z105_00.sh',

            'Run frozen successful build through repaired Fairy mappings'=>
              '/tmp/z105_01.sh',

            'Canonicalize SLFairy protected data paths and title'=>
              '/tmp/z105_02.sh',

            'Rebuild SLFairy mappings after canonicalization'=>
              '/tmp/z105_03.sh',

            'Finalize browser boot bridge and cache isolation'=>
              '/tmp/z105_04.sh',

            'Verify SLFairy canonical boot package'=>
              '/tmp/z105_verify.sh',

            'Build Knight + Fairy launcher with cache-busted entry'=>
              '/tmp/z105_launcher.sh'
          }

          wanted.each do |name,path|

            step=steps.find do |s|
              s['name']==name
            end

            abort(
              "Z105 STEP MISSING: #{name}"
            ) unless (
              step &&
              step['run']
            )

            File.write(
              path,
              step.fetch('run')
            )

            puts(
              "Z105_EXTRACTED #{name}"
            )
          end

          puts(
            "Z105_EXTRACT_OK count=#{wanted.length}"
          )
          RB

      - name: Fix z10.5 verifier Ruby syntax
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p=Path(
              '/tmp/z105_verify.sh'
          )

          s=p.read_text()

          old='''                'FAIRY RUBY SYNTAX ERROR '
                "script=#{i}: "
                "#{ex.message}"'''

          new='''                "FAIRY RUBY SYNTAX ERROR script=#{i}: #{ex.message}"'''

          count=s.count(old)

          if count != 1:
              print(
                  '--- VERIFIER RUBY ERROR BLOCK DEBUG ---'
              )

              for no,line in enumerate(
                  s.splitlines(),
                  1
              ):
                  if (
                      'FAIRY RUBY SYNTAX ERROR'
                      in line
                      or
                      'script=#{i}'
                      in line
                      or
                      '#{ex.message}'
                      in line
                  ):
                      print(
                          f'{no}: {line!r}'
                      )

              raise SystemExit(
                  'z10.5 verifier syntax marker '
                  f'count={count}'
              )

          s=s.replace(
              old,
              new,
              1
          )

          p.write_text(s)

          print(
              'Z105_VERIFIER_RUBY_SYNTAX_FIXED'
          )
          PY

          grep -Fq \
            '"FAIRY RUBY SYNTAX ERROR script=#{i}: #{ex.message}"' \
            /tmp/z105_verify.sh

          ! grep -Fq \
            "'FAIRY RUBY SYNTAX ERROR '" \
            /tmp/z105_verify.sh

      - name: Run z10.5 frozen preparation
        run: |
          set -euo pipefail

          echo \
            '===== Z105 STEP 00 ====='

          bash -e \
            /tmp/z105_00.sh

          echo \
            '===== Z105 STEP 01 ====='

          bash -e \
            /tmp/z105_01.sh

          echo \
            '===== Z105 STEP 02 ====='

          bash -e \
            /tmp/z105_02.sh

          echo \
            '===== Z105 STEP 03 ====='

          bash -e \
            /tmp/z105_03.sh

          echo \
            '===== Z105 STEP 04 ====='

          bash -e \
            /tmp/z105_04.sh

          echo \
            Z105_ALL_PREVIOUSLY_PASSED_STEPS_OK

      - name: Verify SLFairy canonical boot package fixed
        run: |
          set -euo pipefail

          bash -e \
            /tmp/z105_verify.sh

          echo \
            Z105_FIXED_VERIFY_OK

      - name: Build Knight and Fairy launcher
        run: |
          set -euo pipefail

          bash -e \
            /tmp/z105_launcher.sh

          test -s \
            player/index.html

          test -s \
            player/knight/index.html

          test -s \
            player/elf/index.html

          test -s \
            player/elf/mkxp.js

          test -s \
            player/elf/mkxp.wasm

          test -s \
            player/elf/gameasync/Game.ini

          test -s \
            player/elf/gameasync/Data/Scripts.rxdata

          test -s \
            player/elf/gameasync/Data/Actors.rxdata

          test -s \
            player/elf/gameasync/Data/System.rxdata

          test -s \
            player/elf/gameasync/Data/Map007.rxdata

          test -s \
            player/elf/gameasync/Graphics/Titles/fairy_title.png

          grep -Fq \
            'slknight_v14_engine' \
            player/knight/index.html

          grep -Fq \
            'slfairy_v105_engine' \
            player/elf/index.html

          grep -Fq \
            "elf/?v='+Date.now()" \
            player/index.html

          echo \
            FINAL_DUAL_PACKAGE_OK

          du -sh \
            player

      - name: Final package sanity
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          checks=[
              'player/index.html',
              'player/knight/index.html',
              'player/elf/index.html',
              'player/elf/mkxp.js',
              'player/elf/mkxp.wasm',
              'player/elf/gameasync/Game.ini',
              'player/elf/gameasync/Data/Scripts.rxdata',
              'player/elf/gameasync/Data/Actors.rxdata',
              'player/elf/gameasync/Data/Classes.rxdata',
              'player/elf/gameasync/Data/Skills.rxdata',
              'player/elf/gameasync/Data/Items.rxdata',
              'player/elf/gameasync/Data/Weapons.rxdata',
              'player/elf/gameasync/Data/Armors.rxdata',
              'player/elf/gameasync/Data/Enemies.rxdata',
              'player/elf/gameasync/Data/Troops.rxdata',
              'player/elf/gameasync/Data/States.rxdata',
              'player/elf/gameasync/Data/Animations.rxdata',
              'player/elf/gameasync/Data/Tilesets.rxdata',
              'player/elf/gameasync/Data/CommonEvents.rxdata',
              'player/elf/gameasync/Data/System.rxdata',
              'player/elf/gameasync/Data/MapInfos.rxdata',
              'player/elf/gameasync/Data/Map007.rxdata',
              'player/elf/gameasync/Graphics/Titles/fairy_title.png'
          ]

          for name in checks:

              p=Path(name)

              if (
                  not p.is_file()
                  or
                  p.stat().st_size<=4
              ):
                  raise SystemExit(
                      'FINAL FILE BAD: '
                      +name+
                      ' size='+
                      (
                          str(
                              p.stat().st_size
                          )
                          if p.exists()
                          else 'MISSING'
                      )
                  )

              print(
                  'FINAL_FILE_OK',
                  name,
                  p.stat().st_size
              )

          print(
              'FINAL_PACKAGE_SANITY_OK'
          )
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player

  deploy:
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
