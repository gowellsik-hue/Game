
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R15 / Silver Knight teleporter added TI Dungeon option
name: build-slknight-web.yml | V229R15 | TI Dungeon Teleporter Menu Fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: V229R15 Restore last verified V229R13 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39123726665
          name: github-pages
          github-token: ${{ github.token }}
          path: previous

      - name: V229R15 Verify exact original source
        run: |
          set -euo pipefail
          test -s previous/artifact.tar
          mkdir -p site
          tar -xf previous/artifact.tar -C site
          python3 - <<'PY_CHECK'
          from pathlib import Path
          import json,hashlib
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(before)==5354,len(before)
          expected={
              'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap029.rxdata':'a57a04c8374af36f66af7acafbec9a9cc1df0a95e59341f11706dbd27548d13b',
              'knight/gameasync/mapping.js':'a0c2f9bd83c81503bb77e058d8eb9e9089b4277c84aa5699de48974bd45cdd35',
              'knight/index.html':'00dfe6c49ef167ceee99316bf0525d4071bb75d5222497028f1c5c1578c19299'
          }
          for name,sha in expected.items():assert before[name]==sha,name
          Path('/tmp/r15-before.json').write_text(json.dumps(before))
          print('V229R15 VERIFIED R13 SOURCE: 5354 assets')
          PY_CHECK

      - name: V229R15 Add TI Dungeon NPC option preserving terrain
        run: |
          set -euo pipefail
          cat > /tmp/teleporter-r15.rb <<'RUBY_R15'
          require 'digest'
          module RPG
            class AudioFile;end;class Map;end
            class Event
              class Page
                class Condition;end;class Graphic;end
              end
            end
            class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          # Preserve the original serialized terrain and color data.
          class Table
            def self._load(blob); o=allocate;o.instance_variable_set(:@_raw,blob);o;end
            def _dump(depth=0);@_raw;end
          end
          class Tone
            def self._load(blob); o=allocate;o.instance_variable_set(:@_raw,blob);o;end
            def _dump(depth=0);@_raw;end
          end
          class Color
            def self._load(blob); o=allocate;o.instance_variable_set(:@_raw,blob);o;end
            def _dump(depth=0);@_raw;end
          end

          def val(c,key);c.instance_variable_get('@'+key);end
          def code(c);val(c,'code');end
          def level(c);val(c,'indent');end
          def args(c);val(c,'parameters');end
          def utf(s);s.to_s.dup.force_encoding('UTF-8').scrub;end
          def command(num,dep,parts)
            obj=RPG::EventCommand.allocate
            obj.instance_variable_set(:@code,num)
            obj.instance_variable_set(:@indent,dep)
            obj.instance_variable_set(:@parameters,parts)
            obj
          end

          path=ARGV.fetch(0)
          bytes=File.binread(path)
          EXPECTED='a57a04c8374af36f66af7acafbec9a9cc1df0a95e59341f11706dbd27548d13b'
          raise 'Map029 source differs' unless Digest::SHA256.hexdigest(bytes)==EXPECTED
          map=Marshal.load(bytes)
          raise 'Round-trip changes terrain data' unless Marshal.dump(map)==bytes
          event=val(map,'events').fetch(11)
          raise 'Wrong teleporter' unless utf(val(event,'name')).include?('공간 이동사') && [val(event,'x'),val(event,'y')]==[70,48]
          raw_event=Marshal.dump(event)
          pages=val(event,'pages')
          raise 'Unexpected NPC page count' unless pages.size==1
          lst=val(pages.first,'list')
          raise 'Unexpected original command count' unless lst.size==100
          menu_i=lst.find_index{|c|code(c)==102 && level(c)==3 && args(c).is_a?(Array) && args(c)[0].any?{|v|utf(v)=='수련 던전 입구 300 아데나'}}
          raise 'Missing original second menu' unless menu_i
          menu=lst[menu_i]
          options,cancel=args(menu)
          raise 'Unexpected original selection layout' unless options.map{|s|utf(s)}==['윈다우드 500 아데나','수련 던전 입구 300 아데나','개미굴 입구 1500 아데나','지저 호수 2500 아데나'] && cancel==5
          old_lake=options[3]
          lake_i=lst.find_index{|c|code(c)==402 && level(c)==3 && args(c)==[3,old_lake]}
          raise 'Original lake branch absent' unless lake_i
          cancel_i=((lake_i+1)...lst.length).find{|i|code(lst[i])==403 && level(lst[i])==3}
          raise 'Old cancel branch absent' unless cancel_i
          body=lst[(lake_i+1)...cancel_i]
          old_transfers=lst.select{|c|code(c)==201}.map{|c|args(c)}
          expected_transfers=[[0,21,71,58,0,1],[0,17,23,27,0,1],[0,18,114,111,0,1],[0,13,118,55,0,1],[0,29,100,132,0,1],[0,13,73,42,0,1],[0,41,20,55,0,1]]
          raise 'Original 7 transfers differ' unless old_transfers==expected_transfers
          raise 'Original lake destination missing' unless body.count{|c|code(c)==201 && args(c)==[0,41,20,55,0,1]}==1

          # Keep the lake destination and append a separate TI Dungeon choice.
          options[3]='다음>'
          third=['지저 호수 2500 아데나','말섬던전','취소']
          inserted=[command(402,3,[3,'다음>']),command(102,4,[third,4]),command(402,4,[0,third[0]])]
          body.each do |c|
            clone=Marshal.load(Marshal.dump(c))
            clone.instance_variable_set(:@indent,level(c)+1)
            inserted<<clone
          end
          inserted.concat([
            command(402,4,[1,third[1]]),
            command(101,5,['말섬던전은 별도 맵 연결 후 이용할 수 있습니다.']),
            command(0,5,[]),
            command(402,4,[2,third[2]]),
            command(0,5,[]),
            command(403,4,[]),
            command(0,5,[]),
            command(404,4,[]),
            command(0,4,[])
          ])
          lst[lake_i...cancel_i]=inserted
          menus=lst.select{|c|code(c)==102}
          raise 'Wrong menu levels or counts' unless menus.map{|c|[level(c),args(c)[0].size]}==[[2,4],[3,4],[4,3]]
          raise 'New menu choice missing' unless lst.count{|c|code(c)==402 && level(c)==4 && utf(args(c)[1])=='말섬던전'}==1
          raise 'Existing transfer changed' unless lst.select{|c|code(c)==201}.map{|c|args(c)}==old_transfers
          raise 'Gameplay commands changed outside menu' unless lst[0...lake_i].count{|c|code(c)==201}==6

          changed=Marshal.dump(map)
          recheck=Marshal.load(changed)
          recheck.instance_variable_get(:@events)[11]=Marshal.load(raw_event)
          raise 'Unrelated map data changed!' unless Marshal.dump(recheck)==bytes
          File.binwrite(path,changed)
          raise 'Write verification failed' unless File.binread(path)==changed
          puts "PASS_V229R15_MAP029_ONLY_EVENT_11_CHANGED commands=#{lst.size} saved=#{changed.size}"
          puts "SHA256: #{Digest::SHA256.file(path).hexdigest}"
          RUBY_R15

          ruby -c /tmp/teleporter-r15.rb
          ruby /tmp/teleporter-r15.rb site/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap029.rxdata

          python3 - <<'PY_INDEX'
          from pathlib import Path
          import hashlib,re
          root=Path('site/knight')
          rel='Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap029.rxdata'
          md5=hashlib.md5((root/'gameasync'/rel).read_bytes()).hexdigest()
          mapping=root/'gameasync/mapping.js'
          before=mapping.read_text(encoding='utf-8')
          updated,n=re.subn(re.escape(rel+'?h=')+r'[a-f0-9]{32}',lambda _:rel+'?h='+md5,before)
          assert n==1 and updated!=before,n
          mapping.write_text(updated,encoding='utf-8')
          index=root/'index.html'
          text=index.read_text(encoding='utf-8')
          old='gameasync/mapping.js?v=v229r13'
          assert text.count(old)==1
          index.write_text(text.replace(old,'gameasync/mapping.js?v=v229r15'),encoding='utf-8')
          PY_INDEX

      - name: V229R15 Check original gameplay and only 3 edited files
        run: |
          set -euo pipefail
          node --check site/knight/js/dpad.js
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import json,hashlib
          root=Path('site')
          old=json.loads(Path('/tmp/r15-before.json').read_text())
          current={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(current)==5354 and old.keys()==current.keys()
          changed={name for name in old if old[name]!=current[name]}
          expected={
              'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap029.rxdata',
              'knight/gameasync/mapping.js','knight/index.html'
          }
          assert changed==expected,(changed,expected)
          assert 'gameasync/mapping.js?v=v229r15' in (root/'knight/index.html').read_text()
          print('V229R15 PASS: Only Map029 NPC, mapping.js, index.html changed')
          PY_FINAL

      - name: V229R15 Upload verified Pages game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
