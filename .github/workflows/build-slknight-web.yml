          cat > player/js/dpad.js <<'JS'
          function simulateKeyEvent(eventType,keyCode,charCode){
            var e=document.createEventObject?document.createEventObject():document.createEvent("Events");
            if(e.initEvent)e.initEvent(eventType,true,true);
            e.keyCode=keyCode;e.which=keyCode;e.charCode=charCode||0;
            if(typeof JSEvents!=='undefined'&&JSEvents.eventHandlers&&JSEvents.eventHandlers.length>0){
              for(var i=0;i<JSEvents.eventHandlers.length;i++){
                var h=JSEvents.eventHandlers[i];
                if((h.target==Module['canvas']||h.target==window)&&h.eventTypeString==eventType)h.handlerFunc(e);
              }
            }else if(Module['canvas']){
              Module['canvas'].dispatchEvent?Module['canvas'].dispatchEvent(e):Module['canvas'].fireEvent("on"+eventType,e);
            }
          }

          function is_touch_device(){
            return ('ontouchstart' in window)||navigator.maxTouchPoints>0;
          }

          const slHeld=new Set();
          function slKey(code,down){
            if(down){
              if(slHeld.has(code))return;
              slHeld.add(code);
              simulateKeyEvent('keydown',code);
            }else{
              if(!slHeld.has(code))return;
              slHeld.delete(code);
              simulateKeyEvent('keyup',code);
            }
          }

          function slReleaseAll(){
            Array.from(slHeld).forEach(function(code){slKey(code,false);});
          }

          function initSLTouchControls(){
            var ui=document.getElementById('sl-touch-ui');
            if(!ui)return;
            if(!is_touch_device()){ui.style.display='none';return;}

            var zone=document.getElementById('sl-joy-zone');
            var base=document.getElementById('sl-joy-base');
            var knob=document.getElementById('sl-joy-knob');
            var joyId=null,originX=0,originY=0;
            var dirs={left:false,right:false,up:false,down:false};

            function setDir(name,on){
              if(dirs[name]===on)return;
              dirs[name]=on;
              var key={left:37,right:39,up:38,down:40}[name];
              slKey(key,on);
            }

            function releaseJoy(){
              setDir('left',false);setDir('right',false);setDir('up',false);setDir('down',false);
              joyId=null;
              base.style.display='none';
              knob.style.transform='translate(-50%,-50%)';
            }

            function updateJoy(x,y){
              var dx=x-originX,dy=y-originY;
              var dist=Math.sqrt(dx*dx+dy*dy);
              var max=46;
              var dead=12;
              var nx=dx,ny=dy;
              if(dist>max){nx=dx/dist*max;ny=dy/dist*max;}
              knob.style.transform='translate(calc(-50% + '+nx+'px),calc(-50% + '+ny+'px))';
              setDir('left',dx<-dead);
              setDir('right',dx>dead);
              setDir('up',dy<-dead);
              setDir('down',dy>dead);
            }

            zone.addEventListener('pointerdown',function(e){
              if(joyId!==null)return;
              e.preventDefault();
              joyId=e.pointerId;
              originX=e.clientX;originY=e.clientY;
              base.style.left=originX+'px';
              base.style.top=originY+'px';
              base.style.display='block';
              try{zone.setPointerCapture(e.pointerId);}catch(_){}
              updateJoy(e.clientX,e.clientY);
            });

            zone.addEventListener('pointermove',function(e){
              if(e.pointerId!==joyId)return;
              e.preventDefault();
              updateJoy(e.clientX,e.clientY);
            });

            zone.addEventListener('pointerup',function(e){
              if(e.pointerId!==joyId)return;
              e.preventDefault();
              releaseJoy();
            });

            zone.addEventListener('pointercancel',function(e){
              if(e.pointerId!==joyId)return;
              releaseJoy();
            });

            [
              ['sl-btn-main',67],
              ['sl-btn-cancel',88],
              ['sl-btn-item',73],
              ['sl-btn-equip',69]
            ].forEach(function(pair){
              var el=document.getElementById(pair[0]),key=pair[1];
              if(!el)return;
              el.addEventListener('pointerdown',function(e){
                e.preventDefault();
                try{el.setPointerCapture(e.pointerId);}catch(_){}
                el.classList.add('pressed');
                slKey(key,true);
              });
              function up(e){
                if(e)e.preventDefault();
                el.classList.remove('pressed');
                slKey(key,false);
              }
              el.addEventListener('pointerup',up);
              el.addEventListener('pointercancel',up);
              el.addEventListener('lostpointercapture',up);
            });

            window.addEventListener('blur',function(){releaseJoy();slReleaseAll();});
            document.addEventListener('visibilitychange',function(){if(document.hidden){releaseJoy();slReleaseAll();}});
          }

          const resize=function(){
            const el=document.getElementById('canvas');
            if(!el)return;
            if(window.innerHeight>window.innerWidth){el.style.height='unset';el.style.width='100%';}
            else{el.style.width='unset';el.style.height='100%';}
          };

          window.addEventListener('resize',resize);
          window.addEventListener('load',resize);
          JS

