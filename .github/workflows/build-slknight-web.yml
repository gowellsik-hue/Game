      - name: V241 Preserve V237 startup and install 194 assets before gameplay
        shell: bash
        run: |
          set -euo pipefail
          cat > build/update_pages.py <<'V241_PAGES_PY'
          from pathlib import Path
          import hashlib,re
          root=Path('site')
          mapfile=root/'knight/gameasync/mapping.js'
          old=mapfile.read_text('utf8');anchor='];\n\nvar mapping = {}'
          if old.count(anchor)!=1:raise ValueError('Original mappings changed')
          gid=root/'knight/gameasync/Graphics/Panoramas/SLTI_47_GID.png'
          entry='["graphics/panoramas/slti_47_gid", "Graphics/Panoramas/SLTI_47_GID.png?h='+hashlib.md5(gid.read_bytes()).hexdigest()+'"],'
          new=old.replace(anchor,'\n'+entry+'\n'+anchor)
          script=root/'knight/gameasync/Data/Scripts.rxdata'
          new,n=re.subn(r'(Data/Scripts\.rxdata\?h=)[0-9a-f]{32}',lambda m:m.group(1)+hashlib.md5(script.read_bytes()).hexdigest(),new)
          if n!=1:raise ValueError('Expected one original RGSS mapping key')
          mapfile.write_text(new,'utf8')
          loader=root/'knight/js/sl-assets-v229r115.js'
          s=loader.read_text('utf8')
          if s.count('193')!=6 or s.count('map-047-v234.pack')!=1 or s.count("var version='V237';")!=1:
              raise ValueError('The V237 pre-entry loader changed')
          s=s.replace('193','194').replace('map-047-v234.pack','map-047-v241.pack')
          s=s.replace("var version='V237';","var version='V241';")
          if not all(t in s for t in ('head.files.length!==194','done!==194','map47FilesReady=true','installMap47Files()')):
              raise ValueError('All 194 images must be fully installed BEFORE Map047 callback')
          loader.write_text(s,'utf8')
          for rel in ('index.html','knight/index.html'):
              p=root/rel;text=p.read_text('utf8')
              if 'V237' not in text:raise ValueError('The V237 HTML was unexpectedly changed')
              p.write_text(text.replace('V237','V241').replace('v237','v241'),'utf8')
          if 'js/sl-assets-v229r115.js?v=v241' not in (root/'knight/index.html').read_text('utf8'):
              raise ValueError('Browser cache tag still points to old source')
          print('PASS V237 pre-entry asset path unchanged except pack 193 -> 194, all ready before game start')
          V241_PAGES_PY
          python3 build/update_pages.py
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: V241 Test exact pre-entry FS readiness and moving roof fade
        shell: bash
        run: |
          set -euo pipefail
          cat > build/test_loader.js <<'V241_LOADER_JS'
          const fs=require('node:fs'),vm=require('node:vm'),path=require('node:path');
          const root=path.resolve('site/knight');
          const stats={installed:[],oldNative:0,callbacks:0,fetches:[]};
          const ctx={
           console,setTimeout,clearTimeout,AbortController,Uint8Array,DataView,TextDecoder,TextEncoder,Promise,
           FS:{createPreloadedFile(folder,name,bytes,canRead,canWrite,success,fail){
             if(!(bytes instanceof Uint8Array))throw new Error('Bytes not staged Uint8Array');
             stats.installed.push({folder,name,len:bytes.length});
             setTimeout(success,0);
           }},
           document:{body:null,getElementById(){return null}},
           window:{fileAsyncCache:{}, loadFileAsync(filepath,bitmap,callback){stats.oldNative++;if(stats.installed.length!==194)throw new Error('Map047 loaded before all 194 images installed');stats.callbacks++;callback();},getLazyAsset(){throw new Error('Should not fetch on movement')}},
           async fetch(url){
             const filename=url.split('?')[0];const bytes=fs.readFileSync(path.join(root,filename));stats.fetches.push(filename);
             return {ok:true,headers:{get(key){return key==='content-length'?String(bytes.length):null}},body:null,async arrayBuffer(){return bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength)}};
           }
          };
          ctx.window.window=ctx.window;ctx.window.document=ctx.document;ctx.window.FS=ctx.FS;
          vm.createContext(ctx);
          vm.runInContext(fs.readFileSync(path.join(root,'gameasync/mapping.js'),'utf8'),ctx,{filename:'mapping.js'});
          vm.runInContext(fs.readFileSync(path.join(root,'js/sl-assets-v229r115.js'),'utf8'),ctx,{filename:'preload.js'});
          let aborted=false;
          let timeout=setTimeout(()=>{aborted=true;console.error('FAIL map pre-entry install hung: '+JSON.stringify(stats));process.exit(4)},7000);
          ctx.window.loadFileAsync('gameasync/Data/Map047.rxdata',false,()=>{
           if(aborted)return;
           clearTimeout(timeout);
           const keys=new Set(stats.installed.map(i=>i.name.toLowerCase()));
           if(stats.callbacks!==1||stats.installed.length!==194||keys.size!==194||!keys.has('slti_47_gid.png'))throw new Error('Incorrect image installation result');
           const status=ctx.window.slR115Status();
           if(status.map!==47||status.ready.indexOf('map47')<0)throw new Error('Not yet ready');
           if(stats.fetches.filter(x=>x.includes('map-047-v241.pack')).length!==1)throw new Error('Incorrect pack network fetch');
           console.log('PASS JS pre-entry installs all 194 images, including original 96 underlay slots and native group map');
           console.log('PASS Map047 native callback occurs only AFTER pre-entry install; zero extra network requests on movement');
           process.exit(0);
          });
          V241_LOADER_JS
          cat > build/test_runtime.rb <<'V241_TEST_RB'
          class Rect
            attr_accessor :width,:height
            def initialize(w=800,h=600);@width=w;@height=h;end
            def set(*a);@values=a;end
          end
          Color=Struct.new(:red,:green)
          class Bitmap
            @@creates=0
            @@reads=0
            def self.reads;@@reads;end
            @@group_hex=File.read('build/group_cells.hex').strip
            def self.creates;@@creates;end
            def initialize(path);@@creates+=1;@path=path;end
            def get_pixel(x,y)
              @@reads+=1
              raise 'Wrong group image' unless @path=='Graphics/Panoramas/SLTI_47_GID'
              group=@@group_hex[(y*363+x)*4,4].to_i(16)
              Color.new(group%256,group/256)
            end
            def disposed?;false;end
            def dispose;end
          end
          class Sprite
            @@creates=0
            def self.creates;@@creates;end
            attr_accessor :bitmap,:z,:zoom_x,:zoom_y,:visible,:opacity,:src_rect,:x,:y
            def initialize(viewport=nil);@@creates+=1;@src_rect=Rect.new;@visible=true;@bitmap=nil;end
            def disposed?;false;end
            def dispose;end
          end
          class Sprite_Character
            attr_accessor :opacity
            def update;end
          end
          View=Struct.new(:rect)
          GameMap=Struct.new(:map_id,:display_x,:display_y)
          GamePlayer=Struct.new(:x,:y)
          $game_map=GameMap.new(47,22800,15600)
          $game_player=GamePlayer.new(187,130)
          class Spriteset_Map
            def initialize
              @viewport2=View.new(Rect.new(800,600))
              @slti_floor=47;@slti_cols=12;@slti_rows=8;@slti_chunks={}
              @slti_r60_floor_ready=false
              update
            end
            def update;slti_update_terrain;end
            def slti_update_terrain;end
            def dispose
              @slti_chunks.each_value do |sp|
                if sp.bitmap then sp.bitmap.dispose end
                sp.dispose
              end
            end
          end
          load 'build/runtime_v241.rb'
          map=Spriteset_Map.new
          raise 'Original screenshot roof group wrong' unless SLNativeLayerV241.group_at(map.instance_variable_get(:@sl_v241_gid_bitmap),187,130)==2081
          raise 'Original roof box wrong' unless SLNativeLayerV241.box_for(2081)==[2936,2042,3068,2186]
          raise 'Lower/upper boundaries fail' unless SLNativeLayerV241.group_at(map.instance_variable_get(:@sl_v241_gid_bitmap),187,238)==0
          bitmaps=Bitmap.creates;sprites=Sprite.creates
          raise "Wrong image decode count #{bitmaps}" unless bitmaps==170
          raise "Wrong sprite count #{sprites}" unless sprites==209
          fade=map.instance_variable_get(:@sl_v241_pieces).select{|sp|sp.visible && sp.opacity==135}
          raise "Roof does not fade across boundary #{fade.length}" unless fade.length==2
          raise 'Missing native ground tiles' unless map.instance_variable_get(:@slti_chunks).length==96
          300.times do |i|
            $game_map.display_x=(i%100)*12
            $game_map.display_y=(i%80)*8
            $game_player.x=i%45+150
            $game_player.y=i%24+120
            map.update
          end
          raise 'Graphics decoded on movement' unless Bitmap.creates==bitmaps
          raise 'Unexpected one-pixel lookup count' if Bitmap.reads>315
          raise 'Sprites allocated on movement' unless Sprite.creates==sprites
          $game_map.display_x=22800;$game_map.display_y=15600
          $game_player.x=187;$game_player.y=130
          map.update
          raise 'Roof did not fade' unless map.instance_variable_get(:@sl_v241_pieces).count{|sp|sp.visible&&sp.opacity==135}==2
          $game_player.x=0;$game_player.y=0
          map.update
          raise 'Roof still faded outside original Layer5' if map.instance_variable_get(:@sl_v241_pieces).any?(&:visible)
          raise 'Foreground vanished entirely' if map.instance_variable_get(:@sl_v241_upper).values.none?(&:visible)
          map.dispose
          puts 'PASS all native group IDs and house bounds'
          puts 'PASS predecode 170 bitmaps and 209 sprites (same startup order as V237)'
          puts 'PASS roof fades across two groups; restores full opacity outside group'
          puts 'PASS zero Bitmap/Sprite allocations over 300 frames; tile changes are the only group lookups'
          V241_TEST_RB
          node build/test_loader.js
          ruby build/test_runtime.rb

      - name: V241 Protect unchanged maps, NPCs and images
        shell: bash
        run: |
          set -euo pipefail
          cat > build/verify.py <<'V241_VERIFY_PY'
          from pathlib import Path
          import json,hashlib,struct,re
          import zlib,io
          root=Path('site');source=Path('source');build=Path('build')
          before=json.loads((build/'before.json').read_text('utf8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          allowed={'knight/gameasync/Data/Scripts.rxdata', 'knight/gameasync/mapping.js','knight/js/sl-assets-v229r115.js','index.html','knight/index.html'}
          new={'knight/assets/map-047-v241.pack','knight/gameasync/Graphics/Panoramas/SLTI_47_GID.png'}
          if set(after)-set(before)!=new or set(before)-set(after):raise ValueError('Original game file inventory changed unexpectedly')
          changed={name for name in before if before[name]!=after[name]}
          if changed!=allowed:raise ValueError('Unexpected changes: '+repr(sorted(changed^allowed)))
          if len(after)!=5603:raise ValueError('Wrong final file count')
          prefix='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          for n in (45,46):
           if prefix+f'Map{n:03d}.rxdata' in after:raise ValueError('Deleted dungeon returned')
          for name in [prefix+'Map047.rxdata','knight/assets/map-047-v234.pack','knight/gameasync/Graphics/Panoramas/SLTI_47_C7_4.png']:
           if after[name]!=before[name]:raise ValueError('Protected original file changed '+name)
          for x in range(12):
           for y in range(8):
            for p in ('SLTI_47_C','SLTI_47_L4_C'):
             name=f'knight/gameasync/Graphics/Panoramas/{p}{x}_{y}.png'
             if before[name]!=after[name]:raise ValueError('Original layer graphics were modified '+name)
          content=(root/'knight/assets/map-047-v241.pack').read_bytes();lenhead=struct.unpack_from('<I',content)[0]
          rows=json.loads(content[4:4+lenhead])['files'];base=content[4+lenhead:]
          if len(rows)!=194 or len(set(r[0] for r in rows))!=194:raise ValueError('Wrong Map047 194-image pack')
          for key,off,size in rows:
           if len(base[off:off+size])!=size:raise ValueError('Invalid pack range '+key)
           if not base[off:off+8]==b'\x89PNG\r\n\x1a\n':raise ValueError('Invalid native PNG '+key)
          loader=(root/'knight/js/sl-assets-v229r115.js').read_text('utf8')
          if 'head.files.length!==194' not in loader or 'if(done!==194)' not in loader or 'map47FilesReady=true' not in loader:
           raise ValueError('Map047 pre-entry loading not gated on full 194 assets')
          code=(build/'runtime_v241.rb').read_text('utf8')
          if len(code)>=66000 or 'GROUP_HEX=' in code or 'Zlib::' in code:raise ValueError('Old V238 heavy startup code retained')
          if 'FADE_ALPHA=135' not in code or "SLTI_47_GID" not in code:
           raise ValueError('Native object fade is missing')
          for name in ('def sl_v241_refresh','def sl_v241_show_piece'):
           section=code.split(name,1)[1].split('\n  def ',1)[0]
           if any(p in section for p in ('Bitmap.new','Sprite.new','RPG::Cache','bitmap.dispose','loadFileAsync')):
            raise ValueError('Graphics allocations found on movement: '+name)
          # Pure-stdlib PNG decoder for the original 512px test area (no pip or network).
          def png_decode(blob):
           if not blob.startswith(b'\x89PNG\r\n\x1a\n'):raise ValueError('Not PNG')
           pos=8; compressed=[];width=height=depth=kind=None
           while pos<len(blob):
            length=struct.unpack_from('>I',blob,pos)[0];tag=blob[pos+4:pos+8]
            chunk=blob[pos+8:pos+8+length];crc=struct.unpack_from('>I',blob,pos+8+length)[0]
            if zlib.crc32(tag+chunk)&0xffffffff!=crc:raise ValueError('PNG CRC mismatch')
            pos+=12+length
            if tag==b'IHDR':width,height,depth,kind,_,_,_=struct.unpack('>IIBBBBB',chunk)
            elif tag==b'IDAT':compressed.append(chunk)
            elif tag==b'IEND':break
           if (width,height,depth) not in ((512,512,8),(363,238,8)) or kind not in (2,6):
            raise ValueError('Unexpected native PNG structure')
           bpp=4 if kind==6 else 3;stride=width*bpp
           raw=zlib.decompress(b''.join(compressed));out=bytearray(height*stride)
           if len(raw)!=height*(stride+1):raise ValueError('Wrong PNG raster length')
           for y in range(height):
            start=y*(stride+1); f=raw[start];current=bytearray(raw[start+1:start+1+stride])
            previous=out[(y-1)*stride:y*stride] if y else bytes(stride)
            if f not in range(5):raise ValueError('Unexpected PNG filter')
            for j in range(stride):
             left=current[j-bpp] if j>=bpp else 0
             up=previous[j]
             ul=previous[j-bpp] if j>=bpp else 0
             if f==1:delta=left
             elif f==2:delta=up
             elif f==3:delta=(left+up)//2
             elif f==4:
              p=left+up-ul;a=abs(p-left);b=abs(p-up);c=abs(p-ul)
              delta=left if a<=b and a<=c else (up if b<=c else ul)
             else:delta=0
             current[j]=(current[j]+delta)&255
            out[y*stride:(y+1)*stride]=current
           return width,height,bpp,out

          pack=(root/'knight/assets/map-047-v241.pack').read_bytes()
          nh=struct.unpack_from('<I',pack)[0];payload=pack[4+nh:]
          row=next(a for a in rows if a[0]=='graphics/panoramas/slti_47_c5_4')
          w,h,c,ground=png_decode(payload[row[1]:row[1]+row[2]])
          w2,h2,c2,upper=png_decode((root/'knight/gameasync/Graphics/Panoramas/SLTI_47_L4_C5_4.png').read_bytes())
          w3,h3,c3,old=png_decode((root/'knight/gameasync/Graphics/Panoramas/SLTI_47_C5_4.png').read_bytes())
          if (w,h,c,w2,h2,c2,w3,h3,c3)!=(512,512,3,512,512,4,512,512,3):
           raise ValueError('Unexpected original house image dimensions/color')
          error=0
          for pixel in range(w*h):
           i=pixel*3;j=pixel*4
           alpha=upper[j+3]
           for channel in range(3):
            mixed=(upper[j+channel]*alpha+ground[i+channel]*(255-alpha)+127)//255
            error+=abs(mixed-old[i+channel])
          mae=error/(w*h*3)
          if mae>=25:raise ValueError('Original Layer1+2 ground did not align with Layer4 house, MAE '+str(mae))

          _,_,gid_bpp,gid_pixels=png_decode((root/'knight/gameasync/Graphics/Panoramas/SLTI_47_GID.png').read_bytes())
          if gid_bpp!=3:raise ValueError('Original group PNG must be RGB')
          idx=(130*363+187)*3;group=gid_pixels[idx]+gid_pixels[idx+1]*256
          if group!=2081:raise ValueError('Photographed roof not mapped into native S32 group atlas')
          print(f'PASS original 5601 game files retained (only five expected script/cache/version files modified)')
          print('PASS exactly 194 preinstalled images (not V238 289); native pixel grouping ID image')
          print(f'PASS original house raster alignment MAE {mae:.2f}, group ID {group}, fade 135/255')
          print('PASS zero image/network/sprite allocations inside movement renderer')
          print('PASS all original NPCs, movement map/collision, assets, dungeon removal and all other maps preserved')
          V241_VERIFY_PY
          python3 build/verify.py

