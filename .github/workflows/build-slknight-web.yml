name: build-slknight-web.yml | V4.17 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Resolve final V4.16 deployment
        id: baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BASE_SHA=9cab02b37866199fa1236481d1beb380ea3eccfb

          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/build-slknight-web.yml/runs" \
            -f head_sha="$BASE_SHA" \
            -f status=success \
            -f per_page=100 \
            > /tmp/sl417-runs.json

          RUN_ID=$(jq -er \
            --arg sha "$BASE_SHA" \
            '[.workflow_runs[]
              | select(
                  .head_sha==$sha
                  and .head_branch=="main"
                  and .status=="completed"
                  and .conclusion=="success"
                )]
              | sort_by(.created_at)
              | last
              | .id // empty' \
            /tmp/sl417-runs.json)

          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" \
            > /tmp/sl417-jobs.json

          jq -e \
            '[.jobs[]
              | select(
                  .name=="deploy"
                  and .conclusion=="success"
                )]
              | length==1' \
            /tmp/sl417-jobs.json

          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            > /tmp/sl417-artifacts.json

          jq -e \
            '[.artifacts[]
              | select(
                  .name=="github-pages"
                  and .expired==false
                  and .size_in_bytes>0
                )]
              | length==1' \
            /tmp/sl417-artifacts.json

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Restore final V4.16 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: ${{ steps.baseline.outputs.run_id }}
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Restore verified V4.17 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SOURCE_SHA=e2c435b252ae9b2ab0e69847bc03516af4fdbcb6
          BLOB_SHA=efedca31f383468662c111a88296b2b2437f6702

          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/contents/.github/workflows/build-slknight-web.yml" \
            -f ref="$SOURCE_SHA" \
            --jq '.content' \
            | base64 --decode \
            > /tmp/sl417-previous.yml

          test "$(git hash-object /tmp/sl417-previous.yml)" = "$BLOB_SHA"

          python3 - <<'PYTHON'
          from pathlib import Path

          src=Path('/tmp/sl417-previous.yml').read_text('utf8')

          def body(name):
              marker=(
                  '      - name: '+name+'\n'
                  '        shell: bash\n'
                  '        run: |\n'
              )

              assert src.count(marker)==1,name

              lines=src.split(marker,1)[1].split('\n')
              out=[]

              for line in lines:
                  if line.startswith('          '):
                      out.append(line[10:])
                  elif line=='':
                      out.append(line)
                  else:
                      break

              return '\n'.join(out)+'\n'

          def heredoc(source,path,tag):
              marker=f"cat > {path} <<'{tag}'\n"
              end='\n'+tag+'\n'

              assert source.count(marker)==1,path

              text=source.split(marker,1)[1]

              assert text.count(end)==1,path

              return text.split(end,1)[0]+'\n'

          patch=heredoc(
              body('Rebuild single native character creation'),
              '/tmp/sl417-patch.rb',
              'RUBY'
          )

          test=heredoc(
              body('Verify all 22 character creation paths'),
              '/tmp/sl417-test.rb',
              'RUBY'
          )

          assert patch.count(
              'edit.call(94) do |s|\n'
          )==1

          assert patch.count(
              "File.write(\n  '/tmp/sl417-ui.json',"
          )==1

          Path('/tmp/sl417-patch-original.rb').write_text(
              patch,'utf8'
          )

          Path('/tmp/sl417-test-original.rb').write_text(
              test,'utf8'
          )

          scripts={
              '/tmp/sl417-verify-original.sh':
                  'Verify original game',
              '/tmp/sl417-mapping.sh':
                  'Update V4.17 data references',
              '/tmp/sl417-scope.sh':
                  'Verify exact modification scope'
          }

          for path,name in scripts.items():
              Path(path).write_text(
                  body(name),'utf8'
              )

          bridge=body(
              'Connect keyboard input to creation scene'
          )

          assert bridge.count('\nJAVASCRIPT\n')==1

          Path('/tmp/sl417-install-name.sh').write_text(
              bridge.split('\nJAVASCRIPT\n',1)[1],
              'utf8'
          )

          print('PASS pinned V4.17 source')
          print('PASS original non-UI code retained')
          PYTHON

      - name: Verify original game
        shell: bash
        run: |
          set -euo pipefail

          bash -euo pipefail \
            /tmp/sl417-verify-original.sh

      - name: Rebuild name-first creation screen
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl417-scene-edit.rb <<'EDIT'
          edit.call(94) do |s|
            s=one(
              s,
              'class Scene_Name',
              "class Scene_Name\n  SL417_PROFILES = #{profiles.inspect}\n  SL417_RESERVED = #{reserved.inspect}"
            )

            s=one(
              s,
              '    @actor = $game_actors[$game_temp.name_actor_id]',
              <<~'SRC'.lines.map{|l|'    '+l}.join.chomp
          @actor = $game_actors[$game_temp.name_actor_id]

          @sl417_create = $game_map.map_id==7 && @actor.id==1

          if @sl417_create

            @sl417_phase=:failed
            @sl417_windows=[]

            begin

              @sl417_col=0
              @sl417_row=0

              SL417_PROFILES.each_with_index do |col,i|

                labels=col.map do |p|

                  kind=p[3].dup

                  kind += '법사' if p[0].end_with?('법사')
                  kind += '다엘' if p[0].end_with?('다엘')

                  kind
                end

                w=Window_Command.new(320,labels)

                @sl417_windows << w

                w.x=80+i*320
                w.y=112
                w.opacity=0
                w.back_opacity=0
                w.contents_opacity=255

                w.active=false
                w.index=-1

                w.contents.font.name='NanumGothic'
                w.contents.font.size=24

                w.refresh
                w.cursor_rect.empty
              end

              @sl417_header=Window_Help.new

              @sl417_header.x=80
              @sl417_header.y=64
              @sl417_header.opacity=0
              @sl417_header.back_opacity=0
              @sl417_header.contents_opacity=255

              @sl417_header.contents.font.name='NanumGothic'
              @sl417_header.contents.font.size=24
              @sl417_header.contents.font.color=@sl417_header.normal_color

              @sl417_header.contents.draw_text(
                4,0,300,32,'남자'
              )

              @sl417_header.contents.draw_text(
                324,0,280,32,'여자'
              )

              @sl417_name_display=Window_Help.new

              @sl417_name_display.x=80
              @sl417_name_display.y=8
              @sl417_name_display.opacity=0
              @sl417_name_display.back_opacity=0
              @sl417_name_display.contents_opacity=255

              @sl417_name_display.contents.font.name='NanumGothic'
              @sl417_name_display.contents.font.size=24

              @sl417_name_display.visible=false

              @sl417_decision=Window_Help.new

              @sl417_decision.x=80
              @sl417_decision.y=496
              @sl417_decision.opacity=0
              @sl417_decision.back_opacity=0
              @sl417_decision.contents_opacity=255

              @sl417_decision.contents.font.name='NanumGothic'
              @sl417_decision.contents.font.size=24

              @sl417_decision.set_text('결정',1)

              File.open('SL417Name.tmp','wb'){
                |f|f.write("0\n")
              }

              Graphics.transition

              @sl417_phase=:name

              puts([
                'SL417|NAME',
                80,0,640,80,
                $game_temp.name_max_char,
                File.expand_path('SL417Name.tmp')
              ].join('|'))

            rescue Exception=>e

              puts(
                'SL417|FAIL|OPEN|'+
                e.class.to_s+'|'+e.message.to_s
              )

              puts(
                'SLRUNTIMEERR|'+
                e.class.to_s+'|'+e.message.to_s
              )
            end

            return
          end
          SRC
            )

            s=one(
              s,
              '    @edit_window.dispose',
              <<~'SRC'.lines.map{|l|'    '+l}.join.chomp
          if @sl417_create

            @sl417_windows.each{|w|w.dispose}

            [
              @sl417_header,
              @sl417_name_display,
              @sl417_decision
            ].compact.each{|w|w.dispose}

            puts('SL417|NAME_CLOSE')

            return
          end

          @edit_window.dispose
          SRC
            )

            one(
              s,
              '    @edit_window.update',
              <<~'SRC'.lines.map{|l|'    '+l}.join.chomp
          if @sl417_create

            stage='INPUT'

            begin

              case @sl417_phase

              when :name

                return unless File.exist?('SL417Name.tmp')

                raw=File.open('SL417Name.tmp','rb'){
                  |f|f.read
                }

                flag,name=raw.split("\n",2)

                return unless flag=='1'

                name=(name||'').force_encoding('UTF-8')

                File.open('SL417Name.tmp','wb'){
                  |f|f.write("0\n"+name)
                }

                if !name.valid_encoding? ||
                   name.strip.empty? ||
                   name.split(//).size>$game_temp.name_max_char ||
                   name =~ /[\x00-\x1f\x7f\\]/ ||
                   SL417_RESERVED.include?(name.strip)

                  $game_system.se_play(
                    $data_system.buzzer_se
                  )

                  puts('SL417|NAME_RETRY')

                  return
                end

                @sl417_name=name.strip

                @sl417_name_display.set_text(
                  '이름 : '+@sl417_name,
                  1
                )

                @sl417_name_display.visible=true

                @sl417_windows[0].draw_item(
                  0,
                  @sl417_windows[0].text_color(6)
                )

                @sl417_phase=:select

                puts('SL417|NAME_READY')

                $game_system.se_play(
                  $data_system.decision_se
                )

                return

              when :select

                col=@sl417_col
                row=@sl417_row

                if Input.repeat?(Input::LEFT)

                  col=0

                elsif Input.repeat?(Input::RIGHT)

                  col=1

                elsif Input.repeat?(Input::UP)

                  row=[row-1,0].max

                elsif Input.repeat?(Input::DOWN)

                  if row==10 && Input.trigger?(Input::DOWN)

                    @sl417_phase=:confirm

                  else

                    row=[row+1,10].min
                  end
                end

                if col!=@sl417_col || row!=@sl417_row

                  w=@sl417_windows[@sl417_col]

                  w.draw_item(
                    @sl417_row,
                    w.normal_color
                  )

                  @sl417_col,@sl417_row=col,row

                  w=@sl417_windows[col]

                  w.draw_item(
                    row,
                    w.text_color(6)
                  )

                  $game_system.se_play(
                    $data_system.cursor_se
                  )
                end

                @sl417_phase=:confirm if Input.trigger?(Input::C)

                if @sl417_phase==:confirm

                  b=@sl417_decision.contents

                  b.clear

                  b.font.color=@sl417_decision.text_color(6)

                  b.draw_text(
                    4,0,b.width-8,32,'결정',1
                  )

                  $game_system.se_play(
                    $data_system.cursor_se
                  )
                end

                return

              when :confirm

                if Input.trigger?(Input::UP) ||
                   Input.trigger?(Input::B)

                  b=@sl417_decision.contents

                  b.clear

                  b.font.color=@sl417_decision.normal_color

                  b.draw_text(
                    4,0,b.width-8,32,'결정',1
                  )

                  @sl417_phase=:select

                  $game_system.se_play(
                    $data_system.cursor_se
                  )

                  return
                end

                return unless Input.trigger?(Input::C)

              else

                return
              end

              @sl417_phase=:processing

              stage='PROFILE'

              form,graphic,template,kind,stats,sex=
                SL417_PROFILES[@sl417_col][@sl417_row]

              @actor.instance_variable_set(
                :@sl43_form,form
              )

              @actor.instance_variable_set(
                :@sl43_type,kind
              )

              @actor.instance_variable_set(
                :@sl43_stats,stats.dup
              )

              @actor.instance_variable_set(
                :@sl417_base_graphic,graphic
              )

              @actor.instance_variable_set(
                :@class_id,
                $data_actors[template].class_id
              )

              @actor.set_graphic(
                graphic,
                0,
                @actor.battler_name,
                @actor.battler_hue
              )

              @actor.name=@sl417_name

              [425,469,426,962,966,968].each_with_index do |v,i|

                $game_variables[v]=stats[i]
              end

              $game_variables[48]=sex

              $game_switches[70]=(kind=='힘기사')

              stage='GROWTH'

              @actor.sl44_record_growth

              stage='EQUIPMENT'

              SL411.starter(@actor,true)

              expected=form.end_with?('기사') ? 170 :
                (
                  form.end_with?('요정') ? 1000 :
                  (
                    form.end_with?('법사') ? 1001 : 1002
                  )
                )

              raise 'Starter weapon not equipped' unless
                @actor.weapon_id==expected

              @sl417_phase=:done

              $game_system.se_play(
                $data_system.decision_se
              )

              $scene=Scene_Map.new

            rescue Exception=>e

              @sl417_phase=:failed

              puts(
                'SL417|FAIL|'+stage+'|'+
                e.class.to_s+'|'+e.message.to_s
              )

              puts(
                'SLRUNTIMEERR|'+
                e.class.to_s+'|'+e.message.to_s
              )
            end

            return
          end

          @edit_window.update
          SRC
            )
          end
          EDIT

          python3 - <<'PYTHON'
          from pathlib import Path

          source=Path(
              '/tmp/sl417-patch-original.rb'
          ).read_text('utf8')

          replacement=Path(
              '/tmp/sl417-scene-edit.rb'
          ).read_text('utf8')

          start='edit.call(94) do |s|\n'

          end="File.write(\n  '/tmp/sl417-ui.json',"

          assert source.count(start)==1
          assert source.count(end)==1

          a=source.index(start)
          b=source.index(end,a)

          updated=(
              source[:a]+
              replacement.rstrip()+
              '\n\n'+
              source[b:]
          )

          assert updated[:a]==source[:a]

          assert updated.endswith(source[b:])

          assert updated.count(
              'edit.call(94) do |s|'
          )==1

          assert 'SL417|NAME_READY' in updated

          assert 'p[0][0,1]' not in updated

          assert 'w.cursor_rect.empty' in updated

          Path('/tmp/sl417-patch.rb').write_text(
              updated,'utf8'
          )

          print('PASS only creation scene replaced')
          PYTHON

          ruby -c /tmp/sl417-patch.rb

          ruby /tmp/sl417-patch.rb \
            site/knight/gameasync/Data

      - name: Verify all 22 name-first creation paths
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl417-test-input.rb <<'RUBY'
                  raise 'Name open' unless
                    File.binread('SL417Name.tmp')=="0\n"

                  raise 'Initial phase' unless
                    s.instance_variable_get(
                      :@sl417_phase
                    )==:name

                  raise 'Decorative cursor' unless
                    windows.all?{
                      |w|
                      w.index==-1 &&
                      w.cursor_rect.width==0 &&
                      w.cursor_rect.height==0 &&
                      w.contents.font.size==24
                    }

                  decision=s.instance_variable_get(
                    :@sl417_decision
                  )

                  raise 'Bottom decision' unless
                    decision.y==496 &&
                    decision.opacity==0

                  initial_name=a.name.dup

                  Input.key=Input::DOWN
                  s.update
                  Input.key=nil

                  Input.key=Input::C
                  s.update
                  Input.key=nil

                  raise 'Name-first order' unless
                    s.instance_variable_get(
                      :@sl417_row
                    )==0 &&
                    s.instance_variable_get(
                      :@sl417_phase
                    )==:name &&
                    $scene.equal?(s)

                  File.binwrite(
                    'SL417Name.tmp',
                    "0\n시험#{n}"
                  )

                  s.update

                  raise 'Draft committed' unless
                    $scene.equal?(s) &&
                    a.name==initial_name

                  File.binwrite(
                    'SL417Name.tmp',
                    "1\n운영자"
                  )

                  s.update

                  raise 'Reserved name accepted' unless
                    s.instance_variable_get(
                      :@sl417_phase
                    )==:name &&
                    a.name==initial_name

                  File.binwrite(
                    'SL417Name.tmp',
                    "1\n시험#{n}"
                  )

                  s.update

                  raise 'Enter created character' unless
                    $scene.equal?(s) &&
                    a.name==initial_name &&
                    s.instance_variable_get(
                      :@sl417_phase
                    )==:select

                  File.unlink('SL417Name.tmp')

                  if i==1

                    Input.key=Input::RIGHT
                    s.update
                    Input.key=nil
                  end

                  j.times do

                    Input.key=Input::DOWN
                    s.update
                    Input.key=nil
                  end

                  raise 'Direction selection' unless
                    s.instance_variable_get(
                      :@sl417_col
                    )==i &&
                    s.instance_variable_get(
                      :@sl417_row
                    )==j

                  Input.key=Input::C
                  s.update
                  Input.key=nil

                  raise 'Premature creation' unless
                    $scene.equal?(s) &&
                    a.name==initial_name &&
                    s.instance_variable_get(
                      :@sl417_phase
                    )==:confirm

                  Input.key=Input::UP
                  s.update
                  Input.key=nil

                  raise 'Return to selected character' unless
                    s.instance_variable_get(
                      :@sl417_phase
                    )==:select &&
                    s.instance_variable_get(
                      :@sl417_col
                    )==i &&
                    s.instance_variable_get(
                      :@sl417_row
                    )==j

                  Input.key=Input::C
                  s.update
                  Input.key=nil

                  raise 'Decision focus' unless
                    s.instance_variable_get(
                      :@sl417_phase
                    )==:confirm

                  Input.key=Input::C
                  s.update
                  Input.key=nil

          RUBY

          python3 - <<'PYTHON'
          from pathlib import Path
          import textwrap

          source=Path(
              '/tmp/sl417-test-original.rb'
          ).read_text('utf8')

          replacement=Path(
              '/tmp/sl417-test-input.rb'
          ).read_text('utf8')

          start="        raise 'Name open' unless"

          end="        raise 'Scene transition' unless"

          assert source.count(start)==1
          assert source.count(end)==1

          a=source.index(start)
          b=source.index(end,a)

          replacement=textwrap.indent(
              textwrap.dedent(replacement).rstrip(),
              '        '
          )

          updated=(
              source[:a]+
              replacement+
              '\n\n'+
              source[b:]
          )

          assert updated[:a]==source[:a]

          assert updated.endswith(source[b:])

          Path('/tmp/sl417-test.rb').write_text(
              updated,'utf8'
          )

          print('PASS updated name-first tests')
          PYTHON

          ruby -c /tmp/sl417-test.rb

          ruby /tmp/sl417-test.rb \
            site/knight/gameasync

      - name: Connect name input and restore game keyboard
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl417-name.js <<'JAVASCRIPT'
          (function(){
            'use strict';

            const ui=SL417_UI;

            let form=null;
            let field=null;
            let status=null;
            let file=null;
            let rect=null;

            let composing=false;
            let submitted=false;

            function layout(){

              if(!form)return;

              const c=document.getElementById(
                'canvas'
              ).getBoundingClientRect();

              const [x,y,w,h]=rect;

              const sx=c.width/800;
              const sy=c.height/600;

              Object.assign(form.style,{

                left:(c.left+x*sx)+'px',

                top:(c.top+y*sy)+'px',

                width:(w*sx)+'px',

                height:(h*sy)+'px',

                fontSize:Math.max(12,24*sy)+'px'
              });

              field.style.fontSize=
                Math.max(16,24*sy)+'px';
            }

            function write(flag){

              if(
                !field ||
                !file ||
                submitted ||
                (composing&&flag!=='2')
              )return;

              try{

                const raw=flag+'\n'+field.value;

                FS.writeFile(
                  file,
                  new TextEncoder().encode(raw)
                );

                if(
                  FS.readFile(
                    file,
                    {encoding:'utf8'}
                  )!==raw
                ){
                  throw Error('Name write mismatch');
                }

                submitted=flag==='1';

                status.textContent='';

              }catch(e){

                status.textContent=String(
                  e.message
                );
              }
            }

            function close(){

              if(!form)return;

              field.blur();

              form.remove();

              try{

                if(
                  file &&
                  FS.analyzePath(file).exists
                ){
                  FS.unlink(file);
                }

              }catch(e){

                console.error(e);
              }

              form=field=status=file=rect=null;

              composing=submitted=false;

              document.getElementById(
                'canvas'
              ).focus({
                preventScroll:true
              });
            }

            function open(p){

              if(form)return;

              rect=p.slice(2,6).map(Number);

              file=p.slice(7).join('|');

              if(
                rect.some(v=>!Number.isFinite(v)) ||
                !file ||
                FS.readFile(
                  file,
                  {encoding:'utf8'}
                )!=='0\n'
              ){
                throw Error(
                  'Name input initialization'
                );
              }

              form=document.createElement('form');

              form.id='sl417-name-form';

              const label=document.createElement(
                'label'
              );

              label.htmlFor='sl417-name';

              label.textContent=ui.prompt;

              field=document.createElement('input');

              field.id='sl417-name';

              field.type='text';

              field.inputMode='text';

              field.enterKeyHint='done';

              field.maxLength=Number(p[6]);

              field.autocomplete='off';

              field.spellcheck=false;

              field.setAttribute(
                'autocapitalize',
                'off'
              );

              field.setAttribute(
                'aria-label',
                ui.prompt
              );

              field.placeholder='이름 입력 후 Enter';

              status=document.createElement('div');

              status.setAttribute(
                'role',
                'status'
              );

              status.style.cssText=
                'color:#ffff80;';

              form.style.cssText=
                'position:fixed;'+
                'z-index:2147483647;'+
                'margin:0;padding:0;border:0;'+
                'background:transparent;'+
                'color:white;'+
                'font-family:SL417Nanum,sans-serif;'+
                'display:flex;'+
                'flex-direction:column;'+
                'justify-content:center;'+
                'gap:1px;'+
                'pointer-events:none;'+
                'box-sizing:border-box;'+
                'text-align:center;'+
                'line-height:1.1;';

              field.style.cssText=
                'display:block;'+
                'width:100%;height:32px;'+
                'min-height:24px;'+
                'box-sizing:border-box;'+
                'border:0;'+
                'border-radius:0;'+
                'background:transparent;'+
                'color:white;'+
                'caret-color:white;'+
                'outline:0;'+
                'text-align:center;'+
                'font-family:inherit;'+
                'padding:0 4px;'+
                'pointer-events:auto;'+
                'user-select:text;'+
                '-webkit-user-select:text;'+
                'touch-action:manipulation;';

              form.append(
                label,
                field,
                status
              );

              document.getElementById(
                'main'
              ).append(form);

              field.addEventListener(
                'input',
                ()=>{
                  if(!composing)write('0');
                }
              );

              field.addEventListener(
                'compositionstart',
                ()=>{

                  composing=true;

                  write('2');
                }
              );

              field.addEventListener(
                'compositionend',
                ()=>{

                  composing=false;

                  write('0');
                }
              );

              form.addEventListener(
                'submit',
                e=>{

                  e.preventDefault();

                  write('1');
                }
              );

              [
                'pointerdown',
                'pointerup',
                'mousedown',
                'mouseup',
                'click',
                'touchstart',
                'touchend'
              ].forEach(t=>{

                field.addEventListener(
                  t,
                  e=>e.stopPropagation()
                );
              });

              layout();

              field.focus({
                preventScroll:true
              });
            }

            [
              'keydown',
              'keyup',
              'keypress'
            ].forEach(t=>{

              window.addEventListener(t,e=>{

                if(
                  !field ||
                  e.target!==field
                )return;

                if(
                  t==='keydown' &&
                  e.key==='Enter' &&
                  !composing &&
                  !e.isComposing &&
                  e.keyCode!==229
                ){

                  e.preventDefault();

                  write('1');
                }

                e.stopImmediatePropagation();

              },true);
            });

            const resize=
              ()=>requestAnimationFrame(layout);

            window.addEventListener(
              'resize',
              resize
            );

            document.addEventListener(
              'fullscreenchange',
              resize
            );

            if(window.visualViewport){

              visualViewport.addEventListener(
                'resize',
                resize
              );

              visualViewport.addEventListener(
                'scroll',
                resize
              );
            }

            window.sl417NameMessage=function(text){

              const s=String(text).trim();

              try{

                if(s.startsWith('SL417|NAME|')){

                  open(s.split('|'));

                }else if(
                  s==='SL417|NAME_READY' ||
                  s==='SL417|NAME_CLOSE'
                ){

                  close();

                }else if(
                  s==='SL417|NAME_RETRY' &&
                  field
                ){

                  submitted=false;

                  status.textContent=ui.error;

                  field.focus({
                    preventScroll:true
                  });

                }else if(
                  s.startsWith('SL417|FAIL|')
                ){

                  const m=s.split('|').slice(2).join(' | ');

                  if(status){

                    status.textContent=m;

                  }else{

                    console.error(m);
                  }
                }

              }catch(e){

                if(status){

                  status.textContent=String(
                    e.message
                  );
                }

                console.error(
                  'SL417_NAME',
                  e
                );
              }
            };
          })();
          JAVASCRIPT

          node --check /tmp/sl417-name.js

          bash -euo pipefail \
            /tmp/sl417-install-name.sh

      - name: Update V4.17 data references
        shell: bash
        run: |
          set -euo pipefail

          bash -euo pipefail \
            /tmp/sl417-mapping.sh

      - name: Verify exact modification scope
        shell: bash
        run: |
          set -euo pipefail

          bash -euo pipefail \
            /tmp/sl417-scope.sh

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          import json

          root=Path('site')

          before=json.loads(
              Path(
                  '/tmp/sl417-before.json'
              ).read_text('utf8')
          )

          protected=[
              'knight/js/dpad.js',
              'knight/js/drive.js',
              'knight/mkxp.js',
              'knight/mkxp.wasm',
              'knight/gameasync/bitmap-map.js'
          ]

          for name in protected:

              assert name in before,name

              digest=hashlib.sha256(
                  (root/name).read_bytes()
              ).hexdigest()

              assert digest==before[name],name

          html=(
              root/'knight/index.html'
          ).read_text('utf8')

          assert 'SL417|NAME_READY' in html

          assert "field.blur()" in html

          assert 'form.remove()' in html

          js=Path(
              '/tmp/sl417-name.js'
          ).read_text('utf8')

          assert 'simulateKeyEvent' not in js

          assert "document.createElement('button')" not in js

          assert "document.createElement('dialog')" not in js

          assert "getElementById('sl-pad')" not in js

          assert 'border-bottom:' not in js

          print('PASS original direction controls unchanged')
          print('PASS original ATK and cancel controls unchanged')
          print('PASS keyboard released after name entry')
          print('PASS no decorative input border')
          print('PASS original engine unchanged')
          print('PASS V4.17')
          PYTHON

      - name: Upload V4.17
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

