          .sl-skill-key{position:absolute;left:3px;top:1px;font:800 10px sans-serif}
          .sl-skill-slot.default .sl-skill-key{position:static;font-size:15px}
          .sl-skill-cost{position:absolute;right:2px;bottom:1px;font:800 9px sans-serif}
          .sl-skill-slot.zero{filter:grayscale(1);opacity:.65}
          .sl-skill-slot.pressed{transform:scale(.93);border-color:rgba(255,255,255,.95)}
          #sl-skillbar.assign .sl-skill-slot{border-color:rgba(255,226,108,.85)}
          .sl-skill-slot.okflash{box-shadow:0 0 12px rgba(145,255,174,.95);border-color:#91ffae}
          .sl-skill-slot.failflash{box-shadow:0 0 12px rgba(255,123,123,.95);border-color:#ff7b7b}'''
          replace_once(old,new,'skill slot CSS')
          old="  const slSkill=button(zone,'sl-skill','기술',75,'sl-btn',true);\n  slSkill.title='기술창 열기';slSkill.setAttribute('aria-label','기술창 열기');"
          new="  const skillbar=document.createElement('div');skillbar.id='sl-skillbar';zone.appendChild(skillbar);\n  for(let i=0;i<6;i++)skillButton(skillbar,i);"
