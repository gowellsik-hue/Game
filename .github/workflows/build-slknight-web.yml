
      - name: V3.1 add 6 separately summoned Fairy companions using native healer follow routes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/v31/source build/v31/raw build/v31/elf/gameasync
          python3 - <<'V31_SNAPSHOT'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          Path('build/v31/before.json').write_text(json.dumps(before,sort_keys=True),'utf8')
          V31_SNAPSHOT
          curl -L --fail --retry 4 --retry-delay 3 -o build/v31/source.zip 'https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLFairy_Source_v1.zip'
          echo '67b88b5fe0cde3c9f2fada889815f9aa7d0fc94b378025529e9950d55151c70e  build/v31/source.zip' | sha256sum -c -
          unzip -q build/v31/source.zip -d build/v31/source
          test -s build/v31/source/SLFairy_Win_241226.7z
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq p7zip-full
          fi
          7z x build/v31/source/SLFairy_Win_241226.7z '-phttp://nemo838.tistory.com/' -obuild/v31/raw -y > build/v31/unpack.log
          test -s build/v31/raw/Game.rgssad
          cat > build/v31/rgssad_extract.py <<'V31_RGSSAD_SOURCE'
          from pathlib import Path
          import struct,sys
          MASK=0xffffffff; KEY0=0xDEADCAFE
          def rot(k): return ((k*7)+3)&MASK
          src=Path(sys.argv[1]); out=Path(sys.argv[2]); out.mkdir(parents=True,exist_ok=True)
          with src.open('rb') as f:
              hdr=f.read(8)
              if hdr[:7]!=b'RGSSAD\0' or len(hdr)!=8 or hdr[7]!=1: raise SystemExit(f'unsupported RGSSAD header: {hdr!r}')
              key=KEY0; count=0
              while True:
                  raw=f.read(4)
                  if not raw: break
                  if len(raw)!=4: raise SystemExit('truncated filename length')
                  n=struct.unpack('<I',raw)[0]^key; key=rot(key)
                  if n>4096: raise SystemExit(f'bad filename length {n}')
                  name_b=bytearray(f.read(n))
                  if len(name_b)!=n: raise SystemExit('truncated filename')
                  for i in range(n): name_b[i]^=key&0xff; key=rot(key)
                  raw=f.read(4)
                  if len(raw)!=4: raise SystemExit('truncated file length')
                  size=struct.unpack('<I',raw)[0]^key; key=rot(key)
                  try: name=bytes(name_b).decode('cp949')
                  except UnicodeDecodeError: name=bytes(name_b).decode('utf-8','replace')
                  parts=[x for x in name.replace('\\','/').split('/') if x not in ('','.','..')]
                  if not parts: raise SystemExit('unsafe path')
                  target=out.joinpath(*parts); target.parent.mkdir(parents=True,exist_ok=True)
                  dk=key; ctr=0; remain=size
                  with target.open('wb') as w:
                      while remain:
                          chunk=bytearray(f.read(min(1<<20,remain)))
                          if not chunk: raise SystemExit(f'truncated data: {name}')
                          kb=dk.to_bytes(4,'little')
                          for i in range(len(chunk)):
                              chunk[i]^=kb[ctr]; ctr=(ctr+1)&3
                              if ctr==0: dk=rot(dk); kb=dk.to_bytes(4,'little')
                          w.write(chunk); remain-=len(chunk)
                  count+=1
          print('FAIRY_RGSSAD_EXTRACT_OK',count)
          V31_RGSSAD_SOURCE
          .venv/bin/python build/v31/rgssad_extract.py build/v31/raw/Game.rgssad build/v31/elf/gameasync
          cat > build/v31/companions.rb <<'V31_COMPANIONS_RUBY'
          require 'json'
          require 'digest'
          require 'zlib'
          require 'fileutils'

          module RPG
            %w[Actor Item AudioFile CommonEvent EventCommand Event MoveRoute MoveCommand Map].each do |n|
              const_set(n,Class.new) unless const_defined?(n,false)
            end
            Event.const_set(:Page,Class.new) unless Event.const_defined?(:Page,false)
            Event::Page.const_set(:Condition,Class.new) unless Event::Page.const_defined?(:Condition,false)
            Event::Page.const_set(:Graphic,Class.new) unless Event::Page.const_defined?(:Graphic,false)
          end
          %w[Table Tone Color].each do |n|
            Object.const_set(n,Class.new) unless Object.const_defined?(n)
            Object.const_get(n).define_singleton_method(:_load) do |raw|
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end
          end

          def check(ok,msg)
            raise msg unless ok
          end

          def utf(obj)
            obj.to_s.dup.force_encoding('UTF-8').scrub
          end

          def data_file(game,kind)
            files=Dir.glob(File.join(game,'gameasync/Data','*'+kind+'.rxdata')).select{|p| File.file?(p) && File.size(p)>10}
            check(files.size==1,"#{kind}: found #{files.size} candidate originals")
            files.first
          end

          def clone(obj)
            Marshal.load(Marshal.dump(obj))
          end

          def new_event_command(code,params)
            cmd=RPG::EventCommand.allocate
            cmd.instance_variable_set(:@code,code)
            cmd.instance_variable_set(:@parameters,params)
            cmd.instance_variable_set(:@indent,0)
            cmd
          end

          def rep(s,old,new,label)
            check(s.scan(old).size==1,"#{label}: expected one match, got #{s.scan(old).size}")
            s.sub(old,new)
          end

          def edit_script(scripts,name)
            matches=scripts.select{|r|r.is_a?(Array) && utf(r[1])==name}
            check(matches.size==1,"script #{name}: expected one, got #{matches.size}")
            row=matches.first
            original=Zlib::Inflate.inflate(row[2]); text=original.dup.force_encoding('UTF-8')
            check(text.valid_encoding?,"script #{name}: UTF8 invalid")
            crlf=text.include?("\r\n")
            updated=yield(text.gsub("\r\n","\n"))
            check(updated!=text.gsub("\r\n","\n"),"script #{name}: no changes")
            RubyVM::InstructionSequence.compile(updated)
            row[2]=Zlib::Deflate.deflate(crlf ? updated.gsub("\n","\r\n").b : updated.b)
          end

          knight=ARGV.fetch(0)
          fairy=ARGV.fetch(1)
          main=File.join(knight,'gameasync')
          donor=File.join(fairy,'gameasync')
          ORDER=['여요정','다크엘프','다크레인저','실버레인저','애로우 마스터','아크스카우터'].freeze
          ACTOR_IDS=(4..9).to_a.freeze
          ITEM_IDS=(1000..1005).to_a.freeze
          CE_IDS=(1061..1066).to_a.freeze
          SWITCH_IDS=(2001..2006).to_a.freeze

          actor_path=data_file(knight,'Actors')
          item_path=data_file(knight,'Items')
          ce_path=data_file(knight,'CommonEvents')
          script_path=data_file(knight,'Scripts')
          actors=Marshal.load(File.binread(actor_path))
          items=Marshal.load(File.binread(item_path))
          common=Marshal.load(File.binread(ce_path))
          scripts=Marshal.load(File.binread(script_path))
          check(actors.size==9 && items.size==1000 && common.size==1061,"incorrect baseline actor/item/CE counts: #{actors.size}/#{items.size}/#{common.size}")
          check(utf(actors[3].instance_variable_get(:@name))=='힐러 마법사','actor3 must be healer')
          check(utf(items[117].instance_variable_get(:@name)).include?('힐러 명령 주문서'),'item117 healer anchor differs')
          exp_scripts_before=scripts.filter_map do |row|
            next unless row.is_a?(Array) && row[2].is_a?(String)
            source=Zlib::Inflate.inflate(row[2])
            [row[1],source] if source.include?('SLV541')
          end
          SWITCH_IDS.each do |id|
            scripts.each do |row|
              next unless row.is_a?(Array) && row[2].is_a?(String)
              source=Zlib::Inflate.inflate(row[2])
              check(!source.match?(/\$game_switches\[\s*#{id}\s*\]/),"switch #{id} already in game script")
            end
          end

          ORDER.each do |name|
            source=File.join(donor,'Graphics/Characters',name+'.png')
            dest=File.join(main,'Graphics/Characters',name+'.png')
            check(File.size?(source),"source Fairy image missing: #{name}")
            if File.exist?(dest)
              check(Digest::SHA256.file(dest).hexdigest==Digest::SHA256.file(source).hexdigest,"native character differs: #{name}")
            else
              FileUtils.mkdir_p(File.dirname(dest))
              FileUtils.cp(source,dest)
            end
          end

          ORDER.each_with_index do |name,index|
            actor_id=ACTOR_IDS[index]
            actor=clone(actors[1])
            actor.instance_variable_set(:@id,actor_id)
            actor.instance_variable_set(:@name,name)
            actor.instance_variable_set(:@character_name,name)
            actor.instance_variable_set(:@character_hue,0)
            if actor_id<actors.size
              check(utf(actors[actor_id].instance_variable_get(:@name)).empty?,"actor id already used: #{actor_id}")
              actors[actor_id]=actor
            else
              check(actor_id==actors.size,"actor index gap #{actor_id}")
              actors << actor
            end

            item=clone(items[117])
            item.instance_variable_set(:@id,ITEM_IDS[index])
            item.instance_variable_set(:@name,' '+name)
            item.instance_variable_set(:@description,name+' 동료 소환 / 해제')
            item.instance_variable_set(:@common_event_id,CE_IDS[index])
            item.instance_variable_set(:@consumable,false)
            item.instance_variable_set(:@occasion,0)
            item.instance_variable_set(:@scope,0)
            check(items.size==ITEM_IDS[index],"item index gap #{ITEM_IDS[index]}")
            items << item

            ce=RPG::CommonEvent.allocate
            ce.instance_variable_set(:@id,CE_IDS[index])
            ce.instance_variable_set(:@name,'동료 '+name+' 소환/해제')
            ce.instance_variable_set(:@trigger,0)
            ce.instance_variable_set(:@switch_id,1)
            ruby="if $game_party.actors.include?($game_actors[#{actor_id}])\n" +
              "  $game_party.remove_actor(#{actor_id})\n" +
              "  $game_switches[#{SWITCH_IDS[index]}] = false\n" +
              "else\n" +
              "  $game_party.add_actor(#{actor_id})\n" +
              "  $game_switches[#{SWITCH_IDS[index]}] = $game_party.actors.include?($game_actors[#{actor_id}])\n" +
              "end\n" +
              '$game_map.need_refresh = true'
            RubyVM::InstructionSequence.compile(ruby)
            ce.instance_variable_set(:@list,[new_event_command(355,[ruby]),new_event_command(0,[])])
            check(common.size==CE_IDS[index],"CE index gap #{CE_IDS[index]}")
            common << ce
          end

          edit_script(scripts,'Game_Party') do |s|
            s=rep(s,'if @actors.size < 4 and not @actors.include?(actor)',
                     'if @actors.size < 8 and not @actors.include?(actor)','party capacity')
            s=rep(s,"    for i in $data_system.party_members\n      @actors.push($game_actors[i])\n    end\n  end",
              "    for i in $data_system.party_members\n      @actors.push($game_actors[i])\n    end\n    for id in 1000..1005\n      gain_item(id,1)\n    end\n  end",'start inventory')
            rep(s,"    @actors = new_actors\n  end",
              "    @actors = new_actors\n    for id in 1000..1005\n      gain_item(id,1) if item_number(id)==0\n    end\n    for id in 4..9\n      $game_switches[2001+id-4] = @actors.include?($game_actors[id])\n    end\n  end",'load inventory and party visibility')
          end

          ['Window_Item','★Window_Item2'].each do |name|
            edit_script(scripts,name) do |s|
              old="    for i in 1...$data_items.size\n      if $game_party.item_number(i) > 0\n        @data.push($data_items[i])\n      end\n    end"
              new="    for i in 1...$data_items.size\n      next if i >= 1000 && i <= 1005\n      if $game_party.item_number(i) > 0\n        @data.push($data_items[i])\n      end\n      if i == 117\n        for id in 1000..1005\n          @data.push($data_items[id]) if $game_party.item_number(id)>0\n        end\n      end\n    end"
              rep(s,old,new,name+' item ordering')
            end
          end

          map_files=Dir.glob(File.join(main,'Data','*Map???.rxdata')).select{|p| File.size(p)>10}.sort
          check(!map_files.empty?,'no native maps for companion follow')
          source_map=Marshal.load(File.binread(data_file(knight,'Map001')))
          source_healer=source_map.instance_variable_get(:@events).values.select do |event|
            utf(event.instance_variable_get(:@name))=='[ID힐러 마법사]'
          end
          check(source_healer.size==1,'one Map001 healer required as fallback follow template')
          base_healer=source_healer[0]
          map_stats=[]
          map_files.each do |path|
            map_id=File.basename(path)[/Map(\d{3})\.rxdata$/,1].to_i
            map=Marshal.load(File.binread(path))
            events=map.instance_variable_get(:@events)
            original_ids=events.keys.sort
            original_hashes=events.transform_values{|ev| Digest::SHA256.hexdigest(Marshal.dump(ev))}
            events.values.each do |event|
              event.instance_variable_get(:@pages).each do |page|
                cond=page.instance_variable_get(:@condition)
                SWITCH_IDS.each do |id|
                  check(!((cond.instance_variable_get(:@switch1_valid) && cond.instance_variable_get(:@switch1_id)==id) ||
                          (cond.instance_variable_get(:@switch2_valid) && cond.instance_variable_get(:@switch2_id)==id)),"#{map_id}: switch #{id} already used by event page")
                end
              end
            end
            healer=events.values.select{|event|utf(event.instance_variable_get(:@name))=='[ID힐러 마법사]'}
            check(healer.size<=1,"#{map_id}: ambiguous healer")
            template=healer[0] || base_healer
            highest=events.keys.max || 0
            anchor=events.values.first || template
            6.times do |i|
              name=ORDER[i]
              event=clone(template)
              event.instance_variable_set(:@id,highest+i+1)
              event.instance_variable_set(:@name,'동료 '+name)
              event.instance_variable_set(:@x,healer.empty? ? anchor.instance_variable_get(:@x) : template.instance_variable_get(:@x))
              event.instance_variable_set(:@y,healer.empty? ? anchor.instance_variable_get(:@y) : template.instance_variable_get(:@y))
              pages=template.instance_variable_get(:@pages)
              check(pages.size>=1,"#{map_id}: no healer page")
              page=clone(pages[0])
              condition=page.instance_variable_get(:@condition)
              condition.instance_variable_set(:@switch1_valid,true)
              condition.instance_variable_set(:@switch1_id,SWITCH_IDS[i])
              condition.instance_variable_set(:@switch2_valid,false)
              condition.instance_variable_set(:@variable_valid,false)
              condition.instance_variable_set(:@self_switch_valid,false)
              graphic=page.instance_variable_get(:@graphic)
              graphic.instance_variable_set(:@character_name,name)
              route=page.instance_variable_get(:@move_route)
              commands=route.instance_variable_get(:@list)
              check(commands.map{|x|x.instance_variable_get(:@code)}==[10,45,0],"#{map_id}: healer move route changed")
              check(utf(commands[1].instance_variable_get(:@parameters)[0]).include?('힐러범위'),"#{map_id}: expected native healer range gate")
              route.instance_variable_set(:@list,[commands[0],commands[-1]])
              page.instance_variable_set(:@trigger,0)
              page.instance_variable_set(:@list,[new_event_command(0,[])])
              event.instance_variable_set(:@pages,[page])
              check(!events.key?(highest+i+1),"#{map_id}: map event collision")
              events[highest+i+1]=event
            end
            check(original_ids.all?{|id|events.key?(id) && Digest::SHA256.hexdigest(Marshal.dump(events[id]))==original_hashes[id]},"#{map_id}: original map event changed")
            File.binwrite(path,Marshal.dump(map))
            map_stats << [map_id,events.size,healer.size==1]
          end

          exp_scripts_after=scripts.filter_map do |row|
            next unless row.is_a?(Array) && row[2].is_a?(String)
            source=Zlib::Inflate.inflate(row[2])
            [row[1],source] if source.include?('SLV541')
          end
          check(exp_scripts_before==exp_scripts_after,'SLV541-related script changed')
          File.binwrite(actor_path,Marshal.dump(actors))
          File.binwrite(item_path,Marshal.dump(items))
          File.binwrite(ce_path,Marshal.dump(common))
          File.binwrite(script_path,Marshal.dump(scripts))

          mapping=File.join(main,'mapping.js')
          js=File.binread(mapping).force_encoding('UTF-8')
          check(js.valid_encoding?,'mapping.js not UTF8')
          ([actor_path,item_path,ce_path,script_path]+map_files).each do |path|
            rel='Data/'+File.basename(path)
            pattern=Regexp.new(Regexp.escape(rel)+'\\?h=[a-f0-9]{32}')
            matches=js.scan(pattern)
            check(matches.size==1,"mapping #{rel} count #{matches.size}")
            js=js.sub(pattern,rel+'?h='+Digest::MD5.file(path).hexdigest)
          end
          ORDER.each do |name|
            rel='Graphics/Characters/'+name+'.png'
            key='graphics/characters/'+name.downcase
            digest=Digest::MD5.file(File.join(main,rel)).hexdigest
            row='["'+key+'", "'+rel+'?h='+digest+'"],'
            rgx=Regexp.new('\\["'+Regexp.escape(key)+'", "'+Regexp.escape(rel)+'\\?h=[a-f0-9]{32}"\\],')
            if js.match?(rgx)
              js=js.sub(rgx,row)
            else
              anchor='["graphics/characters/여요정", '
              check(js.scan(anchor).size==1,"missing unique graphics anchor for #{name}")
              at=js.index("\n",js.index(anchor))
              js=js[0,at+1]+row+"\n"+js[at+1..]
            end
          end
          File.write(mapping,js)

          puts JSON.generate({actors:ACTOR_IDS,items:ITEM_IDS,commonEvents:CE_IDS,
            activeSwitches:SWITCH_IDS,sourceGraphics:ORDER,maps:map_stats.size,
            mapsWithHealer:map_stats.count{|i|i[2]},mapsWithoutHealer:map_stats.select{|i|!i[2]}.map(&:first),
            newMapEvents:map_stats.size*6,expScript:'SLV541 untouched',
            attack:'Not connected in this prototype'})
          V31_COMPANIONS_RUBY
          ruby build/v31/companions.rb site/knight build/v31/elf
          .venv/bin/python - <<'V31_VERSION_AND_VERIFY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          loader=root/'knight/js/sl-assets-v229r115.js'
          js=loader.read_text('utf8')
          assert js.count("var version='V2.14';")==1
          loader.write_text(js.replace("var version='V2.14';","var version='V3.1';"),'utf8')
          for name in ('index.html','knight/index.html'):
              p=root/name
              src=p.read_text('utf8')
              assert 'V2.14' in src,('missing V2.14 identity',name)
              p.write_text(src.replace('V2.14','V3.1').replace('v2.14','v3.1'),'utf8')
          before=json.loads(Path('build/v31/before.json').read_text('utf8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          changed={p for p in before.keys()&after.keys() if before[p]!=after[p]}
          added=set(after)-set(before)
          removed=set(before)-set(after)
          data=root/'knight/gameasync/Data'
          named=lambda name: next(p for p in data.glob('*'+name+'.rxdata') if p.stat().st_size>10)
          expected={'knight/gameasync/Data/'+named(x).name for x in ('Actors','Items','CommonEvents','Scripts')}
          maps={'knight/gameasync/Data/'+p.name for p in data.glob('*Map???.rxdata') if p.stat().st_size>10}
          expected|=maps
          expected|={'knight/gameasync/mapping.js','knight/js/sl-assets-v229r115.js',
                     'index.html','knight/index.html'}
          approved_add={'knight/gameasync/Graphics/Characters/'+n+'.png'
                        for n in ('여요정','다크엘프','다크레인저','실버레인저','애로우 마스터','아크스카우터')}
          assert changed==expected,('changed mismatch',sorted(changed-expected),sorted(expected-changed))
          assert added<=approved_add,('unexpected additions',sorted(added-approved_add))
          assert not removed,('unexpected removals',sorted(removed))
          print('PASS V3.1 companions registered and map follower events compiled',len(maps))
          print('PASS V3.1 only approved data, images and versions changed',len(changed),len(added))
          V31_VERSION_AND_VERIFY
