
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V257
# BASE: V254 successful run 41394237945
# FIX: Delete copied Death Knight event pages.
# FIX: Delete cloned CommonEvents 1061 and 1062.
# FIX: Replace copied runtime with an independent monster core.
# FIX: Remove oversized V256 motion atlas.
# KEEP: All original maps, NPCs, items, drops and effects.
# SCOPE: Map025 EV29 only.
# STATUS: Static and simulated runtime tests included.
# STATUS: Mobile combat verification pending.

name: build-slknight-web.yml | V257 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: V257 Restore original game assets
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41394237945
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V257 Verify baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s baseline/artifact.tar
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json

          root=Path('site')
          files={
            str(p.relative_to(root)):
            hashlib.sha256(p.read_bytes()).hexdigest()
            for p in root.rglob('*') if p.is_file()
          }

          assert len(files)==5610,len(files)

          pre=(
            'knight/gameasync/Data/'
            'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          )

          for mid in (16,25,47):
            assert pre+f'Map{mid:03d}.rxdata' in files

          for mid in (45,46):
            assert pre+f'Map{mid:03d}.rxdata' not in files

          assert 'knight/assets/map-047-v241.pack' in files

          for motion in (
            'Walk','Idle','Attack','AltAttack',
            'Spell','Hit','Death'
          ):
            path=(
              'knight/gameasync/Graphics/'
              'Characters/SLZenith'+motion+'.png'
            )
            assert path in files,path

          Path('build/before.json').write_text(
            json.dumps(files,sort_keys=True)
          )

          print('PASS original game inventory')
          print('PASS seven Zenith motion sheets')
          PY

      - name: V257 Create standalone monster runtime
        shell: bash
        run: |
          set -euo pipefail

          cat > build/monster-runtime.rb <<'RUBY'
          # Independent monster system.
          # Only explicitly registered map/event pairs are handled.

          module SLMonster
            REGISTRY={
              [25,29]=>{
                :name=>'제니스 퀸',
                :sprite=>'SLZenith',
                :level=>60,
                :max_hp=>5200,
                :damage_var=>7001,
                :physical=>[50,100],
                :magic=>[150,300],
                :accuracy=>9999,
                :hit_random=>[15,35],
                :attack_wait=>20,
                :attack_range=>3,
                :exp=>43212,
                :adena=>[64800,151200],
                :magic_fx=>[25,14,15,16],
                :frames=>{
                  'Walk'=>12,
                  'Idle'=>11,
                  'Attack'=>13,
                  'AltAttack'=>14,
                  'Spell'=>14,
                  'Hit'=>2,
                  'Death'=>17
                },
                :drops=>__APPROVED_DROPS__
              }
            }

            @states={}

            def self.config(map_id,event_id)
              REGISTRY[[map_id,event_id]]
            end

            def self.state(map_id,event_id)
              key=[map_id,event_id]

              @states[key]||={
                :tick=>0,
                :motion=>nil,
                :motion_tick=>0,
                :motion_duration=>0,
                :last_damage=>0,
                :attack_tick=>0,
                :player_tick=>0,
                :attack_count=>0,
                :magic_index=>0,
                :death_tick=>0,
                :paid=>false
              }
            end

            def self.reset(map_id)
              @states={}

              return unless $game_variables

              REGISTRY.each do |key,c|
                next unless key[0]==map_id

                $game_variables[c[:damage_var]]=0
              end
            end

            def self.actor
              if $game_party &&
                 $game_party.respond_to?(:actors)

                actors=$game_party.actors

                if actors && !actors.empty?
                  return actors[0]
                end
              end

              if $game_actors
                return $game_actors[1]
              end

              nil
            end

            def self.roll(pair)
              low=pair[0].to_i
              high=pair[1].to_i
              return low if high<=low

              low+rand(high-low+1)
            end

            def self.event(map_id,event_id)
              return nil unless $game_map
              return nil unless $game_map.map_id==map_id
              return nil unless $game_map.respond_to?(:events)

              $game_map.events[event_id]
            end

            def self.motion(map_id,event_id,name,duration)
              c=config(map_id,event_id)
              return unless c
              return unless c[:frames].key?(name)

              s=state(map_id,event_id)
              return if s[:paid] && name!='Death'

              s[:motion]=name
              s[:motion_tick]=0
              s[:motion_duration]=duration

              ev=event(map_id,event_id)
              return unless ev

              graphic=c[:sprite]+name

              if ev.instance_variable_get(:@character_name)!=graphic
                ev.instance_variable_set(
                  :@character_name,graphic
                )
              end
            end

            def self.show_hp(map_id,event_id)
              c=config(map_id,event_id)
              return unless c
              return unless $game_variables
              return unless $m && $m.respond_to?(:drawMHP)

              damage=$game_variables[
                c[:damage_var]
              ].to_i

              $m.drawMHP(
                c[:name],damage,c[:max_hp],2
              )
            end

            def self.apply_hit(map_id,event_id,amount)
              c=config(map_id,event_id)
              return false unless c
              return false unless $game_variables
              return false unless amount.to_i>0

              s=state(map_id,event_id)
              return false if s[:paid]

              old=$game_variables[c[:damage_var]].to_i

              return false if old>=c[:max_hp]

              value=[old+amount.to_i,c[:max_hp]].min

              $game_variables[c[:damage_var]]=value
              s[:last_damage]=value

              if value<c[:max_hp]
                motion(map_id,event_id,'Hit',14)
              end

              show_hp(map_id,event_id)
              true
            end

            def self.distance(ev)
              return nil unless $game_player
              return nil unless ev.respond_to?(:x)
              return nil unless ev.respond_to?(:y)
              return nil unless $game_player.respond_to?(:x)
              return nil unless $game_player.respond_to?(:y)

              dx=($game_player.x-ev.x).abs
              dy=($game_player.y-ev.y).abs

              [dx,dy]
            end

            def self.player_attack(ev,c,s)
              d=distance(ev)
              return unless d

              return unless d[0]<=1 && d[1]<=1

              attacker=actor
              return unless attacker
              return unless attacker.respond_to?(:atk)

              attack=attacker.atk.to_i
              return unless attack>0

              s[:player_tick]+=1

              return if s[:player_tick]<c[:attack_wait]

              s[:player_tick]=0

              apply_hit(
                25,29,attack
              )
            end

            def self.magic_effect(c,s)
              return unless $game_player
              return unless $data_animations

              return unless
                $game_player.respond_to?(:animation_id=)

              ids=c[:magic_fx]
              return if ids.empty?

              index=s[:magic_index]%ids.length
              id=ids[index]

              return unless $data_animations[id]

              $game_player.animation_id=id
              s[:magic_index]=(index+1)%ids.length
            end

            def self.monster_attack(ev,c,s)
              target=actor
              return unless target
              return unless target.respond_to?(:hp)
              return unless target.respond_to?(:hp=)
              return if target.hp.to_i<=0

              d=distance(ev)
              return unless d
              return unless
                d[0]<=c[:attack_range] &&
                d[1]<=c[:attack_range]

              s[:attack_tick]+=1

              return if s[:attack_tick]<c[:attack_wait]

              s[:attack_tick]=0

              # Standalone hybrid attack selection.
              # Original physical/magic selection ratio
              # still requires mobile gameplay verification.
              magic=(s[:attack_count]%2)==1
              s[:attack_count]+=1

              if magic
                motion(25,29,'Spell',c[:attack_wait])
                magic_effect(c,s)
                damage=roll(c[:magic])
              else
                motion(25,29,'Attack',c[:attack_wait])
                damage=roll(c[:physical])
              end

              current=target.hp.to_i
              target.hp=[current-damage,0].max
            end

            def self.reward(map_id,event_id)
              c=config(map_id,event_id)
              return unless c
              return unless $game_party && $game_variables

              s=state(map_id,event_id)
              return if s[:paid]

              damage=$game_variables[c[:damage_var]].to_i
              return if damage<c[:max_hp]

              s[:paid]=true

              gold=roll(c[:adena])
              $game_party.gain_gold(gold)

              a=actor

              if a && a.respond_to?(:exp) &&
                 a.respond_to?(:exp=)
                a.exp=a.exp+c[:exp]
              end

              $game_variables[333]=gold
              $game_variables[1926]=c[:exp]

              c[:drops].each do |kind,id,chance|
                next unless rand(1000)<chance

                case kind
                when :item
                  $game_party.gain_item(id,1)
                when :weapon
                  $game_party.gain_weapon(id,1)
                when :armor
                  $game_party.gain_armor(id,1)
                end
              end
            end

            def self.update_event(ev)
              map_id=ev.instance_variable_get(:@map_id)
              event_id=ev.instance_variable_get(:@id)

              c=config(map_id,event_id)
              return unless c
              return unless $game_map && $game_variables
              return unless $game_map.map_id==map_id
              return if ev.instance_variable_get(:@erased)

              s=state(map_id,event_id)
              s[:tick]+=1

              damage=$game_variables[
                c[:damage_var]
              ].to_i

              if damage>s[:last_damage] &&
                 damage<c[:max_hp]

                motion(map_id,event_id,'Hit',14)
                show_hp(map_id,event_id)
              end

              s[:last_damage]=damage

              if damage>=c[:max_hp]
                if s[:death_tick]==0
                  motion(map_id,event_id,'Death',42)
                  reward(map_id,event_id)
                end

                s[:death_tick]+=1

                if s[:death_tick]>=42 &&
                   ev.respond_to?(:erase)
                  ev.erase
                end

                return
              end

              if s[:motion]
                s[:motion_tick]+=1

                if s[:motion_tick]>=s[:motion_duration]
                  s[:motion]=nil
                  s[:motion_tick]=0
                end
              end

              if !s[:motion]
                moving=ev.respond_to?(:moving?) &&
                  ev.moving?

                name=moving ? 'Walk' : 'Idle'
                graphic=c[:sprite]+name

                if ev.instance_variable_get(:@character_name)!=graphic
                  ev.instance_variable_set(
                    :@character_name,graphic
                  )
                end
              end

              player_attack(ev,c,s)

              current=$game_variables[
                c[:damage_var]
              ].to_i

              return if current>=c[:max_hp]

              monster_attack(ev,c,s)
            end

            def self.frame_info(ev)
              map_id=ev.instance_variable_get(:@map_id)
              event_id=ev.instance_variable_get(:@id)

              c=config(map_id,event_id)
              return nil unless c

              s=state(map_id,event_id)

              action=s[:motion]

              if !action
                moving=ev.respond_to?(:moving?) &&
                  ev.moving?

                action=moving ? 'Walk' : 'Idle'
              end

              frames=c[:frames][action]
              return nil unless frames && frames>0

              if s[:motion]
                duration=[s[:motion_duration],1].max

                frame=[
                  s[:motion_tick]*frames/duration,
                  frames-1
                ].min
              else
                speed=action=='Walk' ? 2 : 4
                frame=(s[:tick]/speed)%frames
              end

              direction=ev.direction.to_i
              row=[2,4,6,8].index(direction)

              return nil unless row

              [action,frame,row,frames]
            end
          end

          class Game_Map
            alias slm_v257_original_setup setup

            def setup(map_id)
              slm_v257_original_setup(map_id)
              SLMonster.reset(map_id)
            end
          end

          class Game_Event
            alias slm_v257_original_update update

            def update
              c=SLMonster.config(@map_id,@id)

              @monster=true if c

              slm_v257_original_update

              SLMonster.update_event(self) if c
            end
          end

          class Sprite_Character
            alias slm_v257_original_update update

            def update
              slm_v257_original_update

              return unless @character
              return unless @character.is_a?(Game_Event)

              map_id=@character.instance_variable_get(:@map_id)
              event_id=@character.instance_variable_get(:@id)

              c=SLMonster.config(map_id,event_id)
              return unless c

              info=SLMonster.frame_info(@character)
              return unless info

              action,frame,row,frames=info

              expected=c[:sprite]+action

              return unless
                @character.character_name==expected

              bmp=respond_to?(:bitmap) ? bitmap : @bitmap

              return unless bmp
              return unless bmp.respond_to?(:width)
              return unless bmp.respond_to?(:height)

              return unless bmp.width.to_i>0
              return unless bmp.height.to_i>0
              return unless bmp.width%frames==0
              return unless bmp.height%4==0

              rect=respond_to?(:src_rect) ?
                src_rect : @src_rect

              return unless rect &&
                rect.respond_to?(:set)

              cw=bmp.width/frames
              ch=bmp.height/4

              rect.set(frame*cw,row*ch,cw,ch)

              @cw=cw
              @ch=ch

              if respond_to?(:ox=)
                self.ox=cw/2
              else
                @ox=cw/2
              end

              if respond_to?(:oy=)
                self.oy=ch
              else
                @oy=ch
              end

              if respond_to?(:z=) &&
                 @character.respond_to?(:screen_z)
                self.z=@character.screen_z(ch)
              end
            end
          end
          RUBY

      - name: V257 Delete cloned events and rebuild Zenith
        shell: bash
        run: |
          set -euo pipefail

          cat > build/install.rb <<'RUBY'
          require 'zlib'

          module RPG
            class Map;end
            class MapInfo;end
            class AudioFile;end
            class CommonEvent;end

            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end

            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end

          class Table
            def self._load(raw)
              o=allocate
              o.instance_variable_set(:@raw,raw)
              o
            end
            def _dump(level=0);@raw;end
          end

          class Tone
            def self._load(raw)
              o=allocate
              o.instance_variable_set(:@raw,raw)
              o
            end
            def _dump(level=0);@raw;end
          end

          class Color<Tone;end

          def iv(o,k)
            o.instance_variable_get('@'+k.to_s)
          end

          def put(o,k,v)
            o.instance_variable_set('@'+k.to_s,v)
          end

          def command(code,params=[])
            c=RPG::EventCommand.allocate
            put(c,:code,code)
            put(c,:indent,0)
            put(c,:parameters,params)
            c
          end

          def move_command(code,params=[])
            c=RPG::MoveCommand.allocate
            put(c,:code,code)
            put(c,:parameters,params)
            c
          end

          def create_boss(x,y)
            event=RPG::Event.allocate

            put(event,:id,29)
            put(event,:name,'제니스 퀸')
            put(event,:x,x)
            put(event,:y,y)

            page=RPG::Event::Page.allocate
            cond=RPG::Event::Page::Condition.allocate

            put(cond,:switch1_valid,false)
            put(cond,:switch2_valid,false)
            put(cond,:variable_valid,false)
            put(cond,:self_switch_valid,false)
            put(cond,:switch1_id,1)
            put(cond,:switch2_id,1)
            put(cond,:variable_id,1)
            put(cond,:variable_value,0)
            put(cond,:self_switch_ch,'A')

            graphic=RPG::Event::Page::Graphic.allocate

            put(graphic,:tile_id,0)
            put(graphic,:character_name,'SLZenithIdle')
            put(graphic,:character_hue,0)
            put(graphic,:direction,2)
            put(graphic,:pattern,0)
            put(graphic,:opacity,255)
            put(graphic,:blend_type,0)

            route=RPG::MoveRoute.allocate
            put(route,:repeat,true)
            put(route,:skippable,false)
            put(route,:list,[move_command(0)])

            put(page,:condition,cond)
            put(page,:graphic,graphic)
            put(page,:move_type,2)
            put(page,:move_speed,3)
            put(page,:move_frequency,6)
            put(page,:move_route,route)
            put(page,:walk_anime,true)
            put(page,:step_anime,false)
            put(page,:direction_fix,false)
            put(page,:through,false)
            put(page,:always_on_top,false)
            put(page,:trigger,0)
            put(page,:list,[command(0)])

            put(event,:pages,[page])
            event
          end

          root='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          map_path=root+pre+'Map025.rxdata'
          common_path=root+pre+'CommonEvents.rxdata'
          scripts_path=root+'Scripts.rxdata'

          map=Marshal.load(File.binread(map_path))
          common=Marshal.load(File.binread(common_path))
          scripts=Marshal.load(File.binread(scripts_path))

          events=iv(map,:events)
          old_boss=events.fetch(29)

          old_name=iv(old_boss,:name).to_s.dup
            .force_encoding('UTF-8').scrub

          raise 'Wrong old boss' unless
            old_name.include?('제니스 퀸')

          original_events=events.each_with_object({}) do |(id,e),h|
            h[id]=Marshal.dump(e) unless id==29
          end

          # Preserve only the original location.
          x=iv(old_boss,:x)
          y=iv(old_boss,:y)

          # Delete the copied two-page event completely.
          events[29]=create_boss(x,y)

          fresh=events.fetch(29)
          pages=iv(fresh,:pages)

          raise 'Old event pages retained' unless
            pages.length==1

          list=iv(pages[0],:list)

          raise 'Old event commands retained' unless
            list.length==1 &&
            iv(list[0],:code)==0

          original_events.each do |id,raw|
            raise "Other event modified #{id}" unless
              Marshal.dump(events[id])==raw
          end

          # These two common events were appended only
          # for the cloned Zenith Queen combat graph.
          raise 'Unexpected common event inventory' unless
            common.length==1063

          [1061,1062].each do |id|
            ce=common.fetch(id)

            name=iv(ce,:name).to_s.dup
              .force_encoding('UTF-8').scrub

            raise 'Not a Zenith clone' unless
              iv(ce,:id)==id &&
              name.include?('제니스 퀸')
          end

          original_common=common[0...1061].map do |ce|
            Marshal.dump(ce)
          end

          common.pop(2)

          raise 'Common event clones remain' unless
            common.length==1061

          common.each_with_index do |ce,id|
            raise "Native common event changed #{id}" unless
              Marshal.dump(ce)==original_common[id]
          end

          # Ensure retained common events do not call
          # deleted clone IDs.
          common.each do |ce|
            next unless ce
            commands=iv(ce,:list)
            next unless commands

            commands.each do |cmd|
              next unless iv(cmd,:code)==117
              params=iv(cmd,:parameters)
              next unless params.is_a?(Array)

              raise 'Retained event calls deleted clone' if
                [1061,1062].include?(params[0])
            end
          end

          # No map may retain a call to CE1061/1062.
          Dir.glob(root+pre+'Map*.rxdata').each do |path|
            obj=(path==map_path) ?
              map : Marshal.load(File.binread(path))

            map_events=iv(obj,:events)
            next unless map_events

            map_events.each_value do |ev|
              iv(ev,:pages).each do |page|
                iv(page,:list).each do |cmd|
                  next unless iv(cmd,:code)==117
                  params=iv(cmd,:parameters)
                  next unless params.is_a?(Array)

                  raise "Deleted CE reference in #{path}" if
                    [1061,1062].include?(params[0])
                end
              end
            end
          end

          # Replace the complete copied runtime.
          indices=scripts.each_index.select do |i|
            scripts[i].is_a?(Array) &&
              scripts[i][1]=='SLZenithV254'
          end

          raise 'Copied runtime missing or duplicated' unless
            indices.length==1

          index=indices.first
          entry=scripts[index]

          old_runtime=Zlib::Inflate.inflate(entry[2])

          required=[
            'MAX_HP=5200',
            'PHYSICAL=[50,100]',
            'MAGIC=[150,300]',
            'ACCURACY=9999',
            'HIT_RANDOM=[15,35]',
            'ATTACK_WAIT=20',
            'EXP=43212',
            'ADENA=[64800,151200]'
          ]

          required.each do |value|
            raise "Approved stat changed #{value}" unless
              old_runtime.include?(value)
          end

          # Read the actual approved 20-entry drop table.
          match=old_runtime.match(
            /DROPS=(\[\n.*?\n  \])/m
          )

          raise 'Approved drop table missing' unless match

          drops=match[1]

          raise 'Drop inventory differs' unless
            drops.scan(
              /\[:(?:item|weapon|armor),/
            ).length==20

          runtime=File.read('build/monster-runtime.rb')
          placeholder='__APPROVED_DROPS__'

          count=runtime.scan(
            Regexp.new(Regexp.escape(placeholder))
          ).length

          raise "Drop placeholder count #{count}" unless
            count==1

          runtime=runtime.sub(placeholder,drops)

          raise 'Drop insertion incomplete' if
            runtime.include?(placeholder)

          # Reject dependencies on deleted combat clones.
          forbidden=[
            'SLMonsterAttackContext',
            'SLZenithV247',
            'SLZenithV252',
            'SLZenithV253',
            'SLZenithV254',
            'SLZenithV256',
            'CE1061',
            'CE1062'
          ]

          forbidden.each do |value|
            raise "Legacy dependency #{value}" if
              runtime.include?(value)
          end

          entry[0]=99825701
          entry[1]='SLMonsterV257'
          entry[2]=Zlib::Deflate.deflate(runtime,9)

          File.binwrite(map_path,Marshal.dump(map))
          File.binwrite(common_path,Marshal.dump(common))
          File.binwrite(scripts_path,Marshal.dump(scripts))

          File.write('build/monster-runtime.rb',runtime)

          verify=Marshal.load(File.binread(scripts_path))

          restored=Zlib::Inflate.inflate(
            verify[index][2]
          )

          raise 'Runtime serialization failed' unless
            verify[index][1]=='SLMonsterV257' &&
            restored.b==runtime.b

          puts 'PASS copied boss event deleted'
          puts 'PASS new single-page boss created'
          puts 'PASS CE1061 and CE1062 deleted'
          puts 'PASS native common events preserved'
          puts 'PASS copied runtime replaced'
          puts 'PASS all other map events preserved'
          puts 'PASS approved drops and stats preserved'
          RUBY

          ruby -c build/install.rb
          ruby build/install.rb
