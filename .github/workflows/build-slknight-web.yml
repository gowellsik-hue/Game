          DATA46
          cat > build/r94-only.rb <<'RUBY'
          require 'zlib'
          require 'base64'
          require 'digest'
          module RPG
            class Map; end
            class Event; end
            class Event::Page; end
            class Event::Page::Condition; end
            class Event::Page::Graphic; end
            class EventCommand; end
            class MoveCommand; end
            class MoveRoute; end
            class MapInfo; end
            class AudioFile; end
            class Tileset; end
          end
          class Table
            def self._load(raw)
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end
            def _dump(_depth); @raw; end
          end
          class Tone
            def self._load(raw)
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end
            def _dump(_depth); @raw; end
          end
          class Color
            def self._load(raw)
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end
            def _dump(_depth); @raw; end
          end
          root=ARGV.fetch(0)
          pfx='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          data=File.join(root,'knight/gameasync/Data')
          # Read only: verify tile IDs use the unchanged RPG collision settings.
          ts=Marshal.load(File.binread(File.join(data,pfx+'Tilesets.rxdata'))).fetch(31)
          passages=ts.instance_variable_get(:@passages).instance_variable_get(:@raw)
          raise '384/385 tile passage values changed' unless
            passages[20+384*2,2].unpack1('v')==0 &&
            passages[20+385*2,2].unpack1('v')==15
          # Only first-layer map cells; preserve both other layers, RPG events,
          # existing S32 helpers, all other maps and graphics byte-for-byte.
          config={
            45=>[288,144,1437,537,900,'c34ea39837ace48f272616c052a3f90c29e2f15a2bc636af02efcc6bbeffc81d'],
            46=>[336,168,1754,852,902,'a10e5cdea49dc27945cb069c2d69b9928fcf36e32aba379da8ee757656217d24']
          }
          config.each do |mid,(w,h,n,greens,reds,target_sha)|
            name=pfx+('Map%03d.rxdata' % mid)
            path=File.join(data,name)
            map=Marshal.load(File.binread(path))
            raise 'Unexpected map dimensions' unless
              [map.instance_variable_get(:@width),map.instance_variable_get(:@height)]==[w,h]
            table=map.instance_variable_get(:@data)
            raw=table.instance_variable_get(:@raw).b.dup
            raise 'Unexpected RPG Table header' unless
              raw[0,20].unpack('V5')==[3,w,h,3,w*h*3]
            raise 'Unexpected map table byte length' unless raw.bytesize==20+w*h*6
            original=raw.dup
            patches=Zlib::Inflate.inflate(Base64.decode64(File.read(ARGV.fetch(mid==45 ? 1 : 2))))
            raise 'Wrong R94 patch size' unless patches.bytesize==n*3
            seen=-1;added_green=0;added_red=0
            patches.bytes.each_slice(3) do |low,high,flag|
              index=low+(high<<8)
              raise 'Duplicate/unsorted/outside collision tile' unless index>seen && index<w*h
              raise 'Invalid R94 color' unless flag==0 || flag==1
              offset=20+index*2
              current=raw[offset,2].unpack1('v')
              target=flag==1 ? 384 : 385
              raise 'R94 patch includes unchanged/noncollision cell' unless
                (current==384 || current==385) && current!=target
              raw[offset,2]=[target].pack('v')
              flag==1 ? added_green+=1 : added_red+=1
              seen=index
            end
            raise 'Unexpected green/red change counts' unless
              [added_green,added_red]==[greens,reds]
            # Each changed byte belongs to the original first RPG map layer.
            raise 'Unapproved change outside layer 0' unless
              raw[20+w*h*2..-1]==original[20+w*h*2..-1]
            first=raw[20,w*h*2].unpack('v*')
            raise 'Unexpected tile IDs in 384/385 map' unless first.all?{|id|id==384 || id==385}
            mask=first.map{|id|id==384 ? 1 : 0}.pack('C*')
            raise 'R94 resulting passability mismatch' unless
              Digest::SHA256.hexdigest(mask)==target_sha
            table.instance_variable_set(:@raw,raw)
            File.binwrite(path,Marshal.dump(map))
            raise 'Post-save map first layer mismatch' unless
              Marshal.load(File.binread(path)).instance_variable_get(:@data).
                instance_variable_get(:@raw)==raw
            puts "PASS Map#{mid}: #{added_green} red->384; #{added_red} green->385"
          end
          puts 'PASS only Map045/046 384/385 assignments were changed'
          puts 'PASS engine, scripts, events, monster spawns, R94 helpers and Map047 preserved'
          RUBY
          ruby -c build/r94-only.rb
          ruby build/r94-only.rb site build/r94-map045.b64 build/r94-map046.b64

      - name: V229R139 Refresh two map cache keys and three version stamps only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CACHE'
          from pathlib import Path
          import hashlib,re
          root=Path('site')
          data=root/'knight/gameasync/Data'
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          mapping=root/'knight/gameasync/mapping.js'
          code=mapping.read_text('utf8')
          for number in (45,46):
            key=prefix+('Map%03d' % number)
            path=data/(key+'.rxdata')
            pattern=r'(Data/'+re.escape(key)+r'\.rxdata\?h=)[0-9a-f]{32}'
            h=hashlib.md5(path.read_bytes()).hexdigest()
            code,changed=re.subn(pattern,lambda m:m.group(1)+h,code)
            assert changed==1,('RPG map cache entry missing/duplicated',number,changed)
          mapping.write_text(code,'utf8')
          for name in ('index.html','knight/index.html'):
            path=root/name
            text=path.read_text('utf8')
            assert 'V229R138' in text and 'V229R139' not in text
            path.write_text(text.replace('V229R138','V229R139').replace('v229r138','v229r139'),'utf8')
          asset=root/'knight/js/sl-assets-v229r115.js'
          text=asset.read_text('utf8')
          assert text.count("var version='V229R138';")==1
          asset.write_text(text.replace("var version='V229R138';","var version='V229R139';"),'utf8')
          assert 'js/sl-assets-v229r115.js?v=v229r139' in (root/'knight/index.html').read_text('utf8')
          print('PASS map 45/46 cache keys and existing version displays updated')
          PY_CACHE
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: V229R139 Audit only two maps and cache/version files changed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_AUDIT'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before=json.loads(Path('build/before.json').read_text('utf8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert before.keys()==after.keys(), 'Original game file added or removed'
          p='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          expected={p+'Map045.rxdata',p+'Map046.rxdata',
                    'knight/gameasync/mapping.js','index.html','knight/index.html',
                    'knight/js/sl-assets-v229r115.js'}
          modified={x for x in before if before[x]!=after[x]}
          assert modified==expected,('Unexpected modified files',sorted(modified^expected))
          assert len(after)==5663
          assert before[p+'Map047.rxdata']==after[p+'Map047.rxdata']
          assert before['knight/gameasync/Data/Scripts.rxdata']==after['knight/gameasync/Data/Scripts.rxdata']
          assert before[p+'Tilesets.rxdata']==after[p+'Tilesets.rxdata']
          print('PASS: exactly 2 map data files, 1 cache index, 3 version displays changed')
          print('PASS: no changes to movement engine, 452 R94 masks, NPCs, monsters,')
          print('      stairs, Baphomet, sprites, 2F art, TI Map047 or its teleporter')
          PY_AUDIT

      - name: V229R139 Publish only approved R94 red/green map corrections
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
