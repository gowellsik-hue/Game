           def dispose;@disposed=true;end
          end
          class Map;attr_accessor :display_x,:display_y;end
          class Spriteset_Map;end
          Spriteset_Map.class_eval(code)
          meta=JSON.parse(File.read(ARGV.fetch(1)))
          chunks=meta.fetch('45').fetch('chunks').map{|key,v|[key.split(',').map(&:to_i),v]}.to_h
          key,fragment=chunks.to_a.find{|key,parts|key==[4,2]}
          raise 'Missing fixture chunk' unless key
          record=fragment.find{|tx,ty,lx,ly,rx,ry|tx>3 && tx<13 && ty>3 && ty<12}
