
name: V229 | Reviewed Unified Knight Speed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-slknight-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Recover verified V229 game artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          repository: gowellsik-hue/Game
          run-id: 38837762563
          name: github-pages
          github-token: ${{ github.token }}
          path: previous

      - name: Restore full game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          if test -s previous/artifact.tar; then
            tar -xf previous/artifact.tar -C site
          else
            python3 - <<'PY_FETCH'
          from pathlib import Path
          from urllib.request import Request,urlopen
          from urllib.parse import quote
          from concurrent.futures import ThreadPoolExecutor,as_completed
          import hashlib,json,re,time
          base='https://gowellsik-hue.github.io/Game/'
          root=Path('site')
          fixed=('index.html','COPYING-mkxp-web.txt','manifest.webmanifest','mkxp.js','mkxp.wasm','js/drive.js','js/dpad.js','js/localforage.min.js')
          def get(url):
            for attempt in range(5):
              try:
                with urlopen(Request(url,headers={'User-Agent':'SLKnight-V229-R2','Accept-Encoding':'identity'}),timeout=60) as response:
                  return response.read()
              except Exception:
                if attempt==4:raise
                time.sleep(attempt+1)
          files={'index.html':(base+'index.html',None)}
          for game in ('knight','elf'):
            for rel in fixed:
              files[game+'/'+rel]=(base+game+'/'+quote(rel,safe='/'),None)
            name=game+'/gameasync/mapping.js'
            blob=get(base+name+'?recovery=229r2')
            f=root/name;f.parent.mkdir(parents=True,exist_ok=True);f.write_bytes(blob)
            array=blob.decode('utf-8').split('var mappingArray = ',1)[1].split('];',1)[0]+']'
            for _,asset in json.loads(re.sub(r',\s*\]$',']',array)):
              rel,sep,md5=asset.partition('?h=')
              if '.' not in Path(rel).name:continue
              if rel.startswith('/') or '..' in Path(rel).parts:raise RuntimeError('Unsafe path '+rel)
              name=game+'/gameasync/'+rel
              if name in files:raise RuntimeError('Duplicate '+name)
              files[name]=(base+game+'/gameasync/'+quote(rel,safe='/')+('?h='+md5 if sep else ''),md5 if sep else None)
          if len(files)!=5354:raise RuntimeError('Wrong file count')
          def fetch(item):
            name,(url,md5)=item
            data=get(url)
            if md5 and Path(name).name not in ('mapping.js','bitmap-map.js') and hashlib.md5(data).hexdigest()!=md5:
              raise RuntimeError('Corrupt file '+name)
            path=root/name;path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data)
          with ThreadPoolExecutor(max_workers=12) as pool:
            for result in as_completed([pool.submit(fetch,item) for item in files.items() if not (root/item[0]).is_file()]):result.result()
          if {str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}!=set(files):raise RuntimeError('Incomplete recovery')
          print('COMPLETE_SITE_RESTORED')
          PY_FETCH
          fi

      - name: Verify V229R1 or V229R2 baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CHECK'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if len(hashes)!=5354:raise SystemExit('Wrong game inventory')
          baseline={
           'knight/index.html':'c972da44d2a87ed6a60eefda1e7521e0e5eff221568ce956516d23e3bc79c738',
           'knight/gameasync/mapping.js':'7a4ca5406d36631e627090f7b23dc470bd9650c728de4338104c888c81027d2d',
           'knight/gameasync/Data/Scripts.rxdata':'cfe8a3a81b392907a6056a8d96bfec5d6609557aa4118132f54a6d63fa198fa4',
           'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata':'bbf5ec438a88f032780f9464a862ca4728f1f34afa1b74053ca7c6a9243ca3ed'
          }
          patched={
           'knight/index.html':'f46be32a7c7ca0414d7ac9511926379973dc7c303af2f5dda4eadd443a60ca5b',
           'knight/gameasync/mapping.js':'8f1038ada15642711fa9e46115e560632fbea85a1ee1dfb944a96bb1be931ad6',
           'knight/gameasync/Data/Scripts.rxdata':'9e3eaae707471a9ee395e5ede40b43bc8462f2be137bc9f3ffca484598062630',
           'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata':'bbf5ec438a88f032780f9464a862ca4728f1f34afa1b74053ca7c6a9243ca3ed'
          }
          version='V229R1' if all(hashes.get(k)==v for k,v in baseline.items()) else 'V229R2' if all(hashes.get(k)==v for k,v in patched.items()) else None
          if version is None:raise SystemExit('Unexpected deployed source; refusing to patch')
          Path('/tmp/slv229_source').write_text(version)
          Path('/tmp/slv229_before').write_text(json.dumps(hashes))
          print('BASELINE_VERIFIED',version,len(hashes))
          PY_CHECK

      - name: Align right tile seam and remove unsupported defined query
        shell: bash
        run: |
          set -euo pipefail
          if test "$(cat /tmp/slv229_source)" = V229R1; then
            ruby - site/knight/gameasync/Data/Scripts.rxdata <<'RUBY_FIX'
          require 'zlib'
          require 'digest'
          path=ARGV[0] or abort('missing scripts')
          scripts=Marshal.load(File.binread(path))
          raise 'Incorrect V229R1 script SHA' unless Digest::SHA256.file(path).hexdigest == 'cfe8a3a81b392907a6056a8d96bfec5d6609557aa4118132f54a6d63fa198fa4'
          raise 'Unexpected script count' unless scripts.size==135
          raise 'Resolution index mismatch' unless scripts[97][1].to_s.dup.force_encoding('UTF-8').include?('해상도')
          raise 'Speed script index mismatch' unless scripts[133][1].to_s.dup.force_encoding('UTF-8').include?('V229')
          orig_res=Zlib::Inflate.inflate(scripts[97][2]);orig_speed=Zlib::Inflate.inflate(scripts[133][2])
          old='    @tilemap2.ox = @tilemap.ox + 640'
          replacement=<<~'TEXT'.rstrip.lines.map{|l| '    '+l}.join
          sl_seam = 672 - (@tilemap.ox.to_i % 32)
          sl_seam = [sl_seam, $window_width2].min
          if @viewport4.rect.x != sl_seam
            @viewport4.rect = Rect.new(sl_seam, 0, $window_width2 - sl_seam, 480)
          end
          @tilemap2.ox = @tilemap.ox + sl_seam
          TEXT
          raise 'Right tile update anchor count' unless orig_res.scan(old).size==1
          raise 'Right tile priority unexpectedly missing' unless orig_res.include?('@tilemap2.priorities = $game_map.priorities')
          new_res=orig_res.sub(old,replacement)
          raise 'Lower map update modified' unless new_res.include?('@tilemap3.oy = @tilemap.oy + 480') && new_res.include?('@tilemap4.ox = @tilemap.ox + 640')
          old_speed='Guage.show if defined?(Guage)'
          raise 'Incompatible defined? not found exactly once' unless orig_speed.scan(old_speed).size==1
          new_speed=orig_speed.sub(old_speed,'Guage.show')
          raise 'defined? still in speed module' if new_speed.include?('defined?')
          [['resolution',new_res],['speed',new_speed]].each do |name,script|
           file='/tmp/v229r2_'+name+'.rb';File.binwrite(file,script)
           raise 'Invalid Ruby script '+name unless system('ruby','-c',file,out:File::NULL)
          end
          scripts[97][2]=Zlib::Deflate.deflate(new_res)
          scripts[133][2]=Zlib::Deflate.deflate(new_speed)
          File.binwrite(path,Marshal.dump(scripts))
          puts 'V229R2_SCRIPT_SHA '+Digest::SHA256.file(path).hexdigest
          puts 'V229R2_ONLY_SCRIPTS_97_133_MODIFIED'
          RUBY_FIX
            python3 - site/knight/index.html <<'PY_INDEX'
          from pathlib import Path
          import hashlib
          path=Path(__import__('sys').argv[1]); src=path.read_text(encoding='utf-8')
          old='''  function err(t){
              var p=document.getElementById('slerr');
              if(!p){
                p=document.createElement('div');p.id='slerr';
                p.style='position:fixed;left:8px;bottom:8px;z-index:999999;max-width:calc(100vw - 16px);height:28px;box-sizing:border-box;padding:5px 7px;border:1px solid #d33;border-radius:4px;background:rgba(0,0,0,.86);color:#ffd0d0;font:12px/16px monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none';
                (document.getElementById('main')||document.body).appendChild(p);
              }
              p.textContent=String(t);
            }'''
          new='''  var slLastError='',slErrorTrace=[];
            function renderSlError(){
              var p=document.getElementById('slerr');
              if(!p){
                p=document.createElement('div');p.id='slerr';
                p.style='position:fixed;left:8px;bottom:8px;z-index:999999;max-width:calc(100vw - 16px);height:28px;box-sizing:border-box;padding:5px 7px;border:1px solid #d33;border-radius:4px;background:rgba(0,0,0,.90);color:#ffd0d0;font:12px/16px monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:auto;cursor:pointer';
                p.onclick=function(){p.dataset.expanded=p.dataset.expanded==='1'?'0':'1';renderSlError();};
                (document.getElementById('main')||document.body).appendChild(p);
              }
              if(p.dataset.expanded==='1'){
                p.style.height='auto';p.style.maxHeight='40vh';p.style.whiteSpace='pre-wrap';p.style.overflow='auto';p.style.wordBreak='break-word';
                p.textContent=[slLastError].concat(slErrorTrace).join('\\n');
              }else{
                p.style.height='28px';p.style.whiteSpace='nowrap';p.style.overflow='hidden';
                p.textContent=slLastError+'  [TAP:DETAILS]';
              }
            }
            function err(t){
              t=String(t);
              if(t!==slLastError){slLastError=t;slErrorTrace=[];}
              renderSlError();
            }
            function errTrace(t){
              if(!slLastError)return;
              if(slErrorTrace.indexOf(t)<0&&slErrorTrace.length<8)slErrorTrace.push(t);
              var p=document.getElementById('slerr');
              if(p&&p.dataset.expanded==='1')renderSlError();
            }'''
          assert src.count(old)==1,('err',src.count(old))
          src=src.replace(old,new,1)
          needle='    if(/SLRUNTIMEERR|SLSCRIPTERR/.test(t))err(t);'
          assert src.count(needle)==1
          src=src.replace(needle,"    if(/SLRUNTIMEERR|SLSCRIPTERR/.test(t))err(t);\n    if(/^SLRUNTIMEBT\\|/.test(t))errTrace(t);",1)
          oldmarker='gameasync/mapping.js?v=v229r1';newmarker='gameasync/mapping.js?v=v229r2'
          assert src.count(oldmarker)==1
          src=src.replace(oldmarker,newmarker,1)
          path.write_text(src,encoding='utf-8')
          print('V229R2_INDEX_SHA',hashlib.sha256(path.read_bytes()).hexdigest())
          PY_INDEX
            python3 - site <<'PY_CACHE'
          from pathlib import Path
          import hashlib,re
          root=Path(__import__('sys').argv[1]);knight=root/'knight';rel='Data/Scripts.rxdata'
          mapping=knight/'gameasync/mapping.js'
          s=mapping.read_text(encoding='utf-8')
          h=hashlib.md5((knight/'gameasync'/rel).read_bytes()).hexdigest()
          s,n=re.subn(re.escape(rel+'?h=')+r'[0-9a-f]{32}',lambda m:rel+'?h='+h,s)
          assert n==1,n
          mapping.write_text(s,encoding='utf-8')
          print('V229R2_MAPPING_SHA',hashlib.sha256(mapping.read_bytes()).hexdigest())
          print('V229R2_SCRIPTS_MD5',h)
          PY_CACHE
          else
            echo V229R2_ALREADY_PATCHED
          fi

      - name: Verify all game files and scroll seam math
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import hashlib,json,re,subprocess,zlib
          root=Path('site')
          old=json.loads(Path('/tmp/slv229_before').read_text())
          new={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if len(new)!=5354 or new.keys()!=old.keys():raise SystemExit('Unexpected file inventory')
          expected={
           'knight/index.html':'f46be32a7c7ca0414d7ac9511926379973dc7c303af2f5dda4eadd443a60ca5b',
           'knight/gameasync/mapping.js':'8f1038ada15642711fa9e46115e560632fbea85a1ee1dfb944a96bb1be931ad6',
           'knight/gameasync/Data/Scripts.rxdata':'9e3eaae707471a9ee395e5ede40b43bc8462f2be137bc9f3ffca484598062630',
           'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata':'bbf5ec438a88f032780f9464a862ca4728f1f34afa1b74053ca7c6a9243ca3ed'
          }
          if any(new.get(k)!=v for k,v in expected.items()):raise SystemExit('Unexpected V229R2 hashes')
          changed={k for k in new if new[k]!=old[k]}
          wanted={'knight/index.html','knight/gameasync/mapping.js','knight/gameasync/Data/Scripts.rxdata'}
          source=Path('/tmp/slv229_source').read_text()
          if (source=='V229R1' and changed!=wanted) or (source=='V229R2' and changed):
           raise SystemExit('Unintended file changes: '+str(sorted(changed)))
          mapping=(root/'knight/gameasync/mapping.js').read_text(encoding='utf-8')
          rel='Data/Scripts.rxdata';md5=hashlib.md5((root/'knight/gameasync'/rel).read_bytes()).hexdigest()
          if mapping.count(rel+'?h='+md5)!=1:raise SystemExit('Broken script mapping')
          index=(root/'knight/index.html').read_text(encoding='utf-8')
          if index.count('gameasync/mapping.js?v=v229r2')!=1:raise SystemExit('Wrong cache marker')
          if 'TAP:DETAILS' not in index or 'SLRUNTIMEBT' not in index:raise SystemExit('Missing full error details')
          for width in (640,800):
           for i in range(320):
            scroll=i*0.5
            seam=min(width,672-int(scroll)%32)
            if width==800 and seam!=672-int(scroll)%32:raise SystemExit('Bad 21 tile seam alignment')
            if not (640<=seam<=width):raise SystemExit('Out of bounds seam')
          print('PASS_V229R2_GEOMETRY_320_SCROLL_SAMPLES')
          print('PASS_V229R2_CHANGED_FILES',len(changed),'UNCHANGED',5354-len(changed))
          PY_FINAL
          ruby - <<'RUBY_VERIFY'
          require 'zlib'
          a=Marshal.load(File.binread('site/knight/gameasync/Data/Scripts.rxdata'))
          raise 'Script count changed' unless a.size==135
          res=Zlib::Inflate.inflate(a[97][2])
          speed=Zlib::Inflate.inflate(a[133][2])
          raise 'Right seam calculation missing' unless res.include?('sl_seam = 672 - (@tilemap.ox.to_i % 32)')
          raise 'Lower tilemap modified' unless res.include?('@tilemap3.ox = @tilemap.ox')&&res.include?('@tilemap4.ox = @tilemap.ox + 640')
          raise 'mruby unsupported keyword remains' if speed.include?('defined?(Guage)')
          raise 'Buff system missing' unless speed.include?('SLV229::Speed')
          puts 'V229R2_RUBY_SCRIPT_STRUCTURE_OK'
          RUBY_VERIFY

      - name: Upload verified game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
