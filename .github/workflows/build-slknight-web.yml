# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R131
# BASE: verified V229R121 with clean original 1F/2F terrain and wall artwork.
# DELETE: unused R42/R44 grid masks, R49 monster sight/path/attack guards,
# native movement overrides, and obsolete per-movement S32 passability search.
# KEEP: RPG's standard Game_Map, Game_Character and Game_Player movement.
# KEEP: original RPG 384/385 map tiles, all non-loot events and R111 respawn.
# KEEP: original 1F/2F graphics, 2F smoke cleanup, wall rendering and 4-way pad.
# NO: invented movement, new collision guard, new map tiles or new runtime hooks.
# DROPS: V4.37 approved per-source rates/quantities only; no other gameplay edits.
name: build-slknight-web.yml | V229R131 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R131 Restore verified smoke-free original game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40641411815
          name: github-pages
          github-token: ${{ github.token }}
          path: original

      - name: V229R131 Check original game and protect all graphics
        shell: bash
        run: |
          set -euo pipefail
          test -s original/artifact.tar
          mkdir -p site build
          tar -xf original/artifact.tar -C site
          python3 - <<'BASE'
          import hashlib,json
          from pathlib import Path
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          assert len(before)==5566,('Unexpected file count',len(before))
          assert before['knight/gameasync/Data/Scripts.rxdata']==\
            '51bbd2b04e5a8e51a7ab95838ba3f7669009ffc1f66c1695c74ed35c6344e7ee'
          assert before['knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap045.rxdata']==\
            'f47de87af6b4e607bf632818a711619dc8ca4e747196a123a76ac7db8ffc3ba6'
          assert before['knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap046.rxdata']==\
            'dc89d908f5247442e08dddc11f5bcf6505a77890bd82ab59b790e00e3e5f024c'
          assert 'V229R121' in (root/'knight/index.html').read_text('utf8')
          Path('build/before.json').write_text(json.dumps(before,sort_keys=True))
          BASE
          cp site/knight/gameasync/Data/Scripts.rxdata build/source-scripts.rxdata

      - name: V229R131 Delete remaining dungeon movement and sight code
        shell: bash
        run: |
          set -euo pipefail
          cat > build/cleanup.rb <<'RUBY'
          # encoding: UTF-8
          require 'zlib'
          source=ARGV.fetch(0)
          destination=ARGV.fetch(1)
          archive=Marshal.load(File.binread(source))
          original=Marshal.load(File.binread(source))
          raise 'Wrong 136 scripts' unless archive.size==136

          def strip(text,first,last,label,replace='')
            first=first.b;last=last.b
            a=text.index(first)
            raise "#{label}: missing start" if a.nil?
            raise "#{label}: duplicate start" if label!='native actor and monster path methods' && text.index(first,a+first.bytesize)
            b=text.index(last,a+first.bytesize)
            raise "#{label}: missing finish" if b.nil?
            [text[0...a]+replace.b+text[b..-1],text[a...b]]
          end

          s21=Zlib::Inflate.inflate(archive[21][2])
          s21,discard=strip(s21,
            '    # V229R42: replace ONLY the static ground-tile passage rule on original',
            '    # 주어진 좌표가 맵외의 경우',
            'obsolete collision interceptor')
          raise 'wrong deleted collision override' unless discard.include?('SLTI_V229R44.allowed?')
          s21,discard=strip(s21,'module SLTI_V229R42\n'.gsub('\\n',"\n"),'class Game_Map', 'obsolete 2 large RGSS direction masks')
          raise 'wrong RGSS graph' unless discard.include?('module SLTI_V229R44')
          raise 'original Game_Map lost' unless s21.include?('tile_id = data[x, y, i]')
          archive[21][2]=Zlib::Deflate.deflate(s21)

          s23=Zlib::Inflate.inflate(archive[23][2])
          s23,discard=strip(s23,
            '    # R49: apply the exact native directional graph to regular dungeon monsters',
            '    # 새로운 좌표를 요구한다',
            'obsolete monster collision interceptor')
          raise 'wrong monster interceptor' unless discard.include?('SLTI_V229R44.allowed?')
          raise 'original actor passability lost' unless s23.include?('$game_map.passable?(x, y, d, self)')
          archive[23][2]=Zlib::Deflate.deflate(s23)

          s134=Zlib::Inflate.inflate(archive[134][2])
          s134,discard=strip(s134,
            '# Any remaining movement query must consult the same native wall-base edges.',
            '# V229R97: 419 corners, 32 bridges, one manual edge; no boot scan.',
            'per-move 81-cell native nearest')
          raise 'wrong per-frame search' unless discard.include?('SLTI_Native66.nearest') && discard.include?('class Game_Map')

          # Preserve original monster identification for R111 respawn, keep wall art.
          s134,discard=strip(s134,'  def self.grid(mid)', "\nclass Game_Character\n  alias slti_r49_original_range", 'R49 unused sight graph', "end\n")
          raise 'wrong LOS graph' unless discard.include?('def self.route?') && discard.include?('SLTI_V229R44')
          s134,discard=strip(s134,"\nclass Game_Character\n  alias slti_r49_original_range", "\n# Guard ACTUAL actor HP damage originating in native monster events.", 'R49 special monster-sight override')
          raise 'wrong monster range' unless discard.include?('first_sight?') && discard.include?('slti_r49_original_range')
          s134,discard=strip(s134,"\n# Guard ACTUAL actor HP damage originating in native monster events.","\n# Floor and wall are separate ORIGINAL textures",'R49 script damage ray guard')
          raise 'wrong script damage guard' unless discard.include?('attack_open?')

          # Delete uncalled native movement graph methods; preserve source nearest ONLY
          # for existing, previously approved random respawn at monster death.
          s134,discard=strip(s134,'  def self.edge?(mid,x,y,dx,dy)','  def self.project(mid,x,y)', 'native movement geometry')
          raise 'wrong path methods' unless discard.include?('def self.move_path?')
          s134,discard=strip(s134,'  def self.native_target(mid,x,y,dir)',"\nend\n\n# Replace the old R42/R44 graph used by monster first-sight/attack ray tests.", 'native actor and monster path methods')
          raise 'wrong native target' unless discard.include?('native_line?')
          s134,discard=strip(s134,"\n# Replace the old R42/R44 graph used by monster first-sight/attack ray tests.","\n# V229R111: select a different traversable position",'unused rays/corner direction overrides')
          raise 'wrong old path append' unless discard.include?('module SLTI_V229R97Corner') && discard.include?('def self.native_target')
          raise 'approved respawn lost' unless s134.include?('module SLTI_R111Respawn') && s134.include?('SLTI_Native66.nearest(mid,x,y,16)')
          raise 'wall graphics lost' unless s134.include?('slti_r49_update_walls') && s134.include?('::PARTS')
          raise 'unused movement code remains' if s134.include?('SLTI_V229R44') || s134.include?('SLTI_V229R97Corner') || s134.include?('native_target') || s134.include?('direct_line?')
          archive[134][2]=Zlib::Deflate.deflate(s134)

          archive.each_with_index do |v,i|
           next if [21,23,134].include?(i)
           raise "Unexpected edited game script #{i}" unless v==original[i]
          end
          File.binwrite(destination,Marshal.dump(archive))
          puts "PASS exact source, original RPG movement all maps, removed obsolete dungeon mover / sight / path"
          puts "PASS original reward, respawn, map rendering and other scripts preserved"
          puts "BYTES script21=#{s21.bytesize} script23=#{s23.bytesize} script134=#{s134.bytesize}"
          RUBY
          ruby -c build/cleanup.rb
          ruby build/cleanup.rb build/source-scripts.rxdata site/knight/gameasync/Data/Scripts.rxdata
          ruby -rzlib -e 'a=Marshal.load(File.binread(ARGV[0]));[21,23,134].each{|i|File.binwrite("build/script#{i}.rb",Zlib::Inflate.inflate(a[i][2]))}' site/knight/gameasync/Data/Scripts.rxdata
          ruby -c build/script21.rb
          ruby -c build/script23.rb
          ruby -c build/script134.rb

      - name: V229R131 Verify vanilla four-direction movement and no side effects
        shell: bash
        run: |
          set -euo pipefail
          cat > build/check.rb <<'CHECK'
          require 'zlib'
          a=Marshal.load(File.binread(ARGV.fetch(0)))
          b=Marshal.load(File.binread(ARGV.fetch(1)))
          changed=(0...a.size).select{|i| a[i]!=b[i]}
          raise 'Unexpected scripts changed' unless changed==[21,23,134]
          scripts={}
          [21,23,134].each{|i|scripts[i]=Zlib::Inflate.inflate(a[i][2])}
          raise 'RPG default map collision missing' unless scripts[21].include?('tile_id = data[x, y, i]')
          raise 'RPG default character movement missing' unless scripts[23].include?('$game_map.passable?(x, y, d, self)')
          raise 'Obsolete R42/R44 movement data remains' if scripts[21].include?('SLTI_V229R44') || scripts[21].include?('SLTI_V229R42')
          raise 'Extra character collision remains' if scripts[23].include?('SLTI_') || scripts[23].include?('== 385')
          raise 'Per-frame native movement override remains' if scripts[134].include?('SLTI_V229R44') || scripts[134].include?('native_target') || scripts[134].include?('slti_native66_prepare') || scripts[134].include?('slti_r49_original_range')
          raise 'Per-frame S32 path detection remains' if scripts[134].include?('first_sight?') || scripts[134].include?('direct_line?')
          raise 'Extra movement passes remain' if scripts[134].include?('alias slti_native66_original_passable')
          raise 'Native nearest may be called outside respawn' unless scripts[134].scan('SLTI_Native66.nearest').length==1
          raise 'Original walls lost' unless scripts[134].include?('slti_r49_update_walls') && scripts[134].include?('SLTI_V229R49::PARTS')
          raise 'Original monster respawn lost' unless scripts[134].include?('module SLTI_R111Respawn')
          raise 'Original rewards lost' unless scripts[134].include?('module SLV541')
          puts 'PASS all standard RPG move directions; removed obsolete dungeon path overrides'
          puts 'PASS original wall rendering, 2F assets and monster respawn code retained'
          CHECK
          ruby build/check.rb site/knight/gameasync/Data/Scripts.rxdata build/source-scripts.rxdata

