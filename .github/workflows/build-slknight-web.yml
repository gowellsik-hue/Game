          ruby - player/index.html <<'RB'
          path = ARGV[0]
          html = File.read(path)

          bridge = <<'JS'
          <script>
          (function(){
            var ch={
              BGM:new Audio(),
              BGS:new Audio()
            };

            var pending=[];

            ch.BGM.loop=true;
            ch.BGS.loop=true;

            function urlFor(n){
              var p=String(n||'')
                .replace(/\\/g,'/')
                .replace(
                  /\.(ogg|mp3|wav|wma|aac|m4a|flac|mid|midi)$/i,
                  ''
                );

              return encodeURI(
                'gameasync/' +
                p +
                '.ogg?v=clean1'
              );
            }

            function safe(a){
              if(!a||!a.src)return;

              try{
                var p=a.play();

                if(p&&p.catch){
                  p.catch(function(){
                    if(pending.indexOf(a)<0){
                      pending.push(a);
                    }
                  });
                }
              }catch(e){
                if(pending.indexOf(a)<0){
                  pending.push(a);
                }
              }
            }

            function retry(){
              var x=pending.slice();

              pending.length=0;
              x.forEach(safe);
            }

            [
              'touchstart',
              'pointerdown',
              'keydown',
              'mousedown'
            ].forEach(function(n){
              window.addEventListener(
                n,
                retry,
                {
                  passive:true
                }
              );
            });

            function stop(k){
              var a=ch[k];

              if(!a)return;

              a.pause();

              try{
                a.currentTime=0;
              }catch(e){}
            }

            function play(k,n,v,p){
              var a=ch[k];

              if(!a||!n)return;

              var u=urlFor(n);

              if(
                a.getAttribute('data-sl-src')!==u
              ){
                a.pause();
                a.src=u;

                a.setAttribute(
                  'data-sl-src',
                  u
                );

                a.load();
              }

              var gain=
                k==='BGS'
                  ?0.20
                  :1;

              a.volume=Math.max(
                0,
                Math.min(
                  1,
                  Number(v||100)/100*gain
                )
              );

              a.playbackRate=Math.max(
                .5,
                Math.min(
                  1.5,
                  Number(p||100)/100
                )
              );

              safe(a);
            }

            function marker(t){
              var i=t.indexOf(
                'SLAUDIO|'
              );

              if(i<0)return;

              var p=t.slice(i).split('|');
              var cmd=p[1]||'';
              var k=cmd.split('_')[0];

              if(/_PLAY$/.test(cmd)){
                play(
                  k,
                  p.slice(2,-2).join('|'),
                  p[p.length-2],
                  p[p.length-1]
                );
              }else if(/_STOP$/.test(cmd)){
                stop(k);
              }else if(/_FADE$/.test(cmd)){
                setTimeout(
                  function(){
                    stop(k);
                  },
                  Number(p[2])||0
                );
              }
            }

            function err(t){
              var p=
                document.getElementById(
                  'slerr'
                );

              if(!p){
                p=document.createElement(
                  'pre'
                );

                p.id='slerr';

                p.style=
                  'position:fixed;' +
                  'left:8px;' +
                  'top:8px;' +
                  'right:8px;' +
                  'max-height:70vh;' +
                  'overflow:auto;' +
                  'z-index:999999;' +
                  'background:#000;' +
                  'color:#fff;' +
                  'border:2px solid #d33;' +
                  'padding:10px;' +
                  'font:14px monospace;' +
                  'white-space:pre-wrap';

                document.body.appendChild(p);
              }

              p.textContent=String(t);
            }

            var log=
              console.log.bind(
                console
              );

            console.log=function(){
              var a=
                [].slice.call(arguments);

              var t=a.join(' ');

              try{
                marker(t);
              }catch(e){
                log(
                  'SLAUDIOJSERR|' +
                  e
                );
              }

              if(
                /SLRUNTIMEERR|SLSCRIPTERR/.test(t)
              ){
                err(t);
              }

              log.apply(
                console,
                a
              );
            };

            window.addEventListener(
              'error',
              function(e){
                err(
                  'JS ERROR | ' +
                  e.message
                );
              }
            );

            window.slAudioBridge=ch;
          })();
          </script>
          JS

          html.sub!(
            '<head>',
            "<head>\n#{bridge}"
          ) or abort 'head target missing'

          pre = <<'JS'.strip
          preRun: [function(){createDummies();window.restoreLocalFilesBeforeRun();[['NanumGothic.ttf','gameasync/Fonts/NanumGothic.ttf?v=clean1'],['NanumGothicBold.ttf','gameasync/Fonts/NanumGothicBold.ttf?v=clean1']].forEach(function(x){var p='/game/Fonts/'+x[0];try{if(FS.analyzePath(p).exists)FS.unlink(p);}catch(e){}FS.createPreloadedFile('/game/Fonts',x[0],x[1],true,true,function(){console.log('SLFONTREADY|'+x[0]);},function(){console.error('SLFONTERR|'+x[0]);});});}],
          JS

          html.sub!(
            'preRun: [createDummies],',
            pre
          ) or abort 'preRun target missing'

          html.sub!(
            'postRun: [loadFiles, preloadInit],',
            'postRun: [preloadInit],'
          ) or abort 'postRun target missing'

          html.sub!(
            /var namespace = '[^']*';/,
            "var namespace = 'slknight_v14_engine';"
          ) or abort 'namespace missing'

          html.sub!(
            /var wTitle = '[^']*'/,
            "var wTitle = 'SLKnight'"
          ) or abort 'title missing'

          html.sub!(
            '<script src="js/dpad.js"></script>',
            '<script src="js/dpad.js?v=clean1"></script>'
          ) or abort 'dpad script missing'

          html.sub!(
            'width="640" height="480"',
            'width="800" height="600"'
          ) or abort 'canvas size missing'

          html.sub!(
            '<div id="ap-a"></div>',
            '<div id="ap-a">I</div>'
          ) or abort 'ap-a missing'

          html.sub!(
            '<div id="ap-ka"></div>',
            '<div id="ap-ka">D</div>'
          ) or abort 'ap-ka missing'

          html.sub!(
            "bindKey('ap-ka', 65);",
            "bindKey('ap-ka', 68);"
          ) or abort 'ap-ka binding missing'

          html.sub!(
            /#apad \* \{\s*border-radius:\s*50%;\s*\}/m,
            "#apad * {\n" \
            "            border-radius: 50%;\n" \
            "            color: white;\n" \
            "            font: bold 14px sans-serif;\n" \
            "            text-align: center;\n" \
            "            line-height: 7vh;\n" \
            "        }\n" \
            "        #ap-c, #ap-b {\n" \
            "            color: transparent;\n" \
            "        }"
          ) or abort 'apad style missing'

          if html.include?(
            '<title>MKXP</title>'
          )
            html.sub!(
              '<title>MKXP</title>',
              '<title>SLKnight</title>'
            )
          end

          File.write(
            path,
            html
          )
          RB

          touch player/.nojekyll

      - name: Self-check clean build
        run: |
          set -e

          test -s player/mkxp.js
          test -s player/mkxp.wasm
          test -s player/gameasync/Data/Scripts.rxdata
          test -s player/gameasync/mapping.js
          test -s player/gameasync/bitmap-map.js

          test ! -e player/core.pack

          test "$(
            find player \
              -maxdepth 1 \
              -type f \
              -name '*.data' |
            wc -l
          )" -eq 0

          grep -Fq \
            'restoreLocalFilesBeforeRun' \
            player/js/drive.js

          grep -Fq \
            "console.log('SLSAVED|' + filename)" \
            player/js/drive.js

          grep -Fq \
            'postRun: [preloadInit]' \
            player/index.html

          node --check player/js/drive.js

          python3 - <<'PY'
          from pathlib import Path

          maps = sorted(
              p
              for p in Path(
                  'player/gameasync/Data'
              ).glob(
                  '*Map*.rxdata'
              )
              if p.is_file()
          )

          manifests = sorted(
              Path(
                  'player/preload/Data'
              ).glob(
                  '*Map*.rxdata.json'
              )
          )

          if not maps or
             len(maps) != len(manifests):
              raise SystemExit(
                  'map manifest mismatch: '
                  f'maps={len(maps)} '
                  f'manifests={len(manifests)}'
              )

          print(
              'MAP_MANIFEST_OK|' +
              str(len(maps))
          )
          PY

          ruby -EUTF-8:UTF-8 -rzlib \
            - player/gameasync/Data/Scripts.rxdata <<'RB'
          scripts =
            Marshal.load(
              File.binread(
                ARGV[0]
              )
            )

          def src(scripts, name)
            entry =
              scripts.find do |e|
                e.is_a?(Array) &&
                  e.length >= 3 &&
                  e[1].to_s == name
              end

            abort "missing #{name}" unless entry

            Zlib::Inflate.inflate(
              entry[2]
            ).force_encoding(
              Encoding::UTF_8
            )
          end

          item =
            src(
              scripts,
              'Scene_Item'
            )

          skill =
            src(
              scripts,
              'Scene_Skill'
            )

          equip =
            src(
              scripts,
              'Scene_Equip'
            )

          map =
            src(
              scripts,
              'Scene_Map'
            )

          save =
            src(
              scripts,
              'Scene_Save'
            )

          main =
            src(
              scripts,
              'Main'
            )

          multi =
            src(
              scripts,
              'Multi-slot script : Windows'
            )

          unless item.include?(
                   'def main'
                 ) &&
                 item.include?(
                   'def dispose'
                 ) &&
                 item.include?(
                   'def update'
                 )
            abort 'item lifecycle broken'
          end

          unless skill.include?(
                   'def main'
                 ) &&
                 skill.include?(
                   'def dispose'
                 ) &&
                 skill.include?(
                   'def update'
                 )
            abort 'skill lifecycle broken'
          end

          if equip.match?(
            /loop do.*?Graphics\.update.*?Input\.update.*?update/m
          )
            abort 'equip blocking loop remains'
          end

          if equip.include?(
            '$game_switches[49] = true'
          )
            abort 'equip switch49 poison remains'
          end

          if equip.include?(
            'Keyboard.testkey(69)'
          )
            abort 'equip E-key escape remains'
          end

          unless equip.include?(
            '@sl_equip_state'
          )
            abort 'equip state refresh missing'
          end

          unless multi.include?(
            'g7_ms_scene_equip_dispose'
          )
            abort 'multislot dispose missing'
          end

          unless map.include?(
                   'def web_pre_update'
                 ) &&
                 map.include?(
                   'def dispose'
                 )
            abort 'map browser lifecycle missing'
          end

          if map.include?(
            'loop do #루프 시작'
          )
            abort 'map blocking main loop remains'
          end

          unless main.include?(
                   'def main_update_loop'
                 ) &&
                 main.include?(
                   'web_pre_update'
                 )
            abort 'browser main loop missing'
          end

          unless save.include?(
                   'file.close'
                 ) &&
                 save.include?(
                   'save_file_async(filename)'
                 )
            abort 'save persistence hook missing'
          end

          menu_count =
            save.scan(
              '$scene = Scene_Menu.new(4)'
            ).size

          map_count =
            save.scan(
              '$scene = Scene_Map.new'
            ).size

          abort 'save menu flow changed' unless menu_count == 2
          abort 'save event flow changed' unless map_count == 2

          puts 'RGSS_SELF_CHECK_OK'
          RB

          ruby - <<'RB'
          module RPG
            class Item
            end

            class AudioFile
            end
          end

          path =
            Dir.glob(
              'player/gameasync/Data/*Items.rxdata'
            ).max_by do |file|
              File.size(file)
            end

          items =
            Marshal.load(
              File.binread(
                path
              )
            )

          unless items[3].instance_variable_get(
            :@common_event_id
          ) == 8
            abort 'courage item CE wrong'
          end

          unless items[17].instance_variable_get(
            :@common_event_id
          ) == 6
            abort 'transform item CE wrong'
          end

          puts 'ITEM_SELF_CHECK_OK'
          RB

          rm -rf player/.git
          du -sh player

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player

  deploy:
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
