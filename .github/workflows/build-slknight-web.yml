
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R146
# SOURCE: Sanctuary S32 Layer3, original R94 RPG tiles and approved R94 direction exceptions
# METHOD: Compare actual (x,y) source values and movement directions; never infer passage from totals.
# APPROVED EXISTING OPENING: Native S32 (32655,32806) / RPG Map045 (88,80), 385 to 384.
# PRESERVE: All other Map045/046 384/385 cells, S32 engine, direction masks, graphics,
#   player controls, spawn, monster events, 2F art and all other maps.
# GAME BASE: Successful V229R142 archive, same preserved base used by V229R143.
# CHANGES FROM V229R145: restore 4 omitted S32_46 Base64 characters in GitHub copy.
# DATA WRAPPING: Exact source bytes preserved; fixed-width lines reduce copy errors.
# NO additional opening or collision changes are authorized.

name: build-slknight-web.yml | V229R146 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R146 Download preserved game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40888976732
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V229R146 Extract and hash unchanged game
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          assert 'V229R142' in (root/'index.html').read_text('utf8')
          assert 'V229R142' in (root/'knight/index.html').read_text('utf8')
          Path('build/before.json').write_text(json.dumps(before,sort_keys=True),'utf8')
          print('PASS preserved V229R142 game and file hash manifest')
          PY

