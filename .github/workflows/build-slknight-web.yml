
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V1.1
# BASE: verified successful run 42124364984
#
# FIX:
# - Remove the failing method-signature parser.
# - Remove fragile indentation-changing heredocs.
# - Patch one exact location in existing move_rate.
# - Reuse native Holy Walk switch 811.
# - Holy Walk: movement x1.33, attack unchanged.
# - No new timers, Game_Player hooks or Interpreter hooks.
# - No polymorph attack-speed changes.
# - No haste/bravery coefficient changes.
# - No attack animation, combat or monster changes.
# - Leave unverified Slow behavior unchanged.
# - Keep version V1.1 on failure.

name: build-slknight-web.yml | V1.1 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Restore last successful game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 42124364984
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify successful baseline
        shell: bash
        run: |
          set -euo pipefail

          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib
          import json

          root = Path('site')

          files = {
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          assert len(files) == 5623, (
              'Baseline inventory', len(files)
          )

          pre = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          data = root / 'knight/gameasync/Data'

          for name in (
              pre + 'Map019.rxdata',
              pre + 'Map025.rxdata',
              pre + 'CommonEvents.rxdata',
              pre + 'Animations.rxdata',
              'Scripts.rxdata'
          ):
              assert (data / name).is_file(), name

          for name in (
              'index.html',
              'knight/index.html',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js'
          ):
              assert (root / name).is_file(), name

          Path('build/original_sha256.json').write_text(
              json.dumps(files),
              encoding='utf-8'
          )

          print('PASS original baseline and inventory')
          PY_BASE

      - name: Apply V1.1 minimal movement fix
        shell: bash
        run: |
          set -euo pipefail

          cat > build/patch_v11.rb <<'END_SPEED_V11'
          require 'zlib'
          require 'digest'

          path = 'site/knight/gameasync/Data/Scripts.rxdata'

          abort 'Missing Scripts.rxdata' unless File.file?(path)

          original_bytes = File.binread(path)
          scripts = Marshal.load(original_bytes)
          original_scripts = Marshal.load(original_bytes)

          abort 'Unexpected Scripts format' unless scripts.is_a?(Array)

          matches = scripts.each_index.select do |i|
            row = scripts[i]
            row.is_a?(Array) &&
              row[1].to_s == 'V229 Unified Speed Rules'
          end

          abort 'Existing speed controller not unique' unless
            matches.length == 1

          index = matches.first
          row = scripts.fetch(index)
          original_source = Zlib::Inflate.inflate(row[2])

          abort 'Original speed module missing' unless
            original_source.include?('module SLV229')

          abort 'Original movement method missing' unless
            original_source.include?('    def self.move_rate')

          abort 'Original attack controller missing' unless
            original_source.include?('    def self.attack_rate')

          abort 'Original morph attack table missing' unless
            original_source.include?('    def self.attack_base_rate')

          abort 'Original attack wait converter missing' unless
            original_source.include?('    def self.convert_attack_wait(')

          # Only the last three lines of the existing
          # move_rate method are replaced.
          # No separate speed method or timer is created.

          before = [
            '      polymorph_rate *= 2.0 if brave_active?',
            '      polymorph_rate',
            '    end'
          ].join("\n")

          after = [
            '      polymorph_rate *= 2.0 if brave_active?',
            '      polymorph_rate *= 1.33 if $game_switches && $game_switches[811]',
            '      polymorph_rate',
            '    end'
          ].join("\n")

          count = original_source.split(before, -1).length - 1

          abort "Original movement mismatch: #{count}" unless
            count == 1

          modified_source = original_source.sub(before, after)

          # Reversing the one substitution must reproduce
          # the original script byte-for-byte.
          abort 'Unapproved code change detected' unless
            modified_source.sub(after, before) == original_source

          abort 'Duplicate movement patch detected' unless
            modified_source.split(after, -1).length - 1 == 1

          # Verify syntax before writing the game database.
          File.binwrite(
            'build/verify_speed_v11.rb',
            modified_source
          )

          abort 'Speed source syntax error' unless
            system('ruby', '-c', 'build/verify_speed_v11.rb')

          # Replace the existing controller entry in place.
          # Do not insert a new script.
          row[2] = Zlib::Deflate.deflate(modified_source)

          abort 'Script count changed' unless
            scripts.length == original_scripts.length

          scripts.each_index do |i|
            next if i == index
            abort "Other script modified: #{i}" unless
              scripts[i] == original_scripts[i]
          end

          File.binwrite(path, Marshal.dump(scripts))

          # Read back the actual saved game database.
          saved = Marshal.load(File.binread(path))

          abort 'Saved script count mismatch' unless
            saved.length == original_scripts.length

          saved_source = Zlib::Inflate.inflate(
            saved.fetch(index)[2]
          )

          abort 'Saved speed code mismatch' unless
            saved_source == modified_source

          abort 'Attack or morph source changed' unless
            saved_source.sub(after, before) == original_source

          saved.each_index do |i|
            next if i == index
            abort "Saved script modified: #{i}" unless
              saved[i] == original_scripts[i]
          end

          puts 'PASS V1.1 single movement calculation patch'
          puts 'PASS native Holy Walk switch 811 reused'
          puts 'PASS original morph attack speeds unchanged'
          puts 'PASS original attack frame conversion unchanged'
          puts 'PASS original haste and bravery unchanged'
          puts 'PASS no new update hook or status timer'
          puts 'PASS all other RPG scripts preserved'
          END_SPEED_V11

          ruby -c build/patch_v11.rb
          ruby build/patch_v11.rb

      - name: Refresh mapping and visible V1.1
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY_VERSION'
          from pathlib import Path
          import hashlib
          import re

          root = Path('site')
          data = root / 'knight/gameasync/Data'
          mapping = root / 'knight/gameasync/mapping.js'

          content = mapping.read_text('utf-8')

          script_file = data / 'Scripts.rxdata'
          digest = hashlib.md5(
              script_file.read_bytes()
          ).hexdigest()

          pattern = (
              re.escape('Data/Scripts.rxdata') +
              r'\?h=[0-9a-f]{32}'
          )

          replacement = 'Data/Scripts.rxdata?h=' + digest

          content, count = re.subn(
              pattern,
              replacement,
              content
          )

          assert count == 1, (
              'Scripts mapping mismatch', count
          )

          mapping.write_text(content, encoding='utf-8')

          loader = root / 'knight/js/sl-assets-v229r115.js'
          loader_text = loader.read_text('utf-8')

          versions = re.findall(
              r"var version='([^']+)';",
              loader_text
          )

          assert len(versions) == 1, (
              'Loader version mismatch', versions
          )

          old_version = versions[0]

          loader_text = loader_text.replace(
              "var version='" + old_version + "';",
              "var version='V1.1';"
          )

          assert loader_text.count(
              "var version='V1.1';"
          ) == 1

          loader.write_text(
              loader_text,
              encoding='utf-8'
          )

          for filename in ('index.html', 'knight/index.html'):
              path = root / filename
              html = path.read_text('utf-8')

              assert old_version in html, (
                  'Original display version missing', filename
              )

              html = html.replace(old_version, 'V1.1')

              html = html.replace(
                  '?v=' + old_version.lower(),
                  '?v=v1.1'
              )

              path.write_text(html, encoding='utf-8')

              assert 'V1.1' in path.read_text('utf-8')

          print('PASS V1.1 displayed')
          print('PASS script mapping hash refreshed')
          PY_VERSION

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Verify exact V1.1 modification scope
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY_FINAL'
          from pathlib import Path
          import hashlib
          import json

          root = Path('site')

          original = json.loads(
              Path('build/original_sha256.json').read_text(
                  encoding='utf-8'
              )
          )

          current = {
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          assert len(current) == 5623, (
              'Original file count changed'
          )

          assert set(original) == set(current), (
              'Original file names changed'
          )

          changed = {
              name for name in original
              if original[name] != current[name]
          }

          allowed = {
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html',
              'knight/index.html'
          }

          assert changed == allowed, (
              'Unexpected changes',
              sorted(changed ^ allowed)
          )

          for filename in ('index.html', 'knight/index.html'):
              assert 'V1.1' in (
                  root / filename
              ).read_text('utf-8'), filename

          print('PASS only five approved files changed')
          print('PASS all CommonEvents unchanged')
          print('PASS native Holy Walk event unchanged')
          print('PASS original monster maps unchanged')
          print('PASS Queen recovery and death unchanged')
          print('PASS four-direction passage unchanged')
          print('PASS original morph and attack data unchanged')
          print('PASS V1.1 structural verification')
          PY_FINAL

      - name: Publish V1.1 game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
