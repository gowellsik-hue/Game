name: Deploy SLKnight mkxp-web NATIVE PLANE V9B

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-slknight-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  LIVE_MKXP_REF: 07e1519f9a2b9100512c567e97455fa3c77a3221

jobs:
  build:
    name: Build SLKnight NATIVE PLANE V9B
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Install tools
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            unzip \
            ruby \
            python3 \
            ffmpeg \
            imagemagick \
            file \
            timidity \
            freepats

      - name: Checkout exact working mkxp-web
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.LIVE_MKXP_REF }}
          path: player
          sparse-checkout: |
            index.html
            js
            manifest.webmanifest
            mkxp.js
            mkxp.wasm
          sparse-checkout-cone-mode: false

      - name: Checkout mkxp-web tools
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: master
          path: mkxp-tools
          sparse-checkout: |
            COPYING
            extra/rgss.rb
            extra/make_mapping.sh
          sparse-checkout-cone-mode: false

      - name: Verify exact working engine
        run: |
          set -e

          ACTUAL_REF="$(git -C player rev-parse HEAD)"

          echo "ENGINE_REF=${ACTUAL_REF}"

          test "${ACTUAL_REF}" = "${LIVE_MKXP_REF}"

          JS_SIZE="$(stat -c '%s' player/mkxp.js)"
          WASM_SIZE="$(stat -c '%s' player/mkxp.wasm)"

          echo "mkxp.js=${JS_SIZE}"
          echo "mkxp.wasm=${WASM_SIZE}"

          test "${JS_SIZE}" = "290574"
          test "${WASM_SIZE}" = "5217852"

          test -s player/js/drive.js
          test -s player/js/dpad.js
          test -s player/js/localforage.min.js

          echo "LIVE_ENGINE_OK"

      - name: Download clean SLKnight
        run: |
          set -e

          curl -L \
            --fail \
            --retry 3 \
            -o slknight.zip \
            "${GAME_URL}"

          echo "${GAME_SHA256}  slknight.zip" \
            | sha256sum -c -

          rm -rf game
          mkdir -p game

          unzip -q \
            slknight.zip \
            -d game

          test -f \
            game/SLKnight_Android_JoiPlay/Game.ini

          echo "SLKNIGHT_DOWNLOAD_OK"

      - name: Install SLKnight data
        run: |
          set -e

          rm -rf \
            player/gameasync \
            player/preload

          mkdir -p \
            player/gameasync \
            player/preload

          cp -a \
            game/SLKnight_Android_JoiPlay/. \
            player/gameasync/

          cp \
            mkxp-tools/extra/rgss.rb \
            player/gameasync/rgss.rb

          cp \
            mkxp-tools/COPYING \
            player/COPYING-mkxp-web.txt

          rm -f \
            player/gameasync/README_Android.txt

          echo "SLKNIGHT_DATA_OK"

      - name: Convert RGSS and patch native Plane conflict
        run: |
          set -e

          ruby -rzlib - <<'RB'
          game_dir = 'player/gameasync'
          ini_path = File.join(game_dir, 'Game.ini')

          ini = File.binread(ini_path)

          scripts_rel = ini[/^Scripts=(.+)$/i, 1]

          abort 'Scripts entry missing' if scripts_rel == nil

          scripts_rel =
            scripts_rel
              .strip
              .tr('\\', '/')

          scripts_path =
            File.join(
              game_dir,
              scripts_rel
            )

          abort "Scripts missing: #{scripts_path}" \
            unless File.file?(scripts_path)

          scripts =
            Marshal.load(
              File.binread(scripts_path)
            )

          web_compat = <<'RUBY'
          puts("SLLOAD|000|WEB_COMPAT")

          class Win32API
            def initialize(*args)
            end

            def call(*args)
              0
            end

            def Call(*args)
              call(*args)
            end
          end
          RUBY

          scripts.insert(
            0,
            [
              0,
              'Web Compatibility',
              Zlib::Deflate.deflate(
                web_compat
              )
            ]
          )

          def patch_begin_until(source)
            lines = source.lines
            changed = 0
            i = 0

            while i < lines.length
              match =
                lines[i].match(
                  /^(\s*)end\s+until\s+(.+?)\s*$/
                )

              if match
                indent = match[1]
                condition = match[2]
                j = i - 1

                while j >= 0
                  if (
                    lines[j][/^\s*/] == indent &&
                    lines[j].strip == 'begin'
                  )
                    lines[j] =
                      indent +
                      "loop do\n"

                    lines[i] =
                      indent +
                      "  break if " +
                      condition +
                      "\n" +
                      indent +
                      "end\n"

                    changed += 1
                    break
                  end

                  j -= 1
                end
              end

              i += 1
            end

            [
              lines.join,
              changed
            ]
          end

          def patch_scene_loops(source)
            lines = source.lines
            changed = 0
            i = 0

            while i < lines.length
              unless lines[i].strip == 'loop do'
                i += 1
                next
              end

              indent =
                lines[i][/^\s*/]

              significant = []
              k = i + 1

              while (
                k < lines.length &&
                significant.length < 8
              )
                stripped =
                  lines[k].strip

                unless (
                  stripped.empty? ||
                  stripped.start_with?('#')
                )
                  significant << [
                    k,
                    stripped,
                    lines[k][/^\s*/]
                  ]
                end

                k += 1
              end

              end_index = nil

              if (
                significant.length >= 7 &&
                significant[0][1] == 'Graphics.update' &&
                significant[1][1] == 'Input.update' &&
                significant[2][1] == 'update' &&
                significant[3][1] == 'if $scene != self' &&
                significant[4][1] == 'break' &&
                significant[5][1] == 'end' &&
                significant[6][1] == 'end' &&
                significant[6][2] == indent
              )
                end_index =
                  significant[6][0]

              elsif (
                significant.length >= 5 &&
                significant[0][1] == 'Graphics.update' &&
                significant[1][1] == 'Input.update' &&
                significant[2][1] == 'update' &&
                significant[3][1] == 'break if $scene != self' &&
                significant[4][1] == 'end' &&
                significant[4][2] == indent
              )
                end_index =
                  significant[4][0]
              end

              if end_index != nil
                lines[i..end_index] = [
                  indent +
                  "end\n\n" +
                  indent +
                  "def dispose\n"
                ]

                changed += 1
                i += 1
                next
              end

              i += 1
            end

            [
              lines.join,
              changed
            ]
          end

          scene_loop_count = 0
          begin_until_count = 0
          plane_patch_count = 0

          scripts.each_with_index do |entry, index|
            next unless (
              entry.is_a?(Array) &&
              entry.length >= 3
            )

            name =
              entry[1].to_s

            begin
              source =
                Zlib::Inflate.inflate(
                  entry[2]
                )
            rescue
              next
            end

            if (
              name == '포그 수정' ||
              source.match?(
                /^\s*class\s+Plane\s*<\s*Sprite\b/
              )
            )
              puts(
                "PATCH_NATIVE_PLANE=" +
                name
              )

              source = <<'RUBY'
          puts("SLPATCH|NATIVE_PLANE_ACTIVE")

          # mkxp-web already supplies the native RGSS Plane class.
          # SLKnight's legacy Plane < Sprite replacement is disabled.
          RUBY

              plane_patch_count += 1
            end

            patched = source.dup

            patched, count =
              patch_begin_until(
                patched
              )

            begin_until_count +=
              count

            unless name == 'Main'
              patched, count =
                patch_scene_loops(
                  patched
                )

              scene_loop_count +=
                count
            end

            if name == 'Main'
              browser_loop = <<'RUBY'
          $prev_scene = nil
          $sl_last_scene_name = nil

          def main_update_loop
            begin

              if $scene != nil

                current_scene_name =
                  $scene.class.to_s

                if (
                  $sl_last_scene_name !=
                  current_scene_name
                )
                  puts(
                    "SLFRAME|" +
                    current_scene_name
                  )

                  $sl_last_scene_name =
                    current_scene_name
                end

                if $scene != $prev_scene

                  if (
                    $prev_scene != nil &&
                    $prev_scene.respond_to?(:dispose)
                  )
                    $prev_scene.dispose
                  end

                  puts(
                    "SLMAINCALL|" +
                    current_scene_name
                  )

                  $scene.main

                  puts(
                    "SLMAINREADY|" +
                    current_scene_name
                  )

                  $prev_scene =
                    $scene
                end

                Graphics.update
                Input.update
                $scene.update

              else

                puts(
                  "SLRUNTIMEERR|SCENE_NIL"
                )

                raise "END"
              end

            rescue Exception => e

              puts(
                "SLRUNTIMEERR|" +
                e.class.to_s +
                "|" +
                e.message.to_s
              )

            end
          end
          RUBY

              unless patched.include?(
                'def main_update_loop'
              )
                patched =
                  browser_loop +
                  patched
              end

              patched.sub!(
                /\n\s*while\s+\$scene\s*!=\s*nil\s*\r?\n\s*\$scene\.main\s*\r?\n\s*end\s*/m,
                "\n"
              )

              patched.gsub!(
                '$scene = Scene_Title.new',
                "$scene = Scene_Title.new\nputs(\"SLMAIN|SCENE_TITLE_CREATED\")"
              )
            end

            trace_index =
              format(
                '%03d',
                index
              )

            patched =
              "puts(\"SLLOAD|#{trace_index}\")\n" +
              patched

            entry[1] =
              trace_index +
              "|" +
              name

            entry[2] =
              Zlib::Deflate.deflate(
                patched
              )
          end

          abort 'Native Plane patch not applied' \
            unless plane_patch_count == 1

          main =
            scripts.find do |entry|
              entry[1].to_s.end_with?(
                '|Main'
              )
            end

          abort 'Main script missing' \
            if main == nil

          main_source =
            Zlib::Inflate.inflate(
              main[2]
            )

          abort 'main_update_loop missing' \
            unless main_source.b.include?(
              'def main_update_loop'.b
            )

          target_scripts =
            File.join(
              game_dir,
              'Data',
              'Scripts.rxdata'
            )

          File.binwrite(
            target_scripts,
            Marshal.dump(
              scripts
            )
          )

          unless (
            File.expand_path(scripts_path) ==
            File.expand_path(target_scripts)
          )
            File.delete(
              scripts_path
            )
          end

          ini_lines =
            ini.split(
              /\r?\n/
            )

          ini_lines.map! do |line|
            if line =~ /^Scripts=/i
              'Scripts=Data\Scripts.rxdata'

            elsif line =~ /^Title=/i
              'Title=SLKnight'

            else
              line
            end
          end

          File.binwrite(
            ini_path,
            ini_lines.join(
              "\r\n"
            ) +
            "\r\n"
          )

          puts(
            "SCRIPT_COUNT=" +
            scripts.length.to_s
          )

          puts(
            "NATIVE_PLANE_PATCHED=" +
            plane_patch_count.to_s
          )

          puts(
            "SCENE_LOOPS_PATCHED=" +
            scene_loop_count.to_s
          )

          puts(
            "BEGIN_UNTIL_PATCHED=" +
            begin_until_count.to_s
          )

          puts(
            "SLKNIGHT_V9B_SCRIPT_PATCH_OK"
          )
          RB

      - name: Verify V9B script archive
        run: |
          set -e

          test -s \
            player/gameasync/Data/Scripts.rxdata

          grep -Fq \
            'Scripts=Data\Scripts.rxdata' \
            player/gameasync/Game.ini

          ruby -rzlib - <<'RB'
          scripts =
            Marshal.load(
              File.binread(
                'player/gameasync/Data/Scripts.rxdata'
              )
            )

          puts(
            "SCRIPT_ARCHIVE_COUNT=" +
            scripts.length.to_s
          )

          abort 'Too few scripts' \
            if scripts.length < 100

          native_plane_found =
            false

          old_plane_found =
            false

          frame_trace_found =
            false

          main_loop_found =
            false

          scripts.each do |entry|
            next unless (
              entry.is_a?(Array) &&
              entry.length >= 3
            )

            begin
              source =
                Zlib::Inflate.inflate(
                  entry[2]
                )
            rescue
              next
            end

            binary =
              source.b

            if binary.include?(
              'NATIVE_PLANE_ACTIVE'.b
            )
              native_plane_found =
                true
            end

            if binary.match?(
              /class\s+Plane\s*<\s*Sprite/n
            )
              old_plane_found =
                true
            end

            if binary.include?(
              'SLFRAME|'.b
            )
              frame_trace_found =
                true
            end

            if binary.include?(
              'def main_update_loop'.b
            )
              main_loop_found =
                true
            end
          end

          abort 'Native Plane marker missing' \
            unless native_plane_found

          abort 'Old Plane subclass still present' \
            if old_plane_found

          abort 'Frame trace missing' \
            unless frame_trace_found

          abort 'Browser main loop missing' \
            unless main_loop_found

          puts(
            'NATIVE_PLANE_MARKER_OK'
          )

          puts(
            'OLD_PLANE_CLASS_REMOVED'
          )

          puts(
            'FRAME_TRACE_OK'
          )

          puts(
            'MAIN_LOOP_OK'
          )

          puts(
            'V9B_SCRIPT_ARCHIVE_VERIFY_OK'
          )
          RB

      - name: Convert audio to OGG
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          root = Path(
              "player/gameasync/Audio"
          )

          if not root.exists():
              print(
                  "AUDIO_DIRECTORY_NOT_PRESENT"
              )
              raise SystemExit(0)

          convertible = {
              ".mp3",
              ".wav",
              ".wma",
              ".aac",
              ".m4a",
              ".flac",
              ".mid",
              ".midi",
          }

          midi_exts = {
              ".mid",
              ".midi",
          }

          files = [
              path
              for path in root.rglob("*")
              if (
                  path.is_file()
                  and
                  path.suffix.lower()
                  in convertible
              )
          ]

          print(
              "AUDIO_FILES_TO_CONVERT="
              + str(len(files))
          )

          converted = 0
          failures = []

          for src in files:
              ext = src.suffix.lower()
              out = src.with_suffix(".ogg")
              temp_wav = None

              try:
                  source_for_ffmpeg = src

                  if ext in midi_exts:
                      temp_wav = src.with_name(
                          src.name +
                          ".mkxpweb.wav"
                      )

                      subprocess.run(
                          [
                              "timidity",
                              str(src),
                              "-Ow",
                              "-o",
                              str(temp_wav),
                          ],
                          check=True,
                      )

                      source_for_ffmpeg = temp_wav

                  subprocess.run(
                      [
                          "ffmpeg",
                          "-nostdin",
                          "-v",
                          "error",
                          "-y",
                          "-i",
                          str(source_for_ffmpeg),
                          "-c:a",
                          "libvorbis",
                          "-q:a",
                          "4",
                          str(out),
                      ],
                      check=True,
                  )

                  if (
                      not out.exists()
                      or
                      out.stat().st_size == 0
                  ):
                      raise RuntimeError(
                          "OGG output missing: "
                          + str(out)
                      )

                  if (
                      temp_wav is not None
                      and
                      temp_wav.exists()
                  ):
                      temp_wav.unlink()

                  if (
                      src.exists()
                      and
                      src != out
                  ):
                      src.unlink()

                  converted += 1

              except Exception as exc:
                  failures.append(
                      (
                          str(src),
                          str(exc),
                      )
                  )

                  if (
                      temp_wav is not None
                      and
                      temp_wav.exists()
                  ):
                      temp_wav.unlink()

          if failures:
              print(
                  "AUDIO CONVERSION FAILURES:",
                  file=sys.stderr,
              )

              for name, error in failures:
                  print(
                      name +
                      " -> " +
                      error,
                      file=sys.stderr,
                  )

              raise SystemExit(1)

          remaining = [
              str(path)
              for path in root.rglob("*")
              if (
                  path.is_file()
                  and
                  path.suffix.lower()
                  in convertible
              )
          ]

          if remaining:
              print(
                  "UNCONVERTED AUDIO:",
                  file=sys.stderr,
              )

              for path in remaining:
                  print(
                      path,
                      file=sys.stderr,
                  )

              raise SystemExit(1)

          print(
              "AUDIO_CONVERTED="
              + str(converted)
          )

          print(
              "AUDIO_CONVERSION_OK"
          )
          PY

      - name: Convert unsupported images to PNG
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          root = Path(
              "player/gameasync/Graphics"
          )

          if not root.exists():
              print(
                  "GRAPHICS_DIRECTORY_NOT_PRESENT"
              )
              raise SystemExit(0)

          convertible = {
              ".bmp",
              ".gif",
              ".webp",
              ".tif",
              ".tiff",
          }

          files = [
              path
              for path in root.rglob("*")
              if (
                  path.is_file()
                  and
                  path.suffix.lower()
                  in convertible
              )
          ]

          print(
              "IMAGE_FILES_TO_CONVERT="
              + str(len(files))
          )

          failures = []
          converted = 0

          for src in files:
              out = src.with_suffix(
                  ".png"
              )

              try:
                  subprocess.run(
                      [
                          "convert",
                          str(src) + "[0]",
                          str(out),
                      ],
                      check=True,
                  )

                  if (
                      not out.exists()
                      or
                      out.stat().st_size == 0
                  ):
                      raise RuntimeError(
                          "PNG output missing: "
                          + str(out)
                      )

                  if src.exists():
                      src.unlink()

                  converted += 1

              except Exception as exc:
                  failures.append(
                      (
                          str(src),
                          str(exc),
                      )
                  )

          if failures:
              print(
                  "IMAGE CONVERSION FAILURES:",
                  file=sys.stderr,
              )

              for name, error in failures:
                  print(
                      name +
                      " -> " +
                      error,
                      file=sys.stderr,
                  )

              raise SystemExit(1)

          print(
              "IMAGES_CONVERTED="
              + str(converted)
          )

          print(
              "IMAGE_CONVERSION_OK"
          )
          PY

      - name: Generate async filesystem mapping
        run: |
          set -e

          cd player/gameasync

          bash \
            ../../mkxp-tools/extra/make_mapping.sh

          test -s mapping.js
          test -s bitmap-map.js

          echo "MAPPING_OK"

      - name: Create map preload files
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          data_root = Path(
              "player/gameasync/Data"
          )

          preload_root = Path(
              "player/preload/Data"
          )

          preload_root.mkdir(
              parents=True,
              exist_ok=True,
          )

          count = 0

          for source in sorted(
              data_root.glob(
                  "Map*.rxdata"
              )
          ):
              target = (
                  preload_root
                  /
                  (
                      source.name +
                      ".json"
                  )
              )

              target.write_text(
                  "[]\n",
                  encoding="utf-8",
              )

              count += 1

          print(
              "MAP_PRELOAD_FILES="
              + str(count)
          )
          PY

      - name: Add V9B trace panel
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "player/index.html"
          )

          html = path.read_text(
              encoding="utf-8"
          )

          trace_script = r'''
          <script>
          (function () {

              function panel() {
                  var p =
                      document.getElementById(
                          'sl-trace'
                      );

                  if (p) {
                      return p;
                  }

                  p =
                      document.createElement(
                          'pre'
                      );

                  p.id =
                      'sl-trace';

                  p.style.position =
                      'fixed';

                  p.style.left =
                      '8px';

                  p.style.top =
                      '34px';

                  p.style.right =
                      '8px';

                  p.style.maxHeight =
                      '58vh';

                  p.style.overflow =
                      'auto';

                  p.style.zIndex =
                      '99999999';

                  p.style.padding =
                      '10px';

                  p.style.margin =
                      '0';

                  p.style.background =
                      'rgba(0,0,0,.90)';

                  p.style.color =
                      'white';

                  p.style.fontSize =
                      '13px';

                  p.style.fontFamily =
                      'monospace';

                  p.style.whiteSpace =
                      'pre-wrap';

                  p.style.display =
                      'none';

                  document.body.appendChild(
                      p
                  );

                  return p;
              }

              function log(
                  value,
                  force
              ) {
                  var text =
                      String(value);

                  var useful =
                      (
                          /SLLOAD\|/.test(text) ||
                          /SLPATCH\|/.test(text) ||
                          /SLMAIN\|/.test(text) ||
                          /SLMAINCALL\|/.test(text) ||
                          /SLMAINREADY\|/.test(text) ||
                          /SLFRAME\|/.test(text) ||
                          /SLRUNTIMEERR\|/.test(text) ||
                          / - err/.test(text) ||
                          /error/i.test(text) ||
                          /exception/i.test(text) ||
                          /PHYSFS/i.test(text) ||
                          /NO SUCH FILE/i.test(text)
                      );

                  if (
                      !force &&
                      !useful
                  ) {
                      return;
                  }

                  var p =
                      panel();

                  p.style.display =
                      'block';

                  var old =
                      p.textContent || '';

                  if (old) {
                      old += '\n';
                  }

                  old += text;

                  if (
                      old.length >
                      16000
                  ) {
                      old =
                          old.slice(
                              -16000
                          );
                  }

                  p.textContent =
                      old;

                  p.scrollTop =
                      p.scrollHeight;
              }

              function badge() {
                  var b =
                      document.createElement(
                          'div'
                      );

                  b.textContent =
                      'V9B';

                  b.style.position =
                      'fixed';

                  b.style.top =
                      '6px';

                  b.style.right =
                      '6px';

                  b.style.zIndex =
                      '99999998';

                  b.style.background =
                      'rgba(0,0,0,.7)';

                  b.style.color =
                      'white';

                  b.style.font =
                      '12px monospace';

                  b.style.padding =
                      '4px 7px';

                  b.style.borderRadius =
                      '4px';

                  document.body.appendChild(
                      b
                  );
              }

              document.addEventListener(
                  'DOMContentLoaded',
                  badge
              );

              var oldLog =
                  console.log.bind(
                      console
                  );

              console.log =
                  function () {
                      var args =
                          Array.prototype.slice.call(
                              arguments
                          );

                      oldLog.apply(
                          console,
                          args
                      );

                      log(
                          args.join(' '),
                          false
                      );
                  };

              var oldError =
                  console.error.bind(
                      console
                  );

              console.error =
                  function () {
                      var args =
                          Array.prototype.slice.call(
                              arguments
                          );

                      oldError.apply(
                          console,
                          args
                      );

                      log(
                          args.join(' '),
                          true
                      );
                  };

              window.addEventListener(
                  'error',
                  function (e) {
                      log(
                          'JS ERROR | ' +
                          String(
                              e.message
                          ) +
                          ' | ' +
                          String(
                              e.filename || ''
                          ) +
                          ':' +
                          String(
                              e.lineno || ''
                          ) +
                          ':' +
                          String(
                              e.colno || ''
                          ),
                          true
                      );

                      if (
                          e.error !==
                          undefined
                      ) {
                          log(
                              'JS VALUE | ' +
                              String(
                                  e.error
                              ),
                              true
                          );
                      }
                  }
              );

              window.addEventListener(
                  'unhandledrejection',
                  function (e) {
                      log(
                          'PROMISE ERROR | ' +
                          String(
                              e.reason
                          ),
                          true
                      );
                  }
              );

          })();
          </script>
          '''

          html =
              html.replace(
                  "<head>",
                  "<head>\n" +
                  trace_script,
                  1,
              )

          html, c1 =
              re.subn(
                  r"var namespace = '[^']*';",
                  "var namespace = 'slknight_native_plane_v9b';",
                  html,
                  count=1,
              )

          html, c2 =
              re.subn(
                  r"var wTitle = '[^']*'\s*;?",
                  "var wTitle = 'SLKnight';",
                  html,
                  count=1,
              )

          html =
              html.replace(
                  "<title>MKXP</title>",
                  "<title>SLKnight V9B</title>",
                  1,
              )

          if c1 != 1:
              raise SystemExit(
                  "namespace patch failed"
              )

          if c2 != 1:
              raise SystemExit(
                  "title patch failed"
              )

          path.write_text(
              html,
              encoding="utf-8",
          )

          print(
              "V9B_TRACE_PANEL_OK"
          )
          PY

          touch player/.nojekyll

      - name: Verify final V9B package
        run: |
          set -e

          test -s player/index.html
          test -s player/mkxp.js
          test -s player/mkxp.wasm

          test -s player/js/drive.js
          test -s player/js/dpad.js
          test -s player/js/localforage.min.js

          test -s player/gameasync/Game.ini
          test -s player/gameasync/rgss.rb

          test -s player/gameasync/mapping.js
          test -s player/gameasync/bitmap-map.js

          test -s \
            player/gameasync/Data/Scripts.rxdata

          grep -Fq \
            "slknight_native_plane_v9b" \
            player/index.html

          grep -Fq \
            "V9B" \
            player/index.html

          test "$(
            stat -c '%s' \
              player/mkxp.js
          )" = "290574"

          test "$(
            stat -c '%s' \
              player/mkxp.wasm
          )" = "5217852"

          rm -rf player/.git

          echo
          echo "========================================"
          echo " SLKNIGHT NATIVE PLANE V9B READY"
          echo "========================================"
          echo

          du -sh player

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player

  deploy:
    name: Deploy GitHub Pages

    needs:
      - build

    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
