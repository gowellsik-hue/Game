name: build-slknight-web.yml | V4.1 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Restore exact successful V3.14 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45516384358
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify exact V3.14 baseline
        shell: bash
        run: |
          set -euo pipefail

          test -s baseline/artifact.tar
          mkdir -p site
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root=Path('site')

          before={
              str(p.relative_to(root)):hashlib.sha256(
                  p.read_bytes()
              ).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          assert len(before)==6018,len(before)

          loader=root/'knight/js/sl-assets-v229r115.js'

          assert loader.read_bytes().count(
              b"var version='V3.14';"
          )==1

          for name in ('index.html','knight/index.html'):
              assert b'V3.14' in (root/name).read_bytes()

          Path('/tmp/sl-v41-before.json').write_text(
              json.dumps(before,sort_keys=True),
              'utf8'
          )

          print('PASS exact V3.14 baseline')
          print('PASS original files',len(before))
          PY

