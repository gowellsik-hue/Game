
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R48
# BASE: actually deployed and successful V229R44 run 39598356143; NEVER build on broken R45/R46/R47.
# ORIGINAL GRAPHICS: Sanctuary V4.1 authentic paired full and pre-floorfill source tiles.
# Actual wall alpha mask and original foreground textures; NO 16x16 collision-square cutting.
# ORIGINAL GAME: keep R44 dungeon monster 106 events, Baphomet ID13 (156,100),
# walls/passability, events/stairs, all mobile controls, art, audio and other maps.
# FIX: remove PLAYER opacity modification; fade actual foreground WALL sprites only.
# FIX: first monster aggro requires traversable native R44 path, no deaggro after corner.
# FIX: monster-driven actor HP damage guarded against direct wall penetration.
# R44 wall movement graph unchanged; pixel-perfect Sanctuary client collision not proven.
# No game2 modifications. No new engine, no unrelated workflow modifications.
name: build-slknight-web.yml | V229R48 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R48 Restore approved 106-monster R44 website
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39598356143
          name: github-pages
          github-token: ${{ github.token }}
          path: r44

      - name: V229R48 Restore actual R44 collision graph; do not weaken wall passage
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39598356143
          name: SLKnight-V229R44-Wall-Collision-Player-Translucency-106-Monsters
          github-token: ${{ github.token }}
          path: r44-masks

      - name: V229R48 Restore Sanctuary original paired wall and floor source images
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39100619927
          name: Sanctuary-TI-Dungeon-V4.1-Original-Terrain-Walk
          github-token: ${{ github.token }}
          path: sanctuary-source

      - name: V229R48 Verify original R44 before any source modification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s r44/artifact.tar
          test -s sanctuary-source/preview/terrain-walk-v4.1.html
          test -s sanctuary-source/preview/baseline/tiles/1/7ffe8000.png
          tar -xf r44/artifact.tar -C site
          cp r44-masks/r44-map-45-edges.bin build/
          cp r44-masks/r44-map-46-edges.bin build/
          python3 - <<'R48_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site');pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          expected={'Data/Scripts.rxdata':'82c10608c869bdb25dfd9056fa1e2c9c11d9071a682e45ba4428e5b48c11974f',
            f'Data/{pre}Map045.rxdata':'611b55b73d42d96f6527d3e97d0abd562efdc538391a91b4893f50e9fd117a7c',
            f'Data/{pre}Map046.rxdata':'554ed7c437238f27f33f1073e6e286a83aa1736dcbf4c95229bb30cfdfe03c5a'}
          for name,h in expected.items():
              file=root/'knight/gameasync'/name
              assert file.exists() and hashlib.sha256(file.read_bytes()).hexdigest()==h,name
          for mid,size in [(45,288*144),(46,336*168)]:
              assert (Path('build')/f'r44-map-{mid}-edges.bin').stat().st_size==size
          base={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(base)==5472,len(base)
          assert 'V229R44' in (root/'index.html').read_text('utf-8')
          (Path('build')/'r48-baseline.json').write_text(json.dumps(base,sort_keys=True))
          print('PASS R48 R44 original baseline: 5,472 files, two maps, native passage data preserved')
          R48_BASE

      - name: V229R48 Split ORIGINAL Sanctuary wall pixels from original ground without rectangular masks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check Pillow numpy opencv-python-headless
          cat > /tmp/r48-layers.py <<'R48_EMBEDDED'
          #!/usr/bin/env python3
          """Reconstruct aligned original Sanctuary floor and wall layers from V4.1's paired
          full and pre-floorfill image sheets; never use RPG tile squares for wall opacity.
          """
          import io, json, re, sys, zipfile, hashlib
          from pathlib import Path
          import cv2
          import numpy as np
          from PIL import Image

          site=Path(sys.argv[1]); reports=Path(sys.argv[2]); input_path=Path(sys.argv[3])
          if input_path.is_dir():
              class OriginalArchive:
                  def read(self,name):
                      return (input_path/name).read_bytes()
              source=OriginalArchive()
          else:
              source=zipfile.ZipFile(input_path)
          reports.mkdir(parents=True,exist_ok=True)
          pano=site/'knight/gameasync/Graphics/Panoramas'
          html=source.read('preview/terrain-walk-v4.1.html').decode('utf-8')
          metadata=json.loads(re.search(r'<script id="data" type="application/json">(.*?)</script>',html,re.S).group(1))
          record={'version':'V229R48','source':'Original Sanctuary V4.1 paired pre-floorfill and completed graphic tiles','layers':{},'originalReconstruction':{},'filesChanged':[],'wallsAdded':[]}
          for floor,mid,cols,rows in [('1',45,9,5),('2',46,11,6)]:
              tiles=metadata[floor]['tiles']; sx0=min(t['x'] for t in tiles);sy0=min(t['y'] for t in tiles)
              sw=max(t['x']+1536 for t in tiles)-sx0;sh=max(t['y']+768 for t in tiles)-sy0
              assert (sw,sh)==((288*16,144*16) if mid==45 else (336*16,168*16))
              full=Image.new('RGBA',(sw,sh)); original_walls=Image.new('RGBA',(sw,sh))
              for t in tiles:
                  name=t['src'];offset=(t['x']-sx0,t['y']-sy0)
                  full.alpha_composite(Image.open(io.BytesIO(source.read('preview/'+name))).convert('RGBA'),offset)
                  original_walls.alpha_composite(Image.open(io.BytesIO(source.read('preview/baseline/'+name))).convert('RGBA'),offset)
              all_rgba=np.array(full);original_structure=np.array(original_walls)
              # R44 panorama chunks came from these exact full-color Sanctuary originals.
              source_chunks=0
              for cy in range(rows):
                  for cx in range(cols):
                      f=pano/f'SLTI_{mid}_C{cx}_{cy}.png'
                      assert f.exists(),str(f)
                      got=np.array(Image.open(f).convert('RGBA'))
                      source_chunk=np.zeros((512,512,4),dtype=np.uint8)
                      yy=cy*512;xx=cx*512
                      tile=all_rgba[yy:min(yy+512,sh),xx:min(xx+512,sw)]
                      source_chunk[:tile.shape[0],:tile.shape[1]]=tile
                      assert np.array_equal(source_chunk,got),(mid,cx,cy,'Original Panorama mismatch')
                      source_chunks+=1
              assert source_chunks==cols*rows
              # The original wall pixels are retained exactly. Fill the floor hidden behind walls,
              # sampling from the authentic floorfill image only, so transparency never reveals black.
              # Downsampled inpaint is confined to concealed floor and never touches exposed pixels.
              wall_alpha=original_structure[:,:,3]
              covered=wall_alpha>0
              known=(wall_alpha==0)&(all_rgba[:,:,3]>0)
              scale=8; lw=(sw+scale-1)//scale;lh=(sh+scale-1)//scale
              thumb=cv2.resize(all_rgba[:,:,:3],(lw,lh),interpolation=cv2.INTER_AREA)
              wall_small=cv2.resize(covered.astype(np.uint8),(lw,lh),interpolation=cv2.INTER_AREA)
              wall_small=np.uint8(wall_small>0)*255
              fill_low=cv2.inpaint(thumb,wall_small,3,cv2.INPAINT_TELEA)
              concealed=cv2.resize(fill_low,(sw,sh),interpolation=cv2.INTER_LINEAR)
              floor_rgba=all_rgba.copy()
              floor_rgba[covered,:3]=concealed[covered,:3]
              # Preserve the native full-map alpha for its distinctive diamond edges.
              floor_rgba[covered,3]=all_rgba[covered,3]
              # Recover actual wall colors from the final preview, not the pre-floorfill
              # image's sometimes overwritten colors. This preserves the exact original wall.
              rebuilt_wall=original_structure.copy()
              alpha=original_structure[:,:,3].astype(np.float32)/255.0
              partial=(alpha>0)&(alpha<1)&(all_rgba[:,:,3]==255)
              rebuilt_wall[covered,:3]=all_rgba[covered,:3]
              if np.any(partial):
                  aw=alpha[partial,None]
                  orig=all_rgba[partial,:3].astype(np.float32)
                  bg=floor_rgba[partial,:3].astype(np.float32)
                  rebuilt_wall[partial,:3]=np.clip((orig-bg*(1.0-aw))/aw,0,255).astype(np.uint8)
              floor_written=0;wall_written=0;tot_parts=0
              reconstructed_color_match=[]
              for cy in range(rows):
                  for cx in range(cols):
                      yy=cy*512;xx=cx*512
                      block=np.zeros((512,512,4),np.uint8)
                      wblock=np.zeros((512,512,4),np.uint8)
                      patch=floor_rgba[yy:min(yy+512,sh),xx:min(xx+512,sw)]
                      wall_patch=rebuilt_wall[yy:min(yy+512,sh),xx:min(xx+512,sw)]
                      block[:patch.shape[0],:patch.shape[1]]=patch
                      wblock[:wall_patch.shape[0],:wall_patch.shape[1]]=wall_patch
                      key=f'{mid}:{cx}:{cy}'
                      if not np.any(wblock[:,:,3]):
                          record['layers'][key]=[]
                          continue
                      # Define real wall geometry in 128x64 sections (RGBA is transparent outside walls).
                      pieces=[]
                      for ty in range(8):
                          for tx in range(4):
                              alpha_patch=wblock[ty*64:(ty+1)*64,tx*128:(tx+1)*128,3]
                              active=np.argwhere(alpha_patch>16)
                              if not active.size:continue
                              ys=active[:,0];xs=active[:,1]
                              pieces.append([ty*4+tx,int(xs.min()),int(ys.min()),int(xs.max())+1,int(ys.max())+1])
                      if not pieces:record['layers'][key]=[];continue
                      name=f'SLTI_{mid}_C{cx}_{cy}.png'
                      # Do NOT modify an original source tile if its wall has zero effective alpha.
                      Image.fromarray(block,'RGBA').save(pano/name,compress_level=1)
                      wallname=f'SLTI_{mid}_W_C{cx}_{cy}.png'
                      Image.fromarray(wblock,'RGBA').save(pano/wallname,compress_level=1)
                      record['filesChanged'].append(name)
                      record['wallsAdded'].append(wallname)
                      record['layers'][key]=pieces
                      floor_written+=1;wall_written+=1;tot_parts+=len(pieces)
                      restored=Image.alpha_composite(Image.fromarray(block,'RGBA'),Image.fromarray(wblock,'RGBA'))
                      target=np.zeros((512,512,4),np.uint8);target[:patch.shape[0],:patch.shape[1]]=all_rgba[yy:yy+patch.shape[0],xx:xx+patch.shape[1]]
                      r=np.array(restored)
                      unchanged=(wblock[:,:,3]>=254)|(wblock[:,:,3]==0)
                      assert np.mean(np.all(r[unchanged]==target[unchanged],axis=1))>0.995,(key,'wall/floor reconstruction exceeds allowed difference')
                      reconstructed_color_match.append(float(np.mean(np.all(r==target,axis=2))))
              record['originalReconstruction'][str(mid)]={'nativeSourceChunks':source_chunks,'wallChunks':wall_written,'wallSprites':tot_parts,
                  'sourceImageGeometry':[sw,sh],'realWallPixels':int(covered.sum()),'opaqueAndClearPixelMatchRequired':0.995,
                  'meanExactPixelFraction':float(np.mean(reconstructed_color_match))}
              print('LAYERED ORIGINAL FLOOR',mid,record['originalReconstruction'][str(mid)],flush=True)
          assert set(record['wallsAdded']).isdisjoint(set(record['filesChanged']))
          assert len(record['layers'])==111
          (reports/'r48-layer-manifest.json').write_text(json.dumps(record,ensure_ascii=False,indent=2))
          print('COMPLETED:',len(record['wallsAdded']),'native wall textures',len(record['filesChanged']),'altered floor textures')
          R48_EMBEDDED
          python3 -m py_compile /tmp/r48-layers.py
          python3 /tmp/r48-layers.py site build sanctuary-source

      - name: V229R48 Keep 106 monsters and repair 88 isolated first-recognition switches
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r48-events.rb <<'R48_EMBEDDED'
          require 'json'; require 'digest'; require 'set'
          module RPG
           class Map;end;class MapInfo;end;class AudioFile;end;class Tileset;end
           class Event;class Page;class Condition;end;class Graphic;end;end;end
           class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          class Table
           def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
           def _dump(d=0);@raw;end
           def [](x,y=0,z=0);_,w,h,depth,_=@raw.unpack('V5');return nil if x<0 || y<0 || x>=w || y>=h || z<0 || z>=depth; @raw.byteslice(20+2*(x+y*w+z*w*h),2).unpack('v')[0];end
          end
          class Tone
           def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
           def _dump(d=0);@raw;end
          end
          class Color<Tone;end

          def iv(o,k);o.instance_variable_get('@'+k.to_s);end
          def sv(o,k,v);o.instance_variable_set('@'+k.to_s,v);end
          def chk(c,msg);raise msg unless c;end
          site=ARGV.fetch(0); out=ARGV.fetch(1)
          Dir.mkdir(out) unless Dir.exist?(out)
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          root=File.join(site,'knight/gameasync/Data')
          expected_hash={45=>'611b55b73d42d96f6527d3e97d0abd562efdc538391a91b4893f50e9fd117a7c',46=>'554ed7c437238f27f33f1073e6e286a83aa1736dcbf4c95229bb30cfdfe03c5a'}
          expected={45=>{'해골'=>18,'좀비'=>16,'스파토이'=>14},46=>{'버그베어'=>27,'켈베로스'=>25,'킹 버그베어'=>5,'바포메트'=>1}}
          clones=0;details={}
          [45,46].each do |mid|
           path=File.join(root,pre+('Map%03d.rxdata'%mid))
           chk(Digest::SHA256.file(path).hexdigest==expected_hash[mid],"Wrong source R44 map #{mid}")
           before=Marshal.load(File.binread(path));game=Marshal.load(File.binread(path))
           previous=iv(before,'events');events=iv(game,'events')
           chk(events.size==(mid==45 ? 53 : 62),"Map event size changed #{mid}")
           w,h=iv(game,'width'),iv(game,'height')
           edge=File.binread(File.join(out,"r44-map-#{mid}-edges.bin"))
           chk(edge.bytesize==w*h,"Missing original approved collision #{mid}")
           # Explicitly retain all terrain/wall tiles and their original map data.
           data=iv(game,'data')
           wall=Array.new(w*h)
           h.times{|y|w.times{|x|
             t=data[x,y,0]
             chk(t==384 || t==385,"Unexpected original tile #{t} at #{x},#{y}")
             wall[y*w+x]=t==385 ? 1 : 0
           }}
           File.binwrite(File.join(out,"r48-wall-#{mid}.bin"),wall.pack('C*'))
           changed=[]
           events.each do |id,e|
             name=iv(e,'name').to_s.dup.force_encoding('UTF-8').scrub
             next unless name.start_with?('[ID') && !name.include?('힐러') && !name.include?('바포메트')
             next unless id>=16
             pages=iv(e,'pages')
             chk(pages.size==4,"Wrong cloned mob page count: #{mid} / #{id}")
             cond=iv(pages[1],'condition')
             chk(!iv(cond,'switch1_valid'),"Cloned mob already gated unexpectedly: #{mid} / #{id}")
             prior=iv(cond,'switch1_id')
             sid=5000+(mid-45)*100+id
             sv(cond,'switch1_valid',true)
             sv(cond,'switch1_id',sid)
             route=iv(iv(pages[0],'move_route'),'list')
             matches=route.select{|m|iv(m,'code')==45 && iv(m,'parameters').is_a?(Array) && iv(m,'parameters')[0].to_s.dup.force_encoding('UTF-8').scrub.match(/^범위\(10,\d+,1\)$/)}
             chk(matches.size==1,"No unique detection script: #{mid}/#{id}")
             old_script=iv(matches[0],'parameters')[0]
             chk(old_script.include?(prior.to_s),"Wrong old detection ID #{mid}/#{id}")
             iv(matches[0],'parameters')[0]="범위(10,#{sid},1)"
             death=iv(pages[3],'list')
             chk(death.count{|c|iv(c,'code')==202}==3,"Clone respawn changed #{mid}/#{id}")
             reset=death.find{|c|iv(c,'code')==123 && iv(c,'parameters')[0]=='A'}
             chk(!reset.nil?,"Missing original death switch reset #{mid}/#{id}")
             ins=RPG::EventCommand.allocate
             sv(ins,'code',121);sv(ins,'parameters',[sid,sid,1]);sv(ins,'indent',0)
             death.insert(death.index(reset),ins)
             changed<<{'eventID'=>id,'oldDetectionSwitch'=>prior,'newDetectionSwitch'=>sid,'route'=>iv(matches[0],'parameters')[0]}
           end
           chk(changed.length==(mid==45 ? 39 : 49),"Unexpected # cloned mobs #{mid}/#{changed.length}")
           originalIDs=previous.keys.select{|id|id<16}
           originalIDs.each{|id|chk(Marshal.dump(previous.fetch(id))==Marshal.dump(events.fetch(id)),"Existing original event changed #{mid}/#{id}")}
           # Map terrain/walls, existing 106 monster locations, respawn destinations, sprites and other fields unchanged.
           chk(Marshal.dump(iv(before,'data'))==Marshal.dump(iv(game,'data')),"Terrain edited #{mid}")
           events.each{|id,ev|chk([iv(ev,'x'),iv(ev,'y')]==[iv(previous.fetch(id),'x'),iv(previous.fetch(id),'y')],"Spawn moved #{mid}/#{id}")}
           if mid==46
             boss=events.fetch(13)
             chk([iv(boss,'x'),iv(boss,'y')]==[156,100],"Boss moved")
           end
           File.binwrite(path,Marshal.dump(game))
           details[mid]={'clonesGated'=>changed.length,'switches'=>changed,'unchangedEvents'=>events.length}
           clones+=changed.length
           puts "R48 map #{mid}: cloned aggro gates restored #{changed.length}, all existing original events/XY preserved"
          end
          chk(clones==88,"Wrong clone count")
          File.write(File.join(out,'r48-clone-gate-audit.json'),JSON.pretty_generate(details))
          R48_EMBEDDED
          ruby -c /tmp/r48-events.rb
          ruby /tmp/r48-events.rb site build

      - name: V229R48 Preserve original game and install first-recognition wall rules + independent wall sprites
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r48-addon.rb <<'R48_EMBEDDED'
          # V229R48: original isolated Sanctuary walls, first acquisition by reachable ground,
          # wall-constrained damage. Never change original actor opacity or acquired AI state.
          module SLTI_V229R48
            PARTS=__R48_PARTS__
            def self.monster?(e)
              return false unless e.is_a?(Game_Event)
              mid=e.instance_variable_get(:@map_id)
              return false unless mid==45 || mid==46
              ref=e.instance_variable_get(:@event)
              return false if ref==nil
              name=ref.name.to_s
              return false if (mid==45 && ref.id==13) || (mid==46 && ref.id==3)
              return name[0,3]=='[ID'
            end
            def self.grid(mid)
              return [288,144,SLTI_V229R44::EDGES_45] if mid==45
              return [336,168,SLTI_V229R44::EDGES_46] if mid==46
              return nil
            end
            def self.walkable?(mid,x,y)
              info=grid(mid)
              return false if info==nil
              w,h,raw=info
              return false if x<0 || y<0 || x>=w || y>=h
              return raw[y*w+x,1].unpack('C')[0]!=0
            end
            def self.step?(mid,x,y,dir)
              return SLTI_V229R44.allowed?(mid,x,y,dir)
            end
            def self.direct_line?(mid,ax,ay,bx,by)
              # Traverse the actual RGSS movement grid. Either open corner route is valid;
              # unlike R46 no double-path requirement that rejects adjacent diagonal mobs.
              dx=bx-ax;dy=by-ay
              count=[dx.abs,dy.abs].max
              return true if count==0
              x=ax;y=ay
              for i in 1..count
                nx=ax+(dx*i.to_f/count).round
                ny=ay+(dy*i.to_f/count).round
                sx=nx-x;sy=ny-y
                if sx!=0 && sy!=0
                  hd=sx>0 ? 6 : 4;vd=sy>0 ? 2 : 8
                  path1=step?(mid,x,y,hd) && step?(mid,x+sx,y,vd)
                  path2=step?(mid,x,y,vd) && step?(mid,x,y+sy,hd)
                  return false unless path1 || path2
                elsif sx!=0
                  return false unless step?(mid,x,y,sx>0 ? 6 : 4)
                elsif sy!=0
                  return false unless step?(mid,x,y,sy>0 ? 2 : 8)
                end
                x=nx;y=ny
              end
              return x==bx && y==by
            end
            def self.route?(mid,ax,ay,bx,by,max_steps)
              return false unless walkable?(mid,ax,ay) && walkable?(mid,bx,by)
              return true if ax==bx && ay==by
              w,h,raw=grid(mid)
              seen={ay*w+ax=>true}
              q=[[ax,ay,0]];head=0
              dirs=[[1,0,8,4],[-1,0,4,8],[0,1,2,1],[0,-1,1,2]]
              while head<q.length
                x,y,steps=q[head];head+=1
                next if steps>=max_steps
                here=raw[y*w+x,1].unpack('C')[0]
                dirs.each do |dx,dy,bits,back|
                  nx=x+dx;ny=y+dy
                  next if nx<0 || ny<0 || nx>=w || ny>=h
                  key=ny*w+nx
                  next if seen[key] || (here&bits)==0
                  them=raw[key,1].unpack('C')[0]
                  next if (them&back)==0
                  return true if nx==bx && ny==by
                  seen[key]=true;q << [nx,ny,steps+1]
                end
              end
              return false
            end
            def self.first_sight?(mid,ax,ay,bx,by,distance)
              manhattan=(ax-bx).abs+(ay-by).abs
              return false if manhattan>=distance
              return true if direct_line?(mid,ax,ay,bx,by) && walkable?(mid,bx,by)
              # Allow near visible corners: a short actual traversable passage is NOT vision
              # through a wall. 10-step original radius is retained, never extended.
              return route?(mid,ax,ay,bx,by,[distance-1,manhattan+3].min)
            end
            def self.attack_open?(e)
              return true unless monster?(e) && $game_player!=nil
              return direct_line?($game_map.map_id,e.x,e.y,$game_player.x,$game_player.y)
            end
          end

          class Game_Character
            alias slti_r48_original_range 범위
            def 범위(distance,switch_id,mode)
              activating=(mode==1 || mode=='on' || mode=='온')
              if activating && $game_switches[switch_id]!=true && SLTI_V229R48.monster?(self)
                dx=(self.x-$game_player.x).abs;dy=(self.y-$game_player.y).abs
                return if dx+dy>=distance.to_i
                key=[$game_map.map_id,self.x,self.y,$game_player.x,$game_player.y,distance.to_i]
                if @slti_r48_sight_key!=key
                  @slti_r48_sight_key=key
                  @slti_r48_sight_ok=SLTI_V229R48.first_sight?(*key)
                end
                return unless @slti_r48_sight_ok
              end
              slti_r48_original_range(distance,switch_id,mode)
            end
          end

          class Game_Event
            alias slti_r48_original_initialize initialize
            def initialize(map_id,event)
              if (map_id==45 || map_id==46) && event.id>=16 && event.name.to_s[0,3]=='[ID'
                gate=event.pages[1].condition
                $game_switches[gate.switch1_id]=false if gate.switch1_valid
              end
              slti_r48_original_initialize(map_id,event)
            end
          end

          # Guard ACTUAL actor HP damage originating in native monster events.
          # Doesn't clear recognition or interrupt pursuit after turning a corner.
          class Interpreter
            alias slti_r48_original_actor_hp command_311
            def command_311
              if (@map_id==45 || @map_id==46) && @event_id.to_i>0
                monster=$game_map.events[@event_id]
                return true if monster!=nil && SLTI_V229R48.monster?(monster) && !SLTI_V229R48.attack_open?(monster)
              end
              slti_r48_original_actor_hp
            end
          end

          # Floor and wall are separate ORIGINAL textures, extracted from paired V4.1
          # Sanctuary source images. Wall pieces are transparent outside real stone pixels.
          class Spriteset_Map
            alias slti_r48_original_initialize initialize
            def initialize
              @slti_r48_walls={}
              slti_r48_original_initialize
            end
            alias slti_r48_original_update update
            def update
              slti_r48_original_update
              slti_r48_update_walls if (@slti_floor==45 || @slti_floor==46) && !@slti_chunk_error
            end
            def slti_r48_update_walls
              @slti_r48_walls={} if @slti_r48_walls==nil
              return if @slti_chunks==nil
              @slti_r48_walls.keys.each do |key|
                next if @slti_chunks.has_key?(key)
                texture,pieces=@slti_r48_walls.delete(key)
                pieces.each do |p|
                  s=p[0];s.bitmap=nil;s.dispose unless s.disposed?
                end
                texture.dispose if texture!=nil && !texture.disposed?
              end
              one_new=0
              @slti_chunks.each_key do |key|
                next if @slti_r48_walls.has_key?(key)
                cx,cy=key
                data=SLTI_V229R48::PARTS["#{@slti_floor}:#{cx}:#{cy}"]
                if data==nil || data.empty?
                  @slti_r48_walls[key]=[nil,[]]
                  next
                end
                next if one_new>=1
                path="Graphics/Panoramas/SLTI_#{@slti_floor}_W_C#{cx}_#{cy}"
                begin
                  texture=Bitmap.new(path)
                rescue StandardError => ex
                  p "SLTI WALL LAYER ERROR #{path}: #{ex.message}"
                  next
                end
                sprites=[]
                data.each do |entry|
                  id,bx0,by0,bx1,by1=entry
                  left=(id%4)*128;top=(id/4)*64
                  s=Sprite.new(@viewport2)
                  s.bitmap=texture
                  s.src_rect.set(left,top,128,64)
                  s.zoom_x=2.0;s.zoom_y=2.0
                  sprites << [s,id,bx0,by0,bx1,by1]
                end
                @slti_r48_walls[key]=[texture,sprites]
                one_new+=1
              end
              sx=[$game_map.display_x.to_i/4,0].max
              sy=[$game_map.display_y.to_i/4,0].max
              hero=@character_sprites && @character_sprites[-1]
              hashero=(hero!=nil && hero.bitmap!=nil)
              if hashero
                actor_left=hero.x-hero.ox
                actor_top=hero.y-hero.oy
                actor_right=actor_left+hero.src_rect.width
                actor_bottom=actor_top+hero.src_rect.height
                actor_depth=hero.z
              end
              @slti_r48_walls.each do |key,item|
                cx,cy=key
                item[1].each do |part|
                  s,id,bx0,by0,bx1,by1=part
                  s.x=cx*1024+(id%4)*256-sx
                  s.y=cy*1024+(id/4)*128-sy
                  # Position the wall by its true painted bounding box, NOT an RPG tile.
                  left=s.x+bx0*2;top=s.y+by0*2
                  right=s.x+bx1*2;bottom=s.y+by1*2
                  overlap=hashero && left<actor_right && right>actor_left && top<actor_bottom && bottom>actor_top
                  if overlap
                    s.z=actor_depth+2
                    s.opacity=148  # fade WALL, never player; actual source alpha remains intact
                  else
                    s.z=bottom+2
                    s.opacity=255
                  end
                end
              end
            end
            alias slti_r48_original_dispose dispose
            def dispose
              if @slti_r48_walls!=nil
                @slti_r48_walls.each_value do |item|
                  item[1].each do |part|
                    s=part[0];s.bitmap=nil;s.dispose unless s.disposed?
                  end
                  texture=item[0];texture.dispose if texture!=nil && !texture.disposed?
                end
                @slti_r48_walls.clear
              end
              slti_r48_original_dispose
            end
          end
          R48_EMBEDDED
          ruby -c /tmp/r48-addon.rb

      - name: V229R48 Remove player alpha code and patch ONLY core scripts 28 and 134
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r48-patch-scripts.rb <<'R48_EMBEDDED'
          require 'digest';require 'zlib';require 'json'
          root=ARGV.fetch(0);reports=ARGV.fetch(1);addon_path=ARGV.fetch(2)
          path=File.join(root,'knight/gameasync/Data/Scripts.rxdata')
          expected='82c10608c869bdb25dfd9056fa1e2c9c11d9071a682e45ba4428e5b48c11974f'
          raise "Wrong R44 script input #{Digest::SHA256.file(path).hexdigest}" unless Digest::SHA256.file(path).hexdigest==expected
          scripts=Marshal.load(File.binread(path));old=Marshal.load(File.binread(path))
          original28=Zlib::Inflate.inflate(scripts.fetch(28)[2])
          original134=Zlib::Inflate.inflate(scripts.fetch(134)[2])
          original21=Zlib::Inflate.inflate(scripts.fetch(21)[2])
          original103=Zlib::Inflate.inflate(scripts.fetch(103)[2])
          original97=Zlib::Inflate.inflate(scripts.fetch(97)[2])
          raise 'Missing R44 wall collision code' unless original21.include?('module SLTI_V229R44')
          raise 'Missing native wall chunk loading' unless original97.include?('def slti_update_terrain')
          raise 'Missing original range script' unless original103.dup.force_encoding('UTF-8').scrub.include?('def 범위(dist_n, 스위치아이디, 방식)')
          alpha=/# Original wall-front behavior: player translucent where a wall face\n# rises in front of the character\. Do not change enemies or other maps\.\nif @character == \$game_player &&\n   \(\$game_map\.map_id == 45 \|\| \$game_map\.map_id == 46\) &&\n   SLTI_V229R44\.wall_overlap\?\(\$game_map\.map_id,@character\.x,@character\.y\)\n  self\.opacity = 144 if self\.opacity > 144\nend\n/
          raise 'R44 alpha block missing/ambiguous' unless original28.scan(alpha).size==1
          original28=original28.sub(alpha,'')
          raise 'Player original opacity assignment absent' unless original28.include?('self.opacity = @character.opacity')
          manifest=JSON.parse(File.read(File.join(reports,'r48-layer-manifest.json')))
          parts=manifest.fetch('layers').reject{|_,v|v.empty?}
          raise 'Original texture wall layers not generated' unless parts.size>30
          addon=File.binread(addon_path)
          raise 'Injection token mismatch' unless addon.scan('__R48_PARTS__').length==1
          addon=addon.sub('__R48_PARTS__',parts.inspect)
          raise 'R48 player alpha regression' if addon.include?('hero.opacity=') || addon.include?('self.opacity = 144')
          raise 'R48 chase/aggro clearing regression' if addon.include?('move_toward_player') || addon.include?('slti_r45_original_update')
          raise 'R48 read collision missing' unless addon.include?('SLTI_V229R44.allowed?')
          scripts[28][2]=Zlib::Deflate.deflate(original28)
          scripts[134][2]=Zlib::Deflate.deflate(original134+"\n"+addon)
          scripts.each_index{|id|raise "Other original script changed #{id}" if ![28,134].include?(id) && scripts[id]!=old[id]}
          File.binwrite(path,Marshal.dump(scripts))
          File.binwrite(File.join(reports,'r48-sprite28.rb'),original28)
          File.binwrite(File.join(reports,'r48-late134.rb'),original134+"\n"+addon)
          File.binwrite(File.join(reports,'r48-original21.rb'),original21)
          File.binwrite(File.join(reports,'r48-original103.rb'),original103)
          puts "R48 script change only indices 28 and 134; real wall PNGs #{parts.size}; prior char alpha removed; R44 wall collision unchanged"
          R48_EMBEDDED
          ruby -c /tmp/r48-patch-scripts.rb
          ruby /tmp/r48-patch-scripts.rb site build /tmp/r48-addon.rb
          ruby -c build/r48-sprite28.rb
          ruby -c build/r48-late134.rb

