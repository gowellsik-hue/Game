          require 'zlib'
          path='site/knight/gameasync/Data/Scripts.rxdata'
          orig=File.binread(path)
          a=Marshal.load(orig)
          before=Marshal.load(orig)
          raise 'Unexpected script count' unless a.size==136
          code=Zlib::Inflate.inflate(a[21][2]).force_encoding('UTF-8')
          pos=code.index('module SLTI_V229R44')
          raise 'Missing native collision module' if pos.nil?
          head=code[0...pos]
          tail=code[pos..-1]
          [45,46].each do |mid|
            raw=File.binread("build/r65-map#{mid}.bin")
            pattern=/^  EDGES_#{mid} = \[\r?\n.*?\r?\n  \]\.join\.unpack\('m'\)\[0\]/m
            raise "Missing R44 map #{mid} graph" unless tail.scan(pattern).size==1
            b64=[raw].pack('m0').scan(/.{1,120}/).map{|s|'    '+s.inspect}.join(",\n")
            tail=tail.sub(pattern,"  EDGES_#{mid} = [\n#{b64}\n  ].join.unpack('m')[0]")
          end
          a[21][2]=Zlib::Deflate.deflate((head+tail).b)
          raise 'Unrelated Ruby script changed' unless a.each_index.all?{|i|i==21 || a[i]==before[i]}
          File.binwrite(path,Marshal.dump(a))
          check=Marshal.load(File.binread(path))
          source=Zlib::Inflate.inflate(check[21][2]).force_encoding('UTF-8')
          s=source.index('module SLTI_V229R44')
          e=source.index("\nclass Game_Map",s)
          raise 'Wrong RGSS source boundaries' unless s && e
          eval(source[s...e])
          [45,46].each do |mid|
            raise "Map #{mid} invalid" unless SLTI_V229R44.const_get("EDGES_#{mid}")==File.binread("build/r65-map#{mid}.bin")
          end
          raise 'R64 foreground wall fade changed' unless check[134]==before[134]
          raise 'R64 monster combat changed' unless check[72]==before[72] && check[134]==before[134]
          puts 'PASS original wall visual and monster scripts preserved; collision graph replaced'
          RB_PATCH
          ruby -c /tmp/r65_patch.rb
          ruby /tmp/r65_patch.rb

      - name: V229R65 Verify behind wall, solid wall base and real doorway
        shell: bash
        run: |
          set -euo pipefail
          ruby - <<'RB_TEST'
          require 'zlib'
          a=Marshal.load(File.binread('site/knight/gameasync/Data/Scripts.rxdata'))
          source=Zlib::Inflate.inflate(a[21][2]).force_encoding('UTF-8')
          start=source.index('module SLTI_V229R44')
          ending=source.index("\nclass Game_Map",start)
          eval(source[start...ending])
          char=Zlib::Inflate.inflate(a[23][2]).force_encoding('UTF-8')
          raise 'Missing shared player/monster collision' unless char.include?('SLTI_V229R44.allowed?')
          (78..81).each do |y|
            raise "Wall behind actor is blocked at y=#{y}" unless SLTI_V229R44.allowed?(45,94,y,2) && SLTI_V229R44.allowed?(45,94,y+1,8)
          end
          raise 'True wall base is passable' if SLTI_V229R44.allowed?(45,94,82,2)
          raise 'Old wall clipping remains' if SLTI_V229R44.allowed?(45,97,70,8)
          (57..60).each do |y|
            raise 'Door blocked' unless SLTI_V229R44.allowed?(45,133,y,2)
          end
          raise '2F event tile blocked' unless SLTI_V229R44.allowed?(46,81,94,6) && SLTI_V229R44.allowed?(46,156,100,6)
          wall=Zlib::Inflate.inflate(a[134][2]).force_encoding('UTF-8')
          raise 'Wall front/back visual lost' unless wall.include?('covered=overlap && actor_depth<wall_depth')
          [45,46].each do |mid|
            w,h=mid==45 ? [288,144]:[336,168]
            graph=File.binread("build/r65-map#{mid}.bin")
            h.times do |y|
              w.times do |x|
                v=graph.getbyte(y*w+x)
                raise 'Inconsistent right/left wall boundary' if x+1<w && ((v&8)!=0)!=((graph.getbyte(y*w+x+1)&4)!=0)
                raise 'Inconsistent down/up wall boundary' if y+1<h && ((v&2)!=0)!=((graph.getbyte((y+1)*w+x)&1)!=0)
              end
            end
          end
          puts 'PASS 97920 cells, original 1F door, 1F behind-wall movement, physical wall base and 2F'
          RB_TEST

      - name: V229R65 Update cache and confirm no unrelated game data changed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import hashlib,json,re
          root=Path('site')
          engine=root/'knight/gameasync'
          mapping=engine/'mapping.js'
          src=mapping.read_text('utf-8')
          key='Data/Scripts.rxdata'
          digest=hashlib.md5((engine/key).read_bytes()).hexdigest()
          modified,n=re.subn(re.escape(key)+r'\?h=[0-9a-f]{32}',lambda m:key+'?h='+digest,src)
          assert n==1,n
          mapping.write_text(modified,encoding='utf-8')
          for filename in ('index.html','knight/index.html'):
              file=root/filename
              old=file.read_text('utf-8')
              assert 'V229R64' in old
              file.write_text(old.replace('V229R64','V229R65').replace('v229r64','v229r65'),encoding='utf-8')
          before=json.loads(Path('build/r65-baseline.json').read_text())
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(before)==len(after)==5517 and before.keys()==after.keys()
          changed={k for k in before if before[k]!=after[k]}
          allowed={'index.html','knight/index.html','knight/gameasync/Data/Scripts.rxdata','knight/gameasync/mapping.js'}
          assert changed==allowed,('Unexpected game changes',changed^allowed)
          print('PASS full site inventory and all map events, monsters, rewards and PNGs unchanged')
          PY_FINAL
          node --check site/knight/gameasync/mapping.js

      - name: V229R65 Upload complete game to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
