          module RPG
            class AudioFile; end

            class Animation
              class Frame; end
              class Timing; end
            end

            class CommonEvent; end
            class EventCommand; end
          end

          def iv(o,n)
            o.instance_variable_get("@#{n}")
          end

          def setiv(o,n,v)
            o.instance_variable_set("@#{n}",v)
          end

          def cmd(code,indent=0,params=[])
            c=RPG::EventCommand.new
            setiv(c,:code,code)
            setiv(c,:indent,indent)
            setiv(c,:parameters,params)
            c
          end

          cp=Dir.glob(
            File.join(game,'Data','*CommonEvents.rxdata')
          ).max_by{|p|File.size(p)}

          abort 'CommonEvents missing' unless
            cp&&File.size(cp)>1000

          ce=Marshal.load(
            File.binread(cp)
          )

          ce59=ce[59]
          ce60=ce[60]

          abort 'CE59/60 missing' unless
            ce59&&ce60

          list=iv(ce59,:list)||[]

          list.delete_if do |c|
            iv(c,:code)==355 &&
              (iv(c,:parameters)||[])[0]
                .to_s
                .include?('SL_TRANSFORM_DEAGGRO_')
          end

          while !list.empty? &&
                iv(list[-1],:code)==0
            list.pop
          end

          deaggro_script=<<'SCRIPT'
          # SL_TRANSFORM_DEAGGRO_V2_SAFE
          begin
            if defined?($game_map) && $game_map
              $game_map.need_refresh = true

              $game_map.events.each_value do |ev|
                ev.sl_attack_finish if
                  ev.respond_to?(:sl_attack_finish)

                ev.sl_breath_finish if
                  ev.respond_to?(:sl_breath_finish)

                ev.animation_id = 0 if
                  ev.respond_to?(:animation_id=)
              end
            end

            if defined?(SLMonsterAttackContext)
              SLMonsterAttackContext
                .instance_variable_set(
                  :@pending,
                  {}
                )
            end

            if defined?(SLBreathContext)
              SLBreathContext
                .instance_variable_set(
                  :@pending,
                  {}
                )
            end
          rescue
          end
          SCRIPT

          list << cmd(
            355,
            0,
            [deaggro_script]
          )

          list << cmd(
            0,
            0,
            []
          )

          setiv(
            ce59,
            :list,
            list
          )

          abort 'recognition OFF range missing' unless
            list.any? do |c|
              iv(c,:code)==122 &&
                (iv(c,:parameters)||[])==
                  [638,691,0,0,0]
            end

          abort 'recognition ON range missing' unless
            (iv(ce60,:list)||[]).any? do |c|
              iv(c,:code)==122 &&
                (iv(c,:parameters)||[])==
                  [638,691,0,0,1]
            end

          abort 'deaggro touches death self switches' if
            deaggro_script.include?(
              '$game_self_switches'
            )

          File.binwrite(
            cp,
            Marshal.dump(ce)
          )

          puts 'TRANSFORM_RECOGNITION_ONLY_OK'
          RB

          ruby -c /tmp/patch_transform_recognition_only.rb
          ruby -EUTF-8:UTF-8 \
            /tmp/patch_transform_recognition_only.rb \
            player/gameasync

