                end

                class Graphic
                end
              end
            end

            class EventCommand
            end

            class MoveRoute
            end

            class MoveCommand
            end
          end

          def iv(obj, name)
            obj.instance_variable_get(
              "@#{name}"
            )
          end

          def setiv(obj, name, value)
            obj.instance_variable_set(
              "@#{name}",
