
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V1.5 (failed attempts do not increment the version)
# BASE: successful V1.4 game artifact run 42326754572
# ONLY: approved monster stats, original event damage, original slv437 drops
# KEEP: V1.4 original inventory registration, hotbar 1-9, healer, movement
# EXCLUDE: Zenith Queen / new timers / new input logic / new drop engine
name: build-slknight-web.yml | V1.5 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Restore last successful V1.4
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 42326754572
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Check V1.4 base
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY_V15_BASE'
          from pathlib import Path
          import hashlib, json
          root=Path('site')
          manifest={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in root.rglob('*') if p.is_file()}
          assert len(manifest)==5623,len(manifest)
          required=('knight/gameasync/Data/Scripts.rxdata',
                    'knight/js/dpad.js','knight/index.html')
          assert all(x in manifest for x in required)
          assert "var version='V1.4';" in (root/'knight/js/sl-assets-v229r115.js').read_text('utf8')
          Path('build/v14_manifest.json').write_text(json.dumps(manifest),encoding='utf8')
          print('PASS base V1.4',len(manifest),'files')
          PY_V15_BASE

      - name: Directly edit existing V1.4 game data
        shell: bash
        run: |
          set -euo pipefail
          cat > build/patch_v15.rb <<'RUBY_V15'
          # encoding: utf-8
          require 'zlib'
          require 'digest'
          SITE = File.expand_path(ARGV.fetch(0))
          DATA_DIR = File.join(SITE, 'knight/gameasync/Data')
          PRE = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          class Module
            def const_missing(name); const_set(name, Class.new); end
          end
          class Table
            def self._load(x); o=allocate;o.instance_variable_set(:@raw,x);o;end
            def _dump(depth); @raw;end
          end
          class Color
            def self._load(x); o=allocate;o.instance_variable_set(:@raw,x);o;end
            def _dump(depth); @raw;end
          end
          class Tone
            def self._load(x); o=allocate;o.instance_variable_set(:@raw,x);o;end
            def _dump(depth); @raw;end
          end
          module RPG
            class Map;end
            class AudioFile;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
            class CommonEvent;end
            class Item;end
            class Weapon;end
            class Armor;end
          end

          def check(ok, msg)
            raise "V1.5 ORIGINAL MISMATCH: #{msg}" unless ok
          end

          def iv(o,k);o.instance_variable_get(k);end
          def cp(c);iv(c,:@parameters);end
          def cc(c);iv(c,:@code);end
          def setp(c,v);c.instance_variable_set(:@parameters,v);end
          def file(mid);File.join(DATA_DIR,PRE+format('Map%03d.rxdata',mid));end

          def exact(list,c,before,after,label)
            found=list.select{|e|cc(e)==c && cp(e)==before}
            check(found.size==1,"#{label} found #{found.size}")
            setp(found[0],after)
          end

          def replace_text(list,a,b,label)
            found=list.select{|e|[355,655].include?(cc(e)) && cp(e).size==1 && cp(e)[0].is_a?(String) && cp(e)[0].include?(a)}
            check(found.size==1,"#{label} found #{found.size}")
            setp(found[0],[cp(found[0])[0].sub(a,b)])
          end

          # Only five maps need on-disk changes; all other maps remain byte-identical.
          MAP_IDS=[3,31,35,37,41].freeze
          maps=MAP_IDS.to_h{|mid|[mid,Marshal.load(File.binread(file(mid)))]}
          def event(maps,id)
            mid,eid=id.split(':').map(&:to_i)
            check(mid!=25,"no Zenith Queen edits")
            ev=iv(maps.fetch(mid),:@events)[eid]
            check(!ev.nil?,"missing event #{id}")
            ev
          end

          def page(ev,i)
            p=iv(ev,:@pages)[i]
            check(!p.nil?,"event page #{i} missing")
            p
          end

          def list(pg);iv(pg,:@list);end

          # Existing attack-page dodge roll variable 335; no second calculation.
          DODGE={
            '35:17'=>[20,40,8,16],
            '37:1'=>[12,20,5,15], '37:4'=>[12,20,5,15],
            '37:5'=>[10,30,5,20], '37:6'=>[10,30,5,20],
            '41:9'=>[30,50,1,10],
            '41:10'=>[10,40,1,8], '41:11'=>[10,40,1,8], '41:18'=>[10,40,1,8]
          }.freeze
          DODGE.each do |key,(lo,hi,newlo,newhi)|
            count=0
            iv(event(maps,key),:@pages).each do |pg|
              next unless iv(pg,:@trigger)==2
              list(pg).each do |c|
                next unless cc(c)==122 && cp(c)[0,4]==[335,335,0,2]
                check(cp(c)[4,2]==[lo,hi],"unexpected dodge #{key}")
                setp(c,[335,335,0,2,newlo,newhi]); count+=1
              end
            end
            check(count>0,"missing dodge roll #{key}")
          end

          # Turtle/Beholder existing attack pages only.
          attack=list(page(event(maps,'41:3'),0))
          exact(attack,122,[26,26,0,0,100],[26,26,0,0,35],'turtle attack 1')
          exact(attack,122,[26,26,0,0,200],[26,26,0,0,70],'turtle attack 2')
          exact(attack,111,[1,26,0,70,2],[1,26,0,20,2],'turtle minimum')
          [12,13,14].each do |pi|
            exact(list(page(event(maps,'41:3'),pi)),111,[1,26,0,30,2],[1,26,0,20,2],"beholder min #{pi}")
          end

          # Change the existing shared attack common events, not create new CEs.
          cp_path=File.join(DATA_DIR,PRE+'CommonEvents.rxdata')
          ces=Marshal.load(File.binread(cp_path))
          {797=>[[25,30],[50,60]],877=>[[60,75],[120,150]]}.each do |id,pairs|
            pairs.each do |oldval,newval|
              exact(list(ces[id]),122,[26,26,0,0,oldval],[26,26,0,0,newval],"CE#{id} attack #{oldval}")
            end
          end
          exact(list(ces[797]),122,[336,336,0,2,9999,9999],[336,336,0,2,50,120],'ghoul hit')
          exact(list(ces[877]),111,[1,26,0,30,2],[1,26,0,35,2],'Drake minimum')

          # Turtle's already-existing SLV541.observe makes the sole EXP/Adena award.
          # Remove the separate old reward commands, leaving messages and original drops.
          turtle=event(maps,'41:9')
          replace_text(list(page(turtle,1)),',100000,2)',',2400,2)','turtle HUD')
          regen=list(page(event(maps,'41:19'),0))
          exact(regen,111,[1,241,0,100000,4],[1,241,0,2400,4],'turtle regeneration cap')
          replace_text(regen,',100000,2)',',2400,2)','turtle regen HUD')
          old_death=list(page(turtle,2))
          old_rewards=[
            [122,[333,333,0,2,1,9999999]], [125,[0,1,333]],
            [122,[1926,1926,0,0,160000]], [122,[1926,1926,3,1,3]],
            [122,[1926,1926,4,1,1927]], [315,[1,0,1,1926]]
          ]
          old_rewards.each do |id,args|
            matched=old_death.select{|c|cc(c)==id && cp(c)==args}
            check(matched.size==1,"turtle duplicate XP/Adena #{id} #{args.inspect}")
            old_death.delete(matched[0])
          end

          # Shared common events: these event IDs are exclusively used by the listed
          # target monsters in the original V1.4 maps. Edit the existing slv437
          # probability and item-grant script, preserving its RNG and loot messages.
          GROUPS={
            655=>'a255:200',
            661=>'a118:5000',
            699=>'a278:100 a277:100',
            704=>'a278:100 a277:100',
            714=>'i18:5000 i32:2000 i33:2000',
            718=>'a158:3000 i32:1000',
            728=>'i54:2000',
            730=>'i33:3000 i32:3000 i69:100',
            731=>'i32:3000 i33:3000 i34:100',
            745=>'i11:3000 i9:3000 i12:3000 i10:3000 i57:1000 i77:1000 i78:1000 i79:1000 i2:10000'
          }.freeze

          # Other event IDs share their common event with different monsters.
          # Add the approved rolls directly inside ONLY their own original death page.
          LOCAL={
            '35:12'=>'i57:2000 i77:2000 i78:2000 i79:2000 i2:10000',
            '35:13'=>'i57:2000 i77:2000 i78:2000 i79:2000 i2:10000',
            '35:14'=>'i57:2000 i77:2000 i78:2000 i79:2000 i2:10000',
            '35:15'=>'i57:2000 i77:2000 i78:2000 i79:2000 i2:10000',
            '35:17'=>'i33:4000 a555:1500 a556:1500',
            '35:16'=>'i57:2000 i77:2000 i78:2000 i79:2000',
            '3:23'=>'i108:1000', '3:25'=>'i108:1000',
            '31:11'=>'w123:5000 a289:5000 a94:10000 a105:10000 a60:10000 a275:1500 i104:3000 i105:3000 i32:15000 i33:15000 i34:6000 i35:9000'
          }.freeze

          # Verify original CE map usage before changing shared CEs.
          USES={
            655=>['17:14','17:15'],
            661=>%w[21:6 21:7 21:8 22:11 22:12 22:13 23:13 23:14],
            699=>%w[3:13 3:14], 704=>%w[3:22],
            714=>%w[8:9 8:10 8:12],
            718=>%w[9:6 9:7 9:9 9:16 43:30],
            728=>%w[11:8 11:9 11:10],
            730=>%w[11:7 11:11 43:20],
            731=>%w[11:12 11:13],
            745=>%w[35:2 35:4 35:5 35:6 35:7 35:8 35:9 35:10 43:13 43:14]
          }.freeze
          MAP_DIR=Dir.glob(File.join(DATA_DIR,PRE+'Map[0-9][0-9][0-9].rxdata'))
          usage=Hash.new{|h,k|h[k]=[]}
          MAP_DIR.each do |fname|
            mid=fname[/Map(\d{3})\.rxdata$/,1].to_i
            m=maps[mid] || Marshal.load(File.binread(fname))
            iv(m,:@events).each do |eid,ev|
              next if ev.nil?
              iv(ev,:@pages).each do |pg|
                next unless iv(pg,:@trigger)==4
                list(pg).each do |c|
                  next unless cc(c)==117 && USES.key?(cp(c)[0])
                  usage[cp(c)[0]] << "#{mid}:#{eid}"
                end
              end
            end
          end
          USES.each{|ce,expected|check(usage[ce].sort==expected.sort,"shared CE#{ce} reaches non-target EV")}

          def parse_drops(text)
            text.split.map do |spec|
              m=/\A([iwa])(\d+):(\d+)\z/.match(spec)
              check(!m.nil?,"invalid drop #{spec}")
              kind={'i'=>'item','w'=>'weapon','a'=>'armor'}.fetch(m[1])
              id=m[2].to_i; rate=m[3].to_i
              check(id>0 && rate.between?(1,100000),"invalid drop numbers #{spec}")
              [kind,id,rate]
            end
          end

          def extra_script(drops)
            lines=['slv437_messages=[]']
            drops.each do |kind,id,rate|
              table={'item'=>'items','weapon'=>'weapons','armor'=>'armors'}.fetch(kind)
              lines << "if rand(100000)<#{rate}"
              lines << '  slv437_count=(1)'
              lines << "  $game_party.gain_#{kind}(#{id},slv437_count)"
              lines << "  slv437_name=($data_#{table}[#{id}] && $data_#{table}[#{id}].name) || ''"
              lines << "  slv437_messages << (slv437_name + ' '+slv437_count.to_s+'개') unless slv437_name.empty?"
              lines << 'end'
            end
            lines << 'unless slv437_messages.empty?'
            lines << "  $메세지.set_text2(slv437_messages.join(', ')+' 획득 했습니다.')"
            lines << 'end'
            lines.join("\n")+"\n"
          end

          added=0
          GROUPS.each do |ce_id,drops_text|
            arr=parse_drops(drops_text)
            cmds=list(ces[ce_id])
            candidates=cmds.select{|c|cc(c)==355 && cp(c).length==1 && cp(c)[0].start_with?("slv437_messages=[]\n")}
            check(candidates.size==1,"CE#{ce_id} original slv437 loot source")
            original=cp(candidates[0])[0]
            marker="unless slv437_messages.empty?\n"
            check(original.scan(marker).size==1,"CE#{ce_id} loot footer")
            arr.each{|kind,id,_|check(!original.include?("$game_party.gain_#{kind}(#{id},"),"CE#{ce_id} duplicate #{kind}#{id}")}
            additions=extra_script(arr).split(marker,2)[0].sub(/\Aslv437_messages=\[\]\n/,'')
            setp(candidates[0],[original.sub(marker,additions+marker)])
            added+=arr.length*USES.fetch(ce_id).length
          end

          # Existing CE1059 already drops BOTH requested Fire Ghost items.
          # Only the courage-potion rate is wrong: 1 in 3 -> 1 in 8 (12.5%).
          # Its blessed armor-scroll rate is already 0.1%, so do not add rolls.
          ghost=list(ces[1059])
          check(ghost.any?{|c|cc(c)==126 && cp(c)[0]==3},'native ghost courage potion missing')
          check(ghost.any?{|c|cc(c)==126 && cp(c)[0]==35},'native ghost blessed armor scroll missing')
          exact(ghost,122,[78,78,0,2,0,2],[78,78,0,2,0,7],'ghost courage 33.33 to 12.5 pct')

          LOCAL.each do |ref,drops_text|
            mid,eid=ref.split(':').map(&:to_i)
            obj=event(maps,ref)
            death_index=(ref=='31:11' ? 1 : 2)
            pg=page(obj,death_index)
            check(iv(pg,:@trigger)==4,"#{ref} expected native death event")
            cmds=list(pg)
            check(cc(cmds.last)==0,"#{ref} death end missing")
            drops=parse_drops(drops_text)
            # Keep everything in the existing death page. No new common event.
            check(!cmds.any?{|c|[355,655].include?(cc(c)) && cp(c)[0].to_s.include?('slv437_messages=[]')},"#{ref} already has added script")
            newc=RPG::EventCommand.allocate
            newc.instance_variable_set(:@code,355)
            newc.instance_variable_set(:@indent,0)
            newc.instance_variable_set(:@parameters,[extra_script(drops)])
            cmds.insert(0,newc)
            added+=drops.length
          end
          check(added==184,"expected 184 genuinely new item rolls; got #{added}")

          # Edit SLV541.DATA's original literal instead of adding another runtime table.
          sp=File.join(DATA_DIR,'Scripts.rxdata')
          scripts=Marshal.load(File.binread(sp))
          idx=scripts.each_index.find{|i|scripts[i].is_a?(Array)&&scripts[i][1]=='V230 Boss Respawn 60s 180s'}
          check(!idx.nil?,"V1.4 original SLV541 script")
          source=Zlib::Inflate.inflate(scripts[idx][2]).force_encoding('UTF-8')
          line=source.match(/^  DATA=(\{.*\})$/)
          check(!line.nil?,"SLV541 DATA literal")
          stats=eval(line[1])
          STATS={
            '3:6'=>{11=>['60/120','75/150'],12=>['30','35']},
            '5:12'=>{11=>['60/120','75/150'],12=>['30','35']},
            '6:6'=>{11=>['60/120','75/150'],12=>['30','35']},
            '35:17'=>{9=>['9999~9999','50~120'],10=>['25/50','30/60']},
            '41:9'=>{0=>[50712,1601],1=>[127000,16800],2=>[76200,10080],3=>[177800,23520],4=>[100000,2400],7=>[65,40],11=>['100/200','35/70'],12=>['70','20']},
            '41:10'=>{12=>['30','20']},'41:11'=>{12=>['30','20']},'41:18'=>{12=>['30','20']}
          }.freeze
          STATS.each do |ref,patch|
            mid,eid=ref.split(':').map(&:to_i)
            row=stats.fetch(mid).fetch(eid)
            patch.each do |ix,(before,after)|
              check(row[ix]==before,"#{ref}[#{ix}] expected #{before.inspect}, saw #{row[ix].inspect}")
              row[ix]=after
            end
          end
          source=source.sub(line[0],'  DATA='+stats.inspect)
          check(source.include?('def self.observe(event)') && source.include?('def self.pay(event,data)'),"existing reward observer preserved")
          scripts[idx][2]=Zlib::Deflate.deflate(source.b)

          # NO changes to SLHotbar: its 9 slots, J/K/L, original inventory assignment
          # and use methods already exist; the failed V1.5 six-KEYS assumption was wrong.
          hot=scripts.find{|it|it.is_a?(Array)&&it[1]=='Mobile Hotbar'}
          check(!hot.nil?,"original item hotbar")
          hot_code=Zlib::Inflate.inflate(hot[2])
          check(hot_code.include?('KEYS=[Input::X,Input::Y,Input::Z,Input::L,Input::F6]'),"original 5 input constants")
          check([74,75,76].all?{|vk|hot_code.include?("return #{vk-68} if Keyboard.testkey(#{vk})")},"original JKL input")
          check(hot_code.include?('def self.assign_from_window(window)'),"original inventory assignment")
          check(hot_code.include?('for i in 0...9'),"original 9-slot display")
          File.binwrite(sp,Marshal.dump(scripts))
          File.binwrite(cp_path,Marshal.dump(ces))
          MAP_IDS.each{|mid|File.binwrite(file(mid),Marshal.dump(maps.fetch(mid)))}

          # Refresh only actual edited data assets' cache references.
          mapping_path=File.join(SITE,'knight/gameasync/mapping.js')
          mapping=File.binread(mapping_path).force_encoding('UTF-8')
          ([sp,cp_path]+MAP_IDS.map{|id|file(id)}).each do |path|
            rel='Data/'+File.basename(path)
            digest=Digest::MD5.file(path).hexdigest
            regex=Regexp.new(Regexp.escape(rel)+'\?h=[a-f0-9]{32}')
            check(mapping.scan(regex).length==1,"cache #{rel}")
            mapping.gsub!(regex,"#{rel}?h=#{digest}")
          end
          File.binwrite(mapping_path,mapping)

          # V1.5 label updates ONLY when every data validation has passed.
          loader=File.join(SITE,'knight/js/sl-assets-v229r115.js')
          t=File.binread(loader)
          check(t.include?("var version='V1.4';"),'V1.4 loader marker')
          File.binwrite(loader,t.sub("var version='V1.4';","var version='V1.5';"))
          ['index.html','knight/index.html'].each do |name|
            path=File.join(SITE,name);t=File.binread(path)
            check(t.include?('V1.4'),"V1.4 title #{name}")
            File.binwrite(path,t.gsub('V1.4','V1.5').gsub('v1.4','v1.5'))
          end
          puts "PASS V1.5 native patch: #{MAP_IDS.length} maps, #{GROUPS.length} existing shared drop CEs, #{LOCAL.length} local death events, #{added} additional item rolls"
          puts 'PASS old Fire Ghost drops corrected rather than duplicated'
          puts 'PASS no change to item hotbar, healer, map collision or Queen'
          RUBY_V15
          ruby -c build/patch_v15.rb
          ruby build/patch_v15.rb site

      - name: Regression test original item-slot registration
        shell: bash
        run: |
          set -euo pipefail
          cat > build/verify_v15.rb <<'RUBY_VERIFY'
          require 'zlib'
          module RPG;class Item;end;end
          root=ARGV.fetch(0)
          sc=Marshal.load(File.binread(File.join(root,'knight/gameasync/Data/Scripts.rxdata')))
          idx=sc.index{|x|x.is_a?(Array)&&x[1]=='Mobile Hotbar'}
          raise 'original item hotbar missing' unless idx
          hot=Zlib::Inflate.inflate(sc[idx][2]).force_encoding('UTF-8')
          raise 'V1.4 JKL lost' unless (74..76).all?{|k|hot.include?("Keyboard.testkey(#{k})")}

          module Input
           X=1;Y=2;Z=3;L=4;F6=5
           def self.trigger?(code);false;end
          end
          module Keyboard
           def self.testkey(code);@code==code;end
           def self.press(code);@code=code;end
          end
          class Scene_Item
           def update_item;end
          end
          class Scene_Item2
           def update_item;end
          end
          class Scene_Map
           def update;end
          end
          class RPG::Item
           attr_accessor :id,:common_event_id,:scope,:consumable,:menu_se,:name,:icon_name
           def initialize(id)
            @id=id;@common_event_id=80;@scope=0;@consumable=false
            @menu_se='ok';@name="Item#{id}";@icon_name='test'
           end
          end
          class FakeSystem
           attr_accessor :sounds
           def initialize;@sounds=[];end
           def se_play(a);@sounds<<a;end
          end
          class FakeParty
           def item_number(id);2;end
           def item_can_use?(id);true;end
           def lose_item(id,count);end
          end
          $game_system=FakeSystem.new
          $game_party=FakeParty.new
          $data_system=Struct.new(:decision_se,:buzzer_se).new('ok','bad')
          $data_items=Array.new(200)
          $game_temp=Struct.new(:common_event_id).new(0)
          [101,102,103].each{|id|$data_items[id]=RPG::Item.new(id)}

          eval(hot,TOPLEVEL_BINDING,'Mobile Hotbar')
          raise 'not 9 slots' unless SLHotbar.slots.size==9
          [74,75,76].each_with_index do |key,index|
           Keyboard.press(key)
           selected=Struct.new(:item).new($data_items[101+index])
           raise "register failed #{key}" unless SLHotbar.assign_from_window(selected)
           raise "item slot #{index+7} wrong" unless SLHotbar.slots[index+6]==101+index
           raise "use slot #{index+7} failed" unless SLHotbar.use_triggered
           raise 'original common event not executed' unless $game_temp.common_event_id==80
          end
          puts 'PASS original V1.4 inventory selects and uses item slots 7-9 J/K/L, without modifying hotbar code'
          RUBY_VERIFY
          ruby -c build/verify_v15.rb
          ruby build/verify_v15.rb site | tail -1

      - name: Verify all non-target game files unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_V15_VERIFY'
          from pathlib import Path
          import hashlib, json
          root=Path('site')
          before=json.loads(Path('build/v14_manifest.json').read_text('utf8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert len(after)==5623 and set(after)==set(before)
          pre='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          mods={'knight/gameasync/Data/Scripts.rxdata',
                pre+'CommonEvents.rxdata',
                'knight/gameasync/mapping.js',
                'knight/js/sl-assets-v229r115.js',
                'index.html','knight/index.html'}
          mods|={pre+f'Map{mid:03d}.rxdata' for mid in (3,31,35,37,41)}
          changed={k for k in after if before[k]!=after[k]}
          assert changed==mods, {'missing':sorted(mods-changed),'unexpected':sorted(changed-mods)}
          assert before[pre+'Map025.rxdata']==after[pre+'Map025.rxdata']
          assert before['knight/js/dpad.js']==after['knight/js/dpad.js']
          mapping=(root/'knight/gameasync/mapping.js').read_text('utf8')
          for rel in sorted(mods):
            if '/Data/' not in rel:continue
            file=root/rel
            digest=hashlib.md5(file.read_bytes()).hexdigest()
            assert mapping.count('Data/'+file.name+'?h='+digest)==1,rel
          assert "var version='V1.5';" in (root/'knight/js/sl-assets-v229r115.js').read_text('utf8')
          print('PASS V1.5 changed exactly',len(changed),'files')
          print('PASS Queen, all unrelated monsters and original hotbar UI unchanged')
          PY_V15_VERIFY

      - name: Publish V1.5
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
