
name: V197 | SLFairy Event-Gated Auto Attack + Runtime Diagnostics

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  V194_SHA: 9492ce1d84fcbc288503309f88732ef6554ee634
  BASE178_SHA: 49e7f27f099c792ecb1cb379ac3c087f8bc91cf0
  Z105_SHA: e19659507b466b87a671949532b02484bc1faaef
  Z104_SHA: e044e1b6c53646b4c4f21f2dfee4967a68fabbc4
  DUAL_BASE_SHA: 04ce66ec99abc10f77143de53650685db8949532
  CURRENT_Z10_SHA: f545634bafbe1e1e55aaf6489126ad17b07da382
  BASELINE_SHA: c6815cd461dba60ec131898e6d5dd8690dd915ae
  X2_SHA: 6d941bd643dda87b8267ba466e108d1904c22331
  Z1_SHA: 008b6abe81074b7af877806b45f2314004a74f66
  Z3_SHA: 5a46988b048764e8a99700998c1f4ab96a3ec5c1
  CE_FIX_SHA: e30b0c41dc7fe7ec49fa17501d198339f7006cf6
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  FAIRY_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLFairy_Source_v1.zip
  FAIRY_SHA256: 67b88b5fe0cde3c9f2fada889815f9aa7d0fc94b378025529e9950d55151c70e
  FAIRY_7Z_PASSWORD: http://nemo838.tistory.com/
  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout V194 frozen source
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.V194_SHA }}', path: v194}
      - name: Checkout V178 frozen source
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.BASE178_SHA }}', path: base178}
      - name: Checkout z10.5 source
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.Z105_SHA }}', path: z105src}
      - name: Checkout z10.4 source
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.Z104_SHA }}', path: z104src}
      - name: Checkout dual base
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.DUAL_BASE_SHA }}', path: dualbase}
      - name: Checkout z10 source
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.CURRENT_Z10_SHA }}', path: z10src}
      - name: Checkout baseline
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.BASELINE_SHA }}', path: baseline}
      - name: Checkout auto base
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.X2_SHA }}', path: x2}
      - name: Checkout monster base z1
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.Z1_SHA }}', path: z1}
      - name: Checkout monster base z3
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.Z3_SHA }}', path: z3}
      - name: Checkout CE fix source
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.CE_FIX_SHA }}', path: cefix}
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake cmake curl ffmpeg freepats git imagemagick libtool make mm-common patch pkg-config python3 rake ruby timidity unzip wget xz-utils fonts-nanum p7zip-full nodejs
      - name: Checkout engine
        uses: actions/checkout@v4
        with: {repository: pulsejet/mkxp-web, ref: '${{ env.MKXP_SRC_REF }}', path: engine}
      - name: Cache engine dependencies
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-${{ runner.os }}-${{ env.EMSDK_VER }}-186

      - name: Extract frozen successful V194 stages
        run: |
          set -euo pipefail
          ruby -ryaml - <<'RB'
          steps = YAML.load_file('v194/.github/workflows/build-slknight-web.yml').fetch('jobs').fetch('build').fetch('steps')
          names = {
            'extract' => 'Extract 178 runtime steps',
            'rebuild' => 'Rebuild exact 178 runtime base',
            'freeze' => 'Freeze 178 dpad hashes',
            'knight' => 'Fix Knight potions transform and Assassin',
            'fairy' => 'Fix Fairy compatibility title and new game flow',
            'shell' => 'Fix browser shell without touching dpad',
            'package' => 'Build dual site',
            'verify' => 'Minimal package check'
          }
          names.each do |key, name|
            matches = steps.select { |s| s['name'] == name && s['run'] }
            abort "V194 stage mismatch: #{name}" unless matches.length == 1
            File.write("/tmp/v194_#{key}.sh", matches[0]['run'])
          end
          puts 'FROZEN_V194_STEPS_READY'
          RB

      - name: Rebuild working V194 without unsafe target hook
        run: |
          set -euo pipefail
          for step in extract rebuild freeze knight fairy shell; do
            bash -e "/tmp/v194_${step}.sh"
          done
          echo V194_BASE_READY_WITHOUT_LINE_HOOK

      - name: V197 restore native resolution and event-gated target search
        run: |
          set -euo pipefail
          ruby -EUTF-8:UTF-8 -rzlib - fairy_player/gameasync/Data/Scripts.rxdata <<'RB'
          path = ARGV.fetch(0)
          scripts = Marshal.load(File.binread(path))
          name = 'SLFairy Event Target V197'
          abort 'Previous V194 targeting script found' if scripts.any? { |e| e.is_a?(Array) && e[1].to_s == 'SLFairy Line Target V194' }
          abort 'V197 target already inserted' if scripts.any? { |e| e.is_a?(Array) && e[1].to_s == name }
          changed = 0
          scripts.each do |entry|
            next unless entry.is_a?(Array) && entry.length >= 3
            next unless ['해상도', 'Web Resolution 800x600'].include?(entry[1].to_s)
            code = Zlib::Inflate.inflate(entry[2]).force_encoding('UTF-8')
            code.gsub!('$WINDOW_WIDTH = 800', '$WINDOW_WIDTH = 640')
            code.gsub!('$WINDOW_HEIGHT = 600', '$WINDOW_HEIGHT = 480')
            code.gsub!(/Graphics\.resize_screen\(\s*800\s*,\s*600\s*\)/m, 'Graphics.resize_screen(640, 480)')
            code.gsub!(/\b800\s*,\s*600\b/, '640, 480')
            abort 'Resolution left at 800x600' if code.include?('$WINDOW_WIDTH = 800') || code.include?('$WINDOW_HEIGHT = 600')
            entry[2] = Zlib::Deflate.deflate(code)
            changed += 1
          end
          abort 'No Fairy resolution script' if changed == 0
          active = scripts.find { |e| e.is_a?(Array) && e[1].to_s == 'Web Resolution 800x600' }
          abort 'Active resolution shim missing' unless active
          abort 'Active resolution not 640x480' unless Zlib::Inflate.inflate(active[2]).include?('Graphics.resize_screen(640, 480)')
          target_code = <<'SRC'
          # SL_FAIRY_EVENT_TARGET_V197
          # Normal confirm events remain native. Only adjacent/front-line monster
          # events receive a scoped selection when the ATK key pulses.
          module SLFairyTargetV197
            BOW_RANGE = 8
            MIN_FRAMES = 12
            @previous_event = nil
            @previous_frame = -99999

            def self.weapon_range
              actor = $game_party && $game_party.actors && $game_party.actors[0]
              return 1 unless actor && $data_weapons
              ids = actor.respond_to?(:weapon_ids) ? actor.weapon_ids : [actor.weapon_id]
              ids = [ids] unless ids.is_a?(Array)
              ids.compact.each do |id|
                weapon = $data_weapons[id.to_i]
                return BOW_RANGE if weapon && weapon.name.to_s =~ /(활|궁|보우|bow|crossbow)/i
              end
              1
            end

            def self.enemy?(event)
              data = event.instance_variable_get(:@event)
              page = event.instance_variable_get(:@page)
              return false unless data && page && data.name.to_s.start_with?('[ID')
              return false if event.instance_variable_get(:@erased)
              return false if event.instance_variable_get(:@starting)
              return false if event.through || event.jumping?
              return false if event.character_name.to_s.empty?
              [0, 1, 2].include?(event.trigger)
            end

            def self.find(player, triggers)
              return nil unless triggers.include?(0) && triggers.include?(1)
              return nil unless $game_map && $game_system && $game_temp
              return nil if $game_temp.message_window_showing
              i = $game_system.map_interpreter
              return nil if i && i.running?
              map = $game_map
              dir = player.direction
              dx = (dir == 6 ? 1 : dir == 4 ? -1 : 0)
              dy = (dir == 2 ? 1 : dir == 8 ? -1 : 0)
              return nil if dx == 0 && dy == 0
              # Index occupied tiles once per key pulse, not once per pixel or frame.
              occupied = {}
              map.events.each_value do |ev|
                key = [ev.x, ev.y]
                occupied[key] ||= []
                occupied[key] << ev
              end
              x = player.x
              y = player.y
              step = 0
              while step < weapon_range
                nx = x + dx
                ny = y + dy
                break unless map.valid?(nx, ny)
                blocked = false
                (occupied[[nx, ny]] || []).each do |ev|
                  return ev if enemy?(ev)
                  blocked = true if !ev.through && ev.character_name.to_s != ''
                end
                break if blocked
                break unless map.passable?(x, y, dir)
                x = nx
                y = ny
                step += 1
              end
              nil
            end

            def self.ready?(enemy)
              f = Graphics.frame_count
              return false if enemy.id == @previous_event && f >= @previous_frame && f - @previous_frame < MIN_FRAMES
              @previous_event = enemy.id
              @previous_frame = f
              true
            end
          end

          class Game_Player
            alias sl_fairy_v197_original_check_event_trigger_there check_event_trigger_there
            def check_event_trigger_there(triggers)
              if Input.trigger?(Input::C)
                enemy = SLFairyTargetV197.find(self, triggers)
                if enemy
                  if SLFairyTargetV197.ready?(enemy)
                    puts('SLTARGET|START|'+enemy.id.to_s+'|'+Graphics.frame_count.to_s)
                    enemy.start
                    puts('SLTARGET|QUEUED|'+enemy.id.to_s+'|'+Graphics.frame_count.to_s)
                  end
                  return true
                end
              end
              sl_fairy_v197_original_check_event_trigger_there(triggers)
            end
          end

          class Scene_Map
            alias sl_fairy_v197_original_update update
            def update
              before = Graphics.frame_count
              if before % 120 == 0 && @sl_v197_last_tick != before
                @sl_v197_last_tick = before
                puts('SLBEAT|'+before.to_s+'|ENTER')
              end
              sl_fairy_v197_original_update
              if before % 120 == 0 && @sl_v197_last_exit != before
                @sl_v197_last_exit = before
                puts('SLBEAT|'+before.to_s+'|EXIT')
              end
            end
          end
          SRC
          RubyVM::InstructionSequence.compile(target_code, name)
          main_index = scripts.index { |e| e.is_a?(Array) && e[1].to_s == 'Main' }
          abort 'Fairy Main script missing' unless main_index
          scripts.insert(main_index, [99999989, name, Zlib::Deflate.deflate(target_code)])
          File.binwrite(path, Marshal.dump(scripts))
          puts 'V197_NATIVE_EVENT_TARGET_OK'
          RB

      - name: Refresh Fairy Scripts mapping hash after Ruby patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib
          data = Path('fairy_player/gameasync/Data/Scripts.rxdata')
          mapping = Path('fairy_player/gameasync/mapping.js')
          md5 = hashlib.md5(data.read_bytes()).hexdigest()
          content = mapping.read_text(encoding='utf-8')
          pat = r'(\["data/scripts",\s*"Data/Scripts\.rxdata\?h=)[0-9a-f]{32}("\],)'
          changed, count = re.subn(pat, lambda m: m.group(1) + md5 + m.group(2), content)
          if count != 1:
              raise SystemExit('Fairy Data/Scripts.rxdata mapping anchor mismatch: ' + str(count))
          mapping.write_text(changed, encoding='utf-8')
          print('V197_FAIRY_MAPPING_MD5=' + md5)
          PY

      - name: V197 repair Fairy canvas, ATK repeat and status display
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          html_path = Path('fairy_player/index.html')
          html = html_path.read_text(encoding='utf-8')
          old_canvas = 'width="800" height="600"'
          if html.count(old_canvas) != 1:
              raise SystemExit('Fairy 800x600 canvas anchor missing')
          html = html.replace(old_canvas, 'width="640" height="480"', 1)
          html = html.replace('SLFairy 800', 'SLFairy 640')
          # A new HTML query is insufficient if the linked scripts reuse old URLs.
          cache_urls = {
              'gameasync/mapping.js?v=fairy192': 'gameasync/mapping.js?v=fairy197',
              'js/dpad.js?v=fairy800': 'js/dpad.js?v=fairy197'
          }
          for old, new in cache_urls.items():
              if html.count(old) != 1:
                  raise SystemExit('Fairy cache-bust anchor missing: ' + old)
              html = html.replace(old, new, 1)

          # SLNEW/SLTITLE are progress markers, never red errors.
          noisy = '/SLRUNTIMEERR|SLSCRIPTERR|SLTITLE|SLNEW| - err/.test(t)'
          quiet = '/SLRUNTIMEERR|SLSCRIPTERR| - err/.test(t)'
          if html.count(noisy) != 1:
              raise SystemExit('V194 misleading SLNEW error banner anchor missing')
          html = html.replace(noisy, quiet, 1)

          diagnostic = r'''<script id="sl-v197-diagnostic">
          (function(){
            var lastFrame=0,seenAt=0,phase='WAIT',lastTarget='none',lastScene='-';
            var prior=console.log.bind(console), box;
            function ensure(){
              if(box || !document.body)return;
              box=document.createElement('div');box.id='sl-v197-status';
              box.style='position:fixed;left:8px;bottom:8px;z-index:90000;'+
                'pointer-events:none;max-width:55vw;padding:3px 6px;'+
                'border:1px solid #555;background:#111c;color:#ddd;'+
                'font:10px/14px monospace;white-space:normal';
              document.body.appendChild(box);
            }
            console.log=function(){
              var s=Array.prototype.join.call(arguments,' ');
              var pos=s.indexOf('SLBEAT|');
              if(pos>=0){
                var p=s.slice(pos).split('|');
                lastFrame=Number(p[1])||lastFrame; phase=p[2]||'-';
                seenAt=Date.now();
              }
              pos=s.indexOf('SLTARGET|');
              if(pos>=0)lastTarget=s.slice(pos,pos+75);
              pos=s.indexOf('SLFRAME|');
              if(pos>=0){lastScene=s.slice(pos+8).split(/\s/)[0];
                if(lastScene==='Scene_Map'){
                  ['spinner','progress'].forEach(function(id){
                    var el=document.getElementById(id);if(el)el.style.display='none';
                  });
                }
              }
              prior.apply(console,arguments);
            };
            window.addEventListener('error',function(e){
              var text=String(e && e.message || 'unknown');
              lastTarget='JS ERROR: '+text.slice(0,90);
            });
            window.addEventListener('unhandledrejection',function(e){
              var r=e && e.reason;
              lastTarget='PROMISE ERROR: '+String(r && r.message || r || '').slice(0,90);
            });
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',ensure);
            else ensure();
            setInterval(function(){
              ensure();if(!box)return;
              var lag=seenAt?Math.round((Date.now()-seenAt)/1000):-1;
              var state=(seenAt && lag>7)?'STALL':'RUN';
              box.textContent='V197 '+state+' F:'+lastFrame+' '+phase+' '+
                'age:'+lag+'s '+lastScene+' / '+lastTarget;
            },1200);
          })();
          </script>'''
          if html.count('</head>') != 1 or 'sl-v197-diagnostic' in html:
              raise SystemExit('Fairy diagnostic head anchor mismatch')
          html = html.replace('</head>', diagnostic + '</head>', 1)
          html_path.write_text(html, encoding='utf-8')

          pad_path = Path('fairy_player/js/dpad.js')
          pad = pad_path.read_text(encoding='utf-8')
          old_zone = 'box(zone,0,top+8,leftW-8,Math.max(1,h-16));'
          old_attack = 'centerBox(atk,rightLeft+rightW*0.70,top+Math.min(h*0.23,100),94,94);'
          old_cancel = 'centerBox(cancel,rightLeft+rightW*0.43,top+Math.min(h*0.46,190),62,62);'
          old_slots = "hot.style.top=Math.round(Math.max(top+12,top+h-hotH-18))+'px';"
          for old in (old_zone,old_attack,old_cancel,old_slots):
              if pad.count(old) != 1:
                  raise SystemExit('Fairy portrait control anchor missing: ' + old)
          pad = pad.replace(old_zone, 'const panelH=Math.max(110,Math.min(390,h-12));box(zone,0,top+10,leftW-8,panelH);', 1)
          pad = pad.replace(old_attack, 'centerBox(atk,rightLeft+rightW*0.66,top+Math.min(100,panelH*0.30),94,94);', 1)
          pad = pad.replace(old_cancel, 'centerBox(cancel,rightLeft+rightW*0.43,top+Math.min(200,panelH*0.58),62,62);', 1)
          pad = pad.replace(old_slots, "hot.style.top=Math.round(top+Math.min(Math.max(110,panelH-hotH-8),Math.max(0,h-hotH-8)))+'px';", 1)
          target_css = '#sl-pad[data-mode="side"] #sl-dpad{width:126px;height:126px}'
          if pad.count(target_css) != 1:
              raise SystemExit('Fairy landscape pad anchor missing')
          pad = pad.replace(target_css, target_css + '\n#sl-pad[data-mode="side"] #sl-joy-zone{display:none!important}', 1)
          button_mark = "button(pad,'sl-atk','ATK',67,'sl-btn');button(pad,'sl-cancel','X',88,'sl-btn');"
          if pad.count(button_mark) != 1:
              raise SystemExit('Fairy ATK button constructor anchor missing')
          revised = "const fairyAtk=document.createElement('div');fairyAtk.id='sl-atk';fairyAtk.className='sl-btn';fairyAtk.textContent='ATK';pad.appendChild(fairyAtk);bindFairyAutoAtk(fairyAtk);button(pad,'sl-cancel','X',88,'sl-btn');"
          pad = pad.replace(button_mark, revised, 1)
          hook = 'function initSLTouchControls(){'
          if pad.count(hook) != 1:
              raise SystemExit('Fairy touch initialization anchor missing')
          auto = r'''function bindFairyAutoAtk(b){
            let active=false,handle=null;
            function pulse(){if(active)pulseKey(67,90);}
            function stop(e){
              if(e){e.preventDefault();e.stopPropagation();}
              active=false;
              if(handle!==null){clearInterval(handle);handle=null;}
              b.classList.remove('pressed');
              const old=pulseTimers.get(67);
              if(old)clearTimeout(old);
              pulseTimers.delete(67);
              sendKey(67,false);
            }
            b.addEventListener('pointerdown',e=>{
              e.preventDefault();e.stopPropagation();
              if(active)return;
              try{b.setPointerCapture(e.pointerId);}catch(_){}
              active=true;b.classList.add('pressed');
              pulse();handle=setInterval(pulse,260);
            });
            b.addEventListener('pointermove',e=>{
              if(!active)return;
              const r=b.getBoundingClientRect();
              if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)stop(e);
            });
            ['pointerup','pointercancel','lostpointercapture'].forEach(n=>b.addEventListener(n,stop));
            window.addEventListener('blur',()=>stop());
            document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
          }
          '''
          pad = pad.replace(hook, auto + hook, 1)
          pad_path.write_text(pad,encoding='utf-8')
          PY
          node --check fairy_player/js/dpad.js
          sha256sum -c /tmp/knight_dpad_178.sha
          echo FAIRY_CANVAS_AND_PAD_V197_OK

      - name: Assemble unchanged Knight and repaired Fairy
        run: |
          set -euo pipefail
          bash -e /tmp/v194_package.sh
          bash -e /tmp/v194_verify.sh

      - name: Validate Fairy runtime changes
        run: |
          set -euo pipefail
          test -s player/knight/gameasync/Data/Scripts.rxdata
          test -s player/elf/gameasync/Data/Scripts.rxdata
          grep -Fq 'width="640" height="480"' player/elf/index.html
          grep -Fq 'sl-v197-diagnostic' player/elf/index.html
          grep -Fq 'panelH=' player/elf/js/dpad.js
          grep -Fq 'bindFairyAutoAtk' player/elf/js/dpad.js
          grep -Fq 'gameasync/mapping.js?v=fairy197' player/elf/index.html
          grep -Fq 'js/dpad.js?v=fairy197' player/elf/index.html
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          md5 = hashlib.md5(Path('player/elf/gameasync/Data/Scripts.rxdata').read_bytes()).hexdigest()
          txt = Path('player/elf/gameasync/mapping.js').read_text(encoding='utf-8')
          if 'Data/Scripts.rxdata?h=' + md5 not in txt:
              raise SystemExit('Deployed Fairy Scripts hash is stale')
          print('V197_DEPLOY_MAPPING_HASH_OK')
          PY

          ! grep -Fq 'SLFairy Line Target V194' player/elf/index.html
          node --check player/elf/js/dpad.js
          expected=$(cut -d' ' -f1 /tmp/knight_dpad_178.sha)
          actual=$(sha256sum player/knight/js/dpad.js | cut -d' ' -f1)
          test "$actual" = "$expected" || {
            echo 'Knight dpad was altered'; exit 1;
          }
          ruby -rzlib - player/elf/gameasync/Data/Scripts.rxdata <<'RB'
          scripts = Marshal.load(File.binread(ARGV.fetch(0)))
          titles = scripts.map { |entry| entry.is_a?(Array) ? entry[1].to_s : '' }
          abort 'V197 auto missing' unless titles.count('SLFairy Event Target V197') == 1
          abort 'V194 auto remains' if titles.include?('SLFairy Line Target V194')
          shim = scripts.find { |entry| entry.is_a?(Array) && entry[1].to_s == 'Web Resolution 800x600' }
          abort 'Fairy resolution shim missing' unless shim
          body = Zlib::Inflate.inflate(shim[2])
          abort 'Fairy still 800x600' unless body.include?('Graphics.resize_screen(640, 480)')
          puts 'V197_RUNTIME_VALIDATED'
          RB

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with: {path: player}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
