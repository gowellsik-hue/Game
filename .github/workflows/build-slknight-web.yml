
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R33
# PURPOSE: Fix Sanctuary dungeon floor transfer.
# BASE: Successfully deployed V229R32, run 39278837657.
# Preserve combat, movement, renderer, graphics and other maps.
name: build-slknight-web.yml | V229R33 | Clean Native Events and 2x Terrain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: V229R33 Restore verified deployed R32 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39278837657
          name: github-pages
          github-token: ${{ github.token }}
          path: r32

      - name: V229R33 Verify exact R32 source
        shell: bash
        run: |
          set -euo pipefail
          test -s r32/artifact.tar
          mkdir -p site build
          tar -xf r32/artifact.tar -C site
          python3 - <<'PY_BASE'
          import hashlib,json
          from pathlib import Path
          p=Path('site')
          g=p/'knight/gameasync/Data'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          files={
              str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest()
              for f in p.rglob('*') if f.is_file()
          }
          assert len(files)==5472,len(files)
          expected={
              'Scripts.rxdata':'f249b698ae6d1c72535ae2b12559e8bb10494657febc67ba0b23195944f4f7d0',
              pre+'Map045.rxdata':'5a14d0550f3387a9e7c31ca3793fa19a6999a379fa2850f9ee044e2b7a8ef1c4',
              pre+'Map046.rxdata':'ac9688d1d899a828f04f09765a2f01b2397e7d13dda08f3675a1f1c3172120fd',
          }
          for name,digest in expected.items():
              assert hashlib.sha256((g/name).read_bytes()).hexdigest()==digest,name
          for name in ('index.html','knight/index.html'):
              assert 'V229R32' in (p/name).read_text(encoding='utf-8')
          for name in ('knight/js/drive.js','knight/js/dpad.js'):
              assert name in files
          Path('build/r32-original-hashes.json').write_text(
              json.dumps(files,sort_keys=True))
          print('PASS: exact deployed R32 baseline')
          PY_BASE

      - name: V229R33 Repair native staircase contact events only
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r33_stairs.rb <<'RUBY_STAIRS'
          require 'json'
          require 'digest'
          module RPG
            class Map;end
            class MapInfo;end
            class AudioFile;end
            class Tileset;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end
          class Table
            def self._load(raw)
              o=allocate
              o.instance_variable_set(:@raw,raw)
              o
            end
            def _dump(depth=0);@raw;end
            def [](x,y=0,z=0)
              _,w,h,l,_=@raw.unpack('V5')
              return nil if x<0||x>=w||y<0||y>=h||z<0||z>=l
              @raw.byteslice(20+2*(x+y*w+z*w*h),2).unpack1('v')
            end
          end
          class Tone
            def self._load(raw)
              o=allocate
              o.instance_variable_set(:@raw,raw)
              o
            end
            def _dump(depth=0);@raw;end
          end
          class Color<Tone;end

          def get(o,n);o.instance_variable_get('@'+n);end
          def put(o,n,v);o.instance_variable_set('@'+n,v);end

          base='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          path=->(n){base+('%sMap%03d.rxdata'%[pre,n])}
          sets=Marshal.load(File.binread(base+pre+'Tilesets.rxdata'))
          scripts_before=Digest::SHA256.file(base+'Scripts.rxdata').hexdigest
          results={}

          configs=[
            {
              map:45, source_event:1, original:14,
              coords:(200..203).flat_map{|x|(74..75).map{|y|[x,y]}},
              destination:[46,82,94],
              arrival:[96,74]
            },
            {
              map:46, source_event:2, original:12,
              coords:(78..79).flat_map{|x|(94..95).map{|y|[x,y]}},
              destination:[45,198,74],
              arrival:[82,94]
            }
          ]

          configs.each do |cfg|
            mid=cfg.fetch(:map)
            game=Marshal.load(File.binread(path.call(mid)))
            events=get(game,'events')
            count=cfg.fetch(:original)
            raise 'Original event count differs' unless events.size==count

            tile=get(game,'data')
            passage=get(sets.fetch(get(game,'tileset_id')),'passages')
            w=get(game,'width')
            h=get(game,'height')
            expected=mid==45 ? [288,144] : [336,168]
            raise 'Unexpected floor dimensions' unless [w,h]==expected

            allowed=lambda do |x,y|
              x>=0 && y>=0 && x<w && y<h &&
                (passage[tile[x,y,0]]&15)==0
            end

            coords=cfg.fetch(:coords)
            raise 'Blocked stair contact tile' unless coords.all?{|x,y|allowed.call(x,y)}
            raise 'Arrival overlaps stair' if coords.include?(cfg.fetch(:arrival))

            ev=events.fetch(cfg.fetch(:source_event))
            raise 'Original stair moved' unless coords.include?([get(ev,'x'),get(ev,'y')])

            pages=get(ev,'pages')
            raise 'Unexpected stair pages' unless pages.size==1
            page=pages.first
            raise 'Wrong stair trigger' unless get(page,'trigger')==1

            commands=get(page,'list')
            codes=commands.map{|c|get(c,'code')}
            raise 'Unknown stair script' unless codes==[111,121,201,0,411,0,412,0]

            transfer=get(commands[2],'parameters')
            raise 'Wrong destination' unless transfer[0,4]==[0]+cfg.fetch(:destination)

            # Remove the conditional variable 483 gate only here.
            # Preserve switch 997 and original native transfer.
            simplified=[commands[1],commands[2],commands[-1]].map do |c|
              Marshal.load(Marshal.dump(c))
            end
            simplified.each{|c|put(c,'indent',0)}
            put(page,'list',simplified)
            put(page,'through',true)
            put(page,'always_on_top',false)

            originals=events.transform_values{|o|Marshal.dump(o)}
            added=[]

            coords.each do |xy|
              next if xy==[get(ev,'x'),get(ev,'y')]
              occupied=events.any? do |eid,e|
                eid!=cfg.fetch(:source_event) &&
                  [get(e,'x'),get(e,'y')]==xy
              end
              raise 'Contact overlaps another event' if occupied

              fresh=Marshal.load(Marshal.dump(ev))
              eid=901+added.size
              raise 'Event ID collision' if events.key?(eid)
              put(fresh,'id',eid)
              put(fresh,'name',"SLTI_FloorTransfer_#{mid}_#{eid}")
              put(fresh,'x',xy[0])
              put(fresh,'y',xy[1])
              events[eid]=fresh
              added<<eid
            end

            originals.each do |eid,bytes|
              next if eid==cfg.fetch(:source_event)
              raise "Unrelated event changed #{mid}/#{eid}" unless
                Marshal.dump(events.fetch(eid))==bytes
            end
            raise 'Wrong final event count' unless events.size==count+coords.size-1
            raise 'Core engine modified' unless
              Digest::SHA256.file(base+'Scripts.rxdata').hexdigest==scripts_before

            File.binwrite(path.call(mid),Marshal.dump(game))
            results[mid.to_s]={
              sourceEvents:count,eventsAfter:events.size,
              stairOriginalId:cfg.fetch(:source_event),
              stairIds:[cfg.fetch(:source_event)]+added,
              footprint:coords,
              destination:cfg.fetch(:destination),
              returnArrival:cfg.fetch(:arrival),
              conditional483Removed:true,
              nativeSwitch997Preserved:true
            }
            puts "PASS Map#{mid}: #{coords.size} step-on contacts, destination #{transfer[1]}"
          end

          File.write('build/r33-stairs.json',JSON.pretty_generate(results))
          RUBY_STAIRS
          ruby -c /tmp/r33_stairs.rb
          ruby /tmp/r33_stairs.rb

      - name: V229R33 Register modified floor data and version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_REGISTER'
          import hashlib,re
          from pathlib import Path
          root=Path('site')
          game=root/'knight/gameasync'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          mapping=game/'mapping.js'
          text=mapping.read_text(encoding='utf-8')

          for mid in (45,46):
              rel=f'Data/{pre}Map{mid:03}.rxdata'
              digest=hashlib.md5((game/rel).read_bytes()).hexdigest()
              pattern=re.escape(rel+'?h=')+r'[0-9a-f]{32}'
              text,n=re.subn(pattern,lambda m:rel+'?h='+digest,text)
              assert n==1,(rel,n)

          mapping.write_text(text,encoding='utf-8')
          for rel in ('index.html','knight/index.html'):
              p=root/rel
              s=p.read_text(encoding='utf-8')
              assert 'V229R32' in s,rel
              p.write_text(
                  s.replace('V229R32','V229R33').replace('v229r32','v229r33'),
                  encoding='utf-8'
              )
          print('PASS two floor mappings and R33 version updated')
          PY_REGISTER
          node --check site/knight/gameasync/mapping.js

      - name: V229R33 Verify staircase path and transfer data
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r33_verify.rb <<'RUBY_VERIFY'
          require 'json'
          require 'zlib'
          module RPG
            class Map;end
            class MapInfo;end
            class AudioFile;end
            class Tileset;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end
          class Table
            def self._load(raw)
              o=allocate
              o.instance_variable_set(:@raw,raw)
              o
            end
            def _dump(depth=0);@raw;end
            def [](x,y=0,z=0)
              _,w,h,depth,_=@raw.unpack('V5')
              return nil if x<0||y<0||z<0||x>=w||y>=h||z>=depth
              @raw.byteslice(20+2*(x+y*w+z*w*h),2).unpack1('v')
            end
          end
          class Tone
            def self._load(raw)
              o=allocate
              o.instance_variable_set(:@raw,raw)
              o
            end
            def _dump(d=0);@raw;end
          end
          class Color<Tone;end
          def val(o,k);o.instance_variable_get('@'+k);end

          root='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          readmap=->(id){Marshal.load(File.binread(root+('%sMap%03d.rxdata'%[pre,id])))}
          scripts=Marshal.load(File.binread(root+'Scripts.rxdata'))
          eval(Zlib::Inflate.inflate(scripts[21][2]),TOPLEVEL_BINDING,'Game_Map_native')
          class RPG::Map;attr_reader :width,:height,:data;end

          tilesets=Marshal.load(File.binread(root+pre+'Tilesets.rxdata'))
          report=JSON.parse(File.read('build/r33-stairs.json'))

          report.each do |key,meta|
            mid=key.to_i
            map=readmap.call(mid)
            events=val(map,'events')
            raise 'Event count differs' unless events.size==meta.fetch('eventsAfter')

            ts=tilesets.fetch(val(map,'tileset_id'))
            gm=Game_Map.allocate
            gm.instance_variable_set(:@map,map)
            gm.instance_variable_set(:@passages,val(ts,'passages'))
            gm.instance_variable_set(:@priorities,val(ts,'priorities'))
            gm.instance_variable_set(:@events,{})

            actual=meta.fetch('stairIds').map{|eid|events.fetch(eid)}
            coords=actual.map{|e|[val(e,'x'),val(e,'y')]}
            raise 'Incomplete contacts' unless coords.sort==meta.fetch('footprint').sort

            start=mid==45 ? [96,74] : [82,94]
            width=val(map,'width')
            height=val(map,'height')
            raise 'Blocked arrival' unless gm.passable?(start[0],start[1],0)
            q=[start]
            reached={start=>true}
            head=0
            while head<q.size
              cx,cy=q[head]
              head+=1
              [[cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]].each do |nx,ny|
                next unless nx>=0 && ny>=0 && nx<width && ny<height
                pos=[nx,ny]
                next if reached[pos] || !gm.passable?(nx,ny,0)
                reached[pos]=true
                q<<pos
              end
            end
            raise 'Stair unreachable from entrance' unless
              coords.any?{|xy|reached[xy]}

            actual.each do |ev|
              x=val(ev,'x')
              y=val(ev,'y')
              raise 'Blocked contact' unless
                [0,2,4,6,8].all?{|dir|gm.passable?(x,y,dir)}

              page=val(ev,'pages').first
              raise 'Not player-touch trigger' unless
                val(page,'trigger')==1 && val(page,'through')==true
              raise 'Unexpected graphic' unless
                val(val(page,'graphic'),'character_name').empty?

              cmds=val(page,'list')
              raise 'Invalid commands' unless
                cmds.map{|c|val(c,'code')}==[121,201,0]
              raise 'Switch 997 missing' unless
                val(cmds[0],'parameters')==[997,997,0]
              raise 'Invalid transfer' unless
                val(cmds[1],'parameters')[0,4]==[0]+meta.fetch('destination')
            end

            raise 'Arrival overlaps return contact' if
              coords.include?(meta.fetch('returnArrival'))
            puts "PASS Map#{mid}: #{coords.size} reachable stair contacts"
          end

          report.each do |mid,meta|
            target,x,y=meta.fetch('destination')
            map=readmap.call(target)
            ts=tilesets.fetch(val(map,'tileset_id'))
            gm=Game_Map.allocate
            gm.instance_variable_set(:@map,map)
            gm.instance_variable_set(:@passages,val(ts,'passages'))
            gm.instance_variable_set(:@priorities,val(ts,'priorities'))
            gm.instance_variable_set(:@events,{})
            raise 'Blocked destination' unless gm.passable?(x,y,0)
            raise 'Automatic reverse transfer risk' if
              report.fetch(target.to_s).fetch('footprint').include?([x,y])
          end
          puts 'PASS 1F/2F transfers have walkable destinations'
          RUBY_VERIFY
          ruby -c /tmp/r33_verify.rb
          ruby /tmp/r33_verify.rb | tee build/r33-native-verify.txt

          python3 - <<'PY_AUDIT'
          import hashlib,json
          from pathlib import Path
          root=Path('site')
          before=json.loads(Path('build/r32-original-hashes.json').read_text())
          after={
              str(f.relative_to(root)):hashlib.sha256(f.read_bytes()).hexdigest()
              for f in root.rglob('*') if f.is_file()
          }
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          allowed={
              f'knight/gameasync/Data/{pre}Map045.rxdata',
              f'knight/gameasync/Data/{pre}Map046.rxdata',
              'knight/gameasync/mapping.js',
              'knight/index.html',
              'index.html'
          }
          assert set(before)==set(after)
          changes={k for k in before if before[k]!=after[k]}
          assert changes==allowed,('Unexpected changes',changes^allowed)
          for name in ('index.html','knight/index.html'):
              assert 'V229R33' in (root/name).read_text(encoding='utf-8')
          print('PASS exact 5-file modification; R32 engine/graphics untouched')
          PY_AUDIT

      - name: V229R33 Upload staircase repair audit
        uses: actions/upload-artifact@v4
        with:
          name: SLKnight-V229R33-Native-Stair-Transfer-Audit
          path: |
            build/r33-stairs.json
            build/r33-native-verify.txt
          if-no-files-found: error
          retention-days: 30

      - name: V229R33 Upload game to EXISTING GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
