              if (p && p.style.display !== 'none') {
                p.textContent = slTraceLines.join('\n');
                p.scrollTop = p.scrollHeight;
              }
            }

            function isUseful(text) {
              return (
                /SLFONTREADY\|/i.test(text) ||
                /SLFONTERR\|/i.test(text) ||
                /SLFONTNAME\|/i.test(text) ||
                /SLLOAD\|/i.test(text) ||
                /SLSCRIPTERR\|/i.test(text) ||
                /SLBACKTRACE\|/i.test(text) ||
                /SLPATCH\|/i.test(text) ||
                /SLMAIN\|/i.test(text) ||
                /SLMAINCALL\|/i.test(text) ||
                /SLMAINREADY\|/i.test(text) ||
                /SLFRAME\|/i.test(text) ||
                /SLSCENECHANGE\|/i.test(text) ||
                /SLRUNTIMEERR\|/i.test(text) ||
                /SLRUNTIMEBT\|/i.test(text) ||
                /JS ERROR/i.test(text) ||
                /PROMISE ERROR/i.test(text)
              );
            }

            function isActualError(text) {
              return (
                /SLFONTERR\|/i.test(text) ||
                /SLSCRIPTERR\|/i.test(text) ||
                /SLRUNTIMEERR\|/i.test(text) ||
                /JS ERROR/i.test(text) ||
                /PROMISE ERROR/i.test(text)
              );
            }

            function add(value, force) {
              var text = String(value);

              if (!force && !isUseful(text)) return;

              remember(text);

              if (force || isActualError(text)) {
                var b = errorButton();
                b.style.display = 'block';

                var p = tracePanel();
                p.textContent = slTraceLines.join('\n');
                p.style.display = 'block';
                p.scrollTop = p.scrollHeight;
              }
            }

            var oldLog = console.log.bind(console);

            console.log = function () {
              var args = Array.prototype.slice.call(arguments);

              oldLog.apply(console, args);

              add(
                args.join(' '),
                false
              );
            };

            var oldError = console.error.bind(console);

            console.error = function () {
              var args = Array.prototype.slice.call(arguments);

              oldError.apply(console, args);

              add(
                args.join(' '),
                false
              );
            };

            window.addEventListener(
              'error',
              function (e) {
                add(
                  'JS ERROR | ' +
                  String(e.message) +
                  ' | ' +
                  String(e.filename || '') +
                  ':' +
                  String(e.lineno || '') +
                  ':' +
                  String(e.colno || ''),
                  true
                );
              }
            );

            window.addEventListener(
              'unhandledrejection',
              function (e) {
                add(
                  'PROMISE ERROR | ' +
                  String(e.reason),
                  true
                );
              }
            );
          })();
          </script>
          '''

          html = html.replace(
              "<head>",
              "<head>\n" + trace_script,
              1,
          )

          old_prerun = "preRun: [createDummies],"

          new_prerun = r'''preRun: [function() {
                createDummies();

                var slFonts = [
                    [
                        'NanumGothic.ttf',
                        'gameasync/Fonts/NanumGothic.ttf?v=v11fix1'
                    ],
                    [
                        'NanumGothicBold.ttf',
                        'gameasync/Fonts/NanumGothicBold.ttf?v=v11fix1'
                    ]
                ];

                slFonts.forEach(function(item) {
                    var name = item[0];
                    var url = item[1];
                    var fullPath = '/game/Fonts/' + name;

                    try {
                        if (FS.analyzePath(fullPath).exists) {
                            FS.unlink(fullPath);
                        }
                    } catch (e) {
                    }

                    FS.createPreloadedFile(
                        '/game/Fonts',
                        name,
                        url,
                        true,
                        true,
                        function() {
                            console.log(
                                'SLFONTREADY|' +
                                name
                            );
                        },
                        function() {
                            console.error(
                                'SLFONTERR|' +
                                name
                            );
                        }
                    );
                });
            }],'''

          if old_prerun not in html:
              raise SystemExit("preRun patch target missing")

          html = html.replace(
              old_prerun,
              new_prerun,
              1,
          )

          old_dpad = '<script src="js/dpad.js"></script>'
          new_dpad = '<script src="js/dpad.js?v=v11fix1"></script>'

          if old_dpad not in html:
              raise SystemExit("dpad script target missing")

          html = html.replace(
              old_dpad,
              new_dpad,
              1,
          )

          html, c1 = re.subn(
              r"var namespace = '[^']*';",
              "var namespace = 'slknight_v11_fullfix1';",
              html,
              count=1,
          )

          html, c2 = re.subn(
              r"var wTitle = '[^']*'\s*;?",
              "var wTitle = 'SLKnight V11';",
              html,
              count=1,
          )

          html = html.replace(
              "<title>MKXP</title>",
              "<title>SLKnight V11</title>",
              1,
          )

          if c1 != 1:
              raise SystemExit("namespace patch failed")

          if c2 != 1:
              raise SystemExit("title patch failed")

          path.write_text(
              html,
              encoding="utf-8",
          )

          print("V11_BASE_BROWSER_PATCH_OK")
          PY

          touch player/.nojekyll

      - name: Apply V11 browser audio and performance bridge
        run: |
          set -e

          cat > /tmp/v11_browser_patch.py <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          html = path.read_text(encoding="utf-8")

          bridge = r'''
          <script>
          (function () {
            window.skfTargetFrameRate = 50;

            function makeChannel(loop) {
              var a = new Audio();

              a.preload = 'auto';
              a.loop = loop;
              a.playsInline = true;

              a.setAttribute(
                'playsinline',
                ''
              );

              a._slBaseVolume = 1.0;
              a._slFadeTimer = 0;
              a._slSource = '';

              return a;
            }

            var bgm = makeChannel(true);
            var bgs = makeChannel(true);
            var me = makeChannel(false);

            var bgmPausedForMe = false;
            var pending = [];

            function clamp(v, lo, hi) {
              v = Number(v);

              if (!isFinite(v)) {
                v = lo;
              }

              return Math.max(
                lo,
                Math.min(
                  hi,
                  v
                )
              );
            }

            function clearFade(a) {
              if (a._slFadeTimer) {
                clearInterval(
                  a._slFadeTimer
                );

                a._slFadeTimer = 0;
              }
            }

            function audioUrl(filename) {
              var p =
                String(
                  filename || ''
                ).replace(
                  /\\/g,
                  '/'
                );

              p = p.replace(
                /\.(ogg|mp3|wav|wma|aac|m4a|flac|mid|midi)$/i,
                ''
              );

              return encodeURI(
                'gameasync/' +
                p +
                '.ogg?v=v11audio1'
              );
            }

            function safePlay(a) {
              if (
                !a ||
                !a.src
              ) {
                return;
              }

              try {
                var p = a.play();

                if (
                  p &&
                  typeof p.catch ===
                  'function'
                ) {
                  p.catch(
                    function () {
                      if (
                        pending.indexOf(a) <
                        0
                      ) {
                        pending.push(a);
                      }
                    }
                  );
                }
              } catch (e) {
                if (
                  pending.indexOf(a) <
                  0
                ) {
                  pending.push(a);
                }
              }
            }

            function retryPending() {
              var list =
                pending.slice();

              pending.length =
                0;

              list.forEach(
                function (a) {
                  safePlay(a);
                }
              );
            }

            [
              'touchstart',
              'pointerdown',
              'keydown',
              'mousedown'
            ].forEach(
              function (type) {
                window.addEventListener(
                  type,
                  retryPending,
                  {
                    passive: true
                  }
                );
              }
            );

            function setSource(
              a,
              filename,
              volume,
              pitch
            ) {
              clearFade(a);

              var src =
                audioUrl(filename);

              var changed =
                a._slSource !==
                src;

              a._slBaseVolume =
                clamp(
                  volume,
                  0,
                  100
                ) /
                100;

              a.volume =
                a._slBaseVolume;

              a.playbackRate =
                clamp(
                  pitch,
                  50,
                  150
                ) /
                100;

              if (changed) {
                a.pause();

                a._slSource =
                  src;

                a.src =
                  src;

                a.load();
              }

              return changed;
            }

            function stop(a) {
              clearFade(a);

              pending =
                pending.filter(
                  function (x) {
                    return x !== a;
                  }
                );

              try {
                a.pause();
              } catch (e) {
              }

              try {
                a.currentTime =
                  0;
              } catch (e) {
              }
            }

            function fade(
              a,
              ms,
              after
            ) {
              clearFade(a);

              ms =
                Math.max(
                  0,
                  Number(ms) ||
                  0
                );

              if (
                ms <= 0 ||
                a.paused
              ) {
                stop(a);

                if (after) {
                  after();
                }

                return;
              }

              var initial =
                a.volume;

              var started =
                performance.now();

              a._slFadeTimer =
                setInterval(
                  function () {
                    var p =
                      (
                        performance.now() -
                        started
                      ) /
                      ms;

                    if (p >= 1) {
                      clearFade(a);
                      stop(a);

                      if (after) {
                        after();
                      }

                      return;
                    }

                    a.volume =
                      Math.max(
                        0,
                        initial *
                        (
                          1 -
                          p
                        )
                      );
                  },
                  50
                );
            }

            function resumeBgmAfterMe() {
              if (!bgmPausedForMe) {
                return;
              }

              bgmPausedForMe =
                false;

              if (bgm.src) {
                bgm.volume =
                  bgm._slBaseVolume;

                safePlay(bgm);
              }
            }

            me.addEventListener(
              'ended',
              resumeBgmAfterMe
            );

            function playBgm(
              filename,
              volume,
              pitch
            ) {
              var changed =
                setSource(
                  bgm,
                  filename,
                  volume,
                  pitch
                );

              var meActive =
                !!me.src &&
                !me.paused &&
                !me.ended;

              if (meActive) {
                bgmPausedForMe =
                  true;

                return;
              }

              if (changed) {
                try {
                  bgm.currentTime =
                    0;
                } catch (e) {
                }
              }

              safePlay(bgm);
            }

            function playBgs(
              filename,
              volume,
              pitch
            ) {
              var changed =
                setSource(
                  bgs,
                  filename,
                  volume,
                  pitch
                );

              if (changed) {
                try {
                  bgs.currentTime =
                    0;
                } catch (e) {
                }
              }

              safePlay(bgs);
            }

            function playMe(
              filename,
              volume,
              pitch
            ) {
              setSource(
                me,
                filename,
                volume,
                pitch
              );

              if (!bgm.paused) {
                bgm.pause();

                bgmPausedForMe =
                  true;
              } else if (bgm.src) {
                bgmPausedForMe =
                  true;
              }

              try {
                me.currentTime =
                  0;
              } catch (e) {
              }

              safePlay(me);
            }

            function parsePlay(parts) {
              return {
                filename:
                  parts.slice(
                    2,
                    -2
                  ).join('|'),

                volume:
                  parts[
                    parts.length -
                    2
                  ],

                pitch:
                  parts[
                    parts.length -
                    1
                  ]
              };
            }

            function handleMarker(text) {
              var at =
                text.indexOf(
                  'SLAUDIO|'
                );

              if (at < 0) {
                return false;
              }

              text =
                text.slice(at);

              var parts =
                text.split('|');

              var kind =
                parts[1] ||
                '';

              var v;

              switch (kind) {
                case 'BGM_PLAY':
                  v =
                    parsePlay(parts);

                  playBgm(
                    v.filename,
                    v.volume,
                    v.pitch
                  );

                  break;

                case 'BGM_STOP':
                  stop(bgm);

                  bgmPausedForMe =
                    false;

                  break;

                case 'BGM_FADE':
                  fade(
                    bgm,
                    parts[2]
                  );

                  bgmPausedForMe =
                    false;

                  break;

                case 'BGS_PLAY':
                  v =
                    parsePlay(parts);

                  playBgs(
                    v.filename,
                    v.volume,
                    v.pitch
                  );

                  break;

                case 'BGS_STOP':
                  stop(bgs);
                  break;

                case 'BGS_FADE':
                  fade(
                    bgs,
                    parts[2]
                  );

                  break;

                case 'ME_PLAY':
                  v =
                    parsePlay(parts);

                  playMe(
                    v.filename,
                    v.volume,
                    v.pitch
                  );

                  break;

                case 'ME_STOP':
                  stop(me);
                  resumeBgmAfterMe();
                  break;

                case 'ME_FADE':
                  fade(
                    me,
                    parts[2],
                    resumeBgmAfterMe
                  );

                  break;

                default:
                  return false;
              }

              return true;
            }

            var previousLog =
              console.log.bind(
                console
              );

            console.log =
              function () {
                var args =
                  Array.prototype.slice.call(
                    arguments
                  );

                try {
                  handleMarker(
                    args.join(' ')
                  );
                } catch (e) {
                  previousLog(
                    'SLAUDIOJSERR|' +
                    String(e)
                  );
                }

                previousLog.apply(
                  console,
                  args
                );
              };

            window.slAudioBridge = {
              bgm: bgm,
              bgs: bgs,
              me: me,
              handle: handleMarker
            };
          })();
          </script>
          '''

          if "window.slAudioBridge" not in html:
              html = html.replace(
                  "<head>",
                  "<head>\n" + bridge,
                  1,
              )

          html = html.replace(
              "slknight_v10_font_touch_fix2",
              "slknight_v11_fullfix1",
          )

          html = html.replace(
              "SLKnight V10",
              "SLKnight V11",
          )

          html = html.replace(
              "v10fix2",
              "v11fix1",
          )

          if "window.skfTargetFrameRate = 50;" not in html:
              raise SystemExit(
                  "frame target insert failed"
              )

          if "window.slAudioBridge" not in html:
              raise SystemExit(
                  "audio bridge insert failed"
              )

          if "slknight_v11_fullfix1" not in html:
              raise SystemExit(
                  "namespace update failed"
              )

          path.write_text(
              html,
              encoding="utf-8",
          )

          print(
              "V11_BROWSER_AUDIO_AND_FPS_OK"
          )
          PY

          python3 \
            /tmp/v11_browser_patch.py \
            player/index.html

          grep -Fq \
            "window.skfTargetFrameRate = 50;" \
            player/index.html

          grep -Fq \
            "window.slAudioBridge" \
            player/index.html

          grep -Fq \
            "slknight_v11_fullfix1" \
            player/index.html

          echo V11_BROWSER_BRIDGE_OK

      - name: Verify final V11 package
        run: |
          set -e

          test -s player/index.html
          test -s player/mkxp.js
          test -s player/mkxp.wasm

          test -s player/js/drive.js
          test -s player/js/dpad.js
          test -s player/js/localforage.min.js

          test -s player/gameasync/Game.ini
          test -s player/gameasync/rgss.rb
          test -s player/gameasync/mapping.js
          test -s player/gameasync/bitmap-map.js

          test -s player/gameasync/Data/Scripts.rxdata

          test -s \
            player/gameasync/Fonts/NanumGothic.ttf

          test -s \
            player/gameasync/Fonts/NanumGothicBold.ttf

          if find \
            player/gameasync \
            -maxdepth 1 \
            -type f \
            -name 'Save*.rxdata' \
            | grep -q .
          then
            echo BUNDLED_SAVE_PRESENT
            exit 1
          fi

          grep -Fq \
            "slknight_v11_fullfix1" \
            player/index.html

          grep -Fq \
            "SLFONTREADY" \
            player/index.html

          grep -Fq \
            "FS.createPreloadedFile" \
            player/index.html

          grep -Fq \
            "NanumGothic.ttf?v=v11fix1" \
            player/index.html

          grep -Fq \
            "js/dpad.js?v=v11fix1" \
            player/index.html

          grep -Fq \
            "touchcancel" \
            player/js/dpad.js

          grep -Fq \
            "releaseAllVirtualKeys" \
            player/js/dpad.js

          grep -Fq \
            "Fonts/NanumGothic.ttf" \
            player/gameasync/mapping.js

          grep -Fq \
            "Fonts/NanumGothicBold.ttf" \
            player/gameasync/mapping.js

          grep -Fq \
            "window.skfTargetFrameRate = 50;" \
            player/index.html

          grep -Fq \
            "window.slAudioBridge" \
            player/index.html

          ruby -rzlib - <<'RB'
          scripts =
            Marshal.load(
              File.binread(
                'player/gameasync/Data/Scripts.rxdata'
              )
            )

          all =
            scripts.map do |entry|
              next '' unless (
                entry.is_a?(Array) &&
                entry.length >= 3
              )

              begin
                Zlib::Inflate.inflate(
                  entry[2]
                )
              rescue
                ''
              end
            end.join("\n")

          abort(
            'web_pre_update missing'
          ) unless all.include?(
            'def web_pre_update'
          )

          abort(
            'browser audio marker missing'
          ) unless all.include?(
            'SLAUDIO'
          )

          abort(
            'map audio retry missing'
          ) unless all.include?(
            'SLPATCH|MAP_AUDIO_RETRY'
          )

          abort(
            '50fps setting missing'
          ) unless all.include?(
            'Graphics.frame_rate = 50'
          )

          abort(
            'old 240x24 ID layout remains'
          ) if all.include?(
            'Bitmap.new(240, 24)'
          )

          abort(
            'MOG HUD lifecycle marker missing'
          ) unless all.include?(
            'alias shud_dispose dispose'
          )

          puts 'V11_SCRIPT_VERIFY_OK'
          RB

          test "$(
            stat -c '%s' \
              player/mkxp.js
          )" = "290574"

          test "$(
            stat -c '%s' \
              player/mkxp.wasm
          )" = "5217852"

          rm -rf player/.git

          echo \
            SLKNIGHT_V11_FULL_FIX_READY

          du -sh player

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player

  deploy:
    name: Deploy GitHub Pages

    needs:
      - build

    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
