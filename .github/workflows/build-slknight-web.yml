
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R83
# BASE: verified deployed V229R82; preserve its movement, S32 and wall settings.
# PLAYER ONLY: replace Input.dir4 by Input.dir8 in original Game_Player update.
# TOUCH ONLY: add four diagonal sectors to the existing round directional pad.
# Diagonal sends two arrow keys; allow moving a finger between eight sectors.
# KEEP: four-facing attack/autoattack, monsters, events, S32, walls, all other data.
name: build-slknight-web.yml | V229R83 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R83 Restore verified deployed R82 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40262441759
          name: github-pages
          github-token: ${{ github.token }}
          path: r82

      - name: V229R83 Verify exact R82 source
        shell: bash
        run: |
          set -euo pipefail
          test -s r82/artifact.tar
          mkdir -p site build
          tar -xf r82/artifact.tar -C site
          python3 - <<'PY_INPUT'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          files={str(f.relative_to(root)):hashlib.sha256(f.read_bytes()).hexdigest() for f in root.rglob('*') if f.is_file()}
          assert len(files)==5517,('Unexpected file count',len(files))
          assert hashlib.sha256((root/'knight/gameasync/Data/Scripts.rxdata').read_bytes()).hexdigest()=='c240b3ad3a292831e60b7a4425b8e038a882fc2c629034f8691c64ac8dd01c4a', 'Not the verified R82 game'
          assert hashlib.sha256((root/'knight/js/dpad.js').read_bytes()).hexdigest()=='a313791be0ef8eeb5edcf57088cf39b860662a318cdb11c2170c70f846688acb', 'Different direction pad'
          assert all('V229R82' in (root/p).read_text('utf-8') for p in ('index.html','knight/index.html'))
          Path('build/base-hashes.json').write_text(json.dumps(files,sort_keys=True))
          print('PASS verified R82 game and original joystick input, 5517 files')
          PY_INPUT

      - name: V229R83 Enable player 8-way input and round touch pad
        shell: bash
        run: |
          set -euo pipefail
          cat > build/patch_player.rb <<'RB_PLAYER'
          require 'zlib'
          require 'digest'
          path='site/knight/gameasync/Data/Scripts.rxdata'
          a=Marshal.load(File.binread(path))
          raise 'Wrong number of scripts' unless a.size==136
          src=Zlib::Inflate.inflate(a[27][2])
          raise 'Wrong original player script' unless Digest::SHA256.hexdigest(src)=='a6b344b8b8b6a83c9f77529eb333d16053ceb32483e6336eb082ad8f03e74ced'
          old=<<'OLD'
                case Input.dir4
                when 2
                  move_down
                when 4
                  move_left
                when 6
                  move_right
                when 8
                  move_up
                end
          OLD
          new=<<'NEW'
                case Input.dir8
                when 1
                  move_lower_left
                when 2
                  move_down
                when 3
                  move_lower_right
                when 4
                  move_left
                when 6
                  move_right
                when 7
                  move_upper_left
                when 8
                  move_up
                when 9
                  move_upper_right
                end
          NEW
          old=old.gsub("\n","\r\n")
          new=new.gsub("\n","\r\n")
          raise 'Expected exactly one player input case' unless src.scan(old).size==1
          fixed=src.sub(old,new)
          raise 'Player code changed outside its direction dispatch' unless fixed.sub(new,old)==src
          raise 'Unexpected player update' unless Digest::SHA256.hexdigest(fixed)=='8ca803d405419fd2d152ac669ae0dac4fa0bbb1c709eef536ef3fef8c3e125ba'
          File.binwrite('build/player27.rb',fixed)
          a[27][2]=Zlib::Deflate.deflate(fixed)
          File.binwrite(path,Marshal.dump(a))
          again=Marshal.load(File.binread(path))
          raise 'Player input change not persisted' unless Zlib::Inflate.inflate(again[27][2])==fixed
          raise 'Another script changed' unless Digest::SHA256.hexdigest(Zlib::Inflate.inflate(again[134][2]))=='bc11e61704567a83c999e657a1af89ae16592cc1e5068b86d1febd9e09a41422'
          puts 'PASS 8-way player only; original 4-facing combat logic preserved'
          RB_PLAYER
          ruby build/patch_player.rb
          ruby -c build/player27.rb

          cat > build/patch_pad.py <<'PY_PAD'
          from pathlib import Path
          import shutil, hashlib, re, json
          SOURCE=Path('site')
          DEST=SOURCE
          assert SOURCE.exists()

          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()

          dpad=DEST/'knight/js/dpad.js'
          assert sha(dpad)=='a313791be0ef8eeb5edcf57088cf39b860662a318cdb11c2170c70f846688acb'
          s=dpad.read_text('utf-8')
          old='''const dirKeys=[37,38,39,40];
          function dirButton(parent,id,label,key){
            const b=document.createElement('div');b.id=id;b.className='sl-dir';b.textContent=label;parent.appendChild(b);
            b.addEventListener('pointerdown',e=>{
              e.preventDefault();e.stopPropagation();
              try{b.setPointerCapture(e.pointerId);}catch(_){}
              parent.querySelectorAll('.sl-dir').forEach(x=>x.classList.remove('pressed'));
              dirKeys.forEach(k=>{if(k!==key)sendKey(k,false);});
              b.classList.add('pressed');sendKey(key,true);
            });
            const up=e=>{if(e){e.preventDefault();e.stopPropagation();}b.classList.remove('pressed');sendKey(key,false);};
            b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
            return b;
          }
          '''
          new='''// V229R83: eight movement sectors; each diagonal holds two ordinary arrow keys.
          // Input.dir8 combines them in Game_Player. No attack-key or monster input changes.
          const dirKeys=[37,38,39,40];
          function dirButton(parent,id,label,keys){
            const b=document.createElement('div');b.id=id;b.className='sl-dir';
            b.textContent=label;b.dataset.dirKeys=keys.join(',');parent.appendChild(b);
            return b;
          }
          function bindEightWayPad(parent){
            let pointer=null,selected=null;
            function select(b){
              if(b===selected)return;
              if(selected)selected.classList.remove('pressed');
              selected=b;
              const keys=b?b.dataset.dirKeys.split(',').map(Number):[];
              dirKeys.forEach(k=>{if(!keys.includes(k))sendKey(k,false);});
              keys.forEach(k=>sendKey(k,true));
              if(b)b.classList.add('pressed');
            }
            function underFinger(e){
              const el=document.elementFromPoint(e.clientX,e.clientY);
              const b=el&&el.closest?el.closest('.sl-dir'):null;
              return b&&b.parentElement===parent?b:null;
            }
            parent.addEventListener('pointerdown',e=>{
              if(pointer!==null)return;
              const b=e.target.closest?e.target.closest('.sl-dir'):null;
              if(!b||b.parentElement!==parent)return;
              e.preventDefault();e.stopPropagation();
              pointer=e.pointerId;
              try{parent.setPointerCapture(pointer);}catch(_){}
              select(b);
            });
            parent.addEventListener('pointermove',e=>{
              if(pointer!==e.pointerId)return;
              e.preventDefault();e.stopPropagation();
              select(underFinger(e));
            });
            const release=e=>{
              if(pointer!==e.pointerId)return;
              if(e){e.preventDefault();e.stopPropagation();}
              pointer=null;select(null);
            };
            parent.addEventListener('pointerup',release);
            parent.addEventListener('pointercancel',release);
            parent.addEventListener('lostpointercapture',release);
            window.addEventListener('blur',()=>{pointer=null;select(null);});
          }
          '''
          assert s.count(old)==1,s.count('const dirKeys=[37,38,39,40];')
          s=s.replace(old,new)
          oldcss='''#sl-dpad{position:absolute;width:184px;height:184px}
          .sl-dir{position:absolute;width:33.3333%;height:33.3333%;display:flex;align-items:center;justify-content:center;box-sizing:border-box;border-radius:13px;background:rgba(55,55,55,.62);border:2px solid rgba(255,255,255,.42);color:#fff;font:700 24px sans-serif;text-shadow:0 1px 2px #000;pointer-events:auto;touch-action:none}
          .sl-dir.pressed{background:rgba(225,225,225,.72);transform:scale(.96)}
          #sl-up{left:33.3333%;top:0}#sl-left{left:0;top:33.3333%}#sl-right{right:0;top:33.3333%}#sl-down{left:33.3333%;bottom:0}
          '''
          newcss='''#sl-dpad{position:absolute;width:184px;height:184px;border-radius:50%;background:rgba(28,36,47,.23);box-shadow:inset 0 0 0 2px rgba(255,255,255,.20)}
          .sl-dir{position:absolute;width:33.3333%;height:33.3333%;display:flex;align-items:center;justify-content:center;box-sizing:border-box;border-radius:13px;background:rgba(55,55,55,.62);border:2px solid rgba(255,255,255,.42);color:#fff;font:700 24px sans-serif;text-shadow:0 1px 2px #000;pointer-events:auto;touch-action:none}
          .sl-dir.pressed{background:rgba(225,225,225,.72);transform:scale(.96)}
          #sl-up{left:33.3333%;top:0}#sl-left{left:0;top:33.3333%}#sl-right{right:0;top:33.3333%}#sl-down{left:33.3333%;bottom:0}
          #sl-ul{left:0;top:0}#sl-ur{right:0;top:0}#sl-dl{left:0;bottom:0}#sl-dr{right:0;bottom:0}
          '''
          assert s.count(oldcss)==1
          s=s.replace(oldcss,newcss)
          oldbuttons="  dirButton(dpad,'sl-up','▲',38);dirButton(dpad,'sl-left','◀',37);dirButton(dpad,'sl-right','▶',39);dirButton(dpad,'sl-down','▼',40);"
          newbuttons="""  dirButton(dpad,'sl-up','▲',[38]);dirButton(dpad,'sl-left','◀',[37]);
            dirButton(dpad,'sl-right','▶',[39]);dirButton(dpad,'sl-down','▼',[40]);
            dirButton(dpad,'sl-ul','↖',[38,37]);dirButton(dpad,'sl-ur','↗',[38,39]);
            dirButton(dpad,'sl-dl','↙',[40,37]);dirButton(dpad,'sl-dr','↘',[40,39]);
            bindEightWayPad(dpad);"""
          assert s.count(oldbuttons)==1
          s=s.replace(oldbuttons,newbuttons)
          assert s.count('function attackButton(parent)')==1
          assert s.count('dirButton(dpad,')==8
          assert s.count('bindEightWayPad(dpad);')==1
          dpad.write_text(s,'utf-8')

          for name in ('index.html','knight/index.html'):
              p=DEST/name
              old=p.read_text('utf-8')
              assert 'V229R82' in old
              assert 'V229R83' not in old
              p.write_text(old.replace('V229R82','V229R83').replace('v229r82','v229r83'),encoding='utf-8')

          print('JS SHA',sha(dpad))
          PY_PAD
          python3 build/patch_pad.py

          python3 - <<'PY_CACHE'
          from pathlib import Path
          import hashlib,re
          base=Path('site/knight/gameasync')
          archive=base/'Data/Scripts.rxdata'
          mapping=base/'mapping.js'
          s=mapping.read_text('utf-8')
          md5=hashlib.md5(archive.read_bytes()).hexdigest()
          s,count=re.subn(r'Data/Scripts\.rxdata\?h=[0-9a-f]{32}',lambda m:'Data/Scripts.rxdata?h='+md5,s)
          assert count==1,count
          mapping.write_text(s,'utf-8')
          print('PASS updated script cache MD5',md5)
          PY_CACHE
          node --check site/knight/js/dpad.js
          node --check site/knight/gameasync/mapping.js

      - name: V229R83 Confirm original four-direction combat and asset integrity
        shell: bash
        run: |
          set -euo pipefail
          ruby -rzlib -rdigest - <<'RB_CHECK'
          path='site/knight/gameasync/Data/Scripts.rxdata'
          a=Marshal.load(File.binread(path))
          raise '136 scripts required' unless a.size==136
          s27=Zlib::Inflate.inflate(a[27][2]);s134=Zlib::Inflate.inflate(a[134][2])
          raise 'Player eight-direction script changed unexpectedly' unless Digest::SHA256.hexdigest(s27)=='8ca803d405419fd2d152ac669ae0dac4fa0bbb1c709eef536ef3fef8c3e125ba'
          raise 'Original R82 wall, attack and monster scripts changed' unless Digest::SHA256.hexdigest(s134)=='bc11e61704567a83c999e657a1af89ae16592cc1e5068b86d1febd9e09a41422'
          raise 'Player still uses dir4' if s27.include?('case Input.dir4')
          raise 'Eight direction input missing' unless s27.include?('case Input.dir8')
          {1=>'move_lower_left',2=>'move_down',3=>'move_lower_right',4=>'move_left',6=>'move_right',7=>'move_upper_left',8=>'move_up',9=>'move_upper_right'}.each do |d,method|
            raise 'missing direction '+d.to_s unless s27.include?("when #{d}\r\n        #{method}")
          end
          puts 'PASS player eight directions and original four-facing combat engine'
          RB_CHECK

          python3 - <<'PY_CHECK'
          from pathlib import Path
          import hashlib,json,re
          root=Path('site')
          orig=json.loads(Path('build/base-hashes.json').read_text('utf-8'))
          now={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(now)==5517 and now.keys()==orig.keys()
          changed={p for p in now if now[p]!=orig[p]}
          allowed={'index.html','knight/index.html','knight/js/dpad.js','knight/gameasync/Data/Scripts.rxdata','knight/gameasync/mapping.js'}
          assert changed==allowed,('Unexpected file changed',changed^allowed)
          js=(root/'knight/js/dpad.js').read_text('utf-8')
          assert hashlib.sha256(js.encode()).hexdigest()=='fe07772e8bb32b4323e6676081bc7e448ab8e627ffdcddac2127fe3a1e056437'
          assert js.count('dirButton(dpad,')==8
          for keys in ('[38,37]','[38,39]','[40,37]','[40,39]'):
            assert keys in js
          assert 'function attackButton(parent)' in js
          assert (root/'knight/index.html').read_text('utf-8').count('js/dpad.js?v=v229r83')==1
          print('PASS eight-pad UI and five authorized file changes; 5512 files unmodified')
          PY_CHECK

      - name: V229R83 Publish eight-way player movement
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
