
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R77
# BASE: byte-exact R66 (run 40125737789), reconstructed from accessible R67.
# FIX 1: delete R66's one-native-axis fallback (wall sliding).
# FIX 2: rebuild the authoritative 1F/2F physical collision layer at BUILD time
# from original S32 Layer3 AND the existing R49 painted wall PARTS and PNG alpha.
# Shrink ONLY the rear wall-base by one screen row; retain continuous LEFT/RIGHT
# under the foreground, block a second DOWN and do not open FRONT-face gaps.
# Existing wall graphics, layer alpha/depth, event collision, monster data, drops,
# spawns, controls, game engine and all 5517 assets are preserved.
# No new release, tags, branches or repository writes. R67 artifact must remain available.
# The original Sanctuary executable collision algorithm is not independently verified.
name: build-slknight-web.yml | V229R77 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:

      - name: V229R77 Reconstruct exact R66 from still-available R67
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p r66 build/r67 site_r67
          gh run download 40193996775 -R "$GITHUB_REPOSITORY" -n github-pages -D build/r67
          test -s build/r67/artifact.tar
          tar -xf build/r67/artifact.tar -C site_r67
            ruby -rzlib -rdigest - <<'RB_EXTRACT'
          p='site_r67/knight/gameasync/Data/Scripts.rxdata'
          a=Marshal.load(File.binread(p))
          raise 'R67 wrong archive' unless a.size==136
          raise 'R67 archive SHA mismatch' unless Digest::SHA256.file(p).hexdigest=='1812f891953226a49b148103d8b69bb48cb1d9bfdacbd54c02eada40169349c5'
          File.binwrite('build/r67-script97.rb',Zlib::Inflate.inflate(a[97][2]))
          File.binwrite('build/r67-script134.rb',Zlib::Inflate.inflate(a[134][2]))
          RB_EXTRACT
            cat > build/restore_original_r66.py <<'PY_RESTORE'
          from pathlib import Path
          import hashlib
          p=Path('build')
          lines=(p/'r67-script97.rb').read_bytes().splitlines(keepends=True)
          assert hashlib.sha256(b''.join(lines)).hexdigest()=='c023b18e41e9517f891e7d88954caa4a056510b894836fcff9eadf4b7fb50d5f'
          for i in (12,47,*range(55,62),108,109):
              assert lines[i].endswith(b'\n') and not lines[i].endswith(b'\r\n'), i
              lines[i]=lines[i][:-1]+b'\r\n'
          s97=b''.join(lines)
          old=b'    if @slti_floor\n      [@tilemap,@tilemap2,@tilemap3,@tilemap4].each do |layer|\n        layer.visible=false unless layer==nil\n      end\n    end\n'
          assert s97.count(old)==1
          s97=s97.replace(old,b'',1)
          for name in (b'@tilemap',b'@tilemap2',b'@tilemap3',b'@tilemap4'):
              before=b'    '+name+b'.update unless @slti_floor\n'
              after=b'    '+name+b'.update\n'
              assert s97.count(before)==1
              s97=s97.replace(before,after,1)
          assert hashlib.sha256(s97).hexdigest()=='6fc857c940ddde1971c11a1fae2a594a4f1745b76345e9c8fab9da034b0ce0e1'
          (p/'r66-script97.rb').write_bytes(s97)

          s=(p/'r67-script134.rb').read_text('utf-8')
          def replace_once(old,new,why):
              global s
              count=s.count(old)
              assert count==1,(why,count)
              s=s.replace(old,new,1)
          replace_once('''        s=p[0]
                  next if s==nil
                  s.bitmap=nil
                  s.dispose unless s.disposed?
          ''','''        s=p[0];s.bitmap=nil;s.dispose unless s.disposed?
          ''','R67 lazy wall disposal 1')
          replace_once('''        sprites << [nil,entry[0],entry[1],entry[2],entry[3],entry[4]]
          ''','''        id,bx0,by0,bx1,by1=entry
                  left=(id%4)*128;top=(id/4)*64
                  s=Sprite.new(@viewport2)
                  s.bitmap=texture
                  s.src_rect.set(left,top,128,64)
                  s.zoom_x=2.0;s.zoom_y=2.0
                  sprites << [s,id,bx0,by0,bx1,by1]
          ''','R67 lazy wall sprite creation')
          replace_once('''    stamp=[sx,sy,@slti_chunks.length,@slti_r49_walls.length,
                     hashero ? hero.x : nil,hashero ? hero.y : nil,
                     hashero ? hero.z : nil,
                     hashero ? hero.src_rect.width : nil,
                     hashero ? hero.src_rect.height : nil]
              if @slti_r67_wall_stamp==stamp &&
                 @slti_r49_walls.length==@slti_chunks.length
                return
              end
              @slti_r67_wall_stamp=stamp
          ''','', 'R67 display stamp')
          replace_once('''          s.visible=false if s!=nil && s.visible
          ''','''          s.visible=false if s.visible
          ''','R67 nil sprite visibility')
          replace_once('''        if s==nil
                    s=Sprite.new(@viewport2)
                    s.bitmap=item[0]
                    s.src_rect.set((id%4)*128,(id/4)*64,128,64)
                    s.zoom_x=2.0;s.zoom_y=2.0
                    part[0]=s
                  end
          ''','', 'R67 lazy wall sprite allocation')
          replace_once('''          s=part[0]
                    next if s==nil
                    s.bitmap=nil
                    s.dispose unless s.disposed?
          ''','''          s=part[0];s.bitmap=nil;s.dispose unless s.disposed?
          ''','R67 lazy wall disposal 2')
          replace_once('''    # No slide or axis fallback at blocked walls.
          ''','''    # Input pad has four buttons: use ONE original open edge to slide
              # along a wall; never pretend a route through the blocked wall exists.
              if edge?(mid,x,y,dx,0)
                return [x+dx,y]
              end
              if edge?(mid,x,y,0,dy)
                return [x,y+dy]
              end
          ''','R67 disabled slide')
          anchor='\n# V229R67: source-S32 guided spawn, native hard stops, and entrance clearance.\n'
          assert s.count(anchor)==1
          s=s.split(anchor)[0]
          print('recovered',hashlib.sha256(s.encode()).hexdigest())
          (p/'r66-script134.rb').write_text(s)
          PY_RESTORE
            python3 build/restore_original_r66.py
            ruby -rzlib -rdigest - <<'RB_PACK'
          p='site_r67/knight/gameasync/Data/Scripts.rxdata'
          a=Marshal.load(File.binread(p))
          raise 'Wrong R67 script count' unless a.size==136
          [97,134].each do |i|
            a[i][2]=Zlib::Deflate.deflate(File.binread("build/r66-script#{i}.rb"))
          end
          File.binwrite(p,Marshal.dump(a))
          raise 'Restored R66 game archive differs' unless Digest::SHA256.file(p).hexdigest=='fe661024a9decb09a6d392594614005722ae7d9ee585c74f79a4f14975cbe678'
          puts 'PASS original R66 136-script archive SHA identical'
          RB_PACK
            python3 - <<'PY_INDEX'
          from pathlib import Path
          import re,hashlib
          root=Path('site_r67');game=root/'knight/gameasync'
          mapping=game/'mapping.js';s=mapping.read_text('utf-8')
          md5=hashlib.md5((game/'Data/Scripts.rxdata').read_bytes()).hexdigest()
          s,n=re.subn(r'Data/Scripts\.rxdata\?h=[0-9a-f]{32}',lambda m:'Data/Scripts.rxdata?h='+md5,s)
          assert n==1
          mapping.write_text(s,'utf-8')
          for name in ('index.html','knight/index.html'):
            p=root/name;s=p.read_text('utf-8')
            assert 'V229R67' in s
            p.write_text(s.replace('V229R67','V229R66').replace('v229r67','v229r66'),'utf-8')
          hashes={'index.html':'97bbddeb6ec022f6e786e6b0a0d7e94e499ea59a66fad6951a39480a634a28c0',
                  'knight/index.html':'a5292a19ff46f146303dbf9c7a3e1d71493e6eaa013b0f1685e8ef7a75d16ac7',
                  'knight/gameasync/mapping.js':'ed3303b17ebabb897bd2aa86f89418f22d10c644fa334db3338083c810669b8d',
                  'knight/gameasync/Data/Scripts.rxdata':'fe661024a9decb09a6d392594614005722ae7d9ee585c74f79a4f14975cbe678'}
          assert len([x for x in root.rglob('*') if x.is_file()])==5517
          for name,expected in hashes.items():
            assert hashlib.sha256((root/name).read_bytes()).hexdigest()==expected,name
          print('PASS exact R66 base: 5517 files, all four R67-only changes reversed')
          PY_INDEX
          tar -cf r66/artifact.tar -C site_r67 .

      - name: V229R77 Read original Sanctuary S32 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source
          gh run download 39385472903 -R "$GITHUB_REPOSITORY" \
            -n Sanctuary-Map-V6.3-Native-Passage-and-Wall-Groups-Handoff -D source
          test -s source/handoff-manifest.json

      - name: V229R77 Verify exact R66 scripts and extract R49 wall drawing geometry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s r66/artifact.tar
          tar -xf r66/artifact.tar -C site
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(files)==5517,len(files)
          for name in ('index.html','knight/index.html'):
           assert 'V229R66' in (root/name).read_text('utf-8')
          archive=root/'knight/gameasync/Data/Scripts.rxdata'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='fe661024a9decb09a6d392594614005722ae7d9ee585c74f79a4f14975cbe678'
          manifest=json.loads(Path('source/handoff-manifest.json').read_text('utf-8'))
          assert manifest['version']=='V6.3' and manifest['passabilityIsOriginalMapToolCandidate']
          assert not manifest['SanctuaryExecutableRulesVerified']
          Path('build/base-hashes.json').write_text(json.dumps(files,sort_keys=True))
          print('PASS user-selected R66 site 5517 files and original Sanctuary S32 source')
          PY_BASE
          ruby -rzlib -rdigest -rjson - <<'RB_EXTRACT'
          a=Marshal.load(File.binread('site/knight/gameasync/Data/Scripts.rxdata'))
          raise 'Wrong game script count' unless a.size==136
          src=Zlib::Inflate.inflate(a[134][2]).force_encoding('UTF-8')
          raise 'Wrong R66 script' unless Digest::SHA256.hexdigest(src)=='6d0b554feef7dfbab436dc9804476ea9952e0d00089a0bbb4a83eb0176c1a10c'
          raise 'R49 wall painter missing' unless src.include?('def slti_r49_update_walls') && src.include?('SLTI_V229R49::PARTS')
          raise 'S32 native engine missing' unless src.include?('module SLTI_Native66')
          raise 'Monster collision missing' unless src.include?(%q{return false if other.x==nx && other.y==ny && other.character_name!=''})
          File.binwrite('build/r66-original134.rb',src)
          line=src.lines.find{|v| v.start_with?('  PARTS=')}
          raise 'Missing exact painted wall bounding rectangles' if line==nil
          eval("module SLTI_V229R49\n"+line+"end\n")
          parts=SLTI_V229R49::PARTS
          raise 'Wrong R49 subrect counts' unless [45,46].map{|m| parts.select{|k,_| k.start_with?("#{m}:")}.values.sum(&:length)}==[315,587]
          File.binwrite('build/r49-parts.json',JSON.generate(parts))
          puts 'PASS exactly original R49 315/587 wall sprites; no changed rendering or game data'
          RB_EXTRACT

      - name: V229R77 Compile one-row shallower original wall-base collision layer
        shell: bash
        run: |
          set -euo pipefail
          cat > build/compile_wallbase.py <<'PY_LAYER'
          """Compile physical wall footpath as the *primary* map collision layer from
          R49's already separated painted foreground + original Sanctuary S32 Layer3.
          No per-coordinate runtime exceptions and no self-moving 'slide'.
          """
          from pathlib import Path
          import sys,struct,zlib,json,hashlib,base64,collections

          SITE=Path(sys.argv[1]); WORK=Path(sys.argv[2]); SOURCE=Path(sys.argv[3])
          PARTS=json.loads((WORK/'r49-parts.json').read_text('utf-8'))
          ROOT=SITE/'knight/gameasync/Graphics/Panoramas'
          OX,OY=32576,32704
          DIMS={45:(256,256,378),46:(320,256,762)}
          STEP={2:(-1,1),4:(-1,-1),6:(1,1),8:(1,-1)}
          BITS={2:1,4:2,6:4,8:8}
          REV={2:8,4:6,6:4,8:2}

          class R49Wall:
           def __init__(self,mid):
            self.mid=mid;self.images={};self.rects={}
            for key,entries in PARTS.items():
             floor,cx,cy=map(int,key.split(':'))
             if floor==mid:self.rects[cx,cy]={r[0]:r[1:] for r in entries}
           def image(self,chunk):
            if chunk in self.images:return self.images[chunk]
            cx,cy=chunk
            if chunk not in self.rects:
             self.images[chunk]=None;return None
            p=ROOT/f'SLTI_{self.mid}_W_C{cx}_{cy}.png'
            data=p.read_bytes();assert data[:8]==b'\x89PNG\r\n\x1a\n',p
            i=8;streams=[];w=h=0
            while i<len(data):
             n=struct.unpack_from('>I',data,i)[0];typ=data[i+4:i+8];block=data[i+8:i+8+n];i+=12+n
             if typ==b'IHDR':
              w,h,depth,mode,compression,filtration,interlace=struct.unpack('>IIBBBBB',block)
              assert (depth,mode,compression,filtration,interlace)==(8,6,0,0,0)
             elif typ==b'IDAT':streams.append(block)
             elif typ==b'IEND':break
            raw=zlib.decompress(b''.join(streams));stride=w*4;assert len(raw)==h*(stride+1)
            prev=bytearray(stride);alpha=bytearray(w*h);ptr=0
            for y in range(h):
             mode=raw[ptr];ptr+=1;line=bytearray(raw[ptr:ptr+stride]);ptr+=stride
             if mode==1:
              for k in range(4,stride):line[k]=(line[k]+line[k-4])&255
             elif mode==2:
              for k in range(stride):line[k]=(line[k]+prev[k])&255
             elif mode==3:
              for k in range(stride):line[k]=(line[k]+((line[k-4] if k>=4 else 0)+prev[k])//2)&255
             elif mode==4:
              for k in range(stride):
               a=line[k-4] if k>=4 else 0;b=prev[k];c=prev[k-4] if k>=4 else 0;p=a+b-c
               da=abs(p-a);db=abs(p-b);dc=abs(p-c)
               predictor=a if da<=db and da<=dc else b if db<=dc else c
               line[k]=(line[k]+predictor)&255
             else:assert mode==0,(p,mode)
             alpha[y*w:(y+1)*w]=line[3::4];prev=line
            self.images[chunk]=(w,h,alpha)
            return self.images[chunk]
           def alpha(self,px,py):
            if px<0 or py<0:return 0
            cx,cy=px//512,py//512;rect=self.rects.get((cx,cy))
            if rect is None:return 0
            x,y=px%512,py%512;part=(y//64)*4+x//128
            bounds=rect.get(part)
            if bounds is None:return 0
            bx0,by0,bx1,by1=bounds
            if not (bx0<=x%128<bx1 and by0<=y%64<by1):return 0
            w,h,image=self.image((cx,cy))
            return image[y*w+x] if x<w and y<h else 0
           def wall_foot(self,px,py):
            # Paint must exist at the depth of the original rear collision boundary.
            samples=((0,0),(0,4),(0,-4),(0,8),(0,-8),(0,12),(0,-12),(-4,0),(4,0),(-8,0),(8,0))
            return sum(self.alpha(px+dx,py+dy)>=96 for dx,dy in samples)>=2
           def contiguous(self,px1,py1,px2,py2):
            # Along the same screen row; reject opaque gaps/doors and discontinuities.
            assert py1==py2
            marks=[self.alpha(round(px1+(px2-px1)*j/8),py1)>=90 for j in range(9)]
            return sum(marks)>=7 and marks[0] and marks[-1]

          report={};outgraph={};owners_report={}
          for mid,(w,h,yoffset) in DIMS.items():
           floor=1 if mid==45 else 2
           raw=(SOURCE/f'native/floor-{floor}-4way.bin').read_bytes()
           assert len(raw)==w*h
           meta=json.loads((SOURCE/f'native/floor-{floor}-index.json').read_text('utf-8'))
           assert meta['passageSHA256']==hashlib.sha256(raw).hexdigest()
           paint=R49Wall(mid)
           def idx(x,y):
            if x<OX or y<OY or x>=OX+w or y>=OY+h:return -1
            return (y-OY)*w+x-OX
           def value(x,y):
            i=idx(x,y)
            return 0 if i<0 or raw[i]==255 else raw[i]
           def proj(x,y):return 12*(x+y)-784128,6*(y-x)+yoffset
           def native_edge(x,y,dx,dy):
            a=value(x,y);b=value(x+dx,y+dy)
            if dx>0:mask,rev=8,4
            elif dx<0:mask,rev=4,8
            elif dy>0:mask,rev=2,1
            else:mask,rev=1,2
            return bool(a&mask and b&rev)
           def direct_path(x,y,dx,dy):
            return native_edge(x,y,dx,0) and native_edge(x+dx,y,0,dy) or native_edge(x,y,0,dy) and native_edge(x,y+dy,dx,0)
           original=bytearray(w*h)
           for i in range(w*h):
            x=OX+i%w;y=OY+i//w
            if not value(x,y):continue
            for direction,(dx,dy) in STEP.items():
             if direct_path(x,y,dx,dy):original[i]|=BITS[direction]

           # Source floor regions from ORIGINAL 4-cardinal Layer3, not the mobile keypad.
           components=[-1]*(w*h);component_id=0
           for i in range(w*h):
            if components[i]>=0 or not value(OX+i%w,OY+i//w):continue
            q=[i];components[i]=component_id;head=0
            while head<len(q):
             at=q[head];head+=1;ax=OX+at%w;ay=OY+at//w
             for dx,dy in ((-1,0),(1,0),(0,-1),(0,1)):
              nxt=idx(ax+dx,ay+dy)
              if nxt<0 or components[nxt]>=0 or not native_edge(ax,ay,dx,dy):continue
              components[nxt]=component_id;q.append(nxt)
            component_id+=1

           # 1 screen row reduction of the rear-facing wall *base* (not the wall image).
           # The original front face is protected by zero DOWN from any exposed base cell.
           entry={};seeds=collections.defaultdict(set);blocked=0
           for y in range(OY,OY+h-1):
            for x in range(OX+1,OX+w):
             if not value(x,y) or value(x-1,y+1) or direct_path(x,y,-1,1):continue
             blocked+=1
             px,py=proj(x,y)
             if not paint.wall_foot(px,py+12):continue
             root=components[idx(x,y)]
             assert root>=0
             entrance=(x,y);foot=(x-1,y+1)
             entry[entrance]=root;seeds[foot].add(root)

           # Flood the complete continuous rear wall base horizontally, preserving room
           # ownership. Do NOT extend DOWN into the wall or step into unrelated components.
           labels={};ambiguous=set();q=collections.deque()
           for p,rootset in seeds.items():
            if len(rootset)>1:ambiguous.add(p);continue
            root=next(iter(rootset));labels[p]=root;q.append(p)
           while q:
            x,y=q.popleft();root=labels[x,y];px,py=proj(x,y)
            for dx,dy in ((-1,-1),(1,1)):
             nx,ny=x+dx,y+dy;n=(nx,ny)
             if idx(nx,ny)<0 or value(nx,ny) or n in ambiguous:continue
             qx,qy=proj(nx,ny)
             if not paint.wall_foot(qx,qy) or not paint.contiguous(px,py,qx,qy):continue
             prev=labels.get(n)
             if prev is None:labels[n]=root;q.append(n)
             elif prev!=root:ambiguous.add(n);del labels[n]

           # Remove ambiguous foot entry points and isolate 4-direction lateral edges.
           entry={p:root for p,root in entry.items() if labels.get((p[0]-1,p[1]+1))==root}
           graph=bytearray(original)
           def link(a,b,d):
            ia=idx(*a);ib=idx(*b)
            assert ia>=0 and ib>=0
            assert (b[0]-a[0],b[1]-a[1])==STEP[d]
            graph[ia]|=BITS[d];graph[ib]|=BITS[REV[d]]
           for p in entry:link(p,(p[0]-1,p[1]+1),2)
           for p,root in labels.items():
            n=(p[0]-1,p[1]-1)
            if labels.get(n)!=root:continue
            px,py=proj(*p);qx,qy=proj(*n)
            if paint.contiguous(px,py,qx,qy):link(p,n,4)

           # Strong invariants across ALL 4-pad edges and every original blocked cell.
           new_edges=collections.Counter();basecells=set(labels)
           for i,(old,new) in enumerate(zip(original,graph)):
            assert old&new==old,(mid,i,'original connection lost')
            if old==new:continue
            x=OX+i%w;y=OY+i//w
            for d,(dx,dy) in STEP.items():
             if old&BITS[d] or not new&BITS[d]:continue
             to=(x+dx,y+dy);j=idx(*to)
             assert j>=0 and graph[j]&BITS[REV[d]]
             if d==2:assert (x,y) in entry and to in basecells
             elif d==8:assert (x,y) in basecells and to in entry
             elif d in (4,6):assert (x,y) in basecells and to in basecells and labels[x,y]==labels[to]
             else:raise AssertionError((mid,d))
             new_edges[d]+=1
           for x,y in basecells:
            assert value(x,y)==0 and graph[idx(x,y)]&BITS[2]==0,(mid,x,y,'front wall breached')

           # The screenshot reference is a TEST, never a movement exception in the engine.
           if mid==45:
            assert (32656,32815) in entry
            assert (32655,32816) in basecells
            assert graph[idx(32655,32816)]&BITS[4]
            assert graph[idx(32654,32815)]&BITS[6]
            assert graph[idx(32655,32816)]&BITS[8]
            assert not graph[idx(32655,32816)]&BITS[2]

           packed=bytearray((len(graph)+1)//2)
           for i,v in enumerate(graph):
            assert v<16
            packed[i//2]|=v<<(4 if i%2 else 0)
           outgraph[str(mid)]=base64.b64encode(packed).decode('ascii')
           (WORK/f'graph-{mid}.bin').write_bytes(graph)
           report[str(mid)]={'original_wall_parts':sum(len(parts) for key,parts in PARTS.items() if key.startswith(str(mid)+':')),
            'original_native_components':component_id,'original_blocked_down':blocked,'one_row_rear_entries':len(entry),
            'one_row_base_cells':len(basecells),'new_up_reciprocal':new_edges[8],
            'new_horizontal_edges':new_edges[4]+new_edges[6], 'original_direct_edges_preserved':True,
            'no_forward_wall_penetration':True,'room_component_conflicts':len(ambiguous),
            'source_S32_sha256':hashlib.sha256(raw).hexdigest(),'source_original_client_collision_verified':False}
           print('WALL_BASE',mid,json.dumps(report[str(mid)]),flush=True)
          (WORK/'collision-graph.json').write_text(json.dumps(outgraph))
          (WORK/'audit.json').write_text(json.dumps(report,indent=2))
          PY_LAYER
          python3 build/compile_wallbase.py site build source
          python3 - <<'PY_LAYER_CHECK'
          import json
          from pathlib import Path
          report=json.loads(Path('build/audit.json').read_text())
          assert report['45']['one_row_rear_entries']==1553
          assert report['46']['one_row_rear_entries']==1910
          assert report['45']['one_row_base_cells']==2163
          assert report['46']['one_row_base_cells']==2774
          for mid in ('45','46'):
           assert report[mid]['original_direct_edges_preserved']
           assert report[mid]['no_forward_wall_penetration']
           assert report[mid]['room_component_conflicts']==0
          print('PASS whole 1F/2F physical wall-base compiled; front face still solid')
          PY_LAYER_CHECK

      - name: V229R77 Integrate terrain layer upstream with no move hacks or slide
        shell: bash
        run: |
          set -euo pipefail
          cat > build/patch_runtime.py <<'PY_PATCH'
          """Replace the authoritative four-button native collision *layer* at data-build time.
          No actor-specific exceptions, no alias, no R71/R73 state or coordinate gating.
          """
          from pathlib import Path
          import sys,json,hashlib,textwrap
          WORK=Path(sys.argv[1]);src=(WORK/'r66-original134.rb').read_text('utf-8')
          assert hashlib.sha256(src.encode('utf-8')).hexdigest()=='6d0b554feef7dfbab436dc9804476ea9952e0d00089a0bbb4a83eb0176c1a10c'
          assert 'def slti_r49_update_walls' in src and 'SLTI_V229R49::PARTS' in src
          assert 'module SLTI_Native66' in src and 'module SLV541' in src
          assert "return false if other.x==nx && other.y==ny && other.character_name!=''" in src
          assert 'module SLTI_Rear71' not in src and 'module SLTI_WallBase73' not in src

          graph=json.loads((WORK/'collision-graph.json').read_text('utf-8'))
          assert set(graph)=={'45','46'}
          def string(e):
           return '[\n      '+',\n      '.join('"'+part+'"' for part in textwrap.wrap(e,120))+"\n    ].join.unpack('m')[0]"
          # This is native collision geometry replacing the old source-only screen cardinal
          # graph. The separated R49 wall pictures/opacity are unchanged pixel-for-pixel.
          layer='''  # V229R77: shared dungeon physical COLLISION LAYER, built once from
            # R49 foreground wall pixels + original Sanctuary S32 Layer3, one row shallower
            # on the rear wall base. Visual wall source rectangles and their alpha unchanged.
            # Physical screen-direction bits: DOWN=1 LEFT=2 RIGHT=4 UP=8.
            WALL_BASE77={45=>__45__,46=>__46__}
            WALL_BASE77_BITS={2=>1,4=>2,6=>4,8=>8}
            WALL_BASE77_DELTA={2=>[-1,1],4=>[-1,-1],6=>[1,1],8=>[1,-1]}
            def self.wall_base77_bits(mid,x,y)
              w=WIDTH[mid]
              return 0 if w==nil || x<ORIGIN_X || y<ORIGIN_Y ||
                x>=ORIGIN_X+w || y>=ORIGIN_Y+HEIGHT[mid]
              p=(y-ORIGIN_Y)*w+(x-ORIGIN_X)
              pair=WALL_BASE77[mid][p/2,1]
              return 0 if pair==nil
              b=pair.unpack('C')[0]
              return (p%2==0 ? (b&15) : (b>>4))
            end
            def self.wall_base77_target(mid,x,y,dir)
              bit=WALL_BASE77_BITS[dir]
              return nil if bit==nil || (wall_base77_bits(mid,x,y)&bit)==0
              dx,dy=WALL_BASE77_DELTA[dir]
              return [x+dx,y+dy]
            end
          '''
          layer=layer.replace('__45__',string(graph['45'])).replace('__46__',string(graph['46']))
          old_method='  def self.native_target(mid,x,y,dir)\n'
          next_method='  def self.native_line?(mid,ax,ay,bx,by)\n'
          assert src.count(old_method)==1 and src.count(next_method)==1
          start=src.index(old_method);end=src.index(next_method,start)
          replacement='''  def self.native_target(mid,x,y,dir)
              # Both player and monsters read the SAME rebuilt level collision layer.
              # A blocked direction never maps to a different native axis (no sliding).
              if dir==2 || dir==4 || dir==6 || dir==8
                return wall_base77_target(mid,x,y,dir)
              end
              # Preserve original Sanctuary native-cardinal diagonal controls unmodified.
              moves={1=>[-1,0],3=>[0,1],7=>[0,-1],9=>[1,0]}
              d=moves[dir]
              return nil if d==nil
              dx,dy=d
              return edge?(mid,x,y,dx,dy) ? [x+dx,y+dy] : nil
            end
          '''
          s=src[:start]+replacement+src[end:]
          assert s.count('  def self.active_map?(mid)\n')==1
          s=s.replace('  def self.active_map?(mid)\n',layer+'  def self.active_map?(mid)\n',1)
          assert s[:s.index('module SLTI_Native66')]==src[:src.index('module SLTI_Native66')]
          assert s[s.index(next_method):]==src[src.index(next_method):]
          assert 'No slide or axis fallback at blocked walls.' not in src
          assert 'if edge?(mid,x,y,dx,0)' in src[start:end] and 'if edge?(mid,x,y,dx,0)' not in s[s.index('  def self.native_target'):s.index('  def self.native_line?')]
          assert s.count('def slti_native66_move(dir,turn=true)')==1
          assert s.count('def slti_r49_update_walls')==1
          assert 'module SLTI_Rear71' not in s and 'module SLTI_WallBase73' not in s
          (WORK/'r77-script134.rb').write_text(s,'utf-8')
          print('PATCH VERIFIED R49 visual code unmodified; no per-event/movement overrides; one native terrain collision source')
          PY_PATCH
          python3 build/patch_runtime.py build
          ruby -c build/r77-script134.rb

      - name: V229R77 Full map movement and screenshot tests without Zlib
        shell: bash
        run: |
          set -euo pipefail
          cat > build/test.rb <<'RB_TEST'
          require 'digest'
          base=File.binread('build/r66-original134.rb').force_encoding('UTF-8')
          fixed=File.binread('build/r77-script134.rb').force_encoding('UTF-8')
          raise 'authentic R66 changed' unless Digest::SHA256.hexdigest(base)=='6d0b554feef7dfbab436dc9804476ea9952e0d00089a0bbb4a83eb0176c1a10c'
          raise 'R49 code changed' unless fixed.split('module SLTI_Native66')[0]==base.split('module SLTI_Native66')[0]
          raise 'R49 wall painter modified' unless fixed.include?('wall_depth=wall_y+by1*2+32') && fixed.include?('wanted_opacity=covered ? 148 : 255')
          raise 'Monster collision modified' unless fixed.include?(%q{return false if other.x==nx && other.y==ny && other.character_name!=''})
          raise 'Unexpected runtime override' if fixed.include?('SLTI_WallBase73') || fixed.include?('SLTI_Rear71')
          raise 'New alias for move' unless fixed.scan('def slti_native66_move(dir,turn=true)').size==base.scan('def slti_native66_move(dir,turn=true)').size
          raise 'Runtime Zlib introduced' if defined?(Zlib)
          start=base.index('module SLTI_Native66');stop=base.index("\nclass Game_Character",start)
          raise 'native code missing' if start==nil || stop==nil
          eval(base[start...stop]); prior=SLTI_Native66
          original_results={}
          [45,46].each do |mid|
           w=prior::WIDTH[mid];h=prior::HEIGHT[mid]
           count=0
           h.times do |iy|
            w.times do |ix|
             x=prior::ORIGIN_X+ix;y=prior::ORIGIN_Y+iy
             next unless prior.value(mid,x,y)!=0
             [2,4,6,8].each{|d|original_results[[mid,x,y,d]]=prior.native_target(mid,x,y,d)}
            end
           end
          end
          Object.send(:remove_const,:SLTI_Native66)
          start=fixed.index('module SLTI_Native66');stop=fixed.index("\nclass Game_Character",start)
          eval(fixed[start...stop]);native=SLTI_Native66
          raise 'Zlib loaded at Ruby boot' if defined?(Zlib)
          puts 'PASS Ruby VM loads new full wall-base collision without Zlib or new aliases'
          steps={2=>[-1,1],4=>[-1,-1],6=>[1,1],8=>[1,-1]}
          rev={2=>8,4=>6,6=>4,8=>2}
          statistics={}
          [45,46].each do |mid|
           w=native::WIDTH[mid];h=native::HEIGHT[mid]
           new_down=0;lane=0;new_horizontal=0;recovered=0;slide_removed=0;orig_direct=0
           h.times do |iy|
            w.times do |ix|
             x=native::ORIGIN_X+ix;y=native::ORIGIN_Y+iy
             if native.value(mid,x,y)==0 && native.wall_base77_bits(mid,x,y)!=0
              lane+=1
              raise 'wall-front deep traversal' unless native.native_target(mid,x,y,2)==nil
             end
             [2,4,6,8].each do |d|
              nxt=native.native_target(mid,x,y,d)
              unless nxt==nil
               dx,dy=steps.fetch(d)
               raise 'sliding present' unless nxt==[x+dx,y+dy]
               raise 'edge not reciprocal' unless native.native_target(mid,*nxt,rev[d])==[x,y]
              end
              previous=original_results[[mid,x,y,d]]
              next unless native.value(mid,x,y)!=0
              if previous!=nil && previous==[x+steps[d][0],y+steps[d][1]]
               raise 'original legal move lost' unless previous==nxt
               orig_direct+=1
              elsif previous!=nil
               raise 'old wall slide preserved' if previous==nxt
               slide_removed+=1
              end
              next unless d==2 && nxt!=nil && native.value(mid,*nxt)==0
              raise 'new entry not from existing floor' unless native.value(mid,x,y)!=0
              new_down+=1
             end
            end
           end
           # test self-contained if JSON library is unavailable by defer expected constants
           count=[1553,1910][mid==45 ? 0 : 1]
           minbase=mid==45 ? 2000 : 2600
           raise "wrong down count #{new_down}" unless new_down==count
           raise "missing wall base #{lane}" unless lane>=minbase
           statistics[mid]=[new_down,lane,slide_removed,orig_direct]
           puts "PASS Floor #{mid}: #{new_down} rear down, #{lane} thin wall-base cells, #{slide_removed} old slides removed, #{orig_direct} exact legal pad moves kept"
          end
          raise 'R49 reference down missing' unless native.native_target(45,32656,32815,2)==[32655,32816]
          raise 'R49 reference left missing' unless native.native_target(45,32655,32816,4)==[32654,32815]
          raise 'R49 reference right missing' unless native.native_target(45,32654,32815,6)==[32655,32816]
          raise 'R49 reference up missing' unless native.native_target(45,32655,32816,8)==[32656,32815]
          raise 'R49 front wall leak' unless native.native_target(45,32655,32816,2)==nil
          puts 'PASS screenshot DOWN / LEFT / RIGHT / UP, below-wall and front-wall remain solid'
          class Game_Map
           attr_accessor :events,:map_id
           def initialize(mid);@map_id=mid;@events={};end
           def valid?(x,y);x>=0 && y>=0 && x<(@map_id==45 ? 288 : 336) && y<(@map_id==45 ? 144 : 168);end
          end
          class Game_Character
           attr_accessor :x,:y,:through,:character_name
           def initialize(mid,x,y)
            @slti_native66_map=mid;@slti_native66_x=x;@slti_native66_y=y
            @x,@y=SLTI_Native66.to_rgss(mid,x,y);@through=false;@character_name='test'
           end
           def slti_native66_prepare;true;end
           def increase_steps;end
           def native;[@slti_native66_x,@slti_native66_y];end
          end
          m0=fixed.index('  def slti_native66_move(dir,turn=true)',stop)
          m1=fixed.index('  alias slti_native66_original_down',m0)
          raise 'No original movement found' unless m0 && m1
          Game_Character.class_eval(fixed[m0...m1])
          $game_map=Game_Map.new(45)
          $game_player=Game_Character.new(45,32656,32815)
          raise 'real player DOWN failure' unless $game_player.slti_native66_move(2) && $game_player.native==[32655,32816]
          raise 'real player LEFT failure' unless $game_player.slti_native66_move(4) && $game_player.native==[32654,32815]
          raise 'real player RIGHT failure' unless $game_player.slti_native66_move(6) && $game_player.native==[32655,32816]
          raise 'real player UP failure' unless $game_player.slti_native66_move(8) && $game_player.native==[32656,32815]
          $game_player=Game_Character.new(45,32656,32815)
          $game_map.events={1=>Game_Character.new(45,32655,32816)}
          raise 'event collision disabled' if $game_player.slti_native66_move(2)
          $game_map.events.clear
          monster=Game_Character.new(45,32656,32815)
          raise 'monster uses different wall layer' unless monster.slti_native66_move(2) && monster.native==[32655,32816]
          puts 'PASS actual movement code uses one shared terrain for player & monster; event collision preserved'
          RB_TEST
          ruby --disable-gems build/test.rb

      - name: V229R77 Pack 1 changed engine script, preserve all 5517 files
        shell: bash
        run: |
          set -euo pipefail
          ruby -rzlib - <<'RB_PACK'
          path='site/knight/gameasync/Data/Scripts.rxdata'
          a=Marshal.load(File.binread(path))
          original=Marshal.load(File.binread(path))
          raise 'Unexpected game archive' unless a.size==136
          src=Zlib::Inflate.inflate(a[134][2]).force_encoding('UTF-8')
          raise 'Different source code from user-selected R66' unless src==File.binread('build/r66-original134.rb').force_encoding('UTF-8')
          fixed=File.binread('build/r77-script134.rb')
          raise 'Unverified runtime adapter' if fixed.include?('module SLTI_Rear71') || fixed.include?('module SLTI_WallBase73')
          raise 'Physical base missing' unless fixed.include?('WALL_BASE77')
          a[134][2]=Zlib::Deflate.deflate(fixed)
          raise 'Unrequested engine script change' unless a.each_index.all?{|i|i==134 || a[i]==original[i]}
          File.binwrite(path,Marshal.dump(a))
          again=Marshal.load(File.binread(path))
          raise 'Patched script not round-tripped' unless Zlib::Inflate.inflate(again[134][2])==fixed
          puts 'PASS R49 painter, original 135 other Ruby scripts and game records unchanged'
          RB_PACK
          python3 - <<'PY_PACKAGE'
          from pathlib import Path
          import hashlib,json,re
          root=Path('site');game=root/'knight/gameasync';manifest=game/'mapping.js'
          s=manifest.read_text('utf-8')
          hash=hashlib.md5((game/'Data/Scripts.rxdata').read_bytes()).hexdigest()
          s,num=re.subn(r'Data/Scripts\.rxdata\?h=[0-9a-f]{32}',lambda m:'Data/Scripts.rxdata?h='+hash,s)
          assert num==1,num
          manifest.write_text(s,'utf-8')
          for name in ('index.html','knight/index.html'):
           file=root/name;prior=file.read_text('utf-8')
           assert 'V229R66' in prior,name
           file.write_text(prior.replace('V229R66','V229R77').replace('v229r66','v229r77'),'utf-8')
          before=json.loads(Path('build/base-hashes.json').read_text('utf-8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(after)==5517 and after.keys()==before.keys()
          changed={p for p in before if before[p]!=after[p]}
          assert changed=={'index.html','knight/index.html','knight/gameasync/mapping.js','knight/gameasync/Data/Scripts.rxdata'},changed
          print('PASS 5517 published game files preserved; only 1 engine script, hash and 2 version labels modified')
          PY_PACKAGE
          node --check site/knight/gameasync/mapping.js

