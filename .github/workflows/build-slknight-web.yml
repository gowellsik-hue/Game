
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R143
#
# SOURCE:
#   Sanctuary original extraction, R94 384/385 arrays.
#   Map045: 288 x 144, SHA256 1228f0f3...
#   Map046: 336 x 168, SHA256 b50a4666...
#
# APPROVED CHANGE:
#   Map045 RPG (88,80): 385 -> 384
#   Corresponding designated S32 opening: (32655,32806)
#
# PRESERVE:
#   All other 384/385 coordinates exactly as extracted.
#   Existing RPG movement and character controls.
#   Existing S32 scripts and direction-mask data.
#   Player/monster positions, respawns, events and combat.
#   Map047, stairs, Baphomet, all graphics and clean 2F art.
#
# R94 ARRAYS:
#   Embedded below as base64-encoded unsigned-varint RLE.
#   RLE starts with blocked (0), alternating blocked/open.
#   0 -> tile 385, 1 -> tile 384.
#   No runtime decoding; data is applied during build only.
#
# GAME BASE:
#   Successful V229R142, preserving later game features.
#   Map045/046 collision is replaced from extracted R94,
#   never inferred from the base release.
#
# No S32-specific movement code or Game_Map.passable? override.

name: build-slknight-web.yml | V229R143 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: V229R143 Download preserved game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40888976732
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V229R143 Extract unchanged game
        shell: bash
        run: |
          set -euo pipefail

          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path('site')

          before = {
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          assert len(before) == 5663, (
              'Unexpected source file count',
              len(before)
          )

          assert 'V229R142' in (
              root / 'index.html'
          ).read_text('utf8')

          assert 'V229R142' in (
              root / 'knight/index.html'
          ).read_text('utf8')

          Path('build/before.json').write_text(
              json.dumps(before, sort_keys=True),
              encoding='utf8'
          )

          print('PASS: original game files preserved')
          PY

      - name: V229R143 Decode exact extracted R94 passage tiles
        shell: bash
        run: |
          set -euo pipefail

          cat > build/decode_r94.py <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          # Exact R94 384/385 tile arrays from the Sanctuary
          # extraction. These are not movement instructions.
          #
          # Encoding:
          #   Alternating runs of 0 and 1, beginning with 0.
          #   Each run length is an unsigned base-128 varint.
          #   0 = original 385, 1 = original 384.

          R94_45 = """
          jlIEnAIEmAIKlgIKkAIGAgQCCogCBgIEAgqIAgQEDAIEhgIEBAwCBIACCgICAggCAoQCCgICAggCAoICBgIEAgQGDvoBBgIEAgQG
          DvQBCgIEAgICBAIEAgICBAII7AEKAgQCAgIEAgQCAgIEAgjsARAEDAQW5gEQBAwEFuYBCAIQAgoEBgII5gEIAhACCgQGAgjmARoC
          BAIKBBLeARoCBAIKBBLeAQYCDgIGAgwCBAIQ3AEGAg4CBgIMAgQCENABCAIGAgICBAQWAgwCBAIE0gEIAgYCAgIEBBYCDAIEAgTS
          AQQEBAIEBBYCDAQKBA7GAQQEBAIEBBYCDAQKBA7GAQQCCgIeAgYKEAIIxAEEAgoCHgIGChACCLQBJAICAgICBgIUBAoIAgQIsgEk
          AgICAgIGAhQECggCBAiyAQoCFAIGAgoCEAIIAhACBAIEsgEKAhQCBgIKAhACCAIQAgQCBKoBFgIGAgICBgIMAhoEHKwBFgIGAgIC
          BgIMAhoEHKQBCgICBggIEAIEAgQCAgIEAhoCBAISoAEKAgIGCAgQAgQCBAICAgQCGgIEAhKkARoCDAYEAgQCEgICAgoCAgICAgQG
          BAQEpAEaAgwGBAIEAhICAgIKAgICAgIEBgQEBKYBQgIaAgICCgIEAgakAUICGgICAgoCBAIGqAEYAgYGDAQEAgYCDAIEBAwGAgIG
          qgEYAgYGDAQEAgYCDAIEBAwGAgIGrAEEAgYCCA4WAgwCJLIBBAIGAggOFgIMAiS2AQ4QCgIIAgoCDgIKxgEOEAoCCAIKAg4CCsoB
          AhIKAggEDAIGAhbIAQISCgIIBAwCBgIW1gEUAgwGAgICAgwCDAIC0gEUAgwGAgICAgwCDAICzgEGAh4CGt4BBgIeAhrgAQwCCAIU
          BA7iAQwCCAIUBA7mAQICCAIGAggCCgIGBAbkAQICCAIGAggCCgIGBAbuAQYCIgII7AEGAiICCO4BLvIBLvYBCgQMAgYCAvoBCgQM
          AgYCAv4BAgIWhgICAhaGAhaKAhaQAg6SAg6WAgScAgTQVg==
          """

          R94_46 = """
          mGUKxgIKxAISvgISugIUvAIUuAIGAgICBAISrAIGAgICBAISqgIIAiCmAggCIKACHAIGCgacAhwCBgoGmgIcAgQODJQCHAIEDgyM
          AgIEBAIaCggCDogCAgQEAhoKCAIOhAISAhYIHoACEgIWCB78ASYKGAICAgr4ASYKGAICAgr0ARwCDAgWAhbwARwCDAgWAhbsARQC
          FAokCAjoARQCFAokCAjmARAEHAYiDgbkARAEHAYiDgbkAQ4CDgIEAgwkBAgGAgTiAQ4CDgIEAgwkBAgGAgTaAQwGCgIEAhQWBAgI
          BAoCCNYBDAYKAgQCFBYECAgECgII0AEqAg4UFgQU1AEqAg4UFgQU0AEQAiYYFggGAhDKARACJhgWCAYCEMgBHgIWCgQKHAgEAhDI
          AR4CFgoEChwIBAIQxgEMAhgCDgoMBhwGFMgBDAIYAg4KDAYcBhTCAQICGAIOAgoIFAIYChTEAQICGAIOAgoIFAIYChTCARQCBAIe
          BgoGEAIIBgIIGL4BFAIEAh4GCgYQAggGAggYugEMAgYCJAgeFgQEGLoBDAIGAiQIHhYEBBi0AQ4CCgIcDAwCEAIKChICDLgBDgIK
          AhwMDAIQAgoKEgIMtgEMAigOCAQkCBq6AQwCKA4IBCQIGroBCAIUAhASCAIGAhQCDgIYvgEIAhQCEBIIAgYCFAIOAhiyAQYCCgIm
          DgQCAgQGAhICDAIEBBiyAQYCCgImDgQCAgQGAhICDAIEBBiuAS4CCg4IBgQCCgIUAg4CAgQQrAEuAgoOCAYEAgoCFAIOAgIEEKgB
          AgQMBCgGDAIKAggCCAIKAh4CEqABAgQMBCgGDAIKAggCCAIKAh4CEp4BGgIgChwEFAISAhACEJ4BGgIgChwEFAISAhACEJ4BHAIW
          AgQIDAIUAgQCGgIIAgwCCqYBHAIWAgQIDAIUAgQCGgIIAgwCCq4BEAIWAgYGDgIKAgwCBAIGAgwEEAQQrgEQAhYCBgYOAgoCDAIE
          AgYCDAQQBBCyASwIDgIGAiYMGLoBLAgOAgYCJgwYvAECBBwCCggmAgQCCBQUvAECBBwCCggmAgQCCBQUxAEgAggGJgIKGBDGASAC
          CAYmAgoYEMYBCgIMAgQCBAIWAhQCChwSxAEKAgwCBAIEAhYCFAIKHBLMAUgCCCQK0AFIAggkCtQBBgI2AgqGAgYCNgIKiAIEAhoC
          CgIKAgqMAgQCGgIKAgoCCowCHAIIAgQQBJACHAIIAgQQBJoCGBQGngIYFAacAhYCAhAIngIWAgIQCLICDAgGtgIMCAa4AgYCCr4C
          BgIKwgIKxgIKxgIGygIGumo=
          """

          EXPECTED = {
              45: {
                  'width': 288,
                  'height': 144,
                  'open': 3724,
                  'sha256':
                      '1228f0f3e6df3452196901469ceb02d17802a6747fecfb9db23e595baa279011'
              },
              46: {
                  'width': 336,
                  'height': 168,
                  'open': 7100,
                  'sha256':
                      'b50a46669deba5026cf0d27eb9564397cbbb1278bfab43c6137cf69f69f49606'
              }
          }

          def decode_rle(encoded, expected_length):
              binary = base64.b64decode(
                  ''.join(encoded.split()),
                  validate=True
              )

              out = bytearray()
              current = 0
              length = 0
              shift = 0

              for byte in binary:
                  length |= (byte & 0x7f) << shift

                  if byte & 0x80:
                      shift += 7
                      if shift > 28:
                          raise ValueError('Invalid R94 run length')
                      continue

                  if length <= 0:
                      raise ValueError('Empty R94 run')

                  out.extend(bytes([current]) * length)

                  if len(out) > expected_length:
                      raise ValueError('R94 data overrun')

                  current ^= 1
                  length = 0
                  shift = 0

              if length != 0 or shift != 0:
                  raise ValueError('Incomplete R94 data')

              if len(out) != expected_length:
                  raise ValueError('Wrong R94 tile count')

              return bytes(out)

          masks = {}

          for floor, encoded in (
              (45, R94_45),
              (46, R94_46)
          ):
              info = EXPECTED[floor]
              total = info['width'] * info['height']

              raw = decode_rle(encoded, total)

              if sum(raw) != info['open']:
                  raise ValueError(
                      f'Map{floor}: R94 walkable count mismatch'
                  )

              digest = hashlib.sha256(raw).hexdigest()

              if digest != info['sha256']:
                  raise ValueError(
                      f'Map{floor}: R94 source mismatch'
                  )

              masks[floor] = raw

              print(
                  f'PASS Map{floor}: original extracted '
                  f'{len(raw)} tiles, {sum(raw)} green'
              )

          # The only authorized exception.
          #
          # Original designated S32 point: (32655,32806)
          # Corresponding RPG cell used in the R94 map: (88,80)
          #
          # No other original 384/385 status can be changed.

          floor = 45
          width = EXPECTED[floor]['width']

          gate_x = 88
          gate_y = 80
          gate_index = gate_y * width + gate_x

          original = masks[floor]

          if original[gate_index] != 0:
              raise ValueError(
                  'Designated opening is not originally blocked'
              )

          corrected = bytearray(original)
          corrected[gate_index] = 1

          differences = [
              index
              for index, (before, after) in enumerate(
                  zip(original, corrected)
              )
              if before != after
          ]

          if differences != [gate_index]:
              raise ValueError(
                  'Unexpected changes outside designated opening'
              )

          if sum(corrected) != 3725:
              raise ValueError(
                  'Wrong corrected first-floor open count'
              )

          # Floor 2 is the exact original array.
          Path('build/r94-map045.bin').write_bytes(corrected)
          Path('build/r94-map046.bin').write_bytes(masks[46])

          print('PASS: Map045 (88,80) 385 -> 384 only')
          print('PASS: Map046 all original 384/385 tiles unchanged')
          PY

          python3 build/decode_r94.py

      - name: V229R143 Apply 384 and 385 to original RPG maps only
        shell: bash
        run: |
          set -euo pipefail

          cat > build/apply_r94.rb <<'RUBY'
          module RPG
            class Map; end
            class Event; end
            class Event::Page; end
            class Event::Page::Condition; end
            class Event::Page::Graphic; end
            class EventCommand; end
            class MoveCommand; end
            class MoveRoute; end
            class MapInfo; end
            class AudioFile; end
            class Tileset; end
          end

          class Table
            def self._load(raw)
              obj = allocate
              obj.instance_variable_set(:@raw, raw)
              obj
            end

            def _dump(_depth)
              @raw
            end
          end

          class Tone
            def self._load(raw)
              obj = allocate
              obj.instance_variable_set(:@raw, raw)
              obj
            end

            def _dump(_depth)
              @raw
            end
          end

          class Color
            def self._load(raw)
              obj = allocate
              obj.instance_variable_set(:@raw, raw)
              obj
            end

            def _dump(_depth)
              @raw
            end
          end

          require 'digest'

          root = 'site/knight/gameasync/Data'
          prefix = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          layouts = {
            45 => [288, 144],
            46 => [336, 168]
          }

          layouts.each do |mid, dimensions|
            width, height = dimensions

            filename = File.join(
              root,
              prefix + format('Map%03d.rxdata', mid)
            )

            original_binary = File.binread(filename)
            map = Marshal.load(original_binary)

            raise "Map#{mid}: original serialization mismatch" unless
              Marshal.dump(map) == original_binary

            raise "Map#{mid}: dimensions changed" unless
              map.instance_variable_get(:@width) == width &&
              map.instance_variable_get(:@height) == height

            table = map.instance_variable_get(:@data)
            original_raw = table.instance_variable_get(:@raw)

            expected_header = [
              3, width, height, 3, width * height * 3
            ]

            raise "Map#{mid}: invalid RPG Table" unless
              original_raw[0, 20].unpack('V5') == expected_header

            total = width * height
            layer_bytes = total * 2

            raise "Map#{mid}: unexpected Table size" unless
              original_raw.bytesize == 20 + total * 6

            existing = original_raw[
              20, layer_bytes
            ].unpack('v*')

            raise "Map#{mid}: unexpected terrain tile" unless
              existing.all? { |id| id == 384 || id == 385 }

            mask = File.binread(
              format('build/r94-map%03d.bin', mid)
            )

            raise "Map#{mid}: invalid extracted mask" unless
              mask.bytesize == total &&
              mask.bytes.all? { |v| v == 0 || v == 1 }

            # 1 = 384, 0 = 385.
            # No other tile ID, event or layer is modified.
            target = mask.bytes.map do |v|
              v == 1 ? 384 : 385
            end.pack('v*')

            changed_cells = existing.each_index.count do |index|
              existing[index] !=
                (mask.getbyte(index) == 1 ? 384 : 385)
            end

            modified_raw = original_raw.b.dup
            modified_raw[20, layer_bytes] = target

            # All upper layers must be byte-identical.
            raise "Map#{mid}: other layers modified" unless
              modified_raw[
                20 + layer_bytes, total * 4
              ] == original_raw[
                20 + layer_bytes, total * 4
              ]

            table.instance_variable_set(:@raw, modified_raw)
            modified_binary = Marshal.dump(map)

            # Restore original object in memory and prove that
            # no event or other RPG field was changed.
            table.instance_variable_set(:@raw, original_raw)

            raise "Map#{mid}: event/data mutation" unless
              Marshal.dump(map) == original_binary

            # Do not rewrite an already matching map.
            if modified_binary != original_binary
              File.binwrite(filename, modified_binary)
            end

            # Check the serialized output again.
            saved = Marshal.load(File.binread(filename))
            saved_table = saved.instance_variable_get(:@data)
            saved_raw = saved_table.instance_variable_get(:@raw)

            raise "Map#{mid}: saved collision mismatch" unless
              saved_raw[20, layer_bytes] == target

            raise "Map#{mid}: saved other layers mismatch" unless
              saved_raw[20 + layer_bytes, total * 4] ==
              original_raw[20 + layer_bytes, total * 4]

            puts(
              "PASS Map#{mid}: exact R94 tiles, " \
              "#{changed_cells} differing source cells replaced"
            )
          end

          puts 'PASS: only 384/385 map terrain was processed'
          puts 'PASS: no game movement script modified'
          RUBY

          ruby -c build/apply_r94.rb
          ruby build/apply_r94.rb

      - name: V229R143 Update map cache hashes and version labels
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          root = Path('site')
          mapping = root / 'knight/gameasync/mapping.js'

          text = mapping.read_text('utf8')

          prefix = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          for floor in (45, 46):
              filename = prefix + f'Map{floor:03d}.rxdata'

              path = (
                  root / 'knight/gameasync/Data' / filename
              )

              digest = hashlib.md5(
                  path.read_bytes()
              ).hexdigest()

              pattern = (
                  r'(Data/'
                  + re.escape(filename)
                  + r'\?h=)[0-9a-f]{32}'
              )

              text, count = re.subn(
                  pattern,
                  lambda match: match.group(1) + digest,
                  text
              )

              if count != 1:
                  raise ValueError(
                      f'Map{floor}: map cache entry mismatch'
                  )

          mapping.write_text(text, encoding='utf8')

          for name in ('index.html', 'knight/index.html'):
              path = root / name
              original = path.read_text('utf8')

              if 'V229R142' not in original:
                  raise ValueError(
                      f'Unexpected version in {name}'
                  )

              updated = original.replace(
                  'V229R142', 'V229R143'
              ).replace(
                  'v229r142', 'v229r143'
              )

              path.write_text(updated, encoding='utf8')

          assets = root / 'knight/js/sl-assets-v229r115.js'
          original = assets.read_text('utf8')

          before = "var version='V229R142';"
          after = "var version='V229R143';"

          if original.count(before) != 1:
              raise ValueError(
                  'Unexpected game assets version'
              )

          assets.write_text(
              original.replace(before, after),
              encoding='utf8'
          )

          knight_html = (
              root / 'knight/index.html'
          ).read_text('utf8')

          if 'js/sl-assets-v229r115.js?v=v229r143' not in knight_html:
              raise ValueError(
                  'Game assets cache version mismatch'
              )

          print('PASS: map cache hashes and version labels')
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/dpad.js
          node --check site/knight/js/drive.js

      - name: V229R143 Verify no unrelated game changes
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path('site')

          before = json.loads(
              Path('build/before.json').read_text('utf8')
          )

          after = {
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          if before.keys() != after.keys():
              raise ValueError(
                  'Original game file list was modified'
              )

          prefix = (
              'knight/gameasync/Data/'
              'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          )

          allowed = {
              prefix + 'Map045.rxdata',
              prefix + 'Map046.rxdata',
              'knight/gameasync/mapping.js',
              'index.html',
              'knight/index.html',
              'knight/js/sl-assets-v229r115.js'
          }

          changed = {
              name
              for name in before
              if before[name] != after[name]
          }

          unexpected = changed - allowed

          if unexpected:
              raise ValueError(
                  'Unapproved modification: '
                  + ', '.join(sorted(unexpected))
              )

          # Keep all non-collision maps byte-identical.
          for floor in (29, 47):
              name = prefix + f'Map{floor:03d}.rxdata'

              if before[name] != after[name]:
                  raise ValueError(
                      f'Map{floor}: unapproved modification'
                  )

          # Existing RPG movement logic is protected.
          scripts = (
              'knight/gameasync/Data/Scripts.rxdata'
          )

          if before[scripts] != after[scripts]:
              raise ValueError(
                  'Existing game movement script changed'
              )

          for name in (
              'knight/js/dpad.js',
              'knight/js/drive.js'
          ):
              if before[name] != after[name]:
                  raise ValueError(
                      f'Player control changed: {name}'
                  )

          # No new graphics, art patches, monster scripts
          # or extra runtime hooks are permitted.
          if len(after) != 5663:
              raise ValueError(
                  'Unexpected file added or deleted'
              )

          print('PASS: only permitted map/cache/version files differ')
          print('PASS: game movement and controls unchanged')
          print('PASS: all monster and event scripts unchanged')
          print('PASS: Map047 and every other map unchanged')
          print('PASS: 2F artwork and all graphics unchanged')
          PY

      - name: V229R143 Publish original R94 tiles with one opening
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
