            end
          end

          ce68=iv(ce[68],:list)||[]
          abort 'CE68 still cancels normal green' if ce68.any?{|c|iv(c,:code)==121&&(iv(c,:parameters)||[])[0].to_i==171}
          abort 'CE68 still cancels courage' if ce68.any?{|c|iv(c,:code)==121&&(iv(c,:parameters)||[])[0].to_i==172}
          abort 'CE68 still cancels enhanced green' if ce68.any?{|c|iv(c,:code)==121&&(iv(c,:parameters)||[])[0].to_i==368}

          synthetic=ce.compact.select{|c|iv(c,:name).to_s.dup.force_encoding(Encoding::UTF_8)=='SL Enhanced Green Bravery'}
          abort "synthetic potion CE remains=#{synthetic.length}" unless synthetic.empty?

          abort 'item2 routing wrong' unless iv(items[2],:common_event_id)==3&&iv(items[2],:consumable)==true
          abort 'item3 routing wrong' unless iv(items[3],:common_event_id)==8&&iv(items[3],:consumable)==false
          abort 'item17 routing wrong' unless iv(items[17],:common_event_id)==6&&iv(items[17],:consumable)==false
          abort 'item37 routing wrong' unless iv(items[37],:common_event_id)==33&&iv(items[37],:consumable)==true

          ce3=iv(ce[3],:list)||[]
          ce8=iv(ce[8],:list)||[]
          ce33=iv(ce[33],:list)||[]
          abort 'normal green no longer preserves courage' if ce3.any?{|c|iv(c,:code)==121&&(iv(c,:parameters)||[])[0].to_i==172}
          abort 'enhanced green no longer preserves courage' if ce33.any?{|c|iv(c,:code)==121&&(iv(c,:parameters)||[])[0].to_i==172}
          abort 'courage no longer starts timer' unless ce8.any?{|c|iv(c,:code)==121&&(iv(c,:parameters)||[])==[1002,1002,0]}
          abort 'courage no longer consumes item3' unless ce8.any?{|c|iv(c,:code)==126&&(iv(c,:parameters)||[])==[3,1,0,1]}
          abort 'courage calls synthetic CE' if ce8.any?{|c|iv(c,:code)==117&&(iv(c,:parameters)||[])[0].to_i>=1000}

          puts 'FINAL_CLEAN_BUFF_STATE_OK'
          RB

          du -sh player

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
