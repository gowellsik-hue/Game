            assert img.size == ((768,384) if file.endswith('_GID.png') else (512,512))
            assert img.mode == ('RGB' if '_C' in file and '_L4_C' not in file else ('RGB' if file.endswith('_GID.png') else 'RGBA')),(file,img.mode)
          extra=(root/'knight/assets/map-048-v229r115.pack').read_bytes();l=struct.unpack_from('<I',extra)[0]
          head=json.loads(extra[4:4+l]);data=memoryview(extra)[4+l:]
          assert head['kind']=='map' and head['map_id']==48 and len(head['files'])==len(imgs)+1
          packs=set()
          for key,offset,length in head['files']:
           assert key not in packs and 0<=offset<len(data) and length>=8 and offset+length<=len(data)
           packs.add(key)
           if key.startswith('graphics/panoramas/slti_48_'):
            name='SLTI_48_'+key.split('slti_48_',1)[1]+'.png'
            matched=[f for f in imgs if f.lower()==name.lower()]
            assert len(matched)==1
            assert data[offset:offset+length]==(root/'knight/gameasync/Graphics/Panoramas'/matched[0]).read_bytes()
          assert len(packs)==len(imgs)+1
          original47=pack47.read_bytes();q=struct.unpack_from('<I',original47)[0]
          map47head=json.loads(original47[4:4+q]);map47body=memoryview(original47)[4+q:]
          source=[row for row in map47head['files'] if row[0]=='graphics/tilesets/slti_collision_transparent']
          current=[row for row in head['files'] if row[0]=='graphics/tilesets/slti_collision_transparent']
          assert len(source)==len(current)==1
          assert data[current[0][1]:current[0][1]+current[0][2]]==map47body[source[0][1]:source[0][1]+source[0][2]]
          mapping=(root/'knight/gameasync/mapping.js').read_text('utf8')
          assert mapping.lower().count('map048.rxdata')==1
          for f in imgs:
           p=root/'knight/gameasync/Graphics/Panoramas'/f
           expected='Graphics/Panoramas/'+f+'?h='+hashlib.md5(p.read_bytes()).hexdigest()
           assert mapping.count(expected)==1,('Missing MD5 Map048 mapping',f)
          for f in ('MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMapInfos.rxdata','Scripts.rxdata','MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap048.rxdata'):
           p=root/'knight/gameasync/Data'/f
           expected='Data/'+f+'?h='+hashlib.md5(p.read_bytes()).hexdigest()
           assert mapping.count(expected)==1,('Missing data Map048 mapping',f)
          js=(root/'knight/js/sl-assets-v229r115.js').read_text('utf8')
          assert js.count("var version='V2.2';")==1 and "mid<1||mid>48" in js
          assert "map-047-v241.pack" in js and "map-048-v229r115.pack" not in js  # Default mid48 name is calculated.
          assert js.count('installMap47Files(mid)')==2
          for file in ('index.html','knight/index.html'):
           assert 'V2.2' in (root/file).read_text('utf8')
          print('PASS V2.2 original',len(before),'files unchanged except',len(changed),'approved metadata/load changes')
          print('PASS original Map047 data and pack byte-for-byte, no original game assets lost')
          print('PASS Map048 added',len(imgs),'PNG source images and',len(head['files']),'pack entries')
          print('PASS all mapping MD5 and Map048 native pack payloads')
          V22_MAP48_VERIFY_EOF
          .venv/bin/python -m py_compile build/v22/verify_map048.py
          .venv/bin/python build/v22/verify_map048.py

      - name: Verify Map047 and Map048 graphics installed before gameplay
        shell: bash
        run: |
          set -euo pipefail
          cat > build/v22/verify_browser_map048.js <<'V22_MAP48_BROWSER_EOF'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const path=require('node:path');
          const root=path.resolve('site/knight');
          const installs=new Set();
          let nativeMapCallbacks=0;
          let originalDownloadCalled=0;
          const stat={created:0,unlinked:0};
          const overlayObjects=[];
          const context={
           console,TextDecoder,DataView,Uint8Array,ArrayBuffer,AbortController,
           setTimeout,clearTimeout,Promise,Error,Number,String,Object,
           document:{body:{appendChild(x){overlayObjects.push(x)}},
            createElement(tag){return {tag,style:{},append(x){},remove(){},onclick:null,textContent:''}},
            getElementById(id){return null}},
           window:{fileAsyncCache:{},loadFileAsync(fullPath,bitmap,callback){
             nativeMapCallbacks++;
             let mapid=Number((fullPath.match(/Map(\d{3})\.rxdata/i)||[])[1]);
             if(mapid==47 && installs.size<300)throw new Error('Map047 opened before graphics install');
             if(mapid==48 && installs.size<690)throw new Error('Map048 opened before graphics install');
             if(typeof callback==='function')callback();
           },getLazyAsset(){originalDownloadCalled++}},
           FS:{createPreloadedFile(folder,name,bytes,canRead,canWrite,ok,fail,dontCreate,canOwn,preFinish){
             if(!(bytes instanceof Uint8Array)||bytes.length<8)throw new Error('Invalid map asset');
             stat.created++;
             installs.add(folder+'/'+name);
             if(typeof preFinish==='function')preFinish();
             ok();
           },unlink(){stat.unlinked++}},
           fetch(url){
            const f=path.join(root,String(url));
            if(!fs.existsSync(f))return Promise.resolve({ok:false,status:404,headers:new Map(),body:null});
            return Promise.resolve({ok:true,status:200,body:null,headers:new Map(),arrayBuffer(){
             const b=fs.readFileSync(f);return Promise.resolve(b.buffer.slice(b.byteOffset,b.byteOffset+b.byteLength));
            }});
           }
          };
          vm.createContext(context);
          vm.runInContext(fs.readFileSync(path.join(root,'gameasync/mapping.js'),'utf8'),context,{filename:'mapping.js'});
          vm.runInContext(fs.readFileSync(path.join(root,'js/sl-assets-v229r115.js'),'utf8'),context,{filename:'sl-assets-v229r115.js'});
          function load(mid){
           return new Promise((resolve,reject)=>{
            let timer=setTimeout(()=>reject(new Error('Map'+mid+' install timed out')),30000);
            try{context.window.loadFileAsync('gameasync/Data/Map'+String(mid).padStart(3,'0')+'.rxdata',false,()=>{clearTimeout(timer);resolve()});}catch(e){clearTimeout(timer);reject(e)}
           });
          }
          function getHead(mid){
           const f=path.join(root,'assets',mid===47?'map-047-v241.pack':'map-048-v229r115.pack');
           const data=fs.readFileSync(f);const l=data.readUInt32LE(0);
           return JSON.parse(data.subarray(4,4+l));
          }
          async function main(){
           await load(47);
           if(nativeMapCallbacks!==1)throw new Error('Map047 native callback count');
           const h47=getHead(47);
           const missing47=h47.files.filter(x=>!context.window.fileAsyncCache[x[0]]);
           if(missing47.length)throw new Error('Map047 preinstall skipped '+missing47.length+' entries');
           const originals=new Set(installs);
           await load(48);
           if(nativeMapCallbacks!==2)throw new Error('Map048 native callback count');
           const h48=getHead(48);
           if(h48.files.length!==399)throw new Error('Map048 pack entries not 399');
           const missing48=h48.files.filter(x=>!context.window.fileAsyncCache[x[0]]);
           if(missing48.length)throw new Error('Map048 preinstall skipped '+missing48.length+' entries');
           if(!installs.has('/game/Graphics/Panoramas/SLTI_48_GID.png'))throw new Error('Map048 GID not installed');
           if(!installs.has('/game/Graphics/Tilesets/SLTI_Collision_Transparent.png'))throw new Error('Original collision tileset not installed');
           for(const key of originals)if(!installs.has(key))throw new Error('Map048 removed original loaded Map047 asset '+key);
           if(stat.created!==h47.files.length+h48.files.length-1)throw new Error('wrong unique installed image count '+stat.created);
           console.log('PASS both Map047 and Map048 use original pre-entry loader with one native map callback each');
           console.log('PASS',h47.files.length,'Map047 assets and',h48.files.length,'Map048 assets; shared collision tileset installed once');
           console.log('PASS Map047 assets retained during Map048 entry, no image download during movement');
          }
          main().catch(err=>{console.error(err);process.exitCode=1});
          V22_MAP48_BROWSER_EOF
          node --check build/v22/verify_browser_map048.js
          node build/v22/verify_browser_map048.js

      - name: Publish V2.2 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
