name: Deploy SLKnight Fast Runtime Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-slknight-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  SITE_URL: https://gowellsik-hue.github.io

jobs:
  build:
    name: Patch current web build with runtime diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Install patch tools
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y curl unzip ruby python3 python3-pip
          python3 -m pip install --break-system-packages rpzip

      - name: Download current deployed web build
        run: |
          set -e
          mkdir -p dist/assets

          curl -L --fail --retry 3 \
            -H 'Cache-Control: no-cache' \
            "${SITE_URL}/?run=${GITHUB_RUN_ID}" \
            -o dist/index.html

          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          import re

          base = "https://gowellsik-hue.github.io/"
          html_path = Path("dist/index.html")
          html = html_path.read_text(encoding="utf-8")

          refs = re.findall(r'(?:src|href)=["\']([^"\']+)["\']', html)

          for ref in refs:
              if ref.startswith("./"):
                  rel = ref[2:]
              elif ref.startswith("/"):
                  rel = ref[1:]
              else:
                  continue

              if not rel.startswith("assets/"):
                  continue

              out = Path("dist") / rel
              out.parent.mkdir(parents=True, exist_ok=True)

              req = Request(
                  base + rel,
                  headers={"Cache-Control": "no-cache"},
              )

              with urlopen(req) as response:
                  out.write_bytes(response.read())

              print("downloaded", rel)
          PY

          curl -L --fail --retry 3 \
            -H 'Cache-Control: no-cache' \
            "${SITE_URL}/coi-serviceworker.min.js?run=${GITHUB_RUN_ID}" \
            -o dist/coi-serviceworker.min.js

          curl -L --fail --retry 3 \
            -H 'Cache-Control: no-cache' \
            "${SITE_URL}/mkxp-z_libretro.js?run=${GITHUB_RUN_ID}" \
            -o dist/mkxp-z_libretro.js

          curl -L --fail --retry 3 \
            -H 'Cache-Control: no-cache' \
            "${SITE_URL}/mkxp-z_libretro.wasm?run=${GITHUB_RUN_ID}" \
            -o dist/mkxp-z_libretro.wasm

          curl -L --fail --retry 3 \
            -H 'Cache-Control: no-cache' \
            "${SITE_URL}/slknight.mkxpz?run=${GITHUB_RUN_ID}" \
            -o current-slknight.mkxpz

          cp current-slknight.mkxpz dist/slknight.mkxpz
          touch dist/.nojekyll

          test -s dist/index.html
          test -s dist/mkxp-z_libretro.js
          test -s dist/mkxp-z_libretro.wasm
          test -s dist/slknight.mkxpz

      - name: Inject visible RGSS crash screen
        run: |
          set -e

          OLD_HASH="$(sha256sum current-slknight.mkxpz | awk '{print $1}')"
          OLD_SIZE="$(stat -c%s current-slknight.mkxpz)"

          export OLD_HASH OLD_SIZE

          rm -rf game
          mkdir game
          unzip -q current-slknight.mkxpz -d game

          ruby -rzlib - <<'RB'
          ini = File.binread('game/Game.ini')
          scripts_rel = ini[/^Scripts=(.+)$/i, 1]
          abort 'Scripts entry missing from Game.ini' if scripts_rel == nil

          scripts_rel = scripts_rel.strip.tr('\\', '/')
          path = 'game/' + scripts_rel
          abort "Scripts file missing: #{path}" unless File.file?(path)

          scripts = Marshal.load(File.binread(path))
          main = scripts.find { |entry| entry.is_a?(Array) && entry[1].to_s == 'Main' }
          abort 'Main script not found' if main == nil

          diagnostic_main = <<'RUBY'
          # SLKnight browser runtime diagnostic Main.
          begin
            Graphics.frame_rate = 50
            Graphics.freeze
            $scene = Scene_Title.new

            while $scene != nil
              $scene.main
            end

            Graphics.transition(20)
          rescue Exception => e
            begin
              warn("SLK_FATAL " + e.class.to_s + ": " + e.message.to_s)
              if e.backtrace != nil
                warn(e.backtrace.join("\n"))
              end
            rescue Exception
            end

            begin
              Graphics.freeze

              diagnostic_sprite = Sprite.new
              diagnostic_sprite.z = 99999999
              diagnostic_sprite.bitmap = Bitmap.new(800, 600)
              diagnostic_sprite.bitmap.fill_rect(
                0,
                0,
                800,
                600,
                Color.new(55, 0, 0, 255)
              )

              diagnostic_sprite.bitmap.font.name = ["Arial", "Tahoma"]
              diagnostic_sprite.bitmap.font.size = 18
              diagnostic_sprite.bitmap.font.bold = false
              diagnostic_sprite.bitmap.font.color = Color.new(255, 255, 255, 255)

              lines = []
              lines << "SLKnight RUNTIME ERROR"
              lines << (e.class.to_s + ": " + e.message.to_s)
              lines << ""

              if e.backtrace != nil
                for line in e.backtrace[0, 18]
                  lines << line.to_s
                end
              end

              y = 18
              for line in lines
                diagnostic_sprite.bitmap.draw_text(18, y, 764, 24, line.to_s)
                y += 26
              end

              Graphics.transition(0)

              loop do
                Graphics.update
                Input.update
              end
            rescue Exception => draw_error
              begin
                warn(
                  "SLK_DIAGNOSTIC_DRAW_FAILED " +
                  draw_error.class.to_s +
                  ": " +
                  draw_error.message.to_s
                )
              rescue Exception
              end

              loop do
                begin
                  Graphics.update
                rescue Exception
                end
              end
            end
          end
          RUBY

          main[2] = Zlib::Deflate.deflate(diagnostic_main)
          File.binwrite(path, Marshal.dump(scripts))

          puts 'RGSS_DIAGNOSTIC_MAIN_INJECTED'
          RB

          rm -f dist/slknight.mkxpz

          cd game
          rpzip -r "${GITHUB_WORKSPACE}/dist/slknight.mkxpz" *
          cd "${GITHUB_WORKSPACE}"

          NEW_HASH="$(sha256sum dist/slknight.mkxpz | awk '{print $1}')"
          NEW_SIZE="$(stat -c%s dist/slknight.mkxpz)"

          export NEW_HASH NEW_SIZE

          echo "old game: ${OLD_SIZE} ${OLD_HASH}"
          echo "new game: ${NEW_SIZE} ${NEW_HASH}"

          python3 - <<'PY'
          from pathlib import Path
          import os

          old_hash = os.environ["OLD_HASH"]
          new_hash = os.environ["NEW_HASH"]
          old_size = os.environ["OLD_SIZE"]
          new_size = os.environ["NEW_SIZE"]

          candidates = list(Path("dist/assets").glob("index-*.js"))
          if not candidates:
              raise SystemExit("Vite index JS not found")

          selected = None

          for path in candidates:
              text = path.read_text(encoding="utf-8")
              if old_hash in text:
                  selected = path
                  break

          if selected is None:
              raise SystemExit("Old GAME_HASH not found in frontend JS")

          text = selected.read_text(encoding="utf-8")

          if text.count(old_hash) != 1:
              raise SystemExit(
                  "Unexpected GAME_HASH occurrence count: " +
                  str(text.count(old_hash))
              )

          if old_size not in text:
              raise SystemExit("Old GAME_SIZE not found in frontend JS")

          text = text.replace(old_hash, new_hash, 1)
          text = text.replace(old_size, new_size, 1)

          new_name = (
              selected.stem +
              "-diag-" +
              new_hash[:8] +
              selected.suffix
          )
          new_path = selected.with_name(new_name)
          new_path.write_text(text, encoding="utf-8")
          selected.unlink()

          index_path = Path("dist/index.html")
          html = index_path.read_text(encoding="utf-8")

          old_ref_a = "/assets/" + selected.name
          old_ref_b = "./assets/" + selected.name
          new_ref = "/assets/" + new_path.name

          if old_ref_a in html:
              html = html.replace(old_ref_a, new_ref, 1)
          elif old_ref_b in html:
              html = html.replace(old_ref_b, new_ref, 1)
          else:
              raise SystemExit("Frontend JS reference not found in index.html")

          index_path.write_text(html, encoding="utf-8")

          print("patched frontend GAME_HASH", new_hash)
          print("patched frontend GAME_SIZE", new_size)
          print("renamed frontend JS", new_path.name)
          PY

      - name: Verify diagnostic deployment files
        run: |
          set -e

          test -s dist/index.html
          test -s dist/mkxp-z_libretro.js
          test -s dist/mkxp-z_libretro.wasm
          test -s dist/slknight.mkxpz

          grep -q 'diag-' dist/index.html

          unzip -tq dist/slknight.mkxpz >/dev/null

          echo 'SLKNIGHT_FAST_DIAGNOSTIC_BUILD_OK'

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    needs:
      - build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
