name: Deploy SLKnight V14.3z10.1 + SLFairy DUAL FIX

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions: {contents: read, pages: write, id-token: write}

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  CURRENT_Z10_SHA: f545634bafbe1e1e55aaf6489126ad17b07da382
  BASELINE_SHA: c6815cd461dba60ec131898e6d5dd8690dd915ae
  X2_SHA: 6d941bd643dda87b8267ba466e108d1904c22331
  Z1_SHA: 008b6abe81074b7af877806b45f2314004a74f66
  Z3_SHA: 5a46988b048764e8a99700998c1f4ab96a3ec5c1
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  FAIRY_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLFairy_Source_v1.zip
  FAIRY_SHA256: 67b88b5fe0cde3c9f2fada889815f9aa7d0fc94b378025529e9950d55151c70e
  FAIRY_7Z_PASSWORD: http://nemo838.tistory.com/
  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout current z10 workflow source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.CURRENT_Z10_SHA }}
          path: z10src

      - name: Checkout frozen V14.3l baseline
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.BASELINE_SHA }}
          path: baseline

      - name: Checkout frozen V14.3x2 native auto base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.X2_SHA }}
          path: x2

      - name: Checkout frozen V14.3z1 verified monster base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z1_SHA }}
          path: z1

      - name: Checkout frozen V14.3z3 current success
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z3_SHA }}
          path: z3

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake cmake curl ffmpeg freepats git imagemagick libtool make mm-common patch pkg-config python3 rake ruby timidity unzip wget xz-utils fonts-nanum p7zip-full

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.MKXP_SRC_REF }}
          path: engine

      - name: Cache engine dependencies
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-${{ runner.os }}-${{ env.EMSDK_VER }}-onig25b

      - name: Extract exact current z10 run steps
        run: |
          ruby -ryaml - <<'RB'
          doc=YAML.load_file('z10src/.github/workflows/build-slknight-web.yml')
          steps=doc.fetch('jobs').fetch('build').fetch('steps')
          names=[
            'Extract frozen run scripts',
            'Remove unsupported Orc alias mappings from z1 patch',
            'Add user-verified remaining 5 monster mappings',
            'Retarget inherited z3 scripts to z10 counts',
            'Patch engine',
            'Build engine',
            'Install game',
            'Patch game from V14.3l',
            'Snapshot original buff and transform owners',
            'Patch verified monster attacks including remaining 5',
            'Patch Gnoll Neruga Drake Kelberos',
            'Convert media',
            'Build mappings',
            'Patch browser from V14.3l',
            'Verify frozen V14.3l baseline',
            'Patch native Lineage auto attack at full input rate',
            'Patch enhanced green attack timing only',
            'Patch transform recognition only',
            'Separate Z hotbar input only',
            'Preload z10 verified attack and breath assets',
            'Verify V14.3z10 package'
          ]
          names.each_with_index do |name,i|
            step=steps.find{|s|s['name']==name}
            abort "Z10 STEP MISSING: #{name}" unless step&&step['run']
            File.write(format('/tmp/z10_%02d.sh',i),step['run'])
          end
          puts "Z10_RUN_STEPS_EXTRACTED=#{names.length}"
          RB

      - name: Fix actual z10 transform Marshal failure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/z10_17.sh')
          s=p.read_text()
          old='''            class CommonEvent; end\n            class EventCommand; end\n          end'''
          new='''            class CommonEvent; end\n            class EventCommand; end\n            class MoveRoute; end\n            class MoveCommand; end\n          end'''
          if s.count(old)!=1:
              raise SystemExit(f'transform Marshal class marker count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          print('TRANSFORM_MARSHAL_CLASSES_FIXED')
          PY
          grep -Fq 'class MoveRoute; end' /tmp/z10_17.sh
          grep -Fq 'class MoveCommand; end' /tmp/z10_17.sh

      - name: Knight 01 extract frozen scripts
        run: bash /tmp/z10_00.sh

      - name: Knight 02 remove unsupported Orc aliases
        run: bash /tmp/z10_01.sh

      - name: Knight 03 add verified remaining monsters
        run: bash /tmp/z10_02.sh

      - name: Knight 04 retarget inherited scripts
        run: bash /tmp/z10_03.sh

      - name: Knight 05 patch engine
        run: bash /tmp/z10_04.sh

      - name: Knight 06 build engine
        run: bash /tmp/z10_05.sh

      - name: Knight 07 install game
        run: bash /tmp/z10_06.sh

      - name: Knight 08 patch game
        run: bash /tmp/z10_07.sh

      - name: Knight 09 snapshot original buff and transform owners
        run: bash /tmp/z10_08.sh

      - name: Knight 10 patch verified monster attacks
        run: bash /tmp/z10_09.sh

      - name: Knight 11 patch Gnoll Neruga Drake Kelberos
        run: bash /tmp/z10_10.sh

      - name: Knight 12 convert media
        run: bash /tmp/z10_11.sh

      - name: Knight 13 build mappings
        run: bash /tmp/z10_12.sh

      - name: Knight 14 patch browser
        run: bash /tmp/z10_13.sh

      - name: Knight 15 verify baseline
        run: bash /tmp/z10_14.sh

      - name: Knight 16 patch full-rate auto attack
        run: bash /tmp/z10_15.sh

      - name: Knight 17 patch enhanced green timing only
        run: bash /tmp/z10_16.sh

      - name: Knight 18 patch transform recognition only fixed
        run: bash /tmp/z10_17.sh

      - name: Knight 19 separate Z hotbar input only
        run: bash /tmp/z10_18.sh

      - name: Knight 20 preload verified attack assets
        run: bash /tmp/z10_19.sh

      - name: Knight 21 verify z10 package
        run: bash /tmp/z10_20.sh

      - name: Download SLFairy source
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o fairy-source.zip "$FAIRY_URL"
          echo "$FAIRY_SHA256  fairy-source.zip" | sha256sum -c -
          echo FAIRY_DOWNLOAD_OK

      - name: Prepare SLFairy source and decrypt RGSSAD
        run: |
          set -euo pipefail
          rm -rf /tmp/fairy_pkg /tmp/fairy_raw /tmp/fairy_game fairy_player
          mkdir -p /tmp/fairy_pkg /tmp/fairy_raw /tmp/fairy_game
          unzip -q fairy-source.zip -d /tmp/fairy_pkg
          test -s /tmp/fairy_pkg/SLFairy_Win_241226.7z
          7z x /tmp/fairy_pkg/SLFairy_Win_241226.7z -p"$FAIRY_7Z_PASSWORD" -o/tmp/fairy_raw -y >/tmp/fairy_7z.log
          test -s /tmp/fairy_raw/Game.rgssad
          test -s /tmp/fairy_raw/Game.ini
          cat > /tmp/rgssad_extract.py <<'PY'
          #!/usr/bin/env python3
          from pathlib import Path
          import struct, sys
          
          MASK=0xffffffff
          DEFAULT_KEY=0xDEADCAFE
          
          def rot(k): return ((k*7)+3)&MASK
          
          def decrypt_archive(src: Path, out: Path):
              out.mkdir(parents=True, exist_ok=True)
              with src.open('rb') as f:
                  hdr=f.read(8)
                  if hdr[:7] != b'RGSSAD\0' or len(hdr)!=8 or hdr[7] != 1:
                      raise ValueError(f'unsupported RGSSAD header: {hdr!r}')
                  key=DEFAULT_KEY
                  count=0
                  while True:
                      raw=f.read(4)
                      if not raw: break
                      if len(raw)!=4: raise EOFError('truncated filename length')
                      n=struct.unpack('<I', raw)[0] ^ key
                      key=rot(key)
                      if n>4096: raise ValueError(f'bad filename length {n} at entry {count}')
                      enc=f.read(n)
                      if len(enc)!=n: raise EOFError('truncated filename')
                      name_b=bytearray(enc)
                      for i in range(n):
                          name_b[i] ^= key & 0xff
                          key=rot(key)
                      raw=f.read(4)
                      if len(raw)!=4: raise EOFError('truncated file length')
                      size=struct.unpack('<I', raw)[0] ^ key
                      key=rot(key)
                      try:
                          name=bytes(name_b).decode('cp949')
                      except UnicodeDecodeError:
                          try: name=bytes(name_b).decode('utf-8')
                          except UnicodeDecodeError: name=bytes(name_b).decode('latin1')
                      name=name.replace('\\','/')
                      parts=[p for p in name.split('/') if p not in ('','.','..')]
                      if not parts: raise ValueError('empty/unsafe path')
                      target=out.joinpath(*parts)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      data_key=key
                      counter=0
                      remaining=size
                      with target.open('wb') as w:
                          while remaining:
                              chunk=bytearray(f.read(min(1<<20, remaining)))
                              if not chunk: raise EOFError(f'truncated data for {name}')
                              for i in range(len(chunk)):
                                  chunk[i] ^= data_key.to_bytes(4,'little')[counter]
                                  counter=(counter+1)&3
                                  if counter==0: data_key=rot(data_key)
                              w.write(chunk)
                              remaining -= len(chunk)
                      count += 1
                      if count <= 8 or count % 250 == 0:
                          print(f'RGSSAD_EXTRACT {count}: {name} ({size} bytes)')
              print(f'RGSSAD_EXTRACT_OK files={count}')
          
          def make_test(path: Path, files):
              with path.open('wb') as f:
                  f.write(b'RGSSAD\0\x01')
                  key=DEFAULT_KEY
                  for name,data in files:
                      nb=name.encode('cp949')
                      f.write(struct.pack('<I',len(nb)^key)); key=rot(key)
                      enc=bytearray(nb)
                      for i in range(len(enc)):
                          enc[i]^=key&0xff; key=rot(key)
                      f.write(enc)
                      f.write(struct.pack('<I',len(data)^key)); key=rot(key)
                      dk=key; ctr=0; encd=bytearray(data)
                      for i in range(len(encd)):
                          encd[i]^=dk.to_bytes(4,'little')[ctr]
                          ctr=(ctr+1)&3
                          if ctr==0: dk=rot(dk)
                      f.write(encd)
          
          def selftest(tmp: Path):
              src=tmp/'test.rgssad'; out=tmp/'out'
              files=[('Data\\Scripts.rxdata',b'abc\x00xyz'),('Graphics\\Icons\\용기.png',bytes(range(256))*3),('Audio\\SE\\test.wav',b'RIFF'+b'Z'*101)]
              make_test(src,files); decrypt_archive(src,out)
              for name,data in files:
                  p=out.joinpath(*name.replace('\\','/').split('/'))
                  assert p.read_bytes()==data,(name,len(p.read_bytes()),len(data))
              print('RGSSAD_SELFTEST_OK')
          
          if __name__=='__main__':
              if len(sys.argv)==2 and sys.argv[1]=='--selftest':
                  import tempfile
                  with tempfile.TemporaryDirectory() as d: selftest(Path(d))
              elif len(sys.argv)==3:
                  decrypt_archive(Path(sys.argv[1]),Path(sys.argv[2]))
              else:
                  raise SystemExit('usage: rgssad_extract.py ARCHIVE OUTDIR | --selftest')
          PY
          python3 /tmp/rgssad_extract.py --selftest
          python3 /tmp/rgssad_extract.py /tmp/fairy_raw/Game.rgssad /tmp/fairy_game
          test -s /tmp/fairy_game/Data/Scripts.rxdata
          test -d /tmp/fairy_game/Graphics
          cp /tmp/fairy_raw/Game.ini /tmp/fairy_game/Game.ini
          if [ -d /tmp/fairy_raw/Audio ]; then
            mkdir -p /tmp/fairy_game/Audio
            cp -a /tmp/fairy_raw/Audio/. /tmp/fairy_game/Audio/
          fi
          cp -a player fairy_player
          rm -rf fairy_player/gameasync fairy_player/preload
          rm -f fairy_player/core-data.pack fairy_player/core-gfx.pack fairy_player/core-audio.pack fairy_player/core-manifest.js
          mkdir -p fairy_player/gameasync/Fonts fairy_player/preload
          cp -a /tmp/fairy_game/. fairy_player/gameasync/
          cp engine/extra/rgss.rb fairy_player/gameasync/rgss.rb
          cp /usr/share/fonts/truetype/nanum/NanumGothic.ttf fairy_player/gameasync/Fonts/NanumGothic.ttf
          cp /usr/share/fonts/truetype/nanum/NanumGothicBold.ttf fairy_player/gameasync/Fonts/NanumGothicBold.ttf
          rm -f fairy_player/gameasync/Game.rgssad fairy_player/gameasync/Save*.rxdata
          echo FAIRY_SOURCE_READY

      - name: Patch SLFairy scripts for web and mobile
        run: |
          cat > /tmp/patch_fairy.rb <<'RB'
          # encoding: UTF-8
          require 'zlib'
          
          game = ARGV.fetch(0)
          ini_path = File.join(game, 'Game.ini')
          ini = File.binread(ini_path)
          rel = ini[/^Scripts=(.+)$/i, 1].to_s.strip.tr('\\', '/')
          abort 'Fairy Scripts entry missing' if rel.empty?
          source_path = File.join(game, rel)
          abort "Fairy scripts missing: #{source_path}" unless File.file?(source_path)
          scripts = Marshal.load(File.binread(source_path))
          
          def inflate(e)
            Zlib::Inflate.inflate(e[2]).force_encoding(Encoding::UTF_8)
          end
          
          def deflate(e, s)
            e[2] = Zlib::Deflate.deflate(s)
          end
          
          def entry_for(scripts, name)
            scripts.find { |x| x.is_a?(Array) && x.length >= 3 && x[1].to_s == name }
          end
          
          compat = <<'RUBY'
          $joiplay=true
          module Kernel
            def exit(*args); nil; end
          end
          class Win32API
            def initialize(*args); @func=args[1].to_s; end
            def web_input(key)
              case key.to_i
              when 9,90 then Input::A
              when 13,32,67 then Input::C
              when 27,88 then Input::B
              when 68 then Input::Z
              when 81 then Input::L
              when 83 then Input::Y
              when 87 then Input::R
              when 65 then Input::X
              when 16 then Input::SHIFT
              when 17 then Input::CTRL
              when 18 then Input::ALT
              when 116 then Input::F5
              when 117 then Input::F6
              when 118 then Input::F7
              when 119 then Input::F8
              when 120 then Input::F9
              else nil
              end
            end
            def call(*args)
              code=web_input(args[0])
              return(code && Input.trigger?(code) ? 1 : 0) if @func=='GetAsyncKeyState'
              return(code && Input.press?(code) ? -1 : 0) if @func=='GetKeyState'
              0
            end
            def Call(*args); call(*args); end
          end
          Font.default_name='NanumGothic'
          module Audio
            def self.sl_stream(kind,*parts); puts((['SLAUDIO',kind]+parts.collect{|v|v.to_s}).join('|')); end
            def self.bgm_play(filename,volume=100,pitch=100); sl_stream('BGM_PLAY',filename,volume,pitch); end
            def self.bgm_stop; sl_stream('BGM_STOP'); end
            def self.bgm_fade(time); sl_stream('BGM_FADE',time); end
            def self.bgs_play(filename,volume=100,pitch=100); sl_stream('BGS_PLAY',filename,volume,pitch); end
            def self.bgs_stop; sl_stream('BGS_STOP'); end
            def self.bgs_fade(time); sl_stream('BGS_FADE',time); end
          end
          RUBY
          
          scripts.reject! { |e| e.is_a?(Array) && e.length >= 3 && ['Web Compatibility','Mobile Diablo Assist'].include?(e[1].to_s) }
          scripts.insert(0, [0, 'Web Compatibility', Zlib::Deflate.deflate(compat)])
          
          def patch_begin_until(src)
            lines=src.lines
            lines.each_index do |i|
              m=lines[i].match(/^(\s*)end\s+until\s+(.+?)\s*$/)
              next unless m
              indent,cond=m[1],m[2]
              j=i-1
              while j>=0
                if lines[j][/^\s*/]==indent && lines[j].strip=='begin'
                  lines[j]=indent+"loop do\n"
                  lines[i]=indent+"  break if #{cond}\n#{indent}end\n"
                  break
                end
                j-=1
              end
            end
            lines.join
          end
          
          def patch_scene_loop(src)
            lines=src.lines
            i=0
            while i<lines.length
              unless lines[i].strip=='loop do'
                i+=1
                next
              end
              indent=lines[i][/^\s*/]
              sig=[]
              k=i+1
              while k<lines.length && sig.length<8
                s=lines[k].strip
                sig << [k,s,lines[k][/^\s*/]] unless s.empty? || s.start_with?('#')
                k+=1
              end
              finish=nil
              if sig.length>=7 && sig[0][1]=='Graphics.update' && sig[1][1]=='Input.update' && sig[2][1]=='update' && sig[3][1]=='if $scene != self' && sig[4][1]=='break' && sig[5][1]=='end' && sig[6][1]=='end' && sig[6][2]==indent
                finish=sig[6][0]
              elsif sig.length>=5 && sig[0][1]=='Graphics.update' && sig[1][1]=='Input.update' && sig[2][1]=='update' && sig[3][1]=='break if $scene != self' && sig[4][1]=='end' && sig[4][2]==indent
                finish=sig[4][0]
              end
              if finish
                lines[i..finish]=[indent+"end\n\n"+indent+"def dispose\n"]
              end
              i+=1
            end
            lines.join
          end
          
          browser_loop = <<'RUBY'
          $prev_scene=nil
          $sl_last_scene_name=nil
          def main_update_loop
            begin
              if $scene!=nil
                active_scene=$scene
                name=active_scene.class.to_s
                if $sl_last_scene_name!=name
                  puts('SLFRAME|'+name)
                  $sl_last_scene_name=name
                end
                if active_scene!=$prev_scene
                  $prev_scene.dispose if $prev_scene!=nil && $prev_scene.respond_to?(:dispose)
                  active_scene.main
                  $prev_scene=active_scene
                  return if $scene!=active_scene
                end
                Graphics.update
                Input.update
                active_scene.update if $scene==active_scene
              end
            rescue Exception=>e
              puts('SLRUNTIMEERR|'+e.class.to_s+'|'+e.message.to_s)
              e.backtrace[0,16].each{|line| puts('SLRUNTIMEBT|'+line.to_s)} if e.respond_to?(:backtrace) && e.backtrace
            end
          end
          RUBY
          
          font_rules=[
            [/((?:Font\.default_name)\s*=\s*)\[\s*["'][^"']*["']\s*\]/n,'\\1"NanumGothic"'],
            [/(Font\.default_name\s*=\s*)["'][^"']*["']/n,'\\1"NanumGothic"'],
            [/(\.font\.name\s*=\s*)["'][^"']*["']/n,'\\1"NanumGothic"'],
            [/(\bFONT_NAME\s*=\s*)["'][^"']*["']/n,'\\1"NanumGothic"']
          ]
          
          plane_count=0
          scripts.each do |entry|
            next unless entry.is_a?(Array) && entry.length>=3
            name=entry[1].to_s
            begin
              text=inflate(entry)
            rescue
              next
            end
            font_rules.each{|rx,rep| text.gsub!(rx,rep)}
            text.gsub!('defined?($joiplay) && $joiplay','$joiplay == true')
            if text.match?(/^\s*class\s+Plane\s*<\s*Sprite\b/n)
              text="# native Plane used on web\n"
              plane_count+=1
            end
            text=patch_begin_until(text)
            text=patch_scene_loop(text) unless name=='Main' || name=='Scene_Map'
            if name=='Main'
              text=browser_loop+text unless text.include?('def main_update_loop')
              text.sub!(/\n\s*while\s+\$scene\s*!=\s*nil\s*\r?\n\s*\$scene\.main\s*\r?\n\s*end\s*/m,"\n")
            end
            deflate(entry,text)
          end
          puts "FAIRY_PLANE_PATCH=#{plane_count}"
          
          res = entry_for(scripts,'해상도')
          if res
            t=inflate(res)
            t.gsub!('$WINDOW_WIDTH = 640','$WINDOW_WIDTH = 800')
            t.gsub!('$WINDOW_HEIGHT = 480','$WINDOW_HEIGHT = 600')
            t.gsub!('640, 480','800, 600')
            deflate(res,t)
          end
          
          map=entry_for(scripts,'Scene_Map')
          if map
            t=inflate(map)
            unless t.include?('SLFAIRY_MAP_UNLOCK')
              t.sub!(/  def main\r?\n/, "  def main\n    $game_switches[49] = false if $game_switches\n    puts('SLFAIRY_MAP_UNLOCK')\n")
            end
            t.gsub!(/\s*if \$game_switches\[49\] == false\r?\n\s*Input\.update\s*\r?\n\s*end\r?\n/, "     Input.update\n")
            t.gsub!('if Keyboard.testkey(9) &&', 'if (Keyboard.testkey(9) || Input.trigger?(Input::Y)) &&')
            t.gsub!('&& Keyboard.testkey(69) &&', '&& (Keyboard.testkey(69) || Input.trigger?(Input::X)) &&')
            deflate(map,t)
          end
          
          equip=entry_for(scripts,'Scene_Equip')
          if equip
            t=inflate(equip)
            t.gsub!('$game_switches[49] = true','$game_switches[49] = false')
            deflate(equip,t)
          end
          
          save=entry_for(scripts,'Scene_Save')
          if save
            t=inflate(save)
            unless t.include?('save_file_async(filename)')
              t.sub!(/    write_save_data\(file\)\r?\n    exit/, "    write_save_data(file)\n    file.close\n    save_file_async(filename)")
            end
            unless t.include?('SLFAIRY_SAVE_UNLOCK')
              t.sub!('    save_file_async(filename)', "    save_file_async(filename)\n    $game_switches[49] = false if $game_switches\n    puts('SLFAIRY_SAVE_UNLOCK')")
            end
            t.gsub!('$scene = Scene_Menu.new(4)','$scene = Scene_Map.new')
            if t.match?(/  def on_cancel\r?\n/) && !t.match?(/  def on_cancel\r?\n\s*\$game_switches\[49\] = false/)
              t.sub!(/  def on_cancel\r?\n/, "  def on_cancel\n    $game_switches[49] = false if $game_switches\n")
            end
            deflate(save,t)
          end
          
          scripts.each do |e|
            next unless e.is_a?(Array) && e.length>=3
            begin
              t=inflate(e)
            rescue
              next
            end
            if t.include?('XRXS_MP7_Module')
              deflate(e,"# web: XRXS menu transparency disabled\n")
            end
          end
          
          ms=entry_for(scripts,'Multi-slot script : Windows')
          if ms
            t=inflate(ms)
            old=/ alias g7_ms_scene_equip_main main\r?\n def main\r?\n  @additional_initialize_done = false\r?\n  g7_ms_scene_equip_main\r?\n  for i in 5\.\.\.@item_windows\.size\r?\n   @item_windows\[i\]\.dispose unless @item_windows\[i\]\.nil\?\r?\n  end\r?\n end/
            if t.match?(old)
              t.sub!(old," alias g7_ms_scene_equip_main main\n def main\n  @additional_initialize_done = false\n  g7_ms_scene_equip_main\n end\n alias g7_ms_scene_equip_dispose dispose\n def dispose\n  if @item_windows != nil\n   for i in 5...@item_windows.size\n    @item_windows[i].dispose unless @item_windows[i].nil?\n   end\n  end\n  g7_ms_scene_equip_dispose\n end")
            end
            t.gsub!('if defined? xrxs_additional_refresh','if respond_to?(:xrxs_additional_refresh)')
            deflate(ms,t)
          end
          
          scripts.each do |e|
            next unless e.is_a?(Array) && e.length>=3
            begin
              t=inflate(e)
            rescue
              next
            end
            next unless t.include?('alias shud_main main')
            t.gsub!('Viewport.new(0, 0, 640, 480)','Viewport.new(0, 0, $WINDOW_WIDTH, $WINDOW_HEIGHT)')
            deflate(e,t)
          end
          
          scripts.each do |e|
            next unless e.is_a?(Array) && e.length>=3
            begin
              t=inflate(e)
            rescue
              next
            end
            bad=t.downcase.include?('ihsoft') || t.include?('oilhwan') || t.include?('일환소프트') || t.downcase.include?('single lineage') || t.downcase.include?('duenter@hanmail.net')
            next unless bad
            t=t.lines.reject do |ln|
              d=ln.downcase
              d.include?('ihsoft') || ln.include?('oilhwan') || ln.include?('일환소프트') || d.include?('single lineage') || d.include?('duenter@hanmail.net')
            end.join
            deflate(e,t)
          end
          
          assist = <<'RUBY'
          $mobile_auto_attack_active=false
          $mobile_auto_attack_event_id=0
          $mobile_auto_attack_cooldown=0
          
          class Game_Event
            def sl_mobile_enemy_event?
              event_data=instance_variable_get(:@event)
              page_data=instance_variable_get(:@page)
              erased=instance_variable_get(:@erased)
              return false if event_data==nil || page_data==nil || erased
              name=event_data.instance_variable_get(:@name).to_s
              return false unless name[0,3]=='[ID'
              return false if self.through
              return false unless self.trigger==2
              true
            end
          end
          
          class Interpreter
            alias sl_mobile_original_command_111 command_111
            def command_111
              if $mobile_auto_attack_active && @event_id==$mobile_auto_attack_event_id && @parameters[0]==11 && @parameters[1]==13
                $mobile_auto_attack_active=false
                @branch[@list[@index].indent]=true
                @branch.delete(@list[@index].indent)
                return true
              end
              sl_mobile_original_command_111
            end
          end
          
          class Game_System
            def sl_quick_items
              @sl_quick_items=[0,0,0,0] if @sl_quick_items==nil
              @sl_quick_items
            end
            def sl_quick_items=(v); @sl_quick_items=v; end
          end
          
          module SLMobileQuick
            def self.emit_labels
              puts('SLHOT|MODE|use')
              $game_system.sl_quick_items.each_with_index do |id,i|
                iid=id.to_i
                item=(iid>0 && $data_items) ? $data_items[iid] : nil
                name=item ? item.name.to_s.gsub('|','/') : '비어있음'
                count=item ? $game_party.item_number(iid).to_i : 0
                icon=item ? item.icon_name.to_s.gsub('|','/') : ''
                puts('SLHOT|STATE|'+(i+1).to_s+'|'+iid.to_s+'|'+count.to_s+'|'+icon+'|'+name)
              end
            end
            def self.use(slot)
              return if $game_party==nil || $game_system==nil
              id=$game_system.sl_quick_items[slot].to_i
              item=(id>0 && $data_items) ? $data_items[id] : nil
              unless item && item.is_a?(RPG::Item) && $game_party.item_number(id)>0 && $game_party.item_can_use?(id)
                $game_system.se_play($data_system.buzzer_se) if $data_system
                return
              end
              used=false
              if item.scope>=3
                if item.scope==4 || item.scope==6
                  for actor in $game_party.actors
                    used |= actor.item_effect(item)
                  end
                else
                  actor=$game_party.actors[0]
                  used=actor ? actor.item_effect(item) : false
                end
              elsif item.common_event_id>0
                used=true
              end
              if used
                $game_system.se_play(item.menu_se)
                $game_party.lose_item(id,1) if item.consumable
                $game_temp.common_event_id=item.common_event_id if item.common_event_id>0
                $KeyIcon.ShowIcon if defined?($KeyIcon) && $KeyIcon
                Guage.show if defined?(Guage)
              else
                $game_system.se_play($data_system.buzzer_se)
              end
            end
          end
          
          class Scene_MobileQuick
            def initialize(slot_index=0); @slot_index=slot_index; end
            def main
              @help_window=Window_Help.new
              @help_window.set_text('빠른슬롯을 선택한 뒤 소지 아이템을 지정하세요.')
              build_slot_window
              @item_window=Window_Item.new
              @item_window.help_window=@help_window
              @item_window.active=false
              @item_window.visible=false
              Graphics.transition
            end
            def build_slot_window
              old_index=@slot_window ? @slot_window.index : @slot_index
              @slot_window.dispose if @slot_window
              names=[]
              $game_system.sl_quick_items.each_with_index do |id,i|
                item=(id.to_i>0 && $data_items) ? $data_items[id.to_i] : nil
                names << "#{i+1}. #{item ? item.name.to_s : '비어 있음'}"
              end
              @slot_window=Window_Command.new(300,names)
              @slot_window.x=0
              @slot_window.y=64
              @slot_window.index=[[old_index,0].max,3].min
            end
            def dispose
              Graphics.freeze
              @help_window.dispose if @help_window
              @slot_window.dispose if @slot_window
              @item_window.dispose if @item_window
            end
            def update
              @help_window.update
              @slot_window.update
              @item_window.update
              if @slot_window.active
                if Input.trigger?(Input::B)
                  $game_system.se_play($data_system.cancel_se)
                  $scene=Scene_Map.new
                  return
                end
                if Input.trigger?(Input::C)
                  $game_system.se_play($data_system.decision_se)
                  @slot_index=@slot_window.index
                  @slot_window.active=false
                  @item_window.visible=true
                  @item_window.active=true
                  @item_window.index=0
                  @help_window.set_text('이 슬롯에 넣을 소지 아이템을 선택하세요.')
                  return
                end
              else
                if Input.trigger?(Input::B)
                  $game_system.se_play($data_system.cancel_se)
                  @item_window.active=false
                  @item_window.visible=false
                  @slot_window.active=true
                  @help_window.set_text('빠른슬롯을 선택한 뒤 소지 아이템을 지정하세요.')
                  return
                end
                if Input.trigger?(Input::C)
                  item=@item_window.item
                  unless item && item.is_a?(RPG::Item)
                    $game_system.se_play($data_system.buzzer_se)
                    return
                  end
                  $game_system.sl_quick_items[@slot_index]=item.id
                  $game_system.se_play($data_system.decision_se)
                  @item_window.active=false
                  @item_window.visible=false
                  build_slot_window
                  @slot_window.active=true
                  @help_window.set_text('지정 완료. 다른 슬롯도 설정할 수 있습니다.')
                  return
                end
              end
            end
          end
          
          class Game_Player
            alias sl_mobile_original_update update
            def update
              sl_mobile_original_update
              $mobile_auto_attack_cooldown-=1 if $mobile_auto_attack_cooldown>0
              $mobile_auto_attack_active=false if $mobile_auto_attack_active && $mobile_auto_attack_cooldown<=8
              return if moving? || @move_route_forcing || $game_temp.message_window_showing || $game_system.map_interpreter.running? || $mobile_auto_attack_cooldown>0
              return if $game_switches[743]
              target=nil
              for event in $game_map.events.values
                next unless event.sl_mobile_enemy_event?
                if (event.x-self.x).abs+(event.y-self.y).abs==1
                  target=event
                  break
                end
              end
              return if target==nil
              dx=target.x-self.x; dy=target.y-self.y
              if dx>0; turn_right
              elsif dx<0; turn_left
              elsif dy>0; turn_down
              else; turn_up
              end
              target.turn_toward_player
              $mobile_auto_attack_event_id=target.id
              $mobile_auto_attack_active=true
              $mobile_auto_attack_cooldown=20
              target.start
            end
          end
          
          class Scene_Map
            alias sl_mobile_quick_main main
            def main
              SLMobileQuick.emit_labels
              sl_mobile_quick_main
            end
            alias sl_mobile_quick_update update
            def update
              if Input.trigger?(Input::F5)
                $scene=Scene_MobileQuick.new
                return
              end
              SLMobileQuick.use(0) if Input.trigger?(Input::F6)
              SLMobileQuick.use(1) if Input.trigger?(Input::F7)
              SLMobileQuick.use(2) if Input.trigger?(Input::F8)
              SLMobileQuick.use(3) if Input.trigger?(Input::F9)
              sl_mobile_quick_update
            end
          end
          RUBY
          
          main_index=scripts.index{|e| e.is_a?(Array) && e.length>=3 && e[1].to_s=='Main'}
          abort 'Fairy Main script missing' unless main_index
          scripts.insert(main_index,[99999992,'Mobile Diablo Assist',Zlib::Deflate.deflate(assist)])
          
          shim = <<'RUBY'
          $WINDOW_WIDTH = 800
          $WINDOW_HEIGHT = 600
          begin
            Graphics.resize_screen(800,600)
          rescue
          end
          RUBY
          scripts.insert(main_index,[99999990,'Web Resolution 800x600',Zlib::Deflate.deflate(shim)])
          
          out_path=File.join(game,'Data','Scripts.rxdata')
          File.binwrite(out_path,Marshal.dump(scripts))
          File.delete(source_path) if File.expand_path(source_path)!=File.expand_path(out_path) && File.exist?(source_path)
          lines=ini.split(/\r?\n/).map do |line|
            if line =~ /^Scripts=/i
              'Scripts=Data\\Scripts.rxdata'
            elsif line =~ /^Title=/i
              'Title=SLFairy'
            else
              line
            end
          end
          File.binwrite(ini_path,lines.join("\r\n")+"\r\n")
          puts "FAIRY_SCRIPT_PATCH_OK scripts=#{scripts.length}"
          RB
          ruby -c /tmp/patch_fairy.rb
          ruby -EUTF-8:UTF-8 /tmp/patch_fairy.rb fairy_player/gameasync

      - name: Convert SLFairy media
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,sys
          root=Path('fairy_player/gameasync/Audio')
          exts={'.mp3','.wav','.wma','.aac','.m4a','.flac','.mid','.midi'}
          failures=[]; converted=0
          if root.exists():
              for src in [p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in exts]:
                  out=src.with_suffix('.ogg'); temp=None
                  try:
                      inp=src
                      if src.suffix.lower() in {'.mid','.midi'}:
                          temp=src.with_name(src.name+'.wav')
                          subprocess.run(['timidity',str(src),'-Ow','-o',str(temp)],check=True)
                          inp=temp
                      subprocess.run(['ffmpeg','-nostdin','-v','error','-y','-i',str(inp),'-c:a','libvorbis','-q:a','4',str(out)],check=True)
                      if not out.exists() or out.stat().st_size==0: raise RuntimeError('empty output')
                      if temp and temp.exists(): temp.unlink()
                      if src!=out and src.exists(): src.unlink()
                      converted+=1
                  except Exception as e:
                      failures.append((str(src),str(e)))
                      if temp and temp.exists(): temp.unlink()
          if failures:
              for f,e in failures: print(f+' -> '+e,file=sys.stderr)
              raise SystemExit(1)
          gfx=Path('fairy_player/gameasync/Graphics')
          for src in [p for p in gfx.rglob('*') if p.is_file() and p.suffix.lower() in {'.bmp','.gif','.webp','.tif','.tiff'}]:
              out=src.with_suffix('.png')
              subprocess.run(['convert',str(src)+'[0]',str(out)],check=True)
              if not out.exists() or out.stat().st_size==0: raise SystemExit('image conversion failed: '+str(src))
              src.unlink()
          print('FAIRY_AUDIO_CONVERTED='+str(converted))
          PY

