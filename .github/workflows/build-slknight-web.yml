# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R115
# BASE: deployed R111, run 40523152040. R112 was invalid.
# FIX: download the current map's native terrain BEFORE its map data is passed
#      to the engine. Stage all shared action/character/UI graphics once.
# INVENTORY: stage all 395 icons before the engine starts.
# SAFETY: no fabricated passable tiles, no changed maps, doors, monster spawns,
#         screen projection, native movement, monster collision, or sprite art.
# DECODE: use the original FS.createPreloadedFile as needed; special C/W floor
#         textures are downloaded first but decoded only when actually visible.
# FAILURE: a visible retry control, never silently enter with missing assets.
name: build-slknight-web.yml | V229R115 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R115 Restore deployed R111
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40523152040
          name: github-pages
          github-token: ${{ github.token }}
          path: r111
      - name: V229R115 Verify original engine and map data
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site build
          test -s r111/artifact.tar
          tar -xf r111/artifact.tar -C site
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert len(files)==5517,('Wrong R111 baseline',len(files))
          expected={
           'knight/js/drive.js':'833a13026929d62d24a5ad645a8af764511fe40584ebefcf5d1b3251d9a35573',
           'knight/js/dpad.js':'2bd401adf130339d154ce6a8efd0127cefd9b1bc58bc60d1de68e8b6d8b7a791',
           'knight/gameasync/Data/Scripts.rxdata':'e7cc01b36ad7edc18d8026854f4ae37932ebadb74e54d2b43ab47cc6ae112aee',
           'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap045.rxdata':'f47de87af6b4e607bf632818a711619dc8ca4e747196a123a76ac7db8ffc3ba6',
           'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap046.rxdata':'dc89d908f5247442e08dddc11f5bcf6505a77890bd82ab59b790e00e3e5f024c'}
          for path,sha in expected.items():assert files[path]==sha,('Baseline mismatch',path)
          for path in ('index.html','knight/index.html'):
           assert 'V229R111' in (root/path).read_text('utf8')
          Path('build/before.json').write_text(json.dumps(files,sort_keys=True))
          print('PASS R111 baseline, original engine and maps unchanged')
          PY_BASE
      - name: V229R115 Package mapped actions and block entry until downloaded
        shell: bash
        run: |
          set -euo pipefail
          cat > build/export_maps.rb <<'R115_EXPORT'
          require 'json'
          module RPG
            class Map;end; class MapInfo;end; class AudioFile;end; class Tileset;end
            class Event
              class Page
                class Condition;end;class Graphic;end
              end
            end
            class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          class Tone;def self._load(x);nil;end;end
          class Color;def self._load(x);nil;end;end
          class Table;def self._load(x);nil;end;end
          root=ARGV.fetch(0)
          base='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          info=Marshal.load(File.binread("#{root}/#{base}MapInfos.rxdata"))
          tilesets=Marshal.load(File.binread("#{root}/#{base}Tilesets.rxdata"))
          result={}
          def text(x)
           x.is_a?(String) ? x.dup.force_encoding('UTF-8').scrub : nil
          end
          def strings(obj,out)
           case obj
           when String
            out << text(obj)
           when Array
            obj.each{|x|strings(x,out)}
           end
          end
          info.keys.sort.each do |mid|
           file=sprintf('%s/%sMap%03d.rxdata',root,base,mid)
           next unless File.file?(file)
           map=Marshal.load(File.binread(file))
           graphics=[];events=[];scripts=[]
           (map.instance_variable_get(:@events)||{}).each_value do |ev|
            name=text(ev.instance_variable_get(:@name))
            events<<name if name && !name.empty?
            (ev.instance_variable_get(:@pages)||[]).each do |page|
             graphic=page.instance_variable_get(:@graphic)
             if graphic
              cn=text(graphic.instance_variable_get(:@character_name))
              graphics<<cn if cn && !cn.empty?
             end
             (page.instance_variable_get(:@list)||[]).each do |cmd|
              code=cmd.instance_variable_get(:@code)
              params=cmd.instance_variable_get(:@parameters)
              if [41,231,232,207,355,655].include?(code)
                strings(params,scripts)
              end
             end
             route=page.instance_variable_get(:@move_route)
             if route
               (route.instance_variable_get(:@list)||[]).each do |mv|
                 if mv.instance_variable_get(:@code)==41
                   strings(mv.instance_variable_get(:@parameters),graphics)
                 end
               end
             end
            end
           end
           tileset=tilesets[map.instance_variable_get(:@tileset_id)]
           tileset_files=[]
           if tileset
            tileset_files += [text(tileset.instance_variable_get(:@tileset_name)),text(tileset.instance_variable_get(:@fog_name)),text(tileset.instance_variable_get(:@panorama_name))]
            tileset_files += (tileset.instance_variable_get(:@autotile_names)||[]).map{|v|text(v)}
           end
           result[mid]={name:text(info[mid].instance_variable_get(:@name)),graphics:graphics.uniq.sort,events:events.uniq.sort,scripts:scripts.uniq.sort,terrain:tileset_files.compact.reject(&:empty?).uniq}
          end
          STDOUT.write(JSON.generate(result))
          R115_EXPORT
          cat > build/build_packs.py <<'R115_PACKER'
          from pathlib import Path
          import collections, hashlib, json, re, struct, sys

          root=Path(sys.argv[1]); output=Path(sys.argv[2]); output.mkdir(exist_ok=True,parents=True)
          base=root/'knight/gameasync'
          source={}
          for ln in (base/'mapping.js').read_text(encoding='utf8').splitlines():
              if not ln.startswith('["'):continue
              try: key,mapped=json.loads(ln.rstrip(','))
              except ValueError:continue
              if '?' in mapped and not mapped.endswith('h='):
                  source[key]=mapped.split('?',1)[0]

          def pack(filename,kind,mid,keys):
              keys=sorted(set(keys)); parts=[];index=[];offset=0
              for key in keys:
                  if key not in source:raise ValueError(('Missing mapping',key))
                  file=base/source[key]
                  if not file.is_file():raise ValueError(('Missing file',key,file))
                  data=file.read_bytes()
                  if source[key].lower().endswith('.png') and not data.startswith(b'\x89PNG\r\n\x1a\n'):
                      raise ValueError(('Invalid PNG',key))
                  index.append([key,offset,len(data)])
                  parts.append(data);offset+=len(data)
              if not keys:raise ValueError(('Empty pack',filename))
              header=json.dumps({'kind':kind,'map_id':mid,'files':index},separators=(',',':'),ensure_ascii=False).encode()
              (output/filename).write_bytes(struct.pack('<I',len(header))+header+b''.join(parts))
              return len(keys),sum(map(len,parts))

          icons=[k for k in source if k.startswith('graphics/icons/')]
          assert len(icons)==395,('Wrong icon count',len(icons))
          shared=[k for k in source if (k.startswith('graphics/') and not k.startswith(('graphics/icons/','graphics/tilesets/','graphics/panoramas/'))) or k.startswith('audio/se/')]
          i=pack('icons-v229r115.pack','icons',None,icons)
          s=pack('shared-v229r115.pack','shared',None,shared)
          meta=json.loads(Path(sys.argv[3]).read_text(encoding='utf8'))
          summary={}
          for sid,info in meta.items():
              mid=int(sid)
              keys=set()
              for name in info['terrain']:
                  for cat in ('graphics/tilesets/','graphics/panoramas/'):
                      k=cat+name.lower()
                      if k in source:keys.add(k)
              if mid in (45,46):
                  keys.update(k for k in source if re.fullmatch('graphics/panoramas/slti_'+str(mid)+r'_(?:c\d+_\d+|w_c\d+_\d+)',k))
              # Preserve the map's own assets but never download graphics from other maps.
              n,size=pack(f'map-{mid:03d}-v229r115.pack','map',mid,keys)
              summary[mid]={'files':n,'bytes':size}
          assert len(summary)==46,(len(summary),list(summary))
          assert sum(k.startswith('graphics/panoramas/slti_45_') for k in source)==62
          assert sum(k.startswith('graphics/panoramas/slti_46_') for k in source)==94
          Path(sys.argv[4]).write_text(json.dumps({'icons':i,'shared':s,'maps':summary},ensure_ascii=False,indent=2))
          print('PASS packs: icons',i,'shared',s,'maps',len(summary), '29',summary[29], '45',summary[45], '46',summary[46])
          R115_PACKER
          cat > build/sl-assets-v229r115.js <<'R115_BROWSER'
          // V229R115: download every mapped action and current-map terrain BEFORE MapXXX.rxdata
          // is passed to the game engine. The original drive.js remains the PNG decoder.
          (function(){
            'use strict';
            var nativeMapLoad=window.loadFileAsync;
            var nativeAssetGet=window.getLazyAsset;
            if(typeof nativeMapLoad!=='function'||typeof nativeAssetGet!=='function')
              throw new Error('R115 requires existing drive.js functions');
            var staged=Object.create(null), jobs=Object.create(null);
            var ready=Object.create(null), currentMap=null, overlay=null;
            var version='V229R115';
            function label(message){
              var el=document.getElementById('sl-build-version');
              if(el)el.textContent=version+(message?' | '+message:'');
            }
            function display(message,action){
              if(!document.body)return;
              if(!overlay){
                overlay=document.createElement('div');overlay.id='sl-r115-download';
                overlay.style.cssText='position:fixed;inset:0;z-index:9000000;background:rgba(0,0,0,.90);color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;text-align:center;font:16px/1.5 sans-serif;padding:20px;box-sizing:border-box';
                document.body.appendChild(overlay);
              }
              overlay.textContent=message;
              if(action){
                var button=document.createElement('button');button.textContent='Retry download';
                button.style.cssText='background:white;color:black;font:16px sans-serif;padding:12px 20px;border-radius:8px;border:0';
                button.onclick=action;overlay.appendChild(button);
              }
            }
            function hide(){if(overlay){overlay.remove();overlay=null;}}
            function fetchPack(filename,report){
              var controller=new AbortController();
              var timeout=setTimeout(function(){controller.abort();},90000);
              return fetch('assets/'+filename,{cache:'force-cache',signal:controller.signal}).then(function(response){
                if(!response.ok)throw new Error('HTTP '+response.status+': '+filename);
                if(!response.body||typeof response.body.getReader!=='function')return response.arrayBuffer();
                var reader=response.body.getReader(),chunks=[],size=0;
                var total=Number(response.headers.get('content-length'))||0;
                function read(){
                  return reader.read().then(function(part){
                    if(part.done){
                      var data=new Uint8Array(size),pos=0;
                      chunks.forEach(function(a){data.set(a,pos);pos+=a.length;});
                      return data.buffer;
                    }
                    chunks.push(part.value);size+=part.value.length;
                    if(report)report(size,total);
                    return read();
                  });
                }
                return read();
              }).finally(function(){clearTimeout(timeout);});
            }
            function stage(buffer,kind,mid){
              var data=new Uint8Array(buffer);
              if(data.length<16)throw new Error('Invalid '+kind+' asset pack');
              var headLength=new DataView(data.buffer,data.byteOffset,4).getUint32(0,true);
              if(headLength<10||headLength>data.length-4)throw new Error('Invalid asset index');
              var head=JSON.parse(new TextDecoder('utf-8').decode(data.subarray(4,4+headLength)));
              if(head.kind!==kind||(kind==='map'&&head.map_id!==mid)||!Array.isArray(head.files))
                throw new Error('Incorrect '+kind+' manifest');
              var start=4+headLength,items=Object.create(null);
              for(var i=0;i<head.files.length;i++){
                var row=head.files[i],key=row[0],offset=row[1],length=row[2];
                var mapped=mapping[key];
                if(!mapped||!Number.isInteger(offset)||!Number.isInteger(length)||offset<0||length<8||
                   start+offset+length>data.length)throw new Error('Bad manifest file '+key);
                var file=mapped.split('?')[0].toLowerCase(),bytes=data.subarray(start+offset,start+offset+length);
                if(/\.png$/i.test(file)&&!(bytes[0]===137&&bytes[1]===80&&bytes[2]===78&&bytes[3]===71))
                  throw new Error('Invalid PNG '+file);
                items[file]=bytes;
              }
              // Commit only after every file has passed bounds and signature checks.
              Object.keys(items).forEach(function(k){staged[k]=items[k];});
              return head.files.length;
            }
            function prepare(id,kind,mid,filename,report){
              if(ready[id])return Promise.resolve(ready[id]);
              if(jobs[id])return jobs[id];
              jobs[id]=fetchPack(filename,report).then(function(bytes){
                var count=stage(bytes,kind,mid);ready[id]=count;return count;
              }).catch(function(err){delete jobs[id];throw err;});
              return jobs[id];
            }
            function progress(name,done,total){
              var s=total?((done/total)*100).toFixed(0)+'%':(done/1048576).toFixed(1)+' MB';
              label(name+' '+s);display('Preparing '+name+' before entering the map\n'+s);
            }
            function prepareMap(mid){
              return Promise.all([
                prepare('shared','shared',null,'shared-v229r115.pack',function(a,b){progress('Action assets',a,b);}),
                prepare('map'+mid,'map',mid,'map-'+String(mid).padStart(3,'0')+'-v229r115.pack',function(a,b){progress('Map '+mid+' terrain',a,b);})
              ]);
            }
            window.getLazyAsset=function(url,filename,callback,noretry){
              var key=String(url).replace(/^gameasync\//i,'').split('?')[0].toLowerCase();
              var bytes=staged[key];
              if(bytes){setTimeout(function(){callback(bytes);},0);return;}
              if(currentMap!==null&&/^graphics\//i.test(key)){
                console.error('SLRUNTIMEERR|R115_UNSTAGED_GRAPHIC Map'+currentMap+' '+key);
              }
              return nativeAssetGet.apply(this,arguments);
            };
            window.loadFileAsync=function(fullPath,bitmap,callback){
              var found=!bitmap&&/Map(\d{3})\.rxdata$/i.exec(String(fullPath||''));
              if(!found)return nativeMapLoad.apply(this,arguments);
              var mid=Number(found[1]),args=arguments,self=this;
              if(mid<1||mid>46)return nativeMapLoad.apply(self,args);
              function begin(){
                label('Map '+mid+' assets downloading');
                display('Preparing all Map '+mid+' resources before entering');
                prepareMap(mid).then(function(){
                  currentMap=mid;
                  label('Map '+mid+' files ready; opening');
                  display('Map '+mid+' downloads complete\nOpening map...');
                  var finished=false;
                  var guard=setTimeout(function(){
                    if(!finished)display('Map '+mid+' engine loading exceeded 35 seconds',function(){location.reload();});
                  },35000);
                  var originalCallback=callback;
                  var nativeArgs=[fullPath,bitmap,function(){
                    if(finished)return;
                    finished=true;clearTimeout(guard);hide();
                    if(typeof originalCallback==='function')originalCallback();
                  }];
                  try{nativeMapLoad.apply(self,nativeArgs);}catch(err){
                    clearTimeout(guard);console.error('SLRUNTIMEERR|R115_MAP_NATIVE '+err);
                    display('Map '+mid+' engine error: '+String(err),function(){location.reload();});
                  }
                }).catch(function(err){
                  console.error('SLRUNTIMEERR|R115_MAP_PREPARE '+mid+' '+String(err));
                  label('Map '+mid+' download failed');
                  display('Map '+mid+' download failed: '+String(err),begin);
                });
              }
              begin();
            };
            window.slR115BootIcons=function(){
              var dep='sl-r115-icons',released=false;
              addRunDependency(dep);
              function finish(){if(!released){released=true;removeRunDependency(dep);}}
              function retry(){
                label('Inventory icons downloading');
                prepare('icons','icons',null,'icons-v229r115.pack',function(a,b){progress('Inventory icons',a,b);})
                  .then(function(n){if(n!==395)throw new Error('Expected 395 icons, received '+n);hide();finish();})
                  .catch(function(err){
                    console.error('SLRUNTIMEERR|R115_ICONS '+String(err));
                    display('Inventory icon download failed: '+String(err),retry);
                  });
              }
              retry();
            };
            window.slR115Status=function(){return {map:currentMap,staged:Object.keys(staged).length,ready:Object.keys(ready)};};
          })();
          R115_BROWSER
          cat > build/patch_browser.py <<'R115_PATCH'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1]); runtime=Path(sys.argv[2])
          drive=root/'knight/js/drive.js'
          src=drive.read_text(encoding='utf8')
          assert src.count('R111_SANCTUARY_QUEUE')==1
          start=src.index('function preloadList(jsonArray) {')
          end=src.index('\nwindow.fileLoadedAsync = function(file)',start)
          # The preloaded bytes are staged by R115 BEFORE entering the map.
          # Decoding 45/66 giant floor PNGs together caused frame stalls; native renderer
          # should decode only the floor chunks that are actually on the screen.
          replacement='''function preloadList(jsonArray) {
              jsonArray.forEach((file) => {
                  if (/^Graphics\\/Panoramas\\/SLTI_(45|46)_(?:C|W_C)/i.test(file)) return;
                  const key=getMappingKey(file);
                  const mapped=mapping[key];
                  if(!mapped || window.fileAsyncCache[key]) return;
                  const dir='/game/'+mapped.substring(0,mapped.lastIndexOf('/'));
                  const name=mapped.substring(mapped.lastIndexOf('/')+1).split('?')[0];
                  getLazyAsset('gameasync/'+mapped,name,function(bytes){
                      if(!bytes)return;
                      FS.createPreloadedFile(dir,name,new Uint8Array(bytes),true,true,
                          function(){window.fileAsyncCache[key]=1;},console.error,false,false,
                          function(){try{FS.unlink(dir+'/'+name);}catch(err){} });
                  },true);
              });
          }
          '''
          src=src[:start]+replacement+src[end:]
          src=src.replace('// R111_SANCTUARY_QUEUE: limit only the special 2x panoramas.\n','')
          assert src.count('window.loadFileAsync = function(fullPath, bitmap, callback)')==1
          assert src.count('window.fileLoadedAsync = function(file)')==1
          # This handler is NOT modified: native loading and game events keep R111 order.
          assert 'if (!(/.*Map.*rxdata/i.test(file))) return;' in src
          assert 'R111_SANCTUARY_QUEUE' not in src
          drive.write_text(src,encoding='utf8')
          (root/'knight/js/sl-assets-v229r115.js').write_bytes(runtime.read_bytes())
          for name in ('index.html','knight/index.html'):
              file=root/name
              html=file.read_text(encoding='utf8')
              assert 'V229R111' in html and 'V229R115' not in html
              if name=='knight/index.html':
                  anchor='createDummies();window.restoreLocalFilesBeforeRun();'
                  assert html.count(anchor)==1
                  html=html.replace(anchor,'createDummies();window.slR115BootIcons();window.restoreLocalFilesBeforeRun();')
                  tag='<script src="gameasync/mapping.js?v=v229r111"></script>'
                  assert html.count(tag)==1
                  html=html.replace(tag,tag+'\n    <script src="js/sl-assets-v229r115.js?v=v229r115"></script>')
              file.write_text(html.replace('V229R111','V229R115').replace('v229r111','v229r115'),encoding='utf8')
          print('PASS R115 native loading gated before entry, original decoder and existing map events preserved')
          R115_PATCH
          ruby -c build/export_maps.rb
          ruby build/export_maps.rb site/knight/gameasync/Data > build/maps.json
          python3 build/build_packs.py site site/knight/assets build/maps.json build/report.json
          python3 build/patch_browser.py site build/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/dpad.js
          node --check site/knight/gameasync/mapping.js
      - name: V229R115 Smoke-test preload order and immutable game data
        shell: bash
        run: |
          set -euo pipefail
          cat > build/test_r115.js <<'R115_SMOKE'
          const fs=require('fs'),vm=require('vm'),path=require('path'),assert=require('assert');
          const root=process.argv[2];
          const base=path.join(root,'knight');
          const src=fs.readFileSync(path.join(base,'js/sl-assets-v229r115.js'),'utf8');
          const mappingSrc=fs.readFileSync(path.join(base,'gameasync/mapping.js'),'utf8');
          let nativeCalls=[],http=[],fallback=0,dependencies=0;
          const children=[];
          function domNode(){return {style:{},children:[],textContent:'',onclick:null,
            appendChild(x){this.children.push(x);children.push(x);},remove(){}};}
          const document={body:domNode(),getElementById:()=>null,createElement:()=>domNode()};
          const sandbox={window:{loadFileAsync:(name,bitmap,cb)=>{nativeCalls.push(name);if(cb)cb();},
          getLazyAsset:(url,filename,cb)=>{fallback++;cb(Buffer.from('NETWORK'));}},
           document,console,TextDecoder,Uint8Array,DataView,AbortController,setTimeout,clearTimeout,
           Number,String,Array,Object,location:{reload(){throw Error('unexpected reload');}},
           addRunDependency(){dependencies++;},removeRunDependency(){dependencies--;},
           fetch(url){
            http.push(url);
            const f=path.join(base,url);
            return new Promise((resolve,reject)=>setTimeout(()=>{
              if(!fs.existsSync(f)){reject(new Error('File not found '+f));return;}
              const b=fs.readFileSync(f);
              resolve({ok:true,body:null,arrayBuffer:async()=>b.buffer.slice(b.byteOffset,b.byteOffset+b.byteLength)});
            },20));
           }};
          vm.createContext(sandbox);vm.runInContext(mappingSrc,sandbox);vm.runInContext(src,sandbox);
          const mapping=sandbox.mapping;
          function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms));}
          async function until(fn,limit=30000){let start=Date.now();while(!fn()){await sleep(10);if(Date.now()-start>limit)throw Error('wait timeout');}}
          async function test(){
           sandbox.window.slR115BootIcons();
           assert.equal(dependencies,1,'Boot must wait for icons');
           await until(()=>dependencies===0);
           assert.equal(http.length,1,'Icons should be downloaded once');
           let stat=sandbox.window.slR115Status();assert.equal(stat.staged,395);
           for(const map of [29,45,46]){
             const before=nativeCalls.length;
             let count=0;
             sandbox.window.loadFileAsync('Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap'+String(map).padStart(3,'0')+'.rxdata',false,()=>{count++;});
             assert.equal(nativeCalls.length,before,'Native map should NOT load before resource packs');
             await until(()=>count===1);
             assert.equal(nativeCalls.length,before+1);
             assert.equal(sandbox.window.slR115Status().map,map);
             assert.equal(fallback,0,'No network fallback for mapped files');
             const packs=['shared-v229r115.pack','map-'+String(map).padStart(3,'0')+'-v229r115.pack'];
             for(const f of packs){
               let b=fs.readFileSync(path.join(base,'assets',f));
               let n=b.readUInt32LE(0),entries=JSON.parse(b.subarray(4,4+n).toString('utf8')).files;
               for(const [key] of entries.slice(0,Math.min(50,entries.length))){
                 const name=mapping[key];let got=null;
                 sandbox.window.getLazyAsset('gameasync/'+name,'test',x=>{got=Buffer.from(x);});
