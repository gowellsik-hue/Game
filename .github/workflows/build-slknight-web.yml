
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V249
# BASE: V247 successful run 41382471524
# FIX: V248 rejected the legitimate Game_Event alias.
# FIX: Safe Zenith preload and sprite access on Map025.
# KEEP: V247 native combat, rewards, maps, NPCs and graphics.
# STATUS: GitHub Actions execution not yet verified.

name: build-slknight-web.yml | V249 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: V249 Restore successful V247 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41382471524
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V249 Verify original inventory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p site build
          test -s baseline/artifact.tar
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json

          root=Path("site")
          before={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob("*")
              if p.is_file()
          }

          assert len(before)==5610, (
              "Wrong V247 inventory",len(before)
          )

          pre=(
              "knight/gameasync/Data/"
              "MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"
          )

          for mid in (16,25,47):
              assert pre+f"Map{mid:03d}.rxdata" in before

          for mid in (45,46):
              assert pre+f"Map{mid:03d}.rxdata" not in before

          assert "knight/assets/map-047-v241.pack" in before

          for action in (
              "Walk","Idle","Attack","AltAttack",
              "Spell","Hit","Death"
          ):
              name=(
                  "knight/gameasync/Graphics/"
                  "Characters/SLZenith"+action+".png"
              )
              assert name in before

          Path("build/before.json").write_text(
              json.dumps(before,sort_keys=True)
          )

          print("PASS verified V247 source")
          PY

      - name: V249 Repair native Zenith runtime
        shell: bash
        run: |
          set -euo pipefail

          cat > build/repair.rb <<'RUBY'
          require 'zlib'

          path='site/knight/gameasync/Data/Scripts.rxdata'
          scripts=Marshal.load(File.binread(path))

          raise 'Invalid RGSS script table' unless
            scripts.is_a?(Array)

          matches=scripts.each_index.select do |i|
            scripts[i].is_a?(Array) &&
              scripts[i][1]=='SLZenithV247'
          end

          raise 'V247 runtime not unique' unless
            matches.length==1

          index=matches.first
          entry=scripts[index]

          source=Zlib::Inflate.inflate(entry[2])
          original=source.dup

          required=[
            'MAX_HP=5200',
            'PHYSICAL=[50,100]',
            'MAGIC=[150,300]',
            'ACCURACY=9999',
            'ATTACK_WAIT=20',
            'EXP=43212',
            'ADENA=[64800,151200]',
            'MAGIC_FX_IDS=[25,14,15,16]'
          ]

          required.each do |item|
            raise "Wrong source #{item}" unless
              source.include?(item)
          end

          def replace_once!(source,pattern,new_code,label)
            count=source.scan(pattern).length

            raise(
              "Wrong replacement anchor #{label}: #{count}"
            ) unless count==1

            source.sub!(pattern){new_code.rstrip}
          end

          # Prevent unsupported optional cache calls
          # from terminating Map025 initialization.
          preload=<<'PRELOAD'
  def self.preload
    return true unless defined?(RPG::Cache)

    cache=RPG::Cache
    resources=[]

    FRAMES.keys.each do |action|
      resources << [:character,'SLZenith'+action]
    end

    MAGIC_FX_GRAPHICS.each do |name|
      resources << [:animation,name]
    end

    resources.each do |method,name|
      next unless cache.respond_to?(method)

      begin
        cache.__send__(method,name,0)
      rescue StandardError => e
        @last_preload_error=(
          e.class.to_s+': '+e.message.to_s
        )
      end
    end

    true
  end
          PRELOAD

          replace_once!(
            source,
            /^  def self\.preload\n.*?^  end(?=\n\n  def self\.show_hp)/m,
            preload,
            'Zenith preload'
          )

          # Keep the native Game_Event implementation.
          # Only guard the optional moving? method.
          replace_once!(
            source,
            "name=moving? ? 'SLZenithWalk' : 'SLZenithIdle'",
            "name=(respond_to?(:moving?) && moving?) ? 'SLZenithWalk' : 'SLZenithIdle'",
            'movement state'
          )

          # The native renderer must run first.
          # Only Zenith-specific sprite adjustments
          # are protected from missing runtime methods.
          sprite=<<'SPRITE'
class Sprite_Character
  alias slz_v249_native_update update

  def update
    slz_v249_native_update

    return unless $game_map &&
      $game_map.map_id==SLZenith::MAP_ID

    return unless @character &&
      @character.is_a?(Game_Event)

    return unless
      @character.instance_variable_get(:@id)==
      SLZenith::EVENT_ID

    begin
      return unless @tile_id.to_i==0
      return unless
        @character.respond_to?(:character_name)

      name=@character.character_name.to_s
      return unless name.start_with?('SLZenith')

      action=name.sub('SLZenith','')
      total=SLZenith::FRAMES[action]

      return unless total && total>0

      bmp=respond_to?(:bitmap) ?
        bitmap : @bitmap

      return unless bmp
      return unless
        bmp.respond_to?(:width) &&
        bmp.respond_to?(:height)

      return unless
        bmp.width.to_i>0 &&
        bmp.height.to_i>0

      return unless
        bmp.width%total==0 &&
        bmp.height%4==0

      return unless
        @character.respond_to?(:direction) &&
        @character.respond_to?(:slz_frame)

      direction=@character.direction.to_i
      return unless [2,4,6,8].include?(direction)

      rect=respond_to?(:src_rect) ?
        src_rect : @src_rect

      return unless rect && rect.respond_to?(:set)

      cw=bmp.width/total
      ch=bmp.height/4

      row=(direction-2)/2
      frame=@character.slz_frame(total)

      return unless frame.is_a?(Integer)
      return unless frame.between?(0,total-1)

      @cw=cw
      @ch=ch

      rect.set(
        frame*cw,row*ch,cw,ch
      )

      if respond_to?(:ox=)
        self.ox=cw/2
      else
        @ox=cw/2
      end

      if respond_to?(:oy=)
        self.oy=ch
      else
        @oy=ch
      end

      if respond_to?(:z=) &&
         @character.respond_to?(:screen_z)
        self.z=@character.screen_z(ch)
      end

    rescue StandardError => e
      SLZenith.instance_variable_set(
        :@last_sprite_error,
        e.class.to_s+': '+e.message.to_s
      )
    end
  end
end
          SPRITE

          replace_once!(
            source,
            /^class Sprite_Character\n.*?^end(?=\n\nclass Game_Map)/m,
            sprite,
            'Zenith sprite renderer'
          )

          # Retain the native map setup result.
          # Loading Zenith graphics is optional.
          setup=<<'SETUP'
class Game_Map
  alias slz_v249_native_setup setup

  def setup(map_id)
    SLZenith.reset(map_id)

    result=slz_v249_native_setup(map_id)

    if map_id==SLZenith::MAP_ID
      SLZenith.preload
    end

    result
  end
end
          SETUP

          replace_once!(
            source,
            /^class Game_Map\n.*?^end\s*\z/m,
            setup+"\n",
            'Map025 setup'
          )

          source.sub!(
            'SLZenith V247:',
            'SLZenith V249:'
          )

          # V248 failed because it searched for this
          # alias globally. Game_Event legitimately
          # retains the original alias.
          raise 'Original Game_Event alias lost' unless
            source.include?(
              'alias slz_v247_native_update update'
            )

          new_sprite=source[
            /^class Sprite_Character\n.*?^end(?=\n\nclass Game_Map)/m
          ]

          raise 'New sprite renderer missing' unless
            new_sprite &&
            new_sprite.include?(
              'alias slz_v249_native_update update'
            )

          raise 'Old sprite wrapper survived' if
            new_sprite.include?(
              'alias slz_v247_native_update update'
            )

          raise 'Old map wrapper survived' if
            source.include?(
              'alias slz_v247_native_setup setup'
            )

          required.each do |item|
            raise "Combat value changed #{item}" unless
              source.include?(item)
          end

          drop_pattern=/DROPS=\[\n.*?\n  \]/m

          raise 'Original drops changed' unless
            source[drop_pattern] &&
            source[drop_pattern]==original[drop_pattern]

          raise 'Original motion table changed' unless
            source[
              /FRAMES=\{.*?\}/m
            ]==original[
              /FRAMES=\{.*?\}/m
            ]

          File.write(
            'build/zenith-runtime.rb',source
          )

          entry[0]=99824901
          entry[1]='SLZenithV249'
          entry[2]=Zlib::Deflate.deflate(source,9)

          File.binwrite(path,Marshal.dump(scripts))

          check=Marshal.load(File.binread(path))

          raise 'Serialized runtime mismatch' unless
            check[index][1]=='SLZenithV249' &&
            Zlib::Inflate.inflate(check[index][2])==
            source

          puts 'PASS native Game_Event alias preserved'
          puts 'PASS isolated Sprite_Character replacement'
          puts 'PASS safe Map025 preload'
          puts 'PASS combat, animation and drop values unchanged'
          RUBY

          ruby -c build/repair.rb
          ruby build/repair.rb
          ruby -c build/zenith-runtime.rb

      - name: V249 Test unsupported cache and sprite APIs
        shell: bash
        run: |
          set -euo pipefail

          cat > build/test-runtime.rb <<'RUBY'
          class Game_Event
            attr_accessor :character_name,:direction
            def update;end
          end

          class Game_Map
            attr_accessor :map_id,:events
            def setup(id)
              @map_id=id
              :native_ok
            end
          end

          class Sprite_Character
            attr_accessor :src_rect,:ox,:oy,:z
            def update;end
          end

          $game_map=Game_Map.new
          $game_map.events={}
          $game_variables=Hash.new(0)
          $game_switches=Hash.new(false)
          $game_party=nil
          $m=nil

          load 'build/zenith-runtime.rb'

          raise 'Wrong event ID' unless
            SLZenith::EVENT_ID==29

          raise 'Wrong combat values' unless
            SLZenith::MAX_HP==5200 &&
            SLZenith::PHYSICAL==[50,100] &&
            SLZenith::MAGIC==[150,300]

          raise 'Original drops lost' unless
            SLZenith::DROPS.length==20 &&
            SLZenith::DROPS.include?(
              [:armor,492,3]
            )

          # Test without an available cache.
          result=$game_map.setup(25)

          raise 'Map025 setup failed' unless
            result==:native_ok &&
            $game_map.map_id==25

          # A cache entry point may exist but fail.
          module RPG
            module Cache
              def self.character(name,hue=0)
                raise NoMethodError,
                  'unsupported cache operation'
              end
            end
          end

          result=$game_map.setup(25)

          raise 'Cache exception escaped' unless
            result==:native_ok

          raise 'Cache error was not captured' unless
            SLZenith.instance_variable_get(
              :@last_preload_error
            )

          boss=Game_Event.new
          boss.instance_variable_set(:@map_id,25)
          boss.instance_variable_set(:@id,29)
          boss.character_name='SLZenithIdle'
          boss.direction=2

          $game_map.events[29]=boss

          # No moving? method exists in this mock.
          # The new Game_Event guard must handle it.
          boss.update

          # No bitmap and no source rectangle.
          sprite=Sprite_Character.new
          sprite.instance_variable_set(:@character,boss)
          sprite.instance_variable_set(:@tile_id,0)
          sprite.update

          # A valid native-sized 4-direction sheet.
          bitmap=Struct.new(
            :width,:height
          ).new(11*144,4*120)

          rect=Struct.new(
            :x,:y,:width,:height
          ) do
            def set(x,y,w,h)
              self.x=x
              self.y=y
              self.width=w
              self.height=h
            end
          end.new

          sprite.instance_variable_set(
            :@bitmap,bitmap
          )
          sprite.src_rect=rect

          [2,4,6,8].each do |direction|
            boss.direction=direction
            sprite.update

            expected=((direction-2)/2)*120

            raise 'Wrong native sprite row' unless
              rect.y==expected

            raise 'Wrong sprite size' unless
              rect.width==144 &&
              rect.height==120
          end

          raise 'Sprite exception captured' if
            SLZenith.instance_variable_get(
              :@last_sprite_error
            )

          # Unrelated maps still use native setup.
          result=$game_map.setup(47)
          raise 'Other map setup failed' unless
            result==:native_ok

          puts 'PASS no-cache Map025 initialization'
          puts 'PASS partial-cache failure handled'
          puts 'PASS movement method guard'
          puts 'PASS incomplete sprite state handled'
          puts 'PASS all four sprite directions'
          puts 'PASS Map047 native setup retained'
          RUBY

          ruby -c build/test-runtime.rb
          ruby build/test-runtime.rb

      - name: V249 Refresh script hash and version
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib,re
          from pathlib import Path

          root=Path("site")
          script=root/"knight/gameasync/Data/Scripts.rxdata"
          mapping=root/"knight/gameasync/mapping.js"

          content=mapping.read_text("utf-8")
          digest=hashlib.md5(
              script.read_bytes()
          ).hexdigest()

          pattern=(
              r"(Data/Scripts\.rxdata\?h=)"
              r"[0-9a-f]{32}"
          )

          content,count=re.subn(
              pattern,
              lambda m:m.group(1)+digest,
              content
          )

          assert count==1, (
              "Script mapping is not unique",count
          )

          mapping.write_text(content,"utf-8")

          loader=root/"knight/js/sl-assets-v229r115.js"
          text=loader.read_text("utf-8")

          old="var version='V247';"
          assert text.count(old)==1

          loader.write_text(
              text.replace(
                  old,"var version='V249';"
              ),
              "utf-8"
          )

          for relative in (
              "index.html","knight/index.html"
          ):
              path=root/relative
              html=path.read_text("utf-8")

              assert "V247" in html

              html=html.replace("V247","V249")
              html=html.replace(
                  "?v=v247","?v=v249"
              )

              path.write_text(html,"utf-8")

          print("PASS updated RXData hash")
          print("PASS V249 cache-busting labels")
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: V249 Verify original game resources preserved
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          root=Path("site")
          before=json.loads(
              Path("build/before.json").read_text()
          )

          after={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob("*")
              if p.is_file()
          }

          allowed={
              "knight/gameasync/Data/Scripts.rxdata",
              "knight/gameasync/mapping.js",
              "knight/js/sl-assets-v229r115.js",
              "index.html",
              "knight/index.html"
          }

          changed={
              name for name in before
              if before[name]!=after.get(name)
          }

          assert changed==allowed, (
              "Unexpected modified files",
              sorted(changed^allowed)
          )

          assert set(after)==set(before), (
              "Game inventory changed"
          )

          assert len(after)==5610

          pre=(
              "knight/gameasync/Data/"
              "MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"
          )

          protected=[
              pre+"Map016.rxdata",
              pre+"Map025.rxdata",
              pre+"Map047.rxdata",
              pre+"CommonEvents.rxdata",
              "knight/assets/map-047-v241.pack"
          ]

          for path in protected:
              assert after[path]==before[path],(
                  "Protected game data changed",path
              )

          for action in (
              "Walk","Idle","Attack","AltAttack",
              "Spell","Hit","Death"
          ):
              path=(
                  "knight/gameasync/Graphics/"
                  "Characters/SLZenith"+action+".png"
              )
              assert after[path]==before[path]

          for name in (
              "이펙트마법",
              "물의 대정령 마법",
              "불의 대정령 마법",
              "땅의 대정령 마법"
          ):
              path=(
                  "knight/gameasync/Graphics/"
                  "Animations/"+name+".png"
              )
              assert after[path]==before[path]

          print("PASS existing maps and NPCs unchanged")
          print("PASS CE179 and CE901 unchanged")
          print("PASS all seven motion sheets unchanged")
          print("PASS four original magic effects unchanged")
          print("PASS inventory 5610 unchanged")
          PY

      - name: V249 Publish game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
