          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          for html in (
              'player/index.html',
              'fairy_player/index.html'
          ):

              s=Path(
                  html
              ).read_text(
                  encoding='utf-8'
              )

              blocks=[]

              for m in re.finditer(
                  r'<script(?P<attrs>[^>]*)>(?P<body>.*?)</script>',
                  s,
                  re.S|re.I
              ):

                  if (
                      'src='
                      in
                      m.group(
                          'attrs'
                      ).lower()
                  ):
                      continue

                  body=m.group(
                      'body'
                  )

                  if body.strip():
                      blocks.append(
                          body
                      )

              if not blocks:
                  raise SystemExit(
                      'NO INLINE JS BLOCKS: '+
                      html
                  )

              for i,body in enumerate(
                  blocks
              ):

                  tmp=Path(
                      f'/tmp/'
                      f'{Path(html).parent.name}'
                      f'_inline_{i}.js'
                  )

                  tmp.write_text(
                      body,
                      encoding='utf-8'
                  )

                  subprocess.run(
                      [
                          'node',
                          '--check',
                          str(tmp)
                      ],
                      check=True
                  )

              print(
                  'INLINE_JS_OK',
                  html,
                  len(blocks)
              )
          PY

          test -x \
