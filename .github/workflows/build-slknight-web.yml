name: build-slknight-web.yml | V4.15 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Restore V4.15 integrated menu
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 46028200464
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify original game
        shell: bash
        run: |
          set -euo pipefail

          test -s baseline/artifact.tar

          mkdir -p site
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          import json

          root = Path('site')

          before = {
              p.relative_to(root).as_posix():
                  hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          assert len(before) == 6086

          assert before[
              'knight/gameasync/Data/Scripts.rxdata'
          ] == 'ab6069ec4444a74dff87c7505777ca7b58af4e7db79b0e48eaddf2a3b158f355'

          script = root/'knight/gameasync/Data/Scripts.rxdata'

          assert hashlib.md5(
              script.read_bytes()
          ).hexdigest() == '94702578bec2b99471ffab7f74037a17'

          Path('/tmp/sl415-before.json').write_text(
              json.dumps(before),
              'utf8'
          )

          print('PASS exact deployed V4.15 baseline')
          PYTHON

      - name: Refine integrated menu layout
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl415-compact.rb <<'RUBY'
          # encoding: UTF-8
          require 'zlib'
          require 'digest'

          path=ARGV.fetch(0)
          out=ARGV.fetch(1)
          raw=File.binread(path)

          raise 'Wrong deployed baseline' unless
            Digest::MD5.hexdigest(raw)=='94702578bec2b99471ffab7f74037a17'

          rows=Marshal.load(raw)

          raise 'Script count' unless rows.size==137

          before=rows.map{|r|Marshal.dump(r)}

          rep=->(s,a,b){
            raise "Anchor #{a.inspect[0,120]} #{s.scan(a).size}" unless
              s.scan(a).size==1
            s.sub(a){b}
          }

          edit=->(i,&blk){
            src=Zlib::Inflate.inflate(rows[i][2]).force_encoding('UTF-8')
            s=src.gsub("\r\n","\n")
            t=blk.call(s)
            raise "No change #{i}" if s==t
            RubyVM::InstructionSequence.compile(t)
            t=t.gsub("\n","\r\n") if src.include?("\r\n")
            rows[i][2]=Zlib::Deflate.deflate(t.b)
          }

          edit.call(79) do |s|

            s=rep.call(
              s,
              '    @command_window.index = @menu_index',
              "    @command_window.x = 12\n"+
              "    @command_window.y = 16\n"+
              "    @command_window.index = @menu_index"
            )

            s=rep.call(
              s,
              '    @gold_window.x = 0',
              '    @gold_window.x = @command_window.x'
            )

            s=rep.call(
              s,
              '    @gold_window.y = @command_window.height + 4',
              '    @gold_window.y = @command_window.y + @command_window.height + 8'
            )

            s=rep.call(
              s,
              '$아데나.x = 20',
              '$아데나.x = @gold_window.x + 20'
            )

            s=rep.call(
              s,
              "    @status_window.x = 160\n    @status_window.y = 0",
              "    @status_window.x = 176\n    @status_window.y = 16"
            )

            s=rep.call(
              s,
              "    @status_window.width = 640\n    @status_window.height = 600",
              "    @status_window.width = 456\n    @status_window.height = 448"
            )

            s=rep.call(
              s,
              '@status_window.contents = Bitmap.new(608, 568)',
              '@status_window.contents = Bitmap.new(424, 416)'
            )

            s=rep.call(
              s,
              '    @sl415_header.x = 160',
              <<'NEW'.chomp
              @sl415_header.x = @status_window.x
              @sl415_header.y = @status_window.y
              @sl415_header.width = @status_window.width
              @sl415_header.contents.dispose
              @sl415_header.contents = Bitmap.new(@sl415_header.width - 32, 32)
              @sl415_header.opacity = 0
              @sl415_header.z = @status_window.z + 1
          NEW
            )

            s=rep.call(
              s,
              '        @status_window.visible = false',
              '        @status_window.contents_opacity = 0'
            )

            s=rep.call(
              s,
              '        @status_window.visible = true',
              "        @status_window.visible = true\n"+
              "        @status_window.contents_opacity = 255"
            )

            a=s.index('  def update_status')
            b=s.index('  def sl415_open_page',a)

            raise 'Menu update bounds' unless a && b

            body=s[a...b]

            body=rep.call(
              body,
              "      target.x = 160\n      target.y = 68",
              "      target.x = @status_window.x\n"+
              "      target.y = @status_window.y + 32"
            )

            body=rep.call(
              body,
              /\n    end\n\n  end\n\n\z/,
              <<'NEW'
              elsif kind == 2
                right = p.instance_variable_get(:@right_window)
                right.visible = right.active
                p.instance_variable_get(:@item_windows).each do |w|
                  w.visible = w.active if w
                end
              end

            end

          NEW
            )

            s=s[0...a]+body+s[b..-1]

            start=s.index(
              '    windows = []',
              s.index('  def sl415_open_page')
            )

            finish=s.index(
              "    SLHotbar.mode(\n",
              start
            )

            raise 'Original layout' unless
              start && finish && finish>start

            layout=<<'NEW'
              windows = []
              px = @status_window.x
              py = @status_window.y
              pw = @status_window.width
              bottom = py + @status_window.height

              if kind == 0 || kind == 1 || kind == 2
                help = p.instance_variable_get(:@help_window)
                help.x = px
                help.y = py + 32
                help.width = pw
                help.contents.dispose
                help.contents = Bitmap.new(pw - 32, 32)
                help.instance_variable_set(:@text, nil)
                windows.push(help)
              end

              if kind == 0 || kind == 1
                target = p.instance_variable_get(:@target_window)
                target.x = px
                target.y = py + 32
                target.width = pw
                target.height = bottom - target.y
                target.contents.dispose
                target.contents = Bitmap.new(pw - 32, target.height - 32)
                target.refresh
                windows.push(target)

                if kind == 0
                  list = p.instance_variable_get(:@item_window)
                  list.y = py + 64
                else
                  status = p.instance_variable_get(:@status_window)
                  status.x = px
                  status.y = py + 64
                  status.width = pw
                  status.height = 96
                  status.contents.dispose
                  status.contents = Bitmap.new(pw - 32, 64)
                  status.refresh
                  windows.push(status)
                  list = p.instance_variable_get(:@skill_window)
                  list.y = py + 128
                end

                list.x = px
                list.width = pw
                list.height = bottom - list.y
                list.refresh
                list.index = list.index
                windows.push(list)

              elsif kind == 2
                left = p.instance_variable_get(:@left_window)
                right = p.instance_variable_get(:@right_window)

                left.x = px
                left.y = py + 64
                left.width = pw
                left.height = 128

                left.contents.dispose
                left.contents = Bitmap.new(pw - 32, left.height - 32)
                left.refresh

                right.x = px
                right.y = left.y + left.height - 32
                right.width = pw
                right.height = bottom - right.y

                h = right.contents.height
                right.contents.dispose
                right.contents = Bitmap.new(pw - 32, h)
                right.refresh
                right.index = right.index

                windows.push(left, right)

                p.instance_variable_get(:@item_windows).each do |w|
                  next unless w

                  w.x = px
                  w.y = right.y
                  w.width = pw
                  w.height = right.height

                  w.instance_variable_set(:@column_max, 1)

                  w.refresh
                  w.index = w.index
                  w.visible = w.active

                  windows.push(w)
                end

                right.visible = right.active

              else
                status = p.instance_variable_get(:@status_window)

                status.x = px
                status.y = py + 32
                status.width = pw
                status.height = bottom - status.y

                status.contents.dispose
                status.contents = Bitmap.new(pw - 32, status.height - 32)
                status.refresh

                windows.push(status)
              end

              windows.each do |w|
                w.windowskin = RPG::Cache.windowskin("SLInventory")
                w.opacity = 0
                w.back_opacity = 0
                w.z = @status_window.z + 1
              end

          NEW

            s[0...start]+layout+s[finish..-1]
          end

          edit.call(41) do |s|

            s=rep.call(
              s,
              '      x = 64',
              '      x = 4'
            )

            s=rep.call(
              s,
              '      y = i * 116',
              '      y = i * 100'
            )

            rep.call(
              s,
              '@index * 116, self.width - 32, 96',
              '@index * 100, self.width - 32, 96'
            )
          end

          edit.call(42) do |s|

            rep.call(
              s,
              'Bitmap.new(width - 33, row_max * 33)',
              'Bitmap.new(@column_max == 1 ? width - 32 : width - 33, row_max * 33)'
            )
          end

          edit.call(44) do |s|

            rep.call(
              s,
              'rect = Rect.new(x, y, self.width / @column_max - 32, 32)',
              'rect = Rect.new(x, y, @column_max == 1 ? self.contents.width - x : self.width / @column_max - 32, 32)'
            )
          end

          edit.call(45) do |s|

            s=rep.call(
              s,
              'draw_actor_hp(@actor, 284, 0)',
              'draw_actor_hp(@actor, self.width == 456 ? 4 : 284, self.width == 456 ? 32 : 0)'
            )

            rep.call(
              s,
              'draw_actor_sp(@actor, 460, 0)',
              'draw_actor_sp(@actor, self.width == 456 ? 208 : 460, self.width == 456 ? 32 : 0)'
            )
          end

          edit.call(46) do |s|

            s=rep.call(
              s,
              'y = i * 116',
              'y = i * (self.width == 456 ? 96 : 116)'
            )

            s=rep.call(
              s,
              '(@index + 10) * 116',
              '(@index + 10) * (self.width == 456 ? 96 : 116)'
            )

            s=rep.call(
              s,
              '@item_max * 116 - 20',
              'self.width == 456 ? @item_max * 96 : @item_max * 116 - 20'
            )

            rep.call(
              s,
              '@index * 116',
              '@index * (self.width == 456 ? 96 : 116)'
            )
          end

          edit.call(47) do |s|

            s=rep.call(
              s,
              'draw_actor_level(@actor, 4, 32)',
              'draw_actor_level(@actor, self.width == 456 ? 148 : 4, self.width == 456 ? 0 : 32)'
            )

            s=rep.call(
              s,
              'draw_actor_parameter(@actor, 4, 64, 1)',
              'draw_actor_parameter(@actor, 4, self.width == 456 ? 32 : 64, 1)'
            )

            s=rep.call(
              s,
              'draw_actor_parameter(@actor, 4, 96, 2)',
              'draw_actor_parameter(@actor, 4, self.width == 456 ? 64 : 96, 2)'
            )

            [160,200].each do |x|
              [64,96].each do |y|
                s=rep.call(
                  s,
                  "self.contents.draw_text(#{x}, #{y},",
                  "self.contents.draw_text(#{x}, self.width == 456 ? #{y-32} : #{y},"
                )
              end
            end

            s
          end

          edit.call(49) do |s|

            s=rep.call(
              s,
              'x = 4 + index % 2 * (288 + 32)',
              'x = 4 + index % @column_max * (288 + 32)'
            )

            s=rep.call(
              s,
              'y = index / 2 * 32',
              'y = index / @column_max * 32'
            )

            s=rep.call(
              s,
              'self.contents.draw_text(x + 28, y, 212, 32, item.name, 0)',
              'self.contents.draw_text(x + 28, y, @column_max == 1 ? self.contents.width - 108 : 212, 32, item.name, 0)'
            )

            s=rep.call(
              s,
              'self.contents.draw_text(x + 240, y, 16, 32, ":", 1)',
              'self.contents.draw_text(@column_max == 1 ? self.contents.width - 70 : x + 240, y, 16, 32, ":", 1)'
            )

            rep.call(
              s,
              'self.contents.draw_text(x + 256, y, 24, 32, number.to_s, 2)',
              'self.contents.draw_text(@column_max == 1 ? self.contents.width - 52 : x + 256, y, @column_max == 1 ? 48 : 24, 32, number.to_s, 2)'
            )
          end

          edit.call(115) do |s|

            a=s.index('class Window_Item < Window_Selectable')
            b=s.index('class Window_ShopNumber',a)

            raise 'Inventory drawing bounds' unless a && b

            t=s[a...b]

            t=rep.call(
              t,
              'rect = Rect.new(x, y, self.width / @column_max - 32, 32)',
              'rect = Rect.new(x, y, @column_max == 1 ? self.contents.width - x : self.width / @column_max - 32, 32)'
            )

            t=rep.call(
              t,
              '@column_max == 1 ? self.contents.width - 100 : 212',
              '@column_max == 1 ? self.contents.width - 108 : 212'
            )

            t=rep.call(
              t,
              'x_i = (@column_max == 1 ? self.contents.width - 264 : x + 24) - width',
              'x_i = (@column_max == 1 ? self.contents.width - 260 : x + 24) - width'
            )

            t=rep.call(
              t,
              'self.contents.draw_text(x_i + 245, y, 16, 32, ":", 1)',
              'self.contents.draw_text(x_i + (@column_max == 1 ? 238 : 245), y, 16, 32, ":", 1)'
            )

            s[0...a]+t+s[b..-1]
          end

          edit.call(118) do |s|

            a=s.index('if G7_MS_MOD::STATUS_WINDOW_ARRANGE')

            raise 'Status override' unless a

            t=s[a..-1]

            [
              [
                'draw_actor_graphic(@actor, 40, 112)',
                'draw_actor_graphic(@actor, 40, self.width == 456 ? 96 : 112)'
              ],
              [
                'draw_actor_class(@actor, 4 + 144, 0)',
                'draw_actor_class(@actor, self.width == 456 ? 4 : 4 + 144, self.width == 456 ? 24 : 0)'
              ],
              [
                'draw_actor_level(@actor, 96, 32)',
                'draw_actor_level(@actor, self.width == 456 ? 136 : 96, self.width == 456 ? 0 : 32)'
              ],
              [
                'draw_actor_state(@actor, 96, 64)',
                'draw_actor_state(@actor, 96, self.width == 456 ? 48 : 64)'
              ],
              [
                'draw_actor_hp(@actor, 96, 112, 172)',
                'draw_actor_hp(@actor, self.width == 456 ? 4 : 96, self.width == 456 ? 96 : 112, 172)'
              ],
              [
                'draw_actor_sp(@actor, 96, 144, 172)',
                'draw_actor_sp(@actor, self.width == 456 ? 4 : 96, self.width == 456 ? 120 : 144, 172)'
              ]
            ].each do |old,new|
              t=rep.call(t,old,new)
            end

            [
              192,224,256,304,
              336,368,400,432
            ].each_with_index do |y,i|

              t=rep.call(
                t,
                "draw_actor_parameter(@actor, 96, #{y}, #{i})",
                "draw_actor_parameter(@actor, self.width == 456 ? 4 : 96, self.width == 456 ? #{152+i*22} : #{y}, #{i})"
              )

            end

            [
              [
                "self.contents.draw_text(320, 16, 80, 32, 'EXP')",
                "self.contents.draw_text(self.width == 456 ? 4 : 320, self.width == 456 ? 328 : 16, 80, 32, 'EXP')"
              ],
              [
                "self.contents.draw_text(320, 48, 80, 32, 'NEXT')",
                "self.contents.draw_text(self.width == 456 ? 4 : 320, self.width == 456 ? 352 : 48, 80, 32, 'NEXT')"
              ],
              [
                'self.contents.draw_text(320 + 80, 16, 84, 32, @actor.exp_s, 2)',
                'self.contents.draw_text(self.width == 456 ? 84 : 320 + 80, self.width == 456 ? 328 : 16, 84, 32, @actor.exp_s, 2)'
              ],
              [
                'self.contents.draw_text(320 + 80, 48, 84, 32, @actor.next_rest_exp_s, 2)',
                'self.contents.draw_text(self.width == 456 ? 84 : 320 + 80, self.width == 456 ? 352 : 48, 84, 32, @actor.next_rest_exp_s, 2)'
              ],
              [
                "self.contents.draw_text(320, 80, 96, 32, 'Equipment')",
                "self.contents.draw_text(self.width == 456 ? 184 : 320, self.width == 456 ? 0 : 80, 96, 32, 'Equipment')"
              ],
              [
                'draw_item_name($data_weapons[@actor.weapon_ids[i]], 320 + 16, 80 + 24 * (i+1))',
                'draw_item_name($data_weapons[@actor.weapon_ids[i]], self.width == 456 ? 184 : 320 + 16, self.width == 456 ? 32 + 24 * i : 80 + 24 * (i+1))'
              ],
              [
                'draw_item_name($data_armors[@actor.armor_ids[i]], 320 + 16, 200 + 24 * (i - 4 + @actor.weapon_slots.size))',
                'draw_item_name($data_armors[@actor.armor_ids[i]], self.width == 456 ? 184 : 320 + 16, self.width == 456 ? 32 + 24 * (i + @actor.weapon_slots.size) : 200 + 24 * (i - 4 + @actor.weapon_slots.size))'
              ]
            ].each do |old,new|
              t=rep.call(t,old,new)
            end

            s[0...a]+t
          end

          changed=rows.each_index.select{
            |i|Marshal.dump(rows[i])!=before[i]
          }

          raise "Unexpected script scope #{changed}" unless
            changed==[41,42,44,45,46,47,49,79,115,118]

          File.binwrite(
            out,
            Marshal.dump(rows)
          )

          raise 'Roundtrip' unless
            Marshal.load(
              File.binread(out)
            )==rows

          puts "PASS #{changed.size} layout scripts"
          puts "PASS #{137-changed.size} unchanged scripts"
          puts "MD5 #{Digest::MD5.file(out).hexdigest}"
          RUBY

          ruby -c /tmp/sl415-compact.rb

          ruby /tmp/sl415-compact.rb \
            site/knight/gameasync/Data/Scripts.rxdata \
            /tmp/sl415-compact.rxdata

          cp /tmp/sl415-compact.rxdata \
            site/knight/gameasync/Data/Scripts.rxdata

      - name: Update V4.15 script references
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib

          root = Path('site')
          game = root/'knight/gameasync'

          mapper = game/'mapping.js'

          old_mapping_digest = hashlib.sha256(
              mapper.read_bytes()
          ).hexdigest()[:16]

          old_script_digest = '94702578bec2b99471ffab7f74037a17'

          script_digest = hashlib.md5(
              (game/'Data/Scripts.rxdata').read_bytes()
          ).hexdigest()

          assert script_digest != old_script_digest

          old = (
              'Data/Scripts.rxdata?h='
              + old_script_digest
          )

          new = (
              'Data/Scripts.rxdata?h='
              + script_digest
          )

          s = mapper.read_text('utf8')

          assert s.count(old) == 1

          s = s.replace(old,new)

          assert s.count(new) == 1

          mapper.write_text(s,'utf8')

          mapping_digest = hashlib.sha256(
              mapper.read_bytes()
          ).hexdigest()[:16]

          page = root/'knight/index.html'

          s = page.read_text('utf8')

          old = (
              'gameasync/mapping.js?v=v4.15&h='
              + old_mapping_digest
          )

          new = (
              'gameasync/mapping.js?v=v4.15&h='
              + mapping_digest
          )

          assert s.count(old) == 1

          s = s.replace(old,new)

          assert s.count(new) == 1

          page.write_text(s,'utf8')

          print('PASS updated script reference',script_digest)
          print('PASS updated mapping reference',mapping_digest)
          PYTHON

      - name: Verify exact modification scope
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          import json

          root = Path('site')

          before = json.loads(
              Path('/tmp/sl415-before.json').read_text('utf8')
          )

          after = {
              p.relative_to(root).as_posix():
                  hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          assert len(after) == 6086

          assert set(before) == set(after)

          changed = {
              k for k in before
              if before[k] != after[k]
          }

          expected = {
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/mapping.js',
              'knight/index.html'
          }

          assert changed == expected, changed ^ expected

          assert all(
              before[k] == after[k]
              for k in before
              if k not in expected
          )

          print('PASS three modified files')
          print('PASS 6083 original files unchanged')
          print('PASS existing inventory skin unchanged')
          print('PASS original graphics unchanged')
          print('PASS original resource packs unchanged')
          print('PASS original engine unchanged')
          print('PASS mobile controls unchanged')
          PYTHON

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/gameasync/bitmap-map.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: Upload V4.15
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
