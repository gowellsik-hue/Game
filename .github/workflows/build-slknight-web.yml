
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R68
# BASE: deployed successful V229R67, run 40193996775, 5517 files.
# No directional sprite/pad changes. No invented wall offsets or slides.
# Fix: exact S32 cell occupancy; entrance-safe respawn fallback.
# Fix: complete visible floor textures; bounded nearby cache; visible wall only.
# Original floor/wall PNGs and every monster/drop/HP/XP record preserved.
name: build-slknight-web.yml | V229R68 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R68 Restore full deployed V229R67 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40193996775
          name: github-pages
          github-token: ${{ github.token }}
          path: r67

      - name: V229R68 Confirm deployed source and protect assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s r67/artifact.tar
          tar -xf r67/artifact.tar -C site
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json,struct
          root=Path('site')
          base={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(base)==5517,len(base)
          assert 'V229R67' in (root/'index.html').read_text('utf-8')
          assert 'V229R67' in (root/'knight/index.html').read_text('utf-8')
          script=root/'knight/gameasync/Data/Scripts.rxdata'
          assert hashlib.sha256(script.read_bytes()).hexdigest()=='1812f891953226a49b148103d8b69bb48cb1d9bfdacbd54c02eada40169349c5'
          for file,expected in [('knight_men.png',(360,320)),('기사이동모션.png',(400,360))]:
            path=root/'knight/gameasync/Graphics/Characters'/file
            data=path.read_bytes()
            assert data[:8]==b'\x89PNG\r\n\x1a\n'
            assert struct.unpack('>II',data[16:24])==expected
          Path('build/r68-baseline.json').write_text(json.dumps(base,sort_keys=True))
          print('PASS R67: exact 5517 files; no direction sprite assets changed')
          PY_BASE
          ruby -rzlib - <<'RB_READ'
          a=Marshal.load(File.binread('site/knight/gameasync/Data/Scripts.rxdata'))
          raise 'Unexpected script count' unless a.length==136
          source=Zlib::Inflate.inflate(a[28][2])
          raise 'Changed original four-row character decoder' unless source.include?('bitmap.height / 4') && source.include?('(@character.direction - 2) / 2')
          {97=>'build/r67-097.rb',134=>'build/r67-134.rb'}.each do |i,p|
            File.binwrite(p,Zlib::Inflate.inflate(a[i][2]))
          end
          puts 'PASS original 4-row character decoder; original scripts extracted'
          RB_READ

      - name: V229R68 Repair exact native collision, floor loading, and entry spawns
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_PATCH'
          from pathlib import Path

          def change(source, before, after, label):
              count=source.count(before)
              if count!=1:
                  raise AssertionError((label,'matches',count))
              return source.replace(before,after,1)

          root=Path('build')
          floor=(root/'r67-097.rb').read_text('utf-8')
          runtime=(root/'r67-134.rb').read_text('utf-8')
          start=floor.index('  def slti_update_terrain\n')
          stop=floor.index('\n  end\n\nend\n',start)+len('\n  end\n')
          old_floor=floor[start:stop]
          new_floor='''  def slti_update_terrain
              return if @slti_chunk_error
              sx=[$game_map.display_x.to_i / 4,0].max
              sy=[$game_map.display_y.to_i / 4,0].max
              vw=@viewport2.rect.width
              vh=@viewport2.rect.height
              return if vw<=0 || vh<=0
              left=[sx/1024,0].max
              top=[sy/1024,0].max
              right=[(sx+vw-1)/1024,@slti_cols-1].min
              bottom=[(sy+vh-1)/1024,@slti_rows-1].min
              visible={}
              if left<=right && top<=bottom
                (top..bottom).each{|y|(left..right).each{|x|visible[[x,y]]=true}}
              end
              keep={}
              l=[left-1,0].max
              t=[top-1,0].max
              r=[right+1,@slti_cols-1].min
              b=[bottom+1,@slti_rows-1].min
              if l<=r && t<=b
                (t..b).each{|y|(l..r).each{|x|keep[[x,y]]=true}}
              end
              @slti_r68_visible_chunks=visible
              @slti_chunks.keys.each do |key|
                next if keep[key]
                sprite=@slti_chunks.delete(key)
                texture=sprite.bitmap
                sprite.bitmap=nil
                sprite.dispose
                texture.dispose if texture!=nil && !texture.disposed?
              end
              # Render the whole viewport before the first displayed frame.
              # Cache at most one extra near-viewport 512px bitmap per frame.
              pending=visible.keys
              extra=(keep.keys-visible.keys).find{|key|!@slti_chunks.has_key?(key)}
              pending<<extra unless extra==nil
              pending.each do |key|
                next if @slti_chunks.has_key?(key)
                x,y=key
                sprite=Sprite.new(@viewport2)
                sprite.z=-1500
                sprite.zoom_x=2.0
                sprite.zoom_y=2.0
                begin
                  sprite.bitmap=Bitmap.new("Graphics/Panoramas/SLTI_#{@slti_floor}_C#{x}_#{y}")
                rescue StandardError => error
                  sprite.dispose
                  @slti_chunk_error=true
                  p "SLTI FLOOR BITMAP ERROR #{x},#{y}: #{error.message}"
                  return
                end
                @slti_chunks[key]=sprite
              end
              @slti_chunks.each do |key,sprite|
                x,y=key
                sprite.x=x*1024-sx
                sprite.y=y*1024-sy
                sprite.visible=!!visible[key]
              end
            end
          '''
          floor=change(floor,old_floor,new_floor,'complete visible floor and bounded cache')

          old_collision='''    # Preserve original event occupancy, independent of wall geometry.
              unless @through
                $game_map.events.values.each do |other|
                  next if other==self || other.through
                  return false if other.x==nx && other.y==ny && other.character_name!=''
                end
                if self!=$game_player && $game_player!=nil && !$game_player.through
                  return false if $game_player.x==nx && $game_player.y==ny
                end
              end
          '''
          new_collision='''    # Compare authentic source-native cells. Several distinct S32 cells
              # project to the SAME coarse RGSS x/y; coarse occupancy blocks legal steps.
              unless @through
                $game_map.events.values.each do |other|
                  next if other==self || other.through || other.character_name.to_s==''
                  if other.instance_variable_get(:@slti_native66_map)==mid &&
                     other.instance_variable_get(:@slti_native66_x)!=nil
                    other_spot=[other.instance_variable_get(:@slti_native66_x),
                                other.instance_variable_get(:@slti_native66_y)]
                  else
                    cache=other.instance_variable_get(:@slti_r68_collision_spot)
                    if cache==nil || cache[0]!=other.x || cache[1]!=other.y
                      spot=SLTI_Native66.nearest(mid,other.x,other.y,16)
                      cache=[other.x,other.y,spot]
                      other.instance_variable_set(:@slti_r68_collision_spot,cache)
                    end
                    other_spot=cache[2]
                  end
                  return false if other_spot==target
                end
                if self!=$game_player && $game_player!=nil && !$game_player.through
                  if $game_player.instance_variable_get(:@slti_native66_map)==mid
                    return false if [$game_player.instance_variable_get(:@slti_native66_x),
                                     $game_player.instance_variable_get(:@slti_native66_y)]==target
                  end
                end
              end
          '''
          runtime=change(runtime,old_collision,new_collision,'source-native collision coordinates')

          runtime=change(runtime,
            'if distance>=MIN_DEPTH[mid] && ((x+y)&3)==0',
            'if distance>=MIN_DEPTH[mid] && ((x+y)&1)==((start[0]+start[1])&1)',
            'spawn parity follows entrance, not arbitrary mod4')

          # When R67's narrow local-band search fails, choose a connected safe band.
          old_pick_end='''    end
              return nil
            end
          end

          class Game_Map
            alias slti_r67_original_setup setup
          '''
          new_pick_end='''    end
              # Exhaustive fallback is only for rare cases where a local band is full.
              # Never return to the original entrance respawn coordinates.
              all=data['r68_spare'] ||= data['bands'].values.flatten(1)
              if all.length>0
                600.times do
                  x,y,d,rx,ry=all[rand(all.length)]
                  next if d<MIN_DEPTH[mid]
                  next unless free?(event,rx,ry)
                  snap=SLTI_Native66.nearest(mid,rx,ry,16)
                  next if snap==nil || depth(mid,snap[0],snap[1])<MIN_DEPTH[mid]
                  return [rx,ry]
                end
              end
              return nil
            end
          end

          class Game_Map
            alias slti_r67_original_setup setup
          '''
          runtime=change(runtime,old_pick_end,new_pick_end,'fallback spawn outside entrance')

          runtime=change(runtime,
          '''      return slti_r67_original_moveto(target[0],target[1]) if target!=nil
              end
              slti_r67_original_moveto(x,y)
          ''',
          '''      return slti_r67_original_moveto(target[0],target[1]) if target!=nil
                # Failed safety search: keep current position, never use unsafe death-page coordinates.
                return
              end
              slti_r67_original_moveto(x,y)
          ''','do not reset death-page monsters at the blocked entrance')

          runtime=change(runtime,
          '''      next if @slti_chunks.has_key?(key)
                texture,pieces=@slti_r49_walls.delete(key)
          ''',
          '''      next if @slti_r68_visible_chunks && @slti_r68_visible_chunks.has_key?(key)
                texture,pieces=@slti_r49_walls.delete(key)
          ''','dispose wall cache no longer visible')
          runtime=change(runtime,
          '''    @slti_chunks.each_key do |key|
                next if @slti_r49_walls.has_key?(key)
          ''',
          '''    @slti_chunks.each_key do |key|
                next unless @slti_r68_visible_chunks && @slti_r68_visible_chunks.has_key?(key)
                next if @slti_r49_walls.has_key?(key)
          ''','create walls only for visible floor chunks')
          runtime=change(runtime,
          '''      next if one_new>=1
                path="Graphics/Panoramas/SLTI_#{@slti_floor}_W_C#{cx}_#{cy}"
          ''',
          '''      path="Graphics/Panoramas/SLTI_#{@slti_floor}_W_C#{cx}_#{cy}"
          ''','no missing wall pieces when entering new chunk')
          runtime=change(runtime, '    one_new=0\n', '', 'remove obsolete wall throttle counter')
          runtime=change(runtime, '      one_new+=1\n', '', 'remove obsolete wall throttle increment')
          runtime=change(runtime,
          '''       @slti_r49_walls.length==@slti_chunks.length
          ''',
          '''       @slti_r49_walls.length==@slti_r68_visible_chunks.length
          ''','visible wall early out')

          assert 'module SLTI_Native66' in runtime
          assert 'module SLTI_R67' in runtime
          assert 'No slide or axis fallback at blocked walls.' in runtime
          assert 'module SLV541' in runtime
          assert '8-way' not in new_floor
          (root/'r68-097.rb').write_text(floor,encoding='utf-8')
          (root/'r68-134.rb').write_text(runtime,encoding='utf-8')
          print('PASS patch: collision(native), entry-safe spawn, complete floor, bounded floor cache, visible walls')
          PY_PATCH
          ruby -c build/r68-097.rb
          ruby -c build/r68-134.rb

      - name: V229R68 Verify source passage, safe spawns, renderer, and four-way controls
        shell: bash
        run: |
          set -euo pipefail
          ruby - <<'RB_TEST'
          text=File.read('build/r68-134.rb',encoding:'UTF-8')
          start=text.index('module SLTI_Native66')
          raise 'Missing original Sanctuary source coordinate module' if start==nil
          stop=text.index("\nclass Game_Character",start)
          eval(text[start...stop])
          start=text.index("\nmodule SLTI_R67")
          stop=text.index("\nclass Game_Map\n  alias slti_r67_original_setup",start)
          raise 'No R67 preserved spawn module' if start==nil || stop==nil
          module SLTI_V229R49
            def self.monster?(event);true;end
          end
          class FakeEvent
            Ref=Struct.new(:x,:y,:id)
            def initialize(mid,x,y)
              @map_id=mid
              @event=Ref.new(x,y,1)
            end
          end
          eval(text[start...stop])
          [45,46].each do |mid|
            info=SLTI_R67.prepare(mid)
            count=mid==45 ? 5955 : 11665
            raise "Source passage changed #{mid}" unless info['connected']==count
            entry=SLTI_R67::ENTRY[mid]
            parity=(entry[0]+entry[1])&1
            rows=info['bands'].values.flatten(1)
            raise 'insufficient distributed spawn candidates' unless rows.length>500
            raise 'wrong native parity' unless rows.all?{|r| ((r[0]+r[1])&1)==parity}
            event=FakeEvent.new(mid,*(mid==45 ? [101,81] : [90,90]))
            100.times do
              picked=SLTI_R67.pick(event)
              raise 'unsafe spawn nil' if picked==nil
              n=SLTI_Native66.nearest(mid,picked[0],picked[1],16)
              d=SLTI_R67.depth(mid,*n)
              raise "spawn too near entry: #{mid}, #{d}" if d<SLTI_R67::MIN_DEPTH[mid]
            end
            puts "PASS floor #{mid}: #{count} connected native cells, #{rows.length} safe spawn samples, 100 random spawns"
          end
          floor=File.read('build/r68-097.rb')
          raise 'old 1-chunk throttle still active' if floor.include?('new_count>=1')
          raise '2F-only camera skip remains' if floor.include?('if @slti_floor==46 &&')
          raise 'floor not complete before draw' unless floor.include?('pending=visible.keys')
          raise 'bounded prefetch absent' unless floor.include?('pending<<extra unless extra==nil')
          raise 'missing floor depth' unless floor.include?('sprite.z=-1500')
          raise 'wall cache includes offscreen' unless text.include?('next unless @slti_r68_visible_chunks && @slti_r68_visible_chunks.has_key?(key)')
          raise 'wall slide restored' unless text.include?('No slide or axis fallback at blocked walls.')
          raise 'coarse collision reintroduced' if text.include?("return false if other.x==nx && other.y==ny && other.character_name!=''")
          raise 'direction asset assumptions changed' unless text.include?('moves={2=>[-1,1],4=>[-1,-1],6=>[1,1],8=>[1,-1]')
          puts 'PASS renderer, exact native event collision, four-button control unchanged, no wall slide'
          RB_TEST

      - name: V229R68 Repack original 136-script engine and audit exact file changes
        shell: bash
        run: |
          set -euo pipefail
          ruby -rzlib - <<'RB_PACK'
          path='site/knight/gameasync/Data/Scripts.rxdata'
          archive=Marshal.load(File.binread(path))
          original=Marshal.load(File.binread(path))
          raise 'Changed original script count' unless archive.size==136
          {97=>'build/r68-097.rb',134=>'build/r68-134.rb'}.each do |i,f|
            archive[i][2]=Zlib::Deflate.deflate(File.binread(f))
          end
          raise 'Unexpected game script edits' unless archive.each_index.all?{|i| [97,134].include?(i) || archive[i]==original[i]}
          File.binwrite(path,Marshal.dump(archive))
          check=Marshal.load(File.binread(path))
          raise 'No floor fix' unless Zlib::Inflate.inflate(check[97][2]).include?('pending=visible.keys')
          raise 'No collision fix' unless Zlib::Inflate.inflate(check[134][2]).include?('other_spot==target')
          raise 'Game data changed' unless [97,134].all?{|i| check[i][2]!=original[i][2]}
          puts 'PASS script97 and script134 patched; remaining 134 scripts unchanged'
          RB_PACK
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import hashlib,json,re
          root=Path('site')
          game=root/'knight/gameasync'
          mapping=game/'mapping.js'
          src=mapping.read_text('utf-8')
          digest=hashlib.md5((game/'Data/Scripts.rxdata').read_bytes()).hexdigest()
          src,n=re.subn(r'Data/Scripts\.rxdata\?h=[0-9a-f]{32}',lambda m:'Data/Scripts.rxdata?h='+digest,src)
          assert n==1,n
          mapping.write_text(src,encoding='utf-8')
          for fname in ('index.html','knight/index.html'):
            file=root/fname
            original=file.read_text('utf-8')
            assert 'V229R67' in original
            file.write_text(original.replace('V229R67','V229R68').replace('v229r67','v229r68'),encoding='utf-8')
          before=json.loads(Path('build/r68-baseline.json').read_text('utf-8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert before.keys()==after.keys() and len(after)==5517
          changed={p for p in before if before[p]!=after[p]}
          allowed={'index.html','knight/index.html','knight/gameasync/mapping.js','knight/gameasync/Data/Scripts.rxdata'}
          assert changed==allowed,('Unexpected asset/mob edits',changed^allowed)
          print('PASS all 5517 files preserved; exactly four intended web/script files modified')
          PY_FINAL
          node --check site/knight/gameasync/mapping.js

      - name: V229R68 Upload full game to existing GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
