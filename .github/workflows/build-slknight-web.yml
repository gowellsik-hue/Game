            )

            x=Table.allocate
            put(x,:raw,data)
            x
          end

          def new_animation(src,id,name,bank,dir,count)
            obj=RPG::Animation.allocate

            src.instance_variables.each do |field|
              next if [
                :@id,
                :@name,
                :@animation_name,
                :@frame_max,
                :@frames,
                :@timings
              ].include?(field)

              obj.instance_variable_set(
                field,
                clone(src.instance_variable_get(field))
              )
            end

            put(obj,:id,id)
            put(obj,:name,name)
            put(
              obj,:animation_name,
              "SLZQ_#{bank}_D#{dir}"
            )
            put(obj,:frame_max,count)
            put(obj,:timings,[])

            frames=Array.new(count) do |i|
              frame=RPG::Animation::Frame.allocate
              put(frame,:cell_max,1)
              put(frame,:cell_data,anim_table(i))
              frame
            end

            put(obj,:frames,frames)
            obj
          end

