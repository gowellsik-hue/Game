
name: V199 | Repair Fairy HUD Lifetime Without Rebuilding Game

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Download exact successful V198 deployment
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 38113124901
          github-token: ${{ github.token }}
          path: prior

      - name: Restore V198 site byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          test -s prior/artifact.tar
          mkdir -p site
          tar -xf prior/artifact.tar -C site
          test -s site/index.html
          test -s site/knight/index.html
          test -s site/elf/index.html
          test -s site/elf/gameasync/Data/Scripts.rxdata
          test -s site/elf/gameasync/mapping.js
          test -s site/elf/js/dpad.js
          test -s site/knight/mkxp.wasm
          test -s site/elf/mkxp.wasm
          sha256sum site/knight/index.html site/knight/js/dpad.js site/knight/gameasync/Data/Scripts.rxdata site/elf/js/dpad.js > /tmp/v199_unchanged.sha
          echo V198_ARTIFACT_RESTORED

      - name: V199 move Fairy HUD cleanup to scene disposal
        shell: bash
        run: |
          set -euo pipefail
          ruby -rzlib - site/elf/gameasync/Data/Scripts.rxdata <<'RB'
          path = ARGV.fetch(0)
          scripts = Marshal.load(File.binread(path))
          hud = scripts.select { |e| e.is_a?(Array) && e[1].to_s == 'MOG - S HUD' }
          abort "MOG HUD count=#{hud.length}" unless hud.length == 1
          source = Zlib::Inflate.inflate(hud[0][2]).force_encoding('UTF-8').gsub("\r\n", "\n")

          old_cleanup = <<'OLD'
                shud_main    
                @shud.dispose
                @shud = nil
                @s_viewport.dispose
                @s_viewport = nil
          OLD
          abort 'HUD early cleanup marker mismatch' unless source.scan(old_cleanup).length == 1
          source.sub!(old_cleanup, "      shud_main\n")

          old_update = <<'OLD'
            def update
              shud_update
              @shud.update
            end  
          end
          OLD
          new_update = <<'NEW'
            def update
              shud_update
              @shud.update
            end

            # Keep HUD alive after nonblocking main; release it only on scene exit.
            alias sl_v199_original_dispose dispose
            def dispose
              if @shud
                @shud.dispose
                @shud = nil
              end
              if @s_viewport
                @s_viewport.dispose
                @s_viewport = nil
              end
              sl_v199_original_dispose
            end
          end
          NEW
          abort 'HUD update marker mismatch' unless source.scan(old_update).length == 1
          source.sub!(old_update, new_update)
          RubyVM::InstructionSequence.compile(source, 'MOG - S HUD V199')
          hud[0][2] = Zlib::Deflate.deflate(source)
          File.binwrite(path, Marshal.dump(scripts))
          puts 'V199_HUD_LIFETIME_FIXED'
          RB

      - name: Refresh only Fairy script hash and version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          data = Path('site/elf/gameasync/Data/Scripts.rxdata')
          mapping = Path('site/elf/gameasync/mapping.js')
          html = Path('site/elf/index.html')
          md5 = hashlib.md5(data.read_bytes()).hexdigest()
          contents = mapping.read_text(encoding='utf-8')
          regex = r'(\["data/scripts",\s*"Data/Scripts\.rxdata\?h=)[0-9a-f]{32}("\],)'
          result, count = re.subn(regex, lambda m: m.group(1) + md5 + m.group(2), contents)
          if count != 1:
              raise SystemExit('Scripts mapping hash marker mismatch')
          mapping.write_text(result, encoding='utf-8')

          content = html.read_text(encoding='utf-8')
          for old, new in (
              ('gameasync/mapping.js?v=fairy198', 'gameasync/mapping.js?v=fairy199'),
              ("box.textContent='V198 '+state", "box.textContent='V199 '+state"),
          ):
              if content.count(old) != 1:
                  raise SystemExit('Fairy index marker mismatch: ' + old)
              content = content.replace(old, new, 1)
          html.write_text(content, encoding='utf-8')
          print('V199_FAIRY_MAPPING_REFRESHED')
          PY

      - name: Verify restored HUD and unchanged Knight
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c /tmp/v199_unchanged.sha
          grep -Fq 'gameasync/mapping.js?v=fairy199' site/elf/index.html
          grep -Fq "box.textContent='V199 '+state" site/elf/index.html
          node --check site/elf/js/dpad.js
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          data = Path('site/elf/gameasync/Data/Scripts.rxdata')
          mapping = Path('site/elf/gameasync/mapping.js').read_text(encoding='utf-8')
          expected = 'Data/Scripts.rxdata?h=' + hashlib.md5(data.read_bytes()).hexdigest()
          if expected not in mapping:
              raise SystemExit('V199 script hash stale')
          print('V199_HASH_OK')
          PY
          ruby -rzlib - site/elf/gameasync/Data/Scripts.rxdata <<'RB'
          scripts = Marshal.load(File.binread(ARGV.fetch(0)))
          hud = scripts.find { |e| e.is_a?(Array) && e[1].to_s == 'MOG - S HUD' }
          scene = scripts.find { |e| e.is_a?(Array) && e[1].to_s == 'Scene_Map' }
          abort 'Fairy HUD or map missing' unless hud && scene
          hs = Zlib::Inflate.inflate(hud[2])
          ms = Zlib::Inflate.inflate(scene[2])
          abort 'V198 scene initialization changed' unless ms.include?('def sl_v198_inputs')
          abort 'Early HUD dispose still present' if hs.match?(/shud_main\s*\n\s*@shud\.dispose/)
          abort 'HUD disposal not deferred' unless hs.include?('alias sl_v199_original_dispose dispose')
          abort 'HUD update removed' unless hs.include?('@shud.update')
          RubyVM::InstructionSequence.compile(hs, 'MOG HUD V199')
          puts 'V199_HUD_LIFECYCLE_VERIFIED'
          RB
          echo V199_STATIC_CHECKS_OK

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
