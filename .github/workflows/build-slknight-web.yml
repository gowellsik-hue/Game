          end
          class MapMock
           attr_accessor :map_id,:events
           def initialize(id);@map_id=id;@events={};end
          end
          $game_player=Game_Character.new;$game_player.x=-1000;$game_player.y=-1000
          $game_party=MockParty.new;$game_actors={1=>Actor.new};$game_variables=Hash.new(0);$game_switches=Hash.new(false);$game_self_switches=Hash.new(false);$game_map=MapMock.new(2)
          load File.join(ENV.fetch('R52_BUILD'),'r52-original-event.rb')
