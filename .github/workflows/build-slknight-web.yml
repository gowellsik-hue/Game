
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R16 / Visible game version metadata and screen display
name: build-slknight-web.yml | V229R16 | Visible Version Display Fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: V229R16 Restore successful V229R15, including teleporter change
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39135238695
          name: github-pages
          github-token: ${{ github.token }}
          path: previous

      - name: V229R16 Check baseline and 5354 game assets
        run: |
          set -euo pipefail
          test -s previous/artifact.tar
          mkdir -p site
          tar -xf previous/artifact.tar -C site
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(hashes)==5354,('Unexpected asset count',len(hashes))
          expected={
              'index.html':'cb972e363a37790bef24aafceae5bd12aaa686934acc4a4c052402006341a3ba',
              'knight/index.html':'10ba4b75c216204d9309469f3cb5f4c10b33a6c085b0c9115a0adb8f5258e51f',
              'knight/gameasync/mapping.js':'53ef0647a4c39ea15cb603adbb71fe4bc726b0cb4b5ec864c7473c4bd628d5c1',
              'knight/gameasync/Data/Scripts.rxdata':'ac9aa3508341546e8467454a87b728b232fea910734357e3df4711e9cc82a61c',
              'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap029.rxdata':'2b99c87f691fece863c850f2217e538e3f6f76787b290507c8212b621beaf305',
              'knight/js/dpad.js':'a313791be0ef8eeb5edcf57088cf39b860662a318cdb11c2170c70f846688acb',
          }
          for filename,sha in expected.items():
              assert hashes.get(filename)==sha,('Wrong V229R15 source',filename,hashes.get(filename))
          npc=(root/'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap029.rxdata').read_bytes()
          assert npc.count('말섬던전'.encode('utf-8'))==2, 'V229R15 NPC option not preserved'
          Path('/tmp/r16-before.json').write_text(json.dumps(hashes))
          print('V229R16 SOURCE VERIFIED: V229R15, 5354 assets, TI Dungeon menu intact')
          PY_BASE

      - name: V229R16 Update visible in-game version and character selection
        run: |
          set -euo pipefail
          python3 - <<'PY_VERSION'
          from pathlib import Path
          knight=Path('site/knight/index.html')
          html=knight.read_text(encoding='utf-8')
          def replace_once(old,new):
              global html
              assert html.count(old)==1,('Expected one occurrence',old,html.count(old))
              html=html.replace(old,new,1)
          replace_once('<title>SLKnight V14.3z100</title>','<title>SLKnight V229R16</title>')
          replace_once("var wTitle = 'SLKnight V14.3z100'","var wTitle = 'SLKnight V229R16'")
          replace_once('gameasync/mapping.js?v=v229r15','gameasync/mapping.js?v=v229r16')
          replace_once('js/dpad.js?v=v229r13','js/dpad.js?v=v229r16')
          # Preserve the original save-game namespace.
          label='<div id="sl-build-version" style="position:fixed;top:4px;left:5px;z-index:2000000;pointer-events:none;padding:2px 5px;border-radius:4px;background:rgba(0,0,0,.45);color:#fff;font:10px/1.3 system-ui,sans-serif;opacity:.75">V229R16</div>'
          replace_once('</body>',label+'\n</body>')
          knight.write_text(html,encoding='utf-8')

          home=Path('site/index.html')
          original=home.read_text(encoding='utf-8')
          assert original.count('<title>SLKnight + SLFairy</title>')==1
          assert original.count('>기사</button>')==1
          changed=original.replace('<title>SLKnight + SLFairy</title>','<title>SLKnight V229R16 + SLFairy</title>',1)
          changed=changed.replace('>기사</button>','>기사<small style="display:block;font-size:12px;margin-top:8px;opacity:.8">V229R16</small></button>',1)
          home.write_text(changed,encoding='utf-8')
          print('V229R16 HTML version updated: browser title, game HUD, character select')
          PY_VERSION

      - name: V229R16 Confirm only two HTML files changed
        run: |
          set -euo pipefail
          node --check site/knight/js/dpad.js
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before=json.loads(Path('/tmp/r16-before.json').read_text())
          now={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(now)==5354 and now.keys()==before.keys(), 'Game asset list changed'
          changed={p for p in now if now[p]!=before[p]}
          assert changed=={'index.html','knight/index.html'}, ('Unexpected changed files',changed)
          knight=(root/'knight/index.html').read_text(encoding='utf-8')
          home=(root/'index.html').read_text(encoding='utf-8')
          assert '<title>SLKnight V229R16</title>' in knight
          assert "var wTitle = 'SLKnight V229R16'" in knight
          assert knight.count('id="sl-build-version"')==1
          assert 'gameasync/mapping.js?v=v229r16' in knight
          assert 'js/dpad.js?v=v229r16' in knight
          assert 'SLKnight V229R16 + SLFairy' in home
          assert '>기사<small' in home and 'V229R16</small>' in home
          assert "var namespace = 'slknight_v14_engine'" in knight
          assert 'knight/?v=' in home and 'elf/?v=' in home
          print('V229R16 PASS: visible version renewed, teleporter/data/scripts untouched')
          PY_FINAL

      - name: V229R16 Upload complete game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
