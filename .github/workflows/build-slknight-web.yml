              end
              # 논리 좌표가 실좌표보다 오른쪽의 경우
              if @x * 128 > @real_x
                # 오른쪽으로 이동
                @real_x = [@real_x + distance, @x * 128].min
              end
              # 논리 좌표가 실좌표보다 위의 경우
