name: build-slknight-web.yml | V4.14 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Restore V4.13 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45953980268
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify original game
        shell: bash
        run: |
          set -euo pipefail

          test -s baseline/artifact.tar

          mkdir -p site
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          import json

          root=Path('site')

          before={
              p.relative_to(root).as_posix():
                  hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          assert len(before)==6085

          assert before[
              'knight/gameasync/Data/Scripts.rxdata'
          ]=='aee568a7fe7f1930048b8baa163dd5995d28947dcb66866691cc08522dca56d1'

          assert before[
              'knight/gameasync/mapping.js'
          ]=='d45dc30e3f9437e4236b30685a1281efb603201dacfba39fc79180a3ee65e1de'

          assert before[
              'knight/gameasync/bitmap-map.js'
          ]=='1d6c9d9927159814da4de4b1f5291eb8c737e25dda454b2aeccc24dd4ea9849b'

          assert before[
              'knight/index.html'
          ]=='8107f98518b8895482861553146bb2aa10f9ec8936c384d4393bce81a671d139'

          assert before[
              'knight/js/sl-assets-v229r115.js'
          ]=='53b55c27251d7b79d9d60c54b04ee0dbf92877c89fa893028dd49fe15d8c925b'

          Path('/tmp/sl414-before.json').write_text(
              json.dumps(before),
              'utf8'
          )

          print('PASS original V4.13',len(before))
          PYTHON

      - name: Remove original central message output
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl414-clear.rb <<'RUBY'
          # encoding: UTF-8
          require 'zlib'
          require 'digest'

          path=ARGV.fetch(0)

          raw=File.binread(path)

          raise 'Wrong V4.13 scripts' unless
            Digest::SHA256.hexdigest(raw)==
            'aee568a7fe7f1930048b8baa163dd5995d28947dcb66866691cc08522dca56d1'

          rows=Marshal.load(raw)

          raise 'Script count' unless rows.size==137

          before=rows.map{|r|Marshal.dump(r)}

          [78,127].each do |i|

            s=Zlib::Inflate.inflate(
              rows[i][2]
            ).force_encoding('UTF-8')

            crlf=s.include?("\r\n")

            s=s.gsub("\r\n","\n")

            if i==78

              a="    $메세지 = Window_Help2.new\n"

              b=a+
                "    $메세지.visible = false\n"+
                "    $메세지.contents_opacity = 0\n"

            else

              a=/^[ \t]*#도움말 출력\n.*?(?=^[ \t]*#스텟 출력)/m

              block=s[a]

              raise 'Help count' unless
                block &&
                block.scan(
                  'self.contents.draw_text(143, 441, 500, 32'
                ).size==19

              b=
                "    self.contents.font.name = \"NanumGothic\"\n"+
                "    self.contents.font.size = 12\n"+
                "    self.contents.font.bold = false\n\n"

            end

            raise "Anchor #{i}" unless
              s.scan(a).size==1

            t=s.sub(a){b}

            RubyVM::InstructionSequence.compile(t)

            t=t.gsub("\n","\r\n") if crlf

            rows[i][2]=Zlib::Deflate.deflate(t.b)

          end

          raise 'Wrong scope' unless
            rows.each_index.select{
              |i|Marshal.dump(rows[i])!=before[i]
            }==[78,127]

          File.binwrite(path,Marshal.dump(rows))

          raise 'Roundtrip' unless
            Marshal.load(File.binread(path))==rows

          puts 'PASS central message hidden'
          puts 'PASS original help output removed'
          puts 'PASS 2 modified scripts, 135 unchanged'
          RUBY

          ruby -c /tmp/sl414-clear.rb

          ruby /tmp/sl414-clear.rb \
            site/knight/gameasync/Data/Scripts.rxdata

      - name: Remove original central HUD graphic
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv --system-site-packages /tmp/sl414-venv

          /tmp/sl414-venv/bin/python -c "import PIL" || \
            /tmp/sl414-venv/bin/python -m pip install \
              --quiet --disable-pip-version-check \
              'Pillow>=11,<13'

          /tmp/sl414-venv/bin/python - <<'PYTHON'
          from pathlib import Path
          from PIL import Image
          import hashlib
          import json
          import struct
          import base64
          import io
          import re

          root=Path('site')
          game=root/'knight/gameasync'

          name='게이지(저사양)-상'
          key='graphics/pictures/'+name

          rel='Graphics/Pictures/'+name+'.png'

          graphic=game/rel

          original=graphic.read_bytes()

          old_digest=hashlib.md5(original).hexdigest()

          assert old_digest=='066b88e345cef3819c463a68d6a1cfb5'
          assert len(original)==55303

          im=Image.open(io.BytesIO(original)).convert('RGBA')

          assert im.size==(800,600)

          old_image=im.copy()

          box=(135,450,488,600)

          im.paste((0,0,0,0),box)

          assert im.crop(box).getbbox() is None

          for area in [
              (0,0,800,450),
              (0,450,135,600),
              (488,450,800,600)
          ]:
              assert (
                  im.crop(area).tobytes()
                  ==old_image.crop(area).tobytes()
              )

          buffer=io.BytesIO()

          im.save(buffer,format='PNG')

          corrected=buffer.getvalue()

          assert corrected!=original

          graphic.write_bytes(corrected)

          new_digest=hashlib.md5(corrected).hexdigest()

          print('PASS original central graphic removed')
          print('PASS left and right graphic pixels unchanged')

          pack=root/'knight/assets/shared-v229r115.pack'

          old_pack=pack.read_bytes()

          assert len(old_pack)==43962587

          header_size=struct.unpack_from('<I',old_pack,0)[0]

          assert 0<header_size<len(old_pack)-4

          index=json.loads(
              old_pack[4:4+header_size].decode('utf8')
          )

          payload=old_pack[4+header_size:]

          assert index['kind']=='shared'

          old_rows=index['files']

          assert len(old_rows)==2292

          assert len({
              row[0] for row in old_rows
          })==2292

          offset=0

          for row in old_rows:

              assert len(row)==3
              assert row[1]==offset
              assert row[2]>0

              offset+=row[2]

          assert offset==len(payload)

          matches=[
              i for i,row in enumerate(old_rows)
              if row[0]==key
          ]

          assert len(matches)==1

          target=matches[0]

          _,start,size=old_rows[target]

          assert start==27965453
          assert size==55303

          assert payload[start:start+size]==original

          delta=len(corrected)-size

          new_payload=(
              payload[:start]+
              corrected+
              payload[start+size:]
          )

          new_rows=[]

          for i,(k,o,n) in enumerate(old_rows):

              if i==target:
                  new_rows.append([k,o,len(corrected)])

              elif i>target:
                  new_rows.append([k,o+delta,n])

              else:
                  new_rows.append([k,o,n])

          unchanged=0

          for i in range(len(old_rows)):

              k,o,n=old_rows[i]
              k2,o2,n2=new_rows[i]

              assert k==k2

              old_bytes=payload[o:o+n]
              new_bytes=new_payload[o2:o2+n2]

              if i==target:

                  assert new_bytes==corrected
                  assert new_bytes!=old_bytes

              else:

                  assert old_bytes==new_bytes

                  unchanged+=1

          assert unchanged==2291

          assert (
              new_rows[-1][1]+new_rows[-1][2]
              ==len(new_payload)
          )

          index['files']=new_rows

          new_header=json.dumps(
              index,
              ensure_ascii=False,
              separators=(',',':')
          ).encode('utf8')

          pack.write_bytes(
              struct.pack('<I',len(new_header))+
              new_header+
              new_payload
          )

          pack_digest=hashlib.sha256(
              pack.read_bytes()
          ).hexdigest()[:16]

          print('PASS original shared pack updated')
          print('PASS 2291 other packed resources unchanged')

          mapper=game/'mapping.js'

          s=mapper.read_text('utf8')

          old_marker=rel+'?h='+old_digest

          assert s.count(old_marker)==1

          s=s.replace(
              old_marker,
              rel+'?h='+new_digest
          )

          old_script_digest='6b6625669a2e5c200676a2bb38961014'

          script=game/'Data/Scripts.rxdata'

          script_digest=hashlib.md5(
              script.read_bytes()
          ).hexdigest()

          old_marker='Data/Scripts.rxdata?h='+old_script_digest

          assert s.count(old_marker)==1

          s=s.replace(
              old_marker,
              'Data/Scripts.rxdata?h='+script_digest
          )

          mapper.write_text(s,'utf8')

          mapping_digest=hashlib.sha256(
              mapper.read_bytes()
          ).hexdigest()[:16]

          bitmap_map=game/'bitmap-map.js'

          s=bitmap_map.read_text('utf8')

          pattern=re.compile(
              r'("'+re.escape(key)+
              r'":\s*\[800,600,"data:image/png;base64,)'+
              r'([A-Za-z0-9+/=]+)("\])'
          )

          matches=list(pattern.finditer(s))

          assert len(matches)==1

          match=matches[0]

          thumb=Image.open(
              io.BytesIO(
                  base64.b64decode(match.group(2))
              )
          ).convert('RGBA')

          assert thumb.size==(64,48)

          resized=im.resize(
              thumb.size,
              Image.Resampling.BOX
          )

          thumb_box=(10,36,40,48)

          thumb.paste(
              resized.crop(thumb_box),
              thumb_box
          )

          buffer=io.BytesIO()

          thumb.save(buffer,format='PNG')

          encoded=base64.b64encode(
              buffer.getvalue()
          ).decode('ascii')

          s=(
              s[:match.start(2)]+
              encoded+
              s[match.end(2):]
          )

          bitmap_map.write_text(s,'utf8')

          bitmap_digest=hashlib.sha256(
              bitmap_map.read_bytes()
          ).hexdigest()[:16]

          print('PASS central thumbnail updated')

          loader=root/'knight/js/sl-assets-v229r115.js'

          s=loader.read_text('utf8')

          old_pack_url='shared-v229r115.pack?v=V4.11'

          new_pack_url=(
              'shared-v229r115.pack?v=V4.14&h='
              +pack_digest
          )

          assert s.count(old_pack_url)==1

          s=s.replace(
              old_pack_url,
              new_pack_url
          )

          assert s.count("var version='V4.13';")==1

          s=s.replace(
              "var version='V4.13';",
              "var version='V4.14';"
          )

          loader.write_text(s,'utf8')

          loader_digest=hashlib.sha256(
              loader.read_bytes()
          ).hexdigest()[:16]

          page=root/'knight/index.html'

          s=page.read_text('utf8')

          references=[
              (
                  'gameasync/mapping.js?v=v4.13',
                  'gameasync/mapping.js?v=v4.14&h='+mapping_digest,
                  1
              ),
              (
                  'gameasync/bitmap-map.js?v=v4.13',
                  'gameasync/bitmap-map.js?v=v4.14&h='+bitmap_digest,
                  2
              ),
              (
                  'js/sl-assets-v229r115.js?v=v4.13',
                  'js/sl-assets-v229r115.js?v=v4.14&h='+loader_digest,
                  1
              )
          ]

          for old,new,count in references:

              assert s.count(old)==count,(old,s.count(old))

              s=s.replace(old,new)

          assert 'V4.13' in s

          s=s.replace('V4.13','V4.14')

          page.write_text(s,'utf8')

          index_page=root/'index.html'

          s=index_page.read_text('utf8')

          assert 'V4.13' in s

          index_page.write_text(
              s.replace(
                  'V4.13','V4.14'
              ).replace(
                  'v4.13','v4.14'
              ),
              'utf8'
          )

          print('PASS current script cache',script_digest)
          print('PASS current image cache',new_digest)
          print('PASS current pack cache',pack_digest)
          print('PASS current bitmap cache',bitmap_digest)
          PYTHON

      - name: Verify exact deletion scope
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          import json

          root=Path('site')

          before=json.loads(
              Path('/tmp/sl414-before.json').read_text('utf8')
          )

          after={
              p.relative_to(root).as_posix():
                  hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          assert set(before)==set(after)
          assert len(after)==6085

          changed={
              k for k in before
              if before[k]!=after[k]
          }

          expected={
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/Graphics/Pictures/게이지(저사양)-상.png',
              'knight/assets/shared-v229r115.pack',
              'knight/gameasync/mapping.js',
              'knight/gameasync/bitmap-map.js',
              'knight/js/sl-assets-v229r115.js',
              'knight/index.html',
              'index.html'
          }

          assert changed==expected,changed^expected

          assert all(
              before[k]==after[k]
              for k in before
              if k not in expected
          )

          print('PASS exact eight changed files')
          print('PASS 6077 original files unchanged')
          print('PASS original combat and inventory preserved')
          print('PASS central HUD deletion only')
          PYTHON

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/gameasync/bitmap-map.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: Upload V4.14 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
