
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V276.5
# BASE: V276.2 successful build 41572739702 (ROLLBACK of V276.3/V276.4)
# TARGET: Zenith Queen Map025 EV29
# CHANGE: temporary HP 52, move_speed 2, attack cycle 25 frames (5+20)
# KEEP: original V276.2 item rewards (20 drops), damage, event pages and sprite images
# KEEP: original Death Knight, scripts, other maps/monsters, 4-direction movement
# HTML MOTION REVIEW: separate artifact, not injected into game in this version
# NOTE: test HP52 must be restored to 5200 after reward checks
# TEST: source RXData, attack registration, payouts and protected file hashes

name: build-slknight-web.yml | V276.5 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: V276.5 Restore verified V276.2 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41572739702
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V276.5 Verify and inventory original game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s baseline/artifact.tar
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          assert len(before)==5606,('Original V276.2 inventory changed',len(before))
          assert 'V276.2' in (root/'knight/index.html').read_text('utf-8')
          assert 'knight/assets/map-047-v241.pack' in before
          for rel in ('knight/gameasync/Data/Scripts.rxdata','knight/gameasync/mapping.js'):
              assert rel in before,rel
          Path('build/before.json').write_text(json.dumps(before),encoding='utf-8')
          print('PASS full V276.2 game and 5606-file inventory')
          PY

      - name: V276.5 Apply HP52 movement2 attack25 without sprite changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          cat > build/patch.rb <<'V2765_PATCH'
          # encoding: UTF-8
          # V276.5: minimal V276.2 rollback + requested HP, walk speed and attack cycle.
          require 'json'
          module RPG
            class Map;end;class CommonEvent;end;class AudioFile;end
            class Event
              class Page
                class Condition;end;class Graphic;end
              end
            end
            class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          class Table
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(level=0);@raw;end
          end
          class Tone
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(level=0);@raw;end
          end
          class Color<Tone;end

          def iv(obj,key);obj.instance_variable_get('@'+key.to_s);end
          def put(obj,key,value);obj.instance_variable_set('@'+key.to_s,value);end

          root='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          mapfile=root+pre+'Map025.rxdata'
          commonfile=root+pre+'CommonEvents.rxdata'
          map=Marshal.load(File.binread(mapfile))
          common=Marshal.load(File.binread(commonfile))
          events=iv(map,:events)
          boss=events.fetch(29)
          raise 'Unexpected boss' unless iv(boss,:name)=='제니스 퀸'
          pages=iv(boss,:pages)
          raise 'Five native pages required' unless pages.length==5
          raise 'Original reward page changed' unless iv(pages[2],:list).map{|x|iv(x,:code)}==[355,230,116,0]
          original_reward=iv(iv(pages[2],:list)[0],:parameters)[0].dup
          original_other_events=events.each_with_object({}){|(id,e),h|h[id]=Marshal.dump(e) if id!=29}
          original_common=common.each_with_index.map{|ce,i|i==1063 ? nil : ce.nil? ? nil : Marshal.dump(ce)}

          # 1. Only the live Zenith event pages 0..2 use movement speed 2.
          [0,1,2].each do |i|
            raise "Unexpected baseline movement on page #{i}" unless iv(pages[i],:move_speed)==3
            put(pages[i],:move_speed,2)
          end

          # 2. Native death condition: total received damage 52 (temporary test).
          cond=iv(pages[2],:condition)
          raise 'Original HP condition different' unless
            iv(cond,:variable_valid)==true && iv(cond,:variable_id)==4988 &&
            iv(cond,:variable_value)==5200
          put(cond,:variable_value,52)

          # 3. Keep the existing HUD and event damage path; adjust only displayed max HP.
          hud_count=0
          pages.each do |page|
            iv(page,:list).each do |c|
              p=iv(c,:parameters)
              next unless [355,655].include?(iv(c,:code)) && p.is_a?(Array) && p[0].is_a?(String)
              next unless p[0].b.include?('drawMHP'.b)
              script=p[0].dup.b
              if script.include?('5200'.b)
                raise 'Multiple max-HP values in HUD' unless script.scan('5200'.b).length==1
                p[0]=script.sub('5200'.b,'52'.b)
                hud_count+=1
              end
            end
          end
          raise 'Exactly one Zenith HUD expected' unless hud_count==1

          # 4. Original attack cycle: 5 startup + 15 recovery -> 5 + 20 = 25.
          ce=common.fetch(1063)
          raise 'Missing independent DK2F attack CE' unless iv(ce,:name).to_s.start_with?('[DK2F]') &&
            iv(ce,:trigger)==2 && iv(ce,:switch_id)==5991
          cycle=iv(ce,:list)
          raise 'Original attack event graph changed' unless cycle.map{|c|iv(c,:code)}==[355,106,117,106,121,0]
          raise 'Wrong native attack startup or recovery' unless
            iv(cycle[1],:parameters)==[5] && iv(cycle[3],:parameters)==[15]
          raise 'Wrong independent attack route' unless iv(cycle[2],:parameters)==[1064]
          put(cycle[3],:parameters,[20])

          # The native attack registration also carries its own cycle length (20).
          # Change just that number; preserve every attack routing and animation ID.
          source=iv(cycle[0],:parameters)[0].dup.b
          raise 'Unexpected native attack registration' unless
            source.start_with?('SLMonsterAttackContext.start('.b) && source.end_with?(',20)'.b)
          put(cycle[0],:parameters,[source.sub(/,20\)\z/n,',25)'.b)])

          # 5. No changes to the original loot, boss stats, other monsters or scripts.
          raise 'Twenty item reward entries altered' unless original_reward.scan(/\[:(?:item|weapon|armor),\s*\d+,\s*\d+\]/).length==20
          raise 'Loot reward changed' unless iv(iv(pages[2],:list)[0],:parameters)[0]==original_reward
          raise 'Attack graphics changed' unless [0,1].all?{|i|iv(iv(pages[i],:graphic),:character_name)=='SLDK2F01'}
          raise 'Death graphics changed' unless iv(iv(pages[2],:graphic),:character_name)=='SLDK2F02'
          raise 'Reward and erase timing changed' unless iv(iv(pages[2],:list)[1],:parameters)==[45]
          original_other_events.each{|id,data|raise "Unrelated monster #{id} changed" unless Marshal.dump(events[id])==data}
          original_common.each_with_index do |data,i|
            next if i==1063
            current=common[i]
            raw=current.nil? ? nil : Marshal.dump(current)
            raise "Unrelated CE #{i} changed" unless raw==data
          end
          File.binwrite(mapfile,Marshal.dump(map))
          File.binwrite(commonfile,Marshal.dump(common))
          File.write('build/zenith-v2765-report.json',JSON.pretty_generate({
            version:'V276.5',base:'V276.2',map:25,event:29,
            test_hp:52,restore_hp:5200,move_speed:2,move_frequency:6,
            attack_startup:5,attack_recovery:20,attack_cycle:25,
            exp:43212,adena:[64800,151200],drops:20,
            graphics_changed:false,game_scripts_changed:false
          }))
          puts 'PASS V276.2 rollback: Zenith HP52, speed2, attack cycle25'
          puts 'PASS 5+20 native attack cycle and registration 25'
          puts 'PASS item reward, graphics, unrelated monsters and common events unchanged'
          V2765_PATCH
          ruby -c build/patch.rb
          ruby build/patch.rb

      - name: V276.5 Verify all 20 original rewards and native combat
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          cat > build/verify.rb <<'V2765_VERIFY'
          # encoding: UTF-8
          require 'json'
          module RPG
           class Map;end; class CommonEvent;end; class AudioFile;end
           class Event
            class Page
             class Condition;end;class Graphic;end
            end
           end
           class EventCommand;end;class MoveRoute;end;class MoveCommand;end
           class Item;end;class Weapon;end;class Armor;end
          end
          class Table
           def self._load(x);o=allocate;o.instance_variable_set(:@raw,x);o;end
           def _dump(level=0);@raw;end
          end
          class Tone
           def self._load(x);o=allocate;o.instance_variable_set(:@raw,x);o;end
           def _dump(level=0);@raw;end
          end
          class Color<Tone;end
          def iv(o,k);o.instance_variable_get('@'+k.to_s);end
          def ok(cond,msg);raise msg unless cond;end
          root='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          map=Marshal.load(File.binread(root+pre+'Map025.rxdata'))
          common=Marshal.load(File.binread(root+pre+'CommonEvents.rxdata'))
          boss=iv(map,:events).fetch(29)
          pages=iv(boss,:pages)
          ok(iv(boss,:name)=='제니스 퀸','Wrong boss')
          ok(pages[0,3].all?{|p|iv(p,:move_speed)==2},'Wrong speed2')
          ok(pages[0,3].all?{|p|iv(p,:move_frequency)==6},'Move frequency changed')
          ok(iv(iv(pages[2],:condition),:variable_id)==4988 && iv(iv(pages[2],:condition),:variable_value)==52,'HP52')
          ok(iv(iv(pages[1],:list)[0],:parameters)[0].include?(',52,2)'),'HUD52')
          ok(iv(pages[2],:list).map{|cmd|iv(cmd,:code)}==[355,230,116,0],'Native death/erase changed')
          ce=common.fetch(1063);cycle=iv(ce,:list)
          ok(iv(cycle[1],:parameters)==[5] && iv(cycle[3],:parameters)==[20],'25-frame 5+20')
          ok(iv(cycle[0],:parameters)[0].end_with?(',25)'),'Native start cycle 25')
          ok(iv(cycle[2],:parameters)==[1064],'Native attack reference')
          attack=iv(common[1064],:list)
          ok(attack.any?{|c|iv(c,:code)==122 && iv(c,:parameters)==[26,26,0,2,0,6]},'Native 6:1 attack branching')
          ok([50,100,150,300].all?{|v|attack.any?{|c|iv(c,:code)==122 && iv(c,:parameters)==[26,26,0,0,v]}},'Damage endpoints changed')
          ok(attack.any?{|c|iv(c,:code)==311 && iv(c,:parameters)==[1,1,0,80,false]},'Magic floor changed')
          script=iv(iv(pages[2],:list)[0],:parameters)[0]
          expected=[[:item,35,30],[:item,34,20],[:item,33,100],[:item,37,100],[:armor,169,50],[:item,116,3],[:item,32,100],[:item,38,100],[:armor,289,30],[:weapon,123,30],[:weapon,41,50],[:item,3,200],[:weapon,1,50],[:armor,72,50],[:item,2,250],[:armor,303,2],[:item,43,100],[:armor,280,30],[:armor,12,50],[:armor,492,3]]
          entries=script.scan(/\[:(item|weapon|armor),\s*(\d+),\s*(\d+)\]/).map{|k,i,r|[k.to_sym,i.to_i,r.to_i]}
          ok(entries==expected,'20 original item ID/type/rate changed')
          File.binwrite('build/reward-original.rb',script)
          ok(system('ruby','-c','build/reward-original.rb'),'Reward Ruby syntax')
          class DummyParty
           attr_reader :gold,:items
           def initialize;@gold=0;@items=[];end
           def gain_gold(n);@gold+=n;end
           def gain_item(id,n);@items << [:item,id,n];end
           def gain_weapon(id,n);@items << [:weapon,id,n];end
           def gain_armor(id,n);@items << [:armor,id,n];end
           def actors;[];end
          end
          class DummyActor
           attr_accessor :exp
           def initialize;@exp=0;end
          end
          $game_party=DummyParty.new
          $game_actors={1=>DummyActor.new}
          $game_variables=Hash.new(0)
          module Kernel
           alias zenith_real_rand rand
           def rand(max=nil);0;end
          end
          eval(script,TOPLEVEL_BINDING,'ZenithOriginalReward',1)
          ok($game_party.gold==64800 && $game_variables[333]==64800,'Adena reward')
          ok($game_actors[1].exp==43212 && $game_variables[1926]==43212,'Experience reward')
          ok($game_party.items==expected.map{|k,id,_|[k,id,1]},'Actual item gain calls')
          {:item=>'Items',:weapon=>'Weapons',:armor=>'Armors'}.each do |kind,name|
           data=Marshal.load(File.binread(root+pre+name+'.rxdata'))
           expected.select{|x|x[0]==kind}.each do |_,id,_|
            ok(!data[id].nil?,"Missing #{kind} #{id}")
           end
          end
          puts 'PASS native HP52, movement speed2/frequency6, attack 25, 6:1 physical/magic unchanged'
          puts 'PASS original death/erase and all 20 original reward IDs, rates and runtime calls'
          puts 'PASS Adena 64800 minimum EXP 43212; original Items/Weapons/Armors DB found'
          V2765_VERIFY
          ruby -c build/verify.rb
          ruby build/verify.rb

      - name: V276.5 Update only native RXData hashes and version labels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          cat > build/update.py <<'V2765_MAP'
          from pathlib import Path
          import hashlib,re
          root=Path('site')
          game=root/'knight/gameasync'
          mapping=game/'mapping.js'
          s=mapping.read_text(encoding='utf-8')
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          for rel in (pre+'Map025.rxdata',pre+'CommonEvents.rxdata'):
              path=game/'Data'/rel
              key='Data/'+rel
              digest=hashlib.md5(path.read_bytes()).hexdigest()
              patt='('+re.escape(key)+r'\?h=)[0-9a-f]{32}'
              s,num=re.subn(patt,lambda m:m.group(1)+digest,s)
              assert num==1,('Missing unique native RXData mapping',key,num)
          mapping.write_text(s,encoding='utf-8')
          loader=root/'knight/js/sl-assets-v229r115.js'
          s=loader.read_text('utf-8')
          assert s.count("var version='V276.2';")==1
          loader.write_text(s.replace("var version='V276.2';","var version='V276.5';"),encoding='utf-8')
          for rel in ('index.html','knight/index.html'):
              f=root/rel
              s=f.read_text('utf-8')
              assert 'V276.2' in s,rel
              f.write_text(s.replace('V276.2','V276.5').replace('v276.2','v276.5'),encoding='utf-8')
          print('PASS only two RXData hashes and V276.5 version identifiers updated')
          V2765_MAP
          python3 build/update.py
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: V276.5 Protect other monsters images and engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          cat > build/protect.py <<'V2765_PROTECT'
          from pathlib import Path
          import hashlib,json,os
          root=Path('site')
          before=json.loads(Path('build/before.json').read_text('utf-8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          pre='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          allowed={pre+'Map025.rxdata',pre+'CommonEvents.rxdata','knight/gameasync/mapping.js','knight/js/sl-assets-v229r115.js','index.html','knight/index.html'}
          assert set(before)==set(after),('Game file count differs',sorted(set(before)^set(after)))
          changed={p for p in before if before[p]!=after[p]}
          assert changed==allowed,('Unapproved modifications',sorted(changed^allowed))
          for p in before:
              if p.startswith('knight/gameasync/Graphics/'):
                  assert before[p]==after[p],('Original sprite changed',p)
              if p.startswith(pre+'Map') and p!=pre+'Map025.rxdata':
                  assert before[p]==after[p],('Other map changed',p)
          for p in ('knight/gameasync/Data/Scripts.rxdata',pre+'Map016.rxdata','knight/assets/map-047-v241.pack'):
              if p in before:assert before[p]==after[p],('Original protected resource changed',p)
          report=json.loads(Path('build/zenith-v2765-report.json').read_text('utf-8'))
          assert report['version']=='V276.5' and report['base']=='V276.2'
          assert report['test_hp']==52 and report['move_speed']==2 and report['attack_cycle']==25
          assert report['drops']==20 and report['graphics_changed']==False
          if os.environ.get('CI')=='true':assert len(before)==5606,('Unexpected baseline size',len(before))
          print('PASS only 6 approved files updated, 20 drops unchanged, all sprite scripts/maps protected')
          V2765_PROTECT
          python3 build/protect.py

      - name: V276.5 Publish V276.2 based game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
