           key='graphics/panoramas/'+name[:-4].lower()
           entries.append([key,len(payload),len(b)]);payload.extend(b)
          entries.append(['graphics/tilesets/slti_collision_transparent',len(payload),len(collision)])
          payload.extend(collision)
