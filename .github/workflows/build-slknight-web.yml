name: build-slknight-web.yml | V4.17 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Resolve final V4.16 deployment
        id: baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BASE_SHA=9cab02b37866199fa1236481d1beb380ea3eccfb

          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/build-slknight-web.yml/runs" \
            -f head_sha="$BASE_SHA" \
            -f status=success \
            -f per_page=100 \
            > /tmp/sl417-runs.json

          RUN_ID=$(jq -er \
            --arg sha "$BASE_SHA" \
            '[.workflow_runs[]
              | select(
                  .head_sha==$sha
                  and .head_branch=="main"
                  and .status=="completed"
                  and .conclusion=="success"
                )]
              | sort_by(.created_at)
              | last
              | .id // empty' \
            /tmp/sl417-runs.json)

          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" \
            > /tmp/sl417-jobs.json

          jq -e \
            '[.jobs[]
              | select(
                  .name=="deploy"
                  and .conclusion=="success"
                )]
              | length==1' \
            /tmp/sl417-jobs.json

          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            > /tmp/sl417-artifacts.json

          jq -e \
            '[.artifacts[]
              | select(
                  .name=="github-pages"
                  and .expired==false
                  and .size_in_bytes>0
                )]
              | length==1' \
            /tmp/sl417-artifacts.json

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Restore final V4.16 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: ${{ steps.baseline.outputs.run_id }}
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Restore pinned V4.17 creation source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SOURCE_SHA=f04f7ad307aa8fffb591c90617cc6b6627c671fa

          BLOB_SHA=ff897b15a4f299c57e4ee1c69abdb6c335157cc6

          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/contents/.github/workflows/build-slknight-web.yml" \
            -f ref="$SOURCE_SHA" \
            --jq '.content' \
            | base64 --decode \
            > /tmp/sl417-current.yml

          test "$(git hash-object /tmp/sl417-current.yml)" = "$BLOB_SHA"

          python3 - <<'PYTHON'
          from pathlib import Path

          src=Path('/tmp/sl417-current.yml').read_text('utf8')

          scripts={
              'Restore verified V4.17 source':
                  '/tmp/sl417-restore-source.sh',

              'Verify original game':
                  '/tmp/sl417-run-verify.sh',

              'Rebuild name-first creation screen':
                  '/tmp/sl417-run-creation.sh',

              'Verify all 22 name-first creation paths':
                  '/tmp/sl417-run-test.sh',

              'Update V4.17 data references':
                  '/tmp/sl417-run-mapping.sh',

              'Verify exact modification scope':
                  '/tmp/sl417-run-scope.sh'
          }

          for name,path in scripts.items():

              marker='      - name: '+name+'\n'

              assert src.count(marker)==1,name

              section=src.split(marker,1)[1].split(
                  '\n      - name: ',1
              )[0]

              anchor='        run: |\n'

              assert section.count(anchor)==1,name

              lines=section.split(anchor,1)[1].split('\n')

              out=[]

              for line in lines:

                  if line.startswith('          '):

                      out.append(line[10:])

                  elif line=='':

                      out.append(line)

                  else:

                      break

              text='\n'.join(out).rstrip()+'\n'

              assert text.startswith(
                  'set -euo pipefail\n'
              ),name

              Path(path).write_text(text,'utf8')

              print('PASS original step:',name)

          print('PASS pinned V4.17 source')
          PYTHON

          for script in \
            /tmp/sl417-restore-source.sh \
            /tmp/sl417-run-verify.sh \
            /tmp/sl417-run-creation.sh \
            /tmp/sl417-run-test.sh \
            /tmp/sl417-run-mapping.sh \
            /tmp/sl417-run-scope.sh
          do
            bash -n "$script"
          done

          bash -euo pipefail \
            /tmp/sl417-restore-source.sh

      - name: Verify original game
        shell: bash
        run: |
          set -euo pipefail

          bash -euo pipefail \
            /tmp/sl417-run-verify.sh

      - name: Restore unchanged character creation scene
        shell: bash
        run: |
          set -euo pipefail

          bash -euo pipefail \
            /tmp/sl417-run-creation.sh

      - name: Verify all 22 name-first creation paths
        shell: bash
        run: |
          set -euo pipefail

          bash -euo pipefail \
            /tmp/sl417-run-test.sh

      - name: Separate name keyboard from game controls
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl417-name.js <<'JAVASCRIPT'
          (function(){
            'use strict';

            const ui=SL417_UI;

            let form=null;
            let field=null;
            let status=null;
            let file=null;
            let rect=null;

            let composing=false;
            let submitted=false;
            let pendingSubmit=false;

            function layout(){

              if(!form||!form.isConnected)return;

              const c=document.getElementById(
                'canvas'
              ).getBoundingClientRect();

              const [x,y,w,h]=rect;

              const sx=c.width/800;
              const sy=c.height/600;

              Object.assign(form.style,{

                left:(c.left+x*sx)+'px',

                top:(c.top+y*sy)+'px',

                width:(w*sx)+'px',

                height:(h*sy)+'px',

                fontSize:Math.max(12,24*sy)+'px'
              });

              field.style.fontSize=
                Math.max(16,24*sy)+'px';
            }

            function write(flag){

              if(
                !field ||
                !file ||
                submitted ||
                (composing&&flag!=='2')
              )return;

              try{

                const raw=flag+'\n'+field.value;

                FS.writeFile(
                  file,
                  new TextEncoder().encode(raw)
                );

                if(
                  FS.readFile(
                    file,
                    {encoding:'utf8'}
                  )!==raw
                ){
                  throw Error('Name write mismatch');
                }

                submitted=flag==='1';

                status.textContent='';

                if(submitted){

                  pendingSubmit=false;

                  field.inputMode='none';

                  field.tabIndex=-1;

                  field.blur();

                  field.disabled=true;

                  form.remove();

                  document.getElementById(
                    'canvas'
                  ).focus({
                    preventScroll:true
                  });
                }

              }catch(e){

                status.textContent=String(
                  e.message
                );
              }
            }

            function close(){

              if(!form)return;

              field.blur();

              form.remove();

              try{

                if(
                  file &&
                  FS.analyzePath(file).exists
                ){
                  FS.unlink(file);
                }

              }catch(e){

                console.error(e);
              }

              form=field=status=file=rect=null;

              composing=submitted=pendingSubmit=false;

              document.getElementById(
                'canvas'
              ).focus({
                preventScroll:true
              });
            }

            function open(p){

              if(form)return;

              rect=p.slice(2,6).map(Number);

              file=p.slice(7).join('|');

              if(
                rect.some(v=>!Number.isFinite(v)) ||
                !file ||
                FS.readFile(
                  file,
                  {encoding:'utf8'}
                )!=='0\n'
              ){
                throw Error(
                  'Name input initialization'
                );
              }

              form=document.createElement('form');

              form.id='sl417-name-form';

              const label=document.createElement(
                'label'
              );

              label.htmlFor='sl417-name';

              label.textContent=ui.prompt;

              field=document.createElement('input');

              field.id='sl417-name';

              field.type='text';

              field.inputMode='text';

              field.enterKeyHint='done';

              field.maxLength=Number(p[6]);

              field.autocomplete='off';

              field.spellcheck=false;

              field.setAttribute(
                'autocapitalize',
                'off'
              );

              field.setAttribute(
                'aria-label',
                ui.prompt
              );

              field.placeholder='이름 입력 후 Enter';

              status=document.createElement('div');

              status.setAttribute(
                'role',
                'status'
              );

              status.style.cssText=
                'color:#ffff80;';

              form.style.cssText=
                'position:fixed;'+
                'z-index:4999;'+
                'margin:0;padding:0;border:0;'+
                'background:transparent;'+
                'color:white;'+
                'font-family:SL417Nanum,sans-serif;'+
                'display:flex;'+
                'flex-direction:column;'+
                'justify-content:center;'+
                'gap:1px;'+
                'pointer-events:none;'+
                'box-sizing:border-box;'+
                'text-align:center;'+
                'line-height:1.1;';

              field.style.cssText=
                'display:block;'+
                'width:100%;height:32px;'+
                'min-height:24px;'+
                'box-sizing:border-box;'+
                'border:0;'+
                'border-radius:0;'+
                'background:transparent;'+
                'color:white;'+
                'caret-color:white;'+
                'outline:0;'+
                'text-align:center;'+
                'font-family:inherit;'+
                'padding:0 4px;'+
                'pointer-events:auto;'+
                'user-select:text;'+
                '-webkit-user-select:text;'+
                'touch-action:manipulation;';

              form.append(
                label,
                field,
                status
              );

              document.getElementById(
                'main'
              ).append(form);

              field.addEventListener(
                'input',
                ()=>{
                  if(!composing)write('0');
                }
              );

              field.addEventListener(
                'compositionstart',
                ()=>{

                  composing=true;

                  write('2');
                }
              );

              field.addEventListener(
                'compositionend',
                ()=>{

                  composing=false;

                  if(pendingSubmit){

                    pendingSubmit=false;

                    write('1');

                  }else{

                    write('0');
                  }
                }
              );

              form.addEventListener(
                'submit',
                e=>{

                  e.preventDefault();

                  if(composing){

                    pendingSubmit=true;

                    return;
                  }

                  write('1');
                }
              );

              [
                'pointerdown',
                'pointerup',
                'mousedown',
                'mouseup',
                'click',
                'touchstart',
                'touchend'
              ].forEach(t=>{

                field.addEventListener(
                  t,
                  e=>e.stopPropagation()
                );
              });

              layout();

              field.focus({
                preventScroll:true
              });
            }

            document.addEventListener(
              'pointerdown',
              e=>{

                if(
                  !field ||
                  submitted ||
                  document.activeElement!==field
                )return;

                if(
                  e.target instanceof Element &&
                  e.target.closest('#sl-pad')
                ){

                  field.blur();

                  document.getElementById(
                    'canvas'
                  ).focus({
                    preventScroll:true
                  });
                }

              },
              true
            );

            [
              'keydown',
              'keyup',
              'keypress'
            ].forEach(t=>{

              window.addEventListener(t,e=>{

                if(
                  !field ||
                  e.target!==field
                )return;

                if(
                  t==='keydown' &&
                  e.key==='Enter' &&
                  !composing &&
                  !e.isComposing &&
                  e.keyCode!==229
                ){

                  e.preventDefault();

                  write('1');
                }

                e.stopImmediatePropagation();

              },true);
            });

            const resize=
              ()=>requestAnimationFrame(layout);

            window.addEventListener(
              'resize',
              resize
            );

            document.addEventListener(
              'fullscreenchange',
              resize
            );

            if(window.visualViewport){

              visualViewport.addEventListener(
                'resize',
                resize
              );

              visualViewport.addEventListener(
                'scroll',
                resize
              );
            }

            window.sl417NameMessage=function(text){

              const s=String(text).trim();

              try{

                if(s.startsWith('SL417|NAME|')){

                  open(s.split('|'));

                }else if(
                  s==='SL417|NAME_READY' ||
                  s==='SL417|NAME_CLOSE'
                ){

                  close();

                }else if(
                  s==='SL417|NAME_RETRY' &&
                  field &&
                  submitted
                ){

                  submitted=false;

                  composing=pendingSubmit=false;

                  status.textContent=ui.error;

                  field.disabled=false;

                  field.inputMode='text';

                  field.tabIndex=0;

                  document.getElementById(
                    'main'
                  ).append(form);

                  layout();

                }else if(
                  s.startsWith('SL417|FAIL|')
                ){

                  const m=s.split('|').slice(2).join(' | ');

                  if(status){

                    status.textContent=m;

                  }else{

                    console.error(m);
                  }
                }

              }catch(e){

                if(status){

                  status.textContent=String(
                    e.message
                  );
                }

                console.error(
                  'SL417_NAME',
                  e
                );
              }
            };
          })();
          JAVASCRIPT

          node --check /tmp/sl417-name.js

          python3 - <<'PYTHON'
          from pathlib import Path

          js=Path('/tmp/sl417-name.js').read_text('utf8')

          assert js.count("field.focus({")==1

          assert 'z-index:4999;' in js

          assert 'z-index:2147483647;' not in js

          assert "field.inputMode='none';" in js

          assert 'field.disabled=true;' in js

          assert 'field.blur();' in js

          assert 'form.remove();' in js

          assert "e.target.closest('#sl-pad')" in js

          assert 'simulateKeyEvent' not in js

          assert "document.createElement('button')" not in js

          assert "document.createElement('dialog')" not in js

          start=js.index('if(submitted){')

          end=js.index('}catch(e){',start)

          submission=js[start:end]

          assert 'field.blur();' in submission

          assert 'form.remove();' in submission

          assert 'FS.unlink' not in submission

          start=js.index("s==='SL417|NAME_RETRY'")

          end=js.index("s.startsWith('SL417|FAIL|')",start)

          retry=js[start:end]

          assert 'field.focus' not in retry

          assert 'field.disabled=false;' in retry

          assert 'append(form)' in retry

          print('PASS immediate keyboard focus release')

          print('PASS input detached before game acknowledgment')

          print('PASS name data retained until acknowledgment')

          print('PASS game controls above input layer')

          print('PASS no automatic keyboard reopening on retry')
          PYTHON

          bash -euo pipefail \
            /tmp/sl417-install-name.sh

      - name: Update V4.17 data references
        shell: bash
        run: |
          set -euo pipefail

          bash -euo pipefail \
            /tmp/sl417-run-mapping.sh

      - name: Verify exact modification scope
        shell: bash
        run: |
          set -euo pipefail

          bash -euo pipefail \
            /tmp/sl417-run-scope.sh

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib,json

          root=Path('site')

          before=json.loads(
              Path('/tmp/sl417-before.json').read_text('utf8')
          )

          protected=[
              'knight/js/dpad.js',
              'knight/js/drive.js',
              'knight/mkxp.js',
              'knight/mkxp.wasm',
              'knight/gameasync/bitmap-map.js'
          ]

          for name in protected:

              assert name in before,name

              digest=hashlib.sha256(
                  (root/name).read_bytes()
              ).hexdigest()

              assert digest==before[name],name

          html=(root/'knight/index.html').read_text('utf8')

          assert 'SL417|NAME_READY' in html

          assert "field.inputMode='none';" in html

          assert 'field.disabled=true;' in html

          assert 'z-index:4999;' in html

          assert "e.target.closest('#sl-pad')" in html

          print('PASS original direction controls unchanged')

          print('PASS original ATK controls unchanged')

          print('PASS original character creation scene retained')

          print('PASS name keyboard separated from game controls')

          print('PASS V4.17')
          PYTHON

      - name: Upload V4.17
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
