            function safe(a){if(!a||!a.src)return;try{var p=a.play();if(p&&p.catch)p.catch(function(){if(pending.indexOf(a)<0)pending.push(a);});}catch(e){if(pending.indexOf(a)<0)pending.push(a);}}
