          test -s player/gameasync/bitmap-map.js
          test ! -e player/core.pack
          test "$(find player -maxdepth 1 -type f -name '*.data' | wc -l)" -eq 0

          grep -Fq 'slknight_v14_engine' player/index.html
          grep -Fq 'width="800" height="600"' player/index.html
          grep -Fq 'initSLTouchControls();' player/index.html
          grep -Fq 'id="sl-btn-item">I</div>' player/index.html
          grep -Fq 'id="sl-btn-equip">E</div>' player/index.html
          grep -Fq 'sl-btn-main' player/index.html
          grep -Fq 'sl-joy-zone' player/index.html
          grep -Fq 'window.slEquipLoading' player/index.html
          grep -Fq 'forceRealBitmap' player/js/drive.js
          grep -Fq 'mappingKey.indexOf("graphics/icons/") === 0' player/js/drive.js
          grep -Fq 'restoreLocalFilesBeforeRun' player/js/drive.js
          grep -Fq "console.log('SLSAVED|'+filename)" player/js/drive.js
          grep -Fq "['sl-btn-item',73]" player/js/dpad.js
          grep -Fq "['sl-btn-equip',69]" player/js/dpad.js
          node --check player/js/drive.js
          node --check player/js/dpad.js

          ruby -EUTF-8:UTF-8 -rzlib - player/gameasync/Data/Scripts.rxdata <<'RB'
          a=Marshal.load(File.binread(ARGV[0]))
          def s(a,n)
            e=a.find{|x|x.is_a?(Array)&&x.length>=3&&x[1].to_s==n}
            abort("missing #{n}") unless e
            Zlib::Inflate.inflate(e[2]).force_encoding(Encoding::UTF_8)
          end

          item=s(a,'Scene_Item')
          skill=s(a,'Scene_Skill')
          equip=s(a,'Scene_Equip')
          map=s(a,'Scene_Map')
          save=s(a,'Scene_Save')
          main=s(a,'Main')
          multi=s(a,'Multi-slot script : Windows')
          compat=s(a,'Web Compatibility')

          abort 'item lifecycle broken' unless item.include?('def main')&&item.include?('def dispose')&&item.include?('def update')
          abort 'skill lifecycle broken' unless skill.include?('def main')&&skill.include?('def dispose')&&skill.include?('def update')
          abort 'equip blocking loop remains' if equip.match?(/loop do.*?Graphics\.update.*?Input\.update.*?update/m)
          abort 'equip poison switch remains' if equip.include?('$game_switches[49] = true')
          abort 'equip E-close remains' if equip.include?("if Keyboard.testkey(69)")
          abort 'equip BEGIN marker missing' unless equip.include?("puts('SLEQUIPBEGIN')")
          abort 'equip READY marker missing' unless equip.include?("puts('SLEQUIPREADY')")
          abort 'multislot dispose missing' unless multi.include?('g7_ms_scene_equip_dispose')
          abort 'map I shortcut missing' unless map.include?('Keyboard.testkey(73)')&&map.include?('$scene = Scene_Item.new')
          abort 'map E shortcut missing' unless map.include?('Keyboard.testkey(69)')&&map.include?('$scene = Scene_Equip.new')
          abort 'browser map driver missing' unless main.include?('web_pre_update')
          abort 'raw E bridge missing' unless compat.include?('when 69 then Input::F5')
          abort 'raw I bridge missing' unless compat.include?('when 73 then Input::F6')
          abort 'save persistence missing' unless save.include?('file.close')&&save.include?('save_file_async(filename)')
          abort 'save menu flow changed' unless save.scan('$scene = Scene_Menu.new(4)').size==2
          abort 'save event flow changed' unless save.scan('$scene = Scene_Map.new').size==2
          abort 'resolution inactive' unless Zlib::Inflate.inflate(a[97][2]).include?('Graphics.resize_screen')&&Zlib::Inflate.inflate(a[97][2]).include?('$WINDOW_WIDTH = 800')
          abort 'defined joiplay remains' if a.any?{|e|e.is_a?(Array)&&e.length>=3&&((Zlib::Inflate.inflate(e[2]).include?('defined?($joiplay)')) rescue false)}
          puts 'SCRIPT_VERIFY_OK'
          RB

          ruby - <<'RB'
          module RPG
            class Item;end
            class AudioFile;end
          end
          p=Dir.glob('player/gameasync/Data/*Items.rxdata').max_by{|x|File.size(x)}
          a=Marshal.load(File.binread(p))
          abort 'courage item CE wrong' unless a[3].instance_variable_get(:@common_event_id)==8
          abort 'transform item CE wrong' unless a[17].instance_variable_get(:@common_event_id)==6
          puts 'ITEM_VERIFY_OK'
          RB

          rm -rf player/.git
          du -sh player

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with: {path: player}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
