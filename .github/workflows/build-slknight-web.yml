name: build-slknight-web.yml | V4.11 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Restore V4.10 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45926982327
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Restore verified V4.11 build resources
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45945910468
          name: github-pages
          github-token: ${{ github.token }}
          path: previous

      - name: Verify original and approved V4.11 resources
        shell: bash
        run: |
          set -euo pipefail

          test -s baseline/artifact.tar
          test -s previous/artifact.tar
          mkdir -p site candidate
          tar -xf baseline/artifact.tar -C site
          tar -xf previous/artifact.tar -C candidate

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re,shutil

          root=Path('site')
          prior=Path('candidate')
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          game='knight/gameasync/'

          def inventory(p):
              return {
                  f.relative_to(p).as_posix():hashlib.sha256(f.read_bytes()).hexdigest()
                  for f in p.rglob('*') if f.is_file()
              }

          before=inventory(root)
          old=inventory(prior)

          assert len(before)==6033,len(before)
          assert len(old)==6085,len(old)
          assert not set(before)-set(old)

          loader='knight/js/sl-assets-v229r115.js'

          assert (root/loader).read_bytes().count(b"var version='V4.10';")==1
          assert (prior/loader).read_bytes().count(b"var version='V4.11';")==1

          scripts=game+'Data/Scripts.rxdata'

          allowed={scripts}|{
              game+'Data/'+pre+f'Map{mid:03d}.rxdata'
              for mid in (29,47,48,49,50)
          }|{
              game+'mapping.js',
              game+'bitmap-map.js',
              'knight/assets/shared-v229r115.pack',
              loader,
              'index.html',
              'knight/index.html'
          }

          changed={k for k in before if before[k]!=old[k]}
          added=set(old)-set(before)

          assert changed==allowed,sorted(changed^allowed)
          assert len(added)==52

          forms={3213,3215,3217,3474,3476,3221,2786,2796}
          deaths=set()
          motions=set()

          for k in sorted(added):

              m=re.fullmatch(
                  re.escape(game+'Graphics/Characters/')+
                  r'SL411_(\d+)_(bare|sword|bow|staff|dagger|tohandsword|edoryu|claw|death)\.png',
                  k
              )

              assert m,k

              body=int(m[1])
              typ=m[2]

              assert body in forms,k

              assert (prior/k).read_bytes()[:8]==b'\x89PNG\r\n\x1a\n',k

              if typ=='death':
                  deaths.add(body)
              else:
                  motions.add((body,typ))

          assert deaths==forms
          assert len(motions)==44
          assert {b for b,t in motions}==forms

          for k in sorted((allowed-{scripts})|added):

              p=root/k
              p.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(prior/k,p)

          assert hashlib.sha256(
              (root/scripts).read_bytes()
          ).hexdigest()==before[scripts]

          Path('/tmp/sl411-base.json').write_text(
              json.dumps(before,sort_keys=True),'utf8'
          )

          Path('/tmp/sl411-prior.json').write_text(
              json.dumps(old,sort_keys=True),'utf8'
          )

          Path('/tmp/sl411-approved.json').write_text(
              json.dumps(sorted(allowed)),'utf8'
          )

          print('PASS V4.10 original files:',len(before))
          print('PASS previous V4.11 approved changes:',len(allowed))
          print('PASS reuse 44 weapon motions and 8 death sheets')
          PY

      - name: Repair target sharing and reciprocal collision
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl411-repair.rb <<'RUBY'
          # encoding: UTF-8
          require 'zlib'

          def once(s,a,b)

            n=s.scan(a).size

            raise "Anchor #{a.inspect[0,120]}: #{n}" unless n==1

            s.sub(a){b}

          end

          def method_replace(s,name,body)

            once(
              s,
              /^  def #{Regexp.escape(name)}(?:\([^\n]*\))?\n.*?^  end\n/m,
              body
            )

          end

          def repair23(s)

            a=s.lines.select{|l|
              l.include?('return false if (self==$game_player || sl46_slot)') &&
              l.include?('@sl_healer_teleport')
            }

            raise 'Original collision guard' unless a.size==1

            once(s,a[0],<<~'SRC'.gsub(/^/,'    '))
            return false if (self==$game_player || sl46_slot || @sl_combat_event) && $game_map.events.values.any?{|e|

              next false if e==self

              occupied=e.x==new_x && e.y==new_y

              near=e.moving? &&
                (e.real_x-new_x*128).abs<64 &&
                (e.real_y-new_y*128).abs<64

              if e.sl46_slot

                pending=e.instance_variable_get(:@sl_healer_teleport)

                occupied ||
                  (pending && pending[0,2]==[new_x,new_y]) ||
                  (@sl_combat_event && near)

              elsif sl46_slot &&
                    (occupied || near) &&
                    e.instance_variable_get(:@sl_combat_event)

                !SL411.enemy(e.id).nil?

              else

                false

              end
            }
            SRC

          end

          def repair25(s)

            a=/^([ \t]*)return if companion_target &&\s+SL411\.in_range\?\(\s*self,companion_target,w\[6\]=='bow'\s*\)\n/

            matches=s.scan(a)

            raise 'Original pursuit guard' unless matches.size==1

            pad=matches[0][0]

            s=once(s,a,<<~'SRC'.gsub(/^/,pad))
            if companion_target

              bow=w[6]=='bow'

              return if SL411.in_range?(self,companion_target,bow)

              queue=[[@x,@y,nil]]
              seen={[@x,@y]=>true}
              pos=0
              step=nil

              while pos<queue.size

                x,y,first=queue[pos]
                pos+=1

                if first && SL411.in_range?(
                  self,companion_target,bow,x,y
                )

                  step=first
                  break

                end

                [2,4,6,8].each do |d|

                  nx=x+(d==6 ? 1 : d==4 ? -1 : 0)
                  ny=y+(d==2 ? 1 : d==8 ? -1 : 0)

                  next unless $game_map.valid?(nx,ny)

                  next if (nx-$game_player.x).abs+
                    (ny-$game_player.y).abs>=12

                  key=[nx,ny]

                  next if seen[key]

                  next if nx==companion_target.x &&
                    ny==companion_target.y

                  next if sl46_occupied?(nx,ny) ||
                    !passable?(x,y,d)

                  seen[key]=true

                  queue<<[nx,ny,first || d]

                end
              end

              case step
              when 2; move_down
              when 4; move_left
              when 6; move_right
              when 8; move_up
              end

              return

            end
            SRC

            a=s.lines.select{|l|
              l.include?('if d == 0 || $game_map.events.values.any?') &&
              l.include?('e.sl46_slot<sl46_slot')
            }

            raise 'Original overlap branch' unless a.size==1

            once(
              s,
              a[0],
              a[0][/^\s*/]+
              "if d == 0 || $game_map.events.values.any?{|e|e!=self && e.x==@x && e.y==@y && ((e.sl46_slot && sl46_slot && e.sl46_slot<sl46_slot) || (sl46_slot && SL411.enemy(e.id)))}\n"
            )

          end

          def repair26(s)

            s=method_replace(
              s,
              'self.enemy',
              <<~'SRC'.gsub(/^/,'  ')
              def self.enemy(eid)

                return nil unless eid && eid>0

                mid=$game_map.map_id
                e=$game_map.events[eid]

                info=SLV541.stat(mid,eid)

                return nil unless e && info &&
                  SL49.stats(mid,eid) &&
                  e.instance_variable_get(:@sl_combat_event) &&
                  [1,2].include?(e.trigger) &&
                  e.list &&
                  e.list.any?{|c|c.code==111 && c.parameters==[11,13]} &&
                  e.character_name!='' &&
                  !e.transparent &&
                  !e.instance_variable_get(:@erased) &&
                  $game_variables[info[6]].to_i<info[4] &&
                  !SLV541.rewarded?(mid,eid)

                e

              end
            SRC
            )

            s=method_replace(
              s,
              'self.target_for',
              <<~'SRC'.gsub(/^/,'  ')
              def self.target_for(e)

                return nil unless @focus_events.equal?(
                  $game_map.events
                )

                t=enemy(@focus)

                unless t

                  @focus=nil

                  return nil

                end

                return nil if distance(t,$game_player)>=12 ||
                  distance(e,$game_player)>=12

                t

              end
            SRC
            )

            s=method_replace(
              s,
              'self.in_range?',
              <<~'SRC'.gsub(/^/,'  ')
              def self.in_range?(e,t,bow,x=e.x,y=e.y)

                dx=t.x-x
                dy=t.y-y

                d=dx.abs+dy.abs

                return d==1 unless bow

                return false unless d.between?(1,8)

                while x!=t.x || y!=t.y

                  rx=t.x-x
                  ry=t.y-y

                  dir=rx.abs>=ry.abs && rx!=0 ?
                    (rx>0 ? 6 : 4) :
                    (ry>0 ? 2 : 8)

                  nx=x+(dir==6 ? 1 : dir==4 ? -1 : 0)
                  ny=y+(dir==2 ? 1 : dir==8 ? -1 : 0)

                  return false unless
                    $game_map.passable?(x,y,dir,e) &&
                    $game_map.passable?(nx,ny,10-dir,e)

                  x=nx
                  y=ny

                end

                true

              end
            SRC
            )

            s=once(
              s,
              't=SL411.enemy(p[1])',
              't=SL411.target_for(self); t=nil if t && t.id!=p[1]'
            )

            a=/a\.weapon_id!=p\[4\]\s*\|\|\s*elapsed<0\s*\|\|\s*elapsed>=duration\s*\|\|\s*!t/

            s=once(
              s,
              a,
              "a.weapon_id!=p[4] || elapsed<0 || elapsed>=duration || !t || !SL411.in_range?(self,t,w[6]=='bow')"
            )

            s=once(
              s,
              "if SL411.in_range?(self,t,w[6]=='bow')",
              "if SL411.in_range?(self,t,w[6]=='bow') && t.list.any?{|c|c.code==355 && c.parameters[0,3]==['SL49_PC_PREP',$game_map.map_id,t.id]}"
            )

            tick=s[
              /^  def sl411_tick\(id\)\n.*?^  end\n/m
            ]

            raise 'Companion attack tick' unless tick

            revised=once(
              tick,
              'return false unless t',
              "return false unless t\n    return false unless t.list.any?{|c|c.code==355 && c.parameters[0,3]==['SL49_PC_PREP',$game_map.map_id,t.id]}"
            )

            once(s,tick,revised)

          end

          def repair27(s)

            n=0

            s=s.gsub(
              /^( +)event\.start\n( +)result = true$/
            ) do

              a,b=$1,$2

              n+=1

              "#{a}event.start\n#{a}SL411.mark_target($game_map.map_id,event.id) if event.starting && Input.press?(13)\n#{b}result = true"

            end

            raise "Player attack starts #{n}" unless n==4

            s

          end

          def repair71(s)

            once(
              s,
              '          @sl_attack_target = [1] if result',
              <<~'SRC'.chomp.gsub(/^/,'          ')
              if result

                @sl_attack_target = [1]

                SL411.mark_target(
                  $game_map.map_id,@event_id
                )

              end
            SRC
            )

          end

          if __FILE__==$0

            basefile,candidate,out=ARGV

            base=Marshal.load(File.binread(basefile))
            rows=Marshal.load(File.binread(candidate))

            raise 'Script count' unless
              base.size==137 && rows.size==137

            prior=[25,26,28,69,70,71,72,73,74,75]

            fixes=[23,25,26,27,71]

            names={
              23=>'Game_Character 1',
              25=>'Game_Character 3',
              26=>'Game_Event',
              27=>'Game_Player',
              28=>'Sprite_Character',
              69=>'Interpreter 1',
              70=>'Interpreter 2',
              71=>'Interpreter 3',
              72=>'Interpreter 4',
              73=>'Interpreter 5',
              74=>'Interpreter 6',
              75=>'Interpreter 7'
            }

            names.each do |i,n|

              raise n unless
                base[i][1].dup.force_encoding('UTF-8')==n &&
                rows[i][1].dup.force_encoding('UTF-8')==n

            end

            raise 'Previous scope' unless rows.each_index.select{
              |i|Marshal.dump(rows[i])!=Marshal.dump(base[i])
            }==prior

            snapshot=rows.map{|r|Marshal.dump(r)}

            fixes.each do |i|

              old=Zlib::Inflate.inflate(
                rows[i][2]
              ).force_encoding('UTF-8')

              raise 'Encoding' unless old.valid_encoding?

              s=old.gsub("\r\n","\n")

              t=case i

                when 23; repair23(s)
                when 25; repair25(s)
                when 26; repair26(s)
                when 27; repair27(s)
                when 71; repair71(s)

              end

              raise 'No repair' if t==s

              RubyVM::InstructionSequence.compile(t)

              raise 'Interpreter 3 size' if i==71 &&
                t.bytesize>32000

              rows[i][2]=Zlib::Deflate.deflate(
                old.include?("\r\n") ?
                t.gsub("\n","\r\n").b :
                t.b
              )

              File.write(
                "/tmp/sl411-repair-#{i}.rb",t
              )

            end

            raise 'Repair scope' unless rows.each_index.select{
              |i|Marshal.dump(rows[i])!=snapshot[i]
            }==fixes

            allowed=(prior|fixes).sort

            raise 'Baseline scope' unless rows.each_index.select{
              |i|Marshal.dump(rows[i])!=Marshal.dump(base[i])
            }==allowed

            result=base.dup

            allowed.each{|i|result[i]=rows[i]}

            raise 'Reconstruction' unless
              Marshal.dump(result)==Marshal.dump(rows)

            raw=Marshal.dump(result)

            File.binwrite(out,raw)

            raise 'Roundtrip' unless Marshal.dump(
              Marshal.load(File.binread(out))
            )==raw

            puts "PASS corrected original scripts #{fixes.inspect}"

          end
          RUBY

          ruby -c /tmp/sl411-repair.rb

          ruby /tmp/sl411-repair.rb \
            site/knight/gameasync/Data/Scripts.rxdata \
            candidate/knight/gameasync/Data/Scripts.rxdata \
            site/knight/gameasync/Data/Scripts.rxdata

      - name: Audit every original companion and attack page
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl411-audit.rb <<'RUBY'
          # encoding: UTF-8

          module RPG

            %w[
              Map MapInfo Event EventCommand MoveRoute
              MoveCommand AudioFile CommonEvent
            ].each{|n|const_set(n,Class.new)}

            Event.const_set(:Page,Class.new)
            Event::Page.const_set(:Condition,Class.new)
            Event::Page.const_set(:Graphic,Class.new)

          end

          %w[Table Tone Color].each do |n|

            Object.const_set(n,Class.new do

              def self._load(raw)

                o=allocate
                o.instance_variable_set(:@raw,raw)
                o

              end

            end)

          end

          def iv(o,k)
            o.instance_variable_get(k)
          end

          root=ARGV.fetch(0)

          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          stats=Marshal.load(
            File.binread(
              File.join(root,pre+'MonsterStats.rxdata')
            )
          )

          raise 'Monster data count' unless stats.size==421

          maps=Dir.glob(
            File.join(root,pre+'Map[0-9][0-9][0-9].rxdata')
          ).sort

          raise 'Map count' unless maps.size==46

          counts=Hash.new(0)
          enemies={}

          maps.each do |f|

            mid=f[/Map(\d+)\.rxdata$/,1].to_i

            map=Marshal.load(File.binread(f))

            iv(map,:@events).each do |eid,e|

              pages=iv(e,:@pages)

              name=iv(e,:@name).to_s.dup.force_encoding('UTF-8')

              if name.start_with?('동료 ')

                p=pages[0]

                c=iv(p,:@condition)

                if iv(c,:@switch1_valid) &&
                   (2001..2003).include?(iv(c,:@switch1_id))

                  raise 'Original companion route' unless
                    iv(p,:@through) &&
                    iv(iv(p,:@move_route),:@list).map{
                      |x|iv(x,:@code)
                    }==[10,0]

                  counts[:companions]+=1

                end
              end

              next unless stats.key?([mid,eid])

              flag=pages.any?{|p|

                iv(p,:@trigger)==2 &&
                iv(p,:@list).any?{|c|
                  iv(c,:@code)==111 &&
                  iv(c,:@parameters)==[11,13]
                }

              }

              pages.each do |p|

                list=iv(p,:@list)

                input=list.any?{|c|

                  iv(c,:@code)==111 &&
                  iv(c,:@parameters)==[11,13]

                }

                prep=list.select{|c|

                  iv(c,:@code)==355 &&
                  iv(c,:@parameters)[0]=='SL49_PC_PREP'

                }

                done=list.select{|c|

                  iv(c,:@code)==355 &&
                  iv(c,:@parameters)[0]=='SL49_PC_DONE'

                }

                raise 'Unpaired attacks' unless
                  prep.size==done.size

                if prep.empty?

                  counts[:waking]+=1 if
                    flag && input &&
                    [1,2].include?(iv(p,:@trigger))

                  next

                end

                raise 'Attack page excluded' unless
                  flag && input &&
                  [1,2].include?(iv(p,:@trigger))

                raise 'Target ID mismatch' unless
                  (prep+done).all?{|c|
                    iv(c,:@parameters)[1,2]==[mid,eid]
                  }

                counts[:pages]+=1
                counts[:prep]+=prep.size
                counts[:done]+=done.size

                counts[:trigger1]+=1 if iv(p,:@trigger)==1

                enemies[[mid,eid]]=true

              end
            end
          end

          expected={
            companions:138,
            pages:436,
            trigger1:16,
            waking:67,
            prep:1696,
            done:1696
          }

          raise "Route audit #{counts.inspect}" unless
            counts==expected

          raise 'Attack event count' unless enemies.size==420

          puts "PASS #{counts.inspect}, enemies #{enemies.size}"
          RUBY

          ruby -c /tmp/sl411-audit.rb

          ruby /tmp/sl411-audit.rb \
            site/knight/gameasync/Data

      - name: Verify original weapons motions and L1J damage
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl411-weapons.rb <<'RUBY'
          # encoding: UTF-8

          require 'zlib'

          root=ARGV.fetch(0)

          rows=Marshal.load(
            File.binread(
              File.join(root,'Scripts.rxdata')
            )
          )

          class Game_Character;end
          class Interpreter;end

          [26,71].each do |i|

            eval(
              Zlib::Inflate.inflate(rows[i][2]).force_encoding('UTF-8'),
              TOPLEVEL_BINDING,
              "source-#{i}"
            )

          end

          module RPG
            class Weapon;end
          end

          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          $data_weapons=Marshal.load(
            File.binread(
              File.join(root,pre+'Weapons.rxdata')
            )
          )

          $repair_data_root=root

          def load_data(path)

            Marshal.load(
              File.binread(
                File.join(
                  $repair_data_root,
                  File.basename(path)
                )
              )
            )

          end

          $game_variables=Hash.new(0)
          $game_switches=Hash.new(false)

          $game_party=Object.new

          def $game_party.item_number(id);1000;end
          def $game_party.lose_item(id,n);end

          actor=Struct.new(
            :id,
            :weapon_id,
            :level,
            :str,
            :dex
          )

          srand(411)

          {
            '기사'=>[170,'sword'],
            '요정'=>[1000,'bow'],
            '법사'=>[1001,'staff'],
            '다엘'=>[1002,'edoryu']
          }.each do |job,(weapon,typ)|

            %w[남 여].each do |sex|

              a=actor.new(4,weapon,50,20,18)

              a.instance_variable_set(
                :@sl43_form,sex+job
              )

              a.instance_variable_set(
                :@sl43_stats,[20,18,14,8,12,12]
              )

              w=SL49.weapon(a)

              raise "Weapon #{sex+job}" unless
                w && w[6]==typ

              m=SL411.motion(a)

              raise "Motion #{sex+job}" unless
                m && m[1]>0 &&
                m[2].between?(0,5)

              raise "L1J #{sex+job}" unless
                40.times.any?{|_|
                  d=SL49.pc_attack(a,3,5,w)
                  d && d>0
                }

              puts "PASS #{sex+job}: original weapon, motion, L1J calculation"

            end
          end
          RUBY

          ruby -c /tmp/sl411-weapons.rb

          ruby /tmp/sl411-weapons.rb \
            site/knight/gameasync/Data

      - name: Test native collision movement and shared target execution
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl411-test.rb <<'RUBY'
          # encoding: UTF-8

          require 'zlib'
          require 'ostruct'

          rows=Marshal.load(
            File.binread(ARGV.fetch(0))
          )

          src=->(i){
            Zlib::Inflate.inflate(
              rows[i][2]
            ).force_encoding('UTF-8').gsub("\r\n","\n")
          }

          [21,23,24,25,26,27].each do |i|

            eval(
              src.call(i),
              TOPLEVEL_BINDING,
              "script-#{i}"
            )

          end

          def check(x,s)

            raise s unless x

            puts "PASS #{s}"

          end

          Command=Struct.new(:code,:parameters)
          Condition=Struct.new(:switch1_valid,:switch1_id)
          Page=Struct.new(:condition)
          EventSource=Struct.new(:name,:pages)
          Actor=Struct.new(:id,:hp,:weapon_id,:character_name)
          Route=Struct.new(:list,:repeat,:skippable)

          module Graphics

            class << self
              attr_accessor :frame_count
            end

          end

          module Input

            def self.press?(k)
              k==13
            end

          end

          module SLV229

            module Speed

              ATTACK_TIMINGS={
                1=>[[30,15],[24,11],[18,11]]
              }

            end

          end

          module SLV541

            def self.stat(mid,eid)

              mid==3 && [5,6,7].include?(eid) ?
                [0,0,nil,nil,500,2,100+eid] :
                nil

            end

            def self.rewarded?(mid,eid)
              false
            end

          end

          module SL49

