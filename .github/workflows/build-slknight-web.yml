
# SLKnight V1.24: exact user-confirmed V1.23 successful deployed game as baseline.
# Monster movement rates and Girtas expedition Map043/044 only.
name: build-slknight-web.yml | V1.24 | Monster Speed and Remove Girt Expedition

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Restore user-confirmed V1.23 successful deployed game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 42977701166
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify V1.23 baseline and record exact originals
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build/v123_original/knight/gameasync
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY_V124_BEFORE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          assert len(before)==5624, ('V1.23 baseline file count',len(before))
          pre='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          needed=['knight/gameasync/Data/Scripts.rxdata',pre+'MapInfos.rxdata',
                  pre+'Map040.rxdata',pre+'Map043.rxdata',pre+'Map044.rxdata',
                  'knight/assets/map-043-v229r115.pack','knight/assets/map-044-v229r115.pack',
                  'knight/gameasync/mapping.js','knight/index.html','index.html',
                  'knight/js/sl-assets-v229r115.js']
          assert all(name in before for name in needed), 'V1.23 source is incomplete'
          assert "var version='V1.23';" in (root/'knight/js/sl-assets-v229r115.js').read_text('utf8')
          assert 'SLKnight V1.23' in (root/'knight/index.html').read_text('utf8')
          Path('build/v123_hashes.json').write_text(json.dumps(before),encoding='utf8')
          print('PASS exact successful V1.23 artifact, 5624 original files')
          PY_V124_BEFORE
          cp -a site/knight/gameasync/Data build/v123_original/knight/gameasync/Data
          cp site/knight/gameasync/mapping.js build/v123_mapping.js
          cp site/knight/index.html build/v123_knight_index.html
          cp site/index.html build/v123_root_index.html
          cp site/knight/js/sl-assets-v229r115.js build/v123_assets.js

