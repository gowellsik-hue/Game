
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V1.1
# SOURCE: successful game run 41969829452
#
# Keep existing native gameplay and Queen repairs.
# Keep all existing polymorph attack speeds.
# Keep all existing attack frames and damage timing.
# Reuse SLV229::Speed; do not add another update hook.
# Holy Walk: native event 801 status, movement x1.33 only.
# Slow: reuse existing native status when uniquely identifiable.
# No duplicate status timer or extra attack calculation.
# Stop safely on unexpected source data.

name: build-slknight-web.yml | V1.1 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Restore verified game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41969829452
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify original game
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path('site')
          files = {
              str(p.relative_to(root)):
                  hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }
          assert len(files) == 5623, len(files)

          pre = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          data = root / 'knight/gameasync/Data'

          for filename in (
              pre + 'Map019.rxdata',
              pre + 'Map025.rxdata',
              pre + 'CommonEvents.rxdata',
              pre + 'Animations.rxdata',
              'Scripts.rxdata'
          ):
              assert (data / filename).is_file(), filename

          for filename in ('index.html', 'knight/index.html'):
              assert (root / filename).is_file(), filename

          Path('build/original_sha256.json').write_text(
              json.dumps(files), encoding='utf-8'
          )
          print('PASS verified game')
          PY

      - name: Retain native Queen recovery and death repairs
        shell: bash
        run: |
          set -euo pipefail

          cat > build/queen_native.rb <<'RUBY'
          module RPG
            class Map; end
            class Event
              class Page
                class Condition; end
                class Graphic; end
              end
            end
            class CommonEvent; end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
            class AudioFile; end
            class Animation
              class Frame; end
              class Timing; end
            end
          end

          class Table
            def self._load(bytes)
              obj = allocate
              obj.instance_variable_set(:@raw, bytes)
              obj
            end

            def _dump(level = 0)
              @raw
            end
          end

          class Tone
            def self._load(bytes)
              obj = allocate
              obj.instance_variable_set(:@raw, bytes)
              obj
            end

            def _dump(level = 0)
              @raw
            end
          end

          class Color < Tone; end

          def iv(object, name)
            object.instance_variable_get('@' + name.to_s)
          end

          def put(object, name, value)
            object.instance_variable_set('@' + name.to_s, value)
          end

          def copy(object)
            Marshal.load(Marshal.dump(object))
          end

          def check(condition, message)
            raise message unless condition
          end

          def command(template, code, indent, parameters)
            result = copy(template)
            put(result, :code, code)
            put(result, :indent, indent)
            put(result, :parameters, parameters)
            result
          end

          pre = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          root = 'site/knight/gameasync/Data/'

          path19 = root + pre + 'Map019.rxdata'
          path25 = root + pre + 'Map025.rxdata'
          common_path = root + pre + 'CommonEvents.rxdata'
          anims_path = root + pre + 'Animations.rxdata'
          script_path = root + 'Scripts.rxdata'

          map19 = Marshal.load(File.binread(path19))
          map25 = Marshal.load(File.binread(path25))
          common = Marshal.load(File.binread(common_path))
          animations = Marshal.load(File.binread(anims_path))

          scripts_before = File.binread(script_path)
          map19_before = File.binread(path19)
          anims_before = File.binread(anims_path)

          check(common.length == 1069, 'CE count mismatch')
          check(animations.length == 924, 'Animation count mismatch')
          check(iv(map25, :events).length == 19, 'Event count mismatch')
          check(!iv(map25, :events).key?(30), 'Recovery event occupied')

          queen = iv(map25, :events).fetch(29)
          pages = iv(queen, :pages)

          check(pages.length == 5, 'Queen pages changed')

          condition = iv(pages[3], :condition)

          check(
            iv(condition, :variable_id) == 4988,
            'Queen HP variable changed'
          )
          check(
            iv(condition, :variable_value) == 520,
            'Queen HP value changed'
          )
          check(
            iv(pages[2], :list)[0]
              .instance_variable_get(:@parameters)[0]
              .include?('4988'),
            'Queen HP display missing'
          )

          source = iv(map19, :events).fetch(16)
          source_page = iv(source, :pages).fetch(0)
          source_list = iv(source_page, :list)

          check(
            iv(source_page, :trigger) == 4,
            'Original regeneration trigger changed'
          )
          check(
            iv(source_list[0], :code) == 106 &&
            iv(source_list[0], :parameters) == [100],
            'Original regeneration interval changed'
          )
          check(
            iv(source_list[29], :parameters) ==
              [1, 276, 0, 4000, 4],
            'Original regeneration guard changed'
          )
          check(
            iv(source_list[30], :parameters) ==
              [1, 276, 0, 416, 1],
            'Original regeneration minimum changed'
          )
          check(
            iv(source_list[31], :parameters) ==
              [276, 276, 2, 0, 416],
            'Original regeneration command changed'
          )

          regen = copy(source)

          put(regen, :id, 30)
          put(regen, :name, '[ZQ] HP 회복')
          put(regen, :x, iv(queen, :x))
          put(regen, :y, iv(queen, :y))

          rp = iv(regen, :pages).fetch(0)

          put(rp, :through, true)
          put(rp, :trigger, 4)
          put(rp, :move_type, 0)
          put(rp, :walk_anime, false)
          put(rp, :step_anime, false)

          put(rp, :list, [
            command(source_list[0], 106, 0, [100]),
            command(source_list[1], 111, 0,
                    [1, 4988, 0, 520, 4]),
            command(source_list[2], 111, 1,
                    [1, 4988, 0, 50, 1]),
            command(source_list[3], 122, 2,
                    [4988, 4988, 2, 0, 50]),
            command(source_list[32], 355, 2, [
              '$m.drawMHP("제니스 퀸",$game_variables[4988],520,2)'
            ]),
            command(source_list[33], 0, 2, []),
            command(source_list[34], 412, 1, []),
            command(source_list[35], 0, 1, []),
            command(source_list[36], 412, 0, []),
            command(source_list[37], 0, 0, [])
          ])

          iv(map25, :events)[30] = regen

          death_graphic = iv(pages[3], :graphic)

          check(
            iv(death_graphic, :character_name) == 'SLZQBlank',
            'Original death page changed'
          )

          put(death_graphic, :character_name, 'SLZQDeath')
          put(death_graphic, :pattern, 0)

          death_event = common.fetch(1067)
          dl = iv(death_event, :list)

          ids = dl.select {
            |c| iv(c, :code) == 207
          }.map {
            |c| iv(c, :parameters)
          }

          check(
            ids == [[29, 920], [29, 921], [29, 922], [29, 923]],
            'Original directional death animations changed'
          )

          check(
            dl.any? {
              |c| iv(c, :code) == 106 &&
                   iv(c, :parameters) == [70]
            },
            'Original death wait changed'
          )

          check(
            !dl.any? {
              |c| iv(c, :code) == 355 &&
                   iv(c, :parameters).join.include?('sl_attack_begin')
            },
            'Death visibility hook already present'
          )

          death_show = command(dl[1], 355, 0, [
            'e=$game_map.events[29]; e.sl_attack_begin("SLZQWalk",34) if e && e.respond_to?(:sl_attack_begin)'
          ])

          dl.insert(2, death_show)

          (920..923).each do |id|
            animation = animations.fetch(id)

            check(
              iv(animation, :frame_max) == 34 &&
              iv(animation, :frames).length == 34,
              'Original death frames changed'
            )
          end

          File.binwrite(path25, Marshal.dump(map25))
          File.binwrite(common_path, Marshal.dump(common))

          check(
            File.binread(path19) == map19_before,
            'Death Knight data modified'
          )
          check(
            File.binread(anims_path) == anims_before,
            'Original animations modified'
          )
          check(
            File.binread(script_path) == scripts_before,
            'Original scripts modified'
          )

          verified_map = Marshal.load(File.binread(path25))
          verified_common = Marshal.load(File.binread(common_path))
          verified_regen = iv(verified_map, :events).fetch(30)

          check(
            iv(iv(verified_regen, :pages)[0], :list).length == 10,
            'Recovery command count changed'
          )
          check(
            iv(iv(verified_regen, :pages)[0], :trigger) == 4,
            'Recovery trigger changed'
          )
          check(
            iv(iv(verified_map, :events)[29], :pages)[3]
              .instance_variable_get(:@graphic)
              .instance_variable_get(:@character_name) ==
              'SLZQDeath',
            'Death graphic not applied'
          )
          check(
            iv(verified_common.fetch(1067), :list).length == 17,
            'Death event structure changed'
          )

          puts 'PASS Queen native recovery and death'
          RUBY

          ruby -c build/queen_native.rb
          ruby build/queen_native.rb

      - name: Apply V1.1 existing speed calculation
        shell: bash
        run: |
          set -euo pipefail

          cat > build/speed_v11.rb <<'RUBY'
          require 'zlib'
          require 'digest'

          module RPG
            class CommonEvent; end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
            class AudioFile; end
          end

          def check(condition, message)
            raise message unless condition
          end

          def iv(object, name)
            object.instance_variable_get('@' + name.to_s)
          end

          def native_name(event)
            name = iv(event, :name).to_s.dup
            name.force_encoding('UTF-8')
            name.scrub
          end

          def replace_once(source, before, after, label)
            count = source.scan(
              Regexp.new(Regexp.escape(before))
            ).length

            check(
              count == 1,
              "Source mismatch #{label}: #{count}"
            )

            source.sub(before, after)
          end

          pre = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          root = 'site/knight/gameasync/Data/'

          script_path = root + 'Scripts.rxdata'
          common_path = root + pre + 'CommonEvents.rxdata'

          common_before = Digest::SHA256.file(common_path).hexdigest
          scripts = Marshal.load(File.binread(script_path))
          common = Marshal.load(File.binread(common_path))
          original_scripts = Marshal.load(Marshal.dump(scripts))

          check(
            common.length == 1069,
            'Unexpected CommonEvents data'
          )

          # Native Holy Walk has two distinct events.
          # CE800: activation (callable).
          # CE801: active effect (parallel).
          # The previous V1.1 incorrectly required one event.
          holy_cast = common.fetch(800)
          holy_state = common.fetch(801)

          check(
            native_name(holy_cast).include?('홀리워크') &&
            iv(holy_cast, :trigger).to_i == 0,
            'Holy Walk activation event changed'
          )

          check(
            native_name(holy_state).include?('홀리워크') &&
            iv(holy_state, :trigger).to_i == 2,
            'Holy Walk active event changed'
          )

          holy_switch = iv(holy_state, :switch_id).to_i

          check(
            holy_switch > 0,
            'Native Holy Walk status switch missing'
          )

          # Find existing native Slow parallel status only.
          # Never treat a monster attack named "Slow" as a
          # permanent player status.
          slow_candidates = []

          common.each_with_index do |event, id|
            next if id == 0 || event.nil?
            next unless native_name(event).match?(/슬로우|\bslow\b/i)
            next unless iv(event, :trigger).to_i == 2

            switch_id = iv(event, :switch_id).to_i
            next unless switch_id > 0

            slow_candidates << [id, switch_id, native_name(event)]
          end

          # Ambiguous native states are not combined.
          # Their original behavior is preserved instead.
          slow_switches =
            slow_candidates.length == 1 ?
              [slow_candidates[0][1]] : []

          puts "Native Holy Walk CE801 switch=#{holy_switch}"
          puts "Native Slow candidates=#{slow_candidates.inspect}"

          if slow_switches.empty?
            puts 'NOTICE native Slow speed remains unchanged'
          else
            puts "PASS native Slow switch=#{slow_switches[0]}"
          end

          # Locate the EXISTING speed controller.
          matches = scripts.each_index.select do |i|
            scripts[i].is_a?(Array) &&
            scripts[i][1] == 'V229 Unified Speed Rules'
          end

          check(
            matches.length == 1,
            'Existing speed controller not uniquely found'
          )

          script_index = matches.fetch(0)
          entry = scripts.fetch(script_index)
          source = Zlib::Inflate.inflate(entry[2])

          check(
            source.scan('module SLV229').length == 1,
            'Original Speed module missing'
          )
          check(
            !source.include?('def self.holy_walk_active?'),
            'Holy Walk speed already applied'
          )
          check(
            !source.include?('def self.slow_active?'),
            'Slow speed already applied'
          )

          # Keep the original polymorph attack table intact.
          original_morph = source[
            /^    def self.attack_base_rate\n.*?^    end/m
          ]

          original_wait = source[
            /^    def self.convert_attack_wait\(.*?^    end/m
          ]

          check(
            original_morph &&
            original_morph.include?('when :dk52'),
            'Original polymorph attack speeds missing'
          )
          check(
            original_wait,
            'Original attack timing function missing'
          )

          # No independent timer is introduced.
          # Existing parallel event switches retain ownership
          # of status duration and expiration.
          status_methods = <<~RUBY
              HOLY_WALK_STATUS_SWITCH = #{holy_switch}
              SLOW_STATUS_SWITCHES = #{slow_switches.inspect}

              def self.holy_walk_active?
                return false if $game_switches.nil?
                $game_switches[HOLY_WALK_STATUS_SWITCH] == true
              end

              def self.slow_active?
                return false if $game_switches.nil?
                SLOW_STATUS_SWITCHES.any? do |id|
                  $game_switches[id] == true
                end
              end

          RUBY

          check(
            source.include?("    def self.move_rate\n"),
            'Existing movement calculation missing'
          )

          source = source.sub(
            "    def self.move_rate\n",
            status_methods + "    def self.move_rate\n"
          )

          old_move = source[
            /^    def self.move_rate\n.*?^    end/m
          ]

          check(
            old_move &&
            old_move.include?('form == :baphomet ? 1.5 : 1.0') &&
            old_move.include?('haste_active?') &&
            old_move.include?('brave_active?'),
            'Existing movement rates changed'
          )

          new_move = replace_once(
            old_move,
            "      polymorph_rate\n",
            "      polymorph_rate *= 1.33 if holy_walk_active?\n" +
            "      polymorph_rate *= 0.5 if slow_active?\n" +
            "      polymorph_rate\n",
            'movement return'
          )

          source = replace_once(
            source,
            old_move,
            new_move,
            'movement function'
          )

          old_attack = source[
            /^    def self.attack_rate\n.*?^    end/m
          ]

          check(
            old_attack &&
            old_attack.include?('rate = attack_base_rate') &&
            old_attack.include?('HASTE_ATTACK') &&
            old_attack.include?('BRAVE_ATTACK'),
            'Existing attack calculation changed'
          )

          # Holy Walk must not affect attack speed.
          # Existing morph attack speed values remain unchanged.
          new_attack = replace_once(
            old_attack,
            "      rate\n",
            "      rate *= 0.5 if slow_active?\n" +
            "      rate\n",
            'attack return'
          )

          source = replace_once(
            source,
            old_attack,
            new_attack,
            'attack function'
          )

          # No change to any of these original mechanisms:
          # - Speed.tick
          # - Game_Player.update
          # - Interpreter.command_106
          # - native spell timers
          # - attack frame order
          # - polymorph selection
          check(
            source.include?(original_morph),
            'Polymorph attack speeds modified'
          )
          check(
            source.include?(original_wait),
            'Original attack timing modified'
          )
          check(
            source.scan('alias slv229_original_update').length == 1,
            'Player update hook changed'
          )
          check(
            source.scan('alias slv229_original_wait_command').length == 1,
            'Attack wait hook changed'
          )

          # Change just the existing speed script.
          entry[2] = Zlib::Deflate.deflate(source)

          modified = scripts.each_index.select do |i|
            scripts[i] != original_scripts[i]
          end

          check(
            modified == [script_index],
            "Unexpected script modifications: #{modified.inspect}"
          )

          File.binwrite(script_path, Marshal.dump(scripts))

          check(
            Digest::SHA256.file(common_path).hexdigest == common_before,
            'Existing spell events were modified'
          )

          verified = Marshal.load(File.binread(script_path))
          result = Zlib::Inflate.inflate(
            verified.fetch(script_index)[2]
          )

          check(
            result.include?(original_morph),
            'Polymorph table changed after saving'
          )
          check(
            result.include?(original_wait),
            'Attack timing changed after saving'
          )
          check(
            result.include?('HOLY_WALK_STATUS_SWITCH'),
            'Native Holy Walk status missing'
          )
          check(
            result.include?('SLOW_STATUS_SWITCHES'),
            'Native Slow status guard missing'
          )

          puts 'PASS V1.1 existing Speed controller'
          puts 'PASS native Holy Walk state reused'
          puts 'PASS no duplicate effect timers'
          puts 'PASS no additional Game_Player speed hook'
          puts 'PASS no additional Interpreter attack hook'
          puts 'PASS original polymorph attack speeds preserved'
          puts 'PASS native animations and attack frames preserved'
          RUBY

          ruby -c build/speed_v11.rb
          ruby build/speed_v11.rb

      - name: Refresh game data hashes and V1.1 display
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          root = Path('site')
          game = root / 'knight/gameasync'
          data = game / 'Data'
          pre = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          mapping = game / 'mapping.js'
          content = mapping.read_text('utf-8')

          for name in (
              pre + 'Map025.rxdata',
              pre + 'CommonEvents.rxdata',
              'Scripts.rxdata'
          ):
              digest = hashlib.md5(
                  (data / name).read_bytes()
              ).hexdigest()

              token = (
                  re.escape('Data/' + name) +
                  r'\?h=[0-9a-f]{32}'
              )

              content, count = re.subn(
                  token,
                  'Data/' + name + '?h=' + digest,
                  content
              )

              assert count == 1, (
                  'Game data mapping missing', name, count
              )

          mapping.write_text(content, encoding='utf-8')

          loader = root / 'knight/js/sl-assets-v229r115.js'
          loader_text = loader.read_text('utf-8')

          match = re.search(
              r"var version='([^']+)';",
              loader_text
          )

          assert match, 'Original version variable missing'
          original_version = match.group(1)

          loader_text = loader_text.replace(
              "var version='" + original_version + "';",
              "var version='V1.1';"
          )

          assert loader_text.count("var version='V1.1';") == 1

          loader.write_text(
              loader_text,
              encoding='utf-8'
          )

          for name in ('index.html', 'knight/index.html'):
              path = root / name
              html = path.read_text('utf-8')

              assert original_version in html, (
                  'Original displayed version missing', name
              )

              html = html.replace(original_version, 'V1.1')

              html = re.sub(
                  r'\?v=v\d+(?:\.\d+)*',
                  '?v=v1.1',
                  html
              )

              path.write_text(
                  html,
                  encoding='utf-8'
              )

          for name in ('index.html', 'knight/index.html'):
              html = (root / name).read_text('utf-8')
              assert 'V1.1' in html, name

          print('PASS V1.1 displayed version only')
          print('PASS updated cache hashes')
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Verify V1.1 change scope
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path('site')

          previous = json.loads(
              Path('build/original_sha256.json').read_text(
                  encoding='utf-8'
              )
          )

          current = {
              str(p.relative_to(root)):
                  hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          assert len(current) == 5623, (
              'Original file count changed'
          )
          assert set(previous) == set(current), (
              'Original file inventory changed'
          )

          changed = {
              path for path in previous
              if previous[path] != current[path]
          }

          pre = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          allowed = {
              'knight/gameasync/Data/' +
                  pre + 'Map025.rxdata',
              'knight/gameasync/Data/' +
                  pre + 'CommonEvents.rxdata',
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html',
              'knight/index.html'
          }

          assert changed == allowed, (
              'Unexpected changed files',
              sorted(changed ^ allowed)
          )

          for filename in ('index.html', 'knight/index.html'):
              assert 'V1.1' in (
                  root / filename
              ).read_text('utf-8'), filename

          print('PASS seven allowed files changed')
          print('PASS original 4-direction movement retained')
          print('PASS original maps and monsters retained')
          print('PASS original attack animation timing retained')
          print('PASS original polymorph attack rates retained')
          print('PASS Queen recovery/death retained')
          print('PASS V1.1 final file verification')
          PY

      - name: Publish V1.1 game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
