name: Deploy SLKnight V14.3z10 MINIMAL ENHANCED GREEN + ORIGINAL BUFF/TRANSFORM + VERIFIED REMAINING 5 + FAST AUTO

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions: {contents: read, pages: write, id-token: write}

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  BASELINE_SHA: c6815cd461dba60ec131898e6d5dd8690dd915ae
  X2_SHA: 6d941bd643dda87b8267ba466e108d1904c22331
  Z1_SHA: 008b6abe81074b7af877806b45f2314004a74f66
  Z3_SHA: 5a46988b048764e8a99700998c1f4ab96a3ec5c1
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout frozen V14.3l baseline
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.BASELINE_SHA }}
          path: baseline

      - name: Checkout frozen V14.3x2 native auto base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.X2_SHA }}
          path: x2

      - name: Checkout frozen V14.3z1 verified monster base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z1_SHA }}
          path: z1

      - name: Checkout frozen V14.3z3 current success
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z3_SHA }}
          path: z3

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake cmake curl ffmpeg freepats git imagemagick libtool make mm-common patch pkg-config python3 rake ruby timidity unzip wget xz-utils fonts-nanum

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.MKXP_SRC_REF }}
          path: engine

      - name: Cache engine dependencies
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-${{ runner.os }}-${{ env.EMSDK_VER }}-onig25b

      - name: Extract frozen run scripts
        run: |
          ruby -ryaml - <<'RB'
          base=YAML.load_file('baseline/.github/workflows/build-slknight-web.yml')
          x2=YAML.load_file('x2/.github/workflows/build-slknight-web.yml')
          z1=YAML.load_file('z1/.github/workflows/build-slknight-web.yml')
          z3=YAML.load_file('z3/.github/workflows/build-slknight-web.yml')

          base_steps=base.fetch('jobs').fetch('build').fetch('steps')
          x2_steps=x2.fetch('jobs').fetch('build').fetch('steps')
          z1_steps=z1.fetch('jobs').fetch('build').fetch('steps')
          z3_steps=z3.fetch('jobs').fetch('build').fetch('steps')

          base_wanted={
            'Patch engine'=>'/tmp/base_patch_engine.sh',
            'Build engine'=>'/tmp/base_build_engine.sh',
            'Install game'=>'/tmp/base_install_game.sh',
            'Patch game'=>'/tmp/base_patch_game.sh',
            'Convert media'=>'/tmp/base_convert_media.sh',
            'Build mappings'=>'/tmp/base_build_mappings.sh',
            'Patch browser'=>'/tmp/base_patch_browser.sh',
            'Verify package'=>'/tmp/base_verify.sh'
          }

          x2_wanted={
            'Patch native Lineage hold attack'=>'/tmp/x2_native_auto.sh'
          }

          z3_wanted={
            'Patch Gnoll Neruga Drake Kelberos'=>'/tmp/z3_delta.sh',
            'Patch native Lineage hold attack + full-speed auto'=>'/tmp/z3_auto.sh',
            'Preload verified attack and breath assets'=>'/tmp/z3_preload.sh',
            'Verify V14.3z3 package'=>'/tmp/z3_verify.sh'
          }

          base_wanted.each do |name,path|
            step=base_steps.find{|x|x['name']==name}
            abort "BASELINE STEP MISSING: #{name}" unless step&&step['run']
            File.write(path,step['run'])
          end

          x2_wanted.each do |name,path|
            step=x2_steps.find{|x|x['name']==name}
            abort "X2 STEP MISSING: #{name}" unless step&&step['run']
            File.write(path,step['run'])
          end

          step=z1_steps.find{|x|x['name']=='Patch verified monster attacks only'}
          abort 'Z1 monster patch missing' unless step&&step['run']
          File.write('/tmp/z1_monster_patch.sh',step['run'])

          z3_wanted.each do |name,path|
            step=z3_steps.find{|x|x['name']==name}
            abort "Z3 STEP MISSING: #{name}" unless step&&step['run']
            File.write(path,step['run'])
          end

          puts 'FROZEN_SCRIPTS_Z10_OK'
          RB

      - name: Remove unsupported Orc alias mappings from z1 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('/tmp/z1_monster_patch.sh')
          s=p.read_text()

          s=s.replace(
              "# No separate 두다마라/로바 attack sheet exists; both use the\n"
              "# user-verified generic 오크.png / 오크모션 set.\n",
              ""
          )

          for attack_id,next_id in ((857,859),(860,862)):
              pat=rf'(?ms)^[ \t]*{attack_id}=>\{{\n.*?^[ \t]*\}},\n(?=[ \t]*{next_id}=>\{{)'
              s,n=re.subn(pat,'',s,count=1)
              if n!=1:
                  raise SystemExit(f'failed to remove unsupported attack {attack_id}: {n}')

          for bad in (
              "857=>{",
              "860=>{",
              "label:'두다마라오크'",
              "label:'로바오크'"
          ):
              if bad in s:
                  raise SystemExit('unsupported Orc mapping remains: '+bad)

          p.write_text(s)
          print('Z1_ORC_ALIAS_MAPPING_REMOVED')
          PY

      - name: Add user-verified remaining 5 monster mappings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('/tmp/z1_monster_patch.sh')
          s=p.read_text()

          for attack_id in (852,866,867,871,872):
              if re.search(rf'(?m)^[ \t]*{attack_id}=>\{{',s):
                  raise SystemExit(f'remaining mapping already exists: {attack_id}')

          def insert_before_id(src, attack_id, body):
              pat=rf'(?m)^([ \t]*){attack_id}=>\{{'
              matches=list(re.finditer(pat,src))
              if len(matches)!=1:
                  raise SystemExit(f'insertion anchor {attack_id} count={len(matches)}')

              m=matches[0]
              indent=m.group(1)

              block='\n'.join(
                  indent+line if line else ''
                  for line in body.splitlines()
              )+'\n'

              return src[:m.start()]+block+src[m.start():]

          hob="""852=>{
            label:'홉고블린',coord:'홉고블린',dirs:{
              8=>['홉고블린모션',[0,1,2,3,4,5,6],false],
              6=>['홉고블린모션',[7,8,9,10,11,12,13],false],
              2=>['홉고블린모션',[14,15,16,17,18,19,20],false],
              4=>['홉고블린모션',[7,8,9,10,11,12,13],true]
            }
          },"""

          s=insert_before_id(s,853,hob)

          rest="""866=>{
            label:'좀비엘모어장군',coord:'좀비 엘모어 장군',dirs:{
              8=>['좀비엘모어장군모션',[0,1,2,3,4,5,6,7,8],false],
              6=>['좀비엘모어장군모션',[10,11,12,13,14,15,16,17,18],false],
              4=>['좀비엘모어장군모션',[10,11,12,13,14,15,16,17,18],true]
            }
          },
          867=>{
            label:'좀비엘모어병사',coord:'좀비 엘모어 병사',dirs:{
              8=>['좀비엘모어병사모션',[0,1,2,3,4,5,6],false],
              6=>['좀비엘모어병사모션',[7,8,9,10,11,12,13],false],
              2=>['좀비엘모어병사모션',[14,15,16,17,18,19,20],false],
              4=>['좀비엘모어병사모션',[7,8,9,10,11,12,13],true]
            }
          },
          871=>{
            label:'해골근위병',coord:'해골 근위병',dirs:{
              2=>['해골근위병모션',[0,1,2,3,4,5],false],
              4=>['해골근위병모션',[6,7,8,9,10,11],false],
              8=>['해골근위병모션',[12,13,14,15],false],
              6=>['해골근위병모션',[16,17,18,19],false]
            }
          },
          872=>{
            label:'해골돌격병',coord:'해골 돌격병',dirs:{
              2=>['해골돌격병모션',[0,1,2,3,4],false],
              4=>['해골돌격병모션',[5,6,7,8,9],false],
              8=>['해골돌격병모션',[10,11,12,13],false],
              6=>['해골돌격병모션',[5,6,7,8,9],true]
            }
          },"""

          s=insert_before_id(s,876,rest)

          old='abort "verified direction missing attack=#{attack_id} dir=#{dir}" unless spec'
          if s.count(old)!=1:
              raise SystemExit(
                  f'direction-required marker count={s.count(old)}'
              )
          s=s.replace(old,'next unless spec',1)

          pat=r'(?m)^([ \t]*)ids=data\[:ids\][ \t]*$'
          matches=list(re.finditer(pat,s))
          if len(matches)!=1:
              raise SystemExit(
                  f'ids=data marker count={len(matches)}'
              )

          m=matches[0]
          indent=m.group(1)

          replacement=(
              indent+"ids=data[:ids]\n"+
              indent+"id_map=[2,4,6,8].select{|d|ids[d]}.map{|d|\"#{d}=>#{ids[d]}\"}.join(',')\n"+
              indent+'abort "verified direction map empty attack=#{attack_id}" if id_map.empty?'
          )

          s=s[:m.start()]+replacement+s[m.end():]

          old='"{2=>#{ids[2]},4=>#{ids[4]},6=>#{ids[6]},8=>#{ids[8]}},"'
          if s.count(old)!=1:
              raise SystemExit(
                  f'hard-coded direction-map count={s.count(old)}'
              )
          s=s.replace(old,'"{#{id_map}},"',1)

          checks=(
              "8=>['홉고블린모션',[0,1,2,3,4,5,6],false]",
              "6=>['홉고블린모션',[7,8,9,10,11,12,13],false]",
              "2=>['홉고블린모션',[14,15,16,17,18,19,20],false]",
              "4=>['홉고블린모션',[7,8,9,10,11,12,13],true]",

              "8=>['좀비엘모어장군모션',[0,1,2,3,4,5,6,7,8],false]",
              "6=>['좀비엘모어장군모션',[10,11,12,13,14,15,16,17,18],false]",
              "4=>['좀비엘모어장군모션',[10,11,12,13,14,15,16,17,18],true]",

              "8=>['좀비엘모어병사모션',[0,1,2,3,4,5,6],false]",
              "6=>['좀비엘모어병사모션',[7,8,9,10,11,12,13],false]",
              "2=>['좀비엘모어병사모션',[14,15,16,17,18,19,20],false]",
              "4=>['좀비엘모어병사모션',[7,8,9,10,11,12,13],true]",

              "2=>['해골근위병모션',[0,1,2,3,4,5],false]",
              "4=>['해골근위병모션',[6,7,8,9,10,11],false]",
              "8=>['해골근위병모션',[12,13,14,15],false]",
              "6=>['해골근위병모션',[16,17,18,19],false]",

              "2=>['해골돌격병모션',[0,1,2,3,4],false]",
              "4=>['해골돌격병모션',[5,6,7,8,9],false]",
              "8=>['해골돌격병모션',[10,11,12,13],false]",
              "6=>['해골돌격병모션',[5,6,7,8,9],true]"
          )

          for needle in checks:
              if needle not in s:
                  raise SystemExit(
                      'confirmed mapping missing: '+needle
                  )

          if re.search(r"2=>\['좀비엘모어장군모션'",s):
              raise SystemExit(
                  'unexpected zombie general D2 attack mapping'
              )

          p.write_text(s)
          print('REMAINING_5_VERIFIED_MAPPINGS_ADDED')
          PY

      - name: Retarget inherited z3 scripts to z10 counts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          delta=Path('/tmp/z3_delta.sh')
          s=delta.read_text()

          replacements={
              'test "$(wc -l < player/gameasync/sl_attack_sheets.txt)" -eq 21':
              'test "$(wc -l < player/gameasync/sl_attack_sheets.txt)" -eq 25',

              'test "$(wc -l < player/gameasync/sl_attack_coords.txt)" -eq 18':
              'test "$(wc -l < player/gameasync/sl_attack_coords.txt)" -eq 22',

              'test "$(wc -l < player/gameasync/sl_attack_verified_ids.txt)" -eq 19':
              'test "$(wc -l < player/gameasync/sl_attack_verified_ids.txt)" -eq 22'
          }

          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(
                      'delta count marker missing: '+old
                  )
              s=s.replace(old,new)

          delta.write_text(s)

          preload=Path('/tmp/z3_preload.sh')
          s=preload.read_text()

          for old,new in (
              ('expected=21','expected=25'),
              ('sheets.length==21','sheets.length==25'),
              ('expected=18','expected=22'),
              ('chars.length==18','chars.length==22'),
              ('V14.3z3','V14.3z10'),
              ('v143z3','v143z10'),
              ('Z3','Z10'),
              ('z3','z10')
          ):
              s=s.replace(old,new)

          preload.write_text(s)

          verify=Path('/tmp/z3_verify.sh')
          s=verify.read_text()

          for old,new in (
              ('-eq 21','-eq 25'),
              ('-eq 18','-eq 22'),
              ('-eq 19','-eq 22'),
              ('V14.3z3','V14.3z10'),
              ('v143z3','v143z10'),
              ('FINAL_VERIFY_Z3','FINAL_VERIFY_Z10'),
              ('final_z3_verify','final_z10_verify')
          ):
              s=s.replace(old,new)

          verify.write_text(s)

          print('Z10_INHERITED_SCRIPTS_RETARGETED')
          PY

      - name: Patch engine
        run: bash /tmp/base_patch_engine.sh

      - name: Build engine
        run: bash /tmp/base_build_engine.sh

      - name: Install game
        run: bash /tmp/base_install_game.sh

      - name: Patch game from V14.3l
        run: bash /tmp/base_patch_game.sh

      - name: Snapshot original buff and transform owners
        run: |
          ruby -EUTF-8:UTF-8 - <<'RB'
          game='player/gameasync'

          class RawMarshalObject
            def self._load(data); o=allocate; o.instance_variable_set(:@raw,data); o; end
            def _dump(_depth); @raw; end
          end

          class Tone < RawMarshalObject; end
          class Color < RawMarshalObject; end
          class Rect < RawMarshalObject; end
          class Table < RawMarshalObject; end

          module RPG
            class AudioFile; end
            class Animation
              class Frame; end
              class Timing; end
            end
            class Map; end
            class CommonEvent; end
            class Event
              class Page
                class Condition; end
                class Graphic; end
              end
            end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
          end

          def iv(o,n)
            o.instance_variable_get("@#{n}")
          end

          cp=Dir.glob(
            File.join(game,'Data','*CommonEvents.rxdata')
          ).max_by{|p|File.size(p)}

          abort 'CommonEvents missing' unless
            cp&&File.size(cp)>1000

          ce=Marshal.load(File.binread(cp))

          owner_ids=[
            3,
            4,
            6,
            8,
            10,
            17,
            33,
            34,
            68,
            107
          ]

          owner_ids.each do |id|
            abort "owner CE#{id} missing" unless ce[id]
            File.binwrite(
              "/tmp/sl_owner_#{id}.bin",
              Marshal.dump(ce[id])
            )
          end

          ce8_text=(iv(ce[8],:list)||[])
            .select{|c|iv(c,:code)==355}
            .map{|c|(iv(c,:parameters)||[])[0].to_s}
            .join("\n")

          ce8_all=(iv(ce[8],:list)||[])
            .map do |c|
              (iv(c,:parameters)||[])
                .map(&:to_s)
                .join(' ')
            end
            .join("\n")

          abort 'V14.3l enhanced-green bravery guard missing' unless
            ce8_all.include?(
              '$game_party.item_number(2) > 0 || $game_switches[368]'
            )

          abort 'V14.3l enhanced-green preservation missing' unless
            ce8_text.include?(
              '$sl_enhanced_green = $game_switches[368]'
            )

          abort 'V14.3l enhanced-green consume guard missing' unless
            ce8_text.include?(
              '$game_party.lose_item(2,1) unless $sl_enhanced_green'
            )

          puts 'ORIGINAL_BUFF_TRANSFORM_OWNERS_SNAPSHOTTED'
          RB

      - name: Patch verified monster attacks including remaining 5
        run: |
          bash /tmp/z1_monster_patch.sh

          test "$(wc -l < player/gameasync/sl_attack_sheets.txt)" -eq 19
          test "$(wc -l < player/gameasync/sl_attack_coords.txt)" -eq 18
          test "$(wc -l < player/gameasync/sl_attack_verified_ids.txt)" -eq 18

          for n in \
            '홉고블린모션' \
            '좀비엘모어장군모션' \
            '좀비엘모어병사모션' \
            '해골근위병모션' \
            '해골돌격병모션'
          do
            grep -Fxq \
              "$n" \
              player/gameasync/sl_attack_sheets.txt
          done

          for n in 852 866 867 871 872
          do
            grep -Fxq \
              "$n" \
              player/gameasync/sl_attack_verified_ids.txt
          done

          ! grep -Fxq \
            '857' \
            player/gameasync/sl_attack_verified_ids.txt

          ! grep -Fxq \
            '860' \
            player/gameasync/sl_attack_verified_ids.txt

      - name: Patch Gnoll Neruga Drake Kelberos
        run: bash /tmp/z3_delta.sh

      - name: Convert media
        run: bash /tmp/base_convert_media.sh

      - name: Build mappings
        run: bash /tmp/base_build_mappings.sh

      - name: Patch browser from V14.3l
        run: bash /tmp/base_patch_browser.sh

      - name: Verify frozen V14.3l baseline
        run: bash /tmp/base_verify.sh

      - name: Patch native Lineage auto attack at full input rate
        run: bash /tmp/z3_auto.sh

      - name: Patch enhanced green attack timing only
        run: |
          cat > /tmp/patch_enhanced_green_timing.rb <<'RB'
          # encoding: UTF-8
          game=ARGV.fetch(0)

          expr=
            '$game_switches[171] || $game_switches[368]'

          class RawMarshalObject
            def self._load(data)
              o=allocate
              o.instance_variable_set(:@raw,data)
              o
            end

            def _dump(_depth)
              @raw
            end
          end

          class Tone < RawMarshalObject; end
          class Color < RawMarshalObject; end
          class Rect < RawMarshalObject; end
          class Table < RawMarshalObject; end

          module RPG
            class AudioFile; end

            class Animation
              class Frame; end
              class Timing; end
            end

            class Map; end
            class CommonEvent; end

            class Event
              class Page
                class Condition; end
                class Graphic; end
              end
            end

            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
          end

          def iv(o,n)
            o.instance_variable_get("@#{n}")
          end

          def setiv(o,n,v)
            o.instance_variable_set("@#{n}",v)
          end

          def patch_timing_list(list,expr)
            has_courage=list.any? do |c|
              iv(c,:code)==111 &&
                (iv(c,:parameters)||[])==[0,172,0]
            end

            has_green=list.any? do |c|
              iv(c,:code)==111 &&
                (iv(c,:parameters)||[])==[0,171,0]
            end

            return 0 unless has_courage&&has_green

            n=0

            list.each do |c|
              next unless
                iv(c,:code)==111 &&
                (iv(c,:parameters)||[])==[0,171,0]

              setiv(
                c,
                :parameters,
                [12,expr]
              )

              n+=1
            end

            n
          end

          cp=Dir.glob(
            File.join(game,'Data','*CommonEvents.rxdata')
          ).max_by{|p|File.size(p)}

          abort 'CommonEvents missing' unless
            cp&&File.size(cp)>1000

          ce=Marshal.load(File.binread(cp))

          protected_ids=[
            3,
            4,
            6,
            8,
            10,
            17,
            33,
            34,
            59,
            60,
            68,
            107
          ]

          ce_hits=[]

          ce.each_with_index do |event,id|
            next unless event
            next if protected_ids.include?(id)

            n=patch_timing_list(
              iv(event,:list)||[],
              expr
            )

            ce_hits << [id,n] if n>0
          end

          abort 'CE1 enhanced-green timing patch missing' unless
            ce_hits.any?{|id,n|id==1&&n>0}

          File.binwrite(
            cp,
            Marshal.dump(ce)
          )

          map_hits=[]

          Dir.glob(
            File.join(game,'Data','Map*.rxdata')
          ).sort.each do |mp|

            map=Marshal.load(
