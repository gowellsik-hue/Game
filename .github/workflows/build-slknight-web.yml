name: Deploy SLKnight V14.3u POTION STACK EFFECT FIX
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency:
  group: slknight-github-pages
  cancel-in-progress: true
env:
  BASELINE_SHA: c6815cd461dba60ec131898e6d5dd8690dd915ae
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout frozen V14.3l baseline
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.BASELINE_SHA }}
          path: baseline

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake cmake curl ffmpeg freepats git imagemagick libtool make mm-common patch pkg-config python3 rake ruby timidity unzip wget xz-utils fonts-nanum

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.MKXP_SRC_REF }}
          path: engine

      - name: Cache engine dependencies
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-${{ runner.os }}-${{ env.EMSDK_VER }}-onig25b

      - name: Extract exact V14.3l run scripts
        run: |
          ruby -ryaml - <<'RB'
          doc=YAML.load_file('baseline/.github/workflows/build-slknight-web.yml')
          steps=doc.fetch('jobs').fetch('build').fetch('steps')
          wanted={
            'Patch engine'=>'/tmp/base_patch_engine.sh',
            'Build engine'=>'/tmp/base_build_engine.sh',
            'Install game'=>'/tmp/base_install_game.sh',
            'Patch game'=>'/tmp/base_patch_game.sh',
            'Convert media'=>'/tmp/base_convert_media.sh',
            'Build mappings'=>'/tmp/base_build_mappings.sh',
            'Patch browser'=>'/tmp/base_patch_browser.sh',
            'Verify package'=>'/tmp/base_verify.sh'
          }
          wanted.each do |name,path|
            step=steps.find{|x|x['name']==name}
            abort "BASELINE STEP MISSING: #{name}" unless step&&step['run']
            File.write(path,step['run'])
          end
          puts 'BASELINE_SCRIPTS_OK'
          RB

      - name: Patch engine
        run: bash /tmp/base_patch_engine.sh

      - name: Build engine
        run: bash /tmp/base_build_engine.sh

      - name: Install game
        run: bash /tmp/base_install_game.sh

      - name: Backup pristine potion event
        run: |
          ruby - <<'RB'
          game='player/gameasync'
          path=Dir.glob(File.join(game,'Data','*CommonEvents.rxdata')).max_by{|p|File.size(p)}
          abort 'pristine CommonEvents missing' unless path&&File.size(path)>1000
          File.binwrite('/tmp/pristine_common_events.rxdata',File.binread(path))
          puts 'PRISTINE_POTION_BACKUP_OK'
          RB

      - name: Patch game from V14.3l
        run: bash /tmp/base_patch_game.sh

      - name: Restore ordinary potion logic
        run: |
          cat > /tmp/fix_potion_restore.rb <<'RB'
          # encoding: UTF-8
          game=ARGV.fetch(0)
          pristine_path=ARGV.fetch(1)

          class RawMarshalObject
            def self._load(data)
              o=allocate
              o.instance_variable_set(:@raw,data)
              o
            end
            def _dump(_depth)
              @raw
            end
          end

          class Tone < RawMarshalObject; end
          class Color < RawMarshalObject; end
          class Rect < RawMarshalObject; end
          class Table < RawMarshalObject; end

          module RPG
            class AudioFile; end
            class Animation
              class Frame; end
              class Timing; end
            end
            class Map; end
            class CommonEvent; end
            class Event
              class Page
                class Condition; end
                class Graphic; end
              end
            end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
          end

          def iv(o,n)
            o.instance_variable_get("@#{n}")
          end

          def setiv(o,n,v)
            o.instance_variable_set("@#{n}",v)
          end

          def deep(o)
            Marshal.load(Marshal.dump(o))
          end

          ce_path=Dir.glob(
            File.join(game,'Data','*CommonEvents.rxdata')
          ).max_by{|p|File.size(p)}

          abort 'CommonEvents missing' unless ce_path&&File.size(ce_path)>1000
          abort 'pristine CommonEvents missing' unless File.size?(pristine_path)

          current=Marshal.load(File.binread(ce_path))
          pristine=Marshal.load(File.binread(pristine_path))
          orig=pristine[8]

          abort 'pristine CE8 missing' unless orig

          orig_list=iv(orig,:list)||[]

          abort "pristine CE8 length=#{orig_list.length}" unless orig_list.length==40

          abort 'pristine CE8 condition mismatch' unless
            iv(orig_list[0],:code)==111&&
            iv(orig_list[0],:parameters)==[8,2]

          abort 'pristine CE8 switch368 mismatch' unless
            iv(orig_list[1],:code)==121&&
            iv(orig_list[1],:parameters)==[368,368,1]

          abort 'pristine CE8 bravery consume mismatch' unless
            iv(orig_list[3],:code)==126&&
            iv(orig_list[3],:parameters)==[3,1,0,1]

          abort 'pristine CE8 green consume mismatch' unless
            iv(orig_list[4],:code)==126&&
            iv(orig_list[4],:parameters)==[2,1,0,1]

          abort 'pristine CE8 outer else mismatch' unless
            iv(orig_list[33],:code)==411

          abort 'pristine CE8 outer end mismatch' unless
            iv(orig_list[36],:code)==412

          current[8]=deep(orig)
          regular=current[8]
          regular_list=iv(regular,:list)||[]

          enhanced_id=current.length
          enhanced=deep(orig)

          setiv(enhanced,:id,enhanced_id)
          setiv(enhanced,:name,'SL Enhanced Green Bravery')
          setiv(enhanced,:trigger,0)
          setiv(enhanced,:switch_id,1)

          enhanced_list=[]

          [2,3].each do |idx|
            cmd=deep(orig_list[idx])
            setiv(cmd,:indent,[iv(cmd,:indent).to_i-1,0].max)
            enhanced_list<<cmd
          end

          (5..31).each do |idx|
            cmd=deep(orig_list[idx])
            setiv(cmd,:indent,[iv(cmd,:indent).to_i-1,0].max)
            enhanced_list<<cmd
          end

          [37,38,39].each do |idx|
            enhanced_list<<deep(orig_list[idx])
          end

          setiv(enhanced,:list,enhanced_list)
          current<<enhanced

          guard=RPG::EventCommand.new
          setiv(guard,:code,111)
          setiv(guard,:indent,0)
          setiv(guard,:parameters,[0,368,0])

          call=RPG::EventCommand.new
          setiv(call,:code,117)
          setiv(call,:indent,1)
          setiv(call,:parameters,[enhanced_id])

          exit_cmd=RPG::EventCommand.new
          setiv(exit_cmd,:code,115)
          setiv(exit_cmd,:indent,1)
          setiv(exit_cmd,:parameters,[])

          branch_end=RPG::EventCommand.new
          setiv(branch_end,:code,412)
          setiv(branch_end,:indent,0)
          setiv(branch_end,:parameters,[])

          setiv(
            regular,
            :list,
            [guard,call,exit_cmd,branch_end]+regular_list
          )

          restored_tail=iv(current[8],:list)[4,orig_list.length]

          abort 'regular CE8 not restored exactly' unless
            Marshal.dump(restored_tail)==Marshal.dump(orig_list)

          enh_list=iv(enhanced,:list)||[]

          abort 'enhanced path consumes normal green' if
            enh_list.any? do |c|
              iv(c,:code)==126&&
              (iv(c,:parameters)||[])[0].to_i==2
            end

          abort 'enhanced path disables switch368' if
            enh_list.any? do |c|
              iv(c,:code)==121&&
              iv(c,:parameters)==[368,368,1]
            end

          abort 'enhanced path does not consume bravery' unless
            enh_list.any? do |c|
              iv(c,:code)==126&&
              iv(c,:parameters)==[3,1,0,1]
            end

          abort 'old enhanced global hack remains' if
            (iv(current[8],:list)||[]).any? do |c|
              (iv(c,:parameters)||[]).any? do |v|
                v.to_s.include?('$sl_enhanced_green')
              end
            end

          File.binwrite(ce_path,Marshal.dump(current))

          puts(
            "POTION_RESTORE_OK " \
            "regular_tail=#{restored_tail.length} " \
            "enhanced_ce=#{enhanced_id} " \
            "enhanced_len=#{enh_list.length}"
          )
          RB

          ruby -c /tmp/fix_potion_restore.rb
          ruby -EUTF-8:UTF-8 \
            /tmp/fix_potion_restore.rb \
            player/gameasync \
            /tmp/pristine_common_events.rxdata

      - name: Fix green and bravery stacking
        run: |
          cat > /tmp/fix_potion_stack.rb <<'RB'
          # encoding: UTF-8
          game=ARGV.fetch(0)

          class RawMarshalObject
            def self._load(data)
              o=allocate
              o.instance_variable_set(:@raw,data)
              o
            end
            def _dump(_depth)
              @raw
            end
          end

          class Tone < RawMarshalObject; end
          class Color < RawMarshalObject; end
          class Rect < RawMarshalObject; end
          class Table < RawMarshalObject; end

          module RPG
            class AudioFile; end
            class Animation
              class Frame; end
              class Timing; end
            end
            class Map; end
            class CommonEvent; end
            class Event
              class Page
                class Condition; end
                class Graphic; end
              end
            end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
          end

          def iv(o,n)
            o.instance_variable_get("@#{n}")
          end

          def setiv(o,n,v)
            o.instance_variable_set("@#{n}",v)
          end

          def cmd(code,indent,params)
            c=RPG::EventCommand.new
            setiv(c,:code,code)
            setiv(c,:indent,indent)
            setiv(c,:parameters,params)
            c
          end

          ce_path=Dir.glob(
            File.join(game,'Data','*CommonEvents.rxdata')
          ).max_by{|p|File.size(p)}

          abort 'CommonEvents missing' unless
            ce_path&&File.size(ce_path)>1000

          ces=Marshal.load(File.binread(ce_path))
          ce3=ces[3]
          ce4=ces[4]
          ce8=ces[8]

          abort 'CE3/4/8 missing' unless
            ce3&&ce4&&ce8

          l3=iv(ce3,:list)||[]
          l4=iv(ce4,:list)||[]
          l8=iv(ce8,:list)||[]

          green_script=<<'SCRIPT'
          # SL_GREEN_STACK_V3
          if $game_switches[171] || $game_switches[368]
            $game_variables[110] = $game_variables[110].to_i - 300
            Guage.show
            $KeyIcon.ShowIcon
            $sl_green_stack_skip = true
          elsif $game_switches[172]
            bank = $game_system.instance_variable_get(:@sl_green_bank).to_i
            $game_system.instance_variable_set(:@sl_green_bank, bank + 300)
            Guage.show
            $KeyIcon.ShowIcon
            $sl_green_stack_skip = true
          else
            $sl_green_stack_skip = false
          end
          SCRIPT

          setiv(
            ce3,
            :list,
            [
              cmd(355,0,[green_script]),
              cmd(111,0,[12,'$sl_green_stack_skip == true']),
              cmd(207,1,[-1,2]),
              cmd(115,1,[]),
              cmd(412,0,[])
            ]+l3
          )

          l3=iv(ce3,:list)||[]

          bravery_script=<<'SCRIPT'
          # SL_BRAVERY_STACK_V3
          if $game_switches[172]
            $game_variables[109] = $game_variables[109].to_i - 300
            $game_party.lose_item(3,1)
            Guage.show
            $KeyIcon.ShowIcon
            $sl_bravery_stack_skip = true
          else
            $sl_bravery_stack_skip = false
          end
          SCRIPT

          l8=[
            cmd(355,0,[bravery_script]),
            cmd(111,0,[12,'$sl_bravery_stack_skip == true']),
            cmd(207,1,[-1,270]),
            cmd(117,1,[589]),
            cmd(115,1,[]),
            cmd(412,0,[])
          ]+l8

          green_off=l8.index do |c|
            iv(c,:code)==121&&
            iv(c,:parameters)==[171,171,1]
          end

          abort 'CE8 green OFF missing' unless
            green_off

          capture_script=<<'SCRIPT'
          # SL_GREEN_BANK_CAPTURE_V3
          if $game_switches[171]
            remaining = 300 - $game_variables[110].to_i
            if remaining > 0
              bank = $game_system.instance_variable_get(:@sl_green_bank).to_i
              $game_system.instance_variable_set(:@sl_green_bank, bank + remaining)
            end
          end
          SCRIPT

          l8.insert(
            green_off,
            cmd(
              355,
              iv(l8[green_off],:indent).to_i,
              [capture_script]
            )
          )

          setiv(ce8,:list,l8)

          expiry_off=l4.index do |c|
            iv(c,:code)==121&&
            iv(c,:parameters)==[1002,1002,1]
          end

          abort 'CE4 bravery expiry OFF missing' unless
            expiry_off

          resume_script=<<'SCRIPT'
          # SL_GREEN_BANK_RESUME_V3
          bank = $game_system.instance_variable_get(:@sl_green_bank).to_i
          if bank > 0
            $game_system.instance_variable_set(:@sl_green_bank,0)
            $game_variables[110] = 300 - bank
            $game_switches[171] = true
            $game_player.instance_variable_set(:@move_speed,3)
            Guage.show
            $KeyIcon.ShowIcon
          end
          SCRIPT

          l4.insert(
            expiry_off+1,
            cmd(
              355,
              iv(l4[expiry_off],:indent).to_i,
              [resume_script]
            )
          )

          setiv(ce4,:list,l4)

          l3=iv(ce3,:list)||[]
          l4=iv(ce4,:list)||[]
          l8=iv(ce8,:list)||[]

          abort 'green stack missing' unless
            l3.any? do |c|
              iv(c,:code)==355&&
              (iv(c,:parameters)||[])[0].to_s.include?('SL_GREEN_STACK_V3')
            end

          abort 'bravery stack missing' unless
            l8.any? do |c|
              iv(c,:code)==355&&
              (iv(c,:parameters)||[])[0].to_s.include?('SL_BRAVERY_STACK_V3')
            end

          abort 'green bank capture missing' unless
            l8.any? do |c|
              iv(c,:code)==355&&
              (iv(c,:parameters)||[])[0].to_s.include?('SL_GREEN_BANK_CAPTURE_V3')
            end

          abort 'green bank resume missing' unless
            l4.any? do |c|
              iv(c,:code)==355&&
              (iv(c,:parameters)||[])[0].to_s.include?('SL_GREEN_BANK_RESUME_V3')
            end

          gs=l3.index do |c|
            iv(c,:code)==355&&
            (iv(c,:parameters)||[])[0].to_s.include?('SL_GREEN_STACK_V3')
          end

          greset=l3.index do |c|
            iv(c,:code)==122&&
            iv(c,:parameters)==[311,311,0,0,0]
          end

          abort 'green guard after transform reset' unless
            gs&&greset&&gs<greset

          bs=l8.index do |c|
            iv(c,:code)==355&&
            (iv(c,:parameters)||[])[0].to_s.include?('SL_BRAVERY_STACK_V3')
          end

          breset=l8.index do |c|
            iv(c,:code)==122&&
            iv(c,:parameters)==[109,109,0,0,0]
          end

          abort 'bravery guard after timer reset' unless
            bs&&breset&&bs<breset

          abort 'green stack effect missing' unless
            iv(l3[2],:code)==207&&
            iv(l3[2],:parameters)==[-1,2]

          abort 'green stack exit order wrong' unless
            iv(l3[3],:code)==115

          abort 'bravery stack effect missing' unless
            iv(l8[2],:code)==207&&
            iv(l8[2],:parameters)==[-1,270]

          abort 'bravery stack effect event missing' unless
            iv(l8[3],:code)==117&&
            iv(l8[3],:parameters)==[589]

          abort 'bravery stack exit order wrong' unless
            iv(l8[4],:code)==115

          [-600,-300,0,120,299].each do |v|
            nv=v-300

            abort 'green stack math' unless
              (300-nv)==(300-v)+300

            abort 'bravery stack math' unless
              (300-nv)==(300-v)+300
          end

          File.binwrite(
            ce_path,
            Marshal.dump(ces)
          )

          puts(
            "POTION_STACK_V3_OK " \
            "ce3=#{l3.length} " \
            "ce8=#{l8.length} " \
            "ce4=#{l4.length}"
          )
          RB

          ruby -c /tmp/fix_potion_stack.rb
          ruby -EUTF-8:UTF-8 \
            /tmp/fix_potion_stack.rb \
            player/gameasync

      - name: Patch monster attack motion
        run: |
          cat > /tmp/monster_patch.rb <<'RB'
          # encoding: UTF-8
          require 'shellwords'
          require 'zlib'
          game=ARGV.fetch(0)

          class RawMarshalObject
            def self._load(data)
              o=allocate
              o.instance_variable_set(:@raw,data)
              o
            end
            def _dump(_depth)
              @raw
            end
          end

          class Tone < RawMarshalObject; end
          class Color < RawMarshalObject; end
          class Rect < RawMarshalObject; end
          class Table < RawMarshalObject; end

          module RPG
            class AudioFile; end
            class Animation
              class Frame; end
              class Timing; end
            end
            class Map; end
            class CommonEvent; end
            class Event
              class Page
                class Condition; end
                class Graphic; end
              end
            end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
          end

          def iv(o,n)
            o.instance_variable_get("@#{n}")
          end

          def setiv(o,n,v)
            o.instance_variable_set("@#{n}",v)
          end

          def sl_norm_name(s)
            s.to_s.dup.force_encoding(Encoding::UTF_8)
             .gsub(/\[공격\]/,'')
             .gsub(/[\s\-·ㆍ]/,'')
             .gsub(/[()]/,'')
          end

          def sl_runs(a)
            runs=[]
            cur=[]
            prev=nil

            a.each do |n|
              if !prev.nil?&&n!=prev+1
                runs<<cur unless cur.empty?
                cur=[]
              end

              cur<<n
              prev=n
            end

            runs<<cur unless cur.empty?
            runs
          end

          def sl_split_balanced(a,count=4)
            n=a.length
            out=[]

            count.times do |i|
              s=(i*n.to_f/count).round
              e=((i+1)*n.to_f/count).round
              out<<a[s...e].to_a
            end

            out
          end

          def sl_direction_groups(path,sheet)
            if sheet=='흑기사모션'
              return {
                2=>[10,11,12,13,14,15,16],
                4=>[17,18,19,20],
                6=>[5,6,7,8,9],
                8=>[21,22,0,1,2,3,4]
              }
            end

            cmd="convert #{Shellwords.escape(path)} -crop 192x192 +repage -channel A -format '%[fx:mean]\\n' info: 2>/dev/null"

            means=`#{cmd}`.lines.map{|x|x.to_f}
            used=[]

            means.each_with_index do |v,i|
              used<<i if v>0.00001
            end

            return nil if used.length<8

            runs=sl_runs(used)

            groups=
              if runs.length>=4
                runs[0,4]
              elsif runs.length==2&&runs.all?{|r|r.length>=4}
                sl_split_balanced(runs[0],2)+
                sl_split_balanced(runs[1],2)
              else
                sl_split_balanced(used,4)
              end

            return nil unless
              groups&&
              groups.length==4&&
              groups.all?{|g|!g.empty?}

            {
              2=>groups[0],
              4=>groups[1],
              6=>groups[2],
              8=>groups[3]
            }
          end

          def sl_fit(seq,target)
            return [] if seq.empty?||target<=0
            return Array.new(target,seq[0]) if seq.length==1
            return [seq[0]] if target==1

            out=[]

            target.times do |i|
              src=((i*(seq.length-1).to_f)/(target-1)).round
              out<<seq[src]
            end

            out
          end

          def sl_target_frames(wait,source_count)
            desired=[(wait*0.80).round,1].max
            target=[desired,source_count].max
            [target,wait].min
          end

          ce_path=Dir.glob(
            File.join(game,'Data','*CommonEvents.rxdata')
          ).max_by{|p|File.size(p)}

          anim_path=Dir.glob(
            File.join(game,'Data','*Animations.rxdata')
          ).max_by{|p|File.size(p)}

          scripts_path=File.join(
            game,
            'Data',
            'Scripts.rxdata'
          )

          abort 'CommonEvents missing' unless ce_path&&File.size(ce_path)>1000
          abort 'Animations missing' unless anim_path&&File.size(anim_path)>1000
          abort 'Scripts missing' unless File.size?(scripts_path)

          common_events=Marshal.load(File.binread(ce_path))
          animations=Marshal.load(File.binread(anim_path))
          scripts=Marshal.load(File.binread(scripts_path))

          runtime=<<'RUBY'
          class Game_Character
            attr_reader :sl_attack_swap_frames

            def sl_attack_begin(coord_name,frames)
              frames=frames.to_i
              return if frames<=0
              return if coord_name==nil
              return if coord_name.to_s==''

              unless @sl_attack_swap_active
                @sl_attack_original_name=@character_name
                @sl_attack_original_hue=@character_hue
                @sl_attack_original_tile_id=@tile_id
                @sl_attack_original_transparent=@transparent
              end

              @sl_attack_swap_active=true
              @sl_attack_swap_frames=frames
              @sl_attack_coord_name=coord_name.to_s
              @tile_id=0
              @character_name=@sl_attack_coord_name
            end

            def sl_attack_tick
              return unless @sl_attack_swap_active

              @sl_attack_swap_frames=
                @sl_attack_swap_frames.to_i-1

              sl_attack_finish if
                @sl_attack_swap_frames<=0
            end

            def sl_attack_finish
              return unless @sl_attack_swap_active

              if @character_name==@sl_attack_coord_name
                @tile_id=@sl_attack_original_tile_id
                @character_name=@sl_attack_original_name
                @character_hue=@sl_attack_original_hue
                @transparent=@sl_attack_original_transparent
              end

              @sl_attack_swap_active=false
              @sl_attack_swap_frames=0
              @sl_attack_coord_name=nil
              @sl_attack_original_name=nil
              @sl_attack_original_hue=nil
              @sl_attack_original_tile_id=nil
              @sl_attack_original_transparent=nil
            end
          end

          class Sprite_Character
            alias sl_attack_coordinate_original_update update

            def update
              sl_attack_coordinate_original_update
              @character.sl_attack_tick if @character!=nil
            end
          end
          RUBY

          scripts.delete_if do |e|
            e.is_a?(Array)&&
            e.length>=3&&
            [
              'Monster Attack Body Hide',
              'Monster Attack Coordinate Swap'
            ].include?(e[1].to_s)
          end

          main_pos=scripts.index do |e|
            e.is_a?(Array)&&
            e.length>=3&&
            e[1].to_s=='Main'
          end

          abort 'Main insertion point missing' unless main_pos

          scripts.insert(
            main_pos,
            [
              999997,
              'Monster Attack Coordinate Swap',
              Zlib::Deflate.deflate(runtime)
            ]
          )

          anim_dir=File.join(
            game,
            'Graphics',
            'Animations'
          )

          motion_assets={}

          Dir.glob(File.join(anim_dir,'*.png')).sort.each do |p|
            sheet=File.basename(p,'.png').dup.force_encoding(Encoding::UTF_8)

            next unless sheet.include?('모션')
            next if sheet.include?('죽음')
            next if sheet.include?('맞음')
            next if sheet.start_with?('물약')
            next if sheet.match?(/모션\d+\z/)

            key=sl_norm_name(
              sheet.sub(/[\s\-]*모션\z/,'')
            )

            motion_assets[key]||=[sheet,p] unless key.empty?
          end

          char_dir=File.join(
            game,
            'Graphics',
            'Characters'
          )

          coord_assets={}

          Dir.glob(File.join(char_dir,'*좌표.png')).sort.each do |p|
            name=File.basename(p,'.png').dup.force_encoding(Encoding::UTF_8)

            key=sl_norm_name(
              name.sub(/[\s\-]*좌표\z/,'')
            )

            coord_assets[key]||=name unless key.empty?
          end

          normal_assets={}

          Dir.glob(File.join(char_dir,'*.png')).sort.each do |p|
            name=File.basename(p,'.png').dup.force_encoding(Encoding::UTF_8)

            next if name.end_with?('좌표')

            key=sl_norm_name(name)

            normal_assets[key]||=[name,p] unless key.empty?
          end

          generated_coord_files={}

          motion_assets.each_key do |sheet_key|
            next if coord_assets[sheet_key]

            normal=normal_assets[sheet_key]
            next unless normal

            coord_name=normal[0]+'좌표'

            coord_path=File.join(
              char_dir,
              coord_name+'.png'
            )

            dims=`identify -format '%wx%h' #{Shellwords.escape(normal[1])}`.strip

            abort "coordinate size failed #{normal[0]}" unless
              dims.match?(/\A\d+x\d+\z/)

            ok=system(
              'convert',
              '-size',dims,
              'xc:none',
              coord_path
            )

            abort "coordinate generation failed #{normal[0]}" unless
              ok&&File.size?(coord_path)

            coord_assets[sheet_key]=coord_name
            generated_coord_files[coord_name]=true
          end

          attack_ids={}

          common_events.each_with_index do |ce,id|
            next unless ce

            name=iv(
              ce,
              :name
            ).to_s.dup.force_encoding(Encoding::UTF_8)

            next unless name.start_with?('[공격]')

            monster=sl_norm_name(name)

            candidates=motion_assets.keys.select do |k|
              monster.include?(k)
            end

            next if candidates.empty?

            key=candidates.max_by{|k|k.length}
            sheet=motion_assets[key][0]

            sheet_key=sl_norm_name(
              sheet.sub(/[\s\-]*모션\z/,'')
            )

            coord=coord_assets[sheet_key]

            abort "coordinate missing for #{sheet}" unless coord

            attack_ids[id]={
              name:name,
              sheet:sheet,
              path:motion_assets[key][1],
              coord:coord
            }
          end

          removed_old=0

          common_events.compact.each do |ce|
            list=iv(ce,:list)||[]
            before=list.length

            list.delete_if do |cmd|
              next false unless iv(cmd,:code)==355

              (iv(cmd,:parameters)||[])[0].to_s.include?(
                'aid={2=>500,4=>501,6=>502,8=>503}'
              )
            end

            removed_old+=before-list.length
          end

          base_attack=animations.compact.find do |a|
            frames=iv(a,:frames)

            frames.is_a?(Array)&&
            frames[0]&&
            iv(frames[0],:cell_data)
          end

          abort 'animation frame template missing' unless base_attack

          next_anim=[animations.length,600].max
          generated={}
          used_sheets={}
          used_coords={}
          switch_anim={}
          caller_patched=0

          make_anim=lambda do |id,sheet,patterns,wait,dir,target|
            timeline=sl_fit(patterns,target)
            anim=Marshal.load(Marshal.dump(base_attack))

            setiv(anim,:id,id)
            setiv(anim,:name,"SLM #{sheet} #{dir} W#{wait} F#{target}")
            setiv(anim,:animation_name,sheet)
            setiv(anim,:animation_hue,0)
            setiv(anim,:position,1)
            setiv(anim,:frame_max,timeline.length)
            setiv(anim,:timings,[])

            frames=[]

            timeline.each do |pattern|
              frame=Marshal.load(
                Marshal.dump(
                  iv(base_attack,:frames)[0]
                )
              )

              setiv(frame,:cell_max,1)

              table=Table.allocate

              setiv(
                table,
                :raw,
                [2,1,8,1,8].pack('L<5')+
                [pattern,0,0,100,0,0,255,0].pack('s<8')
              )

              setiv(frame,:cell_data,table)
              frames<<frame
            end

            setiv(anim,:frames,frames)
            animations[id]=anim
          end

          common_events.each_with_index do |ce,cid|
            next unless ce

            switch_id=iv(ce,:switch_id).to_i
            next if switch_id<=0

            list=iv(ce,:list)||[]
            i=0

            while i<list.length
              call=list[i]

              unless iv(call,:code)==117
                i+=1
                next
              end

              attack_id=(iv(call,:parameters)||[])[0].to_i
              meta=attack_ids[attack_id]

              unless meta
                i+=1
                next
              end

              indent=iv(call,:indent).to_i
              wait_cmd=nil

              ((i+1)...[i+10,list.length].min).each do |j|
                c=list[j]
                ci=iv(c,:indent).to_i

                break if ci<indent

                if iv(c,:code)==106&&ci==indent
                  wait_cmd=c
                  break
                end
              end

              unless wait_cmd
                i+=1
                next
              end

              wait=(iv(wait_cmd,:parameters)||[])[0].to_i

              unless wait>=8
                i+=1
                next
              end

              groups=sl_direction_groups(
                meta[:path],
                meta[:sheet]
              )

              unless groups
                i+=1
                next
              end

              source_max=groups.values.map(&:length).max
              target=sl_target_frames(wait,source_max)
              duration_frames=target*2
              wait_frames=wait*2

              abort(
                "animation exceeds wait #{meta[:sheet]} wait=#{wait_frames} duration=#{duration_frames}"
              ) if duration_frames>wait_frames

              key=[meta[:sheet],wait,target]
              data=generated[key]

              unless data
                ids={}

                [2,4,6,8].each do |dir|
                  id=next_anim
                  next_anim+=1

                  make_anim.call(
                    id,
                    meta[:sheet],
                    groups[dir],
                    wait,
                    dir,
                    target
                  )

                  ids[dir]=id
                end

                data={
                  ids:ids,
                  swap_frames:duration_frames,
                  target:target,
                  coord:meta[:coord]
                }

                generated[key]=data
                used_sheets[meta[:sheet]]=true
                used_coords[meta[:coord]]=true
              end

              if switch_anim[switch_id]&&
                 switch_anim[switch_id][:ids]!=data[:ids]

                abort "switch collision #{switch_id}"
              end

              switch_anim[switch_id]={
                ids:data[:ids],
                swap_frames:data[:swap_frames],
                target:data[:target],
                coord:data[:coord],
                sheet:meta[:sheet],
                wait:wait,
                caller:cid
              }

              windup=(wait*0.45).round
              windup=2 if windup<2
              windup=wait-2 if windup>wait-2
              recovery=wait-windup

              abort "wait split mismatch caller=#{cid}" unless
                windup+recovery==wait

              windup_cmd=RPG::EventCommand.new

              setiv(windup_cmd,:code,106)
              setiv(windup_cmd,:indent,indent)
              setiv(windup_cmd,:parameters,[windup])

              setiv(
                wait_cmd,
                :parameters,
                [recovery]
              )

              list.insert(i,windup_cmd)

              caller_patched+=1
              i+=2
            end
          end

          abort 'no monster attack callers patched' if
            caller_patched==0

          map_patched=0
          maps_touched={}
          switches_seen={}
          coord_triggers=0

          map_groups=Dir.glob(
            File.join(
              game,
              'Data',
              '*Map[0-9][0-9][0-9].rxdata'
            )
          ).group_by{|p|File.basename(p)[/Map\d{3}/]}

          map_groups.each do |map_key,paths|
            map_path=paths.max_by{|p|File.size(p)}

            next unless
              map_path&&
              File.size(map_path)>100

            map=Marshal.load(
              File.binread(map_path)
            )

            changed=false

            (iv(map,:events)||{}).each do |eid,event|
              (iv(event,:pages)||[]).each do |page|
                list=iv(page,:list)||[]
                i=0

                while i<list.length
                  cmd=list[i]

                  unless iv(cmd,:code)==121
                    i+=1
                    next
                  end

                  p=iv(cmd,:parameters)||[]
                  first=p[0].to_i
                  last=p[1].to_i
                  state=p[2].to_i

                  unless state==0&&first==last
                    i+=1
                    next
                  end

                  info=switch_anim[first]

                  unless info
                    i+=1
                    next
                  end

                  ids=info[:ids]
                  coord=info[:coord]
                  swap_frames=info[:swap_frames]
                  coord_literal=coord.dump

                  anim_cmd=RPG::EventCommand.new

                  setiv(anim_cmd,:code,355)

                  setiv(
                    anim_cmd,
                    :indent,
                    iv(cmd,:indent).to_i
                  )

                  setiv(
                    anim_cmd,
                    :parameters,
                    [
                      "e=$game_map.events[#{eid}];" \
                      "if e;" \
                      "aid={2=>#{ids[2]},4=>#{ids[4]},6=>#{ids[6]},8=>#{ids[8]}}[e.direction];" \
                      "if aid;" \
                      "e.sl_attack_begin(#{coord_literal},#{swap_frames});" \
                      "e.animation_id=aid;" \
                      "end;" \
                      "end"
                    ]
                  )

                  list.insert(i,anim_cmd)

                  map_patched+=1
                  coord_triggers+=1
                  switches_seen[first]=true
                  changed=true
                  i+=2
                end
              end
            end

            if changed
              File.binwrite(
                map_path,
                Marshal.dump(map)
              )

              maps_touched[map_key]=true
            end
          end

          missing=switch_anim.keys.reject{|sid|switches_seen[sid]}

          puts "UNSEEN_SWITCHES=#{missing.sort.join(',')}" unless
            missing.empty?

          abort 'no map attack triggers patched' if
            map_patched==0

          File.binwrite(
            ce_path,
            Marshal.dump(common_events)
          )

          File.binwrite(
            anim_path,
            Marshal.dump(animations)
          )

          File.binwrite(
            scripts_path,
            Marshal.dump(scripts)
          )

          File.write(
            File.join(game,'sl_attack_sheets.txt'),
            used_sheets.keys.sort.join("\n")+"\n"
          )

          File.write(
            File.join(game,'sl_attack_coords.txt'),
            used_coords.keys.sort.join("\n")+"\n"
          )

          puts(
            "MONSTER_ATTACK_MOTION_V143U " \
            "callers=#{caller_patched} " \
            "map_triggers=#{map_patched} " \
            "coord_triggers=#{coord_triggers} " \
            "maps=#{maps_touched.length} " \
            "switches=#{switches_seen.length}/#{switch_anim.length} " \
            "sheets=#{used_sheets.length} " \
            "coords=#{used_coords.length} " \
            "generated=#{generated.length*4} " \
            "removed_old=#{removed_old}"
          )
          RB

          ruby -c /tmp/monster_patch.rb
          ruby -EUTF-8:UTF-8 /tmp/monster_patch.rb player/gameasync

      - name: Convert media
        run: bash /tmp/base_convert_media.sh

      - name: Build mappings
        run: bash /tmp/base_build_mappings.sh

      - name: Patch browser from V14.3l
        run: bash /tmp/base_patch_browser.sh

      - name: Verify frozen V14.3l baseline
        run: bash /tmp/base_verify.sh

      - name: Preload monster attack assets
        run: |
          cat > /tmp/preload_patch.rb <<'RB'
          # encoding: UTF-8
          path=ARGV.fetch(0)
          sheets_path=ARGV.fetch(1)
          coords_path=ARGV.fetch(2)
          html=File.read(path)

          sheets=File.readlines(
            sheets_path,
            chomp:true
          ).reject{|x|x.empty?}

          coords=File.readlines(
            coords_path,
            chomp:true
          ).reject{|x|x.empty?}

          abort 'attack sheet list too small' if sheets.length<20
          abort 'attack coordinate list too small' if coords.length<20

          start_marker=
            "  var ka='/game/Graphics/Animations/흑기사모션.png';"

          load_marker=
            "FS.createPreloadedFile('/game/Graphics/Animations','흑기사모션.png'"

          start=html.index(start_marker)

          abort 'black knight preload start missing' unless start

          load_pos=html.index(
            load_marker,
            start
          )

          abort 'black knight preload loader missing' unless load_pos

          finish=html.index(
            "\n",
            load_pos
          )

          abort 'black knight preload end missing' unless finish

          replacement=<<JS.chomp
            var slAttackSheets=#{sheets.inspect};
            slAttackSheets.forEach(function(name){
              var file=name+'.png';
              var p='/game/Graphics/Animations/'+file;
              try{if(FS.analyzePath(p).exists)FS.unlink(p);}catch(e){}
              FS.createPreloadedFile('/game/Graphics/Animations',file,encodeURI('gameasync/Graphics/Animations/'+file+'?v=v143u'),true,true,function(){},function(){console.error('SLANIMERR|'+file);});
            });
            var slAttackCoords=#{coords.inspect};
            slAttackCoords.forEach(function(name){
              var file=name+'.png';
              var p='/game/Graphics/Characters/'+file;
              try{if(FS.analyzePath(p).exists)FS.unlink(p);}catch(e){}
              FS.createPreloadedFile('/game/Graphics/Characters',file,encodeURI('gameasync/Graphics/Characters/'+file+'?v=v143u'),true,true,function(){},function(){console.error('SLCOORDERR|'+file);});
            });
          JS

          html[start...finish]=replacement
          html.gsub!('V14.3l','V14.3u')
          html.gsub!('v143l','v143u')

          File.write(
            path,
            html
          )

          puts(
            "MONSTER_PRELOAD_OK sheets=#{sheets.length} coords=#{coords.length}"
          )
          RB

          ruby -c /tmp/preload_patch.rb

          ruby -EUTF-8:UTF-8 \
            /tmp/preload_patch.rb \
            player/index.html \
            player/gameasync/sl_attack_sheets.txt \
            player/gameasync/sl_attack_coords.txt

      - name: Verify V14.3u monster attack package
        run: |
          set -e

          test -s player/index.html
          test -s player/gameasync/sl_attack_sheets.txt
          test -s player/gameasync/sl_attack_coords.txt

          test "$(wc -l < player/gameasync/sl_attack_sheets.txt)" -ge 20
          test "$(wc -l < player/gameasync/sl_attack_coords.txt)" -ge 20

          grep -Fq 'slAttackSheets' player/index.html
          grep -Fq 'slAttackCoords' player/index.html
          grep -Fq 'v143u' player/index.html

          ! grep -Fq \
            "var ka='/game/Graphics/Animations/흑기사모션.png'" \
            player/index.html

          cat > /tmp/monster_verify.rb <<'RB'
          # encoding: UTF-8
          require 'zlib'
          game=ARGV.fetch(0)

          class RawMarshalObject
            def self._load(data)
              o=allocate
              o.instance_variable_set(:@raw,data)
              o
            end
            def _dump(_depth)
              @raw
            end
          end

          class Tone < RawMarshalObject; end
          class Color < RawMarshalObject; end
          class Rect < RawMarshalObject; end
          class Table < RawMarshalObject; end

          module RPG
            class AudioFile; end
            class Animation
              class Frame; end
              class Timing; end
            end
            class CommonEvent; end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
            class Map; end
            class Event
              class Page
                class Condition; end
                class Graphic; end
              end
            end
          end

          def iv(o,n)
            o.instance_variable_get("@#{n}")
          end

          cp=Dir.glob(
            File.join(game,'Data','*CommonEvents.rxdata')
          ).max_by{|p|File.size(p)}

          ap=Dir.glob(
            File.join(game,'Data','*Animations.rxdata')
          ).max_by{|p|File.size(p)}

          ce=Marshal.load(
            File.binread(cp)
          )

          final_green=iv(ce[3],:list)||[]
          final_bravery=iv(ce[8],:list)||[]

          abort 'final green stack effect missing' unless
            iv(final_green[2],:code)==207&&
            iv(final_green[2],:parameters)==[-1,2]

          abort 'final green stack exit missing' unless
            iv(final_green[3],:code)==115

          abort 'final bravery stack effect missing' unless
            iv(final_bravery[2],:code)==207&&
            iv(final_bravery[2],:parameters)==[-1,270]

          abort 'final bravery stack effect event missing' unless
            iv(final_bravery[3],:code)==117&&
            iv(final_bravery[3],:parameters)==[589]

          abort 'final bravery stack exit missing' unless
            iv(final_bravery[4],:code)==115

          an=Marshal.load(
            File.binread(ap)
          )

          scripts=Marshal.load(
            File.binread(
              File.join(
                game,
                'Data',
                'Scripts.rxdata'
              )
            )
          )

          coordinate_script=scripts.select do |e|
            e.is_a?(Array)&&
            e.length>=3&&
            e[1].to_s=='Monster Attack Coordinate Swap'
          end

          abort "coordinate script count=#{coordinate_script.length}" unless
            coordinate_script.length==1

          src=Zlib::Inflate.inflate(
            coordinate_script[0][2]
          ).force_encoding(
            Encoding::UTF_8
          )

          abort 'sl_attack_begin missing' unless
            src.include?('def sl_attack_begin')

          abort 'sl_attack_tick missing' unless
            src.include?('def sl_attack_tick')

          abort 'old src_rect zero hide remains' if
            src.include?('src_rect.set(0,0,0,0)')

          bad=[]
          slm=0

          an.compact.each do |a|
            name=iv(
              a,
              :name
            ).to_s.dup.force_encoding(Encoding::UTF_8)

            next unless name.start_with?('SLM ')

            slm+=1
            m=name.match(/ W(\d+) F(\d+)$/)
            next unless m

            wait=m[1].to_i
            frames=m[2].to_i

            bad<<[
              iv(a,:id),
              frames,
              wait
            ] if frames>wait
          end

          abort "animation exceeds wait units #{bad.inspect}" unless
            bad.empty?

          abort "generated animations too small=#{slm}" unless
            slm>=80

          [
            [24,110,851,25],
            [25,112,850,20],
            [27,113,853,30],
            [424,407,853,30]
          ].each do |cid,sid,aid,total|
            x=ce[cid]

            abort "caller #{cid} missing" unless x

            abort "caller #{cid} switch mismatch" unless
              iv(x,:switch_id).to_i==sid

            list=iv(x,:list)||[]

            waits=list.select do |c|
              iv(c,:code)==106
            end.map do |c|
              (iv(c,:parameters)||[])[0].to_i
            end

            abort "caller #{cid} wait sum #{waits.inspect}" unless
              waits.sum==total

            call=list.find do |c|
              iv(c,:code)==117
            end

            abort "caller #{cid} attack mismatch" unless
              call&&
              (iv(call,:parameters)||[])[0].to_i==aid
          end

          expected={
            '놀모션'=>20,
            '오크전사모션'=>16,
            '흑기사모션'=>24
          }

          expected.each do |sheet,frames|
            found=an.compact.select do |a|
              iv(
                a,
                :animation_name
              ).to_s.dup.force_encoding(Encoding::UTF_8)==sheet&&
              iv(
                a,
                :name
              ).to_s.include?(" F#{frames}")
            end

            abort "#{sheet} frame target missing" if
              found.empty?
          end

          map_triggers=0
          coord_triggers=0
          specific={}

          map_groups=Dir.glob(
            File.join(
              game,
              'Data',
              '*Map[0-9][0-9][0-9].rxdata'
            )
          ).group_by{|p|File.basename(p)[/Map\d{3}/]}

          map_groups.each do |key,paths|
            pth=paths.max_by{|p|File.size(p)}

            next unless
              pth&&
              File.size(pth)>100

            map=Marshal.load(
              File.binread(pth)
            )

            (iv(map,:events)||{}).each do |eid,event|
              (iv(event,:pages)||[]).each do |page|
                (iv(page,:list)||[]).each do |cmd|
                  next unless iv(cmd,:code)==355

                  txt=(iv(cmd,:parameters)||[])[0].to_s

                  next unless
                    txt.include?('sl_attack_begin(')&&
                    txt.include?('e.animation_id=aid')

                  map_triggers+=1
                  coord_triggers+=1

                  if key=='Map029'&&[6,19,23,15].include?(eid)
                    specific[eid]=txt
                  end
                end
              end
            end
          end

          abort "map triggers too small=#{map_triggers}" unless
            map_triggers>=100

          abort "coordinate triggers too small=#{coord_triggers}" unless
            coord_triggers>=1000

          def attack_coord_call(txt)
            m=txt.to_s.match(
              /sl_attack_begin\((.+?),(\d+)\)/
            )

            return [nil,nil] unless m

            [
              eval(m[1]),
              m[2].to_i
            ]
          end

          orc=attack_coord_call(
            specific[19]
          )

          gnoll=attack_coord_call(
            specific[6]
          )

          black=attack_coord_call(
            specific[23]
          )

          abort "orc coordinate mapping #{orc.inspect}" unless
            orc==['오크전사좌표',32]

          abort "gnoll coordinate mapping #{gnoll.inspect}" unless
            gnoll==['놀좌표',40]

          abort "black knight coordinate mapping #{black.inspect}" unless
            black==['흑기사좌표',48]

          puts(
            "MONSTER_VERIFY_V143U " \
            "map_triggers=#{map_triggers} " \
            "coord=#{coord_triggers} " \
            "animations=#{slm} " \
            "wait_overrun=#{bad.length}"
          )
          RB

          ruby -c /tmp/monster_verify.rb
          ruby -EUTF-8:UTF-8 \
            /tmp/monster_verify.rb \
            player/gameasync

          for n in '오크전사' '놀' '흑기사' '드레이크' '오크'; do
            normal="$(identify -format '%wx%h' "player/gameasync/Graphics/Characters/${n}.png")"
            coord="$(identify -format '%wx%h' "player/gameasync/Graphics/Characters/${n}좌표.png")"
            echo "$n normal=$normal coord=$coord"
            test "$normal" = "$coord"
          done

          for n in '드레이크' '오크'; do
            alpha_max="$(convert "player/gameasync/Graphics/Characters/${n}좌표.png" -alpha extract -format '%[fx:maxima]' info: 2>/dev/null)"
            echo "$n coord_alpha_max=$alpha_max"
            awk -v value="$alpha_max" 'BEGIN { exit !((value+0.0)==0.0) }'
          done

          du -sh player

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
