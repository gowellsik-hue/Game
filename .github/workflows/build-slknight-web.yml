          lookup=lambda do |name|
            matches=rows.select{|r|r.is_a?(Array)&&r[1].to_s.dup.force_encoding('UTF-8')==name}
            raise "Missing/duplicate script #{name}" unless matches.size==1
            matches.first
          end
          replace_once=lambda do |s,old,new|
            raise "Old script expression missing or duplicated: #{old[0,75]}" unless s.scan(old).size==1
