                money=amount
              end
              $game_party.gain_gold(money) if money>0
              if xp>0 && $game_actors!=nil && $game_actors[1]!=nil
                actor=$game_actors[1]
                actor.exp=actor.exp+xp
              end
              if $game_variables!=nil
                $game_variables[333]=money
                $game_variables[1926]=xp
              end
            end
          end

          class Game_Event
            alias slv541_original_initialize initialize
            def initialize(mid,ev)
              @slv541_rewarded=false
              @slv541_saw_live=false
              slv541_original_initialize(mid,ev)
            end
            alias slv541_original_refresh refresh
            def refresh
              slv541_original_refresh
