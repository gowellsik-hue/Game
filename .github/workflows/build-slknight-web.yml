name: build-slknight-web.yml | V4.15 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Restore V4.15 inventory baseline
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 46024064522
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify original game
        shell: bash
        run: |
          set -euo pipefail

          test -s baseline/artifact.tar

          mkdir -p site
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          import json

          root=Path('site')

          before={
              p.relative_to(root).as_posix():
                  hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          assert len(before)==6086

          assert before[
              'knight/gameasync/Data/Scripts.rxdata'
          ]=='31b4de3fae9355a9ecdab4edef8702bd604adcf44eed5b6edcd072dc48c8040f'

          assert before[
              'knight/assets/shared-v229r115.pack'
          ].startswith('9ea791141200d7b0')

          assert before[
              'knight/gameasync/mapping.js'
          ].startswith('88ea126491e3e13f')

          assert before[
              'knight/gameasync/bitmap-map.js'
          ].startswith('62d70e4d5e117cf2')

          assert before[
              'knight/js/dpad.js'
          ]=='b14256f3b2fb879cbb43b441433307278a9601ba9066eed39442287951851050'

          skin=root/'knight/gameasync/Graphics/Windowskins/SLInventory.png'

          assert hashlib.md5(
              skin.read_bytes()
          ).hexdigest()=='68cbaceda240796a16ae77ebbc0c5b6a'

          Path('/tmp/sl415-before.json').write_text(
              json.dumps(before),
              'utf8'
          )

          print('PASS exact V4.15 inventory baseline')
          PYTHON

      - name: Integrate original menu windows
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl415-menu.rb <<'RUBY'
          # encoding: UTF-8
          require 'digest'
          require 'zlib'

          path,out=ARGV
          raw=File.binread(path)

          raise 'Baseline digest' unless
            Digest::SHA256.hexdigest(raw)==
            '31b4de3fae9355a9ecdab4edef8702bd604adcf44eed5b6edcd072dc48c8040f'

          rows=Marshal.load(raw)

          raise 'Script count' unless rows.size==137

          before=rows.map{|r|Marshal.dump(r)}

          read=->(i){
            Zlib::Inflate.inflate(
              rows[i][2]
            ).force_encoding('UTF-8')
          }

          replace=->(s,a,b){
            raise "Anchor #{a.inspect[0,100]}: #{s.scan(a).size}" unless
              s.scan(a).size==1
            s.sub(a){b}
          }

          edit=->(i){
            src=read.call(i)
            s=src.gsub("\r\n","\n")
            t=$patch.call(i,s)
            raise "No edit #{i}" if t==s
            RubyVM::InstructionSequence.compile(t)
            t=t.gsub("\n","\r\n") if src.include?("\r\n")
            rows[i][2]=Zlib::Deflate.deflate(t.b)
          }

          $patch=lambda do |i,s|

            case i

            when 79

              s=replace.call(
                s,
                '@command_window.index < 3',
                '@command_window.index < 4'
              )

              s=replace.call(
                s,
                'Window_Command.new(160, [s1, s2, s3, s4, s5])',
                'Window_Command.new(156, [s1, s2, s3, s4, s5])'
              )

              s=replace.call(
                s,
                "    @gold_window.y = 250\n",
                "    @gold_window.y = @command_window.height + 4\n"+
                "    @gold_window.width = 156\n"
              )

              s=replace.call(
                s,
                '$아데나.y = 270',
                '$아데나.y = @gold_window.y + 20'
              )

              s=replace.call(
                s,
                "    @status_window.opacity = 255\n",
                <<'NEW'
              @status_window.opacity = 255
              @status_window.width = 640
              @status_window.height = 600
              @status_window.contents.dispose
              @status_window.contents = Bitmap.new(608, 568)
              @status_window.refresh

              @sl415_header = Window_Help.new
              @sl415_header.x = 160
              @sl415_header.visible = false

              @sl415_page = nil
              @sl415_actor_index = 0

              [@command_window, @gold_window, @status_window, @sl415_header].each do |w|
                w.windowskin = RPG::Cache.windowskin("SLInventory")
                w.back_opacity = 255
              end
          NEW
              )

              s=replace.call(
                s,
                "    @status_window.dispose\n",
                "    @sl415_page.dispose if @sl415_page\n"+
                "    @sl415_header.dispose\n"+
                "    @status_window.dispose\n"
              )

              s=replace.call(
                s,
                /    # 스테이터스 윈도우가 액티브의 경우: update_status 를 부른다\n.*?    end\n/m,
                "    update_status if @sl415_page\n"
              )

              s=replace.call(
                s,
                /      when 0  # 아이템\n.*?(?=      when 4  # 게임 종료)/m,
                <<'NEW'
                when 0, 1, 2, 3
                  if @command_window.index == 1 && SLV14Menu.actor(@sl415_actor_index).restriction >= 2
                    $game_system.se_play($data_system.buzzer_se)
                    return
                  end
                  $game_system.se_play($data_system.decision_se)
                  @command_window.active = false
                  @status_window.visible = false
                  @sl415_header.visible = true
                  sl415_open_page
          NEW
              )

              s=replace.call(
                s,
                /  def update_status\n.*\z/m,
                <<'NEW'
            def update_status
              @sl415_header.update

              p = @sl415_page
              kind = @command_window.index

              primary = case kind
              when 0 then p.instance_variable_get(:@item_window).active
              when 1 then p.instance_variable_get(:@skill_window).active
              when 2 then p.instance_variable_get(:@right_window).active
              when 3 then true
              end

              if primary

                if Input.trigger?(Input::B)

                  $game_system.se_play($data_system.cancel_se)

                  p.dispose

                  @sl415_page = nil
                  @sl415_header.visible = false
                  @status_window.visible = true

                  @status_window.refresh
                  @gold_window.refresh

                  @command_window.active = true

                  SLHotbar.mode('hide')

                  puts('SLMENUPAGE|none')

                  return

                end

                direction = 0

                direction = -1 if Input.trigger?(Input::LEFT) || (kind != 0 && Input.trigger?(Input::L))
                direction = 1 if Input.trigger?(Input::RIGHT) || (kind != 0 && Input.trigger?(Input::R))

                if direction != 0 && SLV14Menu.members.size > 1

                  @sl415_actor_index = (@sl415_actor_index + direction) % SLV14Menu.members.size

                  $game_system.se_play($data_system.cursor_se)

                  if kind == 0

                    p.instance_variable_set(:@actor_index, @sl415_actor_index)

                    @sl415_header.set_text(
                      "<  " + SLV14Menu.actor(@sl415_actor_index).name.to_s + "  >",
                      1
                    )

                    SLHotbar.mode(
                      @sl415_actor_index == 0 ? 'assign' : 'hide'
                    )

                  else

                    p.dispose
                    @sl415_page = nil
                    sl415_open_page

                  end

                  return

                end

                return if direction != 0

              end

              p.update

              return unless $scene.equal?(self)

              if kind == 0 || kind == 1

                target = p.instance_variable_get(:@target_window)

                target.x = 160
                target.y = 68

                p.instance_variable_get(:@help_window).visible = !target.visible

                if kind == 0

                  p.instance_variable_get(:@item_window).visible = !target.visible

                else

                  p.instance_variable_get(:@skill_window).visible = !target.visible
                  p.instance_variable_get(:@status_window).visible = !target.visible

                end

              end

            end

            def sl415_open_page

              kind = @command_window.index

              @sl415_header.set_text(
                "<  " + SLV14Menu.actor(@sl415_actor_index).name.to_s + "  >",
                1
              )

              @sl415_page = case kind
              when 0 then Scene_Item.new
              when 1 then Scene_Skill.new(@sl415_actor_index)
              when 2 then Scene_Equip.new(@sl415_actor_index)
              when 3 then Scene_Status.new(@sl415_actor_index)
              end

              p = @sl415_page

              p.instance_variable_set(:@sl415_menu, true)
              p.instance_variable_set(:@actor_index, @sl415_actor_index)

              p.main

              windows = []

              if kind == 0 || kind == 1

                help = p.instance_variable_get(:@help_window)

                help.x = 160
                help.y = 68

                target = p.instance_variable_get(:@target_window)

                target.x = 160
                target.y = 68

                windows.push(help, target)

                if kind == 0

                  list = p.instance_variable_get(:@item_window)

                  list.x = 160
                  list.y = 136
                  list.height = 464

                  windows.push(list)

                else

                  status = p.instance_variable_get(:@status_window)

                  status.x = 160
                  status.y = 136

                  list = p.instance_variable_get(:@skill_window)

                  list.x = 160
                  list.y = 204
                  list.height = 396

                  windows.push(status, list)

                end

              elsif kind == 2

                help = p.instance_variable_get(:@help_window)
                left = p.instance_variable_get(:@left_window)
                right = p.instance_variable_get(:@right_window)

                help.x = 160
                help.y = 68

                left.x = 160
                left.y = 136
                left.width = 268

                right.x = 432
                right.y = 136

                windows.push(help, left, right)

                p.instance_variable_get(:@item_windows).each do |w|

                  next unless w

                  w.x = 160
                  w.y = [left.y + left.height, right.y + right.height].max + 4
                  w.height = 600 - w.y

                  windows.push(w)

                end

              else

                status = p.instance_variable_get(:@status_window)

                status.x = 160
                status.y = 68
                status.height = 532

                status.contents.dispose
                status.contents = Bitmap.new(608, 500)
                status.refresh

                windows.push(status)

              end

              windows.each do |w|

                w.windowskin = RPG::Cache.windowskin("SLInventory")
                w.back_opacity = 255

              end

              SLHotbar.mode(
                kind == 0 && @sl415_actor_index == 0 ? 'assign' : 'hide'
              )

              puts(
                'SLMENUPAGE|' + (kind == 1 ? 'skill' : 'none')
              )

            end

          end
          NEW
              )

              s

            when 80,82,83,84

              s=replace.call(
                s,
                "    Graphics.transition\n",
                "    Graphics.transition unless @sl415_menu\n"
              )

              s=replace.call(
                s,
                "    Graphics.freeze\n",
                "    Graphics.freeze unless @sl415_menu\n"
              )

              if i==80

                s=replace.call(
                  s,
                  '@item_window = Window_Item.new',
                  '@item_window = Window_Item.new(@sl415_menu ? 1 : 2)'
                )

              end

              if i==82

                s=replace.call(
                  s,
                  '@skill_window = Window_Skill.new(@actor)',
                  '@skill_window = Window_Skill.new(@actor, @sl415_menu ? 1 : 2)'
                )

              end

              s

            when 42

              s=replace.call(
                s,
                "  def initialize\n",
                "  def initialize(columns = 2)\n"
              )

              replace.call(
                s,
                '@column_max = 2',
                '@column_max = columns'
              )

            when 44

              s=replace.call(
                s,
                'def initialize(actor)',
                'def initialize(actor, columns = 2)'
              )

              s=replace.call(
                s,
                '@column_max = 2',
                '@column_max = columns'
              )

              s=replace.call(
                s,
                'x = 4 + index % 2 * (288 + 32)',
                'x = 4 + index % @column_max * (288 + 32)'
              )

              s=replace.call(
                s,
                'y = index / 2 * 32',
                'y = index / @column_max * 32'
              )

              s=replace.call(
                s,
                'self.contents.draw_text(x + 28, y, 204, 32, skill.name, 0)',
                'self.contents.draw_text(x + 28, y, @column_max == 1 ? self.contents.width - 96 : 204, 32, skill.name, 0)'
              )

              replace.call(
                s,
                'self.contents.draw_text(x + 232, y, 48, 32, skill.sp_cost.to_s, 2)',
                'self.contents.draw_text(@column_max == 1 ? self.contents.width - 56 : x + 232, y, 48, 32, skill.sp_cost.to_s, 2)'
              )

            when 113

              %w[
                Scene_Item
                Scene_Skill
                Scene_Equip
                Scene_Status
              ].each do |name|

                pattern=/(class #{name}\n  include XRXS_MP7_Module\n.*?  def main\n)    create_spriteset\n/m

                match=s.match(pattern)

                raise "Scene wrapper #{name}" unless match

                s=replace.call(
                  s,
                  pattern,
                  match[1]+"    create_spriteset unless @sl415_menu\n"
                )

              end

              s

            when 115

              a=s.index(
                "class Window_Item < Window_Selectable\n"
              )

              raise 'Inventory override' unless a

              b=s.index(
                'class Window_ShopNumber',
                a
              )

              raise 'Inventory override end' unless b

              prefix,body,suffix=s[0...a],s[a...b],s[b..-1]

              s=body

              s=replace.call(
                s,
                'x = 4 + index % 2 * (288 + 32)',
                'x = 4 + index % @column_max * (288 + 32)'
              )

              s=replace.call(
                s,
                'y = index / 2 * 32',
                'y = index / @column_max * 32'
              )

              s=replace.call(
                s,
                'self.contents.draw_text(x + 28, y, 212, 32, item.name, 0)',
                'self.contents.draw_text(x + 28, y, @column_max == 1 ? self.contents.width - 100 : 212, 32, item.name, 0)'
              )

              s=replace.call(
                s,
                'x_i = x - width + 24',
                'x_i = (@column_max == 1 ? self.contents.width - 264 : x + 24) - width'
              )

              prefix+s+suffix

            when 130

              replace.call(
                s,
                "class Scene_Item\n  alias sl_hotbar_update_item update_item\n  def update_item\n",
                "class Scene_Item\n  alias sl_hotbar_update_item update_item\n  def update_item\n"+
                "    return sl_hotbar_update_item if @sl415_menu && @actor_index != 0\n"
              )

            else

              raise i.to_s

            end

          end

          expected=[
            42,44,79,80,82,83,84,113,115,130
          ]

          expected.each{|i|edit.call(i)}

          changed=rows.each_index.select{
            |i|Marshal.dump(rows[i])!=before[i]
          }

          raise "Scope #{changed}" unless
            changed==expected

          File.binwrite(out,Marshal.dump(rows))

          raise 'Roundtrip' unless
            Marshal.load(File.binread(out))==rows

          puts "PASS #{changed.size} menu scripts"
          puts "PASS #{137-changed.size} unchanged scripts"
          puts "MD5 #{Digest::MD5.file(out).hexdigest}"
          RUBY

          ruby -c /tmp/sl415-menu.rb

          ruby /tmp/sl415-menu.rb \
            site/knight/gameasync/Data/Scripts.rxdata \
            /tmp/sl415-menu.rxdata

          cp /tmp/sl415-menu.rxdata \
            site/knight/gameasync/Data/Scripts.rxdata

      - name: Refine original inventory skin
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv \
            --system-site-packages /tmp/sl415-venv

          /tmp/sl415-venv/bin/python -c "import PIL" || \
            /tmp/sl415-venv/bin/python -m pip install \
              --quiet --disable-pip-version-check \
              'Pillow>=11,<13'

          /tmp/sl415-venv/bin/python - <<'PYTHON'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import hashlib
          import json
          import struct
          import base64
          import io
          import re

          root=Path('site')
          game=root/'knight/gameasync'

          rel='Graphics/Windowskins/SLInventory.png'
          key='graphics/windowskins/slinventory'

          target=game/rel
          raw=target.read_bytes()

          old_digest=hashlib.md5(raw).hexdigest()

          assert old_digest=='68cbaceda240796a16ae77ebbc0c5b6a'

          old=Image.open(
              io.BytesIO(raw)
          ).convert('RGBA')

          assert old.size==(192,128)

          skin=old.copy()

          skin.paste(
              (41,39,39,255),
              (0,0,128,128)
          )

          skin.paste(
              (0,0,0,0),
              (128,0,192,64)
          )

          skin.paste(
              old.crop((144,16,176,48)),
              (144,16)
          )

          draw=ImageDraw.Draw(skin)

          draw.rectangle(
              (128,0,191,63),
              outline=(112,108,102,255),
              width=1
          )

          assert (
              skin.crop((128,64,192,128)).tobytes()
              ==
              old.crop((128,64,192,128)).tobytes()
          )

          assert (
              skin.crop((144,16,176,48)).tobytes()
              ==
              old.crop((144,16,176,48)).tobytes()
          )

          assert len(
              set(skin.crop((0,0,128,128)).getdata())
          )==1

          buffer=io.BytesIO()

          skin.save(buffer,format='PNG')

          new_bytes=buffer.getvalue()

          new_digest=hashlib.md5(
              new_bytes
          ).hexdigest()

          assert new_digest!=old_digest

          target.write_bytes(new_bytes)

          packs=sorted(
              (root/'knight/assets').glob('*.pack')
          )

          assert len(packs)==50

          matches=[]

          for p in packs:

              with p.open('rb') as f:

                  header_size=struct.unpack(
                      '<I',f.read(4)
                  )[0]

                  assert 0<header_size<p.stat().st_size-4

                  info=json.loads(
                      f.read(header_size).decode('utf8')
                  )

                  for row in info['files']:

                      if row[0]==key:

                          matches.append(p)

          pack=root/'knight/assets/shared-v229r115.pack'

          assert matches==[pack]

          old_pack=pack.read_bytes()

          assert hashlib.sha256(
              old_pack
          ).hexdigest().startswith(
              '9ea791141200d7b0'
          )

          hlen=struct.unpack_from(
              '<I',old_pack,0
          )[0]

          header=json.loads(
              old_pack[4:4+hlen].decode('utf8')
          )

          payload=old_pack[4+hlen:]

          assert header['kind']=='shared'

          rows=header['files']

          assert len(rows)==2293

          assert len({r[0] for r in rows})==2293

          offset=0

          for k,o,n in rows:

              assert o==offset and n>0

              offset+=n

          assert offset==len(payload)

          indexes=[
              i for i,r in enumerate(rows)
              if r[0]==key
          ]

          assert len(indexes)==1

          index=indexes[0]

          _,start,size=rows[index]

          assert payload[start:start+size]==raw

          delta=len(new_bytes)-size

          new_payload=(
              payload[:start]+
              new_bytes+
              payload[start+size:]
          )

          new_rows=[]

          for i,(k,o,n) in enumerate(rows):

              if i==index:

                  new_rows.append(
                      [k,o,len(new_bytes)]
                  )

              elif i>index:

                  new_rows.append(
                      [k,o+delta,n]
                  )

              else:

                  new_rows.append(
                      [k,o,n]
                  )

          unchanged=0

          for i,(k,o,n) in enumerate(rows):

              k2,o2,n2=new_rows[i]

              assert k==k2

              previous=payload[o:o+n]

              current=new_payload[o2:o2+n2]

              if i==index:

                  assert current==new_bytes

              else:

                  assert current==previous

                  unchanged+=1

          assert unchanged==2292

          assert (
              new_rows[-1][1]+new_rows[-1][2]
              ==len(new_payload)
          )

          header['files']=new_rows

          new_header=json.dumps(
              header,
              ensure_ascii=False,
              separators=(',',':')
          ).encode('utf8')

          pack.write_bytes(
              struct.pack('<I',len(new_header))+
              new_header+
              new_payload
          )

          pack_digest=hashlib.sha256(
              pack.read_bytes()
          ).hexdigest()[:16]

          mapper=game/'mapping.js'

          old_mapping_digest=hashlib.sha256(
              mapper.read_bytes()
          ).hexdigest()[:16]

          assert old_mapping_digest=='88ea126491e3e13f'

          s=mapper.read_text('utf8')

          script_digest=hashlib.md5(
              (game/'Data/Scripts.rxdata').read_bytes()
          ).hexdigest()

          references=[
              (
                  'Data/Scripts.rxdata?h=934d82c5d8d82ed202e7216323bfac45',
                  'Data/Scripts.rxdata?h='+script_digest
              ),
              (
                  rel+'?h='+old_digest,
                  rel+'?h='+new_digest
              )
          ]

          for a,b in references:

              assert s.count(a)==1

              s=s.replace(a,b)

              assert s.count(b)==1

          mapper.write_text(s,'utf8')

          mapping_digest=hashlib.sha256(
              mapper.read_bytes()
          ).hexdigest()[:16]

          bitmap_map=game/'bitmap-map.js'

          old_bitmap_digest=hashlib.sha256(
              bitmap_map.read_bytes()
          ).hexdigest()[:16]

          assert old_bitmap_digest=='62d70e4d5e117cf2'

          s=bitmap_map.read_text('utf8')

          pattern=re.compile(
              r'("'+re.escape(key)+
              r'":\s*\[192,\s*128,\s*"data:image/png;base64,)'+
              r'([A-Za-z0-9+/=]+)("\])'
          )

          matches=list(pattern.finditer(s))

          assert len(matches)==1

          match=matches[0]

          assert base64.b64decode(
              match.group(2)
          )==raw

          encoded=base64.b64encode(
              new_bytes
          ).decode('ascii')

          s=(
              s[:match.start(2)]+
              encoded+
              s[match.end(2):]
          )

          bitmap_map.write_text(s,'utf8')

          bitmap_digest=hashlib.sha256(
              bitmap_map.read_bytes()
          ).hexdigest()[:16]

          loader=root/'knight/js/sl-assets-v229r115.js'

          old_loader_digest=hashlib.sha256(
              loader.read_bytes()
          ).hexdigest()[:16]

          s=loader.read_text('utf8')

          old_pack_url=(
              'shared-v229r115.pack?v=V4.15&h='
              '9ea791141200d7b0'
          )

          new_pack_url=(
              'shared-v229r115.pack?v=V4.15&h='
              +pack_digest
          )

          assert s.count(old_pack_url)==1

          s=s.replace(
              old_pack_url,
              new_pack_url
          )

          loader.write_text(s,'utf8')

          loader_digest=hashlib.sha256(
              loader.read_bytes()
          ).hexdigest()[:16]

          dpad=root/'knight/js/dpad.js'

          s=dpad.read_text('utf8')

          edits=[
              (
                  "let slScene='',slHotMode='hide';",
                  "let slScene='',slHotMode='hide',slMenuPage='none';"
              ),
              (
                  "const visible=slScene==='Scene_Map'||slScene==='Scene_Skill';",
                  "const visible=slScene==='Scene_Map'||slScene==='Scene_Skill'||(slScene==='Scene_Menu'&&slMenuPage==='skill');"
              ),
              (
                  "slScene=t.slice(i+8).split(/\\s/)[0];",
                  "slScene=t.slice(i+8).split(/\\s/)[0];slMenuPage='none';"
              ),
              (
                  "  i=t.indexOf('SLHOT|MODE|');",
                  "  i=t.indexOf('SLMENUPAGE|');\n"+
                  "  if(i>=0){slMenuPage=t.slice(i).split('|')[1]||'none';updateSkillbar();}\n"+
                  "  i=t.indexOf('SLHOT|MODE|');"
              )
          ]

          for a,b in edits:

              assert s.count(a)==1

              s=s.replace(a,b)

          dpad.write_text(s,'utf8')

          dpad_digest=hashlib.sha256(
              dpad.read_bytes()
          ).hexdigest()[:16]

          page=root/'knight/index.html'

          s=page.read_text('utf8')

          references=[
              (
                  'gameasync/mapping.js?v=v4.15&h='+old_mapping_digest,
                  'gameasync/mapping.js?v=v4.15&h='+mapping_digest,
                  1
              ),
              (
                  'gameasync/bitmap-map.js?v=v4.15&h='+old_bitmap_digest,
                  'gameasync/bitmap-map.js?v=v4.15&h='+bitmap_digest,
                  2
              ),
              (
                  'js/sl-assets-v229r115.js?v=v4.15&h='+old_loader_digest,
                  'js/sl-assets-v229r115.js?v=v4.15&h='+loader_digest,
                  1
              ),
              (
                  'js/dpad.js?v=v4.13-input2',
                  'js/dpad.js?v=v4.15&h='+dpad_digest,
                  1
              )
          ]

          for a,b,count in references:

              assert s.count(a)==count,(a,s.count(a))

              s=s.replace(a,b)

              assert s.count(b)==count

          page.write_text(s,'utf8')

          print('PASS uniform menu background')
          print('PASS original cursor preserved')
          print('PASS one-pixel frame')
          print('PASS all 50 packs inspected')
          print('PASS 2292 other packed assets unchanged')
          print('PASS current script mapping')
          print('PASS current skin mapping')
          print('PASS integrated mobile skill menu state')
          PYTHON

      - name: Verify exact modification scope
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          import json

          root=Path('site')

          before=json.loads(
              Path('/tmp/sl415-before.json').read_text('utf8')
          )

          after={
              p.relative_to(root).as_posix():
                  hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          assert len(after)==6086

          assert set(before)==set(after)

          changed={
              k for k in before
              if before[k]!=after[k]
          }

          expected={
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/Graphics/Windowskins/SLInventory.png',
              'knight/assets/shared-v229r115.pack',
              'knight/gameasync/mapping.js',
              'knight/gameasync/bitmap-map.js',
              'knight/js/sl-assets-v229r115.js',
              'knight/js/dpad.js',
              'knight/index.html'
          }

          assert changed==expected,changed^expected

          assert all(
              before[k]==after[k]
              for k in before
              if k not in expected
          )

          assert before[
              'knight/gameasync/Graphics/Windowskins/스킨.png'
          ]==after[
              'knight/gameasync/Graphics/Windowskins/스킨.png'
          ]

          print('PASS eight modified files')
          print('PASS 6078 unchanged files')
          print('PASS original global windowskin preserved')
          print('PASS original engine preserved')
          print('PASS original maps preserved')
          PYTHON

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/gameasync/bitmap-map.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: Upload V4.15
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
