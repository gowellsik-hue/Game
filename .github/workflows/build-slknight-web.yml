# SLKnight V1.18: verified V1.17 deployed game as exact baseline.
# Only existing Holy Walk/Greater Heal linkage and one extracted original icon.
# Native actor MP, CE801 timer, SLV229 movement; no engine rebuild.
name: build-slknight-web.yml | V1.18 | Holy Walk 300s and Healer Cast Fix

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Restore verified V1.17 deployed game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 42774528660
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify exact V1.17 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY_V118_BEFORE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(before)==5623,len(before)
          needed=['knight/gameasync/Data/Scripts.rxdata','knight/gameasync/mapping.js','knight/index.html','index.html','knight/js/sl-assets-v229r115.js']
          assert all(p in before for p in needed)
          assert "var version='V1.17';" in (root/'knight/js/sl-assets-v229r115.js').read_text('utf8')
          assert 'sl-build-version' not in (root/'knight/index.html').read_text('utf8')
          Path('build/v117_sha256.json').write_text(json.dumps(before),encoding='utf8')
          print('PASS exact deployed V1.17: 5623 files')
          PY_V118_BEFORE

      - name: Patch only original V1.17 Holy Walk and healer shortcut
        shell: bash
        run: |
          set -euo pipefail
          cat > build/patch_v118.rb <<'RUBY_V118'
          # encoding: utf-8
          require 'zlib'
          require 'digest'
          require 'pathname'
          SITE=File.expand_path(ARGV.fetch(0))
          DATA=File.join(SITE,'knight/gameasync/Data')
          PRE='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          class Module
            def const_missing(name);const_set(name,Class.new);end
          end
          class Table
            def self._load(x);o=allocate;o.instance_variable_set(:@raw,x);o;end
            def _dump(depth);@raw;end
          end
          class Color
            def self._load(x);o=allocate;o.instance_variable_set(:@raw,x);o;end
            def _dump(depth);@raw;end
          end
          class Tone
            def self._load(x);o=allocate;o.instance_variable_set(:@raw,x);o;end
            def _dump(depth);@raw;end
          end
          module RPG
            class AudioFile;end
            class CommonEvent;end
            class EventCommand;end
            class Item;end
            class Map;end
            class Actor;end
            class Class;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class MoveRoute;end
            class MoveCommand;end
            class Weapon;end
            class Armor;end
          end
          def check(cond,label);raise "V1.18 source mismatch: #{label}" unless cond;end
          def iv(o,k);o.instance_variable_get(k);end
          def setiv(o,k,v);o.instance_variable_set(k,v);end
          def code(c);iv(c,:@code);end
          def param(c);iv(c,:@parameters);end
          def command(id,p,ind)
            c=RPG::EventCommand.allocate
            setiv(c,:@code,id);setiv(c,:@parameters,p);setiv(c,:@indent,ind)
            c
          end
          def replace_once(s,old,new,where)
            count=s.scan(old).length
            check(count==1,"#{where} occurrences=#{count}")
            s.sub(old,new)
          end
          def rewrite_script(scripts,name)
            row=scripts.find{|a|a.is_a?(Array) && a[1].to_s==name.b}
            check(!row.nil?,"script #{name} absent")
            original=Zlib::Inflate.inflate(row[2]).force_encoding('UTF-8')
            updated=yield(original)
            check(original!=updated,"script #{name} unchanged")
            RubyVM::InstructionSequence.compile(updated)
            row[2]=Zlib::Deflate.deflate(updated.b)
            puts "SCRIPT #{name} syntax PASS"
          end

          # Original Holy Walk image/sound are already present (Animation ID 22).
          # Create exactly one 32x32 icon by extracting the existing Holy Walk sprite.
          icon_file=File.join(SITE,'knight/gameasync/Graphics/Icons/홀리워크.png')
          check(!File.exist?(icon_file),'new icon already present')
          File.binwrite(icon_file,STDIN.read.strip.unpack1('m0'))
          check(File.binread(icon_file).start_with?("\x89PNG\r\n\x1a\n".b),'new icon PNG header')

          sp_file=File.join(DATA,'Scripts.rxdata')
          scripts=Marshal.load(File.binread(sp_file))
          cast_fx=%q{healer=$game_map.events.values.find{|e|src=e.instance_variable_get(:@event);src && src.name=='[ID힐러 마법사]'}
                healer.animation_id=22 if healer}
          rewrite_script(scripts,'Mobile Hotbar') do |s|
            s=replace_once(s,"[93, '홀리 워크', '힐러 명령 주문서', '힐러의 홀리 워크']", "[93, '홀리 워크', '홀리워크', '힐러의 홀리 워크']",'skill 93 icon')
            s=replace_once(s, %q{    when 93 # Native CE801 accounts for the 15 MP charge and duration.
                return buzzer if mp < 15
                $game_variables[879] = 0
                $game_switches[811] = true}, %Q{    when 93 # Native CE801 retains the 300-second clock.
                return buzzer if mp < 15
                $game_actors[3].sp = mp - 15
                $game_variables[879] = 0
                $game_switches[811] = true
                #{cast_fx}},'direct Holy Walk: one MP charge, original timer, animation')
            replace_once(s,'Guage.show if defined?(Guage)','Guage.show','healer shortcut mruby defined? error')
          end
          rewrite_script(scripts,'V229 Unified Speed Rules') do |s|
            replace_once(s,'polymorph_rate += 0.33 if $game_switches && $game_switches[811]',
              'polymorph_rate *= (4.0 / 3.0) if $game_switches && $game_switches[811]',
              'native frame-based Holy Walk move rate')
          end
          rewrite_script(scripts,'버프,물약 이미지 출력') do |s|
            new_icon=<<'BUFF'
            if $game_switches[811] == true
              $Buf_23.opacity = 255
              $Buf_23.bitmap = RPG::Cache.icon("홀리워크")
              if $BC >= $BC_count
                if $nl == 0
                  $xm = $xm + 630
                  $nl = 1
                end
                $Buf_23.x = $xm
                $Buf_23.y = $ym + 37
              else
                $Buf_23.x = $xm
                $Buf_23.y = $ym
              end
              $xm -= 35
              $BC += 1
            else
              $Buf_23.opacity = 0
            end

          BUFF
            replace_once(s,"  if $game_switches[1088] == true\r\n    $Buf_24.opacity = 255",new_icon.gsub("\n","\r\n")+"  if $game_switches[1088] == true\r\n    $Buf_24.opacity = 255",'existing unused Buff_23 slot')
          end
          File.binwrite(sp_file,Marshal.dump(scripts))

          # Keep the original 5-minute clock in the existing parallel CE801.
          # Interpreter command_106 multiplies the wait by 2; 25*2*300 /50 FPS = 300 sec.
          ce_file=File.join(DATA,PRE+'CommonEvents.rxdata')
          ces=Marshal.load(File.binread(ce_file))
          ce801=iv(ces.fetch(801),:@list)
          check(iv(ces[801],:@switch_id)==811 && iv(ces[801],:@trigger)==2,'native CE801 identity')
          [[0,106,[20]],[1,111,[0,781,0]],[2,122,[879,879,1,0,1]],[3,111,[1,879,0,32,1]],[5,111,[12,'$game_actors[3].sp >= 15']],[6,312,[3,1,0,15]],[7,121,[814,814,0]],[20,121,[811,811,1]],[23,122,[879,879,0,0,0]]].each do |idx,kind,p|
            check(code(ce801[idx])==kind && param(ce801[idx])==p,"CE801 command #{idx}")
          end
          setiv(ce801[0],:@parameters,[25])
          setiv(ce801[1],:@parameters,[0,811,0]) # Clock runs even if healer walks out of range.
          setiv(ce801[3],:@parameters,[1,879,0,300,1])
          fx=%q{healer=$game_map.events.values.find{|e|src=e.instance_variable_get(:@event);src && src.name=='[ID힐러 마법사]'};healer.animation_id=22 if healer}
          # Insert from higher index to lower to preserve original branches.
          ce801.insert(21,command(355,['$KeyIcon.ShowIcon if $KeyIcon'],3)) # Normal expiry.
          ce801.insert(11,command(121,[811,811,1],4),command(355,['$KeyIcon.ShowIcon if $KeyIcon'],4)) # Auto MP insufficient.
          ce801.insert(8,command(355,[fx],4)) # Auto renewal effect and animation sound.

          # Auto Holy Walk command CE605: native actor SP and no activation without MP.
          ce605=iv(ces.fetch(605),:@list)
          check(iv(ces[605],:@name).to_s=='힐러 명령 주문서'.b,'CE605 name')
          [[182,111,[12,'$game_actors[3].sp >= 15']],[183,312,[3,1,0,15]],[185,121,[814,814,0]],[186,121,[813,813,0]],[192,121,[811,811,0]],[202,121,[811,811,1]]].each do |idx,kind,p|
            check(code(ce605[idx])==kind && param(ce605[idx])==p,"CE605 command #{idx}")
          end
          ce605.delete_at(192) # The old unconditional activation occurred even if MP was insufficient.
          ce605.insert(187,
            command(122,[879,879,0,0,0],5),
            command(121,[811,811,0],5),
            command(355,[fx],5),
            command(355,['$KeyIcon.ShowIcon if $KeyIcon'],5))
          # OFF must stop auto renewal as well as hide the buff icon.
          off=ce605.each_index.select{|idx|code(ce605[idx])==121&&param(ce605[idx])==[811,811,1]}
          check(off.size==1,"CE605 OFF count=#{off.size}")
          ce605.insert(off[0]+1,command(121,[813,813,1],4),command(355,['$KeyIcon.ShowIcon if $KeyIcon'],4))
          File.binwrite(ce_file,Marshal.dump(ces))

          # The learned magic book used an unrelated spellbook icon.
          item_file=File.join(DATA,PRE+'Items.rxdata')
          items=Marshal.load(File.binread(item_file))
          check(iv(items.fetch(120),:@icon_name).to_s=='마법서 [디스인티그레이트]'.b,'original Holy Walk spellbook icon')
          setiv(items[120],:@icon_name,'홀리워크')
          File.binwrite(item_file,Marshal.dump(items))

          # Refresh only the already-present web cache mapping for these changed data,
          # and append the one newly extracted original animation icon.
          map_file=File.join(SITE,'knight/gameasync/mapping.js')
          map=File.binread(map_file).force_encoding('UTF-8')
          [sp_file,ce_file,item_file].each do |path|
            rel='Data/'+File.basename(path)
            rx=Regexp.new(Regexp.escape(rel)+'\\?h=[a-f0-9]{32}')
            check(map.scan(rx).length==1,"mapping existing #{rel}")
            map.gsub!(rx,"#{rel}?h=#{Digest::MD5.file(path).hexdigest}")
          end
          icon_md5=Digest::MD5.file(icon_file).hexdigest
          new_mapping=%Q{["graphics/icons/홀리워크", "Graphics/Icons/홀리워크.png?h=#{icon_md5}"],\n}
          map=replace_once(map,"var mappingArray = [\n","var mappingArray = [\n"+new_mapping,'new icon mapping')
          File.binwrite(map_file,map)

          # Change version labels without updating game engine or other assets.
          knight_html=File.join(SITE,'knight/index.html')
          k=File.binread(knight_html).force_encoding('UTF-8')
          check(k.include?('V1.17'),'version at knight/index')
          File.binwrite(knight_html,k.gsub('V1.17','V1.18').gsub('v1.17','v1.18'))
          root_html=File.join(SITE,'index.html')
          r=File.binread(root_html).force_encoding('UTF-8')
          check(r.include?('V1.17'),'version at /index')
          File.binwrite(root_html,r.gsub('V1.17','V1.18'))
          asset_js=File.join(SITE,'knight/js/sl-assets-v229r115.js')
          j=File.binread(asset_js).force_encoding('UTF-8')
          check(j.include?("var version='V1.17';"),'V1.17 loader version')
          File.binwrite(asset_js,j.sub("var version='V1.17';","var version='V1.18';"))
          puts 'PASS V1.18 native Holy Walk 300s, native MP 15, existing 4/3 move rate, skill/book/buff icons, animation 22, shortcut mruby fix'
          RUBY_V118
          ruby -c build/patch_v118.rb
          ruby build/patch_v118.rb site <<'HOLY_V118_ICON_B64'
          
          HOLY_V118_ICON_B64

      - name: Verify all non-target V1.17 files byte-identical
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_V118_AFTER'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before=json.loads(Path('build/v117_sha256.json').read_text('utf8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          icon='knight/gameasync/Graphics/Icons/홀리워크.png'
          assert set(after)==set(before)|{icon},(len(before),len(after),sorted(set(after)^set(before)))
          changed={p for p in before if before[p]!=after[p]}
          pre='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          allow={
              'knight/gameasync/Data/Scripts.rxdata',
              pre+'CommonEvents.rxdata',pre+'Items.rxdata',
              'knight/gameasync/mapping.js','knight/js/sl-assets-v229r115.js',
              'knight/index.html','index.html'
          }
          assert changed==allow,(sorted(changed-allow),sorted(allow-changed))
          mapping=(root/'knight/gameasync/mapping.js').read_text('utf8')
          for rel in sorted({pre+'CommonEvents.rxdata',pre+'Items.rxdata','knight/gameasync/Data/Scripts.rxdata',icon}):
              file=root/rel
              digest=hashlib.md5(file.read_bytes()).hexdigest()
              expected=('Graphics/Icons/' if rel==icon else 'Data/')+file.name+'?h='+digest
              assert mapping.count(expected)==1,expected
          assert (root/icon).read_bytes()[:8]==b'\x89PNG\r\n\x1a\n'
          assert "var version='V1.18';" in (root/'knight/js/sl-assets-v229r115.js').read_text('utf8')
          assert 'sl-build-version' not in (root/'knight/index.html').read_text('utf8')
          print('PASS only 7 existing files changed, 1 original Holy Walk icon extracted')
          print('PASS all native engine, maps, NPCs, monsters, drops, equipment, other assets unchanged')
          PY_V118_AFTER

      - name: Publish V1.18 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
