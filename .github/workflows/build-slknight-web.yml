              mobile_touch_code,
              1
          )


          p.write_text(
              text,
              encoding="utf-8"
          )


          print(
              "SLKNIGHT_MOBILE_TOUCH_PATCH_OK"
          )
          PY


      - name: Copy game and engine into web player
        run: |
          set -e

          mv \
            engine/retroarch/mkxp-z_libretro.js \
            engine/nostalgist/public/

          mv \
            engine/retroarch/mkxp-z_libretro.wasm \
            engine/nostalgist/public/

          mv \
            slknight.mkxpz \
            engine/nostalgist/public/


      - name: Configure web player
        run: |
          set -e

          cat > \
            engine/nostalgist/.env \
            <<'EOF'

          VITE_CORE_JS_PATH=./mkxp-z_libretro.js
          VITE_CORE_WASM_PATH=./mkxp-z_libretro.wasm

          VITE_GAME_NAME=SLKnight Mobile
          VITE_GAME_PATH=./slknight.mkxpz

          VITE_XP_CONTROLS=true

          VITE_HAVE_OPFS=true
          VITE_REQUIRE_OPFS=false
          EOF


      - name: Build mobile web player
        working-directory: engine/nostalgist
        run: |
          set -e

          npm install

          npm run build

          touch \
            dist/.nojekyll


      - name: Verify mobile build
        run: |
          set -e

          test -s \
            engine/nostalgist/dist/index.html

          test -s \
            engine/nostalgist/dist/mkxp-z_libretro.js

          test -s \
            engine/nostalgist/dist/mkxp-z_libretro.wasm

          test -s \
            engine/nostalgist/dist/slknight.mkxpz

          grep -R \
            "MOBILE_TOUCH_UI_READY" \
            engine/nostalgist/dist/assets \
            >/dev/null

          echo \
            "SLKNIGHT_MOBILE_BUILD_OK"


      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: engine/nostalgist/dist


  deploy:

    name: Deploy GitHub Pages

    needs:
      - build

    runs-on:
      ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6


      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
