name: build-slknight-web.yml | V4.9 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Restore V4.8 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45919348509
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify V4.8 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib,json,re

          root=Path('site')
          game=root/'knight/gameasync'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          before={
              str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          assert len(before)==6033,len(before)
          assert (root/'knight/js/sl-assets-v229r115.js').read_bytes().count(b"var version='V4.8';")==1

          stats=game/'Data'/(pre+'MonsterStats.rxdata')

          assert hashlib.sha256(stats.read_bytes()).hexdigest()=='b75e5047db2bb6a5a9217f730a909a911fb2020e8d5952e90e37dced9bd52d93'

          mapping=(game/'mapping.js').read_bytes()
          md5={}

          for p in (game/'Data').glob('*.rxdata'):
              marker=('Data/'+p.name+'?h=').encode('ascii')
              matches=re.findall(re.escape(marker)+rb'[0-9a-f]{32}',mapping)
              if matches:
                  digest=hashlib.md5(p.read_bytes()).hexdigest()
                  assert matches==[marker+digest.encode('ascii')],p.name
                  md5[p.name]=digest

          Path('/tmp/sl49-before.json').write_text(json.dumps(before,sort_keys=True),'utf8')
          Path('/tmp/sl49-md5.json').write_text(json.dumps(md5,sort_keys=True),'utf8')

          print('PASS V4.8 baseline',len(before))
          print('PASS original monster stats')
          PYTHON

