
name: V205 | Separate Fairy Bow Hit, Native Monster Range and Attack Motion

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Restore deployed V204 including confirmed working save
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 38194737798
          github-token: ${{ github.token }}
          path: prior

      - name: Unpack and fingerprint all original files
        shell: bash
        run: |
          set -euo pipefail
          test -s prior/artifact.tar
          mkdir -p site
          tar -xf prior/artifact.tar -C site
          test -s site/elf/gameasync/Data/Scripts.rxdata
          test -s site/elf/gameasync/mapping.js
          test -s site/elf/js/dpad.js
          test -s site/knight/gameasync/Data/Scripts.rxdata
          cp site/elf/gameasync/Data/Scripts.rxdata /tmp/v205_original_scripts.rxdata
          find site -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/v205_original_manifest.sha
          echo V205_V204_SAVE_AND_KNIGHT_FROZEN

      - name: Install small image atlas tool
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user 'Pillow==11.3.0'

      - name: Pack existing Fairy attack frames without full-screen memory cost
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_ATLAS'
          from pathlib import Path
          from PIL import Image
          import hashlib, json, re
          root=Path('site/elf/gameasync')
          images=root/'Graphics/Pictures'
          atlas=Image.new('RGBA',(640,768),(0,0,0,0))
          for actor_row,actor in enumerate(('여요정','다크엘프')):
              for direction_row,direction in enumerate(('하','좌','우','상')):
                  for frame in range(1,9):
                      p=images/f'{actor}-{direction}{frame}.png'
                      if not p.is_file():
                          raise SystemExit('Missing source motion: '+str(p))
                      with Image.open(p) as original:
                          if original.size!=(640,480):
                              raise SystemExit('Unexpected motion dimensions: '+str(p))
                          tile=original.convert('RGBA').crop((280,160,360,256))
                      atlas.paste(tile,((frame-1)*80,(actor_row*4+direction_row)*96))
          output=images/'SL_V205_Attack.png'
          if output.exists():
              raise SystemExit('Atlas already exists unexpectedly')
          atlas.save(output,optimize=True)
          mapping_path=root/'mapping.js'
          mapping=mapping_path.read_text(encoding='utf-8')
          key='graphics/pictures/sl_v205_attack'
          if '"'+key+'"' in mapping:
              raise SystemExit('Attack atlas mapping exists')
          digest=hashlib.md5(output.read_bytes()).hexdigest()
          entry='['+json.dumps(key)+', '+json.dumps('Graphics/Pictures/SL_V205_Attack.png?h='+digest)+'],'
          modified,count=re.subn(r'^\];\s*$',lambda m:entry+'\n];',mapping,count=1,flags=re.M)
          if count!=1:
              raise SystemExit('Mapping array terminator not found')
          mapping_path.write_text(modified,encoding='utf-8')
          print('V205_ATLAS_OK',output.stat().st_size,'bytes')
          PY_ATLAS

      - name: Write full isolated target and animation source
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v205_target.rb <<'RUBY_TARGET'
          # encoding: utf-8
          # V205: keep native C-key actions, shop and save. Never remotely start touch events.
          module SLFairyTargetV205
            RANGE_BOW = 8
            @last_id = nil
            @last_tick = -9999
            @shot_serial = 0
            @shot_direction = 2
            @shot_actor = '여요정'

            def self.weapon_range
              actor = $game_party && $game_party.actors && $game_party.actors[0]
              return 1 unless actor && $data_weapons
              ids = actor.respond_to?(:weapon_ids) ? actor.weapon_ids : [actor.weapon_id]
              ids = [ids] unless ids.is_a?(Array)
              ids.compact.each do |id|
                item = $data_weapons[id.to_i]
                next unless item
                return RANGE_BOW if item.name.to_s =~ /(활|궁|보우|bow|crossbow)/i
              end
              1
            end

            def self.monster?(ev)
              info = ev.instance_variable_get(:@event)
              page = ev.instance_variable_get(:@page)
              return false unless info && page && info.name.to_s.start_with?('[ID')
              return false unless page.trigger == 2
              return false if ev.instance_variable_get(:@erased) || ev.instance_variable_get(:@starting)
              return false if ev.jumping? || ev.through || ev.character_name.to_s == ''
              true
            end

            def self.find(player, triggers)
              return nil unless triggers.include?(0) && triggers.include?(1)
              return nil unless $game_map && $game_system && $game_temp
              return nil if $game_temp.message_window_showing
              runner = $game_system.map_interpreter
              return nil if runner && runner.running?
              map = $game_map
              dx = (player.direction == 6 ? 1 : player.direction == 4 ? -1 : 0)
              dy = (player.direction == 2 ? 1 : player.direction == 8 ? -1 : 0)
              return nil if dx == 0 && dy == 0
              x = player.x
              y = player.y
              events = map.events.values
              1.upto(weapon_range) do |step|
                nx = x + dx
                ny = y + dy
                break unless map.valid?(nx, ny)
                tile = events.select { |ev| ev.x == nx && ev.y == ny }
                break if tile.any? { |ev| !ev.through && ev.character_name.to_s != '' && !monster?(ev) }
                enemy = tile.find { |ev| monster?(ev) }
                break unless map.passable?(x, y, player.direction)
                break unless map.passable?(nx, ny, 10 - player.direction, enemy)
                return [enemy, step] if enemy
                x = nx
                y = ny
              end
              nil
            end

            # The simple original damage sequence is [HP -= random] then [HP -= ATK variable 619].
            # More complex encounters are deliberately not rewritten.
            def self.simple_hit_spec(enemy)
              page = enemy.instance_variable_get(:@page)
              return nil unless page && page.trigger == 2
              list = enemy.list
              return nil unless list
              button = list.index do |cmd|
                cmd.code == 111 && cmd.parameters[0] == 11 && cmd.parameters[1] == 13
              end
              return nil unless button
              i = button + 1
              while i + 1 < list.size && i < button + 28
                a = list[i]
                b = list[i + 1]
                p = a.parameters
                q = b.parameters
                if a.code == 122 && b.code == 122 && p.size == 6 && q.size == 5 &&
                   p[0] == p[1] && q[0] == p[0] && q[1] == p[0] &&
                   p[2] == 1 && p[3] == 4 && q[2] == 1 && q[3] == 1 && q[4] == 619
                  # Do not bypass extra common-event and variable damage modifiers.
                  prefix = list[(button + 1)...i]
                  return nil if prefix.any? { |c| c.code == 117 ||
                     (c.code == 122 && c.parameters[0] == p[0]) }
                  return [p[0], p[4], p[5]]
                end
                i += 1
              end
              nil
            end

            def self.can_attack?(enemy)
              now = Graphics.frame_count
              return false if @last_id == enemy.id && now >= @last_tick && now - @last_tick < 4
              @last_id = enemy.id
              @last_tick = now
              true
            end

            def self.motion(player)
              @shot_serial += 1
              @shot_direction = player.direction
              @shot_actor = player.character_name.to_s.include?('다크엘프') ? '다크엘프' : '여요정'
            end
            def self.shot_serial; @shot_serial; end
            def self.shot_direction; @shot_direction; end
            def self.shot_actor; @shot_actor; end

            def self.fire(player, enemy, distance)
              return false unless can_attack?(enemy)
              spec = simple_hit_spec(enemy)
              if spec
                hp, low, high = spec
                # Native original miss calculation: random(1..8) >= random(1..3).
                if (rand(8) + 1) >= (rand(3) + 1)
                  amount = (rand(high - low + 1) + low) + $game_variables[619].to_i
                  $game_variables[hp] = $game_variables[hp] - amount
                end
                motion(player)
                puts('SLV205|RANGED_PLAYER_HIT|'+enemy.id.to_s+'|'+distance.to_s)
                return true
              end
              # Unsupported custom combat events retain native adjacent attack only.
              if distance == 1
                enemy.start
                motion(player)
                return true
              end
              false
            end
          end

          class Game_Player
            alias sl_fairy_v201_native_there check_event_trigger_there
            def check_event_trigger_there(triggers)
              if Input.trigger?(Input::C)
                target = SLFairyTargetV205.find(self, triggers)
                if target
                  enemy, distance = target
                  return true if SLFairyTargetV205.fire(self, enemy, distance)
                  return true if distance > 1 # never remotely invoke an enemy touch event
                end
              end
              sl_fairy_v201_native_there(triggers)
            end
          end

          class Scene_Map
            alias sl_v205_base_update update
            alias sl_v205_base_dispose dispose

            def sl_v205_render_attack
              @sl_v205_seen = 0 if @sl_v205_seen.nil?
              token = SLFairyTargetV205.shot_serial
              if token != @sl_v205_seen
                @sl_v205_seen = token
                if !@sl_v205_tick
                  @sl_v205_tick = Graphics.frame_count
                  @sl_v205_dir = SLFairyTargetV205.shot_direction
                  @sl_v205_actor = SLFairyTargetV205.shot_actor
                end
              end
              if @sl_v205_tick
                elapsed = Graphics.frame_count - @sl_v205_tick
                if elapsed >= 16
                  @sl_v205_tick = nil
                  @sl_v205_visual.visible = false if @sl_v205_visual
                  return
                end
                unless @sl_v205_visual
                  viewport = @spriteset.instance_variable_get(:@viewport1)
                  @sl_v205_visual = Sprite.new(viewport)
                  @sl_v205_visual.bitmap = RPG::Cache.picture('SL_V205_Attack')
                  @sl_v205_visual.ox = 40
                  @sl_v205_visual.oy = 80
                  @sl_v205_visual.z = 999
                end
                directions = {2 => 0, 4 => 1, 6 => 2, 8 => 3}
                actor_row = (@sl_v205_actor == '다크엘프' ? 4 : 0)
                row = actor_row + (directions[@sl_v205_dir] || 0)
                frame = [elapsed / 2, 7].min
                @sl_v205_visual.src_rect.set(frame * 80, row * 96, 80, 96)
                @sl_v205_visual.x = $game_player.screen_x
                @sl_v205_visual.y = $game_player.screen_y
                @sl_v205_visual.visible = true
                # The picture contains the player; prevent the idle body showing beneath it.
                sprites = @spriteset.instance_variable_get(:@character_sprites)
                sprites.last.visible = false if sprites && sprites.last
              end
            end

            def update
              sl_v205_base_update
              sl_v205_render_attack if $scene == self && @spriteset
            end

            def dispose
              if @sl_v205_visual
                @sl_v205_visual.dispose
                @sl_v205_visual = nil
              end
              sl_v205_base_dispose
            end
          end
          RUBY_TARGET
          ruby -c /tmp/v205_target.rb

      - name: Replace only Fairy V204 target extension
        shell: bash
        run: |
          set -euo pipefail
          ruby -rzlib - site/elf/gameasync/Data/Scripts.rxdata <<'RB'
          path=ARGV.fetch(0)
          all=Marshal.load(File.binread(path))
          matches=all.select{|e| e.is_a?(Array) && e[1].to_s=='SLFairy NPC Safe Target and Motion V204'}
          abort "Expected one V204 target script, got #{matches.length}" unless matches.size==1
          entry=matches.first
          old=Zlib::Inflate.inflate(entry[2]).force_encoding('UTF-8')
          marker="\nclass Scene_Map\n  alias sl_fairy_v197_original_update update"
          point=old.index(marker)
          abort 'V204 diagnostic preservation marker missing' unless point
          original_diagnostic=old[point..-1]
          desired=File.binread('/tmp/v205_target.rb').force_encoding('UTF-8')
          visual_anchor="\nclass Scene_Map\n  alias sl_v205_base_update update"
          visual_pos=desired.index(visual_anchor)
          abort 'V205 animation anchor missing' unless visual_pos
          # Class order: target, original V197 diagnostics, new lightweight animation.
          updated=desired[0...visual_pos]+original_diagnostic+desired[visual_pos..-1]
          RubyVM::InstructionSequence.compile(updated,'V205 Fairy Combat')
          entry[1]='SLFairy Native Range Bow and Motion V205'
          entry[2]=Zlib::Deflate.deflate(updated)
          File.binwrite(path,Marshal.dump(all))
          puts 'V205_ONLY_FAIRY_TARGET_EXTENSION_REPLACED'
          RB

      - name: Refresh Fairy mapping hash and diagnostic label
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CACHE'
          from pathlib import Path
          import hashlib,re
          base=Path('site/elf')
          source=base/'gameasync/Data/Scripts.rxdata'
          mapping=base/'gameasync/mapping.js'
          html=base/'index.html'
          md5=hashlib.md5(source.read_bytes()).hexdigest()
          contents=mapping.read_text(encoding='utf-8')
          pattern=r'(\["data/scripts",\s*"Data/Scripts\.rxdata\?h=)[0-9a-f]{32}("\],)'
          updated,n=re.subn(pattern,lambda m:m.group(1)+md5+m.group(2),contents)
          if n!=1:
              raise SystemExit('Data Scripts mapping replacement mismatch')
          mapping.write_text(updated,encoding='utf-8')
          content=html.read_text(encoding='utf-8')
          for old,new in (
              ('gameasync/mapping.js?v=fairy204','gameasync/mapping.js?v=fairy205'),
              ("box.textContent='V204 '+state","box.textContent='V205 '+state"),
          ):
              if content.count(old)!=1:
                  raise SystemExit('V204 HTML anchor mismatch: '+old)
              content=content.replace(old,new,1)
          html.write_text(content,encoding='utf-8')
          print('V205_MAPPING_AND_CACHE_UPDATED')
          PY_CACHE

      - name: Verify save, menus, Knight, HUD and original native monster handling
        shell: bash
        run: |
          set -euo pipefail
          ruby -rzlib - /tmp/v205_original_scripts.rxdata site/elf/gameasync/Data/Scripts.rxdata <<'RB'
          before=Marshal.load(File.binread(ARGV[0]))
          after=Marshal.load(File.binread(ARGV[1]))
          abort 'Fairy script count changed' unless before.size==after.size
          diff=(0...before.size).select{|i|before[i]!=after[i]}
          abort "Non-target Fairy Ruby scripts changed: #{diff.inspect}" unless diff.size==1
          abort 'Wrong original script' unless before[diff[0]][1]=='SLFairy NPC Safe Target and Motion V204'
          abort 'Wrong replacement script' unless after[diff[0]][1]=='SLFairy Native Range Bow and Motion V205'
          now=Zlib::Inflate.inflate(after[diff[0]][2])
          was=Zlib::Inflate.inflate(before[diff[0]][2])
          marker="\nclass Scene_Map\n  alias sl_fairy_v197_original_update update"
          a=was.index(marker);b=now.index(marker)
          abort 'Original diagnostics altered' unless a && b
          original_tail=was[a..-1]
          abort 'Original diagnostics altered' unless now[b,original_tail.length]==original_tail
          abort 'Enemy remote touch event still used' if now.include?('enemy.start if enemy')
          abort 'Remote direct damage missing' unless now.include?("$game_variables[hp] = $game_variables[hp] - amount")
          abort 'Save menu or load script changed' if diff.size != 1
          RubyVM::InstructionSequence.compile(now,'Fairy V205')
          puts 'V205_ALL_SAVE_LOAD_HUD_AND_NATIVE_SCRIPTS_IDENTICAL'
          RB
          python3 - <<'PY_FILES'
          from pathlib import Path
          import hashlib,re
          old={}
          for line in Path('/tmp/v205_original_manifest.sha').read_text().splitlines():
              checksum,name=line.split('  ',1)
              old[name]=checksum
          changed={'site/elf/gameasync/Data/Scripts.rxdata','site/elf/gameasync/mapping.js','site/elf/index.html'}
          missing=[];corrupt=[]
          for name,digest in old.items():
              p=Path(name)
              if not p.is_file():missing.append(name)
              elif name not in changed and hashlib.sha256(p.read_bytes()).hexdigest()!=digest:
                  corrupt.append(name)
          new={str(p) for p in Path('site').rglob('*') if p.is_file()}-set(old)
          expected={'site/elf/gameasync/Graphics/Pictures/SL_V205_Attack.png'}
          if missing or corrupt or new!=expected:
              raise SystemExit(f'Unexpected modifications: missing={missing}, changed={corrupt}, new={new}')
          from PIL import Image
          attack=Path('site/elf/gameasync/Graphics/Pictures/SL_V205_Attack.png')
          with Image.open(attack) as image:
              assert image.size==(640,768) and image.mode=='RGBA'
          mapping=Path('site/elf/gameasync/mapping.js').read_text(encoding='utf-8')
          assert 'Graphics/Pictures/SL_V205_Attack.png?h='+hashlib.md5(attack.read_bytes()).hexdigest() in mapping
          data=Path('site/elf/gameasync/Data/Scripts.rxdata').read_bytes()
          assert 'Data/Scripts.rxdata?h='+hashlib.md5(data).hexdigest() in mapping
          html=Path('site/elf/index.html').read_text(encoding='utf-8')
          assert 'gameasync/mapping.js?v=fairy205' in html
          assert "box.textContent='V205 '+state" in html
          print('V205_EXACT_SCOPE_VERIFIED: 3 existing Fairy files + 1 tiny atlas')
          PY_FILES
          node --check site/elf/js/dpad.js
          echo V205_VALIDATION_PASSED

      - name: Upload verified V205 site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
