      - name: V229R27 Execute Ruby terrain-streaming memory budget simulation
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/test_slti_streaming.rb <<'RUBY_BUDGET'
          require 'zlib'
          scripts = Marshal.load(File.binread('site/knight/gameasync/Data/Scripts.rxdata'))
          s = Zlib::Inflate.inflate(scripts[97][2])
          i=s.index('def slti_update_terrain')
          raise 'no live renderer method' unless i
          j=s.rindex("\nend\n")
          raise 'no renderer method end' unless j
          method=s[i...j]

          class Bitmap
            @@alive=0; @@peak=0; @@created=0
            def self.stats; {alive:@@alive,peak:@@peak,created:@@created};end
            def initialize(name)
              @name=name;@disposed=false
              @@alive+=1;@@created+=1;@@peak=[@@peak,@@alive].max
            end
            def dispose
              raise 'bitmap double dispose' if @disposed
              @disposed=true;@@alive-=1
            end
            def disposed?;@disposed;end
          end
          class Sprite
            attr_accessor :bitmap,:x,:y,:zoom_x,:zoom_y,:z
            def initialize(v);@disposed=false;end
            def dispose;raise 'sprite double dispose' if @disposed;@disposed=true;end
          end
          class GameMap
            attr_accessor :display_x,:display_y
            def initialize;@display_x=0;@display_y=0;end
          end
          $game_map=GameMap.new
          $window_width2=800;$window_height2=600
          klass=Class.new do
            attr_accessor :slti_chunks,:slti_cols,:slti_rows,:slti_floor
            def initialize
              @slti_chunks={}
              @slti_cols=9;@slti_rows=5;@slti_floor=45;@viewport2=Object.new
            end
          end
          klass.class_eval(method)
          k=klass.new
          # Test camera scrolling across 1F in every direction; 2x native map unchanged.
          xmax=9*1024-800;ymax=5*1024-600
          steps=[]
          (0..xmax).step(128){|x|steps << [x,0]}
          (0..ymax).step(128){|y|steps << [xmax,y]}
          xmax.step(0,-128){|x|steps << [x,ymax]}
          ymax.step(0,-128){|y|steps << [0,y]}
          steps += [[1020,540],[1025,541],[2040,1022],[2049,1025],[4090,2040],[4098,2050]]
          # Hold at boundary to ensure all four visible chunks are eventually allocated.
          steps += [[1020,540]] * 4
          steps.each_with_index do |(px,py),idx|
           $game_map.display_x=px*4;$game_map.display_y=py*4
           k.slti_update_terrain
           raise "too many chunks at #{idx}" if k.instance_variable_get(:@slti_chunks).size>4
           k.instance_variable_get(:@slti_chunks).each do |(cx,cy),sprite|
            raise 'bad zoom' unless sprite.zoom_x==2.0 && sprite.zoom_y==2.0
            raise 'sprite wrong x' unless sprite.x==cx*1024-px
            raise 'sprite wrong y' unless sprite.y==cy*1024-py
           end
          end
          raise 'native texture memory too high' if Bitmap.stats[:peak]>4
          k.instance_variable_get(:@slti_chunks).each_value do |spr|
           old=spr.bitmap;spr.bitmap=nil;spr.dispose;old.dispose unless old.disposed?
          end
          raise 'bitmap leaked after cleanup' unless Bitmap.stats[:alive]==0
          puts "PASS simulated camera ticks=#{steps.size} max_live_bitmaps=#{Bitmap.stats[:peak]} created=#{Bitmap.stats[:created]} zoom=2x images=512px cleanup=zero"
          RUBY_BUDGET
          ruby -c /tmp/test_slti_streaming.rb
          ruby /tmp/test_slti_streaming.rb

