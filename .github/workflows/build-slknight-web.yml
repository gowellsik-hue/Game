# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R138
# BASE: Exact successful V229R137 Pages artifact (run 40826689680).
# ONLY ADD: Sanctuary Talking Island Map047, original terrain chunks, walkable
#           Layer3 aligned -24,-12 native pixels, 0 monsters, existing town NPC menu.
# PRESERVE: Maps 045/046, R94 masks, monsters, and all original teleport routes.
# TITLE: original wording preserved; version incremented from V229R137.
name: build-slknight-web.yml | V229R138 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: V229R138 Verify successfully deployed R137 baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          url='https://api.github.com/repos/gowellsik-hue/Game/actions/runs/40826689680'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as response:run=json.load(response)
          assert run['id']==40826689680 and run['conclusion']=='success'
          assert run['head_sha']=='f7e3138af5c068eb1f3ab4af58e46d4823ede413'
          assert run['path'].split('@',1)[0].endswith('/build-slknight-web.yml')
          print('PASS original successful V229R137 baseline')
          PY

      - name: V229R138 Download intact R137 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40826689680
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V229R138 Extract and record original file hashes
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(before)==5566,('Wrong R137 file count',len(before))
          assert 'V229R137' in (root/'knight/index.html').read_text('utf8')
          data=root/'knight/gameasync/Data'
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          assert (data/(prefix+'Map029.rxdata')).exists()
          assert (data/(prefix+'Map045.rxdata')).exists()
          assert (data/(prefix+'Map046.rxdata')).exists()
          assert not (data/(prefix+'Map047.rxdata')).exists()
          Path('build/before.json').write_text(json.dumps(before,sort_keys=True))
          print('PASS original 5566 files recorded; existing maps untouched')
          PY

      - name: V229R138 Download exact original Sanctuary map and tile volumes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source
          for part in z32 z33 z34 z35 z36 zip; do
            gh release download v1.0.0 -R gowellsik-hue/Game \
              -p "Sanctuary.of.Aden.-.Copy.${part}" -D source --clobber
          done
          for part in z32 z33 z34 z35 z36; do
            test "$(wc -c < "source/Sanctuary.of.Aden.-.Copy.${part}")" -eq 100000000
          done
          test -s source/Sanctuary.of.Aden.-.Copy.zip
          python3 -m venv build/venv
          build/venv/bin/pip -q install pillow==11.3.0

      - name: V229R138 Rebuild original Map000 terrain and S32 walk mask
        shell: bash
        run: |
          set -euo pipefail
          cat > build/ti_map.py <<'SCRIPT'
          from pathlib import Path
          from functools import lru_cache
          from collections import Counter
          from PIL import Image
          import struct,zlib,mmap,zipfile,re,sys,math,json,os

          SOURCE=Path(os.environ.get('TI_SOURCE','/mnt/data/files'))
          OUT=Path(os.environ.get('TI_OUT','/mnt/data/work_new_r138'))
          OUT.mkdir(parents=True,exist_ok=True)
          ARCH=SOURCE/(os.environ.get('TI_ARCHIVE','Sanctuary of Aden - Copy.zip'))
          CAT=zipfile.ZipFile(ARCH)
          PREFIX=os.environ.get('TI_PREFIX','Sanctuary of Aden - Copy')

          def volume(info):
              disk,offset=info.volume,info.header_offset
              def chunks(n):
                  nonlocal disk,offset
                  while n:
                      path=SOURCE/f'{PREFIX}.z{disk+1:02d}'
                      with path.open('rb') as f:
                          f.seek(offset); data=f.read(min(2<<20,n))
                      if not data:raise RuntimeError(f'Missing volume {disk+1}, offset {offset}')
                      yield data
                      offset+=len(data);n-=len(data)
                      if offset==100000000:disk+=1;offset=0
              hdr=b''.join(chunks(30))
              assert hdr[:4]==b'PK\x03\x04',info.filename
              name_len,extra_len=struct.unpack_from('<HH',hdr,26)
              for _ in chunks(name_len+extra_len):pass
              if info.compress_type==8:
                  obj=zlib.decompressobj(-15)
                  for piece in chunks(info.compress_size):
                      dec=obj.decompress(piece)
                      if dec:yield dec
                  tail=obj.flush()
                  if tail:yield tail
              else:yield from chunks(info.compress_size)

          def get(name):
              matches=[i for i in CAT.infolist() if i.filename.endswith('/'+name)]
              assert len(matches)==1,(name,len(matches))
              return b''.join(volume(matches[0]))

          idx_data=get('Tile.idx')
          nt=struct.unpack_from('<I',idx_data,0)[0]
          INDEX={}
          for i in range(nt):
              start,name,size=struct.unpack_from('<I20sI',idx_data,4+i*28)
              name=name.split(b'\0')[0].decode('ascii','ignore').lower()
              if re.fullmatch(r'\d+\.til',name):INDEX[int(name[:-4])]=(start,size)
          pak_path=OUT/'tile-full.pak'
          if not pak_path.exists() or pak_path.stat().st_size!=530172650:
              with pak_path.open('wb') as f:
                  for piece in volume(next(i for i in CAT.infolist() if i.filename.endswith('/Tile.pak'))):f.write(piece)
          assert pak_path.stat().st_size==530172650
          with pak_path.open('rb') as f:PAK=mmap.mmap(f.fileno(),0,access=mmap.ACCESS_READ)
          PALETTE=bytes(x for n in range(65536) for x in (((n>>10)&31)*255//31,((n>>5)&31)*255//31,(n&31)*255//31))

          @lru_cache(maxsize=35000)
          def sprite(tile,index):
              info=INDEX.get(tile)
              if info is None:return None
              off,size=info
              dat=memoryview(PAK)[off:off+size]
              count=struct.unpack_from('<I',dat,0)[0]
              if index>=count or count>4096:return None
              begin=struct.unpack_from('<I',dat,4+4*index)[0]
              end=struct.unpack_from('<I',dat,8+4*index)[0]
              block=dat[8+count*4+begin:8+count*4+end]
              if len(block)<2:return None
              typ=block[0]
              if typ&2:
                  if len(block)<5:return None
                  x0,y0,ww,hh=block[1:5].tolist()
                  w,h=max(48,x0+ww),max(48,y0+hh)
                  if max(w,h)>256:raise ValueError(('tile bounds',tile,index,w,h))
                  pix=bytearray(w*h*4);p=5
                  for yy in range(hh):
                      runs=block[p];p+=1;xx=x0
                      for j in range(runs):
                          xx+=block[p]//2;amount=block[p+1];p+=2
                          for k in range(amount):
                              v=block[p]|(block[p+1]<<8);p+=2
                              if 0<=xx<w:
                                  dst=((yy+y0)*w+xx)*4;pix[dst:dst+3]=PALETTE[v*3:v*3+3];pix[dst+3]=255
                              xx+=1
              else:
                  w=h=24;pix=bytearray(w*h*4);p=1
                  for yy in range(24):
                      amount=2*(yy+1) if yy<12 else 2*(23-yy)
                      xx=0 if typ&1 else 24-amount
                      for k in range(amount):
                          v=block[p]|(block[p+1]<<8);p+=2
                          dst=(yy*w+xx+k)*4;pix[dst:dst+3]=PALETTE[v*3:v*3+3];pix[dst+3]=255
              return Image.frombytes('RGBA',(w,h),bytes(pix))

          CX,CY=5600,320
          WIDTH,HEIGHT=11600,7600
          image=Image.new('RGB',(WIDTH,HEIGHT),(0,0,0))
          attrs=bytearray([1])*(512*512)
          blocks=[];covers=[];objects=[]
          for info in CAT.infolist():
              m=re.fullmatch(r'.*/map/0/([0-9a-fA-F]{8})\.s32',info.filename)
              if not m:continue
              bx=int(m[1][:4],16);by=int(m[1][4:],16)
              if not (0x7ff8<=bx<=0x7fff and 0x8000<=by<=0x8007):continue
              raw=b''.join(volume(info))
              bx0,by0=(bx-0x7ff8)*64,(by-0x8000)*64
              k=32768;nc=struct.unpack_from('<H',raw,k)[0];k+=2
              for i in range(nc):
                  xx,yy,ind,tile,_=struct.unpack_from('<BBBHB',raw,k);k+=6
                  covers.append((bx,by,xx,yy,tile,ind))
              for yy in range(64):
                  for xx in range(64):
                      a=struct.unpack_from('<h',raw,k)[0];k+=4
                      attrs[(by0+yy)*512+bx0+xx]=a&255
              groups=struct.unpack_from('<i',raw,k)[0];k+=4
              for group in range(groups):
                  _,n=struct.unpack_from('<hH',raw,k);k+=4
                  for j in range(n):
                      xx,yy,layer,ind,tile,_=struct.unpack_from('<BBBBhB',raw,k);k+=7
                      objects.append((layer,bx,by,xx,yy,tile,ind))
              blocks.append((bx,by,raw))
          assert len(blocks)==64 and len(attrs)==262144
          stats=Counter()
          def draw(bx,by,xx,yy,tile,ind):
              a=bx-0x7ff8;b=by-0x8000
              px=1536*(a+b)-24*(xx//2)+xx*24+yy*24-CX
              py=5376+768*(b-a)+756-12*(xx//2)+yy*12-CY
              if px<-192 or py<-192 or px>=WIDTH or py>=HEIGHT:return
              pic=sprite(tile,ind)
              if pic is None:stats['missing']+=1;return
              image.paste(pic,(px,py),pic)
              stats['painted']+=1
          # Layer 1 first, all blocks.
          for bx,by,raw in blocks:
              for yy in range(64):
                  for xx in range(128):
                      p=(yy*128+xx)*4
                      draw(bx,by,xx,yy,struct.unpack_from('<H',raw,p+1)[0],raw[p])
          # Layer 2 across all blocks, followed by globally sorted Layer 4.
          for args in covers:draw(*args)
          for _,*args in sorted(objects,key=lambda a:a[0]):draw(*args)
          print('map0',len(blocks),'layer2',len(covers),'objects',len(objects),'stats',stats,'sprites',sprite.cache_info())

          W=(WIDTH+31)//32;H=(HEIGHT+31)//32
          walk=bytearray(W*H)
          for yy in range(H):
              sy=yy*32+32
              for xx in range(W):
                  sx=xx*32+16
                  # The approved display correction is -24,-12 native pixels.
                  # (sx,sy) is measured on the shifted collision projection.
                  sum_xy=(sx+CX)/24.0
                  difference=(sy-(6144-CY-12))/12.0
                  nx=round(32256+(sum_xy-difference)/2)
                  ny=round(32768+(sum_xy+difference)/2)
                  if 32256<=nx<32768 and 32768<=ny<33280:
                      walk[yy*W+xx]=int(not(attrs[(ny-32768)*512+nx-32256]&1))
          (OUT/'walk.bin').write_bytes(walk)
          config={'width':W,'height':H,'cols':(WIDTH+1023)//1024,'rows':(HEIGHT+1023)//1024,
                  'spawn':[197,128],'passable':sum(walk),'graphics':[WIDTH,HEIGHT]}
          assert (W,H)==(363,238),config
          assert walk[128*W+197]==1,('town target not passable',walk[128*W+197])
          (OUT/'ti-config.json').write_text(json.dumps(config))

          # Keep source scale identical to TI dungeon: half-resolution 512px images displayed at zoom 2.
          small=image.resize(((WIDTH+1)//2,(HEIGHT+1)//2),Image.Resampling.BOX)
          panoramas=OUT/'Graphics'/'Panoramas';panoramas.mkdir(parents=True,exist_ok=True)
          for row in range(config['rows']):
              for col in range(config['cols']):
                  x=col*512;y=row*512
                  chunk=Image.new('RGB',(512,512),'black')
                  tile=small.crop((x,y,min(x+512,small.width),min(y+512,small.height)))
                  chunk.paste(tile,(0,0))
                  name=panoramas/f'SLTI_47_C{col}_{row}.png';chunk.save(name,optimize=True)
          print('config',config,'chunks',len(list(panoramas.glob('*.png'))))
          SCRIPT
          TI_SOURCE=source TI_PREFIX=Sanctuary.of.Aden.-.Copy \
            TI_ARCHIVE=Sanctuary.of.Aden.-.Copy.zip TI_OUT=build/ti \
            build/venv/bin/python build/ti_map.py
          test -s build/ti/walk.bin
          test "$(find build/ti/Graphics/Panoramas -name 'SLTI_47_C*.png' | wc -l)" -eq 96
          mkdir -p site/knight/gameasync/Graphics/Panoramas
          cp build/ti/Graphics/Panoramas/SLTI_47_C*.png site/knight/gameasync/Graphics/Panoramas/

      - name: V229R138 Add Map047 and expand existing Silver Knight teleporter
        shell: bash
        run: |
          set -euo pipefail
          cat > build/ti_patch.rb <<'SCRIPT'
          require 'zlib'
          require 'json'
          module RPG
            class Map;end;class Event;end;class Event::Page;end;class Event::Page::Condition;end
            class Event::Page::Graphic;end;class EventCommand;end;class MoveCommand;end
            class MoveRoute;end;class MapInfo;end;class AudioFile;end
          end
          class Table
            def self._load(raw);obj=allocate;obj.instance_variable_set(:@bytes,raw);obj;end
            def _dump(_depth);@bytes;end
          end
          class Tone
            def self._load(raw);o=allocate;o.instance_variable_set(:@bytes,raw);o;end
            def _dump(_depth);@bytes;end
          end
          class Color
            def self._load(raw);o=allocate;o.instance_variable_set(:@bytes,raw);o;end
            def _dump(_depth);@bytes;end
          end

          root=ARGV.fetch(0)
          path=File.join(root,'knight/gameasync/Data')
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          def datafile(dir,prefix,name);File.join(dir,prefix+name+'.rxdata');end
          map29_path=datafile(path,prefix,'Map029')
          map45_path=datafile(path,prefix,'Map045')
          map46_path=datafile(path,prefix,'Map046')
          newmap_path=datafile(path,prefix,'Map047')
          info_path=datafile(path,prefix,'MapInfos')
          scripts_path=File.join(path,'Scripts.rxdata')
          raise 'Map047 already present' if File.exist?(newmap_path)
          config=JSON.parse(File.read(ARGV.fetch(1)))
          width,height,spawn=config.fetch('width'),config.fetch('height'),config.fetch('spawn')
          raise 'Unexpected TI dimensions' unless [width,height]==[363,238] && spawn==[197,128]
          walk=File.binread(ARGV.fetch(2)).unpack('C*')
          raise 'Invalid passability size' unless walk.length==width*height
          raise 'Spawn blocked' unless walk[spawn[1]*width+spawn[0]]==1
          map29=Marshal.load(File.binread(map29_path))
          map45=Marshal.load(File.binread(map45_path))
          map46=Marshal.load(File.binread(map46_path))
          raise 'Invalid original dungeon map sizes' unless
            [map45.instance_variable_get(:@width),map45.instance_variable_get(:@height)]==[288,144] &&
            [map46.instance_variable_get(:@width),map46.instance_variable_get(:@height)]==[336,168]
          raise 'Wrong town size' unless [map29.instance_variable_get(:@width),map29.instance_variable_get(:@height)]==[200,200]

          def event_command(code,parameters=[],indent=0)
            o=RPG::EventCommand.allocate
            o.instance_variable_set(:@code,code)
            o.instance_variable_set(:@parameters,parameters)
            o.instance_variable_set(:@indent,indent)
            o
          end

          # Expand only the existing Event11's final destination menu.
          # No new NPCs or town events. The three original choices and all
          # original transfers remain in their original order.
          events=map29.instance_variable_get(:@events)
          raise 'Existing Silver Knight teleporter missing' unless events.key?(11)
          original_event_ids=events.keys.sort
          original_other_events=events.reject{|id,_|id==11}.transform_values{|ev|Marshal.dump(ev)}
          tele=events.fetch(11)
          raise 'Unexpected teleporter location' unless
            [tele.instance_variable_get(:@x),tele.instance_variable_get(:@y)]==[70,48]
          tele_name=tele.instance_variable_get(:@name).dup.force_encoding('UTF-8')
          raise 'Wrong existing NPC' unless tele_name.include?('공간 이동사')
          pages=tele.instance_variable_get(:@pages)
          raise 'Unexpected existing NPC pages' unless pages.length==1
          cmds=pages.first.instance_variable_get(:@list)
          menus=cmds.select{|c|c.instance_variable_get(:@code)==102}
          raise 'Teleport menu layout changed' unless menus.length==3
          menu=menus.find{|c|
            choices=c.instance_variable_get(:@parameters)[0]
            choices.any?{|name|name.dup.force_encoding('UTF-8')=='말섬던전'}
          }
          raise 'Final teleport menu missing' unless menu
          options,cancel_type=menu.instance_variable_get(:@parameters)
          names=options.map{|x|x.dup.force_encoding('UTF-8')}
          raise 'Original destinations changed' unless
            names==['지저 호수 2500 아데나','말섬던전','취소'] && cancel_type==4
          # Clone the original Korean string encoding for Marshal compatibility.
          new_name='말하는 섬'.dup.force_encoding(options[0].encoding)
          menu.instance_variable_set(:@parameters,[options[0..1]+[new_name,options[2]],cancel_type])
          cancel_branch=cmds.select{|c|
            c.instance_variable_get(:@code)==402 &&
            c.instance_variable_get(:@indent)==4 &&
            c.instance_variable_get(:@parameters)[0]==2 &&
            c.instance_variable_get(:@parameters)[1].dup.force_encoding('UTF-8')=='취소'
          }
          raise 'Original cancel branch changed' unless cancel_branch.size==1
          cancel_branch=cancel_branch.first
          cancel_branch.instance_variable_set(:@parameters,[3,options[2]])
          pos=cmds.index(cancel_branch)
          cmds.insert(pos,
            event_command(402,[2,new_name],4),
            event_command(201,[0,47,spawn[0],spawn[1],0,1],5),
            event_command(0,[],5))
          raise 'Changed town event IDs' unless events.keys.sort==original_event_ids
          raise 'Modified unrelated town events' unless
            events.reject{|id,_|id==11}.all?{|id,e|Marshal.dump(e)==original_other_events[id]}
          # Original transfer commands are still byte-for-byte equivalent.
          transfer_targets=cmds.select{|c|c.instance_variable_get(:@code)==201}.map{|c|c.instance_variable_get(:@parameters)[1]}
          raise 'Original teleport targets altered' unless
            transfer_targets==[21,17,18,13,29,13,41,45,47]
          File.binwrite(map29_path,Marshal.dump(map29))

          newmap=Marshal.load(Marshal.dump(map45))
          newmap.instance_variable_set(:@width,width)
          newmap.instance_variable_set(:@height,height)
          newmap.instance_variable_set(:@tileset_id,31)
          newmap.instance_variable_set(:@encounter_list,[])
          newmap.instance_variable_set(:@autoplay_bgm,false)
          newmap.instance_variable_set(:@autoplay_bgs,false)
          # RPG Table format: dimensions, width,height,depth,total ushort cells.
          raw=[3,width,height,3,width*height*3].pack('L<5')
          raw+=walk.map{|b|b==1 ? 384 : 385}.pack('S<*')
          raw+=("\0"*(width*height*4))
          table=Table._load(raw)
          newmap.instance_variable_set(:@data,table)
          # No monster, teleporter, return-NPC, or other events on this field.
          newmap.instance_variable_set(:@events,{})
          File.binwrite(newmap_path,Marshal.dump(newmap))

          info=Marshal.load(File.binread(info_path))
          raise 'MapInfo 47 already exists' if info.has_key?(47)
          mapinfo=Marshal.load(Marshal.dump(info.fetch(45)))
          mapinfo.instance_variable_set(:@name,'Sanctuary 말하는 섬 필드')
          mapinfo.instance_variable_set(:@parent_id,0)
          mapinfo.instance_variable_set(:@order,47)
          info[47]=mapinfo
          File.binwrite(info_path,Marshal.dump(info))

          scripts=Marshal.load(File.binread(scripts_path))
          raise 'Unexpected script count' unless scripts.size==136
          source=Zlib::Inflate.inflate(scripts[97][2])
          def replace_once(s,a,b)
            raise "Mismatch or duplicate patch: #{a[0,65]}" unless s.scan(a).size==1
            s.sub(a,b)
          end
          source=replace_once(source,
            '@slti_floor = [45,46].include?($game_map.map_id) ? $game_map.map_id : nil',
            '@slti_floor = [45,46,47].include?($game_map.map_id) ? $game_map.map_id : nil')
          source=replace_once(source,
            '@slti_cols = @slti_floor == 45 ? 9 : (@slti_floor == 46 ? 11 : 0)',
            '@slti_cols = @slti_floor == 45 ? 9 : (@slti_floor == 46 ? 11 : (@slti_floor == 47 ? 12 : 0))')
          source=replace_once(source,
            '@slti_rows = @slti_floor == 45 ? 5 : (@slti_floor == 46 ? 6 : 0)',
            '@slti_rows = @slti_floor == 45 ? 5 : (@slti_floor == 46 ? 6 : (@slti_floor == 47 ? 8 : 0))')
          scripts[97][2]=Zlib::Deflate.deflate(source)
          File.binwrite(scripts_path,Marshal.dump(scripts))
          File.binwrite('build/slti47-script97.rb',source)
          puts "PASS new Map047 #{width}x#{height}, #{walk.count(1)} walk cells; 96 chunks"
          puts 'PASS existing Silver Knight NPC Event11: one free Talking Island choice added'
          puts 'PASS no new NPCs; Map047 zero events; Maps045/046 and R94 unchanged'
          SCRIPT
          ruby -c build/ti_patch.rb
          ruby build/ti_patch.rb site build/ti/ti-config.json build/ti/walk.bin
          ruby -c build/slti47-script97.rb

      - name: V229R138 Rebuild cache mapping and visible version tags
        shell: bash
        run: |
          set -euo pipefail
          cat > build/refresh.py <<'SCRIPT'
          from pathlib import Path
          import re,hashlib,json
          root=Path('site')
          mapdir=root/'knight/gameasync/Data'
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          base=root/'knight/gameasync'
          mapping=base/'mapping.js'
          s=mapping.read_text('utf8')
          def m5(path):return hashlib.md5(path.read_bytes()).hexdigest()
          for short in ('Scripts','MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap029','MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMapInfos'):
              path=mapdir/(short+'.rxdata')
              expr=r'(Data/'+re.escape(short)+r'\.rxdata\?h=)[a-f0-9]{32}'
              s,n=re.subn(expr,lambda m:m[1]+m5(path),s)
              assert n==1,('Missing original mapping',short,n)
          new_files=[]
          new_files.append(mapdir/(prefix+'Map047.rxdata'))
          new_files.extend(sorted((base/'Graphics/Panoramas').glob('SLTI_47_C*_*.png')))
          assert len(new_files)==97,len(new_files)
          entries=[]
          for path in new_files:
              rel=path.relative_to(base).as_posix()
              key=rel.lower().rsplit('.',1)[0]
              assert '["'+key+'",' not in s,('Duplicate entry',key)
              entries.append(f'["{key}", "{rel}?h={m5(path)}"],')
          assert s.count('\n];')==1
          s=s.replace('\n];','\n'+ '\n'.join(entries)+'\n];')
          mapping.write_text(s,'utf8')
          for short in ('index.html','knight/index.html'):
              p=root/short;t=p.read_text('utf8')
              assert 'V229R137' in t and 'V229R138' not in t
              p.write_text(t.replace('V229R137','V229R138').replace('v229r137','v229r138'),'utf8')
          p=root/'knight/js/sl-assets-v229r115.js';t=p.read_text('utf8')
          assert t.count("var version='V229R137';")==1
          p.write_text(t.replace("var version='V229R137';","var version='V229R138';"),'utf8')
          assert 'js/sl-assets-v229r115.js?v=v229r138' in (root/'knight/index.html').read_text('utf8')
          for path in new_files:
              key=path.relative_to(base).as_posix().lower().rsplit('.',1)[0]
              assert s.count('"'+key+'"')==1,key
          print('PASS new map and 96 chunks indexed in mapping.js; all version/cache keys refreshed')
