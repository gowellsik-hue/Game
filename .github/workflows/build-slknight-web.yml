          menu_text=Zlib::Inflate.inflate(menu[2]).force_encoding(Encoding::UTF_8)
          equip_wrap=menu_text[/class Scene_Equip.*?(?=class Scene_Status)/m]
          abort 'equip xrxs dispose missing' unless equip_wrap&&equip_wrap.include?('alias xrxs_mp7_dispose dispose')
          abort 'resolution inactive' unless Zlib::Inflate.inflate(a[97][2]).include?('Graphics.resize_screen')&&Zlib::Inflate.inflate(a[97][2]).include?('$WINDOW_WIDTH = 800')
          puts 'SCRIPT_VERIFY_OK'
          RB
          ruby - <<'RB'
          module RPG
            class Item;end
            class AudioFile;end
          end
          p=Dir.glob('player/gameasync/Data/*Items.rxdata').max_by{|x|File.size(x)}
          a=Marshal.load(File.binread(p))
          abort 'item 3 mismatch' unless a[3].instance_variable_get(:@common_event_id)==8
          abort 'item 17 mismatch' unless a[17].instance_variable_get(:@common_event_id)==6
          puts 'ITEM_VERIFY_OK'
          RB
          rm -rf player/.git
          du -sh player
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
