            zone.addEventListener('pointercancel',releaseJoy);layoutPadSoon();updateHotbar();
            if(window.ResizeObserver){const ro=new ResizeObserver(layoutPadSoon);ro.observe(document.getElementById('canvas'));ro.observe(main);window.slPadResizeObserver=ro;}
            window.addEventListener('resize',layoutPadSoon);window.addEventListener('orientationchange',()=>setTimeout(()=>{resizeCanvas();layoutPadSoon();},100));
            document.addEventListener('fullscreenchange',()=>setTimeout(()=>{resizeCanvas();layoutPadSoon();},100));
            window.addEventListener('blur',()=>{releaseJoy();releaseAll();});document.addEventListener('visibilitychange',()=>{if(document.hidden){releaseJoy();releaseAll();}});
          }
