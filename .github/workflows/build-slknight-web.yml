
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R41
# PURPOSE: Emergency recovery from R40 mobile black-screen/loading stall.
# BASE: VERIFIED playable V229R38 GitHub Pages artifact, run 39366339881.
# No R39/R40 wall overlays, regenerated terrain, added wall PNGs, or collision edits.
# R38 BGM 40% -> 60% of original. R38 silent blacksmith SE unchanged.
# Baphomet, 1F/2F maps, temporary stairs, combat, movement and game engine intact.
name: build-slknight-web.yml | V229R41 | Clean Native Events and 2x Terrain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: V229R41 Restore last working R38 original engine and maps
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39366339881
          name: github-pages
          github-token: ${{ github.token }}
          path: r38

      - name: V229R41 Verify exact R38 artifact; reject all R39/R40 wall changes
        shell: bash
        run: |
          set -euo pipefail
          test -s r38/artifact.tar
          mkdir -p site build
          tar -xf r38/artifact.tar -C site
          python3 - <<'PY_R41_BASE'
          from pathlib import Path
          import hashlib,json
          site=Path('site')
          game=site/'knight/gameasync'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          sha=lambda path:hashlib.sha256(path.read_bytes()).hexdigest()
          known={
            'Data/Scripts.rxdata':'f249b698ae6d1c72535ae2b12559e8bb10494657febc67ba0b23195944f4f7d0',
            f'Data/{pre}Map045.rxdata':'d9dc66271e48f051b0d35a2dce109777a14fd396f87fcd7d0e76b044b482e3ba',
            f'Data/{pre}Map046.rxdata':'c3f4cee70c9aff3459245727ccd49403079caa959aeebf00cf9eed99fb852059',
          }
          for relative,expected in known.items():
              assert sha(game/relative)==expected,relative
          silent='0293a2a069d6133ab53dc4c637cdd9ad5a45ae34d2aafb4b6a75dedb92454899'
          for name in ('대장간 소리.ogg','대장간 소리2.ogg'):
              assert sha(game/'Audio/SE'/name)==silent,name
          assert not list((game/'Graphics/Panoramas').glob('SLTIW_*.png')), 'R39/R40 wall overlay contamination'
          assert 'V229R38' in (site/'index.html').read_text(encoding='utf-8')
          bridge=(site/'knight/index.html').read_text(encoding='utf-8')
          assert 'V229R38' in bridge
          assert bridge.count("var gain=k==='BGS'?0.20:(k==='BGM'?0.40:1);")==1
          initial={str(p.relative_to(site)):sha(p) for p in site.rglob('*') if p.is_file()}
          assert len(initial)==5472,('Unexpected baseline file count',len(initial))
          Path('build/r41-r38-original-hashes.json').write_text(json.dumps(initial,sort_keys=True),encoding='utf-8')
          print('PASS exact R38 site, 5472 files, R38 native engine/maps, silent blacksmith preserved')
          PY_R41_BASE

      - name: V229R41 Change only BGM output to original 60 percent and version labels
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_R41_AUDIO'
          from pathlib import Path
          site=Path('site')
          bridge=site/'knight/index.html'
          source=bridge.read_text(encoding='utf-8')
          previous="var gain=k==='BGS'?0.20:(k==='BGM'?0.40:1);"
          target="var gain=k==='BGS'?0.20:(k==='BGM'?0.60:1);"
          assert source.count(previous)==1,'Original BGM gain absent/duplicated'
          source=source.replace(previous,target,1)
          assert 'V229R38' in source
          source=source.replace('V229R38','V229R41').replace('v229r38','v229r41')
          bridge.write_text(source,encoding='utf-8')
          homepage=site/'index.html'
          source=homepage.read_text(encoding='utf-8')
          assert 'V229R38' in source
          homepage.write_text(source.replace('V229R38','V229R41').replace('v229r38','v229r41'),encoding='utf-8')
          print('PASS BGM 0.60, BGS 0.20, normal effects and blacksmith mute preserved')
          PY_R41_AUDIO

      - name: V229R41 Verify only two HTML files changed and game remains native R38
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_R41_CHECK'
          from pathlib import Path
          import hashlib,json
          site=Path('site')
          sha=lambda path:hashlib.sha256(path.read_bytes()).hexdigest()
          original=json.loads(Path('build/r41-r38-original-hashes.json').read_text(encoding='utf-8'))
          updated={str(p.relative_to(site)):sha(p) for p in site.rglob('*') if p.is_file()}
          assert original.keys()==updated.keys() and len(updated)==5472
          diff={path for path in original if original[path]!=updated[path]}
          assert diff=={'index.html','knight/index.html'},('Unexpected game changes',diff)
          assert not list((site/'knight/gameasync/Graphics/Panoramas').glob('SLTIW_*.png'))
          assert 'V229R41' in (site/'index.html').read_text(encoding='utf-8')
          bridge=(site/'knight/index.html').read_text(encoding='utf-8')
          assert 'V229R41' in bridge
          assert bridge.count("var gain=k==='BGS'?0.20:(k==='BGM'?0.60:1);")==1
          # Scripts.rxdata, all maps, character sprites, background PNGs,
          # preload manifests, audio SE, mapping.js and game loaders are byte-for-byte R38.
          unchanged=['knight/gameasync/Data/Scripts.rxdata',
                     'knight/gameasync/mapping.js','knight/js/drive.js','knight/js/dpad.js']
          assert all(updated[path]==original[path] for path in unchanged)
          Path('build/r41-integrity.txt').write_text(
              'PASS: 5472 originals, only index.html and knight/index.html changed; '\
              'all R38 gameplay, original tiles and muted blacksmith remain unchanged.\n',encoding='utf-8')
          print(Path('build/r41-integrity.txt').read_text().strip())
          PY_R41_CHECK
          node --check site/knight/gameasync/mapping.js
          node - <<'JS_R41_AUDIO_TEST'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('site/knight/index.html','utf8');
          const script=html.split('<script>',2)[1].split('</script>',1)[0];
          class MockAudio {
            constructor(){this.volume=0;this.src='';this.attrs={};}
            setAttribute(k,v){this.attrs[k]=v;}
            getAttribute(k){return this.attrs[k];}
            pause(){}load(){}play(){return undefined;}
          }
          const mockConsole={log(){}};
          const window={addEventListener(){}};
          vm.runInNewContext(script,{Audio:MockAudio,console:mockConsole,window,document:{},
            encodeURI,setTimeout(){},Math,Number,String});
          mockConsole.log('SLAUDIO|BGM_PLAY|Audio/BGM/TEST|80|100');
          mockConsole.log('SLAUDIO|BGS_PLAY|Audio/BGS/TEST|80|100');
          if(Math.abs(window.slAudioBridge.BGM.volume-0.48)>1e-8)throw Error('BGM should be 80% x 0.60');
          if(Math.abs(window.slAudioBridge.BGS.volume-0.16)>1e-8)throw Error('BGS should remain 80% x 0.20');
          process.stdout.write('PASS audio bridge: BGM 60% source, BGS unchanged\n');
          JS_R41_AUDIO_TEST

      - name: V229R41 Upload minimal recovery audit
        uses: actions/upload-artifact@v4
        with:
          name: SLKnight-V229R41-R38-Stable-Recovery-Audit
          path: build/r41-integrity.txt
          if-no-files-found: error
          retention-days: 30

      - name: V229R41 Upload original R38 engine and maps to EXISTING Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
