
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R14 / Silver Knight Teleporter - TI Dungeon Menu
name: build-slknight-web.yml | V229R14 | TI Dungeon Menu

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Restore verified V229R13 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39123726665
          name: github-pages
          github-token: ${{ github.token }}
          path: previous

      - name: Inspect and restore exact baseline
        run: |
          set -euo pipefail
          test -s previous/artifact.tar
          mkdir -p site
          tar -xf previous/artifact.tar -C site
          python3 - <<'PY_VERIFY'
          import hashlib,json
          from pathlib import Path
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(before)==5354,len(before)
          checks={
            'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap029.rxdata':'a57a04c8374af36f66af7acafbec9a9cc1df0a95e59341f11706dbd27548d13b',
            'knight/gameasync/mapping.js':'a0c2f9bd83c81503bb77e058d8eb9b4277c84aa5699de48974bd45cdd35',
            'knight/index.html':'00dfe6c49ef167ceee99316bf0525d4071bb75d5222497028f1c5c1578c19299'
          }
          for f,sha in checks.items():
              assert before[f]==sha,f
          Path('/tmp/before-r14.json').write_text(json.dumps(before))
          PY_VERIFY

      - name: Add independent TI Dungeon choice to Silver Knight NPC
        run: |
          set -euo pipefail
          cat > /tmp/teleporter-r14.rb <<'RUBY_R14'
          require 'digest'

          module RPG
            class Map;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
            class AudioFile;end
          end
          class Table
            def self._load(s);allocate;end
          end
          class Tone
            def self._load(s);s;end
          end
          class Color
            def self._load(s);s;end
          end

          def cmd(code,indent,args)
            o=RPG::EventCommand.allocate
            o.instance_variable_set(:@code,code)
            o.instance_variable_set(:@indent,indent)
            o.instance_variable_set(:@parameters,args)
            o
          end
          def code(c);c.instance_variable_get(:@code);end
          def indent(c);c.instance_variable_get(:@indent);end
          def params(c);c.instance_variable_get(:@parameters);end
          def utf(s);s.dup.force_encoding('UTF-8').scrub;end

          file=ARGV.fetch(0)
          expected='a57a04c8374af36f66af7acafbec9a9cc1df0a95e59341f11706dbd27548d13b'
          raise 'Unverified Map029' unless Digest::SHA256.file(file).hexdigest==expected

          map=Marshal.load(File.binread(file))
          event=map.instance_variable_get(:@events).fetch(11)
          raise 'Wrong NPC' unless
            event.instance_variable_get(:@name).include?('공간 이동사'.b) &&
            event.instance_variable_get(:@x)==70 &&
            event.instance_variable_get(:@y)==48

          pages=event.instance_variable_get(:@pages)
          raise 'Unexpected NPC pages' unless pages.size==1
          commands=pages[0].instance_variable_get(:@list)
          raise 'Unexpected command count' unless commands.size==100

          choice_at=commands.find_index do |c|
            code(c)==102 && indent(c)==3 &&
            params(c).is_a?(Array) &&
            params(c)[0].any?{|s|utf(s).include?('수련 던전 입구')}
          end
          raise 'Town menu missing' unless choice_at

          opts,cancel=params(commands[choice_at])
          raise 'Unexpected menu structure' unless
            cancel==5 && opts.size==4 &&
            utf(opts[3])=='지저 호수 2500 아데나'

          branch=commands.find_index do |c|
            code(c)==402 && indent(c)==3 &&
            params(c)==[3,opts[3]]
          end
          raise 'Old lake branch missing' unless branch

          cancel_at=((branch+1)...commands.size).find do |i|
            code(commands[i])==403 && indent(commands[i])==3
          end
          raise 'Cancel branch missing' unless cancel_at

          old_body=commands[(branch+1)...cancel_at].reject do |c|
            code(c)==0
          end
          old_transfers=old_body.select{|c|code(c)==201}.map{|c|params(c)}
          raise 'Lake destination changed' unless
            old_transfers==[[0,41,20,55,0,1]]

          opts[3]='다음>'
          third=['지저 호수 2500 아데나','말섬던전','취소']

          inserted=[
            cmd(402,3,[3,'다음>']),
            cmd(102,4,[third,4]),
            cmd(402,4,[0,third[0]])
          ]

          old_body.each do |c|
            copy=Marshal.load(Marshal.dump(c))
            copy.instance_variable_set(:@indent,indent(c)+1)
            inserted << copy
          end

          inserted += [
            cmd(402,4,[1,third[1]]),
            cmd(101,5,['말섬던전은 별도 맵 연결 후 입장할 수 있습니다.']),
            cmd(402,4,[2,third[2]]),
            cmd(403,4,[]),
            cmd(404,4,[])
          ]

          commands[branch...cancel_at]=inserted

          raise 'Too many options' if commands.any? do |c|
            code(c)==102 && params(c)[0].size>4
          end

          assert_destinations=[
            [21,71,58],[17,23,27],[18,114,111],
            [13,118,55],[29,100,132],[13,73,42],[41,20,55]
          ]
          destinations=commands.select{|c|code(c)==201}.map do |c|
            params(c)[1,3]
          end
          raise 'Existing warp changed' unless
            destinations.size==7 &&
            (assert_destinations-destinations).empty?

          File.binwrite(file,Marshal.dump(map))
          reloaded=Marshal.load(File.binread(file))
          verified=reloaded.instance_variable_get(:@events).fetch(11)
            .instance_variable_get(:@pages)[0]
            .instance_variable_get(:@list)
          raise 'New choice missing' unless verified.any? do |c|
            code(c)==402 && params(c)[1]=='말섬던전'
          end

          puts 'V229R14 PASS: independent TI Dungeon option added'
          puts 'Existing transfer destinations: 7 unchanged'
          RUBY_R14

          ruby -c /tmp/teleporter-r14.rb
          ruby /tmp/teleporter-r14.rb \
            site/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap029.rxdata

          python3 - <<'PY_INDEX'
          from pathlib import Path
          import hashlib,re
          root=Path('site/knight')
          rel='Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap029.rxdata'
          digest=hashlib.md5((root/'gameasync'/rel).read_bytes()).hexdigest()
          path=root/'gameasync/mapping.js'
          old=path.read_text(encoding='utf-8')
          new,n=re.subn(
              re.escape(rel+'?h=')+r'[a-f0-9]{32}',
              lambda _:rel+'?h='+digest,old
          )
          assert n==1 and new!=old
          path.write_text(new,encoding='utf-8')
          index=root/'index.html'
          page=index.read_text(encoding='utf-8')
          old='gameasync/mapping.js?v=v229r13'
          assert page.count(old)==1
          index.write_text(
              page.replace(old,'gameasync/mapping.js?v=v229r14'),
              encoding='utf-8'
          )
          PY_INDEX

      - name: Verify only NPC map and cache references changed
        run: |
          set -euo pipefail
          python3 - <<'PY_CHECK'
          import hashlib,json
          from pathlib import Path
          root=Path('site')
          old=json.loads(Path('/tmp/before-r14.json').read_text())
          now={
              str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }
          changed={p for p in old if old[p]!=now.get(p)}
          expected={
              'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap029.rxdata',
              'knight/gameasync/mapping.js',
              'knight/index.html'
          }
          assert len(now)==5354 and old.keys()==now.keys()
          assert changed==expected,(changed,expected)
          assert 'gameasync/mapping.js?v=v229r14' in (
              root/'knight/index.html'
          ).read_text()
          print('V229R14 VERIFIED: 3 of 5354 files changed')
          PY_CHECK

      - name: Upload verified menu game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
