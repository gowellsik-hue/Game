
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R80
# BASE: exact successfully deployed V229R79 game (original R66 engine).
# CHANGE: wall_depth=wall_y+by1*2+56 -> +20, exactly one occurrence.
# KEEP: V229R79 no-sliding movement, S32 passability, all other scripts,
# original R49 graphics, monsters, events, spawns and game assets.
# Do not rebuild native collision or invent new wall geometry.
name: build-slknight-web.yml | V229R80 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R80 Restore verified R79 deployed game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40254399979
          name: github-pages
          github-token: ${{ github.token }}
          path: r79

      - name: V229R80 Change only wall depth from 56 to 20
        shell: bash
        run: |
          set -euo pipefail
          test -s r79/artifact.tar
          mkdir -p site build
          tar -xf r79/artifact.tar -C site
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          files={str(f.relative_to(root)):hashlib.sha256(f.read_bytes()).hexdigest() for f in root.rglob('*') if f.is_file()}
          assert len(files)==5517, ('unexpected game files',len(files))
          assert all('V229R79' in (root/name).read_text('utf-8') for name in ('index.html','knight/index.html'))
          p=root/'knight/gameasync/Data/Scripts.rxdata'
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='872fa1efbbe5c44e7d651e76e1e023090a00695580eb0d4b3d3fd53c46c84558', 'wrong R79 engine: abort'
          Path('build/original-files.json').write_text(json.dumps(files,sort_keys=True))
          print('PASS verified R79 deployment, 5517 unchanged input files')
          PY_BASE
          ruby -rzlib -rdigest - <<'RB_PATCH'
          path='site/knight/gameasync/Data/Scripts.rxdata'
          scripts=Marshal.load(File.binread(path))
          before=Marshal.load(File.binread(path))
          raise 'wrong game script count' unless scripts.length==136
          src=Zlib::Inflate.inflate(scripts[134][2])
          raise 'wrong R79 original game script' unless Digest::SHA256.hexdigest(src)=='efbcc1d32b045207b42a53fe7847dc7dd4170c5a608a55c7684158c3da6d41c1'
          old_depth='wall_depth=wall_y+by1*2+56'
          new_depth='wall_depth=wall_y+by1*2+20'
          raise 'expected exactly one wall depth calculation' unless src.scan(old_depth).length==1
          raise 'target depth already present' unless src.scan(new_depth).empty?
          patched=src.sub(old_depth,new_depth)
          raise 'other engine change detected' unless patched.sub(new_depth,old_depth)==src
          raise 'R49 renderer missing' unless patched.include?('def slti_r49_update_walls')
          part=patched.split('  def self.native_target(mid,x,y,dir)',2)
          raise 'native movement missing' unless part.length==2
          method=part[1].split('  def self.native_line?',2)[0]
          raise 'wall sliding unexpectedly present' if method.include?('return [x+dx,y]') || method.include?('return [x,y+dy]')
          File.binwrite('build/r80-script134.rb',patched)
          scripts[134][2]=Zlib::Deflate.deflate(patched)
          raise 'another script changed' unless scripts.each_index.all?{|i|i==134 || scripts[i]==before[i]}
          File.binwrite(path,Marshal.dump(scripts))
          again=Marshal.load(File.binread(path))
          raise 'patch did not survive save' unless Zlib::Inflate.inflate(again[134][2])==patched
          puts 'PASS one wall_depth substitution, no changes to original collision or other scripts'
          RB_PATCH
          ruby -c build/r80-script134.rb
          python3 - <<'PY_FINISH'
          from pathlib import Path
          import hashlib,json,re
          root=Path('site');game=root/'knight/gameasync'
          archive=game/'Data/Scripts.rxdata'
          mapping=game/'mapping.js'
          old=mapping.read_text('utf-8')
          digest=hashlib.md5(archive.read_bytes()).hexdigest()
          new,count=re.subn(r'Data/Scripts\.rxdata\?h=[0-9a-f]{32}',lambda m:'Data/Scripts.rxdata?h='+digest,old)
          assert count==1, 'engine cache hash missing'
          mapping.write_text(new,encoding='utf-8')
          for name in ('index.html','knight/index.html'):
            p=root/name
            value=p.read_text('utf-8')
            assert 'V229R79' in value, name
            p.write_text(value.replace('V229R79','V229R80').replace('v229r79','v229r80'),encoding='utf-8')
          original=json.loads(Path('build/original-files.json').read_text('utf-8'))
          now={str(f.relative_to(root)):hashlib.sha256(f.read_bytes()).hexdigest() for f in root.rglob('*') if f.is_file()}
          assert len(now)==5517 and original.keys()==now.keys()
          changed={name for name in now if now[name]!=original[name]}
          expected={'index.html','knight/index.html','knight/gameasync/mapping.js','knight/gameasync/Data/Scripts.rxdata'}
          assert changed==expected, ('unapproved file modifications',changed^expected)
          print('PASS 5517 game files preserved; only engine, cache hash and two version labels changed')
          PY_FINISH
          node --check site/knight/gameasync/mapping.js

      - name: V229R80 Publish full game for depth 20 test
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
