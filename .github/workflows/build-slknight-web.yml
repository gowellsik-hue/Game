      - name: Connect direct keyboard input to original name window
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl417-name.js <<'JAVASCRIPT'
          (function(){
            'use strict';

            const file='/game/SL417Name.tmp';

            let field=null;
            let rect=null;
            let composing=false;

            function layout(){
              if(!field)return;

              const c=document.getElementById('canvas').getBoundingClientRect();

              const [x,y,w,h]=rect;

              Object.assign(field.style,{
                left:(c.left+x*c.width/800)+'px',
                top:(c.top+y*c.height/600)+'px',
                width:(w*c.width/800)+'px',
                height:(h*c.height/600)+'px'
              });
            }

            function send(flag){
              if(!field||composing)return;

              FS.writeFile(
                file,
                new TextEncoder().encode(
                  flag+'\n'+field.value
                )
              );
            }

            function close(){
              if(field){
                field.remove();
                field=null;
                rect=null;
                composing=false;
              }

              if(FS.analyzePath(file).exists){
                FS.unlink(file);
              }

              document.getElementById('canvas').focus();
            }

            function open(parts){
              if(field)return;

              if(
                FS.readFile(file,{encoding:'utf8'})!=='0\n'
              ){
                throw Error('Name input initialization');
              }

              rect=parts.slice(2,6).map(Number);

              if(rect.some(v=>!Number.isFinite(v))){
                throw Error('Name field bounds');
              }

              field=document.createElement('input');

              field.type='text';
              field.maxLength=Number(parts[6]);
              field.autocomplete='off';

              field.setAttribute('aria-label','캐릭터 이름');
              field.setAttribute('autocapitalize','off');

              field.spellcheck=false;

              field.style.cssText=
                'position:fixed;'+
                'z-index:2147483647;'+
                'box-sizing:border-box;'+
                'border:0;outline:0;'+
                'background:transparent;'+
                'color:transparent;'+
                'caret-color:transparent;'+
                'font-size:16px;cursor:text;padding:0;';

              field.addEventListener(
                'input',
                ()=>send('0')
              );

              field.addEventListener(
                'compositionstart',
                ()=>composing=true
              );

              field.addEventListener(
                'compositionend',
                ()=>{
                  composing=false;
                  send('0');
                }
              );

              document.getElementById('main').appendChild(field);

              layout();

              field.focus({preventScroll:true});
            }

            ['keydown','keyup','keypress'].forEach(type=>{

              window.addEventListener(type,e=>{

                if(!field||e.target!==field)return;

                if(
                  type==='keydown' &&
                  e.key==='Enter' &&
                  !composing &&
                  !e.isComposing
                ){
                  e.preventDefault();
                  send('1');
                }

                e.stopImmediatePropagation();

              },true);
            });

            const resize=()=>requestAnimationFrame(layout);

            window.addEventListener('resize',resize);
            document.addEventListener('fullscreenchange',resize);

            if(window.visualViewport){
              window.visualViewport.addEventListener('resize',resize);
              window.visualViewport.addEventListener('scroll',resize);
            }

            const log=console.log.bind(console);

            console.log=function(...args){

              log(...args);

              const s=args.join(' ').trim();

              try{

                if(s.startsWith('SL417|NAME|')){

                  open(s.split('|'));

                }else if(s==='SL417|NAME_CLOSE'&&field){

                  close();

                }else if(s==='SL417|NAME_RETRY'&&field){

                  field.focus({preventScroll:true});

                }

              }catch(e){
                console.error('SL417_NAME_ERROR',e);
              }
            };
          })();
          JAVASCRIPT

          node --check /tmp/sl417-name.js

          python3 - <<'PYTHON'
          from pathlib import Path

          page=Path('site/knight/index.html')
          html=page.read_text('utf8')

          assert html.count('</head>')==1
          assert 'SL417|NAME|' not in html
          assert 'sl417-create' not in html

          js=Path('/tmp/sl417-name.js').read_text('utf8')

          assert "document.createElement('input')" in js
          assert "document.createElement('button')" not in js
          assert "document.createElement('dialog')" not in js

          html=html.replace(
              '</head>',
              '<script>\n'+js+'\n</script>\n</head>',
              1
          )

          page.write_text(html,'utf8')

          print('PASS native name window keyboard input')
          print('PASS no separate character creation screen')
          print('PASS original game controls preserved')
          PYTHON

      - name: Update V4.17 data references
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib,json,re

          root=Path('site')
          game=root/'knight/gameasync'

          old_md5=json.loads(
              Path('/tmp/sl417-md5.json').read_text('utf8')
          )

          mapper=game/'mapping.js'

          old_mapping=hashlib.sha256(
              mapper.read_bytes()
          ).hexdigest()[:16]

          s=mapper.read_bytes()

          for name,previous in old_md5.items():

              marker=('Data/'+name+'?h=').encode('ascii')

              pattern=re.escape(marker)+rb'[0-9a-f]{32}'

              assert re.findall(pattern,s)==[
                  marker+previous.encode('ascii')
              ],name

              digest=hashlib.md5(
                  (game/'Data'/name).read_bytes()
              ).hexdigest()

              assert digest!=previous,name

              new=marker+digest.encode('ascii')

              s=re.sub(pattern,lambda _:new,s)

              assert s.count(new)==1,name

          mapper.write_bytes(s)

          mapping=hashlib.sha256(
              mapper.read_bytes()
          ).hexdigest()[:16]

          bitmap=hashlib.sha256(
              (game/'bitmap-map.js').read_bytes()
          ).hexdigest()[:16]

          loader=root/'knight/js/sl-assets-v229r115.js'

          old_loader=hashlib.sha256(
              loader.read_bytes()
          ).hexdigest()[:16]

          s=loader.read_bytes()

          assert s.count(b"var version='V4.16';")==1

          loader.write_bytes(
              s.replace(
                  b"var version='V4.16';",
                  b"var version='V4.17';"
              )
          )

          new_loader=hashlib.sha256(
              loader.read_bytes()
          ).hexdigest()[:16]

          page=root/'knight/index.html'

          s=page.read_text('utf8')

          references=[
              (
                  'gameasync/mapping.js?v=v4.16&h='+old_mapping,
                  'gameasync/mapping.js?v=v4.17&h='+mapping,
                  1
              ),
              (
                  'gameasync/bitmap-map.js?v=v4.16&h='+bitmap,
                  'gameasync/bitmap-map.js?v=v4.17&h='+bitmap,
                  2
              ),
              (
                  'js/sl-assets-v229r115.js?v=v4.16&h='+old_loader,
                  'js/sl-assets-v229r115.js?v=v4.17&h='+new_loader,
                  1
              )
          ]

          for old,new,count in references:

              assert s.count(old)==count,old

              s=s.replace(old,new)

              assert s.count(new)==count,new

          assert 'V4.16' in s

          page.write_text(
              s.replace('V4.16','V4.17').replace('v4.16','v4.17'),
              'utf8'
          )

          page=root/'index.html'

          s=page.read_text('utf8')

          assert 'V4.16' in s

          page.write_text(
              s.replace('V4.16','V4.17').replace('v4.16','v4.17'),
              'utf8'
          )

          print('PASS updated script and map references')
          PYTHON

