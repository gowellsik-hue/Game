      - name: Extend only existing two original native renderer scripts for Map048
        shell: bash
        run: |
          set -euo pipefail
          cat > build/v22/apply_map048_scripts.rb <<'V22_MAP48_SCRIPTS_EOF'
          # encoding: UTF-8
          require 'json'
