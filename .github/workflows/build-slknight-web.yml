
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R137
# BASE: Exact successful V229R135 Pages artifact, not the rejected R136 proposal.
# REQUESTED: Remove only the R135 Game_Map.passable? override that broke existing routes.
# PRESERVE: All 452 R94 direction masks, their helpers, and designated opening unchanged.
# PRESERVE: RPG engine movement, S32 original data, 1F/2F +12,+6 screen projection.
# PRESERVE: Current inverse-lookup state, player/monster spawn, Baphomet, stairs, drops, art.
# ADDITIONAL EDITS: Scripts.rxdata cache key and three visible version stamps only.
# NOTE: Without the removed global hook, R94 masks remain stored and callable,
#       but the basic RPG movement function does not consult them automatically.
name: build-slknight-web.yml | V229R137 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R137 Verify exact successful R135 source run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          run_id=40822592556
          expected_sha='cf8630e4aa33e790ce9f4caea62d9a987e169f31'
          url=f'https://api.github.com/repos/gowellsik-hue/Game/actions/runs/{run_id}'
          req=urllib.request.Request(url,headers={
            'Authorization':'Bearer '+os.environ['GH_TOKEN'],
            'Accept':'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=30) as response:
            run=json.load(response)
          assert run['id']==run_id, 'Unexpected source run ID'
          assert run['head_sha']==expected_sha, 'Unexpected source commit'
          assert run['conclusion']=='success', 'Source R135 is not successful'
          assert run['path'].split('@',1)[0].endswith('/build-slknight-web.yml'), 'Wrong workflow'
          print('PASS successful R135 source',run_id)
          PY

      - name: V229R137 Download intact R135 Pages artifact
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40822592556
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V229R137 Extract and fingerprint the R135 game
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          assert len(before)==5566,('Unexpected R135 source file count',len(before))
          assert 'V229R135' in (root/'index.html').read_text('utf8')
          assert 'V229R135' in (root/'knight/index.html').read_text('utf8')
          script='knight/gameasync/Data/Scripts.rxdata'
          assert script in before and 'knight/gameasync/mapping.js' in before
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          data=root/'knight/gameasync/Data'
          for name,sha in {
            'Map045.rxdata':'f47de87af6b4e607bf632818a711619dc8ca4e747196a123a76ac7db8ffc3ba6',
            'Map046.rxdata':'dc89d908f5247442e08dddc11f5bcf6505a77890bd82ab59b790e00e3e5f024c'
          }.items():
            assert before.get(str((data/(prefix+name)).relative_to(root)))==sha,('Map modified',name)
          assert (data/(prefix+'Map029.rxdata')).is_file(), 'Original player entry map missing'
          Path('build/before.json').write_text(json.dumps(before,sort_keys=True),encoding='utf8')
          print('PASS R135 original assets, maps, player/monster events and version')
          PY

      - name: V229R137 Remove the unapproved Game_Map passability override only
        shell: bash
        run: |
          set -euo pipefail
          cat > build/remove_override.rb <<'RUBY'
          require 'zlib'
          require 'digest'
          path=ARGV.fetch(0)
          archive=Marshal.load(File.binread(path))
          original=Marshal.load(File.binread(path))
          raise 'Unexpected script count' unless archive.length==136
          source=Zlib::Inflate.inflate(archive[134][2])
          start_marker="# Any remaining movement query must consult the same native wall-base edges.\n"
          end_marker="# V229R97: 419 corners, 32 bridges, one manual edge; no boot scan.\n"
          raise 'R135 global override missing or duplicated' unless source.scan(start_marker).size==1
          raise 'R94 direction-mask module missing or duplicated' unless source.scan(end_marker).size==1
          first=source.index(start_marker)
          last=source.index(end_marker,first)
          raise 'Unexpected source order' unless first && last && last>first
          override=source[first...last]
          required=['class Game_Map',
                    'alias slti_native66_original_passable passable?',
                    'def passable?(x,y,d,self_event=nil)',
                    'SLTI_Native66.nearest(@map_id,x,y,16)',
                    'SLTI_Native66.native_target(@map_id,cell[0],cell[1],d)']
          raise 'R135 override format changed; refuse to remove unrelated code' unless
            required.all?{|line|override.include?(line)} &&
            override.scan(/^class Game_Map$/).size==1 &&
            override.scan(/^end$/).size==1 &&
            !override.include?('module SLTI_V229R97Corner')
          modified=source[0...first]+source[last..-1]
          raise 'Unapproved source change' unless modified==source.sub(override,'')
          raise 'R135 override remains' if modified.include?('slti_native66_original_passable')
          raise 'New Game_Map passable? override remains' if modified.match?(/^\s*def passable\?\(/)
          raise 'Original S32 code missing' unless modified.include?('module SLTI_Native66')
          raise 'Original +12,+6 projection modified' unless modified.include?(
            "if mid==45 || mid==46\n      px+=12\n      py+=6\n    end")
          raise 'R135 inverse setting changed' if modified.include?('native_u-=12') || modified.include?('native_v-=6')
          raise 'Original respawn missing' unless modified.include?('module SLTI_R111Respawn')
          raise 'Original boss code missing' unless modified.include?('module SLV230BossRespawn')
          raise 'R94 helpers removed' unless ['def self.native_target(mid,x,y,dir)',
                 'def self.edge?(mid,x,y,dx,dy)','def self.move_path?(mid,x,y,dx,dy)',
                 'module SLTI_V229R97Corner'].all?{|v|modified.include?(v)}
          # Check the precise existing 452-mask payload, not a newly computed table.
          base64=source[/data='([A-Za-z0-9+\/=]+)'\.unpack/,1]
          raise 'R94 original mask payload missing' unless base64
          raw=base64.unpack('m')[0]
          raise 'R94 452 direction masks changed' unless raw.bytesize==452*3 &&
            Digest::SHA256.hexdigest(raw)=='9ea6dffb96e7afeee9526b36df2a0719bda5f729a11fde09489be90f893e668a'
          raise 'R94 payload changed during edit' unless modified.include?("data='#{base64}'.unpack")
          masks={}
          raw.bytes.each_slice(3){|x,y,mask|masks[[32576+x,32704+y]]=mask}
          raise 'Unexpected number of R94 mask coordinates' unless masks.size==452
          raise 'Designated opening modified' unless masks[[32655,32806]]==12
          raise 'Existing corner modified' unless masks[[32657,32805]]==3
          # Inspect the original RPG movement implementations; do not replace them.
          map=Zlib::Inflate.inflate(archive[21][2])
          character=Zlib::Inflate.inflate(archive[23][2])
          raise 'RPG map collision missing' unless map.include?('def passable?')
          raise 'RPG character collision missing' unless character.include?('$game_map.passable?')
          archive[134][2]=Zlib::Deflate.deflate(modified)
          archive.each_with_index do |entry,index|
            next if index==134
            raise "Unapproved script change #{index}" unless entry==original[index]
          end
          File.binwrite(path,Marshal.dump(archive))
          File.binwrite('build/script134-r137.rb',modified)
          raise 'R135 mask module changed' unless modified[last-override.length..-1]==source[last..-1]
          puts 'PASS only the R135 Game_Map.passable? override removed'
          puts 'PASS all 452 R94 direction masks, approved opening and helpers preserved byte for byte'
          puts 'PASS RPG movement, S32 data, 1F/2F +12,+6 projection and monster respawn untouched'
          RUBY
          ruby -c build/remove_override.rb
          ruby build/remove_override.rb site/knight/gameasync/Data/Scripts.rxdata
          ruby -c build/script134-r137.rb

      - name: V229R137 Refresh only the script cache and version stamps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          root=Path('site')
          script=root/'knight/gameasync/Data/Scripts.rxdata'
          mapping=root/'knight/gameasync/mapping.js'
          code=mapping.read_text('utf8')
          pattern=r'(Data/Scripts\.rxdata\?h=)[0-9a-f]{32}'
          code,count=re.subn(pattern,lambda m:m.group(1)+hashlib.md5(script.read_bytes()).hexdigest(),code)
          assert count==1,('Unexpected script cache key count',count)
          mapping.write_text(code,encoding='utf8')
          for filename in ('index.html','knight/index.html'):
            path=root/filename
            content=path.read_text('utf8')
            assert 'V229R135' in content and 'V229R137' not in content,('Unexpected version',filename)
            path.write_text(content.replace('V229R135','V229R137').replace('v229r135','v229r137'),encoding='utf8')
          path=root/'knight/js/sl-assets-v229r115.js'
          content=path.read_text('utf8')
          assert content.count("var version='V229R135';")==1, 'Unexpected JS version'
          path.write_text(content.replace("var version='V229R135';","var version='V229R137';"),encoding='utf8')
          assert 'js/sl-assets-v229r115.js?v=v229r137' in (root/'knight/index.html').read_text('utf8')
          before=json.loads(Path('build/before.json').read_text('utf8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert before.keys()==after.keys(), 'Files added or deleted'
          changed={p for p in before if before[p]!=after[p]}
          expected={'index.html','knight/index.html','knight/gameasync/Data/Scripts.rxdata',
                    'knight/gameasync/mapping.js','knight/js/sl-assets-v229r115.js'}
          assert changed==expected,('Unapproved file changes',sorted(changed^expected))
          for name in before:
            if name.startswith('knight/gameasync/Data/') and name not in expected:
              assert before[name]==after[name],('Original map/event data changed',name)
            if name.startswith('knight/gameasync/Graphics/') or name.startswith('knight/assets/'):
              assert before[name]==after[name],('Graphics changed',name)
          print('PASS exactly five files changed: one script, one cache, three version stamps')
          print('PASS no map, spawn, boss, graphics, drops, or other script changes')
          PY
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/dpad.js
          node --check site/knight/js/drive.js

      - name: V229R137 Publish R135 with only the forced movement override removed
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
