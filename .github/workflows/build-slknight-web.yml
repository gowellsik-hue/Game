
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R84
# BASE: verified V229R82 deployed game, before the R83 8-way player/pad change.
# ROLLBACK 1: original Input.dir4 and original 4-button round pad (R82 originals).
# ROLLBACK 2: remove the R82 native projection / nearest override that shifted
# the whole S32 grid screen-left/down by one cell; restore original door alignment.
# KEEP: R82 continuous green-cell movement, no-slide, original S32 data,
# wall depth +32, attack in 4 facings, monsters, events, rewards and all assets.
name: build-slknight-web.yml | V229R84 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R84 Restore deployed R82 original 4-way controls
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40262441759
          name: github-pages
          github-token: ${{ github.token }}
          path: r82

      - name: V229R84 Remove one-cell map shift only
        shell: bash
        run: |
          set -euo pipefail
          test -s r82/artifact.tar
          mkdir -p site build
          tar -xf r82/artifact.tar -C site
          python3 - <<'PY_INPUT'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          assert len(before)==5517,('Wrong R82 file count',len(before))
          archive=root/'knight/gameasync/Data/Scripts.rxdata'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==\
            'c240b3ad3a292831e60b7a4425b8e038a882fc2c629034f8691c64ac8dd01c4a',\
            'Not the verified R82 engine: abort'
          pad=root/'knight/js/dpad.js'
          assert hashlib.sha256(pad.read_bytes()).hexdigest()==\
            'a313791be0ef8eeb5edcf57088cf39b860662a318cdb11c2170c70f846688acb',\
            'Not the original 4-way round pad'
          assert all('V229R82' in (root/p).read_text('utf-8')
                     for p in ('index.html','knight/index.html'))
          Path('build/base-hashes.json').write_text(json.dumps(before,sort_keys=True))
          print('PASS R82 baseline: 5517 files, original 4-way direction pad')
          PY_INPUT

          ruby -rzlib -rdigest - <<'RB_PATCH'
          path='site/knight/gameasync/Data/Scripts.rxdata'
          scripts=Marshal.load(File.binread(path))
          before=Marshal.load(File.binread(path))
          raise 'Wrong script count' unless scripts.size==136
          player=Zlib::Inflate.inflate(scripts[27][2])
          raise 'Not the original four-way player' unless
            Digest::SHA256.hexdigest(player)==
            'a6b344b8b8b6a83c9f77529eb333d16053ceb32483e6336eb082ad8f03e74ced'
          raise 'Player input is not 4-way' unless player.include?('case Input.dir4') &&
            !player.include?('case Input.dir8')
          src=Zlib::Inflate.inflate(scripts[134][2])
          raise 'Wrong R82 native engine' unless Digest::SHA256.hexdigest(src)==
            'bc11e61704567a83c999e657a1af89ae16592cc1e5068b86d1febd9e09a41422'
          header=<<'OLD_HEADER'
          # V229R82: user-directed native continuity patch.
          # 1) remove any one-axis sliding fallback.
          # 2) shift the native cell projection one tile to screen left/down.
          # 3) if nonzero S32 cells are visually continuous, connect them.
          OLD_HEADER
          replacement=<<'NEW_HEADER'
          # V229R84: R82 green-cell continuity and no-slide are retained.
          # Original native projection and nearest-tile mapping are restored.
          NEW_HEADER
          raise 'Wrong patch header' unless src.scan(header).size==1
          changed=src.sub(header,replacement)
          shift=<<'SHIFT_MODULE'
          module SLTI_V229R82Patch
            SHIFT_X=-1
            SHIFT_Y=0
          end

          SHIFT_MODULE
          raise 'Missing original shift module' unless changed.scan(shift).size==1
          changed=changed.sub(shift,'')
          begin_mark="module SLTI_Native66\n  def self.walkable?(mid,x,y)\n"
          anchor=changed.index(begin_mark)
          raise 'R82 extension missing' unless anchor
          start=changed.index("\n  def self.project(mid,x,y)\n",anchor)
          finish=changed.index("\n  def self.continuous_path?(mid,x,y,dx,dy)\n",anchor)
          raise 'Wrong shift override range' unless start && finish && start<finish
          removed=changed[start...finish]
          %w[project real to_rgss nearest].each do |method|
            raise "Missing shifted #{method}" unless
              removed.include?("def self.#{method}(")
          end
          raise 'Unexpected movement code in shift block' if
            removed.include?('def self.move_path?') ||
            removed.include?('def self.native_target(')
          changed=changed[0...start]+changed[finish..-1]
          raise 'Shift references remain' if changed.include?('SLTI_V229R82Patch') ||
            changed.include?('SHIFT_X=-1')
          raise 'Green continuity lost' unless changed.include?('def self.continuous_path?') &&
            changed.include?('return continuous_path?(mid,x,y,dx,dy)')
          raise 'Original wall depth lost' unless changed.include?('wall_depth=wall_y+by1*2+32')
          raise 'Original S32 EDGES lost' unless changed.include?('def self.edge?(mid,x,y,dx,dy)')
          File.binwrite('build/native134.rb',changed)
          scripts[134][2]=Zlib::Deflate.deflate(changed)
          raise 'Other scripts changed' unless scripts.each_index.all?{|i|
            i==134 || scripts[i]==before[i]
          }
          File.binwrite(path,Marshal.dump(scripts))
          verified=Marshal.load(File.binread(path))
          raise 'Patch not persisted' unless
            Zlib::Inflate.inflate(verified[134][2])==changed
          puts 'PASS restored original projection and nearest; retained R82 continuity'
          RB_PATCH
          ruby -c build/native134.rb

          python3 - <<'PY_CACHE'
          from pathlib import Path
          import hashlib,re
          root=Path('site')
          archive=root/'knight/gameasync/Data/Scripts.rxdata'
          mapping=root/'knight/gameasync/mapping.js'
          text=mapping.read_text('utf-8')
          cache=hashlib.md5(archive.read_bytes()).hexdigest()
          text,count=re.subn(r'Data/Scripts\.rxdata\?h=[0-9a-f]{32}',
                             lambda m:'Data/Scripts.rxdata?h='+cache,text)
          assert count==1,('Wrong script cache entry count',count)
          mapping.write_text(text,encoding='utf-8')
          for name in ('index.html','knight/index.html'):
            p=root/name
            old=p.read_text('utf-8')
            assert 'V229R82' in old and 'V229R84' not in old
            p.write_text(old.replace('V229R82','V229R84')
                              .replace('v229r82','v229r84'),encoding='utf-8')
          print('PASS script cache and version labels updated')
          PY_CACHE
          node --check site/knight/js/dpad.js
          node --check site/knight/gameasync/mapping.js

      - name: V229R84 Verify four-way controls and native door coordinates
        shell: bash
        run: |
          set -euo pipefail
          ruby -rzlib - <<'RB_CHECK'
          a=Marshal.load(File.binread('site/knight/gameasync/Data/Scripts.rxdata'))
          src=Zlib::Inflate.inflate(a[134][2])
          player=Zlib::Inflate.inflate(a[27][2])
          raise 'Eight-way movement remains' if player.include?('case Input.dir8')
          raise 'Four-way player missing' unless player.include?('case Input.dir4')
          raise 'Projection still shifted' if src.include?('SLTI_V229R82Patch')
          raise 'Green continuity lost' unless src.include?('def self.continuous_path?')
          raise 'Original native projection lost' unless
            src.include?('px=12*(x+y)-784128') &&
            src.include?('py=6*(y-x)+YOFFSET[mid]')
          raise 'No-slide movement missing' unless
            src.include?('return move_path?(mid,x,y,dx,dy) ? [x+dx,y+dy] : nil')
          puts 'PASS original 4-way player and native map projection; R82 movement retained'
          RB_CHECK
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before=json.loads(Path('build/base-hashes.json').read_text('utf-8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert len(after)==5517 and before.keys()==after.keys()
          changed={p for p in after if before[p]!=after[p]}
          expected={'index.html','knight/index.html',
                    'knight/gameasync/mapping.js',
                    'knight/gameasync/Data/Scripts.rxdata'}
          assert changed==expected,('Unexpected file changes',changed^expected)
          pad=(root/'knight/js/dpad.js').read_text('utf-8')
          assert pad.count('dirButton(dpad,')==4
          assert 'sl-ul' not in pad and 'bindEightWayPad' not in pad
          assert 'function attackButton(parent)' in pad
          assert 'js/dpad.js?v=v229r84' in (root/'knight/index.html').read_text('utf-8')
          print('PASS 5517 game files retained; only 4 authorized files changed')
          PY_FINAL

      - name: V229R84 Publish original 4-way pad and door-aligned coordinates
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
