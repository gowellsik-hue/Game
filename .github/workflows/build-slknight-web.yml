name: Deploy SLKnight V14.2d EQUIP TOUCH FIX
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: slknight-github-pages, cancel-in-progress: true}
env:
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake cmake curl ffmpeg freepats git imagemagick libtool make mm-common patch pkg-config python3 rake ruby timidity unzip wget xz-utils fonts-nanum

      - name: Checkout mkxp-web source
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.MKXP_SRC_REF }}
          path: engine

      - name: Cache mkxp-web dependencies
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-deps-${{ runner.os }}-emsdk-${{ env.EMSDK_VER }}-v2-onig25b

      - name: Patch engine
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def repl(path,old,new,count=1):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n!=count: raise SystemExit(f'{path}: expected {count}, found {n}: {old!r}')
              p.write_text(s.replace(old,new,count))

          repl('engine/src/config.cpp','fixedFramerate = 40;','fixedFramerate = 0;')
          repl('engine/src/config.cpp','defScreenW = 640;','defScreenW = 800;')
          repl('engine/src/config.cpp','defScreenH = 480;','defScreenH = 600;')
          repl('engine/src/config.cpp','frameSkip = true;','frameSkip = false;')
          repl('engine/src/config.cpp','PO_DESC(smoothScaling, bool, true)','PO_DESC(smoothScaling, bool, false)')
          repl('engine/src/graphics.cpp','width = clamp(width, 1, 640);\n\theight = clamp(height, 1, 480);','width = clamp(width, 1, 800);\n\theight = clamp(height, 1, 600);')
          repl('engine/binding-mruby/binding-mruby.cpp','\tif (jsSkipFrame() == 1) return;','\t/* Graphics.frame_rate controls timing. */')
          repl('engine/build.sh','./emsdk install latest','./emsdk install 3.1.37')
          repl('engine/build.sh','./emsdk activate latest','./emsdk activate 3.1.37')

          p=Path('engine/binding-mruby/graphics-binding.cpp'); s=p.read_text()
          marker='''MRB_FUNCTION(graphicsFrameReset)\n{\n\tMRB_FUN_UNUSED_PARAM;\n\n\tshState->graphics().frameReset();\n\n\treturn mrb_nil_value();\n}\n'''
          add=marker+'''\nMRB_FUNCTION(graphicsResizeScreen)\n{\n\tMRB_FUN_UNUSED_PARAM;\n\tmrb_int width, height;\n\tmrb_get_args(mrb, "ii", &width, &height);\n\tGUARD_EXC( shState->graphics().resizeScreen(width, height); )\n\treturn mrb_nil_value();\n}\n'''
          if s.count(marker)!=1: raise SystemExit('graphicsFrameReset mismatch')
          s=s.replace(marker,add,1)
          reg='\tmrb_define_module_function(mrb, module, "frame_reset", graphicsFrameReset, MRB_ARGS_NONE());'
          if s.count(reg)!=1: raise SystemExit('frame_reset registration mismatch')
          s=s.replace(reg,reg+'\n\tmrb_define_module_function(mrb, module, "resize_screen", graphicsResizeScreen, MRB_ARGS_REQ(2));',1)
          p.write_text(s)

          p=Path('engine/extra/build_config.rb'); s=p.read_text()
          gem="    conf.gem :github => 'pulsejet/mruby-marshal'"
          pin="    conf.gem :github => 'mattn/mruby-onig-regexp', :checksum_hash => '25b152264cd4dfac84aa39e5fbb428ec84b95e6a'\n"+gem
          if s.count(gem)!=1: raise SystemExit('mruby-marshal marker mismatch')
          p.write_text(s.replace(gem,pin,1))

          p=Path('engine/src/keybindings.cpp'); s=p.read_text()
          old='{ SDL_SCANCODE_S,      Input::Y     }\n};'
          new='{ SDL_SCANCODE_S,      Input::Y     },\n\t{ SDL_SCANCODE_E,      Input::F5    },\n\t{ SDL_SCANCODE_I,      Input::F6    }\n};'
          if s.count(old)!=1: raise SystemExit('keyboard binding marker mismatch')
          p.write_text(s.replace(old,new,1))
          print('ENGINE_PATCH_OK')
          PY

          grep -Fq 'fixedFramerate = 0;' engine/src/config.cpp
          grep -Fq 'frameSkip = false;' engine/src/config.cpp
          grep -Fq 'defScreenW = 800;' engine/src/config.cpp
          grep -Fq 'defScreenH = 600;' engine/src/config.cpp
          grep -Fq 'resize_screen' engine/binding-mruby/graphics-binding.cpp
          grep -Fq 'SDL_SCANCODE_E,      Input::F5' engine/src/keybindings.cpp
          grep -Fq 'SDL_SCANCODE_I,      Input::F6' engine/src/keybindings.cpp
          grep -Fq 'if (window.saveFile) window.saveFile(UTF8ToString(fullPathC));' engine/src/emscripten.cpp
          test "$(grep -Fc 'Asyncify.handleSleep' engine/src/emscripten.cpp)" -eq 1
          grep -Fq "checksum_hash => '25b152264cd4dfac84aa39e5fbb428ec84b95e6a'" engine/extra/build_config.rb

      - name: Build engine
        run: |
          set -e
          mkdir -p engine/build/gameasync
          rm -rf engine/deps/mruby/build/repos/wasm32-unknown-gnu/mruby-onig-regexp
          cd engine
          bash build.sh
          cd ..
          rm -rf engine/build/gameasync
          test -s engine/build/index.html
          test -s engine/build/mkxp.js
          test -s engine/build/mkxp.wasm

      - name: Install game
        run: |
          set -e
          curl -L --fail --retry 3 -o game.zip "$GAME_URL"
          echo "$GAME_SHA256  game.zip" | sha256sum -c -
          unzip -q game.zip -d src
          rm -rf player
          cp -a engine/build player
          rm -rf player/gameasync player/preload
          mkdir -p player/gameasync/Fonts player/preload
          cp -a src/SLKnight_Android_JoiPlay/. player/gameasync/
          cp engine/extra/rgss.rb player/gameasync/rgss.rb
          cp engine/COPYING player/COPYING-mkxp-web.txt
          cp /usr/share/fonts/truetype/nanum/NanumGothic.ttf player/gameasync/Fonts/NanumGothic.ttf
          cp /usr/share/fonts/truetype/nanum/NanumGothicBold.ttf player/gameasync/Fonts/NanumGothicBold.ttf
          rm -f player/gameasync/Save*.rxdata player/gameasync/README_Android.txt

      - name: Patch game scripts
        run: |
          ruby -EUTF-8:UTF-8 -rzlib - player/gameasync <<'RB'
          game=ARGV[0]
          ini_path=File.join(game,'Game.ini')
          ini=File.binread(ini_path)
          rel=ini[/^Scripts=(.+)$/i,1].to_s.strip.tr('\\','/')
          abort 'Scripts entry missing' if rel.empty?
          source_path=File.join(game,rel)
          scripts=Marshal.load(File.binread(source_path))

          compat=<<'RUBY'
          $joiplay=true
          module Kernel
            def exit(*args); nil; end
          end
          class Win32API
            def initialize(*args); @func=args[1].to_s; end
            def web_input(key)
              case key.to_i
              when 9,90 then Input::A
              when 13,32,67 then Input::C
              when 27,88 then Input::B
              when 69 then Input::F5
              when 73 then Input::F6
              when 68 then Input::Z
              when 81 then Input::L
              when 83 then Input::Y
              when 87 then Input::R
              when 65 then Input::X
              when 16 then Input::SHIFT
              when 17 then Input::CTRL
              when 18 then Input::ALT
              else nil
              end
            end
            def call(*args)
              code=web_input(args[0])
              return(code && Input.trigger?(code) ? 1 : 0) if @func=='GetAsyncKeyState'
              return(code && Input.press?(code) ? -1 : 0) if @func=='GetKeyState'
              0
            end
            def Call(*args); call(*args); end
          end
          Font.default_name='NanumGothic'
          module Audio
            def self.sl_stream(kind,*parts); puts((['SLAUDIO',kind]+parts.collect{|v|v.to_s}).join('|')); end
            def self.bgm_play(filename,volume=100,pitch=100); sl_stream('BGM_PLAY',filename,volume,pitch); end
            def self.bgm_stop; sl_stream('BGM_STOP'); end
            def self.bgm_fade(time); sl_stream('BGM_FADE',time); end
            def self.bgs_play(filename,volume=100,pitch=100); sl_stream('BGS_PLAY',filename,volume,pitch); end
            def self.bgs_stop; sl_stream('BGS_STOP'); end
            def self.bgs_fade(time); sl_stream('BGS_FADE',time); end
          end
          RUBY

          scripts.insert(0,[0,'Web Compatibility',Zlib::Deflate.deflate(compat)])

          def patch_begin_until(src)
            lines=src.lines
            lines.each_index do |i|
              m=lines[i].match(/^(\s*)end\s+until\s+(.+?)\s*$/)
              next unless m
              indent,cond=m[1],m[2]
              j=i-1
              while j>=0
                if lines[j][/^\s*/]==indent && lines[j].strip=='begin'
                  lines[j]=indent+"loop do\n"
                  lines[i]=indent+"  break if #{cond}\n#{indent}end\n"
                  break
                end
                j-=1
              end
            end
            lines.join
          end

          def patch_scene_loop(src)
            lines=src.lines
            i=0
            while i<lines.length
              unless lines[i].strip=='loop do'
                i+=1
                next
              end
              indent=lines[i][/^\s*/]
              sig=[]
              k=i+1
              while k<lines.length && sig.length<8
                x=lines[k].strip
                sig<<[k,x,lines[k][/^\s*/]] unless x.empty?||x.start_with?('#')
                k+=1
              end
              finish=nil
              finish=sig[6][0] if sig.length>=7&&sig[0][1]=='Graphics.update'&&sig[1][1]=='Input.update'&&sig[2][1]=='update'&&sig[3][1]=='if $scene != self'&&sig[4][1]=='break'&&sig[5][1]=='end'&&sig[6][1]=='end'&&sig[6][2]==indent
              finish=sig[4][0] if finish.nil?&&sig.length>=5&&sig[0][1]=='Graphics.update'&&sig[1][1]=='Input.update'&&sig[2][1]=='update'&&sig[3][1]=='break if $scene != self'&&sig[4][1]=='end'&&sig[4][2]==indent
              lines[i..finish]=[indent+"end\n\n"+indent+"def dispose\n"] if finish
              i+=1
            end
            lines.join
          end

          id_sprite=<<'RUBY'
          class Game_Character; attr_accessor :sprite_id; end
          class Sprite_Character
            alias sl_id_original_update update
            def create_id_sprite(text)
              bitmap=Bitmap.new(160,16); bitmap.font.name='NanumGothic'; bitmap.font.size=12; bitmap.font.bold=false
              bitmap.font.color.set(0,0,0); bitmap.draw_text(0,-1,160,16,text,1); bitmap.draw_text(0,1,160,16,text,1); bitmap.draw_text(-1,0,160,16,text,1); bitmap.draw_text(1,0,160,16,text,1)
              bitmap.font.color.set(255,255,255); bitmap.draw_text(0,0,160,16,text,1)
              @_id_sprite=Sprite.new(self.viewport); @_id_sprite.bitmap=bitmap; @_id_sprite.opacity=255; @_id_sprite.ox=80; @_id_sprite.oy=14; @_id_sprite.x=self.x; @_id_sprite.y=self.y-self.oy/2; @_id_sprite.z=9999; @_id_sprite_visible=true
            end
            def dispose_id_sprite; if @_id_sprite!=nil; @_id_sprite.bitmap.dispose if @_id_sprite.bitmap!=nil&&!@_id_sprite.bitmap.disposed?; @_id_sprite.dispose; @_id_sprite=nil; end; @_id_sprite_visible=false; end
            def update_id_sprite; if @character.sprite_id!=nil&&@character.sprite_id.to_s!=''; create_id_sprite(@character.sprite_id) unless @_id_sprite_visible; @_id_sprite.x=self.x; @_id_sprite.y=self.y-self.oy; elsif @_id_sprite_visible; dispose_id_sprite; end; end
            def update; sl_id_original_update; update_id_sprite; end
          end
          RUBY

          id_output=<<'RUBY'
          class Game_Event
            alias sl_id_original_event_refresh refresh
            def refresh; sl_id_original_event_refresh; text=@event.name.dup; text.gsub!(/\[[Ii][Dd](.+?)\]/){@sprite_id=$1}; @sprite_id=nil if @erased||@character_name==''; end
          end
          class Game_Player
            alias sl_id_original_player_refresh refresh
            def refresh; sl_id_original_player_refresh; @sprite_id=nil if $game_party.actors.size>0; end
          end
          RUBY

          browser_loop=<<'RUBY'
          $prev_scene=nil
          $sl_last_scene_name=nil
          def main_update_loop
            begin
              if $scene!=nil
                active_scene=$scene
                name=active_scene.class.to_s
                puts('SLFRAME|'+name) if $sl_last_scene_name!=name
                $sl_last_scene_name=name
                if active_scene!=$prev_scene
                  $prev_scene.dispose if $prev_scene!=nil&&$prev_scene.respond_to?(:dispose)
                  active_scene.main
                  $prev_scene=active_scene
                  return if $scene!=active_scene
                end
                active_scene.web_pre_update if active_scene.respond_to?(:web_pre_update)
                Graphics.update
                skip_input=active_scene.is_a?(Scene_Map)&&$game_switches!=nil&&$game_switches[49]==true
                Input.update unless skip_input
                active_scene.update if $scene==active_scene
              end
            rescue Exception=>e
              puts('SLRUNTIMEERR|'+e.class.to_s+'|'+e.message.to_s)
              e.backtrace[0,16].each{|line|puts('SLRUNTIMEBT|'+line.to_s)} if e.respond_to?(:backtrace)&&e.backtrace
            end
          end
          RUBY

          plane=ids=fonts=0
          font_rules=[
            [/((?:Font\.default_name)\s*=\s*)\[\s*["'][^"']*["']\s*\]/n,'\1"NanumGothic"'],
            [/(Font\.default_name\s*=\s*)["'][^"']*["']/n,'\1"NanumGothic"'],
            [/(\.font\.name\s*=\s*)["'][^"']*["']/n,'\1"NanumGothic"'],
            [/(\bFONT_NAME\s*=\s*)["'][^"']*["']/n,'\1"NanumGothic"']
          ]

          scripts.each_with_index do |entry,index|
            next unless entry.is_a?(Array)&&entry.length>=3
            name=entry[1].to_s
            begin
              text=Zlib::Inflate.inflate(entry[2])
            rescue
              next
            end
            font_rules.each{|rx,rep|fonts+=text.scan(rx).length;text.gsub!(rx,rep)}
            text.gsub!('defined?($joiplay) && $joiplay','$joiplay == true')
            if index==111
              text=id_sprite
              ids+=1
            elsif index==112
              text=id_output
              ids+=1
            elsif text.match?(/^\s*class\s+Plane\s*<\s*Sprite\b/n)
              text="# native Plane used on web\n"
              plane+=1
            end
            text=patch_begin_until(text)
            text=patch_scene_loop(text) unless name=='Main'||name=='Scene_Map'||name=='Scene_Equip'
            if name=='Main'
              text=browser_loop+text unless text.include?('def main_update_loop')
              text.sub!(/\n\s*while\s+\$scene\s*!=\s*nil\s*\r?\n\s*\$scene\.main\s*\r?\n\s*end\s*/m,"\n")
            end
            entry[2]=Zlib::Deflate.deflate(text)
          end

          abort "Plane patch=#{plane}" unless plane==1
          abort "ID patch=#{ids}" unless ids==2
          abort "font patch=#{fonts}" unless fonts>=10

          def entry_for(scripts,name)
            e=scripts.find{|x|x.is_a?(Array)&&x.length>=3&&x[1].to_s==name}
            abort "missing #{name}" unless e
            e
          end
          def inflate(e); Zlib::Inflate.inflate(e[2]).force_encoding(Encoding::UTF_8); end
          def deflate(e,s); e[2]=Zlib::Deflate.deflate(s); end

          resolution=scripts[97]
          rt=inflate(resolution)
          abort 'resolution script mismatch' unless rt.include?('$WINDOW_WIDTH = 800')&&rt.include?('Graphics.resize_screen')
          abort 'resolution defined? remains' if rt.include?('defined?($joiplay)')
          deflate(resolution,rt)

          equip=entry_for(scripts,'Scene_Equip')
          text=inflate(equip)

          n=0
          text=text.sub(/  def main[ \t]*\r?\n/){n+=1;"  def main\n    puts('SLEQUIPBEGIN')\n"}
          abort "Scene_Equip main marker=#{n}" unless n==1

          equip_rx=/\n\s{4}# 메인 루프\r?\n\s{4}loop do\r?\n\s{6}# 게임 화면을 갱신\r?\n\s{6}Graphics\.update\r?\n\s{6}# 입력 정보를 갱신\r?\n\s{6}Input\.update\r?\n\s{6}# 프레임 갱신\r?\n\s{6}update\r?\n\s{6}# 화면이 바뀌면 루프를 중단\r?\n\s{6}if \$scene != self\r?\n\s*\$game_switches\[49\] = true\r?\n\s{8}break\r?\n\s{6}end\r?\n\s{4}end\r?\n\s{4}# 트란지션 준비/
          equip_rep="\n    puts('SLEQUIPREADY')\n    # Web: browser loop drives update.\n  end\n\n  def dispose\n    # 트란지션 준비"
          n=0
          text=text.sub(equip_rx){n+=1;equip_rep}
          abort "Scene_Equip loop patch=#{n}" unless n==1

          close_rx=/\n\s*if Keyboard\.testkey\(69\)\s*\r?\n\s*\$scene = Scene_Map\.new\s*\r?\n\s*end\s*\r?\n/m
          n=text.scan(close_rx).size
          abort "Scene_Equip E-close patch=#{n}" unless n==1
          text.sub!(close_rx,"\n")
          deflate(equip,text)

          save=entry_for(scripts,'Scene_Save')
          text=inflate(save)
          n=0
          text=text.sub(/    write_save_data\(file\)\r?\n    exit/){n+=1;"    write_save_data(file)\n    file.close\n    save_file_async(filename)"}
          abort "Scene_Save persist patch=#{n}" unless n==1
          abort 'Scene_Save menu flow changed' unless text.scan('$scene = Scene_Menu.new(4)').size==2
          abort 'Scene_Save event flow changed' unless text.scan('$scene = Scene_Map.new').size==2
          deflate(save,text)

          menu_fx=scripts.find{|e|e.is_a?(Array)&&e.length>=3&&((inflate(e).include?('XRXS_MP7_Module')) rescue false)}
          abort 'menu lifecycle script missing' unless menu_fx
          text=inflate(menu_fx)
          ds=/  def dispose_spriteset\r?\n.*?    @spriteset\.dispose\r?\n  end/m
          abort 'dispose_spriteset mismatch' unless text.scan(ds).size==1
          text.sub!(ds,"  def dispose_spriteset\n    if @spriteset != nil\n      @spriteset.dispose\n      @spriteset = nil\n    end\n  end")
          wr=/  alias xrxs_mp7_main main\r?\n  def main\r?\n    create_spriteset\r?\n    xrxs_mp7_main\r?\n    dispose_spriteset\r?\n  end/
          abort 'menu wrapper mismatch' unless text.scan(wr).size==8
          text.gsub!(wr,"  alias xrxs_mp7_main main\n  def main\n    create_spriteset\n    xrxs_mp7_main\n  end\n  alias xrxs_mp7_dispose dispose\n  def dispose\n    xrxs_mp7_dispose\n    dispose_spriteset\n  end")
          deflate(menu_fx,text)

          multi=entry_for(scripts,'Multi-slot script : Windows')
          text=inflate(multi)
          old_ms=/ alias g7_ms_scene_equip_main main\r?\n def main\r?\n  @additional_initialize_done = false\r?\n  g7_ms_scene_equip_main\r?\n  for i in 5\.\.\.@item_windows\.size\r?\n   @item_windows\[i\]\.dispose unless @item_windows\[i\]\.nil\?\r?\n  end\r?\n end/
          abort 'multislot lifecycle mismatch' unless text.scan(old_ms).size==1
          text.sub!(old_ms," alias g7_ms_scene_equip_main main\n def main\n  @additional_initialize_done = false\n  g7_ms_scene_equip_main\n end\n alias g7_ms_scene_equip_dispose dispose\n def dispose\n  if @item_windows != nil\n   for i in 5...@item_windows.size\n    @item_windows[i].dispose unless @item_windows[i].nil?\n   end\n  end\n  g7_ms_scene_equip_dispose\n end")
          text.gsub!('if defined? xrxs_additional_refresh','if respond_to?(:xrxs_additional_refresh)')
          deflate(multi,text)

          scene_map=entry_for(scripts,'Scene_Map')
          text=inflate(scene_map).gsub("\r\n","\n")
          main_pos=text.index("  def main\n")
          abort 'Scene_Map main missing' unless main_pos
          loop_comment=text.index("    # 메인 루프\n",main_pos)
          abort 'Scene_Map loop comment missing' unless loop_comment
          loop_line=text.index("    loop do #루프 시작\n",loop_comment)
          abort 'Scene_Map loop start missing' unless loop_line
          pre_start=loop_line+"    loop do #루프 시작\n".length
          graphics_marker=text.index("      # 게임 화면을 갱신\n",pre_start)
          abort 'Scene_Map graphics marker missing' unless graphics_marker
          pre_frame=text[pre_start...graphics_marker]

          tab_block="    if Keyboard.testkey(9) && $game_variables[483]==1\n      $game_switches[1097] = true\n      $scene = Scene_Item2.new\n    end\n"
          abort 'Scene_Map Tab block missing' unless pre_frame.include?(tab_block)
          item_block="\n    if Keyboard.testkey(73) && $game_variables[483]==1\n      $game_switches[1097] = true\n      $scene = Scene_Item.new\n    end\n"
          pre_frame=pre_frame.sub(tab_block,tab_block+item_block)

          loop_end=text.index("    end #루프 끝\n",graphics_marker)
          abort 'Scene_Map loop end missing' unless loop_end
          after_loop=loop_end+"    end #루프 끝\n".length
          update_comment=text.index("  #--------------------------------------------------------------------------\n  # ● 프레임 갱신\n",after_loop)
          abort 'Scene_Map update section missing' unless update_comment
          cleanup=text[after_loop...update_comment]
          abort 'Scene_Map main closing end missing' unless cleanup.end_with?("  end\n")
          cleanup_body=cleanup[0...-"  end\n".length]

          map_rep=+"    # Web: browser loop drives update.\n    $game_map.autoplay\n  end\n\n  def web_pre_update\n"
          map_rep<<pre_frame
          map_rep<<"  end\n\n  def dispose\n"
          map_rep<<cleanup_body
          map_rep<<"  end\n"
          text=text[0...loop_comment]+map_rep+text[update_comment..]
          deflate(scene_map,text)

          mog=scripts.find{|e|e.is_a?(Array)&&e.length>=3&&((inflate(e).include?('alias shud_main main')) rescue false)}
          abort 'MOG HUD missing' unless mog
          text=inflate(mog).gsub("\r\n","\n")
          old_mog=<<'RUBY'
          class Scene_Map  
            alias shud_main main
          #--------------------------------------------------------------------------
          # Main 
          #--------------------------------------------------------------------------
            def main
                @s_viewport = Viewport.new(0, 0, 640, 480)
