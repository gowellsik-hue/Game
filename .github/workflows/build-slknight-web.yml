      - name: Convert media
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          audio_root = Path(
              'player/gameasync/Audio'
          )

          audio_exts = {
              '.mp3',
              '.wav',
              '.wma',
              '.aac',
              '.m4a',
              '.flac',
              '.mid',
              '.midi'
          }

          failures = []
          converted = 0

          sources = [
              p
              for p in audio_root.rglob('*')
              if p.is_file() and
              p.suffix.lower() in audio_exts
          ]

          for src in sources:
              out = src.with_suffix(
                  '.ogg'
              )

              temp = None

              try:
                  inp = src

                  if src.suffix.lower() in {
                      '.mid',
                      '.midi'
                  }:
                      temp = src.with_name(
                          src.name +
                          '.wav'
                      )

                      subprocess.run(
                          [
                              'timidity',
                              str(src),
                              '-Ow',
                              '-o',
                              str(temp)
                          ],
                          check=True
                      )

                      inp = temp

                  subprocess.run(
                      [
                          'ffmpeg',
                          '-nostdin',
                          '-v',
                          'error',
                          '-y',
                          '-i',
                          str(inp),
                          '-c:a',
                          'libvorbis',
                          '-q:a',
                          '4',
                          str(out)
                      ],
                      check=True
                  )

                  if not out.exists() or
                     out.stat().st_size == 0:
                      raise RuntimeError(
                          'empty output'
                      )

                  if temp and temp.exists():
                      temp.unlink()

                  if src != out and src.exists():
                      src.unlink()

                  converted += 1

              except Exception as exc:
                  failures.append(
                      (
                          str(src),
                          str(exc)
                      )
                  )

                  if temp and temp.exists():
                      temp.unlink()

          if failures:
              for path, error in failures:
                  print(
                      path +
                      ' -> ' +
                      error,
                      file=sys.stderr
                  )

              raise SystemExit(1)

          print(
              'AUDIO_CONVERTED=' +
              str(converted)
          )

          graphics_root = Path(
              'player/gameasync/Graphics'
          )

          graphics_sources = [
              p
              for p in graphics_root.rglob('*')
              if p.is_file() and
              p.suffix.lower() in {
                  '.bmp',
                  '.gif',
                  '.webp',
                  '.tif',
                  '.tiff'
              }
          ]

          for src in graphics_sources:
              out = src.with_suffix(
                  '.png'
              )

              subprocess.run(
                  [
                      'convert',
                      str(src) + '[0]',
                      str(out)
                  ],
                  check=True
              )

              if not out.exists() or
                 out.stat().st_size == 0:
                  raise SystemExit(
                      'image conversion failed: ' +
                      str(src)
                  )

              src.unlink()
          PY

