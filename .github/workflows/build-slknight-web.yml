name: Deploy SLKnight CLEAN RECOVERY + SLFairy CLEAN BOOT

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  FEATURE_SHA: 1ac0f212df7b5ec1f0d515f34950242a58b13dbf
  BASELINE_SHA: c6815cd461dba60ec131898e6d5dd8690dd915ae
  X2_SHA: 6d941bd643dda87b8267ba466e108d1904c22331
  Z1_SHA: 008b6abe81074b7af877806b45f2314004a74f66
  Z3_SHA: 5a46988b048764e8a99700998c1f4ab96a3ec5c1
  DUAL_BASE_SHA: 04ce66ec99abc10f77143de53650685db8949532
  FAIRY_BOOT_SHA: f08a32770ac2257c4f3bc0d28bfc167505613fdf
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  FAIRY_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLFairy_Source_v1.zip
  FAIRY_SHA256: 67b88b5fe0cde3c9f2fada889815f9aa7d0fc94b378025529e9950d55151c70e
  FAIRY_7Z_PASSWORD: http://nemo838.tistory.com/
  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout clean feature source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.FEATURE_SHA }}
          path: feature

      - name: Checkout V14.3l baseline
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.BASELINE_SHA }}
          path: baseline

      - name: Checkout native auto source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.X2_SHA }}
          path: x2

      - name: Checkout monster source z1
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z1_SHA }}
          path: z1

      - name: Checkout monster source z3
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z3_SHA }}
          path: z3

      - name: Checkout Fairy source workflow
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.DUAL_BASE_SHA }}
          path: dualbase

      - name: Checkout Fairy boot workflow
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.FAIRY_BOOT_SHA }}
          path: fairyboot

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake cmake curl ffmpeg freepats git imagemagick libtool make mm-common patch pkg-config python3 rake ruby timidity unzip wget xz-utils fonts-nanum p7zip-full nodejs

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.MKXP_SRC_REF }}
          path: engine

      - name: Cache engine dependencies
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-${{ runner.os }}-${{ env.EMSDK_VER }}-clean-recovery

      - name: Extract only selected historical scripts
        run: |
          set -euo pipefail
          ruby -ryaml - <<'RB'
          def steps(path)
            YAML.load_file(path).fetch('jobs').fetch('build').fetch('steps')
          end

          def write_step(list,name,path)
            step=list.find{|x|x['name']==name}
            abort "STEP MISSING: #{name}" unless step&&step['run']
            File.write(path,step['run'])
          end

          feature=steps('feature/.github/workflows/build-slknight-web.yml')
          x2=steps('x2/.github/workflows/build-slknight-web.yml')
          dual=steps('dualbase/.github/workflows/build-slknight-web.yml')
          fairyboot=steps('fairyboot/.github/workflows/build-slknight-web.yml')

          write_step(feature,'Extract frozen run scripts','/tmp/feature_extract.sh')
          write_step(feature,'Remove unsupported Orc alias mappings from z1 patch','/tmp/feature_00.sh')
          write_step(feature,'Add user-verified remaining 5 monster mappings','/tmp/feature_01.sh')
          write_step(feature,'Retarget inherited z3 scripts to z9 counts','/tmp/feature_02.sh')
          write_step(feature,'Patch verified monster attacks including remaining 5','/tmp/feature_monsters.sh')
          write_step(feature,'Patch Gnoll Neruga Drake Kelberos','/tmp/feature_delta.sh')
          write_step(feature,'Patch native Lineage auto attack at full input rate','/tmp/feature_auto.sh')
          write_step(feature,'Preload z9 verified attack and breath assets','/tmp/feature_preload.sh')

          write_step(x2,'Restore ordinary potion logic','/tmp/restore_potion.sh')

          [
            'Download SLFairy source',
            'Prepare SLFairy source and decrypt RGSSAD',
            'Patch SLFairy scripts for web and mobile',
            'Convert SLFairy media',
            'Build SLFairy mappings'
          ].each_with_index do |name,i|
            write_step(dual,name,format('/tmp/fairy_%02d.sh',i))
          end

          write_step(fairyboot,'Patch Fairy boot once','/tmp/fairy_boot_640.sh')
          puts 'SELECTED_HISTORICAL_SCRIPTS_OK'
          RB

          bash -e /tmp/feature_extract.sh

      - name: Prepare monster scripts only
        run: |
          set -euo pipefail
          bash -e /tmp/feature_00.sh
          bash -e /tmp/feature_01.sh
          bash -e /tmp/feature_02.sh
          echo MONSTER_SCRIPT_PREP_OK

      - name: Build clean Knight base
        run: |
          set -euo pipefail
          bash -e /tmp/base_patch_engine.sh
          bash -e /tmp/base_build_engine.sh
          bash -e /tmp/base_install_game.sh

          # Original game CommonEvents.
          # This is used ONLY by the potion restore script.
          ruby - <<'RB'
          game='player/gameasync'
          path=Dir.glob(
            File.join(
              game,
              'Data',
              '*CommonEvents.rxdata'
            )
          ).max_by{|p|File.size(p)}

          abort 'pristine CommonEvents missing' unless
            path&&File.size(path)>1000

          File.binwrite(
            '/tmp/pristine_common_events.rxdata',
            File.binread(path)
          )

          puts 'PRISTINE_COMMON_EVENTS_SAVED'
          RB

          bash -e /tmp/base_patch_game.sh

          # IMPORTANT:
          # V14.3l Patch game legitimately changes some CommonEvents.
          # This snapshot is the correct comparison point for checking
          # whether the later potion restore touches transform owners.
          ruby - <<'RB'
          game='player/gameasync'
          path=Dir.glob(
            File.join(
              game,
              'Data',
              '*CommonEvents.rxdata'
            )
          ).max_by{|p|File.size(p)}

          abort 'post-base CommonEvents missing' unless
            path&&File.size(path)>1000

          File.binwrite(
            '/tmp/post_base_patch_common_events.rxdata',
            File.binread(path)
          )

          puts 'POST_BASE_PATCH_COMMON_EVENTS_SAVED'
          RB

      - name: Restore original potion and transform ownership
        run: |
          set -euo pipefail

          # Restore normal green/courage behavior.
          # Enhanced green is split into its own common event.
          # No stacking, bank or timed-buff state machine is applied.
          bash -e /tmp/restore_potion.sh

          # Compare transform owners against the state immediately
          # BEFORE potion restore, not against the untouched game archive.
          ruby - \
            /tmp/post_base_patch_common_events.rxdata \
            player/gameasync/Data/*CommonEvents.rxdata \
            <<'RB'

          class RawMarshalObject
            def self._load(data)
              o=allocate
              o.instance_variable_set(:@raw,data)
              o
            end
            def _dump(_depth)
              @raw
            end
          end

          class Tone < RawMarshalObject;end
          class Color < RawMarshalObject;end
          class Rect < RawMarshalObject;end
          class Table < RawMarshalObject;end

          module RPG
            class AudioFile;end

            class Animation
              class Frame;end
              class Timing;end
            end

            class Map;end
            class CommonEvent;end

            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end

            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end

          before=Marshal.load(
            File.binread(
              ARGV[0]
            )
          )

          current=Marshal.load(
            File.binread(
              ARGV[1]
            )
          )

          [6,17,34].each do |id|
            abort(
              "POTION RESTORE TOUCHED TRANSFORM CE#{id}"
            ) unless
              Marshal.dump(current[id])==
              Marshal.dump(before[id])
          end

          text=Marshal.dump(
            current
          )

          %w[
            SL_GREEN_BANK
            SL_GREEN_STACK
            SL_BRAVERY_STACK
            SL_TIMED_BUFF_STATE
            SL_TRANSFORM_ATTACK_REDIRECT
          ].each do |marker|

            abort(
              "UNWANTED PATCH REMAINS #{marker}"
            ) if text.include?(
              marker
            )
          end

          puts \
            'POTION_RESTORE_TRANSFORM_OWNERS_OK'
          RB

      - name: Apply monster work only
        run: |
          set -euo pipefail
          bash -e /tmp/feature_monsters.sh
          bash -e /tmp/feature_delta.sh
          echo MONSTER_PATCHES_OK

      - name: Finish Knight media browser and auto attack
        run: |
          set -euo pipefail
          bash -e /tmp/base_convert_media.sh
          bash -e /tmp/base_build_mappings.sh
          bash -e /tmp/base_patch_browser.sh
          bash -e /tmp/feature_auto.sh
          bash -e /tmp/feature_preload.sh

          python3 - <<'PY'
          from pathlib import Path

          p=Path('player/index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace(
              'V14.3z9',
              'V14.3 CLEAN1'
          )

          s=s.replace(
              'v143z9',
              'v143clean1'
          )

          p.write_text(
              s,
              encoding='utf-8'
          )
          PY

      - name: Verify clean Knight boundaries
        run: |
          set -euo pipefail

          test -s player/index.html
          test -s player/mkxp.js
          test -s player/mkxp.wasm
          test -s player/gameasync/Data/Scripts.rxdata
          test -s player/gameasync/mapping.js
          test -s player/gameasync/bitmap-map.js

          grep -Fq \
            'slknight_v14_engine' \
            player/index.html

          grep -Fq \
            'V14.3 CLEAN1' \
            player/index.html

          ! grep -Fq \
            'SL_SAVE_NAMESPACE_MIGRATION' \
            player/js/drive.js

          ! grep -Fq \
            'sltransform-v106g' \
            player/index.html

          ! test -e \
            player/sltransform-v106g.js

          ! test -e \
            player/sltransform-v106g.data

          node --check \
            player/js/drive.js

          node --check \
            player/js/dpad.js

          ruby - player/gameasync/Data/*CommonEvents.rxdata <<'RB'
          class RawMarshalObject
            def self._load(data)
              o=allocate
              o.instance_variable_set(:@raw,data)
              o
            end

            def _dump(_depth)
              @raw
            end
          end

          class Tone < RawMarshalObject;end
          class Color < RawMarshalObject;end
          class Rect < RawMarshalObject;end
          class Table < RawMarshalObject;end

          module RPG
            class AudioFile;end

            class Animation
              class Frame;end
              class Timing;end
            end

            class Map;end
            class CommonEvent;end

            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end

            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end

          def iv(o,n)
            o.instance_variable_get("@#{n}")
          end

          a=Marshal.load(
            File.binread(
              ARGV[0]
            )
          )

          names=
            a.compact.map do |x|
              iv(x,:name).to_s
            end

          abort(
            'isolated enhanced-green CE missing'
          ) unless names.include?(
            'SL Enhanced Green Bravery'
          )

          all=
            a.compact
            .flat_map{|x|iv(x,:list)||[]}
            .flat_map{|c|iv(c,:parameters)||[]}
            .map(&:to_s)
            .join("\n")

          %w[
            SL_GREEN_BANK
            SL_GREEN_STACK
            SL_BRAVERY_STACK
            SL_TIMED_BUFF_STATE
            SL_TRANSFORM_ATTACK_REDIRECT
          ].each do |marker|

            abort(
              "unwanted runtime marker #{marker}"
            ) if all.include?(
              marker
            )
          end

          puts 'KNIGHT_CLEAN_BOUNDARY_OK'
          RB

      - name: Build Fairy from clean Knight shell
        run: |
          set -euo pipefail

          for i in 0 1 2 3 4; do
            bash -e \
              "$(printf '/tmp/fairy_%02d.sh' "$i")"
          done

          bash -e \
            /tmp/fairy_boot_640.sh

          (
            cd fairy_player/gameasync

            bash \
              "$GITHUB_WORKSPACE/engine/extra/make_mapping.sh"
          )

          echo FAIRY_CLEAN_SOURCE_OK

      - name: Finalize Fairy without touching save boot
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path(
              'fairy_player/index.html'
          )

          s=p.read_text(
              encoding='utf-8'
          )

          # Permanent Fairy namespace.
          # No migration wrapper and no extra run dependency.
          s,n=re.subn(
              r"var namespace = '[^']*';",
              "var namespace = 'slfairy_v105_engine';",
              s,
              count=1
          )

          if n!=1:
              raise SystemExit(
                  'Fairy namespace variable replacement failed'
              )

          s,n=re.subn(
              r"var wTitle = '[^']*'",
              "var wTitle = 'SLFairy CLEAN1'",
              s,
              count=1
          )

          if n!=1:
              raise SystemExit(
                  'Fairy title variable replacement failed'
              )

          s=re.sub(
              r'<title>.*?</title>',
              '<title>SLFairy CLEAN1</title>',
              s,
              count=1,
              flags=re.S|re.I
          )

          s=s.replace(
              'v143clean1',
              'v143clean1elf'
          )

          # Fairy must not inherit Knight monster animation preloads.
          pat=re.compile(
              r"\n\s*var slAttackSheets=.*?"
              r"\n\s*slAttackCoords\.forEach"
              r"\(function\(name\)\{.*?"
              r"\n\s*\}\);",
              re.S
          )

          s,n=pat.subn(
              '',
              s,
              count=1
          )

          if n!=1:
              raise SystemExit(
                  f'Knight monster preload removal count={n}'
              )

          # Remove obsolete duplicate browser touch bridge only.
          start="        if (!is_touch_device()) {"
          end="        resize();"

          if start in s:

              if s.count(start)!=1:
                  raise SystemExit(
                      f'legacy touch block count={s.count(start)}'
                  )

              a=s.index(start)

              b=s.index(
                  end,
                  a
              )+len(end)

              s=s[:a]+s[b:]

          s=s.replace(
              'position:fixed;left:8px;top:8px;',
              'position:fixed;left:8px;bottom:8px;'
          )

          # Do not allow the later experimental transform package.
          s=re.sub(
              r'\s*<script[^>]+sltransform-v106g\.js[^>]*></script>\s*',
              '\n',
              s,
              flags=re.I
          )

          p.write_text(
              s,
              encoding='utf-8'
          )

          d=Path(
              'fairy_player/js/dpad.js'
          )

          t=d.read_text(
              encoding='utf-8'
          )

          old=(
              "hotButton(hot,0,'A',65);"
              "hotButton(hot,1,'S',83);"
              "hotButton(hot,2,'D',68);"
              "hotButton(hot,3,'Q',81);"
              "hotButton(hot,4,'Z',90);"
              "hotButton(hot,5,'F',116);"
          )

          new=(
              "hotButton(hot,0,'A',117);"
              "hotButton(hot,1,'S',118);"
              "hotButton(hot,2,'D',119);"
              "hotButton(hot,3,'Q',120);"
              "hotButton(hot,4,'F',116);"
          )

          if old not in t:
              raise SystemExit(
                  'Fairy hotbar source marker missing'
              )

          t=t.replace(
              old,
              new,
              1
          )

          d.write_text(
              t,
              encoding='utf-8'
          )

          print(
              'FAIRY_MINIMAL_FINALIZE_OK'
          )
          PY

          node --check \
            fairy_player/js/drive.js

          node --check \
            fairy_player/js/dpad.js

      - name: Verify Fairy clean boot boundaries
        run: |
          set -euo pipefail

          test -s fairy_player/index.html
          test -s fairy_player/mkxp.js
          test -s fairy_player/mkxp.wasm
          test -s fairy_player/gameasync/Data/Scripts.rxdata
          test -s fairy_player/gameasync/mapping.js
          test -s fairy_player/gameasync/bitmap-map.js

          grep -Fq \
            'slfairy_v105_engine' \
            fairy_player/index.html

          grep -Fq \
            'SLFairy CLEAN1' \
            fairy_player/index.html

          ! grep -Fq \
            'SL_SAVE_NAMESPACE_MIGRATION' \
            fairy_player/js/drive.js

          ! grep -Fq \
            'sltransform-v106g' \
            fairy_player/index.html

          ! test -e \
            fairy_player/sltransform-v106g.js

          ! test -e \
            fairy_player/sltransform-v106g.data

          ! grep -Fq \
            'slAttackSheets' \
            fairy_player/index.html

          ! grep -Fq \
            'slAttackCoords' \
            fairy_player/index.html

          ruby -rzlib - \
            fairy_player/gameasync/Data/Scripts.rxdata \
            <<'RB'

          scripts=Marshal.load(
            File.binread(
              ARGV[0]
            )
          )

          entries=
            scripts.select do |e|
              e.is_a?(Array) &&
                e.length>=3 &&
                e[1].to_s.start_with?(
                  'Web Resolution'
                )
            end

          abort(
            "FAIRY RESOLUTION COUNT=#{entries.size}"
          ) unless entries.size==1

          entry=entries.first

          code=Zlib::Inflate.inflate(
            entry[2]
          )

          abort(
            "FAIRY RESOLUTION NAME=#{entry[1]}"
          ) unless entry[1].to_s==
            'Web Resolution 640x480'

          abort(
            'FAIRY 640 WIDTH MISSING'
          ) unless code.include?(
            '$WINDOW_WIDTH = 640'
          )

          abort(
            'FAIRY 480 HEIGHT MISSING'
          ) unless code.include?(
            '$WINDOW_HEIGHT = 480'
          )

          abort(
            'FAIRY 640x480 RESIZE MISSING'
          ) unless code.include?(
            'Graphics.resize_screen(640,480)'
          )

          puts \
            'FAIRY_640_CLEAN_VERIFY_OK'
          RB

      - name: Build dual site
        run: |
          set -euo pipefail

          rm -rf site

          mkdir -p \
            site/knight \
            site/elf

          cp -a \
            player/. \
            site/knight/

          cp -a \
            fairy_player/. \
            site/elf/

          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="ko">
          <head>
            <meta charset="utf-8">
            <meta
              name="viewport"
              content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
            >
            <meta
              http-equiv="Cache-Control"
              content="no-cache, no-store, must-revalidate"
            >
            <meta
              http-equiv="Pragma"
              content="no-cache"
            >
            <meta
              http-equiv="Expires"
              content="0"
            >
            <title>SLKnight + SLFairy</title>
            <style>
              html,body{
                margin:0;
                width:100%;
                height:100%;
                background:#080808;
                color:#fff;
                font-family:system-ui,sans-serif
              }

              .wrap{
                height:100%;
                display:flex;
                align-items:center;
                justify-content:center;
                flex-direction:column;
                gap:20px
              }

              .choices{
                display:flex;
                gap:16px
              }

              button{
                width:150px;
                height:160px;
                border:1px solid #777;
                border-radius:14px;
                background:#171717;
                color:#fff;
                font-size:25px
              }
            </style>
          </head>

          <body>
            <div class="wrap">
              <h1>캐릭터 선택</h1>

              <div class="choices">
                <button
                  onclick="location.href='knight/?v='+Date.now()"
                >
                  기사
                </button>

                <button
                  onclick="location.href='elf/?v='+Date.now()"
                >
                  요정
                </button>
              </div>
            </div>
          </body>
          </html>
          HTML

          touch \
            site/.nojekyll

          rm -rf \
            player \
            fairy_player

          mv \
            site \
            player

      - name: Final sanity check
        run: |
          set -euo pipefail

          for side in knight elf; do
            test -s player/$side/index.html
            test -s player/$side/mkxp.js
            test -s player/$side/mkxp.wasm
            test -s player/$side/gameasync/Data/Scripts.rxdata
            test -s player/$side/gameasync/mapping.js
            test -s player/$side/js/drive.js
            test -s player/$side/js/dpad.js
          done

          grep -Fq \
            'slknight_v14_engine' \
            player/knight/index.html

          grep -Fq \
            'slfairy_v105_engine' \
            player/elf/index.html

          ! grep -R -Fq \
            'SL_SAVE_NAMESPACE_MIGRATION' \
            player/knight \
            player/elf

          ! grep -R -Fq \
            'sltransform-v106g' \
            player/knight \
            player/elf

          echo \
            CLEAN_RECOVERY_FINAL_OK

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player

  deploy:
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
