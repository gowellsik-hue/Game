
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R69
# ROLLBACK SOURCE: V229R67 successful run 40193996775 (never R68).
# FOUR directional sprite rows and controls; no eight-direction restoration.
# WALL: R67 collision remains, with only the photo-matched rear down edge.
# FLOOR: load all visible original ground PNG chunks; never edit wall texture.
# SPAWN: preserve R67 distribution; use connected safe fallback after a failed pick.
# KEEP: original engine, sprites, monster counts, stats, drops, audio and 5517 files.
name: build-slknight-web.yml | V229R69 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R69 Restore clean R67 success, not failed movement changes in R68
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40193996775
          name: github-pages
          github-token: ${{ github.token }}
          path: r67

      - name: V229R69 Verify 5517 original files and extract scripts
        shell: bash
        run: |
          set -euo pipefail
          test -s r67/artifact.tar
          mkdir -p site build
          tar -xf r67/artifact.tar -C site
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(files)==5517,len(files)
          assert 'V229R67' in (root/'index.html').read_text('utf-8')
          assert 'V229R67' in (root/'knight/index.html').read_text('utf-8')
          assert hashlib.sha256((root/'knight/gameasync/Data/Scripts.rxdata').read_bytes()).hexdigest()=='1812f891953226a49b148103d8b69bb48cb1d9bfdacbd54c02eada40169349c5'
          Path('build/r69-baseline.json').write_text(json.dumps(files,sort_keys=True))
          print('PASS exact successful R67 baseline; 5517 game files')
          PY_BASE
          ruby -rzlib - <<'RB_READ'
          a=Marshal.load(File.binread('site/knight/gameasync/Data/Scripts.rxdata'))
          raise 'Wrong engine script count' unless a.size==136
          {97=>'build/r67-097.rb',134=>'build/r67-134.rb'}.each do |i,path|
            File.binwrite(path,Zlib::Inflate.inflate(a[i][2]))
          end
          old=File.read('build/r67-134.rb',encoding:'UTF-8')
          raise 'Missing R67 wall layer' unless old.include?('def slti_r49_update_walls')
          raise 'Wrong native engine' unless old.include?('module SLTI_Native66') && old.include?('module SLTI_R67')
          raise 'Unexpected old R68 code' if old.include?('other_spot==target')
          raise 'Wrong four-way buttons' unless old.include?('moves={2=>[-1,1],4=>[-1,-1],6=>[1,1],8=>[1,-1]')
          puts 'PASS authentic R67 native engine and wall collision; no R68 collision code'
          RB_READ

      - name: V229R69 Patch only rear downward edge, floor chunk loading and safe spawn fallback
        shell: bash
        run: |
          set -euo pipefail
          cat > build/patch.py <<'PY_PATCH'
          from pathlib import Path
          source=Path('build')
          a=(source/'r67-097.rb').read_text('utf-8')
          b=(source/'r67-134.rb').read_text('utf-8')

          def swap(text,old,new,label):
           n=text.count(old)
           assert n==1,(label,n)
           return text.replace(old,new,1)

          # Render all currently visible floor pieces. Do not change PNG, map coordinates,
          # terrain Z, wall sprites, wall occlusion or tilemap collision.
          a=swap(a,'        next if new_count>=1\n','', 'remove 1-frame floor chunk throttle')
          a=swap(a,'        new_count+=1\n','', 'remove orphaned floor count')
          a=swap(a,'    new_count=0\n','', 'remove orphaned floor state')

          # Original event occupancy is kept completely except for this one verified
          # S32-reachable step behind the wall in the provided screenshot. Even there,
          # only a DIFFERENT native cell occupied by a monster may be ignored; any
          # original scenery, same-cell character or nonmonster blocker stays blocking.
          old='''        return false if other.x==nx && other.y==ny && other.character_name!=''
          '''
          new='''        if other.x==nx && other.y==ny && other.character_name!=''
                    rear_step=(self==$game_player && mid==45 && dir==2 &&
                               @slti_native66_x==32657 && @slti_native66_y==32814 &&
                               target==[32656,32815])
                    if rear_step && SLTI_V229R49.monster?(other) &&
                       other.instance_variable_get(:@slti_native66_map)==mid
                      ox=other.instance_variable_get(:@slti_native66_x)
                      oy=other.instance_variable_get(:@slti_native66_y)
                      next if ox!=nil && oy!=nil && [ox,oy]!=target
                    end
                    return false
                  end
          '''
          b=swap(b,old,new,'rear downward native step only')

          # Keep R67 spawn zone logic; when its normal local candidates are exhausted,
          # take an accessible, distant cell instead of reverting to the entrance.
          old='''    end
              return nil
            end
          end

          class Game_Map
            alias slti_r67_original_setup setup
          '''
          new='''    end
              # Only after the original local-zone search fails, use the safe region.
              candidates=data['bands'].values.flatten(1)
              if candidates.length>0
                offset=rand(candidates.length)
                candidates.length.times do |i|
                  x,y,d,rx,ry=candidates[(offset+i)%candidates.length]
                  next if d<MIN_DEPTH[mid]
                  next unless free?(event,rx,ry)
                  position=SLTI_Native66.nearest(mid,rx,ry,16)
                  next if position==nil || depth(mid,position[0],position[1])<MIN_DEPTH[mid]
                  return [rx,ry]
                end
              end
              return nil
            end
          end

          class Game_Map
            alias slti_r67_original_setup setup
          '''
          b=swap(b,old,new,'safe fallback spawn after local R67 search')
          old='''      return slti_r67_original_moveto(target[0],target[1]) if target!=nil
              end
              slti_r67_original_moveto(x,y)
          '''
          new='''      return slti_r67_original_moveto(target[0],target[1]) if target!=nil
                # No unsafe entrance respawn when source-safe candidates are exhausted.
                return
              end
              slti_r67_original_moveto(x,y)
          '''
          b=swap(b,old,new,'never respawn at unsafe original entrance')

          # Not changing any source wall-bit, wall-layer, diagonal movement, player sprite,
          # any nonmonster collision, wall projection, monster stats or drops.
          assert 'No slide or axis fallback at blocked walls.' in b
          assert 'module SLTI_Native66' in b and 'module SLTI_R67' in b
          assert 'module SLV541' in b
          assert 'return false if other.x==nx && other.y==ny && other.character_name' not in b
          assert 'rear_step=(self==$game_player && mid==45 && dir==2' in b
          (source/'r69-097.rb').write_text(a,'utf-8')
          (source/'r69-134.rb').write_text(b,'utf-8')
          print('PASS: R67 wall renderer, 4-direction buttons and S32 preserved; only local rear-step event occupancy, floor visible load, safe respawn fallback changed')
          PY_PATCH
          python3 build/patch.py
          ruby -c build/r69-097.rb
          ruby -c build/r69-134.rb

      - name: V229R69 Test front wall block, rear down and floor 1-2 safe spawns
        shell: bash
        run: |
          set -euo pipefail
          cat > build/test.rb <<'RB_TEST'
          text=File.read('build/r69-134.rb',encoding:'UTF-8')
          source=text.index('module SLTI_Native66')
          last=text.index("\nclass Game_Character",source)
          raise 'Missing authentic S32 module' if source==nil || last==nil
          eval(text[source...last])
          raise 'Rear edge was not open in reference S32' unless SLTI_Native66.native_target(45,32657,32814,2)==[32656,32815]
          raise 'Wall-front crossing allowed' unless SLTI_Native66.native_target(45,32656,32815,2)==nil
          raise '4-button source mapping modified' unless text.include?('moves={2=>[-1,1],4=>[-1,-1],6=>[1,1],8=>[1,-1]')
          raise 'Wall slide returned' unless text.include?('No slide or axis fallback at blocked walls.')

          module SLTI_V229R49
            def self.monster?(e); !!e.monster; end
          end
          class Game_Character
            attr_accessor :x,:y,:through,:character_name,:monster
            def initialize(mid,nx,ny)
              @slti_native66_map=mid
              @slti_native66_x=nx
              @slti_native66_y=ny
              @x,@y=SLTI_Native66.to_rgss(mid,nx,ny)
              @character_name='test'
              @through=false
              @monster=false
              @steps=0
            end
            def slti_native66_prepare;true;end
            def increase_steps;@steps+=1;end
            def native;[@slti_native66_x,@slti_native66_y];end
          end
          method_start=text.index('  def slti_native66_move(dir,turn=true)',last)
          method_end=text.index('  alias slti_native66_original_down',method_start)
          raise 'Native move not found' if method_start==nil || method_end==nil
          Game_Character.class_eval(text[method_start...method_end])
          class FakeMap
            attr_accessor :events
            def initialize;@events={};end
            def valid?(x,y);x>=0 && x<288 && y>=0 && y<144;end
          end
          $game_map=FakeMap.new

          def player_at(x,y)
            $game_player=Game_Character.new(45,x,y)
          end

          def blocker_at(typ,nx,ny,x=95,y=83)
            o=Game_Character.new(45,nx,ny)
            o.monster=(typ==:monster)
            o.x=x;o.y=y
            $game_map.events={1=>o}
          end

          player_at(32657,32814)
          blocker_at(:monster,32657,32814)
          raise 'Rear step blocked by different native monster cell' unless $game_player.slti_native66_move(2)==true
          raise 'Rear step wrong destination' unless $game_player.native==[32656,32815]
          raise 'Stepped through front wall' unless $game_player.slti_native66_move(2)==false
          puts 'PASS only S32-backed rear downward step; next wall/front step blocked'

          player_at(32657,32814)
          blocker_at(:nonmonster,32657,32814)
          raise 'Wall scenery ignored by collision fix' unless $game_player.slti_native66_move(2)==false
          puts 'PASS scenery / wall event remains solid'

          player_at(32657,32814)
          blocker_at(:monster,32656,32815)
          raise 'Monster in actual native target ignored' unless $game_player.slti_native66_move(2)==false
          puts 'PASS monster in target native cell still blocks'

          player_at(32658,32813)
          blocker_at(:monster,32657,32814,x=95,y=82)
          raise 'Unrelated cell got collision bypass' unless $game_player.slti_native66_move(2)==false
          puts 'PASS no broad monster / wall collision override'

          module_ref=text.index('module SLTI_R67')
          module_end=text.index("\nclass Game_Map\n  alias slti_r67_original_setup",module_ref)
          raise 'Original spawn map module missing' if module_ref==nil || module_end==nil
          eval(text[module_ref...module_end])
          class FakeEvent
            Ref=Struct.new(:name,:x,:y,:id)
            def initialize(mid,rx,ry)
              @map_id=mid
              @event=Ref.new('ordinary monster',rx,ry,99)
              @monster=true
            end
            def monster;true;end
          end
          $game_map=nil
          [[45,101,81,5955],[46,90,90,11665]].each do |mid,rx,ry,expected|
            report=SLTI_R67.prepare(mid)
            raise 'Original passage connectivity changed' unless report['connected']==expected
            ev=FakeEvent.new(mid,rx,ry)
            60.times do
              pos=SLTI_R67.pick(ev)
              raise "Spawn absent or unsafe for #{mid}" if pos==nil
              spot=SLTI_Native66.nearest(mid,pos[0],pos[1],16)
              raise 'Spawn outside connected zone' if spot==nil || SLTI_R67.depth(mid,spot[0],spot[1])<SLTI_R67::MIN_DEPTH[mid]
            end
            puts "PASS floor #{mid}: #{expected} source connected positions and 60 dispersed safe respawns"
          end

          floor=File.read('build/r69-097.rb',encoding:'UTF-8')
          raise 'Floor 1-chunk/frame throttle not removed' if floor.include?('next if new_count>=1')
          raise '2F floor unchanged' unless floor.include?('@slti_floor==46')
          raise 'Floor depth changed' unless floor.include?('sprite.z=-1500')
          raise 'Original R67 wall renderer missing' unless text.include?('def slti_r49_update_walls')
          puts 'PASS all visible floor chunks completed, wall renderer preserved, no wall-offset adjustment'
          RB_TEST
          ruby build/test.rb

      - name: V229R69 Repack engine and strictly compare all original game files
        shell: bash
        run: |
          set -euo pipefail
          ruby -rzlib - <<'RB_PACK'
          path='site/knight/gameasync/Data/Scripts.rxdata'
          a=Marshal.load(File.binread(path))
          original=Marshal.load(File.binread(path))
          raise 'Wrong engine script count' unless a.size==136
          {97=>'build/r69-097.rb',134=>'build/r69-134.rb'}.each do |i,f|
            a[i][2]=Zlib::Deflate.deflate(File.binread(f))
          end
          raise 'Unrelated game script changed' unless a.each_index.all?{|i| i==97 || i==134 || a[i]==original[i]}
          File.binwrite(path,Marshal.dump(a))
          recheck=Marshal.load(File.binread(path))
          raise 'No isolated rear fix' unless Zlib::Inflate.inflate(recheck[134][2]).include?('rear_step=(self==$game_player && mid==45 && dir==2')
          raise 'Floor patch missing' if Zlib::Inflate.inflate(recheck[97][2]).include?('next if new_count>=1')
          puts 'PASS 2/136 compressed game scripts changed; original other 134 kept'
          RB_PACK
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import hashlib,re,json
          root=Path('site'); game=root/'knight/gameasync'; mapping=game/'mapping.js'
          s=mapping.read_text('utf-8')
          digest=hashlib.md5((game/'Data/Scripts.rxdata').read_bytes()).hexdigest()
          s,n=re.subn(r'Data/Scripts\.rxdata\?h=[0-9a-f]{32}',lambda m:'Data/Scripts.rxdata?h='+digest,s)
          assert n==1,n
          mapping.write_text(s,encoding='utf-8')
          for name in ('index.html','knight/index.html'):
            path=root/name;old=path.read_text('utf-8')
            assert 'V229R67' in old
            path.write_text(old.replace('V229R67','V229R69').replace('v229r67','v229r69'),encoding='utf-8')
          original=json.loads(Path('build/r69-baseline.json').read_text('utf-8'))
          current={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(current)==5517 and current.keys()==original.keys()
          changed={k for k in original if original[k]!=current[k]}
          allowed={'index.html','knight/index.html','knight/gameasync/mapping.js','knight/gameasync/Data/Scripts.rxdata'}
          assert changed==allowed,('Unapproved asset or game change',changed^allowed)
          print('PASS all 5517 original files; four allowed files changed; all PNGs, monsters, rewards unchanged')
          PY_FINAL
          node --check site/knight/gameasync/mapping.js

      - name: V229R69 Upload full original game to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
