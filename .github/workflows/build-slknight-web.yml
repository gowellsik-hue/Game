          module SLMobileQuick
            def self.emit_labels
              ids =
                $game_system.sl_quick_items

              ids.each_with_index do |id, i|
                item =
                  if id.to_i > 0 &&
                     $data_items
                    $data_items[id.to_i]
                  else
                    nil
                  end

                name =
                  if item
                    item.name.to_s.gsub(
                      '|',
                      '/'
                    )
                  else
                    '비어있음'
                  end

                puts(
                  'SLQS|' +
                  (i + 1).to_s +
                  '|' +
                  name
                )
              end
            end

            def self.use(slot)
              return if $game_party == nil
              return if $game_system == nil

              ids =
                $game_system.sl_quick_items

              id =
                ids[slot].to_i

              item =
                if id > 0 &&
                   $data_items
                  $data_items[id]
                else
                  nil
                end

              unless item &&
                     item.is_a?(RPG::Item) &&
                     $game_party.item_number(id) > 0

                if $data_system
                  $game_system.se_play(
                    $data_system.buzzer_se
                  )
                end

                return
              end

              if id == 114
                if $game_switches[367] == true &&
                   $game_party.item_number(114) >= 1

                  $game_party.lose_item(
                    114,
                    1
                  )

                  $game_temp.common_event_id = 2

                  if $game_switches[1081] == true &&
                     defined?($p) &&
                     $p

                    $p.drawPHP(
                      $game_party.actors[0].hp,
                      $game_party.actors[0].maxhp,
                      $game_party.actors[0].sp,
                      $game_party.actors[0].maxsp
                    )
                  end

                  if defined?($KeyIcon) &&
                     $KeyIcon

                    $KeyIcon.ShowIcon
                  end

                else
                  $game_system.se_play(
                    $data_system.buzzer_se
                  )
                end

                return
              end

              unless $game_party.item_can_use?(id)
                $game_system.se_play(
                  $data_system.buzzer_se
                )

                return
              end

              used = false

              if item.scope >= 3
                if item.scope == 4 ||
                   item.scope == 6

                  for actor in $game_party.actors
                    used |= actor.item_effect(item)
                  end

                else
                  actor =
                    $game_party.actors[0]

                  used =
                    actor ?
                    actor.item_effect(item) :
                    false
                end

              elsif item.common_event_id > 0
                used = true
              end

              if used
                $game_system.se_play(
                  item.menu_se
                )

                if item.consumable
                  $game_party.lose_item(
                    id,
                    1
                  )
                end

                if item.common_event_id > 0
                  $game_temp.common_event_id =
                    item.common_event_id
                end

                if defined?($KeyIcon) &&
                   $KeyIcon

                  $KeyIcon.ShowIcon
                end

                Guage.show if defined?(Guage)

              else
                $game_system.se_play(
                  $data_system.buzzer_se
                )
              end
            end
