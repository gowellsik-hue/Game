            /tmp/mrbc_knight \
            <<'RB'
          scripts=Marshal.load(
            File.binread(
              ARGV[0]
            )
          )

          out=ARGV[1]

          scripts.each_with_index do |e,i|
            next unless (
              e.is_a?(Array) &&
              e.length>=3
            )

            begin
              code=
                Zlib::Inflate.inflate(
                  e[2]
                )
            rescue Zlib::DataError
              next
            end

            File.binwrite(
              File.join(
                out,
                format(
                  '%04d.rb',
                  i
                )
              ),
              code
            )
          end
          RB

          ruby \
            -rzlib \
            - \
            fairy_player/gameasync/Data/Scripts.rxdata \
            /tmp/mrbc_fairy \
            <<'RB'
          scripts=Marshal.load(
            File.binread(
              ARGV[0]
            )
          )

          out=ARGV[1]

          scripts.each_with_index do |e,i|
            next unless (
              e.is_a?(Array) &&
              e.length>=3
            )

            begin
              code=
                Zlib::Inflate.inflate(
                  e[2]
                )
            rescue Zlib::DataError
              next
            end

            File.binwrite(
              File.join(
                out,
                format(
                  '%04d.rb',
                  i
                )
              ),
              code
            )
          end
          RB

          check_mruby_dir() {
            dir="$1"
            label="$2"
            count=0

            for f in "$dir"/*.rb; do
              count=$((count+1))

              if ! engine/deps/mruby/bin/mrbc \
                -o /tmp/sl-check.mrb \
                "$f" \
                >/tmp/mrbc.out \
                2>/tmp/mrbc.err
              then
                echo \
                  "MRUBY_SYNTAX_FAIL $label $f"

                cat \
                  /tmp/mrbc.out

                cat \
                  /tmp/mrbc.err

                exit 1
              fi
            done

            echo \
              "MRUBY_SYNTAX_OK $label count=$count"
          }

          check_mruby_dir \
            /tmp/mrbc_knight \
            KNIGHT

          check_mruby_dir \
            /tmp/mrbc_fairy \
            FAIRY

