
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V248
# BASE: V247 successful run 41382471524
# FIX: Map025 runtime NoMethodError protection
# FIX: Safe native graphics preload and sprite rendering
# KEEP: Original Map025, Map016, CE179, CE901, Map047
# KEEP: All 28 Sanctuary source GIF frames and 7 motion sheets
# KEEP: HP, attacks, rewards, item probabilities and magic FX
# STATUS: Mobile runtime verification pending

name: build-slknight-web.yml | V248 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: V248 Restore V247 successful deployment
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41382471524
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V248 Verify immutable V247 inventory
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          root=Path("site")
          files={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob("*") if p.is_file()
          }

          assert len(files)==5610, (
              "Wrong V247 inventory",len(files)
          )

          pre=(
              "knight/gameasync/Data/"
              "MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"
          )

          for mid in (16,25,47):
              assert pre+f"Map{mid:03d}.rxdata" in files

          for mid in (45,46):
              assert pre+f"Map{mid:03d}.rxdata" not in files

          assert "knight/assets/map-047-v241.pack" in files

          motions=(
              "Walk","Idle","Attack","AltAttack",
              "Spell","Hit","Death"
          )

          for motion in motions:
              path=(
                  "knight/gameasync/Graphics/"
                  "Characters/SLZenith"+motion+".png"
              )
              assert path in files

          for path in (
              "index.html","knight/index.html"
          ):
              assert "V247" in (
                  root/path
              ).read_text("utf-8")

          Path("build/before.json").write_text(
              json.dumps(files,sort_keys=True)
          )

          print("PASS V247 complete inventory")
          print("PASS existing Map025 and original graphics")
          PY

      - name: V248 Replace Zenith runtime safely
        shell: bash
        run: |
          set -euo pipefail

          cat > build/replace.rb <<'V248_REPLACE'
          require 'zlib'
          require 'digest'

          ROOT='site/knight/gameasync/Data/'
          PATH=ROOT+'Scripts.rxdata'

          scripts=Marshal.load(File.binread(PATH))

          raise 'Invalid original script array' unless
            scripts.is_a?(Array)

          matches=scripts.each_index.select do |i|
            row=scripts[i]
            row.is_a?(Array) &&
              row[1]=='SLZenithV247'
          end

          raise 'Expected one V247 runtime' unless
            matches.size==1

          index=matches.first
          entry=scripts[index]
          source=Zlib::Inflate.inflate(entry[2])

          raise 'Unexpected combat source' unless
            source.include?('PHYSICAL=[50,100]') &&
            source.include?('MAGIC=[150,300]') &&
            source.include?('MAX_HP=5200') &&
            source.include?('MAGIC_FX_IDS=[25,14,15,16]')

          raise 'Unexpected graphics source' unless
            source.include?("'AltAttack'=>14") &&
            source.include?("'Death'=>17")

          original=source.dup

          def replace_once(text,pattern,replacement)
            count=if pattern.is_a?(Regexp)
              text.scan(pattern).length
            else
              text.scan(
                Regexp.new(Regexp.escape(pattern))
              ).length
            end

            raise(
              "Expected exactly one source anchor, got "+
              count.to_s
            ) unless count==1

            text.sub(pattern,replacement)
          end

          preload=<<'RUBY'
            def self.preload
              return unless defined?(RPG::Cache)

              cache=RPG::Cache
              resources=[]

              FRAMES.keys.each do |action|
                resources << [
                  :character,'SLZenith'+action
                ]
              end

              MAGIC_FX_GRAPHICS.each do |name|
                resources << [:animation,name]
              end

              resources.each do |method,name|
                next unless cache.respond_to?(method)

                begin
                  cache.__send__(method,name,0)
                rescue StandardError => e
                  # An optional cache operation must
                  # not terminate Map025 initialization.
                  @last_preload_error=(
                    e.class.to_s+": "+e.message.to_s
                  )
                end
              end

              true
            end
          RUBY

          source=replace_once(
            source,
            /^  def self\.preload\n.*?^  end(?=\n\n  def self\.show_hp)/m,
            preload.lines.map{
              |x| x.sub(/^            /,'')
            }.join.rstrip
          )

          # Preserve the source boss update and all
          # native combat calculations. Guard only
          # movement-state detection in the new event.
          source=replace_once(
            source,
            "name=moving? ? 'SLZenithWalk' : 'SLZenithIdle'",
            "name=(respond_to?(:moving?) && moving?) ? 'SLZenithWalk' : 'SLZenithIdle'"
          )

          sprite=<<'RUBY'
          class Sprite_Character
            alias slz_v248_native_update update

            def update
              # Always run the original renderer first.
              # Do not catch or mask native engine errors.
              slz_v248_native_update

              return unless $game_map &&
                $game_map.map_id==SLZenith::MAP_ID

              return unless @character &&
                @character.is_a?(Game_Event)

              return unless
                @character.instance_variable_get(:@id)==
                SLZenith::EVENT_ID

              # Only the Zenith custom rendering below
              # is optional. Other sprites are untouched.
              begin
                return unless @tile_id.to_i==0
                return unless
                  @character.respond_to?(:character_name)

                name=@character.character_name.to_s
                return unless name.start_with?('SLZenith')

                action=name.sub('SLZenith','')
                total=SLZenith::FRAMES[action]
                return unless total && total>0

                bmp=respond_to?(:bitmap) ?
                  bitmap : @bitmap

                return unless bmp &&
                  bmp.respond_to?(:width) &&
                  bmp.respond_to?(:height)

                return unless
                  bmp.width.to_i>0 &&
                  bmp.height.to_i>0

                return unless
                  bmp.width%total==0 &&
                  bmp.height%4==0

                return unless
                  @character.respond_to?(:direction) &&
                  @character.respond_to?(:slz_frame)

                direction=@character.direction.to_i
                return unless [2,4,6,8].include?(direction)

                rect=respond_to?(:src_rect) ?
                  src_rect : @src_rect

                return unless rect &&
                  rect.respond_to?(:set)

                @cw=bmp.width/total
                @ch=bmp.height/4

                row=(direction-2)/2
                frame=@character.slz_frame(total)

                return unless frame.is_a?(Integer)
                return unless frame.between?(0,total-1)

                rect.set(
                  frame*@cw,row*@ch,@cw,@ch
                )

                if respond_to?(:ox=)
                  self.ox=@cw/2
                else
                  @ox=@cw/2
                end

                if respond_to?(:oy=)
                  self.oy=@ch
                else
                  @oy=@ch
                end

                if respond_to?(:z=) &&
                   @character.respond_to?(:screen_z)
                  self.z=@character.screen_z(@ch)
                end

              rescue StandardError => e
                # Preserve the native-rendered sprite.
                # A custom animation failure must not
                # interrupt the entire game loop.
                SLZenith.instance_variable_set(
                  :@last_sprite_error,
                  e.class.to_s+": "+e.message.to_s
                )
              end
            end
          end
          RUBY

          source=replace_once(
            source,
            /^class Sprite_Character\n.*?^end(?=\n\nclass Game_Map)/m,
            sprite.lines.map{
              |x| x.sub(/^          /,'')
            }.join.rstrip
          )

          setup=<<'RUBY'
          class Game_Map
            alias slz_v248_native_setup setup

            def setup(map_id)
              SLZenith.reset(map_id)

              # Preserve the original setup return.
              result=slz_v248_native_setup(map_id)

              # Optional preload after native setup.
              # Cache incompatibility cannot stop entry.
              if map_id==SLZenith::MAP_ID
                SLZenith.preload
              end

              result
            end
          end
          RUBY

          source=replace_once(
            source,
            /^class Game_Map\n.*?^end\s*\z/m,
            setup.lines.map{
              |x| x.sub(/^          /,'')
            }.join.rstrip+"\n"
          )

          source=source.sub(
            'SLZenith V247:',
            'SLZenith V248:'
          )

          raise 'Old sprite alias remains' if
            source.include?('slz_v247_native_update')

          raise 'Old map alias remains' if
            source.include?('slz_v247_native_setup')

          raise 'Original combat changed' unless
            source.include?('PHYSICAL=[50,100]') &&
            source.include?('MAGIC=[150,300]') &&
            source.include?('ATTACK_WAIT=20') &&
            source.include?('EXP=43212') &&
            source.include?('ADENA=[64800,151200]')

          raise 'Original drops modified' unless
            source[/DROPS=\[\n.*?\n  \]/m] ==
            original[/DROPS=\[\n.*?\n  \]/m]

          File.write(
            'build/zenith-runtime.rb',source
          )

          entry[0]=99824801
          entry[1]='SLZenithV248'
          entry[2]=Zlib::Deflate.deflate(source,9)

          File.binwrite(
            PATH,Marshal.dump(scripts)
          )

          check=Marshal.load(File.binread(PATH))
          raise 'Runtime serialization failed' unless
            check[index][1]=='SLZenithV248' &&
            Zlib::Inflate.inflate(check[index][2])==
            source

          puts 'PASS V247 runtime replaced, not appended'
          puts 'PASS original combat and rewards retained'
          puts 'PASS preload and sprite safeguards installed'
          V248_REPLACE

          ruby -c build/replace.rb
          ruby build/replace.rb
          ruby -c build/zenith-runtime.rb

      - name: V248 Test safe Map025 initialization
        shell: bash
        run: |
          set -euo pipefail

          cat > build/test-runtime.rb <<'V248_TEST'
          class Game_Event
            attr_accessor :character_name,:direction
            def update;end
            def moving?;false;end
          end

          class Sprite_Character
            attr_accessor :src_rect,:ox,:oy,:z
            def update;end
          end

          class Game_Map
            attr_accessor :map_id,:events
            def setup(id)
              @map_id=id
              :native_setup_result
            end
          end

          $game_map=Game_Map.new
          $game_variables=Hash.new(0)
          $game_switches=Hash.new(false)
          $game_map.events={}

          load 'build/zenith-runtime.rb'

          # Case 1: no cache implementation.
          result=$game_map.setup(25)
          raise 'Native setup result lost' unless
            result==:native_setup_result

          # Case 2: partial cache implementation
          # with an unsupported character call.
          module RPG
            module Cache
              def self.character(name,hue=0)
                raise NoMethodError,
                  'unsupported character preload'
              end
            end
          end

          result=$game_map.setup(25)

          raise 'Partial cache broke map' unless
            result==:native_setup_result

          # Case 3: native sprite has no bitmap.
          boss=Game_Event.new
          boss.character_name='SLZenithIdle'
          boss.direction=2
          boss.instance_variable_set(:@id,29)
          boss.instance_variable_set(:@map_id,25)
          $game_map.events[29]=boss

          sprite=Sprite_Character.new
          sprite.instance_variable_set(:@character,boss)
          sprite.instance_variable_set(:@tile_id,0)
          sprite.update

          # Case 4: renderer has a bitmap but
          # does not expose the source rectangle.
          bmp=Struct.new(:width,:height).new(
            11*144,4*120
          )
          sprite.instance_variable_set(:@bitmap,bmp)
          sprite.update

          raise 'Combat values changed' unless
            SLZenith::PHYSICAL==[50,100] &&
            SLZenith::MAGIC==[150,300] &&
            SLZenith::MAX_HP==5200

          raise 'Drop count changed' unless
            SLZenith::DROPS.length==20

          raise 'Ring missing' unless
            SLZenith::DROPS.include?(
              [:armor,492,3]
            )

          puts 'PASS missing-cache map setup'
          puts 'PASS partial-cache map setup'
          puts 'PASS missing-bitmap sprite update'
          puts 'PASS no-source-rectangle sprite update'
          puts 'PASS combat and drops retained'
          V248_TEST

          ruby -c build/test-runtime.rb
          ruby build/test-runtime.rb

      - name: V248 Refresh scripts hash and version
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib,re
          from pathlib import Path

          root=Path('site')
          data=root/'knight/gameasync/Data'
          script=data/'Scripts.rxdata'
          mapping=root/'knight/gameasync/mapping.js'

          content=mapping.read_text('utf-8')
          digest=hashlib.md5(
              script.read_bytes()
          ).hexdigest()

          pattern=(
              r'(Data/Scripts\.rxdata\?h=)'
              r'[0-9a-f]{32}'
          )

          content,count=re.subn(
              pattern,
              lambda m:m.group(1)+digest,
              content
          )

          assert count==1, (
              'Script hash mapping mismatch',count
          )

          mapping.write_text(content,'utf-8')

          loader=root/'knight/js/sl-assets-v229r115.js'
          text=loader.read_text('utf-8')

          old="var version='V247';"
          assert text.count(old)==1

          loader.write_text(
              text.replace(
                  old,"var version='V248';"
              ),
              'utf-8'
          )

          for relative in (
              'index.html','knight/index.html'
          ):
              path=root/relative
              text=path.read_text('utf-8')

              assert 'V247' in text

              text=text.replace('V247','V248')
              text=text.replace(
                  '?v=v247','?v=v248'
              )

              path.write_text(text,'utf-8')

          print('PASS updated native Scripts hash')
          print('PASS V248 cache-busting labels')
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: V248 Verify no unrelated game changes
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          root=Path('site')

          before=json.loads(
              Path('build/before.json').read_text()
          )

          after={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          allowed={
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html',
              'knight/index.html'
          }

          changed={
              name for name in before
              if before[name]!=after.get(name)
          }

          assert changed==allowed, (
              'Unexpected changed files',
              sorted(changed^allowed)
          )

          assert not(set(before)-set(after))
          assert not(set(after)-set(before))
          assert len(after)==5610

          pre=(
              'knight/gameasync/Data/'
              'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          )

          protected=[
              pre+'Map016.rxdata',
              pre+'Map025.rxdata',
              pre+'Map047.rxdata',
              pre+'CommonEvents.rxdata',
              'knight/assets/map-047-v241.pack'
          ]

          for path in protected:
              assert before[path]==after[path],(
                  'Protected game data changed',path
              )

          for motion in (
              'Walk','Idle','Attack','AltAttack',
              'Spell','Hit','Death'
          ):
              path=(
                  'knight/gameasync/Graphics/'
                  'Characters/SLZenith'+motion+'.png'
              )
              assert before[path]==after[path]

          for name in (
              '이펙트마법',
              '물의 대정령 마법',
              '불의 대정령 마법',
              '땅의 대정령 마법'
          ):
              path=(
                  'knight/gameasync/Graphics/'
                  'Animations/'+name+'.png'
              )
              assert before[path]==after[path]

          print('PASS no maps, NPCs or original events changed')
          print('PASS CE179 and CE901 unchanged')
          print('PASS all 7 original motion sheets unchanged')
          print('PASS original four magic effects unchanged')
          print('PASS total inventory remains 5610')
          PY

      - name: V248 Publish game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
