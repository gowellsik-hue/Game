
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R34
# PURPOSE: Repair original Sanctuary floor portal at its projected footprint.
# BASE: Successfully deployed V229R33, run 39355565405.
# The actual original to2 portal projects to (202,76) in R33 coordinates.
# That exact cell is blocked by R21/R32's collision raster; use its closest
# WALKABLE neighbor (201,76) and a connected stair-approach footprint.
# Preserve R33 graphics, terrain, collision, scripts, movement and combat.
name: build-slknight-web.yml | V229R34 | Clean Native Events and 2x Terrain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R34 Restore exact deployed R33 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39355565405
          name: github-pages
          github-token: ${{ github.token }}
          path: r33

      - name: V229R34 Verify deployed R33 data before touching anything
        shell: bash
        run: |
          set -euo pipefail
          test -s r33/artifact.tar
          mkdir -p site build
          tar -xf r33/artifact.tar -C site
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          g=root/'knight/gameasync/Data'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          data={
            'Scripts.rxdata':'f249b698ae6d1c72535ae2b12559e8bb10494657febc67ba0b23195944f4f7d0',
            pre+'Map045.rxdata':'01782f0ca94554041ed1033728a7606f575511ea239cad2b14601b1a533b98ab',
            pre+'Map046.rxdata':'60f425245c9f2247df597db601d53c04bc332085e9418de20d709a89edeb530f',
          }
          for name,digest in data.items():
            assert hashlib.sha256((g/name).read_bytes()).hexdigest()==digest,name
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert len(files)==5472,len(files)
          for file in ('index.html','knight/index.html'):
            assert 'V229R33' in (root/file).read_text(encoding='utf-8')
          (Path('build')/'r33-file-hashes.json').write_text(json.dumps(files,sort_keys=True))
          print('PASS original deployed R33 5,472 files and both exact dungeon maps')
          PY_BASE

      - name: V229R34 Align portal events to original source and reachable RGSS terrain
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r34_portals.rb <<'RUBY_PORTALS'
          require 'json'
          require 'digest'
          module RPG
            class Map;end;class MapInfo;end;class AudioFile;end;class Tileset;end
            class Event
              class Page
                class Condition;end;class Graphic;end
              end
            end
            class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          class Table
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(depth=0);@raw;end
            def [](x,y=0,z=0)
              _,w,h,l,_=@raw.unpack('V5')
              return nil if x<0||y<0||z<0||x>=w||y>=h||z>=l
              @raw.byteslice(20+2*(x+y*w+z*w*h),2).unpack1('v')
            end
          end
          class Tone
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(depth=0);@raw;end
          end
          class Color<Tone;end
          def get(obj,name);obj.instance_variable_get('@'+name);end
          def put(obj,name,value);obj.instance_variable_set('@'+name,value);end
          base='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          path=->(n){base+('%sMap%03d.rxdata'%[pre,n])}
          sets=Marshal.load(File.binread(base+pre+'Tilesets.rxdata'))
          script_sha=Digest::SHA256.file(base+'Scripts.rxdata').hexdigest
          all_others=(1..44).to_h{|i|[i,Digest::SHA256.file(path.call(i)).hexdigest]}
          configs=[
            {id:45,stair_id:1,old_count:21,clone_count:7,
             portal:[202,76],anchor:[201,76],radius:4,
             entry:[96,74],reverse_arrival:[198,74],dest:[46,82,94],
             expect_contacts:23},
            {id:46,stair_id:2,old_count:15,clone_count:3,
             portal:[82,94],anchor:[81,94],radius:3,
             entry:[82,94],reverse_arrival:[82,94],dest:[45,198,74],
             expect_contacts:18},
          ]
          report={}
          configs.each do |cfg|
            mid=cfg.fetch(:id)
            map=Marshal.load(File.binread(path.call(mid)))
            events=get(map,'events')
            raise 'Original R33 event count changed' unless events.size==cfg.fetch(:old_count)
            w=get(map,'width');h=get(map,'height')
            expected=mid==45 ? [288,144] : [336,168]
            raise 'Unexpected map dimension' unless [w,h]==expected
            set=sets.fetch(get(map,'tileset_id'))
            flags=get(set,'passages')
            tiles=get(map,'data')
            walk=lambda do |x,y|
              x>=0 && y>=0 && x<w && y<h &&
                (flags[tiles[x,y,0]]&15)==0
            end
            anchor=cfg.fetch(:anchor)
            raise 'Chosen anchor is blocked' unless walk.call(*anchor)
            if mid==45
              raise 'Original to2 portal unexpectedly walkable; revisit geometry' if walk.call(*cfg.fetch(:portal))
              raise 'Nearest valid to2 neighbor changed' unless
                (anchor[0]-cfg[:portal][0]).abs+(anchor[1]-cfg[:portal][1]).abs==1
            else
              raise 'Original to1 portal blocked' unless walk.call(*cfg.fetch(:portal))
            end
            # R33 added 901+ synthetic contacts at the wrong R21-derived position.
            old_clones=events.keys.select{|eid|eid>=901 &&
              get(events[eid],'name').to_s.start_with?("SLTI_FloorTransfer_#{mid}_")}
            raise "Unexpected R33 contact count #{mid}" unless old_clones.size==cfg.fetch(:clone_count)
            old_clones.each{|eid|events.delete(eid)}
            native_count=cfg.fetch(:old_count)-old_clones.size
            stair=events.fetch(cfg.fetch(:stair_id))
            raise 'Original stair transfer page absent' unless get(stair,'pages').size==1
            page=get(stair,'pages').first
            raise 'R33 must use invisible player-touch event' unless
              get(page,'trigger')==1 && get(page,'through')==true &&
              get(get(page,'graphic'),'character_name').to_s.empty?
            cmd=get(page,'list')
            raise 'Native transfer command changed' unless
              cmd.map{|c|get(c,'code')}==[121,201,0] &&
              get(cmd[0],'parameters')==[997,997,0] &&
              get(cmd[1],'parameters')[0,4]==[0]+cfg.fetch(:dest)
            # BFS directly on the ACTUAL R33 RGSS passage flags.
            # This covers the approach corridor rather than a guessed rectangle.
            queue=[[anchor[0],anchor[1],0]]
            seen={anchor=>true}
            cells=[];i=0
            while i<queue.size
              x,y,d=queue[i];i+=1
              cells<<[x,y]
              next if d>=cfg.fetch(:radius)
              [[x-1,y],[x+1,y],[x,y-1],[x,y+1]].each do |xx,yy|
                point=[xx,yy]
                next if seen[point] || !walk.call(xx,yy)
                seen[point]=true
                queue<<[xx,yy,d+1]
              end
            end
            cells.reject!{|point|point==cfg.fetch(:reverse_arrival)}
            cells.sort!
            raise 'Unexpected walkable approach footprint' unless cells.size==cfg.fetch(:expect_contacts)
            raise 'Anchor absent from contact region' unless cells.include?(anchor)
            other_positions=events.reject{|eid,e|eid==cfg.fetch(:stair_id)}.transform_values{|e|[get(e,'x'),get(e,'y')]}
            intersection=cells & other_positions.values
            raise "Contact overlaps original NPC/monster #{intersection}" unless intersection.empty?
            # Retain the original R33 event, moving it to the correct approach anchor.
            put(stair,'x',anchor[0]);put(stair,'y',anchor[1])
            added=[]
            (cells-[anchor]).each do |point|
              copy=Marshal.load(Marshal.dump(stair))
              eid=901+added.length
              raise 'Unexpected event ID collision' if events.key?(eid)
              put(copy,'id',eid)
              put(copy,'name',"SLTI_FloorTransfer_#{mid}_#{eid}")
              put(copy,'x',point[0]);put(copy,'y',point[1])
              events[eid]=copy
              added<<eid
            end
            raise 'Other native dungeon events lost' unless events.size==native_count+cells.size-1
            raise 'Reverse landing overlaps contact area' if cells.include?(cfg.fetch(:reverse_arrival))
            raise 'Original script changed' unless Digest::SHA256.file(base+'Scripts.rxdata').hexdigest==script_sha
            File.binwrite(path.call(mid),Marshal.dump(map))
            report[mid.to_s]={
              sourcePortal:cfg.fetch(:portal),correctedAnchor:anchor,
              blockedSourceCell:!walk.call(*cfg.fetch(:portal)),
              arrival:cfg.fetch(:entry),landingReserved:cfg.fetch(:reverse_arrival),
              destination:cfg.fetch(:dest),originalEventId:cfg.fetch(:stair_id),
              sourceNativeEventCount:native_count,contactCount:cells.size,
              contactCoordinates:cells,contactIds:[cfg.fetch(:stair_id)]+added,
              engineAndCollisionUnchanged:true
            }
            puts "Map#{mid}: original portal #{cfg[:portal]}, entry contact #{anchor}, #{cells.size} reachable contacts"
          end
          (1..44).each do |id|
            raise "Unrelated Map#{id} modified" unless Digest::SHA256.file(path.call(id)).hexdigest==all_others[id]
          end
          File.write('build/r34-portals.json',JSON.pretty_generate(report))
          puts 'PASS original native monsters, maps 1..44 and engine untouched'
          RUBY_PORTALS
          ruby -c /tmp/r34_portals.rb
          ruby /tmp/r34_portals.rb

      - name: V229R34 Register only the two changed map hashes and update version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_INDEX'
          from pathlib import Path
          import hashlib,re
          root=Path('site');game=root/'knight/gameasync'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          p=game/'mapping.js';data=p.read_text(encoding='utf-8')
          for mid in (45,46):
            rel=f'Data/{pre}Map{mid:03}.rxdata'
            digest=hashlib.md5((game/rel).read_bytes()).hexdigest()
            data,n=re.subn(re.escape(rel+'?h=')+r'[0-9a-f]{32}',
                            lambda m:rel+'?h='+digest,data)
            assert n==1,(rel,n)
          p.write_text(data,encoding='utf-8')
          for name in ('index.html','knight/index.html'):
            p=root/name;s=p.read_text(encoding='utf-8')
            assert 'V229R33' in s
            p.write_text(s.replace('V229R33','V229R34').replace('v229r33','v229r34'),encoding='utf-8')
          print('PASS R33 loader unchanged; only new map hashes and visible version updated')
          PY_INDEX
          node --check site/knight/gameasync/mapping.js

      - name: V229R34 Test native walk, contact events and actual transfer interpreter
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r34_verify.rb <<'RUBY_VERIFY'
          require 'json';require 'zlib';require 'digest'
          module RPG
            class Map;end;class MapInfo;end;class AudioFile;end;class Tileset;end
            class Event;class Page;class Condition;end;class Graphic;end;end;end
            class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          class Table
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(depth=0);@raw;end
            def [](x,y=0,z=0)
              _,w,h,depth,_=@raw.unpack('V5')
              return nil if x<0||x>=w||y<0||y>=h||z<0||z>=depth
              @raw.byteslice(20+2*(x+y*w+z*w*h),2).unpack1('v')
            end
          end
          class Tone;def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end;def _dump(d=0);@raw;end;end
          class Color<Tone;end
          def v(o,n);o.instance_variable_get('@'+n);end
          base='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          scripts=Marshal.load(File.binread(base+'Scripts.rxdata'))
          sets=Marshal.load(File.binread(base+pre+'Tilesets.rxdata'))
          report=JSON.parse(File.read('build/r34-portals.json'))
          # Load native game map passability.
          eval(Zlib::Inflate.inflate(scripts[21][2]),TOPLEVEL_BINDING,'Original_Game_Map')
          class RPG::Map;attr_reader :width,:height,:data;end
          # Load actual native player-touch event handling and transfer command.
          class Game_Character
            attr_accessor :x,:y,:tile_id,:through
            def jumping?;false;end
          end
          eval(Zlib::Inflate.inflate(scripts[26][2]),TOPLEVEL_BINDING,'Original_Game_Event')
          eval(Zlib::Inflate.inflate(scripts[27][2]),TOPLEVEL_BINDING,'Original_Game_Player')
          class Interpreter;end
          eval(Zlib::Inflate.inflate(scripts[73][2]),TOPLEVEL_BINDING,'Original_Interpreter_Transfer')
          class NullInterpreter;def running?;false;end;end
          $game_system=Struct.new(:map_interpreter).new(NullInterpreter.new)
          Temp=Struct.new(:in_battle,:player_transferring,:message_window_showing,
            :transition_processing,:player_new_map_id,:player_new_x,
            :player_new_y,:player_new_direction)
          $game_temp=Temp.new(false,false,false,false,nil,nil,nil,nil)
          report.each do |mid,info|
            map=Marshal.load(File.binread(base+('%sMap%03d.rxdata'%[pre,mid.to_i])))
            events=v(map,'events')
            ids=info.fetch('contactIds')
            coords=info.fetch('contactCoordinates')
            raise 'Mismatch contact count' unless ids.size==coords.size
            actual=ids.map{|i|e=events.fetch(i);[v(e,'x'),v(e,'y')]}.sort
            raise 'Mismatch coordinates' unless actual==coords.sort
            tileset=sets.fetch(v(map,'tileset_id'))
            native=Game_Map.allocate
            native.instance_variable_set(:@map,map)
            native.instance_variable_set(:@passages,v(tileset,'passages'))
            native.instance_variable_set(:@priorities,v(tileset,'priorities'))
            native.instance_variable_set(:@events,{})
            coords.each do |x,y|
              [0,2,4,6,8].each{|dir|raise "Blocked event #{mid}/#{x}/#{y}" unless native.passable?(x,y,dir)}
            end
            # Original and new contacts must have no conditional pages or hidden gates.
            ids.each do |eid|
              raw=events.fetch(eid);page=v(raw,'pages').first
              raise 'Wrong trigger' unless v(page,'trigger')==1 && v(page,'through')
              condition=v(page,'condition')
              raise 'Unexpected page condition' if
                %w[switch1_valid switch2_valid variable_valid self_switch_valid].any?{|k|v(condition,k)}
              commands=v(page,'list')
              raise 'Stair command altered' unless commands.map{|c|v(c,'code')}==[121,201,0]
              raise 'Wrong destination' unless v(commands[1],'parameters')[0,4]==[0]+info['destination']
            end
            # Simulate an actual Game_Player arriving on the nearest walkable stair cell.
            marker=ids.map{|eid|events.fetch(eid)}.find{|e|[v(e,'x'),v(e,'y')]==info.fetch('correctedAnchor')}
            raise 'Missing anchored stair contact' unless marker
            event=Game_Event.allocate
            event.instance_variable_set(:@x,v(marker,'x'))
            event.instance_variable_set(:@y,v(marker,'y'))
            event.instance_variable_set(:@trigger,1)
            event.instance_variable_set(:@through,true)
            event.tile_id=0
            event.through=true
            event.instance_variable_set(:@character_name,'')
            event.instance_variable_set(:@list,v(v(marker,'pages').first,'list'))
            event.instance_variable_set(:@starting,false)
            native.instance_variable_set(:@events,{v(marker,'id')=>event})
            $game_map=native
            player=Game_Player.allocate
            player.x,player.y=info.fetch('correctedAnchor')
            raise 'Actual player-touch code did not start stair event' unless player.check_event_trigger_here([1,2]) && event.starting
            # Execute original interpreter's location-transfer handler.
            interp=Interpreter.allocate
            interp.instance_variable_set(:@parameters,v(v(marker,'pages').first,'list')[1].instance_variable_get('@parameters'))
            interp.instance_variable_set(:@index,0)
            $game_temp.player_transferring=false
            interp.command_201
            raise 'Transfer not scheduled by real native interpreter' unless
              $game_temp.player_transferring &&
              [$game_temp.player_new_map_id,$game_temp.player_new_x,$game_temp.player_new_y]==info.fetch('destination')
            puts "PASS Map#{mid}: #{ids.length} walkable events; Game_Player touch => Interpreter transfer to #{info.fetch('destination')}"
          end
          report.each do |mid,info|
            destid,x,y=info.fetch('destination')
            map=Marshal.load(File.binread(base+('%sMap%03d.rxdata'%[pre,destid])))
            s=sets.fetch(v(map,'tileset_id'))
            native=Game_Map.allocate
            native.instance_variable_set(:@map,map)
            native.instance_variable_set(:@passages,v(s,'passages'))
            native.instance_variable_set(:@priorities,v(s,'priorities'))
            native.instance_variable_set(:@events,{})
            raise 'Blocked landing' unless native.passable?(x,y,0)
            raise 'Landing immediately on reverse portal' if report.fetch(destid.to_s).fetch('contactCoordinates').include?([x,y])
          end
          puts 'PASS actual native touch and transfer handlers tested; both reverse landing spots safe'
          RUBY_VERIFY
          ruby -c /tmp/r34_verify.rb
          ruby /tmp/r34_verify.rb | tee build/r34-native-verify.txt

      - name: V229R34 Verify only 5 intended files changed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_INTEGRITY'
          from pathlib import Path
          import hashlib,json
          p=Path('site')
          before=json.loads(Path('build/r33-file-hashes.json').read_text())
          after={str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest()
                 for f in p.rglob('*') if f.is_file()}
          assert set(before)==set(after)
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          changed={f for f in before if before[f]!=after[f]}
          expected={f'knight/gameasync/Data/{pre}Map{mid:03}.rxdata' for mid in (45,46)}
          expected|={'knight/gameasync/mapping.js','knight/index.html','index.html'}
          assert changed==expected,('Unexpected game changes',changed^expected)
          for f in ('index.html','knight/index.html'):
            assert 'V229R34' in (p/f).read_text(encoding='utf-8')
          print('PASS: exact R33 game preserved apart from 2 dungeon maps, mapping hashes, version labels')
          PY_INTEGRITY

      - name: V229R34 Upload native portal and contact test report
        uses: actions/upload-artifact@v4
        with:
          name: SLKnight-V229R34-Original-Portal-Contact-Audit
          path: |
            build/r34-portals.json
            build/r34-native-verify.txt
          if-no-files-found: error
          retention-days: 30

      - name: V229R34 Upload existing game to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
