      - name: Reject any broken Map048 to Map049 bridge transition
        shell: bash
        run: |
          set -euo pipefail
          cat > build/v210/verify_bridges.rb <<'V210_VERIFY_BRIDGES_EOF'
          # encoding: UTF-8
          module RPG
            class Map;end
            class Event;end
            class Event::Page;end
            class Event::Page::Condition;end
            class Event::Page::Graphic;end
            class EventCommand;end
            class MoveCommand;end
            class MoveRoute;end
            class AudioFile;end
            class MapInfo;end
          end
          class Table
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(depth);@raw;end
          end
          class Color
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(depth);@raw;end
          end
          class Tone
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(depth);@raw;end
          end

          prefix='site/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          maps={48=>Marshal.load(File.binread(prefix+'Map048.rxdata')),
                49=>Marshal.load(File.binread(prefix+'Map049.rxdata'))}
          def walkable(map,x,y)
            w=map.instance_variable_get(:@width)
            h=map.instance_variable_get(:@height)
            return false unless x.between?(0,w-1) && y.between?(0,h-1)
            raw=map.instance_variable_get(:@data).instance_variable_get(:@raw)
            raw.byteslice(20+2*(y*w+x),2).unpack1('v')==384
          end

          results=[]
          maps.each do |id,map|
            events=map.instance_variable_get(:@events)
            raise "Unverified Map#{id} bridge transfer remains" unless events.empty?
            events.sort.each do |eventid,event|
              x=event.instance_variable_get(:@x)
              y=event.instance_variable_get(:@y)
              pages=event.instance_variable_get(:@pages)
              raise "Map#{id} bridge page changed" unless pages.size==1
              commands=pages[0].instance_variable_get(:@list).select{|cmd|cmd.instance_variable_get(:@code)==201}
              raise "Map#{id} bridge transfer missing" unless commands.size==1
              _,destination,tx,ty,*rest=commands[0].instance_variable_get(:@parameters)
              raise 'Destination Map ID changed' unless destination==({48=>49,49=>48}[id])
              departure=walkable(map,x,y)
              arrival=walkable(maps[destination],tx,ty)
              ok=departure && arrival
              results << ok
              puts "BRIDGE Map#{id} EVENT#{eventid}: #{x},#{y} -> Map#{destination} #{tx},#{ty} | departure=#{departure} arrival=#{arrival}"
            end
          end
          puts 'PASS unverified Map048/049 bridge events not installed'
          raise 'Unexpected bridge test results' unless results.empty?
          V210_VERIFY_BRIDGES_EOF
          ruby -c build/v210/verify_bridges.rb
          ruby build/v210/verify_bridges.rb

      - name: V2.14 verify legacy Map047 packs and externalize Map047 and newer packs
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          cat > build/v211/migrate_maps.py <<'V211_MIGRATE_MAPS_EOF'
          from pathlib import Path
          import hashlib,json,os,subprocess,urllib.request
          from urllib.parse import urlsplit

          root=Path('site')
          assets=root/'knight/assets'
          live=('map-047-v241.pack','map-048-v229r115.pack',
                'map-049-v229r115.pack','map-050-v229r115.pack')
          legacy=('map-047-v229r151.pack','map-047-v234.pack')
          for name in live+legacy:
              assert (assets/name).is_file(),('Missing V2.10 pack',name)

          for name in legacy:
              needle=name.encode('ascii')
              refs=[]
              for p in root.rglob('*'):
                  if not p.is_file() or p==assets/name:
                      continue
                  with p.open('rb') as stream:
                      tail=b''
                      while True:
                          block=stream.read(1048576)
                          if not block:
                              break
                          if needle in tail+block:
                              refs.append(str(p.relative_to(root)))
                              break
                          tail=block[-(len(needle)-1):]
              if refs:
                  print('KEEP REFERENCED',name,refs)
              else:
                  count=(assets/name).stat().st_size
                  (assets/name).unlink()
                  print('REMOVE UNUSED Map047',name,count)

          live+=tuple(p.name for p in sorted(assets.glob('map-*.pack'))
                      if p.name[4:7].isdigit() and int(p.name[4:7])>=51)
          assert len(live)==len(set(live)),('Duplicate active PACK names',live)

          fields=('R2_ACCOUNT_ID','R2_ACCESS_KEY_ID','R2_SECRET_ACCESS_KEY',
                  'R2_BUCKET','R2_PUBLIC_BASE_URL')
          settings={name:os.environ.get(name,'').strip() for name in fields}
          if any(settings.values()) and not all(settings.values()):
              raise RuntimeError('Incomplete R2 configuration; deployment stopped')
          if not any(settings.values()):
              print('::warning::R2 not configured: PACKs remain on GitHub Pages; R2 transfer skipped')
          else:
              import boto3
              public_base=settings['R2_PUBLIC_BASE_URL'].rstrip('/')
              parsed=urlsplit(public_base)
              assert parsed.scheme=='https' and parsed.netloc and not parsed.query and not parsed.fragment
              origin='https://gowellsik-hue.github.io'
              key_prefix='slknight/v214/'
              client=boto3.client(
                  's3',
                  endpoint_url='https://'+settings['R2_ACCOUNT_ID']+'.r2.cloudflarestorage.com',
                  aws_access_key_id=settings['R2_ACCESS_KEY_ID'],
                  aws_secret_access_key=settings['R2_SECRET_ACCESS_KEY'],
                  region_name='auto')
              bucket=settings['R2_BUCKET']
              for name in live:
                  p=assets/name
                  with p.open('rb') as stream:
                      digest=hashlib.file_digest(stream,'sha256').hexdigest()
                  key=key_prefix+name
                  client.upload_file(str(p),bucket,key,ExtraArgs={
                      'ContentType':'application/octet-stream',
                      'CacheControl':'public,max-age=31536000,immutable',
                      'Metadata':{'sha256':digest}})
                  obj=client.head_object(Bucket=bucket,Key=key)
                  assert obj['ContentLength']==p.stat().st_size,(name,'R2 length')
                  assert obj.get('Metadata',{}).get('sha256')==digest,(name,'R2 digest')
                  url=public_base+'/'+key
                  req=urllib.request.Request(url,method='HEAD',headers={'Origin':origin})
                  with urllib.request.urlopen(req,timeout=60) as response:
                      assert response.status==200,(name,'public HEAD')
                      assert int(response.headers['Content-Length'])==p.stat().st_size,(name,'public length')
