# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R111
# BASE: successfully deployed R104, run 40448777417 (complete working game).
# COORDINATES: restore original R84 native project/nearest on both floors.
#              Remove R96/R97 floor-1-only (+12,+6) projection and inverse shift.
# VISUAL: keep the existing left/down map artwork, panorama chunk positions,
#         scaling, wall sprites, and camera behavior byte-identical to R110.
# MAP DATA: restore untouched R104 Map045/Map046 bytes, event positions,
#           original doors and 30 monsters each. No invented gate extensions.
# MOVEMENT: retain original native S32 edges and R97 1F direction masks;
#           these are wall connections, not a coordinate shift.
# PERFORMANCE: retain R110 cached terrain, wall update guard, and the
#              Sanctuary-only 3-request background texture queue.
# LOAD: retain original R104 map callbacks, never gate entry on textures.
# KEEP: all non-Sanctuary maps, original 4-way pad, UI, boss and rewards.
name: build-slknight-web.yml | V229R111 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R111 Restore verified R104 without graphics edits
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40448777417
          name: github-pages
          github-token: ${{ github.token }}
          path: r104

      - name: V229R111 Remove hidden terrain work and repair monster distribution
        shell: bash
        run: |
          set -euo pipefail
          test -s r104/artifact.tar
          mkdir -p site build
          tar -xf r104/artifact.tar -C site
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert len(files)==5517,('Wrong R104 baseline',len(files))
          expected={
            'knight/gameasync/Data/Scripts.rxdata':'5444d9f3994324ef114c4c4330221b6671fcab9a7af3cbc5df575a3f9accd109',
            'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap045.rxdata':'f47de87af6b4e607bf632818a711619dc8ca4e747196a123a76ac7db8ffc3ba6',
            'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap046.rxdata':'dc89d908f5247442e08dddc11f5bcf6505a77890bd82ab59b790e00e3e5f024c',
            'knight/js/dpad.js':'2bd401adf130339d154ce6a8efd0127cefd9b1bc58bc60d1de68e8b6d8b7a791'}
          for name,sha in expected.items():
            assert files[name]==sha,('Wrong game baseline',name)
          for name in ('index.html','knight/index.html'):
            assert 'V229R104' in (root/name).read_text('utf-8')
          Path('build/before.json').write_text(json.dumps(files,sort_keys=True))
          print('PASS R104 complete original game, S32, wall and floor graphics')
          PY_BASE

          cat > build/r111_patch.rb <<'R111_PATCH'
          require 'zlib'
          require 'digest'
          path='site/knight/gameasync/Data/Scripts.rxdata'
          scripts=Marshal.load(File.binread(path))
          raise 'Wrong scripts count' unless scripts.size==136
          old97=Zlib::Inflate.inflate(scripts[97][2])
          old134=Zlib::Inflate.inflate(scripts[134][2])
          raise 'Unrecognized R104 engine' unless Digest::SHA256.hexdigest(File.binread(path))=='5444d9f3994324ef114c4c4330221b6671fcab9a7af3cbc5df575a3f9accd109'
          raise 'R104 native renderer changed' unless old97.include?('if @slti_floor') && old97.include?('@tilemap4.dispose')
          raise 'R104 wall code changed' unless old134.include?('def slti_r49_update_walls')

          def change_once(source,old,new,label)
            raise "Unexpected #{label} occurrences: #{source.scan(old).length}" unless source.scan(old).length==1
            source.sub(old,new)
          end

          def wrap(source,starting,ending,label)
            a=source.index(starting)
            raise "Missing #{label} opening" unless a
            b=source.index(ending,a)
            raise "Missing #{label} closing" unless b
            body=source[a...b]
            source[0...a]+"    unless @slti_floor\n"+body.lines.map{|l|'  '+l}.join+"    end\n"+source[b..-1]
          end

          # R111: restore the exact R84 native coordinate transformation.
          # Image positioning is independent and stays unchanged.
          shifted_project=<<'SHIFTED_PROJECT'
            def self.project(mid,x,y)
              px=12*(x+y)-784128
              py=6*(y-x)+YOFFSET[mid]
              if mid==45
                px+=12
                py+=6
              end
              return [px,py]
            end
          SHIFTED_PROJECT
          original_project=<<'ORIGINAL_PROJECT'
            def self.project(mid,x,y)
              px=12*(x+y)-784128
              py=6*(y-x)+YOFFSET[mid]
              return [px,py]
            end
          ORIGINAL_PROJECT
          old134=change_once(old134,shifted_project,original_project,
                             'restore original native project')

          shifted_inverse=<<'SHIFTED_INVERSE'
            def self.nearest(mid,rx,ry,radius=16)
              return nil unless active_map?(mid)
              u=rx*16+8
              v=ry*16+16
              native_u=u
              native_v=v
              if mid==45
                native_u-=12
                native_v-=6
              end
              a=(native_u+784128).to_f/12
              b=(native_v-YOFFSET[mid]).to_f/6
              x0=((a-b)/2).round
              y0=((a+b)/2).round
              best=nil
              for dx in -4..4
                for dy in -4..4
                  x=x0+dx;y=y0+dy
                  next if value(mid,x,y)==0
                  px,py=project(mid,x,y)
                  dist2=(u-px)*(u-px)+(v-py)*(v-py)
                  next if dist2>radius*radius
                  candidate=[dist2,x,y]
                  best=candidate if best==nil || candidate[0]<best[0]
                end
              end
              return nil if best==nil
              return [best[1],best[2]]
            end
          SHIFTED_INVERSE
          original_inverse=<<'ORIGINAL_INVERSE'
            def self.nearest(mid,rx,ry,radius=16)
              return nil unless active_map?(mid)
              u=rx*16+8
              v=ry*16+16
              a=(u+784128).to_f/12
              b=(v-YOFFSET[mid]).to_f/6
              x0=((a-b)/2).round
              y0=((a+b)/2).round
              best=nil
              for dx in -4..4
                for dy in -4..4
                  x=x0+dx;y=y0+dy
                  next if value(mid,x,y)==0
                  px,py=project(mid,x,y)
                  dist2=(u-px)*(u-px)+(v-py)*(v-py)
                  next if dist2>radius*radius
                  candidate=[dist2,x,y]
                  best=candidate if best==nil || candidate[0]<best[0]
                end
              end
              return nil if best==nil
              return [best[1],best[2]]
            end
          ORIGINAL_INVERSE
          old134=change_once(old134,shifted_inverse,original_inverse,
                             'restore original native nearest')
          raise 'Native coordinate shift remains' if
            old134.include?('px+=12') || old134.include?('py+=6') ||
            old134.include?('native_u-=12') || old134.include?('native_v-=6')

          floor_line="    @slti_floor = [45,46].include?($game_map.map_id) ? $game_map.map_id : nil\n"
          old97=change_once(old97,floor_line,'','floor assignment relocation')
          old97=change_once(old97,"    @character_sprites.push(Sprite_Character.new(@viewport2, $game_player))\n", "    @character_sprites.push(Sprite_Character.new(@viewport2, $game_player))\n"+floor_line,'actor init')
          old97=wrap(old97,"    @tilemap = Tilemap.new(@viewport2)\n","    @panorama = Sprite.new(@viewport2)\n",'fourfold first tilemap')
          hidden1="    if @slti_floor\n      [@tilemap, @tilemap2, @tilemap3, @tilemap4].each do |layer|\n        layer.visible = false if layer != nil && layer.respond_to?(:visible=)\n      end\n    end\n"
          old97=change_once(old97,hidden1,'','redundant hidden tilemap')
          a=old97.index("    @tilemap2 = Tilemap.new(@viewport4)\n")
          b=old97.index("    if @slti_floor\n      [@tilemap2,@tilemap3,@tilemap4].each do |layer|\n",a)
          c=old97.index("    update\n",b)
          raise 'Missing secondary tilemap area' unless a && b && c
          body=old97[a...b]
          old97=old97[0...a]+"    unless @slti_floor\n"+body.lines.map{|l|'  '+l}.join+"    end\n"+old97[c..-1]
          old97=wrap(old97,"    @tilemap.tileset.dispose\n","    if @slti_chunks\n",'disposal of hidden tilemaps')
          raise 'Wrong hidden tilemap creation count' unless old97.scan(/Tilemap\.new/).size==4
          raise 'Native tilemap guards absent' unless old97.scan('unless @slti_floor').size==3

          # Cache visible native floor textures without decoding offscreen assets.
          # Other maps keep their original Tilemap.
          from=old97.index("  def slti_update_terrain\n")
          finish=old97.index("\n  end\n\nend",from)
          raise 'Missing original terrain method' unless from && finish
          floor=<<'FLOOR'
            def slti_update_terrain
              return if @slti_chunk_error
              sx=[$game_map.display_x.to_i/4,0].max
              sy=[$game_map.display_y.to_i/4,0].max
              vw=@viewport2.rect.width
              vh=@viewport2.rect.height
              return if vw<=0 || vh<=0
              left=[sx/1024,0].max
              top=[sy/1024,0].max
              right=[(sx+vw-1)/1024,@slti_cols-1].min
              bottom=[(sy+vh-1)/1024,@slti_rows-1].min
              required={}
              if left<=right && top<=bottom
                (top..bottom).each do |y|
                  (left..right).each{|x|required[[x,y]]=true}
                end
              end
              @slti_r111_active_chunks=required
              @slti_r111_lru=[] if @slti_r111_lru==nil
              camera_key=[sx,sy]
              if @slti_r111_last_camera==camera_key &&
                 required.keys.all?{|key|@slti_chunks.has_key?(key)}
                return
              end
              @slti_r111_last_camera=camera_key
              @slti_chunks.each do |key,sprite|
                active=required.has_key?(key)
                sprite.visible=active if sprite.visible!=active
                if active
                  sprite.x=key[0]*1024-sx
                  sprite.y=key[1]*1024-sy
                  @slti_r111_lru.delete(key)
                  @slti_r111_lru << key
                end
              end
              # Decode only visible floor chunks. Never prewarm offscreen PNGs.
              target=required.keys.find{|key|!@slti_chunks.has_key?(key)}
              if target!=nil
                x,y=target
                sprite=Sprite.new(@viewport2)
                sprite.z=-1500
                sprite.zoom_x=2.0
                sprite.zoom_y=2.0
                sprite.visible=required.has_key?(target)
                filename="Graphics/Panoramas/SLTI_#{@slti_floor}_C#{x}_#{y}"
                begin
                  sprite.bitmap=Bitmap.new(filename)
                rescue StandardError=>error
                  sprite.dispose
                  @slti_chunk_error=true
                  p "SLTI CHUNK LOAD ERROR: #{filename}: #{error.message}"
                  return
                end
                sprite.x=x*1024-sx
                sprite.y=y*1024-sy
                @slti_chunks[target]=sprite
                @slti_r111_lru.delete(target)
                @slti_r111_lru << target
              end
              # Keep at most 12 decoded chunks, never evict a currently visible one.
              while @slti_chunks.length>12
                victim=@slti_r111_lru.find{|key|!required.has_key?(key)}
                break if victim==nil
                @slti_r111_lru.delete(victim)
                sprite=@slti_chunks.delete(victim)
                bmp=sprite.bitmap
                sprite.bitmap=nil
                sprite.dispose
                bmp.dispose if bmp!=nil && !bmp.disposed?
              end
              @slti_r60_floor_ready=required.keys.all?{|key|@slti_chunks.has_key?(key)}
            end
          FLOOR
          old97=old97[0...from]+floor.chomp+old97[(finish+6)..-1]
          raise 'R111 terrain cache absent' unless old97.include?('slti_r111_active_chunks') && old97.include?('@slti_chunks.length>12')

          old_anchor="    @slti_r49_walls={} if @slti_r49_walls==nil\n    return if @slti_chunks==nil\n"
          cache=<<'CACHE'
              @slti_r49_walls={} if @slti_r49_walls==nil
              return if @slti_chunks==nil
              # Wall sections and alpha depend only on camera/hero geometry, not frame count.
              # While a texture is pending (@slti_r49_walls.size < @slti_chunks.size),
              # keep the original one-new-texture-per-frame behavior.
              wall_camera_x=[$game_map.display_x.to_i/4,0].max
              wall_camera_y=[$game_map.display_y.to_i/4,0].max
              actor=@character_sprites && @character_sprites[-1]
              wall_state=[wall_camera_x,wall_camera_y,@slti_chunks.size]
              if actor!=nil
                wall_state += [actor.x,actor.y,actor.z,actor.ox,actor.oy,
                               actor.src_rect.width,actor.src_rect.height,actor.bitmap!=nil]
              end
              return if @slti_r111_last_wall_state==wall_state &&
                        @slti_r49_walls.size==@slti_chunks.size
              @slti_r111_last_wall_state=wall_state
          CACHE
          old134=change_once(old134,old_anchor,cache,'wall update cache')

          # Previous builds used S32 projection for the hero only. Monsters
          # used the 32px RGSS grid, displacing their drawn feet from floor art.
          # Give only native Sanctuary monsters the SAME real/native state as hero.
          old134=change_once(old134,
            "    return self==$game_player\n",
            "    return self==$game_player || SLTI_V229R49.monster?(self)\n",
            'shared native feet and movement')
          old_occupancy=<<'OLD_OCC'
              unless @through
                $game_map.events.values.each do |other|
                  next if other==self || other.through
                  return false if other.x==nx && other.y==ny && other.character_name!=''
                end
                if self!=$game_player && $game_player!=nil && !$game_player.through
                  return false if $game_player.x==nx && $game_player.y==ny
                end
              end
          OLD_OCC
          new_occupancy=<<'NEW_OCC'
              unless @through
                $game_map.events.each_value do |other|
                  next if other==self || other.through || other.character_name==''
                  if SLTI_V229R49.monster?(other)
                    # Monster and hero now occupy native S32 cells. Their rounded RGSS
                    # coordinates may coincide even when real S32 cells do not.
                    other.slti_native66_prepare
                    return false if other.instance_variable_get(:@slti_native66_x)==target[0] &&
                                    other.instance_variable_get(:@slti_native66_y)==target[1]
                  else
                    # NPC and scripted events still use their original RGSS coordinates.
                    return false if other.x==nx && other.y==ny
                  end
                end
                if self!=$game_player && $game_player!=nil && !$game_player.through
                  $game_player.slti_native66_prepare
                  return false if $game_player.instance_variable_get(:@slti_native66_x)==target[0] &&
                                  $game_player.instance_variable_get(:@slti_native66_y)==target[1]
                end
              end
          NEW_OCC
          old134=change_once(old134,old_occupancy,new_occupancy,'native actor occupancy')
          old134=change_once(old134,
            "    return if @slti_chunks==nil\n    # Wall sections",
            "    return if @slti_chunks==nil\n    @slti_r111_active_chunks={} if @slti_r111_active_chunks==nil\n    # Wall sections",
            'wall active chunk map')
          old134=change_once(old134,
            "      cx,cy=key\n      item[1].each do |part|\n",
            "      cx,cy=key\n      unless @slti_r111_active_chunks.has_key?(key)\n        item[1].each{|part|part[0].visible=false if part[0].visible}\n        next\n      end\n      item[1].each do |part|\n",
            'skip cached invisible wall slices')

          # Do not walk hundreds of invisible cached wall slices each frame.
          old134=change_once(old134,
            "    @slti_r111_active_chunks={} if @slti_r111_active_chunks==nil\n",
            "    @slti_r111_active_chunks={} if @slti_r111_active_chunks==nil\n    @slti_r111_hidden_walls={} if @slti_r111_hidden_walls==nil\n",
            'wall visibility cache init')
          old134=change_once(old134,
            "      unless @slti_r111_active_chunks.has_key?(key)\n        item[1].each{|part|part[0].visible=false if part[0].visible}\n        next\n      end\n      item[1].each do |part|\n",
            "      unless @slti_r111_active_chunks.has_key?(key)\n        unless @slti_r111_hidden_walls[key]\n          item[1].each{|part|part[0].visible=false if part[0].visible}\n          @slti_r111_hidden_walls[key]=true\n        end\n        next\n      end\n      @slti_r111_hidden_walls.delete(key)\n      item[1].each do |part|\n",
            'hide cached wall slices once, not every frame')

          # Original RGSS chase tries a second direction immediately if its
          # first choice hits a wall. For S32 monsters this looks like sliding.
          # Use exactly one 4-way attempt on Sanctuary; collision remains native.
          no_slide=<<'NO_SLIDE'

          class Game_Character
            alias slti_r111_original_move_toward_player move_toward_player
            def move_toward_player
              if $game_map==nil || !SLTI_Native66.active_map?($game_map.map_id) ||
                 !SLTI_V229R49.monster?(self)
                return slti_r111_original_move_toward_player
              end
              return if $game_player==nil
              return unless slti_native66_prepare && $game_player.slti_native66_prepare
              dx=@real_x-$game_player.real_x
              dy=@real_y-$game_player.real_y
              return if dx==0 && dy==0
              if dx.abs>=dy.abs
                dx>0 ? move_left : move_right
              else
                dy>0 ? move_up : move_down
              end
            end
          end
          NO_SLIDE
          old134+=no_slide

          addition=<<'RESPAWN'

          # V229R111: select a different traversable position near each monster's own
          # event region only when its original death event calls command_202.
          # Never scan terrain or search spawn candidates on the frame update path.
          module SLTI_R111Respawn
            ENTRY={45=>[92,74],46=>[74,94]}.freeze
            def self.pick(event)
              map=$game_map
              return nil if map==nil
              mid=map.map_id
              entrance=ENTRY[mid]
              return nil if entrance==nil
              original=event.instance_variable_get(:@event)
              return nil if original==nil
              x0=original.x;y0=original.y
              last=event.instance_variable_get(:@slti_r111_last_spawn)
              last_native=event.instance_variable_get(:@slti_r111_last_native)
              player=$game_player
              96.times do
                x=x0+rand(25)-12
                y=y0+rand(25)-12
                next if x<0 || y<0 || x>=map.width || y>=map.height
                next unless map.data[x,y,0]==384
                next if (x-entrance[0]).abs+(y-entrance[1]).abs<9
                next if player!=nil && (x-player.x).abs+(y-player.y).abs<9
                next if last!=nil && last[0]==x && last[1]==y
                native=SLTI_Native66.nearest(mid,x,y,16)
                next if native==nil || last_native==native
                occupied=false
                map.events.each_value do |other|
                  next if other==event || other.character_name==''
                  if SLTI_V229R49.monster?(other)
                    other.slti_native66_prepare
                    ox=other.instance_variable_get(:@slti_native66_x)
                    oy=other.instance_variable_get(:@slti_native66_y)
                    occupied=(ox==native[0] && oy==native[1])
                  else
                    occupied=(other.x==x && other.y==y)
                  end
                  break if occupied
                end
                next if occupied
                event.instance_variable_set(:@slti_r111_last_spawn,[x,y])
                event.instance_variable_set(:@slti_r111_last_native,native)
                return [x,y]
              end
              nil
            end
          end

          class Interpreter
            alias slti_r111_original_command_202 command_202
            def command_202
              if $game_map!=nil && SLTI_R111Respawn::ENTRY.has_key?($game_map.map_id) &&
                 @parameters!=nil && @parameters[0]==0 && @parameters[1]==0
                event=$game_map.events[@event_id]
                if event!=nil && SLTI_V229R49.monster?(event)
                  original=event.instance_variable_get(:@event)
                  if original!=nil && original.pages.size==4 &&
                     event.instance_variable_get(:@page).equal?(original.pages[-1])
                    pos=SLTI_R111Respawn.pick(event)
                    if pos!=nil
                      event.moveto(pos[0],pos[1])
                      return true
                    end
                  end
                end
              end
              slti_r111_original_command_202
            end
          end
          RESPAWN
          raise 'Already patched' if old134.include?('SLTI_R111Respawn')
          old134+=addition
          scripts[97][2]=Zlib::Deflate.deflate(old97)
          scripts[134][2]=Zlib::Deflate.deflate(old134)
          File.binwrite(path,Marshal.dump(scripts))
          File.binwrite('build/97-r111.rb',old97)
          File.binwrite('build/134-r111.rb',old134)
          raise 'Unexpected texture preload override' if old97.include?('SANCTUARY_TEXTURE_PRELOAD') || old134.include?('slti_r107_original_screen_z')
          puts "PASS R111 native tilemaps gated, wall state caching, original death respawn interception"
          R111_PATCH
          ruby -c build/r111_patch.rb
          ruby build/r111_patch.rb
          ruby -c build/97-r111.rb
          ruby -c build/134-r111.rb

          # Do not modify map files, event coordinates, doors, or spawn positions.
          python3 - <<'PY_ORIGINAL_MAPS'
          from pathlib import Path
          from hashlib import sha256
          base=Path('site/knight/gameasync/Data')
          expected={
            45:'f47de87af6b4e607bf632818a711619dc8ca4e747196a123a76ac7db8ffc3ba6',
            46:'dc89d908f5247442e08dddc11f5bcf6505a77890bd82ab59b790e00e3e5f024c'
          }
          for mid,digest in expected.items():
            path=base/f'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap{mid:03d}.rxdata'
            assert sha256(path.read_bytes()).hexdigest()==digest, ('Map modified',mid)
          print('PASS original 1F and 2F map data, doors, and event positions preserved')
          PY_ORIGINAL_MAPS

          python3 - <<'PY_CACHE'
          from pathlib import Path
          import hashlib,re
          root=Path('site')
          base=root/'knight/gameasync'
          mapping=base/'mapping.js'
          code=mapping.read_text('utf-8')
          names=['Data/Scripts.rxdata']
          for name in names:
            md5=hashlib.md5((base/name).read_bytes()).hexdigest()
            pattern=rf'({re.escape(name)}\?h=)[0-9a-f]{{32}}'
            code,n=re.subn(pattern,lambda m:m.group(1)+md5,code)
            assert n==1,('Missing game cache entry',name,n)
          mapping.write_text(code,encoding='utf-8')
          # R111: original map callback is unchanged. On native Sanctuary ONLY,
          # throttle *background* PNG preloads to avoid dozens of simultaneous
          # downloads/PNG decodes while the RPG engine is running.
          drive=root/'knight/js/drive.js'
          original=drive.read_text('utf-8')
          start=original.index('function preloadList(jsonArray) {')
          end=original.index('\nwindow.fileLoadedAsync = function(file) {',start)
          native_preload=r"""// R111_SANCTUARY_QUEUE: limit only the special 2x panoramas.
          function preloadList(jsonArray) {
              var sentinel=jsonArray.some(function(file){
                  return /^Graphics\/Panoramas\/SLTI_(45|46)_C/i.test(file);
              });
              if (sentinel) {
                  var images=jsonArray.slice();
                  // The original map preload JSON lists only floor textures.
                  // Add the native wall panoramas from mapping.js as well.
                  var first=images.find(function(file){return /SLTI_(45|46)_C/i.test(file);});
                  var mid=/SLTI_(45|46)_C/i.exec(first)[1];
                  var wallKey=new RegExp('^graphics/panoramas/slti_'+mid+'_w_c[0-9]+_[0-9]+$','i');
                  Object.keys(mapping).forEach(function(key){
                      if (wallKey.test(key))images.push(mapping[key].split('?')[0]);
                  });
                  if (images.length!==(mid==='45'?62:94)){
                      console.error('SLTI preload manifest count',mid,images.length);
                  }
                  var entry=[2,2];
                  var score=function(file){
                      var m=/SLTI_(45|46)_(?:W_)?C([0-9]+)_([0-9]+)\.png/i.exec(file);
                      if (!m)return 10000;
                      return Math.abs(Number(m[2])-entry[0])+Math.abs(Number(m[3])-entry[1]);
                  };
                  images.sort(function(a,b){return score(a)-score(b);});
                  var index=0,active=0,limit=3;
                  function launch(){
                      while (active<limit && index<images.length) {
                          var file=images[index++];
                          var key=getMappingKey(file);
                          var val=mapping[key];
                          if (!val || window.fileAsyncCache[key])continue;
                          active++;
                          (function(file,key,val){
                              var folder='/game/'+val.substring(0,val.lastIndexOf('/'));
                              var filename=val.substring(val.lastIndexOf('/')+1).split('?')[0];
                              function finished(){active--;setTimeout(launch,0);}
                              getLazyAsset('gameasync/'+val,filename,function(bytes){
                                  if (!bytes){finished();return;}
                                  if (window.fileAsyncCache[key]){finished();return;}
                                  // Keep compressed PNG bytes in the virtual FS.
                                  // No decode until a visible floor/wall requests it.
                                  try{
                                      if (!FS.analyzePath(folder+'/'+filename).exists){
                                          FS.createDataFile(folder,filename,new Uint8Array(bytes),true,true);
                                      }
                                      window.fileAsyncCache[key]=1;
                                  }catch(err){console.error('SLTI_PRELOAD_ERR',filename,err);}
                                  finished();
                              },true);
                          })(file,key,val);
                      }
                  }
                  launch();
                  return;
              }
              jsonArray.forEach((file) => {
                  const mappingKey = getMappingKey(file);
                  const mappingValue = mapping[mappingKey];
                  if (!mappingValue || window.fileAsyncCache[mappingKey]) return;
                  const path = "/game/" + mappingValue.substring(0, mappingValue.lastIndexOf("/"));
                  const filename = mappingValue.substring(mappingValue.lastIndexOf("/") + 1).split("?")[0];
                  getLazyAsset("gameasync/" + mappingValue, filename, (data) => {
                      if (!data) return;
                      FS.createPreloadedFile(path, filename, new Uint8Array(data), true, true, function() {
                          window.fileAsyncCache[mappingKey] = 1;
                      }, console.error, false, false, () => {
                          try { FS.unlink(path + "/" + filename); } catch (err) {}
                      });
                  }, true);
              });
          }
          """
          drive.write_text(original[:start]+native_preload+original[end:],encoding='utf-8')
          Path('build/r111-preload.js').write_text(native_preload,encoding='utf-8')
          assert 'window.loadFileAsync = function(fullPath, bitmap, callback)' in drive.read_text('utf-8')

          for name in ('index.html','knight/index.html'):
            path=root/name
            content=path.read_text('utf-8')
            assert 'V229R104' in content and 'V229R111' not in content
            updated=content.replace('V229R104','V229R111').replace('v229r104','v229r111')
            if name=='knight/index.html':
              assert updated.count('js/drive.js?v=v143z100')==1
              updated=updated.replace('js/drive.js?v=v143z100','js/drive.js?v=v229r111')
            path.write_text(updated,encoding='utf-8')
          print('PASS native map loading unchanged; native C/W compressed-byte queue added')
          PY_CACHE
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/dpad.js
          node --check site/knight/js/drive.js

      - name: V229R111 Audit original coordinates, visual layout and exact changes
        shell: bash
        run: |
          set -euo pipefail
          cat > build/r111-audit.rb <<'R111_AUDIT'
          require 'zlib'
          require 'digest'
          module RPG
            class Map;end;class MapInfo;end;class AudioFile;end;class Tileset;end
            class Event
              class Page
                class Condition;end;class Graphic;end
              end
            end
            class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          class Table
            def self._load(raw); obj=allocate;obj.instance_variable_set(:@raw,raw);obj;end
            def _dump(limit=0);@raw;end
          end
          root=ARGV.fetch(0)
          src=Zlib::Inflate.inflate(Marshal.load(File.binread(root+'/Scripts.rxdata'))[134][2])
          a=src.index("module SLTI_Native66\n")
          b=src.index("\nclass Game_Character",a)
          raise 'No native coordinate module' unless a && b
          Object.class_eval(src[a...b])
          formula=lambda{|mid,x,y|[12*(x+y)-784128,6*(y-x)+SLTI_Native66::YOFFSET.fetch(mid)]}
          [45,46].each do |mid|
            sample=0
            (SLTI_Native66::ORIGIN_X..SLTI_Native66::ORIGIN_X+SLTI_Native66::WIDTH[mid]-1).step(11) do |x|
              (SLTI_Native66::ORIGIN_Y..SLTI_Native66::ORIGIN_Y+SLTI_Native66::HEIGHT[mid]-1).step(7) do |y|
                next if SLTI_Native66.value(mid,x,y)==0
                expected=formula.call(mid,x,y)
                raise "Native project mismatch #{mid}: #{x},#{y}" unless SLTI_Native66.project(mid,x,y)==expected
                real=SLTI_Native66.real(mid,x,y)
                raise 'Native real mismatch' unless real==[expected[0]*8-64,expected[1]*8-128]
                sample+=1
              end
            end
            raise "Insufficient native cells #{mid}: #{sample}" unless sample>50
            puts "PASS map#{mid} original R84 project and real: #{sample} samples"
          end
          raise '1F project shift remains' if src.include?("px+=12\n") || src.include?("py+=6\n")
          raise '1F inverse shift remains' if src.include?('native_u-=12') || src.include?('native_v-=6')
          raise 'R97 wall direction masks missing' unless src.include?('module SLTI_V229R97Corner')
          puts 'PASS no floor-specific projection shift; native wall masks retained'
          R111_AUDIT
          ruby build/r111-audit.rb site/knight/gameasync/Data

          python3 - <<'PY_CHANGES'
          from pathlib import Path
          import hashlib,json,subprocess
          root=Path('site')
          before=json.loads(Path('build/before.json').read_text('utf-8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert len(after)==len(before)==5517 and after.keys()==before.keys()
          changed={path for path in after if after[path]!=before[path]}
          expected={'index.html','knight/index.html','knight/gameasync/mapping.js',
                    'knight/gameasync/Data/Scripts.rxdata','knight/js/drive.js'}
          assert changed==expected,('Unexpected file modifications',changed^expected)
          for mid in (45,46):
            path=f'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap{mid:03d}.rxdata'
            assert before[path]==after[path],('Original map coords/events changed',mid)
          assert before['knight/js/dpad.js']==after['knight/js/dpad.js']
          assert not any('/Graphics/' in p for p in changed)
          original_r104=Path('r104/artifact.tar')
          assert original_r104.is_file()
          engine=Path('build/134-r111.rb').read_text('utf-8')
          renderer=Path('build/97-r111.rb').read_text('utf-8')
          assert 'px+=12' not in engine and 'native_u-=12' not in engine
          assert 'SLTI_V229R97Corner' in engine
          assert 'slti_r111_original_move_toward_player' in engine
          assert 'SLTI_R111Respawn' in engine
          assert 'SLTI_#{@slti_floor}_C#{x}_#{y}' in renderer
          assert 'sprite.x=x*1024-sx' in renderer and 'sprite.y=y*1024-sy' in renderer
          assert '@slti_r111_active_chunks' in engine
          assert 'R111_SANCTUARY_QUEUE' in (root/'knight/js/drive.js').read_text('utf-8')
          html=(root/'knight/index.html').read_text('utf-8')
          assert 'window.loadFileAsync=function' not in html
          assert 'window.fileLoadedAsync=function' not in html
          print('PASS 5517 original files; exactly five expected changes')
          print('PASS C/W image bytes, screen placement and native map data unchanged')
          print('PASS no 1F or 2F gate edits and no map loading callback override')
          PY_CHANGES

      - name: V229R111 Publish original graphics and lighter native terrain renderer
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

