      - name: Build blocking core packs and background picture list
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          root =
              Path(
                  'player/gameasync'
              )

          groups = {
              'data': [],
              'gfx': [],
              'audio': []
          }

          pictures = []

          def key_for(rel):
              return re.sub(
                  r'\.[^/.]+$',
                  '',
                  rel.lower()
              )

          for p in root.rglob('*'):
              if not p.is_file():
                  continue

              if p.name.lower() == \
                 'thumbs.db':
                  continue

              rel =
                  p.relative_to(
                      root
                  ).as_posix()

              low =
                  rel.lower()

              if low.startswith(
                  'graphics/pictures/'
              ):
                  pictures.append(rel)
                  continue

              if \
                  low in (
                      'rgss.rb',
                      'game.ini',
                      'lineage.ini'
                  ) or \
                  low.startswith(
                      'data/'
                  ) or \
                  low.startswith(
                      'fonts/'
                  ):

                  groups['data'].append(
                      (
                          rel,
                          p
                      )
                  )

              elif low.startswith(
                  (
                      'graphics/animations/',
                      'graphics/autotiles/',
                      'graphics/characters/',
                      'graphics/fogs/',
                      'graphics/gameovers/',
                      'graphics/icons/',
                      'graphics/panoramas/',
                      'graphics/tilesets/',
                      'graphics/titles/',
                      'graphics/windowskins/'
                  )
              ):
                  groups['gfx'].append(
                      (
                          rel,
                          p
                      )
                  )

              elif low.startswith(
                  (
                      'audio/se/',
                      'audio/bgs/',
                      'audio/me/',
                      'bm/'
                  )
              ):
                  groups['audio'].append(
                      (
                          rel,
                          p
                      )
                  )

          packs = []

          for name, files in \
              groups.items():

              files.sort(
                  key=lambda x:
                  x[0].lower()
              )

              manifest = []
              offset = 0

              outpath =
                  Path('player') / \
                  (
                      'core-' +
                      name +
                      '.pack'
                  )

              with outpath.open(
                  'wb'
              ) as out:

                  for rel, p in files:
                      data =
                          p.read_bytes()

                      out.write(data)

                      manifest.append(
                          [
                              rel,
                              offset,
                              len(data),
                              key_for(rel)
                          ]
                      )

                      offset += len(data)

              packs.append(
                  {
                      'name': name,
                      'url':
                          'core-' +
                          name +
                          '.pack?v=v145',
                      'bytes': offset,
                      'files': manifest
                  }
              )

              print(
                  'CORE_PACK',
                  name,
                  'files',
                  len(files),
                  'bytes',
                  offset
              )

          pictures.sort(
              key=str.lower
          )

          js = (
              'window.slCorePacks=' +
              json.dumps(
                  packs,
                  ensure_ascii=False,
                  separators=(',', ':')
              ) +
              ';\n'
          )

          js += (
              'window.slPicturePreload=' +
              json.dumps(
                  pictures,
                  ensure_ascii=False,
                  separators=(',', ':')
              ) +
              ';\n'
          )

          Path(
              'player/core-manifest.js'
          ).write_text(
              js,
              encoding='utf-8'
          )

          total =
              sum(
                  x['bytes']
                  for x in packs
              )

          print(
              'BLOCKING_CORE_BYTES=' +
              str(total)
          )

          if total <= 0 or \
             total > 60 * 1024 * 1024:

              raise SystemExit(
                  'blocking core size out of expected range: ' +
                  str(total)
              )
          PY

          test -s player/core-data.pack
          test -s player/core-gfx.pack
          test -s player/core-audio.pack
          test -s player/core-manifest.js

          rm -f \
            player/gameasync/bitmap-map.js

      - name: Patch browser save preload audio and analog mobile UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p =
              Path(
                  'player/js/drive.js'
              )

          s =
              p.read_text()

          old =
              '    if (window.fileAsyncCache.hasOwnProperty(mappingKey)) return callback();'

          new = (
              old +
              "\n    try { "
              "const mv=mappingValue; "
              "if(mv){ "
              "const fp='/game/'+mv.split('?')[0]; "
              "if(FS.analyzePath(fp).exists && FS.stat(fp).size>1){ "
              "window.fileAsyncCache[mappingKey]=1; "
              "return callback(); "
              "} "
              "} "
              "} catch(e) {}"
          )

          if s.count(old) != 1:
              raise SystemExit(
                  'loadFileAsync cache marker mismatch'
              )

          s =
              s.replace(
                  old,
                  new,
                  1
              )

          a =
              s.index(
                  'window.saveFile = function(filename, localOnly) {'
              )

          b =
              s.index(
                  '\n};',
                  a
              ) + 3

          save = """window.saveFile = function(filename, localOnly) {
              const fpath='/game/'+filename;

              if(!FS.analyzePath(fpath).exists)
                  return Promise.resolve(false);

              const buf=FS.readFile(fpath);

              return localforage
                .setItem(namespace+filename,buf)
                .then(()=>localforage.getItem(namespace))
                .then(folder=>{
                  folder=folder||{};
                  folder[filename]={
                    t:Number(FS.stat(fpath).mtime)
                  };
                  return localforage.setItem(
                    namespace,
                    folder
                  );
                })
                .then(()=>{
                  if(!localOnly)
                    (window.saveCloudFile||(()=>{}))(
                      filename,
                      buf
                    );

                  console.log(
                    'SLSAVED|'+filename
                  );

                  return true;
                })
                .catch(e=>{
                  console.error(
                    'SLSAVEERR',
                    e
                  );
                  return false;
                });
          };

          window.restoreLocalFilesBeforeRun=function(){
              const dep='sl-local-saves';

              addRunDependency(dep);

              try{
                if(!FS.analyzePath('/game').exists)
                  FS.mkdir('/game');
              }catch(e){}

              localforage
                .getItem(namespace)
                .then(folder=>
                  Promise.all(
                    Object
                      .keys(folder||{})
                      .map(key=>
                        localforage
                          .getItem(namespace+key)
                          .then(res=>{
                            if(!res)return;

                            const f='/game/'+key;

                            try{
                              if(FS.analyzePath(f).exists)
                                FS.unlink(f);
                            }catch(e){}

                            FS.writeFile(
                              f,
                              res
                            );

                            const m=folder[key];

                            if(
                              m &&
                              Number.isInteger(m.t)
                            ){
                              FS.utime(
                                f,
                                m.t,
                                m.t
                              );
                            }
                          })
                      )
                  )
                )
                .then(()=>{
                  console.log(
                    'SLRESTORE|done'
                  );
                  removeRunDependency(dep);
                })
                .catch(e=>{
                  console.error(
                    'SLRESTOREERR',
                    e
                  );
                  removeRunDependency(dep);
                });
          };

          window.preloadCorePacks=function(){
              const dep='sl-core-packs';

              addRunDependency(dep);

              const packs=
                  window.slCorePacks||[];

              const box=
                  document.getElementById(
                    'progress'
                  );

              const xh=[];

              let finished=false;
              let globalLoaded={};
              let globalTotal={};

              function setProgress(){
                let loaded=0;
                let total=0;

                Object
                  .keys(globalLoaded)
                  .forEach(k=>
                    loaded+=
                      globalLoaded[k]||0
                  );

                Object
                  .keys(globalTotal)
                  .forEach(k=>
                    total+=
                      globalTotal[k]||0
                  );

                if(box){
                  const a=
                    (
                      loaded /
                      1048576
                    ).toFixed(1);

                  const b=
                    total ?
                    (
                      total /
                      1048576
                    ).toFixed(1) :
                    '?';

                  box.innerHTML=
                    'Loading game data '+
                    a+
                    ' / '+
                    b+
                    ' MB';

                  box.style.opacity='0.8';
                }
              }

              function finish(msg){
                if(finished)return;

                finished=true;

                xh.forEach(x=>{
                  try{
                    x.abort();
                  }catch(e){}
                });

                window.fileLoadedAsync=
                  function(file){
                    document.title=wTitle;
                  };

                if(box){
                  box.innerHTML=msg;
                  box.style.opacity='0.65';
                }

                console.log(
                  'SLCORE_DONE|'+msg
                );

                removeRunDependency(dep);
              }

              function loadPack(pack){
                return new Promise(resolve=>{
                  const x=
                    new XMLHttpRequest();

                  xh.push(x);

                  x.open(
                    'GET',
                    pack.url,
                    true
                  );

                  x.responseType=
                    'arraybuffer';

                  x.timeout=60000;

                  globalLoaded[
                    pack.name
                  ]=0;

                  globalTotal[
                    pack.name
                  ]=pack.bytes||0;

                  x.onprogress=e=>{
                    globalLoaded[
                      pack.name
                    ]=e.loaded||0;

                    if(
                      e.lengthComputable &&
                      e.total
                    ){
                      globalTotal[
                        pack.name
                      ]=e.total;
                    }

                    setProgress();
                  };

                  function fallback(reason){
                    console.error(
                      'SLCORE_FALLBACK|'+
                      pack.name+
                      '|'+
                      reason
                    );

                    resolve(false);
                  }

                  x.onerror=
                    ()=>fallback(
                      'network'
                    );

                  x.ontimeout=
                    ()=>fallback(
                      'timeout'
                    );

                  x.onload=()=>{
                    if(
                      x.status<200 ||
                      x.status>=400 ||
                      !x.response
                    ){
                      return fallback(
                        'http'+x.status
                      );
                    }

                    try{
                      const u=
                        new Uint8Array(
                          x.response
                        );

                      for(
                        const q of
                        pack.files
                      ){
                        const rel=q[0];
                        const off=q[1];
                        const len=q[2];
                        const key=q[3];
                        const full=
                          '/game/'+rel;

                        if(
                          off+len>
                          u.length
                        ){
                          throw new Error(
                            'short pack '+
                            pack.name
                          );
                        }

                        try{
                          if(
                            FS
                              .analyzePath(full)
                              .exists
                          ){
                            FS.unlink(full);
                          }
                        }catch(e){}

                        const slash=
                          full.lastIndexOf('/');

                        const dir=
                          full.slice(
                            0,
                            slash
                          );

                        try{
                          if(FS.mkdirTree)
                            FS.mkdirTree(dir);
                        }catch(e){}

                        FS.writeFile(
                          full,
                          u.subarray(
                            off,
                            off+len
                          )
                        );

                        window.fileAsyncCache[
                          key
                        ]=1;
                      }

                      globalLoaded[
                        pack.name
                      ]=u.length;

                      setProgress();

                      console.log(
                        'SLCORE_READY|'+
                        pack.name+
                        '|'+
                        u.length
                      );

                      resolve(true);

                    }catch(e){
                      console.error(e);
                      fallback('unpack');
                    }
                  };

                  x.send();
                });
              }

              const hard=
                setTimeout(
                  ()=>finish(
                    'Core preload timeout - lazy mode'
                  ),
                  90000
                );

              Promise
                .all(
                  packs.map(loadPack)
                )
                .then(results=>{
                  clearTimeout(hard);

                  finish(
                    results.every(Boolean) ?
                    'Game ready' :
                    'Game ready - lazy fallback'
                  );
                })
                .catch(e=>{
                  clearTimeout(hard);

                  console.error(
                    'SLCOREERR',
                    e
                  );

                  finish(
                    'Game ready - lazy fallback'
                  );
                });
          };

          window.slWarmPictures=function(){
              const queue=
                (
                  window.slPicturePreload||
                  []
                ).slice();

              let active=0;
              const limit=3;

              function next(){
                while(
                  active<limit &&
                  queue.length
                ){
                  const file=
                    queue.shift();

                  const mappingKey=
                    getMappingKey(file);

                  const mappingValue=
                    mapping[mappingKey];

                  if(
                    !mappingValue ||
                    window.fileAsyncCache[
                      mappingKey
                    ]
                  ){
                    continue;
                  }

                  const path=
                    '/game/'+
                    mappingValue.substring(
                      0,
                      mappingValue.lastIndexOf('/')
                    );

                  const filename=
                    mappingValue
                      .substring(
                        mappingValue.lastIndexOf('/')+1
                      )
                      .split('?')[0];

                  active++;

                  getLazyAsset(
                    'gameasync/'+
                    mappingValue,
                    filename,
                    (data)=>{
                      if(!data){
                        active--;
                        next();
                        return;
                      }

                      FS.createPreloadedFile(
                        path,
                        filename,
                        new Uint8Array(data),
                        true,
                        true,
                        function(){
                          window.fileAsyncCache[
                            mappingKey
                          ]=1;

                          active--;
                          next();
                        },
                        function(){
                          active--;
                          next();
                        },
                        false,
                        false,
                        ()=>{
                          try{
                            FS.unlink(
                              path+'/'+filename
                            );
                          }catch(e){}
                        }
                      );
                    },
                    true
                  );
                }
              }

              next();
          };
          """

          p.write_text(
              s[:a] +
              save +
              s[b:]
          )
          PY

          cat > player/js/dpad.js <<'JS'
          function simulateKeyEvent(
              eventType,
              keyCode,
              charCode
          ) {
              var e =
                  document.createEventObject ?
                  document.createEventObject() :
                  document.createEvent("Events");

              if (e.initEvent)
                  e.initEvent(
                      eventType,
                      true,
                      true
                  );

              e.keyCode = keyCode;
              e.which = keyCode;
              e.charCode = charCode || 0;

              if (
                  typeof JSEvents !== 'undefined' &&
                  JSEvents.eventHandlers &&
                  JSEvents.eventHandlers.length > 0
              ) {
                  for (
                      var i = 0;
                      i < JSEvents.eventHandlers.length;
                      ++i
                  ) {
                      var h =
                          JSEvents.eventHandlers[i];

                      if (
                          (
                              h.target == Module['canvas'] ||
                              h.target == window
                          ) &&
                          h.eventTypeString == eventType
                      ) {
                          h.handlerFunc(e);
                      }
                  }
              } else if (
                  typeof Module !== 'undefined' &&
                  Module['canvas']
              ) {
                  Module['canvas'].dispatchEvent
                      ? Module['canvas'].dispatchEvent(e)
                      : Module['canvas'].fireEvent(
                          "on" + eventType,
                          e
                        );
              }
          }

          const slKeysDown =
              new Set();

          function slKeyDown(code) {
              if (slKeysDown.has(code))
                  return;

              slKeysDown.add(code);

              simulateKeyEvent(
                  'keydown',
                  code,
                  0
              );
          }

          function slKeyUp(code) {
              if (!slKeysDown.has(code))
                  return;

              slKeysDown.delete(code);

              simulateKeyEvent(
                  'keyup',
                  code,
                  0
              );
          }

          function slTapKey(code) {
              slKeyDown(code);

              setTimeout(
                  function() {
                      slKeyUp(code);
                  },
                  90
              );
          }

          function bindKey(elem, key) {
              const node =
                  document.getElementById(
                      elem
                  );

              if (!node)
                  return;

              node.addEventListener(
                  'pointerdown',
                  function(e) {
                      e.preventDefault();

                      if (node.setPointerCapture)
                          node.setPointerCapture(
                              e.pointerId
                          );

                      slKeyDown(key);
                      node.classList.add(
                          'active'
                      );
                  }
              );

              const release =
                  function(e) {
                      if (
                          e &&
                          e.preventDefault
                      ) {
                          e.preventDefault();
                      }

                      slKeyUp(key);

                      node.classList.remove(
                          'active'
                      );
                  };

              node.addEventListener(
                  'pointerup',
                  release
              );

              node.addEventListener(
                  'pointercancel',
                  release
              );

              node.addEventListener(
                  'lostpointercapture',
                  release
              );
          }

          function is_touch_device() {
              return (
                  'ontouchstart' in window
              ) ||
              (
                  navigator.maxTouchPoints > 0
              );
          }

          const resize = function() {
              const el =
                  document.getElementById(
                      'canvas'
                  );

              if (!el)
                  return;

              if (
                  window.innerHeight >
                  window.innerWidth
              ) {
                  el.style.height = 'unset';
                  el.style.width = '100%';
              } else {
                  el.style.width = 'unset';
                  el.style.height = '100%';
              }
          };

          window.addEventListener(
              'resize',
              resize
          );

          window.addEventListener(
              'load',
              resize
          );

          window.slSetQuickLabel =
              function(slot, label) {
                  const node =
                      document.getElementById(
                          'sl-q' +
                          String(slot)
                      );

                  if (!node)
                      return;

                  const text =
                      String(
                          label || ''
                      ).trim();

                  node.textContent =
                      text.length > 8 ?
                      text.slice(0, 8) :
                      (
                          text ||
                          String(slot)
                      );

                  node.title = text;
              };

          function initSLMobileControls() {
              const ui =
                  document.getElementById(
                      'sl-mobile-ui'
                  );

              if (!ui)
                  return;

              if (!is_touch_device()) {
                  ui.style.display = 'none';
                  resize();
                  return;
              }

              const joy =
                  document.getElementById(
                      'sl-joystick'
                  );

              const knob =
                  document.getElementById(
                      'sl-joy-knob'
                  );

              let joyPointer = null;

              const arrows = [
                  37,
                  38,
                  39,
                  40
              ];

              function setArrows(next) {
                  arrows.forEach(
                      function(code) {
                          if (
                              next.indexOf(code) >= 0
                          ) {
                              slKeyDown(code);
                          } else {
                              slKeyUp(code);
                          }
                      }
                  );
              }

              function updateJoy(e) {
                  const r =
                      joy.getBoundingClientRect();

                  const cx =
                      r.left +
                      r.width / 2;

                  const cy =
                      r.top +
                      r.height / 2;

                  let dx =
                      e.clientX - cx;

                  let dy =
                      e.clientY - cy;

                  const max =
                      Math.max(
                          34,
                          r.width * 0.31
                      );

                  const len =
                      Math.hypot(
                          dx,
                          dy
                      ) || 1;

                  const scale =
                      Math.min(
                          1,
                          max / len
                      );

                  dx *= scale;
                  dy *= scale;

                  knob.style.transform =
                      'translate(' +
                      dx +
                      'px,' +
                      dy +
                      'px)';

                  const nx =
                      dx / max;

                  const ny =
                      dy / max;

                  const next = [];

                  if (
                      Math.abs(nx) > 0.28
                  ) {
                      next.push(
                          nx > 0 ?
                          39 :
                          37
                      );
                  }

                  if (
                      Math.abs(ny) > 0.28
                  ) {
                      next.push(
                          ny > 0 ?
                          40 :
                          38
                      );
                  }

                  setArrows(next);
              }

              joy.addEventListener(
                  'pointerdown',
                  function(e) {
                      e.preventDefault();

                      joyPointer =
                          e.pointerId;

                      if (
                          joy.setPointerCapture
                      ) {
                          joy.setPointerCapture(
                              e.pointerId
                          );
                      }

                      updateJoy(e);
                  }
              );

              joy.addEventListener(
                  'pointermove',
                  function(e) {
                      if (
                          e.pointerId !==
                          joyPointer
                      ) {
                          return;
                      }

                      e.preventDefault();
                      updateJoy(e);
                  }
              );

              function endJoy(e) {
                  if (
                      joyPointer !== null &&
                      e &&
                      e.pointerId !== undefined &&
                      e.pointerId !== joyPointer
                  ) {
                      return;
                  }

                  joyPointer = null;

                  setArrows([]);

                  knob.style.transform =
                      'translate(0px,0px)';
              }

              joy.addEventListener(
                  'pointerup',
                  endJoy
              );

              joy.addEventListener(
                  'pointercancel',
                  endJoy
              );

              joy.addEventListener(
                  'lostpointercapture',
                  endJoy
              );

              bindKey(
                  'sl-confirm',
                  67
              );

              bindKey(
                  'sl-cancel',
                  88
              );

              bindKey(
                  'sl-bag',
                  90
              );

              bindKey(
                  'sl-equip',
                  68
              );

              const config =
                  document.getElementById(
                      'sl-config'
                  );

              if (config) {
                  config.addEventListener(
                      'pointerdown',
                      function(e) {
                          e.preventDefault();

                          config.classList.add(
                              'active'
                          );

                          slTapKey(116);
                      }
                  );

                  config.addEventListener(
                      'pointerup',
                      function() {
                          config.classList.remove(
                              'active'
                          );
                      }
