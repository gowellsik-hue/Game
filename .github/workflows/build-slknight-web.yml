      - name: Connect visible keyboard input
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl417-name.js <<'JAVASCRIPT'
          (function(){
            'use strict';

            let field=null;
            let rect=null;
            let file=null;
            let composing=false;
            let submitted=false;

            function layout(){

              if(!field)return;

              const c=document.getElementById('canvas').getBoundingClientRect();

              const [x,y,w,h]=rect;
              const sx=c.width/800;
              const sy=c.height/600;

              Object.assign(field.style,{
                left:(c.left+x*sx)+'px',
                top:(c.top+y*sy)+'px',
                width:(w*sx)+'px',
                height:(h*sy)+'px',
                fontSize:Math.max(16,12*sy)+'px'
              });
            }

            function send(flag){

              if(!field||composing||submitted)return;

              try{

                const v=flag+'\n'+field.value;

                FS.writeFile(
                  file,
                  new TextEncoder().encode(v)
                );

                if(FS.readFile(file,{encoding:'utf8'})!==v){
                  throw Error('Name input write failed');
                }

                if(flag==='1')submitted=true;

                field.setCustomValidity('');

              }catch(e){

                console.error('SL417_NAME_WRITE',e);

                field.setCustomValidity(
                  '이름을 입력하지 못했습니다. 다시 입력해 주세요.'
                );

                field.reportValidity();
              }
            }

            function close(){

              if(field){
                field.remove();
                field=null;
              }

              if(file&&FS.analyzePath(file).exists){
                FS.unlink(file);
              }

              file=rect=null;
              composing=submitted=false;

              document.getElementById('canvas').focus({
                preventScroll:true
              });
            }

            function open(p){

              if(field)return;

              rect=p.slice(2,6).map(Number);
              file=p.slice(7).join('|');

              if(
                rect.some(v=>!Number.isFinite(v)) ||
                !file ||
                FS.readFile(file,{encoding:'utf8'})!=='0\n'
              ){
                throw Error('Name input initialization');
              }

              field=document.createElement('input');

              field.id='sl417-name';
              field.type='text';
              field.inputMode='text';
              field.enterKeyHint='done';
              field.maxLength=Number(p[6]);
              field.autocomplete='off';
              field.spellcheck=false;

              field.setAttribute(
                'aria-label',
                '캐릭터 이름'
              );

              field.setAttribute(
                'autocapitalize',
                'off'
              );

              field.style.cssText=
                'position:fixed;'+
                'z-index:2147483647;'+
                'box-sizing:border-box;'+
                'pointer-events:auto;'+
                'touch-action:manipulation;'+
                'user-select:text;'+
                '-webkit-user-select:text;'+
                'outline:none;'+
                'border:1px solid #b5b5b5;'+
                'border-radius:0;'+
                'background:rgba(0,0,0,.55);'+
                'color:#fff;'+
                'caret-color:#fff;'+
                'font-family:SL417Nanum,sans-serif;'+
                'padding:0 6px;';

              field.addEventListener(
                'input',
                ()=>send('0')
              );

              field.addEventListener(
                'compositionstart',
                ()=>composing=true
              );

              field.addEventListener(
                'compositionend',
                ()=>{
                  composing=false;
                  send('0');
                }
              );

              document.getElementById('main').appendChild(field);

              layout();

              field.focus({
                preventScroll:true
              });
            }

            ['keydown','keyup','keypress'].forEach(type=>{

              window.addEventListener(type,e=>{

                if(!field||e.target!==field)return;

                if(
                  type==='keydown' &&
                  e.key==='Enter' &&
                  !composing &&
                  !e.isComposing
                ){
                  e.preventDefault();
                  send('1');
                }

                e.stopImmediatePropagation();

              },true);
            });

            [
              'pointerdown',
              'pointerup',
              'mousedown',
              'mouseup',
              'click',
              'touchstart',
              'touchend'
            ].forEach(type=>{

              window.addEventListener(type,e=>{

                if(field&&e.target===field){
                  e.stopImmediatePropagation();
                }

              },true);
            });

            const resize=()=>requestAnimationFrame(layout);

            window.addEventListener(
              'resize',
              resize
            );

            document.addEventListener(
              'fullscreenchange',
              resize
            );

            if(window.visualViewport){

              window.visualViewport.addEventListener(
                'resize',
                resize
              );

              window.visualViewport.addEventListener(
                'scroll',
                resize
              );
            }

            window.sl417NameMessage=function(text){

              const s=String(text).trim();

              try{

                if(s.startsWith('SL417|NAME|')){

                  open(s.split('|'));

                }else if(s==='SL417|NAME_CLOSE'&&field){

                  close();

                }else if(s==='SL417|NAME_RETRY'&&field){

                  submitted=false;

                  field.focus({
                    preventScroll:true
                  });
                }

              }catch(e){

                console.error('SL417_NAME_ERROR',e);
              }
            };
          })();
          JAVASCRIPT

