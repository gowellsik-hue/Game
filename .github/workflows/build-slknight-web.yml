name: Deploy SLKnight mkxp-web BOOT TRAP V7

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-slknight-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  LIVE_MKXP_REF: 07e1519f9a2b9100512c567e97455fa3c77a3221

jobs:
  build:
    name: Build SLKnight BOOT TRAP V7
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Install tools
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            unzip \
            ruby \
            python3 \
            ffmpeg \
            imagemagick \
            file \
            timidity \
            freepats

      - name: Checkout exact working mkxp-web
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.LIVE_MKXP_REF }}
          path: player
          sparse-checkout: |
            index.html
            js
            manifest.webmanifest
            mkxp.js
            mkxp.wasm
          sparse-checkout-cone-mode: false

      - name: Checkout mkxp-web tools
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: master
          path: mkxp-tools
          sparse-checkout: |
            COPYING
            extra/rgss.rb
            extra/make_mapping.sh
          sparse-checkout-cone-mode: false

      - name: Verify working engine
        run: |
          set -e

          test "$(git -C player rev-parse HEAD)" = "$LIVE_MKXP_REF"

          JS_SIZE="$(stat -c '%s' player/mkxp.js)"
          WASM_SIZE="$(stat -c '%s' player/mkxp.wasm)"

          echo "mkxp.js=${JS_SIZE}"
          echo "mkxp.wasm=${WASM_SIZE}"

          test "${JS_SIZE}" = "290574"
          test "${WASM_SIZE}" = "5217852"

          test -s player/js/drive.js
          test -s player/js/dpad.js
          test -s player/js/localforage.min.js

          echo "LIVE_ENGINE_OK"

      - name: Download SLKnight
        run: |
          set -e

          curl -L \
            --fail \
            --retry 3 \
            -o slknight.zip \
            "${GAME_URL}"

          echo "${GAME_SHA256}  slknight.zip" \
            | sha256sum -c -

          rm -rf game
          mkdir -p game

          unzip -q \
            slknight.zip \
            -d game

          test -f \
            game/SLKnight_Android_JoiPlay/Game.ini

          echo "SLKNIGHT_DOWNLOAD_OK"

      - name: Install SLKnight data
        run: |
          set -e

          rm -rf \
            player/gameasync \
            player/preload

          mkdir -p \
            player/gameasync \
            player/preload

          cp -a \
            game/SLKnight_Android_JoiPlay/. \
            player/gameasync/

          cp \
            mkxp-tools/extra/rgss.rb \
            player/gameasync/rgss.rb

          cp \
            mkxp-tools/COPYING \
            player/COPYING-mkxp-web.txt

          rm -f \
            player/gameasync/README_Android.txt

          echo "SLKNIGHT_DATA_OK"

      - name: Convert and trap SLKnight RGSS errors
        run: |
          set -e

          ruby -rzlib - <<'RB'
          game_dir = 'player/gameasync'
          ini_path = File.join(game_dir, 'Game.ini')

          ini = File.binread(ini_path)

          scripts_rel = ini[/^Scripts=(.+)$/i, 1]

          abort 'Scripts entry missing from Game.ini' \
            if scripts_rel == nil

          scripts_rel = scripts_rel.strip.tr('\\', '/')

          scripts_path = File.join(
            game_dir,
            scripts_rel
          )

          abort "Scripts file missing: #{scripts_path}" \
            unless File.file?(scripts_path)

          scripts = Marshal.load(
            File.binread(scripts_path)
          )

          # ========================================================
          # Win32 API compatibility
          # ========================================================

          web_compat = <<'RUBY'
          class Win32API
            def initialize(*args)
            end

            def call(*args)
              0
            end

            def Call(*args)
              call(*args)
            end
          end
          RUBY

          scripts.insert(
            0,
            [
              0,
              'Web Compatibility',
              Zlib::Deflate.deflate(web_compat)
            ]
          )

          # ========================================================
          # Convert:
          #
          # begin
          #   ...
          # end until condition
          #
          # to mruby-compatible loop
          # ========================================================

          def patch_begin_until(source)
            lines = source.lines
            changed = 0
            i = 0

            while i < lines.length
              match = lines[i].match(
                /^(\s*)end\s+until\s+(.+?)\s*$/
              )

              if match
                indent = match[1]
                condition = match[2]

                j = i - 1

                while j >= 0
                  if (
                    lines[j][/^\s*/] == indent &&
                    lines[j].strip == 'begin'
                  )
                    lines[j] =
                      indent +
                      "loop do\n"

                    lines[i] =
                      indent +
                      "  break if " +
                      condition +
                      "\n" +
                      indent +
                      "end\n"

                    changed += 1
                    break
                  end

                  j -= 1
                end
              end

              i += 1
            end

            [
              lines.join,
              changed
            ]
          end

          # ========================================================
          # Remove classic RPG Maker scene frame loops.
          # mkxp-web drives one frame at a time.
          # ========================================================

          def patch_scene_loops(source)
            lines = source.lines
            changed = 0
            i = 0

            while i < lines.length
              unless lines[i].strip == 'loop do'
                i += 1
                next
              end

              indent = lines[i][/^\s*/]

              significant = []
              k = i + 1

              while (
                k < lines.length &&
                significant.length < 8
              )
                stripped = lines[k].strip

                unless (
                  stripped.empty? ||
                  stripped.start_with?('#')
                )
                  significant << [
                    k,
                    stripped,
                    lines[k][/^\s*/]
                  ]
                end

                k += 1
              end

              end_index = nil

              if (
                significant.length >= 7 &&
                significant[0][1] == 'Graphics.update' &&
                significant[1][1] == 'Input.update' &&
                significant[2][1] == 'update' &&
                significant[3][1] == 'if $scene != self' &&
                significant[4][1] == 'break' &&
                significant[5][1] == 'end' &&
                significant[6][1] == 'end' &&
                significant[6][2] == indent
              )
                end_index = significant[6][0]

              elsif (
                significant.length >= 5 &&
                significant[0][1] == 'Graphics.update' &&
                significant[1][1] == 'Input.update' &&
                significant[2][1] == 'update' &&
                significant[3][1] == 'break if $scene != self' &&
                significant[4][1] == 'end' &&
                significant[4][2] == indent
              )
                end_index = significant[4][0]
              end

              if end_index != nil
                lines[i..end_index] = [
                  indent +
                  "end\n\n" +
                  indent +
                  "def dispose\n"
                ]

                changed += 1
                i += 1
                next
              end

              i += 1
            end

            [
              lines.join,
              changed
            ]
          end

          scene_loop_count = 0
          begin_until_count = 0

          # ========================================================
          # First make the actual game scripts web-compatible.
          # ========================================================

          scripts.each do |entry|
            next unless (
              entry.is_a?(Array) &&
              entry.length >= 3
            )

            name = entry[1].to_s

            begin
              source = Zlib::Inflate.inflate(
                entry[2]
              )
            rescue
              next
            end

            patched = source.dup

            patched, count = patch_begin_until(
              patched
            )

            begin_until_count += count

            unless name == 'Main'
              patched, count = patch_scene_loops(
                patched
              )

              scene_loop_count += count
            end

            if name == 'Main'
              browser_loop = <<'RUBY'
          $prev_scene = nil

          def main_update_loop

            if $sl_boot_error
              sl_boot_error_screen
              Graphics.update
              Input.update
              return
            end

            begin

              if $scene != nil

                $sl_boot_stage =
                  "runtime:" +
                  $scene.class.to_s

                if $scene != $prev_scene

                  if (
                    $prev_scene != nil &&
                    $prev_scene.respond_to?(:dispose)
                  )
                    $prev_scene.dispose
                  end

                  $scene.main
                  $prev_scene = $scene
                end

                Graphics.update
                Input.update
                $scene.update

              else
                raise "END"
              end

            rescue Exception => e

              $sl_boot_error =
                $sl_boot_stage.to_s +
                " | " +
                e.class.to_s +
                " | " +
                e.message.to_s

              puts(
                "SLBOOTERR|" +
                $sl_boot_error
              )

              sl_boot_error_screen
            end
          end
          RUBY

              unless patched.include?(
                'def main_update_loop'
              )
                patched =
                  browser_loop +
                  patched
              end

              patched.sub!(
                /\n\s*while\s+\$scene\s*!=\s*nil\s*\r?\n\s*\$scene\.main\s*\r?\n\s*end\s*/m,
                "\n"
              )
            end

            entry[2] =
              Zlib::Deflate.deflate(
                patched
              )
          end

          main = scripts.find do |entry|
            entry[1].to_s == 'Main'
          end

          abort 'Main script missing' \
            if main == nil

          main_source =
            Zlib::Inflate.inflate(
              main[2]
            )

          abort 'main_update_loop injection failed' \
            unless main_source.include?(
              'def main_update_loop'
            )

          # ========================================================
          # This script ALWAYS loads first.
          #
          # Even if an SLKnight script crashes while loading,
          # main_update_loop still exists and can draw the error.
          # ========================================================

          boot_guard = <<'RUBY'
          $sl_boot_error = nil
          $sl_boot_stage = "starting"
          $sl_boot_error_sprite = nil
          $sl_boot_error_bitmap = nil

          def sl_boot_error_screen

            return if $sl_boot_error_sprite != nil

            begin

              bitmap = Bitmap.new(
                640,
                480
              )

              bitmap.fill_rect(
                0,
                0,
                640,
                480,
                Color.new(
                  0,
                  0,
                  0,
                  255
                )
              )

              bitmap.font.size = 20

              bitmap.font.color =
                Color.new(
                  255,
                  255,
                  255,
                  255
                )

              bitmap.draw_text(
                16,
                16,
                608,
                32,
                "SLKnight WEB BOOT ERROR"
              )

              text =
                $sl_boot_error.to_s

              y = 64
              start = 0

              while (
                start < text.length &&
                y < 450
              )
                bitmap.draw_text(
                  16,
                  y,
                  608,
                  28,
                  text[
                    start,
                    58
                  ].to_s
                )

                start += 58
                y += 30
              end

              sprite = Sprite.new
              sprite.bitmap = bitmap
              sprite.z = 999999

              $sl_boot_error_bitmap =
                bitmap

              $sl_boot_error_sprite =
                sprite

              begin
                Graphics.transition(0)
              rescue Exception
              end

            rescue Exception => e

              puts(
                "SLBOOTSCREENERR|" +
                e.class.to_s +
                "|" +
                e.message.to_s
              )
            end
          end

          def main_update_loop

            if $sl_boot_error
              sl_boot_error_screen
            end

            Graphics.update
            Input.update
          end
          RUBY

          wrapped_scripts = [
            [
              0,
              'Web Boot Guard',
              Zlib::Deflate.deflate(
                boot_guard
              )
            ]
          ]

          # ========================================================
          # Each original script is run inside a rescue.
          #
          # If one fails:
          #
          # load:SCRIPT_NAME | ErrorClass | message
          #
          # is stored instead of allowing mkxp-web to die silently.
          # ========================================================

          scripts.each do |entry|
            next unless (
              entry.is_a?(Array) &&
              entry.length >= 3
            )

            name = entry[1].to_s

            begin
              source =
                Zlib::Inflate.inflate(
                  entry[2]
                )
            rescue
              next
            end

            wrapper = <<RUBY
          unless $sl_boot_error

            $sl_boot_stage =
              "load:" +
              #{name.dump}

            begin

              eval(
                #{source.dump}
              )

            rescue Exception => e

              $sl_boot_error =
                $sl_boot_stage.to_s +
                " | " +
                e.class.to_s +
                " | " +
                e.message.to_s

              puts(
                "SLBOOTERR|" +
                $sl_boot_error
              )
            end

          end
          RUBY

            wrapped_scripts << [
              entry[0],
              name,
              Zlib::Deflate.deflate(
                wrapper
              )
            ]
          end

          target_scripts =
            File.join(
              game_dir,
              'Data',
              'Scripts.rxdata'
            )

          File.binwrite(
            target_scripts,
            Marshal.dump(
              wrapped_scripts
            )
          )

          unless (
            File.expand_path(scripts_path) ==
            File.expand_path(target_scripts)
          )
            File.delete(
              scripts_path
            )
          end

          ini_lines =
            ini.split(/\r?\n/)

          ini_lines.map! do |line|

            if line =~ /^Scripts=/i
              'Scripts=Data\Scripts.rxdata'

            elsif line =~ /^Title=/i
              'Title=SLKnight'

            else
              line
            end
          end

          File.binwrite(
            ini_path,
            ini_lines.join("\r\n") +
            "\r\n"
          )

          puts(
            "SCENE_LOOPS_PATCHED=" +
            scene_loop_count.to_s
          )

          puts(
            "BEGIN_UNTIL_PATCHED=" +
            begin_until_count.to_s
          )

          puts(
            "WRAPPED_SCRIPTS=" +
            wrapped_scripts.length.to_s
          )

          puts(
            "SLKNIGHT_BOOT_TRAP_V7_OK"
          )
          RB

      - name: Verify trapped script archive
        run: |
          set -e

          test -s \
            player/gameasync/Data/Scripts.rxdata

          grep -Fq \
            'Scripts=Data\Scripts.rxdata' \
            player/gameasync/Game.ini

          ruby -rzlib - <<'RB'
          scripts =
            Marshal.load(
              File.binread(
                'player/gameasync/Data/Scripts.rxdata'
              )
            )

          abort 'Boot Guard missing' \
            unless (
              scripts[0] &&
              scripts[0][1] ==
              'Web Boot Guard'
            )

          guard =
            Zlib::Inflate.inflate(
              scripts[0][2]
            )

          abort 'Fallback loop missing' \
            unless guard.include?(
              'def main_update_loop'
            )

          main =
            scripts.find do |entry|
              entry[1].to_s == 'Main'
            end

          abort 'Wrapped Main missing' \
            if main == nil

          main_source =
            Zlib::Inflate.inflate(
              main[2]
            )

          abort 'Boot trap missing from Main' \
            unless main_source.include?(
              'SLBOOTERR'
            )

          puts(
            "BOOT_TRAP_ARCHIVE_VERIFY_OK"
          )
          RB

      - name: Convert audio to OGG
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          root = Path("player/gameasync/Audio")

          if not root.exists():
              print("AUDIO_DIRECTORY_NOT_PRESENT")
              raise SystemExit(0)

          convertible = {
              ".mp3",
              ".wav",
              ".wma",
              ".aac",
              ".m4a",
              ".flac",
              ".mid",
              ".midi",
          }

          midi_exts = {
              ".mid",
              ".midi",
          }

          files = [
              path
              for path in root.rglob("*")
              if path.is_file()
              and path.suffix.lower() in convertible
          ]

          print(
              "AUDIO_FILES_TO_CONVERT="
              + str(len(files))
          )

          converted = 0
          failures = []

          for src in files:
              ext = src.suffix.lower()
              out = src.with_suffix(".ogg")
              temp_wav = None

              try:
                  source_for_ffmpeg = src

                  if ext in midi_exts:
                      temp_wav = src.with_name(
                          src.name + ".mkxpweb.wav"
                      )

                      subprocess.run(
                          [
                              "timidity",
                              str(src),
                              "-Ow",
                              "-o",
                              str(temp_wav),
                          ],
                          check=True,
                      )

                      source_for_ffmpeg = temp_wav

                  subprocess.run(
                      [
                          "ffmpeg",
                          "-nostdin",
                          "-v",
                          "error",
                          "-y",
                          "-i",
                          str(source_for_ffmpeg),
                          "-c:a",
                          "libvorbis",
                          "-q:a",
                          "4",
                          str(out),
                      ],
                      check=True,
                  )

                  if (
                      not out.exists()
                      or out.stat().st_size == 0
                  ):
                      raise RuntimeError(
                          "OGG output missing: "
                          + str(out)
                      )

                  if (
                      temp_wav is not None
                      and temp_wav.exists()
                  ):
                      temp_wav.unlink()

                  if src.exists() and src != out:
                      src.unlink()

                  converted += 1

              except Exception as exc:
                  failures.append(
                      (
                          str(src),
                          str(exc),
                      )
                  )

                  if (
                      temp_wav is not None
                      and temp_wav.exists()
                  ):
                      temp_wav.unlink()

          if failures:
              print(
                  "AUDIO CONVERSION FAILURES:",
                  file=sys.stderr,
              )

              for name, error in failures:
                  print(
                      name
                      + " -> "
                      + error,
                      file=sys.stderr,
                  )

              raise SystemExit(1)

          print(
              "AUDIO_CONVERTED="
              + str(converted)
          )

          print(
              "AUDIO_CONVERSION_OK"
          )
          PY

      - name: Convert unsupported images to PNG
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          root = Path(
              "player/gameasync/Graphics"
          )

          if not root.exists():
              print(
                  "GRAPHICS_DIRECTORY_NOT_PRESENT"
              )
              raise SystemExit(0)

          convertible = {
              ".bmp",
              ".gif",
              ".webp",
              ".tif",
              ".tiff",
          }

          files = [
              path
              for path in root.rglob("*")
              if path.is_file()
              and path.suffix.lower() in convertible
          ]

          print(
              "IMAGE_FILES_TO_CONVERT="
              + str(len(files))
          )

          converted = 0
          failures = []

          for src in files:
              out = src.with_suffix(
                  ".png"
              )

              try:
                  subprocess.run(
                      [
                          "convert",
                          str(src) + "[0]",
                          str(out),
                      ],
                      check=True,
                  )

                  if (
                      not out.exists()
                      or out.stat().st_size == 0
                  ):
                      raise RuntimeError(
                          "PNG output missing: "
                          + str(out)
                      )

                  src.unlink()
                  converted += 1

              except Exception as exc:
                  failures.append(
                      (
                          str(src),
                          str(exc),
                      )
                  )

          if failures:
              print(
                  "IMAGE CONVERSION FAILURES:",
                  file=sys.stderr,
              )

              for name, error in failures:
                  print(
                      name
                      + " -> "
                      + error,
                      file=sys.stderr,
                  )

              raise SystemExit(1)

          print(
              "IMAGES_CONVERTED="
              + str(converted)
          )

          print(
              "IMAGE_CONVERSION_OK"
          )
          PY

      - name: Generate async filesystem mapping
        run: |
          set -e

          cd player/gameasync

          bash \
            ../../mkxp-tools/extra/make_mapping.sh

          test -s mapping.js
          test -s bitmap-map.js

          echo "MAPPING_OK"

      - name: Create map preload files
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          data_root = Path(
              "player/gameasync/Data"
          )

          preload_root = Path(
              "player/preload/Data"
          )

          preload_root.mkdir(
              parents=True,
              exist_ok=True,
          )

          count = 0

          for source in sorted(
              data_root.glob(
                  "Map*.rxdata"
              )
          ):
              target = (
                  preload_root
                  /
                  (
                      source.name
                      + ".json"
                  )
              )

              target.write_text(
                  "[]\n",
                  encoding="utf-8",
              )

              count += 1

          print(
              "MAP_PRELOAD_FILES="
              + str(count)
          )
          PY

      - name: Add browser error display and V7 badge
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "player/index.html"
          )

          html = path.read_text(
              encoding="utf-8"
          )

          debug_script = r'''
          <script>
          (function () {

              function makeBadge() {
                  var badge =
                      document.getElementById(
                          'sl-v7-badge'
                      );

                  if (badge) {
                      return;
                  }

                  badge =
                      document.createElement(
                          'div'
                      );

                  badge.id =
                      'sl-v7-badge';

                  badge.textContent =
                      'V7';

                  badge.style.position =
                      'fixed';

                  badge.style.top =
                      '6px';

                  badge.style.right =
                      '6px';

                  badge.style.zIndex =
                      '99999998';

                  badge.style.background =
                      'rgba(0,0,0,0.65)';

                  badge.style.color =
                      'white';

                  badge.style.padding =
                      '4px 7px';

                  badge.style.font =
                      '12px monospace';

                  badge.style.borderRadius =
                      '4px';

                  document.body.appendChild(
                      badge
                  );
              }

              function makePanel() {
                  var panel =
                      document.getElementById(
                          'sl-debug'
                      );

                  if (panel) {
                      return panel;
                  }

                  panel =
                      document.createElement(
                          'pre'
                      );

                  panel.id =
                      'sl-debug';

                  panel.style.position =
                      'fixed';

                  panel.style.left =
                      '8px';

                  panel.style.top =
                      '32px';

                  panel.style.right =
                      '8px';

                  panel.style.maxHeight =
                      '65vh';

                  panel.style.overflow =
                      'auto';

                  panel.style.zIndex =
                      '99999999';

                  panel.style.padding =
                      '12px';

                  panel.style.margin =
                      '0';

                  panel.style.background =
                      'rgba(0,0,0,0.94)';

                  panel.style.color =
                      'white';

                  panel.style.fontSize =
                      '14px';

                  panel.style.fontFamily =
                      'monospace';

                  panel.style.whiteSpace =
                      'pre-wrap';

                  panel.style.display =
                      'none';

                  document.body.appendChild(
                      panel
                  );

                  return panel;
              }

              function showLine(
                  value,
                  force
              ) {
                  var text =
                      String(value);

                  if (
                      !force &&
                      !(
                          /SLBOOT/i.test(text) ||
                          / - err/i.test(text) ||
                          /NO SUCH FILE/i.test(text) ||
                          /PHYSFS/i.test(text) ||
                          /failed/i.test(text) ||
                          /exception/i.test(text) ||
                          /error/i.test(text)
                      )
                  ) {
                      return;
                  }

                  var panel =
                      makePanel();

                  panel.style.display =
                      'block';

                  var current =
                      panel.textContent || '';

                  if (current) {
                      current += '\n';
                  }

                  current += text;

                  if (
                      current.length >
                      8000
                  ) {
                      current =
                          current.slice(
                              -8000
                          );
                  }

                  panel.textContent =
                      current;
              }

              document.addEventListener(
                  'DOMContentLoaded',
                  makeBadge
              );

              window.slDebugLine =
                  function (text) {
                      showLine(
                          text,
                          false
                      );
                  };

              var originalLog =
                  console.log.bind(
                      console
                  );

              console.log =
                  function () {
                      var args =
                          Array.prototype.slice.call(
                              arguments
                          );

                      originalLog.apply(
                          console,
                          args
                      );

                      showLine(
                          args.join(' '),
                          false
                      );
                  };

              var originalError =
                  console.error.bind(
                      console
                  );

              console.error =
                  function () {
                      var args =
                          Array.prototype.slice.call(
                              arguments
                          );

                      originalError.apply(
                          console,
                          args
                      );

                      showLine(
                          args.join(' '),
                          true
                      );
                  };

              window.addEventListener(
                  'error',
                  function (event) {
                      showLine(
                          'JS ERROR | '
                          + event.message,
                          true
                      );
                  }
              );

              window.addEventListener(
                  'unhandledrejection',
                  function (event) {
                      showLine(
                          'PROMISE ERROR | '
                          + String(
                              event.reason
                          ),
                          true
                      );
                  }
              );

              window.alert =
                  function (message) {
                      showLine(
                          'ENGINE ERROR | '
                          + String(message),
                          true
                      );
                  };

          })();
          </script>
          '''

          html = html.replace(
              "<head>",
              "<head>\n" + debug_script,
              1,
          )

          html, namespace_count = re.subn(
              r"var namespace = '[^']*';",
              "var namespace = 'slknight_boottrap_v7';",
              html,
              count=1,
          )

          html, title_count = re.subn(
              r"var wTitle = '[^']*'\s*;?",
              "var wTitle = 'SLKnight';",
              html,
              count=1,
          )

          html = html.replace(
              "<title>MKXP</title>",
              "<title>SLKnight V7</title>",
              1,
          )

          if namespace_count != 1:
              raise SystemExit(
                  "namespace patch failed"
              )

          if title_count != 1:
              raise SystemExit(
                  "title patch failed"
              )

          path.write_text(
              html,
              encoding="utf-8",
          )

          print(
              "BROWSER_ERROR_DISPLAY_OK"
          )
          PY

          touch player/.nojekyll

      - name: Verify final V7 package
        run: |
          set -e

          test -s player/index.html
          test -s player/mkxp.js
          test -s player/mkxp.wasm

          test -s player/js/drive.js
          test -s player/js/dpad.js
          test -s player/js/localforage.min.js

          test -s player/gameasync/Game.ini
          test -s player/gameasync/rgss.rb

          test -s player/gameasync/mapping.js
          test -s player/gameasync/bitmap-map.js

          test -s \
            player/gameasync/Data/Scripts.rxdata

          grep -Fq \
            "slknight_boottrap_v7" \
            player/index.html

          grep -Fq \
            "sl-v7-badge" \
            player/index.html

          grep -Fq \
            "slDebugLine" \
            player/index.html

          test "$(stat -c '%s' player/mkxp.js)" = "290574"
          test "$(stat -c '%s' player/mkxp.wasm)" = "5217852"

          rm -rf player/.git

          echo
          echo "========================================"
          echo " SLKNIGHT BOOT TRAP V7 READY"
          echo "========================================"
          echo

          du -sh player

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player

  deploy:
    name: Deploy GitHub Pages

    needs:
      - build

    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
