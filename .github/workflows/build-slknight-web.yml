
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R38
# BASE: deployed V229R37, GitHub Actions run 39364651925
# AUDIO ONLY: knight BGM at 40% of R37; BGS and all other SE preserved.
# Silence ONLY Audio/SE/대장간 소리.ogg and 대장간 소리2.ogg using a valid
# Ogg Vorbis silent sample. Do not remove assets or change event commands.
# Maps, Baphomet, all-stairs test, movement, combat, and runtime unchanged.
name: build-slknight-web.yml | V229R38 | Clean Native Events and 2x Terrain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: V229R38 Restore exactly deployed V229R37
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39364651925
          name: github-pages
          github-token: ${{ github.token }}
          path: r37

      - name: V229R38 Verify unchanged source and snapshot hashes
        shell: bash
        run: |
          set -euo pipefail
          test -s r37/artifact.tar
          mkdir -p site build
          tar -xf r37/artifact.tar -C site
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          g=root/'knight/gameasync'
          known={
            'Data/Scripts.rxdata':'f249b698ae6d1c72535ae2b12559e8bb10494657febc67ba0b23195944f4f7d0',
            f'Data/{pre}Map045.rxdata':'d9dc66271e48f051b0d35a2dce109777a14fd396f87fcd7d0e76b044b482e3ba',
            f'Data/{pre}Map046.rxdata':'c3f4cee70c9aff3459245727ccd49403079caa959aeebf00cf9eed99fb852059',
            'Audio/SE/대장간 소리.ogg':'c6ebfdac1b18ecfc6393d08ea23240a18efd6d618db5dd206f0179c91d3f7097',
            'Audio/SE/대장간 소리2.ogg':'573492eeb6bc5d691123fc38d20a01d62264e2cbd3fda419e12951bf27d53a4d',
          }
          for rel,digest in known.items():
            assert hashlib.sha256((g/rel).read_bytes()).hexdigest()==digest,rel
          assert 'V229R37' in (root/'index.html').read_text(encoding='utf-8')
          assert 'V229R37' in (root/'knight/index.html').read_text(encoding='utf-8')
          bridge=(root/'knight/index.html').read_text(encoding='utf-8')
          assert bridge.count("var gain=k==='BGS'?0.20:1;")==1
          src={str(f.relative_to(root)):hashlib.sha256(f.read_bytes()).hexdigest()
               for f in root.rglob('*') if f.is_file()}
          assert len(src)==5472,len(src)
          (Path('build')/'r37-original-hashes.json').write_text(json.dumps(src,sort_keys=True),encoding='utf-8')
          print('PASS: exact deployed R37, 5472 source files, Map045/046 and all audio present')
          PY_BASE

