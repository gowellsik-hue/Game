
name: V210 | Fairy Actual Hit and Bow Range - Preserve Knight V209

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Restore published V209 without expiring artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_RESTORE'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          import hashlib, json, re, time

          BASE = "https://gowellsik-hue.github.io/Game/"
          ROOT = Path("site")
          FIXED = ("index.html", "COPYING-mkxp-web.txt",
                   "manifest.webmanifest", "mkxp.js", "mkxp.wasm",
                   "js/drive.js", "js/dpad.js", "js/localforage.min.js")
          LOCK = {
              "index.html": "cb972e363a37790bef24aafceae5bd12aaa686934acc4a4c052402006341a3ba",
              "knight/index.html": "38b008e7e31b5a7f8eee1aac255641adf1c38a6927ecd8a2b4a29e71e7f1b8a4",
              "elf/index.html": "933cb376a3eededa7ca9b54ad45458e4bae3a65dafde8d5f9f72ffdc09a59c99",
              "knight/gameasync/mapping.js": "764453d72365622f63b84f7af52e93c909b00d4092b7445ed17408e3ca15cac9",
              "elf/gameasync/mapping.js": "dd3bc6f82fe2347994969523e03f47824ce719d59db4840d71cd93a099ca9bde",
              "knight/gameasync/bitmap-map.js": "f9f29fca97904ad924d32b5a743931fb166beddc7fa2f2ceacc4259e8500cf45",
              "elf/gameasync/bitmap-map.js": "a17996d5aee6bf4767ef06dd499b35d3de10214e8d5bfd83ed0654c6fb0b8c26",
              "knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata":
                  "38c1c0a4e4fe0641cbdceaf3e8b9c993b9835579a4112ddfcbaad045268d1ec8",
              "knight/gameasync/Data/Scripts.rxdata": "8966a677a9789f3e9c95a058659dcf22b51d98fb1c68dd946a4e6879cf2bbaec",
              "elf/gameasync/Data/Scripts.rxdata": "aaf22afd7d90bacd6586d9a1171e3af1ee9b067730d5d30170eb09b84420263e",
          }
          LOCK.update({
              "elf/COPYING-mkxp-web.txt": "8177f97513213526df2cf6184d8ff986c675afb514d4e68a404010521b880643",
              "elf/js/dpad.js": "52e1b860e2ad9c3f6194d7cf983bcf6fa1a43354650d71fd9fd11984761cde69",
              "elf/js/drive.js": "d93e3f623b11c3f0a7349ac267961e8fdb202dca6fb17d07465f10a386a85b1f",
              "elf/js/localforage.min.js": "1ff66c1e32922549d0c824076703e69fb5535857934c8faa8023f51a4881f732",
              "elf/manifest.webmanifest": "b5a68325f50f2a4eb99242270160d56094bd6365920396964875d64535b5e806",
              "elf/mkxp.js": "c768aa2a62dfae5ee019668e31d2e55b04a176c529daae6a5a4393c1db21ae9d",
              "elf/mkxp.wasm": "83f6138820a3587ec569bca801d3032ec39edfda1cb49fbb90ab3928821966bd",
              "knight/COPYING-mkxp-web.txt": "8177f97513213526df2cf6184d8ff986c675afb514d4e68a404010521b880643",
              "knight/js/dpad.js": "c137842818acf76a036127a0ffbae88e22affcba78ca70c3f1b4c76b52f86908",
              "knight/js/drive.js": "d93e3f623b11c3f0a7349ac267961e8fdb202dca6fb17d07465f10a386a85b1f",
              "knight/js/localforage.min.js": "1ff66c1e32922549d0c824076703e69fb5535857934c8faa8023f51a4881f732",
              "knight/manifest.webmanifest": "b5a68325f50f2a4eb99242270160d56094bd6365920396964875d64535b5e806",
              "knight/mkxp.js": "c768aa2a62dfae5ee019668e31d2e55b04a176c529daae6a5a4393c1db21ae9d",
              "knight/mkxp.wasm": "83f6138820a3587ec569bca801d3032ec39edfda1cb49fbb90ab3928821966bd",
          })

          def fetch(url):
              for attempt in range(6):
                  try:
                      req = Request(url, headers={"User-Agent": "V210-Snapshot-Recovery/1.0",
                                                  "Accept-Encoding": "identity"})
                      with urlopen(req, timeout=60) as response:
                          return response.read()
                  except HTTPError as exc:
                      if exc.code not in (408, 425, 429, 500, 502, 503, 504):
                          raise
                      if attempt == 5:
                          raise
                  except (URLError, TimeoutError):
                      if attempt == 5:
                          raise
                  time.sleep(1 + 2 * attempt)
              raise RuntimeError("Download exhausted: " + url)

          def download(job):
              name, url, md5 = job
              content = fetch(url)
              actual = hashlib.md5(content).hexdigest()
              if md5 and actual != md5:
                  raise RuntimeError(f"Asset mismatch: {name} ({actual} != {md5})")
              p = ROOT / name
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(content)
              return name

          ROOT.mkdir(exist_ok=True)
          files = {}
          files["index.html"] = (BASE + "index.html", None)
          for game in ("knight", "elf"):
              for rel in FIXED:
                  files[f"{game}/{rel}"] = (BASE + game + "/" + quote(rel, safe="/"), None)
              mapping_name = f"{game}/gameasync/mapping.js"
              mapping_bytes = fetch(BASE + mapping_name + "?v=v210-restore")
              (ROOT / mapping_name).parent.mkdir(parents=True, exist_ok=True)
              (ROOT / mapping_name).write_bytes(mapping_bytes)
              text = mapping_bytes.decode("utf-8")
              body = text.split("var mappingArray = ", 1)[1].split("];", 1)[0] + "]"
              mapping = json.loads(re.sub(r",\s*\]$", "]", body))
              for name, mapped in mapping:
                  rel, sep, digest = mapped.partition("?h=")
                  if "." not in Path(rel).name:
                      continue
                  out = game + "/gameasync/" + rel
                  if out in files:
                      raise RuntimeError("Repeated mapped path: " + out)
                  url = BASE + game + "/gameasync/" + quote(rel, safe="/")
                  if sep:
                      url += "?h=" + digest
                  expected = digest if (sep and Path(rel).name not in ("mapping.js", "bitmap-map.js")) else None
                  files[out] = (url, expected)

          if len(files) != 5355:
              raise RuntimeError(f"V209 manifest differs: {len(files)} files, expected 5355")

          jobs = [(name, url, md5) for name, (url, md5) in files.items()
                  if not (ROOT / name).exists()]
          print(f"Restoring {len(jobs)} published files, checking {len(files)} paths", flush=True)
          errors = []
          with ThreadPoolExecutor(max_workers=20) as pool:
              futures = {pool.submit(download, job): job[0] for job in jobs}
              for i, done in enumerate(as_completed(futures), 1):
                  try:
                      done.result()
                  except Exception as exc:
                      errors.append(str(exc))
                  if i % 250 == 0 or i == len(futures):
                      print(f"Downloaded {i}/{len(futures)}, errors={len(errors)}", flush=True)
          if errors:
              raise SystemExit("Mirror failed: " + " | ".join(errors[:8]))
          actual_files = {str(p.relative_to(ROOT)) for p in ROOT.rglob("*") if p.is_file()}
          if actual_files != set(files):
              raise SystemExit("V209 mirror incomplete or contains extra paths")
          for name, digest in LOCK.items():
              actual = hashlib.sha256((ROOT / name).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"V209 source version mismatch: {name} {actual} != {digest}")
          print("V210_COMPLETE_V209_SITE_RESTORED_AND_LOCKED", len(files), flush=True)
          PY_RESTORE
          cp site/elf/gameasync/Data/Scripts.rxdata /tmp/v210_original_scripts.rxdata
          python3 - <<'PY_LOCK'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          original={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if len(original)!=5355:raise SystemExit('V209 file set changed')
          Path('/tmp/v210_protected.json').write_text(json.dumps(original))
          print('V210_BASELINE_LOCKED',len(original))
          PY_LOCK

      - name: Fix Fairy target raycast and accumulated damage only
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v210_patch.rb <<'RB_PATCH'
          # encoding: utf-8
          require 'zlib'
          path = ARGV.fetch(0)
          scripts = Marshal.load(File.binread(path))
          list = scripts.select{|e|e.is_a?(Array) && e[1].to_s == 'SLFairy All Monster Attack and Motion V206'}
          abort "Expected V206 exactly once: #{list.size}" unless list.size==1
          entry=list.fetch(0)
          s = Zlib::Inflate.inflate(entry[2]).force_encoding('UTF-8')

          weapon_needle = "      return BOW_RANGE if w.name.to_s =~ /("
          start = s.index(weapon_needle)
          abort 'Weapon name detection anchor missing' unless start
          last = s.index("\n",start)
          weapon_replacement = <<'WEAPON'
                weapon_name = w.name.to_s.dup
                weapon_name.force_encoding('UTF-8') if weapon_name.respond_to?(:force_encoding)
                return BOW_RANGE if weapon_name.include?('활') || weapon_name.include?('궁') || weapon_name.include?('보우') || weapon_name.downcase.include?('bow')
          WEAPON
          s[start..last] = weapon_replacement

          old = <<'OLD'
            def self.find(player, triggers)
          OLD
          replacement = <<'NEW'
            # Arrow line-of-sight uses terrain, not character walking collision.
            def self.terrain_open?(map, x, y, direction)
              return false unless map.valid?(x, y)
              mask = (1 << (direction / 2 - 1)) & 0x0f
              [2, 1, 0].each do |layer|
                tile = map.data[x, y, layer]
                return false if tile.nil?
                passage = map.passages[tile]
                return false if passage.nil? || (passage & mask) != 0 || (passage & 0x0f) == 0x0f
                return true if map.priorities[tile] == 0
              end
              true
            end

            def self.find(player, triggers)
          NEW
          abort 'find anchor not unique' unless s.scan(old).size==1
          s.sub!(old,replacement)

          old = <<'OLD'
                break unless $game_map.passable?(x, y, dir)
                break unless $game_map.passable?(nx, ny, 10 - dir, selected && selected[0])
          OLD
          new = <<'NEW'
                break unless terrain_open?($game_map, x, y, dir)
                break unless terrain_open?($game_map, nx, ny, 10 - dir)
          NEW
          abort 'old path check not unique' unless s.scan(old).size==1
          s.sub!(old,new)

          changes = {
            '$game_variables[spec[0]] = $game_variables[spec[0]] - total' => '$game_variables[spec[0]] = $game_variables[spec[0]] + total',
            "@shot_result = hit ? 'HIT' : 'MISS'" => "@shot_result = hit ? ('HIT ' + total.to_s) : 'MISS'",
            "puts('SLV206|SHOT|'" => "puts('SLV210|SHOT|'"
          }
          changes.each{|a,b|abort "Expected once: #{a}" unless s.scan(a).size==1;s.sub!(a,b)}

          # Report actual weapon ID and effective range when no target is found.
          old = <<'OLD'
                if candidate
                  enemy, distance, spec = candidate
                  return true if SLFairyTargetV206.attack(self, enemy, spec, distance)
                end
          OLD
          new = <<'NEW'
                if candidate
                  enemy, distance, spec = candidate
                  return true if SLFairyTargetV206.attack(self, enemy, spec, distance)
                elsif $scene.is_a?(Scene_Map)
                  frame = Graphics.frame_count
                  if @sl_v210_target_diag.nil? || frame - @sl_v210_target_diag >= 120
                    @sl_v210_target_diag = frame
                    actor = $game_party && $game_party.actors && $game_party.actors[0]
                    weapon_id = actor ? actor.weapon_id.to_i : 0
                    puts('SLV210|NO_TARGET|W'+weapon_id.to_s+'|R'+SLFairyTargetV206.weapon_range.to_s)
                  end
                end
          NEW
          abort 'target hook not unique' unless s.scan(old).size==1
          s.sub!(old,new)

          RubyVM::InstructionSequence.compile(s,'V210 Elf Range and Damage')
          entry[1]='SLFairy Correct Bow Range and Real Damage V210'
          entry[2]=Zlib::Deflate.deflate(s)
          File.binwrite(path, Marshal.dump(scripts))
          puts "V210_ONE_SCRIPT_OK #{s.bytesize} bytes"
          RB_PATCH
          ruby /tmp/v210_patch.rb site/elf/gameasync/Data/Scripts.rxdata

      - name: Refresh only Fairy script hash and cache marker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CACHE'
          from pathlib import Path
          import hashlib,re
          elf=Path('site/elf')
          scripts=elf/'gameasync/Data/Scripts.rxdata'
          mapping=elf/'gameasync/mapping.js'
          page=elf/'index.html'
          md5=hashlib.md5(scripts.read_bytes()).hexdigest()
          code=mapping.read_text(encoding='utf-8')
          regex=r'(\["data/scripts",\s*"Data/Scripts\.rxdata\?h=)[0-9a-f]{32}("\],)'
          updated,num=re.subn(regex,lambda m:m.group(1)+md5+m.group(2),code)
          if num!=1:raise SystemExit('Cannot update Fairy Scripts hash')
          mapping.write_text(updated,encoding='utf-8')
          html=page.read_text(encoding='utf-8')
          for old,new in (
            ('gameasync/mapping.js?v=fairy206','gameasync/mapping.js?v=fairy210'),
            ("box.textContent='V206 '+state","box.textContent='V210 '+state"),
          ):
            if html.count(old)!=1:raise SystemExit('Unrecognized Fairy HTML cache marker: '+old)
            html=html.replace(old,new,1)
          page.write_text(html,encoding='utf-8')
          print('V210_ELF_CACHE_REFRESHED')
          PY_CACHE

      - name: Test actual Ettin hit and two-tile bow range
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v210_smoke.rb <<'RB_SMOKE'
          # encoding: utf-8
          require 'zlib'
          module RPG
           class Map;end
           class Event;attr_reader :name,:pages;end
           class Event::Page;attr_reader :list,:condition,:trigger;end
           class Event::Page::Condition;attr_reader :variable_valid,:variable_id,:variable_value;end
           class Event::Page::Graphic;end
           class EventCommand;attr_reader :code,:parameters;end
           class MoveRoute;end
           class MoveCommand;end
           class AudioFile;end
           class Weapon;attr_accessor :name;end
          end
          class Raw
           def initialize(b);@b=b;end
           def self._load(b);new(b);end
           def _dump(i);@b;end
          end
          class Tone<Raw;end
          class Color<Raw;end
          class Table<Raw;end

          scripts=Marshal.load(File.binread(ARGV.fetch(0)))
          entry=scripts.find{|a|a.is_a?(Array)&&a[1]=='SLFairy Correct Bow Range and Real Damage V210'}
          raise 'combat script missing' unless entry
          src=Zlib::Inflate.inflate(entry[2]).force_encoding('UTF-8')
          module_src=src.split("\nclass Game_Player\n",2).first
          eval(module_src,TOPLEVEL_BINDING,'V210 module')

          class FakeMap
           attr_accessor :need_refresh
           attr_reader :events
           def initialize(events);@events=events;@need_refresh=false;@obstacle=false;end
           def map_id;14;end
           def valid?(x,y);x>=0 && x<20 && y>=0 && y<20;end
           def data;self;end
           def [](*args)
             x,y,z=*args
             (x==1 && y==1 && z==2 && @obstacle) ? 2 : 1
           end
           def passages;[0,0,15];end
           def priorities;[0,0,0];end
           def passable?(*args);false;end
           def obstacle=(b);@obstacle=b;end
          end
          class FakeEvent
           attr_accessor :x,:y,:id,:character_name,:through
           def initialize(raw,page)
            @event=raw;@page=page;@x=2;@y=1;@id=27;@character_name='에틴';@through=false
           end
           def jumping?;false;end
           def screen_x;320;end
           def screen_y;240;end
          end
          class FakePlayer
           attr_accessor :x,:y,:direction,:character_name
           def initialize;@x=0;@y=1;@direction=6;@character_name='여요정';end
          end
          class FakeActor
           attr_accessor :weapon_id
           def initialize(id);@weapon_id=id;end
           def weapon_ids;[@weapon_id];end
          end
          class FakeSystem
           def map_interpreter;self;end
           def running?;false;end
          end
          class Graphics
           def self.frame_count;@frame||=100;end
           def self.frame_count=(n);@frame=n;end
          end

          root='site/elf/gameasync/Data/'
          $data_weapons=Marshal.load(File.binread(root+'VIQLMRLKMVIPVMJHOCSULWPCHOJTMRVIAFODOARHWeapons.rxdata'))
          $data_weapons.compact.each{|w|w.name.force_encoding('UTF-8')}
          actor=FakeActor.new(1)
          $game_party=Struct.new(:actors).new([actor])
          $game_system=FakeSystem.new
          $game_temp=Struct.new(:message_window_showing).new(false)
          $game_variables=Array.new(2000,0)
          $game_variables[385]=100
          $game_variables[619]=5

          rmap=Marshal.load(File.binread(root+'VIQLMRLKMVIPVMJHOCSULWPCHOJTMRVIAFODOARHMap014.rxdata'))
          raw=rmap.instance_variable_get(:@events).fetch(27)
          monster=FakeEvent.new(raw,raw.instance_variable_get(:@pages).fetch(1))
          $game_map=FakeMap.new({27=>monster})
          player=FakePlayer.new

          raise 'bow range fail' unless SLFairyTargetV206.weapon_range==8
          target=SLFairyTargetV206.find(player,[0,1,2])
          raise 'bow attack cannot reach two tiles' unless target && target[0]==monster && target[1]==2
          raise 'wrong damage variable' unless target[2][0]==385

          SLFairyTargetV206.define_singleton_method(:rand){|n|0}
          SLFairyTargetV206.attack(player,monster,target[2],2)
          raise 'damage not accumulated' unless $game_variables[385]==106
          raise 'wrong damage text' unless SLFairyTargetV206.shot_result=='HIT 6'
          raise 'map refresh missing' unless $game_map.need_refresh
          puts 'PASS: RANGED 2 TILES; ACTUAL DAMAGE 100 TO 106'

          $game_map.obstacle=true
          raise 'wall penetration' if SLFairyTargetV206.find(player,[0,1,2])
          $game_map.obstacle=false

          npc=FakeEvent.new(raw,raw.instance_variable_get(:@pages).fetch(1))
          npc.instance_variable_set(:@event,Struct.new(:name).new('NPC'))
          npc.id=99;npc.x=1;npc.y=1;npc.character_name='상인'
          $game_map.events[99]=npc
          raise 'NPC penetration' if SLFairyTargetV206.find(player,[0,1,2])
          $game_map.events.delete(99)

          actor.weapon_id=40
          raise 'melee must be one tile' unless SLFairyTargetV206.weapon_range==1
          raise 'melee attack reached two tiles' if SLFairyTargetV206.find(player,[0,1,2])
          actor.weapon_id=0
          raise 'unarmed range must be one tile' unless SLFairyTargetV206.weapon_range==1
          puts 'V210_TARGET_DAMAGE_NPC_WALL_TESTS_PASSED'
          RB_SMOKE
          ruby /tmp/v210_smoke.rb site/elf/gameasync/Data/Scripts.rxdata

      - name: Verify save data and Knight completely unchanged
        shell: bash
        run: |
          set -euo pipefail
          ruby -rzlib - /tmp/v210_original_scripts.rxdata site/elf/gameasync/Data/Scripts.rxdata <<'RB_CHECK'
          old=Marshal.load(File.binread(ARGV[0]))
          newer=Marshal.load(File.binread(ARGV[1]))
          abort 'Ruby script count changed' unless old.size==newer.size
          change=(0...old.size).select{|i|old[i]!=newer[i]}
          abort "Wrong script modified: #{change.inspect}" unless change.size==1
          a,b=old[change.first],newer[change.first]
          abort 'Wrong original script modified' unless a[1]=='SLFairy All Monster Attack and Motion V206'
          abort 'Wrong target script written' unless b[1]=='SLFairy Correct Bow Range and Real Damage V210'
          code=Zlib::Inflate.inflate(b[2])
          abort 'Still subtracts damage' if code.include?('$game_variables[spec[0]] = $game_variables[spec[0]] - total')
          abort 'Missing actual hit amount' unless code.include?("'HIT ' + total.to_s")
          abort 'Still uses walking collision' if code.include?('break unless $game_map.passable?')
          abort 'Original NPC native logic lost' unless code.include?('sl_fairy_v201_native_there(triggers)')
          ['Scene_Title','Scene_Menu','Scene_Save','Scene_Load','Scene_Map','MOG - S HUD'].each do |name|
            before=old.find{|e|e.is_a?(Array) && e[1]==name}
            after=newer.find{|e|e.is_a?(Array) && e[1]==name}
            abort "Saved/map system changed: #{name}" unless before && after && before==after
          end
          RubyVM::InstructionSequence.compile(code,'V210 full combat')
          puts 'V210_ONLY_FAIRY_TARGET_SCRIPT_CHANGED'
          RB_CHECK

          python3 - <<'PY_SCOPE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          original=json.loads(Path('/tmp/v210_protected.json').read_text())
          current={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                   for p in root.rglob('*') if p.is_file()}
          if current.keys()!=original.keys():
            raise SystemExit('Files added or deleted')
          allowed={'elf/gameasync/Data/Scripts.rxdata','elf/gameasync/mapping.js','elf/index.html'}
          changes={k for k in current if current[k]!=original[k]}
          if changes!=allowed:
            raise SystemExit('Unexpected files changed: '+repr(changes))

          elf=root/'elf'
          mapping=(elf/'gameasync/mapping.js').read_text(encoding='utf-8')
          digest=hashlib.md5((elf/'gameasync/Data/Scripts.rxdata').read_bytes()).hexdigest()
          if 'Data/Scripts.rxdata?h='+digest not in mapping:
            raise SystemExit('Invalid new Scripts mapping')
          html=(elf/'index.html').read_text(encoding='utf-8')
          if 'gameasync/mapping.js?v=fairy210' not in html:
            raise SystemExit('Old browser cache token')
          if 'slfairy_v105_engine' not in html:
            raise SystemExit('Fairy save namespace changed')
          if 'slknight_v14_engine' not in (root/'knight/index.html').read_text(encoding='utf-8'):
            raise SystemExit('Knight save namespace changed')
          print('V210_SCOPE_PASS: KNIGHT + BOTH SAVES UNMODIFIED')
          PY_SCOPE

          node --check site/elf/js/dpad.js
          node --check site/knight/js/dpad.js
          echo V210_LOCAL_TESTS_OK

      - name: Upload GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
