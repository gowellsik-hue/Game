
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V1.1
# BASE: successful run 42124364984
#
# SCOPE:
# - Reuse the existing SLV229::Speed controller.
# - Preserve every polymorph attack-speed value.
# - Preserve existing haste and bravery rates.
# - Preserve attack frames and hit timing.
# - Preserve native Queen recovery and death.
# - Reuse native Holy Walk and Slow status switches.
# - Do not create additional timers or speed hooks.
# - Do not modify CommonEvents or monster data.
# - Apply no unverified Slow status.
# - Fail closed if the existing speed source differs.
#
# FIX:
# - Remove conflicting nested shell/Ruby heredoc delimiters.
# - Use the latest successful game as the unchanged base.
# - Display only V1.1.

name: build-slknight-web.yml | V1.1 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Restore successful game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 42124364984
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify unchanged successful baseline
        shell: bash
        run: |
          set -euo pipefail

          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib
          import json

          root = Path('site')
          files = {
              str(p.relative_to(root)):
                  hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          assert len(files) == 5623, (
              'Baseline file count', len(files)
          )

          pre = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          data = root / 'knight/gameasync/Data'

          required = (
              pre + 'Map019.rxdata',
              pre + 'Map025.rxdata',
              pre + 'CommonEvents.rxdata',
              pre + 'Animations.rxdata',
              'Scripts.rxdata'
          )

          for name in required:
              assert (data / name).is_file(), name

          for name in (
              'index.html',
              'knight/index.html',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js'
          ):
              assert (root / name).is_file(), name

          Path('build/original_sha256.json').write_text(
              json.dumps(files),
              encoding='utf-8'
          )

          print('PASS successful baseline')
          print('PASS 5623 original files')
          PY_BASE

      - name: Apply V1.1 to existing speed controller only
        shell: bash
        run: |
          set -euo pipefail

          cat > build/speed_v11.rb <<'END_V11_SPEED_PATCH'
          require 'zlib'
          require 'digest'

          module RPG
            class CommonEvent; end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
            class AudioFile; end
          end

          def check(condition, message)
            raise message unless condition
          end

          def iv(object, name)
            object.instance_variable_get('@' + name.to_s)
          end

          def native_name(event)
            value = iv(event, :name).to_s.dup
            value.force_encoding('UTF-8')
            value.scrub
          end

          def replace_once(source, before, after, label)
            count = source.scan(
              Regexp.new(Regexp.escape(before))
            ).length

            check(
              count == 1,
              "Source mismatch #{label}: #{count}"
            )

            source.sub(before, after)
          end

          def method_source(source, name)
            pattern = Regexp.new(
              "^    def self\\.#{Regexp.escape(name)}\\n" \
              ".*?^    end",
              Regexp::MULTILINE
            )

            found = source.scan(pattern)

            check(
              found.length == 1,
              "Expected one #{name}: #{found.length}"
            )

            found.first
          end

          pre = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          root = 'site/knight/gameasync/Data/'

          script_path = root + 'Scripts.rxdata'
          common_path = root + pre + 'CommonEvents.rxdata'

          original_common_sha = Digest::SHA256.file(
            common_path
          ).hexdigest

          scripts = Marshal.load(
            File.binread(script_path)
          )

          common = Marshal.load(
            File.binread(common_path)
          )

          original_scripts = Marshal.load(
            Marshal.dump(scripts)
          )

          check(
            common.length == 1069,
            'CommonEvents count changed'
          )

          # Use the existing activation and parallel status.
          # CE800 = Holy Walk cast.
          # CE801 = Holy Walk active status.

          holy_cast = common.fetch(800)
          holy_status = common.fetch(801)

          check(
            native_name(holy_cast).include?('홀리워크'),
            'Holy Walk cast event missing'
          )

          check(
            iv(holy_cast, :trigger).to_i == 0,
            'Holy Walk cast trigger changed'
          )

          check(
            native_name(holy_status).include?('홀리워크'),
            'Holy Walk status event missing'
          )

          check(
            iv(holy_status, :trigger).to_i == 2,
            'Holy Walk status trigger changed'
          )

          holy_switch = iv(
            holy_status, :switch_id
          ).to_i

          check(
            holy_switch > 0,
            'Holy Walk status switch missing'
          )

          # Locate an existing parallel Slow status.
          # Do not create a new Slow timer.
          # Do not use monster attack events as player status.

          slow_candidates = []

          common.each_with_index do |event, id|
            next if id == 0 || event.nil?

            name = native_name(event)

            next unless name.match?(
              /슬로우|\bslow\b/i
            )

            next if name.match?(
              /공격|몬스터|거미/
            )

            next unless iv(
              event, :trigger
            ).to_i == 2

            switch_id = iv(
              event, :switch_id
            ).to_i

            next unless switch_id > 0
            next if switch_id == holy_switch

            slow_candidates << [
              id, switch_id, name
            ]
          end

          # A missing or ambiguous status is left unchanged.
          # No guessed switch number is permitted.

          slow_switches = []

          if slow_candidates.length == 1
            slow_switches = [
              slow_candidates.first[1]
            ]
          end

          puts "Holy Walk status switch: #{holy_switch}"
          puts "Slow candidates: #{slow_candidates.inspect}"

          if slow_switches.empty?
            puts 'NOTICE: Native Slow status not uniquely found'
            puts 'NOTICE: Existing Slow behavior preserved'
          else
            puts "PASS Slow switch #{slow_switches.first}"
          end

          # Find the original speed module.
          # Never insert a second controller.

          matches = scripts.each_index.select do |i|
            row = scripts[i]

            row.is_a?(Array) &&
              row[1] == 'V229 Unified Speed Rules'
          end

          check(
            matches.length == 1,
            'Existing speed controller not unique'
          )

          script_index = matches.first
          entry = scripts.fetch(script_index)

          source = Zlib::Inflate.inflate(
            entry[2]
          )

          check(
            source.scan('module SLV229').length == 1,
            'Existing SLV229 speed module missing'
          )

          check(
            !source.include?(
              'def self.holy_walk_active?'
            ),
            'Holy Walk already modified'
          )

          check(
            !source.include?(
              'def self.slow_active?'
            ),
            'Slow already modified'
          )

          # Protect original attack speed and timing.
          original_morph = method_source(
            source, 'attack_base_rate'
          )

          original_wait = method_source(
            source, 'convert_attack_wait'
          )

          original_tick = method_source(
            source, 'tick'
          )

          original_movement_apply = method_source(
            source, 'apply_movement'
          )

          original_form = method_source(
            source, 'form'
          )

          check(
            original_morph.include?('when :dk52'),
            'Original morph attack values missing'
          )

          check(
            original_wait.include?('attack_rate'),
            'Original attack wait calculation missing'
          )

          # No second timer.
          # No added Game_Player.update override.
          # The native CE status switch owns its duration.

          status_methods = [
            "    HOLY_WALK_STATUS_SWITCH = #{holy_switch}",
            "    SLOW_STATUS_SWITCHES = #{slow_switches.inspect}",
            "",
            "    def self.holy_walk_active?",
            "      return false if $game_switches.nil?",
            "      $game_switches[HOLY_WALK_STATUS_SWITCH] == true",
            "    end",
            "",
            "    def self.slow_active?",
            "      return false if $game_switches.nil?",
            "      SLOW_STATUS_SWITCHES.any? do |id|",
            "        $game_switches[id] == true",
            "      end",
            "    end",
            ""
          ].join("\n") + "\n"

          source = replace_once(
            source,
            "    def self.move_rate\n",
            status_methods + "    def self.move_rate\n",
            'movement method insertion'
          )

          # Retain existing polymorph/haste/bravery factors.
          # Add the two native status factors before returning.
          # Existing apply_movement performs the only conversion.

          old_move = method_source(
            source, 'move_rate'
          )

          check(
            old_move.include?(
              'form == :baphomet ? 1.5 : 1.0'
            ),
            'Original polymorph movement changed'
          )

          check(
            old_move.include?('haste_active?') &&
            old_move.include?('brave_active?'),
            'Original potion movement changed'
          )

          new_move = replace_once(
            old_move,
            "      polymorph_rate\n",
            "      polymorph_rate *= 1.33 if holy_walk_active?\n" +
            "      polymorph_rate *= 0.5 if slow_active?\n" +
            "      polymorph_rate\n",
            'single movement result'
          )

          source = replace_once(
            source,
            old_move,
            new_move,
            'original movement calculation'
          )

          # Preserve all morph-specific attack coefficients.
          # Holy Walk does not change attack speed.
          # Slow applies only inside the original attack_rate.

          old_attack = method_source(
            source, 'attack_rate'
          )

          check(
            old_attack.include?(
              'rate = attack_base_rate'
            ),
            'Original attack base changed'
          )

          check(
            old_attack.include?('HASTE_ATTACK') &&
            old_attack.include?('BRAVE_ATTACK'),
            'Original attack potion factors changed'
          )

          new_attack = replace_once(
            old_attack,
            "      rate\n",
            "      rate *= 0.5 if slow_active?\n" +
            "      rate\n",
            'single attack result'
          )

          source = replace_once(
            source,
            old_attack,
            new_attack,
            'original attack calculation'
          )

          # Verify untouched original functions.
          check(
            source.include?(original_morph),
            'Morph attack rates modified'
          )

          check(
            source.include?(original_wait),
            'Attack frame calculation modified'
          )

          check(
            source.include?(original_tick),
            'Existing timer tick modified'
          )

          check(
            source.include?(original_form),
            'Polymorph selection modified'
          )

          check(
            source.include?(original_movement_apply),
            'Original movement application modified'
          )

          check(
            source.scan(
              'alias slv229_original_update'
            ).length == 1,
            'Game_Player update hook changed'
          )

          check(
            source.scan(
              'alias slv229_original_wait_command'
            ).length == 1,
            'Interpreter attack hook changed'
          )

          # Syntax check the resulting original-plus-minimal source.
          File.binwrite(
            'build/v11_speed_runtime_check.rb',
            source
          )

          check(
            system(
              'ruby',
              '-c',
              'build/v11_speed_runtime_check.rb'
            ),
            'Modified speed source syntax failed'
          )

          # Modify only the original speed script entry.
          entry[2] = Zlib::Deflate.deflate(source)

          modified = scripts.each_index.select do |i|
            scripts[i] != original_scripts[i]
          end

          check(
            modified == [script_index],
            "Unexpected changed script entries: #{modified.inspect}"
          )

          File.binwrite(
            script_path,
            Marshal.dump(scripts)
          )

          # Native spell events must remain byte-identical.
          check(
            Digest::SHA256.file(
              common_path
            ).hexdigest == original_common_sha,
            'Native CommonEvents were modified'
          )

          # Verify saved script, not only the in-memory copy.
          verified = Marshal.load(
            File.binread(script_path)
          )

          verified_source = Zlib::Inflate.inflate(
            verified.fetch(script_index)[2]
          )

          check(
            verified_source.include?(original_morph),
            'Saved morph attack values changed'
          )

          check(
            verified_source.include?(original_wait),
            'Saved attack timing changed'
          )

          check(
            verified_source.include?(original_tick),
            'Saved timer logic changed'
          )

          check(
            verified_source.include?(
              'HOLY_WALK_STATUS_SWITCH'
            ),
            'Holy Walk state connection missing'
          )

          check(
            verified_source.include?(
              'SLOW_STATUS_SWITCHES'
            ),
            'Slow state guard missing'
          )

          puts 'PASS V1.1 original speed script modified'
          puts 'PASS existing native status switches reused'
          puts 'PASS existing morph attack rates unchanged'
          puts 'PASS existing attack frames unchanged'
          puts 'PASS no duplicate timers or runtime hooks'
          puts 'PASS all CommonEvents unchanged'
          END_V11_SPEED_PATCH

          ruby -c build/speed_v11.rb
          ruby build/speed_v11.rb

      - name: Refresh Script hash and display V1.1
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY_CACHE'
          from pathlib import Path
          import hashlib
          import re

          root = Path('site')
          game = root / 'knight/gameasync'
          data = game / 'Data'

          # Only Scripts.rxdata is modified.
          mapping = game / 'mapping.js'
          content = mapping.read_text('utf-8')

          filename = 'Scripts.rxdata'
          digest = hashlib.md5(
              (data / filename).read_bytes()
          ).hexdigest()

          token = (
              re.escape('Data/' + filename) +
              r'\?h=[0-9a-f]{32}'
          )

          content, count = re.subn(
              token,
              'Data/' + filename + '?h=' + digest,
              content
          )

          assert count == 1, (
              'Script mapping mismatch', count
          )

          mapping.write_text(
              content, encoding='utf-8'
          )

          # Display version only.
          # Do not rename the existing loader file.
          loader = root / 'knight/js/sl-assets-v229r115.js'
          loader_text = loader.read_text('utf-8')

          versions = re.findall(
              r"var version='([^']+)';",
              loader_text
          )

          assert len(versions) == 1, (
              'Original display version not unique'
          )

          old_version = versions[0]

          loader_text = loader_text.replace(
              "var version='" + old_version + "';",
              "var version='V1.1';"
          )

          assert (
              loader_text.count("var version='V1.1';") == 1
          )

          loader.write_text(
              loader_text,
              encoding='utf-8'
          )

          for name in ('index.html', 'knight/index.html'):
              path = root / name
              html = path.read_text('utf-8')

              assert old_version in html, (
                  'Original display version missing', name
              )

              html = html.replace(
                  old_version, 'V1.1'
              )

              html = re.sub(
                  r'\?v=v[0-9]+(?:\.[0-9]+)*',
                  '?v=v1.1',
                  html,
                  flags=re.IGNORECASE
              )

              path.write_text(
                  html, encoding='utf-8'
              )

          for name in ('index.html', 'knight/index.html'):
              assert 'V1.1' in (
                  root / name
              ).read_text('utf-8')

          print('PASS V1.1 visible version')
          print('PASS only Script cache hash refreshed')
          PY_CACHE

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Verify V1.1 protected file inventory
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY_FINAL'
          from pathlib import Path
          import hashlib
          import json

          root = Path('site')

          original = json.loads(
              Path('build/original_sha256.json').read_text(
                  encoding='utf-8'
              )
          )

          current = {
              str(p.relative_to(root)):
                  hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          assert len(current) == 5623, (
              'File count changed', len(current)
          )

          assert set(original) == set(current), (
              'Original file inventory changed'
          )

          changed = {
              name for name in original
              if original[name] != current[name]
          }

          allowed = {
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html',
              'knight/index.html'
          }

          assert changed == allowed, (
              'Unexpected modified files',
              sorted(changed ^ allowed)
          )

          for name in ('index.html', 'knight/index.html'):
              assert 'V1.1' in (
                  root / name
              ).read_text('utf-8'), name

          print('PASS V1.1 only five files changed')
          print('PASS native CommonEvents unchanged')
          print('PASS original monster maps unchanged')
          print('PASS original 4-direction collision unchanged')
          print('PASS native Queen recovery and death unchanged')
          print('PASS existing player attack animation unchanged')
          print('PASS original polymorph attack values unchanged')
          print('PASS V1.1 final structural verification')
          PY_FINAL

      - name: Publish V1.1
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
