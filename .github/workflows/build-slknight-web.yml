name: build-slknight-web.yml | V3.13 | Eight Original Characters

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Restore exact successful V3.11 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45364903497
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Restore original SPR audit
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45347986505
          name: audit-sanctuary-monsters-v46-all-spr-audit
          github-token: ${{ github.token }}
          path: audit

      - name: Restore verified SPR coordinate decoder
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: e2dfa04c9aecac1431aaf48637a138bb5b6c9a62
          path: verified-v37

      - name: Verify baseline and all eight character sources
        shell: bash
        run: |
          set -euo pipefail

          test -s baseline/artifact.tar
          mkdir -p site downloads original
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import hashlib
          import csv
          import json

          root=Path('site')

          before={
              str(p.relative_to(root)):hashlib.sha256(
                  p.read_bytes()
              ).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          assert len(before)==6013,len(before)

          loader=root/'knight/js/sl-assets-v229r115.js'

          assert loader.read_text('utf8').count(
              "var version='V3.11';"
          )==1

          for name in ('index.html','knight/index.html'):
              assert 'V3.11' in (root/name).read_text('utf8')

          Path('/tmp/slv313-before.json').write_text(
              json.dumps(before,sort_keys=True),
              'utf8'
          )

          specs=[
              ['남기사','knight_men',3213,3214,4],
              ['여기사','SL13_여기사',3215,3216,4],
              ['남요정','SL13_남요정',3217,3218,4],
              ['여요정','여요정',3474,3475,4],
              ['남법사','법사',3476,3477,4],
              ['여법사','SL8_여법사',3221,3222,8],
              ['남다엘','SL13_남다엘',2786,2787,4],
              ['여다엘','SL8_여다엘',2796,2797,8]
          ]

          ids={
              aid
              for _,_,body,shadow,_ in specs
              for aid in (body,shadow)
          }

          assert len(ids)==16

          manifests=list(
              Path('audit').rglob('SPR-record-audit.csv')
          )

          assert len(manifests)==1,manifests

          with manifests[0].open(
              encoding='utf-8-sig',
              newline=''
          ) as f:
              rows=list(csv.DictReader(f))

          assert len(rows)==158040,len(rows)

          targets=[
              r for r in rows
              if int(r['id']) in ids
          ]

          assert len(targets)==5824,len(targets)

          assert sum(
              int(r['frames'] or 0)
              for r in targets
          )==43988

          selected=[]

          for name,graphic,body,shadow,count in specs:

              for aid in (body,shadow):

                  records=[
                      r for r in targets
                      if int(r['id'])==aid
                  ]

                  print(
                      'SOURCE',
                      name,
                      aid,
                      'records',len(records),
                      'frames',
                      sum(int(r['frames'] or 0) for r in records)
                  )

                  for sub in (5,7,3,1):

                      matches=[
                          r for r in records
                          if r['pak']=='Sprite.pak'
                          and r['sub']==str(sub)
                      ]

                      assert len(matches)==1,(
                          name,aid,sub,len(matches)
                      )

                      r=matches[0]

                      assert r['filename'].lower()==f'{aid}-{sub}.spr'
                      assert r['status']=='visible',r
                      assert int(r['frames'])==count,r
                      assert int(r['visible_frames'])==count,r

                      selected.append(r)

          assert len(selected)==64

          assert len({
              (r['id'],r['sub'])
              for r in selected
          })==64

          assert sum(
              int(r['frames'])
              for r in selected
          )==320

          Path('/tmp/slv313-specs.json').write_text(
              json.dumps(specs,ensure_ascii=False),
              'utf8'
          )

          Path('/tmp/slv313-records.json').write_text(
              json.dumps(selected,ensure_ascii=False),
              'utf8'
          )

          print('PASS all 158040 original audit records inspected')
          print('PASS 16 character SPR IDs')
          print('PASS 5824 target records and 43988 source frames')
          print('PASS 64 unique walking SPR files')
          print('PASS 320 body and shadow walking frames')
          PY

      - name: Restore original SPR archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if gh release download v1.0.0 \
                --repo gowellsik-hue/Game \
                --pattern 'Sanctuary.of.Aden.-.Copy.*' \
                --dir downloads; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            rm -rf downloads
            mkdir -p downloads
            sleep 3
          done

          python3 - <<'PY'
          from pathlib import Path

          base='Sanctuary.of.Aden.-.Copy'

          expected={
              f'{base}.z{i:02d}':100000000
              for i in range(1,46)
          }

          expected[f'{base}.zip']=38808950

          actual={
              p.name:p.stat().st_size
              for p in Path('downloads').iterdir()
              if p.is_file()
          }

          assert actual==expected
          assert sum(actual.values())==4538808950
          PY

          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq p7zip-full
          fi

          7z x downloads/Sanctuary.of.Aden.-.Copy.zip \
            'Sanctuary of Aden - Copy/Sprite.idx' \
            'Sanctuary of Aden - Copy/Sprite.pak' \
            "-o${PWD}/original" \
            -y > original-extract.log

          test -s 'original/Sanctuary of Aden - Copy/Sprite.idx'
          test -s 'original/Sanctuary of Aden - Copy/Sprite.pak'

          rm -rf downloads

          python3 -m venv /tmp/slv313-venv

          /tmp/slv313-venv/bin/python -m pip install \
            --quiet pillow==11.3.0

      - name: Restore existing coordinate decoder
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import ast
          import textwrap

          workflow=Path(
              'verified-v37/.github/workflows/build-slknight-web.yml'
          ).read_text('utf8')

          marker="          cat > /tmp/slv37.py <<'PY3'\n"

          assert workflow.count(marker)==1

          source=workflow.split(
              marker,1
          )[1].split(
              '\n          PY3',1
          )[0]

          source=textwrap.dedent(source)

          classes=[
              node for node in ast.parse(source).body
              if isinstance(node,ast.ClassDef)
              and node.name=='Reader'
          ]

          assert len(classes)==1

          reader=ast.get_source_segment(
              source,
              classes[0]
          )

          assert 'pixels[x+px,y+py]' in reader

          assert reader.count(
              'assert count==4,count'
          )==1

          reader=reader.replace(
              'assert count==4,count',
              'assert count in (4,8),count'
          )

          Path('/tmp/slv313_reader.py').write_text(
              'import struct\n'+reader+'\n',
              'utf8'
          )

          print('PASS original coordinate decoder reused')
          print('PASS existing frame count accepts 4 and 8')
          PY

          /tmp/slv313-venv/bin/python \
            -m py_compile /tmp/slv313_reader.py

      - name: Composite all eight original character sheets
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/slv313_graphics.py <<'PY'
          from pathlib import Path
          from PIL import Image
          from slv313_reader import Reader
          import struct
          import hashlib
          import json
          import re

          root=Path('original/Sanctuary of Aden - Copy')
          game=Path('site/knight/gameasync')

          specs=json.loads(
              Path('/tmp/slv313-specs.json').read_text('utf8')
          )

          records=json.loads(
              Path('/tmp/slv313-records.json').read_text('utf8')
          )

          mapping=(game/'mapping.js').read_text('utf8')

          pak=root/'Sprite.pak'
          idx=root/'Sprite.idx'

          data=idx.read_bytes()

          count=struct.unpack_from('<I',data,0)[0]

          assert len(data)==4+28*count
          assert len(records)==64

          decoded={}

          with pak.open('rb') as f:

              for row in records:

                  aid=int(row['id'])
                  sub=int(row['sub'])
                  entry=int(row['entry'])

                  assert 0<=entry<count

                  pos=4+28*entry

                  offset=struct.unpack_from(
                      '<I',data,pos
                  )[0]

                  filename=data[
                      pos+4:pos+24
                  ].split(
                      b'\0',1
                  )[0].decode('cp949','replace')

                  size=struct.unpack_from(
                      '<I',data,pos+24
                  )[0]

                  assert filename==row['filename']
                  assert offset==int(row['offset'])
                  assert size==int(row['bytes'])
                  assert size>0
                  assert offset+size<=pak.stat().st_size

                  f.seek(offset)
                  raw=f.read(size)

                  assert len(raw)==size

                  assert hashlib.sha256(
                      raw
                  ).hexdigest()==row['sha256']

                  frames=Reader(raw).decode()

                  assert len(frames)==int(row['frames'])
                  assert all(frames)
                  assert (aid,sub) not in decoded

                  decoded[aid,sub]=frames

          assert len(decoded)==64

          assert sum(
              len(frames)
              for frames in decoded.values()
          )==320

          prepared={}
          relative_points=[]

          for name,graphic,body_id,shadow_id,n in specs:

              frames=[]

              for sub in (5,7,3,1):

                  bodies=decoded[body_id,sub]
                  shadows=decoded[shadow_id,sub]

                  assert len(bodies)==len(shadows)==n

                  for col in range(n):

                      body=bodies[col]
                      shadow=shadows[col]

                      x0=min(x for x,y in body)
                      x1=max(x for x,y in body)
                      y0=min(y for x,y in body)
                      y1=max(y for x,y in body)

                      head=[
                          (x,y)
                          for x,y in body
                          if y<y0+12
                      ]

                      assert head

                      ax=(
                          2*sum(x for x,y in head)+len(head)
                      )//(2*len(head))

                      ay=y1+1

                      relative_body={
                          (x-ax,y-ay):rgba
                          for (x,y),rgba in body.items()
                      }

                      relative_shadow={
                          (x-ax,y-ay):rgba
                          for (x,y),rgba in shadow.items()
                      }

                      relative_points.extend(relative_body)
                      relative_points.extend(relative_shadow)

                      frames.append(
                          (sub,col,relative_body,relative_shadow)
                      )

                      print(
                          'FRAME',
                          name,
                          sub,col,
                          'body size',
                          x1-x0+1,y1-y0+1,
                          'body pixels',len(body),
                          'shadow pixels',len(shadow)
                      )

              assert len(frames)==4*n
              prepared[graphic]=frames

          ground=max(
              17,
              max(y for x,y in relative_points)+1
          )

          manifest=[]
          total=0

          for name,graphic,body_id,shadow_id,n in specs:

              frames=prepared[graphic]

              points=[
                  point
                  for _,_,body,shadow in frames
                  for layer in (body,shadow)
                  for point in layer
              ]

              half=max(
                  24,
                  -min(x for x,y in points),
                  max(x for x,y in points)+1
              )

              cw=half*2

              ch=max(
                  96,
                  ground-min(y for x,y in points)
              )

              dx=cw//2
              dy=ch-ground

              result=Image.new(
                  'RGBA',
                  (cw*n,ch*4),
                  (0,0,0,0)
              )

              for row,sub in enumerate((5,7,3,1)):

                  for col in range(n):

                      s,c,body,shadow=frames[row*n+col]

                      assert (s,c)==(sub,col)

                      body_layer=Image.new(
                          'RGBA',(cw,ch),(0,0,0,0)
                      )

                      shadow_layer=Image.new(
                          'RGBA',(cw,ch),(0,0,0,0)
                      )

                      for layer,pixels in (
                          (body_layer,body),
                          (shadow_layer,shadow)
                      ):

                          for (x,y),rgba in pixels.items():

                              xx=x+dx
                              yy=y+dy

                              assert 0<=xx<cw
                              assert 0<=yy<ch

                              layer.putpixel(
                                  (xx,yy),rgba
                              )

                      merged=Image.alpha_composite(
                          shadow_layer,
                          body_layer
                      )

                      for (x,y),rgba in body.items():

                          assert merged.getpixel(
                              (x+dx,y+dy)
                          )==rgba

                      for (x,y),rgba in shadow.items():

                          if (x,y) not in body:

                              assert merged.getpixel(
                                  (x+dx,y+dy)
                              )==rgba

                      assert any(
                          point not in body
                          for point in shadow
                      )

                      result.paste(
                          merged,
                          (col*cw,row*ch)
                      )

                      total+=1

              key='graphics/characters/'+graphic.lower()

              matches=re.findall(
                  r'\["'+re.escape(key)+
                  r'",\s*"([^"]+)\?h=[0-9a-f]{32}"\]',
                  mapping
              )

              if graphic in ('knight_men','여요정','법사'):

                  assert len(matches)==1,(
                      graphic,matches
                  )

                  rel=matches[0]

                  assert (game/rel).is_file()

              else:

                  assert not matches,graphic

                  rel='Graphics/Characters/'+graphic+'.png'

                  assert not (game/rel).exists()

              path=game/rel

              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              result.save(path,optimize=True)

              with Image.open(path) as saved:

                  assert saved.size==(cw*n,ch*4)

                  assert saved.convert(
                      'RGBA'
                  ).tobytes()==result.tobytes()

              manifest.append({
                  'name':name,
                  'graphic':graphic,
                  'relative':rel,
                  'frames':n,
                  'width':cw*n,
                  'height':ch*4
              })

              print(
                  'SHEET',
                  name,
                  'SPR',body_id,shadow_id,
                  'columns',n,
                  'cell',cw,ch,
                  'ground',ground,
                  'scale',1.0
              )

          assert total==160,total

          Path('/tmp/slv313-graphics.json').write_text(
              json.dumps(manifest,ensure_ascii=False),
              'utf8'
          )

          print('PASS 160 merged original walking frames')
          print('PASS all 320 source layers retained')
          print('PASS original pixel sizes retained')
          print('PASS body and shadow share identical translation')
          print('PASS common ground alignment')
          print('PASS no independent shadow centering or scaling')
          PY

          /tmp/slv313-venv/bin/python \
            -m py_compile /tmp/slv313_graphics.py

          /tmp/slv313-venv/bin/python \
            /tmp/slv313_graphics.py

      - name: Reuse existing companions and chasing branches
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/slv313.rb <<'RUBY'
          require 'json'
          require 'digest'
          require 'zlib'

          module RPG
            %w[Actor Item AudioFile CommonEvent EventCommand Event MoveRoute MoveCommand Map].each do |n|
              const_set(n,Class.new) unless const_defined?(n,false)
            end

            Event.const_set(:Page,Class.new) unless Event.const_defined?(:Page,false)

            Event::Page.const_set(:Condition,Class.new) unless Event::Page.const_defined?(:Condition,false)

            Event::Page.const_set(:Graphic,Class.new) unless Event::Page.const_defined?(:Graphic,false)
          end

          %w[Table Tone Color].each do |n|
            Object.const_set(n,Class.new) unless Object.const_defined?(n)

            Object.const_get(n).define_singleton_method(:_load) do |raw|
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end

            Object.const_get(n).class_eval do
              def _dump(_depth)
                @raw
              end
            end
          end

          def check(ok,msg)
            raise msg unless ok
          end

          def utf(obj)
            obj.to_s.dup.force_encoding('UTF-8').scrub
          end

          def rep(source,old,new,label)
            count=source.scan(old).size
            check(count==1,"#{label}: expected one match, got #{count}")
            source.sub(old,new)
          end

          def edit_script(rows,name)
            matches=rows.select do |r|
              r.is_a?(Array) && utf(r[1])==name
            end

            check(matches.size==1,"#{name}: script not unique")

            row=matches.first

            original=Zlib::Inflate.inflate(row[2]).force_encoding('UTF-8')

            check(original.valid_encoding?,"#{name}: invalid UTF8")

            crlf=original.include?("\r\n")

            source=original.gsub("\r\n","\n")

            result=yield(source)

            check(result!=source,"#{name}: unchanged")

            RubyVM::InstructionSequence.compile(result)

            row[2]=Zlib::Deflate.deflate(
              crlf ? result.gsub("\n","\r\n").b : result.b
            )
          end

          root='site/knight/gameasync'

          old_names=[
            '다크엘프',
            '다크레인저',
            '실버레인저',
            '애로우 마스터',
            '아크스카우터'
          ]

          new_names=[
            '여기사',
            '남요정',
            '여법사',
            '남다엘',
            '여다엘'
          ]

          new_graphics=[
            'SL13_여기사',
            'SL13_남요정',
            'SL8_여법사',
            'SL13_남다엘',
            'SL8_여다엘'
          ]

          actor_files=Dir.glob(
            root+'/Data/*Actors.rxdata'
          ).select{|p|File.size(p)>10}

          check(actor_files.size==1,'Actor data not unique')

          actor_path=actor_files.first

          actors=Marshal.load(File.binread(actor_path))

          check(actors.size==10,"Actor count: #{actors.size}")

          check(
            utf(actors[4].instance_variable_get(:@name))=='여요정',
            'Original fairy actor differs'
          )

          check(
            utf(actors[3].instance_variable_get(:@character_name))=='법사',
            'Original wizard actor differs'
          )

          original_actors=actors.map{|a|Marshal.dump(a)}

          old_names.each_with_index do |name,i|

            id=5+i

            actor=actors[id]

            check(
              utf(actor.instance_variable_get(:@name))==name,
              "Original actor #{id} differs"
            )

            actor.instance_variable_set(
              :@name,new_names[i]
            )

            actor.instance_variable_set(
              :@character_name,new_graphics[i]
            )
          end

          check(
            (0..4).all?{|id|Marshal.dump(actors[id])==original_actors[id]},
            'Existing player, wizard or fairy actor changed'
          )

          File.binwrite(actor_path,Marshal.dump(actors))

          maps=Dir.glob(
            root+'/Data/*Map???.rxdata'
          ).select{|p|File.size(p)>10}.sort

          check(!maps.empty?,'Original maps missing')

          map_changes=[]
          event_count=0

          maps.each do |path|

            map=Marshal.load(File.binread(path))

            events=map.instance_variable_get(:@events)

            original_ids=events.keys.sort

            hashes=events.transform_values do |event|
              Digest::SHA256.hexdigest(Marshal.dump(event))
            end

            fairy_matches=events.values.select do |event|
              utf(event.instance_variable_get(:@name))=='동료 여요정'
            end

            check(
              fairy_matches.size==1,
              "#{path}: fairy event count #{fairy_matches.size}"
            )

            fairy=fairy_matches.first

            fairy_pages=fairy.instance_variable_get(:@pages)

            check(
              fairy_pages.size==1,
              "#{path}: fairy page count differs"
            )

            fairy_condition=fairy_pages[0].instance_variable_get(:@condition)

            check(
              fairy_condition.instance_variable_get(:@switch1_valid) &&
              fairy_condition.instance_variable_get(:@switch1_id)==2001,
              "#{path}: fairy switch differs"
            )

            changed_ids=[]

            old_names.each_with_index do |name,i|

              matches=events.values.select do |event|
                utf(event.instance_variable_get(:@name))=='동료 '+name
              end

              check(
                matches.size==1,
                "#{path}: #{name} event count #{matches.size}"
              )

              old=matches.first

              id=old.instance_variable_get(:@id)

              old_pages=old.instance_variable_get(:@pages)

              check(old_pages.size==1,"#{path}: #{name} pages differ")

              condition=old_pages[0].instance_variable_get(:@condition)

              check(
                condition.instance_variable_get(:@switch1_valid) &&
                condition.instance_variable_get(:@switch1_id)==2002+i,
                "#{path}: #{name} switch differs"
              )

              event=Marshal.load(Marshal.dump(fairy))

              event.instance_variable_set(:@id,id)

              event.instance_variable_set(
                :@name,'동료 '+new_names[i]
              )

              event.instance_variable_set(
                :@x,old.instance_variable_get(:@x)
              )

              event.instance_variable_set(
                :@y,old.instance_variable_get(:@y)
              )

              page=event.instance_variable_get(:@pages)[0]

              page.instance_variable_get(:@condition).instance_variable_set(
                :@switch1_id,2002+i
              )

              graphic=page.instance_variable_get(:@graphic)

              graphic.instance_variable_set(
                :@character_name,new_graphics[i]
              )

              events[id]=event

              changed_ids << id

              event_count+=1
            end

            check(
              events.keys.sort==original_ids,
              "#{path}: unexpected event ID changes"
            )

            check(
              changed_ids.uniq.size==5,
              "#{path}: duplicate companion slots"
            )

            events.each do |id,event|

              next if changed_ids.include?(id)

              check(
                Digest::SHA256.hexdigest(Marshal.dump(event))==hashes[id],
                "#{path}: unrelated event #{id} changed"
              )
            end

            File.binwrite(path,Marshal.dump(map))

            map_changes << path

            puts "MAP #{File.basename(path)}: 5 reused companion events"
          end

          check(
            event_count==maps.size*5,
            'Companion event total differs'
          )

          script_path=root+'/Data/Scripts.rxdata'

          rows=Marshal.load(File.binread(script_path))

          check(rows.size==137,"Original script count #{rows.size}")

          original_rows=rows.map do |r|
            r.is_a?(Array) ? r.dup : r
          end

          edit_script(rows,'Game_Character 3') do |s|

            first=s.index('  def move_toward_player')

            check(!first.nil?,'Original chase method missing')

            last=s.index('  def move_away_from_player',first)

            check(!last.nil?,'Original chase boundary missing')

            method=s[first...last]

            old="@event.name == '동료 여요정'"

            new="@event.name.to_s.start_with?('동료 ')"

            check(
              method.scan(old).size==2,
              'Original fairy chase and overlap conditions differ'
            )

            check(
              method.include?('return if @sl_healer_teleport'),
              'Original teleport guard missing'
            )

            check(
              method.include?('return if d <= 5'),
              'Original chase distance missing'
            )

            check(
              method.include?('if d <= 2'),
              'Original separation distance missing'
            )

            check(
              method.include?(
                'e.instance_variable_get(:@sl_healer_teleport)[0,2] == [tx,ty]'
              ),
              'Original destination reservation missing'
            )

            updated=method.gsub(old,new)

            rep(s,method,updated,'Existing chase and overlap conditions')
          end

          edit_script(rows,'Game_Party') do |s|

            old="    for i in ($data_system.party_members | [4])\n      @actors.push($game_actors[i])\n    end\n    $game_switches[2001] = @actors.include?($game_actors[4])\n"

            new="    for i in ($data_system.party_members | (4..9).to_a)\n      @actors.push($game_actors[i])\n    end\n    for id in 4..9\n      $game_switches[2001+id-4] = @actors.include?($game_actors[id])\n    end\n"

            s=rep(s,old,new,'Existing starting companions')

            old="    @actors = new_actors | [$game_actors[4]]\n"

            new="    @actors = new_actors | (4..9).map { |id| $game_actors[id] }\n"

            rep(s,old,new,'Existing saved party restoration')
          end

          edit_script(rows,'Sprite_Character') do |s|

            check(
              s.include?('SL8_'),
              'Original eight-frame sprite path missing'
            )

            check(
              s.include?('effect = @character.instance_variable_get(:@sl_healer_teleport)'),
              'Original teleport visual path missing'
            )

            old="        self.ox = @cw / 2 + (@character_name == '여요정' ? 1 : 0)\n"

            new="        self.ox = @cw / 2\n"

            s=rep(s,old,new,'Original sprite horizontal origin')

            old="        self.oy = @ch + (@character_name == '여요정' ? 10 : 0)\n"

            new="        self.oy = @ch\n"

            s=rep(s,old,new,'Original sprite vertical origin')

            old="      self.zoom_x = (@tile_id == 0 && @character.is_a?(Game_Player) && ['knight_men', 'knight_men_death', 'knight_men좌표', '기사이동모션', 'knight_damage', 'knight_drop'].include?(@character_name) ? 0.90 : (@tile_id == 0 && @character.is_a?(Game_Event) && @character.instance_variable_get(:@event) && @character.instance_variable_get(:@event).name == '[ID힐러 마법사]' ? 1.01 : 1.0))\n"

            new="      self.zoom_x = (@tile_id == 0 && @character.is_a?(Game_Player) && ['knight_men_death', 'knight_men좌표', '기사이동모션', 'knight_damage', 'knight_drop'].include?(@character_name) ? 0.90 : 1.0)\n"

            rep(s,old,new,'Original character render scale')
          end

          changed=rows.each_index.select do |i|
            rows[i]!=original_rows[i]
          end.map do |i|
            utf(rows[i][1])
          end.sort

          expected=[
            'Game_Character 3',
            'Game_Party',
            'Sprite_Character'
          ].sort

          check(
            changed==expected,
            "Unexpected script changes: #{changed.inspect}"
          )

          File.binwrite(script_path,Marshal.dump(rows))

          check(
            Marshal.load(File.binread(script_path))==rows,
            'Script serialization differs'
          )

          File.write(
            '/tmp/slv313-data.json',
            JSON.generate(
              [actor_path,script_path]+map_changes
            )
          )

          puts "PASS #{maps.size} maps inspected"
          puts "PASS #{event_count} existing companion event slots reused"
          puts 'PASS original event IDs and switches retained'
          puts 'PASS original healer and fairy events unchanged'
          puts 'PASS six companion slots enabled'
          puts 'PASS original chasing and reservation paths reused'
          puts 'PASS original eight-frame rendering path retained'
          puts 'PASS only three original scripts changed'
          RUBY

          ruby -c /tmp/slv313.rb
          ruby /tmp/slv313.rb

      - name: Update resource mapping and verify changed files
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re

          root=Path('site')
          game=root/'knight/gameasync'

          manifest=json.loads(
              Path('/tmp/slv313-graphics.json').read_text('utf8')
          )

          data_paths=[
              Path(p)
              for p in json.loads(
                  Path('/tmp/slv313-data.json').read_text('utf8')
              )
          ]

          mapper=game/'mapping.js'

          source=mapper.read_text('utf8')
          mapping=source

          for path in data_paths:

              rel=str(path.relative_to(game))

              pattern=re.compile(
                  re.escape(rel)+r'\?h=[0-9a-f]{32}'
              )

              assert len(pattern.findall(mapping))==1,rel

              mapping=pattern.sub(
                  rel+'?h='+hashlib.md5(
                      path.read_bytes()
                  ).hexdigest(),
                  mapping
              )

          existing={'knight_men','여요정','법사'}

          for row in manifest:

              name=row['graphic']
              rel=row['relative']

              key='graphics/characters/'+name.lower()

              checksum=hashlib.md5(
                  (game/rel).read_bytes()
              ).hexdigest()

              pattern=re.compile(
                  re.escape(rel)+r'\?h=[0-9a-f]{32}'
              )

              if name in existing:

                  assert len(pattern.findall(mapping))==1,rel

                  mapping=pattern.sub(
                      rel+'?h='+checksum,
                      mapping
                  )

              else:

                  assert not pattern.search(mapping)

                  anchor='["graphics/characters/여요정", '

                  assert mapping.count(anchor)==1

                  at=mapping.index(
                      '\n',
                      mapping.index(anchor)
                  )+1

                  line=(
                      '["'+key+'", "'+
                      rel+'?h='+checksum+'"],\n'
                  )

                  mapping=mapping[:at]+line+mapping[at:]

              ref_pattern=(
                  r'\["'+re.escape(key)+
                  r'",\s*"'+re.escape(rel)+
                  r'\?h='+checksum+r'"\]'
              )

              assert len(
                  re.findall(ref_pattern,mapping)
              )==1,name

          mapper.write_text(mapping,'utf8')

          loader=root/'knight/js/sl-assets-v229r115.js'

          js=loader.read_text('utf8')

          assert js.count(
              "var version='V3.11';"
          )==1

          loader.write_text(
              js.replace(
                  "var version='V3.11';",
                  "var version='V3.13';"
              ),
              'utf8'
          )

          for name in ('index.html','knight/index.html'):

              path=root/name

              text=path.read_text('utf8')

              assert 'V3.11' in text

              path.write_text(
                  text.replace(
                      'V3.11','V3.13'
                  ).replace(
                      'v3.11','v3.13'
                  ),
                  'utf8'
              )

          before=json.loads(
              Path('/tmp/slv313-before.json').read_text('utf8')
          )

          after={
              str(p.relative_to(root)):hashlib.sha256(
                  p.read_bytes()
              ).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          changed={
              p
              for p in before.keys()&after.keys()
              if before[p]!=after[p]
          }

          added=set(after)-set(before)

          removed=set(before)-set(after)

          expected={
              str(p.relative_to(root))
              for p in data_paths
          }

          expected.update({
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html',
              'knight/index.html'
          })

          expected.update({
              'knight/gameasync/'+row['relative']
              for row in manifest
              if row['graphic'] in existing
          })

          approved_add={
              'knight/gameasync/'+row['relative']
              for row in manifest
              if row['graphic'] not in existing
          }

          assert changed==expected,(
              'Changed files differ',
              sorted(changed^expected)
          )

          assert added==approved_add,(
              'Added files differ',
              sorted(added^approved_add)
          )

          assert len(added)==5

          assert not removed,sorted(removed)

          assert before[
              'knight/js/dpad.js'
          ]==after[
              'knight/js/dpad.js'
          ]

          assert "location.replace('knight/?v='+Date.now());" in (
              root/'index.html'
          ).read_text('utf8')

          print('PASS V3.13 eight original character graphics')
          print('PASS six four-frame characters')
          print('PASS two eight-frame characters')
          print('PASS original graphic scale 100 percent')
          print('PASS existing companion event IDs reused')
          print('PASS original chase and overlap branches reused')
          print('PASS V3.9 input handling unchanged')
          print('PASS V3.10 direct entry unchanged')
          print('PASS engine and unrelated resources unchanged')
          print('PASS changed files',len(changed))
          print('PASS new graphics',len(added))
          print('PASS removed files',len(removed))
          print('PASS unchanged original files',len(before)-len(changed))
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/dpad.js

      - name: Upload V3.13 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
