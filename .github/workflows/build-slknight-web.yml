name: build-slknight-web.yml | V4.11 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Restore V4.10 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45926982327
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Restore original SPR audit
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45347986505
          name: audit-sanctuary-monsters-v46-all-spr-audit
          github-token: ${{ github.token }}
          path: audit

      - name: Restore original action definitions
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 43244856128
          name: sanctuary-original-name-candidates
          github-token: ${{ github.token }}
          path: motion-source

      - name: Restore verified SPR decoder
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: e2dfa04c9aecac1431aaf48637a138bb5b6c9a62
          path: verified-v37

      - name: Verify V4.10 baseline
        shell: bash
        run: |
          set -euo pipefail

          test -s baseline/artifact.tar
          mkdir -p site downloads original
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json

          root=Path('site')
          game=root/'knight/gameasync'

          before={
              str(p.relative_to(root)):{
                  'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                  'md5':hashlib.md5(p.read_bytes()).hexdigest()
              }
              for p in root.rglob('*')
              if p.is_file()
          }

          assert len(before)==6033,len(before)

          loader=root/'knight/js/sl-assets-v229r115.js'
          assert loader.read_bytes().count(b"var version='V4.10';")==1

          for name in ('index.html','knight/index.html'):
              assert b'V4.10' in (root/name).read_bytes()

          Path('/tmp/sl411-before.json').write_text(
              json.dumps(before,sort_keys=True),'utf8'
          )

          print('PASS exact V4.10 baseline')
          PY

      - name: Restore original body and shadow SPR source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release download v1.0.0 \
            --repo gowellsik-hue/Game \
            --pattern 'Sanctuary.of.Aden.-.Copy.*' \
            --dir downloads

          python3 - <<'PY'
          from pathlib import Path

          base='Sanctuary.of.Aden.-.Copy'

          expected={
              f'{base}.z{i:02d}':100000000
              for i in range(1,46)
          }
          expected[f'{base}.zip']=38808950

          actual={
              p.name:p.stat().st_size
              for p in Path('downloads').iterdir()
              if p.is_file()
          }

          assert actual==expected
          assert sum(actual.values())==4538808950
          PY

          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq p7zip-full
          fi

          7z x downloads/Sanctuary.of.Aden.-.Copy.zip \
            'Sanctuary of Aden - Copy/Sprite.idx' \
            'Sanctuary of Aden - Copy/Sprite.pak' \
            "-o${PWD}/original" -y > original-extract.log

          test -s 'original/Sanctuary of Aden - Copy/Sprite.idx'
          test -s 'original/Sanctuary of Aden - Copy/Sprite.pak'

          rm -rf downloads

          python3 -m venv /tmp/sl411-venv
          /tmp/sl411-venv/bin/pip install --quiet pillow==11.3.0

      - name: Build original weapon-specific character motions
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl411-assets.py <<'PY'
          import ast
          import csv
          import hashlib
          import itertools
          import json
          import re
          import struct
          import textwrap
          import zipfile

          from pathlib import Path
          from PIL import Image

          DIRECTIONS=(5,7,3,1)

          FORMS={
              61:3213,
              48:3215,
              138:3217,
              37:3474,
              734:3476,
              1186:3221,
              2786:2786,
              2796:2796
          }

          WEAPONS={
              'bare':0,
              'sword':4,
              'bow':20,
              'staff':40,
              'dagger':46,
              'tohandsword':50,
              'edoryu':54,
              'claw':58
          }

          def normalize_attack(seq):
              seq=[x for x in seq if x[2]>0]
              n=len(seq)

              marks={
                  i for i,x in enumerate(seq)
                  if x[3]
              }

              assert n and marks

              if n<=6:
                  indices=[
                      round(j*(n-1)/5)
                      for j in range(6)
                  ]
              else:
                  mandatory={0,n-1}|marks

                  indices=min(
                      (
                          c for c in itertools.combinations(range(n),6)
                          if mandatory.issubset(c)
                      ),
                      key=lambda c:sum(
                          (i-j*(n-1)/5)**2
                          for j,i in enumerate(c)
                      )
                  )

              assert marks.issubset(indices)

              return (
                  [seq[i] for i in indices],
                  next(j for j,i in enumerate(indices) if i in marks)
              )

          packs=list(
              Path('motion-source').rglob('name-sources-part-01.zip')
          )
          assert len(packs)==1,packs

          with zipfile.ZipFile(packs[0]) as z:
              txt=z.read('raw/0058409-loose/TW13032701.txt')

          assert hashlib.sha256(txt).hexdigest()==(
              'b967a88cd95f00034b7ca3237b470cba37341e6ecdf261f32d9be780df6b2dc6'
          )

          parts=re.split(
              r'(?m)^#(\d+)\s',
              txt.decode('cp949','replace')
          )

          sections=dict(zip(parts[1::2],parts[2::2]))

          manifests=list(
              Path('audit').rglob('SPR-record-audit.csv')
          )
          assert len(manifests)==1,manifests

          with manifests[0].open(encoding='utf-8-sig') as f:
              rows=list(csv.DictReader(f))

          assert len(rows)==158040

          ids=set(FORMS.values())|{i+1 for i in FORMS.values()}

          selected=[
              r for r in rows
              if int(r['id']) in ids
          ]

          assert len(selected)==5824
          assert sum(int(r['frames'] or 0) for r in selected)==43988

          rows=[
              r for r in selected
              if r['pak']=='Sprite.pak'
          ]

          source={
              (int(r['id']),int(r['sub'])):r
              for r in rows
          }

          assert len(source)==len(rows)

          needed=set()
          plans={}
          deaths={}

          for orig,body in FORMS.items():

              acts={
                  int(m[1]):[
                      (int(b),int(i),int(t),'!' in x)
                      for b,i,t,x in re.findall(
                          r'(\d+)\.(\d+):(\d+)([^\s]*)',
                          m[3]
                      )
                  ]
                  for m in re.finditer(
                      r'(?m)^\s*(\d+)\.[^(\n]+\(\d+\s+(\d+),([^)]*)\)',
                      sections[str(orig)]
                  )
              }

              plans[body]={}
              deaths[body]=acts[8]

              for typ,a in WEAPONS.items():

                  if not all(
                      k in acts for k in (a,a+1,a+2,a+3)
                  ):
                      continue

                  for k in (a,a+1,a+2,a+3,8):
                      for bank,i,t,h in acts[k]:
                          for d in DIRECTIONS:
                              for b in (body,body+1):

                                  key=(b,bank+d)
                                  r=source[key]

                                  needed.add(key)

                                  assert r['status']=='visible'
                                  assert int(r['frames'])==int(r['visible_frames'])
                                  assert i<int(r['frames']),(
                                      body,typ,k,key,i
                                  )

                  assert len(acts[a])==4
                  assert len(acts[a+2])==3

                  swing,hit=normalize_attack(acts[a+1])
                  total=sum(x[2] for x in acts[a+1])

                  plans[body][typ]=(
                      acts[a]+swing+acts[a+2]+[acts[a+3][0]],
                      total,
                      hit
                  )

          assert sum(map(len,plans.values()))==44
          assert len(needed)==1472
          assert plans[3213]['sword'][1]==22

          workflow=Path(
              'verified-v37/.github/workflows/build-slknight-web.yml'
          ).read_text('utf8')

          marker="          cat > /tmp/slv37.py <<'PY3'\n"
          assert workflow.count(marker)==1

          src=textwrap.dedent(
              workflow.split(marker,1)[1].split(
                  '\n          PY3',1
              )[0]
          )

          tree=ast.parse(src)

          classes=[
              n for n in tree.body
              if isinstance(n,ast.ClassDef) and n.name=='Reader'
          ]

          assert len(classes)==1

          text=ast.get_source_segment(src,classes[0])
          assert text.count('assert count==4,count')==1

          text=text.replace(
              'assert count==4,count',
              'assert count>0,count'
          )

          scope={'struct':struct}
          exec(compile(text,'verified-reader','exec'),scope)
          Reader=scope['Reader']

          root=Path('site/knight/gameasync')
          directory=root/'Graphics/Characters'
          directory.mkdir(parents=True,exist_ok=True)

          pak=Path('original/Sanctuary of Aden - Copy/Sprite.pak')
          idx=pak.with_suffix('.idx').read_bytes()

          assert len(idx)==4+28*struct.unpack_from('<I',idx)[0]

          cache={}
          consumed=set()

          with pak.open('rb') as f:
              for key in sorted(needed):

                  r=source[key]
                  i=int(r['entry'])
                  off=4+28*i

                  pos=struct.unpack_from('<I',idx,off)[0]
                  size=struct.unpack_from('<I',idx,off+24)[0]

                  name=idx[off+4:off+24].split(
                      b'\0',1
                  )[0].decode('cp949','replace')

                  assert name==r['filename']
                  assert pos==int(r['offset'])
                  assert size==int(r['bytes'])

                  f.seek(pos)
                  raw=f.read(size)

                  assert len(raw)==size
                  assert hashlib.sha256(raw).hexdigest()==r['sha256']

                  cache[key]=Reader(raw).decode()
                  assert len(cache[key])==int(r['frames'])

                  consumed.add(key)

          assert consumed==needed

          def layers(body,ref,d):
              bank,i,_,_=ref

              return (
                  cache[body,bank+d][i],
                  cache[body+1,bank+d][i]
              )

          def origin(body):
              y0=min(y for x,y in body)

              head=[
                  x for x,y in body
                  if y<y0+12
              ]

              return (
                  (2*sum(head)+len(head))//(2*len(head)),
                  max(y for x,y in body)+1
              )

          def sheet(body,refs,name,walk=False):
              prepared=[]

              for d in DIRECTIONS:

                  anchor=origin(layers(body,refs[0],d)[0])

                  for i,ref in enumerate(refs):

                      b,s=layers(body,ref,d)

                      ax,ay=origin(b) if walk and i<4 else anchor

                      prepared.append({
                          (x-ax,y-ay):rgba
                          for layer in (s,b)
                          for (x,y),rgba in layer.items()
                      })

              pts=[
                  p for fr in prepared
                  for p in fr
              ]

              half=max(
                  24,
                  -min(x for x,y in pts),
                  max(x for x,y in pts)+1
              )

              ground=max(
                  17,
                  max(y for x,y in pts)+1
              )

              cw=half*2

              ch=max(
                  96,
                  ground-min(y for x,y in pts)
              )

              n=len(refs)
              im=Image.new('RGBA',(cw*n,ch*4))

              assert im.width<=4096
              assert im.height<=4096

              for i,fr in enumerate(prepared):

                  cell=Image.new('RGBA',(cw,ch))

                  for (x,y),rgba in fr.items():
                      xx=half+x
                      yy=ch-ground+y

                      assert 0<=xx<cw
                      assert 0<=yy<ch

                      cell.putpixel((xx,yy),rgba)

                  assert cell.getbbox()

                  im.paste(
                      cell,
                      ((i%n)*cw,(i//n)*ch)
                  )

              p=directory/(name+'.png')
              assert not p.exists()

              im.save(p,optimize=True)

              with Image.open(p) as saved:
                  assert saved.convert('RGBA').tobytes()==im.tobytes()

              return ground

          motions={}
          deathmeta={}
          files=[]

          for body,byweapon in plans.items():

              motions[body]={}

              for typ,(refs,total,hit) in byweapon.items():

                  name=f'SL411_{body}_{typ}'
                  ground=sheet(body,refs,name,True)

                  motions[body][typ]=[
                      name,total,hit,ground
                  ]

                  files.append(name)

                  print(
                      'MOTION',
                      body,typ,
                      'walk',4,
                      'attack',6,
                      'hit',3,
                      'idle',1,
                      'original ticks',total,
                      'strike frame',hit+1
                  )

              name=f'SL411_{body}_death'
              ground=sheet(body,deaths[body],name)

              deathmeta[body]=[
                  name,
                  [
                      max(1,round(x[2]*30/22))
                      for x in deaths[body]
                  ],
                  ground
              ]

              files.append(name)

          assert len(files)==52
          assert len(set(files))==52

          Path('/tmp/sl411-motion.json').write_text(
              json.dumps({
                  'motions':motions,
                  'death':deathmeta,
                  'files':files
              }),
              'utf8'
          )

          print('PASS all 44 weapon motion branches')
          print('PASS all 1472 original body and shadow records')
          print('PASS 52 generated character sheets')
          PY

          /tmp/sl411-venv/bin/python -m py_compile /tmp/sl411-assets.py
          /tmp/sl411-venv/bin/python /tmp/sl411-assets.py

          rm -rf original

      - name: Prepare companion physical combat branches
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl411-runtime.rb <<'RUBY'
          module SL411

            FORMS={
              '남기사'=>3213,
              '여기사'=>3215,
              '남요정'=>3217,
              '여요정'=>3474,
              '남법사'=>3476,
              '여법사'=>3221,
              '남다엘'=>2786,
              '여다엘'=>2796
            }

            MOTIONS=__MOTIONS__
            DEATH=__DEATH__

            def self.body(a)
              a.id==1 ? 3213 : FORMS[a.instance_variable_get(:@sl43_form).to_s]
            end

            def self.motion(a)
              w=SL49.weapon(a)
              h=MOTIONS[body(a)]
              w && h ? h[w[6]] : nil
            end

            def self.members
              events=$game_map.events

              unless @events.equal?(events)
                @events=events
                @companions={}

                events.each_value do |e|
                  o=e.instance_variable_get(:@event)
                  next unless o && o.name.to_s.start_with?('동료 ')

                  c=o.pages[0].condition
                  id=c.switch1_id-1997

                  @companions[id]=e if c.switch1_valid && (4..6).include?(id)
                end
              end

              @companions
            end

            def self.member_event(id,alive=true)
              return $game_player if id==1 && (!alive || $game_actors[1].hp>0)
              return nil unless (4..6).include?(id)

              e=members[id]
              a=$game_actors[id]

              return nil unless e && a &&
                e.sl46_slot==id &&
                !e.transparent &&
                !e.instance_variable_get(:@sl_healer_teleport) &&
                $game_party.actors.include?(a)

              return nil if alive && a.hp<=0

              e
            end

            def self.combatants
              [1,4,5,6].map{
                |id|[id,member_event(id)]
              }.select{
                |p|p[1]
              }
            end

            def self.distance(a,b)
              (a.x-b.x).abs+(a.y-b.y).abs
            end

            def self.enemy(eid)
              return nil unless eid && eid>0

              mid=$game_map.map_id
              e=$game_map.events[eid]
              info=SLV541.stat(mid,eid)

              return nil unless e && info &&
                SL49.stats(mid,eid) &&
                e.trigger==2 &&
                e.instance_variable_get(:@sl_combat_event) &&
                e.character_name!='' &&
                !e.transparent &&
                $game_variables[info[6]].to_i<info[4] &&
                !SLV541.rewarded?(mid,eid)

              e
            end

            def self.mark_target(mid,eid)
              if mid==$game_map.map_id && enemy(eid)
                @focus_events=$game_map.events
                @focus=eid
              end
            end

            def self.target_for(e)
              t=@focus_events.equal?($game_map.events) ? enemy(@focus) : nil

              t=nil if t && distance(t,$game_player)>=12

              t ||= enemy(
                e.instance_variable_get(:@sl411_enemy)
              )

              return nil if t &&
                (
                  distance(t,$game_player)>=12 ||
                  distance(e,$game_player)>=12
                )

              t
            end

            def self.in_range?(e,t,bow)
              dx=t.x-e.x
              dy=t.y-e.y

              return false if dx==0 && dy==0

              return false if bow ?
                dx.abs+dy.abs>8 :
                dx.abs+dy.abs!=1

              x=e.x
              y=e.y

              while x!=t.x || y!=t.y

                rx=t.x-x
                ry=t.y-y

                d=rx.abs>=ry.abs && rx!=0 ?
                  (rx>0 ? 6 : 4) :
                  (ry>0 ? 2 : 8)

                nx=x+(d==6 ? 1 : d==4 ? -1 : 0)
                ny=y+(d==2 ? 1 : d==8 ? -1 : 0)

                return false unless
                  $game_map.passable?(x,y,d,e) &&
                  $game_map.passable?(nx,ny,10-d,e)

                x=nx
                y=ny
              end

              true
            end

            def self.pc_motion
              w=SL49.weapon($game_actors[1])

              w && w[6]!='sword' ?
                MOTIONS[3213][w[6]] :
                nil
            end

            def self.starter(a,initial=false)
              return if a.instance_variable_get(:@sl411_starter_done)
              return unless body(a)

              if !initial &&
                 (a.weapon_ids+a.armor_ids).any?{|id|id.to_i>0}

                a.instance_variable_set(:@sl411_starter_done,true)
                return
              end

              f=a.instance_variable_get(:@sl43_form).to_s

              w=f.end_with?('기사') ? 170 :
                (
                  f.end_with?('요정') ? 1000 :
                  (f.end_with?('법사') ? 1001 : 1002)
                )

              a.equip_from_menu=false
              a.equip_type_force=nil

              $game_party.gain_weapon(w,1)
              a.equip(0,w)

              [
                [1,144],
                [2,143],
                [3,57],
                [4,61],
                [5,62],
                [6,1000],
                [7,59],
                [9,274],
                [12,1001]
              ].each do |slot,id|

                next if slot==1 && [1000,1002].include?(w)

                next if slot>a.armor_slots.size ||
                  (!initial && a.armor_ids[slot-1].to_i>0)

                $game_party.gain_armor(id,1)
                a.equip(slot,id)
              end

              $game_party.gain_item(1006,1000) if w==1000

              a.instance_variable_set(:@sl411_starter_done,true)

              a.recover_all if initial
            end
          end

          class Game_Event

            attr_reader :sl411_visual

            def sl411_tick(id)

              a=$game_actors[id]
              now=Graphics.frame_count

              return false unless a &&
                a.instance_variable_get(:@sl43_hired) &&
                $game_party.actors.include?(a)

              if a.hp<=0

                @sl411_attack=nil
                @sl411_dead_at ||= now

                d=SL411::DEATH[SL411.body(a)]

                if d

                  n=now-@sl411_dead_at
                  col=0

                  d[1].each do |f|
                    break if n<f
                    n-=f
                    col+=1
                  end

                  if col<d[1].size

                    @sl411_visual=[
                      d[0],
                      col,
                      d[1].size,
                      d[2]
                    ]

                    return true
                  end
                end

                @sl411_visual=nil
                @sl411_dead_at=nil
                @sl411_hit_at=nil
                @sl411_ready=nil
                @sl411_enemy=nil

                $game_party.remove_actor(id)

                return true
              end

              @sl411_dead_at=nil

              SL411.starter(a)

              m=SL411.motion(a)
              w=SL49.weapon(a)

              @sl411_visual=m ? [m[0],nil,14,m[3]] : nil

              if !m ||
                 @sl_healer_teleport ||
                 moving? ||
                 jumping? ||
                 @move_route_forcing

                @sl411_attack=nil
                return false
              end

              if @sl411_attack

                p=@sl411_attack
                elapsed=now-p[0]

                t=SL411.enemy(p[1])
                duration=p[2]

                if a.weapon_id!=p[4] ||
                   elapsed<0 ||
                   elapsed>=duration ||
                   !t

                  @sl411_attack=nil

                else

                  col=[5,elapsed*6/duration].min

                  @sl411_visual=[
                    m[0],
                    4+col,
                    14,
                    m[3]
                  ]

                  if !p[3] && col>=m[2]

                    p[3]=true

                    if SL411.in_range?(self,t,w[6]=='bow')

                      eid=t.id
                      mid=$game_map.map_id

                      info=SLV541.stat(mid,eid)

                      dmg=SL49.pc_attack(
                        a,
                        mid,
                        eid,
                        w
                      )

                      SL49.apply_damage(
                        mid,
                        eid,
                        info[6],
                        dmg,
                        id
                      )

                      tok=t.instance_variable_get(:@sl_target_actor_id)

                      if !tok || tok[0]==0
                        t.instance_variable_set(:@sl_target_actor_id,[id])
                      end

                    end
                  end

                  return true
                end
              end

              if @sl411_hit_at &&
                 now-@sl411_hit_at<12 &&
                 now>=@sl411_hit_at

                @sl411_visual=[
                  m[0],
                  10+(now-@sl411_hit_at)/4,
                  14,
                  m[3]
                ]

                return true
              end

              @sl411_hit_at=nil

              t=SL411.target_for(self)

              return false unless t

              distance=SL411.distance(self,t)

              return false unless w[6]=='bow' ?
                distance.between?(1,8) :
                distance==1

              return false if w[6]=='bow' &&
                $game_party.item_number(1006)<1

              return true if @sl411_ready &&
                now<@sl411_ready

              return false unless SL411.in_range?(
                self,t,w[6]=='bow'
              )

              dx=t.x-@x
              dy=t.y-@y

              @direction=dx.abs>=dy.abs && dx!=0 ?
                (dx>0 ? 6 : 4) :
                (dy>0 ? 2 : 8)

              normal=SLV229::Speed::ATTACK_TIMINGS[1][0]

              dur=[
                6,
                (normal[0]*m[1]+11)/22
              ].max

              recovery=[
                1,
