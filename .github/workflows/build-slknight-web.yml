          )

          old=$hits.size

          Graphics.frame_count+=1

          [a,b,c].each{|e|e.update}

          check(
            $hits[old..-1].all?{|h|h[1]==6},
            'no strikes on old target after switch'
          )

          check(
            [a,b,c].all?{|e|
              p=e.instance_variable_get(:@sl411_attack)
              !p || p[1]==6
            },
            'old swing state cancelled'
          )

          $game_variables[106]=500

          check(
            [a,b,c].all?{|e|SL411.target_for(e).nil?},
            'dead target invalidated'
          )

          $game_variables[106]=0

          check(
            SL411.target_for(a).nil?,
            'respawn does not resurrect focus'
          )

          SL411.mark_target(3,5)

          a.moveto(m.x,m.y)

          a.instance_variable_set(:@sl411_attack,nil)

          a.move_toward_player

          check(
