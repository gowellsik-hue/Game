
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R73
# REPLACES: undelivered R73 seed-mask candidate; source is deployed R72.
# LAYER FIX: one-cell-reduced collision WALL BASE from ALL Layer4/Layer5 groups.
# KEEP: separate wall foreground graphics, original floor, monsters, spawns.
# R71/R72 movement state/alias removed, original R67 engine retained.
# WARNING: Sanctuary native-client collision rules are not verified.
name: build-slknight-web.yml | V229R73 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R73 Restore R72 deployed game before all R73 experimental edits
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40206130671
          name: github-pages
          github-token: ${{ github.token }}
          path: r72
      - name: V229R73 Restore original Sanctuary wall object layers and native S32
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39385472903
          name: Sanctuary-Map-V6.3-Native-Passage-and-Wall-Groups-Handoff
          github-token: ${{ github.token }}
          path: source
      - name: V229R73 Verify exact R72 and V6.3, extract unaltered game script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s r72/artifact.tar
          tar -xf r72/artifact.tar -C site
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(files)==5517,len(files)
          assert 'V229R72' in (root/'index.html').read_text('utf-8')
          assert 'V229R72' in (root/'knight/index.html').read_text('utf-8')
          expected='1f3ee7a10a86e3cbc9327c154f6aca88c05f3bdafd393975ebdbde48963a99d4'
          assert hashlib.sha256((root/'knight/gameasync/Data/Scripts.rxdata').read_bytes()).hexdigest()==expected
          m=json.loads(Path('source/handoff-manifest.json').read_text('utf-8'))
          assert m['version']=='V6.3' and m['state']=='INTEGRATION_HANDOFF_NOT_APPLIED'
          assert not m['SanctuaryExecutableRulesVerified']
          Path('build/r73-original.json').write_text(json.dumps(files,sort_keys=True))
          print('PASS exact deployed R72 5517 files, original S32 and Layer4/5 handoff')
          PY_BASE
          ruby -rzlib - <<'RB_EXTRACT'
          a=Marshal.load(File.binread('site/knight/gameasync/Data/Scripts.rxdata'))
          raise 'Unexpected original engine count' unless a.size==136
          s=Zlib::Inflate.inflate(a[134][2]).force_encoding('UTF-8')
          raise 'Old rear module missing' unless s.include?('module SLTI_Rear71')
          raise 'R67 source missing' unless s.include?('module SLTI_Native66') && s.include?('module SLTI_R67')
          raise 'Original monster/event collision missing' unless s.include?(%q{return false if other.x==nx && other.y==ny && other.character_name!=''})
          raise 'R68/R69 invalid collision present' if s.include?('other_spot==target') || s.include?('rear_step=(self==$game_player')
          File.binwrite('build/r72-script134.rb',s)
          puts 'PASS unmodified original R67 monster collision and four-button control recovered from R72'
          RB_EXTRACT
      - name: V229R73 Compile whole-map reduced wall-base collision from actual wall layers
        shell: bash
        run: |
          set -euo pipefail
          cat > build/compile_layers.py <<'PY_WALL_LAYER'
          #!/usr/bin/env python3
          """Build ONE reduced wall-base collision layer per floor, using native source wall objects.
          Do not infer collision from individual screenshot coordinates or old R71 masks.
          """
          from pathlib import Path
          import sys,json,struct,zlib,base64,hashlib,textwrap

          assert len(sys.argv)==4,'compile_layers.py SITE S32_DIR BUILD_DIR'
          site,sdir,out=[Path(v) for v in sys.argv[1:]]
          out.mkdir(parents=True,exist_ok=True)
          origin_x,origin_y=32576,32704
          floors={45:(1,256,256,378),46:(2,320,256,762)}
          panoramas=site/'knight/gameasync/Graphics/Panoramas'

          class WallForeground:
              def __init__(self,mid):self.mid=mid;self.cache={}
              def alpha(self,px,py):
                  if px<0 or py<0:return 0
                  cx,cy=px//512,py//512
                  key=(cx,cy)
                  if key not in self.cache:
                      path=panoramas/f'SLTI_{self.mid}_W_C{cx}_{cy}.png'
                      if not path.exists():self.cache[key]=None
                      else:
                          png=path.read_bytes()
                          assert png.startswith(b'\x89PNG\r\n\x1a\n'),path
                          offset=8;idat=[];w=h=0
                          while offset<len(png):
                              n=struct.unpack_from('>I',png,offset)[0]
                              typ=png[offset+4:offset+8];chunk=png[offset+8:offset+8+n]
                              offset+=12+n
                              if typ==b'IHDR':
                                  w,h,depth,mode,compress,filtering,interlace=struct.unpack('>IIBBBBB',chunk)
                                  assert (depth,mode,compress,filtering,interlace)==(8,6,0,0,0),(path,depth,mode)
                              elif typ==b'IDAT':idat.append(chunk)
                              elif typ==b'IEND':break
                          stride=w*4;raw=zlib.decompress(b''.join(idat))
                          assert len(raw)==h*(stride+1),(path,len(raw))
                          alpha=bytearray(w*h);i=0;last=bytearray(stride)
                          for y in range(h):
                              filt=raw[i];i+=1
                              cur=bytearray(raw[i:i+stride]);i+=stride
                              for x in range(stride):
                                  a=cur[x-4] if x>=4 else 0
                                  b=last[x];c=last[x-4] if x>=4 else 0
                                  if filt==0:delta=0
                                  elif filt==1:delta=a
                                  elif filt==2:delta=b
                                  elif filt==3:delta=(a+b)//2
                                  elif filt==4:
                                      p=a+b-c;aa=abs(p-a);bb=abs(p-b);cc=abs(p-c)
                                      delta=a if aa<=bb and aa<=cc else b if bb<=cc else c
                                  else:raise ValueError(('Unsupported PNG filter',filt,path))
                                  cur[x]=(cur[x]+delta)&255
                              alpha[y*w:(y+1)*w]=cur[3::4]
                              last=cur
                          self.cache[key]=(w,h,alpha)
                  chunk=self.cache[key]
                  if chunk is None:return 0
                  w,h,alpha=chunk
                  x,y=px%512,py%512
                  return alpha[y*w+x] if x<w and y<h else 0

          def bitmask(data):
              mask=bytearray((len(data)+7)//8)
              for i,x in enumerate(data):
                  if x:mask[i//8]|=1<<(i%8)
              return bytes(mask)

          stats={};masks={}
          for mid,(floor,w,h,yoffset) in floors.items():
              src=sdir/f'native/floor-{floor}-4way.bin'
              s32=src.read_bytes()
              manifest=json.loads((sdir/f'native/floor-{floor}-index.json').read_text('utf-8'))
              assert len(s32)==w*h
              assert hashlib.sha256(s32).hexdigest()==manifest['passageSHA256']
              # One whole-map wall-layer footprint. Match Layer4 wall objects and Layer5
              # occlusion selectors WITHIN each original group (not nearby unrelated groups).
              wall_layer=bytearray(w*h);group_count=0
              groupfile=sdir/f'occlusion/floor-{floor}-source-groups.jsonl'
              for line in groupfile.open(encoding='utf-8'):
                  g=json.loads(line);group_count+=1
                  assert g['floor']==floor and 'blockWorldOrigin' in g
                  ox,oy=g['blockWorldOrigin']
                  selector=set();obj=set()
                  for x,y,*_ in g['layer5Selectors']:
                      ix,iy=ox+x-origin_x,oy+y-origin_y
                      for dy in (-1,0,1):
                          for dx in (-1,0,1):
                              nx,ny=ix+dx,iy+dy
                              if 0<=nx<w and 0<=ny<h:selector.add(ny*w+nx)
                  for entry in g['objects']:
                      ix,iy=ox+entry[0]-origin_x,oy+entry[1]-origin_y
                      for dy in (-1,0,1):
                          for dx in (-1,0,1):
                              nx,ny=ix+dx,iy+dy
                              if 0<=nx<w and 0<=ny<h:obj.add(ny*w+nx)
                  for pos in selector.intersection(obj):wall_layer[pos]=1
              expected=2164 if floor==1 else 3041
              assert group_count==expected,(mid,group_count,expected)
              # Separate visual foreground from actual collision: alpha is used only
              # to establish that the wall body exists at the boundary. It cannot decide
              # passability alone, and stone brightness is NOT a collision signal.
              visual=WallForeground(mid)
              base=bytearray(w*h)
              for i,flag in enumerate(wall_layer):
                  if not flag or s32[i]!=0:continue
                  x=i%w+origin_x;y=i//w+origin_y
                  px=12*(x+y)-784128;py=6*(y-x)+yoffset
                  if px<0 or py<0:continue
                  samples=sum(visual.alpha(px+dx,py+dy)>=96 for dx,dy in
                              ((-3,0),(0,0),(3,0),(0,-4),(0,4)))
                  if samples>=3:base[i]=1
              def val(x,y):
                  if x<0 or y<0 or x>=w or y>=h:return 0
                  v=s32[y*w+x]
                  return 0 if v==255 else v
              def edge(x,y,dx,dy):
                  a=val(x,y);b=val(x+dx,y+dy)
                  if not a or not b:return False
                  d,e=((8,4) if dx>0 else (4,8) if dx<0 else (2,1) if dy>0 else (1,2))
                  return bool((a&d) and (b&e))
              entrance=bytearray(w*h)
              blocked_total=0
              for y in range(h-1):
                  for x in range(1,w):
                      if val(x,y)==0 or val(x-1,y+1)!=0:continue
                      native_down=(edge(x,y,-1,0) and edge(x-1,y,0,1)) or (edge(x,y,0,1) and edge(x,y+1,-1,0))
                      if native_down:continue
                      blocked_total+=1
                      dest=(y+1)*w+(x-1)
                      if base[dest]:entrance[y*w+x]=1
              # Erode the entire connected rear wall-base line in the horizontal/isometric
              # plane, not merely the original R71 seeds or their immediate neighbors.
              # LEFT=(-1,-1), RIGHT=(+1,+1) have identical screen Y. Never flood down.
              reduced=bytearray(w*h)
              queue=[]
              for y in range(h-1):
                  for x in range(1,w):
                      if entrance[y*w+x]:
                          dest=(y+1)*w+x-1
                          if not reduced[dest]:reduced[dest]=1;queue.append(dest)
              initial_cells=len(queue)
              head=0
              while head<len(queue):
                  i=queue[head];head+=1
                  y,x=divmod(i,w)
                  for dx,dy in ((-1,-1),(1,1)):
                      nx,ny=x+dx,y+dy
                      if nx<0 or ny<0 or nx>=w or ny>=h:continue
                      j=ny*w+nx
                      if reduced[j] or not base[j]:continue
                      reduced[j]=1;queue.append(j)
              assert initial_cells>500 and len(queue)>initial_cells,(mid,initial_cells,len(queue))
              assert all(s32[i]==0 for i in queue),'Collision shrink outside original wall base'
              assert not any(entrance[i] and s32[i]==0 for i in range(w*h))
              # A photographic reference is a diagnostic, not a movement-specific override.
              if mid==45:
                  def marked(data,x,y):return bool(data[(y-origin_y)*w+(x-origin_x)])
                  assert marked(entrance,32656,32815)
                  assert marked(reduced,32655,32816)
                  assert marked(reduced,32654,32815),'LEFT must be linked within same wall-base layer'
                  assert not marked(reduced,32653,32814),'No 2nd LEFT across actual wall boundary'
              masks[mid]=(bitmask(entrance),bitmask(reduced))
              stats[mid]={'s32_width':w,'wall_groups':group_count,'all_original_down_edges_into_wall':blocked_total,
                          'rear_wall_down_edges_after_layer_shrink':sum(entrance),
                          'reduced_wall_base_cells':len(queue),'initial_wall_base_cells':initial_cells,
                          'wall_collision_layer_pixels':sum(wall_layer),
                          'layer_source':'Layer4 grouped objects + Layer5 foreground selectors + wall PNG alpha, matched to native Layer3',
                          'source_verified_executable_collision':False}
              print('PASS wall-base layer',mid,stats[mid],flush=True)
              (out/f'layer73-entries-{mid}.bin').write_bytes(masks[mid][0])
              (out/f'layer73-base-{mid}.bin').write_bytes(masks[mid][1])
          (out/'r73-layer-audit.json').write_text(json.dumps(stats,indent=2))

          original=(out/'r72-script134.rb').read_text('utf-8')
          anchor='\n# V229R71: ONLY the first extra DOWN cell'
          assert original.count(anchor)==1,'Cannot identify R71 extra movement wrapper for clean removal'
          clean=original[:original.index(anchor)]
          assert 'module SLTI_Native66' in clean
          assert 'module SLTI_R67' in clean
          assert 'module SLV541' in clean
          assert 'No slide or axis fallback at blocked walls.' in clean
          assert clean.count("return false if other.x==nx && other.y==ny && other.character_name!=''")==1
          assert 'other_spot==target' not in clean and 'module SLTI_Rear71' not in clean

          # All rear-wall functionality now comes from two whole-map COLLISION LAYERS.
          # No new state machine, no per-coordinate return/one-off allowances.
          old='''    target=SLTI_Native66.native_target(mid,@slti_native66_x,@slti_native66_y,dir)
              return false if target==nil
          '''
          new='''    target=SLTI_Native66.native_target(mid,@slti_native66_x,@slti_native66_y,dir)
              if self==$game_player && SLTI_WallBase73.active?(mid)
                adjusted=SLTI_WallBase73.player_target(mid,@slti_native66_x,@slti_native66_y,dir)
                target=adjusted if adjusted!=nil
              end
              return false if target==nil
          '''
          assert clean.count(old)==1,('Missing R67 movement insertion',clean.count(old))
          clean=clean.replace(old,new,1)
          old_passage='''      return SLTI_Native66.native_target(
                  @slti_native66_map,@slti_native66_x,@slti_native66_y,d)!=nil
          '''
          new_passage='''      if self==$game_player && SLTI_WallBase73.active?(@slti_native66_map)
                  return SLTI_WallBase73.player_target(
                    @slti_native66_map,@slti_native66_x,@slti_native66_y,d)!=nil
                end
                return SLTI_Native66.native_target(
                  @slti_native66_map,@slti_native66_x,@slti_native66_y,d)!=nil
          '''
          assert clean.count(old_passage)==1,('Missing R67 actor passage insertion',clean.count(old_passage))
          clean=clean.replace(old_passage,new_passage,1)

          mask_expr=[]
          for n in (0,1):
              lines=[]
              for mid in (45,46):
                  raw=masks[mid][n]
                  data=base64.b64encode(raw).decode('ascii')
                  chunks=textwrap.wrap(data,120)
                  lines.append(str(mid)+'=>[\n      '+',\n      '.join('"'+s+'"' for s in chunks)+"\n    ].join.unpack('m')[0]")
              mask_expr.append(',\n    '.join(lines))

          module='''
          # V229R73: whole-map REAR WALL BASE COLLISION LAYER (player only).
          # Layer4 = wall objects. Layer5 = occlusion selectors. Source S32 remains exact.
          # A separate 1-native-cell wall-base reduction is compiled by wall group.
          # Never move/crop sprites; do not modify event/monster collision or S32 data.
          module SLTI_WallBase73
            OX=32576
            OY=32704
            WIDTH={45=>256,46=>320}
            HEIGHT=256
            ENTRY={
              __ENTRY__
            }
            BASE={
              __BASE__
            }
            def self.active?(mid)
              WIDTH.has_key?(mid)
            end
            def self.bit?(table,mid,x,y)
              w=WIDTH[mid]
              return false if w==nil || x<OX || y<OY || x>=OX+w || y>=OY+HEIGHT
              i=(y-OY)*w+(x-OX)
              c=table[mid][i/8,1]
              return c!=nil && (c.unpack('C')[0]&(1<<(i%8)))!=0
            end
            def self.entry?(mid,x,y)
              bit?(ENTRY,mid,x,y)
            end
            def self.wallbase?(mid,x,y)
              bit?(BASE,mid,x,y)
            end
            def self.player_target(mid,x,y,dir)
              return SLTI_Native66.native_target(mid,x,y,dir) unless active?(mid)
              if wallbase?(mid,x,y)
                # Wall base is only one screen row thick. LEFT/RIGHT traverse the row.
                # UP exits only through a real original source cell. DOWN stays solid.
                if dir==4 && wallbase?(mid,x-1,y-1)
                  return [x-1,y-1]
                elsif dir==6 && wallbase?(mid,x+1,y+1)
                  return [x+1,y+1]
                elsif dir==8 && entry?(mid,x+1,y-1)
                  return [x+1,y-1]
                end
                return nil
              end
              original=SLTI_Native66.native_target(mid,x,y,dir)
              return original if original!=nil
              if dir==2 && entry?(mid,x,y) && wallbase?(mid,x-1,y+1)
                return [x-1,y+1]
              end
              return nil
            end
          end
          '''
          module=module.replace('__ENTRY__',mask_expr[0]).replace('__BASE__',mask_expr[1])
          assert 'Zlib' not in module
          assert 'return false unless dir==8' not in module
          modified=clean+'\n'+module
          assert modified.count("return false if other.x==nx && other.y==ny && other.character_name!=''")==1
          assert 'module SLTI_Rear71' not in modified
          assert 'module SLTI_Rear73' not in modified
          assert modified.count('def slti_native66_move(dir,turn=true)')==2
          (out/'r73-layer-script134.rb').write_text(modified,encoding='utf-8')
          print('PASS new collision layer compiled; original monster / wall renderer code preserved')
          PY_WALL_LAYER
          python3 build/compile_layers.py site source build
          ruby -c build/r73-layer-script134.rb
      - name: V229R73 Test floor-wide walls, full lateral strip and unchanged monster collision
        shell: bash
        run: |
          set -euo pipefail
          cat > build/test_layers.rb <<'RB_WALL_TEST'
          # Standalone boot test. DO NOT load 'zlib'; original web game runtime does not have it.
          s=File.read('build/r73-layer-script134.rb',encoding:'UTF-8')
          raise 'zlib unexpectedly loaded' if defined?(Zlib)
          p0=s.index('module SLTI_Native66');p1=s.index("\nclass Game_Character",p0)
          raise 'missing source native module' unless p0 && p1
          eval(s[p0...p1])
          q=s.index('module SLTI_WallBase73')
          raise 'missing layer module' unless q
          eval(s[q..-1])
          raise 'new runtime requires Zlib' if defined?(Zlib)
          puts 'PASS boot: native map and new wall-base layer evaluate without Zlib'

          class Game_Map
            attr_accessor :events,:map_id
            def initialize(mid);@map_id=mid;@events={};end
            def valid?(x,y);x>=0 && y>=0 && x<(@map_id==45 ? 288 : 336) && y<(@map_id==45 ? 144 : 168);end
          end
          class Game_Character
            attr_accessor :x,:y,:through,:character_name
            def initialize(mid,nx,ny)
              @slti_native66_map=mid;@slti_native66_x=nx;@slti_native66_y=ny
              @x,@y=SLTI_Native66.to_rgss(mid,nx,ny)
              @through=false;@character_name='knight';@steps=0
            end
            def slti_native66_prepare;true;end
            def increase_steps;@steps+=1;end
            def source_cell;[@slti_native66_x,@slti_native66_y];end
          end
          m0=s.index('  def slti_native66_move(dir,turn=true)',p1)
          m1=s.index('  alias slti_native66_original_down',m0)
          raise 'cannot isolate original movement' unless m0 && m1
          Game_Character.class_eval(s[m0...m1])

          [45,46].each do |mid|
            w=SLTI_Native66::WIDTH[mid];h=SLTI_Native66::HEIGHT[mid]
            origin=SLTI_Native66::ORIGIN_X
            yorigin=SLTI_Native66::ORIGIN_Y
            count=0;lane=0;other_wall_checks=0;lateral_checks=0
            $game_map=Game_Map.new(mid)
            h.times do |iy|
              w.times do |ix|
                x,y=origin+ix,yorigin+iy
                if SLTI_WallBase73.wallbase?(mid,x,y)
                  lane+=1
                  raise 'lane not in solid wall' unless SLTI_Native66.value(mid,x,y)==0
                  raise 'penetrated front wall' unless SLTI_WallBase73.player_target(mid,x,y,2)==nil
                  [4,6].each do |dir|
                    p=SLTI_WallBase73.player_target(mid,x,y,dir)
                    next if p==nil
                    raise 'lateral lane incomplete' unless SLTI_WallBase73.wallbase?(mid,*p)
                    raise 'nonreciprocal lateral connection' unless SLTI_WallBase73.player_target(mid,p[0],p[1],dir==4 ? 6 : 4)==[x,y]
                    lateral_checks+=1
                  end
                end
                if SLTI_WallBase73.entry?(mid,x,y)
                  count+=1
                  raise 'entry source not passable' unless SLTI_Native66.value(mid,x,y)!=0
                  raise 'unexpected S32 down open' unless SLTI_Native66.native_target(mid,x,y,2)==nil
                  $game_player=Game_Character.new(mid,x,y)
                  raise "additional down blocked #{mid} #{x} #{y}" unless $game_player.slti_native66_move(2)
                  raise 'wrong destination' unless $game_player.source_cell==[x-1,y+1]
                  raise 'allows 2nd down' if $game_player.slti_native66_move(2)
                  raise 'UP return failed' unless $game_player.slti_native66_move(8)
                  raise 'wrong return' unless $game_player.source_cell==[x,y]
                elsif SLTI_Native66.value(mid,x,y)!=0 && SLTI_Native66.native_target(mid,x,y,2)==nil
                  other_wall_checks+=1
                  raise 'other blocked wall became passable' unless SLTI_WallBase73.player_target(mid,x,y,2)==nil
                end
              end
            end
            expect=mid==45 ? [1153,1567] : [1322,1843]
            raise "unexpected geometry #{mid}: #{count} #{lane}" unless [count,lane]==expect
            puts "PASS Map#{mid}: #{count} new wall-back edges, #{lane} thin collision cells, #{lateral_checks} lateral edges, #{other_wall_checks} blocked boundaries kept"
          end
          $game_map=Game_Map.new(45)
          $game_player=Game_Character.new(45,32656,32815)
          raise 'photo down failed' unless $game_player.slti_native66_move(2) && $game_player.source_cell==[32655,32816]
          raise 'photo left failed' unless $game_player.slti_native66_move(4) && $game_player.source_cell==[32654,32815]
          raise '2nd left wall breach' if $game_player.slti_native66_move(4)
          raise 'photo right failed' unless $game_player.slti_native66_move(6)
          raise 'photo up failed' unless $game_player.slti_native66_move(8)
          puts 'PASS screenshot DOWN-LEFT-RIGHT-UP, no wall walk beyond actual base strip'

          $game_player=Game_Character.new(45,32656,32815)
          blocker=Game_Character.new(45,32655,32816)
          $game_map.events={4=>blocker}
          raise 'monster/event collision accidentally removed' if $game_player.slti_native66_move(2)
          puts 'PASS original map-event collision retained'
          $game_map.events={}
          $game_player=Game_Character.new(45,32658,32813)
          monster=Game_Character.new(45,32656,32815)
          raise 'monster inherited player-only passage' if monster.slti_native66_move(2)
          puts 'PASS monster remains on original collision layer'
          RB_WALL_TEST
          ruby --disable-gems build/test_layers.rb
      - name: V229R73 Repack only player passage script, preserve all 5517 files
        shell: bash
        run: |
          set -euo pipefail
          ruby -rzlib - <<'RB_PACK'
          path='site/knight/gameasync/Data/Scripts.rxdata'
          a=Marshal.load(File.binread(path))
          before=Marshal.load(File.binread(path))
          raise 'Wrong game script count' unless a.size==136
          old=Zlib::Inflate.inflate(a[134][2]).force_encoding('UTF-8')
          raise 'Source script changed during build' unless old==File.read('build/r72-script134.rb',encoding:'UTF-8')
          new_code=File.binread('build/r73-layer-script134.rb')
          a[134][2]=Zlib::Deflate.deflate(new_code)
          raise 'Changed another game script' unless a.each_index.all?{|i| i==134 || a[i]==before[i]}
          File.binwrite(path,Marshal.dump(a))
          check=Marshal.load(File.binread(path))
          raise 'New layer script not stored' unless Zlib::Inflate.inflate(check[134][2]).include?('module SLTI_WallBase73')
          raise 'Old hack retained' if Zlib::Inflate.inflate(check[134][2]).include?('module SLTI_Rear71')
          puts 'PASS one updated player movement script, 135 original engine scripts unchanged'
          RB_PACK
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import hashlib,re,json
          root=Path('site');game=root/'knight/gameasync'
          mapping=game/'mapping.js'
          s=mapping.read_text('utf-8')
          md5=hashlib.md5((game/'Data/Scripts.rxdata').read_bytes()).hexdigest()
          s,n=re.subn(r'Data/Scripts\.rxdata\?h=[0-9a-f]{32}',lambda m:'Data/Scripts.rxdata?h='+md5,s)
          assert n==1,n
          mapping.write_text(s,encoding='utf-8')
          for name in ('index.html','knight/index.html'):
              f=root/name
              old=f.read_text('utf-8')
              assert 'V229R72' in old,name
              f.write_text(old.replace('V229R72','V229R73').replace('v229r72','v229r73'),encoding='utf-8')
          original=json.loads(Path('build/r73-original.json').read_text('utf-8'))
          current={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(current)==5517 and current.keys()==original.keys()
          changed={f for f in current if original[f]!=current[f]}
          allowed={'index.html','knight/index.html','knight/gameasync/mapping.js','knight/gameasync/Data/Scripts.rxdata'}
          assert changed==allowed,('Unapproved assets, wall sprites or monsters changed',changed^allowed)
          print('PASS all 5517 files preserved; only script, hash and two version labels changed')
          PY_FINAL
          node --check site/knight/gameasync/mapping.js
      - name: V229R73 Upload layer collision audit
        uses: actions/upload-artifact@v4
        with:
          name: SLKnight-V229R73-WallBase-Collision-Layer-Audit
          path: build/r73-layer-audit.json
          retention-days: 30
          if-no-files-found: error
      - name: V229R73 Upload complete original game to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
