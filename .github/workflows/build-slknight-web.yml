# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R31 - Fix R30 four-neighbor BFS typo; clean R16/R21 build otherwise unchanged
# Previous R22-R29 debug overlays, custom asset loaders, event truncation and Promise download gates are NOT used.
# Original drive.js and all movement/battle scripts stay byte-for-byte R16; only active visual renderer #97 changes.
# Preserve all 14 original 1F / 12 original 2F native events and leave map entry FREE of a portal event.
# Original 512px RGBA V4.1 image chunks only on Map45/46; 2x pixel magnification; no 256px downsample.
# Original R16 per-map preload manifest (asynchronous); no new JS downloader or native callback interception.
name: build-slknight-web.yml | V229R31 | Clean Native Events and 2x Terrain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: V229R31 Restore verified V229R16 game artifact
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39136791761
          name: github-pages
          github-token: ${{ github.token }}
          path: previous

      - name: V229R31 Restore original TI Dungeon V4.1 terrain and portals
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39100619927
          name: Sanctuary-TI-Dungeon-V4.1-Original-Terrain-Walk
          github-token: ${{ github.token }}
          path: original-ti

      - name: V229R31 Upgrade existing game in-place during build
        shell: bash
        run: |
          set -euo pipefail
          test -s previous/artifact.tar
          test -s original-ti/preview/terrain-walk-v4.1.html
          mkdir -p pristine site build
          tar -xf previous/artifact.tar -C pristine
          cp -a pristine/. site/
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib
          root=Path('site')
          assert len([p for p in root.rglob('*') if p.is_file()])==5354
          expected={
              'knight/gameasync/Data/Scripts.rxdata':'ac9aa3508341546e8467454a87b728b232fea910734357e3df4711e9cc82a61c',
              'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap029.rxdata':'2b99c87f691fece863c850f2217e538e3f6f76787b290507c8212b621beaf305'
          }
          for filename,digest in expected.items():
              assert hashlib.sha256((root/filename).read_bytes()).hexdigest()==digest,filename
          for mid in (45,46):
              assert not (root/f'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap{mid:03d}.rxdata').exists()
          print('PASS original R16 baseline intact in pristine; working game is site/')
          PY_BASE
          if ! python3 -c 'from PIL import Image' >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3-pil
          fi

      - name: V229R31 Keep unscaled 512px source textures; apply geometry 2x on GPU
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/terrain_2x.py <<'PY_TERRAIN'
          from PIL import Image
          from pathlib import Path
          from collections import deque
          import json,base64,re,zlib,hashlib,struct,math,sys

          source=Path('original-ti/preview')
          root=Path('site/knight/gameasync')
          output=root/'Graphics/Panoramas';output.mkdir(parents=True,exist_ok=True)
          html=(source/'terrain-walk-v4.1.html').read_text(encoding='utf-8')
          data=json.loads(re.search(r'<script id="data" type="application/json">(.*?)</script>',html,re.S).group(1))
          assert set(data)>={'1','2'}
          metadata={}
          for floor,mid in [('1',45),('2',46)]:
              m=data[floor];blocks=m['tiles']
              x0=min(t['x'] for t in blocks);y0=min(t['y'] for t in blocks)
              sw=max(t['x']+1536 for t in blocks)-x0
              sh=max(t['y']+768 for t in blocks)-y0
              assert sw%16==0 and sh%16==0
              canvas=Image.new('RGBA',(sw,sh))
              for block in blocks:
                  p=source/block['src'];assert p.is_file(),str(p)
                  with Image.open(p) as f:
                      assert f.size==(1536,768),str(p)
                      canvas.alpha_composite(f.convert('RGBA'),(block['x']-x0,block['y']-y0))
              # Strict 2x GEOMETRY restoration. This is an initial play test,
              # not a claim to restore lost native Tile.pak image detail.
              fullw,fullh=sw*2,sh*2
              cols=(fullw+1023)//1024;rows=(fullh+1023)//1024
              files=[]
              for cy in range(rows):
                  for cx in range(cols):
                      crop=canvas.crop((cx*512,cy*512,cx*512+512,cy*512+512))
                      # V229R31: do NOT allocate/store a 1024x1024 image.
                      # One source pixel occupies 2x2 screen pixels via Sprite.zoom_x/y.
                      # Retains the exact same 2x geometry as V229R24, 1/4 texture RAM.
                      name=f'SLTI_{mid}_C{cx}_{cy}.png'
                      path=output/name
                      crop.save(path,compress_level=6)
                      files.append('Graphics/Panoramas/'+name)
              # Source S32 world -> original V4.1 screen -> exact 2x screen.
              first=blocks[0];name=Path(first['src']).stem
              bx=int(name[:4],16);by=int(name[4:8],16)
              wx=32704+(bx-32767)*64;wy=32704+(by-32767)*64
              a=first['x']-12*(wx+wy)
              b=first['y']+378-6*(wy-wx)
              def project(x,y):return [2*(a+12*(x+y)-x0),2*(b+6*(y-x)-y0)]
              collision=base64.b64decode(m['collisionBase64'])
              cw,ch=m['width'],m['height'];ox,oy=m['originX'],m['originY']
              assert len(collision)==cw*ch
              def source_walk_at(px,py):
                  cx,cy=px/2,py/2
                  if not (0<=cx<sw and 0<=cy<sh):return False
                  aa=(cx+x0-a)/12;bb=(cy+y0-b)/6
                  sx=round((aa-bb)/2)-ox;sy=round((aa+bb)/2)-oy
                  return (0<=sx<cw and 0<=sy<ch and collision[sy*cw+sx]==0
                          and canvas.getpixel((int(cx),int(cy)))[3]>20)
              W,H=fullw//32,fullh//32
              walk=[]
              for gy in range(H):
                  for gx in range(W):
                      px=gx*32+16;py=gy*32+29
                      walk.append(any(source_walk_at(px+dx,py+dy)
                                      for dx,dy in ((0,0),(-8,0),(8,0),(0,-8))))
              available=[i for i,v in enumerate(walk) if v];assert available
              def nearest(world):
                  px,py=project(*world);gx,gy=round(px/32),round(py/32)
                  p=min(available,key=lambda i:(abs(i%W-gx)+abs(i//W-gy),abs(i%W-gx),i))
                  return [p%W,p//W]
              # Read actual portal names/positions, never invent their world coordinates.
              portals={p['name']:p for p in m['portals'] if p['name'] in ('go_00','to2','to1')}
              if mid==45:
                  assert 'go_00' in portals and 'to2' in portals
                  entry_world=tuple(portals['go_00']['nearestWalkable'][k] for k in ('x','y'))
                  stair_world=(portals['to2']['x'],portals['to2']['y'])
              else:
                  assert 'to1' in portals and portals['to1']['nearestWalkable']
                  entry_world=tuple(portals['to1']['nearestWalkable'][k] for k in ('x','y'))
                  stair_world=entry_world
              entry=nearest(entry_world);stairs=nearest(stair_world)
              start=entry[1]*W+entry[0];goal=stairs[1]*W+stairs[0]
              visited={start};queue=deque([start])
              while queue:
                  i=queue.popleft();y,x=divmod(i,W)
                  for nx,ny in ((x+1,y),(x-1,y),(x,y+1),(x,y-1)):
                      k=ny*W+nx
                      if 0<=nx<W and 0<=ny<H and walk[k] and k not in visited:
                          visited.add(k);queue.append(k)
              assert goal in visited,('portal blocked',mid,entry,stairs)
              ids=[384 if v else 385 for v in walk]
              records={
                  'mapId':mid,'width':W,'height':H,'chunkCols':cols,'chunkRows':rows,
                  'chunkSize':1024,'sourceTextureSize':512,'textureZoom':2,
                  'graphicScale':2,'previewTileBlocks':len(blocks),
                  'entry':entry,'stairs':stairs,'sourceEntryWorld':entry_world,
                  'sourceStairsWorld':stair_world,'walkableCells':sum(walk),
                  'entryConnectedCells':len(visited),'files':files,
                  'tilesBase64':base64.b64encode(zlib.compress(struct.pack('<'+'H'*len(ids),*ids),9)).decode(),
                  'walkBase64':base64.b64encode(zlib.compress(bytes(walk),9)).decode(),
                  'previewCanvasSha256':hashlib.sha256(canvas.tobytes()).hexdigest(),
                  'geometry':'512px original V4.1 source chunks zoomed 2x at runtime; not native TIL detail',
                  'collision':'same V4.1 collision mask raster rule, sampled at 2x; direction data not invented'
              }
              metadata[str(mid)]=records
              print(f'MAP {mid}: {W}x{H}, source chunks {cols}x{rows} at 512px + GPU zoom 2x, passable {sum(walk)}, entry {entry}, stairs {stairs}',flush=True)
          Path('build/terrain2x.json').write_text(json.dumps(metadata,ensure_ascii=False),encoding='utf-8')
          # A tiny transparent tileset: RGSS retains the native 32px collision grid.
          # The map visuals are independent background chunks, not a huge RGSS atlas.
          tile=Image.new('RGBA',(256,32),(0,0,0,0))
          tile.save(root/'Graphics/Tilesets/SLTI_Collision_Transparent.png')
          PY_TERRAIN
          python3 /tmp/terrain_2x.py

      - name: V229R31 Restore all original dungeon events and native collision after 2x
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/native_maps_clean.rb <<'RUBY_MAPS'
          require 'json'
          require 'zlib'
          require 'base64'
          require 'digest'

          module RPG
            class Map; end
            class MapInfo; end
            class AudioFile; end
            class Tileset; end
            class Event
              class Page
                class Condition; end
                class Graphic; end
              end
            end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
          end
          class Table
            def self._load(raw)
              o = allocate
              o.instance_variable_set(:@raw, raw)
              o
            end
            def _dump(depth=0); @raw; end
            def self.make(values)
              _load([1,values.length,1,1,values.length].pack('V5') + values.pack('v*'))
            end
            def self.map(width,height,ids)
              raise 'Map cell count mismatch' unless ids.length==width*height
              _load([3,width,height,3,width*height*3].pack('V5') + ids.pack('v*') + "\0" * (width*height*4))
            end
          end
          class Tone
            def self._load(raw); o=allocate; o.instance_variable_set(:@raw,raw); o; end
            def _dump(depth=0); @raw; end
          end
          class Color < Tone; end

          def get(obj,k); obj.instance_variable_get('@'+k); end
          def put(obj,k,v); obj.instance_variable_set('@'+k,v); end

          root=ARGV.fetch(0)
          meta=JSON.parse(File.read(ARGV.fetch(1)))
          data=root+'/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          mapfile=->(id){data+("%sMap%03d.rxdata" % [pre,id])}
          setsfile=data+pre+'Tilesets.rxdata'
          infosfile=data+pre+'MapInfos.rxdata'
          sets=Marshal.load(File.binread(setsfile))
          infos=Marshal.load(File.binread(infosfile))
          raise 'Original dungeon tileset absent' unless get(sets[3],'tileset_name').dup.force_encoding('UTF-8')=='던전'
          raise 'New maps already exist' if [45,46].any?{|n| infos[n] || File.exist?(mapfile.call(n))}
          original_sha=(1..44).to_h{|id|[id,Digest::SHA256.file(mapfile.call(id)).hexdigest]}
          reports={}
          entry_positions={}

          # All native events, pages, monsters, healer, attack scripts and event IDs
          # are copied from original Map014/Map020; no new monster data is invented.
          [[45,14],[46,20]].each do |mid,source_id|
            source=Marshal.load(File.binread(mapfile.call(source_id)))
            copied=Marshal.load(Marshal.dump(source))
            d=meta.fetch(mid.to_s)
            w=d.fetch('width');h=d.fetch('height')
            ids=Zlib::Inflate.inflate(Base64.strict_decode64(d.fetch('tilesBase64'))).unpack('v*')
            walk=Zlib::Inflate.inflate(Base64.strict_decode64(d.fetch('walkBase64')))
            raise 'Bad terrain grid' unless walk.bytesize==w*h && ids.length==w*h
            raise 'Unexpected collision tile IDs' unless ids.uniq.sort==[384,385]
            start=d.fetch('entry')
            raise 'Blocked start' unless walk.getbyte(start[1]*w+start[0])==1
            queue=[start[1]*w+start[0]]
            reached={queue[0]=>true}
            pos=0
            while pos<queue.length
              v=queue[pos];pos+=1
              x=v%w;y=v/w
              [[x-1,y],[x+1,y],[x,y-1],[x,y+1]].each do |nx,ny|
                next unless nx>=0 && ny>=0 && nx<w && ny<h
                i=ny*w+nx
                next unless walk.getbyte(i)==1 && !reached[i]
                reached[i]=true
                queue<<i
              end
            end
            raise 'Playable floor disconnected' unless queue.length==d.fetch('entryConnectedCells') && queue.length>500
            entry_positions[mid]=start
            # Preserve the original destination-map collision checks with passability
            # flags in the RGSS 32px tile layer, as R21 did, not a transparent overlay.
            tileset=Marshal.load(Marshal.dump(sets[3]))
            tile_id=sets.length
            put(tileset,'id',tile_id)
            put(tileset,'name',"Sanctuary native collision #{mid}")
            put(tileset,'tileset_name','SLTI_Collision_Transparent')
            put(tileset,'autotile_names',Array.new(7,''))
            put(tileset,'panorama_name','');put(tileset,'fog_name','')
            passages=Array.new(386,0)
            passages[385]=15
            priorities=Array.new(386,0)
            priorities[0]=5
            put(tileset,'passages',Table.make(passages))
            put(tileset,'priorities',Table.make(priorities))
            put(tileset,'terrain_tags',Table.make(Array.new(386,0)))
            sets << tileset
            put(copied,'width',w)
            put(copied,'height',h)
            put(copied,'tileset_id',tile_id)
            put(copied,'data',Table.map(w,h,ids))
            events=get(copied,'events')
            source_events=get(source,'events')
            raise 'Original events missing' unless events.keys.sort==source_events.keys.sort
            raise 'Unexpected event count' unless events.size==(mid==45 ? 14 : 12)

            used=[start]
            dx=start[0]-2*61
            dy=start[1]-2*13
            # Connected RGSS 32px grid; locate the closest native event position
            # to its source offset, while keeping exit and NPC off the arrival cell.
            def choose(goal,area,w,used,spacing=2)
              eligible=area.select do |i|
                x=i%w;y=i/w
                used.all?{|ux,uy|[ (x-ux).abs,(y-uy).abs ].max >=spacing}
              end
              eligible=area if eligible.empty?
              node=eligible.min_by{|i|x=i%w;y=i/w;[(x-goal[0]).abs+(y-goal[1]).abs,(x-goal[0]).abs,i]}
              [node%w,node/w]
            end
            locations={}
            # Staircase, exit and healer are reserved before monster placement.
            important= if mid==45
                         [1,2,13]
                       else
                         [2,3]
                       end
            order=important+(events.keys.sort-important)
            order.each do |eid|
              event=events.fetch(eid)
              gx,gy= if mid==45 && eid==1
                       d.fetch('stairs')
                     elsif eid==2
                       [start[0]-3,start[1]]
                     elsif (mid==45 && eid==13)||(mid==46 && eid==3)
                       [start[0]+4,start[1]]
                     else
                       [get(event,'x')*2+dx,get(event,'y')*2+dy]
                     end
              spacing=(eid==1 || eid==2) ? 2 : 3
              at=choose([gx,gy],queue,w,used,spacing)
              raise 'Exit overlaps entrance' if eid==2 && at==start
              raise 'Event outside passable component' unless reached[at[1]*w+at[0]]
              put(event,'x',at[0]);put(event,'y',at[1]);used<<at
              locations[eid]=at
            end
            events.each do |eid,event|
              get(event,'pages').each do |page|
                get(page,'list').each do |cmd|
                  op=get(cmd,'code');params=get(cmd,'parameters')
                  if op==202 && params.is_a?(Array) && params.size>=4 && params[0]==0 && params[1]==0
                    original_target=[params[2]*2+dx,params[3]*2+dy]
                    safe=choose(original_target,queue,w,used,1)
                    revised=params.dup;revised[2]=safe[0];revised[3]=safe[1]
                    put(cmd,'parameters',revised)
                  elsif op==201 && params.is_a?(Array) && params[0]==0
                    revised=params.dup
                    if mid==45 && eid==1 && params[1]==20
                      revised[1]=46
                      revised[2],revised[3]=*meta.fetch('46').fetch('entry')
                    elsif mid==46 && eid==2 && params[1]==14
                      revised[1]=45
                      d1=meta.fetch('45')
                      w1=d1.fetch('width');h1=d1.fetch('height')
                      walk1=Zlib::Inflate.inflate(Base64.strict_decode64(d1.fetch('walkBase64')))
                      stairs=d1.fetch('stairs')
                      # Two steps away from the 1F staircase so return does not retrigger.
                      choices=[[stairs[0]-2,stairs[1]],[stairs[0]+2,stairs[1]],[stairs[0],stairs[1]+2],[stairs[0],stairs[1]-2]]
                      landing=choices.find{|x,y|x>=0 && y>=0 && x<w1 && y<h1 && walk1.getbyte(y*w1+x)==1}
                      landing ||=stairs
                      revised[2]=landing[0];revised[3]=landing[1]
                    end
                    put(cmd,'parameters',revised) unless revised==params
                  elsif op==355 && params.is_a?(Array) && params[0].is_a?(String)
                    line=params[0].dup.force_encoding('UTF-8')
                    if line.valid_encoding? && line.include?('$MapName') && line.include?('수련 던전')
                      # Keep R21's already established in-game dungeon area label.
                      put(cmd,'parameters',[line.gsub('수련 던전','말섬던전')]+params.drop(1))
                    end
                  end
                end
              end
            end
            # Full original event IDs AND pages are preserved; only positions and the
            # two required floor transfer coordinates are rewritten.
            events.each do |eid,e|
              orig=source_events.fetch(eid)
              raise 'Event pages lost' unless get(e,'pages').size==get(orig,'pages').size
              raise 'Event ID changed' unless get(e,'id')==eid
            end
            File.binwrite(mapfile.call(mid),Marshal.dump(copied))
            mapinfo=Marshal.load(Marshal.dump(infos[source_id]))
            put(mapinfo,'name',"Sanctuary 말섬던전 #{mid==45 ? '1' : '2'}층")
            put(mapinfo,'parent_id',0);put(mapinfo,'order',mid)
            infos[mid]=mapinfo
            reports[mid.to_s]={sourceMap:source_id,events:events.size,ids:events.keys.sort,
                 positions:locations,entry:start,exit:locations.fetch(2),
                 entryConnected:queue.length,stair:d.fetch('stairs')}
            puts "PASS Map#{mid}: original #{events.size} events/pages preserved, entry #{start} vs exit #{locations.fetch(2)}"
          end

          town=Marshal.load(File.binread(mapfile.call(29)))
          npc=get(town,'events').fetch(11)
          raise 'Wrong town teleporter' unless [get(npc,'x'),get(npc,'y')]==[70,48]
          commands=get(get(npc,'pages').first,'list')
          placeholder='말섬던전은 별도 맵 연결 후 이용할 수 있습니다.'
          old=commands.select{|cmd|get(cmd,'code')==101 && get(cmd,'parameters')==[placeholder]}
          raise 'Existing dungeon menu branch changed' unless old.length==1
          put(old[0],'code',201)
          put(old[0],'parameters',[0,45,*entry_positions.fetch(45),0,1])
          File.binwrite(mapfile.call(29),Marshal.dump(town))
          File.binwrite(setsfile,Marshal.dump(sets))
          File.binwrite(infosfile,Marshal.dump(infos))
          (1..44).each do |id|
            next if id==29
            raise "Original map #{id} modified" unless original_sha[id]==Digest::SHA256.file(mapfile.call(id)).hexdigest
          end
          File.write(ARGV.fetch(2),JSON.pretty_generate(reports))
          puts 'PASS cleaned R16 engine: original 43 maps untouched; town teleporter + 26 native dungeon events restored'
          RUBY_MAPS
          ruby -c /tmp/native_maps_clean.rb
          ruby /tmp/native_maps_clean.rb site build/terrain2x.json build/portal-events.json

      - name: V229R31 Add map-only 2x visuals to active renderer #97
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/render_chunks.rb <<'RUBY_RENDER'
          require 'zlib'
          require 'digest'
          root = ARGV.fetch(0)
          path = root + '/knight/gameasync/Data/Scripts.rxdata'
          original = File.binread(path)
          scripts = Marshal.load(original)
          raise 'Missing script 97' unless scripts.length > 97
          raise 'Wrong resolution script' unless scripts[97][1].dup.force_encoding('UTF-8') == '해상도'
          raise 'Original Spriteset_Map slot changed' unless scripts[32][1] == 'Spriteset_Map'
          source = Zlib::Inflate.inflate(scripts[97][2])
          # Script 97 is loaded AFTER script 32 and redefines initialize, update, dispose.
          # Never patch script 32: its implementation is overridden before gameplay.
          raise 'Missing late renderer' unless source.scan('class Spriteset_Map').size == 1
          raise 'Wrong active viewport' unless source.include?('@tilemap = Tilemap.new(@viewport2)')
          raise 'Wrong existing panorama viewport' unless source.include?('@panorama = Sprite.new(@viewport2)')
          init = '    @panorama.z = -2000'
          update = '    @tilemap4.update'
          dispose = '    @panorama.dispose'
          [init, update, dispose].each do |needle|
            raise "Missing or repeated anchor #{needle}" unless source.scan(needle).size == 1
          end
          source = source.sub(init, init + %q{
              # V229R31: source terrain chunks, attached to the ACTIVE renderer.
              @slti_chunks = {}
              @slti_floor = [45,46].include?($game_map.map_id) ? $game_map.map_id : nil
              @slti_cols = @slti_floor == 45 ? 9 : (@slti_floor == 46 ? 11 : 0)
              @slti_rows = @slti_floor == 45 ? 5 : (@slti_floor == 46 ? 6 : 0)})
          source = source.sub(update, update + %q{
              slti_update_terrain if @slti_floor})
          source = source.sub(dispose, %q{
              if @slti_chunks
                @slti_chunks.each_value do |sprite|
                  old_bitmap = sprite.bitmap
                  sprite.bitmap = nil
                  sprite.dispose
                  old_bitmap.dispose if old_bitmap != nil && !old_bitmap.disposed?
                end
                @slti_chunks.clear
              end
          } + dispose)
          method = %q{
            # V229R31: bounded 512px texture streaming for the original 2x map.
            # Only screen-visible chunks are resident. One terrain chunk = 512x512
            # RGBA (1 MiB) and Sprite.zoom 2x; no 1024px bitmap allocations.
            # This changes neither native map movement nor battle scripts.
            def slti_update_terrain
              sx = $game_map.display_x / 4
              sy = $game_map.display_y / 4
              left = [sx / 1024, 0].max
              top = [sy / 1024, 0].max
              right = [(sx + $window_width2 - 1) / 1024, @slti_cols - 1].min
              bottom = [(sy + $window_height2 - 1) / 1024, @slti_rows - 1].min
              visible = {}
              for y in top..bottom
                for x in left..right
                  visible[[x, y]] = true
                end
              end
              # Release old images BEFORE allocating new ones to lower peak RAM.
              @slti_chunks.keys.each do |key|
                next if visible[key]
                sprite = @slti_chunks.delete(key)
                old_bitmap = sprite.bitmap
                sprite.bitmap = nil
                sprite.dispose
                old_bitmap.dispose if old_bitmap != nil && !old_bitmap.disposed?
              end
              # Limit new image decodes to two per frame to avoid a mobile RAM spike.
              new_count = 0
              visible.each_key do |key|
                x, y = key
                sprite = @slti_chunks[key]
                if sprite == nil
                  next if new_count >= 2
                  sprite = Sprite.new(@viewport2)
                  sprite.z = -1500
                  sprite.zoom_x = 2.0
                  sprite.zoom_y = 2.0
                  name = "Graphics/Panoramas/SLTI_#{@slti_floor}_C#{x}_#{y}"
                  sprite.bitmap = Bitmap.new(name)
                  @slti_chunks[key] = sprite
                  new_count += 1
                end
                sprite.x = x * 1024 - sx
                sprite.y = y * 1024 - sy
              end
              raise 'Too many terrain textures' if @slti_chunks.size > 4
            end
          }
          raise 'Unexpected resolution script ending' unless source.rstrip.end_with?('end')
          source = source.rstrip.sub(/end\z/, method + "\nend\n")
          scripts[97][2] = Zlib::Deflate.deflate(source)
          File.binwrite(path,Marshal.dump(scripts))
          rebuilt=Marshal.load(File.binread(path))
          raise 'Other Ruby scripts changed' unless scripts.each_index.all?{|i|i==97 || scripts[i]==rebuilt[i]}
          baseline=Marshal.load(original)
          raise 'Unexpected non-renderer script edit' unless scripts.each_index.all?{|i|i==97 || scripts[i]==baseline[i]}
          raise 'Base Spriteset_Map was modified' unless scripts[32]==baseline[32]
          raise 'No actual patch' if original==File.binread(path)
          raise 'Active viewport not used' unless source.include?('Sprite.new(@viewport2)')
          raise 'Missing on-frame render call' unless source.include?('slti_update_terrain if @slti_floor')
          File.binwrite(ARGV.fetch(1),source)
          puts 'PASS: active script97 renderer connected; base script32, movement, combat unchanged'
          RUBY_RENDER
          ruby -c /tmp/render_chunks.rb
          ruby /tmp/render_chunks.rb site build/Spriteset_Map_V229R31.rb
          ruby -c build/Spriteset_Map_V229R31.rb

      - name: V229R31 Register only original game and new map assets
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/register.py <<'PY_REG'
          from pathlib import Path
          import hashlib,json,re,sys
          root=Path(sys.argv[1]);g=root/'knight/gameasync'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          changed=[
              f'Data/{pre}Tilesets.rxdata',f'Data/{pre}MapInfos.rxdata',
              f'Data/{pre}Map029.rxdata','Data/Scripts.rxdata'
          ]
          added=[f'Data/{pre}Map045.rxdata',f'Data/{pre}Map046.rxdata',
                 'Graphics/Tilesets/SLTI_Collision_Transparent.png']
          added += [str(p.relative_to(g)) for p in sorted((g/'Graphics/Panoramas').glob('SLTI_*.png'))]
          mapping=g/'mapping.js';s=mapping.read_text(encoding='utf-8')
          for item in changed:
              digest=hashlib.md5((g/item).read_bytes()).hexdigest()
              pattern=re.escape(item+'?h=')+r'[0-9a-f]{32}'
              s,n=re.subn(pattern,lambda m:item+'?h='+digest,s)
              assert n==1,(item,n)
          lines=[]
          for item in added:
              path=g/item;assert path.is_file(),item
              key=item.rsplit('.',1)[0].lower();digest=hashlib.md5(path.read_bytes()).hexdigest()
              assert ('["'+key+'",') not in s,key
              lines.append('['+json.dumps(key,ensure_ascii=False)+', '+json.dumps(item+'?h='+digest,ensure_ascii=False)+'],\n')
          assert s.count('\n];\n\nvar mapping')==1
          s=s.replace('\n];\n\nvar mapping','\n'+''.join(lines)+'];\n\nvar mapping',1)
          mapping.write_text(s,encoding='utf-8')
          for file in (root/'index.html',root/'knight/index.html'):
              t=file.read_text(encoding='utf-8')
              assert 'V229R16' in t
              t=t.replace('V229R16','V229R31').replace('v229r16','v229r31')
              file.write_text(t,encoding='utf-8')
          Path('build/asset-list.json').write_text(json.dumps({'changed':changed,'added':added},indent=2,ensure_ascii=False))
          print('Registered',len(added),'new graphics/maps in EXISTING game site/')
          PY_REG
          python3 /tmp/register.py site
          node --check site/knight/gameasync/mapping.js

      - name: V229R31 Install original R16 per-floor preload manifests WITHOUT JS edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_MANIFEST'
          from pathlib import Path
          import json,hashlib
          root=Path('site/knight')
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          for mid,n in ((45,45),(46,66)):
              tiles=sorted((root/'gameasync/Graphics/Panoramas').glob(f'SLTI_{mid}_C*.png'))
              assert len(tiles)==n,(mid,len(tiles))
              dest=root/'preload/Data'/f'{pre}Map{mid:03}.rxdata.json'
              dest.parent.mkdir(parents=True,exist_ok=True)
              names=['Graphics/Panoramas/'+p.name for p in tiles]
              dest.write_text(json.dumps(names,separators=(',',':'))+'\n',encoding='utf-8')
              assert json.loads(dest.read_text())==names
              print('Original map preload manifest, floor',mid,'items',n)
          orig=Path('pristine/knight/js/drive.js').read_bytes()
          current=(root/'js/drive.js').read_bytes()
          assert orig==current,'Native drive.js must be untouched'
          print('PASS original R16 drive.js and map load callback byte-for-byte retained')
          PY_MANIFEST

      - name: V229R31 Verify event cleanup and pre-transfer playable entrance
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/verify_events.rb <<'RUBY_VERIFY'
          require 'json'
          module RPG
            class Map;end;class MapInfo;end;class Tileset;end;class AudioFile;end
            class Event
              class Page;class Condition;end;class Graphic;end;end
            end
            class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          class Table
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(depth=0);@raw;end
            def [](x,y=0,z=0)
              dim,w,h,l,_=@raw.unpack('V5')
              return nil unless x>=0&&x<w&&y>=0&&y<h&&z>=0&&z<l
              @raw.byteslice(20+2*(x+y*w+z*w*h),2).unpack('v')[0]
            end
          end
          class Tone
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(depth=0);@raw;end
          end
          class Color<Tone;end
          data='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          path=->(id){data+('%sMap%03d.rxdata'%[pre,id])}
          portal=JSON.parse(File.read('build/portal-events.json'))
          sets=Marshal.load(File.binread(data+pre+'Tilesets.rxdata'))
          [[45,14,14],[46,20,12]].each do |id,original,num|
            m=Marshal.load(File.binread(path.call(id)))
            o=Marshal.load(File.binread(path.call(original)))
            es=m.instance_variable_get(:@events)
            orig=o.instance_variable_get(:@events)
            raise 'Original native events were dropped' unless es.keys.sort==orig.keys.sort && es.size==num
            es.each do |eid,e|
              before=orig[eid].instance_variable_get(:@pages)
              after=e.instance_variable_get(:@pages)
              raise 'Event pages missing' unless before.size==after.size
              before.zip(after).each do |p0,p1|
                c0=p0.instance_variable_get(:@list)
                c1=p1.instance_variable_get(:@list)
                raise 'Event commands removed or reordered' unless c0.map{|c|c.instance_variable_get(:@code)}==c1.map{|c|c.instance_variable_get(:@code)}
                c0.zip(c1).each do |old,newcmd|
                  code=old.instance_variable_get(:@code)
                  next if [201,202,355].include?(code)
                  raise 'Unexpected event operation edit' unless Marshal.dump(old.instance_variable_get(:@parameters))==Marshal.dump(newcmd.instance_variable_get(:@parameters))
                end
              end
            end
            report=portal.fetch(id.to_s)
            x,y=report.fetch('entry');ex,ey=report.fetch('exit')
            raise 'Old overlapping exit event still present' if [x,y]==[ex,ey]
            t=sets.fetch(m.instance_variable_get(:@tileset_id))
            flags=t.instance_variable_get(:@passages)
            width=m.instance_variable_get(:@width);height=m.instance_variable_get(:@height)
            map=m.instance_variable_get(:@data)
            directions={8=>[0,-1],2=>[0,1],4=>[-1,0],6=>[1,0]}
            passable=[]
            directions.each do |dir,(dx,dy)|
              nx=x+dx;ny=y+dy
              next unless nx.between?(0,width-1)&&ny.between?(0,height-1)
              next unless (flags[map[x,y,0]]&15)==0 && (flags[map[nx,ny,0]]&15)==0
              next if es.values.any?{|e|e.instance_variable_get(:@x)==nx && e.instance_variable_get(:@y)==ny && e.instance_variable_get(:@pages).any?{|p|p.instance_variable_get(:@graphic).instance_variable_get(:@character_name).to_s.size>0}}
              passable<<dir
            end
            raise 'Spawn is enclosed' unless passable.size>=2
            puts "PASS Map#{id}: #{num} original events, entry #{x},#{y}, exit #{ex},#{ey}, free directions=#{passable.inspect}"
          end
          RUBY_VERIFY
          ruby -c /tmp/verify_events.rb
          ruby /tmp/verify_events.rb

      - name: V229R31 Verify original engine and in-game map/teleporter integration
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/validate.py <<'PY_VALIDATE'
          from pathlib import Path
          import hashlib,json,subprocess,zlib,base64,sys
          old=Path('pristine');site=Path('site');test=site
          info=json.loads(Path('build/terrain2x.json').read_text())
          for mid in ('45','46'):
              d=info[mid]
              assert d['graphicScale']==2 and d['chunkSize']==1024
              assert d['sourceTextureSize']==512 and d['textureZoom']==2
              assert d['width']*32==d['chunkCols']*1024 or d['width']*32<d['chunkCols']*1024
              assert d['entryConnectedCells']>500
              assert 0<=d['entry'][0]<d['width'] and 0<=d['entry'][1]<d['height']
              assert len(d['files'])==d['chunkCols']*d['chunkRows']
              mask=zlib.decompress(base64.b64decode(d['walkBase64']))
              assert len(mask)==d['width']*d['height']
              from PIL import Image
              for name in d['files']:
                  filename=test/'knight/gameasync'/name
                  assert filename.is_file(),name
                  with Image.open(filename) as image:
                      assert image.size==(512,512),(name,image.size)
          # The game is deployed only at its EXISTING root. No secondary site.
          assert not (site/'test-map-v229r22').exists()
          assert not (site/'test-map-v229r31').exists()
          originals={str(p.relative_to(old)):hashlib.sha256(p.read_bytes()).hexdigest()
                     for p in old.rglob('*') if p.is_file()}
          output={str(p.relative_to(site)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in site.rglob('*') if p.is_file()}
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          modified={f'knight/gameasync/Data/{pre}Map029.rxdata',
                    f'knight/gameasync/Data/{pre}Tilesets.rxdata',
                    f'knight/gameasync/Data/{pre}MapInfos.rxdata',
                    'knight/gameasync/Data/Scripts.rxdata',
                    'knight/gameasync/mapping.js','knight/index.html','index.html'}
          actual={k for k in originals if originals[k]!=output.get(k)}
          assert actual==modified,('Unexpected existing game files modified',actual^modified)
          asset_list=json.loads(Path('build/asset-list.json').read_text(encoding='utf-8'))
          expected_add={('knight/gameasync/'+name) for name in asset_list['added']}
          actual_add=set(output)-set(originals)
          expected_add|={f'knight/preload/Data/{pre}Map{n:03}.rxdata.json' for n in (45,46)}
          assert actual_add==expected_add,('Missing/unexpected new game assets',actual_add^expected_add)
          assert len(output)==len(originals)+len(expected_add)
          assert 'V229R31' in (site/'index.html').read_text(encoding='utf-8')
          assert 'V229R31' in (site/'knight/index.html').read_text(encoding='utf-8')
          assert (site/'knight/js/drive.js').read_bytes()==(old/'knight/js/drive.js').read_bytes()
          assert not any(x in (site/'knight/js/drive.js').read_text() for x in ('sltiDownloadFloor','sltiFloorCompleted','sltiActivateMapAssets'))
          assert not any(x in (site/'knight/index.html').read_text() for x in ('slti_diag','test-map-v229r31'))
          assert 'test-map-v229r31' not in (site/'knight/index.html').read_text(encoding='utf-8')
          scripts=site/'knight/gameasync/Data/Scripts.rxdata'
          assert scripts.is_file()
          ruby_check=r"""
          require 'zlib'
          module RPG
            class Map;end;class MapInfo;end;class AudioFile;end;class Tileset;end
            class Event
              class Page
                class Condition;end;class Graphic;end
              end
            end
            class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          class Table
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(depth=0);@raw;end
          end
          class Tone
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(depth=0);@raw;end
          end
          class Color<Tone;end
          root=ARGV[0];pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          a=Marshal.load(File.binread(root+'/knight/gameasync/Data/Scripts.rxdata'))
          b=Marshal.load(File.binread(ARGV[1]+'/knight/gameasync/Data/Scripts.rxdata'))
          raise 'Unexpected other script modified' unless a.each_index.all?{|i|i==97 || a[i]==b[i]}
          raise 'Default renderer script 32 changed' unless a[32]==b[32]
          raise 'Active renderer script 97 not changed' if a[97]==b[97]
          patched=Zlib::Inflate.inflate(a[97][2])
          raise 'Renderer not connected to viewport2' unless patched.include?('Sprite.new(@viewport2)')
          raise 'Renderer update not connected' unless patched.include?('slti_update_terrain if @slti_floor')
          raise 'Renderer terrain chunk lifetime not installed' unless patched.include?('@slti_chunks.each_value')
          raise '2x visual zoom absent' unless patched.include?('sprite.zoom_x = 2.0') && patched.include?('sprite.zoom_y = 2.0')
          raise 'Visible-only chunks absent' unless patched.include?('right = [(sx + $window_width2 - 1) / 1024')
          raise 'Old 1024px source texture path detected' if patched.include?('sx / 1024 - 1')
          town=Marshal.load(File.binread(root+'/knight/gameasync/Data/'+pre+'Map029.rxdata'))
          e=town.instance_variable_get('@events').fetch(11)
          commands=e.instance_variable_get('@pages').first.instance_variable_get('@list')
          text='말섬던전은 별도 맵 연결 후 이용할 수 있습니다.'
          raise 'Placeholder still active' if commands.any?{|c|c.instance_variable_get('@code')==101 && c.instance_variable_get('@parameters')==[text]}
          raise 'In-game transfer absent' unless commands.any?{|c|c.instance_variable_get('@code')==201 && c.instance_variable_get('@parameters')[0,2]==[0,45]}
          [45,46].each do |mid|
            path=root+'/knight/gameasync/Data/'+('%sMap%03d.rxdata'%[pre,mid])
            raise 'Missing map' unless File.file?(path)
            m=Marshal.load(File.binread(path))
            raise 'Missing map event' if m.instance_variable_get('@events').empty?
          end
          puts 'PASS Map045/046, NPC teleporter, script97 512px/2x zoom and visible-only streaming; base script32 untouched'
          """
          result=subprocess.run(['ruby','-e',ruby_check,str(site),str(old)],text=True,capture_output=True)
          assert result.returncode==0,(result.stdout,result.stderr)
          print(result.stdout.strip())
          print('PASS V229R31: 2x geometry with source 512px chunks. Existing game URL, no alternate site. Deploy next.')
          PY_VALIDATE
          python3 /tmp/validate.py

      - name: V229R31 Upload in-game map build audit
        uses: actions/upload-artifact@v4
        with:
          name: SLKnight-V229R31-InGame-Sanctuary-2x-Audit
          path: |
            build/terrain2x.json
            build/portal-events.json
            build/asset-list.json
          if-no-files-found: error
          retention-days: 30

      - name: V229R31 Upload cleaned game to EXISTING GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
