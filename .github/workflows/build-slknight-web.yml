          )

          names=data['files']

          assert len(names)==52
          assert len(set(names))==52

          mapper=game/'mapping.js'
          s=mapper.read_text('utf8')

          for name in changed:

              p=game/'Data'/name

              key=str(p.relative_to(root))

              original=before[key]['md5']
              current=hashlib.md5(p.read_bytes()).hexdigest()

              assert original!=current,name

              marker='Data/'+name+'?h='

              pattern=re.escape(marker)+r'[0-9a-f]{32}'

              assert re.findall(pattern,s)==[marker+original],name

              s=re.sub(
                  pattern,
                  lambda _:marker+current,
                  s
              )

          bitmap=game/'bitmap-map.js'
          b=bitmap.read_text('utf8')

          pack=root/'knight/assets/shared-v229r115.pack'

          raw=pack.read_bytes()

          headlen=struct.unpack_from('<I',raw)[0]

          head=json.loads(
              raw[4:4+headlen].decode('utf8')
          )

          body=bytearray(raw[4+headlen:])

          assert head['kind']=='shared'
          assert isinstance(head['files'],list)

          original_rows=[
              list(row) for row in head['files']
          ]

          old_count=len(original_rows)
          old_body=bytes(body)

          keys={row[0] for row in original_rows}

          assert len(keys)==old_count

          mapping_rows=[]
          bitmap_rows=[]
          added=[]

          for name in names:

              rel='Graphics/Characters/'+name+'.png'

              p=game/rel
              png=p.read_bytes()

              assert png[:8]==b'\x89PNG\r\n\x1a\n'

              key='graphics/characters/'+name.lower()

              assert key not in keys
              assert '"'+key+'"' not in s
              assert '"'+key+'"' not in b

              keys.add(key)

              digest=hashlib.md5(png).hexdigest()

              mapping_rows.append(
                  json.dumps(
                      [key,rel+'?h='+digest],
                      ensure_ascii=False
                  )+','
              )

              with Image.open(p) as im:
                  w,h=im.size
                  assert w>0 and h>0

              bitmap_rows.append(
                  json.dumps(key)+': '+json.dumps([
                      w,
                      h,
                      'data:image/png;base64,'+
                      base64.b64encode(png).decode('ascii')
                  ])+','
              )

              head['files'].append([
                  key,
                  len(body),
                  len(png)
              ])

              body.extend(png)

              added.append(str(p.relative_to(root)))

          assert head['files'][:old_count]==original_rows
          assert bytes(body[:len(old_body)])==old_body
          assert len(head['files'])==old_count+52

          anchor='];\n\nvar mapping = {};'

          assert s.count(anchor)==1

          s=s.replace(
              anchor,
              '\n'.join(mapping_rows)+'\n'+anchor
          )

          assert b.rstrip().endswith('};')

          end=b.rfind('};')

          b=b[:end]+'\n'.join(bitmap_rows)+'\n'+b[end:]

          mapper.write_text(s,'utf8')
          bitmap.write_text(b,'utf8')

          encoded=json.dumps(
              head,
              ensure_ascii=False,
              separators=(',',':')
          ).encode('utf8')

          pack.write_bytes(
              struct.pack('<I',len(encoded))+
              encoded+
              bytes(body)
          )

          loader=root/'knight/js/sl-assets-v229r115.js'

          js=loader.read_text('utf8')

          assert js.count("var version='V4.10';")==1

          js=js.replace(
              "var version='V4.10';",
              "var version='V4.11';"
          )

          old="'shared-v229r115.pack'"

          assert js.count(old)==1

          js=js.replace(
              old,
              "'shared-v229r115.pack?v=V4.11'"
          )

          loader.write_text(js,'utf8')

          for name in ('index.html','knight/index.html'):

              p=root/name

              raw=p.read_bytes()

              assert b'V4.10' in raw,name

              p.write_bytes(
                  raw.replace(b'V4.10',b'V4.11')
                     .replace(b'v4.10',b'v4.11')
              )

          Path('/tmp/sl411-added.json').write_text(
              json.dumps(added,sort_keys=True),
              'utf8'
          )

          print('PASS original shared asset pack retained')
          print('PASS 52 added character sheets')
          print('PASS all new PNG mapping and bitmap entries')
          print('PASS V4.11 version')
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/gameasync/bitmap-map.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Verify exact approved V4.11 changes
        shell: bash
        run: |
          set -euo pipefail

          /tmp/sl411-venv/bin/python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import struct

          from PIL import Image

          root=Path('site')
          game=root/'knight/gameasync'

          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          before=json.loads(
              Path('/tmp/sl411-before.json').read_text('utf8')
          )

          after={
              str(p.relative_to(root)):hashlib.sha256(
                  p.read_bytes()
              ).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          added=set(
              json.loads(
                  Path('/tmp/sl411-added.json').read_text('utf8')
              )
          )

          assert len(added)==52
          assert not set(before)-set(after)
          assert set(after)-set(before)==added
          assert len(after)==6085

          changed={
              name for name in before
              if before[name]['sha256']!=after[name]
          }

          data_names=set(
              json.loads(
                  Path('/tmp/sl411-changed.json').read_text('utf8')
              )
          )

          allowed={
              'knight/gameasync/Data/'+name
              for name in data_names
          }|{
              'knight/gameasync/mapping.js',
              'knight/gameasync/bitmap-map.js',
              'knight/assets/shared-v229r115.pack',
              'knight/js/sl-assets-v229r115.js',
              'index.html',
              'knight/index.html'
          }

          assert changed==allowed,sorted(changed^allowed)

          for name in (
              'Actors',
              'Classes',
              'Weapons',
              'Armors',
              'Items',
              'MonsterStats',
              'CommonEvents',
              'Tilesets',
              'System',
              'MapInfos'
          ):

              key='knight/gameasync/Data/'+pre+name+'.rxdata'

              assert before[key]['sha256']==after[key],name

          mapping=(game/'mapping.js').read_text('utf8')

          for name in data_names:

              p=game/'Data'/name

              marker=(
                  'Data/'+name+'?h='+
                  hashlib.md5(p.read_bytes()).hexdigest()
              )

              assert mapping.count(marker)==1,name

          data=json.loads(
              Path('/tmp/sl411-motion.json').read_text('utf8')
          )

          assert sum(
              len(v) for v in data['motions'].values()
          )==44

          assert len(data['death'])==8

          for body,weapons in data['motions'].items():

              for typ,m in weapons.items():

                  name,ticks,strike,ground=m

                  assert ticks>0
                  assert 0<=strike<6
                  assert ground>=17

                  p=game/'Graphics/Characters'/(name+'.png')

                  with Image.open(p) as im:

                      assert im.width%14==0
                      assert im.height%4==0

                      cw=im.width//14
                      ch=im.height//4

                      for row in range(4):
                          for col in range(14):

                              cell=im.crop((
                                  col*cw,
                                  row*ch,
                                  (col+1)*cw,
                                  (row+1)*ch
                              ))

                              assert cell.getbbox(),(
                                  name,row,col
                              )

          for body,m in data['death'].items():

              name,durations,ground=m

              p=game/'Graphics/Characters'/(name+'.png')

              assert durations
              assert min(durations)>0

              with Image.open(p) as im:
                  assert im.width%len(durations)==0
                  assert im.height%4==0

          raw=(
              root/'knight/assets/shared-v229r115.pack'
          ).read_bytes()

          hlen=struct.unpack_from('<I',raw)[0]
          head=json.loads(raw[4:4+hlen])

          rows=head['files']

          keys=[r[0] for r in rows]

          assert len(keys)==len(set(keys))

          index={r[0]:r for r in rows}

          for name in data['files']:

              key='graphics/characters/'+name.lower()

              assert key in index

              _,off,size=index[key]

              start=4+hlen+off

              assert start+size<=len(raw)

              p=game/'Graphics/Characters'/(name+'.png')

              assert raw[start:start+size]==p.read_bytes()

          loader=root/'knight/js/sl-assets-v229r115.js'

          assert loader.read_bytes().count(
              b"var version='V4.11';"
          )==1

          print('PASS 8 character classes and genders')
          print('PASS 44 original weapon motion combinations')
          print('PASS 176 four-direction motion branches')
          print('PASS original 4-frame movement')
          print('PASS original 6-frame attack format')
          print('PASS 8 original death motions')
          print('PASS unchanged non-target files')
          print('PASS V4.11 candidate')

          print('Modified existing files:',len(changed))
          print('Added graphics:',len(added))
          print('Unchanged files:',len(before)-len(changed))
          PY

      - name: Upload V4.11 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
