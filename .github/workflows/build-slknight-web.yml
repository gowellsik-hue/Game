          ruby -c build/clone_queen.rb

          ZQ_GAME_ROOT=site/knight/gameasync \
            ZQ_REVIEW_DIR=build/zq_review ruby build/clone_queen.rb

      - name: Register native graphics and three data file hashes
        shell: bash
        run: |
          set -euo pipefail

          cat > build/build_mapping.py <<'QUEEN_MAPPING'
          from pathlib import Path
          import hashlib,re,os

          base=Path(os.environ.get(
            'ZQ_REVIEW_DIR','build/zq_review'
          ))

          original=(
            Path(os.environ.get(
              'ZQ_GAME_ROOT','site/knight/gameasync'
            ))/'mapping.js'
          ).read_text('utf-8')

          out=original
          root=base/'Graphics'
          rows=[]

          for kind in ('Characters','Animations'):
            for p in sorted((root/kind).glob('SLZQ*.png')):
              relative=f'Graphics/{kind}/{p.name}'
              logical=f'graphics/{kind.lower()}/{p.stem.lower()}'
              md5=hashlib.md5(p.read_bytes()).hexdigest()

              rows.append(
                f'["{logical}", "{relative}?h={md5}"],'
              )

          assert len(rows)==19,len(rows)

          anchor='];\n\nvar mapping = {};'
          assert out.count(anchor)==1

          out=out.replace(
            anchor,
            '\n'+'\n'.join(rows)+'\n'+anchor
          )

          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          for name in (
            'Map025.rxdata',
            'CommonEvents.rxdata',
            'Animations.rxdata'
          ):
            p=base/'out'/name
            digest=hashlib.md5(p.read_bytes()).hexdigest()

            token=(
              re.escape('Data/'+pre+name)+
              r'\?h=[0-9a-f]{32}'
            )

            out,n=re.subn(
              token,
              'Data/'+pre+name+'?h='+digest,
              out
            )

            assert n==1,(name,n)

          assert all(r in out for r in rows)

          path=base/'out/mapping.js'
          path.write_text(out,'utf-8')

          print('PASS 19 sprite mappings')
          print('PASS 3 native RXData mappings')
          QUEEN_MAPPING

          ZQ_GAME_ROOT=site/knight/gameasync \
            ZQ_REVIEW_DIR=build/zq_review python3 build/build_mapping.py

          python3 - <<'PY'
          from pathlib import Path
          import shutil

          root=Path('site/knight/gameasync')
          review=Path('build/zq_review')

          for kind in ('Animations','Characters'):
            destination=root/'Graphics'/kind

            for image in sorted(
              (review/'Graphics'/kind).glob('SLZQ*.png')
            ):
              assert not (destination/image.name).exists(),image.name

              shutil.copyfile(
                image,
                destination/image.name
              )

          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          for name in (
            'Map025','CommonEvents','Animations'
          ):
            shutil.copyfile(
              review/'out'/(name+'.rxdata'),
              root/'Data'/(pre+name+'.rxdata')
            )

          shutil.copyfile(
            review/'out/mapping.js',
            root/'mapping.js'
          )

          loader=Path('site/knight/js/sl-assets-v229r115.js')
          content=loader.read_text('utf-8')

          assert content.count("var version='V241';")==1

          loader.write_text(
            content.replace(
              "var version='V241';",
              "var version='V276.7';"
            ),
            encoding='utf-8'
          )

          for name in (
            'index.html',
            'knight/index.html'
          ):
            file=Path('site')/name
            content=file.read_text('utf-8')

            assert 'V241' in content

            content=(
              content.replace('V241','V276.7').
              replace('?v=v241','?v=v276.7')
            )

            file.write_text(
              content,
              encoding='utf-8'
            )

          print('PASS copied 19 queen sprites')
          print('PASS compiled 3 native RXData files')
          print('PASS V276.7 site version')
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: Verify protected originals and queen native event integrity
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json

          root=Path('site')

          old=json.loads(
            Path('build/original_sha256.json').read_text('utf-8')
          )

          new={
            str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
            for p in root.rglob('*') if p.is_file()
          }

          pre=(
            'knight/gameasync/Data/'
            'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          )

          allowed={
            pre+name+'.rxdata'
            for name in (
              'Map025','CommonEvents','Animations'
            )
          }

          allowed.update({
            'knight/gameasync/mapping.js',
            'knight/js/sl-assets-v229r115.js',
            'index.html',
            'knight/index.html'
          })

          added={
            str(p.relative_to(root))
            for kind in ('Characters','Animations')
            for p in (
              root/'knight/gameasync/Graphics'/kind
            ).glob('SLZQ*.png')
          }

          assert len(old)==5603
          assert len(added)==19
          assert len(new)==5622,('Wrong site inventory',len(new))

          assert set(new)-set(old)==added,(
            'Unexpected new files',
            (set(new)-set(old))^added
          )

          assert not (set(old)-set(new)),(
            'Original file removed'
          )

          changed={
            p for p in old
            if new.get(p)!=old[p]
          }

          assert changed==allowed,(
            'Unapproved source change',
            changed^allowed
          )

          for name in ('Map016','Map019'):
            assert (
              old[pre+name+'.rxdata']==
              new[pre+name+'.rxdata']
            )

          for name in (
            'knight/gameasync/Data/Scripts.rxdata',
            'knight/assets/map-047-v241.pack',
            'knight/js/drive.js',
            'knight/js/dpad.js'
          ):
            assert old[name]==new[name],name

          assert not any(
            '/SLDK2F' in p for p in new
          )

          print('PASS 5603 original files protected')
          print('PASS 7 approved changed site files')
          print('PASS 19 additional queen images')
          print('PASS original Scripts.rxdata unchanged')
          print('PASS original Map016 and Map019 unchanged')
          PY

          cat > build/verify_queen.rb <<'QUEEN_VERIFY'
          require 'zlib'

          module RPG
            class Map;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class CommonEvent;end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
            class AudioFile;end
            class Animation
              class Frame;end
              class Timing;end
            end
          end

          class Table
            def self._load(s)
              o=allocate
              o.instance_variable_set(:@raw,s)
              o
            end
            def _dump(level=0)
              @raw
            end
          end

          class Tone
            def self._load(s)
              o=allocate
              o.instance_variable_set(:@raw,s)
              o
            end
            def _dump(level=0)
              @raw
            end
          end

          class Color<Tone;end

          def iv(o,k)
            o.instance_variable_get('@'+k.to_s)
          end

          def ck(v,s)
            raise s unless v
          end

          root='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          get=->(name){
            Marshal.load(
              File.binread(root+pre+name+'.rxdata')
            )
          }

          map=get.call('Map025')
          general=get.call('Map019')
          common=get.call('CommonEvents')
          animations=get.call('Animations')

          queen=iv(map,:events).fetch(29)

          native=iv(
            iv(general,:events).fetch(18),
            :pages
          )

          pages=iv(queen,:pages)

          ck(
            pages.length==5,
            'Missing ordinary DK functional pages'
          )

          ck(
            pages.map{|p|iv(p,:list).length}==
            [23,1,217,2,20],
            'Wrong queen page command counts'
          )

          ck(
            pages.all?{|p|iv(p,:move_speed)==2},
            'Incorrect move speed'
          )

          ck(
            iv(pages[0],:list).drop(1).
              each_with_index.all?{|c,i|
                o=iv(native[0],:list)[i]

                [
                  iv(c,:code),
                  iv(c,:indent)
                ]==[
                  iv(o,:code),
                  iv(o,:indent)
                ]
              },
            'Original 22 spawn command structure changed'
          )

          ck(
            iv(pages[2],:list).
              each_with_index.all?{|c,i|
                o=iv(native[2],:list)[i]

                [
                  iv(c,:code),
                  iv(c,:indent)
                ]==[
                  iv(o,:code),
                  iv(o,:indent)
                ]
              },
            'Original 217-command combat graph changed'
          )

          register=iv(pages[2],:list).count{|c|
            iv(c,:code)==355 &&
            iv(c,:parameters)[0].to_s.
              include?('SLMonsterAttackContext.register(5991,')
          }

          ck(
            register==17,
            'Original attack registrations lost'
          )

          ck(
            iv(iv(pages[3],:condition),:variable_id)==4988 &&
            iv(iv(pages[3],:condition),:variable_value)==520,
            'Literal 520 HP threshold missing'
          )

          ck(
            iv(pages[2],:list).any?{|c|
              iv(c,:code)==355 &&
              iv(c,:parameters)[0].to_s.
                include?('$game_variables[4988],520,2')
            },
            'Literal 520 HP display missing'
          )

          post=iv(pages[4],:list)

          ck(
            post.select{|c|iv(c,:code)==106}.
              map{|c|iv(c,:parameters)}==
              [[200],[4300]],
            'Corpse/respawn waits not 200 and 4300'
          )

          ck(
            post.any?{|c|iv(c,:code)==115},
            'Map reentry death-state reset missing'
          )

          ck(
            iv(pages[3],:list).map{|c|iv(c,:code)}==
            [117,0],
            'Original death page call structure damaged'
          )

          ck(
            common.length==1068 &&
            animations.length==924,
            'Native CE/animation counts wrong'
          )

          ck(
            iv(common[1065],:list).length==245,
            'Original reward commands truncated'
          )

          ck(
            iv(common[1066],:list).length==55,
            'Original attack commands truncated'
          )

          ck(
            iv(common[1062],:list).length==148,
            'Original hit calculations truncated'
          )

          ck(
            iv(common[1067],:list)[0].
              instance_variable_get(:@parameters)==[371],
            'Original death CE371 missing'
          )

          ck(
            iv(common[1067],:list).
              select{|c|iv(c,:code)==106}.
              map{|c|iv(c,:parameters)}==
              [[36]],
            'Full 17-frame death playback wait missing'
          )

          ck(
            !Marshal.dump(queen).b.include?('데스나이트'.b),
            'DK reference in queen'
          )

          ck(
            (1061..1067).all?{|id|
              !Marshal.dump(common[id]).b.
                include?('데스나이트'.b)
            },
            'DK reference in queen private CE'
          )

          (908..923).each do |id|
            a=animations.fetch(id)
            expected=id<=919 ? 25 : 17

            ck(
              iv(a,:frame_max)==expected,
              'Native animation frame count wrong'
            )

            iv(a,:frames).each_with_index do |frame,index|
              t=iv(
                iv(frame,:cell_data),
                :raw
              )

              ck(
                t.bytesize==36,
                'Native animation table size wrong'
              )

              ck(
                t.unpack('V5')==[2,1,8,1,8],
                'Native animation table layout wrong'
              )

              ck(
                t.byteslice(20,16).
                  unpack('s<*')[0]==index,
                'Native animation atlas frame mapping wrong'
              )
            end
          end

          puts 'PASS V276.7 queen pages and original combat graph'
          puts 'PASS literal 520 HP display/death threshold'
          puts 'PASS original 17 attack registrations'
          puts 'PASS 245 reward and 55 attack commands'
          puts 'PASS death 17 frames, corpse 200, respawn 4300'
          puts 'PASS map reentry recovery branch'
          puts 'PASS 4-direction native animation registration'
          QUEEN_VERIFY

          ruby -c build/verify_queen.rb
          ruby build/verify_queen.rb

      - name: Publish verified draft game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
