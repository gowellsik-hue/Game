
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V253
# BASE: V252 successful run 41386395573
# FIX: Restore 17 native monster attack registrations.
# FIX: Refresh native attack common-event switch.
# FIX: Recognize Zenith Queen as a monster event.
# DISPLAY: Remove both visible version labels.
# KEEP: All existing maps, NPCs, loot, graphics and FX.
# STATUS: Build and mobile combat verification pending.

name: build-slknight-web.yml | V253 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: V253 Restore V252 successful game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41386395573
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V253 Verify baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s baseline/artifact.tar
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib

          root=Path('site')
          before={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          assert len(before)==5610,(
              'Wrong V252 inventory',len(before)
          )

          pre=(
              'knight/gameasync/Data/'
              'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          )

          for mid in (16,25,47):
              assert pre+f'Map{mid:03d}.rxdata' in before

          for mid in (45,46):
              assert pre+f'Map{mid:03d}.rxdata' not in before

          assert 'knight/assets/map-047-v241.pack' in before

          Path('build/before.json').write_text(
              json.dumps(before,sort_keys=True)
          )
          print('PASS V252 original inventory')
          PY

      - name: V253 Restore native boss combat
        shell: bash
        run: |
          set -euo pipefail

          cat > build/fix.rb <<'RUBY'
          require 'zlib'
          require 'digest'

          module RPG
            class Map;end
            class MapInfo;end
            class AudioFile;end
            class CommonEvent;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end

          class Table
            def self._load(raw)
              o=allocate
              o.instance_variable_set(:@raw,raw)
              o
            end
            def _dump(level=0);@raw;end
          end

          class Tone
            def self._load(raw)
              o=allocate
              o.instance_variable_set(:@raw,raw)
              o
            end
            def _dump(level=0);@raw;end
          end

          class Color<Tone;end

          def iv(o,k)
            o.instance_variable_get('@'+k.to_s)
          end

          def put(o,k,v)
            o.instance_variable_set('@'+k.to_s,v)
          end

          root='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          source_path=root+pre+'Map016.rxdata'
          target_path=root+pre+'Map025.rxdata'
          common_path=root+pre+'CommonEvents.rxdata'
          scripts_path=root+'Scripts.rxdata'

          source=Marshal.load(File.binread(source_path))
          target=Marshal.load(File.binread(target_path))
          common=Marshal.load(File.binread(common_path))
          scripts=Marshal.load(File.binread(scripts_path))

          source_event=iv(source,:events).fetch(8)
          events=iv(target,:events)
          boss=events.fetch(29)

          raise 'Wrong Zenith Queen event' unless
            iv(boss,:name).to_s.dup
              .force_encoding('UTF-8').scrub
              .include?('제니스 퀸')

          source_pages=iv(source_event,:pages)
          boss_pages=iv(boss,:pages)

          raise 'Unexpected boss page structure' unless
            source_pages.length==5 &&
            boss_pages.length==2

          original_events=events.transform_values{
            |e| Marshal.dump(e)
          }

          source_list=iv(source_pages[1],:list)
          boss_list=iv(boss_pages[0],:list)

          raise 'Event command count differs' unless
            source_list.length==boss_list.length

          restored=0

          source_list.each_with_index do |command,i|
            code=iv(command,:code)
            next unless code==355 || code==655

            parameters=iv(command,:parameters)
            next unless parameters.is_a?(Array)
            text=parameters[0]
            next unless text.is_a?(String)
            next unless text.include?(
              'SLMonsterAttackContext.register'
            )

            patched=text.gsub(
              /SLMonsterAttackContext\.register\(\s*133\s*,\s*\$game_map\.map_id\s*,\s*8\s*\)/,
              'SLMonsterAttackContext.register(7002,$game_map.map_id,29)'
            )

            raise 'Attack context was not redirected' if
              patched==text

            patched=patched.gsub(
              '$game_map.events[8]',
              '$game_map.events[29]'
            )

            patched=patched.gsub(
              '$game_variables[1980]',
              '$game_variables[7001]'
            )

            patched=patched.gsub(
              '$game_switches[133]',
              '$game_switches[7002]'
            )

            destination=boss_list[i]
            raise 'Unexpected command mismatch' unless
              iv(destination,:code)==code

            put(
              destination,:parameters,[patched]
            )
            restored+=1
          end

          raise(
            "Original attack contexts incomplete: "+
            restored.to_s
          ) unless restored==17

          attack_switches=boss_list.count do |c|
            iv(c,:code)==121 &&
            iv(c,:parameters)==[7002,7002,0]
          end

          hp_writes=boss_list.count do |c|
            p=iv(c,:parameters)
            iv(c,:code)==122 &&
              p.is_a?(Array) &&
              p[0]==7001
          end

          raise 'Boss attack switches missing' unless
            attack_switches==17

          raise 'Boss HP receivers missing' unless
            hp_writes==20

          death_condition=iv(
            boss_pages[1],:condition
          )

          raise 'Incorrect boss death HP variable' unless
            iv(death_condition,:variable_id)==7001 &&
            iv(death_condition,:variable_value)==5200

          cycle=common.fetch(1062)
          damage=common.fetch(1061)

          raise 'Native attack cycle not enabled' unless
            iv(cycle,:trigger)==2 &&
            iv(cycle,:switch_id)==7002

          raise 'Native damage event missing' unless
            iv(damage,:list).count{
              |c| iv(c,:code)==311
            }>=2

          original_events.each do |id,raw|
            next if id==29
            raise "Original event changed #{id}" unless
              Marshal.dump(events[id])==raw
          end

          File.binwrite(
            target_path,Marshal.dump(target)
          )

          entries=scripts.each_index.select do |i|
            row=scripts[i]
            row.is_a?(Array) &&
              row[1]=='SLZenithV252'
          end

          raise 'Original runtime not unique' unless
            entries.length==1

          index=entries.first
          entry=scripts[index]
          runtime=Zlib::Inflate.inflate(entry[2])

          required=[
            'MAX_HP=5200',
            'PHYSICAL=[50,100]',
            'MAGIC=[150,300]',
            'ATTACK_WAIT=20',
            'EXP=43212',
            'ADENA=[64800,151200]'
          ]

          required.each do |value|
            raise "Missing approved value #{value}" unless
              runtime.include?(value)
          end

          patch=File.read(
            'build/combat-runtime.rb'
          ).b

          runtime=runtime.b+"\n"+patch
          entry[0]=99825301
          entry[1]='SLZenithV253'
          entry[2]=Zlib::Deflate.deflate(runtime,9)

          File.binwrite(
            scripts_path,Marshal.dump(scripts)
          )

          check=Marshal.load(
            File.binread(scripts_path)
          )

          assert_runtime=Zlib::Inflate.inflate(
            check[index][2]
          )

          raise 'Runtime serialization failed' unless
            check[index][1]=='SLZenithV253' &&
            assert_runtime.b==runtime.b

          puts 'PASS 17 original attack contexts restored'
          puts 'PASS 17 attack switches and 20 HP writes'
          puts 'PASS native CE1062 / CE1061 preserved'
          puts 'PASS Map025 EV29 only modified'
          puts 'PASS original boss combat stats retained'
          RUBY

          cat > build/combat-runtime.rb <<'RUNTIME'
          # V253 native Zenith combat activation.
          # Only Map025 EV29 is affected.

          module SLZenith
            def self.v253_combat_tick(ev)
              return unless ev
              return unless $game_map &&
                $game_map.map_id==MAP_ID

              return unless $game_player &&
                $game_switches &&
                $game_variables

              return if ev.instance_variable_get(:@erased)
              return if @paid

              return if
                $game_variables[HP_VAR].to_i>=MAX_HP

              return unless
                ev.respond_to?(:x) &&
                ev.respond_to?(:y) &&
                $game_player.respond_to?(:x) &&
                $game_player.respond_to?(:y)

              dx=($game_player.x-ev.x).abs
              dy=($game_player.y-ev.y).abs

              # Native event tiles; no remote attack.
              return if dx>3 || dy>3

              return if
                $game_switches[ATTACK_SWITCH]

              if defined?(SLMonsterAttackContext) &&
                 SLMonsterAttackContext.respond_to?(:register)
                SLMonsterAttackContext.register(
                  ATTACK_SWITCH,MAP_ID,EVENT_ID
                )
              end

              # CE1062 executes CE1061, which retains
              # the original physical/magic HP damage.
              $game_switches[ATTACK_SWITCH]=true

              # Native Game_Switches does not always
              # refresh parallel event activation.
              if $game_map.respond_to?(:need_refresh=)
                $game_map.need_refresh=true
              end

              engage
            end
          end

          class Game_Event
            alias slz_v253_native_update update

            def update
              if @map_id==SLZenith::MAP_ID &&
                 @id==SLZenith::EVENT_ID
                # Preserve monster classification
                # for original targeting routines.
                @monster=true
              end

              slz_v253_native_update

              return unless
                @map_id==SLZenith::MAP_ID &&
                @id==SLZenith::EVENT_ID

              SLZenith.v253_combat_tick(self)
            end
          end
          RUNTIME

          ruby -c build/combat-runtime.rb
          ruby -c build/fix.rb
          ruby build/fix.rb

      - name: V253 Test attack activation and native hit graph
        shell: bash
        run: |
          set -euo pipefail

          cat > build/test.rb <<'RUBY'
          class Game_Event
            attr_accessor :x,:y

            def update;end
          end

          class Game_Map
            attr_accessor :map_id,:events,:need_refresh
          end

          class Game_Player
            attr_accessor :x,:y
          end

          module SLMonsterAttackContext
            def self.register(*args)
              @last=args
            end

            def self.last
              @last
            end
          end

          module SLZenith
            MAP_ID=25
            EVENT_ID=29
            HP_VAR=7001
            ATTACK_SWITCH=7002
            MAX_HP=5200

            def self.engage
              @engaged=true
            end
          end

          load 'build/combat-runtime.rb'

          $game_map=Game_Map.new
          $game_map.map_id=25
          $game_map.need_refresh=false
          $game_player=Game_Player.new
          $game_variables=Hash.new(0)
          $game_switches=Hash.new(false)

          boss=Game_Event.new
          boss.instance_variable_set(:@map_id,25)
          boss.instance_variable_set(:@id,29)
          boss.x=100
          boss.y=100

          $game_player.x=120
          $game_player.y=120

          boss.update

          raise 'Distant boss activated' if
            $game_switches[7002]

          $game_player.x=101
          $game_player.y=100

          boss.update

          raise 'Native attack switch not activated' unless
            $game_switches[7002]

          raise 'Native common events not refreshed' unless
            $game_map.need_refresh

          raise 'Wrong original attack context' unless
            SLMonsterAttackContext.last==[7002,25,29]

          raise 'Monster classification missing' unless
            boss.instance_variable_get(:@monster)==true

          $game_switches[7002]=false
          $game_variables[7001]=5200
          boss.update

          raise 'Dead boss attacked' if
            $game_switches[7002]

          puts 'PASS no distant attack'
          puts 'PASS nearby native attack activation'
          puts 'PASS parallel common-event refresh'
          puts 'PASS original attack context registration'
          puts 'PASS monster recognition'
          puts 'PASS dead boss does not attack'
          RUBY

          ruby -c build/test.rb
          ruby build/test.rb

      - name: V253 Remove both visible version displays
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re

          root=Path('site')
          data=root/'knight/gameasync/Data'
          mapfile=data/(
              'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
              'Map025.rxdata'
          )
          scripts=data/'Scripts.rxdata'
          mapping=root/'knight/gameasync/mapping.js'

          text=mapping.read_text('utf-8')

          for path in (mapfile,scripts):
              key='Data/'+path.name
              digest=hashlib.md5(
                  path.read_bytes()
              ).hexdigest()

              pattern=(
                  '('+re.escape(key)+
                  r'\?h=)[0-9a-f]{32}'
              )

              text,count=re.subn(
                  pattern,
                  lambda m:m.group(1)+digest,
                  text
              )
              assert count==1,(
                  'Mapping hash mismatch',key,count
              )

          mapping.write_text(text,'utf-8')

          loader=root/'knight/js/sl-assets-v229r115.js'
          js=loader.read_text('utf-8')

          old="var version='V252';"
          assert js.count(old)==1

          js=js.replace(
              old,"var version='V253';"
          )
          loader.write_text(js,'utf-8')

          # Remove the original debug status and the
          # extra version badge. Keep map-loading logic.
          status_id='sl-build-version'
          badge_id='slknight-v252-version'

          element=re.compile(
              r'<(?P<tag>[a-zA-Z][\w-]*)\b'
              r'(?=[^>]*\bid\s*=\s*["\']'
              r'(?:sl-build-version|slknight-v252-version)'
              r'["\'])[^>]*>.*?</(?P=tag)>',
              re.I|re.S
          )

          status_count=0
          badge_count=0

          for rel in ('index.html','knight/index.html'):
              path=root/rel
              html=path.read_text('utf-8')

              assert 'V252' in html

              status_count+=len(re.findall(
                  r'\bid\s*=\s*["\']'+status_id+r'["\']',
                  html,re.I
              ))
              badge_count+=len(re.findall(
                  r'\bid\s*=\s*["\']'+badge_id+r'["\']',
                  html,re.I
              ))

              html=element.sub('',html)

              html=html.replace('V252','V253')
              html=html.replace(
                  '?v=v252','?v=v253'
              )

              # Fallback if a loader recreates a
              # status element after page startup.
              hidden=(
                  '<style>'
                  '#sl-build-version,'
                  '#slknight-v252-version'
                  '{display:none!important}'
                  '</style>'
              )
              assert '</head>' in html
              html=html.replace(
                  '</head>',hidden+'</head>',1
              )

              path.write_text(html,'utf-8')

              assert not re.search(
                  r'\bid\s*=\s*["\']'
                  r'(?:sl-build-version|slknight-v252-version)'
                  r'["\']',
                  html,re.I
              )

          assert status_count>=1,(
              'Original status element missing'
          )
          assert badge_count>=1,(
              'Extra version badge missing'
          )

          print('PASS original top-left status removed')
          print('PASS additional black version badge removed')
          print('PASS map resource loading remains installed')
          print('PASS V253 internal cache version')
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: V253 Verify unrelated data unchanged
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib

          root=Path('site')
          before=json.loads(
              Path('build/before.json').read_text()
          )

          after={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          pre=(
              'knight/gameasync/Data/'
              'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          )

          allowed={
              pre+'Map025.rxdata',
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html',
              'knight/index.html'
          }

          changed={
              key for key in before
              if before[key]!=after.get(key)
          }

          assert changed==allowed,(
              'Unexpected modifications',
              sorted(changed^allowed)
          )

          assert set(before)==set(after)
          assert len(after)==5610

          protected=[
              pre+'Map016.rxdata',
              pre+'Map047.rxdata',
              pre+'CommonEvents.rxdata',
              'knight/assets/map-047-v241.pack'
          ]

          for name in protected:
              assert before[name]==after[name],name

          for action in (
              'Walk','Idle','Attack','AltAttack',
              'Spell','Hit','Death'
          ):
              name=(
                  'knight/gameasync/Graphics/'
                  'Characters/SLZenith'+action+'.png'
              )
              assert before[name]==after[name]

          for name in (
              '이펙트마법',
              '물의 대정령 마법',
              '불의 대정령 마법',
              '땅의 대정령 마법'
          ):
              name=(
                  'knight/gameasync/Graphics/'
                  'Animations/'+name+'.png'
              )
              assert before[name]==after[name]

          print('PASS Map016 and Map047 unchanged')
          print('PASS all original NPCs preserved')
          print('PASS CE1061 and CE1062 unchanged')
          print('PASS seven original motion sheets unchanged')
          print('PASS four original magic effects unchanged')
          print('PASS total inventory 5610 preserved')
          PY

      - name: V253 Publish game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
