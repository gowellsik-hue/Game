
name: V229R11 | Native Number Skills 1-6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-slknight-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Restore verified V229R10 Pages artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          repository: gowellsik-hue/Game
          run-id: 39101719148
          name: github-pages
          github-token: ${{ github.token }}
          path: previous

      - name: Restore complete game from artifact or published site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          if test -s previous/artifact.tar; then
            tar -xf previous/artifact.tar -C site
          else
            python3 - <<'PY_RECOVER'
          from pathlib import Path
          from urllib.request import Request,urlopen
          from urllib.parse import quote
          from concurrent.futures import ThreadPoolExecutor,as_completed
          import hashlib,json,re,time
          base='https://gowellsik-hue.github.io/Game/'
          root=Path('site')
          fixed=('index.html','COPYING-mkxp-web.txt','manifest.webmanifest','mkxp.js','mkxp.wasm','js/drive.js','js/dpad.js','js/localforage.min.js')
          def get(url):
              for i in range(5):
                  try:
                      with urlopen(Request(url,headers={'User-Agent':'SLKnight-R11','Accept-Encoding':'identity'}),timeout=75) as r:
                          return r.read()
                  except Exception:
                      if i==4:raise
                      time.sleep(i+1)
          files={'index.html':(base+'index.html',None)}
          for game in ('knight','elf'):
              for name in fixed:
                  files[game+'/'+name]=(base+game+'/'+quote(name,safe='/'),None)
              mapping=game+'/gameasync/mapping.js'
              data=get(base+mapping+'?recover=v229r11')
              p=root/mapping;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
              body=data.decode('utf8').split('var mappingArray = ',1)[1].split('];',1)[0]+']'
              for _,asset in json.loads(re.sub(r',\s*\]$',']',body)):
                  name,sep,md5=asset.partition('?h=')
                  if '.' not in Path(name).name:continue
                  if name.startswith('/') or '..' in Path(name).parts:raise RuntimeError('Unsafe path')
                  rel=game+'/gameasync/'+name
                  if rel in files:raise RuntimeError('Duplicate asset '+rel)
                  files[rel]=(base+game+'/gameasync/'+quote(name,safe='/')+('?h='+md5 if sep else ''),md5 if sep else None)
          if len(files)!=5354:raise RuntimeError('Wrong site file count: '+str(len(files)))
          def fetch(item):
              name,(url,md5)=item
              data=get(url)
              if md5 and Path(name).name not in ('mapping.js','bitmap-map.js') and hashlib.md5(data).hexdigest()!=md5:raise RuntimeError('Asset checksum '+name)
              p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          with ThreadPoolExecutor(max_workers=12) as pool:
              jobs=[pool.submit(fetch,it) for it in files.items() if not (root/it[0]).is_file()]
              for job in as_completed(jobs):job.result()
          actual={str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}
          if actual!=set(files):raise RuntimeError('Incomplete game recovery')
          print('RECOVERED_5354_ASSETS')
          PY_RECOVER
          fi

      - name: Check exact V229R10 or V229R11 game version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_PRECHECK'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          actual={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if len(actual)!=5354:raise SystemExit('Unexpected game inventory '+str(len(actual)))
          checks=json.loads("{\"knight/js/dpad.js\": [\"cbebd992a1e83713cbd47dea54493a511f5a6d9f90a4fd58b23fd9d9540bd930\", \"0260f385e5fe94ae6b0443a379065c811647718e7bdbf49ae5ab92fcbb8186a0\"], \"knight/gameasync/Data/Scripts.rxdata\": [\"6fa8cde279565e48ee5babb28dc8b7e0d2c048986e8339bab30bd7c43987ff01\", \"d9bcda05ea25e911a051afef5ebec14b216ac188c6bfa1745b6db151e59ae4fe\"], \"knight/gameasync/mapping.js\": [\"1aa8038708c2587c157b5f08022565fda625cd969eb3c92ff1d1ca2c6e33f487\", \"ae7b40aeca7a77858de2183c103f8f221b229478734db735e896ae23bcf916d1\"], \"knight/index.html\": [\"fa593d4ba80551adbd673b35bf5be6d7fc03891828e69fecece8afa3a7e204ec\", \"e03a29c0f91c3bffa5e6eaad58ba39d3d0df7eafc85561310bc5e44525353a4c\"]}")
          keep={
           'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata':'c1112940bc8ba843e0a7a108a09c09c00a8c952162c62b5f2119323353cb2959',
           'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap035.rxdata':'7aa9a3959547e86720a874d45ec2ec54247495f3de71c7e3ac033c340205b153'}
          if any(actual.get(p)!=v for p,v in keep.items()):raise SystemExit('Protected map, buff or polymorph source changed')
          if all(actual.get(k)==v[0] for k,v in checks.items()):version='R10'
          elif all(actual.get(k)==v[1] for k,v in checks.items()):version='R11'
          else:raise SystemExit('Unsupported current release, cannot safely apply')
          Path('/tmp/sl_r11_version').write_text(version)
          Path('/tmp/sl_r11_before.json').write_text(json.dumps(actual))
          Path('/tmp/sl_r11_checks.json').write_text(json.dumps(checks))
          print('VERIFIED_V229'+version+'_'+str(len(actual))+'_FILES')
          PY_PRECHECK

      - name: Route all six touch slots into original numeric game shortcuts
        shell: bash
        run: |
          set -euo pipefail
          if test "$(cat /tmp/sl_r11_version)" = R10; then
            ruby - site <<'RUBY_PATCH'
          require 'zlib'
          require 'digest'
          path=ARGV.fetch(0)+'/knight/gameasync/Data/Scripts.rxdata'
          scripts=Marshal.load(File.binread(path))
          raise 'R10 scripts baseline differs' unless scripts.length==137 && scripts[134][1]=='V230 Boss Respawn 60s 180s' && scripts[135][1]=='V229R10 Native Skill Fix' && scripts[136][1]=='Main'
          def once(s,old,new_s)
            raise "Wrong match count #{old[0,80].inspect}: #{s.scan(old).size}" unless s.scan(old).size==1
            s.sub(old,new_s)
          end
          base=Zlib::Inflate.inflate(scripts[0][2])
          anchor='  def call(*args)'
          bridge=<<~'CODE'
          module SLNativeDigits
            def self.token(slot)
              File.binread('/game/sl_native_digit_'+slot.to_s).to_i
            rescue Errno::ENOENT, IOError
              0
            end
            def self.any_pressed?
              (1..6).any?{|slot| token(slot)>0}
            end
          end
          CODE
          base=once(base,'class Win32API\n'.gsub('\\n',"\n"),bridge+'class Win32API'+"\n")
          replacement=<<~'CODE'
            def call(*args)
              key=args[0].to_i
              if key>=49 && key<=54 && (@func=='GetKeyState' || @func=='GetAsyncKeyState')
                token=SLNativeDigits.token(key-48)
                @sl_native_seen||={}
                if token>0 && @sl_native_seen[key]!=token
                  @sl_native_seen[key]=token
                  return @func=='GetKeyState' ? -1 : 1
                end
                return 0
              end
          CODE
          base=once(base,anchor,replacement.rstrip)
          File.binwrite('/tmp/sl_native_web_compat.rb',base)
          raise 'Web compat invalid' unless system('ruby','-c','/tmp/sl_native_web_compat.rb',out:File::NULL)
          scripts[0][2]=Zlib::Deflate.deflate(base)
          scene=Zlib::Inflate.inflate(scripts[78][2])
          scene=once(scene,'if $game_switches[367] == true','if $game_switches[367] == true || SLNativeDigits.any_pressed?')
          File.binwrite('/tmp/sl_native_scene.rb',scene)
          raise 'Scene_Map invalid' unless system('ruby','-c','/tmp/sl_native_scene.rb',out:File::NULL)
          scripts[78][2]=Zlib::Deflate.deflate(scene)
          code=<<~'NATIVE_R11'
          module SLNativeSkillDisplay
            SKILLS=[7,8,9,1]
            ICONS=['단축-리덕션아머','단축-솔리드캐리지','단축-카운터베리어','실드']
            COSTS=[5,10,10,8]
            HP_COSTS=[50,100,100,0]
            def self.sync
              return if $game_party.nil? || $game_system.nil?
              a=$game_party.actors[0]
              return if a.nil?
              data=[]
              4.times do |i|
                id=SKILLS[i]
                if a.skill_learn?(id)
                  skill=$data_skills[id]
                  label=skill ? skill.name.to_s.gsub('|','/') : 'Skill '+id.to_s
                  ready=a.sp>=COSTS[i] && a.hp>=HP_COSTS[i]
                  ready=false if i==0 && a.level<50
                  ready=false if i==1 && (a.level<50 || !$game_switches[1010])
                  ready=false if i==2 && !$game_switches[1004]
                  data << [id,ICONS[i],label,COSTS[i],ready ? 1 : 0]
                else
                  data << [0,'','',0,0]
                end
              end
              if $game_party.item_number(177)>0
                data << [177,'부적','부적',0,1]
              else
                data << [0,'','',0,0]
              end
              if $game_switches[185]
                data << [185,'그힐','그레이터 힐',0,1]
              else
                data << [0,'','',0,0]
              end
              signature=data.map{|e|e.join(':')}.join(';')
              return if @signature==signature
              @signature=signature
              data.each_with_index do |e,i|
                puts('SLSKILL|STATE|'+(i+1).to_s+'|'+e.map{|v|v.to_s}.join('|'))
              end
            end
          end
          class Scene_Map
            alias sl_native_r11_old_update update
            def update
              sl_native_r11_old_update
              return unless $scene.equal?(self)
              SLNativeSkillDisplay.sync
            end
          end
          NATIVE_R11
          File.binwrite('/tmp/sl_native_display.rb',code)
          raise 'Skill display invalid' unless system('ruby','-c','/tmp/sl_native_display.rb',out:File::NULL)
          scripts[135][1]='V229R11 Native Number Shortcuts'.force_encoding('UTF-8')
          scripts[135][2]=Zlib::Deflate.deflate(code)
          File.binwrite(path,Marshal.dump(scripts))
          puts 'R11_SCRIPTS_SHA '+Digest::SHA256.file(path).hexdigest
          RUBY_PATCH
            python3 - site <<'PY_PATCH'
          from pathlib import Path
          import hashlib, re, sys
          root=Path(sys.argv[1])/'knight'
          p=root/'js/dpad.js';s=p.read_text(encoding='utf-8')
          def once(old,new):
           global s
           n=s.count(old)
           if n!=1:raise RuntimeError(f'DPAD mismatch {old[:80]!r}: {n}')
           s=s.replace(old,new,1)
          once('const held=new Set(),pulseTimers=new Map();','const held=new Set(),pulseTimers=new Map();\nconst slNativeTimers=new Map();let slNativeSerial=0;')
          once('function releaseAll(){\n  pulseTimers.forEach(t=>clearTimeout(t));',"function releaseAll(){\n  slNativeTimers.forEach(t=>clearTimeout(t));slNativeTimers.clear();\n  for(let i=1;i<=6;i++)slNativeClear(i);\n  pulseTimers.forEach(t=>clearTimeout(t));")
          once('const slSkillKeys=[84,85,73,79,80,77];','''const slSkillKeys=[49,50,51,52,53,54];
          function slNativeClear(slot){
            try{if(typeof FS!=="undefined"&&FS.analyzePath("/game/sl_native_digit_"+slot).exists)FS.unlink("/game/sl_native_digit_"+slot);}catch(e){}
          }
          function slNativePress(index){
            const slot=index+1,key=slSkillKeys[index],old=slNativeTimers.get(index);
            if(old){clearTimeout(old);slNativeClear(slot);slNativeTimers.delete(index);}
            try{
              if(typeof FS==="undefined")throw Error("Emscripten filesystem not ready");
              FS.writeFile("/game/sl_native_digit_"+slot,String(++slNativeSerial));
            }catch(e){console.warn("SL_NATIVE_KEY_ERROR",e);}
            pulseKey(key,210);
            slNativeTimers.set(index,setTimeout(()=>{slNativeClear(slot);slNativeTimers.delete(index);},210));
          }''')
          once('pulseKey(slSkillKeys[index],165);','slNativePress(index);')
          once("  const visible=slScene==='Scene_Map'||slScene==='Scene_Skill';\n  const assign=slScene==='Scene_Skill';","  const visible=slScene==='Scene_Map';\n  const assign=false;")
          p.write_text(s,encoding='utf-8')
          rel='Data/Scripts.rxdata';mp=root/'gameasync/mapping.js';data=mp.read_text(encoding='utf-8');md5=hashlib.md5((root/'gameasync'/rel).read_bytes()).hexdigest()
          data,n=re.subn(re.escape(rel+'?h=')+r'[0-9a-f]{32}',lambda m:rel+'?h='+md5,data)
          if n!=1:raise RuntimeError('Bad mapping: '+str(n))
          mp.write_text(data,encoding='utf-8')
          idx=root/'index.html';html=idx.read_text(encoding='utf-8')
          for old,new in [('gameasync/mapping.js?v=v229r10','gameasync/mapping.js?v=v229r11'),('js/dpad.js?v=v229r10','js/dpad.js?v=v229r11')]:
           if html.count(old)!=1:raise RuntimeError('Missing cache tag '+old)
           html=html.replace(old,new,1)
          idx.write_text(html,encoding='utf-8')
          for rel in ('js/dpad.js','gameasync/Data/Scripts.rxdata','gameasync/mapping.js','index.html'):
           p=root/rel;print('R11_FILE_SHA',rel,hashlib.sha256(p.read_bytes()).hexdigest())
          PY_PATCH
          else
            echo V229R11_ALREADY_APPLIED
          fi

      - name: Verify original skill events, numeric input, and unchanged assets
        shell: bash
        run: |
          set -euo pipefail
          node --check site/knight/js/dpad.js
          python3 - <<'PY_VERIFY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before=json.loads(Path('/tmp/sl_r11_before.json').read_text())
          checks=json.loads(Path('/tmp/sl_r11_checks.json').read_text())
          current={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if len(current)!=5354 or current.keys()!=before.keys():raise SystemExit('File inventory changed')
          if any(current.get(k)!=v[1] for k,v in checks.items()):raise SystemExit('R11 patched file checksum mismatch')
          changed={k for k in current if before[k]!=current[k]}
          if Path('/tmp/sl_r11_version').read_text()=='R10' and changed!=set(checks):raise SystemExit('Unapproved changed files '+repr(sorted(changed)))
          if Path('/tmp/sl_r11_version').read_text()=='R11' and changed:raise SystemExit('Rerunning R11 changed files')
          knight=root/'knight';rel='Data/Scripts.rxdata'
          md5=hashlib.md5((knight/'gameasync'/rel).read_bytes()).hexdigest()
          if (knight/'gameasync/mapping.js').read_text(encoding='utf8').count(rel+'?h='+md5)!=1:raise SystemExit('Invalid Scripts mapping')
          html=(knight/'index.html').read_text(encoding='utf8')
          for cache in ('gameasync/mapping.js?v=v229r11','js/dpad.js?v=v229r11'):
           if html.count(cache)!=1:raise SystemExit('Stale cache '+cache)
          js=(knight/'js/dpad.js').read_text(encoding='utf8')
          for token in ('slSkillKeys=[49,50,51,52,53,54]','FS.writeFile("/game/sl_native_digit_"+slot','slNativePress(index)','slNativeClear(slot)'):
           if token not in js:raise SystemExit('Missing native touch input '+token)
          if 'slSkillKeys=[84,85,73,79,80,77]' in js:raise SystemExit('Obsolete TUIOPM keys are still active')
          print('PASS_R11_5354_ASSETS_CHANGE_SCOPE',len(changed))
          PY_VERIFY
          ruby - <<'RUBY_VERIFY'
          require 'zlib'
          module RPG;class CommonEvent;end;class EventCommand;end;class MoveRoute;end;class MoveCommand;end;class AudioFile;end;end
          scripts=Marshal.load(File.binread('site/knight/gameasync/Data/Scripts.rxdata'))
          raise 'Modified boss script' unless scripts.length==137 && scripts[134][1]=='V230 Boss Respawn 60s 180s' && scripts[135][1]=='V229R11 Native Number Shortcuts' && scripts[136][1]=='Main'
          base=Zlib::Inflate.inflate(scripts[0][2]);scene=Zlib::Inflate.inflate(scripts[78][2]);display=Zlib::Inflate.inflate(scripts[135][2])
          raise 'No filesystem keyboard bridge' unless base.include?("File.binread('/game/sl_native_digit_'") && base.include?("token>0 && @sl_native_seen[key]!=token")
          raise 'Original main number shortcuts missing' unless scene.include?('Keyboard.getstate(49)') && scene.include?('$game_switches[1007] = true') && scene.include?('SLNativeDigits.any_pressed?')
          raise 'Duplicate special skill execution remains' if display.include?('def self.native_cast') || display.include?('def self.key_slot')
          raise 'Mirror key labels changed' unless display.include?("SKILLS=[7,8,9,1]")
          events=Marshal.load(File.binread('site/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata'))
          {846=>[1007,1006],966=>[1008,1009],848=>[874,872]}.each do |id,(trigger,buff)|
           e=events[id]
           raise 'Original skill autorun missing' unless e.instance_variable_get(:@trigger)==1 && e.instance_variable_get(:@switch_id)==trigger
           raise 'Original buff switch not enabled' unless e.instance_variable_get(:@list).any?{|c|c.instance_variable_get(:@code)==121 && c.instance_variable_get(:@parameters)==[buff,buff,0]}
          end
          puts 'PASS_ORIGINAL_NATIVE_KEY1_EVENT846_BUFF1006_AND_OTHER_SKILLS'
          RUBY_VERIFY

      - name: Upload verified knight site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
