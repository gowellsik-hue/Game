
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V274
# BASE: V273 successful run 41550816816
# NATIVE ENGINE REFERENCE: V241 successful run 41293648580
# PURPOSE: Independent Death Knight clone at Tower of Insolence 2F.
# TARGET: Map025 EV29.
# SOURCE: Map016 EV8, native Death Knight.
# ISOLATION:
#   - Deep-copy all five source event pages.
#   - Clone native combat common events and their dependencies.
#   - Private HP variable 4987.
#   - Private attack and magic switches 5987 / 5988.
#   - Private inactive wave gate 5989.
#   - Independent PNG files with identical original pixels.
#   - Remove SLZenithV273 and restore original Sprite_Character.
# PROTECT: Original Map016, original common events and original graphics.
# ROLLBACK: The V273 and V241 source artifacts remain unchanged.
# STATUS: Prepared from source history; GitHub Actions and actual play unverified.

name: build-slknight-web.yml | V274 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: V274 Download V273 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41550816816
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V274 Download original V241 native renderer
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41293648580
          name: github-pages
          github-token: ${{ github.token }}
          path: native-baseline

      - name: V274 Extract and verify both sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site v241 build

          test -s baseline/artifact.tar
          test -s native-baseline/artifact.tar

          tar -xf baseline/artifact.tar -C site
          tar -xf native-baseline/artifact.tar -C v241

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root=Path("site")
          before={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob("*") if p.is_file()
          }

          assert len(before)==5610,len(before)

          data=root/"knight/gameasync/Data"
          old=Path("v241/knight/gameasync/Data")
          pre="MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"

          for p in (
              data/"Scripts.rxdata",
              data/(pre+"Map016.rxdata"),
              data/(pre+"Map025.rxdata"),
              data/(pre+"CommonEvents.rxdata"),
              old/"Scripts.rxdata"
          ):
              assert p.is_file(),p

          drive=(root/"knight/js/drive.js").read_text("utf-8")
          loader=(root/"knight/js/sl-assets-v229r115.js").read_text("utf-8")

          assert "slV268NetPending" not in drive
          assert "slV268ZenithReady" not in loader
          assert "var version='V273';" in loader

          Path("build/before.json").write_text(
              json.dumps(before,sort_keys=True),
              encoding="utf-8"
          )

          print("PASS V273 original inventory")
          print("PASS independent V241 native renderer available")
          print("PASS V268 broken loading code absent")
          PY

      - name: V274 Clone Death Knight and isolate all owned references
        shell: bash
        run: |
          set -euo pipefail

          cat > build/clone.rb <<'RUBY'
          # encoding: UTF-8
          require 'zlib'
          require 'json'
          require 'set'
          require 'fileutils'
          require 'digest'

          module RPG
            class Map;end
            class MapInfo;end
            class AudioFile;end
            class CommonEvent;end
            class Item;end
            class Weapon;end
            class Armor;end

            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end

            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end

          class Table
            def self._load(raw)
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end
            def _dump(level=0);@raw;end
          end

          class Tone
            def self._load(raw)
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end
            def _dump(level=0);@raw;end
          end

          class Color<Tone;end

          def iv(obj,key)
            obj.instance_variable_get("@"+key.to_s)
          end

          def put(obj,key,value)
            obj.instance_variable_set("@"+key.to_s,value)
          end

          def copy(obj)
            Marshal.load(Marshal.dump(obj))
          end

          ROOT="site/knight/gameasync/"
          DATA=ROOT+"Data/"
          PRE="MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"

          SOURCE_MAP=DATA+PRE+"Map016.rxdata"
          TARGET_MAP=DATA+PRE+"Map025.rxdata"
          COMMON=DATA+PRE+"CommonEvents.rxdata"
          SCRIPTS=DATA+"Scripts.rxdata"
          ORIGINAL_SCRIPTS="v241/knight/gameasync/Data/Scripts.rxdata"

          SOURCE_EVENT=8
          TARGET_EVENT=29
          SOURCE_MAP_ID=16
          TARGET_MAP_ID=25

          SOURCE_HP=1980
          TARGET_HP=4987

          SOURCE_ATTACK_SWITCH=133
          SOURCE_MAGIC_SWITCH=135

          TARGET_ATTACK_SWITCH=5987
          TARGET_MAGIC_SWITCH=5988
          INACTIVE_WAVE_SWITCH=5989

          SWITCH_MAP={
            SOURCE_ATTACK_SWITCH=>TARGET_ATTACK_SWITCH,
            SOURCE_MAGIC_SWITCH=>TARGET_MAGIC_SWITCH
          }

          source_bytes=File.binread(SOURCE_MAP)
          target_map=Marshal.load(File.binread(TARGET_MAP))
          source_map=Marshal.load(source_bytes)
          common=Marshal.load(File.binread(COMMON))
          scripts=Marshal.load(File.binread(SCRIPTS))
          v241=Marshal.load(File.binread(ORIGINAL_SCRIPTS))

          raise "Invalid common events" unless
            common.is_a?(Array) &&
            common[179] &&
            common[901]

          raise "Unexpected V273 scripts" unless
            scripts.is_a?(Array) &&
            scripts.length==138

          raise "Invalid original renderer" unless
            v241[28].is_a?(Array) &&
            v241[28][1]=="Sprite_Character"

          source_events=iv(source_map,:events)
          target_events=iv(target_map,:events)

          source=source_events.fetch(SOURCE_EVENT)
          previous=target_events.fetch(TARGET_EVENT)

          source_name=iv(source,:name).to_s.dup
            .force_encoding("UTF-8").scrub

          previous_name=iv(previous,:name).to_s.dup
            .force_encoding("UTF-8").scrub

          raise "Source is not Death Knight" unless
            source_name.include?("데스나이트")

          raise "Unexpected target boss" unless
            previous_name.include?("제니스 퀸")

          source_pages=iv(source,:pages)
          raise "Expected complete 5-page Death Knight" unless
            source_pages.is_a?(Array) &&
            source_pages.length==5

          raise "Wrong combat page" unless
            iv(source_pages[1],:trigger)==2

          source_death=iv(source_pages[2],:condition)

          raise "Wrong original death page" unless
            iv(source_death,:variable_valid) &&
            iv(source_death,:variable_id)==SOURCE_HP &&
            iv(source_death,:variable_value)==4000

          original_events={}
          target_events.each do |id,event|
            original_events[id]=Marshal.dump(event) unless id==TARGET_EVENT
          end

          original_common=common.map do |event|
            event.nil? ? nil : Marshal.dump(event)
          end

          # Remove V273's dedicated runtime completely.
          old_indices=scripts.each_index.select do |index|
            row=scripts[index]
            row.is_a?(Array) && row[1]=="SLZenithV273"
          end

          raise "V273 runtime missing or duplicated" unless
            old_indices.length==1

          old_index=old_indices.first
          raise "Unexpected runtime position" unless old_index>28

          scripts.delete_at(old_index)

          raise "V273 runtime was not removed" if
            scripts.any?{|row|row.is_a?(Array)&&row[1]=="SLZenithV273"}

          # Revert the modified original renderer itself.
          scripts[28]=copy(v241[28])

          native_sprite=Zlib::Inflate.inflate(scripts[28][2])

          raise "Old Zenith renderer still installed" if
            native_sprite.include?("SLZenithV273") ||
            native_sprite.include?("@slz_v273_cfg") ||
            native_sprite.include?("@slm_v272_cfg")

          raise "Unexpected remaining script count" unless
            scripts.length==137

          # Only the clone receives its own IDs.
          # Do not modify Game_Switches or Game_Variables.
          def inspect_ids(command)
            code=iv(command,:code)
            p=iv(command,:parameters)
            return [[],[]] unless p.is_a?(Array)

            sw=[]
            vars=[]

            case code
            when 121
              if p[0].is_a?(Integer) && p[1].is_a?(Integer)
                sw.concat((p[0]..p[1]).to_a) if p[1]-p[0]<100
              end
            when 122
              if p[0].is_a?(Integer) && p[1].is_a?(Integer)
                vars.concat((p[0]..p[1]).to_a) if p[1]-p[0]<100
              end
              vars << p[4] if p[3]==1 && p[4].is_a?(Integer)
            when 111
              sw << p[1] if p[0]==0
              if p[0]==1
                vars << p[1]
                vars << p[4] if p[3]==1
              end
            end

            [sw,vars]
          end

          protected_switches=[
            TARGET_ATTACK_SWITCH,
            TARGET_MAGIC_SWITCH,
            INACTIVE_WAVE_SWITCH
          ]

          # Check all other native maps and common events.
          Dir.glob(DATA+PRE+"Map???.rxdata").each do |path|
            map=Marshal.load(File.binread(path))
            iv(map,:events).each do |event_id,event|
              next if path==TARGET_MAP && event_id==TARGET_EVENT

              iv(event,:pages).each do |page|
                cond=iv(page,:condition)

                if iv(cond,:switch1_valid)
                  raise "Private switch already used" if
                    protected_switches.include?(iv(cond,:switch1_id))
                end

                if iv(cond,:switch2_valid)
                  raise "Private switch already used" if
                    protected_switches.include?(iv(cond,:switch2_id))
                end

                if iv(cond,:variable_valid)
                  raise "Private HP variable already used" if
                    iv(cond,:variable_id)==TARGET_HP
                end

                (iv(page,:list)||[]).each do |cmd|
                  sw,vars=inspect_ids(cmd)
                  raise "Switch collision" unless
                    (sw & protected_switches).empty?
                  raise "Variable collision" if vars.include?(TARGET_HP)
                end
              end
            end
          end

          common.compact.each do |ce|
            raise "Common event switch collision" if
              protected_switches.include?(iv(ce,:switch_id)) &&
              iv(ce,:trigger).to_i>0

            (iv(ce,:list)||[]).each do |cmd|
              sw,vars=inspect_ids(cmd)
              raise "Common event switch collision" unless
                (sw & protected_switches).empty?
              raise "Common event variable collision" if vars.include?(TARGET_HP)
            end
          end

          scripts.each do |row|
            next unless row.is_a?(Array)
            text=Zlib::Inflate.inflate(row[2]).force_encoding("UTF-8").scrub

            if text.match?(/\$game_variables\[\s*4987\s*\]/) ||
               text.match?(/\$game_switches\[\s*(?:5987|5988|5989)\s*\]/)
              raise "Private identifier used by another script: #{row[1]}"
            end
          end

          switches=Zlib::Inflate.inflate(scripts[7][2])
          variables=Zlib::Inflate.inflate(scripts[8][2])

          raise "Switch limit changed" unless
            switches.include?("switch_id <= 6000")

          raise "Variable limit changed" unless
            variables.include?("variable_id <= 5000")

          # Independently copy every Death Knight-specific common event.
          # CE57 is a shared native defense/damage helper and stays read-only.
          ce_ids=Set.new([179,901])

          source_pages.each do |page|
            (iv(page,:list)||[]).each do |cmd|
              if iv(cmd,:code)==117
                p=iv(cmd,:parameters)
                ce_ids.add(p[0]) if p.is_a?(Array) && p[0]!=57
              end
            end
          end

          common.each_with_index do |ce,id|
            next unless ce
            next unless iv(ce,:trigger).to_i>0

            if [SOURCE_ATTACK_SWITCH,SOURCE_MAGIC_SWITCH].include?(
                 iv(ce,:switch_id))
              ce_ids.add(id)
            end
          end

          queue=ce_ids.to_a
          seen=Set.new

          until queue.empty?
            id=queue.shift
            next if seen.include?(id)

            raise "Invalid common event #{id}" unless
              id.is_a?(Integer) && id>0 && common[id]

            seen.add(id)

            (iv(common[id],:list)||[]).each do |cmd|
              next unless iv(cmd,:code)==117
              params=iv(cmd,:parameters)
              next unless params.is_a?(Array)
              child=params[0]
              next if child==57
              next if seen.include?(child)
              ce_ids.add(child)
              queue << child
            end

            raise "Unexpected common event dependency graph" if
              ce_ids.length>96
          end

          # Allocate IDs beyond the original common event table.
          ce_map={}
          ce_ids.to_a.sort.each_with_index do |old_id,index|
            ce_map[old_id]=common.length+index
          end

          raise "Native attack common event not cloned" unless
            ce_map[179] && ce_map[901]

          # Original source name to independent sprite filename.
          graphic_dir=ROOT+"Graphics/Characters/"
          graphics={}
          boss=copy(source)
          pages=iv(boss,:pages)

          pages.each do |page|
            graphic=iv(page,:graphic)
            original=iv(graphic,:character_name).to_s.dup
              .force_encoding("UTF-8").scrub

            next if original.empty?

            unless graphics.key?(original)
              native_file=graphic_dir+original+".png"

              raise "Missing native Death Knight sprite #{original}" unless
                File.file?(native_file)

              new_name=format("SLDK2F_%02d",graphics.length+1)
              new_file=graphic_dir+new_name+".png"

              raise "Clone graphic already exists" if File.exist?(new_file)

              FileUtils.cp(native_file,new_file)

              raise "Sprite copy changed pixels/bytes" unless
                Digest::SHA256.file(native_file).hexdigest==
                Digest::SHA256.file(new_file).hexdigest

              graphics[original]={
                "name"=>new_name,
                "source"=>original,
                "file"=>new_file
              }
            end

            put(graphic,:character_name,graphics[original]["name"])
          end

          raise "No Death Knight graphics copied" if graphics.empty?

          # Rewrite only the cloned command objects.
          # Original events and common events are never modified.
          def remap_script(text,ce_map,graphics)
            source=text.dup

            source.gsub!(
              /\$game_variables\[\s*1980\s*\]/,
              "$game_variables[4987]"
            )

            source.gsub!(
              /\$game_switches\[\s*133\s*\]/,
              "$game_switches[5987]"
            )

            source.gsub!(
              /\$game_switches\[\s*135\s*\]/,
              "$game_switches[5988]"
            )

            source.gsub!(
              /\$game_map\.events\[\s*8\s*\]/,
              "$game_map.events[29]"
            )

            source.gsub!(
              /\$game_map\.map_id\s*==\s*16\b/,
              "$game_map.map_id==25"
            )

            source.gsub!(
              /SLMonsterAttackContext\.register\([^)]*\)/,
              "SLMonsterAttackContext.register(5987,25,29)"
            )

            source.gsub!(
              /common_event_id\s*=\s*(\d+)/
            ) do |match|
              id=match[/\d+/].to_i
              "common_event_id = #{ce_map.fetch(id,id)}"
            end

            graphics.each do |original,data|
              replacement=data["name"]
              source=source.gsub("'#{original}'","'#{replacement}'")
              source=source.gsub("\"#{original}\"","\"#{replacement}\"")
            end

            source
          end

          def remap_commands(list,ce_map,graphics)
            list.each do |cmd|
              code=iv(cmd,:code)
              p=iv(cmd,:parameters)
              next unless p.is_a?(Array)

              case code
              when 117
                p[0]=ce_map.fetch(p[0],p[0])

              when 121
                if p[0].is_a?(Integer) && p[1].is_a?(Integer)
                  if p[0]==p[1] && SWITCH_MAP[p[0]]
                    p[0]=SWITCH_MAP[p[0]]
                    p[1]=SWITCH_MAP[p[1]]
                  elsif SWITCH_MAP.keys.any?{|id|p[0]<=id && id<=p[1]}
                    raise "Unsupported ranged native switch command"
                  end
                end

              when 122
                if p[0]==SOURCE_HP && p[1]==SOURCE_HP
                  p[0]=TARGET_HP
                  p[1]=TARGET_HP
                elsif p[0].is_a?(Integer) && p[1].is_a?(Integer) &&
                      p[0]<=SOURCE_HP && SOURCE_HP<=p[1]
                  raise "Unsupported ranged native HP variable command"
                end

                p[4]=TARGET_HP if p[3]==1 && p[4]==SOURCE_HP

              when 111
                if p[0]==0 && SWITCH_MAP[p[1]]
                  p[1]=SWITCH_MAP[p[1]]
                elsif p[0]==1
                  p[1]=TARGET_HP if p[1]==SOURCE_HP
                  p[4]=TARGET_HP if p[3]==1 && p[4]==SOURCE_HP
                end

              when 355,655
                if p[0].is_a?(String)
                  p[0]=remap_script(p[0],ce_map,graphics)
                end

              when 209,207,205
                # Explicit event targets only; 0 still means "this event".
                p[0]=TARGET_EVENT if p[0]==SOURCE_EVENT
              end
            end
          end

          # Deep-copy CE records, not just their numeric references.
          ce_map.keys.sort.each do |old_id|
            new_ce=copy(common.fetch(old_id))

            put(new_ce,:id,ce_map[old_id])
            name=iv(new_ce,:name).to_s.dup
              .force_encoding("UTF-8").scrub

            put(new_ce,:name,"[DK2F] "+name)

            if iv(new_ce,:trigger).to_i>0
              old_switch=iv(new_ce,:switch_id)

              raise "Unexpected shared parallel CE #{old_id}" unless
                SWITCH_MAP.key?(old_switch)

              put(new_ce,:switch_id,SWITCH_MAP[old_switch])
            end

            remap_commands(iv(new_ce,:list)||[],ce_map,graphics)

            common << new_ce
          end

          # Retain all FIVE original pages.
          pages.each do |page|
            condition=iv(page,:condition)

            if iv(condition,:variable_valid) &&
               iv(condition,:variable_id)==SOURCE_HP
              put(condition,:variable_id,TARGET_HP)
            end

            if iv(condition,:switch1_valid) &&
               SWITCH_MAP[iv(condition,:switch1_id)]
              put(condition,:switch1_id,
                  SWITCH_MAP[iv(condition,:switch1_id)])
            end

            if iv(condition,:switch2_valid) &&
               SWITCH_MAP[iv(condition,:switch2_id)]
              put(condition,:switch2_id,
                  SWITCH_MAP[iv(condition,:switch2_id)])
            end

            remap_commands(iv(page,:list)||[],ce_map,graphics)
          end

          # Remove ONLY the colosseum wave condition from the combat page.
          # Preserve the native battle commands and movement route.
          combat_condition=iv(pages[1],:condition)

          put(combat_condition,:switch1_valid,false)
          put(combat_condition,:switch2_valid,false)
          put(combat_condition,:variable_valid,false)
          put(combat_condition,:self_switch_valid,false)

          # Original Death Knight death page: 4000 HP.
          death_condition=iv(pages[2],:condition)

          put(death_condition,:switch1_valid,false)
          put(death_condition,:switch2_valid,false)
          put(death_condition,:self_switch_valid,false)
          put(death_condition,:variable_valid,true)
          put(death_condition,:variable_id,TARGET_HP)
          put(death_condition,:variable_value,4000)

          # Higher-priority source colosseum pages remain copied,
          # but their wave conditions cannot hijack this map.
          [3,4].each do |page_index|
            condition=iv(pages[page_index],:condition)
            put(condition,:switch1_valid,true)
            put(condition,:switch1_id,INACTIVE_WAVE_SWITCH)
          end

          # Preserve the previous boss position on Tower 2F.
          put(boss,:id,TARGET_EVENT)
          put(boss,:name,"데스나이트 (오만 2층 복제)")
          put(boss,:x,iv(previous,:x))
          put(boss,:y,iv(previous,:y))

          target_events[TARGET_EVENT]=boss

          # Verify that every other event has remained byte-identical.
          original_events.each do |id,raw|
            raise "Other Map025 event changed: #{id}" unless
              Marshal.dump(target_events[id])==raw
          end

          original_common.each_with_index do |raw,index|
            actual=common[index]
            actual_raw=actual.nil? ? nil : Marshal.dump(actual)

            raise "Original common event changed: #{index}" unless
              actual_raw==raw
          end

          raise "Original Death Knight map modified" unless
            File.binread(SOURCE_MAP)==source_bytes

          cloned_cycle=common.fetch(ce_map[179])
          cloned_attack=common.fetch(ce_map[901])

          raise "Attack cycle switch not isolated" unless
            iv(cloned_cycle,:switch_id)==TARGET_ATTACK_SWITCH

          raise "Cloned native attack missing" unless
            (iv(cloned_attack,:list)||[]).count{
              |cmd|iv(cmd,:code)==311
            }>=2

          raise "Death Knight page count changed" unless
            iv(boss,:pages).length==5

          raise "Native combat page changed" unless
            iv(pages[1],:trigger)==iv(source_pages[1],:trigger)

          raise "Private death HP missing" unless
            iv(death_condition,:variable_id)==TARGET_HP &&
            iv(death_condition,:variable_value)==4000

          File.binwrite(TARGET_MAP,Marshal.dump(target_map))
          File.binwrite(COMMON,Marshal.dump(common))
          File.binwrite(SCRIPTS,Marshal.dump(scripts))

          File.write(
            "build/new-images.json",
            JSON.pretty_generate(graphics.values),
            encoding:"UTF-8"
          )

          File.write(
            "build/clone-report.json",
            JSON.pretty_generate({
              version:"V274",
              source_map:16,
              source_event:8,
              target_map:25,
              target_event:29,
              copied_event_pages:5,
              source_hp_variable:1980,
              cloned_hp_variable:4987,
              cloned_attack_switch:5987,
              cloned_magic_switch:5988,
              cloned_common_events:ce_map,
              cloned_graphics:graphics.values,
              original_script_count:138,
              final_script_count:scripts.length
            }),
            encoding:"UTF-8"
          )

          puts "PASS V273 Zenith runtime removed"
          puts "PASS original V241 native Sprite_Character restored"
          puts "PASS native Death Knight event fully deep-copied (5 pages)"
          puts "PASS copied CEs #{ce_map.inspect}"
          puts "PASS source HP and attack switches isolated"
          puts "PASS #{graphics.length} original sprite files copied independently"
          puts "PASS original Map016 and all original common events unchanged"
          puts "PASS clone event Map025 EV29 contains no extra runtime engine"
          RUBY

          ruby -c build/clone.rb
          ruby build/clone.rb

      - name: V274 Refresh mapping for independent graphics and RXData
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re

          root=Path("site")
          game=root/"knight/gameasync"
          manifest=game/"mapping.js"
          text=manifest.read_text("utf-8")

          graphics=json.loads(
              Path("build/new-images.json").read_text("utf-8")
          )

          anchor="];\n\nvar mapping = {}"

          assert text.count(anchor)==1,(
              "Original mapping table anchor changed",
              text.count(anchor)
          )

          entries=[]

          for item in graphics:
              name=item["name"]
              path=Path(item["file"])
              assert path.is_file(),path

              digest=hashlib.md5(path.read_bytes()).hexdigest()

              entries.append(
                  f'["graphics/characters/{name.lower()}", '
                  f'"Graphics/Characters/{name}.png?h={digest}"],'
              )

          text=text.replace(
              anchor,
              "\n"+"\n".join(entries)+"\n"+anchor
          )

          changed=[
              game/"Data/Scripts.rxdata",
              game/"Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap025.rxdata",
              game/"Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata"
          ]

          for path in changed:
              key="Data/"+path.name
              digest=hashlib.md5(path.read_bytes()).hexdigest()

              pattern="("+re.escape(key)+r"\?h=)[0-9a-f]{32}"

              text,count=re.subn(
                  pattern,
                  lambda match:match.group(1)+digest,
                  text
              )

              assert count==1,(key,count)

          manifest.write_text(text,encoding="utf-8")

          loader=root/"knight/js/sl-assets-v229r115.js"
          source=loader.read_text("utf-8")

          assert source.count("var version='V273';")==1

          loader.write_text(
              source.replace(
                  "var version='V273';",
                  "var version='V274';"
              ),
              encoding="utf-8"
          )

          for name in ("index.html","knight/index.html"):
              path=root/name
              html=path.read_text("utf-8")

              assert "V273" in html,name

              html=html.replace("V273","V274")
              html=html.replace("v273","v274")

              path.write_text(html,encoding="utf-8")

          print("PASS independent sprite mappings added")
          print("PASS three RXData resource hashes updated")
          print("PASS no browser loader implementation changed")
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/dpad.js

      - name: V274 Verify independent clone and untouched original files
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root=Path("site")

          before=json.loads(
              Path("build/before.json").read_text("utf-8")
          )

          after={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob("*") if p.is_file()
          }

          pre="knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"

          allowed={
              pre+"Map025.rxdata",
              pre+"CommonEvents.rxdata",
              "knight/gameasync/Data/Scripts.rxdata",
              "knight/gameasync/mapping.js",
              "knight/js/sl-assets-v229r115.js",
              "index.html",
              "knight/index.html"
          }

          graphics=json.loads(
              Path("build/new-images.json").read_text("utf-8")
          )

          added={
              "knight/gameasync/Graphics/Characters/"
              +item["name"]+".png"
              for item in graphics
          }

          changed={
              path for path in before
              if before[path]!=after.get(path)
          }

          assert changed==allowed,(
              "Unexpected modifications",
              sorted(changed^allowed)
          )

          assert set(after)-set(before)==added,(
              "Unexpected new files",
              sorted((set(after)-set(before))^added)
          )

          assert set(before)-set(after)==set()
          assert len(after)==5610+len(added)

          for name in before:
              if name.startswith("knight/gameasync/Graphics/"):
                  assert before[name]==after[name],(
                      "Original graphics modified",
                      name
                  )

          for item in graphics:
              original=(
                  "knight/gameasync/Graphics/Characters/"
                  +item["source"]+".png"
              )
              cloned=(
                  "knight/gameasync/Graphics/Characters/"
                  +item["name"]+".png"
              )

              assert original in before
              assert cloned in after
              assert before[original]==after[cloned],(
                  "Sprite copy mismatch",
                  original,cloned
              )

          protected=(
              pre+"Map016.rxdata",
              pre+"Map021.rxdata",
              pre+"Map047.rxdata",
              "knight/js/drive.js",
              "knight/js/dpad.js",
              "knight/assets/map-047-v241.pack"
          )

          for name in protected:
              assert before[name]==after[name],(
                  "Protected original changed",
                  name
              )

          report=json.loads(
              Path("build/clone-report.json").read_text("utf-8")
          )

          ce=report["cloned_common_events"]
          assert "179" in ce and "901" in ce
          assert ce["179"]!=179
          assert ce["901"]!=901
          assert report["source_hp_variable"]!=report["cloned_hp_variable"]
          assert report["cloned_attack_switch"]!=133
          assert report["cloned_magic_switch"]!=135
          assert report["copied_event_pages"]==5
          assert report["final_script_count"]==137

          print("PASS original Death Knight event and combat data unchanged")
          print("PASS all original PNGs byte-identical")
          print("PASS cloned PNGs independently addressable")
          print("PASS source and cloned common-event IDs differ")
          print("PASS no unrelated original game files modified")
          print("PASS original browser loader and Map047 preserved")
          PY

