      - name: Reject any bridge or teleport landing outside the new regions
        shell: bash
        run: |
          set -euo pipefail
          cat > build/v211/verify_transfers.rb <<'V211_VERIFY_TRANSFERS_EOF'
          # encoding: UTF-8
          module RPG
            class Map;end
            class Event;end
            class Event::Page;end
            class Event::Page::Condition;end
            class Event::Page::Graphic;end
            class EventCommand;end
            class MoveCommand;end
            class MoveRoute;end
            class AudioFile;end
            class MapInfo;end
          end
          class Table
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(depth);@raw;end
          end
          class Color
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(depth);@raw;end
          end
          class Tone
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(depth);@raw;end
          end
          prefix='site/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          maps={}
          [48,49,50].each{|id|maps[id]=Marshal.load(File.binread(prefix+format('Map%03d.rxdata',id)))}
          def walkable(map,x,y)
            w=map.instance_variable_get(:@width);h=map.instance_variable_get(:@height)
            return false unless x.between?(0,w-1) && y.between?(0,h-1)
            map.instance_variable_get(:@data).instance_variable_get(:@raw).byteslice(20+2*(y*w+x),2).unpack1('v')==384
          end
          fails=[]
          ev48=maps[48].instance_variable_get(:@events)
          raise 'Map048 bridge inventory' unless ev48.keys.sort==(1..8).to_a
          raise 'Map049 still has unreachable bridge events' unless maps[49].instance_variable_get(:@events).empty?
          raise 'Map050 events' unless maps[50].instance_variable_get(:@events).empty?
          ev48.sort.each do |id,e|
            x=e.instance_variable_get(:@x);y=e.instance_variable_get(:@y)
            cmds=e.instance_variable_get(:@pages)[0].instance_variable_get(:@list).select{|c|c.instance_variable_get(:@code)==201}
            raise "Map048 event #{id} transfer" unless cmds.size==1
            _,dest,tx,ty=cmds[0].instance_variable_get(:@parameters)
            ok=dest==48 && walkable(maps[48],x,y) && walkable(maps[48],tx,ty)
            puts "BRIDGE Map048 EVENT#{id} #{x},#{y} -> Map#{dest} #{tx},#{ty} ok=#{ok}"
            fails << "bridge #{id}" unless ok
          end
          npc=Marshal.load(File.binread(prefix+'Map029.rxdata')).instance_variable_get(:@events)[11]
          list=npc.instance_variable_get(:@pages)[0].instance_variable_get(:@list)
          list.select{|c|c.instance_variable_get(:@code)==201}.each do |c|
            _,dest,tx,ty=c.instance_variable_get(:@parameters)
            next unless [48,49,50].include?(dest)
            ok=walkable(maps[dest],tx,ty)
            puts "TELEPORT Map#{dest} #{tx},#{ty} ok=#{ok}"
            fails << "teleport #{dest} #{tx},#{ty}" unless ok
          end
          raise "V2.11 REJECTED: transfer lands on blocked or out-of-region tile: #{fails.join(', ')}" unless fails.empty?
          puts 'PASS every bridge and teleport into Map048/049/050 lands on region terrain'
          V211_VERIFY_TRANSFERS_EOF
          ruby -c build/v211/verify_transfers.rb
          ruby build/v211/verify_transfers.rb
      - name: Publish verified V2.11 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
