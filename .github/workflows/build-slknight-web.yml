
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V276
# BASE: V241 successful run 41293648580
# PURPOSE: Independent native Death Knight clone on Tower 2F.
# SOURCE: Map016 EV8
# TARGET: Map025 EV29
# PRESERVE: Original scripts, maps, monsters, items, and Map047.
# REMOVE: All prior Zenith changes by restoring V241 directly.
# COPY: Original five event pages, native combat common events,
#       original character graphics under independent filenames.
# ISOLATE: HP 4988, attack switch 5991, magic switch 5992.
# NO CUSTOM GAME ENGINE, NO EXTRA PER-FRAME UPDATE HOOK.
# STATUS: GitHub Actions and device play not yet verified.

name: build-slknight-web.yml | V276 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: V276 Download clean V241 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41293648580
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V276 Restore and verify original game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s baseline/artifact.tar
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json

          root=Path("site")
          files={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob("*") if p.is_file()
          }

          assert len(files)==5603,(
              "Wrong V241 baseline",len(files)
          )

          pre="MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"
          data=root/"knight/gameasync/Data"

          for name in (
              "Scripts.rxdata",
              pre+"Map016.rxdata",
              pre+"Map025.rxdata",
              pre+"CommonEvents.rxdata"
          ):
              assert (data/name).is_file(),name

          assert "V241" in (
              root/"knight/index.html"
          ).read_text("utf-8")

          # Original V241 script archive fingerprint.
          expected=(
              "f43507920c57e81ec1d219bae492f5e"
              "6191f6471f733d8d471f81e8515f7d167"
          )
          assert files["knight/gameasync/Data/Scripts.rxdata"]==expected

          for mid in (45,46):
              assert not (data/(pre+f"Map{mid:03d}.rxdata")).exists()

          Path("build/before.json").write_text(
              json.dumps(files,sort_keys=True),
              encoding="utf-8"
          )

          print("PASS exact clean V241 baseline")
          print("PASS original 5603 game files")
          print("PASS original monster scripts unchanged")
          print("PASS original Talking Island and Map047 retained")
          PY

      - name: V276 Copy native Death Knight as independent event
        shell: bash
        run: |
          set -euo pipefail

          cat > build/clone.rb <<'RUBY'
          # encoding: UTF-8
          require 'zlib'
          require 'json'
          require 'set'
          require 'fileutils'
          require 'digest'

          module RPG
            class Map;end
            class MapInfo;end
            class AudioFile;end
            class CommonEvent;end

            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end

            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end

          class Table
            def self._load(data)
              o=allocate
              o.instance_variable_set(:@raw,data)
              o
            end
            def _dump(level=0);@raw;end
          end

          class Tone
            def self._load(data)
              o=allocate
              o.instance_variable_set(:@raw,data)
              o
            end
            def _dump(level=0);@raw;end
          end

          class Color<Tone;end

          def iv(obj,key)
            obj.instance_variable_get("@"+key.to_s)
          end

          def put(obj,key,value)
            obj.instance_variable_set("@"+key.to_s,value)
          end

          def duplicate(obj)
            Marshal.load(Marshal.dump(obj))
          end

          ROOT="site/knight/gameasync/"
          DATA=ROOT+"Data/"
          PRE="MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"

          MAP16=DATA+PRE+"Map016.rxdata"
          MAP25=DATA+PRE+"Map025.rxdata"
          COMMON=DATA+PRE+"CommonEvents.rxdata"
          SCRIPTS=DATA+"Scripts.rxdata"

          OLD_MAP_ID=16
          OLD_EVENT_ID=8
          NEW_MAP_ID=25
          NEW_EVENT_ID=29

          OLD_HP=1980
          NEW_HP=4988

          OLD_ATTACK_SW=133
          NEW_ATTACK_SW=5991

          OLD_MAGIC_SW=135
          NEW_MAGIC_SW=5992

          DISABLED_WAVE_SW=5993

          SWITCH_MAP={
            OLD_ATTACK_SW=>NEW_ATTACK_SW,
            OLD_MAGIC_SW=>NEW_MAGIC_SW
          }

          PRIVATE_SWITCHES=[
            NEW_ATTACK_SW,
            NEW_MAGIC_SW,
            DISABLED_WAVE_SW
          ]

          original_map16_bytes=File.binread(MAP16)
          original_scripts_bytes=File.binread(SCRIPTS)

          map16=Marshal.load(original_map16_bytes)
          map25=Marshal.load(File.binread(MAP25))
          common=Marshal.load(File.binread(COMMON))

          source=iv(map16,:events).fetch(OLD_EVENT_ID)
          events=iv(map25,:events)

          raise "EV29 already occupied in V241" if
            events.key?(NEW_EVENT_ID)

          source_name=iv(source,:name).to_s.dup
            .force_encoding("UTF-8").scrub

          raise "Not the original Death Knight" unless
            source_name.include?("데스나이트")

          source_pages=iv(source,:pages)

          raise "Death Knight pages missing" unless
            source_pages.length==5

          raise "Native combat trigger differs" unless
            iv(source_pages[1],:trigger)==2

          death_condition=iv(source_pages[2],:condition)

          raise "Original death condition differs" unless
            iv(death_condition,:variable_valid) &&
            iv(death_condition,:variable_id)==OLD_HP &&
            iv(death_condition,:variable_value)==4000

          raise "Native common event missing" unless
            common[57] && common[179] && common[901]

          original_events=events.transform_values{
            |event|Marshal.dump(event)
          }

          original_common=common.map{
            |ce|ce.nil? ? nil : Marshal.dump(ce)
          }

          # Ensure the clone's new IDs are not already assigned.
          def used_private_id?(cmd)
            p=iv(cmd,:parameters)
            return false unless p.is_a?(Array)

            case iv(cmd,:code)
            when 121
              return false unless p[0].is_a?(Integer) &&
                p[1].is_a?(Integer)
              return false if p[1]-p[0]>100
              PRIVATE_SWITCHES.any?{|id|p[0]<=id && id<=p[1]}

            when 122
              return false unless p[0].is_a?(Integer) &&
                p[1].is_a?(Integer)
              if p[1]-p[0]<=100 &&
                 p[0]<=NEW_HP && NEW_HP<=p[1]
                return true
              end
              p[3]==1 && p[4]==NEW_HP

            when 111
              (p[0]==0 && PRIVATE_SWITCHES.include?(p[1])) ||
              (p[0]==1 && (
                p[1]==NEW_HP ||
                (p[3]==1 && p[4]==NEW_HP)
              ))
            else
              false
            end
          end

          Dir.glob(DATA+PRE+"Map???.rxdata").each do |path|
            map=Marshal.load(File.binread(path))

            iv(map,:events).each_value do |event|
              iv(event,:pages).each do |page|
                cond=iv(page,:condition)

                raise "Reserved switch in existing event" if
                  (iv(cond,:switch1_valid) &&
                   PRIVATE_SWITCHES.include?(iv(cond,:switch1_id))) ||
                  (iv(cond,:switch2_valid) &&
                   PRIVATE_SWITCHES.include?(iv(cond,:switch2_id)))

                raise "Reserved HP in existing event" if
                  iv(cond,:variable_valid) &&
                  iv(cond,:variable_id)==NEW_HP

                raise "Reserved ID in existing command" if
                  (iv(page,:list)||[]).any?{
                    |cmd|used_private_id?(cmd)
                  }
              end
            end
          end

          common.compact.each do |ce|
            if iv(ce,:trigger).to_i>0
              raise "Reserved common-event switch" if
                PRIVATE_SWITCHES.include?(iv(ce,:switch_id))
            end

            raise "Reserved common-event command" if
              (iv(ce,:list)||[]).any?{
                |cmd|used_private_id?(cmd)
              }
          end

          scripts=Marshal.load(original_scripts_bytes)
          raise "Invalid native scripts" unless scripts.is_a?(Array)

          scripts.each do |entry|
            next unless entry.is_a?(Array)
            text=Zlib::Inflate.inflate(entry[2]).b

            raise "Reserved ID already used by engine" if
              text.match?(
                /\$(?:game_variables|game_switches)\[\s*
                (?:4988|5991|5992|5993)\s*\]/nx
              )
          end

          # Copy only the combat helpers owned by Death Knight.
          # Shared game-wide common events, such as CE553,
          # remain untouched and are NOT recursively cloned.
          owned_ids=Set.new([57,179,901])

          common.each_with_index do |ce,id|
            next unless ce
            next unless iv(ce,:trigger).to_i>0

            if [OLD_ATTACK_SW,OLD_MAGIC_SW].include?(
              iv(ce,:switch_id)
            )
              owned_ids.add(id)
            end
          end

          raise "Unexpected dedicated CE inventory" if
            owned_ids.length>12

          original_ce_count=common.length
          ce_map={}

          owned_ids.to_a.sort.each_with_index do |old_id,index|
            ce_map[old_id]=original_ce_count+index
          end

          # All objects are independently deep-copied.
          boss=duplicate(source)
          pages=iv(boss,:pages)
          clones={}

          ce_map.each do |old_id,new_id|
            ce=duplicate(common.fetch(old_id))
            put(ce,:id,new_id)

            name=iv(ce,:name).to_s.dup
              .force_encoding("UTF-8").scrub
            put(ce,:name,"[DK2F] "+name)

            if iv(ce,:trigger).to_i>0
              source_switch=iv(ce,:switch_id)

              raise "Unexpected dedicated CE switch #{old_id}" unless
                SWITCH_MAP.key?(source_switch)

              put(ce,:switch_id,SWITCH_MAP[source_switch])
            end

            clones[old_id]=ce
          end

          # Collect original graphics referenced by native pages
          # and their movement routes.
          graphics={}
          sprite_dir=ROOT+"Graphics/Characters/"

          def register_graphic(value,graphics,sprite_dir)
            return if value.nil?
            original=value.to_s.dup.force_encoding("UTF-8").scrub
            return if original.empty?
            return if graphics.key?(original)

            source_file=sprite_dir+original+".png"
            raise "Source sprite absent: #{original}" unless
              File.file?(source_file)

            new_name=format("SLDK2F%02d",graphics.length+1)
            target_file=sprite_dir+new_name+".png"

            raise "Independent sprite already exists" if
              File.exist?(target_file)

            FileUtils.cp(source_file,target_file)

            raise "Sprite copy differs from source" unless
              Digest::SHA256.file(source_file).hexdigest==
              Digest::SHA256.file(target_file).hexdigest

            graphics[original]={
              "old"=>original,
              "new"=>new_name,
              "path"=>target_file
            }
          end

          def movement_graphics(route,graphics,sprite_dir)
            return unless route.is_a?(RPG::MoveRoute)

            (iv(route,:list)||[]).each do |move|
              next unless iv(move,:code)==41
              p=iv(move,:parameters)
              next unless p.is_a?(Array)
              register_graphic(p[0],graphics,sprite_dir)
            end
          end

          pages.each do |page|
            graphic=iv(page,:graphic)

            register_graphic(
              iv(graphic,:character_name),graphics,sprite_dir
            )

            movement_graphics(
              iv(page,:move_route),graphics,sprite_dir
            )

            (iv(page,:list)||[]).each do |cmd|
              next unless iv(cmd,:code)==209
              params=iv(cmd,:parameters)
              movement_graphics(
                params[1],graphics,sprite_dir
              ) if params.is_a?(Array)
            end
          end

          clones.each_value do |ce|
            (iv(ce,:list)||[]).each do |cmd|
              next unless iv(cmd,:code)==209
              p=iv(cmd,:parameters)
              movement_graphics(
                p[1],graphics,sprite_dir
              ) if p.is_a?(Array)
            end
          end

          raise "No original DK graphics found" if graphics.empty?

          # Original RGSS event scripts are binary strings.
          # The replacement must therefore be binary-safe.
          def remap_script(value,graphics,ce_map)
            s=value.dup.b

            s.gsub!(
              /\$game_variables\[\s*1980\s*\]/n,
              "$game_variables[4988]".b
            )

            s.gsub!(
              /\$game_switches\[\s*133\s*\]/n,
              "$game_switches[5991]".b
            )

            s.gsub!(
              /\$game_switches\[\s*135\s*\]/n,
              "$game_switches[5992]".b
            )

            s.gsub!(
              /\$game_map\.events\[\s*8\s*\]/n,
              "$game_map.events[29]".b
            )

            s.gsub!(
              /\$game_map\.map_id\s*==\s*16\b/n,
              "$game_map.map_id==25".b
            )

            s.gsub!(
              /SLMonsterAttackContext\.register\([^)]*\)/n,
              "SLMonsterAttackContext.register(5991,25,29)".b
            )

            graphics.each do |old_name,info|
              new_name=info["new"]

              s=s.gsub(
                "'#{old_name}'".b,
                "'#{new_name}'".b
              )

              s=s.gsub(
                "\"#{old_name}\"".b,
                "\"#{new_name}\"".b
              )
            end

            s
          end

          def remap_move_route(route,graphics)
            return unless route.is_a?(RPG::MoveRoute)

            (iv(route,:list)||[]).each do |move|
              next unless iv(move,:code)==41
              p=iv(move,:parameters)
              next unless p.is_a?(Array)

              old_name=p[0].to_s.dup
                .force_encoding("UTF-8").scrub

              if graphics[old_name]
                p[0]=graphics[old_name]["new"]
              end
            end
          end

          def remap_commands(commands,ce_map,graphics)
            commands.each do |cmd|
              code=iv(cmd,:code)
              p=iv(cmd,:parameters)
              next unless p.is_a?(Array)

              case code
              when 117
                p[0]=ce_map.fetch(p[0],p[0])

              when 121
                if p[0].is_a?(Integer) &&
                   p[1].is_a?(Integer)

                  if p[0]==p[1] && SWITCH_MAP[p[0]]
                    p[0]=SWITCH_MAP[p[0]]
                    p[1]=SWITCH_MAP[p[1]]
                  elsif SWITCH_MAP.keys.any?{
                    |id|p[0]<=id && id<=p[1]
                  }
                    raise "Unisolated ranged attack switch"
                  end
                end

              when 122
                if p[0]==OLD_HP && p[1]==OLD_HP
                  p[0]=NEW_HP
                  p[1]=NEW_HP
                elsif p[0].is_a?(Integer) &&
                      p[1].is_a?(Integer) &&
                      p[0]<=OLD_HP && OLD_HP<=p[1]
                  raise "Unisolated HP variable range"
                end

                if p[3]==1 && p[4]==OLD_HP
                  p[4]=NEW_HP
                end

              when 111
                if p[0]==0 && SWITCH_MAP[p[1]]
                  p[1]=SWITCH_MAP[p[1]]
                elsif p[0]==1
                  p[1]=NEW_HP if p[1]==OLD_HP
                  p[4]=NEW_HP if p[3]==1 && p[4]==OLD_HP
                end

              when 355,655
                if p[0].is_a?(String)
                  p[0]=remap_script(p[0],graphics,ce_map)
                end

              when 209
                p[0]=NEW_EVENT_ID if p[0]==OLD_EVENT_ID
                remap_move_route(p[1],graphics)

              when 207
                p[0]=NEW_EVENT_ID if p[0]==OLD_EVENT_ID
              end
            end
          end

          # Rewire only independent copies of common events.
          ce_map.keys.sort.each do |old_id|
            clone=clones.fetch(old_id)

            remap_commands(
              iv(clone,:list)||[],ce_map,graphics
            )

            common<<clone
          end

          # Preserve all five Death Knight event pages.
          pages.each do |page|
            cond=iv(page,:condition)

            if iv(cond,:variable_valid) &&
               iv(cond,:variable_id)==OLD_HP
              put(cond,:variable_id,NEW_HP)
            end

            if iv(cond,:switch1_valid) &&
               SWITCH_MAP[iv(cond,:switch1_id)]
              put(
                cond,:switch1_id,
                SWITCH_MAP[iv(cond,:switch1_id)]
              )
            end

            if iv(cond,:switch2_valid) &&
               SWITCH_MAP[iv(cond,:switch2_id)]
              put(
                cond,:switch2_id,
                SWITCH_MAP[iv(cond,:switch2_id)]
              )
            end

            graphic=iv(page,:graphic)

            old_name=iv(graphic,:character_name)
              .to_s.dup.force_encoding("UTF-8").scrub

            if graphics[old_name]
              put(
                graphic,:character_name,
                graphics[old_name]["new"]
              )
            end

            remap_move_route(
              iv(page,:move_route),graphics
            )

            remap_commands(
              iv(page,:list)||[],ce_map,graphics
            )
          end

          # Remove the original colosseum's wave requirement
          # from the normal combat page only.
          combat_condition=iv(pages[1],:condition)

          put(combat_condition,:switch1_valid,false)
          put(combat_condition,:switch2_valid,false)
          put(combat_condition,:variable_valid,false)
          put(combat_condition,:self_switch_valid,false)

          # Death Knight native HP remains 4000.
          # The death page uses only the clone's variable.
          clone_death=iv(pages[2],:condition)

          put(clone_death,:switch1_valid,false)
          put(clone_death,:switch2_valid,false)
          put(clone_death,:self_switch_valid,false)
          put(clone_death,:variable_valid,true)
          put(clone_death,:variable_id,NEW_HP)
          put(clone_death,:variable_value,4000)

          # Retain the two original colosseum pages,
          # but prevent their activation on Tower 2F.
          [3,4].each do |index|
            cond=iv(pages[index],:condition)

            put(cond,:switch1_valid,true)
            put(cond,:switch1_id,DISABLED_WAVE_SW)
          end

          # Position near a native Tower 2F monster.
          ref=events.fetch(11)

          sx=iv(ref,:x)
          sy=iv(ref,:y)
          width=iv(map25,:width)
          height=iv(map25,:height)

          occupied=events.values.map{
            |event|[iv(event,:x),iv(event,:y)]
          }

          spawn=nil

          (1..10).each do |radius|
            break if spawn

            (-radius..radius).each do |dy|
              break if spawn

              (-radius..radius).each do |dx|
                x=sx+dx
                y=sy+dy

                next unless [dx.abs,dy.abs].max==radius
                next unless x>=2 && y>=2
                next unless x<width-2 && y<height-2
                next if occupied.include?([x,y])

                spawn=[x,y]
                break
              end
            end
          end

          raise "No free Tower 2F event coordinate" unless spawn

          put(boss,:id,NEW_EVENT_ID)
          put(boss,:name,"데스나이트 (오만 2층 복제)")
          put(boss,:x,spawn[0])
          put(boss,:y,spawn[1])

          events[NEW_EVENT_ID]=boss

          # Verify original map events have not changed.
          original_events.each do |id,raw|
            raise "Original Tower event changed #{id}" unless
              Marshal.dump(events[id])==raw
          end

          # Verify original common events remain unchanged.
          original_common.each_with_index do |raw,id|
            current=common[id]
            actual=current.nil? ? nil : Marshal.dump(current)

            raise "Original CE modified #{id}" unless
              actual==raw
          end

          raise "Original Death Knight map changed" unless
            File.binread(MAP16)==original_map16_bytes

          raise "Original game script changed" unless
            File.binread(SCRIPTS)==original_scripts_bytes

          raise "Event pages lost" unless
            iv(boss,:pages).length==5

          raise "Private HP connection missing" unless
            iv(clone_death,:variable_id)==NEW_HP &&
            iv(clone_death,:variable_value)==4000

          cloned_cycle=common.fetch(ce_map[179])
          cloned_attack=common.fetch(ce_map[901])

          raise "Private attack switch incorrect" unless
            iv(cloned_cycle,:switch_id)==NEW_ATTACK_SW

          raise "Attack CE reference incorrect" unless
            (iv(cloned_cycle,:list)||[]).any?{
              |cmd|iv(cmd,:code)==117 &&
              iv(cmd,:parameters)==[ce_map[901]]
            }

          raise "Original damage logic missing" unless
            (iv(cloned_attack,:list)||[]).count{
              |cmd|iv(cmd,:code)==311
            }>=2

          # Check that CE57 is independently linked.
          raise "Dedicated CE57 not called" unless
            (iv(cloned_attack,:list)||[]).any?{
              |cmd|iv(cmd,:code)==117 &&
              iv(cmd,:parameters)==[ce_map[57]]
            }

          File.binwrite(MAP25,Marshal.dump(map25))
          File.binwrite(COMMON,Marshal.dump(common))

          File.write(
            "build/graphics.json",
            JSON.pretty_generate(graphics.values),
            encoding:"UTF-8"
          )

          File.write(
            "build/report.json",
            JSON.pretty_generate({
              version:"V276",
              rollback_source:"V241",
              source_map:OLD_MAP_ID,
              source_event:OLD_EVENT_ID,
              cloned_map:NEW_MAP_ID,
              cloned_event:NEW_EVENT_ID,
              position:spawn,
              event_pages:pages.length,
              source_hp:OLD_HP,
              cloned_hp:NEW_HP,
              source_attack_switch:OLD_ATTACK_SW,
              cloned_attack_switch:NEW_ATTACK_SW,
              cloned_magic_switch:NEW_MAGIC_SW,
              common_event_ids:ce_map,
              cloned_graphics:graphics.values
            }),
            encoding:"UTF-8"
          )

          puts "PASS clean V241 native scripts untouched"
          puts "PASS native Death Knight five-page clone"
          puts "PASS independent HP, attack and magic switches"
          puts "PASS private CE57, CE179, CE901"
          puts "PASS game-wide shared common events untouched"
          puts "PASS original Death Knight and all Tower monsters unchanged"
          puts "PASS original graphics retained with separate clone copies"
          RUBY

          ruby -c build/clone.rb
          ruby build/clone.rb

      - name: V276 Register independent sprites and data hashes
        shell: bash
        run: |
          set -euo pipefail

          cat > build/mapping.py <<'PY'
          from pathlib import Path
          import hashlib,json,re

          root=Path("site")
          game=root/"knight/gameasync"
          mapping=game/"mapping.js"

          text=mapping.read_text("utf-8")
          graphics=json.loads(
              Path("build/graphics.json").read_text("utf-8")
          )

          anchor="];\n\nvar mapping = {}"
          assert text.count(anchor)==1

          entries=[]

          for item in graphics:
              name=item["new"]
              path=Path(item["path"])
              assert path.is_file(),name

              digest=hashlib.md5(path.read_bytes()).hexdigest()
              entries.append(
                  f'["graphics/characters/{name.lower()}", '
                  f'"Graphics/Characters/{name}.png?h={digest}"],'
              )

          text=text.replace(
              anchor,
              "\n"+"\n".join(entries)+"\n"+anchor
          )

          pre="MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"

          for path in (
              game/"Data"/(pre+"Map025.rxdata"),
              game/"Data"/(pre+"CommonEvents.rxdata")
          ):
              key="Data/"+path.name
              digest=hashlib.md5(path.read_bytes()).hexdigest()

              pattern="("+re.escape(key)+r"\?h=)[0-9a-f]{32}"

              text,count=re.subn(
                  pattern,
                  lambda m:m.group(1)+digest,
                  text
              )
              assert count==1,(key,count)

          mapping.write_text(text,encoding="utf-8")

          # Original game scripts have NOT changed.
          # Do not alter their resource hash.
          loader=root/"knight/js/sl-assets-v229r115.js"
          source=loader.read_text("utf-8")

          assert source.count("var version='V241';")==1

          loader.write_text(
              source.replace(
                  "var version='V241';",
                  "var version='V276';"
              ),
              encoding="utf-8"
          )

          for name in ("index.html","knight/index.html"):
              path=root/name
              html=path.read_text("utf-8")
              assert "V241" in html,name

              html=html.replace("V241","V276")
              html=html.replace("v241","v276")

              path.write_text(html,encoding="utf-8")

          print("PASS new sprite references")
          print("PASS private event and CE hashes")
          print("PASS native script hash unchanged")
          PY

          python3 build/mapping.py

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/dpad.js

      - name: V276 Verify rollback and original data preservation
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json

          root=Path("site")
          before=json.loads(
              Path("build/before.json").read_text("utf-8")
          )

          after={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob("*") if p.is_file()
          }

          pre="knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"

          allowed_changes={
              pre+"Map025.rxdata",
              pre+"CommonEvents.rxdata",
              "knight/gameasync/mapping.js",
              "knight/js/sl-assets-v229r115.js",
              "index.html",
              "knight/index.html"
          }

          changed={
              name for name in before
              if before[name]!=after.get(name)
          }

          assert changed==allowed_changes,(
              "Unexpected modified files",
              sorted(changed^allowed_changes)
          )

          graphics=json.loads(
              Path("build/graphics.json").read_text("utf-8")
          )

          added={
              "knight/gameasync/Graphics/Characters/"
              +item["new"]+".png"
              for item in graphics
          }

          assert (set(after)-set(before))==added
          assert (set(before)-set(after))==set()
          assert len(after)==5603+len(added)

          # Exact original engine; no Zenith runtime survives.
          assert (
              before["knight/gameasync/Data/Scripts.rxdata"]==
              after["knight/gameasync/Data/Scripts.rxdata"]
          )

          # Every original sprite and effect must remain identical.
          for name in before:
              if name.startswith("knight/gameasync/Graphics/"):
                  assert before[name]==after[name],name

          # Every new sprite must match its original bytes.
          for item in graphics:
              old=(
                  "knight/gameasync/Graphics/Characters/"
                  +item["old"]+".png"
              )
              new=(
                  "knight/gameasync/Graphics/Characters/"
                  +item["new"]+".png"
              )

              assert before[old]==after[new]

          protected=[
              pre+"Map016.rxdata",
              "knight/gameasync/Data/Scripts.rxdata",
              "knight/js/drive.js",
              "knight/js/dpad.js"
          ]

          for name in protected:
              assert before[name]==after[name],name

          for name in before:
              if name.startswith(pre+"Map") and name!=pre+"Map025.rxdata":
                  assert before[name]==after[name],name

          report=json.loads(
              Path("build/report.json").read_text("utf-8")
          )

          ce=report["common_event_ids"]

          for old_id in ("57","179","901"):
              assert old_id in ce
              assert ce[old_id]!=int(old_id)

          assert report["event_pages"]==5
          assert report["source_hp"]==1980
          assert report["cloned_hp"]==4988
          assert report["cloned_attack_switch"]==5991
          assert report["cloned_magic_switch"]==5992

          print("PASS original 5603 V241 files preserved")
          print("PASS only new Tower 2F event and dedicated common events")
          print("PASS native game Scripts.rxdata byte-identical")
          print("PASS original Death Knight map byte-identical")
          print("PASS all other maps and monsters byte-identical")
          print("PASS cloned character graphics independently addressable")
          print("PASS no V242-V275 Zenith modifications inherited")
          PY

      - name: V276 Publish native Death Knight clone
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

