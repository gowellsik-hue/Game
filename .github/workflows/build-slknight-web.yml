name: build-slknight-web.yml | V4.15 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Restore V4.14 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 46015932760
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify original game
        shell: bash
        run: |
          set -euo pipefail

          test -s baseline/artifact.tar

          mkdir -p site
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          import json

          root=Path('site')

          before={
              p.relative_to(root).as_posix():
                  hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          assert len(before)==6085

          assert before[
              'knight/gameasync/Data/Scripts.rxdata'
          ]=='e651e2d63092dd3eebf1a185f2482cf80eb478008dc0b540735972e97bfaa8b9'

          assert before[
              'knight/assets/shared-v229r115.pack'
          ].startswith('848a3d863d953bdc')

          assert before[
              'knight/gameasync/bitmap-map.js'
          ].startswith('30b5b4a619a81d4c')

          skin=root/'knight/gameasync/Graphics/Windowskins/스킨.png'

          assert skin.stat().st_size==9929

          assert hashlib.md5(
              skin.read_bytes()
          ).hexdigest()=='b944521800f1066434045a21ae8ff72d'

          Path('/tmp/sl415-before.json').write_text(
              json.dumps(before),
              'utf8'
          )

          print('PASS exact V4.14 baseline')
          print('PASS original windowskin')
          PYTHON

      - name: Apply inventory windowskin
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl415-inventory.rb <<'RUBY'
          # encoding: UTF-8
          require 'zlib'
          require 'digest'

          path=ARGV.fetch(0)

          raw=File.binread(path)

          raise 'V4.14 baseline' unless
            Digest::SHA256.hexdigest(raw)==
            'e651e2d63092dd3eebf1a185f2482cf80eb478008dc0b540735972e97bfaa8b9'

          rows=Marshal.load(raw)

          raise 'Script count' unless rows.size==137

          before=rows.map{|r|Marshal.dump(r)}

          [80,81].each do |i|

            src=Zlib::Inflate.inflate(
              rows[i][2]
            ).force_encoding('UTF-8')

            s=src.gsub("\r\n","\n")

            if i==80

              a="    @item_window = Window_Item.new\n"

              b=a+
                "    @help_window.windowskin = RPG::Cache.windowskin(\"SLInventory\")\n"+
                "    @item_window.windowskin = RPG::Cache.windowskin(\"SLInventory\")\n"

            else

              a="    @item_window.x = 620\n"

              b=a+
                "    @item_window.width = 180\n"+
                "    @item_window.windowskin = RPG::Cache.windowskin(\"SLInventory\")\n"+
                "    @item_window.opacity = 255\n"+
                "    @item_window.back_opacity = 200\n"+
                "    $아이템창.opacity = 0\n"

            end

            raise "Anchor #{i}" unless
              s.scan(a).size==1

            t=s.sub(a){b}

            raise 'Non-target edits' unless
              t.sub(b){a}==s

            RubyVM::InstructionSequence.compile(t)

            t=t.gsub("\n","\r\n") if
              src.include?("\r\n")

            rows[i][2]=Zlib::Deflate.deflate(t.b)

          end

          raise 'Script scope' unless
            rows.each_index.select{
              |i|Marshal.dump(rows[i])!=before[i]
            }==[80,81]

          File.binwrite(
            path,
            Marshal.dump(rows)
          )

          raise 'Round trip' unless
            Marshal.load(
              File.binread(path)
            )==rows

          puts 'PASS Scene_Item'
          puts 'PASS Scene_Item2'
          puts 'PASS original inventory functions preserved'
          puts 'PASS 135 other scripts unchanged'
          puts "MD5 #{Digest::MD5.file(path).hexdigest}"
          RUBY

          ruby -c /tmp/sl415-inventory.rb

          ruby /tmp/sl415-inventory.rb \
            site/knight/gameasync/Data/Scripts.rxdata

      - name: Create inventory skin from original
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv \
            --system-site-packages /tmp/sl415-venv

          /tmp/sl415-venv/bin/python -c "import PIL" || \
            /tmp/sl415-venv/bin/python -m pip install \
              --quiet --disable-pip-version-check \
              'Pillow>=11,<13'

          /tmp/sl415-venv/bin/python - <<'PYTHON'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          import hashlib
          import json
          import struct
          import base64
          import io

          root=Path('site')
          game=root/'knight/gameasync'

          original_rel='Graphics/Windowskins/스킨.png'
          original_key='graphics/windowskins/스킨'

          new_rel='Graphics/Windowskins/SLInventory.png'
          new_key='graphics/windowskins/slinventory'

          original=game/original_rel
          target=game/new_rel

          assert not target.exists()

          raw=original.read_bytes()

          assert len(raw)==9929

          assert hashlib.md5(
              raw
          ).hexdigest()=='b944521800f1066434045a21ae8ff72d'

          old=Image.open(
              io.BytesIO(raw)
          ).convert('RGBA')

          assert old.size==(192,128)

          skin=old.copy()

          tile=old.crop((32,32,96,96))

          assert tile.size==(64,64)

          skin.paste(tile,(0,0))

          skin.paste(
              ImageOps.mirror(tile),
              (64,0)
          )

          skin.paste(
              ImageOps.flip(tile),
              (0,64)
          )

          skin.paste(
              ImageOps.flip(
                  ImageOps.mirror(tile)
              ),
              (64,64)
          )

          skin.paste(
              (0,0,0,0),
              (128,0,192,64)
          )

          skin.paste(
              old.crop((144,16,176,48)),
              (144,16)
          )

          draw=ImageDraw.Draw(skin)

          draw.rectangle(
              (128,0,191,63),
              outline=(153,142,121,255)
          )

          draw.rectangle(
              (129,1,190,62),
              outline=(53,48,42,255)
          )

          assert (
              skin.crop((128,64,192,128)).tobytes()
              ==
              old.crop((128,64,192,128)).tobytes()
          )

          assert (
              skin.crop((144,16,176,48)).tobytes()
              ==
              old.crop((144,16,176,48)).tobytes()
          )

          assert skin.size==(192,128)

          buffer=io.BytesIO()

          skin.save(
              buffer,
              format='PNG'
          )

          new_bytes=buffer.getvalue()

          target.write_bytes(new_bytes)

          new_digest=hashlib.md5(
              new_bytes
          ).hexdigest()

          assert original.read_bytes()==raw

          print('PASS original skin unchanged')
          print('PASS original cursor preserved')
          print('PASS original central frame indicators preserved')
          print('PASS inventory-only two-pixel frame')
          print('PASS native 192x128 windowskin dimensions')

          packs=sorted(
              (root/'knight/assets').glob('*.pack')
          )

          assert len(packs)==50

          matches=[]

          for p in packs:

              with p.open('rb') as f:

                  hlen=struct.unpack(
                      '<I',f.read(4)
                  )[0]

                  info=json.loads(
                      f.read(hlen).decode('utf8')
                  )

              for row in info['files']:

                  assert row[0]!=new_key

                  if row[0]==original_key:
                      matches.append(p)

          pack=root/'knight/assets/shared-v229r115.pack'

          assert matches==[pack]

          old_pack=pack.read_bytes()

          assert hashlib.sha256(
              old_pack
          ).hexdigest().startswith(
              '848a3d863d953bdc'
          )

          hlen=struct.unpack_from(
              '<I',old_pack,0
          )[0]

          header=json.loads(
              old_pack[4:4+hlen].decode('utf8')
          )

          payload=old_pack[4+hlen:]

          assert header['kind']=='shared'

          old_rows=header['files']

          assert len(old_rows)==2292

          assert len({
              row[0] for row in old_rows
          })==2292

          offset=0

          for key,start,length in old_rows:

              assert start==offset
              assert length>0

              offset+=length

          assert offset==len(payload)

          original_rows=[
              row for row in old_rows
              if row[0]==original_key
          ]

          assert len(original_rows)==1

          _,start,length=original_rows[0]

          assert payload[start:start+length]==raw

          header['files']=old_rows+[
              [
                  new_key,
                  len(payload),
                  len(new_bytes)
              ]
          ]

          new_payload=payload+new_bytes

          new_header=json.dumps(
              header,
              ensure_ascii=False,
              separators=(',',':')
          ).encode('utf8')

          pack.write_bytes(
              struct.pack('<I',len(new_header))+
              new_header+
              new_payload
          )

          check_pack=pack.read_bytes()

          check_hlen=struct.unpack_from(
              '<I',check_pack,0
          )[0]

          check_header=json.loads(
              check_pack[
                  4:4+check_hlen
              ].decode('utf8')
          )

          check_payload=check_pack[
              4+check_hlen:
          ]

          assert len(
              check_header['files']
          )==2293

          assert (
              check_header['files'][:-1]
              ==old_rows
          )

          assert (
              check_payload[:len(payload)]
              ==payload
          )

          assert (
              check_payload[len(payload):]
              ==new_bytes
          )

          pack_digest=hashlib.sha256(
              check_pack
          ).hexdigest()[:16]

          print('PASS all 50 packs checked')
          print('PASS all 2292 original packed resources unchanged')
          print('PASS inventory skin appended')

          mapper=game/'mapping.js'

          old_mapping_digest=hashlib.sha256(
              mapper.read_bytes()
          ).hexdigest()[:16]

          s=mapper.read_text('utf8')

          assert new_key not in s

          old_script_digest='07e7a62cb188150271de853d2d38facf'

          script_digest=hashlib.md5(
              (game/'Data/Scripts.rxdata').read_bytes()
          ).hexdigest()

          assert script_digest!=old_script_digest

          old_marker=(
              'Data/Scripts.rxdata?h='+
              old_script_digest
          )

          new_marker=(
              'Data/Scripts.rxdata?h='+
              script_digest
          )

          assert s.count(old_marker)==1

          s=s.replace(
              old_marker,
              new_marker
          )

          entry=json.dumps(
              [
                  new_key,
                  new_rel+'?h='+new_digest
              ],
              ensure_ascii=False
          )

          anchor='];\n\nvar mapping = {};'

          assert s.count(anchor)==1

          s=s.replace(
              anchor,
              entry+',\n'+anchor
          )

          assert s.count(new_key)==1

          mapper.write_text(
              s,
              'utf8'
          )

          mapping_digest=hashlib.sha256(
              mapper.read_bytes()
          ).hexdigest()[:16]

          bitmap_map=game/'bitmap-map.js'

          old_bitmap_digest=hashlib.sha256(
              bitmap_map.read_bytes()
          ).hexdigest()[:16]

          assert old_bitmap_digest=='30b5b4a619a81d4c'

          s=bitmap_map.read_text('utf8')

          assert new_key not in s

          encoded=base64.b64encode(
              new_bytes
          ).decode('ascii')

          entry=json.dumps(
              new_key,
              ensure_ascii=False
          )+': '+json.dumps(
              [
                  192,
                  128,
                  'data:image/png;base64,'+encoded
              ],
              ensure_ascii=False
          )+','

          anchor='\n};'

          assert s.count(anchor)==1

          s=s.replace(
              anchor,
              '\n'+entry+anchor
          )

          assert s.count(new_key)==1

          bitmap_map.write_text(
              s,
              'utf8'
          )

          bitmap_digest=hashlib.sha256(
              bitmap_map.read_bytes()
          ).hexdigest()[:16]

          print('PASS native inventory skin mapping')
          print('PASS full-resolution inventory skin preview')
          print('PASS no low-resolution frame stretching')

          loader=root/'knight/js/sl-assets-v229r115.js'

          old_loader_digest=hashlib.sha256(
              loader.read_bytes()
          ).hexdigest()[:16]

          s=loader.read_text('utf8')

          old_pack_url=(
              'shared-v229r115.pack?v=V4.14&h='
              '848a3d863d953bdc'
          )

          new_pack_url=(
              'shared-v229r115.pack?v=V4.15&h='
              +pack_digest
          )

          assert s.count(old_pack_url)==1

          s=s.replace(
              old_pack_url,
              new_pack_url
          )

          assert s.count(
              "var version='V4.14';"
          )==1

          s=s.replace(
              "var version='V4.14';",
              "var version='V4.15';"
          )

          loader.write_text(
              s,
              'utf8'
          )

          loader_digest=hashlib.sha256(
              loader.read_bytes()
          ).hexdigest()[:16]

          page=root/'knight/index.html'

          s=page.read_text('utf8')

          references=[
              (
                  'gameasync/mapping.js?v=v4.14&h='+
                  old_mapping_digest,
                  'gameasync/mapping.js?v=v4.15&h='+
                  mapping_digest,
                  1
              ),
              (
                  'gameasync/bitmap-map.js?v=v4.14&h='+
                  old_bitmap_digest,
                  'gameasync/bitmap-map.js?v=v4.15&h='+
                  bitmap_digest,
                  2
              ),
              (
                  'js/sl-assets-v229r115.js?v=v4.14&h='+
                  old_loader_digest,
                  'js/sl-assets-v229r115.js?v=v4.15&h='+
                  loader_digest,
                  1
              )
          ]

          for old_ref,new_ref,count in references:

              assert s.count(old_ref)==count,(
                  old_ref,
                  s.count(old_ref)
              )

              s=s.replace(
                  old_ref,
                  new_ref
              )

              assert s.count(new_ref)==count

          assert 'V4.14' in s

          page.write_text(
              s.replace('V4.14','V4.15'),
              'utf8'
          )

          index_page=root/'index.html'

          s=index_page.read_text('utf8')

          assert 'V4.14' in s

          index_page.write_text(
              s.replace(
                  'V4.14','V4.15'
              ).replace(
                  'v4.14','v4.15'
              ),
              'utf8'
          )

          assert original.read_bytes()==raw

          print('PASS script cache',script_digest)
          print('PASS inventory skin cache',new_digest)
          print('PASS shared pack cache',pack_digest)
          print('PASS mapping cache',mapping_digest)
          print('PASS bitmap cache',bitmap_digest)
          PYTHON

      - name: Verify inventory-only modification
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          import json

          root=Path('site')

          before=json.loads(
              Path('/tmp/sl415-before.json').read_text('utf8')
          )

          after={
              p.relative_to(root).as_posix():
                  hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          added=set(after)-set(before)
          removed=set(before)-set(after)

          assert added=={
              'knight/gameasync/Graphics/Windowskins/SLInventory.png'
          }

          assert not removed

          assert len(after)==6086

          changed={
              k for k in before
              if before[k]!=after[k]
          }

          expected={
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/mapping.js',
              'knight/gameasync/bitmap-map.js',
              'knight/assets/shared-v229r115.pack',
              'knight/js/sl-assets-v229r115.js',
              'knight/index.html',
              'index.html'
          }

          assert changed==expected,changed^expected

          assert all(
              before[k]==after[k]
              for k in before
              if k not in expected
          )

          original_skin=(
              'knight/gameasync/Graphics/Windowskins/스킨.png'
          )

          original_inventory=(
              'knight/gameasync/Graphics/Pictures/아이템창.png'
          )

          assert (
              before[original_skin]
              ==after[original_skin]
          )

          assert (
              before[original_inventory]
              ==after[original_inventory]
          )

          print('PASS one dedicated inventory skin added')
          print('PASS seven original files modified')
          print('PASS 6078 original files unchanged')
          print('PASS common windowskin unchanged')
          print('PASS original inventory picture unchanged')
          print('PASS original equipment windows unchanged')
          print('PASS original combat and maps unchanged')
          print('PASS original engine unchanged')
          PYTHON

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/gameasync/bitmap-map.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: Upload V4.15
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
