          abort 'multislot dispose missing' unless multi.include?('g7_ms_scene_equip_dispose')
          abort 'driver trace missing' unless main.include?('SLDBG|DR01')&&main.include?('SLDBG|DR05')
          abort 'equip trace missing' unless equip.include?('SLDBG|EQ01')&&equip.include?('SLDBG|EQ13')
          abort 'multislot trace missing' unless multi.include?('SLDBG|MS10')&&multi.include?('SLDBG|MS23')
          menu=a.find{|e|e.is_a?(Array)&&e.length>=3&&((Zlib::Inflate.inflate(e[2]).include?('XRXS_MP7_Module')) rescue false)}
          abort 'equip xrxs wrapper missing' unless menu
