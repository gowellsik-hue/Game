      - name: Update V4.17 data references
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          import json
          import re

          root = Path('site')

          game = root/'knight/gameasync'

          old_md5 = json.loads(
              Path('/tmp/sl417-md5.json').read_text('utf8')
          )

          mapper = game/'mapping.js'

          old_mapping_digest = hashlib.sha256(
              mapper.read_bytes()
          ).hexdigest()[:16]

          s = mapper.read_bytes()

          for name, previous in old_md5.items():

              marker = ('Data/'+name+'?h=').encode('ascii')

              pattern = (
                  re.escape(marker)
                  + rb'[0-9a-f]{32}'
              )

              expected = marker+previous.encode('ascii')

              assert re.findall(
                  pattern,s
              ) == [expected], name

              digest = hashlib.md5(
                  (game/'Data'/name).read_bytes()
              ).hexdigest()

              assert digest != previous, name

              updated = marker+digest.encode('ascii')

              s = re.sub(
                  pattern,
                  lambda _: updated,
                  s
              )

              assert s.count(updated) == 1, name

              print(
                  'PASS updated data reference',
                  name,
                  digest
              )

          mapper.write_bytes(s)

          mapping_digest = hashlib.sha256(
              mapper.read_bytes()
          ).hexdigest()[:16]

          bitmap_digest = hashlib.sha256(
              (game/'bitmap-map.js').read_bytes()
          ).hexdigest()[:16]

          loader = root/'knight/js/sl-assets-v229r115.js'

          old_loader_digest = hashlib.sha256(
              loader.read_bytes()
          ).hexdigest()[:16]

          s = loader.read_bytes()

          old = b"var version='V4.16';"
          new = b"var version='V4.17';"

          assert s.count(old) == 1

          loader.write_bytes(
              s.replace(old,new)
          )

          loader_digest = hashlib.sha256(
              loader.read_bytes()
          ).hexdigest()[:16]

          page = root/'knight/index.html'

          s = page.read_text('utf8')

          references = [
              (
                  'gameasync/mapping.js?v=v4.16&h='
                  + old_mapping_digest,
                  'gameasync/mapping.js?v=v4.17&h='
                  + mapping_digest,
                  1
              ),
              (
                  'gameasync/bitmap-map.js?v=v4.16&h='
                  + bitmap_digest,
                  'gameasync/bitmap-map.js?v=v4.17&h='
                  + bitmap_digest,
                  2
              ),
              (
                  'js/sl-assets-v229r115.js?v=v4.16&h='
                  + old_loader_digest,
                  'js/sl-assets-v229r115.js?v=v4.17&h='
                  + loader_digest,
                  1
              )
          ]

          for old,new,count in references:

              assert s.count(old) == count, old

              s = s.replace(old,new)

              assert s.count(new) == count, new

          assert 'V4.16' in s

          s = s.replace(
              'V4.16','V4.17'
          ).replace(
              'v4.16','v4.17'
          )

          page.write_text(s,'utf8')

          index_page = root/'index.html'

          s = index_page.read_text('utf8')

          assert 'V4.16' in s

          index_page.write_text(
              s.replace(
                  'V4.16','V4.17'
              ).replace(
                  'v4.16','v4.17'
              ),
              'utf8'
          )

          print('PASS updated mapping reference')
          print('PASS updated version references')
          PYTHON

      - name: Verify exact modification scope
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          import json

          root = Path('site')

          pre = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          before = json.loads(
              Path('/tmp/sl417-before.json').read_text('utf8')
          )

          after = {
              p.relative_to(root).as_posix():
                  hashlib.sha256(
                      p.read_bytes()
                  ).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          assert len(after) == 6086, len(after)

          assert set(before) == set(after)

          changed = {
              k for k in before
              if before[k] != after[k]
          }

          expected = {
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/Data/'+pre+'Map007.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'knight/index.html',
              'index.html'
          }

          assert changed == expected, sorted(changed ^ expected)

          assert all(
              before[k] == after[k]
              for k in before
              if k not in expected
          )

          protected = [
              'knight/gameasync/Data/'+pre+'System.rxdata',
              'knight/gameasync/Data/'+pre+'Map029.rxdata',
              'knight/gameasync/Data/'+pre+'Map047.rxdata',
              'knight/gameasync/Data/'+pre+'Actors.rxdata',
              'knight/gameasync/Data/'+pre+'Classes.rxdata',
              'knight/gameasync/Data/'+pre+'CommonEvents.rxdata',
              'knight/gameasync/bitmap-map.js',
              'knight/js/drive.js',
              'knight/js/dpad.js',
              'knight/mkxp.js',
              'knight/mkxp.wasm'
          ]

          for name in protected:

              assert name in before, name

              assert before[name] == after[name], name

          print('PASS six approved files modified')
          print('PASS 6080 original files unchanged')
          print('PASS original character data unchanged')
          print('PASS original class data unchanged')
          print('PASS original companion NPC unchanged')
          print('PASS original Talking Island map unchanged')
          print('PASS original common events unchanged')
          print('PASS original save implementation unchanged')
          print('PASS original resource packs unchanged')
          print('PASS original engine unchanged')
          print('PASS V4.17')
          PYTHON

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/gameasync/bitmap-map.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

