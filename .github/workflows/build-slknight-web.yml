
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V254
# BASE: V253 successful build run 41388878119
# FIX: Remove 17 duplicate boss attack registrations.
# FIX: Limit native attack activation to one cycle.
# FIX: Preserve boss HP and targeting commands.
# KEEP: All maps, NPCs, drops, graphics and FX.
# DISPLAY: Keep both version labels removed.
# STATUS: Build and mobile verification pending.

name: build-slknight-web.yml | V254 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: V254 Restore V253 published game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41388878119
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V254 Verify original inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s baseline/artifact.tar
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root=Path('site')
          before={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          assert len(before)==5610,(
              'Unexpected inventory',len(before)
          )

          pre=(
              'knight/gameasync/Data/'
              'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          )

          for mid in (16,25,47):
              assert pre+f'Map{mid:03d}.rxdata' in before

          for mid in (45,46):
              assert pre+f'Map{mid:03d}.rxdata' not in before

          assert 'knight/assets/map-047-v241.pack' in before
          assert 'knight/gameasync/Data/Scripts.rxdata' in before

          Path('build/before.json').write_text(
              json.dumps(before,sort_keys=True)
          )

          print('PASS V253 original 5610 files')
          PY

      - name: V254 Repair native boss combat
        shell: bash
        run: |
          set -euo pipefail

          cat > build/combat-runtime.rb <<'RUNTIME'
          # V254 bounded Zenith combat.
          # Only Map025 Event29 is affected.

          module SLZenith
            def self.v254_combat_tick(ev)
              return unless ev
              return unless $game_map && $game_player
              return unless $game_map.map_id==MAP_ID
              return unless $game_switches && $game_variables
              return if @paid
              return if ev.instance_variable_get(:@erased)
              return if $game_variables[HP_VAR].to_i>=MAX_HP

              return unless ev.respond_to?(:x) &&
                ev.respond_to?(:y) &&
                $game_player.respond_to?(:x) &&
                $game_player.respond_to?(:y)

              dx=($game_player.x-ev.x).abs
              dy=($game_player.y-ev.y).abs

              if dx>3 || dy>3
                ev.instance_variable_set(:@slz_v254_tick,0)
                return
              end

              # CE1062 controls the native attack switch.
              # An active cycle must never be re-entered.
              return if $game_switches[ATTACK_SWITCH]

              ticks=ev.instance_variable_get(
                :@slz_v254_tick
              ).to_i+1

              ev.instance_variable_set(
                :@slz_v254_tick,ticks
              )

              return if ticks<ATTACK_WAIT

              ev.instance_variable_set(
                :@slz_v254_tick,0
              )

              # Register one context per attack pulse.
              # Do not register on every update.
              if defined?(SLMonsterAttackContext) &&
                 SLMonsterAttackContext.respond_to?(:register)

                SLMonsterAttackContext.register(
                  ATTACK_SWITCH,MAP_ID,EVENT_ID
                )
              end

              engage
              $game_switches[ATTACK_SWITCH]=true

              if $game_map.respond_to?(:need_refresh=)
                $game_map.need_refresh=true
              end
            end
          end

          class Game_Event
            alias slz_v254_native_update update

            def update
              if @map_id==SLZenith::MAP_ID &&
                 @id==SLZenith::EVENT_ID
                @monster=true
              end

              slz_v254_native_update

              return unless
                @map_id==SLZenith::MAP_ID &&
                @id==SLZenith::EVENT_ID

              SLZenith.v254_combat_tick(self)
            end
          end
          RUNTIME

          cat > build/fix.rb <<'RUBY'
          require 'zlib'

          module RPG
            class Map;end
            class MapInfo;end
            class AudioFile;end
            class CommonEvent;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end

          class Table
            def self._load(raw)
              o=allocate
              o.instance_variable_set(:@raw,raw)
              o
            end

            def _dump(level=0)
              @raw
            end
          end

          class Tone
            def self._load(raw)
              o=allocate
              o.instance_variable_set(:@raw,raw)
              o
            end

            def _dump(level=0)
              @raw
            end
          end

          class Color<Tone;end

          def iv(o,k)
            o.instance_variable_get('@'+k.to_s)
          end

          def put(o,k,v)
            o.instance_variable_set('@'+k.to_s,v)
          end

          root='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          map_path=root+pre+'Map025.rxdata'
          common_path=root+pre+'CommonEvents.rxdata'
          scripts_path=root+'Scripts.rxdata'

          map=Marshal.load(File.binread(map_path))
          common=Marshal.load(File.binread(common_path))
          scripts=Marshal.load(File.binread(scripts_path))

          events=iv(map,:events)
          boss=events.fetch(29)

          name=iv(boss,:name).to_s.dup
            .force_encoding('UTF-8').scrub

          raise 'Wrong Zenith Queen event' unless
            name.include?('제니스 퀸')

          pages=iv(boss,:pages)
          raise 'Wrong boss pages' unless
            pages.length==2

          originals=events.each_with_object({}) do |(id,ev),h|
            h[id]=Marshal.dump(ev) unless id==29
          end

          active=iv(pages[0],:list)

          # V253 contains 17 redundant context registrations.
          # CE1062 still provides native physical/magic damage.
          # Preserve all native HP, hit and movement commands.
          suppressed=0

          active.each do |command|
            code=iv(command,:code)
            next unless code==355 || code==655

            p=iv(command,:parameters)

            next unless p.is_a?(Array)
            next unless p[0].is_a?(String)
            next unless p[0].include?(
              'SLMonsterAttackContext.register'
            )

            put(command,:parameters,['nil'])
            suppressed+=1
          end

          raise(
            "Unexpected registration count: "+
            suppressed.to_s
          ) unless suppressed==17

          attack_switches=active.count do |c|
            iv(c,:code)==121 &&
              iv(c,:parameters)==[7002,7002,0]
          end

          hp_writes=active.count do |c|
            p=iv(c,:parameters)
            iv(c,:code)==122 &&
              p.is_a?(Array) &&
              p[0]==7001
          end

          raise 'Native attack graph changed' unless
            attack_switches==17

          raise 'Native HP graph changed' unless
            hp_writes==20

          condition=iv(pages[1],:condition)

          raise 'Boss death condition changed' unless
            iv(condition,:variable_id)==7001 &&
            iv(condition,:variable_value)==5200

          originals.each do |id,raw|
            raise "Unrelated event modified: #{id}" unless
              Marshal.dump(events[id])==raw
          end

          cycle=common.fetch(1062)
          damage=common.fetch(1061)

          raise 'Native attack cycle missing' unless
            iv(cycle,:trigger)==2 &&
            iv(cycle,:switch_id)==7002

          raise 'Native damage missing' unless
            iv(damage,:list).count{
              |c| iv(c,:code)==311
            }>=2

          File.binwrite(map_path,Marshal.dump(map))

          indices=scripts.each_index.select do |i|
            scripts[i].is_a?(Array) &&
              scripts[i][1]=='SLZenithV253'
          end

          raise 'Original runtime not unique' unless
            indices.length==1

          index=indices.first
          entry=scripts[index]

          old=Zlib::Inflate.inflate(entry[2]).b
          marker="\n# V253 native Zenith combat activation.".b

          raise 'V253 extension missing' unless
            old.scan(marker).length==1

          # Remove the V253 extra update wrapper.
          # Keep the original V252/V247 runtime.
          base=old.split(marker,2).first

          required=[
            'MAX_HP=5200',
            'PHYSICAL=[50,100]',
            'MAGIC=[150,300]',
            'ATTACK_WAIT=20',
            'EXP=43212',
            'ADENA=[64800,151200]'
          ]

          required.each do |value|
            raise "Approved stat missing: #{value}" unless
              base.include?(value)
          end

          patch=File.binread('build/combat-runtime.rb')
          runtime=base.b+"\n"+patch.b

          entry[0]=99825401
          entry[1]='SLZenithV254'
          entry[2]=Zlib::Deflate.deflate(runtime,9)

          File.binwrite(scripts_path,Marshal.dump(scripts))

          check=Marshal.load(File.binread(scripts_path))

          verified=Zlib::Inflate.inflate(
            check[index][2]
          )

          raise 'Runtime serialization failed' unless
            check[index][1]=='SLZenithV254' &&
            verified.b==runtime.b

          puts 'PASS duplicate attack registrations disabled'
          puts 'PASS native 17 switches and 20 HP writes'
          puts 'PASS original CE1061/CE1062 preserved'
          puts 'PASS original combat stats retained'
          puts 'PASS Map025 EV29 only modified'
          RUBY

          ruby -c build/combat-runtime.rb
          ruby -c build/fix.rb
          ruby build/fix.rb

      - name: V254 Test bounded attack activation
        shell: bash
        run: |
          set -euo pipefail

          cat > build/test.rb <<'RUBY'
          class Game_Event
            attr_accessor :x,:y
            def update;end
          end

          class Game_Map
            attr_accessor :map_id,:need_refresh
          end

          class Game_Player
            attr_accessor :x,:y
          end

          module SLMonsterAttackContext
            def self.register(*args)
              @last=args
              @count=(@count||0)+1
            end

            def self.last
              @last
            end

            def self.count
              @count||0
            end
          end

          module SLZenith
            MAP_ID=25
            EVENT_ID=29
            HP_VAR=7001
            ATTACK_SWITCH=7002
            MAX_HP=5200
            ATTACK_WAIT=20

            def self.engage
              @engaged=true
            end
          end

          load 'build/combat-runtime.rb'

          $game_map=Game_Map.new
          $game_map.map_id=25
          $game_map.need_refresh=false

          $game_player=Game_Player.new
          $game_variables=Hash.new(0)
          $game_switches=Hash.new(false)

          boss=Game_Event.new
          boss.instance_variable_set(:@map_id,25)
          boss.instance_variable_set(:@id,29)
          boss.x=100
          boss.y=100

          $game_player.x=120
          $game_player.y=120

          80.times{boss.update}

          raise 'Distant attack activated' if
            $game_switches[7002]

          $game_player.x=101
          $game_player.y=100

          19.times{boss.update}

          raise 'Attack fired too early' if
            $game_switches[7002]

          boss.update

          raise 'Attack switch missing' unless
            $game_switches[7002]

          raise 'Native refresh missing' unless
            $game_map.need_refresh

          raise 'Incorrect context registration' unless
            SLMonsterAttackContext.last==[7002,25,29]

          raise 'Duplicate context' unless
            SLMonsterAttackContext.count==1

          raise 'Monster recognition missing' unless
            boss.instance_variable_get(:@monster)==true

          120.times{boss.update}

          raise 'Active attack re-entered' unless
            SLMonsterAttackContext.count==1

          $game_switches[7002]=false

          19.times{boss.update}

          raise 'Second attack fired too early' if
            $game_switches[7002]

          boss.update

          raise 'Second attack missing' unless
            $game_switches[7002] &&
            SLMonsterAttackContext.count==2

          $game_switches[7002]=false
          $game_variables[7001]=5200

          80.times{boss.update}

          raise 'Dead boss attacked' if
            $game_switches[7002] ||
            SLMonsterAttackContext.count!=2

          puts 'PASS no remote attacks'
          puts 'PASS one context per attack pulse'
          puts 'PASS 20-frame attack cooldown'
          puts 'PASS no concurrent attack re-entry'
          puts 'PASS monster classification'
          puts 'PASS defeated boss remains passive'
          RUBY

          ruby -c build/test.rb
          ruby build/test.rb

      - name: V254 Refresh resource hashes
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          root=Path('site')
          data=root/'knight/gameasync/Data'

          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          files=[
              data/(pre+'Map025.rxdata'),
              data/'Scripts.rxdata'
          ]

          mapping=root/'knight/gameasync/mapping.js'
          text=mapping.read_text('utf-8')

          for path in files:
              key='Data/'+path.name

              digest=hashlib.md5(
                  path.read_bytes()
              ).hexdigest()

              pattern=(
                  '('+re.escape(key)+
                  r'\?h=)[0-9a-f]{32}'
              )

              text,count=re.subn(
                  pattern,
                  lambda m:m.group(1)+digest,
                  text
              )

              assert count==1,(
                  'Mapping hash mismatch',key,count
              )

          mapping.write_text(text,'utf-8')

          loader=root/'knight/js/sl-assets-v229r115.js'
          js=loader.read_text('utf-8')

          old="var version='V253';"
          assert js.count(old)==1

          loader.write_text(
              js.replace(
                  old,"var version='V254';"
              ),
              'utf-8'
          )

          for rel in ('index.html','knight/index.html'):
              path=root/rel
              html=path.read_text('utf-8')

              assert 'V253' in html

              html=html.replace('V253','V254')
              html=html.replace(
                  '?v=v253','?v=v254'
              )

              # Preserve V253 removal of both labels.
              assert not re.search(
                  r'\bid\s*=\s*["\']'
                  r'(?:sl-build-version|slknight-v252-version)'
                  r'["\']',
                  html,re.I
              )

              path.write_text(html,'utf-8')

          print('PASS Map025 and Scripts hashes updated')
          print('PASS cache version V254')
          print('PASS visible version labels remain removed')
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: V254 Verify unrelated game data
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root=Path('site')

          before=json.loads(
              Path('build/before.json').read_text()
          )

          after={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          pre=(
              'knight/gameasync/Data/'
              'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          )

          allowed={
              pre+'Map025.rxdata',
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html',
              'knight/index.html'
          }

          changed={
              key for key in before
              if before[key]!=after.get(key)
          }

          assert changed==allowed,(
              'Unexpected modifications',
              sorted(changed^allowed)
          )

          assert set(before)==set(after)
          assert len(after)==5610

          protected=[
              pre+'Map016.rxdata',
              pre+'Map047.rxdata',
              pre+'CommonEvents.rxdata',
              'knight/assets/map-047-v241.pack'
          ]

          for name in protected:
              assert before[name]==after[name],name

          for action in (
              'Walk','Idle','Attack','AltAttack',
              'Spell','Hit','Death'
          ):
              name=(
                  'knight/gameasync/Graphics/'
                  'Characters/SLZenith'+action+'.png'
              )

              assert before[name]==after[name],name

          for name in (
              '이펙트마법',
              '물의 대정령 마법',
              '불의 대정령 마법',
              '땅의 대정령 마법'
          ):
              name=(
                  'knight/gameasync/Graphics/'
                  'Animations/'+name+'.png'
              )

              assert before[name]==after[name],name

          print('PASS all 5610 original files retained')
          print('PASS all unrelated maps unchanged')
          print('PASS all original NPCs unchanged')
          print('PASS native common events unchanged')
          print('PASS original motion sheets unchanged')
          print('PASS original magic effects unchanged')
          print('PASS six intended files modified')
          PY

      - name: V254 Publish game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
