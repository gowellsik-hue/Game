
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R56
# CAUSE: confirmed save-load TypeError at V230 Boss Respawn 60s 180s:182.
# Root: aliased Game_Event#initialize calls native super() in mruby context.
# FIX: move original R49 event gate into Game_Event native initialize,
# remove R49 and R52 Game_Event initialize aliases. Keep R55 reward behavior.
# BASE: 491EV V5.41-v2 R52 deployed run 39743709979.
# KEEP: all 5517 original files; 106 TI monsters, maps, walls, and loot.
# KEEP: 62 boss Adena bands, 212 native normal RNG, 162 fixed Adena.
# Only script indexes 26,72,74,134 and two version HTMLs and mapping hash change.
name: build-slknight-web.yml | V229R56 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R56 Restore entire R52 deployment with V5.41 491EV
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39743709979
          name: github-pages
          github-token: ${{ github.token }}
          path: r52

      - name: V229R56 Verify 5517 R52 files and preserve exact baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s r52/artifact.tar
          tar -xf r52/artifact.tar -C site
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          script=root/'knight/gameasync/Data/Scripts.rxdata'
          sha='1692894165d623508c560a537bbcb0d66b9886b7e070b461878ec563353c9644'
          assert hashlib.sha256(script.read_bytes()).hexdigest()==sha,'Unexpected R52 source'
          for name in ('index.html','knight/index.html'):
              assert 'V229R52' in (root/name).read_text('utf-8'),name
          pre='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          for mid in (43,44,45,46):
              assert (root/(pre+f'Map{mid:03d}.rxdata')).is_file(),mid
          old={str(f.relative_to(root)):hashlib.sha256(f.read_bytes()).hexdigest()
               for f in root.rglob('*') if f.is_file()}
          assert len(old)==5517,len(old)
          Path('build/r56-baseline.json').write_text(json.dumps(old,sort_keys=True))
          print('PASS original 5517 files and V5.41-v2 R52 source')
          PY_BASE

      - name: V229R56 Fix confirmed R49 Event initialize alias and retain 491EV rewards
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r56_patch.rb <<'R56_PATCH'
          require 'zlib'
          require 'digest'
          require 'json'
          root=ARGV.fetch(0)
          out=ARGV.fetch(1)
          path=File.join(root,'knight/gameasync/Data/Scripts.rxdata')
          expected='1692894165d623508c560a537bbcb0d66b9886b7e070b461878ec563353c9644'
          raise 'R52 source scripts changed' unless Digest::SHA256.file(path).hexdigest==expected
          scripts=Marshal.load(File.binread(path))
          raise 'Wrong scripts length' unless scripts.length==136
          original=Marshal.load(File.binread(path))
          changed=[]
          get=lambda{|i| Zlib::Inflate.inflate(scripts[i][2]).force_encoding('UTF-8')}
          put=lambda{|i,t| scripts[i][2]=Zlib::Deflate.deflate(t.b); changed<<i}
          replace_once=lambda do |text,old,new,label|
            found=text.scan(old).length
            raise "#{label}: wanted one match, got #{found}" unless found==1
            text.sub(old,new)
          end

          script134=get.call(134)
          r49_old=<<'OLD'
          class Game_Event
            alias slti_r49_original_initialize initialize
            def initialize(map_id,event)
              if (map_id==45 || map_id==46) && event.id>=16 && event.name.to_s[0,3]=='[ID'
                gate=event.pages[1].condition
                $game_switches[gate.switch1_id]=false if gate.switch1_valid
              end
              slti_r49_original_initialize(map_id,event)
            end
          end
          OLD
          raise 'R49 initializer wrapper appears more than once' unless script134.scan(r49_old).length==1
          script134=script134.sub(r49_old,'')

          marker='# V229R52: V230 V5.41-v2 authoritative'
          raise 'R52 reward module absent' unless script134.include?(marker)
          wrapper_start="\nclass Game_Event\n  alias slv541_original_initialize initialize\n"
          raise 'Unexpected R52 reward wrapper' unless script134.scan(wrapper_start).size==1
          prefix,wrapper=script134.split(wrapper_start,2)
          raise 'Missing R52 old command wrappers' unless ['alias slv541_original_refresh refresh','alias slv541_original_variable_command command_122','alias slv541_original_gold_command command_125','alias slv541_original_exp_command command_315'].all?{|x| wrapper.include?(x)}
          raise 'Unexpected reward wrapper end' unless wrapper.end_with?("  end\nend\n")
          old_data=script134[/  DATA=.*\n/]
          raise 'Source reward data missing' unless old_data && old_data.include?('DATA={2=>{')

          observer=<<'OBSERVER'

          # R56 rewards. Called by ORIGINAL Game_Event#refresh, with no alias-based init.
          module SLV541
            def self.observe(event)
              mid=event.instance_variable_get(:@map_id)
              eid=event.instance_variable_get(:@id)
              info=stat(mid,eid)
              return if info.nil? || $game_variables.nil?
              maxhp=info[4]
              hpvar=info[6]
              if $game_variables[hpvar].to_i < maxhp
                event.instance_variable_set(:@slv541_saw_live,true)
                event.instance_variable_set(:@slv541_rewarded,false)
                return
              end
              return unless event.instance_variable_get(:@slv541_saw_live)==true
              return if event.instance_variable_get(:@slv541_rewarded)==true
              source=event.instance_variable_get(:@event)
              death=source.pages[info[5]] unless source.nil?
              return if death.nil?
              return unless event.instance_variable_get(:@page).equal?(death)
              event.instance_variable_set(:@slv541_rewarded,true)
              pay(event,info)
            end
          end
          OBSERVER
          script134=(prefix+observer).sub(marker,'# V229R56: V230 V5.41-v2 authoritative')
          raise 'Reward DATA was changed' unless script134[/  DATA=.*\n/]==old_data
          raise 'R49 Game_Event initializer alias remains' if script134.include?("class Game_Event\n  alias slti_r49_original_initialize initialize")
          raise 'R52 initializer alias remains' if script134.include?('alias slv541_original_initialize initialize')
          raise 'R52 reward command aliases remain' if script134.include?('alias slv541_original_')
          put.call(134,script134)

          script26=get.call(26)
          original_header="  def initialize(map_id, event)\r\n    super()\r\n"
          new_header=<<~'NEW'.gsub("\n","\r\n")
            def initialize(map_id, event)
              # R56: original R49 gate setup moved here, before the native super() call.
              # Do not call an alias of Game_Event#initialize: mruby rejects aliased super.
              if (map_id==45 || map_id==46) && event.id>=16 && event.name.to_s[0,3]=='[ID'
                gate=event.pages[1].condition
                $game_switches[gate.switch1_id]=false if gate.switch1_valid
              end
              super()
          NEW
          # <<~ removes initial 2 spaces; explicit indent reconstructed below.
          new_header=new_header.lines.map{|l| '  '+l}.join
          script26=replace_once.call(script26,original_header,new_header,'Game_Event native initialize')
          script26=replace_once.call(script26,"    if new_page == @page\r\n","    if new_page == @page\r\n      SLV541.observe(self) if defined?(SLV541)\r\n",'Game_Event refresh unchanged page')
          script26=replace_once.call(script26,"      @interpreter = nil\r\n      # \uBA54\uC18C\uB4DC \uC885\uB8CC\r\n      return\r\n","      @interpreter = nil\r\n      # \uBA54\uC18C\uB4DC \uC885\uB8CC\r\n      SLV541.observe(self) if defined?(SLV541)\r\n      return\r\n",'Game_Event refresh nil-page exit')
          script26=replace_once.call(script26,"    check_event_trigger_auto\r\n  end\r\n","    check_event_trigger_auto\r\n    SLV541.observe(self) if defined?(SLV541)\r\n  end\r\n",'Game_Event refresh normal exit')
          raise 'Game_Event must still use direct native super' unless script26.include?("    super()\r\n    @map_id = map_id\r\n")
          put.call(26,script26)

          script72=get.call(72)
          {122=>"    return true if defined?(SLV541) && SLV541.rewarded?(@map_id,@event_id) && (@parameters[0]==333 || @parameters[0]==1926)\r\n",125=>"    return true if defined?(SLV541) && SLV541.rewarded?(@map_id,@event_id)\r\n"}.each do |n,line|
            tag="  def command_#{n}\r\n"
            script72=replace_once.call(script72,tag,tag+line,"Interpreter command_#{n}")
          end
          put.call(72,script72)
          script74=get.call(74)
          tag="  def command_315\r\n"
          script74=replace_once.call(script74,tag,tag+"    return true if defined?(SLV541) && SLV541.rewarded?(@map_id,@event_id)\r\n",'Interpreter command_315')
          put.call(74,script74)

          raise 'Unexpected changed indexes' unless changed.sort==[26,72,74,134]
          raise 'Unrelated scripts changed' unless scripts.each_index.all?{|i|changed.include?(i) || scripts[i]==original[i]}
          File.binwrite(path,Marshal.dump(scripts))
          [26,72,74,134].each{|i| File.binwrite(File.join(out,"r56-script#{i}.rb"),get.call(i))}
          File.write(File.join(out,'r56-runtime.rb'),script134[script134.index('# V229R56:')..-1])
          File.write(File.join(out,'r56-fix.json'),JSON.pretty_generate({version:'V229R56',base_scripts_sha256:expected,changed_script_indexes:changed.sort,original_game_event_initializer_direct:true,r49_initialize_alias_removed:true,r52_initialize_alias_removed:true,original_491_reward_data_preserved:true,existing_r49_gate_preserved:true}))
          puts 'PASS: moved R49 gate into original Game_Event#initialize, removed alias chains; reward data unchanged'
          R56_PATCH
          ruby -c /tmp/r56_patch.rb
          ruby /tmp/r56_patch.rb site build
          for i in 26 72 74 134; do ruby -c "build/r56-script${i}.rb"; done
          ruby -c build/r56-runtime.rb

      - name: V229R56 Test 490 kills, original super, TI gate and save-load rewards
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r56_test.rb <<'R56_TEST'
          require 'json'
          module RPG
            class Map;end
            class MapInfo;end
            class AudioFile;end
            class Tileset;end
            class CommonEvent;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end
          [RPG::Event,RPG::Event::Page,RPG::Event::Page::Condition,RPG::Event::Page::Graphic].each do |klass|
            klass.class_eval do
              def method_missing(m,*a)
                key='@'+m.to_s
                return instance_variable_get(key) if a.empty? && instance_variable_defined?(key)
                super
              end
            end
          end
          class Table
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(d=0);@raw;end
          end
          class Tone
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(d=0);@raw;end
          end
          class Color<Tone;end
          class Game_Character
            attr_accessor :x,:y
            def initialize
              @x=0;@y=0;@move_route_forcing=false;@original_direction=2;@original_pattern=0
              $native_init_calls=($native_init_calls||0)+1
            end
            def moveto(x,y);@x=x;@y=y;end
          end
          class Interpreter;end
          class MockParty
            attr_accessor :gold
            def initialize;@gold=0;end
            def gain_gold(n);@gold+=n;end
          end
          class Actor
            attr_accessor :exp
            def initialize;@exp=0;end
          end
          class MapMock
            attr_accessor :map_id,:events
            def initialize(id);@map_id=id;@events={};end
          end
          $game_player=Game_Character.new
          $game_player.x=-1000;$game_player.y=-1000
          $game_party=MockParty.new;$game_actors={1=>Actor.new}
          $game_variables=Hash.new(0)
          $game_switches=Hash.new(false)
          $game_self_switches=Hash.new(false)
          $game_map=MapMock.new(2)
          [26,72,74].each{|i|load File.join(ENV.fetch('R56_BUILD'),"r56-script#{i}.rb")}
          load File.join(ENV.fetch('R56_BUILD'),'r56-runtime.rb')
          raise 'R49 event initialize alias remains' if Game_Event.instance_methods(false).include?(:slti_r49_original_initialize)
          raise 'R52 event initialize alias remains' if Game_Event.instance_methods(false).include?(:slv541_original_initialize)
          raise 'R52 event refresh alias remains' if Game_Event.instance_methods(false).include?(:slv541_original_refresh)
          raise 'R52 interpreter command alias remains' if Interpreter.instance_methods(false).include?(:slv541_original_gold_command)

          records=SLV541::DATA.flat_map do |mid,mobs|
            mobs.map do |id,s|
              [mid,id,s[0],s[1],s[2],s[3],(s[0]==0 && s[1]==0)]
            end
          end
          root=ARGV.fetch(0);pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          count=0;paid=0;cases=0;boss_rng=0;normal_rng=0;fixed=0;missing=[]
          records.group_by{|r|r[0]}.each do |mid,items|
            m=Marshal.load(File.binread(File.join(root,'knight/gameasync/Data',pre+format('Map%03d.rxdata',mid))))
            $game_map=MapMock.new(mid)
            $game_variables=Hash.new(0)
            $game_switches=Hash.new(false)
            $game_self_switches=Hash.new(false)
            items.each do |row|
              id,xp,cash,low,high,nonhunt=row[1..-1]
              event=m.instance_variable_get(:@events)[id]
              stat=SLV541.stat(mid,id)
              raise "Data mismatch #{mid}:#{id}" unless event!=nil && stat && stat[0]==xp && stat[1]==cash
              var,maxhp,pidx=stat[6],stat[4],stat[5]
              $game_variables[var]=0
              before_exp=$game_actors[1].exp;before_cash=$game_party.gold;before_init=$native_init_calls
              obj=Game_Event.new(mid,event)
              raise "Native super not invoked exactly once #{mid}:#{id}" unless $native_init_calls==before_init+1
              $game_map.events[id]=obj
              obj.refresh
              $game_variables[var]=maxhp
              obj.refresh
              unless nonhunt
                unless obj.instance_variable_get(:@slv541_rewarded)==true
                  missing<<[mid,id,pidx];next
                end
                paid+=1
                delta_cash=$game_party.gold-before_cash
                delta_exp=$game_actors[1].exp-before_exp
                raise "Wrong XP #{mid}:#{id}: #{delta_exp}/#{xp}" unless delta_exp==xp
                if !low.nil?
                  raise "Boss money #{mid}:#{id}: #{delta_cash} outside #{low}..#{high}" unless (low..high).include?(delta_cash)
                  boss_rng+=1
                elsif stat[14] && stat[15] && cash>0
                  nlo,nhi=stat[14],stat[15];den=nlo+nhi
                  lo=(cash*2*nlo+den/2)/den;hi=(cash*2*nhi+den/2)/den
                  raise "Normal money #{mid}:#{id}: #{delta_cash} outside #{lo}..#{hi}" unless (lo..hi).include?(delta_cash)
                  normal_rng+=1
                else
                  raise "Fixed money #{mid}:#{id}: #{delta_cash}/#{cash}" unless delta_cash==cash
                  fixed+=1 if cash>0
                end
                3.times{obj.refresh}
                int=Interpreter.new
                int.instance_variable_set(:@event_id,id);int.instance_variable_set(:@map_id,mid)
                int.instance_variable_set(:@parameters,[0,0,1]);int.command_125
                int.instance_variable_set(:@parameters,[0,0,0,1]);int.command_315
                int.instance_variable_set(:@parameters,[333,333,0,2,200,400]);int.command_122
                int.instance_variable_set(:@parameters,[1926,1926,0,0,2501]);int.command_122
                raise "Message payout #{mid}:#{id}" unless $game_variables[333]==delta_cash && $game_variables[1926]==xp
                raise "Duplicate payout #{mid}:#{id}" unless $game_party.gold==before_cash+delta_cash && $game_actors[1].exp==before_exp+xp
                cases+=1
                $game_variables[var]=0;obj.refresh
                $game_variables[var]=maxhp;obj.refresh
                raise "Respawn XP #{mid}:#{id}" unless $game_actors[1].exp==before_exp+2*xp
              end
              $game_variables[var]=0
              count+=1
            end
          end
          raise "Coverage #{count} #{paid} #{cases} #{boss_rng} #{normal_rng} #{fixed} #{missing.inspect}" unless [count,paid,cases,boss_rng,normal_rng,fixed]==[491,490,490,62,212,162] && missing.empty?
          puts "PASS 491 records #{count}; kills #{paid}; boss ranges #{boss_rng}; normal rng #{normal_rng}; fixed #{fixed}"
          # Cold dead load / alive-save reload / dead-save reload should not create extra payouts.
          mid=16;eid=1;stat=SLV541.stat(mid,eid)
          m=Marshal.load(File.binread(File.join(root,'knight/gameasync/Data',pre+format('Map%03d.rxdata',mid))))
          event=m.instance_variable_get(:@events)[eid]
          $game_map=MapMock.new(mid);$game_variables=Hash.new(0);$game_switches=Hash.new(false);$game_self_switches=Hash.new(false)
          var,maxhp=stat[6],stat[4]
          $game_variables[var]=maxhp
          before_exp=$game_actors[1].exp;before_cash=$game_party.gold
          obj=Game_Event.new(mid,event);$game_map.events[eid]=obj;obj.refresh
          raise 'Cold dead page paid' unless $game_actors[1].exp==before_exp && $game_party.gold==before_cash
          $game_variables[var]=0;obj.refresh
          obj=Marshal.load(Marshal.dump(obj));$game_map.events[eid]=obj
          $game_variables[var]=maxhp;obj.refresh
          raise 'Alive save reload failed payout' unless $game_actors[1].exp==before_exp+stat[0]
          obj=Marshal.load(Marshal.dump(obj));$game_map.events[eid]=obj
          3.times{obj.refresh}
          raise 'Dead save reload double-paid' unless $game_actors[1].exp==before_exp+stat[0]
          puts 'PASS cold-dead, alive-save reload, dead-save reload'
          # Verify R49 switch gate survives directly in original initializer for TI events.
          [[45,16],[46,16]].each do |mid,id|
            map=Marshal.load(File.binread(File.join(root,'knight/gameasync/Data',pre+format('Map%03d.rxdata',mid))))
            event=map.instance_variable_get(:@events)[id]
            raise "TI fixture #{mid} #{id}" unless event && event.name.to_s[0,3]=='[ID'
            gate=event.pages[1].condition
            if gate.switch1_valid
              $game_switches[gate.switch1_id]=true
              Game_Event.new(mid,event)
              raise "TI gate reset missing #{mid}" unless $game_switches[gate.switch1_id]==false
            end
          end
          puts 'PASS original TI gate handling and native super constructor'
          R56_TEST
          ruby -c /tmp/r56_test.rb
          R56_BUILD=build ruby /tmp/r56_test.rb site | tee build/r56-kill-regression.txt
          grep -q 'PASS 491 records 491; kills 490; boss ranges 62; normal rng 212; fixed 162' build/r56-kill-regression.txt
          grep -q 'PASS cold-dead, alive-save reload, dead-save reload' build/r56-kill-regression.txt
          grep -q 'PASS original TI gate handling and native super constructor' build/r56-kill-regression.txt

      - name: V229R56 Update only script digest and visible version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_MANIFEST'
          from pathlib import Path
          import re,hashlib
          root=Path('site')
          mapping=root/'knight/gameasync/mapping.js'
          scripts=root/'knight/gameasync/Data/Scripts.rxdata'
          text,n=re.subn(r'Data/Scripts\.rxdata\?h=[0-9a-f]{32}',
                         lambda m:'Data/Scripts.rxdata?h='+hashlib.md5(scripts.read_bytes()).hexdigest(),
                         mapping.read_text('utf-8'))
          assert n==1,'Unexpected mapping script digest reference'
          mapping.write_text(text,encoding='utf-8')
          for name in ('index.html','knight/index.html'):
              page=root/name
              content=page.read_text('utf-8')
              assert 'V229R52' in content,name
              page.write_text(content.replace('V229R52','V229R56').replace('v229r52','v229r56'),encoding='utf-8')
          print('PASS only script digest and R56 labels updated')
          PY_MANIFEST
          node --check site/knight/gameasync/mapping.js

      - name: V229R56 Check all maps, walls and files remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          old=json.loads(Path('build/r56-baseline.json').read_text('utf-8'))
          new={str(f.relative_to(root)):hashlib.sha256(f.read_bytes()).hexdigest()
               for f in root.rglob('*') if f.is_file()}
          assert len(old)==len(new)==5517 and old.keys()==new.keys()
          changed={k for k in old if old[k]!=new[k]}
          allowed={'index.html','knight/index.html','knight/gameasync/mapping.js',
                   'knight/gameasync/Data/Scripts.rxdata'}
          assert changed==allowed,('Unexpected modified files',changed^allowed)
          meta=json.loads(Path('build/r56-fix.json').read_text('utf-8'))
          assert meta['changed_script_indexes']==[26,72,74,134]
          assert meta['r49_initialize_alias_removed'] and meta['r52_initialize_alias_removed']
          assert meta['original_491_reward_data_preserved'] and meta['existing_r49_gate_preserved']
          for name in ('index.html','knight/index.html'):
              assert 'V229R56' in (root/name).read_text('utf-8')
          print('PASS 5517 source files, exact 4 allowed changes, no maps/loot/wall edits')
          PY_FINAL

      - name: V229R56 Upload initializer and reward regression report
        uses: actions/upload-artifact@v4
        with:
          name: SLKnight-V229R56-GameEvent-Super-Fix-491EV
          path: |
            build/r56-fix.json
            build/r56-kill-regression.txt
          retention-days: 30
          if-no-files-found: error

      - name: V229R56 Upload repaired original game to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
