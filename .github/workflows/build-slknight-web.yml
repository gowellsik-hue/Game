
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R139
# BASE: Exact successful V229R138 Pages artifact (run 40834745896).
# REQUESTED: Match only R94 HTML green/red collision positions on Map045/Map046.
# RULE: green -> tile 384, red -> tile 385; other map cells remain untouched.
# SOURCE: the user-approved R94 1F/2F HTML visual overlays, sampled at existing
#         RPG map cell centers. The patches contain changed tile indices only.
# PRESERVE: original RPG movement, all scripts, R94 masks, monster/events,
#           boss, stairs, graphics, existing Talking Island Map047 and teleports.
# ONLY REQUIRED SIDE EFFECTS: map cache keys and three version display files.
name: build-slknight-web.yml | V229R139 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R139 Verify the exact successful R138 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY'
          import json,os,urllib.request
          run_id=40834745896
          sha='6f156306b7260a272397177c196ba7ccfaa8b77b'
          url=f'https://api.github.com/repos/gowellsik-hue/Game/actions/runs/{run_id}'
          req=urllib.request.Request(url,headers={
              'Authorization':'Bearer '+os.environ['GH_TOKEN'],
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=30) as f:r=json.load(f)
          assert (r['id'],r['head_sha'],r['conclusion'])==(run_id,sha,'success')
          assert r['path'].split('@',1)[0].endswith('/build-slknight-web.yml')
          print('PASS: exact successful R138, including current Talking Island')
          PY_VERIFY

      - name: V229R139 Download intact R138 Pages artifact
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40834745896
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V229R139 Extract intact R138 site and fingerprint all files
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY_BASE'
          import hashlib,json
          from pathlib import Path
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          assert len(before)==5663,('Unexpected R138 file count',len(before))
          assert 'V229R138' in (root/'index.html').read_text('utf8')
          assert 'V229R138' in (root/'knight/index.html').read_text('utf8')
          data='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          expected={
            'Map045':'f47de87af6b4e607bf632818a711619dc8ca4e747196a123a76ac7db8ffc3ba6',
            'Map046':'dc89d908f5247442e08dddc11f5bcf6505a77890bd82ab59b790e00e3e5f024c'
          }
          for m,sha in expected.items():
            assert before.get(data+m+'.rxdata')==sha,('Original map mismatch',m)
          assert (root/(data+'Map047.rxdata')).is_file(), 'R138 Talking Island missing'
          (Path('build')/'before.json').write_text(json.dumps(before,sort_keys=True))
          print('PASS: 5663 original R138 site files; dungeon original hashes match')
          PY_BASE

