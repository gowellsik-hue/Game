
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R61
# BASE: successful V229R60 deployment, run 39984034888.
# SOURCE OF COLLISION: original game map base layer tile 384 (walkable),
# tile 385 (blocked); the verified original foreground doorway is the only
# exception (Map045 x133..134, y58..59).
# Preserve all original foreground walls, wall transparency, maps, monster
# spawns, item drops, EXP/Adena rewards, and performance tweaks.
# Rebuild one shared 4-direction graph used by Game_Map, Game_Character and
# monster sight/route; no global XY shift and no guessed extra corridors.
name: build-slknight-web.yml | V229R61 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R61 Restore successful original R60 site
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39984034888
          name: github-pages
          github-token: ${{ github.token }}
          path: r60

      - name: V229R61 Extract and verify original site baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s r60/artifact.tar
          tar -xf r60/artifact.tar -C site
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          for name in ('index.html','knight/index.html'):
              assert 'V229R60' in (root/name).read_text('utf-8'),name
          script=root/'knight/gameasync/Data/Scripts.rxdata'
          assert hashlib.sha256(script.read_bytes()).hexdigest()=='438c7e2741f9dc358ce0392e8e1f9b4cd5944e14a7020f027f1a0898e341f55a'
          files={str(f.relative_to(root)):hashlib.sha256(f.read_bytes()).hexdigest()
                 for f in root.rglob('*') if f.is_file()}
          assert len(files)==5517,len(files)
          Path('build/r61-baseline.json').write_text(json.dumps(files,sort_keys=True))
          print('PASS: verified complete original R60 site (5517 files)')
          PY_BASE

      - name: V229R61 Rebuild native floor wall door collision
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r61_fix.rb <<'R61_FIX'
          # encoding: UTF-8
          require 'zlib'
          require 'digest'
          require 'json'
          require 'base64'

          root=ARGV.fetch(0)
          out=ARGV.fetch(1)
          script_file=File.join(root,'knight/gameasync/Data/Scripts.rxdata')
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          path=File.join(root,'knight/gameasync/Data')
          source=File.binread(script_file)
          source_digest=Digest::SHA256.hexdigest(source)
          expected_source='438c7e2741f9dc358ce0392e8e1f9b4cd5944e14a7020f027f1a0898e341f55a'
          raise 'Unexpected source: not deployed V229R60' unless source_digest==expected_source

          module RPG
            class Map;end
            class AudioFile;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end
          class Table
            def self._load(raw)
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end
            def tile(x,y,w,h,z=0)
              @raw.byteslice(20 + ((z*h+y)*w+x)*2,2).unpack('v')[0]
            end
          end
          class Tone;def self._load(raw);allocate;end;end
          class Color;def self._load(raw);allocate;end;end

          source_scripts=Marshal.load(source)
          scripts=Marshal.load(source)
          raise 'Script count changed' unless scripts.length==136
          get=lambda{|idx|Zlib::Inflate.inflate(scripts[idx][2]).force_encoding('UTF-8')}
          put=lambda{|idx,s|scripts[idx][2]=Zlib::Deflate.deflate(s.b)}
          s21=get.call(21)
          section_start=s21.index('module SLTI_V229R44')
          raise 'R44 module not found' unless section_start
          s21_prefix=s21[0...section_start]
          s21=s21[section_start..-1]
          s23=get.call(23)
          reported={}

          [45,46].each do |mid|
            fname=File.join(path,"#{prefix}Map%03d.rxdata"%mid)
            map=Marshal.load(File.binread(fname))
            w=map.instance_variable_get(:@width)
            h=map.instance_variable_get(:@height)
            raise 'Bad map size' unless [w,h]==(mid==45 ? [288,144] : [336,168])

            table=map.instance_variable_get(:@data)
            walk=Array.new(w*h,false)
            counts=Hash.new(0)

            h.times do |y|
              w.times do |x|
                t=table.tile(x,y,w,h)
                counts[t]+=1
                raise "Unexpected map layer tile #{t} #{mid} #{x} #{y}" unless t==384 || t==385
                raise 'Map overlay unexpectedly contains data' unless table.tile(x,y,w,h,1)==0 && table.tile(x,y,w,h,2)==0
                walk[y*w+x]=(t==384)
              end
            end

            if mid==45
              # Original separate wall image contains a unique stone doorway.
              # Verify its foreground image before enabling its actual opening.
              door=File.join(root,'knight/gameasync/Graphics/Panoramas/SLTI_45_W_C4_1.png')
              expected='d063933da8bc0cb43bed3584159e9256c9a284d35909d00b11aa28790c5b4d3f'
              raise 'Original doorway art changed' unless Digest::SHA256.file(door).hexdigest==expected

              [133,134].each do |x|
                [58,59].each do |y|
                  raise 'Door region is not original impassable tile' unless table.tile(x,y,w,h)==385
                  walk[y*w+x]=true
                end
                raise 'Door north not connected to floor' unless table.tile(x,57,w,h)==384
                raise 'Door south not connected to floor' unless table.tile(x,60,w,h)==384
              end
            end

            edges=Array.new(w*h,0)
            h.times do |y|
              w.times do |x|
                next unless walk[y*w+x]
                idx=y*w+x
                edges[idx]|=1 if y>0 && walk[(y-1)*w+x]
                edges[idx]|=2 if y<h-1 && walk[(y+1)*w+x]
                edges[idx]|=4 if x>0 && walk[idx-1]
                edges[idx]|=8 if x<w-1 && walk[idx+1]
              end
            end

            # Block every native wall cell except the verified visual doorway.
            walk.each_with_index do |pass,i|
              raise "Block tile unexpectedly traversable at #{mid}:#{i}" if !pass && edges[i]!=0
              y=i/w;x=i%w;v=edges[i]
              raise 'left/right mismatch' if x<w-1 && ((v&8)!=0)!=((edges[i+1]&4)!=0)
              raise 'up/down mismatch' if y<h-1 && ((v&2)!=0)!=((edges[i+w]&1)!=0)
            end

            raw=edges.pack('C*')
            rx=/^  EDGES_#{mid} = \[\r?\n.*?\r?\n  \]\.join\.unpack\('m'\)\[0\]/m
            raise "Map #{mid}: R44 literal not uniquely found" unless s21.scan(rx).length==1
            b64=[raw].pack('m0').scan(/.{1,120}/).map{|chunk|"    #{chunk.inspect}"}.join(",\n")
            replacement="  EDGES_#{mid} = [\n#{b64}\n  ].join.unpack('m')[0]"
            s21=s21.sub(rx,replacement)

            File.binwrite(File.join(out,"r61-edges-#{mid}.bin"),raw)
            reported[mid]={
              width:w,
              height:h,
              floor_tiles:counts[384],
              blocked_tiles:counts[385],
              door_tiles:(mid==45 ? 4:0),
              traversable_cells:walk.count(true)
            }
          end

          # Remove the conflicting monster-only movement restriction.
          # The shared edge graph already blocks wall cells and accepts the door.
          old_lines="        # The remaining twelve R44 floor bridges are needed for player access.\n        # Monsters must not climb their old visual wall-tile footprints.\n        return false if regular && $game_map.data[nx,ny,0] == 385\n"
          raise 'Unexpected monster movement rule' unless s23.include?(old_lines)
          s23=s23.sub(old_lines,'')

          s21=s21_prefix+s21
          put.call(21,s21)
          put.call(23,s23)

          raise 'Unexpected script modifications' unless scripts.each_index.all?{|i| [21,23].include?(i) || scripts[i]==source_scripts[i]}
          File.binwrite(script_file,Marshal.dump(scripts))

          # Verify data after rebuilding the actual Ruby archive.
          check=Marshal.load(File.binread(script_file))
          actual=Zlib::Inflate.inflate(check[21][2]).force_encoding('UTF-8')
          start=actual.index('module SLTI_V229R44')
          stop=actual.index("\nclass Game_Map",start)
          raise 'Collision module missing' unless start && stop
          eval(actual[start...stop])

          [45,46].each do |mid|
            want=File.binread(File.join(out,"r61-edges-#{mid}.bin"))
            got=SLTI_V229R44.const_get("EDGES_#{mid}")
            raise "Roundtrip corrupted Map#{mid}" unless want==got
          end

          File.binwrite(File.join(out,'r61-script21.rb'),actual)
          File.binwrite(File.join(out,'r61-script23.rb'),Zlib::Inflate.inflate(check[23][2]))
          File.binwrite(File.join(out,'r61-script27.rb'),Zlib::Inflate.inflate(check[27][2]))
          File.write(File.join(out,'r61-collision-report.json'),JSON.pretty_generate({
            version:'V229R61',
            base:'V229R60',
            changed_scripts:[21,23],
            uses_native_floor_tile_384:true,
            blocks_native_wall_tile_385:true,
            front_wall_graphics_unchanged:true,
            door_from_verified_foreground_art:true,
            maps:reported
          }))
          puts 'PASS native 384 ground/385 walls, original image-verified gateway; no graph shift'
          R61_FIX

          ruby -c /tmp/r61_fix.rb
          ruby /tmp/r61_fix.rb site build
          ruby -c build/r61-script21.rb
          ruby -c build/r61-script23.rb
          ruby -c build/r61-script27.rb

      - name: V229R61 Verify original player and monster collision across both floors
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r61_test.rb <<'R61_TEST'
          # encoding: UTF-8
          root=ARGV.fetch(0)
          build=ARGV.fetch(1)

          load File.join(build,'r61-script21.rb')
          load File.join(build,'r61-script23.rb')
          class Game_Event < Game_Character
            attr_accessor :event
          end
          load File.join(build,'r61-script27.rb')

          module RPG
            class Map
              def width;@width;end
              def height;@height;end
              def data;@data;end
            end
            class AudioFile;end
            class Event;attr_accessor :id,:name;end
            class Event::Page;end
            class Event::Page::Condition;end
            class Event::Page::Graphic;end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end
          class Tone;def self._load(x);allocate;end;end
          class Color;def self._load(x);allocate;end;end
          class Table
            def self._load(raw)
              x=allocate
              x.instance_variable_set(:@raw,raw)
              x
            end
            def [](x,y,z)
              w=@raw.byteslice(4,4).unpack('L<')[0]
              h=@raw.byteslice(8,4).unpack('L<')[0]
              @raw.byteslice(20+((z*h+y)*w+x)*2,2).unpack('v')[0]
            end
          end

          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          [45,46].each do |mid|
            path=File.join(root,'knight/gameasync/Data',"#{pre}Map%03d.rxdata"%mid)
            map=Marshal.load(File.binread(path))
            w=map.instance_variable_get(:@width)
            h=map.instance_variable_get(:@height)

            $game_map=Game_Map.allocate
            $game_map.instance_variable_set(:@map_id,mid)
            $game_map.instance_variable_set(:@map,map)
            $game_map.instance_variable_set(:@events,{})
            $game_player=Game_Player.new
            $game_player.instance_variable_set(:@x,1000)
            $game_player.instance_variable_set(:@y,1000)

            ground=0
            walls=0
            edges=SLTI_V229R44.const_get("EDGES_#{mid}")
            dirs=[[1,0,6,8],[-1,0,4,4],[0,1,2,2],[0,-1,8,1]]

            h.times do |y|
              w.times do |x|
                t=map.instance_variable_get(:@data)[x,y,0]
                door=mid==45 && (133..134).include?(x) && (58..59).include?(y)
                open=t==384 || door
                v=edges.getbyte(y*w+x)

                raise 'Wall tile permits direction' if !open && v!=0
                open ? ground+=1 : walls+=1

                dirs.each do |dx,dy,d,bit|
                  nx=x+dx
                  ny=y+dy
                  if nx<0 || ny<0 || nx>=w || ny>=h
                    raise 'Border walk?' if v&bit!=0
                    next
                  end
                  dest=map.instance_variable_get(:@data)[nx,ny,0]
                  nd=mid==45 && (133..134).include?(nx) && (58..59).include?(ny)
                  expect=open && (dest==384 || nd)
                  got=SLTI_V229R44.allowed?(mid,x,y,d)
                  raise "Wrong edge #{mid} #{x},#{y} #{d}" unless got==expect
                end
              end
            end
            puts "PASS Map#{mid} full #{w*h} cells: native floor/blocked and edges, ground=#{ground}, walls=#{walls}"
          end

          $game_map.instance_variable_set(:@map_id,45)
          map=Marshal.load(File.binread(File.join(root,'knight/gameasync/Data',"#{pre}Map045.rxdata")))
          $game_map.instance_variable_set(:@map,map)
          $game_player=Game_Player.new
          $game_player.instance_variable_set(:@x,133)
          $game_player.instance_variable_set(:@y,57)

          raise 'Door north missing' unless $game_player.passable?(133,57,2)
          raise 'Door middle missing' unless $game_player.passable?(133,58,2)
          raise 'Door exit missing' unless $game_player.passable?(133,59,2)
          raise 'Solid wall beside door must remain blocked' if $game_player.passable?(132,57,2)

          monster=Game_Event.new
          ref=RPG::Event.new
          ref.id=20
          ref.name='[ID monster]'
          monster.instance_variable_set(:@event,ref)
          monster.instance_variable_set(:@x,134)
          monster.instance_variable_set(:@y,57)

          raise 'Monster cannot use door' unless monster.passable?(134,57,2)
          raise 'Monster passed solid jamb' if monster.passable?(135,57,2)
          puts 'PASS player and original monster both pass the actual door while jamb remains blocked'
          R61_TEST

          ruby -c /tmp/r61_test.rb
          ruby /tmp/r61_test.rb site build | tee build/r61-movement-test.txt
          grep -q 'PASS player and original monster both pass' build/r61-movement-test.txt

      - name: V229R61 Refresh script cache hash and version labels only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CACHE'
          from pathlib import Path
          import hashlib,re
          root=Path('site')
          mapping=root/'knight/gameasync/mapping.js'
          target=root/'knight/gameasync/Data/Scripts.rxdata'
          digest=hashlib.md5(target.read_bytes()).hexdigest()
          updated,n=re.subn(r'Data/Scripts\.rxdata\?h=[0-9a-f]{32}',
                            lambda m:'Data/Scripts.rxdata?h='+digest,
                            mapping.read_text('utf-8'))
          assert n==1,('Unexpected Scripts cache reference count',n)
          mapping.write_text(updated,encoding='utf-8')

          for name in ('index.html','knight/index.html'):
              file=root/name
              text=file.read_text('utf-8')
              assert 'V229R60' in text,name
              file.write_text(text.replace('V229R60','V229R61').replace('v229r60','v229r61'),encoding='utf-8')
          print('PASS updated original Scripts cache digest and two visible versions')
          PY_CACHE
          node --check site/knight/gameasync/mapping.js

      - name: V229R61 Prove no map graphics loot or other files changed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          base=json.loads(Path('build/r61-baseline.json').read_text('utf-8'))
          now={str(f.relative_to(root)):hashlib.sha256(f.read_bytes()).hexdigest()
               for f in root.rglob('*') if f.is_file()}
          assert base.keys()==now.keys() and len(now)==5517
          changed={f for f in now if now[f]!=base[f]}
          allowed={
              'index.html',
              'knight/index.html',
              'knight/gameasync/mapping.js',
              'knight/gameasync/Data/Scripts.rxdata'
          }
          assert changed==allowed,('Unintended game files changed',changed^allowed)

          report=json.loads(Path('build/r61-collision-report.json').read_text('utf-8'))
          assert report['changed_scripts']==[21,23]
          assert report['maps']['45']['traversable_cells']==3728
          assert report['maps']['46']['traversable_cells']==7100
          assert 'V229R61' in (root/'knight/index.html').read_text('utf-8')
          print('PASS 5517 files preserved; only collision scripts and cache/version changed')
          PY_FINAL

      - name: V229R61 Upload collision regression report
        uses: actions/upload-artifact@v4
        with:
          name: SLKnight-V229R61-Native-Layer-Collision
          path: |
            build/r61-collision-report.json
            build/r61-movement-test.txt
          retention-days: 30
          if-no-files-found: error

      - name: V229R61 Upload complete game to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
