
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V276.7.5
# BASE: successful V276.7.4.1, run 41969829452.
# WALK: keep successful 8-frame queen and legacy monsters byte-for-byte.
# HIT: keep queen-only hit; never edit native Death Knight.
# DEATH: display 17 original four-way frames with the native character renderer.
# MAGIC: show the original Spell bank immediately, retain 5:1:1 branches.
# REGEN: queen-only natural HP regeneration; no HP after death.
# STATUS: keep existing poison and 64-second web slow rules.
# VERSION: use the user-specified version exactly.

name: build-slknight-web.yml | V276.7.5 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Restore successful V276.7.4.1 site
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41969829452
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify exact previous baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s baseline/artifact.tar
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json

          root=Path('site')
          hashes={
            str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
            for p in root.rglob('*') if p.is_file()
          }
          assert len(hashes)==5623,('Wrong successful baseline',len(hashes))
          game=root/'knight/gameasync'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          for name in ('Scripts.rxdata',pre+'CommonEvents.rxdata',pre+'Map025.rxdata'):
            assert (game/'Data'/name).is_file(),name
          for direction in (2,4,6,8):
            for kind in ('magic','death'):
              assert (game/'Graphics/Animations'/f'SLZQ_{kind}_D{direction}.png').is_file()
          for name in ('SLZQWalk.png','SLZQHit.png','SLZQDeath.png'):
            assert (game/'Graphics/Characters'/name).is_file()
          assert 'V276.7.4.1' in (root/'index.html').read_text('utf-8')
          Path('build/before.json').write_text(json.dumps(hashes),encoding='utf-8')
          print('PASS successful V276.7.4.1 / 5623 files')
          PY

      - name: Build visible death and distinct original magic motions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          root=Path('site/knight/gameasync/Graphics')
          animations=root/'Animations'
          characters=root/'Characters'
          walk=characters/'SLZQWalk.png'
          walk_bytes=walk.read_bytes()
          cell=192
          cw,ch=168,144
          directions=(2,4,6,8)

          # The successful V276.7.4.1 combat atlases were aligned
          # at (96,157); their native character pivot is (84,133).
          # The extraction window preserves that same pivot.
          death=Image.new('RGBA',(cw*17,ch*4),(0,0,0,0))
          for row,direction in enumerate(directions):
            path=animations/f'SLZQ_death_D{direction}.png'
            atlas=Image.open(path).convert('RGBA')
            assert atlas.size==(960,960)
            for frame in range(17):
              x=(frame%5)*cell
              y=(frame//5)*cell
              original=atlas.crop((x,y,x+cell,y+cell))
              reduced=original.crop((12,24,180,168))
              assert original.getchannel('A').getbbox(),(direction,frame)
              assert sum(original.getchannel('A').getdata())==sum(reduced.getchannel('A').getdata()),('Death pixels clipped',direction,frame)
              death.alpha_composite(reduced,(frame*cw,row*ch))
          output=characters/'SLZQDeath17.png'
          assert not output.exists(),'Death17 graphic already exists in baseline'
          death.save(output,optimize=True)
          assert Image.open(output).size==(2856,576)

          # The previous 25-frame spell animation had 11 identical
          # initial idle frames. Use ONLY the original 14 Spell poses,
          # showing a recognisable cast from the first frame.
          # Damage/branch/timing remain 25 frames.
          sequence=(
            11,11,12,12,13,13,14,14,15,15,
            16,16,17,17,18,18,19,19,20,20,
            21,22,23,24,24
          )
          assert len(sequence)==25
          for direction in directions:
            path=animations/f'SLZQ_magic_D{direction}.png'
            original=Image.open(path).convert('RGBA')
            assert original.size==(960,960)
            rebuilt=Image.new('RGBA',original.size,(0,0,0,0))
            for i,source in enumerate(sequence):
              sx=source%5*cell
              sy=source//5*cell
              dx=i%5*cell
              dy=i//5*cell
              rebuilt.alpha_composite(
                original.crop((sx,sy,sx+cell,sy+cell)),
                (dx,dy)
              )
            rebuilt.save(path,optimize=True)

          assert walk.read_bytes()==walk_bytes,'Successful 8-frame walk changed'
          print('PASS 17 native death frames in all four directions')
          print('PASS 25-frame original spell pose starts immediately')
          print('PASS original 8-frame walk unchanged')
          PY

      - name: Restore live death event and natural boss regeneration
        shell: bash
        run: |
          set -euo pipefail
          cat > build/zq27675.rb <<'RUBY'
          require 'zlib'
          module RPG
            class Map;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class CommonEvent;end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
            class AudioFile;end
            class Animation
              class Frame;end
              class Timing;end
            end
          end
          class Table
            def self._load(raw)
              x=allocate
              x.instance_variable_set(:@raw,raw)
              x
            end
            def _dump(level=0);@raw;end
          end
          class Tone<Table;end
          class Color<Table;end

          def ck(x,message);raise message unless x;end
          def val(x,k);x.instance_variable_get('@'+k.to_s);end
          def put(x,k,v);x.instance_variable_set('@'+k.to_s,v);end
          def cp(x);Marshal.load(Marshal.dump(x));end

          data='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          map_path=data+pre+'Map025.rxdata'
          common_path=data+pre+'CommonEvents.rxdata'
          scripts_path=data+'Scripts.rxdata'

          map=Marshal.load(File.binread(map_path))
          common=Marshal.load(File.binread(common_path))
          scripts=Marshal.load(File.binread(scripts_path))
          ck(common.length==1069,'V276.7.4.1 hit CE missing')
          ck(scripts.length==137,'RGSS script inventory changed')
          queen=val(map,:events).fetch(29)
          pages=val(queen,:pages)
          ck(pages.length==5,'Queen pages changed')
          ck(pages.map{|p|val(p,:list).length}==[22,1,217,2,20],
             'Queen original native pages damaged')
          ck(val(val(pages[3],:graphic),:character_name)=='SLZQBlank',
             'Queen death page changed')
          ck(val(val(pages[4],:graphic),:character_name)=='SLZQDeath',
             'Queen native corpse changed')
          put(val(pages[3],:graphic),:character_name,'SLZQDeath17')
          put(val(pages[3],:graphic),:pattern,0)

          # Keep rewards/respawn unchanged. Replace the invisible
          # Blank + overlay animation with a real event character.
          death=common.fetch(1067)
          events=val(death,:list)
          ck(events.length==16,'Death CE event count changed')
          ck(val(events[0],:code)==117 && val(events[0],:parameters)==[371],
             'Native death callback changed')
          ck(val(events[1],:code)==355,'Native death marker missing')
          ck(events.count{|e|val(e,:code)==207}==4,
             'Expected four old overlay animations')
          wait=events.find{|e|val(e,:code)==106}
          ck(wait && val(wait,:parameters)==[70],
             'Previous slowed death wait missing')
          marker=cp(events[1])
          source=val(marker,:parameters)[0]
          ck(source.include?('@slzq_death_direction'),
             'Original death marker changed')
          source=source+"\ne.sl_attack_finish if e.respond_to?(:sl_attack_finish)\n"+
             "e.instance_variable_set(:@slzq_death_begin,Graphics.frame_count)\n"
          put(marker,:parameters,[source])
          put(death,:list,[events[0],marker,wait,events[-1]])
          ck(val(death,:list).map{|e|val(e,:code)}==[117,355,106,0],
             'Death frame flow not isolated')

          # The successful 8-frame native renderer must be preserved.
          # Only teach it to draw SLZQDeath17 as a 17-column sheet.
          matches=[]
          scripts.each_with_index do |entry,i|
            begin
              source=Zlib::Inflate.inflate(entry[2])
              matches<<[i,source] if
                source.include?('sx = if @sl_walk8') &&
                source.include?('(@sl_walk8 ? 8 : 4)')
            rescue Zlib::DataError
            end
          end
          ck(matches.length==1,'Native 8-frame renderer not unique')
          index,source=matches[0]
          original=source.dup
          ck(source.scan('(@sl_walk8 ? 8 : 4)').length==1,
             'Original width branch changed')
          source.sub!(
            '(@sl_walk8 ? 8 : 4)',
            '(@character.character_name == "SLZQDeath17" ? 17 : (@sl_walk8 ? 8 : 4))'
          )
          replacement=<<'DEATH_SX'
          sx = if @character.character_name == "SLZQDeath17"
            started = @character.instance_variable_get(:@slzq_death_begin)
            elapsed = started ? Graphics.frame_count - started : 0
            elapsed = 0 if elapsed < 0
            frame = elapsed / 4
            frame = 16 if frame > 16
            frame * @cw
          elsif @sl_walk8
          DEATH_SX
          ck(source.include?('sx = if @sl_walk8'),
             'Native moving frame selector missing')
          source.sub!('sx = if @sl_walk8',replacement.chomp)
          ck(source!=original,'Native sprite source unchanged')
          ck(source.include?('elsif @sl_walk8') &&
             source.include?('(@sl_walk8 ? 8 : 4)'),
             'Previous 8-frame walk branch overwritten')
          scripts[index][2]=Zlib::Deflate.deflate(source)
          File.binwrite('build/zq27675_sprite.rb',source)

          # Extend the ALREADY EXISTING queen-specific tick.
          # The Queen stores damage taken in variable 4988, not current HP.
          # Healing subtracts that damage, clamped at zero.
          regen=<<'REGEN_RUBY'
          module SLZQEffects
            REGEN_HP=5
            REGEN_SECONDS=5
            @regen_next_frame=nil

            class << self
              alias slzq_v27675_previous_tick tick

              def tick(target)
                slzq_v27675_previous_tick(target)
                slzq_regen_tick
              end

              def slzq_regen_tick
                unless in_queen_map?
                  @regen_next_frame=nil
                  return
                end

                event=$game_map.events[29]
                unless event && !event.instance_variable_get(:@erased)
                  @regen_next_frame=nil
                  return
                end

                damage=$game_variables[4988].to_i
                dead=event.instance_variable_get(:@slzq_killed_here)
                dead||=($game_self_switches[[25,29,'A']]==true)

                if dead || damage>=520
                  @regen_next_frame=nil
                  return
                end

                now=Graphics.frame_count.to_i
                @regen_next_frame||=now+REGEN_SECONDS*rate
                return if now<@regen_next_frame
                @regen_next_frame=now+REGEN_SECONDS*rate
                return if damage<=0

                $game_variables[4988]=[damage-REGEN_HP,0].max
                if $m && $m.respond_to?(:drawMHP)
                  $m.drawMHP('제니스 퀸',$game_variables[4988],520,2)
                end
              end
            end
          end
          REGEN_RUBY

          game_player=scripts.each_index.select{|i|scripts[i][1]=='Game_Player'}
          ck(game_player.length==1,'Game_Player script not unique')
          player_id=game_player[0]
          player_source=Zlib::Inflate.inflate(scripts[player_id][2])
          ck(player_source.include?('module SLZQEffects') &&
             player_source.include?('slzq_v27674_update'),
             'V276.7.4.1 status tick missing')
          ck(!player_source.include?('slzq_v27675_previous_tick'),
             'Regen already installed')
          scripts[player_id][2]=Zlib::Deflate.deflate(
            player_source.b+"\n".b+regen.b+"\n".b
          )
          File.binwrite('build/zq27675_regen.rb',regen)
          ck(system('ruby','-c','build/zq27675_regen.rb'),
             'Regeneration syntax invalid')

          # Explicitly verify that original damage, branch selection,
          # hit, poison and web effects are still present.
          cycle=val(common.fetch(1064),:list)
          ck(cycle.length==17,'5:1:1 attack graph changed')
          ck(val(cycle[0],:parameters)==[5987,5987,0,2,0,6],
             'Original 0..6 attack roll changed')
          attack_script=cycle.select{|e|val(e,:code)==355}.
            map{|e|val(e,:parameters)[0].to_s}
          ck(attack_script.any?{|s|s.include?('916') && s.include?('919')},
             'Native magic attack not linked')
          ck(attack_script.any?{|s|s.include?('SLZQEffects.after_damage')},
             'Poison and web/slow hook missing')
          ck(val(common.fetch(178),:name).to_s.dup.force_encoding('UTF-8').scrub.
             include?('데스'),'Death Knight Hit CE overwritten')
          ck(val(common.fetch(1068),:name).to_s.dup.force_encoding('UTF-8').scrub.
             include?('전용 피격'),'Private Queen Hit CE lost')

          File.binwrite(map_path,Marshal.dump(map))
          File.binwrite(common_path,Marshal.dump(common))
          File.binwrite(scripts_path,Marshal.dump(scripts))

          reloaded=Marshal.load(File.binread(map_path))
          check_death=val(val(val(reloaded,:events).fetch(29),:pages)[3],:graphic)
          ck(val(check_death,:character_name)=='SLZQDeath17',
             'Death charset not saved')

          puts 'PASS Queen death 17 frames / 4 ticks each'
          puts 'PASS original 8-frame walk / four directions preserved'
          puts 'PASS magic spell source and 5:1:1 branch retained'
          puts 'PASS Queen HP +5 per five seconds, max 520'
          puts 'PASS Death Knight Hit and queen private Hit preserved'
          RUBY
          ruby -c build/zq27675.rb
          ruby build/zq27675.rb

      - name: Refresh exact data and graphics hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re

          root=Path('site')
          game=root/'knight/gameasync'
          data=game/'Data'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          mapping=game/'mapping.js'
          source=mapping.read_text('utf-8')

          to_update=[
            ('Data/Scripts.rxdata',data/'Scripts.rxdata'),
            ('Data/'+pre+'CommonEvents.rxdata',data/(pre+'CommonEvents.rxdata')),
            ('Data/'+pre+'Map025.rxdata',data/(pre+'Map025.rxdata'))
          ]
          for direction in (2,4,6,8):
            name=f'SLZQ_magic_D{direction}.png'
            to_update.append((
              'Graphics/Animations/'+name,
              game/'Graphics/Animations'/name
            ))

          for logical,path in to_update:
            digest=hashlib.md5(path.read_bytes()).hexdigest()
            pattern=re.escape(logical)+r'\?h=[0-9a-f]{32}'
            source,count=re.subn(
              pattern,lambda m:logical+'?h='+digest,source
            )
            assert count==1,('Hash mapping is not unique',logical,count)

          death=game/'Graphics/Characters/SLZQDeath17.png'
          assert death.is_file()
          digest=hashlib.md5(death.read_bytes()).hexdigest()
          row=(
            '["graphics/characters/slzqdeath17", '
            '"Graphics/Characters/SLZQDeath17.png?h='+digest+'"],'
          )
          assert 'graphics/characters/slzqdeath17' not in source
          anchor='];\n\nvar mapping = {};'
          assert source.count(anchor)==1
          source=source.replace(anchor,'\n'+row+'\n'+anchor)
          mapping.write_text(source,encoding='utf-8')

          loader=root/'knight/js/sl-assets-v229r115.js'
          text=loader.read_text('utf-8')
          before="var version='V276.7.4.1';"
          assert text.count(before)==1
          loader.write_text(
            text.replace(before,"var version='V276.7.5';"),encoding='utf-8'
          )
          for name in ('index.html','knight/index.html'):
            path=root/name
            text=path.read_text('utf-8')
            assert 'V276.7.4.1' in text,name
            path.write_text(
              text.replace('V276.7.4.1','V276.7.5'),encoding='utf-8'
            )
          print('PASS seven changed image/data mappings + new death')
          print('PASS version is exactly V276.7.5')
          PY
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Verify original game untouched outside Zenith Queen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before=json.loads(Path('build/before.json').read_text('utf-8'))
          after={
            str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
            for p in root.rglob('*') if p.is_file()
          }
          assert len(after)==5624,('Unexpected file count',len(after))
          added=set(after)-set(before)
          assert added=={'knight/gameasync/Graphics/Characters/SLZQDeath17.png'},added
          assert not set(before)-set(after),'An original file was deleted'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          allowed={
            'knight/gameasync/Data/Scripts.rxdata',
            'knight/gameasync/Data/'+pre+'CommonEvents.rxdata',
            'knight/gameasync/Data/'+pre+'Map025.rxdata',
            'knight/gameasync/mapping.js',
            'knight/js/sl-assets-v229r115.js',
            'index.html','knight/index.html'
          }
          for direction in (2,4,6,8):
            allowed.add('knight/gameasync/Graphics/Animations/SLZQ_magic_D%d.png'%direction)
          changed={name for name in before if before[name]!=after[name]}
          assert changed==allowed,('Unexpected changed files',changed^allowed)
          assert after['knight/gameasync/Graphics/Characters/SLZQWalk.png']==before[
            'knight/gameasync/Graphics/Characters/SLZQWalk.png'
          ],'Eight-frame walk changed'
          print('PASS exactly 11 approved original file changes')
          print('PASS 17-frame native death + source-only spell changes')
          print('PASS original 8-frame movement unchanged')
          print('PASS all other monster and game data unchanged')
          PY

      - name: Publish verified draft game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
