      - name: Refresh modified RPG cache hashes and version
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY_VERSION'
          from pathlib import Path
          import hashlib
          import re

          root = Path('site')
          game = root / 'knight/gameasync'
          data = game / 'Data'

          prefix = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          mapping = game / 'mapping.js'
          mapping_text = mapping.read_text('utf-8')

          changed_data = (
              'Scripts.rxdata',
              prefix + 'CommonEvents.rxdata'
          )

          for filename in changed_data:
              file_path = data / filename

              digest = hashlib.md5(
                  file_path.read_bytes()
              ).hexdigest()

              pattern = (
                  re.escape('Data/' + filename) +
                  r'\?h=[0-9a-f]{32}'
              )

              replacement = (
                  'Data/' + filename + '?h=' + digest
              )

              mapping_text, count = re.subn(
                  pattern,
                  lambda _: replacement,
                  mapping_text
              )

              assert count == 1, (
                  'RPG data mapping not unique',
                  filename,
                  count
              )

          mapping.write_text(
              mapping_text,
              encoding='utf-8'
          )

          loader = root / 'knight/js/sl-assets-v229r115.js'
          loader_text = loader.read_text('utf-8')

          before = "var version='V1.1';"
          after = "var version='V1.2';"

          assert loader_text.count(before) == 1, (
              'Unexpected existing version'
          )

          loader.write_text(
              loader_text.replace(before, after),
              encoding='utf-8'
          )

          for filename in (
              'index.html',
              'knight/index.html'
          ):
              path = root / filename

              html = path.read_text('utf-8')

              assert 'V1.1' in html, (
                  'Existing visible version missing',
                  filename
              )

              html = html.replace(
                  'V1.1',
                  'V1.2'
              ).replace(
                  '?v=v1.1',
                  '?v=v1.2'
              )

              path.write_text(
                  html,
                  encoding='utf-8'
              )

              assert 'V1.2' in path.read_text('utf-8')

          print('PASS script/common cache hashes updated')
          print('PASS V1.2 visible version')
          PY_VERSION

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Verify protected native game data
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY_FINAL'
          from pathlib import Path
          import hashlib
          import json

          root = Path('site')

          original = json.loads(
              Path('build/original_sha256.json').read_text(
                  encoding='utf-8'
              )
          )

          current = {
              str(p.relative_to(root)):
                  hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          assert len(current) == 5623, (
              'Original file count changed',
              len(current)
          )

          assert set(original) == set(current), (
              'Original game file inventory changed'
          )

          changed = {
              name for name in original
              if original[name] != current[name]
          }

          prefix = (
              'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          )

          allowed = {
              'knight/gameasync/Data/Scripts.rxdata',
              (
                  'knight/gameasync/Data/' +
                  prefix + 'CommonEvents.rxdata'
              ),
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html',
              'knight/index.html'
          }

          assert changed == allowed, (
              'Unexpected modified files',
              sorted(changed ^ allowed)
          )

          data_prefix = (
              'knight/gameasync/Data/' + prefix
          )

          for filename in (
              'Map019.rxdata',
              'Map025.rxdata',
              'Animations.rxdata'
          ):
              relative = data_prefix + filename

              assert (
                  original[relative] == current[relative]
              ), relative

          for filename in (
              'index.html',
              'knight/index.html'
          ):
              assert 'V1.2' in (
                  root / filename
              ).read_text('utf-8')

          print('PASS six approved files changed')
          print('PASS original map database unchanged')
          print('PASS original monster abilities unchanged')
          print('PASS original four-direction map data unchanged')
          print('PASS Queen recovery/death unchanged')
          print('PASS original animation database unchanged')
          print('PASS V1.2 final data integrity')
          PY_FINAL

