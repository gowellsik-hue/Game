          old="hotButton(hot,4,'Z',90)"
          new="hotButton(hot,4,'Z',117)"

          if old in s:
              if s.count(old)!=1:
                  raise SystemExit(
                      f'Z hotbar marker count={s.count(old)}'
                  )

              s=s.replace(
                  old,
                  new,
                  1
              )

          elif new not in s:
              raise SystemExit(
                  'Z hotbar mapping missing'
              )

          p.write_text(s)

          print('DPAD_Z_F6_OK')
          PY

