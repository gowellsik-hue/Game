name: build-slknight-web.yml | V4.8 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Restore V4.7 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45799624062
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Restore original Sanctuary TBT icons
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 43244856128
          name: sanctuary-all-tbt-icons-html
          github-token: ${{ github.token }}
          path: tbt

      - name: Extract complete equipment implementation source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import tarfile
          import hashlib
          import json
          import re
          import base64

          root=Path('source')
          root.mkdir()
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          prefix='knight/gameasync/Data/'
          manifest={}

          with tarfile.open('baseline/artifact.tar','r:') as tar:
              members={
                  m.name.removeprefix('./'):m
                  for m in tar.getmembers() if m.isfile()
              }

              assert len(members)==6019,len(members)

              loader='knight/js/sl-assets-v229r115.js'
              original=tar.extractfile(members[loader]).read()
              assert original.count(b"var version='V4.7';")==1

              data_files=sorted(
                  n for n in members
                  if n.startswith(prefix) and n.endswith('.rxdata')
              )

              required=['Scripts.rxdata']+[
                  pre+n+'.rxdata'
                  for n in [
                      'Actors','Classes','Weapons','Armors',
                      'Items','System','CommonEvents','MapInfos'
                  ]
              ]

              for name in required:
                  assert prefix+name in members,name

              maps=[
                  n for n in data_files
                  if re.fullmatch(
                      re.escape(pre)+r'Map[0-9]{3}\.rxdata',
                      Path(n).name
                  )
              ]
              assert len(maps)==46,len(maps)

              web_files=[
                  n for n in members
                  if n.startswith('knight/js/') and n.endswith('.js')
              ]

              web_files+= [
                  n for n in members
                  if n in (
                      'knight/gameasync/mapping.js',
                      'knight/gameasync/bitmap-map.js'
                  )
              ]

              selected=sorted(set(data_files+web_files))
              for n in selected:
                  data=tar.extractfile(members[n]).read()
                  target=root/n
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(data)
                  manifest[n]={
                      'bytes':len(data),
                      'sha256':hashlib.sha256(data).hexdigest()
                  }

              packs=[]
              for n in sorted(members):
                  if '/assets/' in n and n.endswith('.pack'):
                      packs.append({
                          'path':n,
                          'bytes':members[n].size
                      })

              (root/'pack-index.json').write_text(
                  json.dumps(packs,indent=2),
                  encoding='utf8'
              )

          gallery=list(Path('tbt').rglob('All-TBT-Icons.html'))
          assert len(gallery)==1

          html=gallery[0].read_text('utf8')
          match=re.search(
              r'<script id="icons" type="application/json">(.*?)</script>',
              html,re.S
          )
          assert match
          icons=json.loads(match.group(1))
          assert icons['total']==5154
          assert len(icons['items'])==5154
          assert not icons['errors']

          ids=[2,20,83,1072,445,110,299,710,447,450,69,1029,2017,7]
          target=root/'ivory-icons'
          target.mkdir()

          for gid in ids:
              found=[
                  x for x in icons['items']
                  if x['id']==gid and x['pak']=='Sprite'
              ]
              assert len(found)==1,(gid,len(found))
              png=base64.b64decode(found[0]['png'].split(',',1)[1])
              assert png.startswith(b'\x89PNG\r\n\x1a\n')
              p=target/f'{gid}.png'
              p.write_bytes(png)
              manifest[str(p.relative_to(root))]={
                  'bytes':len(png),
                  'sha256':hashlib.sha256(png).hexdigest()
              }

          (root/'manifest.json').write_text(
              json.dumps(manifest,ensure_ascii=False,indent=2),
              encoding='utf8'
          )

          print('PASS V4.7 original files:',len(members))
          print('PASS native data files:',len(data_files))
          print('PASS maps:',len(maps))
          print('PASS original TBT icons:',len(ids))
          PY

      - name: Extract every native Ruby script
        shell: bash
        run: |
          set -euo pipefail
          ruby -rzlib -rjson <<'RUBY'
          rows=Marshal.load(
            File.binread(
              'source/knight/gameasync/Data/Scripts.rxdata'
            )
          )

          Dir.mkdir('source/ruby')
          index=[]

          rows.each_with_index do |row,i|
            next unless row && row[2].is_a?(String)
            name=row[1].to_s.force_encoding('UTF-8').scrub
            src=Zlib::Inflate.inflate(row[2])
            file=format('%03d.rb',i)
            File.binwrite("source/ruby/#{file}",src)
            index<<{
              index:i,
              name:name,
              file:file,
              bytes:src.bytesize
            }
          end

          File.write(
            'source/ruby-index.json',
            JSON.pretty_generate(index)
          )

          puts "PASS all native scripts: #{index.size}"
          RUBY

      - name: Verify extracted source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import hashlib

          root=Path('source')
          manifest=json.loads(
              (root/'manifest.json').read_text('utf8')
          )

          for name,info in manifest.items():
              p=root/name
              assert p.is_file(),name
              assert p.stat().st_size==info['bytes'],name
              assert hashlib.sha256(p.read_bytes()).hexdigest()==info['sha256'],name

          index=json.loads(
              (root/'ruby-index.json').read_text('utf8')
          )

          for row in index:
              assert (root/'ruby'/row['file']).stat().st_size==row['bytes']

          total=sum(p.stat().st_size for p in root.rglob('*') if p.is_file())
          assert total<450*1024*1024,total

          print('PASS source integrity')
          print('PASS source bytes:',total)
          print('PASS game files unchanged')
          PY

      - name: Upload complete source
        uses: actions/upload-artifact@v4
        with:
          name: SLKnight-V4.8-Equipment-Source
          path: source/
          compression-level: 6
          retention-days: 30
          if-no-files-found: error
