name: Deploy SLKnight Runtime Log Capture Fixed

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-slknight-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  ENGINE_REPO: white-axe/mkxp-z-libretro-emscripten
  ENGINE_REF: f0a1ff80f05dd0d1f8ca711485a5b0a601bc7502
  SITE_URL: https://gowellsik-hue.github.io/Game

jobs:
  build:
    name: Build fixed runtime logger
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Checkout frontend source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          submodules: false
          path: engine

      - name: Download existing single-thread build
        run: |
          set -e

          mkdir -p engine/nostalgist/public

          curl -L \
            --fail \
            --retry 3 \
            -H 'Cache-Control: no-cache' \
            "${SITE_URL}/mkxp-z_libretro.js?run=${GITHUB_RUN_ID}" \
            -o engine/nostalgist/public/mkxp-z_libretro.js

          curl -L \
            --fail \
            --retry 3 \
            -H 'Cache-Control: no-cache' \
            "${SITE_URL}/mkxp-z_libretro.wasm?run=${GITHUB_RUN_ID}" \
            -o engine/nostalgist/public/mkxp-z_libretro.wasm

          curl -L \
            --fail \
            --retry 3 \
            -H 'Cache-Control: no-cache' \
            "${SITE_URL}/slknight.mkxpz?run=${GITHUB_RUN_ID}" \
            -o engine/nostalgist/public/slknight.mkxpz

          test -s engine/nostalgist/public/mkxp-z_libretro.js
          test -s engine/nostalgist/public/mkxp-z_libretro.wasm
          test -s engine/nostalgist/public/slknight.mkxpz

          echo "=== EXISTING SINGLE THREAD FILES ==="

          ls -lh \
            engine/nostalgist/public/mkxp-z_libretro.js \
            engine/nostalgist/public/mkxp-z_libretro.wasm \
            engine/nostalgist/public/slknight.mkxpz

      - name: Configure frontend
        run: |
          set -e

          cat > engine/nostalgist/.env <<'EOF'
          VITE_CORE_JS_PATH=./mkxp-z_libretro.js
          VITE_CORE_WASM_PATH=./mkxp-z_libretro.wasm
          VITE_GAME_NAME=SLKnight Runtime Logger
          VITE_GAME_PATH=./slknight.mkxpz
          VITE_XP_CONTROLS=true
          VITE_HAVE_OPFS=false
          VITE_REQUIRE_OPFS=false
          EOF

      - name: Inject fixed runtime logger
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          # ==========================================================
          # index.html
          # ==========================================================

          index_path = Path(
              "engine/nostalgist/index.html"
          )

          html = index_path.read_text(
              encoding="utf-8"
          )

          html = html.replace(
              '<meta name="viewport" content="width=device-width, initial-scale=1.0" />',
              '<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />',
              1,
          )

          html = html.replace(
              '<script src="./coi-serviceworker.min.js"></script>',
              '',
              1,
          )

          html = re.sub(
              r'<script>\s*'
              r'// Send a dummy message every 5 seconds'
              r'.*?</script>',
              '',
              html,
              count=1,
              flags=re.S,
          )

          html = re.sub(
              r'<p id="user-activation-prompt"[^>]*>'
              r'\s*▶\s*</p>',
              '''
              <p
                id="user-activation-prompt"
                style="
                  display:none;
                  font-size:18px;
                  padding:14px 20px;
                  border:1px solid #888;
                  border-radius:10px;
                  background:#111;
                  color:#fff
                "
              >
                화면을 터치해 실행
              </p>
              ''',
              html,
              count=1,
              flags=re.S,
          )

          index_path.write_text(
              html,
              encoding="utf-8"
          )

          # ==========================================================
          # main.ts
          # ==========================================================

          main_path = Path(
              "engine/nostalgist/src/main.ts"
          )

          text = main_path.read_text(
              encoding="utf-8"
          )

          # ----------------------------------------------------------
          # Logger UI
          # ----------------------------------------------------------

          title_marker = '''if (GAME_NAME !== null) {
            document.title = GAME_NAME;
          }
          '''

          if text.count(title_marker) != 1:
              raise SystemExit(
                  "PATCH FAILED: title marker"
              )

          logger = r'''

          const slLines: string[] = [];

          const slBox =
            document.createElement("div");

          slBox.id = "sl-runtime-log";

          slBox.style.cssText = `
            position: fixed;
            z-index: 2147483647;
            left: 5px;
            top: 5px;
            width: calc(100vw - 10px);
            max-height: 58vh;
            overflow: hidden;
            box-sizing: border-box;
            padding: 7px;
            border: 1px solid #aaa;
            border-radius: 6px;
            background: rgba(0,0,0,.90);
            color: #fff;
            font: 11px/1.3 monospace;
            white-space: pre-wrap;
            word-break: break-all;
            pointer-events: none;
          `;

          document.body.appendChild(
            slBox
          );

          const slToString = (
            value: unknown
          ): string => {
            if (
              value instanceof Error
            ) {
              return (
                value.stack ??
                value.message
              );
            }

            if (
              typeof value ===
              "string"
            ) {
              return value;
            }

            try {
              const json =
                JSON.stringify(value);

              if (
                typeof json ===
                "string"
              ) {
                return json;
              }
            } catch {
              // ignore
            }

            return String(value);
          };

          const slLog = (
            ...values: unknown[]
          ) => {
            const line =
              values
                .map(slToString)
                .join(" ");

            slLines.push(line);

            if (
              slLines.length > 200
            ) {
              slLines.splice(
                0,
                slLines.length - 200
              );
            }

            slBox.textContent =
              [
                "SLKnight RUNTIME LOG",
                "==============================",
                ...slLines.slice(-42),
              ].join("\\n");
          };

          window.addEventListener(
            "error",
            (event) => {
              slLog(
                "[WINDOW ERROR]",
                event.message,
                event.filename,
                event.lineno,
                event.colno,
              );
            },
          );

          window.addEventListener(
            "unhandledrejection",
            (event) => {
              slLog(
                "[PROMISE ERROR]",
                event.reason,
              );
            },
          );

          slLog(
            "[BOOT] LOGGER READY"
          );

          '''

          text = text.replace(
              title_marker,
              title_marker + logger,
              1,
          )

          # ----------------------------------------------------------
          # Remove COI / threaded service-worker checks.
          # Current WASM is single threaded.
          # ----------------------------------------------------------

          secure_marker = (
              "// Multithreaded WebAssembly "
              "requires a secure context"
          )

          opfs_marker = (
              "const opfs = !HAVE_OPFS"
          )

          secure_pos = text.find(
              secure_marker
          )

          opfs_pos = text.find(
              opfs_marker,
              secure_pos,
          )

          if (
              secure_pos < 0
              or opfs_pos < 0
          ):
              raise SystemExit(
                  "PATCH FAILED: COI region"
              )

          text = (
              text[:secure_pos]
              + '''
          slLog(
            "[BOOT] SINGLE THREAD MODE"
          );

          '''
              + text[opfs_pos:]
          )

          # ----------------------------------------------------------
          # Download logging
          # ----------------------------------------------------------

          fetch_marker = (
              "const [coreJsBlob, coreWasmBlob, gameBlob, rtpBlob] "
              "= await Promise.all(["
          )

          if text.count(fetch_marker) != 1:
              raise SystemExit(
                  "PATCH FAILED: fetch marker"
              )

          text = text.replace(
              fetch_marker,
              '''
          slLog(
            "[BOOT] DOWNLOADING CORE + GAME"
          );

          '''
              + fetch_marker,
              1,
          )

          fetch_pos = text.find(
              fetch_marker
          )

          fetch_end = text.find(
              "]);",
              fetch_pos,
          )

          if fetch_end < 0:
              raise SystemExit(
                  "PATCH FAILED: fetch end"
              )

          fetch_end += 3

          text = (
              text[:fetch_end]
              + '''

          slLog(
            "[BOOT] DOWNLOAD COMPLETE",
            "game=" +
              String(
                gameBlob?.size ?? 0
              ),
            "wasm=" +
              String(
                coreWasmBlob.size
              ),
          );

          '''
              + text[fetch_end:]
          )

          # ----------------------------------------------------------
          # Emscripten stdout/stderr
          #
          # IMPORTANT:
          # Exact two-line marker verified against upstream source.
          # Do not match the entire object anymore.
          # ----------------------------------------------------------

          ems_marker = '''  emscriptenModule: {
            preRun: ['''

          if text.count(ems_marker) != 1:
              raise SystemExit(
                  "PATCH FAILED: ems marker"
              )

          ems_replacement = '''  emscriptenModule: {
            print: (...values: unknown[]) => {
              slLog(
                "[STDOUT]",
                ...values,
              );
            },

            printErr: (...values: unknown[]) => {
              slLog(
                "[STDERR]",
                ...values,
              );
            },

            quit: (
              status: unknown,
              toThrow: unknown,
            ) => {
              slLog(
                "[QUIT]",
                "status=" + String(status),
                toThrow,
              );
            },

            preRun: ['''

          text = text.replace(
              ems_marker,
              ems_replacement,
              1,
          )

          # ----------------------------------------------------------
          # Make RetroArch verbose
          # ----------------------------------------------------------

          old_libretro = (
              "libretro_log_level: "
              "import.meta.env.DEV ? 0 : 1,"
          )

          old_frontend = (
              "frontend_log_level: "
              "import.meta.env.DEV ? 0 : 1,"
          )

          if old_libretro not in text:
              raise SystemExit(
                  "PATCH FAILED: libretro log level"
              )

          if old_frontend not in text:
              raise SystemExit(
                  "PATCH FAILED: frontend log level"
              )

          text = text.replace(
              old_libretro,
              "libretro_log_level: 0,",
              1,
          )

          text = text.replace(
              old_frontend,
              "frontend_log_level: 0,",
              1,
          )

          # ----------------------------------------------------------
          # Nostalgist.prepare()
          # ----------------------------------------------------------

          prepare_marker = (
              "const nostalgist = "
              "await Nostalgist.prepare({"
          )

          if text.count(prepare_marker) != 1:
              raise SystemExit(
                  "PATCH FAILED: prepare marker"
              )

          text = text.replace(
              prepare_marker,
              '''
          slLog(
            "[BOOT] PREPARE BEGIN"
          );

          '''
              + prepare_marker,
              1,
          )

          after_prepare_marker = (
              "\n\nif (opfs !== null) {"
          )

          prepare_pos = text.find(
              prepare_marker
          )

          prepare_end = text.find(
              after_prepare_marker,
              prepare_pos,
          )

          if prepare_end < 0:
              raise SystemExit(
                  "PATCH FAILED: prepare end"
              )

          text = (
              text[:prepare_end]
              + '''

          slLog(
            "[BOOT] PREPARE COMPLETE"
          );

          '''
              + text[prepare_end:]
          )

          # ----------------------------------------------------------
          # Start + heartbeat
          # ----------------------------------------------------------

          start_marker = (
              "await nostalgist.start();"
          )

          if text.count(start_marker) != 1:
              raise SystemExit(
                  "PATCH FAILED: start marker"
              )

          start_replacement = r'''

          slLog(
            "[START] CALLING CORE"
          );

          try {
            await nostalgist.start();

            slLog(
              "[START] RETURNED",
              "status=" +
                nostalgist.getStatus(),
            );
          } catch (error) {
            slLog(
              "[START ERROR]",
              error,
            );

            throw error;
          }

          let slBeat = 0;

          const slBeatTimer =
            window.setInterval(
              () => {
                slBeat += 1;

                const canvas =
                  document.getElementById(
                    "nostalgist-canvas"
                  ) as HTMLCanvasElement | null;

                slLog(
                  "[HEARTBEAT " +
                    String(slBeat) +
                    "]",
                  "status=" +
                    nostalgist.getStatus(),
                  "canvas=" +
                    String(
                      canvas?.width ?? 0
                    ) +
                    "x" +
                    String(
                      canvas?.height ?? 0
                    ),
                  "css=" +
                    String(
                      canvas?.clientWidth ?? 0
                    ) +
                    "x" +
                    String(
                      canvas?.clientHeight ?? 0
                    ),
                );

                if (slBeat >= 20) {
                  window.clearInterval(
                    slBeatTimer
                  );
                }
              },
              2000,
            );

          '''

          text = text.replace(
              start_marker,
              start_replacement,
              1,
          )

          main_path.write_text(
              text,
              encoding="utf-8"
          )

          # ----------------------------------------------------------
          # Final source validation
          # ----------------------------------------------------------

          final_text = main_path.read_text(
              encoding="utf-8"
          )

          required = [
              "[BOOT] LOGGER READY",
              "[STDOUT]",
              "[STDERR]",
              "[QUIT]",
              "[START] CALLING CORE",
              "[HEARTBEAT ",
          ]

          for item in required:
              if item not in final_text:
                  raise SystemExit(
                      "FINAL VALIDATION FAILED: "
                      + item
                  )

          print(
              "SLKNIGHT_RUNTIME_LOG_PATCH_OK"
          )
          PY

      - name: Install packages
        working-directory: engine/nostalgist
        run: |
          set -e
          npm install

      - name: Format patched source
        working-directory: engine/nostalgist
        run: |
          set -e

          npx prettier \
            --write \
            src/main.ts \
            index.html

      - name: Type check patched source
        working-directory: engine/nostalgist
        run: |
          set -e
          npm run lint

      - name: Generate hashes and sizes
        working-directory: engine/nostalgist
        run: |
          set -e
          node update-env.ts

      - name: Build GitHub Pages version
        working-directory: engine/nostalgist
        run: |
          set -e

          npx vite build \
            --base=./

          touch dist/.nojekyll

      - name: Verify output
        run: |
          set -e

          test -s \
            engine/nostalgist/dist/index.html

          test -s \
            engine/nostalgist/dist/mkxp-z_libretro.js

          test -s \
            engine/nostalgist/dist/mkxp-z_libretro.wasm

          test -s \
            engine/nostalgist/dist/slknight.mkxpz

          grep -q \
            'src="./assets/' \
            engine/nostalgist/dist/index.html

          grep -R \
            '\[STDOUT\]' \
            engine/nostalgist/dist/assets \
            >/dev/null

          grep -R \
            '\[STDERR\]' \
            engine/nostalgist/dist/assets \
            >/dev/null

          grep -R \
            '\[START\] CALLING CORE' \
            engine/nostalgist/dist/assets \
            >/dev/null

          echo \
            'SLKNIGHT_RUNTIME_LOGGER_FIXED_OK'

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: engine/nostalgist/dist

  deploy:
    name: Deploy GitHub Pages
    needs:
      - build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
