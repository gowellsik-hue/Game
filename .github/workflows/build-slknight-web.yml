
name: V229R9 | Native Knight Skills and Midline Dpad

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-slknight-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Restore verified V229R8 deployment
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          repository: gowellsik-hue/Game
          run-id: 39096416683
          name: github-pages
          github-token: ${{ github.token }}
          path: previous

      - name: Restore full published game if artifact expired
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          if test -s previous/artifact.tar; then
            tar -xf previous/artifact.tar -C site
          else
            python3 - <<'PY_RECOVER'
          from pathlib import Path
          from urllib.request import Request,urlopen
          from urllib.parse import quote
          from concurrent.futures import ThreadPoolExecutor,as_completed
          import hashlib,json,re,time
          base='https://gowellsik-hue.github.io/Game/'
          root=Path('site')
          fixed=('index.html','COPYING-mkxp-web.txt','manifest.webmanifest','mkxp.js','mkxp.wasm','js/drive.js','js/dpad.js','js/localforage.min.js')
          def get(url):
              for i in range(5):
                  try:
                      with urlopen(Request(url,headers={'User-Agent':'SLKnight-R9','Accept-Encoding':'identity'}),timeout=75) as r:
                          return r.read()
                  except Exception:
                      if i==4:raise
                      time.sleep(i+1)
          files={'index.html':(base+'index.html',None)}
          for game in ('knight','elf'):
              for name in fixed:
                  files[game+'/'+name]=(base+game+'/'+quote(name,safe='/'),None)
              mapping=game+'/gameasync/mapping.js'
              data=get(base+mapping+'?recover=v229r9')
              p=root/mapping;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
              body=data.decode('utf8').split('var mappingArray = ',1)[1].split('];',1)[0]+']'
              for _,asset in json.loads(re.sub(r',\s*\]$',']',body)):
                  name,sep,md5=asset.partition('?h=')
                  if '.' not in Path(name).name:continue
                  if name.startswith('/') or '..' in Path(name).parts:raise RuntimeError('Unsafe path')
                  rel=game+'/gameasync/'+name
                  if rel in files:raise RuntimeError('Duplicate asset '+rel)
                  files[rel]=(base+game+'/gameasync/'+quote(name,safe='/')+('?h='+md5 if sep else ''),md5 if sep else None)
          if len(files)!=5354:raise RuntimeError('Wrong asset count: '+str(len(files)))
          def fetch(item):
              name,(url,md5)=item
              data=get(url)
              if md5 and Path(name).name not in ('mapping.js','bitmap-map.js') and hashlib.md5(data).hexdigest()!=md5:raise RuntimeError('Invalid asset MD5 '+name)
              p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          with ThreadPoolExecutor(max_workers=12) as pool:
              jobs=[pool.submit(fetch,it) for it in files.items() if not (root/it[0]).is_file()]
              for job in as_completed(jobs):job.result()
          actual={str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}
          if actual!=set(files):raise RuntimeError('Recovery incomplete')
          print('RESTORED_5354_ASSETS')
          PY_RECOVER
          fi

      - name: Verify V229R8 or V229R9 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_SOURCE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if len(files)!=5354:raise SystemExit('Invalid game inventory')
          versions={
           'knight/js/dpad.js':('1221aa34b2a2a110de039294a8f5a03e6c688cb42100bde798b5f43a0ef6d7c3','9176ec1bbd6ab11b7aaecb1bad81aa1b683635a0c7c0a85e8e274c4cafb5e734'),
           'knight/gameasync/Data/Scripts.rxdata':('5483f2541b3ac52ce4f7adb02323ee9b97ddb7ab4fddd37da352f5c31be9a4c2','63910c57235aed76d1122aca27713685c3a119d980259539b85ac3d3648c62cb'),
           'knight/gameasync/mapping.js':('ea0bc106de78268fbc92444357f3731cc21bd8dea5f27e25e7be7471b18250a8','5e2a24757e01120808b08e4e4d9b247c08e2fdb5314720f8530b1e1935604254'),
           'knight/index.html':('b980fbe54e303c986daca5813b8d7af295a4fae465a1aeace2b4c5caeb0f0300','acebaa38a336df46768f94fd71aebe156ccfff77abd266468a3e598345084124')}
          keep={
           'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata':'c1112940bc8ba843e0a7a108a09c09c00a8c952162c62b5f2119323353cb2959',
           'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap035.rxdata':'7aa9a3959547e86720a874d45ec2ec54247495f3de71c7e3ac033c340205b153'}
          if any(files.get(p)!=sha for p,sha in keep.items()):raise SystemExit('Unverified gameplay source')
          version='R8' if all(files.get(p)==v[0] for p,v in versions.items()) else 'R9' if all(files.get(p)==v[1] for p,v in versions.items()) else None
          if version is None:raise SystemExit('Unrecognized deployed source: no patch applied')
          Path('/tmp/sl_r9_version').write_text(version)
          Path('/tmp/sl_r9_before').write_text(json.dumps(files))
          Path('/tmp/sl_r9_hashes').write_text(json.dumps(versions))
          print('VERIFIED_SLKNIGHT_V229'+version)
          PY_SOURCE

      - name: Connect native skills and lower Dpad to ATK-X midpoint
        shell: bash
        run: |
          set -euo pipefail
          if test "$(cat /tmp/sl_r9_version)" = R8; then
            ruby - site <<'RUBY_PATCH'
          require 'zlib'
          require 'digest'
          site=ARGV.fetch(0)
          path=File.join(site,'knight/gameasync/Data/Scripts.rxdata')
          scripts=Marshal.load(File.binread(path))
          raise 'Unexpected script inventory' unless scripts.size==137 && scripts[134][1]=='V230 Boss Respawn 60s 180s' && scripts[135][1]=='V229R8 Skill Icon Hotbar' && scripts[136][1]=='Main'
          source=Zlib::Inflate.inflate(scripts[135][2])
          def replace_one(s,old,rep)
            raise "Expected 1 copy of #{old[0,80].inspect}; got #{s.scan(old).size}" unless s.scan(old).size==1
            s.sub(old,rep)
          end
          source=replace_one(source,"  KEYS=[84,85,73,79,80,77]\n","  KEYS=[84,85,73,79,80,77]\n  NATIVE_SWITCHES={7=>1007,8=>1008,9=>874}\n")
          anchor=<<~'FIND'.lines.map{|v|'  '+v}.join
            def self.mode(name)
          FIND
          added=<<~'RUBY_CODE'.lines.map{|v|'  '+v}.join
            def self.native_cost(id)
              return 5 if id==7
              return 10 if id==8 || id==9
              0
            end
            def self.native_ready?(a,id)
              trigger=NATIVE_SWITCHES[id]
              return false if trigger.nil? || a.nil? || !a.skill_learn?(id)
              return false if !$game_switches[367] || $game_switches[1011] || $game_switches[trigger]
              return false if a.dead?
              case id
              when 7
                a.level>=50 && a.hp>=50 && a.sp>=5
              when 8
                $game_switches[1010] && a.level>=50 && a.hp>=100 && a.sp>=10
              when 9
                $game_switches[1004] && a.hp>=100 && a.sp>=10
              else
                false
              end
            end
            def self.native_cast(slot,a,id)
              return fail_slot(slot) unless native_ready?(a,id)
              return fail_slot(slot) if $game_temp.message_window_showing || $game_temp.player_transferring
              return fail_slot(slot) if $game_system.map_interpreter.running? || $game_temp.common_event_id.to_i>0
              $game_switches[NATIVE_SWITCHES[id]]=true
              puts('SLSKILL|CAST|'+(slot+1).to_s+'|'+id.to_s)
              sync(true)
              true
            end
          RUBY_CODE
          source=replace_one(source,anchor,added+anchor)
          old=<<~'FIND'.lines.map{|v|'          '+v}.join
            data.push([id,clean(skill.icon_name),clean(skill.name),skill.sp_cost.to_i,(a.skill_can_use?(id) && (skill.scope.to_i>=3 || skill.common_event_id.to_i>0)) ? 1 : 0])
          FIND
          new=<<~'FIND'.lines.map{|v|'          '+v}.join
            native=NATIVE_SWITCHES.key?(id)
            cost=native ? native_cost(id) : skill.sp_cost.to_i
            ready=native ? native_ready?(a,id) : (a.skill_can_use?(id) && (skill.scope.to_i>=3 || skill.common_event_id.to_i>0))
            data.push([id,clean(skill.icon_name),clean(skill.name),cost,ready ? 1 : 0])
          FIND
          source=replace_one(source,old,new)
          source=replace_one(source,'    return fail_slot(slot) if skill.nil? || !a.skill_can_use?(id)',"    return fail_slot(slot) if skill.nil?\n    return native_cast(slot,a,id) if NATIVE_SWITCHES.key?(id)\n    return fail_slot(slot) unless a.skill_can_use?(id)")
          File.binwrite('/tmp/sl_r9_skill.rb',source)
          raise 'Invalid injected Ruby' unless system('ruby','-c','/tmp/sl_r9_skill.rb',out:File::NULL)
          scripts[135][1]='V229R9 Native Knight Skills'.force_encoding('UTF-8')
          scripts[135][2]=Zlib::Deflate.deflate(source)
          File.binwrite(path,Marshal.dump(scripts))
          puts "V229R9_SCRIPT_SHA #{Digest::SHA256.file(path).hexdigest}"
          RUBY_PATCH
            python3 - site <<'PY_PATCH'
          from pathlib import Path
          import hashlib,re,sys
          r=Path(sys.argv[1])/'knight'
          p=r/'js/dpad.js'
          s=p.read_text(encoding='utf-8')
          def sub1(a,b):
           global s
           if s.count(a)!=1:raise RuntimeError('Wrong layout baseline '+repr(a))
           s=s.replace(a,b,1)
          sub1('layoutSkillPad(dpad,skillbar,Math.max(1,leftW-8),Math.max(1,h-16),true,Math.min(h*0.23,100));', 'layoutSkillPad(dpad,skillbar,Math.max(1,leftW-8),Math.max(1,h-16),true,(Math.min(h*0.23,100)+Math.min(h*0.46,190))/2);')
          sub1('layoutSkillPad(dpad,skillbar,Math.max(1,leftW-8),Math.max(1,h-16),false,h*0.22);', 'layoutSkillPad(dpad,skillbar,Math.max(1,leftW-8),Math.max(1,h-16),false,h*(0.22+0.43)/2);')
          p.write_text(s,encoding='utf-8')
          rel='Data/Scripts.rxdata'; mp=r/'gameasync/mapping.js'; ms=mp.read_text(encoding='utf-8'); md5=hashlib.md5((r/'gameasync'/rel).read_bytes()).hexdigest()
          ms,n=re.subn(re.escape(rel+'?h=')+r'[0-9a-f]{32}',lambda _:rel+'?h='+md5,ms)
          if n!=1:raise RuntimeError('Mapping entry not unique')
          mp.write_text(ms,encoding='utf-8')
          idx=r/'index.html';h=idx.read_text(encoding='utf-8')
          for a,b in [('gameasync/mapping.js?v=v229r8','gameasync/mapping.js?v=v229r9'),('js/dpad.js?v=v229r8','js/dpad.js?v=v229r9')]:
           if h.count(a)!=1:raise RuntimeError('Missing html marker '+a)
           h=h.replace(a,b)
          idx.write_text(h,encoding='utf-8')
          for rel in ['js/dpad.js','gameasync/Data/Scripts.rxdata','gameasync/mapping.js','index.html']:
           v=r/rel;print('R9_SHA256',rel,hashlib.sha256(v.read_bytes()).hexdigest())
          PY_PATCH
          else
            echo V229R9_ALREADY_INSTALLED
          fi

      - name: Verify native cast triggers and no other gameplay changes
        shell: bash
        run: |
          set -euo pipefail
          node --check site/knight/js/dpad.js
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before=json.loads(Path('/tmp/sl_r9_before').read_text())
          versions=json.loads(Path('/tmp/sl_r9_hashes').read_text())
          current={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if len(current)!=5354 or current.keys()!=before.keys():raise SystemExit('Asset inventory modified')
          if any(current.get(p)!=sha[1] for p,sha in versions.items()):raise SystemExit('V229R9 checksum error')
          changed={p for p in current if before[p]!=current[p]}
          version=Path('/tmp/sl_r9_version').read_text()
          if version=='R8' and changed!=set(versions):raise SystemExit('Unexpected modified game files: '+repr(sorted(changed)))
          if version=='R9' and changed:raise SystemExit('Reapplication modified game')
          kr=root/'knight';mp=(kr/'gameasync/mapping.js').read_text(encoding='utf8')
          md5=hashlib.md5((kr/'gameasync/Data/Scripts.rxdata').read_bytes()).hexdigest()
          if mp.count('Data/Scripts.rxdata?h='+md5)!=1:raise SystemExit('Scripts mapping broken')
          html=(kr/'index.html').read_text(encoding='utf8')
          for token in ('gameasync/mapping.js?v=v229r9','js/dpad.js?v=v229r9'):
              if html.count(token)!=1:raise SystemExit('Cache marker not updated')
          js=(kr/'js/dpad.js').read_text(encoding='utf8')
          if 'Math.min(h*0.23,100)+Math.min(h*0.46,190)' not in js or 'h*(0.22+0.43)/2' not in js:raise SystemExit('Wrong Dpad position')
          print('PASS_5354_FILES_ONLY_4_KNIGHT_UI_AND_SKILL_ASSETS_CHANGED',len(changed))
          PY_FINAL
          ruby - <<'RUBY_VERIFY'
          require 'zlib'
          module RPG;class CommonEvent;end;class EventCommand;end;class MoveRoute;end;class MoveCommand;end;class AudioFile;end;end
          scripts=Marshal.load(File.binread('site/knight/gameasync/Data/Scripts.rxdata'))
          raise 'Altered boss patch' unless scripts.size==137 && scripts[134][1]=='V230 Boss Respawn 60s 180s' && scripts[135][1]=='V229R9 Native Knight Skills' && scripts[136][1]=='Main'
          ruby=Zlib::Inflate.inflate(scripts[135][2]);File.binwrite('/tmp/sl_r9_verify.rb',ruby)
          raise 'Ruby syntax' unless system('ruby','-c','/tmp/sl_r9_verify.rb',out:File::NULL)
          raise 'Missing native cast routing' unless ruby.include?('NATIVE_SWITCHES={7=>1007,8=>1008,9=>874}') && ruby.include?('$game_switches[NATIVE_SWITCHES[id]]=true')
          base='site/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata'
          events=Marshal.load(File.binread(base))
          {7=>[846,1007,1006],8=>[966,1008,1009],9=>[848,874,872]}.each do |id,(event_id,switch,buff)|
            e=events[event_id]
            raise 'Wrong event switch' unless e.instance_variable_get(:@trigger)==1 && e.instance_variable_get(:@switch_id)==switch
            list=e.instance_variable_get(:@list)
            raise 'Buff status not activated' unless list.any?{|x|x.instance_variable_get(:@code)==121 && x.instance_variable_get(:@parameters)==[buff,buff,0]}
            raise 'Buff icon refresh missing' unless list.any?{|x|x.instance_variable_get(:@code)==355 && x.instance_variable_get(:@parameters).join.include?('$KeyIcon.ShowIcon')}
            raise 'Cast switch never reset' unless list.any?{|x|x.instance_variable_get(:@code)==121 && x.instance_variable_get(:@parameters)==[switch,switch,1]}
            puts "PASS_NATIVE_SKILL_#{id}_EVENT_#{event_id}_SWITCH_#{switch}"
          end
          RUBY_VERIFY

      - name: Upload verified game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
