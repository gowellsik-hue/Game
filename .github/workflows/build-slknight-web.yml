# FILE: .github/workflows/build-slknight-web.yml
# REVIEW ONLY: V276.6 version unchanged pending user's approval.
# BASE: successful V241, run 41293648580 (5603 files).
# SOURCE: ordinary Death Knight Map019 EV18, NOT colosseum Map016 EV8.
# TARGET: Tower of Insolence 2F, Map025 EV29, 5 original functional pages.
# COMBAT: all 217 page-2 native commands + 17 original attack registrations.
# ATTACK: 5 normal / 1 strong / 1 magic; 25 native animation frames (11 + 14).
# DEATH: 4-direction 17-frame native animation, CE371 native level-up callback.
# REWARD: original CE691 245-command structure retained; 20 approved queen drops.
# RESPAWN: one 4300 native event wait; no extra 200 wait.
# SAFETY: original Scripts.rxdata, Map016, Map019, all 1061 CEs unchanged.
# GRAPHICS: original Sanctuary V247 sheets, NO Death Knight sprite copy, no update hooks.
name: build-slknight-web.yml | V276.6 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Restore verified original V241 site
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41293648580
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Restore original Sanctuary V247 character sheets
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41382471524
          name: github-pages
          github-token: ${{ github.token }}
          path: sprite-baseline

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Prepare original assets and checksum inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          mkdir -p site build build/v247
          test -s baseline/artifact.tar
          test -s sprite-baseline/artifact.tar
          tar -xf baseline/artifact.tar -C site
          mkdir -p build/v247/knight/gameasync/Graphics/Characters
          for name in Walk Idle Attack AltAttack Spell Hit Death; do
            tar -xf sprite-baseline/artifact.tar -C build/v247 \
              "./knight/gameasync/Graphics/Characters/SLZenith${name}.png"
          done
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          assert len(before)==5603,('Expected original V241',len(before))
          assert (root/'knight/gameasync/Data/Scripts.rxdata').is_file()
          assert (root/'knight/assets/map-047-v241.pack').is_file()
          assert not any('/SLDK2F' in s for s in before)
          Path('build/original_sha256.json').write_text(json.dumps(before),encoding='utf-8')
          print('PASS V241 original 5603 files and V247 sprite source')
          PY

      - name: Create native Sanctuary queen character and combat animation images
        shell: bash
        run: |
          set -euo pipefail
          cat > build/build_art.py <<'QUEEN_ART'
          from pathlib import Path
          from PIL import Image
          import hashlib, json, os
          SRC=Path(os.environ.get('ZQ_SOURCE_SHEETS','build/v247/knight/gameasync/Graphics/Characters'))
          DST=Path(os.environ.get('ZQ_REVIEW_DIR','build/zq_review'))/'Graphics'
          (DST/'Animations').mkdir(parents=True,exist_ok=True)
          (DST/'Characters').mkdir(parents=True,exist_ok=True)
          EXPECTED={
            'Walk':('2a2ba621711dd02d754a7e5cd56954e4045c8609e9781e72a914bf5cec231cb4',12),
            'Idle':('dc5d453681ba72f148bc5341d847c6baa007d448d223162a6fe857feffb1a4d0',11),
            'Attack':('34fc818726622d37e5d93d31a805738ef283f87eef3d33ec46cd772fee15a425',13),
            'AltAttack':('ee7664745495d2de0fa7ab7e132cbcedc525a3aa7c4537776b51927968a4dd90',14),
            'Spell':('ffe2ae5755e7c3ed4a25cd70fa84afdff78069c5052ab6f20939d7c9849b2749',14),
            'Hit':('9c2eaa2eb3f22a60266a4a8e0f6793a97592ce35b847d0469e2ee32190fa40e4',2),
            'Death':('e5e59ced0d42ccf0f1e99ffa7bb8b3f7f4e1c80f3d880c0875d122c039ec009c',17)
          }
          sheets={}
          for key,(sha,n) in EXPECTED.items():
           p=SRC/('SLZenith'+key+'.png')
           assert p.exists() and hashlib.sha256(p.read_bytes()).hexdigest()==sha,key
           im=Image.open(p).convert('RGBA')
           assert im.width%n==0 and im.height%4==0,(key,im.size)
           sheets[key]=(im,im.width//n,im.height//4,n)
          CW=max(v[1] for v in sheets.values());CH=max(v[2] for v in sheets.values())
          assert (CW,CH)==(168,144),(CW,CH)

          def crop(bank,d,i):
           im,w,h,n=sheets[bank];assert 0<=d<4 and 0<=i<n
           return im.crop((i*w,d*h,(i+1)*w,(d+1)*h))

          def stamp(canvas,cell,box,destx,desty,foot=False):
           bw,bh=box; offsetx=(bw-cell.width)//2
           offsety=(bh-cell.height) if foot else (bh-cell.height)//2
           canvas.alpha_composite(cell,(destx+offsetx,desty+offsety))

          # Native 4 by 4 character layout; no custom update overrides.
          walk=Image.new('RGBA',(CW*4,CH*4))
          for d in range(4):
           for j,i in enumerate([0,3,6,9]):
            stamp(walk,crop('Walk',d,i),(CW,CH),j*CW,d*CH,foot=True)
          walk.save(DST/'Characters'/'SLZQWalk.png',optimize=True)
          death_charset=Image.new('RGBA',(CW*4,CH*4))
          for d in range(4):
           for j,i in enumerate([0,4,8,16]):
            stamp(death_charset,crop('Death',d,i),(CW,CH),j*CW,d*CH,foot=True)
          death_charset.save(DST/'Characters'/'SLZQDeath.png',optimize=True)
          blank=Image.new('RGBA',(CW*4,CH*4))
          blank.save(DST/'Characters'/'SLZQBlank.png',optimize=True)

          assets={}
          for kind in ('normal','strong','magic','death'):
           frames={'normal': [('Idle',i) for i in range(11)]+[('Attack',i) for i in range(13)]+[('Attack',12)],
           'strong':[('Idle',i) for i in range(11)]+[('AltAttack',i) for i in range(14)],
           'magic':[('Idle',i) for i in range(11)]+[('Spell',i) for i in range(14)],
           'death':[('Death',i) for i in range(17)]}[kind]
           assert len(frames)==(17 if kind=='death' else 25)
           for di,dir_id in enumerate((2,4,6,8)):
            name=f'SLZQ_{kind}_D{dir_id}'
            atlas=Image.new('RGBA',(960,960))
            for i,(bank,j) in enumerate(frames):
             c=crop(bank,di,j)
             stamp(atlas,c,(192,192),(i%5)*192,(i//5)*192)
            atlas.save(DST/'Animations'/f'{name}.png',optimize=True)
            assert atlas.size==(960,960)
            assets[name]={'frames':len(frames),'dir':dir_id,'kind':kind}
          assert len(assets)==16
          (DST/'manifest.json').write_text(json.dumps(assets,ensure_ascii=False,indent=2))
          print('PASS original Sanctuary sprite SHA checks, 4-dir native walk, 16 native 25/17-frame animation atlases, no DK pixels')

          QUEEN_ART
          ZQ_SOURCE_SHEETS=build/v247/knight/gameasync/Graphics/Characters \
            ZQ_REVIEW_DIR=build/zq_review python3 build/build_art.py

      - name: Build queen from Map019 EV18 and original common events
        shell: bash
        run: |
          set -euo pipefail
          cat > build/clone_queen.rb <<'QUEEN_NATIVE'
          # encoding: UTF-8
          # 검토용 코드: Map019 EV18 일반 데스나이트 -> Map025 EV29 제니스 퀸
          # 기존 워크플로, 원본 Map019, 원본 공통이벤트 및 엔진 수정 없음.
          require 'zlib'
          require 'digest'
          require 'fileutils'
          require 'json'
          module RPG
           class Map;end
           class Event
            class Page
             class Condition;end
             class Graphic;end
            end
           end
           class EventCommand;end
           class CommonEvent;end
           class AudioFile;end
           class MoveRoute;end
           class MoveCommand;end
           class Animation
            class Frame;end
            class Timing;end
           end
           class Tileset;end
          end
          class Table
           def self._load(bytes)
            x=allocate;x.instance_variable_set(:@raw,bytes);x
           end
           def _dump(level=0);@raw;end
          end
          class Tone
           def self._load(bytes)
            x=allocate;x.instance_variable_set(:@raw,bytes);x
           end
           def _dump(level=0);@raw;end
          end
          class Color<Tone;end

          def iv(o,k);o.instance_variable_get('@'+k.to_s);end
          def put(o,k,v);o.instance_variable_set('@'+k.to_s,v);end
          def clone(o);Marshal.load(Marshal.dump(o));end
          def ck(v,msg);raise(msg) unless v;end
          def txt(v);v.to_s.dup.force_encoding('UTF-8').scrub;end

          def ec(code,parameters=[],indent=0)
           c=RPG::EventCommand.allocate
           put(c,:code,code);put(c,:parameters,parameters);put(c,:indent,indent);c
          end

          def new_ce(src,id,name,list,trigger=0,switch=1)
           ce=RPG::CommonEvent.allocate
           src.instance_variables.each do |field|
            next if [:@id,:@name,:@list,:@trigger,:@switch_id].include?(field)
            ce.instance_variable_set(field,clone(src.instance_variable_get(field)))
           end
           put(ce,:id,id);put(ce,:name,name);put(ce,:list,list)
           put(ce,:trigger,trigger);put(ce,:switch_id,switch)
           ce
          end

          def new_page(src,image,pattern=0)
           p=RPG::Event::Page.allocate
           src.instance_variables.each do |field|
            next if [:@graphic,:@list].include?(field)
            p.instance_variable_set(field,clone(src.instance_variable_get(field)))
           end
           graphic=RPG::Event::Page::Graphic.allocate
           g=iv(src,:graphic)
           g.instance_variables.each do |field|
            next if [:@character_name,:@pattern].include?(field)
            graphic.instance_variable_set(field,clone(g.instance_variable_get(field)))
           end
           put(graphic,:character_name,image)
           put(graphic,:pattern,pattern)
           put(p,:graphic,graphic)
           p
          end

          GAME_ROOT=ENV.fetch('ZQ_GAME_ROOT','site/knight/gameasync')
          REVIEW_ROOT=ENV.fetch('ZQ_REVIEW_DIR','build/zq_review')
          ROOT=GAME_ROOT+'/Data/'
          PRE='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          MAP19=ROOT+PRE+'Map019.rxdata'
          MAP25=ROOT+PRE+'Map025.rxdata'
          COMMON=ROOT+PRE+'CommonEvents.rxdata'
          ANIMATIONS=ROOT+PRE+'Animations.rxdata'
          SCRIPTS=ROOT+'Scripts.rxdata'
          paths=[MAP19,MAP25,COMMON,ANIMATIONS,SCRIPTS]
          before=paths.map{|p|[p,Digest::SHA256.file(p).hexdigest]}.to_h
          map19=Marshal.load(File.binread(MAP19))
          map25=Marshal.load(File.binread(MAP25))
          common=Marshal.load(File.binread(COMMON))
          anims=Marshal.load(File.binread(ANIMATIONS))
          source=iv(map19,:events).fetch(18)
          native=iv(source,:pages)
          ck(txt(iv(source,:name)).include?('데스나이트'),'Wrong ordinary DK source')
          ck(native.length==5,'Ordinary DK must have 5 pages')
          ck([22,1,217,2,11]==native.map{|p|iv(p,:list).length},'Original page lengths mismatch')
          ck([106,122,111,202].all?{|c|iv(native[0],:list).any?{|x|iv(x,:code)==c}},'Native spawn behavior not found')
          ck(iv(iv(native[1],:condition),:switch1_id)==163,'Native detection switch missing')
          ck(iv(native[3],:list)[0].instance_variable_get(:@parameters)==[691],'Native DK death CE changed')
          ck(iv(native[4],:list).select{|c|iv(c,:code)==106}.map{|c|iv(c,:parameters)}==[[200],[4300]],'Original death waits changed')
          ck(common.length==1061,'Wrong original CEs')
          ck(anims.length==908,'Wrong original animations')
          ck(!iv(map25,:events).key?(29),'Queen already present in source')

          HP=4988;ATTACK=5991;MAGIC=5992;SPAWN=5994;AGGRO=5995
          SPAWN_ROLL=5986;ATTACK_ROLL=5987
          CE={hellfire:1061,hit:1062,gold:1063,cycle:1064,reward:1065,damage:1066,death_fx:1067}.freeze
          DIRS=[2,4,6,8].freeze

          # Original map's actual passability table: direct RPG::Map and RPG::Tileset data.
          tilesets=Marshal.load(File.binread(ROOT+PRE+'Tilesets.rxdata'))
          tileset=tilesets.fetch(iv(map25,:tileset_id))
          def table_info(t)
           bytes=iv(t,:raw)
           dim,x,y,z=bytes.unpack('V4')
           ck((1..3).include?(dim),'Invalid Table dimension')
           [x,y,z,bytes.byteslice(16,bytes.bytesize-16).unpack('s<*')]
          end
          mw,mh,mz,mvals=table_info(iv(map25,:data))
          pw,ph,pz,pvals=table_info(iv(tileset,:passages))
          qw,qh,qz,qvals=table_info(iv(tileset,:priorities))
          ck([mw,mh]==[iv(map25,:width),iv(map25,:height)],'Map data layout differs')
          def tab3(data,xsize,ysize,x,y,z)
           data[x+y*xsize+z*xsize*ysize]
          end

          def passable_tile?(x,y,dir,mw,mh,mvals,pvals,qvals)
           return false if x<1 || y<1 || x>=mw-1 || y>=mh-1
           bit = (1 << (dir/2-1)) & 15
           (2).downto(0) do |z|
            tile=tab3(mvals,mw,mh,x,y,z)
            return false if tile.nil? || pvals[tile].nil? || qvals[tile].nil?
            return false if pvals[tile]&bit!=0 || pvals[tile]&15==15
            return true if qvals[tile]==0
           end
           true
          end
          occupied=iv(map25,:events).values.map{|e|[iv(e,:x),iv(e,:y)]}
          ref=iv(map25,:events).fetch(11)
          sx=iv(ref,:x);sy=iv(ref,:y)
          candidates=[]
          (1..12).each do |radius|
           (-radius..radius).each do |dy|
            (-radius..radius).each do |dx|
             next unless [dx.abs,dy.abs].max==radius
             x=sx+dx;y=sy+dy
             next if occupied.include?([x,y])
             next unless DIRS.any? do |dir|
              nx=x+(dir==6 ? 1 : dir==4 ? -1 : 0)
              ny=y+(dir==2 ? 1 : dir==8 ? -1 : 0)
              passable_tile?(x,y,dir,mw,mh,mvals,pvals,qvals) &&
              passable_tile?(nx,ny,10-dir,mw,mh,mvals,pvals,qvals)
             end
             candidates<<[x,y]
            end
           end
          end
          spawn=[]
          candidates.each do |xy|
           next unless spawn.all?{|old| (xy[0]-old[0]).abs+(xy[1]-old[1]).abs>=4}
           spawn<<xy
           break if spawn.size==3
          end
          ck(spawn.size==3,'No three verified passable spawn points')

          # Page 0: preserve all 22 native commands, adapting only IDs and 3 positions.
          p0=new_page(native[0],'SLZQWalk')
          put(p0,:move_speed,2)
          list0=iv(native[0],:list).each_with_index.map do |src,i|
           code=iv(src,:code);p=clone(iv(src,:parameters));ind=iv(src,:indent)
           if code==122 && p[0]==259 && p[1]==259
            p[0]=SPAWN_ROLL;p[1]=SPAWN_ROLL
           elsif code==111 && p[0]==1 && p[1]==259
            p[1]=SPAWN_ROLL
           elsif code==202 && [3,7,11].include?(i)
            k={3=>0,7=>1,11=>2}.fetch(i)
            p=[0,0,*spawn[k],0]
           elsif code==121 && p==[163,163,0]
            p=[SPAWN,SPAWN,0]
           end
           ec(code,p,ind)
          end
          put(p0,:list,list0)
          ck(list0.size==22 && list0.map{|c|iv(c,:code)}==iv(native[0],:list).map{|c|iv(c,:code)},'Spawn command order changed')

          # Page 1: keep range-detection movement script; isolate only global switch IDs.
          p1=new_page(native[1],'SLZQWalk')
          put(p1,:move_speed,2)
          put(iv(p1,:condition),:switch1_id,SPAWN)
          route=iv(p1,:move_route)
          cmds=iv(route,:list)
          ck(cmds.map{|c|iv(c,:code)}==[9,45,0],'Ordinary detection route changed')
          ck(txt(iv(cmds[1],:parameters)[0])=='범위(10,728,1)','Original detection command changed')
          put(cmds[1],:parameters,["범위(10,#{AGGRO},1)"])
          put(p1,:list,iv(native[1],:list).map{|c|clone(c)})

          # Page 2: EXACT 217 entries in EXACT native order, including all 17 registrations.
          p2=new_page(native[2],'SLZQWalk')
          put(iv(p2,:condition),:switch1_id,AGGRO)
          put(p2,:move_speed,2)
          reg=0
          list2=iv(native[2],:list).map do |src|
           code=iv(src,:code);p=clone(iv(src,:parameters));ind=iv(src,:indent)
           if code==355 && p[0].is_a?(String) && p[0].b.include?('SLMonsterAttackContext.register('.b)
            ck(txt(p[0])=='SLMonsterAttackContext.register(133,$game_map.map_id,18) unless $game_switches[133]','Unexpected DK register code')
            p=["SLMonsterAttackContext.register(#{ATTACK},$game_map.map_id,29) unless $game_switches[#{ATTACK}]"]
            reg+=1
           elsif code==355 && p[0].is_a?(String) && p[0].b.include?('drawMHP'.b)
            p=['$m.drawMHP("제니스 퀸",$game_variables[4988],52,2)']
           elsif code==122 && p[0]==276 && p[1]==276
            p[0]=HP;p[1]=HP
           elsif code==111 && p[0]==1 && p[1]==276
            p[1]=HP
           elsif code==121 && p[0]==p[1] && p[0]==133
            p[0]=ATTACK;p[1]=ATTACK
           end
           ec(code,p,ind)
          end
          ck(reg==17,'17 attack registrations not preserved')
          ck(list2.size==217,'Combat graph lost commands')
          ck(list2.each_with_index.all?{|c,i| [iv(c,:code),iv(c,:indent)]==[iv(iv(native[2],:list)[i],:code),iv(iv(native[2],:list)[i],:indent)]},'Combat code/indent changed')
          ck(list2.count{|c|iv(c,:code)==355 && txt(iv(c,:parameters)[0]).include?('SLMonsterAttackContext.register')}==17,'Attack registrations changed')
          put(p2,:list,list2)

          # Page 3: native death-page code count, trigger and condition, private reward.
          p3=new_page(native[3],'SLZQBlank')
          put(p3,:move_speed,2)
          dc=iv(p3,:condition)
          put(dc,:variable_id,HP);put(dc,:variable_value,52)
          put(p3,:list,[ec(117,[CE[:reward]]),ec(0,[])])

          # Page 4: native post-death structure, ONE 4300 wait, fixed respawn.
          # Original general DK respawn also returns to a fixed tile. Keep that behavior.
          # SPAWN remains on so page 0 does not add a second 600-frame delay.
          p4=new_page(native[4],'SLZQDeath',3)
          put(p4,:move_speed,2)
          post=[
           ec(355,['h=$game_system.instance_variable_get(:@slv230_defeated); h={} if h.nil?; (h[25]||={})[29]=true; $game_system.instance_variable_set(:@slv230_defeated,h)']),
           ec(122,[483,483,0,0,1]),
           ec(135,[1]),
           ec(106,[4300]),
           ec(202,[0,0,*spawn[0],0]),
           ec(122,[HP,HP,0,0,0]),
           ec(121,[AGGRO,AGGRO,1]),
           ec(121,[SPAWN,SPAWN,0]),
           ec(123,['A',1]),
           ec(0,[])
          ]
          put(p4,:list,post)
          ck(post.select{|c|iv(c,:code)==106}.map{|c|iv(c,:parameters)}==[[4300]],'Extra post-death wait')

          # Build a NEW boss event. Never copy the original DK graphic objects.
          queen=RPG::Event.allocate
          source.instance_variables.each do |field|
           next if [:@id,:@name,:@x,:@y,:@pages].include?(field)
           queen.instance_variable_set(field,clone(source.instance_variable_get(field)))
          end
          put(queen,:id,29);put(queen,:name,'제니스 퀸')
          put(queen,:sl_level,60)
          put(queen,:x,spawn[0][0]);put(queen,:y,spawn[0][1])
          put(queen,:pages,[p0,p1,p2,p3,p4])

          # Original RGSS renderer advances RPG::Animation every second Graphics tick.
          # 25 native animation frames and CE waits 11+14 both last 50 rendered ticks.
          # Preserve original animation timing without touching engine update methods.
          def anim_table(cell_index)
           data=[2,1,8,1,8].pack('V5') +
                [cell_index,0,0,100,0,0,255,0].pack('s<*')
           ck(data.bytesize==36,'Malformed RPG::Table 2x1x8 cell bytes');x=Table.allocate;put(x,:raw,data);x
          end

          def new_animation(src,id,name,bank,dir,count)
           obj=RPG::Animation.allocate
           src.instance_variables.each do |field|
            next if [:@id,:@name,:@animation_name,:@frame_max,:@frames,:@timings].include?(field)
            obj.instance_variable_set(field,clone(src.instance_variable_get(field)))
           end
           put(obj,:id,id)
           put(obj,:name,name)
           put(obj,:animation_name,"SLZQ_#{bank}_D#{dir}")
           put(obj,:frame_max,count)
           put(obj,:timings,[])
           frames=Array.new(count) do |i|
            frame=RPG::Animation::Frame.allocate
            put(frame,:cell_max,1)
            put(frame,:cell_data,anim_table(i))
            frame
           end
           put(obj,:frames,frames)
           obj
          end

          attack_animation={normal:{},strong:{},magic:{}}
          death_animation={}
          [:normal,:strong,:magic].each_with_index do |kind,k|
           DIRS.each_with_index do |dir,d|
            id=908+k*4+d
            name="제니스퀸 #{kind} #{dir}"
            anims<<new_animation(anims.fetch(659),id,name,kind,dir,25)
            ck(iv(anims.fetch(id),:frame_max)==25,'Wrong attack animation frame count')
            attack_animation.fetch(kind)[dir]=id
           end
          end
          DIRS.each_with_index do |dir,d|
           id=920+d
           anims<<new_animation(anims.fetch(659),id,"제니스퀸 사망 #{dir}",:death,dir,17)
           death_animation[dir]=id
          end
          ck((908..923).all?{|i|anims[i] && iv(anims[i],:id)==i},'Native animation indices were not consecutive')

          # Attack/defense and magic CEs: preserve native order and clone private IDs.
          # CE31 original Hellfire receives a private magic switch.
          list31=iv(common.fetch(31),:list).map do |src|
           p=clone(iv(src,:parameters));code=iv(src,:code)
           p=[MAGIC,MAGIC,1] if code==121 && p==[135,135,1]
           ec(code,p,iv(src,:indent))
          end
          c31=new_ce(common.fetch(31),CE[:hellfire],'[ZQ] 전용 헬파이어',list31,2,MAGIC)

          list57=iv(common.fetch(57),:list).map{|c|clone(c)}
          c57=new_ce(common.fetch(57),CE[:hit],'[ZQ] 원본 명중·방어 계산',list57)

          list103=iv(common.fetch(103),:list).map do |src|
           code=iv(src,:code);p=clone(iv(src,:parameters))
           if code==122 && p==[333,333,0,2,200,400]
            p=[333,333,0,2,64800,151200]
           elsif code==122 && p==[333,333,3,1,3]
            p=[333,333,1,0,0] # no accidental actor/item multiplier
           end
           ec(code,p,iv(src,:indent))
          end
          c103=new_ce(common.fetch(103),CE[:gold],'[ZQ] 아데나',list103)

          # CE901 has 55 entries, including TWO source attack sounds. Keep the opcodes.
          list901=iv(common.fetch(901),:list)
          ck(list901.length==55,'Source CE901 changed')
          new901=list901.each_with_index.map do |src,index|
           code=iv(src,:code);p=clone(iv(src,:parameters));ind=iv(src,:indent)
           if code==122 && p==[26,26,0,2,0,6]
            p=[26,26,0,1,ATTACK_ROLL]  # reuse CE179's SINGLE draw
           elsif code==111 && index==30
            ck(p==[0,386,0],'Source physical selector moved')
            p=[1,ATTACK_ROLL,0,0,0]   # roll 0 strong / all others normal
           elsif code==122 && p==[26,26,0,0,35]
            p=[26,26,0,0,100]        # strong damage
           elsif code==122 && p==[26,26,0,0,70]
            p=[26,26,0,0,50]         # normal damage
           elsif code==121 && p==[135,135,0]
            p=[MAGIC,MAGIC,0]
           elsif code==117 && p==[57]
            p=[CE[:hit]]
           elsif code==250 && txt(iv(p[0],:name))=='데스나이트 공격'
            audio=clone(p[0]);put(audio,:name,'검');p=[audio] # verified native SE, 250 preserved
           end
           ec(code,p,ind)
          end
          ck(new901.size==list901.size,'Original CE901 command count changed')
          ck(new901.each_with_index.all?{|c,i|[iv(c,:code),iv(c,:indent)]==[iv(list901[i],:code),iv(list901[i],:indent)]},'Original CE901 structure changed')
          c901=new_ce(common.fetch(901),CE[:damage],'[ZQ] 공격 판정',new901)

          # CE179 original START -> WAIT -> DAMAGE -> WAIT -> SWITCH OFF.
          # Extend only the image selector at the front, then run the native pipeline.
          def native_start_script(ids)
           arr=ids.sort.map{|dir,id|"#{dir}=>#{id}"}.join(',')
           "SLMonsterAttackContext.start(5991,{#{arr}},\"SLZQWalk\",50)"
          end
          list179=[
           ec(122,[ATTACK_ROLL,ATTACK_ROLL,0,2,0,6],0),
           ec(111,[1,ATTACK_ROLL,0,0,0],0),
           ec(355,[native_start_script(attack_animation[:strong])],1),
           ec(411,[],0),
           ec(111,[1,ATTACK_ROLL,0,1,0],1),
           ec(355,[native_start_script(attack_animation[:magic])],2),
           ec(411,[],1),
           ec(355,[native_start_script(attack_animation[:normal])],2),
           ec(412,[],1),ec(412,[],0),
           ec(106,[11]),
           ec(117,[CE[:damage]]),
           ec(106,[14]),
           ec(121,[ATTACK,ATTACK,1]),
           ec(0,[])
          ]
          c179=new_ce(common.fetch(179),CE[:cycle],'[ZQ] 3종 네이티브 공격 주기',list179,2,ATTACK)

          # Death uses native RPG:Animation code207. No Sprite_Character.update patch.
          listdeath=[ec(117,[371])]  # Native CE105 calls CE371 before its effect.
          DIRS.each do |dir|
           listdeath << ec(111,[12,"$game_map.events[29].direction == #{dir}"],0)
           listdeath << ec(207,[29,death_animation.fetch(dir)],1)
           listdeath << ec(412,[],0)
          end
          listdeath << ec(106,[17])
          listdeath << ec(0,[])
          cdeath=new_ce(common.fetch(105),CE[:death_fx],'[ZQ] 17프레임 사망',listdeath)

          # CE691 native reward graph: maintain all 245 commands in native order.
          # Only the originally approved queen-specific values and native-call destinations differ.
          drops=[[:item,35,30],[:item,34,20],[:item,33,100],[:item,37,100],
                 [:armor,169,50],[:item,116,3],[:item,32,100],[:item,38,100],
                 [:armor,289,30],[:weapon,123,30],[:weapon,41,50],[:item,3,200],
                 [:weapon,1,50],[:armor,72,50],[:item,2,250],[:armor,303,2],
                 [:item,43,100],[:armor,280,30],[:armor,12,50],[:armor,492,3]]
          loot="#{drops.inspect}.each do |kind,id,chance|\n"+
               "  next unless rand(1000) < chance\n"+
               "  case kind\n"+
               "  when :item then $game_party.gain_item(id,1)\n"+
               "  when :weapon then $game_party.gain_weapon(id,1)\n"+
               "  when :armor then $game_party.gain_armor(id,1)\n"+
               "  end\nend"
          original_reward=iv(common.fetch(691),:list)
          ck(original_reward.size==245,'Native CE691 reward graph has changed')
          ck(iv(original_reward[4],:parameters)==[103], 'Native CE103 gold link missing')
          ck(iv(original_reward[241],:parameters)==[105], 'Native CE105 death link missing')
          ck(iv(original_reward[242],:code)==355, 'Native loot command missing')
          ck(iv(original_reward[243],:parameters)==['A',0], 'Native death A switch missing')
          rewards=original_reward.each_with_index.map do |src,i|
           code=iv(src,:code);par=clone(iv(src,:parameters));ind=iv(src,:indent)
           case i
           when 4
            par=[CE[:gold]]
           when 5
            ck(code==122,'Native EXP assignment opcode changed')
            par=[1926,1926,0,0,43212]
           when 6,7
            ck(code==122,'Native EXP auxiliary opcode changed')
            par=[1926,1926,1,0,0]
           when 13,14
            # Original Arka-only item announcement is invalid for the queen.
            ck([355,655].include?(code),'Native Arka announcement moved')
            par=['nil']
           when 241
            par=[CE[:death_fx]]
           when 242
            par=[loot]
           end
           ec(code,par,ind)
          end
          ck(rewards.size==245,'Native reward commands were truncated')
          ck(rewards.each_with_index.all?{|c,i|
           [iv(c,:code),iv(c,:indent)] ==
           [iv(original_reward[i],:code),iv(original_reward[i],:indent)]
          },'Native reward command order changed')
          creward=new_ce(common.fetch(691),CE[:reward],'[ZQ] 독립 보상·사망',rewards)

          # Append exactly 7 independent private CEs and one new Map025 boss.
          newces=[c31,c57,c103,c179,creward,c901,cdeath]
          newces.each do |ce|
           ck(iv(ce,:id)==common.length,'Common-event ID collision')
           common<<ce
          end
          iv(map25,:events)[29]=queen

          # STATIC VERIFICATION BEFORE ANY OUTPUT.
          ck(iv(queen,:pages).length==5,'Five source pages not preserved')
          ck(iv(queen,:pages).all?{|page|iv(page,:move_speed)==2},'Move speed is inconsistent across pages')
          ck(iv(queen,:pages).map{|p|iv(p,:list).length}==[22,1,217,2,post.size],'Wrong page graph')
          ck(list2.count{|c|iv(c,:code)==355 && txt(iv(c,:parameters)[0]).include?('SLMonsterAttackContext.register')}==17,'Lost native attack registers')
          ck(list0.select{|c|iv(c,:code)==202}.size==3,'Initial random spawns absent')
          ck(post.select{|c|iv(c,:code)==202}.size==1,'Fixed native respawn absent')
          ck(post.count{|c|iv(c,:code)==106}==1 && iv(post[3],:parameters)==[4300],'Death wait is not one 4300')
          ck(iv(p0,:list)[0].instance_variable_get(:@parameters)==[600],'Initial native 600 spawn wait absent')
          ck(iv(iv(p2,:condition),:switch1_id)==AGGRO,'Combat detection switch wrong')
          ck(iv(iv(p3,:condition),:variable_id)==HP && iv(iv(p3,:condition),:variable_value)==52,'Death HP wrong')
          ck(iv(iv(p4,:condition),:self_switch_ch)=='A','Post-death A condition lost')
          ck([:normal,:strong,:magic].all?{|kind|attack_animation[kind].size==4},'Some attack directions missing')
          ck(death_animation.size==4,'Some death directions missing')
          ck(list179.count{|c|iv(c,:code)==355}==3,'Attack kind images not all started')
          ck(list179.select{|c|iv(c,:code)==106}.map{|c|iv(c,:parameters)}==[[11],[14]],'Damage must occur after 11 idle frames')
          ck(new901.map{|c|[iv(c,:code),iv(c,:indent)]}==list901.map{|c|[iv(c,:code),iv(c,:indent)]},'Native attack order or depth altered')
          ck(!Marshal.dump(queen).b.include?('데스나이트'.b),'DK graphical event reference remains')
          ck(iv(p4,:graphic).instance_variable_get(:@pattern)==3,'Corpse final frame not selected')
          ck(anims.length==924,'Unexpected native animation count')
          ck(iv(creward,:list).size==245,'Native 245-command reward flow not preserved')
          ck(iv(cdeath,:list)[0].instance_variable_get(:@parameters)==[371],'Native death level-up hook lost')
          ck(common.length==1068,'Unexpected CE count')
          ck((1061..1067).all?{|id|!Marshal.dump(common[id]).b.include?('데스나이트'.b)},'Original DK remains in private CE')
          ck(File.file?(REVIEW_ROOT+'/Graphics/Characters/SLZQWalk.png'),'No ZQ walk image')
          (908..923).each do |id|
           a=anims.fetch(id)
           name=txt(iv(a,:animation_name))
           ck(File.file?("#{REVIEW_ROOT}/Graphics/Animations/#{name}.png"),"Missing native animation #{name}")
          end
          ck(paths.all?{|p|Digest::SHA256.file(p).hexdigest==before[p]},'Original project file changed')
          FileUtils.mkdir_p(REVIEW_ROOT+'/out')
          File.binwrite(REVIEW_ROOT+'/out/Map025.rxdata',Marshal.dump(map25))
          File.binwrite(REVIEW_ROOT+'/out/CommonEvents.rxdata',Marshal.dump(common))
          File.binwrite(REVIEW_ROOT+'/out/Animations.rxdata',Marshal.dump(anims))
          # Unmarshal output to ensure result is loadable by original RGSS structures.
          check_map=Marshal.load(File.binread(REVIEW_ROOT+'/out/Map025.rxdata'))
          check_ce=Marshal.load(File.binread(REVIEW_ROOT+'/out/CommonEvents.rxdata'))
          check_an=Marshal.load(File.binread(REVIEW_ROOT+'/out/Animations.rxdata'))
          ck(iv(iv(check_map,:events).fetch(29),:pages).length==5,'Saved map data corrupt')
          ck(check_ce.length==1068 && check_an.length==924,'Serialized data mismatch')
          puts JSON.pretty_generate({status:'LOCAL PASS',source:'Map019 EV18',target:'Map025 EV29',base:'V241',
           pages:iv(queen,:pages).map{|p|iv(p,:list).length},spawns:spawn,attack_registrations:reg,
           attack_native_animation_ids:attack_animation,death_native_animation_ids:death_animation,
           post_death_waits:post.select{|c|iv(c,:code)==106}.map{|c|iv(c,:parameters)},
           source_untouched:true,yml_changed:false,live_test:false})

          QUEEN_NATIVE
          ruby -c build/clone_queen.rb
          ZQ_GAME_ROOT=site/knight/gameasync \
            ZQ_REVIEW_DIR=build/zq_review ruby build/clone_queen.rb

      - name: Register new native graphics and three data file hashes
        shell: bash
        run: |
          set -euo pipefail
          cat > build/build_mapping.py <<'QUEEN_MAPPING'
          from pathlib import Path
          import hashlib,re,os
          base=Path(os.environ.get('ZQ_REVIEW_DIR','build/zq_review'))
          original=(Path(os.environ.get('ZQ_GAME_ROOT','site/knight/gameasync'))/'mapping.js').read_text('utf-8')
          out=original
          root=base/'Graphics'
          rows=[]
          for kind in ('Characters','Animations'):
           for p in sorted((root/kind).glob('SLZQ*.png')):
            relative=f'Graphics/{kind}/{p.name}'
            logical=f'graphics/{kind.lower()}/{p.stem.lower()}'
            md5=hashlib.md5(p.read_bytes()).hexdigest()
            rows.append(f'["{logical}", "{relative}?h={md5}"],')
          assert len(rows)==19
          anchor='];\n\nvar mapping = {};'
          assert out.count(anchor)==1
          out=out.replace(anchor,'\n'+'\n'.join(rows)+'\n'+anchor)
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          for name in ('Map025.rxdata','CommonEvents.rxdata','Animations.rxdata'):
           p=base/'out'/name
           digest=hashlib.md5(p.read_bytes()).hexdigest()
           token=re.escape('Data/'+pre+name)+r'\?h=[0-9a-f]{32}'
           out,n=re.subn(token,'Data/'+pre+name+'?h='+digest,out)
           assert n==1,(name,n)
          assert all(r in out for r in rows)
          path=base/'out/mapping.js'
          path.write_text(out,'utf-8')
          print('PASS 19 native sprite URL registrations, 3 prefab data MD5 changes, no original mapping changed')

          QUEEN_MAPPING
          ZQ_GAME_ROOT=site/knight/gameasync \
            ZQ_REVIEW_DIR=build/zq_review python3 build/build_mapping.py
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('site/knight/gameasync')
          review=Path('build/zq_review')
          for kind in ('Animations','Characters'):
              destination=root/'Graphics'/kind
              for image in sorted((review/'Graphics'/kind).glob('SLZQ*.png')):
                  assert not (destination/image.name).exists(),image.name
                  shutil.copyfile(image,destination/image.name)
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          for name in ('Map025','CommonEvents','Animations'):
              shutil.copyfile(review/'out'/(name+'.rxdata'),root/'Data'/(pre+name+'.rxdata'))
          shutil.copyfile(review/'out/mapping.js',root/'mapping.js')
          loader=Path('site/knight/js/sl-assets-v229r115.js')
          content=loader.read_text('utf-8')
          assert content.count("var version='V241';")==1
          loader.write_text(content.replace("var version='V241';","var version='V276.6';"),encoding='utf-8')
          for name in ('index.html','knight/index.html'):
              file=Path('site')/name
              content=file.read_text('utf-8')
              assert 'V241' in content
              content=content.replace('V241','V276.6').replace('?v=v241','?v=v276.6')
              file.write_text(content,encoding='utf-8')
          print('PASS copied 19 unique queen sprites and 3 compiled native rxdata files')
          PY
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: Verify native game byte-protection, animation cells, and event integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          old=json.loads(Path('build/original_sha256.json').read_text('utf-8'))
          new={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
               for p in root.rglob('*') if p.is_file()}
          pre='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          allowed={pre+name+'.rxdata' for name in ('Map025','CommonEvents','Animations')}
          allowed.update({'knight/gameasync/mapping.js','knight/js/sl-assets-v229r115.js',
                          'index.html','knight/index.html'})
          added={str(p.relative_to(root)) for kind in ('Characters','Animations')
                 for p in (root/'knight/gameasync/Graphics'/kind).glob('SLZQ*.png')}
          assert len(old)==5603 and len(added)==19
          assert len(new)==5622,('Wrong site inventory',len(new))
          assert set(new)-set(old)==added,('Unexpected new files',(set(new)-set(old))^added)
          assert not (set(old)-set(new)),'Original file removed'
          changed={p for p in old if new.get(p)!=old[p]}
          assert changed==allowed,('Unapproved source change',changed^allowed)
          for name in ('Map016','Map019'):
              assert old[pre+name+'.rxdata']==new[pre+name+'.rxdata']
          for name in ('knight/gameasync/Data/Scripts.rxdata',
                       'knight/assets/map-047-v241.pack','knight/js/drive.js','knight/js/dpad.js'):
              assert old[name]==new[name],name
          assert not any('/SLDK2F' in p for p in new)
          print('PASS 5603 protected original files, 7 changed expected files, 19 added queen images')
          PY
          cat > build/verify_queen.rb <<'QUEEN_VERIFY'
          require 'zlib'
          module RPG
            class Map;end
            class Event;class Page;class Condition;end;class Graphic;end;end;end
            class CommonEvent;end;class EventCommand;end;class MoveRoute;end
            class MoveCommand;end;class AudioFile;end
            class Animation;class Frame;end;class Timing;end;end
          end
          class Table
            def self._load(s);o=allocate;o.instance_variable_set(:@raw,s);o;end
            def _dump(level=0);@raw;end
          end
          class Tone
            def self._load(s);o=allocate;o.instance_variable_set(:@raw,s);o;end
            def _dump(level=0);@raw;end
          end
          class Color<Tone;end
          def iv(o,k);o.instance_variable_get('@'+k.to_s);end
          def ck(v,s);raise s unless v;end
          root='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          get=->(name){Marshal.load(File.binread(root+pre+name+'.rxdata'))}
          map=get.call('Map025');general=get.call('Map019')
          common=get.call('CommonEvents');animations=get.call('Animations')
          queen=iv(map,:events).fetch(29)
          native=iv(iv(general,:events).fetch(18),:pages)
          pages=iv(queen,:pages)
          ck(pages.length==5,'Missing ordinary DK pages')
          ck(pages.map{|p|iv(p,:list).length}==[22,1,217,2,10],'Wrong event page commands')
          ck(pages.all?{|p|iv(p,:move_speed)==2},'Incorrect move speed')
          ck(iv(pages[2],:list).each_with_index.all?{|c,i|
             o=iv(native[2],:list)[i]
             [iv(c,:code),iv(c,:indent)]==[iv(o,:code),iv(o,:indent)]
          },'Native 217-command combat graph changed')
          register=iv(pages[2],:list).count{|c|iv(c,:code)==355 &&
             iv(c,:parameters)[0].to_s.include?('SLMonsterAttackContext.register(5991,')}
          ck(register==17,'Native attack registration lost')
          post=iv(pages[4],:list)
          ck(post.select{|c|iv(c,:code)==106}.map{|c|iv(c,:parameters)}==[[4300]],'Respawn wait not 4300 once')
          ck(iv(pages[3],:list).map{|c|iv(c,:code)}==[117,0],'Death page damaged')
          ck(common.length==1068 && animations.length==924,'Native event/animation counts wrong')
          ck(iv(common[1065],:list).length==245,'Native reward 245 commands truncated')
          ck(iv(common[1066],:list).length==55,'Native attack 55 commands truncated')
          ck(iv(common[1062],:list).length==148,'Native hit calculations truncated')
          ck(iv(common[1067],:list)[0].instance_variable_get(:@parameters)==[371],'Native level-up CE371 missing')
          ck(!Marshal.dump(queen).b.include?('데스나이트'.b),'DK image reference in queen')
          ck((1061..1067).all?{|id|!Marshal.dump(common[id]).b.include?('데스나이트'.b)},'DK in queen CE')
          (908..923).each do |id|
            a=animations.fetch(id)
            expect=id<=919 ? 25 : 17
            ck(iv(a,:frame_max)==expect,'Animation image frame count invalid')
            iv(a,:frames).each_with_index do |frame,index|
              t=iv(iv(frame,:cell_data),:raw)
              ck(t.bytesize==36,'Bad native Table header length')
              ck(t.unpack('V5')==[2,1,8,1,8],'Bad native Table x,y,z,size')
              ck(t.byteslice(20,16).unpack('s<*')[0]==index,'Animation atlas frame mapping wrong')
            end
          end
          puts 'PASS original 5 pages, 217 combat commands, 17 attack registrations'
          puts 'PASS 245 reward commands, native death CE371, 25/17 native animation frames'
          puts 'PASS original RPG::Table cell header and 4-direction atlas mapping'
          QUEEN_VERIFY
          ruby -c build/verify_queen.rb
          ruby build/verify_queen.rb

      - name: Publish verified draft game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
