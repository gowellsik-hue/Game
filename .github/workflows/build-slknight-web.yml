
name: V212 | Fairy Field Stability Isolation and WASM Memory Diagnostics

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Restore V211 artifact if still retained
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: github-pages
          run-id: 38423440032
          github-token: ${{ github.token }}
          path: prior

      - name: Restore and verify exact V211 game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          if test -s prior/artifact.tar; then
            tar -xf prior/artifact.tar -C site
            echo V212_SOURCE_FROM_V211_ARTIFACT
          else
            echo V212_SOURCE_FROM_PUBLISHED_V211_SNAPSHOT
            python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import urlopen, Request
          import hashlib, json, re, time
          ROOT=Path('site')
          BASE='https://gowellsik-hue.github.io/Game/'
          fixed=('index.html','COPYING-mkxp-web.txt','manifest.webmanifest','mkxp.js',
                 'mkxp.wasm','js/drive.js','js/dpad.js','js/localforage.min.js')
          jobs={'index.html':(BASE+'index.html',None)}
          def get(url):
              for i in range(6):
                  try:
                      with urlopen(Request(url,headers={'User-Agent':'V212-Fairy-Restore','Accept-Encoding':'identity'}),timeout=60) as res:
                          return res.read()
                  except Exception:
                      if i==5:raise
                      time.sleep(i*2+1)
          for game in ('knight','elf'):
              for rel in fixed:
                  jobs[game+'/'+rel]=(BASE+game+'/'+quote(rel,safe='/'),None)
              name=game+'/gameasync/mapping.js'
              b=get(BASE+name+'?source=v211')
              f=ROOT/name;f.parent.mkdir(parents=True,exist_ok=True);f.write_bytes(b)
              body=b.decode('utf-8').split('var mappingArray = ',1)[1].split('];',1)[0]+']'
              pairs=json.loads(re.sub(r',\s*\]$',']',body))
              for key,url in pairs:
                  rel,sep,md5=url.partition('?h=')
                  if '.' not in Path(rel).name:continue
                  if '..' in Path(rel).parts or rel.startswith('/'):
                      raise RuntimeError('Unsafe mapped file name: '+rel)
                  out=game+'/gameasync/'+rel
                  if out in jobs:raise RuntimeError('Duplicate path '+out)
                  jobs[out]=(BASE+game+'/gameasync/'+quote(rel,safe='/')+('?h='+md5 if sep else ''),md5 if sep and Path(rel).name not in ('mapping.js','bitmap-map.js') else None)
          if len(jobs)!=5355:raise RuntimeError('Not V211 file count: '+str(len(jobs)))
          def task(item):
              name,(url,md5)=item
              content=get(url)
              if md5 and hashlib.md5(content).hexdigest()!=md5:
                  raise RuntimeError('Downloaded asset hash mismatch: '+name)
              p=ROOT/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(content)
          pending=[item for item in jobs.items() if not (ROOT/item[0]).is_file()]
          with ThreadPoolExecutor(max_workers=18) as pool:
              futures=[pool.submit(task,item) for item in pending]
              for i,f in enumerate(as_completed(futures),1):
                  f.result()
                  if i%500==0:print('V212_RESTORED',i,'/',len(pending),flush=True)
          print('V212_PUBLISHED_SNAPSHOT_RESTORED')
          PY
          fi
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          locked={
              'index.html':'cb972e363a37790bef24aafceae5bd12aaa686934acc4a4c052402006341a3ba',
              'knight/index.html':'38b008e7e31b5a7f8eee1aac255641adf1c38a6927ecd8a2b4a29e71e7f1b8a4',
              'knight/gameasync/mapping.js':'764453d72365622f63b84f7af52e93c909b00d4092b7445ed17408e3ca15cac9',
              'knight/gameasync/Data/Scripts.rxdata':'8966a677a9789f3e9c95a058659dcf22b51d98fb1c68dd946a4e6879cf2bbaec',
              'elf/index.html':'ef32ab617d39f203a5c72f778e82afe7c0935798fa5668ea669d6db00e421eee',
              'elf/gameasync/mapping.js':'0e3bcaf403752cce86adc22c38f2aede6c87ddc98e33bfa1078954401a7212ed',
              'elf/gameasync/Data/Scripts.rxdata':'12bb63b8fbc9a69810a6f581849d1693e28c2a9744ba2d9ba26e62cf0c75cd48',
              'elf/js/dpad.js':'52e1b860e2ad9c3f6194d7cf983bcf6fa1a43354650d71fd9fd11984761cde69',
              'knight/js/dpad.js':'c137842818acf76a036127a0ffbae88e22affcba78ca70c3f1b4c76b52f86908',
              'elf/mkxp.wasm':'83f6138820a3587ec569bca801d3032ec39edfda1cb49fbb90ab3928821966bd',
              'knight/mkxp.wasm':'83f6138820a3587ec569bca801d3032ec39edfda1cb49fbb90ab3928821966bd',
          }
          manifest={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in root.rglob('*') if p.is_file()}
          if len(manifest)!=5355:raise SystemExit('Incomplete V211 file set: '+str(len(manifest)))
          for path,digest in locked.items():
              if manifest.get(path)!=digest:raise SystemExit('V211 source mismatch: '+path)
          Path('/tmp/v212_before.json').write_text(json.dumps(manifest),encoding='utf-8')
          Path('/tmp/v212_old_scripts.rxdata').write_bytes((root/'elf/gameasync/Data/Scripts.rxdata').read_bytes())
          print('V212_EXACT_V211_SOURCE_LOCKED: 5355 FILES')
          PY

      - name: Remove only V211 duplicate monster chase hook
        shell: bash
        run: |
          set -euo pipefail
          ruby -rzlib - site/elf/gameasync/Data/Scripts.rxdata <<'RB'
          path=ARGV.fetch(0)
          scripts=Marshal.load(File.binread(path))
          name='SLFairy Monster Hit React and Eight Tile Bow V211'
          matching=scripts.select{|e|e.is_a?(Array) && e[1].to_s==name}
          abort "V211 attack hook count=#{matching.size}" unless matching.size==1
          entry=matching.first
          src=Zlib::Inflate.inflate(entry[2]).force_encoding('UTF-8')
          marker="\nclass Game_Event\n  alias sl_v211_native_update update\n"
          abort 'V211 duplicate Game_Event update not unique' unless src.scan(marker).size==1
          index=src.index(marker)
          tail=src[index..-1]
          abort 'Unexpected V211 override' unless tail.include?('move_toward_player if dx + dy > 1 && dx + dy <= 10') && tail.rstrip.end_with?('end')
          src=src[0...index]+"\n"
          marker="    # The original monster touch AI still controls actual counterattacks.\n"
          abort 'V211 alert section not unique' unless src.scan(marker).size==1
          start=src.index(marker)
          finish=src.index("  end\nend\n",start)
          abort 'V211 response end not found' unless finish
          src=src[0...start]+src[finish..-1]
          abort 'Chase code remains' if src.include?('@sl_v211_alert_until') || src.include?('alias sl_v211_native_update')
          abort 'Native hit reaction removed' unless src.include?('v211_activate_contact_page(enemy)') && src.include?('v211_react(enemy)')
          abort 'Eight tile target changed' unless src.include?('BOW_RANGE = 8')
          abort 'Damage changed' unless src.include?('$game_variables[spec[0]] = $game_variables[spec[0]] + total')
          RubyVM::InstructionSequence.compile(src,'V212 Fairy combat')
          entry[1]='SLFairy Native Monster AI and Hit V212'
          entry[2]=Zlib::Deflate.deflate(src)
          File.binwrite(path,Marshal.dump(scripts))
          puts 'V212_DUPLICATE_CHASE_REMOVED_NATIVE_AI_PRESERVED'
          RB

      - name: Add WASM memory and last-action diagnostic without altering controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          elf=Path('site/elf')
          page=elf/'index.html'
          code=page.read_text(encoding='utf-8')
          changes=[
            ('gameasync/mapping.js?v=fairy211','gameasync/mapping.js?v=fairy212'),
            ("box.textContent='V211 '+state+' F:'+lastFrame+' '+phase+' '+\n      'age:'+lag+'s '+lastScene+' / '+lastTarget;",
             "var m=window.Module && window.Module.HEAPU8 ? Math.round(window.Module.HEAPU8.byteLength/1048576)+'MB' : '?';\n    box.textContent='V212 '+state+' F:'+lastFrame+' '+phase+' '+\n      'age:'+lag+'s MEM:'+m+' '+lastScene+' / '+lastTarget;"),
            ("    pos=s.indexOf('SLAUDIO|SE_PLAY|');\n    if(pos>=0)lastTarget=s.slice(pos,pos+75);",
             "    pos=s.indexOf('SLAUDIO|SE_PLAY|');\n    if(pos>=0)lastTarget=s.slice(pos,pos+75);\n    pos=s.indexOf('SLV211|SHOT|');\n    if(pos>=0)lastTarget=s.slice(pos,pos+75);"),
            ("    var text=String(e && e.message || 'unknown');\n    lastTarget='JS ERROR: '+text.slice(0,90);",
             "    var msg=String(e && e.message || 'unknown');\n    var stack=e&&e.error&&e.error.stack?String(e.error.stack).split('\\n').slice(0,2).join(' '):'';\n    lastTarget='JS ERROR: '+msg.slice(0,60)+' '+stack.slice(0,95);")
          ]
          for old,new in changes:
              if code.count(old)!=1:raise SystemExit('Unexpected V211 HTML marker: '+old[:70])
              code=code.replace(old,new,1)
          page.write_text(code,encoding='utf-8')
          mapping=elf/'gameasync/mapping.js'
          text=mapping.read_text(encoding='utf-8')
          digest=hashlib.md5((elf/'gameasync/Data/Scripts.rxdata').read_bytes()).hexdigest()
          rx=r'(\["data/scripts",\s*"Data/Scripts\.rxdata\?h=)[0-9a-f]{32}("\],)'
          text,n=re.subn(rx,lambda m:m.group(1)+digest+m.group(2),text)
          if n!=1:raise SystemExit('Fairy scripts mapping mismatch')
          mapping.write_text(text,encoding='utf-8')
          Path('/tmp/v212_status.js').write_text(code.split('<script id="sl-v198-diagnostic">',1)[1].split('</script>',1)[0])
          print('V212_WASM_HEAP_AND_EXCEPTION_STACK_VISIBLE')
          PY
          node --check /tmp/v212_status.js
          node --check site/elf/js/dpad.js

      - name: Verify V211 hit logic, save and Knight are unchanged
        shell: bash
        run: |
          set -euo pipefail
          ruby -rzlib - /tmp/v212_old_scripts.rxdata site/elf/gameasync/Data/Scripts.rxdata <<'RB'
          before=Marshal.load(File.binread(ARGV[0]))
          after=Marshal.load(File.binread(ARGV[1]))
          abort 'Script count changed' unless before.size==after.size
          changed=(0...before.size).select{|i|before[i]!=after[i]}
          abort "Unexpected Ruby script changes: #{changed.inspect}" unless changed.size==1
          a,b=before[changed[0]],after[changed[0]]
          abort 'Wrong attack script' unless a[1]=='SLFairy Monster Hit React and Eight Tile Bow V211' && b[1]=='SLFairy Native Monster AI and Hit V212'
          old=Zlib::Inflate.inflate(a[2]);now=Zlib::Inflate.inflate(b[2])
          abort 'Old chase not removed' if now.include?('sl_v211_native_update') || now.include?('@sl_v211_alert_until')
          abort 'Hit motion removed' unless now.include?('v211_react(enemy)') && now.include?('v211_hit_graphic(enemy)')
          abort 'Monster page activation removed' unless now.include?('v211_activate_contact_page(enemy)')
          abort 'Actual damage changed' unless now.include?('$game_variables[spec[0]] = $game_variables[spec[0]] + total')
          %w[Game_Event Scene_Map Scene_Title Scene_Menu Scene_Save Scene_Load Game_Player].each do |n|
            o=before.find{|e|e.is_a?(Array) && e[1]==n};v=after.find{|e|e.is_a?(Array) && e[1]==n}
            abort "Core Ruby script unexpectedly changed: #{n}" unless o && o==v
          end
          RubyVM::InstructionSequence.compile(now,'V212 verification')
          puts 'V212_ONE_COMBAT_SCRIPT_ONLY_NATIVE_MAP_EVENT_UPDATE_RESTORED'
          RB
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('site')
          old=json.loads(Path('/tmp/v212_before.json').read_text(encoding='utf-8'))
          now={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
               for p in root.rglob('*') if p.is_file()}
          if set(old)!=set(now):raise SystemExit('Game files added or removed')
          allowed={'elf/index.html','elf/gameasync/mapping.js','elf/gameasync/Data/Scripts.rxdata'}
          changed={p for p in old if old[p]!=now[p]}
          if changed!=allowed:raise SystemExit('Unexpected changes: '+str(changed))
          d=(root/'elf/gameasync/Data/Scripts.rxdata').read_bytes()
          m=(root/'elf/gameasync/mapping.js').read_text(encoding='utf-8')
          if 'Data/Scripts.rxdata?h='+hashlib.md5(d).hexdigest() not in m:
              raise SystemExit('Stale script hash')
          h=(root/'elf/index.html').read_text(encoding='utf-8')
          assert 'MEM:'+"'" in h and 'fairy212' in h
          assert 'slfairy_v105_engine' in h
          assert 'slknight_v14_engine' in (root/'knight/index.html').read_text(encoding='utf-8')
          print('V212_ONLY_3_FAIRY_FILES_CHANGED_5352_PROTECTED')
          PY

      - name: Upload GitHub Pages site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
