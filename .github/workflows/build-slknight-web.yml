
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V1.4
# BASE: successful V1.3 run 42315919970
# APPROVED ONLY:
# 1. Healer equipment/status/skill selection below knight.
# 2. Item and skill hotbars 9 slots (3 x 3); raise dpad, ATK and X.
# 3. Healer distance teleport threshold 20 (was 9).
# Keep all other NPC, monster, map, battle, hire and buff logic.
# This patch adds no timer, new combat engine or map events.

name: build-slknight-web.yml | V1.4 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Restore successful V1.3
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 42315919970
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify inherited V1.3
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('site')
          files = {
              str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }
          assert len(files) == 5623, len(files)
          pre = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          for rel in (
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/Data/' + pre + 'Map029.rxdata',
              'knight/gameasync/Data/' + pre + 'CommonEvents.rxdata',
              'knight/gameasync/Data/' + pre + 'Animations.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/dpad.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html',
              'knight/index.html'
          ):
              assert rel in files, rel
          loader = (root / 'knight/js/sl-assets-v229r115.js').read_text('utf-8')
          assert "var version='V1.3';" in loader
          assert 'V1.3' in (root / 'knight/index.html').read_text('utf-8')
          Path('build/original.json').write_text(json.dumps(files), encoding='utf-8')
          print('PASS original V1.3 / 5623 files')
          PY
      - name: Apply V1.4 healer selection, shared shortcuts and 20-tile teleport
        shell: bash
        run: |
          set -euo pipefail
          cat > build/v14_extensions.rb <<'RUBY_V14_EXT'
          # V1.4 – Use existing actor, item/skill menus and spell states.
          module SLV14Menu
            def self.members
              list = $game_party.actors.dup
              if $game_switches && $game_switches[185] && !list.include?($game_actors[3])
                list << $game_actors[3]
              end
              list
            end
            def self.actor(index)
              members[index]
            end
          end

          module SLV14Skills
            MAGIC = [
              [90, '그레이터 힐', '그힐', '힐러의 회복 마법'],
              [91, '이뮨 투 함', '이뮨', '힐러 보호 마법'],
              [92, '어드밴스 스피릿', '버프-어드밴스스피릿', '힐러 강화 마법'],
              [93, '홀리 워크', '힐러 명령 주문서', '힐러의 홀리 워크'],
            ]
            def self.available?(id)
              return false unless $game_switches && $game_switches[185]
              case id
              when 90 then true
              when 91 then $game_switches[384]
              when 92 then $game_switches[385]
              when 93 then $game_switches[812]
              else false
              end
            end
            def self.prepare
              return unless $data_skills && $game_actors
              template = $data_skills[6]
              return unless template
              MAGIC.each do |spec|
                id, name, icon, desc = spec
                skill = $data_skills[id]
                if skill.nil? || skill.name.to_s.empty?
                  skill = template.clone
                  skill.instance_variable_set(:@id, id)
                  skill.instance_variable_set(:@name, name)
                  skill.instance_variable_set(:@icon_name, icon)
                  skill.instance_variable_set(:@description, desc)
                  skill.instance_variable_set(:@sp_cost, 0)
                  skill.instance_variable_set(:@scope, 0)
                  skill.instance_variable_set(:@occasion, 0)
                  skill.instance_variable_set(:@common_event_id, 0)
                  $data_skills[id] = skill
                end
                if available?(id)
                  $game_actors[3].learn_skill(id)
                else
                  $game_actors[3].forget_skill(id)
                end
              end
            end
            def self.slots
              value = $game_system.instance_variable_get(:@sl_v14_skill_slots)
              if !value.is_a?(Array)
                value = Array.new(9, 0)
              else
                value = (value[0, 9] || []) + Array.new([9 - value.size, 0].max, 0)
              end
              $game_system.instance_variable_set(:@sl_v14_skill_slots, value)
              value
            end
            def self.assigned?(slot)
              slots[slot].to_i > 0
            end
            def self.index_pressed
              return 0 if Keyboard.testkey(49) || Input.trigger?(Input::F7)
              return 1 if Keyboard.testkey(50) || Input.trigger?(Input::F8)
              return 2 if Keyboard.testkey(51) || Input.trigger?(Input::F9)
              return 3 if Keyboard.testkey(52) || Input.trigger?(Input::CTRL)
              return 4 if Keyboard.testkey(53) || Input.trigger?(Input::ALT)
              return 5 if Keyboard.testkey(54) || Input.trigger?(Input::SHIFT)
              return 6 if Keyboard.testkey(55)
              return 7 if Keyboard.testkey(56)
              return 8 if Keyboard.testkey(57)
              nil
            end
            def self.assign_from_window(window, actor)
              slot = index_pressed
              return false if slot.nil?
              skill = window ? window.skill : nil
              if skill.nil? || actor.nil? || !actor.skill_learn?(skill.id)
                $game_system.se_play($data_system.buzzer_se)
                return true
              end
              if actor.id == 3 && !available?(skill.id)
                $game_system.se_play($data_system.buzzer_se)
                return true
              end
              slots[slot] = actor.id * 1000 + skill.id
              $game_system.se_play($data_system.decision_se)
              sync(true)
              true
            end
            def self.buzzer
              $game_system.se_play($data_system.buzzer_se)
              false
            end
            def self.cast_healer(id)
              return buzzer unless available?(id)
              mp = $game_variables[459].to_i
              case id
              when 90 # Same 16 MP and 100..120 healing as original healer event.
                actor = $game_actors[1]
                return buzzer if mp < 16 || actor.hp >= actor.maxhp
                $game_variables[459] = mp - 16
                actor.hp += 100 + rand(21)
                $game_player.animation_id = 269
              when 91 # Reuse the native Immune status, expense and expiry CE603.
                return buzzer if $game_switches[94] # Existing auto cast must not charge twice.
                return buzzer if mp < 30 || $game_party.item_number(15) < 2
                $game_variables[459] = mp - 30
                $game_party.lose_item(15, 2)
                $game_switches[382] = true
                $game_switches[386] = true
                $game_variables[853] = 0
              when 92 # CE604 handles the existing timed buff and its removal.
                return buzzer if $game_switches[95] # Existing auto cast must not charge twice.
                return buzzer if mp < 20
                $game_variables[459] = mp - 20
                unless $game_switches[383]
                  $game_actors[1].maxhp += 300
                  $game_actors[1].maxsp += 30
                end
                $game_switches[92] = true
                $game_switches[383] = true
                $game_variables[854] = 0
              when 93 # Native CE801 accounts for the 15 MP charge and duration.
                return buzzer if mp < 15
                $game_variables[879] = 0
                $game_switches[811] = true
              else
                return buzzer
              end
              Guage.show if defined?(Guage)
              $KeyIcon.ShowIcon if $KeyIcon
              $메세지.set_text2('[힐러] ' + ($data_skills[id].name) + ' 시전') if $메세지
              true
            end
            def self.cast_knight(id)
              actor = $game_actors[1]
              return buzzer unless actor.skill_learn?(id)
              case id
              when 7 then $game_switches[1007] = true
              when 8 then $game_switches[1008] = true
              when 9 then $game_switches[874] = true
              when 1 then $game_temp.common_event_id = 80
              else
                skill = $data_skills[id]
                return buzzer unless skill && skill.common_event_id.to_i > 0
                $game_temp.common_event_id = skill.common_event_id
              end
              true
            end
            def self.cast_slot(slot)
              value = slots[slot].to_i
              return false if value <= 0
              actor_id = value / 1000
              skill_id = value % 1000
              success = if actor_id == 3
                cast_healer(skill_id)
              elsif actor_id == 1
                cast_knight(skill_id)
              else
                buzzer
              end
              sync(true)
              success
            end
            def self.use_pressed
              slot = index_pressed
              return false if slot.nil? || !assigned?(slot)
              cast_slot(slot)
              true
            end
            def self.sync(force = false)
              prepare
              data = []
              for slot in 0...9
                value = slots[slot].to_i
                actor_id = value / 1000
                skill_id = value % 1000
                skill = value > 0 ? $data_skills[skill_id] : nil
                if skill && (actor_id == 1 || actor_id == 3)
                  ready = actor_id == 1 ? $game_actors[1].skill_learn?(skill_id) : available?(skill_id)
                  data << [skill_id, skill.icon_name.to_s, skill.name.to_s, skill.sp_cost.to_i, ready ? 1 : 0]
                else
                  data << [0, '', '', 0, 0]
                end
              end
              # Keep the original six default icons and actions when unassigned.
              actor = $game_party.actors[0]
              [7, 8, 9, 1].each_with_index do |id, i|
                next if assigned?(i) || actor.nil?
                skill = actor.skill_learn?(id) ? $data_skills[id] : nil
                data[i] = skill ? [id, skill.icon_name.to_s, skill.name.to_s, 0, 1] : [0, '', '', 0, 0]
              end
              unless assigned?(4)
                item = $data_items[177]
                data[4] = (item && $game_party.item_number(177) > 0) ? [177, item.icon_name.to_s, item.name.to_s, 0, 1] : [0, '', '', 0, 0]
              end
              signature = data.inspect
              return if !force && @last_sync == signature
              @last_sync = signature
              data.each_with_index do |v, i|
                puts('SLSKILL|STATE|' + (i + 1).to_s + '|' + v.map{|x|x.to_s.gsub('|', '/')}.join('|'))
              end
            end
          end
          RUBY_V14_EXT
          cat > build/patch_v14.rb <<'RUBY_V14_PATCH'
          # encoding: utf-8
          require 'zlib'
          require 'digest'
          SP = 'site/knight/gameasync/Data/Scripts.rxdata'
          original_bytes = File.binread(SP)
          scripts = Marshal.load(original_bytes)
          base = Marshal.load(original_bytes)

          def section(a, name)
            matches = a.each_index.select{|i| a[i].is_a?(Array) && a[i][1].to_s == name}
            raise "missing/duplicate script #{name}: #{matches.inspect}" unless matches.size == 1
            i = matches[0]
            [i, Zlib::Inflate.inflate(a[i][2]).force_encoding('UTF-8').gsub("\r\n", "\n")]
          end

          def replace_one(s, from, to, description)
            from = from.gsub("\\n", "\n")
            to = to.gsub("\\n", "\n")
            count = s.split(from, -1).size - 1
            raise "#{description} anchor count #{count}" unless count == 1
            s.sub(from, to)
          end

          def replace_two(s, from, to, description)
            from = from.gsub("\\n", "\n")
            to = to.gsub("\\n", "\n")
            count = s.split(from, -1).size - 1
            raise "#{description} anchor count #{count}" unless count == 2
            s.gsub(from, to)
          end

          def change(scripts, name)
            i, s = section(scripts, name)
            original_sha = Digest::SHA256.hexdigest(s)
            new_source = yield s
            raise "#{name} unchanged" if s == new_source
            File.binwrite("build/v14_#{i}.rb", new_source)
            raise "Ruby syntax bad #{name}" unless system('ruby', '-c', "build/v14_#{i}.rb")
            scripts[i][2] = Zlib::Deflate.deflate(new_source.b)
            puts "UPDATED #{i}: #{name} #{original_sha[0,10]} -> #{Digest::SHA256.hexdigest(new_source)[0,10]}"
          end

          change(scripts, 'Game_Character 3') do |s|
            replace_one(s, '      if d >= 9\n', '      if d >= 20\n', 'Healer teleport threshold')
          end

          change(scripts, 'Window_MenuStatus') do |s|
            t=replace_one(s, '    @item_max = $game_party.actors.size\n', '    @item_max = SLV14Menu.members.size\n','Menu actor count')
            t=replace_one(t, '    for i in 0...$game_party.actors.size\n', '    for i in 0...SLV14Menu.members.size\n','Menu actor loop')
            replace_one(t, '      actor = $game_party.actors[i]\n', '      actor = SLV14Menu.actor(i)\n','Menu actor lookup')
          end

          change(scripts, 'Scene_Menu') do |s|
            t=replace_one(s, '  def main\n', '  def main\n    SLV14Skills.prepare\n', 'Menu prepare skills')
            replace_one(t,'$game_party.actors[@status_window.index].restriction', 'SLV14Menu.actor(@status_window.index).restriction', 'Menu skill restriction')
          end

          change(scripts, 'Scene_Skill') do |s|
            t=replace_one(s, '    @actor = $game_party.actors[@actor_index]\n', '    @actor = SLV14Menu.actor(@actor_index)\n','Skill actor lookup')
            t=replace_two(t,'      @actor_index %= $game_party.actors.size\n','      @actor_index %= SLV14Menu.members.size\n','Skill next actor')
            t=replace_one(t,'      @actor_index += $game_party.actors.size - 1\n','      @actor_index += SLV14Menu.members.size - 1\n','Skill prior actor')
            anchor='  def update_skill\n'
            addition=<<'SRC'
              return if SLV14Skills.assign_from_window(@skill_window, @actor)
              if @actor && @actor.id == 3 && Input.trigger?(Input::C)
                selected = @skill_window.skill
                if selected && SLV14Skills.cast_healer(selected.id)
                  $scene = Scene_Map.new
                end
                return
              end
          SRC
            replace_one(t,anchor,anchor+addition,'Skill screen shortcut assignment')
          end

          change(scripts,'Scene_Equip') do |s|
            t=replace_one(s,'    @actor = $game_party.actors[@actor_index]\n','    @actor = SLV14Menu.actor(@actor_index)\n','Equip actor lookup')
            t=replace_one(t,'    $game_temp.common_event_id = 553\n','    $game_temp.common_event_id = 553 unless @actor && @actor.id == 3\n','No knight recalculation for healer')
            t=replace_two(t,'      @actor_index %= $game_party.actors.size\n','      @actor_index %= SLV14Menu.members.size\n','Equip next actor')
            replace_one(t,'      @actor_index += $game_party.actors.size - 1\n','      @actor_index += SLV14Menu.members.size - 1\n','Equip prior actor')
          end

          change(scripts,'Scene_Status') do |s|
            t=replace_one(s,'    @actor = $game_party.actors[@actor_index]\n','    @actor = SLV14Menu.actor(@actor_index)\n','Status actor lookup')
            t=replace_two(t,'      @actor_index %= $game_party.actors.size\n','      @actor_index %= SLV14Menu.members.size\n','Status next actor')
            replace_one(t,'      @actor_index += $game_party.actors.size - 1\n','      @actor_index += SLV14Menu.members.size - 1\n','Status prior actor')
          end

          change(scripts,'Scene_Map') do |s|
            t=replace_one(s, '  def sl_native_skill_icons\n', '  def sl_native_skill_icons\n    SLV14Skills.sync\n    return\n','Skill slot state integration')
            t=replace_one(t,'  def main\n','  def main\n    SLV14Skills.prepare\n','Skill state at map entry')
            t=replace_one(t,'if $game_switches[1011] == false\n','if $game_switches[1011] == false\n  SLV14Skills.use_pressed\n','Skill slot use existing frame')
            guards=[
              ['if Keyboard.getstate(49) || Input.trigger?(Input::F7)','if !SLV14Skills.assigned?(0) && (Keyboard.getstate(49) || Input.trigger?(Input::F7))'],
              ['if Keyboard.getstate(50) || Input.trigger?(Input::F8)','if !SLV14Skills.assigned?(1) && (Keyboard.getstate(50) || Input.trigger?(Input::F8))'],
              ['if Keyboard.getstate(51) || Input.trigger?(Input::F9)','if !SLV14Skills.assigned?(2) && (Keyboard.getstate(51) || Input.trigger?(Input::F9))'],
              ['if Keyboard.getstate(52) || Input.trigger?(Input::CTRL)','if !SLV14Skills.assigned?(3) && (Keyboard.getstate(52) || Input.trigger?(Input::CTRL))'],
              ['if Keyboard.testkey(53) || Input.trigger?(Input::ALT)','if !SLV14Skills.assigned?(4) && (Keyboard.testkey(53) || Input.trigger?(Input::ALT))'],
              ['if Keyboard.testkey(54) || Input.trigger?(Input::SHIFT)','if !SLV14Skills.assigned?(5) && (Keyboard.testkey(54) || Input.trigger?(Input::SHIFT))'],
              ['if Keyboard.testkey(55)','if !SLV14Skills.assigned?(6) && Keyboard.testkey(55)'],
              ['if Keyboard.testkey(56)','if !SLV14Skills.assigned?(7) && Keyboard.testkey(56)']
            ]
            guards.each{|from,to|t=replace_one(t,from,to,'Skill legacy guard '+from)}
            t
          end

          change(scripts,'Mobile Hotbar') do |s|
            t=replace_one(s,'  LEGACY=[[1,70,86],[16,71],[3],[4,118],[127],[114]]\n',
                          '  LEGACY=[[1,70,86],[16,71],[3],[4,118],[127],[114],[],[],[]]\n', 'Nine item defaults')
            from=<<'SRC'
              unless value.is_a?(Array)&&value.size==6
                value=[0,0,0,0,0,0]
                $game_system.instance_variable_set(:@sl_hotbar_slots,value)
              end
          SRC
            to=<<'SRC'
              unless value.is_a?(Array)
                value = Array.new(9, 0)
              else
                value = (value[0, 9] || []) + Array.new([9 - value.size, 0].max, 0)
              end
              $game_system.instance_variable_set(:@sl_hotbar_slots, value)
          SRC
            t=replace_one(t,from,to,'Preserve existing six item slots')
            t=replace_one(t,'    return 5 if Keyboard.testkey(70)\n',
                          '    return 5 if Keyboard.testkey(70)\n    return 6 if Keyboard.testkey(74)\n    return 7 if Keyboard.testkey(75)\n    return 8 if Keyboard.testkey(76)\n', 'Additional item input JKL')
            t=t.gsub('0...6', '0...9')
            raise 'Item slot loops not expanded' unless t.include?('for i in 0...9')
            extra=File.read('build/v14_extensions.rb',encoding:'UTF-8')
            t + "\n" + extra
          end

          changed=scripts.each_index.select{|i|scripts[i] != base[i]}
          expected_names=['Game_Character 3','Window_MenuStatus','Scene_Menu','Scene_Skill','Scene_Equip','Scene_Status','Scene_Map','Mobile Hotbar']
          actual_names=changed.map{|i|scripts[i][1]}
          raise "Unexpected modified sections #{actual_names.inspect}" unless actual_names.sort == expected_names.sort
          File.binwrite(SP,Marshal.dump(scripts))
          check=Marshal.load(File.binread(SP))
          changed.each{|i|raise 'Bad saved script' unless Zlib::Inflate.inflate(check[i][2]) == Zlib::Inflate.inflate(scripts[i][2])}
          puts 'PASS V1.4: eight tightly scoped original Ruby script sections'
          RUBY_V14_PATCH
          ruby -c build/patch_v14.rb
          ruby build/patch_v14.rb

      - name: Extend only existing mobile item and skill pads to 3 x 3
        shell: bash
        run: |
          set -euo pipefail
          cat > build/patch_v14_js.py <<'PY_V14_UI'
          from pathlib import Path

          root = Path('site')
          source_file = root / 'knight/js/dpad.js'
          text = source_file.read_text('utf-8')

          def one(src, old, new, name):
              n=src.count(old)
              if n!=1:
                  raise RuntimeError(f'{name}: expected one, got {n}')
              return src.replace(old, new)

          def many(src,old,new,count,name):
              n=src.count(old)
              if n!=count:raise RuntimeError(f'{name}: expected {count}, got {n}')
              return src.replace(old,new)

          text = one(text,'const cols=portrait?3:2,rows=portrait?2:3;', 'const cols=3,rows=3;', '3x3 skill layout')
          text = one(text,'const cols=portrait?3:2,rows=portrait?2:3,gap=portrait?8:6;', 'const cols=3,rows=3,gap=portrait?8:6;', '3x3 items layout')
          text = one(text,'const atkY=Math.min(h*0.23,100),cancelY=Math.min(h*0.46,190);',
              'const atkY=Math.max(20,Math.min(h*0.23,100)-20),cancelY=Math.max(75,Math.min(h*0.46,190)-20);', 'raise ATK and X')
          text = one(text, 'true,(atkY+cancelY)/2,hotTop-zoneTop,cell,gap);',
              'true,(atkY+cancelY)/2-18,hotTop-zoneTop,cell,gap);', 'raise Dpad')
          text = one(text,'h*(0.22+0.43)/2,hotTop-zoneTop,cell,gap);',
              'h*(0.22+0.43)/2-12,hotTop-zoneTop,cell,gap);','raise side dpad')
          text = one(text,'centerBox(atk,cx,top+h*0.22,atkSize,atkSize);',
              'centerBox(atk,cx,top+h*0.22-14,atkSize,atkSize);','raise side ATK')
          text = one(text,'centerBox(cancel,cx,top+h*0.43,xSize,xSize);',
              'centerBox(cancel,cx,top+h*0.43-14,xSize,xSize);','raise side X')
          text = one(text,'window.slSkillStates=[null,null,null,null,null,null];',
              'window.slSkillStates=Array(9).fill(null);','9 skill state data')
          text = one(text,'window.slHotStates=[null,null,null,null,null,null];',
              'window.slHotStates=Array(9).fill(null);','9 item state data')
          text = many(text,'if(slot>=1&&slot<=6){','if(slot>=1&&slot<=9){',2,'9 slot parse')
          text = one(text, "const slSkillKeys=[118,119,120,17,18,16];",
              "const slSkillKeys=[118,119,120,17,18,16,55,56,57];", '9 skill keys')
          text = many(text, "const labels=['a','s','d','q','z','f'],b=document.getElementById('sl-hot-'+labels[index]);",
              "const labels=['a','s','d','q','z','f','j','k','l'],b=document.getElementById('sl-hot-'+labels[index]);",2,'9 item render and flash labels')
          text = one(text,"const visible=slScene==='Scene_Map';",
              "const visible=slScene==='Scene_Map'||slScene==='Scene_Skill';",'skill assignment mode')
          text = one(text, 'for(let i=0;i<6;i++)skillButton(skillbar,i);',
              'for(let i=0;i<9;i++)skillButton(skillbar,i);','nine skill buttons')
          text = one(text,"hotButton(hot,0,'A',65);hotButton(hot,1,'S',83);hotButton(hot,2,'D',68);hotButton(hot,3,'Q',81);hotButton(hot,4,'Z',117);hotButton(hot,5,'F',116);",
              "hotButton(hot,0,'A',65);hotButton(hot,1,'S',83);hotButton(hot,2,'D',68);hotButton(hot,3,'Q',81);hotButton(hot,4,'Z',117);hotButton(hot,5,'F',116);hotButton(hot,6,'J',74);hotButton(hot,7,'K',75);hotButton(hot,8,'L',76);",'nine item buttons')
          text = one(text, 'grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,46px);',
              'grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);','skill CSS grid')
          text = one(text, 'grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:8px;width:160px;height:104px;',
              'grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:8px;width:160px;height:160px;','item CSS grid')
          text = one(text, 'grid-template-columns:repeat(2,42px);grid-template-rows:repeat(3,42px);gap:6px;width:90px;height:138px',
              'grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px);gap:6px;width:138px;height:138px','item side CSS grid')
