
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V275
# BASE: V273 successful run 41550816816
# NATIVE REFERENCE: V241 successful run 41293648580
# TARGET: Tower of Insolence 2F, Map025 EV29
# SOURCE: Original Death Knight, Map016 EV8
# FIX: Binary-safe remapping of Korean event scripts
# FIX: Independently copy CE57, CE179 and CE901
# KEEP: Five original Death Knight event pages and native commands
# KEEP: Original Death Knight map, common events and graphics unchanged
# REMOVE: V273 Zenith custom runtime and sprite modifications
# ROLLBACK: Original V273 and V241 artifacts remain available
# NOTE: GitHub Actions and in-game execution not yet verified

name: build-slknight-web.yml | V275 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: V275 Restore V273 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41550816816
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V275 Restore V241 native renderer
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41293648580
          name: github-pages
          github-token: ${{ github.token }}
          path: native-baseline

      - name: V275 Extract and verify source games
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site v241 build

          test -s baseline/artifact.tar
          test -s native-baseline/artifact.tar

          tar -xf baseline/artifact.tar -C site
          tar -xf native-baseline/artifact.tar -C v241

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root=Path("site")
          before={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob("*") if p.is_file()
          }

          assert len(before)==5610, len(before)

          pre="MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"
          data=root/"knight/gameasync/Data"
          old=Path("v241/knight/gameasync/Data")

          required=[
              data/"Scripts.rxdata",
              data/(pre+"Map016.rxdata"),
              data/(pre+"Map025.rxdata"),
              data/(pre+"CommonEvents.rxdata"),
              old/"Scripts.rxdata"
          ]

          for path in required:
              assert path.is_file(),path

          loader=(root/"knight/js/sl-assets-v229r115.js").read_text("utf-8")
          drive=(root/"knight/js/drive.js").read_text("utf-8")

          assert "var version='V273';" in loader
          assert "slV268NetPending" not in drive
          assert "slV268ZenithReady" not in loader

          Path("build/before.json").write_text(
              json.dumps(before,sort_keys=True),
              encoding="utf-8"
          )

          print("PASS V273 baseline")
          print("PASS V241 renderer")
          print("PASS original loader preserved")
          PY

      - name: V275 Deep-copy native Death Knight with independent references
        shell: bash
        run: |
          set -euo pipefail

          cat > build/clone.rb <<'RUBY'
          # encoding: UTF-8
          require 'zlib'
          require 'json'
          require 'set'
          require 'fileutils'
          require 'digest'

          module RPG
            class Map;end
            class MapInfo;end
            class AudioFile;end
            class CommonEvent;end
            class Item;end
            class Weapon;end
            class Armor;end

            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end

            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end

          class Table
            def self._load(raw)
              o=allocate
              o.instance_variable_set(:@raw,raw)
              o
            end
            def _dump(level=0);@raw;end
          end

          class Tone
            def self._load(raw)
              o=allocate
              o.instance_variable_set(:@raw,raw)
              o
            end
            def _dump(level=0);@raw;end
          end

          class Color<Tone;end

          def iv(o,k)
            o.instance_variable_get("@"+k.to_s)
          end

          def put(o,k,v)
            o.instance_variable_set("@"+k.to_s,v)
          end

          def deep_copy(o)
            Marshal.load(Marshal.dump(o))
          end

          ROOT="site/knight/gameasync/"
          DATA=ROOT+"Data/"
          PRE="MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"

          SOURCE_MAP=DATA+PRE+"Map016.rxdata"
          TARGET_MAP=DATA+PRE+"Map025.rxdata"
          COMMON=DATA+PRE+"CommonEvents.rxdata"
          SCRIPTS=DATA+"Scripts.rxdata"
          ORIGINAL_SCRIPTS="v241/knight/gameasync/Data/Scripts.rxdata"

          SOURCE_EVENT=8
          TARGET_EVENT=29

          SOURCE_HP=1980
          TARGET_HP=4987

          SOURCE_ATTACK_SWITCH=133
          SOURCE_MAGIC_SWITCH=135

          TARGET_ATTACK_SWITCH=5987
          TARGET_MAGIC_SWITCH=5988
          INACTIVE_WAVE_SWITCH=5989

          SWITCH_MAP={
            SOURCE_ATTACK_SWITCH=>TARGET_ATTACK_SWITCH,
            SOURCE_MAGIC_SWITCH=>TARGET_MAGIC_SWITCH
          }

          source_bytes=File.binread(SOURCE_MAP)
          source_map=Marshal.load(source_bytes)
          target_map=Marshal.load(File.binread(TARGET_MAP))
          common=Marshal.load(File.binread(COMMON))
          scripts=Marshal.load(File.binread(SCRIPTS))
          v241=Marshal.load(File.binread(ORIGINAL_SCRIPTS))

          raise "Invalid common event table" unless
            common.is_a?(Array) &&
            common[57] && common[179] && common[901]

          raise "Unexpected V273 scripts" unless
            scripts.is_a?(Array) && scripts.length==138

          raise "Original renderer missing" unless
            v241[28].is_a?(Array) &&
            v241[28][1]=="Sprite_Character"

          source_events=iv(source_map,:events)
          target_events=iv(target_map,:events)

          source=source_events.fetch(SOURCE_EVENT)
          previous=target_events.fetch(TARGET_EVENT)

          source_name=iv(source,:name).to_s.dup
            .force_encoding("UTF-8").scrub

          previous_name=iv(previous,:name).to_s.dup
            .force_encoding("UTF-8").scrub

          raise "Wrong Death Knight source" unless
            source_name.include?("데스나이트")

          raise "Wrong existing target" unless
            previous_name.include?("제니스 퀸")

          source_pages=iv(source,:pages)

          raise "Incomplete original Death Knight" unless
            source_pages.length==5

          raise "Wrong original combat page" unless
            iv(source_pages[1],:trigger)==2

          death_condition=iv(source_pages[2],:condition)

          raise "Wrong original HP condition" unless
            iv(death_condition,:variable_valid) &&
            iv(death_condition,:variable_id)==SOURCE_HP &&
            iv(death_condition,:variable_value)==4000

          original_events={}
          target_events.each do |id,event|
            original_events[id]=Marshal.dump(event) unless id==TARGET_EVENT
          end

          original_common=common.map do |ce|
            ce.nil? ? nil : Marshal.dump(ce)
          end

          # Remove only the old independent Zenith engine.
          old_indices=scripts.each_index.select do |index|
            row=scripts[index]
            row.is_a?(Array) && row[1]=="SLZenithV273"
          end

          raise "V273 runtime missing or duplicated" unless
            old_indices.length==1

          scripts.delete_at(old_indices.first)

          raise "Unexpected remaining scripts" unless
            scripts.length==137

          # Restore the exact original sprite renderer.
          scripts[28]=deep_copy(v241[28])

          native=Zlib::Inflate.inflate(scripts[28][2])

          raise "Old Zenith sprite hook remains" if
            native.include?("SLZenithV273") ||
            native.include?("@slz_v273_cfg") ||
            native.include?("@slm_v272_cfg")

          # Check reserved identifiers against other maps and CEs.
          private_switches=[
            TARGET_ATTACK_SWITCH,
            TARGET_MAGIC_SWITCH,
            INACTIVE_WAVE_SWITCH
          ]

          def command_ids(cmd)
            code=iv(cmd,:code)
            p=iv(cmd,:parameters)

            return [[],[]] unless p.is_a?(Array)

            switches=[]
            variables=[]

            case code
            when 121
              if p[0].is_a?(Integer) && p[1].is_a?(Integer)
                if p[1]>=p[0] && p[1]-p[0]<100
                  switches.concat((p[0]..p[1]).to_a)
                end
              end
            when 122
              if p[0].is_a?(Integer) && p[1].is_a?(Integer)
                if p[1]>=p[0] && p[1]-p[0]<100
                  variables.concat((p[0]..p[1]).to_a)
                end
              end
              variables<<p[4] if p[3]==1 && p[4].is_a?(Integer)
            when 111
              switches<<p[1] if p[0]==0
              if p[0]==1
                variables<<p[1]
                variables<<p[4] if p[3]==1 && p[4].is_a?(Integer)
              end
            end

            [switches,variables]
          end

          Dir.glob(DATA+PRE+"Map???.rxdata").each do |path|
            map=Marshal.load(File.binread(path))

            iv(map,:events).each do |id,event|
              next if path==TARGET_MAP && id==TARGET_EVENT

              iv(event,:pages).each do |page|
                cond=iv(page,:condition)

                if iv(cond,:switch1_valid)
                  raise "Switch collision" if
                    private_switches.include?(iv(cond,:switch1_id))
                end

                if iv(cond,:switch2_valid)
                  raise "Switch collision" if
                    private_switches.include?(iv(cond,:switch2_id))
                end

                if iv(cond,:variable_valid)
                  raise "HP variable collision" if
                    iv(cond,:variable_id)==TARGET_HP
                end

                (iv(page,:list)||[]).each do |cmd|
                  sw,vr=command_ids(cmd)
                  raise "Switch collision" unless
                    (sw & private_switches).empty?
                  raise "Variable collision" if vr.include?(TARGET_HP)
                end
              end
            end
          end

          common.compact.each do |ce|
            if iv(ce,:trigger).to_i>0
              raise "Common event switch collision" if
                private_switches.include?(iv(ce,:switch_id))
            end

            (iv(ce,:list)||[]).each do |cmd|
              sw,vr=command_ids(cmd)
              raise "Common event switch collision" unless
                (sw & private_switches).empty?
              raise "Common event variable collision" if vr.include?(TARGET_HP)
            end
          end

          scripts.each do |row|
            next unless row.is_a?(Array)

            content=Zlib::Inflate.inflate(row[2])
              .force_encoding("UTF-8").scrub

            if content.match?(/\$game_variables\[\s*4987\s*\]/) ||
               content.match?(/\$game_switches\[\s*(?:5987|5988|5989)\s*\]/)
              raise "Private ID already used in script #{row[1]}"
            end
          end

          switches=Zlib::Inflate.inflate(scripts[7][2])
          variables=Zlib::Inflate.inflate(scripts[8][2])

          raise "Native switch limit changed" unless
            switches.include?("switch_id <= 6000")

          raise "Native variable limit changed" unless
            variables.include?("variable_id <= 5000")

          # Copy the original common-event graph.
          # CE57 is now independent as well.
          ce_ids=Set.new([57,179,901])

          source_pages.each do |page|
            (iv(page,:list)||[]).each do |cmd|
              next unless iv(cmd,:code)==117
              p=iv(cmd,:parameters)
              ce_ids.add(p[0]) if p.is_a?(Array)
            end
          end

          common.each_with_index do |ce,id|
            next unless ce
            next unless iv(ce,:trigger).to_i>0

            if [SOURCE_ATTACK_SWITCH,SOURCE_MAGIC_SWITCH].include?(
                 iv(ce,:switch_id))
              ce_ids.add(id)
            end
          end

          queue=ce_ids.to_a
          seen=Set.new

          until queue.empty?
            id=queue.shift
            next if seen.include?(id)

            raise "Missing original common event #{id}" unless
              id.is_a?(Integer) && id>0 && common[id]

            seen.add(id)

            (iv(common[id],:list)||[]).each do |cmd|
              next unless iv(cmd,:code)==117
              p=iv(cmd,:parameters)
              next unless p.is_a?(Array)
              child=p[0]
              next if seen.include?(child)
              ce_ids.add(child)
              queue<<child
            end

            raise "Excessive common-event dependency graph" if
              ce_ids.size>96
          end

          ce_map={}

          ce_ids.to_a.sort.each_with_index do |old_id,index|
            ce_map[old_id]=common.length+index
          end

          raise "Required clone CE missing" unless
            ce_map[57] && ce_map[179] && ce_map[901]

          # Copy the actual original graphics without modifying them.
          graphic_dir=ROOT+"Graphics/Characters/"
          graphics={}

          boss=deep_copy(source)
          pages=iv(boss,:pages)

          pages.each do |page|
            graphic=iv(page,:graphic)

            original=iv(graphic,:character_name).to_s.dup
              .force_encoding("UTF-8").scrub

            next if original.empty?

            unless graphics.key?(original)
              native_file=graphic_dir+original+".png"
              raise "Missing native sprite #{original}" unless
                File.file?(native_file)

              new_name=format("SLDK2F_%02d",graphics.length+1)
              new_file=graphic_dir+new_name+".png"

              raise "Clone graphic already exists" if
                File.exist?(new_file)

              FileUtils.cp(native_file,new_file)

              raise "Sprite bytes differ" unless
                Digest::SHA256.file(native_file).hexdigest==
                Digest::SHA256.file(new_file).hexdigest

              graphics[original]={
                "name"=>new_name,
                "source"=>original,
                "file"=>new_file
              }
            end

            put(graphic,:character_name,graphics[original]["name"])
          end

          raise "No graphics copied" if graphics.empty?

          # IMPORTANT V275 FIX:
          # The original RPG script parameters are binary strings.
          # Keep their bytes untouched and perform binary-to-binary
          # substitutions, including Korean graphic filenames.
          def remap_script(text,ce_map,graphics)
            source=text.dup.b

            source.gsub!(
              /\$game_variables\[\s*1980\s*\]/,
              "$game_variables[4987]".b
            )

            source.gsub!(
              /\$game_switches\[\s*133\s*\]/,
              "$game_switches[5987]".b
            )

            source.gsub!(
              /\$game_switches\[\s*135\s*\]/,
              "$game_switches[5988]".b
            )

            source.gsub!(
              /\$game_map\.events\[\s*8\s*\]/,
              "$game_map.events[29]".b
            )

            source.gsub!(
              /\$game_map\.map_id\s*==\s*16\b/,
              "$game_map.map_id==25".b
            )

            source.gsub!(
              /SLMonsterAttackContext\.register\([^)]*\)/,
              "SLMonsterAttackContext.register(5987,25,29)".b
            )

            source.gsub!(
              /common_event_id\s*=\s*(\d+)/
            ) do |match|
              id=match[/\d+/].to_i
              ("common_event_id = #{ce_map.fetch(id,id)}").b
            end

            graphics.each do |original,data|
              replacement=data["name"]

              source=source.gsub(
                "'#{original}'".b,
                "'#{replacement}'".b
              )

              source=source.gsub(
                "\"#{original}\"".b,
                "\"#{replacement}\"".b
              )
            end

            source
          end

          def remap_commands(list,ce_map,graphics)
            list.each do |cmd|
              code=iv(cmd,:code)
              p=iv(cmd,:parameters)
              next unless p.is_a?(Array)

              case code
              when 117
                p[0]=ce_map.fetch(p[0],p[0])

              when 121
                if p[0].is_a?(Integer) && p[1].is_a?(Integer)
                  if p[0]==p[1] && SWITCH_MAP[p[0]]
                    p[0]=SWITCH_MAP[p[0]]
                    p[1]=SWITCH_MAP[p[1]]
                  elsif SWITCH_MAP.keys.any?{|id|p[0]<=id && id<=p[1]}
                    raise "Ranged source switch must be isolated"
                  end
                end

              when 122
                if p[0]==SOURCE_HP && p[1]==SOURCE_HP
                  p[0]=TARGET_HP
                  p[1]=TARGET_HP
                elsif p[0].is_a?(Integer) && p[1].is_a?(Integer) &&
                      p[0]<=SOURCE_HP && SOURCE_HP<=p[1]
                  raise "Ranged source HP variable must be isolated"
                end

                p[4]=TARGET_HP if p[3]==1 && p[4]==SOURCE_HP

              when 111
                if p[0]==0 && SWITCH_MAP[p[1]]
                  p[1]=SWITCH_MAP[p[1]]
                elsif p[0]==1
                  p[1]=TARGET_HP if p[1]==SOURCE_HP
                  p[4]=TARGET_HP if p[3]==1 && p[4]==SOURCE_HP
                end

              when 355,655
                if p[0].is_a?(String)
                  p[0]=remap_script(p[0],ce_map,graphics)
                end

              when 209,207,205
                p[0]=TARGET_EVENT if p[0]==SOURCE_EVENT
              end
            end
          end

          # Deep-copy native common events.
          # Original CEs are never edited.
          ce_map.keys.sort.each do |old_id|
            new_ce=deep_copy(common.fetch(old_id))

            put(new_ce,:id,ce_map[old_id])

            old_name=iv(new_ce,:name).to_s.dup
              .force_encoding("UTF-8").scrub

            put(new_ce,:name,"[DK2F] "+old_name)

            if iv(new_ce,:trigger).to_i>0
              old_switch=iv(new_ce,:switch_id)

              raise "Unexpected shared parallel CE #{old_id}" unless
                SWITCH_MAP.key?(old_switch)

              put(new_ce,:switch_id,SWITCH_MAP[old_switch])
            end

            remap_commands(iv(new_ce,:list)||[],ce_map,graphics)
            common<<new_ce
          end

          # Keep all five original Death Knight pages.
          pages.each do |page|
            condition=iv(page,:condition)

            if iv(condition,:variable_valid) &&
               iv(condition,:variable_id)==SOURCE_HP
              put(condition,:variable_id,TARGET_HP)
            end

            if iv(condition,:switch1_valid) &&
               SWITCH_MAP[iv(condition,:switch1_id)]
              put(
                condition,
                :switch1_id,
                SWITCH_MAP[iv(condition,:switch1_id)]
              )
            end

            if iv(condition,:switch2_valid) &&
               SWITCH_MAP[iv(condition,:switch2_id)]
              put(
                condition,
                :switch2_id,
                SWITCH_MAP[iv(condition,:switch2_id)]
              )
            end

            remap_commands(iv(page,:list)||[],ce_map,graphics)
          end

          # Detach the old colosseum wave condition.
          # Native attack commands and routes are untouched.
          combat_condition=iv(pages[1],:condition)

          put(combat_condition,:switch1_valid,false)
          put(combat_condition,:switch2_valid,false)
          put(combat_condition,:variable_valid,false)
          put(combat_condition,:self_switch_valid,false)

          # Original Death Knight HP remains 4000 for this clone test.
          death_condition=iv(pages[2],:condition)

          put(death_condition,:switch1_valid,false)
          put(death_condition,:switch2_valid,false)
          put(death_condition,:self_switch_valid,false)
          put(death_condition,:variable_valid,true)
          put(death_condition,:variable_id,TARGET_HP)
          put(death_condition,:variable_value,4000)

          # Disable the higher-priority original colosseum pages
          # using an unused, private switch.
          [3,4].each do |page_index|
            condition=iv(pages[page_index],:condition)
            put(condition,:switch1_valid,true)
            put(condition,:switch1_id,INACTIVE_WAVE_SWITCH)
          end

          # Reuse the existing Tower 2F boss location.
          put(boss,:id,TARGET_EVENT)
          put(boss,:name,"데스나이트 (오만 2층 복제)")
          put(boss,:x,iv(previous,:x))
          put(boss,:y,iv(previous,:y))

          target_events[TARGET_EVENT]=boss

          # Verify no other Tower 2F events were touched.
          original_events.each do |id,raw|
            raise "Unrelated Map025 event changed #{id}" unless
              Marshal.dump(target_events[id])==raw
          end

          # Verify every existing CE remains identical.
          original_common.each_with_index do |raw,index|
            current=common[index]
            serialized=current.nil? ? nil : Marshal.dump(current)

            raise "Original common event modified #{index}" unless
              serialized==raw
          end

          raise "Original Death Knight map modified" unless
            File.binread(SOURCE_MAP)==source_bytes

          clone_cycle=common.fetch(ce_map[179])
          clone_attack=common.fetch(ce_map[901])
          clone_damage=common.fetch(ce_map[57])

          raise "Attack switch not isolated" unless
            iv(clone_cycle,:switch_id)==TARGET_ATTACK_SWITCH

          raise "Native attack lost" unless
            (iv(clone_attack,:list)||[]).count{
              |cmd|iv(cmd,:code)==311
            }>=2

          raise "Native damage helper lost" unless
            iv(clone_damage,:list).is_a?(Array)

          raise "Original event page count changed" unless
            iv(boss,:pages).length==5

          raise "Native battle trigger changed" unless
            iv(pages[1],:trigger)==iv(source_pages[1],:trigger)

          raise "Independent HP condition incorrect" unless
            iv(death_condition,:variable_id)==TARGET_HP &&
            iv(death_condition,:variable_value)==4000

          File.binwrite(TARGET_MAP,Marshal.dump(target_map))
          File.binwrite(COMMON,Marshal.dump(common))
          File.binwrite(SCRIPTS,Marshal.dump(scripts))

          File.write(
            "build/new-images.json",
            JSON.pretty_generate(graphics.values),
            encoding:"UTF-8"
          )

          File.write(
            "build/clone-report.json",
            JSON.pretty_generate({
              version:"V275",
              source_map:16,
              source_event:8,
              target_map:25,
              target_event:29,
              copied_pages:5,
              source_hp:1980,
              copied_hp:4987,
              copied_attack_switch:5987,
              copied_magic_switch:5988,
              copied_common_events:ce_map,
              copied_graphics:graphics.values,
              final_script_count:scripts.length
            }),
            encoding:"UTF-8"
          )

          puts "PASS old Zenith runtime removed"
          puts "PASS original V241 sprite renderer restored"
          puts "PASS original 5 Death Knight pages copied"
          puts "PASS CE57 CE179 CE901 independently copied"
          puts "PASS event scripts remapped without text encoding changes"
          puts "PASS original Map016 and original common events unchanged"
          puts "PASS all original graphics preserved"
          RUBY

          ruby -c build/clone.rb
          ruby build/clone.rb

      - name: V275 Update cloned graphic mappings and game version
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re

          root=Path("site")
          game=root/"knight/gameasync"
          mapping=game/"mapping.js"
          text=mapping.read_text("utf-8")

          graphics=json.loads(
              Path("build/new-images.json").read_text("utf-8")
          )

          anchor="];\n\nvar mapping = {}"
          assert text.count(anchor)==1

          entries=[]

          for item in graphics:
              name=item["name"]
              path=Path(item["file"])
              assert path.is_file(),path

              digest=hashlib.md5(path.read_bytes()).hexdigest()

              entries.append(
                  f'["graphics/characters/{name.lower()}", '
                  f'"Graphics/Characters/{name}.png?h={digest}"],'
              )

          text=text.replace(
              anchor,
              "\n"+"\n".join(entries)+"\n"+anchor
          )

          pre="MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"

          modified=[
              game/"Data/Scripts.rxdata",
              game/"Data"/(pre+"Map025.rxdata"),
              game/"Data"/(pre+"CommonEvents.rxdata")
          ]

          for path in modified:
              key="Data/"+path.name
              digest=hashlib.md5(path.read_bytes()).hexdigest()

              pattern="("+re.escape(key)+r"\?h=)[0-9a-f]{32}"

              text,count=re.subn(
                  pattern,
                  lambda match:match.group(1)+digest,
                  text
              )

              assert count==1,(key,count)

          mapping.write_text(text,encoding="utf-8")

          loader=root/"knight/js/sl-assets-v229r115.js"
          source=loader.read_text("utf-8")

          assert source.count("var version='V273';")==1

          loader.write_text(
              source.replace(
                  "var version='V273';",
                  "var version='V275';"
              ),
              encoding="utf-8"
          )

          for name in ("index.html","knight/index.html"):
              path=root/name
              html=path.read_text("utf-8")

              assert "V273" in html,name

              path.write_text(
                  html.replace("V273","V275").replace("v273","v275"),
                  encoding="utf-8"
              )

          print("PASS independent graphic mappings")
          print("PASS RXData hashes updated")
          print("PASS V275 metadata updated")
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/dpad.js

      - name: V275 Verify clone isolation and rollback safety
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root=Path("site")

          before=json.loads(
              Path("build/before.json").read_text("utf-8")
          )

          after={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob("*") if p.is_file()
          }

          pre="knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"

          allowed={
              pre+"Map025.rxdata",
              pre+"CommonEvents.rxdata",
              "knight/gameasync/Data/Scripts.rxdata",
              "knight/gameasync/mapping.js",
              "knight/js/sl-assets-v229r115.js",
              "index.html",
              "knight/index.html"
          }

          images=json.loads(
              Path("build/new-images.json").read_text("utf-8")
          )

          added={
              "knight/gameasync/Graphics/Characters/"
              +entry["name"]+".png"
              for entry in images
          }

          changed={
              name for name in before
              if before[name]!=after.get(name)
          }

          assert changed==allowed,(
              "Unapproved file changes",
              changed^allowed
          )

          assert set(after)-set(before)==added
          assert set(before)-set(after)==set()
          assert len(after)==5610+len(added)

          for name in before:
              if name.startswith("knight/gameasync/Graphics/"):
                  assert before[name]==after[name],name

          for entry in images:
              src=(
                  "knight/gameasync/Graphics/Characters/"
                  +entry["source"]+".png"
              )
              dst=(
                  "knight/gameasync/Graphics/Characters/"
                  +entry["name"]+".png"
              )

              assert before[src]==after[dst]

          for path in (
              pre+"Map016.rxdata",
              pre+"Map021.rxdata",
              "knight/js/drive.js",
              "knight/js/dpad.js",
              "knight/assets/map-047-v241.pack"
          ):
              assert before[path]==after[path],path

          report=json.loads(
              Path("build/clone-report.json").read_text("utf-8")
          )

          ce=report["copied_common_events"]

          assert "57" in ce and "179" in ce and "901" in ce
          assert ce["57"]!=57
          assert ce["179"]!=179
          assert ce["901"]!=901
          assert report["copied_pages"]==5
          assert report["copied_hp"]!=report["source_hp"]
          assert report["copied_attack_switch"]!=133
          assert report["copied_magic_switch"]!=135
          assert report["final_script_count"]==137

          print("PASS original Death Knight map unchanged")
          print("PASS original common events preserved")
          print("PASS cloned CEs have independent IDs")
          print("PASS original sprites are byte-identical")
          print("PASS clone sprites have independent filenames")
          print("PASS no added game runtime or movement engine")
          print("PASS unrelated original files unchanged")
          PY

      - name: V275 Publish game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

