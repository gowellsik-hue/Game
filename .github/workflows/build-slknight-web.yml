          assert 'V229R40' in html and 'V229R40' in (out/'index.html').read_text(encoding='utf-8')
          print('PASS: 5472 R38 files,',len(expected),'modified, 29 added; all other assets/events untouched, BGM 60%, smith silent')
          R40_VERIFY_FILES
          PYTHON="$(cat build/r40-python.txt)"
          "$PYTHON" /tmp/r40_verify_files_ci.py build/r38-baseline.json site build | tee build/r40-file-integrity.txt

