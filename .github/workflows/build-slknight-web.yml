
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R100
# ROLLBACK: restore successfully deployed V229R97 as-is, without rebuilding.
# SOURCE: workflow run 40326370483 / github-pages artifact.
# R98/R99 stain edits and C-chunk load skipping are removed by restoring R97.
# Keep original R97 engine, 1F/2F floors, walls, monster behavior, S32 and D-pad.
# No new image filtering, transparency changes, texture replacement or movement code.
# Only change the two displayed HTML version labels R97 -> R100.
name: build-slknight-web.yml | V229R100 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R100 Download known-good R97 pages artifact
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40326370483
          name: github-pages
          github-token: ${{ github.token }}
          path: r97

      - name: V229R100 Restore exact R97 game and check unchanged assets
        shell: bash
        run: |
          set -euo pipefail
          test -s r97/artifact.tar
          mkdir -p site
          tar -xf r97/artifact.tar -C site
          python3 - <<'PY_CHECK'
          from pathlib import Path
          import hashlib
          root=Path('site')
          paths={str(p.relative_to(root)): p for p in root.rglob('*') if p.is_file()}
          assert len(paths)==5517, ('Unexpected R97 file count', len(paths))
          expected={
            'knight/gameasync/Data/Scripts.rxdata': '62b575db7e96c954d0076d20642208880b46e9ae481246390031ec0c10015534',
            'knight/js/dpad.js': '2bd401adf130339d154ce6a8efd0127cefd9b1bc58bc60d1de68e8b6d8b7a791',
            'knight/gameasync/Graphics/Panoramas/SLTI_46_C5_2.png': 'ab7bba2ee74667a4eba7835a7340f675a5522bb279257d37d7aff716197ba76e',
          }
          for name, digest in expected.items():
            assert name in paths, ('Missing R97 file', name)
            assert hashlib.sha256(paths[name].read_bytes()).hexdigest()==digest, ('Wrong R97 file', name)
          for name in ('index.html', 'knight/index.html'):
            path=paths[name]
            html=path.read_text(encoding='utf-8')
            assert 'V229R97' in html and 'V229R100' not in html, ('Wrong R97 HTML', name)
            path.write_text(html.replace('V229R97','V229R100').replace('v229r97','v229r100'), encoding='utf-8')
          assert len({str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()})==5517
          for name, digest in expected.items():
            assert hashlib.sha256(paths[name].read_bytes()).hexdigest()==digest, ('Protected asset altered', name)
          print('PASS: R97 game and original floor C restored; only two HTML version labels changed')
          PY_CHECK
          node --check site/knight/js/dpad.js
          node --check site/knight/gameasync/mapping.js

      - name: V229R100 Upload restored R97 without any graphics replacement
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
