              route.instance_variable_set(:@list,[commands[0],commands[-1]])
              page.instance_variable_set(:@trigger,0)
              page.instance_variable_set(:@list,[new_event_command(0,[])])
              event.instance_variable_set(:@pages,[page])
              check(!events.key?(highest+i+1),"#{map_id}: map event collision")
              events[highest+i+1]=event
            end
            check(original_ids.all?{|id|events.key?(id) && (healer.any?{|h|h.instance_variable_get(:@id)==id} || Digest::SHA256.hexdigest(Marshal.dump(events[id]))==original_hashes[id])},"#{map_id}: unrelated map event changed")
            File.binwrite(path,Marshal.dump(map))
            map_stats << [map_id,events.size,healer.size==1]
          end
          exp_scripts_after=scripts.filter_map do |row|
            next unless row.is_a?(Array) && row[2].is_a?(String)
            source=Zlib::Inflate.inflate(row[2])
            [row[1],source] if source.include?('SLV541')
          end
          check(exp_scripts_before==exp_scripts_after,'SLV541-related script changed')
          File.binwrite(actor_path,Marshal.dump(actors))
          File.binwrite(item_path,Marshal.dump(items))
          File.binwrite(ce_path,Marshal.dump(common))
          File.binwrite(script_path,Marshal.dump(scripts))

          mapping=File.join(main,'mapping.js')
          js=File.binread(mapping).force_encoding('UTF-8')
          check(js.valid_encoding?,'mapping.js not UTF8')
          ([actor_path,item_path,ce_path,script_path]+map_files).each do |path|
            rel='Data/'+File.basename(path)
            pattern=Regexp.new(Regexp.escape(rel)+'\\?h=[a-f0-9]{32}')
            matches=js.scan(pattern)
            check(matches.size==1,"mapping #{rel} count #{matches.size}")
            js=js.sub(pattern,rel+'?h='+Digest::MD5.file(path).hexdigest)
          end
          (ORDER+['법사']).each do |name|
            rel='Graphics/Characters/'+name+'.png'
            key='graphics/characters/'+name.downcase
            digest=Digest::MD5.file(File.join(main,rel)).hexdigest
            row='["'+key+'", "'+rel+'?h='+digest+'"],'
            rgx=Regexp.new('\\["'+Regexp.escape(key)+'", "'+Regexp.escape(rel)+'\\?h=[a-f0-9]{32}"\\],')
            if js.match?(rgx)
              js=js.sub(rgx,row)
            else
              anchor='["graphics/characters/여요정", '
              check(js.scan(anchor).size==1,"missing unique graphics anchor for #{name}")
              at=js.index("\n",js.index(anchor))
              js=js[0,at+1]+row+"\n"+js[at+1..]
            end
          end
          File.write(mapping,js)

          puts JSON.generate({actors:ACTOR_IDS,items:ITEM_IDS,commonEvents:CE_IDS,
            activeSwitches:SWITCH_IDS,sourceGraphics:ORDER,maps:map_stats.size,
            mapsWithHealer:map_stats.count{|i|i[2]},mapsWithoutHealer:map_stats.select{|i|!i[2]}.map(&:first),
            newMapEvents:map_stats.size*6,expScript:'SLV541 untouched',
            attack:'Not connected in this prototype'})
          V31_COMPANIONS_RUBY
          ruby -c build/v31/companions.rb
          ruby build/v31/companions.rb site/knight build/v31/elf
          .venv/bin/python - <<'V31_VERSION_AND_VERIFY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          loader=root/'knight/js/sl-assets-v229r115.js'
          js=loader.read_text('utf8')
          assert js.count("var version='V2.14';")==1
          loader.write_text(js.replace("var version='V2.14';","var version='V3.3';"),'utf8')
          for name in ('index.html','knight/index.html'):
              p=root/name
              src=p.read_text('utf8')
              assert 'V2.14' in src,('missing V2.14 identity',name)
              p.write_text(src.replace('V2.14','V3.3').replace('v2.14','v3.2'),'utf8')
          before=json.loads(Path('build/v31/before.json').read_text('utf8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          changed={p for p in before.keys()&after.keys() if before[p]!=after[p]}
          added=set(after)-set(before)
          removed=set(before)-set(after)
          data=root/'knight/gameasync/Data'
          named=lambda name: next(p for p in data.glob('*'+name+'.rxdata') if p.stat().st_size>10)
          expected={'knight/gameasync/Data/'+named(x).name for x in ('Actors','Items','CommonEvents','Scripts')}
          maps={'knight/gameasync/Data/'+p.name for p in data.glob('*Map???.rxdata') if p.stat().st_size>10}
          expected|=maps
          expected|={'knight/gameasync/mapping.js','knight/js/sl-assets-v229r115.js',
                     'index.html','knight/index.html'}
          approved_add={'knight/gameasync/Graphics/Characters/'+n+'.png'
                        for n in ('여요정','다크엘프','다크레인저','실버레인저','애로우 마스터','아크스카우터','법사')}
          assert changed==expected,('changed mismatch',sorted(changed-expected),sorted(expected-changed))
          assert added<=approved_add and 'knight/gameasync/Graphics/Characters/법사.png' in added,('unexpected additions',sorted(added-approved_add))
          assert not removed,('unexpected removals',sorted(removed))
          print('PASS V3.3 companions registered and native 1x walking branches compiled',len(maps))
          print('PASS V3.3 only approved data, images and versions changed',len(changed),len(added))
          V31_VERSION_AND_VERIFY
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Publish V3.3 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
