name: Deploy SLKnight V14.3z10.4 + SLFairy SCREEN FIX

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions: {contents: read, pages: write, id-token: write}

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  DUAL_BASE_SHA: 04ce66ec99abc10f77143de53650685db8949532
  CURRENT_Z10_SHA: f545634bafbe1e1e55aaf6489126ad17b07da382
  BASELINE_SHA: c6815cd461dba60ec131898e6d5dd8690dd915ae
  X2_SHA: 6d941bd643dda87b8267ba466e108d1904c22331
  Z1_SHA: 008b6abe81074b7af877806b45f2314004a74f66
  Z3_SHA: 5a46988b048764e8a99700998c1f4ab96a3ec5c1
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  FAIRY_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLFairy_Source_v1.zip
  FAIRY_SHA256: 67b88b5fe0cde3c9f2fada889815f9aa7d0fc94b378025529e9950d55151c70e
  FAIRY_7Z_PASSWORD: http://nemo838.tistory.com/
  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout frozen dual base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.DUAL_BASE_SHA }}
          path: dualbase

      - name: Checkout frozen z10 workflow source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.CURRENT_Z10_SHA }}
          path: z10src

      - name: Checkout frozen V14.3l baseline
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.BASELINE_SHA }}
          path: baseline

      - name: Checkout frozen V14.3x2 native auto base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.X2_SHA }}
          path: x2

      - name: Checkout frozen V14.3z1 verified monster base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z1_SHA }}
          path: z1

      - name: Checkout frozen V14.3z3 current success
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z3_SHA }}
          path: z3

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake cmake curl ffmpeg freepats git imagemagick libtool make mm-common patch pkg-config python3 rake ruby timidity unzip wget xz-utils fonts-nanum p7zip-full

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.MKXP_SRC_REF }}
          path: engine

      - name: Cache engine dependencies
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-${{ runner.os }}-${{ env.EMSDK_VER }}-onig25b

      - name: Extract passed build steps from z10.2 through Fairy media
        run: |
          ruby -ryaml - <<'RB'
          doc=YAML.load_file('dualbase/.github/workflows/build-slknight-web.yml')
          steps=doc.fetch('jobs').fetch('build').fetch('steps')

          first='Extract exact current z10 run steps'
          last='Convert SLFairy media'

          a=steps.index{|s|s['name']==first}
          b=steps.index{|s|s['name']==last}

          abort "DUAL BASE START STEP MISSING: #{first}" unless a
          abort "DUAL BASE END STEP MISSING: #{last}" unless b
          abort 'DUAL BASE STEP ORDER INVALID' unless a<=b

          selected=steps[a..b]
          bad=selected.reject{|s|s['run']}
          abort "NON-RUN STEP INSIDE FROZEN RANGE: #{bad.map{|s|s['name']}.inspect}" unless bad.empty?

          selected.each_with_index do |step,i|
            path=format('/tmp/dual_pass_%02d.sh',i)
            File.write(path,step.fetch('run'))
            puts "FROZEN_STEP #{i}: #{step['name']}"
          end

          File.write('/tmp/dual_pass_count',selected.length.to_s)
          puts "FROZEN_PASSED_RANGE_OK count=#{selected.length}"
          RB

      - name: Run frozen build through Fairy media
        run: |
          set -euo pipefail
          count="$(cat /tmp/dual_pass_count)"
          i=0
          while [ "$i" -lt "$count" ]; do
            f="$(printf '/tmp/dual_pass_%02d.sh' "$i")"
            echo "===== RUN FROZEN STEP $i/$count : $f ====="
            bash -e "$f"
            i=$((i+1))
          done
          echo FROZEN_BUILD_THROUGH_FAIRY_MEDIA_OK

      - name: Repair SLFairy Ruby boot syntax
        run: |
          set -euo pipefail

          ruby -EUTF-8:UTF-8 -rzlib - fairy_player/gameasync/Data/Scripts.rxdata <<'RB'
          path=ARGV.fetch(0)
          scripts=Marshal.load(File.binread(path))

          def entry(scripts,name)
            scripts.find{|e|e.is_a?(Array)&&e.length>=3&&e[1].to_s==name} || abort("FAIRY SCRIPT MISSING: #{name}")
          end

          def inflate(e)
            Zlib::Inflate.inflate(e[2]).force_encoding(Encoding::UTF_8)
          end

          def store(e,src)
            e[2]=Zlib::Deflate.deflate(src)
          end

          web=entry(scripts,'Web Compatibility')
          src=inflate(web)

          fixes=[
            [
              /return\(\s*code\s*&&\s*Input\.trigger\?\(code\)\s*\?\s*1\s*:\s*0\s*\)/m,
              'return(code && Input.trigger?(code) ? 1 : 0)',
              'GetAsyncKeyState ternary'
            ],
            [
              /return\(\s*code\s*&&\s*Input\.press\?\(code\)\s*\?\s*-1\s*:\s*0\s*\)/m,
              'return(code && Input.press?(code) ? -1 : 0)',
              'GetKeyState ternary'
            ]
          ]

          fixes.each do |rx,replacement,label|
            count=src.scan(rx).length
            abort "FAIRY WEB REPAIR COUNT #{label}=#{count}" unless count==1
            src.sub!(rx,replacement)
          end

          store(web,src)

          mobile=entry(scripts,'Mobile Diablo Assist')
          src=inflate(mobile)

          distance_rx=/if\s*\(\s*\(\s*event\.x-self\.x\s*\)\.abs\s*\+\s*\(\s*event\.y-self\.y\s*\)\.abs\s*==\s*1\s*\)/m
          count=src.scan(distance_rx).length
          abort "FAIRY MOBILE DISTANCE REPAIR COUNT=#{count}" unless count==1

          src.sub!(
            distance_rx,
            'if (event.x-self.x).abs+(event.y-self.y).abs==1'
          )

          store(mobile,src)

          File.binwrite(path,Marshal.dump(scripts))

          scripts.each_with_index do |e,i|
            next unless e.is_a?(Array)&&e.length>=3

            begin
              code=Zlib::Inflate.inflate(e[2])
            rescue Zlib::DataError
              next
            end

            begin
              RubyVM::InstructionSequence.compile(
                code,
                "fairy_script_#{i}_#{e[1]}"
              )
            rescue SyntaxError=>ex
              abort(
                "FAIRY RUBY SYNTAX ERROR " \
                "script=#{i} name=#{e[1]}: #{ex.message}"
              )
            end
          end

          puts 'FAIRY_ALL_RUBY_SYNTAX_OK'
          RB

      - name: Build SLFairy mappings after syntax repair
        run: |
          set -euo pipefail

          (
            cd fairy_player/gameasync
            bash "$GITHUB_WORKSPACE/engine/extra/make_mapping.sh"
          )

          test -s fairy_player/gameasync/mapping.js
          test -s fairy_player/gameasync/bitmap-map.js

          echo FAIRY_MAPPING_AFTER_REPAIR_OK

      - name: Finalize SLFairy identity and hotkeys
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('fairy_player/index.html')
          s=p.read_text()

          if 'slknight_v14_engine' not in s:
              raise SystemExit(
                  'Fairy copied Knight namespace marker missing'
              )

          if 'SLKnight V14.3z100' not in s:
              raise SystemExit(
                  'Fairy copied Knight title marker missing'
              )

          if 'v143z100' not in s:
              raise SystemExit(
                  'Fairy copied Knight cache marker missing'
              )

          s=s.replace(
              'v143z100',
              'v143z104elf'
          )

          s=s.replace(
              'SLKnight V14.3z100',
              'SLFairy V14.3z10.4'
          )

          s=s.replace(
              'slknight_v14_engine',
              'slfairy_v14_engine'
          )

          pat=re.compile(
              r"\n\s*var slAttackSheets=.*?"
              r"\n\s*slAttackCoords\.forEach"
              r"\(function\(name\)\{.*?"
              r"\n\s*\}\);",
              re.S
          )

          s,n=pat.subn(
              '',
              s,
              count=1
          )

          if n!=1:
              raise SystemExit(
                  f'Knight monster preload block removal count={n}'
              )

          for marker in (
              'slfairy_v14_engine',
              'SLFairy V14.3z10.4',
              'v143z104elf'
          ):
              if marker not in s:
                  raise SystemExit(
                      'Fairy final marker missing: '+marker
                  )

          if (
              'slAttackSheets' in s
              or
              'slAttackCoords' in s
          ):
              raise SystemExit(
                  'Knight monster preload remains in Fairy index'
              )

          p.write_text(s)

          d=Path(
              'fairy_player/js/dpad.js'
          )

          t=d.read_text()

          old=(
              "hotButton(hot,0,'A',65);"
              "hotButton(hot,1,'S',83);"
              "hotButton(hot,2,'D',68);"
              "hotButton(hot,3,'Q',81);"
              "hotButton(hot,4,'Z',117);"
              "hotButton(hot,5,'F',116);"
          )

          new=(
              "hotButton(hot,0,'A',117);"
              "hotButton(hot,1,'S',118);"
              "hotButton(hot,2,'D',119);"
              "hotButton(hot,3,'Q',120);"
              "hotButton(hot,4,'F',116);"
          )

          if t.count(old)!=1:
              raise SystemExit(
                  f'Fairy dpad hotbar marker count={t.count(old)}'
              )

          d.write_text(
              t.replace(
                  old,
                  new,
                  1
              )
          )

          print(
              'FAIRY_FINALIZE_Z104_OK'
          )
          PY

          touch fairy_player/.nojekyll

      - name: Verify SLFairy bootable web build
        run: |
          set -euo pipefail

          test -s fairy_player/index.html
          test -s fairy_player/mkxp.js
          test -s fairy_player/mkxp.wasm

          test -s \
            fairy_player/gameasync/Game.ini

          test -s \
            fairy_player/gameasync/Data/Scripts.rxdata

          test -s \
            fairy_player/gameasync/mapping.js

          test -s \
            fairy_player/gameasync/bitmap-map.js

          ! test -e \
            fairy_player/gameasync/Game.rgssad

          grep -Fq \
            'slfairy_v14_engine' \
            fairy_player/index.html

          grep -Fq \
            'SLFairy V14.3z10.4' \
            fairy_player/index.html

          grep -Fq \
            'v143z104elf' \
            fairy_player/index.html

          ! grep -Fq \
            'slAttackSheets' \
            fairy_player/index.html

          ! grep -Fq \
            'slAttackCoords' \
            fairy_player/index.html

          grep -Fq \
            "hotButton(hot,0,'A',117)" \
            fairy_player/js/dpad.js

          grep -Fq \
            "hotButton(hot,1,'S',118)" \
            fairy_player/js/dpad.js

          grep -Fq \
            "hotButton(hot,2,'D',119)" \
            fairy_player/js/dpad.js

          grep -Fq \
            "hotButton(hot,3,'Q',120)" \
            fairy_player/js/dpad.js

          grep -Fq \
            "hotButton(hot,4,'F',116)" \
            fairy_player/js/dpad.js

          ! grep -Fq \
            "hotButton(hot,4,'Z',117)" \
            fairy_player/js/dpad.js

          node --check \
            fairy_player/js/dpad.js

          node --check \
            fairy_player/js/drive.js

          ruby \
            -EUTF-8:UTF-8 \
            -rzlib \
            - \
            fairy_player/gameasync/Data/Scripts.rxdata \
            <<'RB'

          scripts=Marshal.load(
            File.binread(
              ARGV[0]
            )
          )

          names=
            scripts
            .select do |e|
              e.is_a?(Array) &&
                e.length>=3
            end
            .map do |e|
              e[1].to_s
            end

          [
            'Web Compatibility',
            'Mobile Diablo Assist',
            'Web Resolution 800x600',
            'Main',
            'Scene_Title'
          ].each do |name|

            abort(
              "FAIRY SCRIPT MISSING: #{name}"
            ) unless names.include?(name)
          end

          scripts.each_with_index do |e,i|

            next unless (
              e.is_a?(Array) &&
              e.length>=3
            )

            begin
              code=
                Zlib::Inflate.inflate(
                  e[2]
                )
            rescue Zlib::DataError
              next
            end

            begin
              RubyVM::InstructionSequence.compile(
                code,
                "fairy_verify_#{i}_#{e[1]}"
              )
            rescue SyntaxError=>ex
              abort(
                "FAIRY RUBY SYNTAX ERROR " \
                "script=#{i} name=#{e[1]}: " \
                "#{ex.message}"
              )
            end
          end

          puts \
            'FAIRY_BOOT_SCRIPT_VERIFY_OK'
          RB

          echo \
            "FAIRY_FILES=$(find fairy_player/gameasync -type f | wc -l)"

          du -sh fairy_player

      - name: Build Knight + Fairy class launcher
        run: |
          set -euo pipefail

          rm -rf \
            /tmp/sl_dual_site

          mkdir -p \
            /tmp/sl_dual_site/knight \
            /tmp/sl_dual_site/elf

          cp -a \
            player/. \
            /tmp/sl_dual_site/knight/

          cp -a \
            fairy_player/. \
            /tmp/sl_dual_site/elf/

          cat > /tmp/sl_dual_site/index.html <<'HTML'
          <!doctype html>
          <html lang="ko">
          <head>
            <meta charset="utf-8">
            <meta
              name="viewport"
              content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
            >
            <title>SLKnight + SLFairy Mobile</title>
            <style>
              html,body{
                margin:0;
                width:100%;
                height:100%;
                background:#080808;
                color:#fff;
                font-family:system-ui,sans-serif
              }

              .wrap{
                height:100%;
                display:flex;
                align-items:center;
                justify-content:center;
                flex-direction:column;
                gap:22px
              }

              h1{
                font-size:30px;
                margin:0 0 12px
              }

              .choices{
                display:flex;
                gap:18px
              }

              .card{
                width:150px;
                height:170px;
                border:1px solid #777;
                border-radius:14px;
                background:#171717;
                color:#fff;
                font-size:25px;
                cursor:pointer
              }

              .card:active{
                transform:scale(.97)
              }

              .sub{
                font-size:13px;
                color:#aaa;
                text-align:center;
                max-width:390px;
                line-height:1.5
              }
            </style>
          </head>

          <body>
            <div class="wrap">
              <h1>캐릭터 선택</h1>

              <div class="choices">
                <button
                  class="card"
                  onclick="location.href='knight/'"
                >
                  기사
                </button>

                <button
                  class="card"
                  onclick="location.href='elf/'"
                >
                  요정
                </button>
              </div>

              <div class="sub">
                기사와 요정은 원본 게임 파일과 저장 데이터가 서로 분리되어 실행됩니다.
              </div>
            </div>
          </body>
          </html>
          HTML

          touch \
            /tmp/sl_dual_site/.nojekyll

          test -s \
            /tmp/sl_dual_site/index.html

          test -s \
            /tmp/sl_dual_site/knight/index.html

          test -s \
            /tmp/sl_dual_site/elf/index.html

          grep -Fq \
            'slknight_v14_engine' \
            /tmp/sl_dual_site/knight/index.html

          grep -Fq \
            'slfairy_v14_engine' \
            /tmp/sl_dual_site/elf/index.html

          rm -rf \
            player \
            fairy_player

          mv \
            /tmp/sl_dual_site \
            player

          echo \
            DUAL_INDEPENDENT_BUILD_OK

          du -sh \
            player

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player

  deploy:
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
