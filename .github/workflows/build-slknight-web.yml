
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R50 (corrected)
# BASE: successful V229R49 run 39723286181.
# DELETE ONLY: Map43 Baal EV1/EV8, Map44 Baal EV1.
# RENAME: Baal Lair map names to 기르정벌.
# KEEP: all other events, monsters, controllers, maps,
#       original scripts, stairs, healing, loot and audio.
# V230 491EV balance data is not changed here.
name: build-slknight-web.yml | V229R50 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R50 Restore successful R49 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39723286181
          name: github-pages
          github-token: ${{ github.token }}
          path: r49

      - name: V229R50 Verify R49 files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s r49/artifact.tar
          tar -xf r49/artifact.tar -C site
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          p='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          expected={
            'MapInfos.rxdata':'d83f99a3b4c2a5cc5ab94a6b846c8c016dfff8ba47d66a2774b7c226ea8a611c',
            'Map043.rxdata':'812fd3cf12f5bac934971b7b29c225c34fc4233cbdfdb01ff2d65efb099e0c89',
            'Map044.rxdata':'1cc85af3d82f8a258b07001c25df31a1e8db32093db69a2abf4c5dff6ff7b428',
          }
          for name,sha in expected.items():
              file=root/'knight/gameasync/Data'/(p+name)
              assert file.is_file()
              assert hashlib.sha256(file.read_bytes()).hexdigest()==sha,name
          baseline={
              str(f.relative_to(root)):hashlib.sha256(f.read_bytes()).hexdigest()
              for f in root.rglob('*') if f.is_file()
          }
          assert len(baseline)==5517,len(baseline)
          assert 'V229R49' in (root/'index.html').read_text('utf-8')
          assert 'V229R49' in (root/'knight/index.html').read_text('utf-8')
          Path('build/r50-baseline.json').write_text(
              json.dumps(baseline,sort_keys=True)
          )
          print('PASS: original R49 baseline')
          PY_BASE

      - name: V229R50 Remove only Baal events
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r50-only-baal.rb <<'R50_RUBY'
          require 'json'
          require 'digest'

          module RPG
            class Map;end
            class MapInfo;end
            class AudioFile;end
            class Tileset;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end

          class Table
            def self._load(raw)
              o=allocate
              o.instance_variable_set(:@raw,raw)
              o
            end
            def _dump(depth=0);@raw;end
          end

          class Tone
            def self._load(raw)
              o=allocate
              o.instance_variable_set(:@raw,raw)
              o
            end
            def _dump(depth=0);@raw;end
          end
          class Color<Tone;end

          def iv(o,key)
            o.instance_variable_get('@'+key.to_s)
          end
          def sv(o,key,value)
            o.instance_variable_set('@'+key.to_s,value)
          end
          def utf(s)
            s.to_s.dup.force_encoding('UTF-8').scrub
          end
          def check(ok,message)
            raise message unless ok
          end

          base='site/knight/gameasync/Data/'
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          hashes={
            'MapInfos.rxdata'=>'d83f99a3b4c2a5cc5ab94a6b846c8c016dfff8ba47d66a2774b7c226ea8a611c',
            'Map043.rxdata'=>'812fd3cf12f5bac934971b7b29c225c34fc4233cbdfdb01ff2d65efb099e0c89',
            'Map044.rxdata'=>'1cc85af3d82f8a258b07001c25df31a1e8db32093db69a2abf4c5dff6ff7b428',
          }

          hashes.each do |name,sha|
            check(
              Digest::SHA256.file(base+prefix+name).hexdigest==sha,
              "Wrong R49 input #{name}"
            )
          end

          # Keep both maps. Change their names only.
          info_path=base+prefix+'MapInfos.rxdata'
          infos=Marshal.load(File.binread(info_path))
          check(
            utf(iv(infos.fetch(43),'name'))=='바알 레어-기르정벌',
            'Map43 title changed'
          )
          check(
            utf(iv(infos.fetch(44),'name'))=='바알 레어-바알 정벌',
            'Map44 title changed'
          )
          [43,44].each do |mid|
            sv(infos.fetch(mid),'name','기르정벌')
          end
          File.binwrite(info_path,Marshal.dump(infos))

          audit={}

          # No controller IDs or other monster IDs are deleted.
          {43=>[1,8],44=>[1]}.each do |mid,baal_ids|
            path=base+prefix+format('Map%03d.rxdata',mid)
            original=Marshal.load(File.binread(path))
            mapped=Marshal.load(File.binread(path))
            before=iv(original,'events')
            events=iv(mapped,'events')

            check(
              events.size==(mid==43 ? 75 : 8),
              "Unexpected Map#{mid} event count"
            )

            baal_ids.each do |id|
              name=utf(iv(events.fetch(id),'name'))
              check(
                name=='[ID바알]' || name=='바알',
                "Event #{mid}/#{id} is not Baal"
              )
              events.delete(id)
            end

            # Preserve all other events.
            # Update only the existing field display name on Map43.
            if mid==43
              page=iv(events.fetch(4),'pages').fetch(0)
              commands=iv(page,'list')
              labels=commands.select do |c|
                iv(c,'code')==355 &&
                  utf(iv(c,'parameters')[0])=='$MapName = "지옥"'
              end
              check(labels.size==1,'Map43 display label missing')
              iv(labels.first,'parameters')[0]='$MapName = "기르정벌"'
            end

            expected=mid==43 ? 73 : 7
            check(events.size==expected,"Other events deleted on Map#{mid}")
            check(
              events.keys.sort==(before.keys-baal_ids).sort,
              "Other event IDs changed on Map#{mid}"
            )

            events.each do |id,event|
              next if mid==43 && id==4
              check(
                Marshal.dump(event)==Marshal.dump(before.fetch(id)),
                "Other event modified #{mid}/#{id}"
              )
            end

            if mid==43
              old_ev4=Marshal.load(Marshal.dump(before.fetch(4)))
              commands=iv(iv(old_ev4,'pages').fetch(0),'list')
              label=commands.find do |c|
                iv(c,'code')==355 &&
                  utf(iv(c,'parameters')[0])=='$MapName = "지옥"'
              end
              check(!label.nil?,'Original display label missing')
              iv(label,'parameters')[0]='$MapName = "기르정벌"'
              check(
                Marshal.dump(old_ev4)==Marshal.dump(events.fetch(4)),
                'Map43 EV4 changed beyond display name'
              )
            end

            check(
              Marshal.dump(iv(original,'data'))==Marshal.dump(iv(mapped,'data')),
              "Terrain changed on Map#{mid}"
            )

            File.binwrite(path,Marshal.dump(mapped))

            audit[mid.to_s]={
              'deletedBaalEventIDs'=>baal_ids,
              'preservedOtherEvents'=>events.size
            }

            puts "Map#{mid}: only Baal #{baal_ids.inspect} removed"
          end

          [43,44].each do |mid|
            path=base+prefix+format('Map%03d.rxdata',mid)
            data=Marshal.load(File.binread(path))
            check(
              iv(data,'events').values.none? do |e|
                utf(iv(e,'name')).include?('바알')
              end,
              "Baal still exists on Map#{mid}"
            )
          end

          File.write(
            'build/r50-baal-only-audit.json',
            JSON.pretty_generate(audit)
          )

          puts 'PASS: exactly 3 Baal events deleted'
          puts 'PASS: 80 other events preserved'
          R50_RUBY
          ruby -c /tmp/r50-only-baal.rb
          ruby /tmp/r50-only-baal.rb

      - name: V229R50 Update only changed asset hashes and version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_MANIFEST'
          from pathlib import Path
          import hashlib,re

          site=Path('site')
          file=site/'knight/gameasync/mapping.js'
          text=file.read_text('utf-8')
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          for name in ('MapInfos.rxdata','Map043.rxdata','Map044.rxdata'):
              rel='Data/'+prefix+name
              path=site/'knight/gameasync'/rel
              marker=rel+'?h='
              text,n=re.subn(
                  re.escape(marker)+r'[0-9a-f]{32}',
                  lambda _:marker+hashlib.md5(path.read_bytes()).hexdigest(),
                  text
              )
              assert n==1,(name,n)

          file.write_text(text,encoding='utf-8')

          for name in ('index.html','knight/index.html'):
              p=site/name
              old=p.read_text('utf-8')
              assert 'V229R49' in old,name
              p.write_text(
                  old.replace('V229R49','V229R50')
                     .replace('v229r49','v229r50'),
                  encoding='utf-8'
              )
          PY_MANIFEST
          node --check site/knight/gameasync/mapping.js

      - name: V229R50 Verify only approved game changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import json,hashlib

          root=Path('site')
          before=json.loads(
              Path('build/r50-baseline.json').read_text('utf-8')
          )
          after={
              str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          assert before.keys()==after.keys()
          assert len(after)==5517

          changed={
              name for name in before if before[name]!=after[name]
          }

          pre='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          allowed={
              'index.html',
              'knight/index.html',
              'knight/gameasync/mapping.js',
              pre+'MapInfos.rxdata',
              pre+'Map043.rxdata',
              pre+'Map044.rxdata'
          }

          assert changed==allowed,('Unapproved changes',changed^allowed)

          audit=json.loads(
              Path('build/r50-baal-only-audit.json').read_text('utf-8')
          )

          assert audit=={
              '43':{
                  'deletedBaalEventIDs':[1,8],
                  'preservedOtherEvents':73
              },
              '44':{
                  'deletedBaalEventIDs':[1],
                  'preservedOtherEvents':7
              }
          }

          assert 'V229R50' in (root/'index.html').read_text('utf-8')
          assert 'V229R50' in (root/'knight/index.html').read_text('utf-8')

          print('PASS: three Baal events removed')
          print('PASS: all 80 other events preserved')
          print('PASS: no other maps or game code modified')
          PY_FINAL

      - name: V229R50 Upload existing SLKnight to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
