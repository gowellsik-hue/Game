
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V234
# BASE: Successful V233 GitHub Pages artifact, run 41250725280.
# ACTUAL CHANGE: Restore separate original Sanctuary Map0 Layer4 RGBA graphics
#                over the Map047 player using the native Layer5 opacity cells.
# FIX: V233 projected native Layer5 at half-size and did not import Layer4 art.
# FIX: Layer4 original foreground now covers actor; actor fades to 150 behind it.
# FIX: V234 native-to-RPG projection checked against the original house art.
# PRESERVE: Map047 original Panorama and every existing 384/385 collision tile,
#           seven NPCs/Pandora, all other maps, gameplay, saves and controls.
# PRELOAD: Existing 97 Map047 graphics plus 96 original Layer4 alpha chunks,
#          all fully staged before game enters Map047, no image fetch on movement.
# KEEP DELETED: Map045 and Map046 (Talking Island Dungeon).
# WORKFLOW FILE/TITLE: Preserve; change version only.
# STATUS: static tests passed; live GitHub/mobile run still pending.
name: build-slknight-web.yml | V234 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: V234 Download last verified V233 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41250725280
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V234 Unpack and fingerprint original V233 game
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build source
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          if len(before)!=5504:raise ValueError('Unexpected V233 file count')
          if 'V233' not in (root/'knight/index.html').read_text('utf8'):
              raise ValueError('Wrong V233 game baseline')
          prefix='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          if prefix+'Map047.rxdata' not in before:raise ValueError('Map047 missing')
          for mid in (45,46):
              if prefix+f'Map{mid:03d}.rxdata' in before:raise ValueError('Deleted dungeon returned')
          if before['knight/gameasync/Data/Scripts.rxdata']!='b92a5279f3926673bd082d25b7d73a575faa76c46ef87a5ed024a1e8e6be4d1a':
              raise ValueError('Unexpected V233 scripts')
          if before['knight/gameasync/Graphics/Panoramas/SLTI_47_C7_4.png']!='d1f321ba3012e9422e909b2ba4865dfcfaf188cb0671c459597f935537a26991':
              raise ValueError('Map047 original artwork changed')
          if 'knight/assets/map-047-v229r151.pack' not in before:
              raise ValueError('Original 97-image preload missing')
          Path('build/before.json').write_text(json.dumps(before,sort_keys=True),'utf8')
          print('PASS original V233 game, artwork, NPC data, original preload, deleted dungeons')
          PY

      - name: V234 Retrieve genuine Sanctuary Tile and S32 volumes
        shell: bash
        run: |
          set -euo pipefail
          gh release download v1.0.0 -R gowellsik-hue/Game \
            -p 'Sanctuary.of.Aden.-.Copy.z32' \
            -p 'Sanctuary.of.Aden.-.Copy.z33' \
            -p 'Sanctuary.of.Aden.-.Copy.z34' \
            -p 'Sanctuary.of.Aden.-.Copy.z35' \
            -p 'Sanctuary.of.Aden.-.Copy.z36' \
            -p 'Sanctuary.of.Aden.-.Copy.zip' \
            -D source --clobber
          test -s source/Sanctuary.of.Aden.-.Copy.z32
          test -s source/Sanctuary.of.Aden.-.Copy.z36
          test -s source/Sanctuary.of.Aden.-.Copy.zip
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet --disable-pip-version-check 'Pillow>=11,<13'

      - name: V234 Extract and reconstruct transparent original Layer4 plus Layer5
        shell: bash
        run: |
          set -euo pipefail
          cat > build/native_layers.py <<'NATIVE_LAYER_PY'
          from pathlib import Path
          from collections import Counter
          from functools import lru_cache
          import struct, zlib, json, mmap, hashlib, re, os
          from PIL import Image

          ROOT=Path('source'); OUT=Path('build'); SITE=Path('site')
          STEM='Sanctuary.of.Aden.-.Copy'
          OUT.mkdir(exist_ok=True)
          raw=(ROOT/(STEM+'.zip')).read_bytes()
          entries=[]; p=0
          while True:
              p=raw.find(b'PK\x01\x02',p)
              if p<0 or p+46>len(raw): break
              h=struct.unpack_from('<IHHHHHHIIIHHHHHII',raw,p)
              n,ext,comment=h[10:13]
              end=p+46+n+ext+comment
              if n<1 or n>1024 or end>len(raw):p+=4;continue
              name=raw[p+46:p+46+n].decode('utf-8' if h[3]&0x800 else 'cp949','replace').replace('\\','/')
              if re.search(r'/map/0/[0-9a-f]{8}\.s32$',name,re.I) or name.lower().endswith(('/tile.idx','/tile.pak')):
                  entries.append(dict(name=name,method=h[4],crc=h[7],comp=h[8],size=h[9],disk=h[13],off=h[16]))
              p=end
          maps=[e for e in entries if e['name'].lower().endswith('.s32')]
          assert len(maps)==64, f'Expected exactly 64 original Map0 segments, got {len(maps)}'
          @lru_cache(maxsize=3)
          def volume(n):
              fn=STEM+(f'.z{n+1:02d}' if n<45 else '.zip')
              return (ROOT/fn).read_bytes()
          def advance(d,o,n):
              while n:
                  b=volume(d);k=min(n,len(b)-o)
                  if k<0:raise ValueError('Split ZIP offset invalid')
                  o+=k;n-=k
                  if o==len(b):d+=1;o=0
              return d,o
          def part(d,o,n):
              output=bytearray()
              while len(output)<n:
                  buf=volume(d);k=min(n-len(output),len(buf)-o)
                  if k<=0:d+=1;o=0;continue
                  output.extend(buf[o:o+k]);o+=k
                  if o==len(buf):d+=1;o=0
              return bytes(output)
          def extract(e):
              hd=part(e['disk'],e['off'],30)
              if hd[:4]!=b'PK\x03\x04':raise ValueError('Wrong local ZIP header '+e['name'])
              a,b=struct.unpack_from('<HH',hd,26)
              d,o=advance(e['disk'],e['off'],30+a+b)
              comp=part(d,o,e['comp'])
              data=zlib.decompress(comp,-15) if e['method']==8 else comp
              if len(data)!=e['size'] or (zlib.crc32(data)&0xffffffff)!=e['crc']:
                  raise ValueError('Original ZIP CRC mismatch '+e['name'])
              return data
          # Use the exact original Tile.idx/Tile.pak, not a substitute tileset.
          idx=extract(next(e for e in entries if e['name'].lower().endswith('tile.idx')))
          pak=extract(next(e for e in entries if e['name'].lower().endswith('tile.pak')))
          count=struct.unpack_from('<I',idx)[0]
          assert count>=4000 and len(idx)==4+28*count
          files={}
          for i in range(count):
              o=4+i*28
              offset=struct.unpack_from('<I',idx,o)[0]
              filename=idx[o+4:o+24].split(b'\0')[0].decode('ascii','replace').lower()
              size=struct.unpack_from('<I',idx,o+24)[0]
              files[filename]=(offset,size)
          print('PASS authentic native Tile.idx entries',len(files),'Tile.pak bytes',len(pak))

          objects=[]; layer5=[]; ids=set(); unknown=Counter()
          for e in maps:
              data=extract(e)
              stem=e['name'].rsplit('/',1)[-1].split('.')[0]
              bx=int(stem[:4],16);by=int(stem[4:],16)
              ox=(bx-0x7fff)*64+0x7fff-63
              oy=(by-0x7fff)*64+0x7fff-63
              pos=128*64*4
              n=struct.unpack_from('<H',data,pos)[0]
              pos+=2+6*n+64*64*4
              groups=struct.unpack_from('<i',data,pos)[0];pos+=4
              if groups<0 or groups>100000:raise ValueError('Invalid original object count')
              for i in range(groups):
                  gid,quantity=struct.unpack_from('<hH',data,pos);pos+=4
                  ids.add(gid&65535)
                  for j in range(quantity):
                      x,y,layer,index,tile,_=struct.unpack_from('<BBBBhB',data,pos);pos+=7
                      if tile<0:continue
                      nx=ox+x//2;ny=oy+y
                      # Native world -> original Map047 512px panorama coordinates.
                      # Registration verified against the unchanged original Map047 PNG.
                      sx=12*(nx+ny-65024)-2800+12*(x&1)
                      sy=6*(ny-nx)-166
                      if sx < -12 or sy < -12 or sx >= 6144 or sy >= 4096:continue
                      objects.append((layer,sx,sy,tile,index))
              n=struct.unpack_from('<i',data,pos)[0];pos+=4
              if n<0 or n>200000:raise ValueError('Invalid original Layer5 length')
              for i in range(n):
                  x,y,gid,typ=struct.unpack_from('<BBHB',data,pos+5*i)
                  layer5.append((ox+x//2,oy+y,x&1,gid,typ))
          print('PASS original Layer4 tiles:',len(objects),'Layer5 records:',len(layer5))

          @lru_cache(maxsize=18000)
          def tile_image(tile,index):
              e=files.get(f'{tile}.til')
              if e is None:return None
              off,size=e
              blob=memoryview(pak)[off:off+size]
              if len(blob)<12:return None
              n=struct.unpack_from('<I',blob,0)[0]
              if index>=n:return None
              base=4+4*(n+1)
              a,b=struct.unpack_from('<II',blob,4+index*4)
              if b<=a or base+b>len(blob):return None
              frame=blob[base+a:base+b]
              typ=frame[0]
              rgba=bytearray(24*24*4)
              def dot(x,y,val):
                  if 0<=x<24 and 0<=y<24:
                      j=4*(y*24+x)
                      # Native RGB555: not RGB565, which corrupts original colours.
                      rgba[j]=(val>>10&31)*255//31
                      rgba[j+1]=(val>>5&31)*255//31
                      rgba[j+2]=(val&31)*255//31
                      rgba[j+3]=255
              pos=1
              try:
                  if not (typ&2):
                      for y in range(24):
                          q=(y+1)*2 if y<=11 else (23-y)*2
                          x=0 if (typ&1) else 24-q
                          for k in range(q):
                              v=struct.unpack_from('<H',frame,pos)[0];pos+=2
                              dot(x+k,y,v)
                  else:
                      xoff,yoff,_,rows=struct.unpack_from('<BBBB',frame,pos);pos+=4
                      for y in range(rows):
                          x=xoff;segments=frame[pos];pos+=1
                          for seg in range(segments):
                              x+=frame[pos]//2;pos+=1
                              span=frame[pos];pos+=1
                              for k in range(span):
                                  v=struct.unpack_from('<H',frame,pos)[0];pos+=2
                                  dot(x+k,y+yoff,v)
                              x+=span
              except (IndexError,struct.error):
                  unknown[typ]+=1
                  return None
              return Image.frombytes('RGBA',(24,24),bytes(rgba)).resize((12,12),Image.Resampling.NEAREST)

          # Layer4 remains separate and transparent. The original Panorama stays intact.
          cover=Image.new('RGBA',(6144,4096))
          painted=0
          for layer,sx,sy,tile,index in sorted(objects,key=lambda row:row[0]):
              block=tile_image(tile,index)
              if block:
                  cover.alpha_composite(block,(sx,sy))
                  painted+=1
          print('PASS rebuilt original transparent Layer4 frames:',painted,'of',len(objects),'malformed types',dict(unknown))

          # Layer5 uses SAME corrected projection as the graphics, not V232's half-scale.
          W,H=363,238
          mask=bytearray((W*H+7)//8)
          valid=0
          for nx,ny,parity,gid,typ in layer5:
              if gid not in ids:continue
              sx=12*(nx+ny-65024)-2800+6*parity
              sy=6*(ny-nx)-166
              cx=(sx+8)//16;cy=(sy+8)//16
              if 0<=cx<W and 0<=cy<H:
                  i=cy*W+cx
                  mask[i>>3]|=1<<(i&7);valid+=1
          if valid<200 or not(mask[(130*W+187)>>3] & (1<<((130*W+187)&7))):
              raise ValueError('Layer5 registration failed at house (187,130)')
          (OUT/'layer5-mask.hex').write_text(mask.hex(),'ascii')
          print('PASS native mask includes screenshot house (187,130); projected hits:',valid)

          # Only 512x512 RGBA tiles, never full-size textures at runtime.
          outdir=SITE/'knight/gameasync/Graphics/Panoramas';outdir.mkdir(parents=True,exist_ok=True)
          cover_names=[]
          for x in range(12):
              for y in range(8):
                  name=f'SLTI_47_L4_C{x}_{y}.png'
                  part=cover.crop((512*x,512*y,512*(x+1),512*(y+1)))
                  part.save(outdir/name,optimize=True)
                  cover_names.append(name)
          (OUT/'cover_names.json').write_text(json.dumps(cover_names),'utf8')
          print('PASS original Layer4 transparency assets:',len(cover_names))
          NATIVE_LAYER_PY
          .venv/bin/python build/native_layers.py
          test -s build/layer5-mask.hex
          test -s site/knight/gameasync/Graphics/Panoramas/SLTI_47_L4_C5_4.png

      - name: V234 Replace only previous incorrect opacity script
        shell: bash
        run: |
          set -euo pipefail
          cat > build/layer_runtime.rb <<'V234_LAYER_RB'
          # V234: original Layer4 cover is drawn from separately extracted tile pixels.
          # The unchanged source Panorama remains the lower layer.
          module SLNativeLayerV234
            WIDTH=363
            HEIGHT=238
            MASK_HEX='__MASK__'
            def self.behind?(x,y)
              return false if x<0 || y<0 || x>=WIDTH || y>=HEIGHT
              pos=y*WIDTH+x
              byte=pos>>3
              nibble=MASK_HEX[byte*2+((pos&4)==0 ? 1 : 0),1]
              return false unless nibble
              (nibble.to_i(16) & (1<<(pos&3)))!=0
            end
          end

          class Sprite_Character
            alias sl_v234_base_update update
            def update
              sl_v234_base_update
              if $game_map && $game_map.map_id==47 && $game_player &&
                 @character && @character.equal?($game_player)
                original=@character.opacity
                self.opacity=SLNativeLayerV234.behind?(@character.x,@character.y) ?
                  (original<150 ? original : 150) : original
              end
            end
          end

          class Spriteset_Map
            alias sl_v234_base_update update
            alias sl_v234_base_dispose dispose

            def sl_v234_hide_covers
              return unless @sl_v234_covers
              @sl_v234_covers.each{|sp|sp.visible=false if sp && !sp.disposed?}
            end

            def update
              sl_v234_base_update
              if !$game_map || $game_map.map_id!=47 || !$game_player ||
                 !SLNativeLayerV234.behind?($game_player.x,$game_player.y)
                sl_v234_hide_covers
                return
              end
              # Source chunk is 512px; the original 2x map renderer uses 1024px.
              camx=$game_map.display_x.to_i/4
              camy=$game_map.display_y.to_i/4
              screenx=$game_player.screen_x
              screeny=$game_player.screen_y
              cx=(screenx+camx)/2
              cy=(screeny+camy)/2
              left=[cx-26,0].max
              top=[cy-60,0].max
              right=[cx+26,6144].min
              bottom=[cy+12,4096].min
              if right<=left || bottom<=top
                sl_v234_hide_covers
                return
              end
              @sl_v234_covers||=[]
              @sl_v234_cover_keys||=[]
              needed=[]
              (top/512..(bottom-1)/512).each do |y|
                (left/512..(right-1)/512).each do |x|
                  needed<<[x,y]
                end
              end
              needed.each_with_index do |key,i|
                sp=@sl_v234_covers[i]
                unless sp
                  sp=Sprite.new(@viewport2)
                  sp.z=9999
                  sp.zoom_x=2.0
                  sp.zoom_y=2.0
                  sp.opacity=170
                  @sl_v234_covers[i]=sp
                end
                if @sl_v234_cover_keys[i]!=key
                  bmp=sp.bitmap
                  sp.bitmap=nil
                  bmp.dispose if bmp && !bmp.disposed?
                  begin
                    sp.bitmap=Bitmap.new('Graphics/Panoramas/SLTI_47_L4_C'+key[0].to_s+'_'+key[1].to_s+'.png')
                  rescue StandardError=>error
                    p 'V234 Layer4 load: '+error.message.to_s
                    sp.visible=false
                    next
                  end
                  @sl_v234_cover_keys[i]=key
                end
                x0=[left,key[0]*512].max
                y0=[top,key[1]*512].max
                x1=[right,(key[0]+1)*512].min
                y1=[bottom,(key[1]+1)*512].min
                sp.src_rect.set(x0-key[0]*512,y0-key[1]*512,x1-x0,y1-y0)
                sp.x=2*x0-camx
                sp.y=2*y0-camy
                sp.visible=true
              end
              j=needed.length
              while j<@sl_v234_covers.length
                @sl_v234_covers[j].visible=false
                j+=1
              end
            end

            def dispose
              if @sl_v234_covers
                @sl_v234_covers.each do |sp|
                  next unless sp && !sp.disposed?
                  bmp=sp.bitmap
                  sp.bitmap=nil
                  sp.dispose
                  bmp.dispose if bmp && !bmp.disposed?
                end
                @sl_v234_covers=nil
              end
              sl_v234_base_dispose
            end
          end
          V234_LAYER_RB
          cat > build/patch_runtime.rb <<'V234_PATCH_RB'
          require 'zlib'
          require 'digest'
          path='site/knight/gameasync/Data/Scripts.rxdata'
          old=File.binread(path)
          raise 'Not verified V233 script source' unless Digest::SHA256.hexdigest(old)=='b92a5279f3926673bd082d25b7d73a575faa76c46ef87a5ed024a1e8e6be4d1a'
          scripts=Marshal.load(old)
          raise 'Wrong V233 script layout' unless scripts.length==137 && scripts[-2][1]=='SLNativeLayer5V233' && scripts[-1][1]=='Main'
          source=File.binread('build/layer_runtime.rb')
          raise 'Missing Layer5 marker' unless source.scan('__MASK__').length==1
          mask=File.read('build/layer5-mask.hex').strip
          raise 'Wrong mask size' unless mask.match?(/\A[0-9a-f]+\z/) && mask.length==21600
          source=source.sub('__MASK__',mask)
          raise 'Wrong Layer4 renderer' unless source.include?('class Spriteset_Map') && source.include?('SLTI_47_L4_C')
          raise 'Forbidden runtime decompressor' if source.include?('Zlib::') || source.include?('Base64')
          File.binwrite('build/layer_runtime_checked.rb',source)
          scripts[-2][1]='SLNativeLayerV234'
          scripts[-2][2]=Zlib::Deflate.deflate(source)
          File.binwrite(path,Marshal.dump(scripts))
          check=Marshal.load(File.binread(path))
          pre=Marshal.load(old)
          raise 'Original RGSS script changed' unless check.length==pre.length && check[0...-2]==pre[0...-2] && check[-1]==pre[-1]
          raise 'Wrong new script' unless check[-2][1]=='SLNativeLayerV234'
          puts 'PASS original 136 script sections preserved; V233 section replaced with actual Layer4/Layer5 renderer'
          V234_PATCH_RB
          ruby -c build/layer_runtime.rb
          ruby -c build/patch_runtime.rb
          ruby build/patch_runtime.rb
          ruby -c build/layer_runtime_checked.rb

      - name: V234 Preload all Layer4 chunks with the original Map047 art
        shell: bash
        run: |
          set -euo pipefail
          cat > build/pack_layers.py <<'V234_PACK_PY'
          from pathlib import Path
          import json,struct,hashlib,re
          root=Path('site')
          asset=root/'knight/assets/map-047-v229r151.pack'
          payload=asset.read_bytes();headlen=struct.unpack_from('<I',payload,0)[0]
          old=json.loads(payload[4:4+headlen]);base=payload[4+headlen:]
          assert old['kind']=='map' and old['map_id']==47 and len(old['files'])==97
          assert old['files'][0][0]=='graphics/panoramas/slti_47_c0_0'
          assert old['files'][-1][0]=='graphics/tilesets/slti_collision_transparent'
          rows=list(old['files']);newpieces=[];offset=len(base)
          for x in range(12):
              for y in range(8):
                  name=f'SLTI_47_L4_C{x}_{y}.png'
                  filename=root/'knight/gameasync/Graphics/Panoramas'/name
                  data=filename.read_bytes()
                  assert data.startswith(b'\x89PNG\r\n\x1a\n')
                  key='graphics/panoramas/'+name[:-4].lower()
                  rows.append([key,offset,len(data)])
                  offset+=len(data);newpieces.append(data)
          newhead=json.dumps({'kind':'map','map_id':47,'files':rows},ensure_ascii=False,separators=(',',':')).encode('utf8')
          pack=struct.pack('<I',len(newhead))+newhead+base+b''.join(newpieces)
          target=root/'knight/assets/map-047-v234.pack';target.write_bytes(pack)
          assert asset.read_bytes()==payload
          # Keep all original file contents and the existing Map047 pack unchanged.
          assert len(rows)==193 and rows[:97]==old['files']
          assert pack[4+len(newhead):4+len(newhead)+len(base)]==base
          print('PASS preload pack 97 original + 96 new transparent Layer4 chunks:',len(pack),'bytes')

          mapping=root/'knight/gameasync/mapping.js'
          s=mapping.read_text('utf8')
          entry=[]
          for x in range(12):
              for y in range(8):
                  n=f'SLTI_47_L4_C{x}_{y}.png'
                  data=(root/'knight/gameasync/Graphics/Panoramas'/n).read_bytes()
                  key='graphics/panoramas/'+n[:-4].lower()
                  val='Graphics/Panoramas/'+n+'?h='+hashlib.md5(data).hexdigest()
                  entry.append('['+json.dumps(key)+', '+json.dumps(val,ensure_ascii=False)+'],')
          anchor='];\n\nvar mapping = {}'
          assert s.count(anchor)==1
          s=s.replace(anchor,'\n'+'\n'.join(entry)+'\n'+anchor)
          digest=hashlib.md5((root/'knight/gameasync/Data/Scripts.rxdata').read_bytes()).hexdigest()
          s,n=re.subn(r'(Data/Scripts\.rxdata\?h=)[0-9a-f]{32}',lambda m:m.group(1)+digest,s)
          assert n==1
          mapping.write_text(s,'utf8')

          preload=root/'knight/js/sl-assets-v229r115.js'
          s=preload.read_text('utf8')
          oldbranch="mid===47?'map-047-v229r151.pack'"
          assert s.count(oldbranch)==1
          s=s.replace(oldbranch,"mid===47?'map-047-v234.pack'")
          assert s.count("var version='V233';")==1
          s=s.replace("var version='V233';","var version='V234';")
          preload.write_text(s,'utf8')
          for name in ('index.html','knight/index.html'):
              p=root/name
              text=p.read_text('utf8')
              assert 'V233' in text
              p.write_text(text.replace('V233','V234').replace('v233','v234'),'utf8')
          html=(root/'knight/index.html').read_text('utf8')
          assert 'js/sl-assets-v229r115.js?v=v234' in html
          print('PASS JS mappings, script hash, asset preload and V234 page tags')
          V234_PACK_PY
          python3 build/pack_layers.py
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: V234 Verify changes and protect all original game resources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,struct
          from pathlib import Path
          root=Path('site')
          before=json.loads(Path('build/before.json').read_text('utf8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          allowed={'knight/gameasync/Data/Scripts.rxdata',
                   'knight/gameasync/mapping.js',
                   'knight/js/sl-assets-v229r115.js',
                   'index.html','knight/index.html'}
          fresh={'knight/assets/map-047-v234.pack'}
          fresh|={f'knight/gameasync/Graphics/Panoramas/SLTI_47_L4_C{x}_{y}.png'
                  for x in range(12) for y in range(8)}
          if set(after)-set(before)!=fresh or set(before)-set(after):
              raise ValueError('Unexpected original game file additions/removals')
          changed={k for k in before if before[k]!=after[k]}
          if changed!=allowed:raise ValueError('Unexpected modified game files: '+str(changed^allowed))
          prefix='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          for mid in (45,46):
              if prefix+f'Map{mid:03d}.rxdata' in after:raise ValueError('Dungeon returned')
          for p in (prefix+'Map047.rxdata',
                    'knight/assets/map-047-v229r151.pack',
                    'knight/gameasync/Graphics/Panoramas/SLTI_47_C7_4.png'):
              if after[p]!=before[p]:raise ValueError('Original graphic or collision changed: '+p)
          mask=bytes.fromhex(Path('build/layer5-mask.hex').read_text('ascii').strip())
          x,y=187,130;v=y*363+x
          if not (mask[v>>3] & (1<<(v&7))):
              raise ValueError('Screenshot house must be a native opacity tile')
          head=(root/'knight/assets/map-047-v234.pack').read_bytes()
          length=struct.unpack_from('<I',head)[0]
          manifest=json.loads(head[4:4+length]);assert len(manifest['files'])==193
          print('PASS 5504 original files intact except five intended scripts/cache/version files')
          print('PASS 96 separate authentic transparent Layer4 PNGs + 193-image preload pack')
          print('PASS screenshot house covered by genuine Layer5 marker; 4-way movement untouched')
          print('PASS original Map047, original 97-image pack, NPCs, Pandora, controls, other maps unchanged')
          PY

      - name: V234 Publish separately layered native Map047
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
