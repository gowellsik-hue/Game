            'bow attack begins on shared target'
          )

          check(
            a.instance_variable_get(:@sl411_attack)[1]==5,
            'bow targets selected monster'
          )

          $game_map.instance_variable_set(
            :@events,
            $game_map.events.dup
          )

          check(
            SL411.target_for(a).nil?,
            'map change invalidates focus'
          )
          RUBY

          ruby -c /tmp/sl411-test.rb

          ruby /tmp/sl411-test.rb \
            site/knight/gameasync/Data/Scripts.rxdata

      - name: Update existing script mapping and verify exact changes
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re

          root=Path('site')
          prior=Path('candidate')

          prefix='knight/gameasync/'

          script=prefix+'Data/Scripts.rxdata'
          mapping=prefix+'mapping.js'

          p=root/mapping

          old=hashlib.md5(
              (prior/script).read_bytes()
          ).hexdigest()

          new=hashlib.md5(
              (root/script).read_bytes()
          ).hexdigest()

          assert old!=new

          text=p.read_text('utf8')

          marker='Data/Scripts.rxdata?h='

          pattern=re.escape(marker)+r'[0-9a-f]{32}'

          assert re.findall(pattern,text)==[marker+old]

          p.write_text(
              text.replace(marker+old,marker+new),
              'utf8'
          )

          before=json.loads(
              Path('/tmp/sl411-base.json').read_text('utf8')
          )

          previous=json.loads(
              Path('/tmp/sl411-prior.json').read_text('utf8')
          )

          allowed=set(
              json.loads(
                  Path('/tmp/sl411-approved.json').read_text('utf8')
              )
          )

          after={
              f.relative_to(root).as_posix():hashlib.sha256(f.read_bytes()).hexdigest()
              for f in root.rglob('*') if f.is_file()
          }

          assert len(after)==6085

          assert set(after)==set(previous)

          assert {
              k for k in after
              if after[k]!=previous[k]
          }=={script,mapping}

          assert {
              k for k in before
              if before[k]!=after[k]
          }==allowed

          assert len(set(after)-set(before))==52

          assert p.read_text('utf8').count(marker+new)==1

          assert (
              root/'knight/js/sl-assets-v229r115.js'
          ).read_bytes().count(
              b"var version='V4.11';"
          )==1

          print('PASS V4.11 reciprocal collision')
          print('PASS original companion movement branches')
          print('PASS original target selection and L1J attack routes')
          print('PASS only Scripts.rxdata and mapping.js differ from previous V4.11')
          print('PASS all original graphics, equipment and map resources preserved')
          print('PASS all V4.10 non-target files preserved')
          PY

          node --check site/knight/gameasync/mapping.js

      - name: Upload V4.11 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
