
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V276.8
# BASE: V276.6 successful run 41607845656
# DISCARD: V276.7 visual runtime and its attack/death changes
# ATTACK: existing native 0..6 roll; 5 normal, 1 strong, 1 magic
# WALK: original 12 frames within 32 movement ticks
# DEATH: exactly 17 visual frames, one tick each, one time
# REMOVE: overlapping native CE105 death effect for Zenith only
# KEEP: original 200-frame post-death page
# KEEP: HP52, movement2, attack25, EXP, Adena and 20 rewards
# PROTECT: original Death Knight, Medusa and unrelated game resources

name: build-slknight-web.yml | V276.8 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: V276.8 Restore working native V276.6
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41607845656
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V276.8 Retrieve original V247 motion graphics
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41382471524
          name: github-pages
          github-token: ${{ github.token }}
          path: sprite-baseline

      - name: V276.8 Verify unmodified V276.6 game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s baseline/artifact.tar
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib

          root=Path('site')
          files={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }
          assert len(files)==5606,('V276.6 source differs',len(files))
          assert 'V276.6' in (root/'knight/index.html').read_text('utf-8')
          assert 'knight/gameasync/Data/Scripts.rxdata' in files
          assert 'knight/gameasync/mapping.js' in files
          Path('build/before.json').write_text(json.dumps(files))
          print('PASS original V276.6 deployed game')
          PY

      - name: V276.8 Copy seven original Zenith motion sheets
        shell: bash
        run: |
          set -euo pipefail
          test -s sprite-baseline/artifact.tar
          mkdir -p build/sprites

          tar -xf sprite-baseline/artifact.tar -C build/sprites \
            ./knight/gameasync/Graphics/Characters/SLZenithWalk.png \
            ./knight/gameasync/Graphics/Characters/SLZenithIdle.png \
            ./knight/gameasync/Graphics/Characters/SLZenithAttack.png \
            ./knight/gameasync/Graphics/Characters/SLZenithAltAttack.png \
            ./knight/gameasync/Graphics/Characters/SLZenithSpell.png \
            ./knight/gameasync/Graphics/Characters/SLZenithHit.png \
            ./knight/gameasync/Graphics/Characters/SLZenithDeath.png

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,shutil,struct

          src=Path('build/sprites/knight/gameasync/Graphics/Characters')
          dst=Path('site/knight/gameasync/Graphics/Characters')

          expected={
              'Walk':('2a2ba621711dd02d754a7e5cd56954e4045c8609e9781e72a914bf5cec231cb4',12),
              'Idle':('dc5d453681ba72f148bc5341d847c6baa007d448d223162a6fe857feffb1a4d0',11),
              'Attack':('34fc818726622d37e5d93d31a805738ef283f87eef3d33ec46cd772fee15a425',13),
              'AltAttack':('ee7664745495d2de0fa7ab7e132cbcedc525a3aa7c4537776b51927968a4dd90',14),
              'Spell':('ffe2ae5755e7c3ed4a25cd70fa84afdff78069c5052ab6f20939d7c9849b2749',14),
              'Hit':('9c2eaa2eb3f22a60266a4a8e0f6793a97592ce35b847d0469e2ee32190fa40e4',2),
              'Death':('e5e59ced0d42ccf0f1e99ffa7bb8b3f7f4e1c80f3d880c0875d122c039ec009c',17),
          }

          for action,(digest,frames) in expected.items():
              name='SLZenith'+action+'.png'
              source=src/name
              target=dst/name
              assert source.is_file(),('Missing sprite',name)
              assert not target.exists(),('Unexpected sprite overlay',name)
              data=source.read_bytes()
              assert hashlib.sha256(data).hexdigest()==digest,('Source image changed',name)
              assert data[:8]==b'\x89PNG\r\n\x1a\n'
              width,height=struct.unpack('>II',data[16:24])
              assert width%frames==0,(name,'wrong columns')
              assert height%4==0,(name,'wrong directions')
              shutil.copy2(source,target)

          print('PASS all seven original 4-direction Zenith images')
          PY

      - name: V276.8 Create boss-only visual player
        shell: bash
        run: |
          set -euo pipefail

          cat > build/zenith_visual.rb <<'V2768_VISUAL'
          # encoding: UTF-8
          # Visuals only. Native attack and reward calculations are untouched.
          # Map025 / EV29 only. Ruby 1.8-compatible syntax.

          module SLZenithVisual
            MAP_ID=25
            EVENT_ID=29
            HP_VAR=4988
            MAX_HP=52
            ATTACK_SW=5991
            MAGIC_SW=5992

            FRAMES={
              'Walk'=>12,
              'Idle'=>11,
              'Attack'=>13,
              'AltAttack'=>14,
              'Spell'=>14,
              'Hit'=>2,
              'Death'=>17
            }

            def self.event
              return nil unless $game_map
              return nil unless $game_map.map_id==MAP_ID
              return nil unless $game_map.events
              $game_map.events[EVENT_ID]
            end

            # Receives the EXISTING native seven-way selector.
            # This method never rolls a new random number.
            def self.select(roll)
              boss=event
              boss.slzv_set_roll(roll) if boss
            end

            # 0 = native magic slot
            # 1 = strong physical visual
            # 2..6 = normal physical visual
            def self.motion(roll,magic_on)
              return 'Spell' if magic_on
              return 'Attack' if roll.nil?
              return 'Spell' if roll==0
              return 'AltAttack' if roll==1
              'Attack'
            end
          end

          class Game_Event
            alias slzv2768_native_update update

            def slzv_set_roll(roll)
              @slzv_roll=roll.to_i
            end

            def slzv_frame(total)
              tick=@slzv_draw_tick.to_i

              case @slzv_kind
              when 'Death'
                # Exactly 17 pictures, once, at one picture per tick.
                [tick,total-1].min

              when 'Hit'
                [tick/2,total-1].min

              when 'AttackSequence'
                if @character_name=='SLZenithIdle'
                  [tick,10].min
                else
                  [[tick-11,0].max,total-1].min
                end

              when 'Walk'
                # All twelve original images, evenly distributed
                # across the existing speed-2 movement time.
                ((tick%32)*total)/32

              else
                (tick/4)%total
              end
            end

            def update
              slzv2768_native_update

              return unless @map_id==SLZenithVisual::MAP_ID
              return unless @id==SLZenithVisual::EVENT_ID
              return if @erased
              return unless $game_variables

              hp=$game_variables[SLZenithVisual::HP_VAR].to_i
              old_hp=@slzv_last_hp
              @slzv_last_hp=hp

              attack_on=(
                $game_switches &&
                $game_switches[SLZenithVisual::ATTACK_SW]
              )

              # Observe the original native attack switch.
              # No new attack call is injected into CE1064.
              if attack_on && !@slzv_attack_latched
                @slzv_attack_latched=true
                @slzv_kind='AttackSequence'
                @slzv_tick=0
                @slzv_roll=nil
                @slzv_magic=false
              elsif !attack_on
                @slzv_attack_latched=false
              end

              graphic=nil

              if hp>=SLZenithVisual::MAX_HP ||
                 @slzv_kind=='Death'

                if @slzv_kind!='Death'
                  @slzv_kind='Death'
                  @slzv_tick=0
                else
                  @slzv_tick=[
                    @slzv_tick.to_i+1,16
                  ].min
                end

                @slzv_draw_tick=@slzv_tick
                graphic='SLZenithDeath'

              elsif !old_hp.nil? && hp>old_hp
                @slzv_kind='Hit'
                @slzv_tick=0
                @slzv_draw_tick=0
                graphic='SLZenithHit'

              elsif @slzv_kind=='Hit' &&
                    @slzv_tick.to_i<3

                @slzv_tick=@slzv_tick.to_i+1
                @slzv_draw_tick=@slzv_tick
                graphic='SLZenithHit'

              elsif @slzv_kind=='AttackSequence' &&
                    @slzv_tick.to_i<25

                tick=@slzv_tick.to_i

                if $game_switches &&
                   $game_switches[SLZenithVisual::MAGIC_SW]
                  @slzv_magic=true
                end

                if tick<11
                  graphic='SLZenithIdle'
                else
                  motion=SLZenithVisual.motion(
                    @slzv_roll,@slzv_magic
                  )
                  graphic='SLZenith'+motion
                end

                @slzv_draw_tick=tick
                @slzv_tick=tick+1

              else
                kind=moving? ? 'Walk' : 'Idle'

                if @slzv_kind!=kind
                  @slzv_kind=kind
                  @slzv_tick=0
                else
                  @slzv_tick=@slzv_tick.to_i+1
                end

                @slzv_draw_tick=@slzv_tick
                graphic='SLZenith'+kind
              end

              @character_name=graphic if
                graphic && @character_name!=graphic
            end
          end

          class Sprite_Character
            alias slzv2768_native_update update

            def update
              slzv2768_native_update

              char=@character
              return unless char
              return unless char.is_a?(Game_Event)

              return unless char.instance_variable_get(:@map_id)==
                SLZenithVisual::MAP_ID
              return unless char.instance_variable_get(:@id)==
                SLZenithVisual::EVENT_ID
              return if char.instance_variable_get(:@erased)

              name=char.character_name.to_s
              return unless name.start_with?('SLZenith')

              action=name.sub('SLZenith','')
              total=SLZenithVisual::FRAMES[action]
              return unless total
              return unless @tile_id==0 && bitmap

              return unless bitmap.width%total==0
              return unless bitmap.height%4==0

              rows={2=>0,4=>1,6=>2,8=>3}
              row=rows[char.direction]
              return if row.nil?

              @cw=bitmap.width/total
              @ch=bitmap.height/4

              frame=char.slzv_frame(total)

              self.src_rect.set(
                frame*@cw,row*@ch,@cw,@ch
              )
              self.ox=@cw/2
              self.oy=@ch
              self.z=char.screen_z(@ch)

              # Preserve the selected attack picture when
              # the native attack effect hides its source.
              self.visible=true unless char.transparent
            end
          end
          V2768_VISUAL

          ruby -c build/zenith_visual.rb

      - name: V276.8 Apply minimum changes to native game data
        shell: bash
        run: |
          set -euo pipefail

          cat > build/apply.rb <<'V2768_PATCH'
          # encoding: UTF-8
          require 'json'
          require 'zlib'

          module RPG
            class Map;end
            class CommonEvent;end
            class AudioFile;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end

          class Table
            def self._load(s)
              o=allocate
              o.instance_variable_set(:@raw,s)
              o
            end
            def _dump(n=0);@raw;end
          end

          class Tone
            def self._load(s)
              o=allocate
              o.instance_variable_set(:@raw,s)
              o
            end
            def _dump(n=0);@raw;end
          end
          class Color<Tone;end

          def iv(o,k)
            o.instance_variable_get('@'+k.to_s)
          end

          def put(o,k,v)
            o.instance_variable_set('@'+k.to_s,v)
          end

          def ck(value,message)
            raise message unless value
          end

          ROOT='site/knight/gameasync/Data/'
          PREFIX='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          map_path=ROOT+PREFIX+'Map025.rxdata'
          ce_path=ROOT+PREFIX+'CommonEvents.rxdata'
          script_path=ROOT+'Scripts.rxdata'

          map=Marshal.load(File.binread(map_path))
          common=Marshal.load(File.binread(ce_path))
          scripts=Marshal.load(File.binread(script_path))

          ck(common.length==1067,'Wrong V276.6 CE inventory')
          ck(scripts.length==137,'Wrong V276.6 scripts')
          ck(scripts.last[1]=='Main','Native Main missing')

          original_common=common.map do |ce|
            ce.nil? ? nil : Marshal.dump(ce)
          end

          original_scripts=scripts.map do |row|
            Marshal.dump(row)
          end

          events=iv(map,:events)
          boss=events.fetch(29)
          ck(iv(boss,:name)=='제니스 퀸','Wrong boss')

          original_events=events.each_with_object({}) do |(id,ev),h|
            h[id]=Marshal.dump(ev) if id!=29
          end

          pages=iv(boss,:pages)
          ck(pages.length==5,'Original five pages missing')

          ck(
            iv(iv(pages[2],:condition),:variable_value)==52,
            'HP52 changed'
          )

          ck(
            iv(pages[2],:list).map{|c|iv(c,:code)}==
              [122,117,0],
            'Original death page overwritten'
          )

          ck(
            iv(iv(pages[2],:list)[1],:parameters)==[1065],
            'Original native death reward disconnected'
          )

          ck(
            iv(iv(pages[3],:list)[2],:parameters)==[200],
            'Original post-death 200-frame wait changed'
          )

          # 1. Change only the graphics of this one boss.
          graphics={
            0=>['SLDK2F01','SLZenithIdle'],
            1=>['SLDK2F01','SLZenithIdle'],
            2=>['SLDK2F02','SLZenithDeath'],
            3=>['SLDK2F03','SLZenithDeath']
          }

          graphics.each do |index,pair|
            graphic=iv(pages[index],:graphic)
            ck(
              iv(graphic,:character_name)==pair[0],
              "Unexpected page #{index} graphic"
            )
            put(graphic,:character_name,pair[1])
          end

          # 2. Replace the cloned CE105 death effect CALL.
          # Do not call both the old death effect and the new Death GIF.
          # Wait 17 frames once before native self-switch A.
          reward=iv(common.fetch(1065),:list)

          ck(reward.length==245,'Wrong native death CE length')
          ck(
            iv(reward[241],:code)==117 &&
            iv(reward[241],:parameters)==[105],
            'Native death effect call changed'
          )
          ck(
            iv(reward[243],:code)==123 &&
            iv(reward[243],:parameters)==['A',0],
            'Native self-switch A changed'
          )

          put(reward[241],:code,106)
          put(reward[241],:parameters,[17])

          # Do not insert any additional death wait.
          ck(reward.length==245,'Death commands duplicated')

          # Keep the original 200-frame page and HP reset.
          post=iv(pages[3],:list)
          ck(
            post.map{|c|iv(c,:code)}==
              [122,135,106,202,122,123,116,0],
            'Native post-death event changed'
          )
          ck(
            iv(post[2],:parameters)==[200],
            'Post-death delay changed'
          )

          # 3. Read the already-generated seven-way native roll.
          # Do not touch CE1064's attack startup or the damage equations.
          attack=iv(common.fetch(1066),:list)

          selector_indices=[]
          attack.each_with_index do |c,i|
            if iv(c,:code)==122 &&
               iv(c,:parameters)==[26,26,0,2,0,6]
              selector_indices << i
            end
          end

          ck(
            selector_indices.length==1,
            'Expected one original 0..6 random selector'
          )

          pos=selector_indices[0]
          source=attack[pos]

          hook=RPG::EventCommand.allocate
          put(hook,:code,355)
          put(hook,:indent,iv(source,:indent))
          put(
            hook,:parameters,
            ['SLZenithVisual.select($game_variables[26])']
          )

          attack.insert(pos+1,hook)

          ck(
            iv(attack[pos],:parameters)==[26,26,0,2,0,6],
            'Original attack selector changed'
          )

          # CE1064 contains the native 5 + 20 attack cycle.
          # It remains byte-identical to V276.6.
          ck(
            Marshal.dump(common[1064])==
              original_common[1064],
            'Native attack startup was modified'
          )

          # 4. Insert one boss-only image renderer.
          visual=File.binread('build/zenith_visual.rb')
          ck(
            visual.include?('class Game_Event') &&
            visual.include?('class Sprite_Character'),
            'Visual code missing'
          )
          ck(
            !visual.include?('.odd?'),
            'Incompatible odd? call remains'
          )

          scripts.insert(
            -2,
            [
              99827608,
              'SLZenithVisualV2768',
              Zlib::Deflate.deflate(visual,9)
            ]
          )

          ck(
            scripts.length==138 &&
            scripts.last[1]=='Main',
            'Script insertion failed'
          )

          remaining=scripts.reject do |row|
            row[1]=='SLZenithVisualV2768'
          end

          ck(
            remaining.map{|row|Marshal.dump(row)}==
              original_scripts,
            'Original game scripts changed'
          )

          # 5. All unrelated common events remain unchanged.
          original_common.each_with_index do |bytes,id|
            next if id==1065 || id==1066
            current=common[id]
            data=current.nil? ? nil : Marshal.dump(current)
            ck(data==bytes,"Unrelated CE #{id} changed")
          end

          # No changes to any other Tower event.
          original_events.each do |id,bytes|
            ck(
              Marshal.dump(events.fetch(id))==bytes,
              "Unrelated Map025 EV#{id} changed"
            )
          end

          File.binwrite(map_path,Marshal.dump(map))
          File.binwrite(ce_path,Marshal.dump(common))
          File.binwrite(script_path,Marshal.dump(scripts))

          puts 'PASS original 5+20 attack cycle untouched'
          puts 'PASS native seven-way roll captured without new RNG'
          puts 'PASS only Zenith graphic, death timing and visual script changed'
          puts 'PASS native CE1064, other CEs and other monsters unchanged'
          V2768_PATCH

          ruby -c build/apply.rb
          ruby build/apply.rb

      - name: V276.8 Verify original motion frame allocation
        shell: bash
        run: |
          set -euo pipefail

          ruby - <<'RUBY'
          class Game_Event
            attr_accessor :character_name
            def update;end
          end

          class Sprite_Character
            def update;end
          end

          load 'build/zenith_visual.rb'

          boss=Game_Event.new

          # Death: exactly frames 0..16, with no repetition
          # within the seventeen-frame death motion.
          boss.instance_variable_set(:@slzv_kind,'Death')
          death=(0...17).map do |tick|
            boss.instance_variable_set(:@slzv_draw_tick,tick)
            boss.slzv_frame(17)
          end

          raise 'Death is not 17 distinct frames' unless
            death==(0...17).to_a

          # Walk: every source image must occur in order.
          boss.instance_variable_set(:@slzv_kind,'Walk')
          boss.character_name='SLZenithWalk'

          walk=(0...32).map do |tick|
            boss.instance_variable_set(:@slzv_draw_tick,tick)
            boss.slzv_frame(12)
          end

          raise 'Original 12-frame walk sequence missing' unless
            walk.uniq==(0...12).to_a

          raise 'Walk duration is not 32 ticks' unless
            walk.length==32

          # 7 original selector values:
          # 5 normal, 1 strong, 1 spell.
          motions=(0..6).map do |roll|
            SLZenithVisual.motion(roll,false)
          end

          raise 'Incorrect seven-way visual distribution' unless
            motions.count('Attack')==5 &&
            motions.count('AltAttack')==1 &&
            motions.count('Spell')==1

          # Attack: 11 idle frames, then 14 picture slots.
          boss.instance_variable_set(:@slzv_kind,'AttackSequence')
          attack=[]

          (0...25).each do |tick|
            boss.instance_variable_set(:@slzv_draw_tick,tick)
            boss.character_name=(
              tick<11 ? 'SLZenithIdle' : 'SLZenithAltAttack'
            )
            attack << boss.slzv_frame(tick<11 ? 11 : 14)
          end

          raise 'Idle preparation not 11 frames' unless
            attack[0,11]==(0...11).to_a

          raise 'Strong attack not 14 frames' unless
            attack[11,14]==(0...14).to_a

          puts 'PASS death 17 pictures exactly once'
          puts 'PASS walk original 12 pictures within 32 ticks'
          puts 'PASS seven-way visual selector 5 normal 1 strong 1 magic'
          puts 'PASS 25-frame attack with 11 idle + 14 attack'
          RUBY

      - name: V276.8 Update only new sprite and data hashes
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re

          root=Path('site')
          game=root/'knight/gameasync'
          mapping=game/'mapping.js'
          text=mapping.read_text('utf-8')

          anchor='];\n\nvar mapping = {}'
          assert text.count(anchor)==1,'Mapping anchor changed'

          actions=(
              'Walk','Idle','Attack','AltAttack',
              'Spell','Hit','Death'
          )

          entries=[]
          for action in actions:
              name='SLZenith'+action
              p=game/'Graphics/Characters'/(name+'.png')
              assert p.is_file(),name
              digest=hashlib.md5(p.read_bytes()).hexdigest()
              key='graphics/characters/'+name.lower()
              assert key not in text,('Duplicate sprite mapping',name)
              entries.append(
                  f'["{key}", "Graphics/Characters/{name}.png?h={digest}"],'
              )

          text=text.replace(
              anchor,
              '\n'+'\n'.join(entries)+'\n'+anchor
          )

          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          for filename in (
              pre+'Map025.rxdata',
              pre+'CommonEvents.rxdata',
              'Scripts.rxdata'
          ):
              p=game/'Data'/filename
              digest=hashlib.md5(p.read_bytes()).hexdigest()
              pattern='('+re.escape(
                  'Data/'+filename
              )+r'\?h=)[0-9a-f]{32}'
              text,count=re.subn(
                  pattern,
                  lambda m:m.group(1)+digest,
                  text
              )
              assert count==1,('Missing data hash',filename)

          mapping.write_text(text,encoding='utf-8')

          loader=root/'knight/js/sl-assets-v229r115.js'
          text=loader.read_text('utf-8')
          old="var version='V276.6';"
          assert text.count(old)==1
          loader.write_text(
              text.replace(old,"var version='V276.8';"),
              encoding='utf-8'
          )

          for relative in ('index.html','knight/index.html'):
              p=root/relative
              text=p.read_text('utf-8')
              assert 'V276.6' in text,relative
              text=text.replace('V276.6','V276.8')
              text=text.replace('v276.6','v276.8')
              p.write_text(text,encoding='utf-8')

          print('PASS seven sprite URLs and three modified RXData hashes')
          print('PASS all displayed versions V276.8')
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: V276.8 Reject changes outside the approved scope
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib

          root=Path('site')
          before=json.loads(
              Path('build/before.json').read_text('utf-8')
          )
          after={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          pre='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          allowed={
              pre+'Map025.rxdata',
              pre+'CommonEvents.rxdata',
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html',
              'knight/index.html'
          }

          added={
              'knight/gameasync/Graphics/Characters/SLZenith'+a+'.png'
              for a in (
                  'Walk','Idle','Attack','AltAttack',
                  'Spell','Hit','Death'
              )
          }

          changed={
              p for p in before if before[p]!=after.get(p)
          }

          assert len(before)==5606,'Wrong native V276.6 input'
          assert len(after)==5613,'Wrong final file count'
          assert changed==allowed,(
              'Unapproved changes',sorted(changed^allowed)
          )
          assert set(after)-set(before)==added,(
              'Unapproved added files',
              sorted((set(after)-set(before))^added)
          )
          assert not (set(before)-set(after)),(
              'Original game file deleted',
              sorted(set(before)-set(after))
          )

          # Preserve all existing graphics byte-for-byte.
          for name in before:
              if name.startswith('knight/gameasync/Graphics/'):
                  assert before[name]==after[name],(
                      'Original sprite changed',name
                  )

          # Preserve all other map data.
          for name in before:
              if name.startswith(pre+'Map') and name!=pre+'Map025.rxdata':
                  assert before[name]==after[name],(
                      'Unrelated map changed',name
                  )

          for name in (
              pre+'Map016.rxdata',
              'knight/js/drive.js',
              'knight/js/dpad.js',
              'knight/assets/map-047-v241.pack'
          ):
              assert before[name]==after[name],(
                  'Protected source changed',name
              )

          print('PASS V276.6 source preserved')
          print('PASS only seven original Zenith images added')
          print('PASS no other monster, map or native movement code changed')
          PY

      - name: V276.8 Publish
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
