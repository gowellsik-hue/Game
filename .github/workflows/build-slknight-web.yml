name: build-slknight-web.yml | V3.11 | Wizard Original Shadow

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Restore the exact successful V3.10 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45358332479
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Restore original SPR record audit
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45347986505
          name: audit-sanctuary-monsters-v46-all-spr-audit
          github-token: ${{ github.token }}
          path: audit

      - name: Restore verified original SPR coordinate decoder
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: e2dfa04c9aecac1431aaf48637a138bb5b6c9a62
          path: verified-v37

      - name: Verify V3.10 and identify all original wizard records
        shell: bash
        run: |
          set -euo pipefail

          test -s baseline/artifact.tar

          mkdir -p site downloads original

          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY1'
          from pathlib import Path
          from collections import defaultdict
          import hashlib,json,csv,re

          root=Path('site')

          before={
              str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          assert len(before)==6013,(
              'Original V3.10 artifact file count mismatch',
              len(before)
          )

          loader=root/'knight/js/sl-assets-v229r115.js'

          assert loader.read_text('utf8').count(
              "var version='V3.10';"
          )==1

          assert 'V3.10' in (root/'index.html').read_text('utf8')
          assert 'V3.10' in (root/'knight/index.html').read_text('utf8')

          Path('before.json').write_text(
              json.dumps(before,sort_keys=True),
              'utf8'
          )

          manifests=list(
              Path('audit').rglob('SPR-record-audit.csv')
          )

          assert len(manifests)==1,manifests

          with manifests[0].open(
              encoding='utf-8-sig',
              newline=''
          ) as f:

              rows=list(csv.DictReader(f))

          assert len(rows)==158040,len(rows)

          records={
              734:defaultdict(list),
              735:defaultdict(list)
          }

          for row in rows:

              aid=int(row['id'])

              if aid not in records:
                  continue

              assert row['sub']!='',row

              sub=int(row['sub'])

              records[aid][sub].append(row)

          for aid,groups in records.items():

              assert len(groups)==216,(
                  aid,'Original sub SPR count',len(groups)
              )

              assert sum(
                  len(v) for v in groups.values()
              )==216,(
                  aid,'Duplicate sub SPR records'
              )

              assert sum(
                  int(row['frames'])
                  for group in groups.values()
                  for row in group
              )==992,(
                  aid,'Original total frame count'
              )

          assert set(records[734])==set(records[735])

          for sub in records[734]:

              a=records[734][sub][0]
              b=records[735][sub][0]

              assert int(a['frames'])==int(b['frames']),(
                  sub,'Body and shadow frame count mismatch'
              )

          selected=[]

          for sub in (5,7,3,1):

              for aid in (734,735):

                  assert sub in records[aid],(aid,sub)

                  row=records[aid][sub][0]

                  assert row['filename'].lower()==f'{aid}-{sub}.spr'
                  assert int(row['frames'])==4,row
                  assert row['status']=='visible',row

                  assert re.fullmatch(
                      r'Sprite(?:\d+)?\.pak',
                      row['pak'],
                      re.I
                  ),row['pak']

                  selected.append(row)

                  print(
                      'ORIGINAL',
                      aid,sub,
                      row['pak'],
                      row['frames']
                  )

          assert len(selected)==8

          paths=set()

          for row in selected:

              pak=Path(row['pak'])

              for name in (
                  pak.name,
                  pak.with_suffix('.idx').name
              ):

                  paths.add(
                      'Sanctuary of Aden - Copy/'+name
                  )

          Path('/tmp/slv311-original-paths.txt').write_text(
              '\n'.join(sorted(paths))+'\n',
              'utf8'
          )

          Path('/tmp/slv311-records.json').write_text(
              json.dumps(selected,ensure_ascii=False),
              'utf8'
          )

          print('PASS 734 and 735: 216 matching sub SPR records each')
          print('PASS 734 and 735: 992 matching frames each')
          print('PASS four walking directions: eight original SPR files')
          PY1

      - name: Restore original body and shadow SPR data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if gh release download v1.0.0 \
                --repo gowellsik-hue/Game \
                --pattern 'Sanctuary.of.Aden.-.Copy.*' \
                --dir downloads; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            rm -rf downloads
            mkdir -p downloads
            sleep 3
          done

          python3 - <<'PY2'
          from pathlib import Path

          base='Sanctuary.of.Aden.-.Copy'

          expected={
              f'{base}.z{i:02d}':100000000
              for i in range(1,46)
          }

          expected[f'{base}.zip']=38808950

          actual={
              p.name:p.stat().st_size
              for p in Path('downloads').iterdir()
              if p.is_file()
          }

          assert actual==expected,(
              'Original release parts mismatch'
          )

          assert sum(actual.values())==4538808950
          PY2

          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq p7zip-full
          fi

          7z x downloads/Sanctuary.of.Aden.-.Copy.zip \
            '@/tmp/slv311-original-paths.txt' \
            -scsUTF-8 \
            "-o${PWD}/original" \
            -y > original-extract.log

          tail -n 15 original-extract.log

          python3 - <<'PY3'
          from pathlib import Path

          for name in Path(
              '/tmp/slv311-original-paths.txt'
          ).read_text('utf8').splitlines():

              p=Path('original')/name

              assert p.is_file() and p.stat().st_size>0,p

          print('PASS all required original archives restored')
          PY3

          rm -rf downloads

          python3 -m venv /tmp/slv311-venv

          /tmp/slv311-venv/bin/python -m pip install \
            --quiet pillow==11.3.0

      - name: Reuse verified coordinate-preserving SPR decoder
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY4'
          from pathlib import Path
          import ast,textwrap

          path=Path(
              'verified-v37/.github/workflows/build-slknight-web.yml'
          )

          workflow=path.read_text('utf8')

          marker="          cat > /tmp/slv37.py <<'PY3'\n"

          assert workflow.count(marker)==1

          source=workflow.split(
              marker,1
          )[1].split(
              '\n          PY3',1
          )[0]

          source=textwrap.dedent(source)

          classes=[
              node
              for node in ast.parse(source).body
              if isinstance(node,ast.ClassDef)
              and node.name=='Reader'
          ]

          assert len(classes)==1

          reader=ast.get_source_segment(
              source,
              classes[0]
          )

          assert reader

          assert 'pixels[x+px,y+py]' in reader

          Path('/tmp/slv311_reader.py').write_text(
              'import struct\n'
              +reader+'\n',
              'utf8'
          )

          print('PASS exact V3.7 coordinate decoder restored')
          PY4

          /tmp/slv311-venv/bin/python \
            -m py_compile /tmp/slv311_reader.py

      - name: Composite original 735 shadow behind existing 734 wizard
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/slv311.py <<'PY5'
          from pathlib import Path
          from PIL import Image
          from slv311_reader import Reader
          import struct,json,hashlib

          root=Path('original/Sanctuary of Aden - Copy')

          records=json.loads(
              Path('/tmp/slv311-records.json').read_text('utf8')
          )

          assert len(records)==8

          decoded={}

          for row in records:

              aid=int(row['id'])
              sub=int(row['sub'])
              entry=int(row['entry'])

              pak=root/row['pak']
              idx=pak.with_suffix('.idx')

              data=idx.read_bytes()

              count=struct.unpack_from('<I',data,0)[0]

              assert len(data)==4+28*count

              assert 0<=entry<count

              pos=4+28*entry

              offset=struct.unpack_from(
                  '<I',data,pos
              )[0]

              name=data[pos+4:pos+24].split(
                  b'\0',1
              )[0].decode('cp949','replace')

              size=struct.unpack_from(
                  '<I',data,pos+24
              )[0]

              assert name==row['filename'],(
                  name,row['filename']
              )

              assert offset==int(row['offset'])
              assert size==int(row['bytes'])

              assert size>0
              assert offset+size<=pak.stat().st_size

              with pak.open('rb') as f:

                  f.seek(offset)
                  raw=f.read(size)

              assert len(raw)==size

              assert hashlib.sha256(raw).hexdigest()==row['sha256'],(
                  aid,sub,'Original SPR checksum mismatch'
              )

              frames=Reader(raw).decode()

              assert len(frames)==4,(
                  aid,sub,len(frames)
              )

              assert all(frames),(aid,sub)

              assert (aid,sub) not in decoded

              decoded[aid,sub]=frames

          assert len(decoded)==8

          path=Path(
              'site/knight/gameasync/Graphics/Characters/법사.png'
          )

          with Image.open(path) as image:
              original=image.convert('RGBA')

          assert original.size==(192,384),(
              'Original V3.10 wizard sheet size',
              original.size
          )

          cw,ch=48,96

          result=Image.new(
              'RGBA',
              original.size,
              (0,0,0,0)
          )

          processed=0
          added_pixels=0

          for row,sub in enumerate((5,7,3,1)):

              body_frames=decoded[734,sub]
              shadow_frames=decoded[735,sub]

              assert len(body_frames)==len(shadow_frames)==4

              for col in range(4):

                  body=body_frames[col]
                  shadow=shadow_frames[col]

                  assert body and shadow,(sub,col)

                  cell=original.crop((
                      col*cw,
                      row*ch,
                      (col+1)*cw,
                      (row+1)*ch
                  ))

                  bounds=cell.getchannel('A').getbbox()

                  assert bounds,(sub,col)

                  x0=min(x for x,y in body)
                  y0=min(y for x,y in body)

                  x1=max(x for x,y in body)
                  y1=max(y for x,y in body)

                  assert (
                      bounds[2]-bounds[0],
                      bounds[3]-bounds[1]
                  )==(
                      x1-x0+1,
                      y1-y0+1
                  ),(
                      sub,col,
                      'Deployed body shape differs from SPR734'
                  )

                  dx=bounds[0]-x0
                  dy=bounds[1]-y0

                  deployed_body={
                      (x-dx,y-dy)
                      for y in range(ch)
                      for x in range(cw)
                      if cell.getpixel((x,y))[3]
                  }

                  assert deployed_body==set(body),(
                      sub,col,
                      'Existing body pixel positions differ'
                  )

                  shadow_layer=Image.new(
                      'RGBA',
                      (cw,ch),
                      (0,0,0,0)
                  )

                  for (x,y),rgba in shadow.items():

                      xx=x+dx
                      yy=y+dy

                      assert (
                          0<=xx<cw
                          and 0<=yy<ch
                      ),(
                          sub,col,
                          'Original shadow outside existing cell',
                          xx,yy
                      )

                      shadow_layer.putpixel(
                          (xx,yy),
                          rgba
                      )

                  merged=Image.alpha_composite(
                      shadow_layer,
                      cell
                  )

                  visible_shadow=0

                  for y in range(ch):

                      for x in range(cw):

                          old=cell.getpixel((x,y))

                          new=merged.getpixel((x,y))

                          if old[3]:

                              assert new==old,(
                                  sub,col,x,y,
                                  'Existing wizard body pixel changed'
                              )

                          else:

                              expected=shadow_layer.getpixel(
                                  (x,y)
                              )

                              assert new==expected,(
                                  sub,col,x,y,
                                  'Original shadow pixel changed'
                              )

                              if new[3]:

                                  visible_shadow+=1

                  assert visible_shadow>0,(
                      sub,col,
                      'No visible shadow'
                  )

                  result.paste(
                      merged,
                      (col*cw,row*ch)
                  )

                  processed+=1
                  added_pixels+=visible_shadow

                  print(
                      'COMPOSITE',
                      'direction',sub,
                      'frame',col,
                      'original origin',dx,dy,
                      'body pixels',len(body),
                      'shadow pixels',len(shadow),
                      'visible shadow pixels',visible_shadow
                  )

          assert processed==16

          assert added_pixels>0

          assert result.size==original.size

          assert result.tobytes()!=original.tobytes()

          result.save(
              path,
              optimize=True
          )

          with Image.open(path) as saved:

              assert saved.size==(192,384)

              assert saved.convert('RGBA').tobytes()==result.tobytes()

          print('PASS 16 original wizard body frames preserved')
          print('PASS 16 corresponding original shadow frames composited')
          print('PASS four directions and four frames per direction')
          print('PASS original 48x96 cell size preserved')
          print('PASS original 192x384 sheet size preserved')
          print('PASS no independent body or shadow centering')
          print('PASS no body or shadow scaling')
          print('PASS no cropped shadow pixels')
          PY5

          /tmp/slv311-venv/bin/python \
            -m py_compile /tmp/slv311.py

          /tmp/slv311-venv/bin/python \
            /tmp/slv311.py

      - name: Update only wizard resource checksum and version
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY6'
          from pathlib import Path
          import hashlib,json,re

          root=Path('site')
          game=root/'knight/gameasync'

          rel='Graphics/Characters/법사.png'

          image=game/rel
          mapper=game/'mapping.js'

          source=mapper.read_bytes().decode('utf8')

          pattern=re.compile(
              re.escape(rel)+r'\?h=[0-9a-f]{32}'
          )

          matches=list(pattern.finditer(source))

          assert len(matches)==1,(
              'Original wizard resource reference',
              len(matches)
          )

          digest=hashlib.md5(
              image.read_bytes()
          ).hexdigest()

          match=matches[0]

          result=(
              source[:match.start()]
              +rel+'?h='+digest
              +source[match.end():]
          )

          assert result!=source

          assert pattern.sub(
              match.group(),
              result
          )==source,(
              'Unapproved resource mapping changes'
          )

          mapper.write_bytes(
              result.encode('utf8')
          )

          loader=root/'knight/js/sl-assets-v229r115.js'

          source=loader.read_text('utf8')

          assert source.count(
              "var version='V3.10';"
          )==1

          loader.write_text(
              source.replace(
                  "var version='V3.10';",
                  "var version='V3.11';"
              ),
              'utf8'
          )

          for name in (
              'index.html',
              'knight/index.html'
          ):

              path=root/name

              source=path.read_text('utf8')

              assert 'V3.10' in source,(
                  'Missing original version',
                  name
              )

              path.write_text(
                  source.replace(
                      'V3.10','V3.11'
                  ).replace(
                      'v3.10','v3.11'
                  ),
                  'utf8'
              )

          before=json.loads(
              Path('before.json').read_text('utf8')
          )

          after={
              str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          assert before.keys()==after.keys(),(
              'Unexpected added or removed game files'
          )

          changed={
              p for p in before
              if before[p]!=after[p]
          }

          expected={
              'knight/gameasync/Graphics/Characters/법사.png',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html',
              'knight/index.html'
          }

          assert changed==expected,(
              'Unapproved changed files',
              sorted(changed^expected)
          )

          assert before[
              'knight/gameasync/Data/Scripts.rxdata'
          ]==after[
              'knight/gameasync/Data/Scripts.rxdata'
          ]

          assert before[
              'knight/js/dpad.js'
          ]==after[
              'knight/js/dpad.js'
          ]

          assert "location.replace('knight/?v='+Date.now());" in (
              root/'index.html'
          ).read_text('utf8')

          print('PASS V3.11 original wizard shadow')
          print('PASS existing wizard scale and position retained')
          print('PASS existing knight and fairy graphics unchanged')
          print('PASS existing companion movement unchanged')
          print('PASS V3.9 input handling unchanged')
          print('PASS V3.10 direct knight entry unchanged')
          print('PASS original scripts, game data and engine unchanged')
          print('PASS approved changed files:',len(changed))
          print('PASS untouched original files:',len(before)-len(changed))
          PY6

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/dpad.js

      - name: Upload V3.11 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
