name: Deploy SLKnight V14.3z10.5 + SLFairy CANONICAL BOOT FIX

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions: {contents: read, pages: write, id-token: write}

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  Z104_SHA: e044e1b6c53646b4c4f21f2dfee4967a68fabbc4
  DUAL_BASE_SHA: 04ce66ec99abc10f77143de53650685db8949532
  CURRENT_Z10_SHA: f545634bafbe1e1e55aaf6489126ad17b07da382
  BASELINE_SHA: c6815cd461dba60ec131898e6d5dd8690dd915ae
  X2_SHA: 6d941bd643dda87b8267ba466e108d1904c22331
  Z1_SHA: 008b6abe81074b7af877806b45f2314004a74f66
  Z3_SHA: 5a46988b048764e8a99700998c1f4ab96a3ec5c1
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  FAIRY_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLFairy_Source_v1.zip
  FAIRY_SHA256: 67b88b5fe0cde3c9f2fada889815f9aa7d0fc94b378025529e9950d55151c70e
  FAIRY_7Z_PASSWORD: http://nemo838.tistory.com/
  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout z10.4 successful workflow
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z104_SHA }}
          path: z104src

      - name: Checkout frozen z10.2 dual base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.DUAL_BASE_SHA }}
          path: dualbase

      - name: Checkout frozen z10 workflow source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.CURRENT_Z10_SHA }}
          path: z10src

      - name: Checkout frozen V14.3l baseline
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.BASELINE_SHA }}
          path: baseline

      - name: Checkout frozen V14.3x2 native auto base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.X2_SHA }}
          path: x2

      - name: Checkout frozen V14.3z1 verified monster base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z1_SHA }}
          path: z1

      - name: Checkout frozen V14.3z3 current success
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z3_SHA }}
          path: z3

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake cmake curl ffmpeg freepats git imagemagick libtool make mm-common patch pkg-config python3 rake ruby timidity unzip wget xz-utils fonts-nanum p7zip-full nodejs

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.MKXP_SRC_REF }}
          path: engine

      - name: Cache engine dependencies
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-${{ runner.os }}-${{ env.EMSDK_VER }}-onig25b

      - name: Extract already-passed z10.4 build steps
        run: |
          ruby -ryaml - <<'RB'
          doc=YAML.load_file('z104src/.github/workflows/build-slknight-web.yml')
          steps=doc.fetch('jobs').fetch('build').fetch('steps')

          names=[
            'Extract passed build steps from z10.2 through Fairy media',
            'Run frozen build through Fairy media',
            'Repair SLFairy Ruby boot syntax',
            'Build SLFairy mappings after syntax repair'
          ]

          names.each_with_index do |name,i|
            step=steps.find{|s|s['name']==name}
            abort "Z104 STEP MISSING: #{name}" unless step&&step['run']
            File.write(format('/tmp/z104_pass_%02d.sh',i),step['run'])
          end

          puts "Z104_PASSED_STEPS_EXTRACTED=#{names.length}"
          RB

      - name: Run frozen successful build through repaired Fairy mappings
        run: |
          set -euo pipefail

          for i in 0 1 2 3; do
            f="$(printf '/tmp/z104_pass_%02d.sh' "$i")"
            echo "===== RUN $f ====="
            bash -e "$f"
          done

          echo Z104_BUILD_AND_FAIRY_SYNTAX_REPAIR_OK

      - name: Canonicalize SLFairy protected data paths and title
        run: |
          set -euo pipefail

          ruby -EUTF-8:UTF-8 -rzlib - fairy_player <<'RB'
          # encoding: UTF-8
          require 'fileutils'

          game=ARGV.fetch(0)
          data=File.join(game,'gameasync','Data')

          bases=%w[
            Actors Classes Skills Items Weapons Armors Enemies
            Troops States Animations Tilesets CommonEvents System MapInfos
          ]

          bases.each do |name|
            candidates=Dir.glob(
              File.join(
                data,
                "*#{name}.rxdata"
              )
            )

            src=candidates.max_by do |p|
              File.size(p)
            end

            dst=File.join(
              data,
              "#{name}.rxdata"
            )

            abort(
              "FAIRY REAL DATA MISSING #{name}"
            ) unless src&&File.size(src)>4

            unless File.expand_path(src)==File.expand_path(dst)
              FileUtils.cp(
                src,
                dst
              )
            end

            abort(
              "FAIRY CANONICAL DATA EMPTY #{name}"
            ) unless File.size(dst)>4

            puts(
              "FAIRY_CANONICAL_DATA " \
              "#{name}=#{File.size(dst)}"
            )
          end

          map_count=0

          Dir.glob(
            File.join(
              data,
              '*Map[0-9][0-9][0-9].rxdata'
            )
          ).sort.each do |src|

            bn=File.basename(src)

            m=bn.match(
              /^[A-Z]{20,}(Map\d{3}\.rxdata)$/
            )

            next unless m

            dst=File.join(
              data,
              m[1]
            )

            FileUtils.cp(
              src,
              dst
            )

            abort(
              "FAIRY CANONICAL MAP EMPTY #{m[1]}"
            ) unless File.size(dst)>4

            map_count+=1
          end

          abort(
            "FAIRY CANONICAL MAP COUNT=#{map_count}"
          ) unless map_count>=16

          sp=File.join(
            data,
            'Scripts.rxdata'
          )

          scripts=Marshal.load(
            File.binread(sp)
          )

          db_re=
            /Data\/[A-Z]{20,}(Actors|Classes|Skills|Items|Weapons|Armors|Enemies|Troops|States|Animations|Tilesets|CommonEvents|System)\.rxdata/

          map_re=
            /Data\/[A-Z]{20,}Map%03d\.rxdata/

          path_changes=0
          title_changes=0

          scripts.each do |e|
            next unless (
              e.is_a?(Array) &&
              e.length>=3
            )

            begin
              src=
                Zlib::Inflate
                .inflate(
                  e[2]
                )
                .force_encoding(
                  Encoding::UTF_8
                )
            rescue Zlib::DataError
              next
            end

            changed=false

            src=src.gsub(
              db_re
            ) do
              path_changes+=1
              changed=true
              "Data/#{$1}.rxdata"
            end

            src=src.gsub(
              map_re
            ) do
              path_changes+=1
              changed=true
              'Data/Map%03d.rxdata'
            end

            if e[1].to_s=='Scene_Title'

              old=
                '@sprite.bitmap = RPG::Cache.title($data_system.title_name)'

              abort(
                'FAIRY TITLE LOAD MARKER MISSING'
              ) unless src.include?(old)

              src=src.sub(
                old,
                '@sprite.bitmap = RPG::Cache.title("fairy_title")'
              )

              title_changes+=1
              changed=true
            end

            if changed
              e[2]=
                Zlib::Deflate.deflate(
                  src
                )
            end
          end

          abort(
            "FAIRY RANDOM DATA PATH PATCH COUNT=#{path_changes}"
          ) unless path_changes==16

          abort(
            "FAIRY TITLE PATCH COUNT=#{title_changes}"
          ) unless title_changes==1

          File.binwrite(
            sp,
            Marshal.dump(
              scripts
            )
          )

          titles=File.join(
            game,
            'gameasync',
            'Graphics',
            'Titles'
          )

          title_src=File.join(
            titles,
            '일환소프트.png'
          )

          title_dst=File.join(
            titles,
            'fairy_title.png'
          )

          abort(
            'FAIRY ORIGINAL TITLE MISSING'
          ) unless File.size?(title_src)

          FileUtils.cp(
            title_src,
            title_dst
          )

          abort(
            'FAIRY ASCII TITLE COPY FAILED'
          ) unless File.size?(title_dst)

          ini_path=File.join(
            game,
            'gameasync',
            'Game.ini'
          )

          ini=File.binread(
            ini_path
          )

          %w[
            RTP1
            RTP2
            RTP3
          ].each do |key|

            unless ini.match?(
              /^#{key}=/i
            )
              ini << "#{key}=\r\n"
            end
          end

          File.binwrite(
            ini_path,
            ini
          )

          puts(
            "FAIRY_CANONICAL_MAPS=#{map_count}"
          )

          puts(
            "FAIRY_RANDOM_PATH_PATCHES=#{path_changes}"
          )

          puts \
            'FAIRY_CANONICAL_BOOT_DATA_OK'
          RB

      - name: Rebuild SLFairy mappings after canonicalization
        run: |
          set -euo pipefail

          (
            cd fairy_player/gameasync

            bash \
              "$GITHUB_WORKSPACE/engine/extra/make_mapping.sh"
          )

          test -s \
            fairy_player/gameasync/mapping.js

          test -s \
            fairy_player/gameasync/bitmap-map.js

          echo \
            FAIRY_CANONICAL_MAPPING_OK

      - name: Finalize browser boot bridge and cache isolation
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          bad="replace(/\\/g,'/')"
          good="replace(/\\\\/g,'/')"

          for name in (
              'player/index.html',
              'fairy_player/index.html'
          ):

              p=Path(name)
              s=p.read_text()

              if s.count(bad)!=1:
                  raise SystemExit(
                      f'BROKEN AUDIO BRIDGE MARKER '
                      f'{name} count={s.count(bad)}'
                  )

              s=s.replace(
                  bad,
                  good,
                  1
              )

              p.write_text(s)

          p=Path(
              'fairy_player/index.html'
          )

          s=p.read_text()

          if (
              'slknight_v14_engine'
              not in s
          ):
              raise SystemExit(
                  'Fairy copied Knight namespace marker missing'
              )

          if (
              'SLKnight V14.3z100'
              not in s
          ):
              raise SystemExit(
                  'Fairy copied Knight title marker missing'
              )

          if (
              'v143z100'
              not in s
          ):
              raise SystemExit(
                  'Fairy copied Knight cache marker missing'
              )

          s=s.replace(
              'v143z100',
              'v143z105elf'
          )

          s=s.replace(
              'SLKnight V14.3z100',
              'SLFairy V14.3z10.5'
          )

          s=s.replace(
              'slknight_v14_engine',
              'slfairy_v105_engine'
          )

          pat=re.compile(
              r"\n\s*var slAttackSheets=.*?"
              r"\n\s*slAttackCoords\.forEach"
              r"\(function\(name\)\{.*?"
              r"\n\s*\}\);",
              re.S
          )

          s,n=pat.subn(
              '',
              s,
              count=1
          )

          if n!=1:
              raise SystemExit(
                  'Knight monster preload block '
                  f'removal count={n}'
              )

          for marker in (
              'slfairy_v105_engine',
              'SLFairy V14.3z10.5',
              'v143z105elf'
          ):
              if marker not in s:
                  raise SystemExit(
                      'Fairy marker missing: '+
                      marker
                  )

          if (
              'slAttackSheets' in s
              or
              'slAttackCoords' in s
          ):
              raise SystemExit(
                  'Knight monster preload remains in Fairy index'
              )

          p.write_text(s)

          d=Path(
              'fairy_player/js/dpad.js'
          )

          t=d.read_text()

          old=(
              "hotButton(hot,0,'A',65);"
              "hotButton(hot,1,'S',83);"
              "hotButton(hot,2,'D',68);"
              "hotButton(hot,3,'Q',81);"
              "hotButton(hot,4,'Z',117);"
              "hotButton(hot,5,'F',116);"
          )

          new=(
              "hotButton(hot,0,'A',117);"
              "hotButton(hot,1,'S',118);"
              "hotButton(hot,2,'D',119);"
              "hotButton(hot,3,'Q',120);"
              "hotButton(hot,4,'F',116);"
          )

          if t.count(old)!=1:
              raise SystemExit(
                  'Fairy dpad hotbar marker '
                  f'count={t.count(old)}'
              )

          d.write_text(
              t.replace(
                  old,
                  new,
                  1
              )
          )

          print(
              'FAIRY_BROWSER_Z105_OK'
          )
          PY

          touch \
            fairy_player/.nojekyll

      - name: Verify SLFairy canonical boot package
        run: |
          set -euo pipefail

          test -s \
            fairy_player/index.html

          test -s \
            fairy_player/mkxp.js

          test -s \
            fairy_player/mkxp.wasm

          test -s \
            fairy_player/gameasync/Game.ini

          test -s \
            fairy_player/gameasync/Data/Scripts.rxdata

          test -s \
            fairy_player/gameasync/mapping.js

          test -s \
            fairy_player/gameasync/bitmap-map.js

          test -s \
            fairy_player/gameasync/Graphics/Titles/fairy_title.png

          ! test -e \
            fairy_player/gameasync/Game.rgssad

          for f in \
            Actors \
            Classes \
            Skills \
            Items \
            Weapons \
            Armors \
            Enemies \
            Troops \
            States \
            Animations \
            Tilesets \
            CommonEvents \
            System \
            MapInfos
          do
            test \
              "$(stat -c %s "fairy_player/gameasync/Data/$f.rxdata")" \
              -gt 4
          done

          test \
            "$(stat -c %s fairy_player/gameasync/Data/Map007.rxdata)" \
            -gt 4

          grep -Fq \
            'slfairy_v105_engine' \
            fairy_player/index.html

          grep -Fq \
            'SLFairy V14.3z10.5' \
            fairy_player/index.html

          grep -Fq \
            'v143z105elf' \
            fairy_player/index.html

          grep -Fq \
            "replace(/\\\\/g,'/')" \
            fairy_player/index.html

          grep -Fq \
            "replace(/\\\\/g,'/')" \
            player/index.html

          grep -Fq \
            "hotButton(hot,0,'A',117)" \
            fairy_player/js/dpad.js

          grep -Fq \
            "hotButton(hot,1,'S',118)" \
            fairy_player/js/dpad.js

          grep -Fq \
            "hotButton(hot,2,'D',119)" \
            fairy_player/js/dpad.js

          grep -Fq \
            "hotButton(hot,3,'Q',120)" \
            fairy_player/js/dpad.js

          grep -Fq \
            "hotButton(hot,4,'F',116)" \
            fairy_player/js/dpad.js

          ! grep -Fq \
            "hotButton(hot,4,'Z',117)" \
            fairy_player/js/dpad.js

          node --check \
            fairy_player/js/dpad.js

          node --check \
            fairy_player/js/drive.js

          node --check \
            player/js/dpad.js

          node --check \
            player/js/drive.js

          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          for html in (
              'player/index.html',
              'fairy_player/index.html'
          ):

              s=Path(
                  html
              ).read_text()

              blocks=[]

              for m in re.finditer(
                  r'<script(?P<attrs>[^>]*)>(?P<body>.*?)</script>',
                  s,
                  re.S|re.I
              ):

                  if (
                      'src='
                      in
                      m.group(
                          'attrs'
                      ).lower()
                  ):
                      continue

                  body=m.group(
                      'body'
                  )

                  if body.strip():
                      blocks.append(
                          body
                      )

              if not blocks:
                  raise SystemExit(
                      'NO INLINE JS BLOCKS: '+
                      html
                  )

              for i,body in enumerate(
                  blocks
              ):

                  tmp=Path(
                      f'/tmp/'
                      f'{Path(html).parent.name}'
                      f'_inline_{i}.js'
                  )

                  tmp.write_text(
                      body
                  )

                  r=subprocess.run(
                      [
                          'node',
                          '--check',
                          str(tmp)
                      ],
                      capture_output=True,
                      text=True
                  )

                  if r.returncode:
                      raise SystemExit(
                          'INLINE JS SYNTAX ERROR '
                          f'{html} block={i}\n'
                          f'{r.stderr}'
                      )

              print(
                  'INLINE_JS_OK',
                  html,
                  len(blocks)
              )
          PY

          ruby \
            -EUTF-8:UTF-8 \
            -rzlib \
            - \
            fairy_player/gameasync/Data/Scripts.rxdata \
            <<'RB'

          scripts=Marshal.load(
            File.binread(
              ARGV[0]
            )
          )

          names=
            scripts
            .select do |e|
              e.is_a?(Array) &&
                e.length>=3
            end
            .map do |e|
              e[1].to_s
            end

          [
            'Web Compatibility',
            'Mobile Diablo Assist',
            'Web Resolution 800x600',
            'Main',
            'Scene_Title',
            'Game_Map'
          ].each do |name|

            abort(
              "FAIRY SCRIPT MISSING: #{name}"
            ) unless names.include?(name)
          end

          random_refs=[]
          title_ok=false

          scripts.each_with_index do |e,i|

            next unless (
              e.is_a?(Array) &&
              e.length>=3
            )

            begin
              code=
                Zlib::Inflate
                .inflate(
                  e[2]
                )
                .force_encoding(
                  Encoding::UTF_8
                )
            rescue Zlib::DataError
              next
            end

            if code.match?(
              /Data\/[A-Z]{20,}/
            )
              random_refs << [
                i,
                e[1].to_s
              ]
            end

            if e[1].to_s=='Scene_Title'
              title_ok=
                code.include?(
                  'RPG::Cache.title("fairy_title")'
                )
            end

            begin
              RubyVM::InstructionSequence.compile(
                code,
                "fairy_verify_#{i}"
              )
            rescue SyntaxError=>ex
              abort(
                'FAIRY RUBY SYNTAX ERROR '
                "script=#{i}: "
                "#{ex.message}"
              )
            end
          end

          abort(
            'FAIRY RANDOM DATA PATHS REMAIN: '+
            random_refs.inspect
          ) unless random_refs.empty?

          abort(
            'FAIRY ASCII TITLE PATCH MISSING'
          ) unless title_ok

          puts \
            'FAIRY_CANONICAL_RUBY_VERIFY_OK'
          RB

          echo \
            "FAIRY_FILES=$(find fairy_player/gameasync -type f | wc -l)"

          du -sh \
            fairy_player

      - name: Build Knight + Fairy launcher with cache-busted entry
        run: |
          set -euo pipefail

          rm -rf \
            /tmp/sl_dual_site

          mkdir -p \
            /tmp/sl_dual_site/knight \
            /tmp/sl_dual_site/elf

          cp -a \
            player/. \
            /tmp/sl_dual_site/knight/

          cp -a \
            fairy_player/. \
            /tmp/sl_dual_site/elf/

          cat > /tmp/sl_dual_site/index.html <<'HTML'
          <!doctype html>
          <html lang="ko">
          <head>
            <meta charset="utf-8">

            <meta
              http-equiv="Cache-Control"
              content="no-cache, no-store, must-revalidate"
            >

            <meta
              http-equiv="Pragma"
              content="no-cache"
            >

            <meta
              http-equiv="Expires"
              content="0"
            >

            <meta
              name="viewport"
              content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
            >

            <title>
              SLKnight + SLFairy Mobile
            </title>

            <style>
              html,body{
                margin:0;
                width:100%;
                height:100%;
                background:#080808;
                color:#fff;
                font-family:system-ui,sans-serif
              }

              .wrap{
                height:100%;
                display:flex;
                align-items:center;
                justify-content:center;
                flex-direction:column;
                gap:22px
              }

              h1{
                font-size:30px;
                margin:0 0 12px
              }

              .choices{
                display:flex;
                gap:18px
              }

              .card{
                width:150px;
                height:170px;
                border:1px solid #777;
                border-radius:14px;
                background:#171717;
                color:#fff;
                font-size:25px;
                cursor:pointer
              }

              .card:active{
                transform:scale(.97)
              }

              .sub{
                font-size:13px;
                color:#aaa;
                text-align:center;
                max-width:390px;
                line-height:1.5
              }
            </style>
          </head>

          <body>
            <div class="wrap">

              <h1>
                캐릭터 선택
              </h1>

              <div class="choices">

                <button
                  class="card"
                  onclick="location.href='knight/?v='+Date.now()"
                >
                  기사
                </button>

                <button
                  class="card"
                  onclick="location.href='elf/?v='+Date.now()"
                >
                  요정
                </button>

              </div>

              <div class="sub">
                기사와 요정은 원본 게임 파일과 저장 데이터가 서로 분리되어 실행됩니다.
              </div>

            </div>
          </body>
          </html>
          HTML

          touch \
            /tmp/sl_dual_site/.nojekyll

          test -s \
            /tmp/sl_dual_site/index.html

          test -s \
            /tmp/sl_dual_site/knight/index.html

          test -s \
            /tmp/sl_dual_site/elf/index.html

          grep -Fq \
            'slknight_v14_engine' \
            /tmp/sl_dual_site/knight/index.html

          grep -Fq \
            'slfairy_v105_engine' \
            /tmp/sl_dual_site/elf/index.html

          grep -Fq \
            "elf/?v='+Date.now()" \
            /tmp/sl_dual_site/index.html

          rm -rf \
            player \
            fairy_player

          mv \
            /tmp/sl_dual_site \
            player

          echo \
            DUAL_Z105_CANONICAL_BUILD_OK

          du -sh \
            player

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player

