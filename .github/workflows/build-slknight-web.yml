          raise 'Offscreen wall sprites leaked' unless instance.instance_variable_get(:@slti_wall_sprites).empty?
          raise 'Offscreen wall bitmaps leaked' unless instance.instance_variable_get(:@slti_wall_bitmaps).empty?
          puts 'PASS actual method: WALL opacity 128 when overlapping, WALL 255 after leaving, HERO stays 255, dispose caches off-screen'
          R40_VERIFY_ALPHA
          ruby -c /tmp/r40_test_renderer.rb
          ruby /tmp/r40_test_renderer.rb build/Spriteset_Map_V229R40.rb build/r40-wall-tiles.json | tee build/r40-wall-alpha-test.txt

      - name: V229R40 Test 5472 source files and verify no unrelated game changes
        shell: bash
