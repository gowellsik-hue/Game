
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V261
# FIX: V260 ambiguous item database selection
#
# V260 failure:
# - Elf and Knight DBs were searched together.
# - Original and mapped DB names were mixed.
#
# V261:
# - Read only the mapped Knight database.
# - Preserve V260 combat and item-link validation.
#
# Source V260:
# 0fd1f1561c233601a0ae5afd9282f60281acae74
#
# Source V258:
# 29c232dce4d9ffd1ff39648e058115b017ec493e
#
# Original game:
# V254 run 41394237945
#
# MAP: Tower of Insolence 2F / Map025 EV29
# MONSTER: Zenith Queen
# LEVEL: 60
# HP: 5200
# PHYSICAL: 50-100
# MAGIC: 150-300
# PHYSICAL:MAGIC: 6:1
# MINIMUM MAGIC DAMAGE: 80
# ATTACK WAIT: 20
#
# DROPS: 20 existing entries, unchanged
# ITEM18: Items / Two-handed Sword
# ARMOR492: Zenith Ring
#
# No cloned Death Knight events.
# No changes to unrelated maps or monsters.

name: build-slknight-web.yml | V261 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: V261 Load pinned V260 workflow
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: 0fd1f1561c233601a0ae5afd9282f60281acae74
          path: v260-source
          persist-credentials: false

      - name: V261 Load pinned V258 build source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: 29c232dce4d9ffd1ff39648e058115b017ec493e
          path: v258-source
          persist-credentials: false

      - name: V261 Restore verified original game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41394237945
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V261 Build install and run regression checks
        shell: bash
        run: |
          set -euo pipefail

          ruby <<'RB'
          require 'yaml'
          require 'fileutils'

          # Load the immutable V260 build procedure.
          source=File.join(
            'v260-source',
            '.github',
            'workflows',
            'build-slknight-web.yml'
          )

          abort 'V260 source missing' unless
            File.file?(source)

          raw=File.read(source)

          abort 'Wrong V260 source' unless
            raw.include?('# VERSION: V260')

          workflow=YAML.load_file(source)

          build=workflow.fetch('jobs').fetch('build')

          stages=build.fetch('steps')

          stage=stages.find do |entry|
            entry['name']==
              'V260 Install and verify corrected monster'
          end

          abort 'V260 build stage missing' unless stage

          script=stage.fetch('run')

          # Exact original pattern.
          # This searched Elf + Knight and both
          # the plain and mapped database names.

          old_path=%q!File.join('site','**',"*#{suffix}.rxdata")!

          # Use only the mapped Knight files.
          # The prefix is verified from the V260
          # GitHub Actions failure log and Map025.

          new_path=%q!File.join('site','knight','gameasync','Data',"MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO#{suffix}.rxdata")!

          count=script.scan(old_path).length

          abort(
            "Expected exactly one database path, got #{count}"
          ) unless count==1

          script=script.sub(
            old_path,
            new_path
          )

          # Advance every generated version marker.
          script=script.gsub(
            'V260','V261'
          )

          script=script.gsub(
            'v260','v261'
          )

          script=script.gsub(
            '99826001','99826101'
          )

          # Verify that the pinned V258 source
          # will be transformed to V261.

          required=[
            "script=script.gsub('V258','V261')",
            "script=script.gsub('v258','v261')",
            "script=script.gsub('99825801','99826101')",
            'V261 Verify original files',
            'EXPECTED_DROP_NAMES',
            'drop_link_correct?',
            '[:item,18]',
            '[:armor,492]'
          ]

          required.each do |marker|
            unless script.include?(marker)
              abort "V261 patch missing #{marker}"
            end
          end

          abort 'Recursive database lookup remains' if
            script.include?(old_path)

          abort 'Mapped Knight database missing' unless
            script.include?(new_path)

          abort 'V260 version remains' if
            script.match?(/V260|v260|99826001/)

          # Ensure both immutable source files exist.
          v258=File.join(
            'v258-source',
            '.github',
            'workflows',
            'build-slknight-web.yml'
          )

          abort 'V258 source missing' unless
            File.file?(v258)

          abort 'Incorrect V258 baseline' unless
            File.read(v258).include?('# VERSION: V258')

          # The original Pages archive is restored by
          # the inherited V258 verification step.

          archive='baseline/artifact.tar'

          abort 'V254 artifact missing' unless
            File.size?(archive)

          FileUtils.mkdir_p('build')

          target='build/v261-build.sh'

          File.write(target,script)

          puts 'PASS V261 workflow source verification'
          puts 'PASS V261 mapped Knight database path'
          puts 'PASS V261 source version consistency'

          STDOUT.flush

          # Executes the complete pinned V260 build:
          # 1. Baseline verification
          # 2. Monster runtime generation
          # 3. Event installation and DB validation
          # 4. Combat and reward tests
          # 5. Resource mapping
          # 6. Original game protection checks

          success=system('bash',target)

          abort 'V261 build or regression test failed' unless
            success

          runtime=File.read(
            'build/monster-runtime.rb'
          )

          required_runtime=[
            ':max_hp=>5200',
            ':physical=>[50,100]',
            ':magic=>[150,300]',
            ':physical_weight=>6',
            ':magic_weight=>1',
            ':magic_floor=>80',
            ':attack_wait=>20',
            '[:item,18,50]',
            '[:weapon,123,30]',
            '[:armor,303,2]',
            '[:armor,492,3]',
            'EXPECTED_DROP_NAMES',
            'drop_link_correct?'
          ]

          required_runtime.each do |marker|
            unless runtime.include?(marker)
              abort "Runtime invariant missing #{marker}"
            end
          end

          forbidden_runtime=[
            '[:weapon,18,50]',
            'target.hp=[current-damage,0].max'
          ]

          forbidden_runtime.each do |marker|
            if runtime.include?(marker)
              abort "Forbidden runtime code #{marker}"
            end
          end

          # Validate final artifact structure.
          game='site/knight/gameasync/Data'

          scripts=File.join(game,'Scripts.rxdata')

          mapped='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          paths=[
            scripts,
            File.join(game,mapped+'Map025.rxdata'),
            File.join(game,mapped+'CommonEvents.rxdata')
          ]

          paths.each do |path|
            abort "Missing final asset #{path}" unless
              File.size?(path)
          end

          puts 'PASS V261 final assets'
          puts 'PASS physical/magic 6:1 preserved'
          puts 'PASS magic minimum 80 preserved'
          puts 'PASS all 20 existing drop entries preserved'
          puts 'PASS correct item and armor types'
          puts 'PASS original game protection checks'
          RB

      - name: V261 Publish game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
