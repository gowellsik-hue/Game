
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R89
# BASE: deployed V229R84 (run 40265029580), original 4-way player and pad.
# TRIAL: parity-align the player and native monsters one S32 step on floor 1.
# MAP45 ONLY: 419 original corners plus 32 same-side in-between links.
# Preserve the 419 corners + 32 bridges; no 2F, spawn data, combat or pad edits.
name: build-slknight-web.yml | V229R89 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R89 Restore verified R84 baseline
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40265029580
          name: github-pages
          github-token: ${{ github.token }}
          path: r84

      - name: V229R89 Build existing corner rules and trial even-parity alignment
        shell: bash
        run: |
          set -euo pipefail
          test -s r84/artifact.tar
          mkdir -p site build
          tar -xf r84/artifact.tar -C site
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert len(files)==5517,('Wrong R84 file count',len(files))
          engine=root/'knight/gameasync/Data/Scripts.rxdata'
          assert hashlib.sha256(engine.read_bytes()).hexdigest()==\
            '118878b132665f3128146c2e8ca4c426739a98e6e9a5ecb3f9f9d387592f8f4d',\
            'Wrong engine: abort rather than modify unrelated data'
          pad=root/'knight/js/dpad.js'
          assert hashlib.sha256(pad.read_bytes()).hexdigest()==\
            'a313791be0ef8eeb5edcf57088cf39b860662a318cdb11c2170c70f846688acb',\
            'Original 4-direction pad changed'
          for name in ('index.html','knight/index.html'):
            assert 'V229R84' in (root/name).read_text('utf-8'),name
          Path('build/r84-hashes.json').write_text(json.dumps(files,sort_keys=True))
          print('PASS: unmodified R84 archive, pad and 5517 files')
          PY_BASE

          ruby -rzlib -rdigest - <<'RB_PATCH'
          path='site/knight/gameasync/Data/Scripts.rxdata'
          a=Marshal.load(File.binread(path))
          before=Marshal.load(File.binread(path))
          raise 'Wrong script count' unless a.length==136
          player=Zlib::Inflate.inflate(a[27][2])
          raise 'Player 4-way controls changed' unless
            Digest::SHA256.hexdigest(player)==
              'a6b344b8b8b6a83c9f77529eb333d16053ceb32483e6336eb082ad8f03e74ced' &&
            player.include?('case Input.dir4') && !player.include?('case Input.dir8')
          src=Zlib::Inflate.inflate(a[134][2])
          raise 'Wrong R84 script 134' unless
            Digest::SHA256.hexdigest(src)==
              '3f646769ca61efb2f8645b3b150386d2314e8696ce11149c669db1ef5a89ad03'
          raise 'Prior corner patch present' if
            src.include?('SLTI_V229R85Corner') || src.include?('SLTI_V229R89Corner')
          first=src.index("module SLTI_Native66\n")
          last=src.index("\nclass Game_Character",first)
          raise 'R84 source map not found' unless first && last
          Object.class_eval(src[first...last])

          # Resolve the 419 approved corner candidates OFFLINE, not at game boot.
          nav=SLTI_Native66
          native={:L=>[-1,0],:R=>[1,0],:U=>[0,-1],:D=>[0,1]}
          pairs=[[:L,:U],[:R,:D],[:L,:D],[:R,:U]]
          cuts={}
          oy=nav::ORIGIN_Y
          ox=nav::ORIGIN_X
          (oy...(oy+nav::HEIGHT.fetch(45))).each do |y|
            (ox...(ox+nav::WIDTH.fetch(45))).each do |x|
              next unless nav.value(45,x,y)==0
              flags={}
              native.each do |side,(dx,dy)|
                flags[side]=nav.value(45,x+dx,y+dy)!=0
              end
              pairs.each do |aa,bb|
                next unless flags[aa] && flags[bb]
                blocked=native.keys-[aa,bb]
                next unless blocked.all?{|side| !flags[side]}
                next unless blocked.all? do |side|
                  dx,dy=native.fetch(side)
                  nav.value(45,x+dx,y+dy)==0 &&
                    nav.value(45,x+2*dx,y+2*dy)==0
                end
                mask=(aa==:R || bb==:R) ? 12 : 3
                raise 'Ambiguous corner' if cuts.key?([x,y])
                cuts[[x,y]]=mask
              end
            end
          end
          raise "Unexpected base corner count #{cuts.length}" unless
            cuts.length==419 && cuts.values.count(12)==201 &&
            cuts.values.count(3)==218

          # Bridge original zero-cell gaps between matching approved corners.
          bridges={}
          (oy...(oy+nav::HEIGHT.fetch(45))).each do |y|
            (ox...(ox+nav::WIDTH.fetch(45))).each do |x|
              next unless nav.value(45,x,y)==0 && !cuts.key?([x,y])
              up=cuts[[x,y-1]]
              down=cuts[[x,y+1]]
              next unless up && up==down && (up==3 || up==12)
              side_x=(up==3 ? x-1 : x+1)
              next unless nav.value(45,side_x,y)!=0
              bridges[[x,y]]=up
            end
          end
          raise "Unexpected bridge count #{bridges.size}" unless
            bridges.size==32 && bridges.values.count(3)==14 &&
            bridges.values.count(12)==18 && bridges[[32657,32806]]==3
          cuts.merge!(bridges)
          raise 'Wrong merged masks' unless
            cuts.size==451 && cuts.values.count(3)==232 &&
            cuts.values.count(12)==219
          puts 'PASS 419 corner masks + 32 same-side bridge masks'

          data=cuts.sort_by{|(x,y),mask|[y,x]}.flat_map do |(x,y),mask|
            [x-ox,y-oy,mask]
          end.pack('C*')
          raise 'Bad corner and bridge payload' unless data.bytesize==1353
          encoded=[data].pack('m0')

          module_text=<<'R89_MODULE'
          # V229R89: preverified 419 corners and 32 one-cell edge bridges; no boot scan.
          module SLTI_V229R89Corner
            DELTA={2=>[-1,1],4=>[-1,-1],6=>[1,1],8=>[1,-1]}.freeze
            BIT={2=>1,4=>2,6=>4,8=>8}.freeze
            OPPOSITE={2=>8,4=>6,6=>4,8=>2}.freeze
            data='__R89_DATA__'.unpack('m')[0].unpack('C*')
            MASKS={}
            i=0
            while i<data.length
              MASKS[[32576+data[i],32704+data[i+1]]]=data[i+2]
              i+=3
            end
            MASKS.freeze
          end
          R89_MODULE
          module_text=module_text.sub('__R89_DATA__',encoded)

          old_method=<<'R84_METHOD'
            def self.native_target(mid,x,y,dir)
              moves={
                2=>[-1,1], 4=>[-1,-1], 6=>[1,1], 8=>[1,-1],
                1=>[-1,0], 3=>[0,1], 7=>[0,-1], 9=>[1,0]
              }
              d=moves[dir]
              return nil if d==nil
              dx,dy=d
              return move_path?(mid,x,y,dx,dy) ? [x+dx,y+dy] : nil
            end
          R84_METHOD
          new_method=<<'R89_METHOD'
            def self.native_target(mid,x,y,dir)
              moves={
                2=>[-1,1], 4=>[-1,-1], 6=>[1,1], 8=>[1,-1],
                1=>[-1,0], 3=>[0,1], 7=>[0,-1], 9=>[1,0]
              }
              d=moves[dir]
              if d==nil
                nil
              else
                dx,dy=d
                if mid!=45 || !SLTI_V229R89Corner::DELTA.key?(dir)
                  move_path?(mid,x,y,dx,dy) ? [x+dx,y+dy] : nil
                else
                  tx=x+dx
                  ty=y+dy
                  cuts=SLTI_V229R89Corner::MASKS
                  from=cuts[[x,y]]
                  into=cuts[[tx,ty]]
                  if from==nil && into==nil
                    move_path?(mid,x,y,dx,dy) ? [tx,ty] : nil
                  elsif from!=nil && into!=nil
                    nil
                  elsif from!=nil
                    bits=SLTI_V229R89Corner::BIT
                    ((from & bits.fetch(dir))!=0 && value(mid,tx,ty)!=0) ? [tx,ty] : nil
                  else
                    bits=SLTI_V229R89Corner::BIT
                    opposite=SLTI_V229R89Corner::OPPOSITE
                    ((into & bits.fetch(opposite.fetch(dir)))!=0 && value(mid,x,y)!=0) ? [tx,ty] : nil
                  end
                end
              end
            end
          R89_METHOD
          raise 'Cannot safely locate R84 movement method' unless
            src.scan(old_method).length==1
          changed=src.sub(old_method,new_method)
          marker="\n# V229R84: R82 green-cell continuity and no-slide are retained."
          raise 'Missing unique R84 extension point' unless changed.scan(marker).length==1

          # Trial: shift odd-parity player and monsters by at most ONE S32 edge.
          parity_text=<<'R89_PARITY'
          module SLTI_V229R89Parity
            OFFSETS=[[0,1],[1,0],[0,-1],[-1,0]].freeze
            def self.choose(mid,x,y,actor)
              return [x,y] unless mid==45 && ((x+y)&1)==1
              OFFSETS.each do |dx,dy|
                nx=x+dx;ny=y+dy
                next if SLTI_Native66.value(mid,nx,ny)==0
                next unless SLTI_Native66.edge?(mid,x,y,dx,dy)
                rx,ry=SLTI_Native66.to_rgss(mid,nx,ny)
                next unless $game_map.valid?(rx,ry)
                occupied=false
                events=$game_map.events
                if events!=nil
                  events.each_value do |other|
                    next if other==actor || other.through
                    next if other.character_name.to_s==''
                    if other.x==rx && other.y==ry
                      occupied=true
                      break
                    end
                  end
                end
                if actor!=$game_player && $game_player!=nil &&
                   !$game_player.through && $game_player.x==rx && $game_player.y==ry
                  occupied=true
                end
                next if occupied
                return [nx,ny]
              end
              return [x,y]
            end
          end
          R89_PARITY
          changed=changed.sub(marker,"\n"+module_text+"\n"+parity_text+marker)

          old_prepare=<<'R84_PREPARE'
            def slti_native66_prepare
              return false unless slti_native66_character?
              mid=$game_map.map_id
              if @slti_native66_map!=mid || @slti_native66_x==nil || @slti_native66_y==nil
                spot=SLTI_Native66.nearest(mid,@x,@y,16)
                return false if spot==nil
                @slti_native66_map=mid
                @slti_native66_x,@slti_native66_y=spot
                @slti_native66_tx,@slti_native66_ty=SLTI_Native66.real(mid,spot[0],spot[1])
                @real_x=@slti_native66_tx
                @real_y=@slti_native66_ty
              end
              return true
            end
          R84_PREPARE
          new_prepare=<<'R89_PREPARE'
            def slti_native66_prepare
              return false unless slti_native66_character?
              mid=$game_map.map_id
              if @slti_native66_map!=mid || @slti_native66_x==nil || @slti_native66_y==nil
                spot=SLTI_Native66.nearest(mid,@x,@y,16)
                return false if spot==nil
                @slti_native66_map=mid
                @slti_native66_x,@slti_native66_y=spot
                @slti_native66_tx,@slti_native66_ty=SLTI_Native66.real(mid,spot[0],spot[1])
                @real_x=@slti_native66_tx
                @real_y=@slti_native66_ty
                @slti_r89_checked=false
              end
              # For loaded characters, check parity once on floor 1.
              if mid==45 && !@slti_r89_checked
                @slti_r89_checked=true
                x=@slti_native66_x;y=@slti_native66_y
                target=SLTI_V229R89Parity.choose(mid,x,y,self)
                if target[0]!=x || target[1]!=y
                  @slti_native66_x,@slti_native66_y=target
                  @slti_native66_tx,@slti_native66_ty=SLTI_Native66.real(mid,target[0],target[1])
                  @real_x=@slti_native66_tx
                  @real_y=@slti_native66_ty
                  @x,@y=SLTI_Native66.to_rgss(mid,target[0],target[1])
                end
              end
              return true
            end
          R89_PREPARE
          raise 'Original initialization method not uniquely found' unless
            changed.scan(old_prepare).length==1
          changed=changed.sub(old_prepare,new_prepare)
          raise 'Original projection lost' unless
            changed.include?('px=12*(x+y)-784128') &&
            changed.include?('py=6*(y-x)+YOFFSET[mid]')
          File.binwrite('build/script134-r89.rb',changed)
          a[134][2]=Zlib::Deflate.deflate(changed)
          raise 'Unapproved RGSS changed' unless
            a.each_index.all?{|i|i==134 || a[i]==before[i]}
          File.binwrite(path,Marshal.dump(a))
          raise 'Patch not saved' unless
            Zlib::Inflate.inflate(Marshal.load(File.binread(path))[134][2])==changed
          puts 'PASS: offline 451-mask table, direct native_target method, no runtime alias'
          RB_PATCH
          ruby -c build/script134-r89.rb

          python3 - <<'PY_VERSION'
          from pathlib import Path
          import hashlib,re
          root=Path('site')
          engine=root/'knight/gameasync/Data/Scripts.rxdata'
          mapping=root/'knight/gameasync/mapping.js'
          code=mapping.read_text('utf-8')
          digest=hashlib.md5(engine.read_bytes()).hexdigest()
          code,count=re.subn(r'Data/Scripts\.rxdata\?h=[0-9a-f]{32}',
                             lambda m:'Data/Scripts.rxdata?h='+digest,code)
          assert count==1,('Wrong cache entry count',count)
          mapping.write_text(code,encoding='utf-8')
          for name in ('index.html','knight/index.html'):
            path=root/name
            text=path.read_text('utf-8')
            assert 'V229R84' in text and 'V229R89' not in text,name
            path.write_text(text.replace('V229R84','V229R89')
                                .replace('v229r84','v229r89'),encoding='utf-8')
          print('PASS: cache digest and R89 page version')
          PY_VERSION
          node --check site/knight/js/dpad.js
          node --check site/knight/gameasync/mapping.js

      - name: V229R89 Audit old corner links and one-step parity alignment
        shell: bash
        run: |
          set -euo pipefail
          cat > build/audit89.rb <<'RB_AUDIT'
          require 'zlib'
          a=Marshal.load(File.binread('site/knight/gameasync/Data/Scripts.rxdata'))
          src=Zlib::Inflate.inflate(a[134][2])
          first=src.index("module SLTI_Native66\n")
          last=src.index("\nclass Game_Character",first)
          patch=src.index("\nmodule SLTI_V229R89Corner\n",last)
          raise 'Source sections unavailable' unless first && last && patch
          Object.class_eval(src[first...last])
          Object.class_eval(src[patch..-1])
          nav=SLTI_Native66
          cut=SLTI_V229R89Corner
          raise 'Wrong corner masks' unless
            cut::MASKS.length==451 && cut::MASKS.values.count(12)==219 &&
            cut::MASKS.values.count(3)==232
          nonzero=0
          nav::HEIGHT.fetch(45).times do |dy|
            nav::WIDTH.fetch(45).times do |dx|
              nonzero+=1 if nav.value(45,nav::ORIGIN_X+dx,nav::ORIGIN_Y+dy)!=0
            end
          end
          raise 'Original S32 changed' unless nonzero==5957
          count=0
          cut::MASKS.each do |(x,y),mask|
            raise 'Cut changed tile value' unless nav.value(45,x,y)==0
            cut::DELTA.each do |dir,(dx,dy)|
              nx=x+dx;ny=y+dy
              allowed=(mask & cut::BIT.fetch(dir))!=0 && nav.value(45,nx,ny)!=0
              expected=allowed ? [nx,ny] : nil
              actual=nav.native_target(45,x,y,dir)
              raise "Wrong outgoing #{x}/#{y}/#{dir}" unless actual==expected
              if nav.value(45,nx,ny)!=0
                incoming=nav.native_target(45,nx,ny,cut::OPPOSITE.fetch(dir))
                raise "Wrong reverse #{x}/#{y}/#{dir}" unless
                  incoming==(allowed ? [x,y] : nil)
              end
              count+=1
            end
          end
          raise 'Missing direction audits' unless count==1804
          raise 'Rightmost upper approach missing' unless
            nav.native_target(45,32660,32806,2)==[32659,32807]
          raise 'Rightmost right approach missing' unless
            nav.native_target(45,32660,32808,4)==[32659,32807]
          raise 'Rightmost lower approach leaked' unless
            nav.native_target(45,32658,32808,8)==nil
          raise 'Left corner lower approach missing' unless
            nav.native_target(45,32656,32808,8)==[32657,32807]
          raise 'Left corner upper approach leaked' unless
            nav.native_target(45,32658,32806,2)==nil

          # Confirm the R87 reference and R88 bridge are preserved.
          raise 'Reference starting tile changed' unless
            nav.value(45,32656,32807)==3 && nav.value(45,32656,32808)==11
          raise 'Parity bridge not an original S32 edge' unless
            nav.edge?(45,32656,32807,0,1)
          raise 'Even-lattice yellow #85 cannot be entered' unless
            nav.native_target(45,32656,32808,8)==[32657,32807]
          raise 'Even-lattice yellow #85 cannot exit' unless
            nav.native_target(45,32657,32807,2)==[32656,32808]
          raise 'Reported screen-up bridge not repaired' unless
            nav.native_target(45,32656,32807,8)==[32657,32806]
          raise 'Reported bridge reverse step failed' unless
            nav.native_target(45,32657,32806,2)==[32656,32807]
          raise 'Opposite side of middle wall was opened' unless
            nav.native_target(45,32657,32806,6)==nil &&
            nav.native_target(45,32657,32806,8)==nil

          # Exercise native, RGSS and collision movement caller.
          class SLTI_R89AuditMap
            def map_id;45;end
            def valid?(x,y); x>=0 && y>=0 && x<288 && y<144;end
            def events;{};end
          end
          class Game_Character
            def slti_native66_prepare;true;end
            def increase_steps;end
          end
          beg=src.index("  def slti_native66_move(dir,turn=true)\n")
          fin=src.index("\n  alias slti_native66_original_down",beg)
          raise 'Cannot find original character movement path' unless beg && fin
          Game_Character.class_eval(src[beg...fin])
          $game_map=SLTI_R89AuditMap.new
          [
            [32656,32807,8,32657,32806],
            [32657,32806,2,32656,32807],
          ].each do |fx,fy,dir,tx,ty|
            obj=Game_Character.allocate
            obj.instance_variable_set(:@slti_native66_map,45)
            obj.instance_variable_set(:@slti_native66_x,fx)
            obj.instance_variable_set(:@slti_native66_y,fy)
            xx,yy=nav.to_rgss(45,fx,fy)
            obj.instance_variable_set(:@x,xx)
            obj.instance_variable_set(:@y,yy)
            obj.instance_variable_set(:@through,false)
            $game_player=obj
            raise 'Actual player move rejected' unless obj.slti_native66_move(dir)
            raise 'Actual player ended in wrong cell' unless
              obj.instance_variable_get(:@slti_native66_x)==tx &&
              obj.instance_variable_get(:@slti_native66_y)==ty
          end
          puts 'PASS reported R87 BLOCK_NATIVE path in real Game_Character move caller'

          raise 'Parity trial helper absent' unless defined?(SLTI_V229R89Parity)
          class SLTI_R89ParityActor
            attr_accessor :x,:y,:through,:character_name
            def initialize(x,y)
              @x=x;@y=y;@through=false;@character_name='MONSTER'
            end
          end
          $game_map=SLTI_R89AuditMap.new
          x,y=nav.to_rgss(45,32656,32807)
          $game_player=SLTI_R89ParityActor.new(x,y)
          even=SLTI_V229R89Parity.choose(45,32656,32807,$game_player)
          raise 'One-step player shift failed' unless even==[32656,32808]
          raise 'Even start moved unnecessarily' unless
            SLTI_V229R89Parity.choose(45,32656,32808,$game_player)==[32656,32808]

          # Execute actual initialization for a previously saved odd position.
          prep_start=src.index("  def slti_native66_prepare\n")
          prep_end=src.index("\n  def moveto(x,y)\n",prep_start)
          raise 'Player/monster prepare not found' unless prep_start && prep_end
          Game_Character.class_eval(src[prep_start...prep_end])
          class Game_Character
            def slti_native66_character?;true;end
            def through;@through;end
            def character_name;@character_name;end
            def x;@x;end
            def y;@y;end
          end
          actor=Game_Character.allocate
          actor.instance_variable_set(:@slti_native66_map,45)
          actor.instance_variable_set(:@slti_native66_x,32656)
          actor.instance_variable_set(:@slti_native66_y,32807)
          actor.instance_variable_set(:@x,x)
          actor.instance_variable_set(:@y,y)
          actor.instance_variable_set(:@through,false)
          $game_player=actor
          raise 'Loaded player prepare failed' unless actor.slti_native66_prepare
          raise 'Loaded player not shifted onto even S32' unless
            [actor.instance_variable_get(:@slti_native66_x),
             actor.instance_variable_get(:@slti_native66_y)]==[32656,32808]
          raise 'Loaded actor RGSS coordinate not synchronized' unless
            [actor.instance_variable_get(:@x),actor.instance_variable_get(:@y)]==
              nav.to_rgss(45,32656,32808)
          before=[actor.instance_variable_get(:@slti_native66_x),
                  actor.instance_variable_get(:@slti_native66_y)]
          raise 'Repeat prepare failed' unless actor.slti_native66_prepare
          raise 'Repeated player offset' unless
            before==[actor.instance_variable_get(:@slti_native66_x),
                     actor.instance_variable_get(:@slti_native66_y)]

          # Monster uses the same native preparation.
          mob=Game_Character.allocate
          mob.instance_variable_set(:@slti_native66_map,45)
          mob.instance_variable_set(:@slti_native66_x,32657)
          mob.instance_variable_set(:@slti_native66_y,32808)
          mx,my=nav.to_rgss(45,32657,32808)
          mob.instance_variable_set(:@x,mx)
          mob.instance_variable_set(:@y,my)
          mob.instance_variable_set(:@through,false)
          raise 'Monster prepare failed' unless mob.slti_native66_prepare
          raise 'Monster parity not even' unless
            ((mob.instance_variable_get(:@slti_native66_x)+
              mob.instance_variable_get(:@slti_native66_y))&1)==0
          raise 'Monster shifted more than one S32 edge' unless
            (mob.instance_variable_get(:@slti_native66_x)-32657).abs+
            (mob.instance_variable_get(:@slti_native66_y)-32808).abs==1
          puts 'PASS one-time loaded player and monster parity alignment'

          # Check every original walkable odd tile for a valid adjacent edge.
          odd=0;eligible=0
          nav::HEIGHT.fetch(45).times do |dy|
            nav::WIDTH.fetch(45).times do |dx|
              xx=nav::ORIGIN_X+dx;yy=nav::ORIGIN_Y+dy
              next if nav.value(45,xx,yy)==0 || ((xx+yy)&1)==0
              odd+=1
              valid=SLTI_V229R89Parity::OFFSETS.any? do |vx,vy|
                nav.edge?(45,xx,yy,vx,vy)
              end
              eligible+=1 if valid
            end
          end
          raise 'Unconnected original odd floor cells' unless
            odd==2974 && eligible==2974
          puts 'PASS trial: odd->even one original S32 step, 2974/2974 safe-edge candidates'

          # Unmodified green links and all floor-2 movements.
          [45,46].each do |mid|
            nav::HEIGHT.fetch(mid).times do |dy|
              nav::WIDTH.fetch(mid).times do |dx|
                x=nav::ORIGIN_X+dx;y=nav::ORIGIN_Y+dy
                next if nav.value(mid,x,y)==0
                cut::DELTA.each do |dir,(mx,my)|
                  next if mid==45 && cut::MASKS.key?([x+mx,y+my])
                  expected=nav.move_path?(mid,x,y,mx,my) ? [x+mx,y+my] : nil
                  observed=nav.native_target(mid,x,y,dir)
                  raise "Unapproved move changed: #{mid}/#{x}/#{y}/#{dir}" unless
                    observed==expected
                end
              end
            end
          end
          puts 'PASS 419 corners plus 32 bridges, 1804 direction checks and reverse links'
          puts 'PASS untouched green links, original S32 and unchanged 2F'
          RB_AUDIT
          ruby build/audit89.rb

          python3 - <<'PY_FILES'
          from pathlib import Path
          import json,hashlib
          root=Path('site')
          before=json.loads(Path('build/r84-hashes.json').read_text('utf-8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert len(after)==5517 and after.keys()==before.keys()
          changed={p for p in before if before[p]!=after[p]}
          allowed={'index.html','knight/index.html',
                   'knight/gameasync/mapping.js','knight/gameasync/Data/Scripts.rxdata'}
          assert changed==allowed,('Unexpected file modifications',changed^allowed)
          print('PASS 5517 files; modified only engine, cache and two version labels')
