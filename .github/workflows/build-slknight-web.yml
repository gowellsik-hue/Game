
name: V229R13 | Clean Native Skills and Remove Legacy Code

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-slknight-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Restore last intact V229R10 Pages artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          repository: gowellsik-hue/Game
          run-id: 39101719148
          name: github-pages
          github-token: ${{ github.token }}
          path: previous

      - name: Extract source or recover already repaired deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          if test -s previous/artifact.tar; then
            tar -xf previous/artifact.tar -C site
          else
            python3 - <<'PY_RECOVER'
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request,urlopen
          from concurrent.futures import ThreadPoolExecutor,as_completed
          import hashlib,json,re,time
          base='https://gowellsik-hue.github.io/Game/'
          root=Path('site')
          fixed=('index.html','COPYING-mkxp-web.txt','manifest.webmanifest','mkxp.js','mkxp.wasm','js/drive.js','js/dpad.js','js/localforage.min.js')
          def get(url):
              for retry in range(5):
                  try:
                      with urlopen(Request(url,headers={'User-Agent':'SLKnight-V229R13','Accept-Encoding':'identity'}),timeout=90) as res:return res.read()
                  except Exception:
                      if retry==4:raise
                      time.sleep(retry+1)
          files={'index.html':(base+'index.html',None)}
          for game in ('knight','elf'):
              for name in fixed:files[game+'/'+name]=(base+game+'/'+quote(name,safe='/'),None)
              name=game+'/gameasync/mapping.js'
              data=get(base+name+'?verify=v229r13')
              p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
              mapping=data.decode('utf-8').split('var mappingArray = ',1)[1].split('];',1)[0]+']'
              for _,asset in json.loads(re.sub(r',\s*\]$',']',mapping)):
                  rel,sep,md5=asset.partition('?h=')
                  if '.' not in Path(rel).name:continue
                  if rel.startswith('/') or '..' in Path(rel).parts:raise RuntimeError('Unsafe asset path')
                  path=game+'/gameasync/'+rel
                  if path in files:raise RuntimeError('Duplicate mapping entry')
                  files[path]=(base+game+'/gameasync/'+quote(rel,safe='/')+('?h='+md5 if sep else ''),md5 if sep else None)
          if len(files)!=5354:raise RuntimeError('Incorrect published file count: '+str(len(files)))
          def fetch(pair):
              name,(url,md5)=pair
              data=get(url)
              if md5 and Path(name).name not in ('mapping.js','bitmap-map.js') and hashlib.md5(data).hexdigest()!=md5:raise RuntimeError('Published asset hash mismatch '+name)
              p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          with ThreadPoolExecutor(max_workers=12) as pool:
              jobs=[pool.submit(fetch,pair) for pair in files.items() if not (root/pair[0]).is_file()]
              for job in as_completed(jobs):job.result()
          if {str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}!=set(files):raise RuntimeError('Incomplete asset restoration')
          print('RESTORED_5354_ASSETS')
          PY_RECOVER
          fi

      - name: Verify clean V229R10 or V229R13 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CHECK'
          from pathlib import Path
          import json,hashlib
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if len(before)!=5354:raise SystemExit('Expected 5354 assets, got '+str(len(before)))
          expected={"knight/js/dpad.js": ["cbebd992a1e83713cbd47dea54493a511f5a6d9f90a4fd58b23fd9d9540bd930", "a313791be0ef8eeb5edcf57088cf39b860662a318cdb11c2170c70f846688acb"], "knight/gameasync/Data/Scripts.rxdata": ["6fa8cde279565e48ee5babb28dc8b7e0d2c048986e8339bab30bd7c43987ff01", "ac9aa3508341546e8467454a87b728b232fea910734357e3df4711e9cc82a61c"], "knight/gameasync/mapping.js": ["1aa8038708c2587c157b5f08022565fda625cd969eb3c92ff1d1ca2c6e33f487", "a0c2f9bd83c81503bb77e058d8eb9e9089b4277c84aa5699de48974bd45cdd35"], "knight/index.html": ["fa593d4ba80551adbd673b35bf5be6d7fc03891828e69fecece8afa3a7e204ec", "00dfe6c49ef167ceee99316bf0525d4071bb75d5222497028f1c5c1578c19299"]}
          protected={
            'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata':'c1112940bc8ba843e0a7a108a09c09c00a8c952162c62b5f2119323353cb2959',
            'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap035.rxdata':'7aa9a3959547e86720a874d45ec2ec54247495f3de71c7e3ac033c340205b153'
          }
          for p,hash in protected.items():
              if before.get(p)!=hash:raise SystemExit('Protected gameplay data differs '+p)
          if all(before.get(p)==pair[0] for p,pair in expected.items()):version='R10'
          elif all(before.get(p)==pair[1] for p,pair in expected.items()):version='R13'
          else:raise SystemExit('Unverified game source; cannot clean safely')
          Path('/tmp/sl13_version').write_text(version)
          Path('/tmp/sl13_before').write_text(json.dumps(before))
          Path('/tmp/sl13_checks').write_text(json.dumps(expected))
          print('SOURCE_V229'+version,'ASSETS',len(before))
          PY_CHECK

      - name: Delete old skill scripts and connect original native shortcut keys
        shell: bash
        run: |
          set -euo pipefail
          if test "$(cat /tmp/sl13_version)" = R10; then
            ruby - site <<'RUBY_PATCH'
          require 'zlib'
          require 'digest'
          path=ARGV.fetch(0)+'/knight/gameasync/Data/Scripts.rxdata'
          scripts=Marshal.load(File.binread(path))
          raise 'Expected R10 baseline' unless scripts.size==137 && scripts[133][1]=='V229 Unified Speed Rules' && scripts[134][1]=='V230 Boss Respawn 60s 180s' && scripts[135][1]=='V229R10 Native Skill Fix' && scripts[136][1]=='Main'
          scene=Zlib::Inflate.inflate(scripts[78][2])

          def replace_once(text,a,b)
            raise "Wrong Scene_Map source: #{a.inspect} occurred #{text.scan(a).length} times" unless text.scan(a).size==1
            text.sub(a,b)
          end

          keys={49=>'F7',50=>'F8',51=>'F9',52=>'CTRL',53=>'ALT',54=>'SHIFT'}
          keys.each do |number,input|
            name=number<=52 ? 'getstate' : 'testkey'
            old="if Keyboard.#{name}(#{number})"
            scene=replace_once(scene,old,"if Keyboard.#{name}(#{number}) || Input.trigger?(Input::#{input})")
          end
          old='  if $game_switches[367] == true'
          gate='  if $game_switches[367] == true || '+keys.values.map{|key|"Input.press?(Input::#{key})"}.join(' || ')
          scene=replace_once(scene,old,gate)

          mirror=<<'MIRROR'
            def sl_native_skill_icons
              return if $game_party.nil? || $game_party.actors.empty?
              actor=$game_party.actors[0]
              data=[]
              for id in [7,8,9,1]
                skill=actor.skill_learn?(id) ? $data_skills[id] : nil
                if skill && !skill.icon_name.to_s.empty?
                  data << [id,skill.icon_name.to_s,skill.name.to_s,0,1]
                else
                  data << [0,'','',0,0]
                end
              end
              item=$data_items[177]
              if item && $game_party.item_number(177)>0
                data << [177,item.icon_name.to_s,item.name.to_s,0,1]
              else
                data << [0,'','',0,0]
              end
              data << [0,'','',0,0]
              signature=data.inspect
              return if signature==@sl_native_skill_icons_state
              @sl_native_skill_icons_state=signature
              data.each_with_index do |fields,index|
                puts('SLSKILL|STATE|'+(index+1).to_s+'|'+fields.map{|value|value.to_s.gsub('|','/')}.join('|'))
              end
            end
          MIRROR
          scene=replace_once(scene,"class Scene_Map\r\n","class Scene_Map\r\n\r\n"+mirror.gsub("\n","\r\n")+"\r\n")
          scene=replace_once(scene,"      Graphics.update\r\n", "      sl_native_skill_icons\r\n      Graphics.update\r\n")
          File.binwrite('/tmp/sl_r13_scene.rb',scene)
          raise 'Scene_Map Ruby syntax invalid' unless system('ruby','-c','/tmp/sl_r13_scene.rb',out:File::NULL)
          scripts[78][2]=Zlib::Deflate.deflate(scene)
          scripts.delete_at(135)
          raise 'Legacy module not removed' unless scripts.size==136 && scripts[134][1]=='V230 Boss Respawn 60s 180s' && scripts[135][1]=='Main'
          File.binwrite(path,Marshal.dump(scripts))
          puts "CLEAN_R13_SCRIPTS_SHA #{Digest::SHA256.file(path).hexdigest} scripts=#{scripts.size} deleted=V229R10_Native_Skill_Fix"
          RUBY_PATCH
            python3 - site <<'PY_PATCH'
          from pathlib import Path
          import hashlib,re,sys
          root=Path(sys.argv[1])/'knight';p=root/'js/dpad.js';s=p.read_text(encoding='utf-8')
          def one(a,b):
           global s
           assert s.count(a)==1,(repr(a[:90]),s.count(a))
           s=s.replace(a,b,1)
          one("let slScene='',slHotMode='hide',slSkillMode='hide';","let slScene='',slHotMode='hide';")
          one("  const visible=slScene==='Scene_Map'||slScene==='Scene_Skill';\n  const assign=slScene==='Scene_Skill';\n  bar.style.display=visible?'grid':'none';\n  bar.classList.toggle('assign',assign);bar.dataset.mode=assign?'assign':'use';","  const visible=slScene==='Scene_Map';\n  bar.style.display=visible?'grid':'none';")
          one("  i=t.indexOf('SLSKILL|MODE|');\n  if(i>=0){slSkillMode=t.slice(i).split('|')[2]||'hide';updateSkillbar();}\n",'')
          one("  for(const kind of ['ASSIGN','CAST','FAIL','REJECT']){\n    i=t.indexOf('SLSKILL|'+kind+'|');\n    if(i>=0){flashSkill(Number(t.slice(i).split('|')[2])-1,kind);break;}\n  }\n",'')
          a=s.index('function flashSkill(index,kind){');b=s.index('function skillButton(parent,index){',a)
          s=s[:a]+s[b:]
          one("#sl-skillbar.assign .sl-skill-slot{border-color:rgba(255,226,108,.85)}\n",'')
          one(".sl-skill-slot.okflash{box-shadow:0 0 12px rgba(145,255,174,.95);border-color:#91ffae}\n.sl-skill-slot.failflash{box-shadow:0 0 12px rgba(255,123,123,.95);border-color:#ff7b7b}\n",'')
          one('const slSkillKeys=[84,85,73,79,80,77];','const slSkillKeys=[118,119,120,17,18,16];')
          p.write_text(s,encoding='utf-8')
          rel='Data/Scripts.rxdata';mp=root/'gameasync/mapping.js';text=mp.read_text(encoding='utf-8');md5=hashlib.md5((root/'gameasync'/rel).read_bytes()).hexdigest();text,n=re.subn(re.escape(rel+'?h=')+r'[0-9a-f]{32}',lambda m:rel+'?h='+md5,text);assert n==1,n;mp.write_text(text,encoding='utf-8')
          idx=root/'index.html';html=idx.read_text(encoding='utf-8')
          for before,after in [('gameasync/mapping.js?v=v229r10','gameasync/mapping.js?v=v229r13'),('js/dpad.js?v=v229r10','js/dpad.js?v=v229r13')]:
           assert html.count(before)==1,before
           html=html.replace(before,after)
          idx.write_text(html,encoding='utf-8')
          for name in ('js/dpad.js','gameasync/Data/Scripts.rxdata','gameasync/mapping.js','index.html'):
           f=root/name;print('CLEAN_R13_SHA',name,hashlib.sha256(f.read_bytes()).hexdigest())
          PY_PATCH
          else
            echo V229R13_ALREADY_CLEAN
          fi

      - name: Check deleted code, native keys, icons, and preserved gameplay
        shell: bash
        run: |
          set -euo pipefail
          node --check site/knight/js/dpad.js
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before=json.loads(Path('/tmp/sl13_before').read_text())
          checks=json.loads(Path('/tmp/sl13_checks').read_text())
          now={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if len(now)!=5354 or now.keys()!=before.keys():raise SystemExit('Game asset inventory changed')
          for p,pair in checks.items():
              if now.get(p)!=pair[1]:raise SystemExit('Wrong clean R13 checksum '+p)
          changed={p for p in now if before[p]!=now[p]}
          if Path('/tmp/sl13_version').read_text()=='R10' and changed!=set(checks):raise SystemExit('Unexpected assets changed '+str(changed))
          if Path('/tmp/sl13_version').read_text()=='R13' and changed:raise SystemExit('R13 is not idempotent')
          knight=root/'knight'
          rel='Data/Scripts.rxdata'
          md5=hashlib.md5((knight/'gameasync'/rel).read_bytes()).hexdigest()
          mapping=(knight/'gameasync/mapping.js').read_text(encoding='utf-8')
          if mapping.count(rel+'?h='+md5)!=1:raise SystemExit('Script asset index invalid')
          index=(knight/'index.html').read_text(encoding='utf-8')
          for tag in ('gameasync/mapping.js?v=v229r13','js/dpad.js?v=v229r13'):
              if index.count(tag)!=1:raise SystemExit('Stale app cache '+tag)
          js=(knight/'js/dpad.js').read_text(encoding='utf-8')
          if 'slSkillKeys=[118,119,120,17,18,16]' not in js:raise SystemExit('Native hotkeys not connected')
          for obsolete in ('slNativePress','sl_native_digit','function flashSkill','SLSKILL|MODE|','slSkillMode','sl-skillbar.assign'):
              if obsolete in js:raise SystemExit('Unused skill JS not removed: '+obsolete)
          for name in ('리덕션 아머','스킬-솔리드 캐리지','카배','실드'):
              if 'Graphics/Icons/'+name+'.png?h=' not in mapping:raise SystemExit('Original skill icon asset absent '+name)
          print('PASS_R13_CHANGED_4_OF_5354_ASSETS',len(changed))
          PY_FINAL
          ruby - <<'RUBY_FINAL'
          require 'zlib'
          require 'stringio'
          module RPG;class CommonEvent;end;class EventCommand;end;class MoveRoute;end;class MoveCommand;end;class AudioFile;end;end
          scripts=Marshal.load(File.binread('site/knight/gameasync/Data/Scripts.rxdata'))
          raise 'Old skill module still present' unless scripts.size==136 && scripts[133][1]=='V229 Unified Speed Rules' && scripts[134][1]=='V230 Boss Respawn 60s 180s' && scripts[135][1]=='Main'
          source=scripts.map{|record|Zlib::Inflate.inflate(record[2])}
          if source.any?{|s|s.include?('SLTouchSkillbar') || s.include?('SLNativeDigits') || s.include?('sl_native_digit') || s.include?('File.binread')}
              raise 'Redundant runtime/file input code still installed'
          end
          raise 'Original keyboard shim changed' unless source[0].include?('class Win32API') && !source[0].include?('when 49 then Input::F7')
          scene=source[78]
          {49=>'F7',50=>'F8',51=>'F9',52=>'CTRL',53=>'ALT',54=>'SHIFT'}.each do |number,key|
              unless scene.include?('Keyboard.') && scene.include?('|| Input.trigger?(Input::'+key+')')
                  raise 'Native number shortcut not connected '+number.to_s
              end
          end
          raise 'Reduction Armor native event removed' unless scene.include?('$game_switches[1007] = true')
          raise 'Skill icon mirror missing' unless scene.include?('def sl_native_skill_icons') && scene.include?('SLSKILL|STATE|')
          File.binwrite('/tmp/sl_r13_scene_check.rb',scene)
          raise 'Scene_Map Ruby syntax invalid' unless system('ruby','-c','/tmp/sl_r13_scene_check.rb',out:File::NULL)
          eval(scene,TOPLEVEL_BINDING,'Scene_Map')
          $game_party=Object.new
          actor=Object.new
          actor.define_singleton_method(:skill_learn?){|id|id==7}
          $game_party.define_singleton_method(:actors){[actor]}
          $game_party.define_singleton_method(:item_number){|id|0}
          $data_skills=Array.new(100)
          $data_items=Array.new(200)
          $data_skills[7]=Struct.new(:icon_name,:name).new('armor_icon','Reduction Armor')
          capture=StringIO.new;original=$stdout;$stdout=capture
          Scene_Map.new.sl_native_skill_icons
          $stdout=original
          raise 'Skill icon state event not emitted' unless capture.string.include?('SLSKILL|STATE|1|7|armor_icon|Reduction Armor|0|1')
          common=Marshal.load(File.binread('site/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata'))
          boss=common[846]
          raise 'Original armor event missing' unless boss.instance_variable_get(:@trigger)==1 && boss.instance_variable_get(:@switch_id)==1007
          raise 'Original armor buff icon switch missing' unless boss.instance_variable_get(:@list).any?{|c|c.instance_variable_get(:@code)==121 && c.instance_variable_get(:@parameters)==[1006,1006,0]}
          puts 'PASS_DELETED_OLD_SKILL_MODULE_NATIVE_1_TO_6_ORIGINAL_ARMOR_EVENT846'
          RUBY_FINAL

      - name: Upload verified game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
