
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R35
# PURPOSE: TEMPORARILY open all documented dungeon stair/portal candidates.
# BASE: deployed V229R34 (run 39357815833), with no changes to movement,
# combat, rendering, map geometry, existing non-stair events or other maps.
# R35 TEST ONLY: floor 1 candidates -> floor 2, floor 2 internal candidates -> floor 1.
# Exterior exits (go_00 and floor-2 'in' to Map014) remain untouched.
# Replace previous R34 contact clones with one native parallel watcher per floor.
name: build-slknight-web.yml | V229R35 | Clean Native Events and 2x Terrain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R35 Restore successfully deployed R34 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39357815833
          name: github-pages
          github-token: ${{ github.token }}
          path: r34

      - name: V229R35 Verify untouched R34 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s r34/artifact.tar
          mkdir -p site build
          tar -xf r34/artifact.tar -C site
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json
          p=Path('site'); g=p/'knight/gameasync/Data'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          expected={
            'Scripts.rxdata':'f249b698ae6d1c72535ae2b12559e8bb10494657febc67ba0b23195944f4f7d0',
            pre+'Map045.rxdata':'363c6b0dac9556f0776c92a4f2c41bf958b045ee517abf2d347fd13800bdacdc',
            pre+'Map046.rxdata':'4835084c9a922b9b212bd925c7e7ca8454d9c59d53a58f2b3b18581d08d3059f',
          }
          for f,digest in expected.items():
            assert hashlib.sha256((g/f).read_bytes()).hexdigest()==digest,f
          files={str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest()
                 for f in p.rglob('*') if f.is_file()}
          assert len(files)==5472,len(files)
          assert 'V229R34' in (p/'index.html').read_text(encoding='utf-8')
          assert 'V229R34' in (p/'knight/index.html').read_text(encoding='utf-8')
          Path('build/r34-hashes.json').write_text(json.dumps(files,sort_keys=True))
          print('PASS exact deployed R34 baseline; no R21-R33 rebuild')
          PY_BASE

      - name: V229R35 Install two native parallel stair TEST watchers
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r35_watch.rb <<'RUBY_WATCH'
          require 'json'
          require 'digest'
          module RPG
            class Map;end;class MapInfo;end;class AudioFile;end;class Tileset;end
            class Event
              class Page
                class Condition;end;class Graphic;end
              end
            end
            class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          class Table
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(depth=0);@raw;end
            def [](x,y=0,z=0)
              _,w,h,l,_=@raw.unpack('V5')
              return nil if x<0||y<0||z<0||x>=w||y>=h||z>=l
              @raw.byteslice(20+2*(x+y*w+z*w*h),2).unpack1('v')
            end
          end
          class Tone
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(depth=0);@raw;end
          end
          class Color<Tone;end
          def field(obj,name);obj.instance_variable_get('@'+name);end
          def replace(obj,name,value);obj.instance_variable_set('@'+name,value);end
          base='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          path=->(id){base+('%sMap%03d.rxdata'%[pre,id])}
          sets=Marshal.load(File.binread(base+pre+'Tilesets.rxdata'))
          original_script=Digest::SHA256.file(base+'Scripts.rxdata').hexdigest
          # World coordinates are from the Sanctuary V4.1 source portal records.
          # These are TEMPORARY cross-floor destinations, not original portal rules.
          portals={
            45=>[
              ['to2',32737,32877],['inP01a',32745,32810],
              ['inP01b',32713,32851],['inP02a',32709,32839],
              ['inP02b',32742,32852]
            ],
            46=>[
              ['to1',32665,32788],
              ['bp01_in',32672,32789],['bp02_in',32672,32794],
              ['bp03_in',32672,32802],['bp02_out',32698,32861],
              ['inP04a',32758,32802],['inP04b',32764,32802],
              ['bp03_out',32745,32881],['inP03b',32789,32821],
              ['bp01_out',32781,32799],['inP03a_reachable',32808,32838]
            ]
          }
          # Keep outward exits unmodified; place arrivals OUTSIDE every test zone.
          destination={45=>[46,76,94],46=>[45,96,74]}
          entry={45=>[96,74],46=>[76,94]}
          report={}
          portals.each do |mid,records|
            m=Marshal.load(File.binread(path.call(mid)))
            w=field(m,'width');h=field(m,'height')
            raise 'R34 geometry changed' unless [w,h]==(mid==45 ? [288,144] : [336,168])
            ts=sets.fetch(field(m,'tileset_id'))
            flags=field(ts,'passages');data=field(m,'data')
            walk=lambda{|x,y|x>=0 && y>=0 && x<w && y<h && (flags[data[x,y,0]]&15)==0}
            raise 'Blocked test landing' unless walk.call(*entry.fetch(mid))
            # R21 atlas projection, multiplied by 2 in R32/R34.
            b=mid==45 ? 762 : 1146
            centers=[];zone=[];details=[]
            records.each do |name,wx,wy|
              cx=2.0*(-783360+12*(wx+wy)-768)/32.0
              cy=2.0*(b+6*(wy-wx)-384)/32.0
              candidates=[]
              ((cy-3).floor..(cy+3).ceil).each do |y|
                ((cx-3).floor..(cx+3).ceil).each do |x|
                  next unless walk.call(x,y)
                  next unless (x-cx)**2+(y-cy)**2 <= 9.0
                  candidates<<[x,y]
                end
              end
              raise "No walkable test stair #{mid}/#{name}" if candidates.empty?
              centers<<[cx.round(5),cy.round(5)]
              zone.concat(candidates)
              details<<{'name'=>name,'world'=>[wx,wy],
                        'projected'=>[cx,cy],'walkable_cells'=>candidates.size}
            end
            zone.uniq!
            raise 'Arrival inside test portal' if zone.include?(entry.fetch(mid))
            # All monitored regions must be in the component of the playable arrival.
            start=entry.fetch(mid);todo=[start];seen={start=>true};k=0
            while k<todo.size
              x,y=todo[k];k+=1
              [[x+1,y],[x-1,y],[x,y+1],[x,y-1]].each do |nx,ny|
                point=[nx,ny]
                next unless walk.call(nx,ny) && !seen[point]
                seen[point]=true;todo<<point
              end
            end
            raise 'Unreachable test portal' unless zone.all?{|pt|seen[pt]}
            events=field(m,'events')
            expected=mid==45 ? [36,22,14,1] : [29,17,12,2]
            before,clones,wanted,eid=expected
            raise 'R34 event count changed' unless events.size==before
            synthetic=events.keys.select{|id|id>=901 &&
              field(events[id],'name').to_s.start_with?("SLTI_FloorTransfer_#{mid}_")}
            raise 'Unexpected old R34 contacts' unless synthetic.size==clones
            synthetic.each{|id|events.delete(id)}
            raise 'Original events missing' unless events.size==wanted
            raw=events.fetch(eid)
            raise 'Wrong original portal slot' unless field(raw,'pages').size==1
            page=field(raw,'pages').first
            condition=field(page,'condition')
            %w[switch1_valid switch2_valid variable_valid self_switch_valid].each do |key|
              replace(condition,key,false)
            end
            replace(page,'trigger',4)
            replace(page,'through',true)
            replace(page,'always_on_top',false)
            replace(page,'move_type',0)
            graphic=field(page,'graphic')
            replace(graphic,'character_name','')
            replace(graphic,'tile_id',0)
            target,tx,ty=destination.fetch(mid)
            center_literals=centers.map{|x,y|"[#{x},#{y}]"}.join(',')
            script=<<-WATCH
            if $game_map && $game_map.map_id == #{mid} && $game_player && $game_temp &&
               !$game_temp.player_transferring && !$game_temp.in_battle &&
               !$game_temp.message_window_showing && !$game_temp.transition_processing
              px=$game_player.x
              py=$game_player.y
              locations=[#{center_literals}]
              if locations.any?{|pt|(px-pt[0])**2+(py-pt[1])**2<=9.0}
                $game_temp.player_new_map_id=#{target}
                $game_temp.player_new_x=#{tx}
                $game_temp.player_new_y=#{ty}
                $game_temp.player_new_direction=2
                $game_temp.player_transferring=true
              end
            end
            WATCH
            commands=field(page,'list')
            raise 'Bad event command list' unless commands.size>=2
            first=Marshal.load(Marshal.dump(commands.first))
            replace(first,'code',355);replace(first,'indent',0)
            replace(first,'parameters',[script])
            last=Marshal.load(Marshal.dump(commands.last))
            replace(last,'code',0);replace(last,'indent',0)
            replace(last,'parameters',[])
            replace(page,'list',[first,last])
            replace(raw,'name',"SLTI_V229R35_TEST_#{mid}")
            File.binwrite(path.call(mid),Marshal.dump(m))
            report[mid.to_s]={
              'map'=>mid,'event_id'=>eid,'other_events_preserved'=>wanted-1,
              'removed_r34_clones'=>clones,'parallel_trigger'=>4,
              'destination'=>destination.fetch(mid),'arrival'=>entry.fetch(mid),
              'radius_tiles'=>3.0,'portals'=>details,'centers'=>centers,
              'zone_size'=>zone.size,'reachable_component'=>seen.size,
              'script'=>script
            }
            puts "PASS Map#{mid}: #{records.size} source candidates, #{zone.size} walkable test cells, native parallel event"
          end
          raise 'Engine script modified' unless
            Digest::SHA256.file(base+'Scripts.rxdata').hexdigest==original_script
          File.write('build/r35-test-portals.json',JSON.pretty_generate(report))
          RUBY_WATCH
          ruby -c /tmp/r35_watch.rb
          ruby /tmp/r35_watch.rb

      - name: V229R35 Update only map hashes and visible version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_INDEX'
          from pathlib import Path
          import hashlib,re
          p=Path('site');g=p/'knight/gameasync'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          mapping=g/'mapping.js';source=mapping.read_text(encoding='utf-8')
          for mid in (45,46):
            name=f'Data/{pre}Map{mid:03}.rxdata'
            digest=hashlib.md5((g/name).read_bytes()).hexdigest()
            source,n=re.subn(re.escape(name+'?h=')+r'[0-9a-f]{32}',
                             lambda m:name+'?h='+digest,source)
            assert n==1,(name,n)
          mapping.write_text(source,encoding='utf-8')
          for name in ('index.html','knight/index.html'):
            file=p/name;content=file.read_text(encoding='utf-8')
            assert 'V229R34' in content
            file.write_text(content.replace('V229R34','V229R35').replace('v229r34','v229r35'),encoding='utf-8')
          print('PASS existing game URL, R34 loader and renderer retained')
          PY_INDEX
          node --check site/knight/gameasync/mapping.js

      - name: V229R35 Verify actual parallel script transfer and integrity
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r35_verify.rb <<'RUBY_VERIFY'
          require 'json';require 'zlib'
          module RPG
            class Map;end;class MapInfo;end;class AudioFile;end;class Tileset;end
            class Event;class Page;class Condition;end;class Graphic;end;end;end
            class EventCommand
              attr_reader :code,:parameters
            end
            class MoveRoute;end;class MoveCommand;end
          end
          class Table
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(d=0);@raw;end
          end
          class Tone
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(d=0);@raw;end
          end
          class Color<Tone;end
          def val(o,n);o.instance_variable_get('@'+n);end
          b='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          scripts=Marshal.load(File.binread(b+'Scripts.rxdata'))
          eval(Zlib::Inflate.inflate(scripts[75][2]),TOPLEVEL_BINDING,'Native_Interpreter_355')
          GameMap=Struct.new(:map_id)
          Player=Struct.new(:x,:y)
          Temp=Struct.new(:player_transferring,:in_battle,:message_window_showing,
             :transition_processing,:player_new_map_id,:player_new_x,:player_new_y,
             :player_new_direction)
          data=JSON.parse(File.read('build/r35-test-portals.json'))
          data.each do |key,r|
            mid=key.to_i
            map=Marshal.load(File.binread(b+('%sMap%03d.rxdata'%[pre,mid])))
            events=val(map,'events')
            raise 'Wrong original event count' unless events.size==(mid==45 ? 14 : 12)
            e=events.fetch(r.fetch('event_id'))
            page=val(e,'pages').first
            raise 'Watcher not parallel' unless val(page,'trigger')==4 && val(page,'through')
            c=val(page,'condition')
            raise 'Unexpected page condition' unless
              %w[switch1_valid switch2_valid variable_valid self_switch_valid].all?{|n|val(c,n)==false}
            list=val(page,'list')
            raise 'Unexpected event commands' unless list.map{|item|val(item,'code')}==[355,0]
            script=val(list.first,'parameters')[0]
            raise 'Audit script differs' unless script==r.fetch('script')
            $game_map=GameMap.new(mid)
            dest=r.fetch('destination')
            r.fetch('portals').each do |portal|
              cx,cy=portal.fetch('projected')
              sx=cx.round;sy=cy.round
              $game_player=Player.new(sx,sy)
              $game_temp=Temp.new(false,false,false,false,nil,nil,nil,nil)
              runner=Interpreter.allocate
              runner.instance_variable_set(:@list,list)
              runner.instance_variable_set(:@index,0)
              raise 'Interpreter command failed' unless runner.command_355
              unless $game_temp.player_transferring &&
                [$game_temp.player_new_map_id,$game_temp.player_new_x,$game_temp.player_new_y]==dest
                raise "Portal not transferred #{mid}/#{portal['name']}"
              end
            end
            $game_player=Player.new(*r.fetch('arrival'))
            $game_temp=Temp.new(false,false,false,false,nil,nil,nil,nil)
            runner=Interpreter.allocate
            runner.instance_variable_set(:@list,list)
            runner.instance_variable_set(:@index,0)
            runner.command_355
            raise 'Arrival causes immediate bounce' if $game_temp.player_transferring
            puts "PASS Map#{mid}: #{r.fetch('portals').size} test portals transfer; safe landing"
          end
          RUBY_VERIFY
          ruby -c /tmp/r35_verify.rb
          ruby /tmp/r35_verify.rb | tee build/r35-native-verify.txt
          python3 - <<'PY_FILES'
          import hashlib,json
          from pathlib import Path
          p=Path('site')
          before=json.loads(Path('build/r34-hashes.json').read_text())
          after={str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest()
                 for f in p.rglob('*') if f.is_file()}
          assert len(after)==5472 and before.keys()==after.keys()
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          changed={name for name in before if before[name]!=after[name]}
          expected={f'knight/gameasync/Data/{pre}Map{n:03}.rxdata' for n in (45,46)}
          expected|={'knight/gameasync/mapping.js','knight/index.html','index.html'}
          assert changed==expected,('Unexpected changes',changed^expected)
          assert 'V229R35' in (p/'knight/index.html').read_text(encoding='utf-8')
          print('PASS original R34 game preserved except 2 native floor maps, mapping, 2 version labels')
          PY_FILES

      - name: V229R35 Verify full native Game_Event parallel update path
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r35_native_runtime.rb <<'RUBY_RUNTIME'
          require 'zlib'
          require 'ostruct'
          module RPG
            class Map;end;class MapInfo;end;class AudioFile;end;class Tileset;end
            class Event
              def method_missing(name,*args)
                return instance_variable_get('@'+name.to_s) if args.empty? && instance_variable_defined?('@'+name.to_s)
                super
              end
              class Page
                def method_missing(name,*args)
                  return instance_variable_get('@'+name.to_s) if args.empty? && instance_variable_defined?('@'+name.to_s)
                  super
                end
                class Condition
                  def method_missing(name,*args)
                    return instance_variable_get('@'+name.to_s) if args.empty? && instance_variable_defined?('@'+name.to_s)
                    super
                  end
                end
                class Graphic
                  def method_missing(name,*args)
                    return instance_variable_get('@'+name.to_s) if args.empty? && instance_variable_defined?('@'+name.to_s)
                    super
                  end
                end
              end
            end
            class EventCommand
              attr_reader :code,:parameters,:indent
            end
            class MoveRoute;end;class MoveCommand;end
          end
          class Table
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(d=0);@raw;end
          end
          class Tone
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(d=0);@raw;end
          end
          class Color<Tone;end
          class Game_Character
            attr_reader :x,:y
            def initialize
              @x=0;@y=0;@character_name='';@through=true;@original_direction=2;@original_pattern=0
            end
            def moveto(x,y);@x=x;@y=y;end
            def update;end
            def jumping?;false;end
          end
          root='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          scripts=Marshal.load(File.binread(root+'Scripts.rxdata'))
          [69,70,75,26].each{|i|eval(Zlib::Inflate.inflate(scripts[i][2]),TOPLEVEL_BINDING,"Script#{i}")}
          $game_switches=Hash.new(false)
          $game_variables=Hash.new(0)
          $game_self_switches={}
          $game_player=OpenStruct.new(x:96,y:74)
          $game_temp=OpenStruct.new(player_transferring:false,in_battle:false,message_window_showing:false,transition_processing:false,forcing_battler:nil,battle_calling:false,shop_calling:false,name_calling:false,menu_calling:false,save_calling:false,gameover:false)
          [45,46].each do |mid|
           map=Marshal.load(File.binread(root+('%sMap%03d.rxdata'%[pre,mid])))
           event=map.instance_variable_get(:@events).fetch(mid==45 ? 1 : 2)
           $game_map=OpenStruct.new(map_id:mid)
           $game_player.x=mid==45 ? 202 : 82
           $game_player.y=mid==45 ? 75 : 94
           $game_temp.player_transferring=false
           obj=Game_Event.new(mid,event)
           puts "#{mid} init: trigger=#{obj.trigger}, running=#{obj.instance_variable_get(:@interpreter).running?}"
           obj.update
           raise 'No parallel transfer' unless $game_temp.player_transferring
           raise 'Wrong floor' unless $game_temp.player_new_map_id==(mid==45 ? 46 : 45)
           puts "PASS Map#{mid}: actual Game_Event.update -> Interpreter.update -> command_355 schedules transfer"
          end
          RUBY_RUNTIME
          ruby /tmp/r35_native_runtime.rb | tee build/r35-runtime-event-verify.txt

      - name: V229R35 Upload temporary stair-test audit
        uses: actions/upload-artifact@v4
        with:
          name: SLKnight-V229R35-All-Stair-TEST-Audit
          path: |
            build/r35-test-portals.json
            build/r35-native-verify.txt
            build/r35-runtime-event-verify.txt
          if-no-files-found: error
          retention-days: 30

      - name: V229R35 Publish unchanged game to EXISTING GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
