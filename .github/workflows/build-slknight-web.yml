          raise 'Map048 event/transit unexpectedly created' unless saved.instance_variable_get(:@events).empty?
          raise 'Map048 terrain mismatched' unless saved.instance_variable_get(:@data).instance_variable_get(:@raw).byteslice(20,768*384*2)==walk_bytes
          verified=Marshal.load(File.binread(mapinfos_name))
          raise 'MapInfos has lost entries' unless verified.size==old_info.size+1 && verified.keys.sort==(old_info.keys+[48]).sort
          old_info.each{|id, bytes| raise 'Existing MapInfo modified' unless Marshal.dump(verified[id])==bytes}
          raise 'Wrong Map048 info' unless verified[48].instance_variable_get(:@name)=='글루디오·우드벡·은기사'
          puts 'PASS native Map048 created from the original map class, events empty, MapInfos preserved'
          puts 'PASS original Map047 byte-for-byte preserved; no transfer event added'
          V22_MAP48_MAP_EOF
          ruby -c build/v22/apply_map048_map.rb
