      - name: V244 Refresh mapping and version
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re

          root=Path("site")
          mapping=root/"knight/gameasync/mapping.js"
          text=mapping.read_text("utf-8")

          anchor="];\n\nvar mapping = {}"
          assert text.count(anchor)==1, "Mapping anchor missing"

          entries=[]
          for motion in ("Walk","Attack","Hit","Death","Magic"):
              name="SLZenith"+motion
              path=root/(
                  "knight/gameasync/Graphics/Characters/"
                  +name+".png"
              )
              digest=hashlib.md5(path.read_bytes()).hexdigest()
              entries.append(
                  '["graphics/characters/'+name.lower()+
                  '", "Graphics/Characters/'+name+
                  '.png?h='+digest+'"],'
              )

          text=text.replace(
              anchor,"\n"+"\n".join(entries)+"\n"+anchor
          )

          pre="MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"
          files=[
              (
                  "Data/"+pre+"Map025.rxdata",
                  root/"knight/gameasync/Data"/
                  (pre+"Map025.rxdata")
              ),
              (
                  "Data/Scripts.rxdata",
                  root/"knight/gameasync/Data/Scripts.rxdata"
              )
          ]

          for key,path in files:
              digest=hashlib.md5(path.read_bytes()).hexdigest()
              pattern="("+re.escape(key)+r"\?h=)[0-9a-f]{32}"
              text,count=re.subn(
                  pattern,
                  lambda m:m.group(1)+digest,
                  text
              )
              assert count==1, "Hash mapping not unique: "+key

          mapping.write_text(text,"utf-8")

          loader=root/"knight/js/sl-assets-v229r115.js"
          script=loader.read_text("utf-8")
          old="var version='V241';"
          assert script.count(old)==1
          loader.write_text(
              script.replace(old,"var version='V244';"),
              "utf-8"
          )

          for relative in ("index.html","knight/index.html"):
              path=root/relative
              html=path.read_text("utf-8")
              assert "V241" in html
              html=html.replace("V241","V244")
              html=html.replace("?v=v241","?v=v244")
              path.write_text(html,"utf-8")

          print("PASS graphics, script, map hashes and V244 labels")
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: V244 Verify unrelated files remain identical
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json

          root=Path("site")
          before=json.loads(
              Path("build/before.json").read_text("utf-8")
          )
          after={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob("*") if p.is_file()
          }

          pre=(
              "knight/gameasync/Data/"
              "MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"
          )

          allowed={
              pre+"Map025.rxdata",
              "knight/gameasync/Data/Scripts.rxdata",
              "knight/gameasync/mapping.js",
              "knight/js/sl-assets-v229r115.js",
              "index.html",
              "knight/index.html"
          }

          expected_new={
              "knight/gameasync/Graphics/Characters/"
              "SLZenith"+motion+".png"
              for motion in (
                  "Walk","Attack","Hit","Death","Magic"
              )
          }

          changed={
              name for name in before
              if before[name]!=after.get(name)
          }
          added=set(after)-set(before)
          removed=set(before)-set(after)

          assert changed==allowed, (
              "Unexpected changes",sorted(changed^allowed)
          )
          assert added==expected_new, (
              "Unexpected added files",sorted(added^expected_new)
          )
          assert not removed, (
              "Deleted original files",sorted(removed)
          )
          assert len(after)==5608

          for mid in (45,46):
              assert pre+f"Map{mid:03d}.rxdata" not in after

          protected="knight/assets/map-047-v241.pack"
          assert after[protected]==before[protected]

          print("PASS original maps and NPCs preserved")
          print("PASS Map047 pack and engine preserved")
          print("PASS exactly five new graphics resources")
          print("PASS isolated Map025 boss event")
          PY

