# SLKnight V1.16 candidate: last-successful V1.15 website game baseline.
# Only healer actor/stats/regen/bars/MP references and obstructing top-left version tag.
# No rebuilt engine, no hotbar redesign, no monster or speed changes.
name: build-slknight-web.yml | V1.16 candidate | Healer Wizard Native HP MP

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Restore last successful V1.15 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 42724414704
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify V1.15 baseline and record unchanged game files
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY_V116_BEFORE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(before)==5623,len(before)
          needed=['knight/gameasync/Data/Scripts.rxdata','knight/gameasync/mapping.js','knight/index.html','index.html','knight/js/sl-assets-v229r115.js']
          assert all(p in before for p in needed)
          assert "var version='V1.15';" in (root/'knight/js/sl-assets-v229r115.js').read_text('utf8')
          (Path('build')/'v115_sha256.json').write_text(json.dumps(before),encoding='utf8')
          print('PASS last successful V1.15 website: 5623 files')
          PY_V116_BEFORE

      - name: Patch native wizard actor, existing events and existing HUD
        shell: bash
        run: |
          set -euo pipefail
          cat > build/patch_v116.rb <<'RUBY_V116'
          # encoding: utf-8
          require 'zlib'
          require 'digest'
          require 'json'
          require 'pathname'
          SITE=File.expand_path(ARGV.fetch(0))
          DATA=File.join(SITE,'knight/gameasync/Data')
          PRE='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          class Module
            def const_missing(name); const_set(name,Class.new); end
          end
          class Table
            def self._load(x);o=allocate;o.instance_variable_set(:@raw,x);o;end
            def _dump(depth);@raw;end
          end
          class Color
            def self._load(x);o=allocate;o.instance_variable_set(:@raw,x);o;end
            def _dump(depth);@raw;end
          end
          class Tone
            def self._load(x);o=allocate;o.instance_variable_set(:@raw,x);o;end
            def _dump(depth);@raw;end
          end
          module RPG
            class Map;end
            class AudioFile;end
            class Actor;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
            class CommonEvent;end
            class Item;end
            class Weapon;end
            class Armor;end
          end

          def check(cond,label);raise "V1.16 original mismatch: #{label}" unless cond;end
          def iv(o,k);o.instance_variable_get(k);end
          def setiv(o,k,v);o.instance_variable_set(k,v);end
          def code(c);iv(c,:@code);end
          def param(c);iv(c,:@parameters);end
          def command(code,p,indent)
            c=RPG::EventCommand.allocate
            setiv(c,:@code,code);setiv(c,:@indent,indent);setiv(c,:@parameters,p)
            c
          end
          def replace_one_script(src,old,new,label)
            check(src.scan(old).size==1,"#{label} expected exact one occurrence; got #{src.scan(old).size}")
            src.sub(old,new)
          end
          def rewrite_script(scripts,name)
            entry=scripts.find{|a|a.is_a?(Array)&&a[1].to_s==name.b}
            check(!entry.nil?,"script #{name} missing")
            original=Zlib::Inflate.inflate(entry[2]).force_encoding('UTF-8')
            edited=yield(original)
            check(edited!=original,"script #{name} unchanged")
            RubyVM::InstructionSequence.compile(edited)
            entry[2]=Zlib::Deflate.deflate(edited.b)
            puts "SCRIPT #{name} syntax PASS; delta #{edited.bytesize-original.bytesize}"
          end

          # Wizard actor #3: preserve the original wizard MP curve (currently misplaced in DEX)
          # and use the native actor parameter table, exactly as the player does.
          actor_file=File.join(DATA,PRE+'Actors.rxdata')
          actors=Marshal.load(File.binread(actor_file))
          a=actors.fetch(3)
          check(iv(a,:@name).to_s=='힐러 마법사'.b,'actor #3 name')
          check(iv(a,:@class_id)==3,'actor #3 wizard class')
          raw=iv(iv(a,:@parameters),:@raw)
          dims,cols,rows,depth=raw.byteslice(0,16).unpack('V*')
          check([dims,cols,rows,depth]==[2,6,100,1],"actor table geometry #{[dims,cols,rows,depth]}")
          vals=raw.byteslice(16..-1).unpack('s<*')
          check(vals.size==cols*rows+2,'actor table length with retained RGSS trailer')
          check(vals[50*6+3]==604 && vals[50*6+0]==1 && vals[50*6+1]==1,'actor level50 original HP1 SP1 DEX604')
          check((2..99).all?{|lv| vals[lv*6]==1&&vals[lv*6+1]==1&&vals[lv*6+2]==1&&vals[lv*6+4]==1&&vals[lv*6+5]==1},'actor old columns match')
          for lv in 1..99
            wizard_mp=vals[lv*6+3]
            check(wizard_mp>0 && wizard_mp<4000,"MP curve level #{lv}")
            vals[lv*6+0]=12+(lv-1)*10+(lv-1)/2  # L1J CON16 wizard HP up: alternating +10,+11
            vals[lv*6+1]=wizard_mp              # existing original MP curve, no arbitrary downgrade
            vals[lv*6+2]=8                      # STR
            vals[lv*6+3]=7                      # DEX
            vals[lv*6+4]=16                     # CON through existing RGSS AGI slot
            vals[lv*6+5]=18                     # INT
          end
          setiv(iv(a,:@parameters),:@raw,raw.byteslice(0,16)+vals.pack('s<*'))
          setiv(a,:@sl_wis,18) # Wizard's separately tracked WIS; no CHA addition.
          File.binwrite(actor_file,Marshal.dump(actors))
          check(vals[50*6,6]==[526,604,8,7,16,18],"wizard lvl50 recalculated #{vals[50*6,6]}")
          puts "ACTOR3 Lv50 HP #{vals[50*6]} MP #{vals[50*6+1]} STR8 DEX7 CON16 INT18 WIS18"

          # Existing healer MP regeneration CE9 keeps all native equipment bonuses.
          ce_file=File.join(DATA,PRE+'CommonEvents.rxdata')
          ces=Marshal.load(File.binread(ce_file))
          ce9=iv(ces.fetch(9),:@list)
          check(iv(ces[9],:@name).to_s=='힐러 엠틱'.b,'CE9 original identity')
          check(code(ce9[0])==106&&param(ce9[0])==[300],'CE9 wait frame')
          setiv(ce9[0],:@parameters,[Graphics_frame=800]) # 50 FPS (original Main) * 16s
          check(code(ce9[1])==111&&param(ce9[1])==[1,459,1,278,4],'CE9 max condition')
          setiv(ce9[1],:@parameters,[12,'$game_actors[3].sp < $game_actors[3].maxsp'])
          check(code(ce9[3])==122 && param(ce9[3])==[554,554,0,0,11],'CE9 original blue potion MPR')
          check(code(ce9[6])==122 && param(ce9[6])==[554,554,0,0,3],'CE9 original base MPR')
          setiv(ce9[3],:@parameters,[554,554,0,0,14]) # L1J WIS18: base3+original3+blue8
          setiv(ce9[6],:@parameters,[554,554,0,0,6])  # L1J WIS18: base3+original3
          check(code(ce9[221])==122&&param(ce9[221])==[459,459,1,1,554],'CE9 old MP regeneration operation')
          setiv(ce9[221],:@code,312)
          setiv(ce9[221],:@parameters,[3,0,1,554]) # Existing native actor.SP += var554, capped by maxsp
          check([111,122,0,412].zip(ce9[222,4].map{|c|code(c)}).all?{|x,y|x==y},'CE9 stale clamp instruction shape')
          check(param(ce9[222])==[1,459,1,278,3]&&param(ce9[223])==[459,459,0,1,278],'CE9 stale MP clamp match')
          ce9.slice!(222,4) # actor SP setter already clamps; preserve outer CE9 branch closure.
          # Existing player regen CE51, same parallel common event: share its tick, not its knight recovery.
          ce51=iv(ces.fetch(51),:@list)
          check(iv(ces[51],:@name).to_s.include?('피틱'.b),'CE51 player regen event')
          check(code(ce51[0])==122&&param(ce51[0])[0]==774,'CE51 original first command')
          healer_hpr=%q{if $game_switches[185]
            a=$game_actors[3]
            t=Graphics.frame_count
            last=a.instance_variable_get(:@sl_healer_hpr_frame)
            if a.hp>0 && (last.nil? || t<last || t-last>=Graphics.frame_rate*3)
              a.hp+=1+rand([[a.agi-12,1].max,14].min)
              a.instance_variable_set(:@sl_healer_hpr_frame,t)
            end
          end}
          RubyVM::InstructionSequence.compile(healer_hpr)
          ce51.insert(2,command(355,[healer_hpr],0))
          changed_ce={9=>1,51=>1}
          # All existing healer-use CEs must operate on the one actor-SP value.
          [62,569,603,604,605,801].each do |ce_id|
            list=iv(ces.fetch(ce_id),:@list)
            hits=0
            list.each do |c|
              p=param(c)
              if code(c)==111 && p.is_a?(Array) && p.size==5&&p[0,3]==[1,459,0]&&p[4]==1
                setiv(c,:@parameters,[12,"$game_actors[3].sp >= #{p[3]}"])
                hits+=1
              elsif code(c)==122 && p.is_a?(Array) && p[0,4]==[459,459,2,0]
                setiv(c,:@code,312)
                setiv(c,:@parameters,[3,1,0,p[4]])
                hits+=1
              end
            end
            check(hits>=2 && hits.even?,"CE#{ce_id} original MP actions #{hits}")
            changed_ce[ce_id]=hits
          end
          File.binwrite(ce_file,Marshal.dump(ces))
          puts "CE9 normal +6, blue +14 every16s, existing gear MPR kept; CE51 mage HP every3s; #{changed_ce.inspect}"

          # Original Map018 healer recruitment: use native actor level and item MP bonus,
          # and native full-recovery command. No new healer stats or AI system.
          count_map=0
          changed_map_files=[]
          healer_pages=0
          for map_file in Dir[File.join(DATA,PRE+'Map[0-9][0-9][0-9].rxdata')]
            map=Marshal.load(File.binread(map_file))
            events=iv(map,:@events)
            mid=map_file[/Map(\d{3})\.rxdata$/,1].to_i
            updated=false
            if mid==18
              event=events.fetch(6)
              pages=iv(event,:@pages)
              pg=pages[0]
              list=iv(pg,:@list)
              check(param(list[11])==[3,1,0,98] && param(list[12])==[3,0,1,1],'Map018 healer level reset+sync')
              check(code(list[13])==122&&param(list[13])==[278,278,0,4,3,5],'Map018 old healer MP maximum random')
              setiv(list[13],:@parameters,[278,278,0,0,0]) # equipment bonus only
              check(param(list[16])==[554,554,0,0,11]&&param(list[19])==[554,554,0,0,3],'Map018 initial regen defaults')
              setiv(list[16],:@parameters,[554,554,0,0,14]);setiv(list[19],:@parameters,[554,554,0,0,6])
              list.insert(13,command(355,['$game_actors[3].maxsp=$game_actors[3].base_maxsp'],3))
              hireidx=list.index{|c|code(c)==129&&param(c)==[3,1,0]}
              check(!hireidx.nil?,'Map018 actor3 hire command')
              list.insert(hireidx,command(317,[3,1,0,1,278],3)) # existing native maxSP change + equipment var278
              hireidx+=1
              list.insert(hireidx+1,command(314,[3],3)) # existing native full recovery
              list.insert(hireidx+2,command(355,['$game_actors[3].instance_variable_set(:@sl_healer_hpr_frame,Graphics.frame_count)'],3))
              updated=true
              puts 'MAP018 EV6 hire: actor3 level, MP equipment max, full recovery, regen clock reset'
            end
            events.each do |eid,e|
              next unless iv(e,:@name).to_s=='[ID힐러 마법사]'.b
              iv(e,:@pages).each_with_index do |page,index|
                commands=iv(page,:@list)
                changed=0
                commands.each do |c|
                  p=param(c)
                  if code(c)==111 && p==[1,459,0,16,1]
                    setiv(c,:@parameters,[12,'$game_actors[3].sp >= 16'])
                    changed+=1
                  elsif code(c)==122 && p==[459,459,2,0,16]
                    setiv(c,:@code,312);setiv(c,:@parameters,[3,1,0,16])
                    changed+=1
                  end
                end
                check(changed==0 || changed==2,"Map#{mid} healer page#{index} partial original MP actions #{changed}")
                healer_pages+=1 if changed==2
                updated=true if changed>0
              end
            end
            if updated
              File.binwrite(map_file,Marshal.dump(map))
              changed_map_files << map_file
              count_map+=1
            end
          end
          check(healer_pages>=70,"healer pages converted #{healer_pages}")
          puts "HEALER MAPS #{count_map}; HEALER PAGES #{healer_pages}; all other maps preserved"

          sp_file=File.join(DATA,'Scripts.rxdata')
          scripts=Marshal.load(File.binread(sp_file))
          # Direct adaptation of the original player-in-world HP/SP meter (no second gauge engine).
          rewrite_script(scripts,'MOG - S HUD') do |s|
            crlf=s.include?("\r\n") ? "\r\n" : "\n"
            t=s.gsub("\r\n","\n")
            t=replace_one_script(t,'def initialize(viewport)','def initialize(viewport,actor_id=1)','shared existing HUD constructor')
            t=replace_one_script(t,"    super(viewport) \n    @actor = $game_party.actors[0] ","    super(viewport) \n    @sl_actor_id = actor_id\n    @actor = (@sl_actor_id == 3 ? $game_actors[3] : $game_party.actors[0])",'HUD initial actor')
            # Existing savegames can contain actor3 HP/SP 1, migrate once when loading a hired healer.
            t=replace_one_script(t,"    return if @actor == nil  \n    #HP Border",%q{    return if @actor == nil
              if @sl_actor_id == 3 && $game_switches[185] &&
                 !@actor.instance_variable_get(:@sl_healer_v116_migrated)
                @actor.hp = @actor.maxhp if @actor.hp <= 1
                @actor.sp = @actor.maxsp if @actor.sp <= 1
                @actor.instance_variable_set(:@sl_healer_v116_migrated,true)
              end
              #HP Border},'HUD healer saved-state migration')
            t=replace_one_script(t,"  def dispose\n    @actor = $game_party.actors[0] ","  def dispose\n    @actor = (@sl_actor_id == 3 ? $game_actors[3] : $game_party.actors[0])",'HUD dispose actor')
            old=%q{  def update
              #게임 오버 판정
              if @actor.hp == 0
              $scene = Scene_Gameover.new
            end
              @actor = $game_party.actors[0] 
              return if @actor == nil}
            newer=%q{  def update
              # The original player gameover remains exclusive to actor 1.
              if @sl_actor_id == 1 && @actor.hp == 0
                $scene = Scene_Gameover.new
              end
              @actor = (@sl_actor_id == 3 ? $game_actors[3] : $game_party.actors[0])
              return if @actor == nil}
            t=replace_one_script(t,old,newer,'HUD update actor gameover')
            t=replace_one_script(t,'if $game_switches[MOG::DISABLE_SHUD_SWITCH] == true', "if $game_switches[MOG::DISABLE_SHUD_SWITCH] == true ||\n       (@sl_actor_id == 3 && (!$game_switches[185] || @sl_healer_event == nil || @sl_healer_event.transparent))", 'HUD visibility')
            old_head="  def hud_pos_update    \n"
            new_head=%q{  def hud_pos_update
              target = $game_player
              if @sl_actor_id == 3
                if @sl_healer_map_id != $game_map.map_id
                  @sl_healer_map_id = $game_map.map_id
                  @sl_healer_event = nil
                end
                @sl_healer_event ||= $game_map.events.values.find do |e|
                  obj=e.instance_variable_get(:@event)
                  obj && obj.name == '[ID힐러 마법사]'
                end
                return unless @sl_healer_event
                target = @sl_healer_event
              end
          }
            t=replace_one_script(t,old_head,new_head,'HUD existing position method header')
            b=t.index("  def hud_pos_update\n");e=t.index('  end  ',b)
            check(b && e && e>b,'HUD position method end')
            h=t[b...e]
            h=h.gsub('$game_player.screen_x','target.screen_x').gsub('$game_player.screen_z','target.screen_z')
            t=t[0...b]+h+t[e..]
            # Healer has a separate actor stat, so player's poison/visual state does not repaint healer bar.
            t=replace_one_script(t,'if $game_switches[375] || $game_switches[985]','if @sl_actor_id == 1 && ($game_switches[375] || $game_switches[985])','HUD poison state')
            t=replace_one_script(t,"      @shud = S_Hud.new(@s_viewport)\n      shud_main","      @shud = S_Hud.new(@s_viewport)\n      @healer_shud = S_Hud.new(@s_viewport,3)\n      shud_main",'Scene_Map add healer by reusing S_Hud')
            t=replace_one_script(t,"      @shud.dispose\n      @shud = nil","      @healer_shud.dispose\n      @healer_shud = nil\n      @shud.dispose\n      @shud = nil",'Scene_Map clean healer HUD')
            t=replace_one_script(t,"    shud_update\n    @shud.update","    shud_update\n    @shud.update\n    @healer_shud.update",'Scene_Map update healer HUD')
            t.gsub("\n",crlf)
          end
          rewrite_script(scripts,'Mobile Hotbar') do |s|
            check(s.scan('$game_variables[459]').length==4,'Mobile Hotbar original 4 MP var refs')
            s.gsub('$game_variables[459]','$game_actors[3].sp')
          end
          rewrite_script(scripts,'게이지') do |s|
            check(s.scan('"Healer MP : "').length==5,'original HUD numeric MP text 5 shadows')
            # Replacement player-like HP/MP bars are drawn by original MOG S HUD; remove only legacy text.
            old=s[/###########힐러 마나 표시###############.*?^      end[ \t]*\r?$/m]
            check(!old.nil? && old.scan('"Healer MP : "').length==5,'old legacy text exact block')
            s.sub(old,'')
          end
          # Preserve boss calculations, movement, healer AI, version V1.15 native logic.
          File.binwrite(sp_file,Marshal.dump(scripts))
          puts 'SCRIPTS original knight HUD + healer HUD, hotbar SP, old MP overlay removed; untouched remaining scripts'

          # Refresh the existing loader's MD5 paths only for changed rxdata files.
          # Without this, the game web loader could fetch an out-of-date cache copy.
          mapping_path=File.join(SITE,'knight/gameasync/mapping.js')
          mapping=File.binread(mapping_path).force_encoding('UTF-8')
          ([actor_file,ce_file,sp_file]+changed_map_files).each do |path|
            rel='Data/'+File.basename(path)
            digest=Digest::MD5.file(path).hexdigest
            rx=Regexp.new(Regexp.escape(rel)+'\?h=[a-f0-9]{32}')
            check(mapping.scan(rx).size==1,"map asset cache digest #{rel}")
            mapping.gsub!(rx,"#{rel}?h=#{digest}")
          end
          File.binwrite(mapping_path,mapping)
          puts "CACHE mapping.js refreshed exactly #{3+changed_map_files.length} changed game data assets"

          # Remove ONLY the obstructing upper-left tiny version badge, keep title/cache version.
          knight_html=File.join(SITE,'knight/index.html')
          html=File.binread(knight_html).force_encoding('UTF-8')
          old=html.lines.find{|l|l.include?('id="sl-build-version"')}
          check(old && old.include?('top:4px;left:5px') && old.include?('V1.15'),'original fixed top-left version badge')
          html=html.sub(old,'').gsub('V1.15','V1.16').gsub('v1.15','v1.16')
          check(!html.include?('sl-build-version'),'top-left version badge removed')
          File.binwrite(knight_html,html)
          root_html=File.join(SITE,'index.html')
          root=File.binread(root_html).force_encoding('UTF-8')
          check(root.include?('SLKnight V1.15 + SLFairy'),'original root selection V1.15')
          File.binwrite(root_html,root.gsub('V1.15','V1.16'))
          js_file=File.join(SITE,'knight/js/sl-assets-v229r115.js')
          js=File.binread(js_file).force_encoding('UTF-8')
          check(js.include?("var version='V1.15';"),'current loader version original')
          File.binwrite(js_file,js.sub("var version='V1.15';","var version='V1.16';"))
          puts 'UI top-left badge removed; launcher and internal V1.16 labels updated'
          puts 'PASS V1.16 source patch (user gameplay validation pending)'
          RUBY_V116
          ruby -c build/patch_v116.rb
          ruby build/patch_v116.rb site

      - name: Verify V1.16 changes and all other files unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_V116_AFTER'
          from pathlib import Path
          import hashlib,json,re
          root=Path('site')
          before=json.loads(Path('build/v115_sha256.json').read_text('utf8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert set(after)==set(before),'V1.15 files missing or new'
          changed={p for p in before if before[p]!=after[p]}
          pre='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          allow={
              'knight/gameasync/Data/Scripts.rxdata',
              pre+'Actors.rxdata',
              pre+'CommonEvents.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'knight/index.html','index.html'
          }
          maps={x for x in changed if re.fullmatch(re.escape(pre)+r'Map[0-9]{3}\.rxdata',x)}
          assert len(maps)==38,(len(maps),maps)
          assert changed==allow|maps,sorted(changed^(allow|maps))
          assert len(changed)==45,len(changed)
          assert before['knight/mkxp.js']==after['knight/mkxp.js']
          assert before['knight/mkxp.wasm']==after['knight/mkxp.wasm']
          mapping=(root/'knight/gameasync/mapping.js').read_text('utf8')
          for rel in sorted(maps|{pre+'Actors.rxdata',pre+'CommonEvents.rxdata','knight/gameasync/Data/Scripts.rxdata'}):
              file=root/rel
              digest=hashlib.md5(file.read_bytes()).hexdigest()
              assert mapping.count('Data/'+file.name+'?h='+digest)==1,rel
          assert 'id="sl-build-version"' not in (root/'knight/index.html').read_text('utf8')
          assert "var version='V1.16';" in (root/'knight/js/sl-assets-v229r115.js').read_text('utf8')
          print('PASS V1.16 exactly 45 targeted files: 38 healer maps, 3 game data, 1 mapping, 3 UI/version')
          print('PASS original engine, movement/speed, monsters, drops, other game files byte-identical')
          PY_V116_AFTER

      - name: Publish V1.16 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
