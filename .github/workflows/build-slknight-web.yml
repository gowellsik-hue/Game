
name: build-slknight-web.yml | V1.36 | Healer Aggro, Teleport Reset, Holy Walk Buff Icon

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Restore V1.35 deployed game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 43658726543
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify V1.35 original
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build/v136
          tar -xf baseline/artifact.tar -C site
          python3 <<'PY'
          from pathlib import Path
          import json, hashlib
          root = Path('site')
          before = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in root.rglob('*') if p.is_file()}
          assert len(before) == 5619, len(before)
          assert 'SLKnight V1.35' in (root/'knight/index.html').read_text('utf-8')
          assert "var version='V1.35';" in (root/'knight/js/sl-assets-v229r115.js').read_text('utf-8')
          assert (root/'knight/gameasync/Data/Scripts.rxdata').is_file()
          Path('build/v136/before.json').write_text(json.dumps(before, ensure_ascii=False), 'utf-8')
          PY
          cp site/knight/gameasync/Data/Scripts.rxdata build/v136/Scripts.v135.rxdata
          cp site/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata build/v136/CommonEvents.v135.rxdata

      - name: Correct original target propagation, poison effects and neutral recognition
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          # encoding: UTF-8
          require 'zlib';require 'digest'
          base='site/knight/gameasync/Data'
          out='build/v136'
          Dir.mkdir(out) unless Dir.exist?(out)
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          scripts=Marshal.load(File.binread("#{base}/Scripts.rxdata"))
          modified=[]
          change=lambda do |name, pairs|
           rows=scripts.select{|r| r.is_a?(Array) && r[1].to_s.dup.force_encoding('UTF-8')==name}
           raise "#{name} rows #{rows.length}" unless rows.size==1
           row=rows.first
           old=Zlib::Inflate.inflate(row[2]).force_encoding('UTF-8')
           raw=old.gsub("\r\n","\n")
           pairs.each do |before,after,expected_count|
            hits=raw.scan(before).length
            raise "#{name} patch expected #{expected_count || 1} got #{hits} before #{before.inspect}" unless hits==(expected_count || 1)
            raw=raw.gsub(before,after)
           end
           newline=old.include?("\r\n") ? "\r\n" : "\n"
           result=raw.gsub("\n",newline)
           RubyVM::InstructionSequence.compile(result)
           row[2]=Zlib::Deflate.deflate(result.b)
           modified << name
           puts "PATCH #{name}, before #{old.bytesize}, after #{result.bytesize}"
          end
          old_chase=<<'OLD'
                if @sl_target_actor_id.nil?
                  healer = $game_map.sl_healer_event
                  active = $game_switches[185] && healer && !healer.transparent &&
                           !healer.instance_variable_get(:@sl_healer_teleport) &&
                           $game_actors[3] && $game_actors[3].hp > 0
                  pd = (@x - $game_player.x).abs + (@y - $game_player.y).abs
                  hd = active ? (@x - healer.x).abs + (@y - healer.y).abs : nil
                  @sl_target_actor_id = [hd && hd < pd ? 3 : 1]
                end
          OLD
          new_chase=<<'NEW'
                if @sl_target_actor_id.nil? || @sl_target_actor_id[0] == 0
                  healer = $game_map.sl_healer_event
                  active = $game_switches[185] && healer && !healer.transparent &&
                           !healer.instance_variable_get(:@sl_healer_teleport) &&
                           $game_actors[3] && $game_actors[3].hp > 0
                  pd = (@x - $game_player.x).abs + (@y - $game_player.y).abs
                  hd = active ? (@x - healer.x).abs + (@y - healer.y).abs : nil
                  if @sl_target_actor_id.nil? || pd < 20 || (hd && hd < 20)
                    @sl_target_actor_id = [hd && hd < pd ? 3 : 1]
                  end
                end
          NEW
          change.call('Game_Character 3',[[old_chase,new_chase]])

          old_switch=<<'OLD'
                if @parameters[2] == 0 && !$game_switches[i] && @event_id.to_i > 0
                  source = $game_map.events[@event_id]
                  if source && source.instance_variable_get(:@sl_combat_event)
                    target = source.instance_variable_get(:@sl_target_actor_id)
          OLD
          new_switch=<<'NEW'
                if @parameters[2] == 0 && !$game_switches[i]
                  source = $game_map.events[@event_id] if @event_id.to_i > 0
                  target = @sl_attack_target
                  if source && source.instance_variable_get(:@sl_combat_event)
                    target = source.instance_variable_get(:@sl_target_actor_id)
                  end
                  if target
          NEW
          change.call('Interpreter 4',[[old_switch,new_switch]])

          q=[
           [<<'OLD',<<'NEW'],
            def self.actor
              return nil unless $game_actors
              $game_actors[1]
            end
          OLD
            def self.actor
              return nil unless $game_actors
              $game_actors[@sl_damage_target_id || 1]
            end
          NEW
           [<<'OLD',<<'NEW'],
            def self.player
              $game_player
            end
          OLD
            def self.player
              return $game_map.sl_healer_event if @sl_damage_target_id == 3
              return nil if @sl_damage_target_id == 0
              $game_player
            end
          NEW
           [<<'OLD',<<'NEW'],
            def self.before_damage(roll)
              target=actor
          OLD
            def self.before_damage(roll, attack_target=nil)
              @sl_damage_target_id=attack_target ? attack_target[0] : 1
              target=actor
          NEW
           [<<'OLD',<<'NEW'],
              @poison_until=frame+POISON_FRAMES
              @poison_tick_at=frame+POISON_TICK
          OLD
              @poison_until=frame+POISON_FRAMES
              @poison_tick_at=frame+POISON_TICK
              @sl_poison_target_id=@sl_damage_target_id
          NEW
           [<<'OLD',<<'NEW'],
              target=player

              speed=target.instance_variable_get(
          OLD
              target=player
              @sl_slow_target=target

              speed=target.instance_variable_get(
          NEW
           [<<'OLD',<<'NEW'],
                restore_speed(target)
                @poison_until=0
          OLD
                restore_speed(@sl_slow_target || target)
                @poison_until=0
          NEW
           [<<'OLD',<<'NEW'],
                restore_speed(target)
              end

              if @poison_until.to_i>now &&
          OLD
                restore_speed(@sl_slow_target || target)
              end

              if @poison_until.to_i>now &&
          NEW
           [<<'OLD',<<'NEW'],
                victim=actor

                if victim && victim.hp.to_i>0
          OLD
                victim=$game_actors[@sl_poison_target_id || 1]

                if victim && victim.hp.to_i>0
          NEW
          ]
          change.call('Game_Player',q)


          poison_check=<<'NEW'
            def sl_poisoned_actor?(actor_id)
              return false unless @common_events
              if $game_switches[375]
                event = @common_events[139]
                target = event && event.instance_variable_get(:@sl_attack_target)
                return true if (target ? target[0] : 1) == actor_id
              end
              if $game_switches[985]
                event = @common_events[787]
                target = event && event.instance_variable_get(:@sl_attack_target)
                return true if (target ? target[0] : 1) == actor_id
              end
              false
            end
          NEW
          change.call('Game_Map',[["  attr_reader :sl_healer_event, :common_events\n", "  attr_reader :sl_healer_event, :common_events\n" + poison_check]])
          change.call('게이지',[["if $game_switches[985] || $game_switches[375]", "if $game_map.sl_poisoned_actor?(1)"]])
          change.call('플레이어 체력 출력',[["if $game_switches[985] || $game_switches[375]", "if $game_map.sl_poisoned_actor?(1)",2]])
          change.call('MOG - S HUD',[["if @sl_actor_id == 1 && ($game_switches[375] || $game_switches[985])", "if $game_map.sl_poisoned_actor?(@sl_actor_id)"]])
          raise "wrong script changed #{modified.inspect}" unless modified.sort==['Game_Character 3','Game_Map','Game_Player','Interpreter 4','MOG - S HUD','게이지','플레이어 체력 출력'].sort
          File.binwrite("#{base}/Scripts.rxdata",Marshal.dump(scripts))

          module RPG
            class CommonEvent;end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
            class AudioFile;end
            class State;end
          end
          [Color=Class.new,Tone=Class.new,Table=Class.new].each do |k|
           k.define_singleton_method(:_load){|x|o=allocate;o.instance_variable_set(:@raw,x);o}
           k.define_method(:_dump){|_|@raw}
          end
          comm=Marshal.load(File.binread("#{base}/#{prefix}CommonEvents.rxdata"))
          item=comm.fetch(1064)
          list=item.instance_variable_get(:@list)
          a=list.select{|c| c.instance_variable_get(:@code)==355 && c.instance_variable_get(:@parameters)==['SLZQEffects.before_damage($game_variables[5987])']}
          raise "unexpected queen hook count #{a.length}" unless a.length==1
          a[0].instance_variable_get(:@parameters)[0]='SLZQEffects.before_damage($game_variables[5987], @sl_attack_target)'
          File.binwrite("#{base}/#{prefix}CommonEvents.rxdata",Marshal.dump(comm))
          puts 'PATCH CE1064 before_damage original call, all other commands unchanged'
          RUBY

      - name: Update cache hashes and V1.36 version
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import hashlib, re
          root = Path('site')
          data_dir = root/'knight/gameasync/Data'
          mapping = root/'knight/gameasync/mapping.js'
          content = mapping.read_text('utf-8')
          prefix = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          for name in ['Scripts.rxdata', prefix+'CommonEvents.rxdata']:
              path = data_dir/name
              pattern = re.compile(re.escape('Data/'+name+'?h=')+r'[0-9a-f]{32}')
              assert len(pattern.findall(content)) == 1, name
              content = pattern.sub('Data/'+name+'?h='+hashlib.md5(path.read_bytes()).hexdigest(), content)
          mapping.write_text(content, 'utf-8')
          for name in ['index.html', 'knight/index.html']:
              path = root/name
              text = path.read_text('utf-8')
              assert 'V1.35' in text, name
              path.write_text(text.replace('V1.35','V1.36').replace('v1.35','v1.36'), 'utf-8')
          loader = root/'knight/js/sl-assets-v229r115.js'
          text = loader.read_text('utf-8')
          assert text.count("var version='V1.35';") == 1
          loader.write_text(text.replace("var version='V1.35';", "var version='V1.36';"), 'utf-8')
          PY
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Verify exact V1.36 changes
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          # encoding: UTF-8
          require 'zlib'
          require 'digest'
          old = Marshal.load(File.binread('build/v136/Scripts.v135.rxdata'))
          cur = Marshal.load(File.binread('site/knight/gameasync/Data/Scripts.rxdata'))
          raise 'Script count changed' unless old.size == 137 && cur.size == 137
          changed = old.zip(cur).filter_map do |a,b|
            next if a==b
            raise 'Script header modified' unless a[0]==b[0] && a[1]==b[1]
            b[1].to_s.dup.force_encoding('UTF-8')
          end
          expected = ['Game_Character 3','Game_Map','Game_Player','Interpreter 4','MOG - S HUD','게이지','플레이어 체력 출력']
          raise "Unexpected scripts #{changed.inspect}" unless changed.sort == expected.sort
          cur.each do |row|
            next unless row.is_a?(Array) && row[2].is_a?(String)
            name = row[1].to_s.dup.force_encoding('UTF-8')
            next unless expected.include?(name)
            RubyVM::InstructionSequence.compile(Zlib::Inflate.inflate(row[2]).force_encoding('UTF-8'))
          end
          puts 'PASS seven approved scripts; 130 original scripts unchanged'

          module RPG
            class CommonEvent; end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
            class AudioFile; end
            class State; end
          end
          [Color=Class.new,Tone=Class.new,Table=Class.new].each do |klass|
            klass.define_singleton_method(:_load) do |raw|
              object=allocate; object.instance_variable_set(:@raw,raw); object
            end
            klass.define_method(:_dump) { |_limit| @raw }
          end
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          old_ce=Marshal.load(File.binread('build/v136/CommonEvents.v135.rxdata'))
          new_ce=Marshal.load(File.binread('site/knight/gameasync/Data/'+prefix+'CommonEvents.rxdata'))
          raise 'Common event count changed' unless old_ce.size==new_ce.size
          diff=old_ce.zip(new_ce).each_with_index.filter_map do |pair,i|
            a,b=pair
            i unless Marshal.dump(a)==Marshal.dump(b)
          end
          raise "Unexpected common event changes #{diff.inspect}" unless diff==[1064]
          old_list=old_ce[1064].instance_variable_get(:@list)
          new_list=new_ce[1064].instance_variable_get(:@list)
          raise 'CE1064 command count changed' unless old_list.size==new_list.size
          new_list.each_with_index do |command,i|
            next if i==11
            raise "CE1064 unexpected command #{i}" unless Marshal.dump(command)==Marshal.dump(old_list[i])
          end
          raise 'Existing CE57 altered' unless Marshal.dump(old_ce[57])==Marshal.dump(new_ce[57])
          raise 'Existing CE137 altered' unless Marshal.dump(old_ce[137])==Marshal.dump(new_ce[137])
          puts 'PASS CE1064 one argument changed; original CE57, CE137 retained'
          RUBY

          python3 <<'PY'
          from pathlib import Path
          import json, hashlib
          root = Path('site')
          before = json.loads(Path('build/v136/before.json').read_text('utf-8'))
          after = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                   for p in root.rglob('*') if p.is_file()}
          prefix = 'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          expected = {'knight/gameasync/Data/Scripts.rxdata',
                      prefix+'CommonEvents.rxdata',
                      'knight/gameasync/mapping.js',
                      'knight/js/sl-assets-v229r115.js',
                      'knight/index.html', 'index.html'}
          changed = {k for k in before if before[k]!=after.get(k)}
          assert len(after)==5619 and set(after)==set(before)
          assert changed==expected, sorted(changed ^ expected)
          mapping=(root/'knight/gameasync/mapping.js').read_text('utf-8')
          for name in ['Scripts.rxdata', 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata']:
              data=(root/'knight/gameasync/Data'/name).read_bytes()
              assert 'Data/'+name+'?h='+hashlib.md5(data).hexdigest() in mapping
          assert 'SLKnight V1.36' in (root/'knight/index.html').read_text('utf-8')
          assert "var version='V1.36';" in (root/'knight/js/sl-assets-v229r115.js').read_text('utf-8')
          print('PASS 5619 files unchanged in count; six approved deployed paths changed')
          print('PASS original maps and all other data unchanged')
          PY

      - name: Publish V1.36 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
