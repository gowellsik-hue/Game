      - name: Finalize SLFairy browser identity and hotkeys
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('fairy_player/index.html')
          s=p.read_text()
          if 'slknight_v14_engine' not in s:
              raise SystemExit('Fairy copied Knight namespace marker missing')
          s=s.replace('slknight_v14_engine','slfairy_v143z10_1_engine')
          s=s.replace('SLKnight V14.3z10','SLFairy V14.3z10.1')
          s=s.replace('v143z10','v143z10_1elf')
          pat=re.compile(r"\n\s*var slAttackSheets=.*?\n\s*slAttackCoords\.forEach\(function\(name\)\{.*?\n\s*\}\);",re.S)
          s,n=pat.subn('',s,count=1)
          if n!=1:
              raise SystemExit(f'Knight monster preload block removal count={n}')
          p.write_text(s)
          d=Path('fairy_player/js/dpad.js')
          t=d.read_text()
          old="hotButton(hot,0,'A',65);hotButton(hot,1,'S',83);hotButton(hot,2,'D',68);hotButton(hot,3,'Q',81);hotButton(hot,4,'Z',117);hotButton(hot,5,'F',116);"
          new="hotButton(hot,0,'A',117);hotButton(hot,1,'S',118);hotButton(hot,2,'D',119);hotButton(hot,3,'Q',120);hotButton(hot,4,'F',116);"
          if t.count(old)!=1:
              raise SystemExit(f'Fairy dpad hotbar marker count={t.count(old)}')
          t=t.replace(old,new,1)
          d.write_text(t)
          print('FAIRY_BROWSER_IDENTITY_AND_KEYS_OK')
          PY
          touch fairy_player/.nojekyll

      - name: Verify SLFairy web build
        run: |
          set -euo pipefail
          test -s fairy_player/index.html
          test -s fairy_player/mkxp.js
          test -s fairy_player/mkxp.wasm
          test -s fairy_player/gameasync/Game.ini
