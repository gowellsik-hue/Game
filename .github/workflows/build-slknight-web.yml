
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V258
# BASE: V254 / run 41394237945
# MAP: Tower of Insolence Floor 2 / Map025 EV29
# MONSTER: Zenith Queen
# COMBAT: Physical 6/7, Magic 1/7
# MAGIC MINIMUM FINAL DAMAGE: 80
# PHYSICAL MINIMUM: No additional floor
# FIX: No proximity-only player damage
# FIX: Native event-command damage for monster attacks
# FIX: Items ID18 is an item, not a weapon
# KEEP: Original Death Knight and unrelated monsters
# KEEP: Original seven motion sprites
# STATUS: CI checks included; mobile verification required

name: build-slknight-web.yml | V258 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: V258 Restore verified V254 baseline
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41394237945
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V258 Verify original files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build

          test -s baseline/artifact.tar
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root=Path('site')

          before={
            str(p.relative_to(root)):
            hashlib.sha256(p.read_bytes()).hexdigest()
            for p in root.rglob('*') if p.is_file()
          }

          assert len(before)==5610,len(before)

          pre=(
            'knight/gameasync/Data/'
            'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          )

          for mid in (16,25,47):
            assert pre+f'Map{mid:03d}.rxdata' in before

          for mid in (45,46):
            assert pre+f'Map{mid:03d}.rxdata' not in before

          for action in (
            'Walk','Idle','Attack','AltAttack',
            'Spell','Hit','Death'
          ):
            path=(
              'knight/gameasync/Graphics/Characters/'
              'SLZenith'+action+'.png'
            )
            assert path in before,path

          Path('build/before.json').write_text(
            json.dumps(before,sort_keys=True)
          )

          print('PASS V254 original inventory')
          print('PASS Map025 available')
          print('PASS original seven motion sprites')
          PY

      - name: V258 Create reusable monster registry and core
        shell: bash
        run: |
          set -euo pipefail

          cat > build/monster-runtime.rb <<'RUBY'
          # encoding: UTF-8
          #
          # V258 standalone monster engine.
          # Only registered map/event pairs are managed.
          #
          # No Death Knight event or common-event clone.

          module SLMonster

            REGISTRY={
              [25,29]=>{
                :name=>'제니스 퀸',
                :level=>60,
                :sprite=>'SLZenith',
                :max_hp=>5200,
                :damage_var=>7001,

                :physical=>[50,100],
                :magic=>[150,300],
                :physical_weight=>6,
                :magic_weight=>1,
                :magic_floor=>80,

                :accuracy=>9999,
                :hit_random=>[15,35],
                :attack_wait=>20,
                :attack_range=>3,

                :exp=>43212,
                :adena=>[64800,151200],

                :magic_fx=>[25,14,15,16],

                :frames=>{
                  'Walk'=>12,
                  'Idle'=>11,
                  'Attack'=>13,
                  'AltAttack'=>14,
                  'Spell'=>14,
                  'Hit'=>2,
                  'Death'=>17
                },

                :drops=>[
                  [:item,35,30],
                  [:item,34,20],
                  [:item,33,100],
                  [:item,37,100],
                  [:armor,169,50],
                  [:item,116,3],
                  [:item,32,100],
                  [:item,38,100],
                  [:armor,289,30],
                  [:weapon,123,30],
                  [:item,18,50],
                  [:item,3,200],
                  [:weapon,1,50],
                  [:armor,72,50],
                  [:item,2,250],
                  [:armor,303,2],
                  [:item,43,100],
                  [:armor,280,30],
                  [:armor,12,50],
                  [:armor,492,3]
                ]
              }
            }

            @states={}

            def self.config(map_id,event_id)
              REGISTRY[[map_id,event_id]]
            end

            def self.state(map_id,event_id)
              key=[map_id,event_id]

              @states[key]||={
                :tick=>0,
                :motion=>nil,
                :motion_tick=>0,
                :motion_duration=>0,
                :attack_tick=>0,
                :attack_count=>0,
                :magic_index=>0,
                :last_damage=>0,
                :death_tick=>0,
                :interpreter=>nil,
                :paid=>false
              }
            end

            def self.roll(pair)
              a=pair[0].to_i
              b=pair[1].to_i

              return a if b<=a

              a+rand(b-a+1)
            end

            def self.actor
              if $game_party &&
                 $game_party.respond_to?(:actors)

                actors=$game_party.actors

                return actors[0] if
                  actors && !actors.empty?
              end

              return $game_actors[1] if $game_actors

              nil
            end

            def self.event(map_id,event_id)
              return nil unless $game_map
              return nil unless $game_map.map_id==map_id
              return nil unless $game_map.respond_to?(:events)

              $game_map.events[event_id]
            end

            def self.reset(map_id)
              @states={}

              return unless $game_variables

              REGISTRY.each do |key,c|
                next unless key[0]==map_id

                $game_variables[c[:damage_var]]=0
              end
            end

            def self.preload(map_id)
              return unless defined?(RPG::Cache)

              REGISTRY.each do |key,c|
                next unless key[0]==map_id

                c[:frames].each_key do |name|
                  RPG::Cache.character(
                    c[:sprite]+name,0
                  )
                end
              end
            end

            def self.motion(map_id,event_id,name,duration)
              c=config(map_id,event_id)
              return unless c
              return unless c[:frames].key?(name)

              s=state(map_id,event_id)

              return if s[:paid] && name!='Death'

              s[:motion]=name
              s[:motion_tick]=0
              s[:motion_duration]=duration

              ev=event(map_id,event_id)
              return unless ev

              ev.instance_variable_set(
                :@character_name,
                c[:sprite]+name
              )
            end

            def self.show_hp(map_id,event_id)
              c=config(map_id,event_id)
              return unless c
              return unless $game_variables
              return unless $m
              return unless $m.respond_to?(:drawMHP)

              damage=$game_variables[
                c[:damage_var]
              ].to_i

              $m.drawMHP(
                c[:name],
                damage,
                c[:max_hp],
                2
              )
            end

            def self.distance(ev)
              return nil unless $game_player
              return nil unless ev.respond_to?(:x)
              return nil unless ev.respond_to?(:y)

              dx=($game_player.x-ev.x).abs
              dy=($game_player.y-ev.y).abs

              [dx,dy]
            end

            def self.in_range?(ev,range)
              d=distance(ev)
              return false unless d

              d[0]<=range && d[1]<=range
            end

            # Monster -> player attack selection.
            # This is a weighted random branch, not a
            # forced six-physical/one-magic sequence.

            def self.choose_attack(c)
              total=(
                c[:physical_weight]+
                c[:magic_weight]
              )

              roll=rand(total)

              if roll<c[:magic_weight]
                :magic
              else
                :physical
              end
            end

            # Native RPG event command constructor.
            # This produces a fresh combat command list.
            # No monster event is copied.

            def self.command(code,params=[],indent=0)
              obj=RPG::EventCommand.allocate

              obj.instance_variable_set(:@code,code)
              obj.instance_variable_set(:@parameters,params)
              obj.instance_variable_set(:@indent,indent)

              obj
            end

            # Preserve the existing native selection
            # between the two configured attack inputs.

            def self.attack_input(c,kind)
              values=(
                kind==:magic ?
                c[:magic] : c[:physical]
              )

              if $game_switches && $game_switches[386]
                values[0]
              else
                values[1]
              end
            end

            # Build a native event-command attack.
            #
            # Native RPG calculations:
            #   magic: MDEF -> CE57 -> v1031 -> floor 80
            #   physical: hit check -> CE57 -> v1031
            #
            # Damage is applied with native command 311.
            # No direct actor.hp assignment is used.

            def self.attack_commands(c,kind)
              raw=attack_input(c,kind)

              if kind==:magic
                return [
                  command(106,[5]),

                  command(
                    122,[26,26,0,0,raw]
                  ),

                  command(
                    122,[4,4,0,4,1,12]
                  ),

                  command(
                    122,[26,26,2,1,4]
                  ),

                  command(117,[57]),

                  command(
                    122,[26,26,2,1,1031]
                  ),

                  command(
                    111,[1,26,0,c[:magic_floor],2]
                  ),

                  command(
                    311,[1,1,0,c[:magic_floor],false],1
                  ),

                  command(411,[],0),

                  command(
                    311,[1,1,1,26,false],1
                  ),

                  command(412,[],0),
                  command(0,[])
                ]
              end

              [
                command(106,[5]),

                command(
                  122,[336,336,0,0,c[:accuracy]]
                ),

                command(
                  111,[1,172,0,0,0],0
                ),

                command(
                  111,[1,336,1,337,1],1
                ),

                command(
                  122,[26,26,0,0,raw],2
                ),

                command(117,[57],2),

                command(
                  122,[26,26,2,1,1031],2
                ),

                command(
                  111,[1,26,0,0,2],2
                ),

                command(
                  122,[26,26,0,0,0],3
                ),

                command(412,[],2),

                command(
                  311,[1,1,1,26,false],2
                ),

                command(412,[],1),
                command(412,[],0),
                command(0,[])
              ]
            end

            def self.magic_effect(c,s)
              return unless $game_player
              return unless $data_animations
              return unless
                $game_player.respond_to?(:animation_id=)

              ids=c[:magic_fx]

              return if ids.empty?

              n=s[:magic_index]%ids.length
              id=ids[n]

              return unless $data_animations[id]

              $game_player.animation_id=id
              s[:magic_index]=(n+1)%ids.length
            end

            def self.start_attack(ev,c,s)
              return unless defined?(Game_Interpreter)

              map_id=ev.instance_variable_get(:@map_id)
              event_id=ev.instance_variable_get(:@id)

              type=choose_attack(c)

              s[:attack_count]+=1

              if type==:magic
                motion(
                  map_id,event_id,
                  'Spell',c[:attack_wait]
                )

                magic_effect(c,s)
              else
                action=(
                  s[:attack_count].even? ?
                  'AltAttack' : 'Attack'
                )

                motion(
                  map_id,event_id,
                  action,c[:attack_wait]
                )
              end

              interpreter=Game_Interpreter.new(0)

              interpreter.setup(
                attack_commands(c,type),
                event_id
              )

              s[:interpreter]=interpreter
              s[:attack_tick]=0
            end

            def self.update_attack(s)
              interpreter=s[:interpreter]

              return unless interpreter

              interpreter.update

              if interpreter.respond_to?(:running?) &&
                 !interpreter.running?

                s[:interpreter]=nil
              end
            end

            # Player -> monster damage.
            #
            # Called by the boss action event only.
            # It must not run merely because the
            # player is standing near the boss.

            def self.player_strike(map_id,event_id)
              c=config(map_id,event_id)
              return false unless c

              ev=event(map_id,event_id)
              return false unless ev
              return false unless $game_variables
              return false unless in_range?(ev,1)

              a=actor

              return false unless a
              return false unless a.respond_to?(:agi)
              return false unless a.respond_to?(:atk)

              s=state(map_id,event_id)
              return false if s[:paid]

              previous=$game_variables[
                c[:damage_var]
              ].to_i

              return false if previous>=c[:max_hp]

              # Existing hit-random rule: 15..35.
              hit_roll=roll(c[:hit_random])

              $game_variables[335]=hit_roll

              return false unless
                a.agi.to_i>=hit_roll

              # Read the actor's current attack stat.
              # No fixed or invented minimum damage.
              damage=a.atk.to_i

              return false unless damage>0

              result=[
                previous+damage,
                c[:max_hp]
              ].min

              $game_variables[
                c[:damage_var]
              ]=result

              s[:last_damage]=result

              if result<c[:max_hp]
                motion(
                  map_id,event_id,'Hit',14
                )
              end

              show_hp(map_id,event_id)

              true
            end

            def self.reward(map_id,event_id)
              c=config(map_id,event_id)

              return unless c
              return unless $game_party
              return unless $game_variables

              s=state(map_id,event_id)

              return if s[:paid]

              damage=$game_variables[
                c[:damage_var]
              ].to_i

              return if damage<c[:max_hp]

              s[:paid]=true

              gold=roll(c[:adena])

              $game_party.gain_gold(gold)

              a=actor

              if a &&
                 a.respond_to?(:exp) &&
                 a.respond_to?(:exp=)

                a.exp=a.exp+c[:exp]
              end

              $game_variables[333]=gold
              $game_variables[1926]=c[:exp]

              c[:drops].each do |kind,id,chance|
                next unless rand(1000)<chance

                case kind
                when :item
                  $game_party.gain_item(id,1)
                when :weapon
                  $game_party.gain_weapon(id,1)
                when :armor
                  $game_party.gain_armor(id,1)
                end
              end
            end

            def self.update_event(ev)
              map_id=ev.instance_variable_get(:@map_id)
              event_id=ev.instance_variable_get(:@id)

              c=config(map_id,event_id)

              return unless c
              return unless $game_map
              return unless $game_variables
              return unless $game_map.map_id==map_id
              return if ev.instance_variable_get(:@erased)

              s=state(map_id,event_id)
              s[:tick]+=1

              damage=$game_variables[
                c[:damage_var]
              ].to_i

              if damage>s[:last_damage] &&
                 damage<c[:max_hp]

                motion(
                  map_id,event_id,'Hit',14
                )
              end

              s[:last_damage]=damage

              if damage>=c[:max_hp]
                if s[:death_tick]==0
                  s[:interpreter]=nil

                  motion(
                    map_id,event_id,'Death',42
                  )

                  reward(map_id,event_id)
                end

                s[:death_tick]+=1

                if s[:death_tick]>=42 &&
                   ev.respond_to?(:erase)

                  ev.erase
                end

                return
              end

              if s[:motion]
                s[:motion_tick]+=1

                if s[:motion_tick]>=s[:motion_duration]
                  s[:motion]=nil
                  s[:motion_tick]=0
                end
              end

              if !s[:motion]
                moving=(
                  ev.respond_to?(:moving?) &&
                  ev.moving?
                )

                name=moving ? 'Walk' : 'Idle'
                graphic=c[:sprite]+name

                if ev.instance_variable_get(:@character_name)!=graphic
                  ev.instance_variable_set(
                    :@character_name,graphic
                  )
                end
              end

              update_attack(s)

              return if s[:interpreter]

              target=actor

              return unless target
              return unless target.respond_to?(:hp)
              return if target.hp.to_i<=0

              unless in_range?(ev,c[:attack_range])
                s[:attack_tick]=0
                return
              end

              s[:attack_tick]+=1

              if s[:attack_tick]>=c[:attack_wait]
                start_attack(ev,c,s)
              end
            end

            def self.frame_info(ev)
              map_id=ev.instance_variable_get(:@map_id)
              event_id=ev.instance_variable_get(:@id)

              c=config(map_id,event_id)
              return nil unless c

              s=state(map_id,event_id)

              action=s[:motion]

              if !action
                moving=(
                  ev.respond_to?(:moving?) &&
                  ev.moving?
                )

                action=moving ? 'Walk' : 'Idle'
              end

              count=c[:frames][action]

              return nil unless count && count>0

              if s[:motion]
                duration=[
                  s[:motion_duration],1
                ].max

                frame=[
                  s[:motion_tick]*count/duration,
                  count-1
                ].min
              else
                speed=action=='Walk' ? 2 : 4
                frame=(s[:tick]/speed)%count
              end

              direction=ev.direction.to_i

              row=[2,4,6,8].index(direction)

              return nil unless row

              [action,frame,row,count]
            end
          end

          class Game_Map
            alias slm_v258_native_setup setup

            def setup(map_id)
              slm_v258_native_setup(map_id)

              SLMonster.reset(map_id)
              SLMonster.preload(map_id)
            end
          end

          class Game_Event
            alias slm_v258_native_update update

            def update
              c=SLMonster.config(@map_id,@id)

              @monster=true if c

              slm_v258_native_update

              SLMonster.update_event(self) if c
            end
          end

          class Sprite_Character
            alias slm_v258_native_update update

            def update
              slm_v258_native_update

              return unless @character
              return unless @character.is_a?(Game_Event)

              map_id=@character.instance_variable_get(:@map_id)
              event_id=@character.instance_variable_get(:@id)

              c=SLMonster.config(map_id,event_id)
              return unless c

              info=SLMonster.frame_info(@character)
              return unless info

              action,frame,row,count=info

              expected=c[:sprite]+action

              return unless
                @character.character_name==expected

              return if @tile_id!=0

              bmp=respond_to?(:bitmap) ?
                bitmap : @bitmap

              return unless bmp
              return unless bmp.width.to_i>0
              return unless bmp.height.to_i>0

              return unless bmp.width%count==0
              return unless bmp.height%4==0

              rect=respond_to?(:src_rect) ?
                src_rect : @src_rect

              return unless rect &&
                rect.respond_to?(:set)

              cw=bmp.width/count
              ch=bmp.height/4

              rect.set(
                frame*cw,
                row*ch,
                cw,ch
              )

              @cw=cw
              @ch=ch

              self.ox=cw/2
              self.oy=ch

              if @character.respond_to?(:screen_z)
                self.z=@character.screen_z(ch)
              end
            end
          end
          RUBY

      - name: V258 Install independent event and check item links
        shell: bash
        run: |
          set -euo pipefail

          cat > build/install.rb <<'RUBY'
          # encoding: UTF-8

          require 'zlib'

          module RPG
            class Map;end
            class MapInfo;end
            class AudioFile;end
            class CommonEvent;end
            class Item;end
            class Weapon;end
            class Armor;end

            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end

            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end

          class Table
            def self._load(raw)
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end

            def _dump(level=0)
              @raw
            end
          end

          class Tone
            def self._load(raw)
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end

            def _dump(level=0)
              @raw
            end
          end

          class Color<Tone;end

          def iv(obj,key)
            obj.instance_variable_get('@'+key.to_s)
          end

          def put(obj,key,value)
            obj.instance_variable_set(
              '@'+key.to_s,value
            )
          end

          def command(code,params=[])
            obj=RPG::EventCommand.allocate

            put(obj,:code,code)
            put(obj,:indent,0)
            put(obj,:parameters,params)

            obj
          end

          def move_command(code)
            obj=RPG::MoveCommand.allocate

            put(obj,:code,code)
            put(obj,:parameters,[])

            obj
          end

          def make_boss(x,y)
            boss=RPG::Event.allocate

            put(boss,:id,29)
            put(boss,:name,'제니스 퀸')
            put(boss,:x,x)
            put(boss,:y,y)

            page=RPG::Event::Page.allocate
            cond=RPG::Event::Page::Condition.allocate

            put(cond,:switch1_valid,false)
            put(cond,:switch2_valid,false)
            put(cond,:variable_valid,false)
            put(cond,:self_switch_valid,false)
            put(cond,:switch1_id,1)
            put(cond,:switch2_id,1)
            put(cond,:variable_id,1)
            put(cond,:variable_value,0)
            put(cond,:self_switch_ch,'A')

            graphic=RPG::Event::Page::Graphic.allocate

            put(graphic,:tile_id,0)
            put(graphic,:character_name,'SLZenithIdle')
            put(graphic,:character_hue,0)
            put(graphic,:direction,2)
            put(graphic,:pattern,0)
            put(graphic,:opacity,255)
            put(graphic,:blend_type,0)

            route=RPG::MoveRoute.allocate

            put(route,:repeat,true)
            put(route,:skippable,false)
            put(route,:list,[move_command(0)])

            put(page,:condition,cond)
            put(page,:graphic,graphic)
            put(page,:move_type,2)
            put(page,:move_speed,3)
            put(page,:move_frequency,6)
            put(page,:move_route,route)
            put(page,:walk_anime,true)
            put(page,:step_anime,false)
            put(page,:direction_fix,false)
            put(page,:through,false)
            put(page,:always_on_top,false)

            # Action event, not proximity damage.
            put(page,:trigger,0)

            put(page,:list,[
              command(
                355,
                ['SLMonster.player_strike(25,29)']
              ),
              command(0)
            ])

            put(boss,:pages,[page])

            boss
          end

          def decoded_name(value)
            raw=value.to_s.dup

            utf=raw.dup.force_encoding('UTF-8')

            return utf if utf.valid_encoding?

            raw.force_encoding('CP949').encode(
              'UTF-8',
              invalid: :replace,
              undef: :replace
            )
          end

          root='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          map_path=root+pre+'Map025.rxdata'
          common_path=root+pre+'CommonEvents.rxdata'
          scripts_path=root+'Scripts.rxdata'

          map=Marshal.load(File.binread(map_path))
          common=Marshal.load(File.binread(common_path))
          scripts=Marshal.load(File.binread(scripts_path))

          events=iv(map,:events)
          old_boss=events.fetch(29)

          name=decoded_name(iv(old_boss,:name))

          raise 'Wrong boss event' unless
            name.include?('제니스 퀸')

          others=events.each_with_object({}) do |(id,e),h|
            h[id]=Marshal.dump(e) unless id==29
          end

          x=iv(old_boss,:x)
          y=iv(old_boss,:y)

          # Completely replace the old copied event.
          events[29]=make_boss(x,y)

          fresh=events[29]
          pages=iv(fresh,:pages)

          raise 'Old pages retained' unless
            pages.length==1

          active=pages[0]
          list=iv(active,:list)

          raise 'Old commands retained' unless
            list.length==2 &&
            iv(list[0],:code)==355 &&
            iv(list[1],:code)==0

          others.each do |id,raw|
            raise "Other event modified #{id}" unless
              Marshal.dump(events[id])==raw
          end

          # Delete only the two old Zenith clone CEs.
          raise 'Unexpected CE count' unless
            common.length==1063

          [1061,1062].each do |id|
            ce=common.fetch(id)

            raise 'Unexpected CE ID' unless
              iv(ce,:id)==id

            raise 'Not a Zenith clone' unless
              decoded_name(iv(ce,:name))
              .include?('제니스 퀸')
          end

          original_common=common[0...1061].map do |ce|
            Marshal.dump(ce)
          end

          common.pop(2)

          raise 'Copied CE remains' unless
            common.length==1061

          common.each_with_index do |ce,id|
            raise "Original CE altered #{id}" unless
              Marshal.dump(ce)==original_common[id]
          end

          # Verify no remaining references to the
          # two deleted Zenith common events.
          common.compact.each do |ce|
            (iv(ce,:list)||[]).each do |cmd|
              next unless iv(cmd,:code)==117

              id=(iv(cmd,:parameters)||[])[0]

              raise 'Deleted CE called' if
                [1061,1062].include?(id)
            end
          end

          Dir.glob(root+pre+'Map*.rxdata').each do |path|
            obj=path==map_path ?
              map : Marshal.load(File.binread(path))

            (iv(obj,:events)||{}).each_value do |ev|
              (iv(ev,:pages)||[]).each do |page|
                (iv(page,:list)||[]).each do |cmd|
                  next unless iv(cmd,:code)==117

                  id=(iv(cmd,:parameters)||[])[0]

                  raise "Deleted CE called in #{path}" if
                    [1061,1062].include?(id)
                end
              end
            end
          end

          # Replace the entire V254 Zenith runtime.
          indices=scripts.each_index.select do |i|
            scripts[i].is_a?(Array) &&
              scripts[i][1]=='SLZenithV254'
          end

          raise 'Runtime mismatch' unless
            indices.length==1

          index=indices[0]
          entry=scripts[index]

          old_runtime=Zlib::Inflate.inflate(entry[2])

          required=[
            'MAX_HP=5200',
            'PHYSICAL=[50,100]',
            'MAGIC=[150,300]',
            'ACCURACY=9999',
            'HIT_RANDOM=[15,35]',
            'EXP=43212',
            'ADENA=[64800,151200]'
          ]

          required.each do |value|
            raise "Stat mismatch: #{value}" unless
              old_runtime.include?(value)
          end

          match=old_runtime.match(
            /DROPS=(\[\n.*?\n  \])/m
          )

          raise 'Old drops missing' unless match

          old_drops=match[1].scan(
            /\[:(item|weapon|armor),(\d+),(\d+)\]/
          ).map do |kind,id,rate|
            [kind.to_sym,id.to_i,rate.to_i]
          end

          expected_old=[
            [:item,35,30],
            [:item,34,20],
            [:item,33,100],
            [:item,37,100],
            [:armor,169,50],
            [:item,116,3],
            [:item,32,100],
            [:item,38,100],
            [:armor,289,30],
            [:weapon,123,30],
            [:weapon,18,50],
            [:item,3,200],
            [:weapon,1,50],
            [:armor,72,50],
            [:item,2,250],
            [:armor,303,2],
            [:item,43,100],
            [:armor,280,30],
            [:armor,12,50],
            [:armor,492,3]
          ]

          raise 'Unexpected old drop table' unless
            old_drops==expected_old

          runtime=File.read(
            'build/monster-runtime.rb'
          )

          # Load and validate runtime config.
          # No game classes are needed for registry parsing.
          load 'build/monster-runtime.rb'

          c=SLMonster.config(25,29)

          raise 'Wrong map/event registration' unless c
          raise 'Wrong HP' unless c[:max_hp]==5200
          raise 'Wrong attack weights' unless
            c[:physical_weight]==6 &&
            c[:magic_weight]==1
          raise 'Wrong magic floor' unless
            c[:magic_floor]==80
          raise 'Wrong attack wait' unless
            c[:attack_wait]==20

          expected_new=expected_old.map(&:dup)
          expected_new[10]=[:item,18,50]

          raise 'New drops differ unexpectedly' unless
            c[:drops]==expected_new

          # Validate every item against the real DB.
          db={}

          {
            :item=>'Items',
            :weapon=>'Weapons',
            :armor=>'Armors'
          }.each do |kind,suffix|
            matches=Dir.glob(
              root+'*'+suffix+'.rxdata'
            )

            raise "Missing DB #{suffix}" unless
              matches.length==1

            db[kind]=Marshal.load(
              File.binread(matches[0])
            )
          end

          expected_names={
            [:item,35]=>'축복받은 갑옷 마법 주문서',
            [:item,34]=>'축복받은 무기 마법 주문서',
            [:item,33]=>'갑옷 마법 주문서',
            [:item,37]=>'강화 속도 향상 물약',
            [:armor,169]=>'마법 방어 사슬 갑옷',
            [:item,116]=>'어드밴스 스피릿',
            [:item,32]=>'무기 마법 주문서',
            [:item,38]=>'부활 주문서',
            [:armor,289]=>'수정 갑옷',
            [:weapon,123]=>'싸울아비 장검',
            [:item,18]=>'양손검',
            [:item,3]=>'용기의 물약',
            [:weapon,1]=>'일본도',
            [:armor,72]=>'할로윈 호박 갑옷',
            [:item,2]=>'속도 향상 물약',
            [:armor,303]=>'투명 망토',
            [:item,43]=>'파란 물약',
            [:armor,280]=>'파워 글로브',
            [:armor,12]=>'판금 갑옷',
            [:armor,492]=>'제니스의 반지'
          }

          c[:drops].each do |kind,id,rate|
            table=db[kind]

            raise "Invalid DB kind #{kind}" unless table
            raise "Missing item #{kind}:#{id}" unless
              table[id]

            actual=decoded_name(
              iv(table[id],:name)
            )

            expected=expected_names[[kind,id]]

            raise "Unknown expected item #{kind}:#{id}" unless
              expected

            compact_actual=actual.gsub(/\s+/,'')
            compact_expected=expected.gsub(/\s+/,'')

            raise "Wrong item #{kind}:#{id}: #{actual}" unless
              compact_actual.include?(compact_expected)

            raise 'Invalid drop rate' unless
              rate>=0 && rate<=1000
          end

          # Ensure no old copied runtime remains.
          forbidden=[
            'SLMonsterAttackContext',
            'SLZenithV247',
            'SLZenithV254',
            'SLZenithV256',
            'CE1061',
            'CE1062'
          ]

          forbidden.each do |marker|
            raise "Legacy dependency #{marker}" if
              runtime.include?(marker)
          end

          entry[0]=99825801
          entry[1]='SLMonsterV258'
          entry[2]=Zlib::Deflate.deflate(runtime,9)

          File.binwrite(
            map_path,Marshal.dump(map)
          )

          File.binwrite(
            common_path,Marshal.dump(common)
          )

          File.binwrite(
            scripts_path,Marshal.dump(scripts)
          )

          restored=Marshal.load(
            File.binread(scripts_path)
          )

          script=Zlib::Inflate.inflate(
            restored[index][2]
          )

          raise 'Runtime serialization failure' unless
            restored[index][1]=='SLMonsterV258' &&
            script.b==runtime.b

          puts 'PASS original copied event removed'
          puts 'PASS independent event created'
          puts 'PASS copied common events removed'
          puts 'PASS original common events preserved'
          puts 'PASS original other monsters preserved'
          puts 'PASS physical:magic = 6:1'
          puts 'PASS native magic minimum = 80'
          puts 'PASS 20 drop rates preserved'
          puts 'PASS Items 18 correction'
          puts 'PASS actual DB name/type/ID validation'
          puts 'PASS standalone runtime installed'
          RUBY

          ruby -c build/monster-runtime.rb
          ruby -c build/install.rb
          ruby build/install.rb

      - name: V258 Test combat and reward invariants
        shell: bash
        run: |
          set -euo pipefail

          cat > build/test.rb <<'RUBY'
          class Game_Map
            attr_accessor :map_id,:events

            def setup(map_id)
              @map_id=map_id
            end
          end

          class Game_Event
            attr_accessor :x,:y,:direction,:character_name

            def update;end
            def moving?;false;end
            def erase;@erased=true;end
            def screen_z(_);500;end
          end

          class Sprite_Character
            attr_accessor :ox,:oy,:z

            def update;end
          end

          class Game_Interpreter
            attr_reader :commands

            def initialize(*)
              @running=false
            end

            def setup(commands,event_id)
              @commands=commands
              @running=true
            end

            def running?
              @running
            end

            def update
              @running=false
            end
          end

          class DummyActor
            attr_accessor :hp,:exp,:agi,:atk

            def initialize
              @hp=10000
              @exp=0
              @agi=100
              @atk=100
            end
          end

          class DummyParty
            attr_accessor :actors
            attr_reader :gold,:items

            def initialize(actor)
              @actors=[actor]
              @gold=0
              @items=[]
            end

            def gain_gold(n)
              @gold+=n
            end

            def gain_item(id,n)
              @items << [:item,id,n]
            end

            def gain_weapon(id,n)
              @items << [:weapon,id,n]
            end

            def gain_armor(id,n)
              @items << [:armor,id,n]
            end
          end

          class DummyPlayer
            attr_accessor :x,:y,:animation_id
          end

          $game_map=Game_Map.new
          $game_variables=Hash.new(0)
          $game_switches=Hash.new(false)
          $game_actors={}

          actor=DummyActor.new
          $game_party=DummyParty.new(actor)

          $game_player=DummyPlayer.new
          $game_player.x=101
          $game_player.y=100

          $data_animations=Array.new(26)

          [25,14,15,16].each do |id|
            $data_animations[id]=Object.new
          end

          $m=nil

          load 'build/monster-runtime.rb'

          c=SLMonster.config(25,29)

          raise 'Wrong map' unless c
          raise 'Wrong level' unless c[:level]==60
          raise 'Wrong HP' unless c[:max_hp]==5200
          raise 'Wrong magic floor' unless c[:magic_floor]==80
          raise 'Wrong drops' unless c[:drops].length==20

          boss=Game_Event.new

          boss.instance_variable_set(:@map_id,25)
          boss.instance_variable_set(:@id,29)

          boss.x=100
          boss.y=100
          boss.direction=2
          boss.character_name='SLZenithIdle'

          $game_map.events={29=>boss}
          $game_map.setup(25)

          # No passive damage to the monster.
          initial=$game_variables[7001]

          19.times{boss.update}

          raise 'Passive monster HP loss' unless
            $game_variables[7001]==initial

          # A real action-event call changes monster HP.
          raise 'Action hit failed' unless
            SLMonster.player_strike(25,29)

          raise 'Monster HP unchanged' unless
            $game_variables[7001]>initial

          # Verify attack weights statistically.
          srand(258)

          counts={
            :physical=>0,
            :magic=>0
          }

          7000.times do
            kind=SLMonster.choose_attack(c)
            counts[kind]+=1
          end

          raise '6:1 branch distribution failed' unless
            counts[:magic].between?(900,1100)

          raise 'Physical branch distribution failed' unless
            counts[:physical]+counts[:magic]==7000

          # Native event commands must apply damage.
          physical=SLMonster.attack_commands(
            c,:physical
          )

          magic=SLMonster.attack_commands(
            c,:magic
          )

          codes=lambda do |list|
            list.map{
              |cmd|cmd.instance_variable_get(:@code)
            }
          end

          p_codes=codes.call(physical)
          m_codes=codes.call(magic)

          raise 'Physical native damage missing' unless
            p_codes.include?(311)

          raise 'Magic native damage missing' unless
            m_codes.count(311)==2

          raise 'Native MDEF missing' unless
            magic.any? do |cmd|
              cmd.instance_variable_get(:@code)==122 &&
              cmd.instance_variable_get(:@parameters)==
                [4,4,0,4,1,12]
            end

          raise 'Magic 80 floor missing' unless
            magic.any? do |cmd|
              cmd.instance_variable_get(:@code)==311 &&
              cmd.instance_variable_get(:@parameters)==
                [1,1,0,80,false]
            end

          raise 'Native damage correction missing' unless
            physical.any? do |cmd|
              cmd.instance_variable_get(:@code)==122 &&
              cmd.instance_variable_get(:@parameters)==
                [26,26,2,1,1031]
            end

          # No minimum physical final damage setting.
          raise 'Unexpected physical minimum' if
            c.key?(:physical_floor)

          # Correct item category for ID18.
          raise 'Wrong two-handed sword type' unless
            c[:drops].include?([:item,18,50])

          raise 'Old incorrect category remains' if
            c[:drops].include?([:weapon,18,50])

          # Seven original motion banks.
          raise 'Motion count incorrect' unless
            c[:frames].length==7

          c[:frames].each do |action,count|
            SLMonster.motion(25,29,action,20)

            expected='SLZenith'+action

            raise 'Motion asset name mismatch' unless
              boss.character_name==expected

            info=SLMonster.frame_info(boss)

            raise 'Motion frame count mismatch' unless
              info && info[3]==count
          end

          # Reward must occur exactly once.
          $game_variables[7001]=5200

          boss.update

          gold=$game_party.gold
          exp=actor.exp

          raise 'Gold reward invalid' unless
            gold.between?(64800,151200)

          raise 'EXP reward invalid' unless
            exp==43212

          50.times{boss.update}

          raise 'Duplicate gold reward' unless
            $game_party.gold==gold

          raise 'Duplicate EXP reward' unless
            actor.exp==exp

          raise 'Death event not erased' unless
            boss.instance_variable_get(:@erased)

          # Other monster IDs cannot enter this runtime.
          other=Game_Event.new

          other.instance_variable_set(:@map_id,16)
          other.instance_variable_set(:@id,8)

          other.character_name='OriginalMonster'
          other.update

          raise 'Other monster modified' unless
            other.character_name=='OriginalMonster'

          puts 'PASS physical/magic weighted 6:1'
          puts 'PASS magic native MDEF and floor 80'
          puts 'PASS physical native damage command'
          puts 'PASS no passive player attack'
          puts 'PASS action-triggered monster hit'
          puts 'PASS original seven motions'
          puts 'PASS 20 existing drop entries'
          puts 'PASS corrected Items ID18'
          puts 'PASS single death and reward'
          puts 'PASS unrelated monster bypass'
          RUBY

          ruby -c build/test.rb
          ruby build/test.rb

      - name: V258 Refresh native resource mapping
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          root=Path('site')
          data=root/'knight/gameasync/Data'

          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          mapping=root/'knight/gameasync/mapping.js'

          text=mapping.read_text('utf-8')

          paths=[
            data/(pre+'Map025.rxdata'),
            data/(pre+'CommonEvents.rxdata'),
            data/'Scripts.rxdata'
          ]

          for path in paths:
            key='Data/'+path.name

            digest=hashlib.md5(
              path.read_bytes()
            ).hexdigest()

            pattern=(
              '('+re.escape(key)+
              r'\?h=)[0-9a-f]{32}'
            )

            text,count=re.subn(
              pattern,
              lambda m:m.group(1)+digest,
              text
            )

            assert count==1,(key,count)

          mapping.write_text(text,'utf-8')

          loader=root/'knight/js/sl-assets-v229r115.js'

          js=loader.read_text('utf-8')

          old="var version='V254';"
          new="var version='V258';"

          assert js.count(old)==1

          loader.write_text(
            js.replace(old,new),
            'utf-8'
          )

          for rel in (
            'index.html',
            'knight/index.html'
          ):
            path=root/rel

            html=path.read_text('utf-8')

            assert 'V254' in html

            html=html.replace(
              'V254','V258'
            )

            html=html.replace(
              '?v=v254','?v=v258'
            )

            assert not re.search(
              r'\bid\s*=\s*["\']'
              r'(?:sl-build-version|slknight-v252-version)'
              r'["\']',
              html,re.I
            )

            path.write_text(html,'utf-8')

          print('PASS Map025 hash updated')
          print('PASS CommonEvents hash updated')
          print('PASS Scripts hash updated')
          print('PASS V258 cache revision')
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: V258 Verify original game protection
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root=Path('site')

          before=json.loads(
            Path('build/before.json').read_text()
          )

          after={
            str(p.relative_to(root)):
            hashlib.sha256(p.read_bytes()).hexdigest()
            for p in root.rglob('*') if p.is_file()
          }

          pre=(
            'knight/gameasync/Data/'
            'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          )

          changed={
            key for key in before
            if before[key]!=after.get(key)
          }

          allowed={
            pre+'Map025.rxdata',
            pre+'CommonEvents.rxdata',
            'knight/gameasync/Data/Scripts.rxdata',
            'knight/gameasync/mapping.js',
            'knight/js/sl-assets-v229r115.js',
            'index.html',
            'knight/index.html'
          }

          assert changed==allowed,(
            'Unexpected modifications',
            sorted(changed^allowed)
          )

          assert set(before)==set(after)
          assert len(after)==5610

          protected=[
            pre+'Map016.rxdata',
            pre+'Map047.rxdata',
            'knight/assets/map-047-v241.pack'
          ]

          for path in protected:
            assert before[path]==after[path],path

          for action in (
            'Walk','Idle','Attack','AltAttack',
            'Spell','Hit','Death'
          ):
            path=(
              'knight/gameasync/Graphics/'
              'Characters/SLZenith'+action+'.png'
            )

            assert before[path]==after[path],path

          for name in (
            '이펙트마법',
            '물의 대정령 마법',
            '불의 대정령 마법',
            '땅의 대정령 마법'
          ):
            path=(
              'knight/gameasync/Graphics/'
              'Animations/'+name+'.png'
            )

            assert before[path]==after[path],path

          atlas=(
            root/'knight/gameasync/Graphics/'
            'Characters/SLMonsterAtlas.png'
          )

          assert not atlas.exists()

          print('PASS original Death Knight unchanged')
          print('PASS unrelated maps unchanged')
          print('PASS original motion sprites unchanged')
          print('PASS original magic effects unchanged')
          print('PASS no oversized atlas')
          print('PASS all original asset paths retained')
          PY

