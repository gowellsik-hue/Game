                .catch(e=>{console.error('SLRESTOREERR',e);removeRunDependency(dep);});
          };'''
          p.write_text(s[:start]+replacement+s[end:])
          PY

          python3 - "$site/index.html" "$title" "$namespace" "$core" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); title=sys.argv[2]; namespace=sys.argv[3]; core=sys.argv[4]
          s=p.read_text()
          s=s.replace('<script src="js/drive.js"></script>','<script src="js/drive.js?v=ind1"></script>')
          s=s.replace('<script src="gameasync/mapping.js"></script>','<script src="gameasync/mapping.js?v=ind1"></script>')
          s=s.replace('preRun: [createDummies],','preRun: [function(){createDummies();window.restoreLocalFilesBeforeRun();}],')
          s=s.replace('postRun: [loadFiles, preloadInit],','postRun: [],')
          s=s.replace('width="640" height="480"','width="800" height="600"')
          import re
          s=re.sub(r"var namespace = '[^']*';",f"var namespace = '{namespace}';",s,1)
          s=re.sub(r"var wTitle = '[^']*'",f"var wTitle = '{title}'",s,1)
          if '<title>MKXP</title>' in s:
              s=s.replace('<title>MKXP</title>',f'<title>{title}</title>',1)
          marker='    <!-- <script async type="text/javascript" src="mkxp.js"></script> -->'
          if marker in s:
              s=s.replace(marker,f'    <script src="{core}.js?v=ind1"></script>',1)
          else:
              s=s.replace('</head>',f'<script src="{core}.js?v=ind1"></script>\n</head>',1)
          lazy="""                getLazyAsset('gameasync/bitmap-map.js', 'Primary assets', () => {\n                    const s = document.createElement('script');\n                    s.setAttribute('src', 'gameasync/bitmap-map.js');\n                    document.body.appendChild(s);\n                });\n"""
          s=s.replace(lazy,'')
          bridge=r'''
          <style>
          #dpad,#apad{display:none!important}
          #sl-mobile-ui{position:fixed;inset:0;z-index:5000;pointer-events:none;touch-action:none;user-select:none;-webkit-user-select:none}
          #sl-joystick{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));width:180px;height:180px;border-radius:50%;pointer-events:auto;touch-action:none}
          #sl-joy-base{position:absolute;inset:20px;border:2px solid rgba(255,255,255,.35);border-radius:50%;background:rgba(0,0,0,.2)}
          #sl-joy-knob{position:absolute;left:55px;top:55px;width:70px;height:70px;border:2px solid rgba(255,255,255,.7);border-radius:50%;background:rgba(30,30,30,.62)}
          #sl-actions{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));width:300px;height:210px}
          .sl-btn{position:absolute;border:2px solid rgba(255,255,255,.5);border-radius:50%;background:rgba(0,0,0,.44);color:#fff;pointer-events:auto;touch-action:none;font:600 12px sans-serif}
          .sl-btn.active{transform:scale(.93);background:rgba(255,255,255,.2)}
          #sl-confirm{width:84px;height:84px;right:0;bottom:0}#sl-cancel{width:60px;height:60px;right:94px;bottom:4px}
          #sl-bag{width:54px;height:54px;right:7px;bottom:98px}#sl-equip{width:54px;height:54px;right:70px;bottom:118px}
          #sl-config{width:44px;height:44px;right:160px;bottom:64px}#sl-q1,#sl-q2,#sl-q3,#sl-q4{width:54px;height:54px;bottom:150px;font-size:10px}
          #sl-q1{right:228px}#sl-q2{right:171px}#sl-q3{right:114px}#sl-q4{right:57px}
          </style>
          <script>
          (function(){
            var ch={BGM:new Audio(),BGS:new Audio()},pending=[];ch.BGM.loop=true;ch.BGS.loop=true;
            function audioUrl(n){var x=String(n||'').replace(/\\/g,'/').replace(/\.(ogg|mp3|wav|wma|aac|m4a|flac|mid|midi)$/i,'');return encodeURI('gameasync/'+x+'.ogg?v=ind1');}
            function safe(a){if(!a||!a.src)return;try{var q=a.play();if(q&&q.catch)q.catch(function(){if(pending.indexOf(a)<0)pending.push(a);});}catch(e){}}
            ['touchstart','pointerdown','keydown','mousedown'].forEach(function(n){window.addEventListener(n,function(){var q=pending.slice();pending.length=0;q.forEach(safe);},{passive:true});});
            function stop(k){var a=ch[k];if(a){a.pause();try{a.currentTime=0}catch(e){}}}
            function play(k,n,v,p){var a=ch[k];if(!a||!n)return;var u=audioUrl(n);if(a.dataset.slSrc!==u){a.pause();a.src=u;a.dataset.slSrc=u;a.load();}a.volume=Math.max(0,Math.min(1,Number(v||100)/100*(k==='BGS'?.2:1)));a.playbackRate=Math.max(.5,Math.min(1.5,Number(p||100)/100));safe(a);}
            function marker(t){var i=t.indexOf('SLAUDIO|');if(i>=0){var a=t.slice(i).split('|'),cmd=a[1]||'',k=cmd.split('_')[0];if(/_PLAY$/.test(cmd))play(k,a.slice(2,-2).join('|'),a[a.length-2],a[a.length-1]);else if(/_STOP$/.test(cmd))stop(k);else if(/_FADE$/.test(cmd))setTimeout(function(){stop(k)},Number(a[2])||0);}var j=t.indexOf('SLQS|');if(j>=0){var q=t.slice(j).split('|'),b=document.getElementById('sl-q'+q[1]);if(b)b.textContent=(q.slice(2).join('|')||q[1]).slice(0,8);}}
            var log=console.log.bind(console);console.log=function(){var a=[].slice.call(arguments);try{marker(a.join(' '))}catch(e){}log.apply(console,a)};
          })();
          </script>
          '''
          s=s.replace('</head>',bridge+'\n</head>',1)
          controls=r'''
          <div id="sl-mobile-ui">
            <div id="sl-joystick"><div id="sl-joy-base"></div><div id="sl-joy-knob"></div></div>
            <div id="sl-actions">
              <button id="sl-q1" class="sl-btn">1</button><button id="sl-q2" class="sl-btn">2</button><button id="sl-q3" class="sl-btn">3</button><button id="sl-q4" class="sl-btn">4</button>
              <button id="sl-config" class="sl-btn">SET</button><button id="sl-bag" class="sl-btn">BAG</button><button id="sl-equip" class="sl-btn">EQ</button><button id="sl-cancel" class="sl-btn">X</button><button id="sl-confirm" class="sl-btn">OK</button>
            </div>
          </div>
          <script>
          (function(){
            function emit(type,code){var e=document.createEventObject?document.createEventObject():document.createEvent('Events');if(e.initEvent)e.initEvent(type,true,true);e.keyCode=code;e.which=code;e.charCode=0;if(typeof JSEvents!=='undefined'&&JSEvents.eventHandlers&&JSEvents.eventHandlers.length){for(var i=0;i<JSEvents.eventHandlers.length;i++){var h=JSEvents.eventHandlers[i];if((h.target==Module['canvas']||h.target==window)&&h.eventTypeString==type)h.handlerFunc(e)}}else if(typeof Module!=='undefined'&&Module['canvas']){Module['canvas'].dispatchEvent?Module['canvas'].dispatchEvent(e):Module['canvas'].fireEvent('on'+type,e)}}
            var down=new Set();function kd(c){if(down.has(c))return;down.add(c);emit('keydown',c)}function ku(c){if(!down.has(c))return;down.delete(c);emit('keyup',c)}function tap(c){kd(c);setTimeout(function(){ku(c)},90)}
            function bind(id,code,tapOnly){var n=document.getElementById(id);if(!n)return;n.addEventListener('pointerdown',function(e){e.preventDefault();n.classList.add('active');tapOnly?tap(code):kd(code)});function up(e){if(e)e.preventDefault();if(!tapOnly)ku(code);n.classList.remove('active')}n.addEventListener('pointerup',up);n.addEventListener('pointercancel',up);n.addEventListener('lostpointercapture',up)}
            bind('sl-confirm',67,false);bind('sl-cancel',88,false);bind('sl-bag',83,false);bind('sl-equip',65,false);bind('sl-config',116,true);bind('sl-q1',117,true);bind('sl-q2',118,true);bind('sl-q3',119,true);bind('sl-q4',120,true);
            var joy=document.getElementById('sl-joystick'),knob=document.getElementById('sl-joy-knob'),pid=null,ar=[37,38,39,40];function setAr(a){ar.forEach(function(c){a.indexOf(c)>=0?kd(c):ku(c)})}function move(e){var r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=Math.max(34,r.width*.31),len=Math.hypot(dx,dy)||1,sc=Math.min(1,max/len);dx*=sc;dy*=sc;knob.style.transform='translate('+dx+'px,'+dy+'px)';var a=[];if(Math.abs(dx/max)>.28)a.push(dx>0?39:37);if(Math.abs(dy/max)>.28)a.push(dy>0?40:38);setAr(a)}joy.addEventListener('pointerdown',function(e){e.preventDefault();pid=e.pointerId;if(joy.setPointerCapture)joy.setPointerCapture(pid);move(e)});joy.addEventListener('pointermove',function(e){if(e.pointerId===pid){e.preventDefault();move(e)}});function end(e){if(pid!==null&&e&&e.pointerId!==undefined&&e.pointerId!==pid)return;pid=null;setAr([]);knob.style.transform='translate(0,0)'}joy.addEventListener('pointerup',end);joy.addEventListener('pointercancel',end);joy.addEventListener('lostpointercapture',end);
          })();
          </script>
          '''
          s=s.replace('</body>',controls+'\n</body>',1)
          p.write_text(s)
          print('HTML_PATCH_OK',title)
          PY

          touch "$site/.nojekyll"
          test -s "$site/index.html"
          test -s "$site/mkxp.js"
          test -s "$site/mkxp.wasm"
          test -s "$site/gameasync/Data/Scripts.rxdata"
          grep -Fq "$namespace" "$site/index.html"
          grep -Fq 'id="sl-joystick"' "$site/index.html"
          grep -Fq 'restoreLocalFilesBeforeRun' "$site/js/drive.js"
          echo "VARIANT_BUILD_OK $variant"
          SH
          chmod +x /tmp/build_variant.sh

      - name: Build Knight independently
        run: |
          /tmp/build_variant.sh \
            knight \
            /tmp/knight-src \
            /tmp/site-knight \
            SLKnight \
            slknight_independent_save \
            slknight-core

      - name: Build Fairy independently
        run: |
          /tmp/build_variant.sh \
            fairy \
            /tmp/fairy-src \
            /tmp/site-elf \
            SLFairy \
            slfairy_independent_save \
            slfairy-core

      - name: Assemble launcher only after both builds finish
        run: |
          set -euo pipefail
          rm -rf player
          mkdir -p player/knight player/elf
          cp -a /tmp/site-knight/. player/knight/
          cp -a /tmp/site-elf/. player/elf/

          cat > player/index.html <<'HTML'
          <!doctype html>
          <html lang="ko">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
            <title>SL Mobile</title>
            <style>
              html,body{margin:0;width:100%;height:100%;background:#080808;color:#fff;font-family:system-ui,sans-serif}
              .wrap{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px}
              h1{font-size:30px;margin:0 0 12px}.choices{display:flex;gap:18px}.card{width:150px;height:170px;border:1px solid #777;border-radius:14px;background:#171717;color:#fff;font-size:25px;cursor:pointer}.card:active{transform:scale(.97)}
            </style>
          </head>
          <body>
            <div class="wrap">
              <h1>SL Mobile</h1>
              <div class="choices">
                <button class="card" onclick="location.href='knight/'">&#44592;&#49324;</button>
                <button class="card" onclick="location.href='elf/'">&#50836;&#51221;</button>
              </div>
            </div>
          </body>
          </html>
          HTML
          touch player/.nojekyll

      - name: Verify fully independent output
        run: |
          set -euo pipefail
          test -s player/index.html
          test -s player/knight/index.html
          test -s player/elf/index.html
          test -s player/knight/mkxp.js
          test -s player/elf/mkxp.js
          test -s player/knight/mkxp.wasm
          test -s player/elf/mkxp.wasm
          test -s player/knight/slknight-core.data
          test -s player/elf/slfairy-core.data
          test -s player/knight/gameasync/Data/Scripts.rxdata
          test -s player/elf/gameasync/Data/Scripts.rxdata
          grep -Fq 'slknight_independent_save' player/knight/index.html
          grep -Fq 'slfairy_independent_save' player/elf/index.html
          grep -Fq 'id="sl-joystick"' player/knight/index.html
          grep -Fq 'id="sl-joystick"' player/elf/index.html
          grep -Fq 'Mobile Diablo Assist' <(strings player/knight/gameasync/Data/Scripts.rxdata) || true
          echo DUAL_INDEPENDENT_BUILD_OK
          du -sh player

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
