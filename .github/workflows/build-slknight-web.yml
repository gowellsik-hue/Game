
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R134
# ADD: Restore the exact R94 passage masks and 4-way native edges for both floors.
# SOURCE: Provided R94 HTML 1F 5,957 open, 452 direction masks; 2F 11,685 open.
# POSITION: Existing +12,+6 image alignment is already applied to both floors; no second shift.
# BASE: exact successful V229R131 build from commit 6319a8221f4aefb3cbbfbd593049a6001614bb5b.
# CHANGE: remove -12,-6 inverse adjustment ONLY inside SLTI_Native66.nearest.
# KEEP: original +12,+6 projection on map45 and map46, unchanged.
# KEEP: original player/monster spawn coordinates, events, Baphomet, stairs and respawn logic.
# KEEP: original 384/385 map tiles, approved directional passages, cleaned 2F art and drops.
# NO: new offset, map edit, monster relocation, AI, new movement algorithm or art modification.
name: build-slknight-web.yml | V229R134 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R134 Find the successful V229R131 published artifact
        id: base
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          expected_sha='6319a8221f4aefb3cbbfbd593049a6001614bb5b'
          url=('https://api.github.com/repos/gowellsik-hue/Game/actions/'
               'workflows/build-slknight-web.yml/runs?per_page=100')
          req=urllib.request.Request(url,headers={
            'Authorization':'Bearer '+os.environ['GH_TOKEN'],
            'Accept':'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=30) as response:
            runs=json.load(response)['workflow_runs']
          matches=[]
          for run in runs:
            path=run.get('path','').split('@',1)[0]
            if (run.get('head_sha')==expected_sha and
                run.get('conclusion')=='success' and
                path.endswith('/build-slknight-web.yml')):
              matches.append(run)
          if not matches:
            raise SystemExit('No successful exact R131 run. Refuse to use R121 or R132 instead.')
          run=max(matches,key=lambda r:r['run_number'])
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf8') as f:
            f.write('run_id='+str(run['id'])+'\n')
          print('PASS exact successful R131 run',run['id'])
          PY

      - name: V229R134 Download the intact R131 Pages artifact
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: ${{ steps.base.outputs.run_id }}
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V229R134 Verify the source, 2F artwork and original event coordinates
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          assert len(before)==5566,('Unexpected R131 file count',len(before))
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          data=root/'knight/gameasync/Data'
          expected={
            'Map045.rxdata':'f47de87af6b4e607bf632818a711619dc8ca4e747196a123a76ac7db8ffc3ba6',
            'Map046.rxdata':'dc89d908f5247442e08dddc11f5bcf6505a77890bd82ab59b790e00e3e5f024c'}
          for filename,sha in expected.items():
            path=data/(prefix+filename)
            assert hashlib.sha256(path.read_bytes()).hexdigest()==sha,('Map source mismatch',filename)
          assert 'V229R131' in (root/'index.html').read_text('utf8')
          assert 'V229R131' in (root/'knight/index.html').read_text('utf8')
          assert (data/'Scripts.rxdata').is_file()
          assert (data/(prefix+'Map029.rxdata')).is_file()
          assert (root/'knight/gameasync/Graphics/Characters/바포메트.png').is_file()
          Path('build/before.json').write_text(json.dumps(before,sort_keys=True),encoding='utf8')
          print('PASS R131 map data, original events and smoke-cleaned 2F images kept')
          PY

      - name: V229R134 Remove only the native lookup inverse adjustment
        shell: bash
        run: |
          set -euo pipefail
          cat > build/remove_inverse.rb <<'RUBY'
          require 'zlib'
          path=ARGV.fetch(0)
          scripts=Marshal.load(File.binread(path))
          original=Marshal.load(File.binread(path))
          raise 'Unexpected script count' unless scripts.length==136
          source=Zlib::Inflate.inflate(scripts[134][2])
          inverse="    if mid==45 || mid==46\n      native_u-=12\n      native_v-=6\n    end\n"
          raise 'Wrong inverse lookup baseline' unless source.scan(inverse).length==1
          raise 'Original projection missing' unless source.include?(
            "if mid==45 || mid==46\n      px+=12\n      py+=6\n    end")
          raise 'Original R111 respawn missing' unless source.include?('module SLTI_R111Respawn')
          raise 'Original boss code missing' unless source.include?('module SLV230BossRespawn')
          raise 'Original nearest lookup missing' unless source.include?('def self.nearest(mid,rx,ry,radius=16)')
          modified=source.sub(inverse,'')
          raise 'Unexpected replacement' unless modified.length==source.length-inverse.length
          raise 'Projection changed' unless modified.include?(
            "if mid==45 || mid==46\n      px+=12\n      py+=6\n    end")
          scripts[134][2]=Zlib::Deflate.deflate(modified)
          scripts.each_with_index do |item,index|
            next if index==134
            raise "Unapproved script change #{index}" unless item==original[index]
          end
          File.binwrite(path,Marshal.dump(scripts))
          File.binwrite('build/script134-r134-pre.rb',modified)
          puts 'PASS only nearest() inverse -12,-6 removed; map45/46 display projection unchanged'
          RUBY
          ruby -c build/remove_inverse.rb
          ruby build/remove_inverse.rb site/knight/gameasync/Data/Scripts.rxdata
          ruby -c build/script134-r134-pre.rb

      - name: V229R134 Restore R94 original 4-way passage on floors 1 and 2
        shell: bash
        run: |
          set -euo pipefail
          cat > build/restore_r94.rb <<'RUBY'
          # encoding: UTF-8
          RESTORE=<<'R94_PASSAGE'
          module SLTI_Native66
            def self.edge?(mid,x,y,dx,dy)
              return false unless dx.abs+dy.abs==1
              b=dx>0 ? 8 : dx<0 ? 4 : dy>0 ? 2 : 1
              reverse=dx>0 ? 4 : dx<0 ? 8 : dy>0 ? 1 : 2
              return (value(mid,x,y)&b)!=0 && (value(mid,x+dx,y+dy)&reverse)!=0
            end
          end

          # Original native wall-base edges.
          class Game_Map
            alias slti_native66_original_passable passable?
            def passable?(x,y,d,self_event=nil)
              if SLTI_Native66.active_map?(@map_id) && (d==2 || d==4 || d==6 || d==8)
                cell=SLTI_Native66.nearest(@map_id,x,y,16)
                return false if cell==nil
                return SLTI_Native66.native_target(@map_id,cell[0],cell[1],d)!=nil
              end
              slti_native66_original_passable(x,y,d,self_event)
            end
          end

          # R94 source: 419 corners, 32 bridges, one manual edge.
          module SLTI_V229R97Corner
            DELTA={2=>[-1,1],4=>[-1,-1],6=>[1,1],8=>[1,-1]}.freeze
            BIT={2=>1,4=>2,6=>4,8=>8}.freeze
            OPPOSITE={2=>8,4=>6,6=>4,8=>2}.freeze
            data=''.unpack('m')[0].unpack('C*')
            MASKS={}
            i=0
            while i<data.length
              MASKS[[32576+data[i],32704+data[i+1]]]=data[i+2]
              i+=3
            end
            MASKS.freeze
          end

          module SLTI_Native66
            def self.walkable?(mid,x,y)
              value(mid,x,y)!=0
            end

            def self.continuous_path?(mid,x,y,dx,dy)
              tx=x+dx
              ty=y+dy
              return false unless walkable?(mid,x,y) && walkable?(mid,tx,ty)
              if dx==0 || dy==0
                return true
              end
              return true if walkable?(mid,x+dx,y)
              return true if walkable?(mid,x,y+dy)
              return false
            end

            def self.move_path?(mid,x,y,dx,dy)
              if dx==0 || dy==0
                return true if edge?(mid,x,y,dx,dy)
                return continuous_path?(mid,x,y,dx,dy)
              end
              return false unless dx.abs==1 && dy.abs==1
              return true if edge?(mid,x,y,dx,0) && edge?(mid,x+dx,y,0,dy)
              return true if edge?(mid,x,y,0,dy) && edge?(mid,x,y+dy,dx,0)
              return continuous_path?(mid,x,y,dx,dy)
            end

            def self.native_target(mid,x,y,dir)
              moves={
                2=>[-1,1], 4=>[-1,-1], 6=>[1,1], 8=>[1,-1],
                1=>[-1,0], 3=>[0,1], 7=>[0,-1], 9=>[1,0]
              }
              d=moves[dir]
              if d==nil
                nil
              else
                dx,dy=d
                if mid!=45 || !SLTI_V229R97Corner::DELTA.key?(dir)
                  move_path?(mid,x,y,dx,dy) ? [x+dx,y+dy] : nil
                else
                  tx=x+dx
                  ty=y+dy
                  cuts=SLTI_V229R97Corner::MASKS
                  from=cuts[[x,y]]
                  into=cuts[[tx,ty]]
                  if from==nil && into==nil
                    move_path?(mid,x,y,dx,dy) ? [tx,ty] : nil
                  elsif from!=nil && into!=nil
                    nil
                  elsif from!=nil
                    bits=SLTI_V229R97Corner::BIT
                    ((from & bits.fetch(dir))!=0 && value(mid,tx,ty)!=0) ? [tx,ty] : nil
                  else
                    bits=SLTI_V229R97Corner::BIT
                    opposite=SLTI_V229R97Corner::OPPOSITE
                    ((into & bits.fetch(opposite.fetch(dir)))!=0 && value(mid,x,y)!=0) ? [tx,ty] : nil
                  end
                end
              end
            end
          end
          R94_PASSAGE
          EXPECTED_RESTORE_SHA='b601f95db96de2ce1e80445708d6134982dcbd6aec4d284e8044023947c677f6'
          require 'zlib'
          require 'digest'
          path=ARGV.fetch(0)
          archive=Marshal.load(File.binread(path))
          original=Marshal.load(File.binread(path))
          raise 'Unexpected script count' unless archive.length==136
          source=Zlib::Inflate.inflate(archive[134][2])
          raise 'R94 code unexpectedly already present' if source.include?('SLTI_V229R97Corner') || source.include?('slti_native66_original_passable')
          raise 'R133 inverse removal not present' if source.include?("native_u-=12") || source.include?("native_v-=6")
          raise 'Existing native S32 source missing' unless source.include?('module SLTI_Native66')
          raise 'Existing +12,+6 projection missing' unless source.include?("if mid==45 || mid==46\n      px+=12\n      py+=6")
          raise 'Existing monster respawn missing' unless source.include?('module SLTI_R111Respawn')
          raise 'Existing boss respawn missing' unless source.include?('module SLV230BossRespawn')
          raise 'R94 legacy block is not exact' unless Digest::SHA256.hexdigest(RESTORE)==EXPECTED_RESTORE_SHA
          mask_data=RESTORE.match(/data='([A-Za-z0-9+\/=]+)'\.unpack/)
          raise 'R94 masks unavailable' unless mask_data
          raise 'Unexpected R94 452 masks' unless Digest::SHA256.hexdigest(mask_data[1].unpack('m')[0]) == '9ea6dffb96e7afeee9526b36df2a0719bda5f729a11fde09489be90f893e668a'
          modified=source+"\n"+RESTORE
          archive[134][2]=Zlib::Deflate.deflate(modified)
          archive.each_with_index do |item,i|
            next if i==134
            raise "Unapproved script change #{i}" unless item==original[i]
          end
          File.binwrite(path,Marshal.dump(archive))
          File.binwrite('build/script134-r134.rb',modified)
          source_native=source[source.index('module SLTI_Native66')...source.index('# V229R111:')]
          eval(source_native,TOPLEVEL_BINDING,'source-native.rb')
          class Game_Map; def passable?(*args); true; end; end
          eval(RESTORE,TOPLEVEL_BINDING,'restored-r94.rb')
          expected={45=>['92b5cf7c1c89ae4b88f80e70ba56c851d1913df4b9b40f5ecae9ce7fbe893b53',65536,5957],
                    46=>['01b211b563d76bc27838e221c356e5a4be909fbc35af22bf224869105fb8bd68',81920,11685]}
          expected.each do |mid,(sha,size,open)|
            raw=SLTI_Native66::EDGES[mid]
            raise "Wrong original S32 data: #{mid}" unless raw.bytesize==size && Digest::SHA256.hexdigest(raw)==sha
            actual=raw.bytes.count{|v|v!=0 && v!=255}
            raise "Wrong original S32 walkable cells: #{mid}" unless actual==open
          end
          raise 'Original R94 direction count wrong' unless SLTI_V229R97Corner::MASKS.length==452
          raise 'R94 designated opening missing' unless SLTI_V229R97Corner::MASKS[[32655,32806]]==12
          raise 'R94 corner changed' unless SLTI_V229R97Corner::MASKS[[32657,32805]]==3
          raise '1F render alignment changed' unless SLTI_Native66.project(45,32655,32806)==[1416,1290]
          raise '2F render alignment changed' unless SLTI_Native66.project(46,32655,32806)==[1416,1674]
          raise 'R94 native target missing' unless SLTI_Native66.respond_to?(:native_target)
          puts 'PASS original HTML S32 grids 5957/11685, exactly 452 R94 directional masks'
          puts 'PASS 1F and 2F original +12,+6 screen projection unchanged; no duplicated shift'
          puts 'PASS only script134 passage restoration; original player/monster spawns, Baphomet and art unchanged'
          RUBY
          ruby -c build/restore_r94.rb
          ruby build/restore_r94.rb site/knight/gameasync/Data/Scripts.rxdata
          ruby -c build/script134-r134.rb

      - name: V229R134 Refresh script cache and verify no other game changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'AUDIT'
          from pathlib import Path
          import hashlib,json,re
          root=Path('site')
          script=root/'knight/gameasync/Data/Scripts.rxdata'
          mapping=root/'knight/gameasync/mapping.js'
          text=mapping.read_text('utf8')
          pattern=r'(Data/Scripts\.rxdata\?h=)[0-9a-f]{32}'
          text,count=re.subn(pattern,lambda m:m.group(1)+hashlib.md5(script.read_bytes()).hexdigest(),text)
          assert count==1,('Missing script cache entry',count)
          mapping.write_text(text,encoding='utf8')
          for name in ('index.html','knight/index.html'):
            path=root/name
            content=path.read_text('utf8')
            assert 'V229R131' in content and 'V229R134' not in content
            path.write_text(content.replace('V229R131','V229R134').replace('v229r131','v229r134'),encoding='utf8')
          runtime=root/'knight/js/sl-assets-v229r115.js'
          content=runtime.read_text('utf8')
          assert content.count("var version='V229R131';")==1
          runtime.write_text(content.replace("var version='V229R131';","var version='V229R134';"),encoding='utf8')
          assert 'js/sl-assets-v229r115.js?v=v229r134' in (root/'knight/index.html').read_text('utf8')
          before=json.loads(Path('build/before.json').read_text('utf8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert before.keys()==after.keys() and len(after)==5566
          changed={name for name in before if before[name]!=after[name]}
          expected={'index.html','knight/index.html','knight/gameasync/mapping.js',
                    'knight/gameasync/Data/Scripts.rxdata','knight/js/sl-assets-v229r115.js'}
          assert changed==expected,('Unexpected source modifications',sorted(changed^expected))
          for name in before:
            if (name.startswith('knight/gameasync/Graphics/') or
                name.startswith('knight/assets/') or
                (name.startswith('knight/gameasync/Data/') and name not in expected) or
                name in ('knight/js/dpad.js','knight/js/drive.js')):
              assert before[name]==after[name],('Protected content modified',name)
          print('PASS exactly 5 changed files: script, mapping cache, two HTML versions and version JS')
          print('PASS original spawn coordinates, Baphomet, R94 S32 directional passages and 2F artwork preserved')
          AUDIT
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/dpad.js
          node --check site/knight/js/drive.js

      - name: V229R134 Publish original maps with HTML-matched native 4-way passages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
