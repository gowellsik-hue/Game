      - name: Connect direct name input
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl417-name.js <<'JAVASCRIPT'
          (function(){
            'use strict';

            let field=null;
            let form=null;
            let file=null;
            let rect=null;
            let composing=false;
            let submitted=false;

            function layout(){

              if(!field)return;

              const c=document.getElementById('canvas').getBoundingClientRect();

              const [x,y,w,h]=rect;
              const sx=c.width/800;
              const sy=c.height/600;

              Object.assign(form.style,{
                left:(c.left+x*sx)+'px',
                top:(c.top+y*sy)+'px',
                width:(w*sx)+'px',
                height:(h*sy)+'px'
              });

              field.style.fontSize=Math.max(16,12*sy)+'px';
            }

            function send(flag){

              if(!field||composing||submitted)return;

              try{

                const value=flag+'\n'+field.value;

                FS.writeFile(
                  file,
                  new TextEncoder().encode(value)
                );

                if(
                  FS.readFile(file,{encoding:'utf8'})!==value
                ){
                  throw Error('Input write mismatch');
                }

                submitted=flag==='1';

                field.setCustomValidity('');

              }catch(e){

                console.error('SL417_NAME_WRITE',e);

                field.setCustomValidity(
                  '이름 입력 전달 오류'
                );

                field.reportValidity();
              }
            }

            function close(){

              if(form)form.remove();

              try{
                if(file&&FS.analyzePath(file).exists){
                  FS.unlink(file);
                }
              }catch(e){
                console.error(e);
              }

              field=form=file=rect=null;
              composing=submitted=false;

              document.getElementById('canvas').focus({
                preventScroll:true
              });
            }

            function open(p){

              if(field)return;

              rect=p.slice(2,6).map(Number);
              file=p.slice(7).join('|');

              if(
                rect.some(v=>!Number.isFinite(v)) ||
                !file ||
                FS.readFile(file,{encoding:'utf8'})!=='0\n'
              ){
                throw Error('Name input initialization');
              }

              form=document.createElement('form');
              field=document.createElement('input');

              field.id='sl417-name';
              field.type='text';
              field.inputMode='text';
              field.enterKeyHint='done';
              field.maxLength=Number(p[6]);
              field.autocomplete='off';
              field.spellcheck=false;

              field.setAttribute(
                'aria-label',
                '캐릭터 이름'
              );

              field.setAttribute(
                'autocapitalize',
                'off'
              );

              form.style.cssText=
                'position:fixed;'+
                'z-index:2147483647;'+
                'margin:0;padding:0;'+
                'pointer-events:auto;';

              field.style.cssText=
                'display:block;'+
                'width:100%;height:100%;'+
                'box-sizing:border-box;'+
                'border:1px solid #b5b5b5;'+
                'border-radius:0;'+
                'background:rgba(0,0,0,.55);'+
                'color:#fff;caret-color:#fff;'+
                'font-family:SL417Nanum,sans-serif;'+
                'outline:none;padding:0 6px;'+
                'user-select:text;'+
                '-webkit-user-select:text;'+
                'touch-action:manipulation;'+
                'pointer-events:auto;';

              form.addEventListener('submit',e=>{
                e.preventDefault();
                send('1');
              });

              field.addEventListener(
                'input',
                ()=>send('0')
              );

              field.addEventListener(
                'compositionstart',
                ()=>{composing=true;}
              );

              field.addEventListener(
                'compositionend',
                ()=>{
                  composing=false;
                  send('0');
                }
              );

              [
                'pointerdown',
                'pointerup',
                'mousedown',
                'mouseup',
                'click',
                'touchstart',
                'touchend'
              ].forEach(t=>{
                field.addEventListener(
                  t,
                  e=>e.stopPropagation()
                );
              });

              form.append(field);

              document.getElementById('main').append(form);

              layout();

              field.focus({preventScroll:true});
            }

            [
              'keydown',
              'keyup',
              'keypress'
            ].forEach(t=>{

              window.addEventListener(t,e=>{

                if(!field||e.target!==field)return;

                if(
                  t==='keydown' &&
                  e.key==='Enter' &&
                  !composing &&
                  !e.isComposing &&
                  e.keyCode!==229
                ){
                  e.preventDefault();
                  send('1');
                }

                e.stopImmediatePropagation();

              },true);
            });

            const resize=()=>requestAnimationFrame(layout);

            window.addEventListener(
              'resize',
              resize
            );

            document.addEventListener(
              'fullscreenchange',
              resize
            );

            if(window.visualViewport){

              visualViewport.addEventListener(
                'resize',
                resize
              );

              visualViewport.addEventListener(
                'scroll',
                resize
              );
            }

            window.sl417NameMessage=function(text){

              const s=String(text).trim();

              try{

                if(s.startsWith('SL417|NAME|')){

                  open(s.split('|'));

                }else if(s==='SL417|NAME_CLOSE'&&field){

                  close();

                }else if(s==='SL417|NAME_RETRY'&&field){

                  submitted=false;

                  field.focus({preventScroll:true});
                }

              }catch(e){

                console.error('SL417_NAME_ERROR',e);
              }
            };
          })();
          JAVASCRIPT

