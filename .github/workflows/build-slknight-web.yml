
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R55
# BASE: R52 deployed game, run 39743709979; preserves V230 V5.41-v2 491 EVs.
# FIX: remove R52 Game_Event and Interpreter runtime method aliases.
# Modify the original Game_Event.refresh and Interpreter commands in place.
# Original Game_Event.initialize/super chain is untouched, fixing the likely
# mruby "self has wrong type to call super in this context" alias regression.
# Keep 491 EV stats, maps, graphics, wall layers, TI 106 monsters and drops.
# No new game input data files; no map or common-event modifications.
name: build-slknight-web.yml | V229R55 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R55 Restore complete R52 original game and 491EV balance
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39743709979
          name: github-pages
          github-token: ${{ github.token }}
          path: r52

      - name: V229R55 Verify source and create exact-file baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s r52/artifact.tar
          tar -xf r52/artifact.tar -C site
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          pre='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          scripts=root/'knight/gameasync/Data/Scripts.rxdata'
          sha='1692894165d623508c560a537bbcb0d66b9886b7e070b461878ec563353c9644'
          assert hashlib.sha256(scripts.read_bytes()).hexdigest()==sha,'Unexpected R52 scripts'
          for name in ('index.html','knight/index.html'):
              assert 'V229R52' in (root/name).read_text('utf-8'),name
          for mid in (43,44,45,46):
              assert (root/(pre+f'Map{mid:03d}.rxdata')).is_file(),mid
          base={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                for p in root.rglob('*') if p.is_file()}
          assert len(base)==5517,len(base)
          Path('build/r55-baseline.json').write_text(json.dumps(base,sort_keys=True))
          print('PASS: 5517 exact R52 game assets, 491EV balance and TI files verified')
          PY_BASE

      - name: V229R55 Remove alias regression and patch native Ruby methods
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r55_patch.rb <<'R55_PATCH'
          require 'zlib'
          require 'digest'
          require 'json'
          ROOT=ARGV.fetch(0)
          REPORT=ARGV.fetch(1)
          path=File.join(ROOT,'knight/gameasync/Data/Scripts.rxdata')
          expected='1692894165d623508c560a537bbcb0d66b9886b7e070b461878ec563353c9644'
          raise 'Incorrect R52 baseline' unless Digest::SHA256.file(path).hexdigest==expected
          scripts=Marshal.load(File.binread(path))
          raise 'Unexpected script count' unless scripts.size==136
          before=Marshal.load(File.binread(path))
          change={}
          get=lambda{|i| Zlib::Inflate.inflate(scripts[i][2]).dup.force_encoding('UTF-8')}
          set=lambda{|i,s| scripts[i][2]=Zlib::Deflate.deflate(s.b); change[i]=true}
          assert_replace=lambda do |source,old,new,label|
            n=source.scan(old).size
            raise "#{label}: expected 1, found #{n}" unless n==1
            source.sub(old,new)
          end
          # Remove the appended class aliases altogether. They are not needed for rewards.
          runtime=get.call(134)
          marker='# V229R52: V230 V5.41-v2 authoritative'
          raise 'Missing R52 runtime' unless runtime.include?(marker) && runtime.include?('module SLV541')
          cut="\nclass Game_Event\n  alias slv541_original_initialize initialize\n"
          raise 'Unexpected R52 reward wrappers' unless runtime.scan(cut).size==1
          pre,post=runtime.split(cut,2)
          raise 'Incomplete R52 wrappers' unless post.include?('alias slv541_original_refresh refresh') && post.include?('alias slv541_original_variable_command command_122') && post.include?('alias slv541_original_gold_command command_125') && post.include?('alias slv541_original_exp_command command_315') && post.end_with?("  end\nend\n")
          raise 'R49 event constructor missing' unless pre.include?('alias slti_r49_original_initialize initialize')
          observer=<<'OBSERVER'

          # R55: reward check is called by the ORIGINAL Game_Event#refresh (script 26).
          # No Game_Event initializer, refresh, or Interpreter aliases are installed here.
          module SLV541
            def self.observe(event)
              mid=event.instance_variable_get(:@map_id)
              eid=event.instance_variable_get(:@id)
              info=stat(mid,eid)
              return if info==nil || $game_variables==nil
              maxhp=info[4]
              hpvar=info[6]
              if $game_variables[hpvar].to_i<maxhp
                event.instance_variable_set(:@slv541_saw_live,true)
                event.instance_variable_set(:@slv541_rewarded,false)
                return
              end
              return unless event.instance_variable_get(:@slv541_saw_live)==true
              return if event.instance_variable_get(:@slv541_rewarded)==true
              source=event.instance_variable_get(:@event)
              death=source.pages[info[5]] if source!=nil
              return if death==nil
              return unless event.instance_variable_get(:@page).equal?(death)
              event.instance_variable_set(:@slv541_rewarded,true)
              pay(event,info)
            end
          end
          OBSERVER
          runtime=(pre+observer).sub(marker,'# V229R55: V230 V5.41-v2 authoritative')
          raise 'R55 still adds class aliases' if runtime.include?('alias slv541_original_')
          # R52 literal reward data preserved byte-for-byte.
          olddata=get.call(134)[/  DATA=.*\n/]
          raise 'Reward data damaged' unless runtime[/  DATA=.*\n/]==olddata
          set.call(134,runtime)
          # Modify existing RGSS methods IN PLACE, not by aliasing a method that calls super.
          s26=get.call(26)
          s26=assert_replace.call(s26,"    if new_page == @page\r\n","    if new_page == @page\r\n      SLV541.observe(self) if defined?(SLV541)\r\n",'Event refresh early return')
          s26=assert_replace.call(s26,"      @interpreter = nil\r\n      # \uBA54\uC18C\uB4DC \uC885\uB8CC\r\n      return\r\n", "      @interpreter = nil\r\n      # \uBA54\uC18C\uB4DC \uC885\uB8CC\r\n      SLV541.observe(self) if defined?(SLV541)\r\n      return\r\n",'Event refresh nil-page return')
          s26=assert_replace.call(s26,"    check_event_trigger_auto\r\n  end\r\n","    check_event_trigger_auto\r\n    SLV541.observe(self) if defined?(SLV541)\r\n  end\r\n",'Event refresh normal return')
          raise 'Original Game_Event initialize/super changed' unless s26.include?("  def initialize(map_id, event)\r\n    super()\r\n")
          set.call(26,s26)
          s72=get.call(72)
          {122=>"    return true if defined?(SLV541) && SLV541.rewarded?(@map_id,@event_id) && (@parameters[0]==333 || @parameters[0]==1926)\r\n",125=>"    return true if defined?(SLV541) && SLV541.rewarded?(@map_id,@event_id)\r\n"}.each do |n,body|
            tag="  def command_#{n}\r\n"
            s72=assert_replace.call(s72,tag,tag+body,"Interpreter command_#{n}")
          end
          set.call(72,s72)
          s74=get.call(74)
          tag="  def command_315\r\n"
          s74=assert_replace.call(s74,tag,tag+"    return true if defined?(SLV541) && SLV541.rewarded?(@map_id,@event_id)\r\n",'Interpreter command_315')
          set.call(74,s74)
          raise 'Unexpected changed script indexes' unless change.keys.sort==[26,72,74,134]
          raise 'Unexpected script array modifications' unless scripts.each_index.all?{|i|change[i] || scripts[i]==before[i]}
          File.binwrite(path,Marshal.dump(scripts))
          [26,72,74,134].each{|i| File.binwrite(File.join(REPORT,"r55-script#{i}.rb"),get.call(i))}
          report={version:'V229R55',source_sha:expected,changed_script_indexes:change.keys.sort,removed_wrappers:['Game_Event#initialize','Game_Event#refresh','Interpreter#command_122','Interpreter#command_125','Interpreter#command_315'],original_game_event_super_preserved:true,all_491_reward_data_unchanged:true,map_files_modified:false}
          File.write(File.join(REPORT,'r55-fix.json'),JSON.pretty_generate(report))
          puts 'PASS: reward data unchanged; four original Ruby methods patched in place; no R52 aliases remain'
          R55_PATCH
          ruby -c /tmp/r55_patch.rb
          ruby /tmp/r55_patch.rb site build
          ruby -e 's=File.read("build/r55-script134.rb");File.write("build/r55-runtime.rb",s[s.index("# V229R55:")..-1])'
          for index in 26 72 74 134; do
            ruby -c "build/r55-script${index}.rb"
          done
          ruby -c build/r55-runtime.rb

      - name: V229R55 Run 491EV real Game Event and Interpreter regression
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r55_test.rb <<'R55_TEST'
          require 'json'
          module RPG
           class Map;end;class MapInfo;end;class AudioFile;end;class Tileset;end;class CommonEvent;end
           class Event;class Page;class Condition;end;class Graphic;end;end;end
           class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          [RPG::Event,RPG::Event::Page,RPG::Event::Page::Condition,RPG::Event::Page::Graphic].each do |klass|
           klass.class_eval do
            def method_missing(m,*a)
             key='@'+m.to_s
             return instance_variable_get(key) if a.empty? && instance_variable_defined?(key)
             super
            end
           end
          end
          class Table
           def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
           def _dump(d=0);@raw;end
          end
          class Tone
           def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
           def _dump(d=0);@raw;end
          end
          class Color<Tone;end
          class Game_Character
           attr_accessor :x,:y
           def initialize;@x=0;@y=0;@move_route_forcing=false;@original_direction=2;@original_pattern=0;end
           def moveto(x,y);@x=x;@y=y;end
          end
          class Interpreter;end
          class MockParty
           attr_accessor :gold
           def initialize;@gold=0;end
           def gain_gold(n);@gold+=n;end
          end
          class Actor
           attr_accessor :exp
           def initialize;@exp=0;end
          end
          class MapMock
           attr_accessor :map_id,:events
           def initialize(id);@map_id=id;@events={};end
          end
          $game_player=Game_Character.new;$game_player.x=-1000;$game_player.y=-1000
          $game_party=MockParty.new;$game_actors={1=>Actor.new}
          $game_variables=Hash.new(0);$game_switches=Hash.new(false);$game_self_switches=Hash.new(false);$game_map=MapMock.new(2)
          [26,72,74].each{|i| load File.join(ENV.fetch('R55_BUILD'),"r55-script#{i}.rb")}
          load File.join(ENV.fetch('R55_BUILD'),"r55-runtime.rb")
          raise 'Unexpected R52 initialization alias' if Game_Event.instance_methods(false).include?(:slv541_original_initialize)
          raise 'Unexpected R52 refresh alias' if Game_Event.instance_methods(false).include?(:slv541_original_refresh)
          raise 'Unexpected R52 CE alias' if Interpreter.instance_methods(false).include?(:slv541_original_gold_command)
          records=SLV541::DATA.flat_map do |mid,mobs|
           mobs.map do |id,s|
            row=Array.new(18)
            row[0]=mid;row[1]=id;row[2]='EV'+id.to_s
            row[13]=s[0];row[14]=s[1];row[15]=s[2];row[16]=s[3]
            row[17]=(s[0]==0 && s[1]==0) ? 'Nonhunt' : 'Normal'
            row
           end
          end
          root=ARGV.fetch(0);pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          count=0;missing=[];paid=0;cases=0;gold_rng=0
          records.group_by{|r|r[0]}.each do |mid,items|
           m=Marshal.load(File.binread(File.join(root,'knight/gameasync/Data',pre+format('Map%03d.rxdata',mid))))
           $game_map=MapMock.new(mid);$game_variables=Hash.new(0);$game_switches=Hash.new(false);$game_self_switches=Hash.new(false)
           items.each do |r|
            id=r[1];name=r[2];xp=r[13];cash=r[14];low=r[15];high=r[16];cls=r[17]
            event=m.instance_variable_get(:@events)[id]
            beforeXP=$game_actors[1].exp;beforeMoney=$game_party.gold
            stat=SLV541.stat(mid,id)
            raise "Data mismatch #{mid}:#{id}" unless stat!=nil && stat[0]==xp && stat[1]==cash
            var=stat[6];maxhp=stat[4];pidx=stat[5]
            $game_variables[var]=0
            obj=Game_Event.new(mid,event)
            $game_map.events[id]=obj
            obj.refresh
            $game_variables[var]=maxhp
            obj.refresh
            if cls!='Nonhunt'
             if obj.instance_variable_get(:@slv541_rewarded) != true
              missing<<[mid,id,name,stat[5],obj.instance_variable_get(:@page).equal?(event.instance_variable_get(:@pages)[pidx])]
             else
              paid+=1
              deltaM=$game_party.gold-beforeMoney;deltaXP=$game_actors[1].exp-beforeXP
              raise "Wrong exp #{mid}:#{id} #{deltaXP}/#{xp}" unless deltaXP==xp
              if low!=nil
               raise "Boss gold outside range #{mid}:#{id} #{deltaM} #{low}..#{high}" unless (low..high).include?(deltaM)
               gold_rng+=1
              elsif stat[14]!=nil && stat[15]!=nil && cash>0
               nlo,nhi=stat[14],stat[15];den=nlo+nhi
               lower=(cash*2*nlo+den/2)/den;upper=(cash*2*nhi+den/2)/den
               raise "Normal gold ratio failed #{mid}:#{id}" unless (lower..upper).include?(deltaM)
               $native_tested=($native_tested||0)+1
              else
               raise "Fixed gold failed #{mid}:#{id} #{deltaM}/#{cash}" unless deltaM==cash
               $fixed_tested=($fixed_tested||0)+1 if cash>0
              end
              3.times{obj.refresh}
              i=Interpreter.new;i.instance_variable_set(:@event_id,id);i.instance_variable_set(:@map_id,mid)
              i.instance_variable_set(:@parameters,[0,0,1]);i.command_125
              i.instance_variable_set(:@parameters,[0,0,0,1]);i.command_315
              i.instance_variable_set(:@parameters,[333,333,0,2,200,400]);i.command_122
              i.instance_variable_set(:@parameters,[1926,1926,0,0,2501]);i.command_122
              raise "Old message wrong #{mid}:#{id}" unless $game_variables[333]==deltaM && $game_variables[1926]==xp
              raise "Duplicate payment #{mid}:#{id}" unless $game_party.gold==beforeMoney+deltaM && $game_actors[1].exp==beforeXP+xp
              cases+=1
              $game_variables[var]=0;obj.refresh
              $game_variables[var]=maxhp;obj.refresh
              raise "No repeat kill award #{mid}:#{id}" unless $game_actors[1].exp==beforeXP+xp*2
             end
            end
            $game_variables[var]=0;count+=1
           end
          end
          raise "Normal RNG coverage failure #{($native_tested||0)}/#{($fixed_tested||0)}" unless $native_tested==212 && $fixed_tested==162 && gold_rng==62
          puts "491 records #{count}; paid=#{paid}; tests=#{cases}; boss ranges #{gold_rng}; native normal RNG #{$native_tested}; no-native-money-RNG #{$fixed_tested}; failures=#{missing.length}"
          puts missing.take(50).inspect
          [[2,1],[41,2]].each do |mid,eid|
           stat=SLV541.stat(mid,eid)
           raise "Missing native RNG fixture #{mid}:#{eid}" if stat==nil || stat[14]==nil
           observed=[]
           60.times do
            before=$game_party.gold;SLV541.pay(nil,stat);observed<<$game_party.gold-before
           end
           raise "Normal RNG fixed #{mid}:#{eid}" unless observed.uniq.length>5
           puts "PASS native variable Adena #{mid}:#{eid} #{observed.uniq.length} distinct values"
          end
          # Save/load compatibility: a dead page loaded cold cannot award a phantom kill.
          mid=16;eid=1;stat=SLV541.stat(mid,eid)
          m=Marshal.load(File.binread(File.join(root,'knight/gameasync/Data',pre+format('Map%03d.rxdata',mid))))
          event=m.instance_variable_get(:@events)[eid]
          $game_map=MapMock.new(mid)
          $game_variables=Hash.new(0)
          $game_switches=Hash.new(false)
          $game_self_switches=Hash.new(false)
          var=stat[6];maxhp=stat[4]
          $game_variables[var]=maxhp
          beforeXP=$game_actors[1].exp;beforeMoney=$game_party.gold
          obj=Game_Event.new(mid,event)
          $game_map.events[eid]=obj
          obj.refresh
          raise 'Cold loaded death page paid without alive state' unless $game_actors[1].exp==beforeXP && $game_party.gold==beforeMoney
          $game_variables[var]=0;obj.refresh
          obj=Marshal.load(Marshal.dump(obj))
          $game_map.events[eid]=obj
          $game_variables[var]=maxhp;obj.refresh
          raise 'Saved alive mob failed after loading' unless $game_actors[1].exp==beforeXP+stat[0]
          obj=Marshal.load(Marshal.dump(obj))
          $game_map.events[eid]=obj
          3.times{obj.refresh}
          raise 'Loaded dead mob paid twice' unless $game_actors[1].exp==beforeXP+stat[0]
          puts 'PASS: cold save death, alive-save reload, and dead-save reload award guard'
          exit(missing.empty? && paid==490 ? 0:1)
          R55_TEST
          ruby -c /tmp/r55_test.rb
          R55_BUILD=build ruby /tmp/r55_test.rb site | tee build/r55-kill-regression.txt
          grep -q '491 records 491; paid=490; tests=490; boss ranges 62; native normal RNG 212; no-native-money-RNG 162; failures=0' build/r55-kill-regression.txt
          test "$(grep -c '^PASS native variable Adena' build/r55-kill-regression.txt)" -eq 2

      - name: V229R55 Refresh browser script hash and visible versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_MANIFEST'
          from pathlib import Path
          import re,hashlib
          root=Path('site')
          mapping=root/'knight/gameasync/mapping.js'
          scripts=root/'knight/gameasync/Data/Scripts.rxdata'
          text=mapping.read_text('utf-8')
          text,n=re.subn(r'Data/Scripts\.rxdata\?h=[0-9a-f]{32}',
                         lambda match:'Data/Scripts.rxdata?h='+hashlib.md5(scripts.read_bytes()).hexdigest(),text)
          assert n==1,'Scripts digest is missing or duplicated'
          mapping.write_text(text,encoding='utf-8')
          for name in ('index.html','knight/index.html'):
              f=root/name
              s=f.read_text('utf-8')
              assert 'V229R52' in s,name
              f.write_text(s.replace('V229R52','V229R55').replace('v229r52','v229r55'),encoding='utf-8')
          print('PASS: only scripts digest and exact visible version upgraded')
          PY_MANIFEST
          node --check site/knight/gameasync/mapping.js

      - name: V229R55 Verify all 5517 files and no monster-map edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before=json.loads(Path('build/r55-baseline.json').read_text('utf-8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert len(before)==len(after)==5517 and before.keys()==after.keys()
          modified={f for f in before if before[f]!=after[f]}
          allowed={'index.html','knight/index.html',
                   'knight/gameasync/mapping.js','knight/gameasync/Data/Scripts.rxdata'}
          assert modified==allowed,('Unexpected files modified',modified^allowed)
          report=json.loads(Path('build/r55-fix.json').read_text('utf-8'))
          assert report['changed_script_indexes']==[26,72,74,134]
          assert report['original_game_event_super_preserved']
          assert report['all_491_reward_data_unchanged']
          assert 'V229R55' in (root/'index.html').read_text('utf-8')
          assert 'V229R55' in (root/'knight/index.html').read_text('utf-8')
          print('PASS: only 4 web files changed; maps, loot, walls, 106 TI monsters intact')
          PY_FINAL

      - name: V229R55 Upload compatibility and 491EV regression report
        uses: actions/upload-artifact@v4
        with:
          name: SLKnight-V229R55-No-Event-Alias-491EV
          path: |
            build/r55-fix.json
            build/r55-kill-regression.txt
          retention-days: 30
          if-no-files-found: error

      - name: V229R55 Upload complete corrected game to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
