
name: build-slknight-web.yml | V1.28 | Healer Aggro, Teleport Reset, Holy Walk Buff Icon

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Restore pre-aggro V1.25 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 43041917380
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline
      - name: Verify exact V1.25 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build/v128/scripts_original build/v128/scripts_modified build/v128/death_pages
          tar -xf baseline/artifact.tar -C site
          cat > build/v128/precheck.py <<'PRECHECK'
          from pathlib import Path
          import hashlib,json,shutil,struct
          root=Path('site')
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(files)==5619, ('Wrong baseline',len(files))
          base=root/'knight/gameasync/Data/Scripts.rxdata'
          assert base.is_file()
          assert "var version='V1.25';" in (root/'knight/js/sl-assets-v229r115.js').read_text('utf8')
          assert 'SLKnight V1.25' in (root/'knight/index.html').read_text('utf8')
          for p,dims in [('홀리워크.png',(32,32)),('홀리워크버프.png',(38,37))]:
           f=root/'knight/gameasync/Graphics/Icons'/p
           assert struct.unpack('>II',f.read_bytes()[16:24])==dims
          shutil.copyfile(base,'build/v128/before_scripts.rxdata')
          Path('build/v128/before.json').write_text(json.dumps(files,ensure_ascii=False),encoding='utf8')
          print('PASS V1.25 pre-aggro deployed artifact, 5619 files')
          PRECHECK
          python3 build/v128/precheck.py
      - name: Patch original combat scripts and copy existing death events
        shell: bash
        run: |
          set -euo pipefail
          cat > build/v128/extract_scripts.rb <<'RUBY_EXTRACT'
          # encoding: UTF-8
          require 'zlib'
          input,dir = ARGV
          raise 'need input and dir' unless input && dir
          Dir.mkdir(dir) unless Dir.exist?(dir)
          scripts=Marshal.load(File.binread(input))
          raise 'Scripts count not 137' unless scripts.size==137
          scripts.each do |row|
            next unless row.is_a?(Array) && row[2].is_a?(String)
            name=row[1].to_s.dup.force_encoding('UTF-8')
            next unless %w[Game_Map Game_Event Game_Player Game_CommonEvent].include?(name) ||
              name.start_with?('Interpreter ') || name.start_with?('Game_Character ') || name == '버프,물약 이미지 출력'
            File.binwrite(File.join(dir,"#{name}.rb"),Zlib::Inflate.inflate(row[2]))
          end
          puts "Extracted #{Dir.glob(File.join(dir,'*.rb')).size} scripts"
          RUBY_EXTRACT
          ruby build/v128/extract_scripts.rb site/knight/gameasync/Data/Scripts.rxdata build/v128/scripts_original
          cat > build/v128/patch_v128.py <<'PY_PATCH'
          from pathlib import Path
          import subprocess
          R=Path('build/v128/scripts_original');O=Path('build/v128/scripts_modified');O.mkdir(parents=True,exist_ok=True)
          files={}
          for p in R.glob('*.rb'): files[p.name]=p.read_bytes().decode('utf-8')
          changed={}

          def once(s,b,a,label):
           k=s.count(b)
           if k!=1: raise ValueError(f'{label}: {k} matches')
           return s.replace(b,a,1)

          def method(s,begin,end,old,new,label):
           i=s.index(begin);j=s.index(end,i+len(begin));return s[:i]+once(s[i:j],old,new,label)+s[j:]

          def put(n,s):
           if files[n]==s: raise ValueError('unchanged '+n)
           changed[n]=s
           (O/n).write_bytes(s.encode('utf-8'))
           print(n,subprocess.run(['ruby','-c',str(O/n)],capture_output=True,text=True).stdout.strip())

          # Single cached map reference to existing healer event (no new object/AI).
          n='Game_Map.rb';s=files[n];s=once(s,'  def initialize','  attr_reader :sl_healer_event, :common_events\n  def initialize','Expose existing map references')
          s=once(s,'    # 코먼 이벤트의 데이터를 설정','    @sl_healer_event = @events.values.find { |e| e.instance_variable_get(:@event).name == \'[ID힐러 마법사]\' }\n    # 코먼 이벤트의 데이터를 설정','Healer cache once per map');put(n,s)

          n='Game_Event.rb';s=files[n];nl='\r\n' if '\r\n' in s else '\n'
          s=once(s,'    @event = event','    @event = event'+nl+'''    @sl_combat_event = @event.pages.any? do |page|
                page.trigger == 2 && page.list.any? do |command|
                  command.code == 111 && command.parameters == [11,13]
                end
              end'''.replace('\n',nl),'Only existing monster attack pages')
          # One branch: original target=player or existing healer, nil while teleported.
          anchor='  def check_event_trigger_touch(x, y)'
          helper='''  def sl_combat_target
              return $game_player unless @sl_combat_event && @trigger == 2
              return $game_player unless (@sl_target_actor_id && @sl_target_actor_id[0] == 3)
              healer = $game_map.sl_healer_event
              if $game_switches[185] && healer && !healer.transparent &&
                 !healer.instance_variable_get(:@sl_healer_teleport) &&
                 $game_actors[3] && $game_actors[3].hp > 0
                return healer
              end
              @sl_target_actor_id[0] = 0
              @sl_target_actor_id = nil
              nil
            end

          '''.replace('\n',nl)
          s=once(s,anchor,helper+anchor,'Existing monster player/healer object branch')
          for name,old in [('touch','    if @trigger == 2 and x == $game_player.x and y == $game_player.y'),('overlap','    if @trigger == 2 and @x == $game_player.x and @y == $game_player.y')]:
           if name=='touch':
            cp='''    @sl_target_actor_id = [1] if @sl_combat_event && @sl_target_actor_id.nil? &&
                x == $game_player.x && y == $game_player.y
              if @sl_combat_event && @sl_target_actor_id.nil? && $game_switches[185]
                healer = $game_map.sl_healer_event
                @sl_target_actor_id = [3] if healer && !healer.transparent &&
                  !healer.instance_variable_get(:@sl_healer_teleport) &&
                  $game_actors[3] && $game_actors[3].hp > 0 &&
                  x == healer.x && y == healer.y &&
                  (x != $game_player.x || y != $game_player.y)
              end
              target = sl_combat_target
              if @trigger == 2 && target && x == target.x && y == target.y'''
           else:
            cp='''    @sl_target_actor_id = [1] if @sl_combat_event && @sl_target_actor_id.nil? &&
                @x == $game_player.x && @y == $game_player.y
              if @sl_combat_event && @sl_target_actor_id.nil? && $game_switches[185]
                healer = $game_map.sl_healer_event
                @sl_target_actor_id = [3] if healer && !healer.transparent &&
                  !healer.instance_variable_get(:@sl_healer_teleport) &&
                  $game_actors[3] && $game_actors[3].hp > 0 &&
                  @x == healer.x && @y == healer.y &&
                  (@x != $game_player.x || @y != $game_player.y)
              end
              target = sl_combat_target
              if @trigger == 2 && target && @x == target.x && @y == target.y'''
           s=once(s,old,cp.replace('\n',nl),'Copy original '+name+' predicate')
          # When a parallel map attack page is set up, copy attached actor only (existing interpreter handles rest)
          old='        @interpreter.setup(@list, @event.id)'
          cp=old+nl+'        @interpreter.instance_variable_set(:@sl_attack_target, @sl_attack_target)'
          s=once(s,old,cp,'Parallel map attack target')
          s=once(s,'      @list = nil','      @list = nil'+nl+'      @sl_attack_target = nil','Clear parallel target when page ends')
          # Original healer has no self-switch A page. Clear cloned death page on valid rehire.
          old='    # 로컬 변수 new_page 를 초기화'
          cp='''    if @event.name == '[ID힐러 마법사]' && $game_switches[185] &&
                 $game_actors[3] && $game_actors[3].hp > 0
                $game_self_switches[[@map_id,@id,'A']] = false if $game_self_switches[[@map_id,@id,'A']]
              end
              # 로컬 변수 new_page 를 초기화'''.replace('\n',nl)
          s=once(s,old,cp,'Re-use existing healer on valid rehire')
          # Death: copied monster death page added separately to every existing healer event.
          old='  def update'+nl+'    super'
          cp='''  def update
              if @event.name == '[ID힐러 마법사]' && $game_switches[185] && $game_actors[3] &&
                 $game_actors[3].hp <= 0 &&
                 !$game_self_switches[[@map_id,@id,'A']]
                $game_self_switches[[@map_id,@id,'A']] = true
                $game_switches[185] = false
                $game_map.need_refresh = true
              end
              super'''.replace('\n',nl)
          s=once(s,old,cp,'Healer death branches to cloned monster death event');put(n,s)

          # Original chase movement is unchanged except selected coordinate object.
          n='Game_Character 3.rb';s=files[n];nl='\r\n' if '\r\n' in s else '\n'
          old='    sx = @x - $game_player.x'+nl+'    sy = @y - $game_player.y'
          cp='''    target = $game_player
              if self.is_a?(Game_Event) && @sl_combat_event && @trigger == 2
                healer = $game_map.sl_healer_event
                active = $game_switches[185] && healer && !healer.transparent &&
                         !healer.instance_variable_get(:@sl_healer_teleport) &&
                         $game_actors[3] && $game_actors[3].hp > 0
                if (@sl_target_actor_id && @sl_target_actor_id[0] == 3) && !active
                  @sl_target_actor_id[0] = 0
                  @sl_target_actor_id = nil
                  return
                end
                if @sl_target_actor_id.nil?
                  pd = (@x - $game_player.x).abs + (@y - $game_player.y).abs
                  hd = active ? (@x - healer.x).abs + (@y - healer.y).abs : nil
                  @sl_target_actor_id = [hd && hd < pd ? 3 : 1]
                end
                target = sl_combat_target
                return unless target
              end
              sx = @x - target.x
              sy = @y - target.y'''.replace('\n',nl)
          s=method(s,'  def move_toward_player','  def move_away_from_player',old,cp,'Existing chase with object branch')
          cp2='''    target = self.is_a?(Game_Event) && @sl_combat_event ? sl_combat_target : $game_player
              return unless target
              sx = @x - target.x
              sy = @y - target.y'''.replace('\n',nl)
          s=method(s,'  def turn_toward_player','  def turn_away_from_player',old,cp2,'Existing facing with same object branch')
          old='            @sl_healer_teleport = [tx, ty, Graphics.frame_count]'
          cp=old+nl+'''            $game_map.events.each_value do |event|
                        target = event.instance_variable_get(:@sl_target_actor_id)
                        if target && target[0] == 3
                          target[0] = 0
                          event.instance_variable_set(:@sl_target_actor_id, nil)
                        end
                      end'''.replace('\n',nl)
          s=once(s,old,cp,'Healer teleport invalidates original target references')
          put(n,s)

          # Original player touching a monster is the first acquisition, never steals existing healer target.
          n='Game_Player.rb';s=files[n];nl='\r\n' if '\r\n' in s else '\n'
          import re
          calls=0
          def mark_hero(match):
              global calls
              calls+=1
              indent=match.group(1)
              return (indent + 'if event.instance_variable_get(:@sl_combat_event) && event.instance_variable_get(:@sl_target_actor_id).nil?' + nl +
                      indent + '  event.instance_variable_set(:@sl_target_actor_id, [1])' + nl +
                      indent + 'end' + nl + indent + 'event.start')
          s=re.sub(r'(?m)^([ \t]*)event\.start(?=\r?$)',mark_hero,s)
          if calls != 4: raise ValueError(f'Game_Player starts {calls} != 4')
          put(n,s)

          # Existing interpreter carries just actor identity, no new attack queue or formula.
          n='Interpreter 1.rb';s=files[n];nl='\r\n' if '\r\n' in s else '\n'
          old='    @child_interpreter = nil          # 자 interpreter'
          s=once(s,old,old+nl+'    @sl_attack_target = nil','Clear actor when event ends')
          old='    # 파티 전체의 경우'
          cp='''    if (@sl_attack_target && @sl_attack_target[0] == 3) && (parameter == 1 || parameter == 0)
                healer = $game_map.sl_healer_event
                return unless $game_switches[185] && healer &&
                  !healer.transparent && !healer.instance_variable_get(:@sl_healer_teleport) &&
                  $game_actors[3] && $game_actors[3].hp > 0
                parameter = 3
              elsif (@sl_attack_target && @sl_attack_target[0] == 0)
                return
              end
              # 파티 전체의 경우'''.replace('\n',nl)
          s=method(s,'  def iterate_actor(parameter)','  def iterate_enemy(parameter)',old,cp,'Copy existing actor iterator with recipient branch')
          put(n,s)

          n='Interpreter 2.rb';s=files[n];nl='\r\n' if '\r\n' in s else '\n'
          old='      return $game_player'
          cp='''      if (@sl_attack_target && @sl_attack_target[0] == 3) || (@sl_attack_target && @sl_attack_target[0] == 0)
                  healer = $game_map.sl_healer_event
                  return healer if (@sl_attack_target && @sl_attack_target[0] == 3) &&
                    $game_switches[185] && healer && !healer.transparent &&
                    !healer.instance_variable_get(:@sl_healer_teleport) &&
                    $game_actors[3] && $game_actors[3].hp > 0
                  return nil
                end
                return $game_player'''.replace('\n',nl)
          s=method(s,'  def get_character(parameter)','  def operate_value(',old,cp,'Copied character target branch');put(n,s)

          n='Interpreter 3.rb';s=files[n];nl='\r\n' if '\r\n' in s else '\n'
          old='      @child_interpreter.setup(common_event.list, @event_id)'
          s=once(s,old,old+nl+'      @child_interpreter.instance_variable_set(:@sl_attack_target, @sl_attack_target)','Reuse child event context')
          old='      actor = $game_actors[@parameters[1]]'
          cp='      actor = $game_actors[(@sl_attack_target && @sl_attack_target[0] == 3) && @parameters[1] == 1 ? 3 : @parameters[1]]'
          s=method(s,'  def command_111','  def command_112',old,cp,'Original conditions use selected actor')
          put(n,s)

          n='Interpreter 4.rb';s=files[n];nl='\r\n' if '\r\n' in s else '\n'
          old='      $game_switches[i] = (@parameters[2] == 0)'
          cp='''      if @parameters[2] == 0 && !$game_switches[i] && @event_id.to_i > 0
                  source = $game_map.events[@event_id]
                  if source && source.instance_variable_get(:@sl_combat_event)
                    target = source.instance_variable_get(:@sl_target_actor_id) || [1]
                    $game_map.common_events.each_value do |common_event|
                      next unless common_event.trigger == 2 && common_event.switch_id == i
                      common_event.instance_variable_set(:@sl_attack_target, target)
                    end
                    $game_map.events.each_value do |event|
                      next unless event.trigger == 4 && event.instance_variable_get(:@page)
                      condition = event.instance_variable_get(:@page).condition
                      next unless (condition.switch1_valid && condition.switch1_id == i) ||
                        (condition.switch2_valid && condition.switch2_id == i)
                      event.instance_variable_set(:@sl_attack_target, target)
                    end
                  end
                end
                $game_switches[i] = (@parameters[2] == 0)'''.replace('\n',nl)
          s=method(s,'  def command_121','  def command_122',old,cp,'Use existing switch to carry actor target')
          old='      actor = $game_actors[@parameters[4]]'
          cp='      actor = $game_actors[(@sl_attack_target && @sl_attack_target[0] == 3) && @parameters[4] == 1 ? 3 : @parameters[4]]'
          s=method(s,'  def command_122','  def command_123',old,cp,'Copy original stats target branch');put(n,s)

          n='Game_CommonEvent.rb';s=files[n];nl='\r\n' if '\r\n' in s else '\n'
          old='        @interpreter.setup(self.list, 0)'
          s=once(s,old,old+nl+'        @interpreter.instance_variable_set(:@sl_attack_target, @sl_attack_target)','Reuse same common attack event')
          s=once(s,'    else'+nl+'      @interpreter = nil'+nl+'    end','    else'+nl+'      @interpreter = nil'+nl+'      @sl_attack_target = nil'+nl+'    end','Clear old common event attacker on switch off')
          put(n,s)

          n='버프,물약 이미지 출력.rb';s=files[n];nl='\r\n' if '\r\n' in s else '\n'
          old='    $Buf_23.bitmap = RPG::Cache.icon("홀리워크버프")'
          s=once(s,old,old+nl+'    $Buf_23.zoom_x = 32.0 / 38.0'+nl+'    $Buf_23.zoom_y = 32.0 / 37.0','Existing 623 display size');put(n,s)
          print('CHANGED',sorted(changed))
          PY_PATCH
          python3 build/v128/patch_v128.py
          cat > build/v128/assemble.rb <<'RUBY_ASSEMBLE'
          # encoding: UTF-8
          require 'zlib'
          base,modified_dir = ARGV
          raise 'Invalid output dir' unless File.directory?(modified_dir)
          scripts=Marshal.load(File.binread(base))
          raise "Unexpected script count #{scripts.size}" unless scripts.size==137
          changed=[]
          scripts.each do |row|
            next unless row.is_a?(Array) && row[2].is_a?(String)
            name=row[1].to_s.dup.force_encoding('UTF-8')
            path=File.join(modified_dir,"#{name}.rb")
            next unless File.file?(path)
            original=Zlib::Inflate.inflate(row[2]).force_encoding('UTF-8')
            modified=File.binread(path).force_encoding('UTF-8')
            raise "Not changed: #{name}" if original==modified
            raise "Invalid UTF8: #{name}" unless modified.valid_encoding?
            RubyVM::InstructionSequence.compile(modified)
            row[2]=Zlib::Deflate.deflate(modified.b)
            changed << name
          end
          expected=['Game_Map','Game_Event','Game_Player','Game_Character 3','Game_CommonEvent',
                    'Interpreter 1','Interpreter 2','Interpreter 3','Interpreter 4',
                    '버프,물약 이미지 출력']
          raise "Wrong modified scripts #{changed.inspect}" unless changed.sort==expected.sort
          File.binwrite(base,Marshal.dump(scripts))
          puts "PASS patched #{changed.size} original scripts and preserved #{137-changed.size} others"
          RUBY_ASSEMBLE
          ruby build/v128/assemble.rb site/knight/gameasync/Data/Scripts.rxdata build/v128/scripts_modified
          cat > build/v128/clone_death.rb <<'RUBY_DEATH'
          # encoding: UTF-8
          require 'fileutils'
          module RPG
            class Map; end
            class MapInfo; end
            class CommonEvent; end
            class Event
              class Page
                class Condition; end
                class Graphic; end
              end
            end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
            class AudioFile; end
            class Tileset; end
          end
          [Color = Class.new,Tone = Class.new,Table = Class.new].each do |klass|
            klass.define_singleton_method(:_load) { |raw| obj=allocate;obj.instance_variable_set(:@raw,raw);obj }
            klass.define_method(:_dump) { |_limit| @raw }
          end
          input_dir,output_dir=ARGV
          raise 'Requires map input and output folders' unless input_dir && output_dir
          FileUtils.mkdir_p(output_dir)
          pfx='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          map_paths=Dir.glob(File.join(input_dir,pfx+'Map[0-9][0-9][0-9].rxdata')).sort
          raise "Map count #{map_paths.size}" unless map_paths.size>=39
          bapho=Marshal.load(File.binread(File.join(input_dir,pfx+'Map016.rxdata')))
          source=bapho.instance_variable_get(:@events).fetch(6).instance_variable_get(:@pages).fetch(3)
          raise 'Death graphic mismatch' unless source.instance_variable_get(:@graphic).instance_variable_get(:@character_name).b=='바포메트죽음캐릭터'.b
          count=0;modified=[]
          map_paths.each do |p|
            map=Marshal.load(File.binread(p));touched=false
            map.instance_variable_get(:@events).each_value do |event|
              next unless event.instance_variable_get(:@name).to_s.b=='[ID힐러 마법사]'.b
              pages=event.instance_variable_get(:@pages)
              raise 'Healer already has death page' if pages.any?{|pg|c=pg.instance_variable_get(:@condition);c.instance_variable_get(:@self_switch_valid) && c.instance_variable_get(:@self_switch_ch)=='A'}
              page=Marshal.load(Marshal.dump(source))
              cond=page.instance_variable_get(:@condition)
              [:switch1_valid,:switch2_valid,:variable_valid].each{|name|cond.instance_variable_set("@#{name}",false)}
              cond.instance_variable_set(:@self_switch_valid,true)
              cond.instance_variable_set(:@self_switch_ch,'A')
              sequence=page.instance_variable_get(:@list).select{|cmd|[106,116,0].include?(cmd.instance_variable_get(:@code))}
              raise 'Death event sequence changed' unless sequence.map{|x|x.instance_variable_get(:@code)} == [106,116,0]
              page.instance_variable_set(:@list,sequence)
              pages << page
              count+=1;touched=true
            end
            if touched
              File.binwrite(File.join(output_dir,File.basename(p)),Marshal.dump(map))
              modified<<File.basename(p)
            end
          end
          raise "Death pages #{count} / 39 maps #{modified.size}/39" unless count==39 && modified.size==39
          puts "PASS: cloned 39 original Baphomet death event pages, 39 maps"
          RUBY_DEATH
          ruby build/v128/clone_death.rb site/knight/gameasync/Data build/v128/death_pages
          cp build/v128/death_pages/*.rxdata site/knight/gameasync/Data/
          cat > build/v128/version.py <<'PY_VERSION'
          from pathlib import Path
          import hashlib,re
          root=Path('site')
          p=root/'knight/gameasync/Data/Scripts.rxdata'
          m=root/'knight/gameasync/mapping.js'
          s=m.read_text('utf8');regex=re.compile(r'Data/Scripts\.rxdata\?h=[0-9a-f]{32}')
          assert len(regex.findall(s))==1
          m.write_text(regex.sub('Data/Scripts.rxdata?h='+hashlib.md5(p.read_bytes()).hexdigest(),s),encoding='utf8')
          for name in ['index.html','knight/index.html']:
           p=root/name;txt=p.read_text('utf8')
           assert 'V1.25' in txt
           txt=txt.replace('V1.25','V1.28').replace('v1.25','v1.28')
           p.write_text(txt,encoding='utf8')
          loader=root/'knight/js/sl-assets-v229r115.js'
          s=loader.read_text('utf8')
          assert s.count("var version='V1.25';")==1
          loader.write_text(s.replace("var version='V1.25';","var version='V1.28';"),encoding='utf8')
          print('PASS V1.28 assets mapping and version markers')
          PY_VERSION
          python3 build/v128/version.py
