
name: V229R8 | Six Skill Icon Slots and Aligned Dpad

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-slknight-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Try verified V229R7 Pages artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          repository: gowellsik-hue/Game
          run-id: 39050634920
          name: github-pages
          github-token: ${{ github.token }}
          path: previous

      - name: Restore game or recover published site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          if test -s previous/artifact.tar; then
            tar -xf previous/artifact.tar -C site
          else
            python3 - <<'PY_RECOVER'
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import hashlib, json, re, time
          base='https://gowellsik-hue.github.io/Game/'
          root=Path('site')
          fixed=('index.html','COPYING-mkxp-web.txt','manifest.webmanifest','mkxp.js','mkxp.wasm','js/drive.js','js/dpad.js','js/localforage.min.js')
          def get(url):
              for attempt in range(5):
                  try:
                      req=Request(url,headers={'User-Agent':'SLKnight-V229-R6','Accept-Encoding':'identity'})
                      with urlopen(req, timeout=75) as response:
                          return response.read()
                  except Exception:
                      if attempt==4: raise
                      time.sleep(attempt+1)
          files={'index.html':(base+'index.html',None)}
          for game in ('knight','elf'):
              for rel in fixed:
                  files[game+'/'+rel]=(base+game+'/'+quote(rel,safe='/'),None)
              mapping_name=game+'/gameasync/mapping.js'
              blob=get(base+mapping_name+'?recover=v229r6')
              p=root/mapping_name
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(blob)
              body=blob.decode('utf-8').split('var mappingArray = ',1)[1].split('];',1)[0]+']'
              for _,asset in json.loads(re.sub(r',\s*\]$',']',body)):
                  rel,sep,md5=asset.partition('?h=')
                  if '.' not in Path(rel).name: continue
                  if rel.startswith('/') or '..' in Path(rel).parts: raise RuntimeError('Unsafe asset path '+rel)
                  name=game+'/gameasync/'+rel
                  if name in files: raise RuntimeError('Duplicate asset '+name)
                  files[name]=(base+game+'/gameasync/'+quote(rel,safe='/')+('?h='+md5 if sep else ''),md5 if sep else None)
          if len(files)!=5354: raise RuntimeError('Unexpected total asset count '+str(len(files)))
          def fetch(item):
              name,(url,md5)=item
              data=get(url)
              if md5 and Path(name).name not in ('mapping.js','bitmap-map.js'):
                  if hashlib.md5(data).hexdigest()!=md5: raise RuntimeError('Asset checksum mismatch '+name)
              p=root/name
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(data)
          with ThreadPoolExecutor(max_workers=12) as pool:
              jobs=[pool.submit(fetch,item) for item in files.items() if not (root/item[0]).is_file()]
              for job in as_completed(jobs): job.result()
          actual={str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}
          if actual!=set(files): raise RuntimeError('Incomplete published game recovery')
          print('RESTORED_5354_PUBLISHED_ASSETS')
          PY_RECOVER
          fi

      - name: Verify current game version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_SOURCE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if len(files)!=5354:raise SystemExit('Wrong game file count '+str(len(files)))
          expected=json.loads('{"knight/js/dpad.js":["ad6140d7ba7e39f87f81244812b41dcb6b1baff2eb89eb42e797e728a8449a2b","1221aa34b2a2a110de039294a8f5a03e6c688cb42100bde798b5f43a0ef6d7c3"],"knight/gameasync/Data/Scripts.rxdata":["67d0ae5bdebf1002907cc1edc2a166c54971731059979c4b0253a7565ddc1495","5483f2541b3ac52ce4f7adb02323ee9b97ddb7ab4fddd37da352f5c31be9a4c2"],"knight/gameasync/mapping.js":["c1c45fa4362c08de14980ca6ef0b847b1f8873085dcbac5e04f25fa09d9a7746","ea0bc106de78268fbc92444357f3731cc21bd8dea5f27e25e7be7471b18250a8"],"knight/index.html":["219323b14d61190422cbd27f147e3f41a79d02558d8c728e636e74cec5cae5ea","b980fbe54e303c986daca5813b8d7af295a4fae465a1aeace2b4c5caeb0f0300"]}')
          keep=json.loads('{"knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata":"c1112940bc8ba843e0a7a108a09c09c00a8c952162c62b5f2119323353cb2959","knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap035.rxdata":"7aa9a3959547e86720a874d45ec2ec54247495f3de71c7e3ac033c340205b153"}')
          for name,sha in keep.items():
           if files.get(name)!=sha:raise SystemExit('Other gameplay content changed '+name)
          if all(files.get(n)==hashes[0] for n,hashes in expected.items()):
           version='V229R7'
          elif all(files.get(n)==hashes[1] for n,hashes in expected.items()):
           version='V229R8'
          else:raise SystemExit('Unsupported game version; refusing to overwrite')
          Path('/tmp/sl_touch_version').write_text(version)
          Path('/tmp/sl_touch_before.json').write_text(json.dumps(files))
          Path('/tmp/sl_touch_hashes.json').write_text(json.dumps(expected))
          print('VERIFIED_GAME_SOURCE',version,len(files))
          PY_SOURCE

      - name: Replace single skill button with six icon skill slots
        shell: bash
        run: |
          set -euo pipefail
          if test "$(cat /tmp/sl_touch_version)" = V229R7; then
            python3 - <<'PY_DPAD'
          from pathlib import Path
          import hashlib
          ROOT=Path('site/knight')
          p=ROOT/'js/dpad.js'
          s=p.read_text(encoding='utf-8')
          def replace_once(a,b,where):
           global s
