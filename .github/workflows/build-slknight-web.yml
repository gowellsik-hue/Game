             end
            end
            deathcount+=1
            amounts<<[mid,id,exp,gold,low,high,hp.to_i,deathindex,iv(cond,'variable_id'),lv,wait,hit,phys,magic,floor,ce,(original_range==nil ? nil : original_range[0]),(original_range==nil ? nil : original_range[1])]
           end
           File.binwrite(file,Marshal.dump(m))
          end
          check([normal_native,normal_fixed]==[212,162],"Unexpected source-derived normal RNG count #{normal_native}/#{normal_fixed}")
          check(rows.count{|r|r[17]=='일반' && r[14]>0}==374,'Normal positive-money count differs from v2')
          check(rows.count{|r|['준보스','진보스'].include?(r[17]) && r[15]!=nil}==62,'v2 positive boss band count changed')
          check(rows.count{|r|r[17]=='진보스' && r[14]==0}==10,'v2 zero-aden boss count changed')
          check(rows.count{|r|r[17]=='일반' && r[14]==0}==44,'v2 zero-aden normal count changed')
          puts "V5.41-v2 records=#{rows.length} maps=#{by_map.length}, native normal rolls=#{normal_native}, no-source-roll fixed=#{normal_fixed}, HP=#{updatedHP.length}, dodge=#{updatedDodge.length}, speed=#{updatedSpeed.length}"

          # The runtime table is literal Ruby; no JSON gem or filesystem is required on mobile.
          by_map_literal={}
          amounts.each do |r|
           mid,id,*vals=r
           by_map_literal[mid]||={}
           by_map_literal[mid][id]=vals
          end
          runtime=<<'RUNTIME'
          # V229R52: V230 V5.41-v2 authoritative per-event stats and death rewards.
          # Bosses: file-recorded money bounds. Ordinary mobs: retain verified original RNG
          # shape re-centered on v2 base amount; if no native RNG, pay exactly base amount.
          # Source key: original map ID and EV ID, never monster name alone.
          module SLV541
            DATA=__LITERAL__
            # [exp,adena,adena_min,adena_max,hp,death_page,hp_var,level,wait,hit,phys,magic,floor,attackCE,native_lo,native_hi]
            def self.stat(mid,eid)
              h=DATA[mid]
