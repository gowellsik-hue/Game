      - name: Patch Fairy web compatibility
        run: |
          cat > /tmp/patch_fairy.rb <<'RB'
          # encoding: UTF-8
          require 'zlib'

          game = ARGV.fetch(0)
          ini_path = File.join(game, 'Game.ini')
          ini = File.binread(ini_path)

          rel = ini[/^Scripts=(.+)$/i, 1].to_s.strip.tr('\\', '/')
          abort 'Fairy Scripts entry missing' if rel.empty?

          source_path = File.join(game, rel)
          abort "Fairy scripts missing: #{source_path}" unless File.file?(source_path)

          scripts = Marshal.load(File.binread(source_path))

          def inflate(entry)
            Zlib::Inflate.inflate(entry[2]).force_encoding(Encoding::UTF_8)
          end

          def deflate(entry, source)
            entry[2] = Zlib::Deflate.deflate(source)
          end

          def entry_for(scripts, name)
            scripts.find do |entry|
              entry.is_a?(Array) &&
                entry.length >= 3 &&
                entry[1].to_s == name
            end
          end

          scripts.reject! do |entry|
            entry.is_a?(Array) &&
              entry.length >= 3 &&
              [
                'Web Compatibility',
                'Web Resolution 800x600',
                'Mobile Diablo Assist'
              ].include?(entry[1].to_s)
          end

          compatibility = <<'RUBY'
          $joiplay = true

          module Kernel
            def exit(*args)
              nil
            end
          end

          class Win32API
            def initialize(*args)
              @func = args[1].to_s
            end

            def web_input(key)
              case key.to_i
              when 9,90 then Input::A
              when 13,32,67 then Input::C
              when 27,88 then Input::B
              when 68 then Input::Z
              when 81 then Input::L
              when 83 then Input::Y
              when 87 then Input::R
              when 65 then Input::X
              when 16 then Input::SHIFT
              when 17 then Input::CTRL
              when 18 then Input::ALT
              else nil
              end
            end

            def call(*args)
              code = web_input(args[0])
              return code && Input.trigger?(code) ? 1 : 0 if @func == 'GetAsyncKeyState'
              return code && Input.press?(code) ? -1 : 0 if @func == 'GetKeyState'
              0
            end

            def Call(*args)
              call(*args)
            end
          end

          Font.default_name = 'NanumGothic'

          module Audio
            def self.sl_stream(kind, *parts)
              puts((['SLAUDIO', kind] + parts.collect { |v| v.to_s }).join('|'))
            end

            def self.bgm_play(filename, volume = 100, pitch = 100)
              sl_stream('BGM_PLAY', filename, volume, pitch)
            end

            def self.bgm_stop
              sl_stream('BGM_STOP')
            end

            def self.bgm_fade(time)
              sl_stream('BGM_FADE', time)
            end

            def self.bgs_play(filename, volume = 100, pitch = 100)
              sl_stream('BGS_PLAY', filename, volume, pitch)
            end

            def self.bgs_stop
              sl_stream('BGS_STOP')
            end

            def self.bgs_fade(time)
              sl_stream('BGS_FADE', time)
            end
          end
          RUBY

          scripts.insert(
            0,
            [0, 'Web Compatibility', Zlib::Deflate.deflate(compatibility)]
          )

          def patch_begin_until(source)
            lines = source.lines

            lines.each_index do |i|
              match = lines[i].match(/^(\s*)end\s+until\s+(.+?)\s*$/)
              next unless match

              indent = match[1]
              condition = match[2]
              j = i - 1

              while j >= 0
                if lines[j][/^\s*/] == indent && lines[j].strip == 'begin'
                  lines[j] = indent + "loop do\n"
                  lines[i] = indent + "  break if #{condition}\n#{indent}end\n"
                  break
                end
                j -= 1
              end
            end

            lines.join
          end

          def patch_scene_loop(source)
            lines = source.lines
            i = 0

            while i < lines.length
              unless lines[i].strip == 'loop do'
                i += 1
                next
              end

              indent = lines[i][/^\s*/]
              significant = []
              k = i + 1

              while k < lines.length && significant.length < 8
                text = lines[k].strip
                significant << [k, text, lines[k][/^\s*/]] unless text.empty? || text.start_with?('#')
                k += 1
              end

              finish = nil

              if significant.length >= 7 &&
                 significant[0][1] == 'Graphics.update' &&
                 significant[1][1] == 'Input.update' &&
                 significant[2][1] == 'update' &&
                 significant[3][1] == 'if $scene != self' &&
                 significant[4][1] == 'break' &&
                 significant[5][1] == 'end' &&
                 significant[6][1] == 'end' &&
                 significant[6][2] == indent
                finish = significant[6][0]
              elsif significant.length >= 5 &&
                    significant[0][1] == 'Graphics.update' &&
                    significant[1][1] == 'Input.update' &&
                    significant[2][1] == 'update' &&
                    significant[3][1] == 'break if $scene != self' &&
                    significant[4][1] == 'end' &&
                    significant[4][2] == indent
                finish = significant[4][0]
              end

              lines[i..finish] = [indent + "end\n\n" + indent + "def dispose\n"] if finish
              i += 1
            end

            lines.join
          end

          browser_loop = <<'RUBY'
          $prev_scene = nil
          $sl_last_scene_name = nil

          def main_update_loop
            begin
              if $scene != nil
                active_scene = $scene
                name = active_scene.class.to_s

                if $sl_last_scene_name != name
                  puts('SLFRAME|' + name)
                  $sl_last_scene_name = name
                end

                if active_scene != $prev_scene
                  $prev_scene.dispose if $prev_scene != nil && $prev_scene.respond_to?(:dispose)
                  active_scene.main
                  $prev_scene = active_scene
                  return if $scene != active_scene
                end

                Graphics.update
                Input.update
                active_scene.update if $scene == active_scene
              end
            rescue Exception => e
              puts('SLRUNTIMEERR|' + e.class.to_s + '|' + e.message.to_s)
              if e.respond_to?(:backtrace) && e.backtrace
                e.backtrace[0,16].each do |line|
                  puts('SLRUNTIMEBT|' + line.to_s)
                end
              end
            end
          end
          RUBY

          font_rules = [
            [/((?:Font\.default_name)\s*=\s*)\[\s*["'][^"']*["']\s*\]/n, '\\1"NanumGothic"'],
            [/(Font\.default_name\s*=\s*)["'][^"']*["']/n, '\\1"NanumGothic"'],
            [/(\.font\.name\s*=\s*)["'][^"']*["']/n, '\\1"NanumGothic"'],
            [/(\bFONT_NAME\s*=\s*)["'][^"']*["']/n, '\\1"NanumGothic"']
          ]

          scripts.each do |entry|
            next unless entry.is_a?(Array) && entry.length >= 3

            name = entry[1].to_s

            begin
              source = inflate(entry)
            rescue
              next
            end

            font_rules.each do |rule, replacement|
              source.gsub!(rule, replacement)
            end

            source.gsub!(
              'defined?($joiplay) && $joiplay',
              '$joiplay == true'
            )

            if source.match?(/^\s*class\s+Plane\s*<\s*Sprite\b/n)
              source = "# native Plane used on web\n"
            end

            source = patch_begin_until(source)
            source = patch_scene_loop(source) unless name == 'Main' || name == 'Scene_Map'

            if name == 'Main'
              source = browser_loop + source unless source.include?('def main_update_loop')
              source.sub!(
                /\n\s*while\s+\$scene\s*!=\s*nil\s*\r?\n\s*\$scene\.main\s*\r?\n\s*end\s*/m,
                "\n"
              )
            end

            deflate(entry, source)
          end

          resolution = entry_for(scripts, '해상도')
          if resolution
            source = inflate(resolution)
            source.gsub!('$WINDOW_WIDTH = 640', '$WINDOW_WIDTH = 800')
            source.gsub!('$WINDOW_HEIGHT = 480', '$WINDOW_HEIGHT = 600')
            source.gsub!('640, 480', '800, 600')
            deflate(resolution, source)
          end

          scripts.each do |entry|
            next unless entry.is_a?(Array) && entry.length >= 3

            begin
              source = inflate(entry)
            rescue
              next
            end

            if source.include?('XRXS_MP7_Module')
              deflate(entry, "# web: XRXS menu transparency disabled\n")
            end
          end

          main_index = scripts.index do |entry|
            entry.is_a?(Array) &&
              entry.length >= 3 &&
              entry[1].to_s == 'Main'
          end

          abort 'Fairy Main script missing' unless main_index

          resolution_shim = <<'RUBY'
          $WINDOW_WIDTH = 800
          $WINDOW_HEIGHT = 600

          begin
            Graphics.resize_screen(800,600)
          rescue
          end
          RUBY

          scripts.insert(
            main_index,
            [99999990, 'Web Resolution 800x600', Zlib::Deflate.deflate(resolution_shim)]
          )

          output = File.join(game, 'Data', 'Scripts.rxdata')
          File.binwrite(output, Marshal.dump(scripts))

          if File.expand_path(source_path) != File.expand_path(output) && File.exist?(source_path)
            File.delete(source_path)
          end

          lines = ini.split(/\r?\n/).map do |line|
            if line =~ /^Scripts=/i
              'Scripts=Data\\Scripts.rxdata'
            elsif line =~ /^Title=/i
              'Title=SLFairy'
            else
              line
            end
          end

          File.binwrite(ini_path, lines.join("\r\n") + "\r\n")
          puts 'FAIRY_WEB_PATCH_OK'
          RB

          ruby -c /tmp/patch_fairy.rb
          ruby -EUTF-8:UTF-8 /tmp/patch_fairy.rb fairy_player/gameasync
          ruby -EUTF-8:UTF-8 /tmp/mobile_runtime.rb fairy_player fairy

      - name: Convert Fairy media
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          root = Path('fairy_player/gameasync')
          audio = root / 'Audio'
          extensions = {'.mp3', '.wav', '.wma', '.aac', '.m4a', '.flac', '.mid', '.midi'}
          failures = []

          if audio.exists():
              for src in [p for p in audio.rglob('*') if p.is_file() and p.suffix.lower() in extensions]:
                  out = src.with_suffix('.ogg')
                  temp = None

                  try:
                      inp = src

                      if src.suffix.lower() in {'.mid', '.midi'}:
                          temp = src.with_name(src.name + '.wav')
                          subprocess.run(
                              ['timidity', str(src), '-Ow', '-o', str(temp)],
                              check=True
                          )
                          inp = temp

                      subprocess.run(
                          [
                              'ffmpeg',
                              '-nostdin',
                              '-v',
                              'error',
                              '-y',
                              '-i',
                              str(inp),
                              '-c:a',
                              'libvorbis',
                              '-q:a',
                              '4',
                              str(out)
                          ],
                          check=True
                      )

                      if not out.exists() or out.stat().st_size == 0:
                          raise RuntimeError('empty output')

                      if temp and temp.exists():
                          temp.unlink()

                      if src != out and src.exists():
                          src.unlink()

                  except Exception as exc:
                      failures.append((str(src), str(exc)))

                      if temp and temp.exists():
                          temp.unlink()

          if failures:
              for file, error in failures:
                  print(file + ' -> ' + error, file=sys.stderr)
              raise SystemExit(1)

          graphics = root / 'Graphics'

          if graphics.exists():
              for src in [
                  p for p in graphics.rglob('*')
                  if p.is_file() and p.suffix.lower() in {'.bmp', '.gif', '.webp', '.tif', '.tiff'}
              ]:
                  out = src.with_suffix('.png')

                  subprocess.run(
                      ['convert', str(src) + '[0]', str(out)],
                      check=True
                  )

                  if not out.exists() or out.stat().st_size == 0:
                      raise SystemExit('image conversion failed: ' + str(src))

                  src.unlink()

          print('FAIRY_MEDIA_OK')
          PY

      - name: Build Fairy mapping
        run: |
          set -euo pipefail
          (
            cd fairy_player/gameasync
            bash "$GITHUB_WORKSPACE/engine/extra/make_mapping.sh"
          )
          test -s fairy_player/gameasync/mapping.js

      - name: Build Fairy preload
        run: |
          set -euo pipefail
          source engine/deps/emsdk/emsdk_env.sh >/dev/null

          args=(
            --preload fairy_player/gameasync/Data@/game/Data
            --preload fairy_player/gameasync/Graphics@/game/Graphics
            --preload fairy_player/gameasync/Fonts@/game/Fonts
            --preload fairy_player/gameasync/Game.ini@/game/Game.ini
            --preload fairy_player/gameasync/rgss.rb@/game/rgss.rb
          )

          [ -d fairy_player/gameasync/Audio/SE ] && args+=(--preload fairy_player/gameasync/Audio/SE@/game/Audio/SE)
          [ -d fairy_player/gameasync/Audio/ME ] && args+=(--preload fairy_player/gameasync/Audio/ME@/game/Audio/ME)
          [ -d fairy_player/gameasync/BM ] && args+=(--preload fairy_player/gameasync/BM@/game/BM)
          [ -f fairy_player/gameasync/Lineage.ini ] && args+=(--preload fairy_player/gameasync/Lineage.ini@/game/Lineage.ini)

          python3 \
            engine/deps/emsdk/upstream/emscripten/tools/file_packager.py \
            fairy_player/slfairy-core-v144.data \
            "${args[@]}" \
            --js-output=fairy_player/slfairy-core-v144.js \
            --no-node

          test -s fairy_player/slfairy-core-v144.data
          test -s fairy_player/slfairy-core-v144.js
          rm -f fairy_player/gameasync/bitmap-map.js

      - name: Apply run 60 browser persistence pattern to Fairy
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          source = Path('/tmp/base60_browser.sh').read_text()

          replacements = [
              ('player/js/drive.js', 'fairy_player/js/drive.js'),
              ('player/index.html', 'fairy_player/index.html'),
              ('player/.nojekyll', 'fairy_player/.nojekyll'),
              ('slknight-core-v144', 'slfairy-core-v144'),
              ('slknight_v14_engine', 'slfairy_v14_engine'),
              ('SLKnight V14.4b', 'SLFairy'),
              ('SLKnight', 'SLFairy')
          ]

          for old, new in replacements:
              source = source.replace(old, new)

          Path('/tmp/fairy_browser.sh').write_text(source)
          PY

          bash -n /tmp/fairy_browser.sh
          bash /tmp/fairy_browser.sh

      - name: Finalize Fairy browser
        run: |
          python3 /tmp/finalize_site.py \
            fairy_player \
            elf \
            SLFairy \
            slfairy_v14_engine \
            slfairy-core-v144 \
            "$BUILD_ID"

          node --check fairy_player/js/dpad.js
          node --check fairy_player/js/drive.js

      - name: Assemble launcher
        run: |
          set -euo pipefail

          rm -rf /tmp/sl_dual_site
          mkdir -p /tmp/sl_dual_site/knight
          mkdir -p /tmp/sl_dual_site/elf

          cp -a player/. /tmp/sl_dual_site/knight/
          cp -a fairy_player/. /tmp/sl_dual_site/elf/

          cat > /tmp/sl_dual_site/index.html <<'HTML'
          <!doctype html>
          <html lang="ko">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
            <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
            <meta http-equiv="Pragma" content="no-cache">
            <meta http-equiv="Expires" content="0">
            <title>SL Mobile</title>
            <style>
              html,body{margin:0;width:100%;height:100%;background:#080808;color:#fff;font-family:system-ui,sans-serif}
              .wrap{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px}
              h1{font-size:30px;margin:0 0 12px}
              .choices{display:flex;gap:18px}
              .card{width:150px;height:170px;border:1px solid #777;border-radius:14px;background:#171717;color:#fff;font-size:25px;cursor:pointer}
              .card:active{transform:scale(.97)}
              .sub{font-size:13px;color:#aaa;text-align:center;max-width:360px;line-height:1.5}
            </style>
          </head>
          <body>
            <div class="wrap">
              <h1>캐릭터 선택</h1>
              <div class="choices">
                <button class="card" onclick="location.href='knight/?v=BUILD_ID'">기사</button>
                <button class="card" onclick="location.href='elf/?v=BUILD_ID'">요정</button>
              </div>
              <div class="sub">기사와 요정은 독립 빌드이며 저장 데이터도 서로 분리됩니다.</div>
            </div>
          </body>
          </html>
          HTML

          sed -i "s/BUILD_ID/${BUILD_ID}/g" /tmp/sl_dual_site/index.html
          touch /tmp/sl_dual_site/.nojekyll

          rm -rf player fairy_player
          mv /tmp/sl_dual_site player

      - name: Verify final package and runtime fixes
        run: |
          set -euo pipefail

          test -s player/index.html
          test -s player/knight/index.html
          test -s player/elf/index.html
          test -s player/knight/mkxp.js
          test -s player/knight/mkxp.wasm
          test -s player/elf/mkxp.js
          test -s player/elf/mkxp.wasm
          test -s player/knight/gameasync/Data/Scripts.rxdata
          test -s player/elf/gameasync/Data/Scripts.rxdata

          test "$(find player/knight -maxdepth 1 -name "knight-core-${BUILD_ID}.data" | wc -l)" -eq 1
          test "$(find player/knight -maxdepth 1 -name "knight-core-${BUILD_ID}.js" | wc -l)" -eq 1
          test "$(find player/elf -maxdepth 1 -name "elf-core-${BUILD_ID}.data" | wc -l)" -eq 1
          test "$(find player/elf -maxdepth 1 -name "elf-core-${BUILD_ID}.js" | wc -l)" -eq 1

          grep -Fq "mkxp.js?v=${BUILD_ID}" player/knight/index.html
          grep -Fq "mkxp.wasm?v=${BUILD_ID}" player/knight/index.html
          grep -Fq "js/dpad.js?v=${BUILD_ID}" player/knight/index.html
          grep -Fq "gameasync/mapping.js?v=${BUILD_ID}" player/knight/index.html

          grep -Fq "mkxp.js?v=${BUILD_ID}" player/elf/index.html
          grep -Fq "mkxp.wasm?v=${BUILD_ID}" player/elf/index.html
          grep -Fq "js/dpad.js?v=${BUILD_ID}" player/elf/index.html
          grep -Fq "gameasync/mapping.js?v=${BUILD_ID}" player/elf/index.html

          grep -Fq 'id="sl-stick-zone"' player/knight/index.html
          grep -Fq 'id="sl-attack"' player/knight/index.html
          grep -Fq 'id="sl-edit"' player/knight/index.html
          grep -Fq 'sl-layout-' player/knight/js/dpad.js
          grep -Fq 'sl_mobile_toggle_target' <(strings player/knight/gameasync/Data/Scripts.rxdata) || true

          grep -Fq 'id="sl-stick-zone"' player/elf/index.html
          grep -Fq 'id="sl-attack"' player/elf/index.html
          grep -Fq 'id="sl-edit"' player/elf/index.html
          grep -Fq 'sl-layout-' player/elf/js/dpad.js

          node --check player/knight/js/dpad.js
          node --check player/knight/js/drive.js
          node --check player/elf/js/dpad.js
          node --check player/elf/js/drive.js

          ruby -EUTF-8:UTF-8 -rzlib - <<'RB'
          paths = [
            'player/knight/gameasync/Data/Scripts.rxdata',
            'player/elf/gameasync/Data/Scripts.rxdata'
          ]

          paths.each do |path|
            scripts = Marshal.load(File.binread(path))
            all = scripts.map do |entry|
              begin
                Zlib::Inflate.inflate(entry[2]).force_encoding(Encoding::UTF_8)
              rescue
                ''
              end
            end.join("\n")

            abort "#{path}: target lock missing" unless all.include?('sl_mobile_toggle_target')
            abort "#{path}: target tick missing" unless all.include?('sl_mobile_attack_tick')
            abort "#{path}: ruby boot marker missing" unless all.include?('SLBOOT|RUBY_MAIN')
            abort "#{path}: old automatic target scan still present" if all.include?('$mobile_auto_attack_active')
          end

          puts 'RUNTIME_VERIFY_OK'
          RB

          ! grep -R -Fq 'tools-v149-complete.zip' player
          ! grep -R -Fq 'slknight-core-v144.data' player/knight/index.html
          ! grep -R -Fq 'slfairy-core-v144.data' player/elf/index.html

          echo "BUILD_ID=${BUILD_ID}"
          echo BOOT_CACHE_MOBILE_VERIFY_OK
          du -sh player

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
