
name: V192 | Deploy SLKnight POTION ASSASSIN + SLFairy INVENTORY ICON FIX
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: slknight-github-pages
  cancel-in-progress: true
env:
  BASE178_SHA: 49e7f27f099c792ecb1cb379ac3c087f8bc91cf0
  Z105_SHA: e19659507b466b87a671949532b02484bc1faaef
  Z104_SHA: e044e1b6c53646b4c4f21f2dfee4967a68fabbc4
  DUAL_BASE_SHA: 04ce66ec99abc10f77143de53650685db8949532
  CURRENT_Z10_SHA: f545634bafbe1e1e55aaf6489126ad17b07da382
  BASELINE_SHA: c6815cd461dba60ec131898e6d5dd8690dd915ae
  X2_SHA: 6d941bd643dda87b8267ba466e108d1904c22331
  Z1_SHA: 008b6abe81074b7af877806b45f2314004a74f66
  Z3_SHA: 5a46988b048764e8a99700998c1f4ab96a3ec5c1
  CE_FIX_SHA: e30b0c41dc7fe7ec49fa17501d198339f7006cf6
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  FAIRY_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLFairy_Source_v1.zip
  FAIRY_SHA256: 67b88b5fe0cde3c9f2fada889815f9aa7d0fc94b378025529e9950d55151c70e
  FAIRY_7Z_PASSWORD: http://nemo838.tistory.com/
  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout 178 source
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.BASE178_SHA }}', path: base178}
      - name: Checkout z10.5 source
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.Z105_SHA }}', path: z105src}
      - name: Checkout z10.4 source
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.Z104_SHA }}', path: z104src}
      - name: Checkout dual base
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.DUAL_BASE_SHA }}', path: dualbase}
      - name: Checkout z10 source
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.CURRENT_Z10_SHA }}', path: z10src}
      - name: Checkout baseline
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.BASELINE_SHA }}', path: baseline}
      - name: Checkout auto base
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.X2_SHA }}', path: x2}
      - name: Checkout monster base z1
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.Z1_SHA }}', path: z1}
      - name: Checkout monster base z3
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.Z3_SHA }}', path: z3}
      - name: Checkout CE fix source
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.CE_FIX_SHA }}', path: cefix}
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake cmake curl ffmpeg freepats git imagemagick libtool make mm-common patch pkg-config python3 rake ruby timidity unzip wget xz-utils fonts-nanum p7zip-full nodejs
      - name: Checkout engine
        uses: actions/checkout@v4
        with: {repository: pulsejet/mkxp-web, ref: '${{ env.MKXP_SRC_REF }}', path: engine}
      - name: Cache engine dependencies
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-${{ runner.os }}-${{ env.EMSDK_VER }}-186
      - name: Extract 178 runtime steps
        run: |
          set -euo pipefail
          ruby -ryaml - <<'RB'
          steps=YAML.load_file('base178/.github/workflows/build-slknight-web.yml').fetch('jobs').fetch('build').fetch('steps')
          names=['Extract frozen working steps','Build current Knight base','Fix Knight transform only','Rebuild Fairy from Knight shell','Patch Fairy with Knight boot logic','Clean Fairy browser identity']
          names.each_with_index do |name,i|
            step=steps.find{|s|s['name']==name}
            abort "MISSING 178 STEP: #{name}" unless step&&step['run']
            File.write("/tmp/base178_#{i}.sh",step['run'])
          end
          RB
      - name: Rebuild exact 178 runtime base
        run: |
          set -euo pipefail
          for i in 0 1 2 3 4 5; do bash -e "/tmp/base178_${i}.sh"; done
          echo BASE178_RUNTIME_REBUILT
      - name: Freeze 178 dpad hashes
        run: |
          set -euo pipefail
          sha256sum player/js/dpad.js > /tmp/knight_dpad_178.sha
          sha256sum fairy_player/js/dpad.js > /tmp/fairy_dpad_178.sha
          echo DPAD178_HASHES_FROZEN
      - name: Fix Knight potions transform and Assassin
        run: |
          set -euo pipefail
          ruby -EUTF-8:UTF-8 - player/gameasync <<'RB'
          class RawMarshalObject
            def self._load(data);o=allocate;o.instance_variable_set(:@raw,data);o;end
            def _dump(_depth);@raw;end
          end
          class Tone<RawMarshalObject;end
          class Color<RawMarshalObject;end
          class Rect<RawMarshalObject;end
          class Table<RawMarshalObject;end
          module RPG
            class AudioFile;end
            class Animation;class Frame;end;class Timing;end;end
            class Map;end
            class CommonEvent;end
            class Event;class Page;class Condition;end;class Graphic;end;end;end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end
          def iv(o,n);o.instance_variable_get("@#{n}");end
          def setiv(o,n,v);o.instance_variable_set("@#{n}",v);end
          def cmd(code,params=[],indent=0)
            c=RPG::EventCommand.allocate
            setiv(c,:code,code)
            setiv(c,:indent,indent)
            setiv(c,:parameters,params)
            c
          end
          def patch_assassin_route(list)
            list.each_with_index do |c,i|
              next unless iv(c,:code)==122&&iv(c,:parameters)==[309,309,0,0,1]
              ((i+1)..[i+8,list.length-1].min).each do |j|
                x=list[j]
                next unless iv(x,:code)==209
                route=(iv(x,:parameters)||[])[1]
                next unless route
                speed=(iv(route,:list)||[]).find{|m|iv(m,:code)==29&&(iv(m,:parameters)||[])[0].to_i==3}
                if speed
                  setiv(speed,:parameters,[4])
                  break
                end
              end
            end
          end
          def patch_transform_release_green(list)
            list.each do |c|
              next unless iv(c,:code)==111&&iv(c,:parameters)==[0,171,0]
              setiv(c,:parameters,[12,'$game_switches[171] || $game_switches[368]'])
            end
          end
          game=ARGV.fetch(0)
          cp=Dir.glob(File.join(game,'Data','*CommonEvents.rxdata')).max_by{|p|File.size(p)}
          abort 'CommonEvents missing' unless cp&&File.size(cp)>1000
          ce=Marshal.load(File.binread(cp))
          ce3=ce[3] or abort 'CE3 missing'
          ce8=ce[8] or abort 'CE8 missing'
          ce33=ce[33] or abort 'CE33 missing'
          ce68=ce[68] or abort 'CE68 missing'
          normal_script=<<'SRC'
          # SL_NORMAL_GREEN_ISOLATED_V3
          unless $game_switches[368]
            $game_variables[110]=0
            $game_switches[171]=true
            $game_switches[998]=true
          end
          begin
            $KeyIcon.ShowIcon
          rescue
          end
          SRC
          enhanced_script=<<'SRC'
          # SL_ENHANCED_GREEN_ISOLATED_V3
          $game_switches[171]=false
          $game_variables[110]=0
          $game_switches[368]=true
          $game_switches[998]=true
          begin
            $KeyIcon.ShowIcon
          rescue
          end
          SRC
          speed_script=<<'SRC'
          # SL_MOVE_SPEED_COMBINED_V3
          v=$game_variables
          s=$game_switches
          speed=2
          if v[263].to_i==1
            speed=5
          elsif v[309].to_i==1
            speed=4
          elsif [58,138,189,264,265,311,390,627,628,629].any?{|i|v[i].to_i==1}
            speed=4
          elsif s[172]
            speed=4
          elsif s[171]||s[368]
            speed=3
          end
          $game_player.instance_variable_set(:@move_speed,speed) if $game_player
          s[998]=false
          SRC
          normal_script.gsub!(/^          /,'')
          enhanced_script.gsub!(/^          /,'')
          speed_script.gsub!(/^          /,'')
          setiv(ce3,:list,[cmd(235,[37]),cmd(355,[normal_script]),cmd(235,[46]),cmd(207,[-1,2]),cmd(0)])
          setiv(ce33,:list,[cmd(355,[enhanced_script]),cmd(235,[46]),cmd(207,[-1,2]),cmd(0)])
          setiv(ce68,:trigger,2)
          setiv(ce68,:switch_id,998)
          setiv(ce68,:list,[cmd(355,[speed_script]),cmd(0)])
          list=iv(ce8,:list)||[]
          list.each_with_index do |c,i|
            next unless iv(c,:code)==111&&iv(c,:parameters)==[1,309,0,1,0]
            ((i+1)..[i+5,list.length-1].min).each do |j|
              x=list[j]
              next unless iv(x,:code)==209
              route=(iv(x,:parameters)||[])[1]
              next unless route
              speed=(iv(route,:list)||[]).find{|m|iv(m,:code)==29&&(iv(m,:parameters)||[])[0].to_i==3}
              setiv(speed,:parameters,[4]) if speed
              break
            end
          end
          [6,17].each do |id|
            next unless ce[id]
            list=iv(ce[id],:list)||[]
            patch_assassin_route(list)
            patch_transform_release_green(list)
          end
          File.binwrite(cp,Marshal.dump(ce))
          puts 'KNIGHT_POTION_TRANSFORM_ASSASSIN_PATCH_OK'
          RB
          (cd player/gameasync && bash "$GITHUB_WORKSPACE/engine/extra/make_mapping.sh")
      - name: Fix Fairy compatibility title and new game flow
        run: |
          set -euo pipefail
          ruby -EUTF-8:UTF-8 -rzlib - fairy_player/gameasync/Data/Scripts.rxdata <<'RB'
          path=ARGV.fetch(0)
          scripts=Marshal.load(File.binread(path))
          def inflate(e);Zlib::Inflate.inflate(e[2]).force_encoding(Encoding::UTF_8);end
          def store(e,s);e[2]=Zlib::Deflate.deflate(s);end
          replacements={
            'weapon_array = Array.new(self.weapon_ids) #save weapons'=>'weapon_array = self.weapon_ids.dup #save weapons',
            '@weapon_slots = Array.new(array) #new slots'=>'@weapon_slots = array.dup #save weapons',
            'temp_array = Array.new(@armor_slot_names)'=>'temp_array = @armor_slot_names.dup',
            'temp_array = Array.new(@weapon_slot_names) #use the custom values'=>'temp_array = @weapon_slot_names.dup',
            'return Array.new(attacks)'=>'return attacks.dup',
            'if defined? xrxs_additional_refresh'=>'if respond_to?(:xrxs_additional_refresh)'
          }
          scripts.each do |e|
            next unless e.is_a?(Array)&&e.length>=3
            begin
              src=inflate(e)
            rescue
              next
            end
            changed=false
            replacements.each do |old,newv|
              if src.include?(old)
                src.gsub!(old,newv)
                changed=true
              end
            end
            if e[1].to_s=='Scene_Title'
              title_line='@sprite.bitmap = RPG::Cache.title($data_system.title_name)'
              unless src.include?('SL_FAIRY_TITLE_800')
                if src.include?(title_line)
                  src.sub!(title_line,title_line+"\n    # SL_FAIRY_TITLE_800\n    @sprite.zoom_x = $WINDOW_WIDTH.to_f / @sprite.bitmap.width\n    @sprite.zoom_y = $WINDOW_HEIGHT.to_f / @sprite.bitmap.height")
                  changed=true
                end
                src.gsub!('@command_window.x = 320 - @command_window.width / 2','@command_window.x = $WINDOW_WIDTH / 2 - @command_window.width / 2')
                src.gsub!('@command_window.y = 270','@command_window.y = ($WINDOW_HEIGHT * 9 / 16)')
              end
              unless src.include?('SLTITLE|C|')
                marker='    if Input.trigger?(Input::C)'
                abort 'Fairy title C marker missing' unless src.include?(marker)
                src.sub!(marker,marker+"\n      puts('SLTITLE|C|'+@command_window.index.to_s)")
                changed=true
              end
              unless src.include?('SLNEW|01|ENTER')
                a=src.index('  def command_new_game') or abort 'Fairy command_new_game missing'
                b=src.index('  def command_continue',a) or abort 'Fairy command_continue boundary missing'
                block=%q~  def command_new_game
            puts 'SLNEW|01|ENTER'
            begin
              # Avoid synchronous lazy loading of title SE on web.
              # Missing audio URLs can leave Asyncify waiting indefinitely.
              puts 'SLNEW|01A|SE_BYPASS'
              Audio.bgm_stop
              Graphics.frame_count = 0
              puts 'SLNEW|02|RESET'
              $game_temp          = Game_Temp.new
              $game_system        = Game_System.new
              $game_switches      = Game_Switches.new
              $game_variables     = Game_Variables.new
              $game_self_switches = Game_Self_Switches.new
              $game_screen        = Game_Screen.new
              $game_actors        = Game_Actors.new
              $game_party         = Game_Party.new
              $game_troop         = Game_Troop.new
              $game_map           = Game_Map.new
              $game_player        = Game_Player.new
              puts 'SLNEW|03|OBJECTS'
              $game_party.setup_starting_members
              puts 'SLNEW|04|PARTY'
              $game_map.setup($data_system.start_map_id)
              puts 'SLNEW|05|MAP_SETUP'
              $game_player.moveto($data_system.start_x, $data_system.start_y)
              $game_player.refresh
              puts 'SLNEW|06|PLAYER'
              $game_map.autoplay
              puts 'SLNEW|07|AUTOPLAY'
              $scene = Scene_Map.new
              puts 'SLNEW|08|SCENE_MAP'
            rescue Exception => e
              puts('SLNEWERR|'+e.class.to_s+'|'+e.message.to_s)
              e.backtrace[0,12].each{|line|puts('SLNEWBT|'+line.to_s)} if e.respond_to?(:backtrace)&&e.backtrace
              raise
            end
          end

          ~
                block.gsub!(/^          /,'')
                src[a...b]=block
                changed=true
              end
            end
            if e[1].to_s=='Scene_Map'
              # Restore the original Fairy map-input unlock from the dual build.
              # The gender-selection event is handled from Scene_Map.
              unless src.include?('SLFAIRY_MAP_UNLOCK')
                main_marker=/  def main\r?\n/
                abort 'Fairy Scene_Map main missing' unless src.match?(main_marker)
                src.sub!(main_marker,
                  "  def main\n"+
                  "    $game_switches[49] = false if $game_switches\n"+
                  "    puts('SLFAIRY_MAP_UNLOCK')\n")
                gate=/\s*if \$game_switches\[49\] == false\r?\n\s*Input\.update\s*\r?\n\s*end\r?\n/
                abort 'Fairy Scene_Map input gate missing' unless src.scan(gate).length==1
                src.sub!(gate,"\n     Input.update\n")
                changed=true
              end
            end
            store(e,src) if changed
          end
          File.binwrite(path,Marshal.dump(scripts))
          scripts.each_with_index do |e,i|
            next unless e.is_a?(Array)&&e.length>=3
            begin
              code=inflate(e)
            rescue
              next
            end
            RubyVM::InstructionSequence.compile(code,"fairy_#{i}_#{e[1]}")
          end
          puts 'FAIRY_TITLE_NEWGAME_FLOW_FIX_OK'
          RB
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          knight = Path('player/gameasync/Audio')
          fairy = Path('fairy_player/gameasync/Audio')
          if not knight.is_dir():
              raise SystemExit('Knight audio folder missing')
          copied = 0
          preserved = 0
          for src in sorted(knight.rglob('*')):
              if not src.is_file():
                  continue
              dst = fairy / src.relative_to(knight)
              if dst.exists():
                  if not dst.is_file():
                      raise SystemExit('Fairy audio destination is not a file: ' + str(dst))
                  preserved += 1
                  continue
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
              copied += 1
          for rel in ('SE/결정.ogg', 'SE/취소.ogg', 'BGM/타이틀.ogg'):
              target = fairy / rel
              if not target.is_file() or target.stat().st_size == 0:
                  raise SystemExit('Fairy audio missing: ' + rel)
          fallback = fairy / 'SE/music3.ogg'
          if not fallback.exists():
              shutil.copy2(fairy / 'SE/결정.ogg', fallback)
              print('FAIRY_MUSIC3_FALLBACK_CREATED')
          elif not fallback.is_file() or fallback.stat().st_size == 0:
              raise SystemExit('Invalid Fairy music3 audio')
          if copied + preserved == 0:
              raise SystemExit('No Knight audio files found')
          print(f'FAIRY_AUDIO_FROM_KNIGHT copied={copied} preserved={preserved}')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          src = Path('player/gameasync/Graphics/Icons/초록물약.png')
          dst = Path('fairy_player/gameasync/Graphics/Icons/초록물약.png')
          if not src.is_file() or src.stat().st_size == 0:
              raise SystemExit('Knight green potion icon missing')
          if dst.exists():
              if not dst.is_file() or dst.stat().st_size == 0:
                  raise SystemExit('Invalid Fairy green potion icon')
              print('FAIRY_GREEN_POTION_ICON_PRESERVED')
          else:
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
              print('FAIRY_GREEN_POTION_ICON_COPIED')
          PY
          (cd fairy_player/gameasync && bash "$GITHUB_WORKSPACE/engine/extra/make_mapping.sh")
          python3 - <<'PY'
          from pathlib import Path
          mapping = Path('fairy_player/gameasync/mapping.js').read_text(encoding='utf-8')
          for rel in ('Audio/SE/결정.ogg', 'Audio/SE/취소.ogg', 'Audio/SE/music3.ogg', 'Audio/BGM/타이틀.ogg'):
              key = rel.rsplit('.', 1)[0].lower()
              if f'["{key}",' not in mapping:
                  raise SystemExit('Fairy audio mapping missing: ' + rel)
          print('FAIRY_AUDIO_MAPPING_OK')
          if '["graphics/icons/초록물약",' not in mapping:
              raise SystemExit('Fairy green potion icon mapping missing')
          print('FAIRY_GREEN_POTION_ICON_MAPPING_OK')
          html = Path('fairy_player/index.html')
          content = html.read_text(encoding='utf-8')
          old = 'gameasync/mapping.js?v=fairy800'
          if content.count(old) != 1:
              raise SystemExit('Fairy mapping version marker missing')
          html.write_text(content.replace(old, 'gameasync/mapping.js?v=fairy192'), encoding='utf-8')
          PY
      - name: Fix browser shell without touching dpad
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ('player/index.html','fairy_player/index.html'):
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              s=s.replace('position:fixed;left:8px;top:8px;','position:fixed;left:8px;bottom:8px;')
              s=s.replace(
                  "window.addEventListener('error',function(e){err('JS ERROR | '+e.message);});",
                  "window.addEventListener('error',function(e){var m=String((e&&e.message)||'');if(/^Uncaught \\d+$/.test(m))return;err('JS ERROR | '+m);});"
              )
              # Use the actual V14 canvas-fit function on Fairy only.
              # Keep legacy touch bindings removed on both pages.
              fit = ('\n        if (typeof resizeCanvas === "function") resizeCanvas();\n'
                     if name=='fairy_player/index.html' else '\n')
              s,n=re.subn(
                  r"\n\s*if \(!is_touch_device\(\)\) \{.*?\n\s*resize\(\);\s*",
                  fit,
                  s,
                  count=1,
                  flags=re.S
              )
              if n!=1:
                  raise SystemExit('Original browser resize block missing: '+name)
              if name=='fairy_player/index.html':
                  if 'width="800" height="600"' not in s:
                      raise SystemExit('Fairy 800x600 canvas missing')
                  if s.count('</head>')!=1:
                      raise SystemExit('Fairy HTML head marker mismatch')
                  style=(
                      '<style id="sl-fairy-canvas-fit">'
                      '@media(orientation:portrait){'
                      '#canvas{left:0!important;top:0!important;width:100vw!important;'
                      'height:auto!important;max-width:100vw!important;max-height:none!important;}'
                      '}</style>'
                  )
                  s=s.replace('</head>',style+'</head>',1)
                  s=s.replace(
                      '/SLRUNTIMEERR|SLSCRIPTERR| - err/.test(t)',
                      '/SLRUNTIMEERR|SLSCRIPTERR|SLTITLE|SLNEW| - err/.test(t)'
                  )
              p.write_text(s,encoding='utf-8')
          PY
          node --check player/js/drive.js
          node --check player/js/dpad.js
          node --check fairy_player/js/drive.js
          node --check fairy_player/js/dpad.js
          sha256sum -c /tmp/knight_dpad_178.sha
          sha256sum -c /tmp/fairy_dpad_178.sha
          echo DPAD_UNCHANGED_FROM_178
      - name: Build dual site
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/knight site/elf
          cp -a player/. site/knight/
          cp -a fairy_player/. site/elf/
          cat > site/index.html <<'HTML'
          <!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>SLKnight + SLFairy</title><style>html,body{margin:0;width:100%;height:100%;background:#080808;color:#fff;font-family:system-ui,sans-serif}.wrap{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px}.choices{display:flex;gap:16px}button{width:150px;height:160px;border:1px solid #777;border-radius:14px;background:#171717;color:#fff;font-size:25px}</style></head><body><div class="wrap"><h1>캐릭터 선택</h1><div class="choices"><button onclick="location.href='knight/?v='+Date.now()">기사</button><button onclick="location.href='elf/?v='+Date.now()">요정</button></div></div></body></html>
          HTML
          touch site/.nojekyll
          rm -rf player fairy_player
          mv site player
      - name: Minimal package check
        run: |
          set -euo pipefail
          test -s player/index.html
          for side in knight elf; do
            test -s player/$side/index.html
            test -s player/$side/mkxp.js
            test -s player/$side/mkxp.wasm
            test -s player/$side/gameasync/Data/Scripts.rxdata
            test -s player/$side/gameasync/mapping.js
          done
          for rel in Audio/SE/결정.ogg Audio/SE/취소.ogg Audio/SE/music3.ogg Audio/BGM/타이틀.ogg; do
            test -s "player/elf/gameasync/$rel"
          done
          for key in 'audio/se/결정' 'audio/se/취소' 'audio/se/music3' 'audio/bgm/타이틀'; do
            grep -Fq "\"$key\"" player/elf/gameasync/mapping.js
          done
          test -s "player/elf/gameasync/Graphics/Icons/초록물약.png"
          grep -Fq '"graphics/icons/초록물약"' player/elf/gameasync/mapping.js
          echo FAIRY_GREEN_POTION_ICON_DEPLOY_OK
          echo FAIRY_DEPLOY_AUDIO_OK
          echo PACKAGE_FILES_OK
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with: {path: player}
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
