name: build-slknight-web.yml | V4.17 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Resolve final V4.16 deployment
        id: baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BASE_SHA=9cab02b37866199fa1236481d1beb380ea3eccfb

          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/build-slknight-web.yml/runs" -f head_sha="$BASE_SHA" -f status=success -f per_page=100 > /tmp/sl417-runs.json

          RUN_ID=$(jq -er --arg sha "$BASE_SHA" '[.workflow_runs[] | select(.head_sha==$sha and .head_branch=="main" and .status=="completed" and .conclusion=="success")] | sort_by(.created_at) | last | .id // empty' /tmp/sl417-runs.json)

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" > /tmp/sl417-jobs.json

          jq -e '[.jobs[] | select(.name=="deploy" and .conclusion=="success")] | length==1' /tmp/sl417-jobs.json

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" > /tmp/sl417-artifacts.json

          jq -e '[.artifacts[] | select(.name=="github-pages" and .expired==false and .size_in_bytes>0)] | length==1' /tmp/sl417-artifacts.json

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Restore final V4.16 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: ${{ steps.baseline.outputs.run_id }}
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify original game
        shell: bash
        run: |
          set -euo pipefail

          test -s baseline/artifact.tar
          mkdir -p site
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib,json

          root=Path('site')
          game=root/'knight/gameasync'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          before={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}

          assert len(before)==6086,len(before)

          for name in ('System','Map007','Map047','Actors','Classes','Weapons','Armors','Items','States','CommonEvents'):
              q=game/'Data'/(pre+name+'.rxdata')
              assert q.is_file() and q.stat().st_size>4,name

          assert (game/'Data/Scripts.rxdata').stat().st_size>100000

          assert (root/'knight/js/sl-assets-v229r115.js').read_bytes().count(b"var version='V4.16';")==1

          for name in ('index.html','knight/index.html'):
              assert b'V4.16' in (root/name).read_bytes(),name

          names=['Scripts.rxdata',pre+'Map007.rxdata']

          Path('/tmp/sl417-before.json').write_text(json.dumps(before,sort_keys=True),'utf8')
          Path('/tmp/sl417-md5.json').write_text(json.dumps({n:hashlib.md5((game/'Data'/n).read_bytes()).hexdigest() for n in names}),'utf8')

          print('PASS final V4.16 baseline')
          PYTHON

      - name: Restore native character creation
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl417-patch.rb <<'RUBY'
          # encoding: UTF-8
          require 'zlib'
          require 'json'

          module RPG
            %w[Map MapInfo Tileset Event EventCommand MoveRoute MoveCommand AudioFile CommonEvent System Actor Class Weapon Armor Item Skill State].each{|n|const_set(n,::Class.new)}
            Event.const_set(:Page,::Class.new)
            Event::Page.const_set(:Condition,::Class.new)
            Event::Page.const_set(:Graphic,::Class.new)
            System.const_set(:Words,::Class.new)
            System.const_set(:TestBattler,::Class.new)
            self::Class.const_set(:Learning,::Class.new)
          end

          %w[Table Tone Color].each do |n|
            Object.const_set(n,Class.new do
              def self._load(raw)
                o=allocate
                o.instance_variable_set(:@raw,raw)
                o
              end

              def _dump(depth)
                @raw
              end
            end)
          end

          def iv(o,k);o.instance_variable_get(k);end
          def utf(s);s.to_s.dup.force_encoding('UTF-8');end
          def ck(v,m);raise m unless v;end
          def code(c);iv(c,:@code);end
          def par(c);iv(c,:@parameters);end

          def emit(l,c,d,p=[])
            x=RPG::EventCommand.new
            x.instance_variable_set(:@code,c)
            x.instance_variable_set(:@indent,d)
            x.instance_variable_set(:@parameters,p)
            l<<x
          end

          def choices(l,d,labels)
            emit(l,102,d,[labels,0])
            labels.each_with_index do |label,i|
              emit(l,402,d,[i,label])
              yield i,d+1
              emit(l,0,d+1)
            end
            emit(l,404,d)
          end

          def one(s,a,b)
            ck(s.scan(a).size==1,"Anchor #{a.inspect[0,100]}")
            s.sub(a){b}
          end

          root=ARGV.fetch(0)
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          path=->(n){File.join(root,pre+n+'.rxdata')}
          read=->(n){Marshal.load(File.binread(path.call(n)))}

          map=read.call('Map007')
          island=read.call('Map047')
          sys=read.call('System')

          ck([:@start_map_id,:@start_x,:@start_y].map{|k|iv(sys,k)}==[7,9,6],'V4.16 start')

          recruit=iv(island,:@events).values.select{|e|utf(iv(e,:@name))=='[ID고용사]'}

          ck(recruit.size==1,'Recruiter')

          forms=iv(recruit.first,:@pages).map do |page|
            pending=[]
            found=[]

            iv(page,:@list).each do |c|
              next unless code(c)==355

              s=utf(par(c)[0])

              if m=s.match(/\A@sl43_type = ("(?:\\.|[^"\\])*"); @sl43_stats = (\[[0-9, ]+\])/)
                pending<<[JSON.parse(m[1]),JSON.parse(m[2])]

              elsif s.include?('@sl43_actor = Game_Actor.new(@sl43_slot)')

                m=s.match(/@class_id,\$data_actors\[(\d+)\]\.class_id\).*?\.set_graphic\(("(?:\\.|[^"\\])*"),0,.*?@sl43_form,("(?:\\.|[^"\\])*")\)/)

                ck(m&&!pending.empty?,'Recruiter profile')

                found<<[
                  JSON.parse(m[3]),
                  JSON.parse(m[2]),
                  m[1].to_i,
                  pending
                ]

                pending=[]
              end
            end

            ck(pending.empty?&&found.size==8,'Recruiter page')
            found
          end

          ck(forms.uniq.size==1,'Recruiter pages disagree')

          forms=forms.first

          ck(forms.map(&:first)==%w[남기사 여기사 남요정 여요정 남법사 여법사 남다엘 여다엘],'Form order')

          ck(
            forms.map{|f|f[3].size}==[2,2,3,3,3,3,3,3] &&
            forms.flat_map{|f|f[3]}.uniq.size==11,
            'Preset count'
          )

          ck(forms.all?{|f|f[3].all?{|_,s|s.size==6&&s.sum==75}},'Stats')

          actors=read.call('Actors')
          classes=read.call('Classes')

          forms.each do |_,_,id,_|
            ck(actors[id]&&classes[iv(actors[id],:@class_id)],'Class template')
          end

          sp=File.join(root,'Scripts.rxdata')
          rows=Marshal.load(File.binread(sp))

          ck(rows.size==137,'Scripts')

          before=rows.map{|r|Marshal.dump(r)}

          edit=->(i,&blk) do
            raw=utf(Zlib::Inflate.inflate(rows.fetch(i)[2]))
            s=raw.gsub("\r\n","\n")
            n=blk.call(s)

            ck(n!=s,"No change #{i}")

            RubyVM::InstructionSequence.compile(n)

            rows[i][2]=Zlib::Deflate.deflate(
              raw.include?("\r\n") ? n.gsub("\n","\r\n") : n
            )
          end

          es=iv(map,:@events)
          e=es.fetch(1)
          pg=iv(e,:@pages).fetch(0)
          old=iv(pg,:@list)

          ck(
            iv(e,:@name)=='EV001' &&
            iv(pg,:@trigger)==4 &&
            old.size==121,
            'Original EV001'
          )

          ck(
            [3,4,13,14,40,41,42,43,44,45,74,75,76,77,78,79,80,81,89,97,104,105,106,119,120].map{|i|code(old[i])}==
            [101,102,101,102,101,401,401,401,241,303,101,401,129,129,121,122,317,311,127,126,209,509,509,201,0],
            'Original commands'
          )

          ck(
            par(old[45])==[1,12] &&
            par(old[119])==[0,47,372,138,2,1],
            'V4.16 transfer'
          )

          old_cmds=old.map{|c|Marshal.dump(c)}

          other=es.reject{|k,_|k==1}.transform_values{|v|Marshal.dump(v)}

          list=old[0,3]

          emit(list,101,0,['캐릭터를 선택하세요.'])

          choices(list,0,forms.map(&:first)) do |i,d|

            form,graphic,template,presets=forms[i]

            emit(list,101,d,[utf(par(old[13])[0])])

            choices(list,d,presets.map(&:first)) do |j,n|

              kind,stats=presets[j]

              script="a=$game_actors[1]; a.instance_variable_set(:@sl43_form,#{form.inspect}); a.instance_variable_set(:@sl43_type,#{kind.inspect}); a.instance_variable_set(:@sl43_stats,#{stats.inspect}); a.instance_variable_set(:@sl417_base_graphic,#{graphic.inspect}); a.instance_variable_set(:@class_id,$data_actors[#{template}].class_id); a.set_graphic(#{graphic.inspect},0,a.battler_name,a.battler_hue); [425,469,426,962,966,968].each_with_index{|v,k|$game_variables[v]=#{stats.inspect}[k]}; $game_variables[48]=#{i%2}; $game_switches[70]=#{kind=='힘기사'}; a.sl44_record_growth; a.recover_all; true"

              RubyVM::InstructionSequence.compile(script)

              emit(list,355,n,[script])
            end
          end

          list<<old[44]

          emit(list,101,0,[utf(par(old[40])[0])])
          emit(list,401,0,[''])
          emit(list,401,0,[''])
          emit(list,401,0,['선택 : Enter / C'])

          list.concat(old[46,28])
          list.concat(old[76,4])
          list.concat(old[82,7])
          list<<old[97]

          emit(
            list,355,0,
            ['a=$game_actors[1]; SL411.starter(a,true); $game_player.refresh; true']
          )

          route=Marshal.load(Marshal.dump(old[104,3]))

          route.each{|c|c.instance_variable_set(:@indent,0)}

          list.concat(route)
          list.concat(old[74,2])
          list.concat(old[109,12])

          ck(
            list.count{|c|code(c)==102}==9 &&
            list.none?{|c|code(c)==303} &&
            list.count{|c|code(c)==355}==23,
            'Native selection commands'
          )

          ck(
            list[-2].equal?(old[119]) &&
            old.map{|c|Marshal.dump(c)}==old_cmds,
            'Original transfer or commands'
          )

          pg.instance_variable_set(:@list,list)

          ck(
            es.reject{|k,_|k==1}.transform_values{|v|Marshal.dump(v)}==other,
            'Other events changed'
          )

          name_prompt=utf(par(old[40])[0])
          name_error=utf(par(old[47])[0])

          reserved=[46,51,56,61].map{|i|utf(par(old[i])[3])}

          ck(reserved.uniq.size==4,'Reserved names')

          edit.call(60) do |s|

            s=one(
              s,
              '    large = $game_temp.choice_start == 0',
              <<~'SRC'.lines.map{|l|'    '+l}.join.chomp
          if $game_map && $game_map.map_id==7
            @sl417_original_size ||= [self.x,self.height]

            $game_temp.message_text.force_encoding('UTF-8')

            h=32+32*[$game_temp.message_text.to_s.count("\n"),1].max

            self.x=(800-self.width)/2
            self.y=(600-h)/2

            if self.height!=h || self.contents.height!=h-32
              self.height=h
              self.contents.dispose
              self.contents=Bitmap.new(width-32,height-32)
            end

            self.oy=0

            @sl417_name=$game_temp.choice_max==0 && $game_temp.message_text.to_s.start_with?(SL417_NAME_PROMPT+"\n")

            return

          elsif @sl417_original_size

            self.x,h=@sl417_original_size
            @sl417_original_size=nil

            if self.height!=h || self.contents.height!=h-32
              self.height=h
              self.contents.dispose
              self.contents=Bitmap.new(width-32,height-32)
            end

            self.oy=0
          end
          large = $game_temp.choice_start == 0
          SRC
            )

            s=one(
              s,
              'class Window_Message < Window_Selectable',
              "class Window_Message < Window_Selectable\n  SL417_NAME_PROMPT = #{name_prompt.inspect}\n  SL417_NAME_ERROR = #{name_error.inspect}\n  SL417_RESERVED = #{reserved.inspect}"
            )

            s=one(
              s,
              '  def terminate_message',
              <<~'SRC'.lines.map{|l|'  '+l}.join.chomp
          def terminate_message
            if @sl417_name
              @sl417_name=false
              puts('SL417|NAME_CLOSE')
            end
          SRC
            )

            s=one(
              s,
              '    if @contents_showing',
              <<~'SRC'.lines.map{|l|'    '+l}.join.chomp
          if @contents_showing && @sl417_name

            self.pause=false

            raw=File.open('SL417Name.tmp','rb'){|f|f.read}

            flag,name=raw.split("\n",2)
            name=(name||'').force_encoding('UTF-8')

            if flag=='1' || Input.trigger?(Input::C)

              File.open('SL417Name.tmp','wb'){|f|f.write("0\n"+name)}

              if !name.valid_encoding? || name.strip.empty? || name.split(//).size>12 || name =~ /[\x00-\x1f\x7f\\]/ || SL417_RESERVED.include?(name.strip)

                $game_system.se_play($data_system.buzzer_se)

                self.contents.clear_rect(0,96,self.contents.width,32)

                self.contents.draw_text(4,96,self.contents.width-8,32,SL417_NAME_ERROR)

                puts('SL417|NAME_RETRY')

                return
              end

              $game_actors[1].name=name.strip

              $game_system.se_play($data_system.decision_se)

              terminate_message
            end

            return
          end

          if @contents_showing
          SRC
            )

            s=one(
              s,
              '      self.contents_opacity = 0',
              <<~'SRC'.lines.map{|l|'      '+l}.join.chomp
          if $game_map && $game_map.map_id==7

            self.contents_opacity=255

            @fade_in=false

            if @sl417_name

              File.open('SL417Name.tmp','wb'){|f|f.write("0\n")}

              puts([
                'SL417|NAME',
                self.x+28,
                self.y+52,
                self.width-56,
                48,
                12,
                File.expand_path('SL417Name.tmp')
              ].join('|'))

            end

            return
          end

          self.contents_opacity = 0
          SRC
            )

            one(
              s,
              "    if self.visible\n      @fade_out = true",
              <<~'SRC'.lines.map{|l|'    '+l}.join.chomp
          if self.visible && $game_map && $game_map.map_id==7

            self.visible=false
            @fade_out=false
            $game_temp.message_window_showing=false

            return
          end

          if self.visible
            @fade_out = true
          SRC
            )
          end

          edit.call(17) do |s|

            s=one(
              s,
              "    if @actor_id == 1\n      kind=0",
              "    if @actor_id == 1 && !@sl417_base_graphic\n      kind=0"
            )

            s=one(
              s,
              '      ow=@sl44_origin_wis ||= w',
              "      ow=@sl44_origin_wis ||= w\n      if @sl417_base_graphic\n        c=$game_variables[426].to_i\n        w=$game_variables[966].to_i\n      end"
            )

            s=one(
              s,
              '    @sl44_player_highest ||= @level if @actor_id == 1',
              '    @sl44_player_highest ||= @level if @actor_id == 1 && !@sl417_base_graphic'
            )

            s=one(
              s,
              '      if @actor_id == 1 && @level > @sl44_player_highest',
              '      if @actor_id == 1 && !@sl417_base_graphic && @level > @sl44_player_highest'
            )

            s=one(
              s,
              '    return $data_classes[@class_id].name',
              "    return @sl43_form if @sl417_base_graphic\n    return $data_classes[@class_id].name"
            )

            s=one(
              s,
              '    @character_name = character_name',
              "    character_name=@sl417_base_graphic if @sl417_base_graphic && ['knight_men','여기사'].include?(character_name)\n    @character_name = character_name"
            )

            s=one(
              s,
              '      dex=@sl43_stats[1]+@dex_plus',
              "      dex=@sl43_stats[1]+@dex_plus\n      dex=$game_variables[469]+$game_variables[961] if @sl417_base_graphic"
            )

            s=one(
              s,
              '      return pdef1+pdef2+pdef3+pdef4+pdef5+@level/div+bonus',
              "      n=pdef1+pdef2+pdef3+pdef4+pdef5+@level/div+bonus\n      n+=$game_variables[1080]+$game_variables[920] if @sl417_base_graphic\n      return n"
            )

            s=one(
              s,
              "      w=@sl43_stats[4]\n      b=if w<=14; 0",
              "      w=@sl43_stats[4]\n      w=$game_variables[966] if @sl417_base_graphic\n      b=if w<=14; 0"
            )

            s=one(
              s,
              "      mr=if @sl43_form.end_with?('기사');",
              "      w=@sl43_stats[4] if @sl417_base_graphic\n      mr=if @sl43_form.end_with?('기사');"
            )

            one(
              s,
              '      return mdef1+mdef2+mdef3+mdef4+mdef5+@level/2+mr+b',
              "      n=mdef1+mdef2+mdef3+mdef4+mdef5+@level/2+mr+b\n      if @sl417_base_graphic\n        n+=$game_variables[925]\n        $MDEF=n\n      end\n      return n"
            )
          end

          edit.call(12) do |s|
            one(
              s,
              '(@sl46_stats_ready ? 0 : $game_variables[169] + $game_variables[170] + $game_variables[171])',
              '(@sl46_stats_ready && !@sl417_base_graphic ? 0 : $game_variables[169] + $game_variables[170] + $game_variables[171])'
            )
          end

          edit.call(117) do |s|
            one(
              s,
              '$n = n unless @sl46_stats_ready',
              '$n = n unless @sl46_stats_ready && !@sl417_base_graphic'
            )
          end

          [34,98].each do |i|

            edit.call(i) do |s|

              a='actor.instance_variable_get(:@sl46_stats_ready)'

              ck(s.scan(a).size==(i==34 ? 2 : 5),'Stat display anchors')

              s.gsub(
                a,
                '('+a+' && !actor.instance_variable_get(:@sl417_base_graphic))'
              )
            end
          end

          edit.call(26) do |s|

            ck(s.include?('def self.starter(a,initial=false)'),'Existing starter')

            s=one(
              s,
              '    a.id==1 ? 3213 : FORMS[a.instance_variable_get(:@sl43_form).to_s]',
              '    a.id==1 && !a.instance_variable_get(:@sl417_base_graphic) ? 3213 : FORMS[a.instance_variable_get(:@sl43_form).to_s]'
            )

            one(
              s,
              "  def self.pc_motion\n    w=SL49.weapon($game_actors[1])",
              "  def self.pc_motion\n    a=$game_actors[1]\n    return motion(a) if a.instance_variable_get(:@sl417_base_graphic)\n    w=SL49.weapon(a)"
            )
          end

          edit.call(71) do |s|

            s=one(
              s,
              '    a.id==1 ? [$game_switches[70] ? 20 : 16,12] :',
              '    a.id==1 && !a.instance_variable_get(:@sl417_base_graphic) ? [$game_switches[70] ? 20 : 16,12] :'
            )

            one(
              s,
              '          if @list[@index+1].parameters[0].size <= 4 - line_count',
              '          if @list[@index+1].parameters[0].size <= 4 - line_count || ($game_map.map_id==7 && @event_id==1 && line_count==1 && @list[@index+1].parameters[0].size==8)'
            )
          end

          edit.call(24) do |s|
            one(
              s,
              '          @character_name = command.parameters[0]',
              "          @character_name = command.parameters[0]\n          if self.is_a?(Game_Player) && ['knight_men','여기사'].include?(@character_name)\n            @character_name=$game_actors[1].instance_variable_get(:@sl417_base_graphic) || @character_name\n          end"
            )
          end

          edit.call(28) do |s|

            one(
              s,
              "      if @character.character_name=='knight_men좌표'",
              <<~'SRC'.lines.map{|l|'      '+l}.join.chomp
          base=$game_actors[1].instance_variable_get(:@sl417_base_graphic)

          if base && @character.character_name==base
            m=SL411.pc_motion
            v=[m[0],nil,14,m[3]] if m

          elsif base && ['knight_men좌표','여기사 좌표'].include?(@character.character_name)
            v=@character.instance_variable_get(:@sl411_pc_frame)

          elsif @character.character_name=='knight_men좌표'
          SRC
            )
          end

          edit.call(73) do |s|

            s=one(
              s,
              '       @parameters[1].to_s =~ /\Aknight_men_(down|left|right|up)([1-6])\z/',
              <<~'SRC'.lines.map{|l|'       '+l}.join.chomp
          (@parameters[1].to_s =~ /\Aknight_men_(down|left|right|up)([1-6])\z/ ||
           ($game_actors[1].instance_variable_get(:@sl417_base_graphic) &&
            @parameters[1].to_s =~ /\A여기사 공격[- ](하|좌|우|상)-?([1-6])\z/))
          SRC
            )

            one(
              s,
              "        'up'=>8\n      }[$1]",
              "        'up'=>8,'하'=>2,'좌'=>4,'우'=>6,'상'=>8\n      }[$1]"
            )
          end

          changed=rows.each_index.select{|i|Marshal.dump(rows[i])!=before[i]}

          ck(
            changed==[12,17,24,26,28,34,60,71,73,98,117],
            "Scope #{changed.inspect}"
          )

          File.binwrite(sp,Marshal.dump(rows))
