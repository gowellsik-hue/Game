          require 'zlib'
          require 'digest'
          path='site/knight/gameasync/Data/Scripts.rxdata'
          expected='67d0ae5bdebf1002907cc1edc2a166c54971731059979c4b0253a7565ddc1495'
          raise 'Wrong R7 script baseline' unless Digest::SHA256.file(path).hexdigest==expected
          scripts=Marshal.load(File.binread(path))
          raise 'Unexpected previous script structure' unless scripts.size==137 && scripts[134][1]=='V230 Boss Respawn 60s 180s' && scripts[135][1]=='V229 Mobile Skill Button' && scripts[136][1]=='Main'
          source=<<~'SL_SKILL_R8'
          module SLTouchSkillbar
            KEYS=[84,85,73,79,80,77]
            def self.actor
              return nil if $game_party.nil? || $game_party.actors.empty?
              $game_party.actors[0]
            end
            def self.slots(a)
              store=$game_system.instance_variable_get(:@sl_touch_skills)
              unless store.is_a?(Hash)
                store={}
                $game_system.instance_variable_set(:@sl_touch_skills,store)
              end
              ids=store[a.id]
              unless ids.is_a?(Array) && ids.size==6
                ids=[]
                for skill_id in a.skills
                  skill=$data_skills[skill_id]
                  ids.push(skill_id) if skill && skill.name.to_s.size>0 && skill.icon_name.to_s.size>0
                  break if ids.size==6
                end
                ids.push(0) while ids.size<6
                store[a.id]=ids
              end
              ids
            end
            def self.key_slot
              for i in 0...KEYS.size
                return i if Keyboard.testkey(KEYS[i])
              end
              nil
            end
            def self.clean(s)
              s.to_s.gsub('|','/')
            end
            def self.mode(name)
              return if @last_mode==name
              @last_mode=name
              puts('SLSKILL|MODE|'+name)
              sync(true)
            end
            def self.sync(force=false)
              a=actor
              data=[]
              if a
                ids=slots(a)
                for i in 0...6
                  id=ids[i].to_i
                  skill=(id>0 && a.skill_learn?(id)) ? $data_skills[id] : nil
                  if skill
                    data.push([id,clean(skill.icon_name),clean(skill.name),skill.sp_cost.to_i,(a.skill_can_use?(id) && (skill.scope.to_i>=3 || skill.common_event_id.to_i>0)) ? 1 : 0])
                  else
                    data.push([0,'','',0,0])
                  end
                end
              else
                6.times{data.push([0,'','',0,0])}
              end
              signature=data.map{|entry|entry.join(':')}.join(';')
              return if !force && signature==@last_signature
              @last_signature=signature
              for i in 0...6
                v=data[i]
                puts('SLSKILL|STATE|'+(i+1).to_s+'|'+v[0].to_s+'|'+v[1]+'|'+v[2]+'|'+v[3].to_s+'|'+v[4].to_s)
              end
            end
            def self.assign(slot,skill,a)
              if a.nil? || skill.nil? || !a.skill_learn?(skill.id) || skill.name.to_s.empty?
                $game_system.se_play($data_system.buzzer_se)
                puts('SLSKILL|REJECT|'+(slot+1).to_s)
                return true
              end
              ids=slots(a)
              ids[slot]=(ids[slot]==skill.id ? -1 : skill.id)
              $game_system.se_play($data_system.decision_se)
              puts('SLSKILL|ASSIGN|'+(slot+1).to_s+'|'+ids[slot].to_s)
              sync(true)
              true
            end
            def self.fail_slot(slot)
              $game_system.se_play($data_system.buzzer_se)
              puts('SLSKILL|FAIL|'+(slot+1).to_s)
              sync(true)
              true
            end
            def self.use(slot)
              a=actor
              return fail_slot(slot) if a.nil?
              id=slots(a)[slot].to_i
              skill=(id>0 && a.skill_learn?(id)) ? $data_skills[id] : nil
              return fail_slot(slot) if skill.nil? || !a.skill_can_use?(id)
              return fail_slot(slot) if $game_temp.message_window_showing || $game_temp.player_transferring
              return fail_slot(slot) if $game_system.map_interpreter.running?
              return fail_slot(slot) if $game_temp.common_event_id.to_i>0
              effect=false
              if skill.scope.to_i>=3
                if skill.scope==4 || skill.scope==6
                  for member in $game_party.actors
                    effect=member.skill_effect(a,skill) || effect
                  end
                elsif skill.scope==7
                  effect=a.skill_effect(a,skill)
                elsif skill.scope==5
                  target=$game_party.actors.find{|member|member.dead?}
                  effect=target.skill_effect(a,skill) unless target.nil?
                else
                  target=$game_party.actors[0]
                  effect=target.skill_effect(a,skill) unless target.nil?
                end
                return fail_slot(slot) unless effect
              else
                return fail_slot(slot) if skill.common_event_id.to_i<=0
                effect=true
              end
              $game_system.se_play(skill.menu_se)
              a.sp-=skill.sp_cost
              $game_temp.common_event_id=skill.common_event_id if skill.common_event_id.to_i>0
              puts('SLSKILL|CAST|'+(slot+1).to_s+'|'+id.to_s)
              sync(true)
              true
            end
          end
          class Scene_Map
            alias sl_touch_r8_old_update update
            def update
              sl_touch_r8_old_update
              return unless $scene.equal?(self)
              SLTouchSkillbar.mode('use')
              SLTouchSkillbar.sync
              idx=SLTouchSkillbar.key_slot
              SLTouchSkillbar.use(idx) unless idx.nil?
            end
          end
          class Scene_Skill
            alias sl_touch_r8_old_skill_update update_skill
            def update_skill
              SLTouchSkillbar.mode('assign')
              SLTouchSkillbar.sync
              slot=SLTouchSkillbar.key_slot
              if !slot.nil?
                SLTouchSkillbar.assign(slot,@skill_window.skill,@actor)
                return
              end
              sl_touch_r8_old_skill_update
            end
          end
          SL_SKILL_R8
          File.binwrite('/tmp/sl_touch_r8.rb',source)
          raise 'New skillbar Ruby syntax failure' unless system('ruby','-c','/tmp/sl_touch_r8.rb',out:File::NULL)
          scripts[135][1]='V229R8 Skill Icon Hotbar'
          scripts[135][2]=Zlib::Deflate.deflate(source)
          File.binwrite(path,Marshal.dump(scripts))
          puts 'R8_NEW_SCRIPT_SHA256 '+Digest::SHA256.file(path).hexdigest
          RUBY_SKILLS
            python3 - <<'PY_CACHE'
          from pathlib import Path
          import hashlib,re
          r=Path('site/knight')
          rel='Data/Scripts.rxdata'
          mp=r/'gameasync/mapping.js'
          s=mp.read_text(encoding='utf8')
          md5=hashlib.md5((r/'gameasync'/rel).read_bytes()).hexdigest()
          s,n=re.subn(re.escape(rel+'?h=')+r'[0-9a-f]{32}',lambda m:rel+'?h='+md5,s)
          assert n==1,n
          mp.write_text(s,encoding='utf8')
          idx=r/'index.html'
          s=idx.read_text(encoding='utf8')
          for a,b in [('js/dpad.js?v=v229r7','js/dpad.js?v=v229r8'),('gameasync/mapping.js?v=v229r7','gameasync/mapping.js?v=v229r8')]:
           assert s.count(a)==1,(a,s.count(a))
           s=s.replace(a,b)
          idx.write_text(s,encoding='utf8')
          for name in ['js/dpad.js','gameasync/Data/Scripts.rxdata','gameasync/mapping.js','index.html']:
           p=r/name;print(name,hashlib.sha256(p.read_bytes()).hexdigest())
          PY_CACHE
          else
            echo V229R8_ALREADY_INSTALLED
          fi

      - name: Validate input, layouts, and unchanged gameplay
        shell: bash
        run: |
          set -euo pipefail
          node --check site/knight/js/dpad.js
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import hashlib,json
          root=Path('site');old=json.loads(Path('/tmp/sl_touch_before.json').read_text())
          new={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          expected=json.loads(Path('/tmp/sl_touch_hashes.json').read_text());version=Path('/tmp/sl_touch_version').read_text()
          if len(new)!=5354 or new.keys()!=old.keys():raise SystemExit('Game inventory changed')
          for name,hashes in expected.items():
           if new.get(name)!=hashes[1]:raise SystemExit('R8 file checksum mismatch: '+name)
          changed={p for p in new if old[p]!=new[p]}
          if version=='V229R7' and changed!=set(expected):raise SystemExit('Unintended changed game files '+str(changed))
          if version=='V229R8' and changed:raise SystemExit('R8 rerun modified deployed game')
          root=Path('site/knight');rel='Data/Scripts.rxdata'
          md5=hashlib.md5((root/'gameasync'/rel).read_bytes()).hexdigest()
          mp=(root/'gameasync/mapping.js').read_text(encoding='utf8')
          if mp.count(rel+'?h='+md5)!=1:raise SystemExit('Broken Scripts cache hash')
          html=(root/'index.html').read_text(encoding='utf8')
          for path in ('js/dpad.js?v=v229r8','gameasync/mapping.js?v=v229r8'):
           if html.count(path)!=1:raise SystemExit('Missing mobile cache '+path)
          js=(root/'js/dpad.js').read_text(encoding='utf8')
          for token in ('layoutSkillPad(dpad,skillbar','SLSKILL|STATE|','sl-skillbar','sl-skill-slot','slSkillKeys=[84,85,73,79,80,77]','function renderSkill'):
           if token not in js:raise SystemExit('Missing skillbar control '+token)
          if "'sl-skill','기술'" in js:raise SystemExit('Obsolete single skill text button remains')
          print('PASS_R8_SIX_SKILL_SLOTS, 5354_GAME_FILES, CHANGED',len(changed))
          PY_FINAL
          ruby - <<'RUBY_VERIFY'
          require 'zlib'
          a=Marshal.load(File.binread('site/knight/gameasync/Data/Scripts.rxdata'))
          raise 'Script count changed' unless a.length==137 && a[134][1]=='V230 Boss Respawn 60s 180s' && a[135][1]=='V229R8 Skill Icon Hotbar' && a[136][1]=='Main'
          code=Zlib::Inflate.inflate(a[135][2]);File.binwrite('/tmp/skill_r8_check.rb',code)
          raise 'Script parse invalid' unless system('ruby','-c','/tmp/skill_r8_check.rb',out:File::NULL)
          ['SLSKILL|STATE|','SLSKILL|CAST|','SLSKILL|ASSIGN|','class Scene_Map','class Scene_Skill','common_event_id','skill_effect'].each do |marker|
           raise 'Skill behavior missing '+marker unless code.include?(marker)
          end
          puts 'PASS_SKILL_ASSIGN_CAST_UI_AND_BOSS_SCRIPT_UNCHANGED'
          RUBY_VERIFY
          python3 - <<'PY_LAYOUT'
          for width,height in [(393,850),(375,667),(412,915),(850,393),(750,360),(915,412)]:
           portrait=height>width
           canvasheight=min(width,height*4/3)*0.75 if portrait else height
           canvaswidth=canvasheight*4/3
           space=height-canvasheight if portrait else (width-canvaswidth)/2
           zone=(max(1,min(width*0.52,width-170))-8) if portrait else max(1,space-8)
           h=max(1,space-16) if portrait else max(1,height-16)
           cols,rows,gap=(3,2,6) if portrait else (2,3,5)
           side=max(30,min(46 if portrait else 42,int((zone-12-(cols-1)*gap)//cols)))
           barheight=rows*side+(rows-1)*gap
           target=(min(space*0.23,100) if portrait else height*0.22)-8
           dsize=max(88,min(184 if portrait else 156,zone-6,2*(target-6),h-barheight-16))
           cy=max(dsize/2+6,min(target,h-barheight-dsize/2-16))
           atky=min(space*0.23,100) if portrait else height*0.22
           if abs((cy+8)-atky)>13:raise SystemExit('Dpad/ATK alignment failed '+str((width,height,cy,atky)))
           if cy+dsize/2+8+barheight>h:raise SystemExit('Skill slots off-screen '+str((width,height)))
          print('PASS_R8_PORTRAIT_LANDSCAPE_GEOMETRY_SIX_SCREEN_SIZES')
          PY_LAYOUT

      - name: Upload verified knight site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
