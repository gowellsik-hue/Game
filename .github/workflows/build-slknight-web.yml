# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R113
# BASE: verified deployed V229R111, run 40523152040 (R112 failed; do not use it).
# MAP ACTIONS: bundle event graphics and their attack/hit/death/motion variants
#              for each of the actual 46 maps; include map-specific floor/walls.
# INVENTORY: load all 395 existing icons from one verified asset pack at boot.
# LOADING: preserve native map callbacks; show bounded asset-loading overlay.
# KEEP: exact R111 Scripts.rxdata, Map045/046, S32 movement, doors, NPCs,
#       monster positions, shifted original art, 4-way pad, other game files.
name: build-slknight-web.yml | V229R113 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R113 Restore exact deployed R111
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40523152040
          name: github-pages
          github-token: ${{ github.token }}
          path: r111

      - name: V229R113 Verify untouched R111 original game
        shell: bash
        run: |
          set -euo pipefail
          test -s r111/artifact.tar
          rm -rf site
          mkdir -p site build
          tar -xf r111/artifact.tar -C site
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert len(files)==5517,('Wrong R111 baseline count',len(files))
          expected={
            'knight/js/drive.js':'833a13026929d62d24a5ad645a8af764511fe40584ebefcf5d1b3251d9a35573',
            'knight/js/dpad.js':'2bd401adf130339d154ce6a8efd0127cefd9b1bc58bc60d1de68e8b6d8b7a791',
            'knight/gameasync/Data/Scripts.rxdata':'e7cc01b36ad7edc18d8026854f4ae37932ebadb74e54d2b43ab47cc6ae112aee',
            'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap045.rxdata':'f47de87af6b4e607bf632818a711619dc8ca4e747196a123a76ac7db8ffc3ba6',
            'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap046.rxdata':'dc89d908f5247442e08dddc11f5bcf6505a77890bd82ab59b790e00e3e5f024c'}
          for path,sha in expected.items():assert files[path]==sha,('Wrong R111 file',path)
          for path in ('index.html','knight/index.html'):
            assert 'V229R111' in (root/path).read_text('utf8')
          Path('build/before.json').write_text(json.dumps(files,sort_keys=True))
          print('PASS deployed R111: 5517 files, original dpad, map collision and engine')
          PY_BASE

      - name: V229R113 Pack map actions and inventory icons; update loader
        shell: bash
        run: |
          set -euo pipefail
          cat > build/export_maps.rb <<'R113_MAPS'
          require 'json'
          module RPG
            class Map;end; class MapInfo;end; class AudioFile;end; class Tileset;end
            class Event
              class Page
                class Condition;end;class Graphic;end
              end
            end
            class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          class Tone;def self._load(x);nil;end;end
          class Color;def self._load(x);nil;end;end
          class Table;def self._load(x);nil;end;end
          root=ARGV.fetch(0)
          base='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          info=Marshal.load(File.binread("#{root}/#{base}MapInfos.rxdata"))
          tilesets=Marshal.load(File.binread("#{root}/#{base}Tilesets.rxdata"))
          result={}
          def text(x)
           x.is_a?(String) ? x.dup.force_encoding('UTF-8').scrub : nil
          end
          def strings(obj,out)
           case obj
           when String
            out << text(obj)
           when Array
            obj.each{|x|strings(x,out)}
           end
          end
          info.keys.sort.each do |mid|
           file=sprintf('%s/%sMap%03d.rxdata',root,base,mid)
           next unless File.file?(file)
           map=Marshal.load(File.binread(file))
           graphics=[];events=[];scripts=[]
           (map.instance_variable_get(:@events)||{}).each_value do |ev|
            name=text(ev.instance_variable_get(:@name))
            events<<name if name && !name.empty?
            (ev.instance_variable_get(:@pages)||[]).each do |page|
             graphic=page.instance_variable_get(:@graphic)
             if graphic
              cn=text(graphic.instance_variable_get(:@character_name))
              graphics<<cn if cn && !cn.empty?
             end
             (page.instance_variable_get(:@list)||[]).each do |cmd|
              code=cmd.instance_variable_get(:@code)
              params=cmd.instance_variable_get(:@parameters)
              if [41,231,232,207,355,655].include?(code)
                strings(params,scripts)
              end
             end
             route=page.instance_variable_get(:@move_route)
             if route
               (route.instance_variable_get(:@list)||[]).each do |mv|
                 if mv.instance_variable_get(:@code)==41
                   strings(mv.instance_variable_get(:@parameters),graphics)
                 end
               end
             end
            end
           end
           tileset=tilesets[map.instance_variable_get(:@tileset_id)]
           tileset_files=[]
           if tileset
            tileset_files += [text(tileset.instance_variable_get(:@tileset_name)),text(tileset.instance_variable_get(:@fog_name)),text(tileset.instance_variable_get(:@panorama_name))]
            tileset_files += (tileset.instance_variable_get(:@autotile_names)||[]).map{|v|text(v)}
           end
           result[mid]={name:text(info[mid].instance_variable_get(:@name)),graphics:graphics.uniq.sort,events:events.uniq.sort,scripts:scripts.uniq.sort,terrain:tileset_files.compact.reject(&:empty?).uniq}
          end
          STDOUT.write(JSON.generate(result))
          R113_MAPS
          cat > build/pack_assets.py <<'R113_PACKS'
          from pathlib import Path
          import collections, json, re, struct, os, hashlib, sys
          root=Path(sys.argv[1])
          base=root/'knight/gameasync'
          assets=root/'knight/assets'; assets.mkdir(exist_ok=True)
          lines=(base/'mapping.js').read_text(encoding='utf8').splitlines()
          source={}
          for l in lines:
              if l.startswith('["'):
                  try: k,v=json.loads(l.rstrip(','))
                  except ValueError:continue
                  if '?' in v and not v.endswith('h='):source[k]=v.split('?',1)[0]

          def norm(x):return re.sub(r'[\s_\-\.]+','',x.casefold())

          def key_name(k):
              return norm(k.rsplit('/',1)[-1])

          by_cat=collections.defaultdict(dict)
          for k,v in source.items():
              prefix=k.split('/',1)[0]+'/'+k.split('/',2)[1] if k.count('/')>=1 else k
              by_cat[prefix][k]=v

          def kfrom(cat,name):
              k=(cat+'/'+name).casefold()
              return k if k in source else None

          # A page's character graphic is the declared identity; collect all action variants
          # with that full identity, including attack, hit, death and directional images.
          def shorten(name):
              x=norm(name)
              for suffix in ['죽음캐릭터','죽음모션','좌표','죽음','사망','피격','맞음','공격','이동','대기','모션','창']:
                  if x.endswith(suffix) and len(x)>len(suffix):
                      x=x[:-len(suffix)]
                      break
              return x

          info=json.loads(Path(sys.argv[2]).read_text(encoding='utf8'))
          indices={}
          reports=[]
          for mid,rec in info.items():
              names=set(rec['graphics'])
              for e in rec['events']:
                  if e.startswith('[ID'):
                      # Some event names include a trailing bracket, some do not.
                      n=e[3:].split(']')[0].strip()
                      if n:names.add(n)
              stems={shorten(name) for name in names if name}
              stems={s for s in stems if s and not s.isnumeric()}
              keys=set()
              direct_missing=[]
              for name in rec['graphics']:
                  k=kfrom('graphics/characters',name)
                  if k:keys.add(k)
                  else:direct_missing.append(name)
              for cat in ['graphics/characters','graphics/animations','graphics/pictures','audio/se']:
                  for k in by_cat.get(cat,{}):
                      n=key_name(k)
                      if any(n.startswith(s) for s in stems): keys.add(k)
              # Exact asset names passed by event scripts for Change Graphic, Show Picture etc.
              for s in rec['scripts']:
                  for cat in ['graphics/characters','graphics/animations','graphics/pictures']:
                      k=kfrom(cat,s)
                      if k:keys.add(k)
              # The map's actual tileset and fog/autotiles are also map-scoped.
              for n in rec['terrain']:
                  for cat in ['graphics/tilesets','graphics/fogs','graphics/panoramas','graphics/autotiles']:
                      k=kfrom(cat,n)
                      if k:keys.add(k)
              if mid in ['45','46']:
                  keys|={k for k in source if re.match(r'^graphics/panoramas/slti_'+mid+r'_(c\d+_\d+|w_c\d+_\d+)$',k)}
              keys=sorted(keys)
              assert keys,mid
              reports.append((int(mid),rec['name'],len(keys),sum((base/source[k]).stat().st_size for k in keys),len(direct_missing),direct_missing))
              indices[mid]=keys

          def pack(kind,mid,keys,filename):
              rows=[];payload=[];offset=0
              for k in keys:
                  path=base/source[k]
                  assert path.is_file(),(k,path)
                  data=path.read_bytes()
                  assert len(data)>4,(k,len(data))
                  if source[k].lower().endswith('.png'):assert data[:8]==b'\x89PNG\r\n\x1a\n',k
                  rows.append([k,offset,len(data)])
                  payload.append(data);offset+=len(data)
              header=json.dumps({'kind':kind,'map_id':mid,'files':rows},ensure_ascii=False,separators=(',',':')).encode('utf8')
              f=assets/filename
              f.write_bytes(struct.pack('<I',len(header))+header+b''.join(payload))
              return f, len(rows), len(header),sum(map(len,payload))

          for mid,keys in indices.items():
              f,*_ =pack('map',int(mid),keys,f'map-{int(mid):03d}-v229r113.pack')

          icon_keys=sorted(k for k in source if k.startswith('graphics/icons/'))
          assert len(icon_keys)==395,len(icon_keys)
          icons=pack('icons',None,icon_keys,'icons-v229r113.pack')
          Path(sys.argv[3]).write_text(json.dumps({'map_counts':{str(a):[b,c,d,missing] for a,b,c,d,missing,miss in reports},'icons':icons[1],'total_pack_bytes':sum(p.stat().st_size for p in assets.iterdir())},ensure_ascii=False,indent=2))
          print('ICONS',icons[1],icons[0].stat().st_size)
          print('PACKS',len(indices),'TOTAL',sum(p.stat().st_size for p in assets.iterdir()))
          for a,b,c,d,missing,miss in reports:
           if a in (29,45,46):print(f'MAP {a} {b}: assets={c} size={d/1024/1024:.2f}MiB missing_char={missing} {miss[:9]}')
          print('missing events total',sum(x[4] for x in reports))
          R113_PACKS
          cat > build/sl-assets-v229r113.js <<'R113_RUNTIME'
          // V229R113: preload all recorded map event-action assets in one mapped binary pack.
          // This script never replaces a native map-load callback or changes engine movement.
          (function(){
            'use strict';
            var maps={};
            var active=0;
            var bootDone=false;
            var mapLimit=25000;
            var iconLimit=12000;
            var overlay=null;
            function label(message){
              var el=document.getElementById('sl-build-version');
              if(el)el.textContent='V229R113'+(message?' | '+message:'');
            }
            function show(mid){
              if(!document.body)return;
              if(!overlay){
                overlay=document.createElement('div');
                overlay.id='sl-r113-map-load';
                overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:900000;display:flex;align-items:center;justify-content:center;color:white;font:16px sans-serif;white-space:pre-line;text-align:center;';
                document.body.appendChild(overlay);
              }
              overlay.textContent='Map '+mid+' resources loading\nPreparing all map actions...';
            }
            function status(mid,finished,total){
              label('Map '+mid+' '+finished+'/'+total);
              if(overlay)overlay.textContent='Map '+mid+' resources loading\n'+finished+' / '+total;
            }
            function hide(){if(overlay){overlay.remove();overlay=null;}}
            function requestPack(filename,timeout,onBytes){
              var ctl=new AbortController();
              var killed=false;
              var guard=setTimeout(function(){killed=true;ctl.abort();},timeout);
              return fetch('assets/'+filename,{cache:'force-cache',signal:ctl.signal}).then(function(res){
                if(!res.ok)throw new Error('HTTP '+res.status+' '+filename);
                if(!onBytes || !res.body || typeof res.body.getReader!=='function')return res.arrayBuffer();
                return (async function(){
                  var reader=res.body.getReader(),pieces=[],received=0;
                  var total=res.headers ? Number(res.headers.get('content-length'))||0 : 0;
                  for(;;){
                    var part=await reader.read();
                    if(part.done)break;
                    pieces.push(part.value);
                    received+=part.value.length;
                    onBytes(received,total);
                  }
                  var result=new Uint8Array(received),at=0;
                  pieces.forEach(function(piece){result.set(piece,at);at+=piece.length;});
                  return result.buffer;
                })();
              }).then(function(bytes){
                if(killed)throw new Error('Asset request timed out: '+filename);
                return bytes;
              }).finally(function(){clearTimeout(guard);});
            }
            function unpack(buffer,kind,mid,onProgress){
              var data=new Uint8Array(buffer);
              if(data.length<16)throw new Error('Invalid asset pack');
              var size=new DataView(data.buffer,data.byteOffset,4).getUint32(0,true);
              if(size<10 || size>data.length-4)throw new Error('Invalid pack index');
              var desc=JSON.parse(new TextDecoder('utf-8').decode(data.subarray(4,4+size)));
              if(desc.kind!==kind || (kind==='map' && desc.map_id!==mid))throw new Error('Wrong asset pack');
              var files=desc.files;
              if(!Array.isArray(files) || !files.length)throw new Error('Empty asset pack');
              var start=4+size;
              var prepared=0;
              for(var i=0;i<files.length;i++){
                var item=files[i],key=item[0],off=item[1],length=item[2];
                var original=mapping[key];
                if(!original || !Number.isInteger(off) || !Number.isInteger(length) ||
                   off<0 || length<8 || start+off+length>data.length){
                  throw new Error('Invalid item '+key);
                }
                var path='/game/'+original.split('?')[0];
                var bytes=data.subarray(start+off,start+off+length);
                if(/\.png$/i.test(path) && !(bytes[0]===137&&bytes[1]===80&&bytes[2]===78&&bytes[3]===71)){
                  throw new Error('Bad PNG '+key);
                }
                // createDummies() wrote a one-byte placeholder. Never mark that as loaded.
                if(!Object.prototype.hasOwnProperty.call(window.fileAsyncCache,key) ||
                   !FS.analyzePath(path).exists || FS.stat(path).size<=1){
                  FS.writeFile(path,bytes,{flags:'w'});
                  if(FS.stat(path).size!==length)throw new Error('FS size mismatch '+key);
                  window.fileAsyncCache[key]=1;
                }
                prepared++;
                if(onProgress && (prepared%12===0 || prepared===files.length))onProgress(prepared,files.length);
              }
              return prepared;
            }
            window.slR113BootIcons=function(){
              if(bootDone)return;
              bootDone=true;
              var dependency='sl-r113-inventory-icons';
              addRunDependency(dependency);
              var released=false;
              var guard=setTimeout(function(){release();},iconLimit+1000);
              function release(){
                if(released)return;
                released=true;clearTimeout(guard);removeRunDependency(dependency);
              }
              label('Inventory icons loading');
              requestPack('icons-v229r113.pack',iconLimit).then(function(data){
                if(!released){
                  var count=unpack(data,'icons',null,null);
                  if(count!==395)throw new Error('Icon count '+count);
                }
                label('Inventory ready');
              }).catch(function(err){
                console.error('SLRUNTIMEERR|R113_ICON_PRELOAD '+String(err));
                label('Inventory fallback');
              }).finally(release);
            };
            window.slR113BeginMap=function(mid){
              mid=Number(mid);
              if(!Number.isInteger(mid) || mid<1 || mid>46)return Promise.resolve(false);
              if(maps[mid] && maps[mid].ready){label('Map '+mid+' ready');return Promise.resolve(true);}
              if(maps[mid] && maps[mid].promise)return maps[mid].promise;
              var token=++active;
              show(mid);
              label('Map '+mid+' downloading');
              var state={ready:false,promise:null};
              maps[mid]=state;
              state.promise=requestPack('map-'+String(mid).padStart(3,'0')+'-v229r113.pack',mapLimit,function(bytes,total){
                if(token!==active)return;
                var amount=(bytes/1048576).toFixed(1);
                var full=total?' / '+(total/1048576).toFixed(1)+' MB':' MB';
                label('Map '+mid+' '+amount+full);
                if(overlay)overlay.textContent='Map '+mid+' asset download\n'+amount+full;
              })
                .then(function(data){
                  return unpack(data,'map',mid,function(done,total){if(token===active)status(mid,done,total);});
                }).then(function(n){
                  state.ready=true;
                  if(token===active)label('Map '+mid+' ready '+n+'/'+n);
                  return true;
                }).catch(function(err){
                  delete maps[mid];
                  console.error('SLRUNTIMEERR|R113_MAP_PRELOAD '+mid+' '+String(err));
                  if(token===active)label('Map '+mid+' asset fallback');
                  return false;
                }).finally(function(){
                  if(token===active)hide();
                  state.promise=null;
                });
              return state.promise;
            };
          })();
          R113_RUNTIME
          cat > build/patch_browser.py <<'R113_PATCH'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1]); js_src=Path(sys.argv[2])
          drive=root/'knight/js/drive.js'
          src=drive.read_text('utf8')
          assert src.count('R111_SANCTUARY_QUEUE')==1
          start=src.index('function preloadList(jsonArray) {')
          loop=src.index('    jsonArray.forEach((file) => {',start)
          end=src.index('\n}\n\nwindow.fileLoadedAsync = function(file)',loop)
          generic='function preloadList(jsonArray) {\n'+src[loop:end]+'\n}'
          src=src[:start]+generic+src[end+2:]
          src=src.replace('// R111_SANCTUARY_QUEUE: limit only the special 2x panoramas.\n','')
          start=src.index('window.fileLoadedAsync = function(file) {')
          end=src.index('\nvar activeStreams = [];',start)
          new_handler='''window.fileLoadedAsync = function(file) {
              document.title = wTitle;
              var found=/Map(\\d{3})\\.rxdata$/i.exec(String(file||''));
              if(found && window.slR113BeginMap)window.slR113BeginMap(Number(found[1]));
          };
          '''
          src=src[:start]+new_handler+src[end:]
          anchor='    // Get mapping key\n    const mappingKey = getMappingKey(fullPath);'
          assert src.count(anchor)==1
          hook='''    // Start the mapped pack before the native map request completes.
              // Never delay the engine callback; loader releases input via a visible
              // progress overlay and always has a network timeout.
              var mapMatch=/Map(\\d{3})\\.rxdata$/i.exec(String(fullPath||''));
              if(!bitmap && mapMatch && window.slR113BeginMap)
                  window.slR113BeginMap(Number(mapMatch[1]));
          '''
          src=src.replace(anchor,hook+anchor)
          assert 'R111_SANCTUARY_QUEUE' not in src
          assert 'window.loadFileAsync = function(fullPath, bitmap, callback)' in src
          assert 'function getLazyAsset(' in src
          assert 'function preloadList(jsonArray)' in src
          assert src.count('window.fileLoadedAsync = function(file)')==1
          drive.write_text(src,encoding='utf8')
          js_out=root/'knight/js/sl-assets-v229r113.js'
          js_out.write_bytes(js_src.read_bytes())
          for name in ('index.html','knight/index.html'):
              htmlfile=root/name
              html=htmlfile.read_text('utf8')
              assert 'V229R111' in html and 'V229R113' not in html
              if name=='knight/index.html':
                  assert html.count('createDummies();window.restoreLocalFilesBeforeRun();')==1
                  html=html.replace('createDummies();window.restoreLocalFilesBeforeRun();',
                                    'createDummies();window.slR113BootIcons();window.restoreLocalFilesBeforeRun();')
                  anchor='<script src="gameasync/mapping.js?v=v229r111"></script>'
                  assert html.count(anchor)==1
                  html=html.replace(anchor,anchor+'\n    <script src="js/sl-assets-v229r113.js?v=v229r113"></script>')
              html=html.replace('V229R111','V229R113').replace('v229r111','v229r113')
              htmlfile.write_text(html,encoding='utf8')
          print('PASS R111 map-load callback retained; map packs start at request, 395 icons boot, title/version updated')
          R113_PATCH
          cat > build/test-r113.js <<'R113_TEST'
          // Verify the actual browser code against mapped assets, placeholder FS and HTTP responses.
          const fs=require('fs'),vm=require('vm'),assert=require('assert'),path=require('path');
          const root=process.argv[2]||'site';
          const browser=fs.readFileSync(path.join(root,'knight/js/sl-assets-v229r113.js'),'utf8');
          const mappingSrc=fs.readFileSync(path.join(root,'knight/gameasync/mapping.js'),'utf8');
          const mappingContext={};vm.runInNewContext(mappingSrc,mappingContext);
          const mapping=mappingContext.mapping;
          const cache=new Map(),cachedKeys={},calls=[];
          const document={body:{appendChild:()=>{}},getElementById:()=>null,createElement:()=>({style:{},remove(){}})};
          let dependencies=0;
          const sandbox={window:{fileAsyncCache:cachedKeys},mapping,document,console,
            TextDecoder,Uint8Array,DataView,AbortController,setTimeout,clearTimeout,Number,String,Array,Object,
            addRunDependency(){dependencies++;},removeRunDependency(){dependencies--;},
            FS:{analyzePath:p=>({exists:cache.has(p)}),stat:p=>({size:(cache.get(p)||Buffer.alloc(0)).length}),
                writeFile:(p,b)=>cache.set(p,Buffer.from(b))},
            fetch:async url=>{const resource=String(url);calls.push(resource);return {
              ok:true,arrayBuffer:async()=>{const bytes=fs.readFileSync(path.join(root,'knight',resource));return bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength);}
            };}
          };
          vm.runInNewContext(browser,sandbox);
          (async()=>{
            sandbox.window.slR113BootIcons();
            while(dependencies>0) await new Promise(resolve=>setTimeout(resolve,1));
            assert.equal(Object.keys(cachedKeys).filter(k=>k.startsWith('graphics/icons/')).length,395,'Icons missing');
            for(const k of Object.keys(cachedKeys).filter(k=>k.startsWith('graphics/icons/')).slice(0,8)){
              const rel=mapping[k].split('?')[0]; assert.deepEqual(cache.get('/game/'+rel),fs.readFileSync(path.join(root,'knight/gameasync',rel)));
            }
            for(const mid of [29,45,46]){
              assert.equal(await sandbox.window.slR113BeginMap(mid),true,'Map pack failed '+mid);
              const packed=fs.readFileSync(path.join(root,'knight/assets','map-'+String(mid).padStart(3,'0')+'-v229r113.pack'));
              const n=packed.readUInt32LE(0),header=JSON.parse(packed.subarray(4,4+n).toString('utf8'));
              const expected={29:74,45:143,46:161}[mid];assert.equal(header.files.length,expected);
              for(const [k,off,len] of header.files){
                assert.equal(cachedKeys[k],1,'Cache key missing '+k);
                const name=mapping[k].split('?')[0];assert.deepEqual(cache.get('/game/'+name),fs.readFileSync(path.join(root,'knight/gameasync',name)));
              }
              const prior=calls.length;
              assert.equal(await sandbox.window.slR113BeginMap(mid),true);
              assert.equal(calls.length,prior,'A ready map should not be downloaded again');
              console.log('PASS MAP '+mid+' '+header.files.length+' assets exact, no repeat');
            }
            assert.equal(calls.filter(x=>x.includes('icons-')).length,1);
            console.log('PASS 395 icons, 3 mapped packs, exact bytes and cache flags');
          })().catch(err=>{console.error(err);process.exit(1)});
          R113_TEST
          ruby -c build/export_maps.rb
          ruby build/export_maps.rb site/knight/gameasync/Data > build/map-meta.json
          python3 build/pack_assets.py site build/map-meta.json build/asset-report.json
          python3 build/patch_browser.py site build/sl-assets-v229r113.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/sl-assets-v229r113.js
          node --check site/knight/js/dpad.js
          node --check site/knight/gameasync/mapping.js
          node build/test-r113.js site

      - name: V229R113 Verify every pack and untouched S32 maps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_AUDIT'
          from pathlib import Path
          import hashlib,json,struct
          root=Path('site')
          before=json.loads(Path('build/before.json').read_text('utf8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          changed={k for k in before if before[k]!=after.get(k)}
          expected={'index.html','knight/index.html','knight/js/drive.js'}
          assert changed==expected,('Unexpected original game changes',changed^expected)
          added=set(after)-set(before)
          expected_added={'knight/js/sl-assets-v229r113.js','knight/assets/icons-v229r113.pack'}
          expected_added|={f'knight/assets/map-{i:03d}-v229r113.pack' for i in range(1,47)}
          assert added==expected_added,('Unexpected added files',added^expected_added)
          assert len(after)==5565 and len(before)==5517,(len(before),len(after))
          assert not any(k.startswith('knight/gameasync/') for k in changed)
          assert before['knight/js/dpad.js']==after['knight/js/dpad.js']
          # Validate all 46 packs against every original asset, not just 3 samples.
          mapping={}
          for line in (root/'knight/gameasync/mapping.js').read_text('utf8').splitlines():
              if line.startswith('["'):
                  k,v=json.loads(line.rstrip(','));mapping[k]=v.split('?')[0]
          for name in sorted(expected_added):
              if not name.endswith('.pack'):continue
              blob=(root/name).read_bytes()
              index_size=struct.unpack('<I',blob[:4])[0]
              index=json.loads(blob[4:4+index_size]);offset=4+index_size
              assert index['files'] and len(index['files'])==len({r[0] for r in index['files']})
              for k,pos,size in index['files']:
                  target=root/'knight/gameasync'/mapping[k]
                  assert blob[offset+pos:offset+pos+size]==target.read_bytes(),('Bad pack bytes',name,k)
          assert len(after)==len(before)+48
          assert b'R111_SANCTUARY_QUEUE' not in (root/'knight/js/drive.js').read_bytes()
          html=(root/'knight/index.html').read_text('utf8')
          assert 'window.slR113BootIcons();' in html
          assert 'sl-assets-v229r113.js?v=v229r113' in html
          assert 'name: build-slknight-web.yml' not in html
          print('PASS R111 engine, coordinates, doors, mobs, graphics, dpad byte-identical')
          print('PASS all 46 map packs and 395 icon entries compared to original files')
          print('PASS only 3 HTML/loader source changes plus 48 generated asset files')
          PY_AUDIT

      - name: V229R113 Publish exact R111 game with map-action and item packs
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

