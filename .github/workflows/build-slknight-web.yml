name: Deploy SLKnight + SLFairy mkxp-web V14.7 MODULAR

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-slknight-web.yml'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a

  FAIRY_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLFairy_Source_v1.zip
  FAIRY_SHA256: 67b88b5fe0cde3c9f2fada889815f9aa7d0fc94b378025529e9950d55151c70e
  FAIRY_7Z_PASSWORD: http://nemo838.tistory.com/

  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout build tools
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            cmake \
            curl \
            ffmpeg \
            freepats \
            git \
            imagemagick \
            libtool \
            make \
            mm-common \
            patch \
            pkg-config \
            python3 \
            rake \
            ruby \
            timidity \
            unzip \
            wget \
            xz-utils \
            fonts-nanum \
            p7zip-full

      - name: Checkout mkxp-web source
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.MKXP_SRC_REF }}
          path: engine

      - name: Cache mkxp-web dependencies
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-deps-${{ runner.os }}-emsdk-${{ env.EMSDK_VER }}-v2-onig25b

      - name: Patch engine
        run: python3 repo/tools/patch_engine.py

      - name: Build engine
        run: |
          mkdir -p engine/build/gameasync
          rm -rf engine/deps/mruby/build/repos/wasm32-unknown-gnu/mruby-onig-regexp

          (
            cd engine
            bash build.sh
          )

          rm -rf engine/build/gameasync

          test -s engine/build/index.html
          test -s engine/build/mkxp.js
          test -s engine/build/mkxp.wasm

      - name: Build Knight + Fairy site
        run: bash repo/tools/build_all.sh

      - name: Verify final site
        run: |
          test -s player/index.html
          test -s player/knight/index.html
          test -s player/elf/index.html

          grep -Fq '기사' player/index.html
          grep -Fq '요정' player/index.html

          du -sh player

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player

  deploy:
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
