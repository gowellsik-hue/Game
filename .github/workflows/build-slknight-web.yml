
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V237
# BASE: Successfully deployed V235, run 41270546067 (V236 never deployed).
# FIX: Stage all 193 Map047 PNGs into Emscripten FS before map data callback.
# FIX: Prepare 96 floor and 73 nonblank upper-layer bitmaps at map entry.
# MOVEMENT: Never download, decode, construct or dispose map graphics while walking.
# PRESERVE: Original native Layer5 opacity mask and original Layer4 PNGs.
# PRESERVE: All Map047 collision values (384/385), four-way movement, NPCs,
#           Pandora, preloading pack, game controls and all other maps.
# KEEP DELETED: Map045 and Map046 Talking Island Dungeon.
# STATUS: Local functional tests passed; actual mobile execution unverified.
name: build-slknight-web.yml | V237 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V237 Download fully deployed V235 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41270546067
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V237 Verify unchanged game, NPCs and preload
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site
          cat > build/check_baseline.py <<'V237_BASELINE_PY'
          from pathlib import Path
          import hashlib,json,struct
          r=Path('site')
          before={str(p.relative_to(r)):hashlib.sha256(p.read_bytes()).hexdigest() for p in r.rglob('*') if p.is_file()}
          if len(before)!=5601:raise ValueError('Unexpected original V235 file inventory')
          if 'V235' not in (r/'knight/index.html').read_text('utf8'):
              raise ValueError('Not the deployed V235 base')
          if before['knight/gameasync/Data/Scripts.rxdata']!='0370a04d6b4b2c4eac6936cfe976a5527bcd2c1f129e40354a092409260b8437':
              raise ValueError('Wrong original V235 scripts')
          pref='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          if pref+'Map047.rxdata' not in before:raise ValueError('Map047 missing')
          for mid in (45,46):
              if pref+f'Map{mid:03d}.rxdata' in before:
                  raise ValueError('Removed Talking Island dungeon returned')
          if before['knight/gameasync/Graphics/Panoramas/SLTI_47_C7_4.png']!='d1f321ba3012e9422e909b2ba4865dfcfaf188cb0671c459597f935537a26991':
              raise ValueError('Original Map047 panorama altered')
          pack=r/'knight/assets/map-047-v234.pack'
          with pack.open('rb') as f:
              n=struct.unpack('<I',f.read(4))[0]
              manifest=json.loads(f.read(n))
          if manifest.get('kind')!='map' or manifest.get('map_id')!=47 or len(manifest['files'])!=193:
              raise ValueError('Missing Map047 original 97 plus 96 Layer4 PNG preload')
          for x in range(12):
              for y in range(8):
                  for prefix in (f'SLTI_47_C{x}_{y}.png',f'SLTI_47_L4_C{x}_{y}.png'):
                      key='knight/gameasync/Graphics/Panoramas/'+prefix
                      if key not in before:raise ValueError('Missing terrain or Layer4 PNG '+key)
          Path('build/before.json').write_text(json.dumps(before,sort_keys=True),'utf8')
          print('PASS original 5601 files, map data, NPCs, collision and 193 PNG pack')
          V237_BASELINE_PY
          python3 build/check_baseline.py

      - name: V237 Select only nontransparent original Layer4 images
        shell: bash
        run: |
          set -euo pipefail
          cat > build/foreground_manifest.py <<'V237_MANIFEST_PY'
          from pathlib import Path
          import struct,zlib,json
          root=Path('site/knight/gameasync/Graphics/Panoramas')
          def has_pixels(path):
           b=path.read_bytes()
           if b[:8]!=b'\x89PNG\r\n\x1a\n':raise ValueError('Not native RGBA PNG: '+str(path))
           pos=8; parts=[]; w=h=depth=kind=None
           while pos+12<=len(b):
            size=int.from_bytes(b[pos:pos+4],'big');tag=b[pos+4:pos+8]
            data=b[pos+8:pos+8+size]
            if len(data)!=size or pos+12+size>len(b):raise ValueError('Truncated PNG '+str(path))
            if zlib.crc32(tag+data)&0xffffffff!=int.from_bytes(b[pos+8+size:pos+12+size],'big'):
             raise ValueError('Corrupted PNG '+str(path))
            pos+=12+size
            if tag==b'IHDR':w,h,depth,kind,_,_,_=struct.unpack('>IIBBBBB',data)
            elif tag==b'IDAT':parts.append(data)
            elif tag==b'IEND':break
           if (w,h,depth,kind)!=(512,512,8,6):raise ValueError('Unexpected original Layer4 PNG format '+str(path))
           raw=zlib.decompress(b''.join(parts))
           stride=w*4+1
           if len(raw)!=stride*h:raise ValueError('Invalid RGBA scanline size '+str(path))
           # With PNG filters 0..4 an all-transparent alpha plane filters to all zero
           # alpha bytes; any nonzero filtered alpha implies visible pixels.
           return any(any(raw[row*stride+4:row*stride+stride:4]) for row in range(h))
          keys=[]
          for x in range(12):
           for y in range(8):
            if has_pixels(root/f'SLTI_47_L4_C{x}_{y}.png'):keys.append([x,y])
          assert len(keys)==73,('Unexpected V235 original visible Layer4 chunk count',len(keys))
          Path('build/foreground_keys.json').write_text(json.dumps(keys,separators=(',',':')),'utf8')
          print('PASS 96 source Layer4 assets; 73 contain nontransparent pixels, 23 empty skipped from bitmap memory')
          V237_MANIFEST_PY
          python3 build/foreground_manifest.py

      - name: V237 Decode all Map047 bitmaps once, before gameplay
        shell: bash
        run: |
          set -euo pipefail
          cat > build/layer_runtime.rb <<'V237_RUNTIME_RUBY'
          # V237 - Map047 preloaded-only renderer.
          # All map graphics are unpacked into the virtual filesystem before entering.
          # All required bitmaps/sprites are created once during Spriteset_Map.initialize.
          # No asset download, bitmap creation, bitmap disposal or cache miss on movement.
          module SLNativeLayerV237
            WIDTH = 363
            HEIGHT = 238
            MASK_HEX = '__MASK_HEX__'
            FOREGROUND_KEYS = __FOREGROUND_KEYS__

            def self.behind?(x,y)
              return false if x<0 || y<0 || x>=WIDTH || y>=HEIGHT
              pos = y*WIDTH+x
              nibble = MASK_HEX[(pos>>3)*2+((pos&4)==0 ? 1 : 0),1]
              return false unless nibble
              (nibble.to_i(16) & (1 << (pos&3))) != 0
            end
          end

          class Sprite_Character
            alias sl_v237_original_character_update update
            def update
              sl_v237_original_character_update
              return unless $game_map && $game_map.map_id==47 && $game_player
              return unless @character && @character.equal?($game_player)
              opacity = @character.opacity
              self.opacity = SLNativeLayerV237.behind?(@character.x,@character.y) ?
                (opacity < 150 ? opacity : 150) : opacity
            end
          end

          class Spriteset_Map
            alias sl_v237_original_initialize initialize
            alias sl_v237_original_update update
            alias sl_v237_original_slti_update_terrain slti_update_terrain
            alias sl_v237_original_dispose dispose

            def initialize
              @sl_v237_ready = false
              sl_v237_original_initialize
              return unless $game_map && $game_map.map_id==47
              sl_v237_prepare_all
              @sl_v237_ready = true
              sl_v237_update_ground
              sl_v237_update_cover
            end

            def sl_v237_prepare_all
              raise 'V237: wrong original Map047 grid' unless @slti_floor==47 &&
                @slti_cols==12 && @slti_rows==8 && @slti_chunks.empty?

              # Reuse the original terrain sprite collection, but fill it only here.
              # slti_update_terrain is overridden below and never loads on movement.
              12.times do |x|
                8.times do |y|
                  name='Graphics/Panoramas/SLTI_47_C'+x.to_s+'_'+y.to_s
                  bitmap=Bitmap.new(name)
                  sprite=Sprite.new(@viewport2)
                  sprite.bitmap=bitmap
                  sprite.z=-1500
                  sprite.zoom_x=2.0
                  sprite.zoom_y=2.0
                  sprite.visible=false
                  @slti_chunks[[x,y]]=sprite
                end
              end
              raise 'V237: incomplete original terrain cache' unless @slti_chunks.length==96

              @sl_v237_foreground={}
              SLNativeLayerV237::FOREGROUND_KEYS.each do |key|
                x,y=key
                name='Graphics/Panoramas/SLTI_47_L4_C'+x.to_s+'_'+y.to_s
                @sl_v237_foreground[key]=Bitmap.new(name)
              end
              raise 'V237: missing original Layer4 graphics' unless
                @sl_v237_foreground.length==SLNativeLayerV237::FOREGROUND_KEYS.length

              @sl_v237_covers=[]
              4.times do
                sprite=Sprite.new(@viewport2)
                sprite.z=9999
                sprite.zoom_x=2.0
                sprite.zoom_y=2.0
                sprite.opacity=200
                sprite.visible=false
                @sl_v237_covers << sprite
              end
              @sl_v237_active_ground={}
            end

            # Bypass the original 12-texture LRU for Map047.
            # No Bitmap.new on update, and no disposal of visited chunks.
            def slti_update_terrain
              if $game_map && $game_map.map_id==47
                sl_v237_update_ground if @sl_v237_ready
              else
                sl_v237_original_slti_update_terrain
              end
            end

            def sl_v237_update_ground
              sx=[$game_map.display_x.to_i/4,0].max
              sy=[$game_map.display_y.to_i/4,0].max
              vw=@viewport2.rect.width
              vh=@viewport2.rect.height
              return if vw<=0 || vh<=0
              left=[sx/1024,0].max
              top=[sy/1024,0].max
              right=[(sx+vw-1)/1024,11].min
              bottom=[(sy+vh-1)/1024,7].min
              required={}
              if left<=right && top<=bottom
                (top..bottom).each do |y|
                  (left..right).each{|x|required[[x,y]]=true}
                end
              end
              prev=@sl_v237_active_ground||{}
              prev.each_key do |key|
                @slti_chunks[key].visible=false unless required[key]
              end
              required.each_key do |key|
                sprite=@slti_chunks[key]
                raise 'V237: terrain was not predecoded' unless sprite
                sprite.visible=true
                sprite.x=key[0]*1024-sx
                sprite.y=key[1]*1024-sy
              end
              @sl_v237_active_ground=required
              @slti_r60_floor_ready=true
            end

            def update
              sl_v237_original_update
              sl_v237_update_cover if @sl_v237_ready && $game_map && $game_map.map_id==47
            end

            def sl_v237_hide_covers
              return unless @sl_v237_covers
              @sl_v237_covers.each{|sp|sp.visible=false}
            end

            def sl_v237_update_cover
              unless $game_player && SLNativeLayerV237.behind?($game_player.x,$game_player.y)
                sl_v237_hide_covers
                return
              end
              sx=$game_map.display_x.to_i/4
              sy=$game_map.display_y.to_i/4
              x=($game_player.screen_x+sx)/2
              y=($game_player.screen_y+sy)/2
              left=[x-20,0].max
              top=[y-48,0].max
              right=[x+20,6144].min
              bottom=[y+6,4096].min
              if right<=left || bottom<=top
                sl_v237_hide_covers
                return
              end
              needed=[]
              (top/512..(bottom-1)/512).each do |cy|
                (left/512..(right-1)/512).each{|cx|needed << [cx,cy]}
              end
              raise 'V237: unexpected cover geometry' if needed.length>4
              needed.each_with_index do |key,i|
                sprite=@sl_v237_covers[i]
                bitmap=@sl_v237_foreground[key]
                unless bitmap
                  sprite.visible=false
                  next
                end
                sprite.bitmap=bitmap unless sprite.bitmap.equal?(bitmap)
                x0=[left,key[0]*512].max
                y0=[top,key[1]*512].max
                x1=[right,(key[0]+1)*512].min
                y1=[bottom,(key[1]+1)*512].min
                sprite.src_rect.set(x0-key[0]*512,y0-key[1]*512,x1-x0,y1-y0)
                sprite.x=2*x0-sx
                sprite.y=2*y0-sy
                sprite.visible=true
              end
              i=needed.length
              while i<@sl_v237_covers.length
                @sl_v237_covers[i].visible=false
                i+=1
              end
            end

            def dispose
              if @sl_v237_covers
                @sl_v237_covers.each do |sprite|
                  next unless sprite && !sprite.disposed?
                  sprite.bitmap=nil
                  sprite.dispose
                end
                @sl_v237_covers=nil
              end
              if @sl_v237_foreground
                @sl_v237_foreground.each_value do |bitmap|
                  bitmap.dispose if bitmap && !bitmap.disposed?
                end
                @sl_v237_foreground=nil
              end
              # The original Spriteset_Map.dispose owns/disposes the 96 floor sprites.
              sl_v237_original_dispose
            end
          end
          V237_RUNTIME_RUBY
          ruby -c build/layer_runtime.rb

          cat > build/patch_rgss.rb <<'V237_PATCH_RUBY'
          require 'json'
          require 'zlib'
          require 'digest'
          source_file='site/knight/gameasync/Data/Scripts.rxdata'
          previous=File.binread(source_file)
          expected='0370a04d6b4b2c4eac6936cfe976a5527bcd2c1f129e40354a092409260b8437'
          raise 'Wrong original V235 RGSS script' unless Digest::SHA256.hexdigest(previous)==expected
          scripts=Marshal.load(previous)
          raise 'Wrong V235 script placement' unless scripts.length==137 && scripts[-2][1]=='SLNativeLayerV235' && scripts[-1][1]=='Main'
          old=Zlib::Inflate.inflate(scripts[-2][2])
          mask=old[/MASK_HEX='([0-9a-f]+)'/,1]
          raise 'Old native Layer5 bitmask missing' unless mask && mask.length==21600
          keys=JSON.parse(File.read('build/foreground_keys.json'))
          raise 'Layer4 manifest changed' unless keys.length==73 && keys.all?{|pair|pair.length==2 && pair[0].between?(0,11) && pair[1].between?(0,7)}
          code=File.read('build/layer_runtime.rb')
          raise 'Missing exactly one mask token' unless code.scan('__MASK_HEX__').size==1
          raise 'Missing exactly one key token' unless code.scan('__FOREGROUND_KEYS__').size==1
          code=code.sub('__MASK_HEX__',mask).sub('__FOREGROUND_KEYS__',JSON.generate(keys))
          raise 'Wrong Layer5 data copied' unless code[/MASK_HEX = '([0-9a-f]+)'/,1]==mask
          raise 'Missing original terrain override' unless code.include?('def slti_update_terrain') && code.include?('sl_v237_prepare_all')
          File.binwrite('build/runtime_v237.rb',code)
          scripts[-2][1]='SLNativeLayerV237'
          scripts[-2][2]=Zlib::Deflate.deflate(code,9)
          File.binwrite(source_file,Marshal.dump(scripts))
          check=Marshal.load(File.binread(source_file))
          source=Marshal.load(previous)
          raise 'Unapproved RGSS section changes' unless check.size==source.size && check[0...-2]==source[0...-2] && check[-1]==source[-1]
          raise 'Wrong RGSS patch version' unless check[-2][1]=='SLNativeLayerV237'
          puts 'PASS original Layer5 bitmap exactly preserved; original 136 RPG sections unchanged'
          puts 'PASS preload 96 base floor bitmaps + 73 nonblank foreground bitmaps on Map047 entry'
          puts 'PASS movement code uses pre-created Sprite and Bitmap objects only'
          V237_PATCH_RUBY
          ruby -c build/patch_rgss.rb
          ruby build/patch_rgss.rb
          ruby -c build/runtime_v237.rb

      - name: V237 Put all 193 map images in the game filesystem before opening
        shell: bash
        run: |
          set -euo pipefail
          cat > build/patch_loader.py <<'V237_JSLOADER_PY'
          from pathlib import Path
          import re
          path=Path('site/knight/js/sl-assets-v229r115.js')
          s=path.read_text('utf8')
          assert s.count("var version='V235';")==1
          s=s.replace("var version='V235';", "var version='V237';")

          def sub_once(old,new):
           global s
           if s.count(old)!=1:raise ValueError(f'Preload script changed: {old[:120]} (count={s.count(old)})')
           s=s.replace(old,new)

          sub_once('var ready=Object.create(null), currentMap=null, overlay=null;',
           'var ready=Object.create(null), currentMap=null, overlay=null;\n'
           '  var map47Keys=null, map47FilesReady=false;')
          sub_once('    Object.keys(items).forEach(function(k){staged[k]=items[k];});\n    return head.files.length;',
           '    Object.keys(items).forEach(function(k){staged[k]=items[k];});\n'
           '    if(kind===\'map\'&&mid===47){\n'
           '      if(head.files.length!==193)throw new Error(\'Expected 193 Map047 source images\');\n'
           '      map47Keys=head.files.map(function(row){return row[0];});\n'
           '    }\n'
           '    return head.files.length;')

          new_js=r'''  // V237: unlike staging the compressed pack, this finishes *all* image
            // installation into the game virtual filesystem before Map047.rxdata.
            // On movement the existing Bitmap objects are simply re-positioned.
            function installMap47Files(){
              if(map47FilesReady)return Promise.resolve();
              if(!map47Keys||map47Keys.length!==193)throw new Error('Map047 manifest missing');
              var keys=map47Keys.slice(), next=0, done=0;
              function installOne(key){
                var mapped=mapping[key];
                if(!mapped)throw new Error('Missing Map047 mapping '+key);
                var filepath=mapped.split('?')[0];
                var lower=filepath.toLowerCase();
                var bytes=staged[lower];
                if(!bytes||bytes.length<8)throw new Error('Missing staged Map047 bytes '+key);
                if(window.fileAsyncCache[key])return Promise.resolve();
                var slash=filepath.lastIndexOf('/');
                if(slash<0)throw new Error('Missing Map047 resource directory '+key);
                var folder='/game/'+filepath.substring(0,slash);
                var filename=filepath.substring(slash+1);
                return new Promise(function(resolve,reject){
                  var settled=false;
                  function ok(){if(settled)return;settled=true;window.fileAsyncCache[key]=1;resolve();}
                  function fail(err){if(settled)return;settled=true;reject(new Error('Map047 image installation '+key+': '+err));}
                  try{
                    FS.createPreloadedFile(folder,filename,bytes,true,true,ok,fail,false,false,
                      function(){try{FS.unlink(folder+'/'+filename);}catch(_e){}});
                  }catch(err){fail(err);}
                });
              }
              function worker(){
                if(next>=keys.length)return Promise.resolve();
                var key=keys[next++];
                return installOne(key).then(function(){
                  done++;
                  if(done===keys.length || done%8===0){
                    label('Map 47 graphics installed '+done+'/'+keys.length);
                    display('Preparing all Map 47 graphics before movement\n'+done+'/'+keys.length);
                  }
                  return worker();
                });
              }
              // A few concurrent installs during entry, zero installs during walking.
              return Promise.all([worker(),worker(),worker(),worker()]).then(function(){
                if(done!==193)throw new Error('Map047 was not fully installed');
                map47FilesReady=true;
                label('Map 47 graphics installed 193/193');
              });
            }
          '''
          sub_once('  function prepareMap(mid){\n',new_js+'  function prepareMap(mid){\n')
          old='''  function prepareMap(mid){
              return Promise.all([
                prepare('shared','shared',null,'shared-v229r115.pack',function(a,b){progress('Action assets',a,b);}),
                prepare('map'+mid,'map',mid,(mid===47?'map-047-v234.pack':'map-'+String(mid).padStart(3,'0')+'-v229r115.pack'),function(a,b){progress('Map '+mid+' terrain',a,b);})
              ]);
            }'''
          assert s.count(old)==1,'Cannot find original prepareMap'
          new=old.replace('    ]);','    ]).then(function(result){\n      return mid===47 ? installMap47Files().then(function(){return result;}) : result;\n    });')
          s=s.replace(old,new)
          path.write_text(s,'utf8')
          print('PASS virtual-FS preload guards, 193 image queue, four installation workers, unchanged non-47 maps')
          V237_JSLOADER_PY
          python3 build/patch_loader.py
          node --check site/knight/js/sl-assets-v229r115.js

      - name: V237 Refresh only browser cache and version
        shell: bash
        run: |
          set -euo pipefail
          cat > build/refresh_version.py <<'V237_REFRESH_PY'
          from pathlib import Path
          import re,hashlib
          root=Path('site')
          scripts=root/'knight/gameasync/Data/Scripts.rxdata'
          md5=hashlib.md5(scripts.read_bytes()).hexdigest()
          mapping=root/'knight/gameasync/mapping.js'
          old=mapping.read_text('utf8')
          new,n=re.subn(r'(Data/Scripts\.rxdata\?h=)[0-9a-f]{32}',lambda m:m.group(1)+md5,old)
          if n!=1:raise ValueError('Original Scripts.rxdata URL not found exactly once')
          mapping.write_text(new,'utf8')
          for path in ('index.html','knight/index.html'):
              p=root/path
              text=p.read_text('utf8')
              if 'V235' not in text:raise ValueError('Original HTML version mismatch '+path)
              p.write_text(text.replace('V235','V237').replace('v235','v237'),'utf8')
          assets=root/'knight/js/sl-assets-v229r115.js'
          text=assets.read_text('utf8')
          if "var version='V237';" not in text or "mid===47?'map-047-v234.pack'" not in text:
              raise ValueError('Map047 preloading or version unexpectedly changed')
          if 'installMap47Files()' not in text or 'FS.createPreloadedFile' not in text:
              raise ValueError('Eager Map047 virtual filesystem preparation missing')
          if 'js/sl-assets-v229r115.js?v=v237' not in (root/'knight/index.html').read_text('utf8'):
              raise ValueError('Browser bootstrap cache tag unchanged')
          print('PASS V237 version and Scripts.rxdata cache; 193 PNGs install before Map047')
          V237_REFRESH_PY
          python3 build/refresh_version.py
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: V237 Assert zero per-move image loading and protect game files
        shell: bash
        run: |
          set -euo pipefail
          cat > build/check_final.py <<'V237_FINAL_PY'
          from pathlib import Path
          import json,hashlib
          root=Path('site')
          before=json.loads(Path('build/before.json').read_text('utf8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          allowed={'knight/gameasync/Data/Scripts.rxdata','knight/gameasync/mapping.js',
                   'knight/js/sl-assets-v229r115.js','index.html','knight/index.html'}
          if set(before)!=set(after):raise ValueError('Original files added or removed')
          changed={p for p in before if before[p]!=after[p]}
          if changed!=allowed:raise ValueError('Unauthorized changed files: '+repr(changed^allowed))
          pref='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          for mid in (45,46):
              if pref+f'Map{mid:03d}.rxdata' in after:raise ValueError('Removed dungeon returned')
          for path in (pref+'Map047.rxdata','knight/assets/map-047-v234.pack',
                       'knight/gameasync/Graphics/Panoramas/SLTI_47_C7_4.png'):
              if before[path]!=after[path]:raise ValueError('Changed protected map/collision/pack: '+path)
          for x in range(12):
              for y in range(8):
                  for name in (f'SLTI_47_C{x}_{y}.png',f'SLTI_47_L4_C{x}_{y}.png'):
                      p='knight/gameasync/Graphics/Panoramas/'+name
                      if before[p]!=after[p]:raise ValueError('Original PNG changed: '+p)
