name: Deploy SLKnight SAFE164 FIX + SLFairy 800

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  Z105_SHA: e19659507b466b87a671949532b02484bc1faaef
  Z104_SHA: e044e1b6c53646b4c4f21f2dfee4967a68fabbc4
  DUAL_BASE_SHA: 04ce66ec99abc10f77143de53650685db8949532
  CURRENT_Z10_SHA: f545634bafbe1e1e55aaf6489126ad17b07da382
  BASELINE_SHA: c6815cd461dba60ec131898e6d5dd8690dd915ae
  X2_SHA: 6d941bd643dda87b8267ba466e108d1904c22331
  Z1_SHA: 008b6abe81074b7af877806b45f2314004a74f66
  Z3_SHA: 5a46988b048764e8a99700998c1f4ab96a3ec5c1
  CE_FIX_SHA: e30b0c41dc7fe7ec49fa17501d198339f7006cf6
  FAIRY_BOOT_SHA: 48e9f884ee1dfb30760f4ff84e643d3a785541ea
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  FAIRY_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLFairy_Source_v1.zip
  FAIRY_SHA256: 67b88b5fe0cde3c9f2fada889815f9aa7d0fc94b378025529e9950d55151c70e
  FAIRY_7Z_PASSWORD: http://nemo838.tistory.com/
  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout z10.5 source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z105_SHA }}
          path: z105src

      - name: Checkout z10.4 source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z104_SHA }}
          path: z104src

      - name: Checkout dual base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.DUAL_BASE_SHA }}
          path: dualbase

      - name: Checkout z10 source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.CURRENT_Z10_SHA }}
          path: z10src

      - name: Checkout V14.3l baseline
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.BASELINE_SHA }}
          path: baseline

      - name: Checkout V14.3x2 auto base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.X2_SHA }}
          path: x2

      - name: Checkout V14.3z1 monster base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z1_SHA }}
          path: z1

      - name: Checkout V14.3z3 monster base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z3_SHA }}
          path: z3

      - name: Checkout targeted CE fix source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.CE_FIX_SHA }}
          path: cefix

      - name: Checkout Fairy 800 boot fix source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.FAIRY_BOOT_SHA }}
          path: fairyboot

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake cmake curl ffmpeg freepats git imagemagick libtool make mm-common patch pkg-config python3 rake ruby timidity unzip wget xz-utils fonts-nanum p7zip-full nodejs

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.MKXP_SRC_REF }}
          path: engine

      - name: Cache engine dependencies
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-${{ runner.os }}-${{ env.EMSDK_VER }}-safe164-fix

      - name: Extract stable base and targeted fixes
        run: |
          set -euo pipefail

          ruby -ryaml - <<'RB'
          def steps(path)
            YAML.load_file(path).fetch('jobs').fetch('build').fetch('steps')
          end

          def save_step(list,name,path)
            step=list.find{|s|s['name']==name}
            abort "MISSING STEP: #{name}" unless step&&step['run']
            File.write(path,step['run'])
          end

          z105=steps('z105src/.github/workflows/build-slknight-web.yml')
          wanted=[
            ['Extract already-passed z10.4 build steps','/tmp/prep_00.sh'],
            ['Run frozen successful build through repaired Fairy mappings','/tmp/prep_01.sh'],
            ['Canonicalize SLFairy protected data paths and title','/tmp/prep_02.sh'],
            ['Rebuild SLFairy mappings after canonicalization','/tmp/prep_03.sh'],
            ['Finalize browser boot bridge and cache isolation','/tmp/prep_04.sh']
          ]
          wanted.each{|name,path|save_step(z105,name,path)}

          save_step(
            steps('cefix/.github/workflows/build-slknight-web.yml'),
            'Fix Knight CE4 CE10 CE68 CE107 only',
            '/tmp/fix_knight_ce.sh'
          )

          save_step(
            steps('fairyboot/.github/workflows/build-slknight-web.yml'),
            'Patch Fairy boot once',
            '/tmp/fairy_boot_800.sh'
          )

          puts 'STABLE_BASE_AND_TARGETED_FIXES_EXTRACTED'
          RB

      - name: Build exact pre-167 working base
        run: |
          set -euo pipefail
          for i in 0 1 2 3 4; do
            bash -e "$(printf '/tmp/prep_%02d.sh' "$i")"
          done
          echo PRE167_BASE_BUILD_OK

      - name: Fix only Knight CE4 CE10 CE68 CE107
        run: |
          set -euo pipefail
          bash -e /tmp/fix_knight_ce.sh

      - name: Apply Fairy boot fix without 640 rewrite
        run: |
          set -euo pipefail
          bash -e /tmp/fairy_boot_800.sh
          (
            cd fairy_player/gameasync
            bash "$GITHUB_WORKSPACE/engine/extra/make_mapping.sh"
          )
          echo FAIRY_800_BOOT_FIX_OK

      - name: Preserve save namespaces and inline preload transforms
        run: |
          set -euo pipefail

          ruby -EUTF-8:UTF-8 -rjson - player/gameasync fairy_player/gameasync <<'RB'
          class RawMarshalObject
            def self._load(data)
              o=allocate
              o.instance_variable_set(:@raw,data)
              o
            end
            def _dump(_depth); @raw; end
          end
          class Tone < RawMarshalObject; end
          class Color < RawMarshalObject; end
          class Rect < RawMarshalObject; end
          class Table < RawMarshalObject; end
          module RPG
            class AudioFile; end
            class Animation; class Frame; end; class Timing; end; end
            class Map; end
            class CommonEvent; end
            class Event; class Page; class Condition; end; class Graphic; end; end; end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
          end

          def iv(o,n); o.instance_variable_get("@#{n}"); end

          def transform_names(game)
            cp=Dir.glob(File.join(game,'Data','*CommonEvents.rxdata')).max_by{|p|File.size(p)}
            abort "CommonEvents missing: #{game}" unless cp&&File.size(cp)>1000
            ce=Marshal.load(File.binread(cp))
            names=[]
            [6,17,34].each do |id|
              event=ce[id]
              next unless event
              (iv(event,:list)||[]).each do |cmd|
                next unless iv(cmd,:code)==209
                route=(iv(cmd,:parameters)||[])[1]
                next unless route
                (iv(route,:list)||[]).each do |move|
                  next unless iv(move,:code)==41
                  name=(iv(move,:parameters)||[])[0].to_s.dup.force_encoding(Encoding::UTF_8)
                  abort "invalid transform UTF8 CE#{id}" unless name.valid_encoding?
                  names << name unless name.empty?
                end
              end
            end
            names=names.uniq.sort
            abort "No transform graphics found: #{game}" if names.empty?
            names.each do |name|
              file=File.join(game,'Graphics','Characters',"#{name}.png")
              abort "Missing transform graphic: #{file}" unless File.size?(file)
            end
            names
          end

          File.write('/tmp/knight_transform.json',JSON.generate(transform_names(ARGV.fetch(0))),mode:'w:UTF-8')
          File.write('/tmp/fairy_transform.json',JSON.generate(transform_names(ARGV.fetch(1))),mode:'w:UTF-8')
          puts 'TRANSFORM_ASSET_LISTS_OK'
          RB

          python3 - <<'PY'
          from pathlib import Path
          import json

          configs=[
              (
                  Path('player/index.html'),
                  json.loads(Path('/tmp/knight_transform.json').read_text(encoding='utf-8')),
                  'v143safe164k',
                  'slknight_v14_engine',
                  'SLKnight SAFE164 FIX'
              ),
              (
                  Path('fairy_player/index.html'),
                  json.loads(Path('/tmp/fairy_transform.json').read_text(encoding='utf-8')),
                  'v143safe164e',
                  'slfairy_v105_engine',
                  'SLFairy SAFE164 FIX'
              )
          ]

          def clean_legacy_touch(s,name):
              start="        if (!is_touch_device()) {"
              end="        resize();"
              if start in s:
                  if s.count(start)!=1:
                      raise SystemExit(f'LEGACY TOUCH START {name} count={s.count(start)}')
                  a=s.index(start)
                  b=s.index(end,a)+len(end)
                  s=s[:a]+s[b:]
              if 'is_touch_device()' in s:
                  raise SystemExit(f'is_touch_device remains in {name}')
              if "bindKey('d-up'" in s:
                  raise SystemExit(f'legacy bindKey remains in {name}')
              return s

          def inject_transform_preload(s,names,cache_tag,name):
              marker="}],\n            postRun:"
              if s.count(marker)!=1:
                  raise SystemExit(f'PRE-RUN END {name} count={s.count(marker)}')
              if 'var slTransformSheets=' in s:
                  raise SystemExit(f'transform preload already exists in {name}')
              js_names=json.dumps(names,ensure_ascii=False,separators=(',',':'))
              block=f"""
            var slTransformSheets={js_names};
            slTransformSheets.forEach(function(name){{
              var file=name+'.png';
              var p='/game/Graphics/Characters/'+file;
              try{{if(FS.analyzePath(p).exists)FS.unlink(p);}}catch(e){{}}
              FS.createPreloadedFile(
                '/game/Graphics/Characters',
                file,
                encodeURI('gameasync/Graphics/Characters/'+file+'?v={cache_tag}'),
                true,
                true,
                function(){{}},
                function(){{console.error('SLTRANSFORMERR|'+file);}}
              );
            }});
          """
              return s.replace(marker,block+marker,1)

          for path,names,cache_tag,namespace,title in configs:
              s=path.read_text(encoding='utf-8')

              if namespace not in s:
                  raise SystemExit(f'PERMANENT NAMESPACE MISSING before patch: {namespace}')

              s=clean_legacy_touch(s,str(path))
              s=s.replace('position:fixed;left:8px;top:8px;','position:fixed;left:8px;bottom:8px;')

              if path.as_posix()=='player/index.html':
                  s=s.replace('v143z100',cache_tag)
                  s=s.replace('SLKnight V14.3z100',title)
              else:
                  s=s.replace('v143z105elf',cache_tag)
                  s=s.replace('SLFairy V14.3z10.5',title)

              if namespace not in s:
                  raise SystemExit(f'PERMANENT NAMESPACE LOST: {namespace}')

              s=inject_transform_preload(s,names,cache_tag,str(path))
              path.write_text(s,encoding='utf-8')

          print('PERMANENT_NAMESPACES_AND_INLINE_PRELOAD_OK')
          PY

          node --check player/js/drive.js
          node --check player/js/dpad.js
          node --check fairy_player/js/drive.js
          node --check fairy_player/js/dpad.js

      - name: Verify targeted state before deploy
        run: |
          set -euo pipefail

          test -s player/index.html
          test -s player/mkxp.js
          test -s player/mkxp.wasm
          test -s player/gameasync/Data/Scripts.rxdata
          test -s player/gameasync/mapping.js
          test -s fairy_player/index.html
          test -s fairy_player/mkxp.js
          test -s fairy_player/mkxp.wasm
          test -s fairy_player/gameasync/Data/Scripts.rxdata
          test -s fairy_player/gameasync/mapping.js

          grep -Fq 'slknight_v14_engine' player/index.html
          grep -Fq 'slfairy_v105_engine' fairy_player/index.html
          grep -Fq 'var slTransformSheets=' player/index.html
          grep -Fq 'var slTransformSheets=' fairy_player/index.html
          grep -Fq 'SLTRANSFORMERR' player/index.html
          grep -Fq 'SLTRANSFORMERR' fairy_player/index.html

          ! grep -Fq 'slknight_v106' player/index.html
          ! grep -Fq 'slfairy_v106' fairy_player/index.html
          ! grep -R -Fq 'SL_SAVE_NAMESPACE_MIGRATION' player fairy_player
          ! grep -R -Fq 'sltransform-v106g' player fairy_player

          ruby -EUTF-8:UTF-8 - player/gameasync <<'RB'
          game=ARGV.fetch(0)
          class RawMarshalObject
            def self._load(data);o=allocate;o.instance_variable_set(:@raw,data);o;end
            def _dump(_depth);@raw;end
          end
          class Tone < RawMarshalObject;end
          class Color < RawMarshalObject;end
          class Rect < RawMarshalObject;end
          class Table < RawMarshalObject;end
          module RPG
            class AudioFile;end
            class Animation;class Frame;end;class Timing;end;end
            class Map;end
            class CommonEvent;end
            class Event;class Page;class Condition;end;class Graphic;end;end;end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end
          def iv(o,n);o.instance_variable_get("@#{n}");end
          cp=Dir.glob(File.join(game,'Data','*CommonEvents.rxdata')).max_by{|p|File.size(p)}
          abort 'CommonEvents missing' unless cp
          ce=Marshal.load(File.binread(cp))

          ce4=iv(ce[4],:list)||[]
          ce10=iv(ce[10],:list)||[]
          ce107=iv(ce[107],:list)||[]
          ce68=ce[68]

          abort 'CE4 courage OFF missing' unless ce4.any?{|c|iv(c,:code)==121&&(iv(c,:parameters)||[])[0].to_i==172&&(iv(c,:parameters)||[])[2].to_i==1}
          abort 'CE4 CE68 recalc missing' unless ce4.any?{|c|iv(c,:code)==117&&(iv(c,:parameters)||[])==[68]}
          abort 'CE10 CE68 recalc missing' unless ce10.any?{|c|iv(c,:code)==117&&(iv(c,:parameters)||[])==[68]}
          abort 'CE107 enhanced OFF missing' unless ce107.any?{|c|iv(c,:code)==121&&(iv(c,:parameters)||[])[0].to_i==368&&(iv(c,:parameters)||[])[2].to_i==1}
          abort 'CE107 CE68 recalc missing' unless ce107.any?{|c|iv(c,:code)==117&&(iv(c,:parameters)||[])==[68]}
          abort 'CE68 owner wrong' unless iv(ce68,:trigger).to_i==2&&iv(ce68,:switch_id).to_i==998

          puts 'KNIGHT_TARGETED_CE_VERIFY_OK'
          RB

          ruby -rzlib - fairy_player/gameasync/Data/Scripts.rxdata <<'RB'
          scripts=Marshal.load(File.binread(ARGV[0]))
          entries=scripts.select{|e|e.is_a?(Array)&&e.length>=3&&e[1].to_s.start_with?('Web Resolution')}
          abort "FAIRY RESOLUTION COUNT=#{entries.size}" unless entries.size==1
          e=entries.first
          code=Zlib::Inflate.inflate(e[2])
          abort "FAIRY RESOLUTION NAME=#{e[1]}" unless e[1].to_s=='Web Resolution 800x600'
          abort 'FAIRY 800 WIDTH MISSING' unless code.include?('$WINDOW_WIDTH = 800')
          abort 'FAIRY 600 HEIGHT MISSING' unless code.include?('$WINDOW_HEIGHT = 600')
          abort 'FAIRY 800x600 RESIZE MISSING' unless code.include?('Graphics.resize_screen(800,600)')
          puts 'FAIRY_800_VERIFY_OK'
          RB

          echo TARGETED_PREDEPLOY_VERIFY_OK

      - name: Build dual site
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/knight site/elf
          cp -a player/. site/knight/
          cp -a fairy_player/. site/elf/

          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="ko">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
            <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
            <meta http-equiv="Pragma" content="no-cache">
            <meta http-equiv="Expires" content="0">
            <title>SLKnight + SLFairy</title>
            <style>
              html,body{margin:0;width:100%;height:100%;background:#080808;color:#fff;font-family:system-ui,sans-serif}
              .wrap{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px}
              .choices{display:flex;gap:16px}
              button{width:150px;height:160px;border:1px solid #777;border-radius:14px;background:#171717;color:#fff;font-size:25px}
            </style>
          </head>
          <body>
            <div class="wrap">
              <h1>캐릭터 선택</h1>
              <div class="choices">
                <button onclick="location.href='knight/?v='+Date.now()">기사</button>
                <button onclick="location.href='elf/?v='+Date.now()">요정</button>
              </div>
            </div>
          </body>
          </html>
          HTML

          touch site/.nojekyll
          rm -rf player fairy_player
          mv site player

      - name: Final sanity check
        run: |
          set -euo pipefail

          for side in knight elf; do
            test -s player/$side/index.html
            test -s player/$side/mkxp.js
            test -s player/$side/mkxp.wasm
            test -s player/$side/gameasync/Data/Scripts.rxdata
            test -s player/$side/gameasync/mapping.js
            test -s player/$side/js/drive.js
            test -s player/$side/js/dpad.js
          done

          grep -Fq 'slknight_v14_engine' player/knight/index.html
          grep -Fq 'slfairy_v105_engine' player/elf/index.html
          grep -Fq 'var slTransformSheets=' player/knight/index.html
          grep -Fq 'var slTransformSheets=' player/elf/index.html
          ! grep -R -Fq 'SL_SAVE_NAMESPACE_MIGRATION' player
          ! grep -R -Fq 'sltransform-v106g' player

          echo SAFE164_TARGETED_BUILD_OK

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player

  deploy:
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
