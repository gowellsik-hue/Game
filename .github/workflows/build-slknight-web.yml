
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R65
# BASE: verified V229R64 deploy, run 40093849653.
# COLLISION: ground 384 passes; solid base 385 blocks; only real doorway excepted.
# WALL FRONT/BACK: visual only, original depth/fade kept from R64.
# MASK SOURCE: offline checked native tile+S32+wall-foot graph for R64.
# TARGETED TEST: Map045 behind wall (94,78..82), wall base (97,69..70), door.
# PRESERVE: 5517 files, 106 TI monsters, all rewards, sprites, mapping and saves.
name: build-slknight-web.yml | V229R65 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R65 Download last confirmed R64 complete game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40093849653
          name: github-pages
          github-token: ${{ github.token }}
          path: base64game

      - name: V229R65 Restore and verify original 5517 files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s base64game/artifact.tar
          tar -xf base64game/artifact.tar -C site
          python3 - <<'PY_ORIGIN'
          import json,hashlib
          from pathlib import Path
          root=Path('site')
          assert 'V229R64' in (root/'index.html').read_text('utf-8')
          scripts=root/'knight/gameasync/Data/Scripts.rxdata'
          assert hashlib.sha256(scripts.read_bytes()).hexdigest()=='02e472171f7af3e96f843a8b3f4374779018052bfcae98a52c1b9221857d15b0'
          original={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(original)==5517,len(original)
          Path('build/r65-baseline.json').write_text(json.dumps(original,sort_keys=True))
          print('PASS exact R64 full game, 5517 files')
          PY_ORIGIN

