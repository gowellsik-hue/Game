
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R54
# BASE: deployed R52, run 39743709979 (491 V5.41-v2 EV balance).
# FIX: correct actual deployed R52 Scripts.rxdata SHA256.
# The R53 SHA was incorrect and blocked the build before patching.
# APPLY: remove R52's SECOND Game_Event#initialize alias.
# Never replace the existing R49 Game_Event constructor.
# Preserve 491 EV exact EXP, Adena (62 boss bands, 212 original normal random,
# 162 fixed no-native-RNG), HP, dodge, speed, Baal cleanup, field names.
# Preserve all original character sprites, 106 TI dungeon monsters, walls,
# audio, spawn, movement, combat events, common loot, existing saved games.
# No new input files; no map or common-event modifications.
name: build-slknight-web.yml | V229R54 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R54 Restore deployed R52 balance and full original game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39743709979
          name: github-pages
          github-token: ${{ github.token }}
          path: r52

      - name: V229R54 Verify source and preserve full R52 state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s r52/artifact.tar
          tar -xf r52/artifact.tar -C site
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          pre='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          scripts=root/'knight/gameasync/Data/Scripts.rxdata'
          expected='1692894165d623508c560a537bbcb0d66b9886b7e070b461878ec563353c9644'
          assert scripts.is_file() and hashlib.sha256(scripts.read_bytes()).hexdigest()==expected,'R52 source code differs'
          assert 'V229R52' in (root/'index.html').read_text('utf-8')
          assert 'V229R52' in (root/'knight/index.html').read_text('utf-8')
          original={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in root.rglob('*') if p.is_file()}
          assert len(original)==5517,len(original)
          for mid in (43,44,45,46):
              assert (root/(pre+f'Map{mid:03d}.rxdata')).is_file(),mid
          (Path('build')/'r54-baseline.json').write_text(json.dumps(original,sort_keys=True))
          print('PASS source: 5517 R52 files and original 491EV balance remain; site is not reconstructed')
          PY_BASE

      - name: V229R54 Remove only the double-init alias without losing V5.41 payouts
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r54_patch.rb <<'R54_PATCH'
          require 'zlib'
          require 'digest'
          require 'json'
          ROOT=ARGV.fetch(0)
          REPORT=ARGV.fetch(1)
          path=File.join(ROOT,'knight/gameasync/Data/Scripts.rxdata')
          expected='1692894165d623508c560a537bbcb0d66b9886b7e070b461878ec563353c9644'
          raise 'Unexpected deployed V229R52 scripts' unless Digest::SHA256.file(path).hexdigest==expected
          scripts=Marshal.load(File.binread(path))
          raise 'Scripts length changed' unless scripts.length==136
          before=Marshal.load(File.binread(path))
          code=Zlib::Inflate.inflate(scripts[134][2]).force_encoding('UTF-8')

          old=<<'OLD'
          class Game_Event
            alias slv541_original_initialize initialize
            def initialize(mid,ev)
              @slv541_rewarded=false
              @slv541_saw_live=false
              slv541_original_initialize(mid,ev)
            end
            alias slv541_original_refresh refresh
            def refresh
              slv541_original_refresh
          OLD

          new=<<'NEW'
          class Game_Event
            # Preserve R49's original initializer/super() chain exactly.
            # Initialize reward flags lazily for old saved-map objects.
            alias slv541_original_refresh refresh
            def refresh
              @slv541_rewarded=false if @slv541_rewarded==nil
              @slv541_saw_live=false if @slv541_saw_live==nil
              slv541_original_refresh
          NEW

          raise "Unexpected number of R52 wrappers #{code.scan(old).length}" unless code.scan(old).length==1
          raise 'Missing original R49 event constructor' unless code.include?('alias slti_r49_original_initialize initialize')
          raise 'Missing reward rows' unless code.include?('module SLV541') && code.include?('DATA={2=>{')

          code=code.sub(old,new)
          code=code.sub('# V229R52: V230 V5.41-v2 authoritative', '# V229R54: V230 V5.41-v2 authoritative')

          raise 'Original error-triggering double alias remains' if code.include?('slv541_original_initialize')
          raise 'No R49 initializer' unless code.include?('alias slti_r49_original_initialize initialize')
          raise 'No reward flag setup' unless code.include?('@slv541_saw_live=false if @slv541_saw_live==nil')

          scripts[134][2]=Zlib::Deflate.deflate(code.b)
          raise 'Unexpected script modifications' unless scripts.each_index.all?{|i| i==134 || scripts[i]==before[i]}

          File.binwrite(path,Marshal.dump(scripts))
          result=Zlib::Inflate.inflate(Marshal.load(File.binread(path))[134][2]).force_encoding('UTF-8')

          raise 'Literal reward map changed' unless result[/  DATA=.*\n/] == Zlib::Inflate.inflate(before[134][2]).force_encoding('UTF-8')[/  DATA=.*\n/]

          File.write(File.join(REPORT,'r54-runtime.rb'),result[result.index('# V229R54: V230 V5.41-v2 authoritative')..-1])
          File.write(File.join(REPORT,'r54-original-event.rb'),Zlib::Inflate.inflate(scripts[26][2]))

          File.write(File.join(REPORT,'r54-fix.json'),JSON.pretty_generate({
            version:'V229R54',
            cause:'Incorrect R52 Scripts SHA blocked R53 patch execution',
            fix:'Use verified R52 SHA and remove second Event initializer alias while preserving R49 initialization',
            source_scripts_sha:expected,
            original_r49_init_preserved:true,
            all_491_balance_records_preserved:true,
            common_loot_event_unchanged:true,
            unmodified_script_count:135
          }))
          puts 'PASS R54: correct R52 source, remove second initializer alias, preserve 491 balance records'
          R54_PATCH

          ruby -c /tmp/r54_patch.rb
          ruby /tmp/r54_patch.rb site build
          ruby -c build/r54-runtime.rb
          ruby -c build/r54-original-event.rb

      - name: V229R54 Test actual 491 event death-page rewards and no duplicated payouts
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r54_test.rb <<'R54_TEST'
          require 'json'

          module RPG
           class Map;end;class MapInfo;end;class AudioFile;end;class Tileset;end;class CommonEvent;end
           class Event;class Page;class Condition;end;class Graphic;end;end;end
           class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end

          [RPG::Event,RPG::Event::Page,RPG::Event::Page::Condition,RPG::Event::Page::Graphic].each do |klass|
           klass.class_eval do
            def method_missing(m,*a)
             key='@'+m.to_s
             return instance_variable_get(key) if a.empty? && instance_variable_defined?(key)
             super
            end
           end
          end

          class Table
           def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
           def _dump(d=0);@raw;end
          end
          class Tone
           def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
           def _dump(d=0);@raw;end
          end
          class Color<Tone;end

          class Game_Character
           attr_accessor :x,:y
           def initialize;@x=0;@y=0;@move_route_forcing=false;@original_direction=2;@original_pattern=0;end
           def moveto(x,y);@x=x;@y=y;end
          end

          class Interpreter
           def command_122; $original_varchanges=($original_varchanges || 0)+1;true;end
           def command_125; $original_gold=($original_gold || 0)+1;true;end
           def command_315; $original_exp=($original_exp || 0)+1;true;end
          end

          class MockParty
           attr_accessor :gold
           def initialize;@gold=0;end
           def gain_gold(n);@gold+=n;end
          end
          class Actor
           attr_accessor :exp
           def initialize;@exp=0;end
          end
          class MapMock
           attr_accessor :map_id,:events
           def initialize(id);@map_id=id;@events={};end
          end

          $game_player=Game_Character.new
          $game_player.x=-1000
          $game_player.y=-1000
          $game_party=MockParty.new
          $game_actors={1=>Actor.new}
          $game_variables=Hash.new(0)
          $game_switches=Hash.new(false)
          $game_self_switches=Hash.new(false)
          $game_map=MapMock.new(2)

          load File.join(ENV.fetch('R54_BUILD'),'r54-original-event.rb')
          load File.join(ENV.fetch('R54_BUILD'),'r54-runtime.rb')

          records=SLV541::DATA.flat_map do |mid,mobs|
           mobs.map do |id,s|
            row=Array.new(18)
            row[0]=mid;row[1]=id;row[2]='EV'+id.to_s
            row[13]=s[0];row[14]=s[1];row[15]=s[2];row[16]=s[3]
            row[17]=(s[0]==0 && s[1]==0) ? '비사냥 NPC' : '일반'
            row
           end
          end

          root=ARGV.fetch(0)
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          count=0;missing=[];paid=0;cases=0;gold_rng=0

          records.group_by{|r|r[0]}.each do |mid,items|
           m=Marshal.load(File.binread(File.join(root,'knight/gameasync/Data',pre+format('Map%03d.rxdata',mid))))
           $game_map=MapMock.new(mid)
           $game_variables=Hash.new(0)
           $game_switches=Hash.new(false)
           $game_self_switches=Hash.new(false)

           items.each do |r|
            id=r[1];name=r[2];xp=r[13];cash=r[14];low=r[15];high=r[16];cls=r[17]
            event=m.instance_variable_get(:@events)[id]
            beforeXP=$game_actors[1].exp
            beforeMoney=$game_party.gold

            obj=Game_Event.new(mid,event)
            $game_map.events[id]=obj
            stat=SLV541.stat(mid,id)
            raise "Data mismatch #{mid}:#{id}" unless stat!=nil && stat[0]==xp && stat[1]==cash

            var=stat[6];maxhp=stat[4];pidx=stat[5]
            $game_variables[var]=0
            obj.refresh
            $game_variables[var]=maxhp
            obj.refresh

            if cls!='비사냥 NPC'
             if obj.instance_variable_get(:@slv541_rewarded) != true
              missing<<[mid,id,name,stat[5],obj.instance_variable_get(:@page).equal?(event.instance_variable_get(:@pages)[pidx])]
             else
              paid+=1
              deltaM=$game_party.gold-beforeMoney
              deltaXP=$game_actors[1].exp-beforeXP

              raise "Wrong exp #{mid}:#{id} #{deltaXP}/#{xp}" unless deltaXP==xp

              if low!=nil
                raise "Boss gold outside v2 range #{mid}:#{id} #{deltaM} #{low}..#{high}" unless (low..high).include?(deltaM)
                gold_rng+=1
              elsif stat[14]!=nil && stat[15]!=nil && cash>0
                nlo,nhi=stat[14],stat[15]
                den=nlo+nhi
                lower=(cash*2*nlo+den/2)/den
                upper=(cash*2*nhi+den/2)/den
                raise "Original normal roll ratio failed #{mid}:#{id} #{deltaM}/#{lower}..#{upper}" unless (lower..upper).include?(deltaM)
                $native_tested=($native_tested||0)+1
              else
                raise "No original RNG must use base #{mid}:#{id} #{deltaM}/#{cash}" unless deltaM==cash
                $fixed_tested=($fixed_tested||0)+1 if cash>0
              end

              3.times{obj.refresh}

              i=Interpreter.new
              i.instance_variable_set(:@event_id,id)
              i.instance_variable_set(:@map_id,mid)
              i.command_125
              i.command_315
              i.instance_variable_set(:@parameters,[333,333,0,2,200,400])
              i.command_122
              i.instance_variable_set(:@parameters,[1926,1926,0,0,2501])
              i.command_122

              raise "Old message shows wrong gold #{mid}:#{id}" unless $game_variables[333]==deltaM && $game_variables[1926]==xp
              raise "Duplicate payment #{mid}:#{id}" unless $game_party.gold==beforeMoney+deltaM && $game_actors[1].exp==beforeXP+xp

              cases+=1
              $game_variables[var]=0
              obj.refresh
              $game_variables[var]=maxhp
              obj.refresh

              raise "No repeat kill award #{mid}:#{id}" unless $game_actors[1].exp==beforeXP+xp*2
             end
            end

            $game_variables[var]=0
            count+=1
           end
          end

          raise "Native normal RNG coverage failure #{($native_tested||0)}/#{($fixed_tested||0)}" unless $native_tested==212 && $fixed_tested==162 && gold_rng==62

          puts "491 records #{count}; paid=#{paid}; tests=#{cases}; boss ranges #{gold_rng}; native normal RNG #{$native_tested}; no-native-money-RNG #{$fixed_tested}; failures=#{missing.length}"
          puts missing.take(50).inspect

          [[2,1],[41,2]].each do |mid,eid|
            stat=SLV541.stat(mid,eid)
            raise "Missing native RNG fixture #{mid}:#{eid}" if stat==nil || stat[14]==nil
            observed=[]
            60.times do
              before=$game_party.gold
              SLV541.pay(nil,stat)
              observed << $game_party.gold-before
            end
            raise "Ordinary native RNG incorrectly fixed #{mid}:#{eid}: #{observed.uniq.inspect}" unless observed.uniq.length>5
            puts "PASS native variable Adena #{mid}:#{eid} #{observed.uniq.length} distinct values"
          end

          exit(missing.empty? && paid==490 ? 0:1)
          R54_TEST

          ruby -c /tmp/r54_test.rb
          R54_BUILD=build ruby /tmp/r54_test.rb site | tee build/r54-kill-regression.txt
          grep -q '491 records 491; paid=490; tests=490; boss ranges 62; native normal RNG 212; no-native-money-RNG 162; failures=0' build/r54-kill-regression.txt
          test "$(grep -c '^PASS native variable Adena' build/r54-kill-regression.txt)" -eq 2

      - name: V229R54 Refresh scripts digest and visible version only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_MANIFEST'
          from pathlib import Path
          import re,hashlib
          root=Path('site')
          file=root/'knight/gameasync/mapping.js'
          scripts=root/'knight/gameasync/Data/Scripts.rxdata'
          text=file.read_text('utf-8')
          text,n=re.subn(r'Data/Scripts\.rxdata\?h=[0-9a-f]{32}',
                         lambda m:'Data/Scripts.rxdata?h='+hashlib.md5(scripts.read_bytes()).hexdigest(),text)
          assert n==1,'Scripts digest must be updated exactly once'
          file.write_text(text,encoding='utf-8')

          for name in ('index.html','knight/index.html'):
              p=root/name
              source=p.read_text('utf-8')
              assert 'V229R52' in source,name
              p.write_text(source.replace('V229R52','V229R54').replace('v229r52','v229r54'),encoding='utf-8')

          print('PASS scripts hash and both visible R54 labels')
          PY_MANIFEST

          node --check site/knight/gameasync/mapping.js

      - name: V229R54 Prove that 491EV maps, loot, Gir and TI fields are unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          base=json.loads(Path('build/r54-baseline.json').read_text('utf-8'))
          now={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
               for p in root.rglob('*') if p.is_file()}

          assert len(base)==len(now)==5517 and base.keys()==now.keys()

          changes={k for k in base if base[k]!=now[k]}
          allowed={
            'index.html',
            'knight/index.html',
            'knight/gameasync/mapping.js',
            'knight/gameasync/Data/Scripts.rxdata'
          }

          assert changes==allowed,('Unexpected change',changes^allowed)

          report=json.loads(Path('build/r54-fix.json').read_text('utf-8'))
          assert report['all_491_balance_records_preserved']
          assert report['original_r49_init_preserved']
          assert 'V229R54' in (root/'index.html').read_text('utf-8')
          assert 'V229R54' in (root/'knight/index.html').read_text('utf-8')

          print('PASS: 4 updated site files only, no map edits, no loot edits, R52 balance unchanged')
          PY_FINAL

      - name: V229R54 Upload double-initialize repair and payout regression records
        uses: actions/upload-artifact@v4
        with:
          name: SLKnight-V229R54-Fix-R52-SaveLoad-TypeError-491EV
          path: |
            build/r54-fix.json
            build/r54-kill-regression.txt
          retention-days: 30
          if-no-files-found: error

      - name: V229R54 Deploy corrected original game to SAME GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
