name: V218 | Fix Fairy ATK and V217 Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: slknight-github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Restore proven V216 build
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 38522314631
          github-token: ${{ github.token }}
          path: previous
      - name: Patch and verify Fairy only
        shell: bash
        run: |
          set -euo pipefail
          test -s previous/artifact.tar || { echo 'V216 artifact expired: no safe base'; exit 1; }
          mkdir -p site
          tar -xf previous/artifact.tar -C site
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('site');elf=root/'elf'
          if len([p for p in root.rglob('*') if p.is_file()])!=5354:raise SystemExit('Wrong V216 site')
          expected={'js/dpad.js':'52e1b860e2ad9c3f6194d7cf983bcf6fa1a43354650d71fd9fd11984761cde69','gameasync/Data/Scripts.rxdata':'5c614524e2297770e476fef2a1d5fb5ce78242e84a12e6d613dae53eca86cf7c'}
          for name,digest in expected.items():
              if hashlib.sha256((elf/name).read_bytes()).hexdigest()!=digest:raise SystemExit('Wrong base '+name)
          p=elf/'js/dpad.js';s=p.read_text();a=s.index('function attackButton(parent){');b=s.index('\nfunction button(',a);part=s[a:b]
          if part.count('67')!=5:raise SystemExit('Unexpected ATK code')
          part=part.replace('67','118')
          p.write_text(s[:a]+part+s[b:])
          p=elf/'index.html';s=p.read_text()
          for old,new in [('js/dpad.js?v=fairy198','js/dpad.js?v=fairy218'),('gameasync/mapping.js?v=fairy216','gameasync/mapping.js?v=fairy218'),("box.textContent='V216 '+state","box.textContent='V218 '+state")]:
              if s.count(old)!=1:raise SystemExit('Cache mismatch '+old)
              s=s.replace(old,new)
          p.write_text(s)
          PY
          ruby - site/elf/gameasync/Data/Scripts.rxdata site/elf/gameasync/Data/VIQLMRLKMVIPVMJHOCSULWPCHOJTMRVIAFODOARHMap029.rxdata <<'RB'
          # encoding: utf-8
          require 'zlib'
          p=ARGV[0];a=Marshal.load(File.binread(p));x=a.find{|e|e[1]=='Web Compatibility'}
          abort 'Missing adapter' unless x
          s=Zlib::Inflate.inflate(x[2]).force_encoding('UTF-8');old='    when 70 then Input::F5'
          abort 'Wrong F key' unless s.scan(old).size==1
          s=s.sub(old,'    when 70 then Input::F7');RubyVM::InstructionSequence.compile(s)
          x[2]=Zlib::Deflate.deflate(s);File.binwrite(p,Marshal.dump(a))
          scene=Zlib::Inflate.inflate(a.find{|e|e[1]=='Scene_Map'}[2]).force_encoding('UTF-8')
          abort 'Original attack missing' unless scene.include?('Keyboard.testkey(70)')&&scene.include?('$game_switches[763] = true')
          module RPG
            class Map;end;class Event;end;class Event::Page;end
            class Event::Page::Condition;end;class Event::Page::Graphic;end
            class EventCommand;end;class MoveRoute;end;class MoveCommand;end;class AudioFile;end
          end
          class Stub;def self._load(_);new;end;end
          class Color<Stub;end;class Tone<Stub;end;class Table<Stub;end
          m=Marshal.load(File.binread(ARGV[1]))
          gnolls=m.instance_variable_get(:@events).values.select{|e|e.instance_variable_get(:@name).to_s.dup.force_encoding('UTF-8')=='[ID놀]'}
          abort 'Wrong Gnoll count' unless gnolls.size==3
          gnolls.each do |g|
            page=g.instance_variable_get(:@pages).first;cmds=page.instance_variable_get(:@list)
            abort 'Gnoll collision missing' unless page.instance_variable_get(:@trigger)==4&&[760,761].all?{|n|cmds.any?{|c|c.instance_variable_get(:@code)==111&&c.instance_variable_get(:@parameters)[1]==n}}
          end
          RB
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          elf=Path('site/elf');p=elf/'gameasync/mapping.js';s=p.read_text()
          md5=hashlib.md5((elf/'gameasync/Data/Scripts.rxdata').read_bytes()).hexdigest()
          pat=r'(\["data/scripts",\s*"Data/Scripts\.rxdata\?h=)[0-9a-f]{32}("\],)'
          s,n=re.subn(pat,lambda m:m.group(1)+md5+m.group(2),s)
          if n!=1:raise SystemExit('Scripts cache mismatch')
          p.write_text(s)
          assert 'slknight_v14_engine' in Path('site/knight/index.html').read_text()
          PY
          node --check site/elf/js/dpad.js
      - name: Upload Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
