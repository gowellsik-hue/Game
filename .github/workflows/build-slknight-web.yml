           s=s.replace(a,b,1)
          old='''function layoutSkillPad(dpad,skill,w,h,portrait){
            const buttonH=portrait?52:46,gap=portrait?12:10;
            const targetSize=portrait?184:156;
            const size=Math.max(114,Math.min(targetSize,w+12,h-buttonH-gap-14));
            const cy=Math.max(size/2+7,Math.min(h*0.5+(portrait?18:12),h-size/2-gap-buttonH-7));
            centerBox(dpad,w/2,cy,size,size);
            centerBox(skill,w/2,cy+size/2+gap+buttonH/2,Math.min(w+8,portrait?100:90),buttonH);
          }'''
          new='''function layoutSkillPad(dpad,skillbar,w,h,portrait,attackY){
            const cols=portrait?3:2,rows=portrait?2:3,gap=portrait?6:5;
            const side=Math.max(30,Math.min(portrait?46:42,Math.floor((w-12-(cols-1)*gap)/cols)));
            const barW=cols*side+(cols-1)*gap,barH=rows*side+(rows-1)*gap;
            const target=Math.max(0,attackY-8),space=h-barH-16;
            const dsize=Math.max(88,Math.min(portrait?184:156,w-6,2*(target-6),space));
            const cy=Math.max(dsize/2+6,Math.min(target,h-barH-dsize/2-16));
            centerBox(dpad,w/2,cy,dsize,dsize);
            centerBox(skillbar,w/2,cy+dsize/2+8+barH/2,barW,barH);
            skillbar.style.gridTemplateColumns='repeat('+cols+','+side+'px)';
            skillbar.style.gridTemplateRows='repeat('+rows+','+side+'px)';
            skillbar.style.gap=gap+'px';
            skillbar.querySelectorAll('.sl-skill-slot').forEach(b=>{b.style.width=side+'px';b.style.height=side+'px';});
          }'''
          replace_once(old,new,'layoutSkillPad')
          replace_once("dpad=document.getElementById('sl-dpad'),skill=document.getElementById('sl-skill');", "dpad=document.getElementById('sl-dpad'),skillbar=document.getElementById('sl-skillbar');",'layout selector')
          replace_once('!dpad||!skill)return;', '!dpad||!skillbar)return;', 'null check')
          replace_once('layoutSkillPad(dpad,skill,Math.max(1,leftW-8),Math.max(1,h-16),true);','layoutSkillPad(dpad,skillbar,Math.max(1,leftW-8),Math.max(1,h-16),true,Math.min(h*0.23,100));','portrait layout')
          replace_once('layoutSkillPad(dpad,skill,Math.max(1,leftW-8),Math.max(1,h-16),false);','layoutSkillPad(dpad,skillbar,Math.max(1,leftW-8),Math.max(1,h-16),false,h*0.22);','landscape layout')
          start="let slScene='',slHotMode='hide';"
          replace_once(start,"let slScene='',slHotMode='hide',slSkillMode='hide';\nwindow.slSkillStates=[null,null,null,null,null,null];", 'skillbar global')
          replace_once("  layoutPadSoon();\n}\nfunction parseConsole(t)","  layoutPadSoon();\n}\nfunction updateSkillbar(){\n  const bar=document.getElementById('sl-skillbar');if(!bar)return;\n  const visible=slScene==='Scene_Map'||slScene==='Scene_Skill';\n  const assign=slScene==='Scene_Skill';\n  bar.style.display=visible?'grid':'none';\n  bar.classList.toggle('assign',assign);bar.dataset.mode=assign?'assign':'use';\n  bar.querySelectorAll('.sl-skill-slot').forEach(b=>b.style.pointerEvents=visible?'auto':'none');\n  layoutPadSoon();\n}\nfunction parseConsole(t)", 'skillbar mode')
          replace_once("    updateHotbar();\n  }\n  i=t.indexOf('SLHOT|MODE|');", "    updateHotbar();updateSkillbar();\n  }\n  i=t.indexOf('SLHOT|MODE|');",'scene change')
          replace_once("  for(const kind of ['ASSIGN','USE','FAIL','REJECT']){", '''  i=t.indexOf('SLSKILL|MODE|');
            if(i>=0){slSkillMode=t.slice(i).split('|')[2]||'hide';updateSkillbar();}
            i=t.indexOf('SLSKILL|STATE|');
            if(i>=0){
              const p=t.slice(i).split('|'),slot=Number(p[2]);
              if(slot>=1&&slot<=6){
                window.slSkillStates[slot-1]={id:Number(p[3])||0,icon:p[4]||'',name:p[5]||'',cost:Number(p[6])||0,ready:p[7]==='1'};
                renderSkill(slot-1);
              }
            }
            for(const kind of ['ASSIGN','CAST','FAIL','REJECT']){
              i=t.indexOf('SLSKILL|'+kind+'|');
              if(i>=0){flashSkill(Number(t.slice(i).split('|')[2])-1,kind);break;}
            }
            for(const kind of ['ASSIGN','USE','FAIL','REJECT']){''', 'new console markers')
          start='function flashHot(index,kind){'
          insert='''const slSkillKeys=[84,85,73,79,80,77];
          function renderSkill(index){
            const b=document.getElementById('sl-skill-'+(index+1));if(!b)return;
            const st=window.slSkillStates[index],cost=b.querySelector('.sl-skill-cost');
            if(!st||!st.id||!st.icon){
              b.classList.add('default');b.classList.remove('zero');b.style.backgroundImage='';
