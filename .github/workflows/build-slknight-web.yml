
name: build-slknight-web.yml | V1.29 | Healer Aggro, Teleport Reset, Holy Walk Buff Icon

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:

      - name: Restore V1.28 deployed game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 43237145334
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify V1.28 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build/v129/original build/v129/modified
          tar -xf baseline/artifact.tar -C site
          python3 <<'PY_PRE'
          from pathlib import Path
          import hashlib, json, struct, shutil
          root=Path('site')
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(files)==5619, ('V1.28 artifact file count',len(files))
          required=['knight/gameasync/Data/Scripts.rxdata','knight/gameasync/mapping.js',
                    'knight/js/sl-assets-v229r115.js','index.html','knight/index.html',
                    'knight/gameasync/Graphics/Icons/홀리워크.png',
                    'knight/gameasync/Graphics/Icons/홀리워크버프.png']
          assert all(name in files for name in required), 'Missing baseline game files'
          assert "var version='V1.28';" in (root/'knight/js/sl-assets-v229r115.js').read_text('utf8')
          assert 'SLKnight V1.28' in (root/'knight/index.html').read_text('utf8')
          for name,dims in [('홀리워크.png',(32,32)),('홀리워크버프.png',(38,37))]:
              data=(root/'knight/gameasync/Graphics/Icons'/name).read_bytes()
              assert data[:8]==b'\x89PNG\r\n\x1a\n' and struct.unpack('>II',data[16:24])==dims
          Path('build/v129/before.json').write_text(json.dumps(files,ensure_ascii=False),encoding='utf8')
          shutil.copyfile(root/required[0],'build/v129/Scripts.v128.rxdata')
          print('PASS exact V1.28 deployed artifact: 5619 files')
          PY_PRE

      - name: Patch original combat recipient branches
        shell: bash
        run: |
          set -euo pipefail
          cat > build/v129/extract.rb <<'RUBY_EXTRACT'
          # encoding: UTF-8
          require 'zlib'
          input=ARGV.fetch(0); out=ARGV.fetch(1)
          Dir.mkdir(out) unless Dir.exist?(out)
          needed=['Game_Event','Game_Player','Interpreter 1','Interpreter 2','Interpreter 3','Interpreter 4','Interpreter 6']
          scripts=Marshal.load(File.binread(input))
          raise 'Script count mismatch' unless scripts.length==137
          found=[]
          scripts.each do |row|
            next unless row.is_a?(Array) && row[2].is_a?(String)
            name=row[1].to_s.dup.force_encoding('UTF-8')
            next unless needed.include?(name)
            File.binwrite(File.join(out,name+'.rb'),Zlib::Inflate.inflate(row[2]))
            found << name
          end
          raise 'Original combat scripts missing' unless found.sort==needed.sort
          puts "PASS extracted #{found.length} original scripts"
          RUBY_EXTRACT
          ruby build/v129/extract.rb site/knight/gameasync/Data/Scripts.rxdata build/v129/original
          cat > build/v129/patch.py <<'PY_PATCH'
          from pathlib import Path
          import re, subprocess
          root=Path('build/v129')
          original=root/'original'; modified=root/'modified'; modified.mkdir(exist_ok=True)
          updates={}
          def patch(name, edits):
              text=(original/(name+'.rb')).read_bytes().decode('utf-8')
              newline='\r\n' if '\r\n' in text else '\n'
              for old,new,count,label in edits:
                  old=old.replace('\n',newline);new=new.replace('\n',newline)
                  hits=text.count(old)
                  if hits!=count: raise RuntimeError(f'{name} / {label}: expected {count}, found {hits}')
                  text=text.replace(old,new,count)
              out=modified/(name+'.rb')
              out.write_bytes(text.encode('utf-8'))
              assert subprocess.run(['ruby','-c',str(out)],stdout=subprocess.PIPE).returncode==0,name
              updates[name]=out
              print('PASS',name)
          patch('Game_Event',[
              ('      if not jumping? and not over_trigger?\n        start',
               '      if not jumping? and not over_trigger?\n        @sl_contact_actor_id = target.equal?($game_player) ? 1 : 3 if @sl_combat_event\n        start',1,'touch contact'),
              ('      if not jumping? and over_trigger?\n        start',
               '      if not jumping? and over_trigger?\n        @sl_contact_actor_id = target.equal?($game_player) ? 1 : 3 if @sl_combat_event\n        start',1,'overlap contact'),
          ])
          name='Game_Player';s=(original/(name+'.rb')).read_bytes().decode('utf8')
          nl='\r\n' if '\r\n' in s else '\n'
          pattern=r'(?m)^([ \t]*)event\.start(?=\r?$)'
          matches=list(re.finditer(pattern,s));assert len(matches)==4,len(matches)
          def convert(m):
              ind=m.group(1)
              return ind+'event.instance_variable_set(:@sl_contact_actor_id, 1) if event.instance_variable_get(:@sl_combat_event)'+nl+ind+'event.start'
          s=re.sub(pattern,convert,s)
          out=modified/(name+'.rb');out.write_bytes(s.encode('utf8'))
          assert subprocess.run(['ruby','-c',str(out)],stdout=subprocess.PIPE).returncode==0
          updates[name]=out
          print('PASS',name)
          patch('Interpreter 1',[
              ('    @sl_attack_target = nil','    @sl_attack_target = nil\n    @sl_contact_actor_id = nil',1,'context reset'),
              ('        setup(event.list, event.id)\n        return',
               '        setup(event.list, event.id)\n        if event.instance_variable_get(:@sl_combat_event)\n          @sl_attack_target = event.instance_variable_get(:@sl_target_actor_id)\n          @sl_contact_actor_id = event.instance_variable_get(:@sl_contact_actor_id)\n        end\n        return',1,'event startup context'),
          ])
          patch('Interpreter 2',[
              ('    when -1  # 플레이어\n      if (@sl_attack_target',
               '    when -1  # 플레이어\n      return $game_player if @main && @sl_attack_target && @sl_attack_target[0] == 3\n      if (@sl_attack_target',1,'player direction in main attack event'),
          ])
          patch('Interpreter 3',[
              ('    when 11  # 버튼\n      result = (Input.press?(@parameters[1]))',
               '    when 11  # 버튼\n      result = (Input.press?(@parameters[1]))\n      if result && @parameters[1] == 13 && @main && @event_id.to_i > 0\n        monster = $game_map.events[@event_id]\n        if monster && monster.instance_variable_get(:@sl_combat_event)\n          result = (@sl_contact_actor_id == 1)\n          @sl_attack_target = [1] if result\n        end\n      end',1,'hero melee input contact branch'),
          ])
          assert len(updates)==5
          print('PATCH COMPLETE',len(updates))
          PY_PATCH
          python3 build/v129/patch.py
          cat > build/v129/assemble.rb <<'RUBY_ASSEMBLE'
          # encoding: UTF-8
          require 'zlib'
          require 'fileutils'
          root = ARGV.fetch(0)
          moddir = ARGV.fetch(1)
          path = File.join(root, 'knight/gameasync/Data/Scripts.rxdata')
          original = File.binread(path)
          scripts = Marshal.load(original)
          raise "Scripts count #{scripts.length}" unless scripts.length == 137
          changed=[]
          scripts.each do |row|
            next unless row.is_a?(Array) && row.length >= 3 && row[2].is_a?(String)
            name=row[1].to_s.dup.force_encoding('UTF-8')
            src=File.join(moddir,name+'.rb')
            next unless File.file?(src)
            old=Zlib::Inflate.inflate(row[2]).force_encoding('UTF-8')
            new_data=File.binread(src).force_encoding('UTF-8')
            raise "No change in #{name}" if old==new_data
            raise "Invalid encoding #{name}" unless new_data.valid_encoding?
            RubyVM::InstructionSequence.compile(new_data)
            row[2]=Zlib::Deflate.deflate(new_data.b)
            changed<<name
          end
          expected=['Game_Event','Game_Player','Interpreter 1','Interpreter 2','Interpreter 3']
          raise "Unexpected scripts #{changed.inspect}" unless changed.sort==expected.sort
          File.binwrite(path, Marshal.dump(scripts))
          reloaded=Marshal.load(File.binread(path))
          raise 'Script count changed' unless reloaded.length == scripts.length
          puts "PASS #{changed.length} script branches modified, #{137-changed.length} untouched"
          RUBY_ASSEMBLE
          ruby build/v129/assemble.rb site build/v129/modified
          python3 <<'PY_VERSION'
          from pathlib import Path
          import hashlib,re
          root=Path('site')
          scripts=root/'knight/gameasync/Data/Scripts.rxdata'
          mapping=root/'knight/gameasync/mapping.js'
          s=mapping.read_text('utf8');rx=re.compile(r'Data/Scripts\.rxdata\?h=[0-9a-f]{32}')
          assert len(rx.findall(s))==1
          mapping.write_text(rx.sub('Data/Scripts.rxdata?h='+hashlib.md5(scripts.read_bytes()).hexdigest(),s),encoding='utf8')
          for name in ['index.html','knight/index.html']:
           p=root/name;s=p.read_text('utf8');assert 'V1.28' in s;p.write_text(s.replace('V1.28','V1.29').replace('v1.28','v1.29'),'utf8')
          loader=root/'knight/js/sl-assets-v229r115.js';s=loader.read_text('utf8')
          assert s.count("var version='V1.28';")==1
          loader.write_text(s.replace("var version='V1.28';","var version='V1.29';"),'utf8')
          PY_VERSION
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Verify exact V1.29 changes and target separation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY_AUDIT'
          from pathlib import Path
          import hashlib, json
          root=Path('site')
          before=json.loads(Path('build/v129/before.json').read_text('utf8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          expected={'knight/gameasync/Data/Scripts.rxdata','knight/gameasync/mapping.js',
                    'knight/js/sl-assets-v229r115.js','knight/index.html','index.html'}
          assert len(after)==5619 and set(after)==set(before), 'Game files changed'
          changed={name for name in before if before[name]!=after[name]}
          assert changed==expected, ('Unapproved modifications',sorted(changed^expected))
          scripts=root/'knight/gameasync/Data/Scripts.rxdata'
          mapping=(root/'knight/gameasync/mapping.js').read_text('utf8')
          assert mapping.count('Data/Scripts.rxdata?h='+hashlib.md5(scripts.read_bytes()).hexdigest())==1
          assert "var version='V1.29';" in (root/'knight/js/sl-assets-v229r115.js').read_text('utf8')
          assert 'SLKnight V1.29' in (root/'knight/index.html').read_text('utf8')
          assert 'bitmap-map.js?v=v1.29' in (root/'knight/index.html').read_text('utf8')
          assert 'V1.29' in (root/'index.html').read_text('utf8')
          print('PASS 5619 files preserved; only five approved files changed')
          PY_AUDIT
          ruby <<'RUBY_VERIFY'
          # encoding: UTF-8
          require 'zlib'
          before=Marshal.load(File.binread('build/v129/Scripts.v128.rxdata'))
          after=Marshal.load(File.binread('site/knight/gameasync/Data/Scripts.rxdata'))
          raise 'Scripts count mismatch' unless before.length==137 && after.length==137
          changed=[]
          before.zip(after).each do |old,newrow|
            next if old==newrow
            raise 'Script metadata modified' unless old[0]==newrow[0] && old[1]==newrow[1] && old.length==newrow.length
            name=old[1].to_s.dup.force_encoding('UTF-8')
            RubyVM::InstructionSequence.compile(Zlib::Inflate.inflate(newrow[2]).force_encoding('UTF-8'))
            changed << name
          end
          expected=['Game_Event','Game_Player','Interpreter 1','Interpreter 2','Interpreter 3']
          raise "Unexpected scripts #{changed.inspect}" unless changed.sort==expected.sort
          puts 'PASS five original scripts updated, 132 script bodies untouched'
          RUBY_VERIFY
          cat > build/v129/test_combat.rb <<'RUBY_TEST'
          SRC='build/v129/modified'
          BASE='build/v129/original'
          class Game_Character
            attr_accessor :x,:y,:transparent
            attr_reader :id
            def initialize;@x=0;@y=0;@transparent=false;end
            def lock;end
            def jumping?; false;end
            def over_trigger?; false;end
          end
          load SRC+'/Game_Event.rb'
          ['Interpreter 1','Interpreter 2','Interpreter 3'].each{|name|load SRC+'/'+name+'.rb'}
          load BASE+'/Interpreter 4.rb'
          load BASE+'/Interpreter 6.rb'
          module Input
            def self.press?(key);key==13;end
          end
          FakeCmd=Struct.new(:code,:indent,:parameters)
          FakeTemp=Struct.new(:common_event_id,:gameover)
          FakeCE=Struct.new(:list)
          FakeActor=Struct.new(:hp)
          FakeParty=Struct.new(:active_actors) do
            def actors;active_actors;end
            def all_dead?;false;end
          end
          FakeMap=Struct.new(:map_id,:need_refresh,:events,:sl_healer_event)
          FakeSystem=Struct.new(:map_interpreter)
          FakeE=Struct.new(:name,:pages)
          $game_player=Game_Character.new
          $game_player.x=0;$game_player.y=0
          $game_actors={1=>FakeActor.new(100),3=>FakeActor.new(100)}
          $game_party=FakeParty.new([$game_actors[1]])
          $game_switches=Hash.new(false);$game_switches[185]=true
          $game_variables=Hash.new(0)
          $game_temp=FakeTemp.new(0,false)
          $game_system=FakeSystem.new(Struct.new(:running?).new(false))
          $game_map=FakeMap.new(2,false,{},nil)
          $data_common_events=Array.new(100)
          $data_common_events[16]=FakeCE.new([FakeCmd.new(0,0,[])])
          monster=Game_Event.allocate
          monster.instance_variable_set(:@id,5)
          monster.instance_variable_set(:@trigger,2)
          monster.instance_variable_set(:@starting,false)
          monster.instance_variable_set(:@list,[FakeCmd.new(111,0,[11,13]),FakeCmd.new(0,0,[])])
          monster.instance_variable_set(:@sl_combat_event,true)
          ref=[3]
          monster.instance_variable_set(:@sl_target_actor_id,ref)
          monster.instance_variable_set(:@event,FakeE.new('test monster',[]))
          monster.x=5;monster.y=5
          healer=Game_Event.allocate
          healer.instance_variable_set(:@event,FakeE.new('[ID힐러 마법사]',[]))
          healer.transparent=false
          healer.x=5;healer.y=6
          $game_map.events={5=>monster,7=>healer};$game_map.sl_healer_event=healer

          def verify(x,msg)
            raise 'FAILED '+msg unless x
            puts 'PASS '+msg
          end
          monster.check_event_trigger_touch(5,6)
          verify(monster.instance_variable_get(:@starting),'healer contact starts the actual original monster event')
          verify(monster.instance_variable_get(:@sl_contact_actor_id)==3,'healer contact actor recorded')
          main=Interpreter.new(0,true)
          main.setup_starting_event
          verify(main.instance_variable_get(:@event_id)==5,'main event loaded from actual startup path')
          verify(main.instance_variable_get(:@sl_attack_target).equal?(ref),'same target copied during event startup')
          verify(main.get_character(-1).equal?($game_player),'main event hero direction uses original hero')

          def main.command_skip;false;end
          main.instance_variable_set(:@parameters,[11,13]);main.instance_variable_set(:@index,0)
          result=main.command_111
          verify(result==false,'remote player attack denied while healer is the contact target')
          $game_player.x=5;$game_player.y=4
          main.instance_variable_set(:@sl_contact_actor_id, 1)
          result=main.command_111
          verify(result==true,'adjacent player attack condition still works')
          verify(main.instance_variable_get(:@sl_attack_target)==[1],'hero offensive event uses hero actor without stealing monster aggro')
          verify(monster.instance_variable_get(:@sl_target_actor_id).equal?(ref) && ref[0]==3,'hero attack does not change healer aggro')
          main.instance_variable_set(:@sl_attack_target,ref)
          main.instance_variable_set(:@parameters,[16])
          main.command_117
          child=main.instance_variable_get(:@child_interpreter)
          verify(child.instance_variable_get(:@sl_attack_target).equal?(ref),'common event inherits exact same target')
          verify(child.get_character(-1).equal?(healer),'monster-hit animation points to healer in common event')
          child.instance_variable_set(:@parameters,[1,1,0,15,false])
          child.command_311
          verify($game_actors[1].hp==100 && $game_actors[3].hp==85,'actual HP command damages healer only')
          ref[0]=0
          child.command_311
          verify($game_actors[1].hp==100 && $game_actors[3].hp==85,'teleport invalidates already-running child attack')
          ref[0]=3
          party=[]
          child.iterate_actor(0){|actor|party << actor}
          verify(party==[$game_actors[3]],'targeted party command retains V1.28 healer-target behavior')
          puts 'PASS targeted attack flow regression'
          RUBY_TEST
          ruby build/v129/test_combat.rb
          cat > build/v129/test_parallel.rb <<'RUBY_PARALLEL'
          ROOT='build/v129/modified'
          class Game_Character
            attr_accessor :x,:y,:transparent
            def update;end
            def jumping?;false;end
          end
          load "#{ROOT}/Game_Event.rb"
          load "#{ROOT}/Interpreter 1.rb"
          load "build/v129/original/Interpreter 4.rb"
          FakeCond=Struct.new(:switch1_valid,:switch1_id,:switch2_valid,:switch2_id)
          FakePage=Struct.new(:condition)
          FakeSystem=Struct.new(:map_interpreter)
          class Game_MapStub
           attr_accessor :events,:common_events,:need_refresh,:map_id
           def initialize;@map_id=2;@events={};@common_events={};end
          end
          $game_map=Game_MapStub.new;$game_switches=Hash.new(false)
          source=Game_Event.allocate;source.instance_variable_set(:@sl_combat_event,true);source.instance_variable_set(:@sl_target_actor_id,[3])
          watcher=Game_Event.allocate;watcher.instance_variable_set(:@trigger,4)
          watcher.instance_variable_set(:@event,Struct.new(:id,:name).new(2,'[공격]'))
          watcher.instance_variable_set(:@page,FakePage.new(FakeCond.new(true,207,false,0)))
          watcher.instance_variable_set(:@list,[:dummy,:end])
          watcher.instance_variable_set(:@interpreter,Interpreter.new)
          $game_map.events={1=>source,2=>watcher}
          int=Interpreter.new;int.instance_variable_set(:@event_id,1);int.instance_variable_set(:@map_id,2)
          int.instance_variable_set(:@parameters,[207,207,0]);int.command_121
          ref=source.instance_variable_get(:@sl_target_actor_id)
          raise 'parallel watcher not same token' unless watcher.instance_variable_get(:@sl_attack_target).equal?(ref)
          class Interpreter;def update;end;end
          watcher.update
          raise 'parallel interpreter did not receive same actor target' unless watcher.instance_variable_get(:@interpreter).instance_variable_get(:@sl_attack_target).equal?(ref)
          puts 'PASS map parallel attack event receives exact same actor target reference'
          ref[0]=0
          raise 'stale attack did not cancel' unless watcher.instance_variable_get(:@interpreter).instance_variable_get(:@sl_attack_target)[0]==0
          puts 'PASS map parallel attack target invalidated by healer teleport'
          RUBY_PARALLEL
          ruby build/v129/test_parallel.rb

      - name: Publish V1.29 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
