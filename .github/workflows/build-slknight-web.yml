
name: V198 | SLFairy Scene Loop Fix and Existing Auto Button

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  V197_SHA: 86773e9ff8de324c5e52007d71a350366c3f07f4
  V194_SHA: 9492ce1d84fcbc288503309f88732ef6554ee634
  BASE178_SHA: 49e7f27f099c792ecb1cb379ac3c087f8bc91cf0
  Z105_SHA: e19659507b466b87a671949532b02484bc1faaef
  Z104_SHA: e044e1b6c53646b4c4f21f2dfee4967a68fabbc4
  DUAL_BASE_SHA: 04ce66ec99abc10f77143de53650685db8949532
  CURRENT_Z10_SHA: f545634bafbe1e1e55aaf6489126ad17b07da382
  BASELINE_SHA: c6815cd461dba60ec131898e6d5dd8690dd915ae
  X2_SHA: 6d941bd643dda87b8267ba466e108d1904c22331
  Z1_SHA: 008b6abe81074b7af877806b45f2314004a74f66
  Z3_SHA: 5a46988b048764e8a99700998c1f4ab96a3ec5c1
  CE_FIX_SHA: e30b0c41dc7fe7ec49fa17501d198339f7006cf6
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  FAIRY_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLFairy_Source_v1.zip
  FAIRY_SHA256: 67b88b5fe0cde3c9f2fada889815f9aa7d0fc94b378025529e9950d55151c70e
  FAIRY_7Z_PASSWORD: http://nemo838.tistory.com/
  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout V197 frozen source
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.V197_SHA }}', path: v197}
      - name: Checkout V194 frozen source
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.V194_SHA }}', path: v194}
      - name: Checkout V178 frozen source
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.BASE178_SHA }}', path: base178}
      - name: Checkout z10.5 source
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.Z105_SHA }}', path: z105src}
      - name: Checkout z10.4 source
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.Z104_SHA }}', path: z104src}
      - name: Checkout dual base
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.DUAL_BASE_SHA }}', path: dualbase}
      - name: Checkout z10 source
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.CURRENT_Z10_SHA }}', path: z10src}
      - name: Checkout baseline
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.BASELINE_SHA }}', path: baseline}
      - name: Checkout auto base
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.X2_SHA }}', path: x2}
      - name: Checkout monster base z1
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.Z1_SHA }}', path: z1}
      - name: Checkout monster base z3
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.Z3_SHA }}', path: z3}
      - name: Checkout CE fix source
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.CE_FIX_SHA }}', path: cefix}
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake cmake curl ffmpeg freepats git imagemagick libtool make mm-common patch pkg-config python3 rake ruby timidity unzip wget xz-utils fonts-nanum p7zip-full nodejs
      - name: Checkout engine
        uses: actions/checkout@v4
        with: {repository: pulsejet/mkxp-web, ref: '${{ env.MKXP_SRC_REF }}', path: engine}
      - name: Cache engine dependencies
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-${{ runner.os }}-${{ env.EMSDK_VER }}-186

      - name: Extract passed V197 stages and correct ATK patch
        run: |
          set -euo pipefail
          ruby -ryaml - <<'RB'
          steps = YAML.load_file('v197/.github/workflows/build-slknight-web.yml').fetch('jobs').fetch('build').fetch('steps')
          names = {
            'extract' => 'Extract frozen successful V194 stages',
            'rebuild' => 'Rebuild working V194 without unsafe target hook',
            'target' => 'V197 restore native resolution and event-gated target search',
            'mapping' => 'Refresh Fairy Scripts mapping hash after Ruby patch',
            'ui' => 'V197 repair Fairy canvas, ATK repeat and status display',
            'package' => 'Assemble unchanged Knight and repaired Fairy',
            'validate' => 'Validate Fairy runtime changes'
          }
          names.each do |key, name|
            matches = steps.select { |step| step['name'] == name && step['run'] }
            abort "V197 step mismatch: #{name}" unless matches.length == 1
            File.write("/tmp/v197_#{key}.sh", matches[0]['run'])
          end

          path = '/tmp/v197_ui.sh'
          ui = File.read(path)
          start_at = ui.index('button_mark = "button(pad,')
          finish_at = start_at && ui.index("pad_path.write_text(pad,encoding='utf-8')", start_at)
          abort 'Unexpected V197 button block' unless start_at && finish_at && finish_at > start_at
          patch = <<'PY'
          # V178/V194 already provide the correct hold, drag, and AUTO toggle.
          # Keep it instead of installing a second ATK event handler.
          constructor = "attackButton(pad);const slCancel=button(pad,'sl-cancel','X',88,'sl-btn');"
          if pad.count(constructor) != 1 or pad.count('function attackButton(parent)') != 1:
              raise SystemExit('Real Fairy AUTO constructor missing')
          if 'window.slAttackAutoCancel=cancelAuto;' not in pad:
              raise SystemExit('Fairy automatic attack cancellation missing')
          PY
          ui[start_at...finish_at] = patch
          abort 'V197 replacement remains' if ui.include?('bindFairyAutoAtk')
          abort 'cache marker mismatch' unless ui.include?('fairy197')
          ui.gsub!('fairy197', 'fairy198')
          ui.gsub!('sl-v197-diagnostic', 'sl-v198-diagnostic')
          ui.gsub!("V197 '+state", "V198 '+state")
          File.write(path, ui)

          validate = File.read('/tmp/v197_validate.sh')
          old = "grep -Fq 'bindFairyAutoAtk' player/elf/js/dpad.js"
          new_line = "grep -Fq 'attackButton(pad)' player/elf/js/dpad.js"
          abort 'Validation marker mismatch' unless validate.scan(old).length == 1
          validate.sub!(old, new_line)
          validate.gsub!('fairy197', 'fairy198')
          validate.gsub!('sl-v197-diagnostic', 'sl-v198-diagnostic')
          File.write('/tmp/v197_validate.sh', validate)
          puts 'V198_FROZEN_STEPS_PATCHED'
          RB
          bash -n /tmp/v197_ui.sh
          bash -n /tmp/v197_validate.sh

      - name: Rebuild V197 known passing stages
        run: |
          set -euo pipefail
          for part in extract rebuild target; do
            bash -e "/tmp/v197_${part}.sh"
          done
          echo V198_V197_RUBY_TARGET_OK

      - name: Remove blocking Fairy Scene_Map main loop
        run: |
          set -euo pipefail
          ruby -rzlib - fairy_player/gameasync/Data/Scripts.rxdata <<'RB'
          path = ARGV.fetch(0)
          scripts = Marshal.load(File.binread(path))
          entry = scripts.find { |e| e.is_a?(Array) && e[1].to_s == 'Scene_Map' }
          abort 'Fairy Scene_Map missing' unless entry
          source = Zlib::Inflate.inflate(entry[2]).force_encoding('UTF-8').gsub("\r\n", "\n")
          start_at = source.index("  def main\n")
          loop_at = start_at && source.index('    loop do #', start_at)
          frame_at = loop_at && source.index("      Graphics.update\n", loop_at)
          loop_end = frame_at && source.index('    end #', frame_at)
          main_end = loop_end && source.index("\n  end\n", loop_end)
          abort 'Unexpected Fairy Scene_Map main structure' unless start_at && loop_at && frame_at && loop_end && main_end
          abort 'Unexpected main count' unless source.scan(/^  def main\s*$/).length == 1
          abort 'Missing scene disposal' unless source[loop_end...main_end].include?('@spriteset.dispose')

          main_begin = start_at + "  def main\n".length
          loop_line_end = source.index("\n", loop_at) + 1
          loop_end_line = source.index("\n", loop_end) + 1
          init = source[main_begin...loop_at]
          inputs = source[loop_line_end...frame_at]
          cleanup = source[loop_end_line...main_end]
          replacement = "  def main\n" + init + "  end\n\n" +
            "  def sl_v198_inputs\n" + inputs + "  end\n\n" +
            "  def dispose\n" + cleanup + "\n  end\n"
          next_at = main_end + "\n  end\n".length
          source = source[0...start_at] + replacement + source[next_at..-1]
          abort 'Fairy update count mismatch' unless source.scan(/^  def update\s*$/).length == 1
          source.sub!("  def update\n", "  def update\n    sl_v198_inputs\n    return if $scene != self\n")
          abort 'Blocking main loop still present' if source.include?('loop do #')
          abort 'Double graphics update remains' if source.lines.any? { |l| l.strip == 'Graphics.update' }
          RubyVM::InstructionSequence.compile(source, 'Fairy Scene_Map V198')
          entry[2] = Zlib::Deflate.deflate(source)
          File.binwrite(path, Marshal.dump(scripts))
          puts 'V198_SCENE_MAP_NONBLOCKING_OK'
          RB

      - name: Refresh Fairy mapping and repair interface
        run: |
          set -euo pipefail
          bash -e /tmp/v197_mapping.sh
          bash -e /tmp/v197_ui.sh
          echo V198_FAIRY_UI_OK

      - name: Assemble and verify V198 dual site
        run: |
          set -euo pipefail
          bash -e /tmp/v197_package.sh
          bash -e /tmp/v197_validate.sh
          test -s player/knight/gameasync/Data/Scripts.rxdata
          test -s player/elf/gameasync/Data/Scripts.rxdata
          grep -Fq 'sl-v198-diagnostic' player/elf/index.html
          grep -Fq 'js/dpad.js?v=fairy198' player/elf/index.html
          grep -Fq 'gameasync/mapping.js?v=fairy198' player/elf/index.html
          grep -Fq 'attackButton(pad)' player/elf/js/dpad.js
          ! grep -Fq 'bindFairyAutoAtk' player/elf/js/dpad.js
          node --check player/elf/js/dpad.js
          ruby -rzlib - player/elf/gameasync/Data/Scripts.rxdata <<'RB'
          scripts = Marshal.load(File.binread(ARGV.fetch(0)))
          scene = scripts.find { |entry| entry.is_a?(Array) && entry[1].to_s == 'Scene_Map' }
          abort 'Scene map missing after assembly' unless scene
          code = Zlib::Inflate.inflate(scene[2])
          abort 'Scene init still blocks' if code.include?('loop do #')
          abort 'Scene frame input missing' unless code.include?('sl_v198_inputs')
          abort 'Scene dispose missing' unless code.include?("  def dispose\n")
          puts 'V198_SCENE_AND_AUTO_READY_FOR_DEPLOY'
          RB

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with: {path: player}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
