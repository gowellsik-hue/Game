name: build-slknight-web.yml | V4.2 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Restore exact V4.1 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45585032295
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify V4.1 baseline
        shell: bash
        run: |
          set -euo pipefail

          test -s baseline/artifact.tar
          mkdir -p site
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root=Path('site')
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          data=root/'knight/gameasync/Data'

          before={
              str(p.relative_to(root)):hashlib.sha256(
                  p.read_bytes()
              ).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          assert len(before)==6019,len(before)

          assert (
              root/'knight/js/sl-assets-v229r115.js'
          ).read_bytes().count(
              b"var version='V4.1';"
          )==1

          assert (
              data/(prefix+'MonsterStats.rxdata')
          ).is_file()

          files=[
              prefix+'Map018.rxdata',
              prefix+'Map029.rxdata'
          ]

          Path('/tmp/sl42-before.json').write_text(
              json.dumps(before,sort_keys=True),
              'utf8'
          )

          Path('/tmp/sl42-md5.json').write_text(
              json.dumps({
                  n:hashlib.md5(
                      (data/n).read_bytes()
                  ).hexdigest()
                  for n in files
              }),
              'utf8'
          )

          print('PASS V4.1 artifact',len(before))
          PY

      - name: Move original recruiter to Silver Knight Town
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl-v42-move.rb <<'RUBY'
          # encoding: UTF-8
          require 'digest'
          require 'zlib'

          module RPG
            %w[
              Map MapInfo Tileset Event
              EventCommand MoveRoute MoveCommand
              AudioFile CommonEvent
            ].each do |name|
              const_set(name, Class.new)
            end

            Event.const_set(:Page, Class.new)

            Event::Page.const_set(
              :Condition, Class.new
            )

            Event::Page.const_set(
              :Graphic, Class.new
            )
          end

          %w[Table Tone Color].each do |name|
            Object.const_set(name, Class.new do
              def self._load(raw)
                obj=allocate
                obj.instance_variable_set(:@raw,raw)
                obj
              end

              def _dump(_depth)
                @raw
              end
            end)
          end

          def iv(obj,name)
            obj.instance_variable_get(name)
          end

          def utf(s)
            s.to_s.dup.force_encoding('UTF-8').scrub
          end

          def check(ok,message)
            raise message unless ok
          end

          def table(obj)
            raw=iv(obj,:@raw)

            check(
              raw.is_a?(String)&&raw.bytesize>=20,
              'Invalid native Table'
            )

            dims,w,h,z,n=raw.unpack('V5')

            check(
              n==w*h*z && raw.bytesize==20+n*2,
              'Invalid native Table size'
            )

            [w,h,z,raw.byteslice(20,n*2).unpack('v*')]
          end

          def lists(event)
            iv(event,:@pages).map{|p|iv(p,:@list)}
          end

          def targets(command)
            p=iv(command,:@parameters)

            case iv(command,:@code)
            when 111
              p[0]==6 ? [1] : []
            when 122
              p[3]==6 ? [4] : []
            when 202
              p[1]==2 ? [0,2] : [0]
            when 207,209
              [0]
            else
              []
            end
          end

          def strings(obj,&block)
            case obj
            when String
              block.call(obj)
            when Array
              obj.each{|item|strings(item,&block)}
            when Hash
              obj.each_value{|item|strings(item,&block)}
            when RPG::MoveRoute,RPG::MoveCommand
              obj.instance_variables.each do |k|
                strings(iv(obj,k),&block)
              end
            end
          end

          root=ENV.fetch(
            'SL42_DATA',
            'site/knight/gameasync/Data'
          )

          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          path=lambda do |name|
            File.join(root,prefix+name+'.rxdata')
          end

          old_name=/\A\[ID힐러\s*고용사\]\z/
          old_label=/힐러\s*고용사/

          files=Dir.glob(
            path.call('Map[0-9][0-9][0-9]')
          ).sort

          check(
            !files.empty?,
            'Original map files missing'
          )

          maps=files.to_h do |p|
            [
              p[/Map(\d{3})\.rxdata\z/,1].to_i,
              Marshal.load(File.binread(p))
            ]
          end

          source=maps.fetch(18)
          dest=maps.fetch(29)

          infos=Marshal.load(
            File.binread(path.call('MapInfos'))
          )

          check(
            utf(iv(infos.fetch(29),:@name)).match?(
              /은기사\s*마을/
            ),
            'Map029 is not Silver Knight Town'
          )

          source_events=iv(source,:@events)
          dest_events=iv(dest,:@events)

          recruit=source_events.fetch(6)

          check(
            iv(recruit,:@id)==6 &&
            utf(iv(recruit,:@name)).match?(old_name),
            'Map018 EV6 recruiter identity mismatch'
          )

          found=maps.flat_map do |mid,m|
            iv(m,:@events).filter_map do |eid,e|
              [mid,eid] if utf(
                iv(e,:@name)
              ).match?(old_name)
            end
          end

          check(
            found==[[18,6]],
            "Recruiter count/location mismatch: #{found.inspect}"
          )

          anchor=dest_events.fetch(11)

          ax,ay=iv(anchor,:@x),iv(anchor,:@y)

          check(
            [ax,ay]==[70,48],
            'Map029 EV11 position changed'
          )

          check(
            lists(anchor).flatten.any?{
              |c|iv(c,:@code)==201
            },
            'Map029 EV11 is not original teleporter'
          )

          new_id=dest_events.keys.max+1

          check(
            !dest_events.key?(new_id),
            'Destination ID collision'
          )

          ce_file=path.call('CommonEvents')

          common=Marshal.load(
            File.binread(ce_file)
          ).compact

          common_by_id=common.to_h do |e|
            [iv(e,:@id),e]
          end

          all_commands=[]
          map18_commands=[]
          all_events=0

          maps.each do |mid,map|
            iv(map,:@events).each do |eid,e|

              all_events+=1

              check(
                iv(e,:@id)==eid,
                "Map#{mid} event ID mismatch #{eid}"
              )

              lists(e).each do |list|
                all_commands << [mid,eid,list]

                if mid==18 && eid!=6
                  map18_commands << list
                end
              end
            end
          end

          common.each do |e|
            all_commands << [
              nil,
              iv(e,:@id),
              iv(e,:@list)
            ]
          end

          map18_commands.flatten.each do |c|
            p=iv(c,:@parameters)

            check(
              targets(c).none?{|i|p[i]==6},
              'Map018 has a separate reference to EV6'
            )
          end

          recruit_lists=lists(recruit)

          queue=recruit_lists.flatten.select do |c|
            iv(c,:@code)==117
          end.map do |c|
            iv(c,:@parameters)[0]
          end

          visited={}

          until queue.empty?
            id=queue.shift

            next if visited[id]

            visited[id]=true

            commands=iv(
              common_by_id.fetch(id),
              :@list
            )

            commands.each do |c|
              p=iv(c,:@parameters)

              check(
                targets(c).none?{
                  |i|p[i].is_a?(Integer)&&p[i]>0
                },
                "Recruiter CE#{id} has a map-local target"
              )

              queue<<p[0] if iv(c,:@code)==117
            end
          end

          check(
            iv(recruit,:@pages).none?{
              |pg|iv(
                iv(pg,:@condition),
                :@self_switch_valid
              )
            },
            'Recruiter has map-local self-switch conditions'
          )

          check(
            recruit_lists.flatten.none?{
              |c|iv(c,:@code)==123
            },
            'Recruiter uses map-local self-switch commands'
          )

          all_commands.each do |mid,eid,list|
            next if mid==18 && eid==6

            list.each do |c|
              strings(iv(c,:@parameters)) do |value|
                s=utf(value)

                check(
                  !s.match?(old_label),
                  "External recruiter name reference: #{mid || 'CE'}:#{eid}"
                )
              end
            end
          end

          scripts=Marshal.load(
            File.binread(
              File.join(root,'Scripts.rxdata')
            )
          )

          scripts.each do |row|
            next if !row || !row[2].is_a?(String)

            s=utf(Zlib::Inflate.inflate(row[2]))

            check(
              !s.match?(old_label),
              "External recruiter script name reference: #{row[1]}"
            )

            check(
              !s.match?(
                /\[\s*18\s*,\s*6\s*,\s*['"][A-D]['"]\s*\]/
              ),
              "Recruiter self-switch reference: #{row[1]}"
            )
          end

          tilesets=Marshal.load(
            File.binread(path.call('Tilesets'))
          )

          tileset=tilesets.fetch(
            iv(dest,:@tileset_id)
          )

          w,h,layers,cells=table(
            iv(dest,:@data)
          )

          check(
            [w,h,layers]==[
              iv(dest,:@width),
              iv(dest,:@height),
              3
            ],
            'Unexpected Map029 tile dimensions'
          )

          _,_,_,passages=table(
            iv(tileset,:@passages)
          )

          _,_,_,priorities=table(
            iv(tileset,:@priorities)
          )

          check(
            cells.all?{
              |id|id<passages.size &&
              id<priorities.size
            },
            'Map029 invalid tile references'
          )

          occupied=dest_events.values.map do |e|
            [iv(e,:@x),iv(e,:@y)]
          end.to_h do |xy|
            [xy,true]
          end

          landings={}

          all_commands.each do |_,_,list|
            list.each do |c|
              p=iv(c,:@parameters)

              if iv(c,:@code)==201 &&
                 p[0]==0 &&
                 p[1]==29

                landings[[p[2],p[3]]]=true
              end
            end
          end

          steps=[
            [0,1,1,8],
            [-1,0,2,4],
            [1,0,4,2],
            [0,-1,8,1]
          ]

          pass=lambda do |x,y,bit|
            next false unless (
              x>=0 && y>=0 && x<w && y<h
            )

            result=true

            (layers-1).downto(0) do |z|
              id=cells[x+w*(y+h*z)]
              flags=passages[id]

              if (flags&bit)!=0 ||
                 (flags&15)==15

                result=false
                break
              end

              break if priorities[id]==0
            end

            result
          end

          free=lambda do |x,y|
            x>=0 &&
            y>=0 &&
            x<w &&
            y<h &&
            !occupied[[x,y]]
          end

          near=lambda do |x,y|
            (x-ax).abs+(y-ay).abs<=6
          end

          reachable={}

          queue=steps.filter_map do |dx,dy,_,_|
            nx,ny=ax+dx,ay+dy

            [nx,ny] if (
              free.call(nx,ny) &&
              steps.any?{
                |_,_,b,_|pass.call(nx,ny,b)
              }
            )
          end

          queue.each{|xy|reachable[xy]=true}

          until queue.empty?

            x,y=queue.shift

            steps.each do |dx,dy,bit,back|
              nx,ny=x+dx,y+dy
              xy=[nx,ny]

              next unless (
                near.call(nx,ny) &&
                free.call(nx,ny) &&
                !reachable[xy]
              )

              next unless (
                pass.call(x,y,bit) &&
                pass.call(nx,ny,back)
              )

              reachable[xy]=true
              queue<<xy
            end
          end

          candidates=reachable.keys.filter_map do |x,y|
            distance=(x-ax).abs+(y-ay).abs

            next unless (
              distance.between?(2,5) &&
              !landings[[x,y]]
            )

            next unless dest_events.values.all?{
              |e|(iv(e,:@x)-x).abs+
              (iv(e,:@y)-y).abs>=2
            }

            next unless steps.all?{
              |_,_,bit,_|pass.call(x,y,bit)
            }

            access=steps.count do |dx,dy,bit,back|
              free.call(x+dx,y+dy) &&
              reachable[[x+dx,y+dy]] &&
              pass.call(x,y,bit) &&
              pass.call(x+dx,y+dy,back)
            end

            next unless access>=3

            [distance,-access,(y-ay).abs,y,x]
          end

          check(
            !candidates.empty?,
            'No clear passable recruiter tile near Map029 EV11'
          )

          _,_,_,y,x=candidates.min

          before18=source_events.to_h do |eid,e|
            [eid,Marshal.dump(e)]
          end

          before29=dest_events.to_h do |eid,e|
            [eid,Marshal.dump(e)]
          end

          map_fields=lambda do |m|
            m.instance_variables.reject do |n|
              n==:@events
            end.to_h do |n|
              [n,Marshal.dump(iv(m,n))]
            end
          end

          fields18=map_fields.call(source)
          fields29=map_fields.call(dest)

          name=iv(recruit,:@name)

          recruit.instance_variable_set(
            :@name,
            '[ID고용사]'.encode(
              name.encoding==Encoding::ASCII_8BIT ?
              'UTF-8' : name.encoding
            ).force_encoding(name.encoding)
          )

          recruit_lists.flatten.each do |c|
            p=iv(c,:@parameters)

            targets(c).each do |i|
              next unless (
                p[i].is_a?(Integer)&&p[i]>0
              )

              check(
                p[i]==6,
                'Recruiter references another source-map event'
              )

              p[i]=new_id
            end

            strings(p) do |value|
              s=utf(value)

              next unless s.match?(old_label)

              check(
                [101,401,102,402].include?(
                  iv(c,:@code)
                ),
                'Recruiter has a non-display name reference'
              )

              value.replace(
                s.gsub(
                  old_label,'고용사'
                ).force_encoding(value.encoding)
              )
            end
          end

          recruit.instance_variable_set(:@id,new_id)
          recruit.instance_variable_set(:@x,x)
          recruit.instance_variable_set(:@y,y)

          source_events.delete(6)
          dest_events[new_id]=recruit

          expected=Marshal.dump(recruit)

          check(
            source_events.keys.sort==
            (before18.keys-[6]).sort,
            'Source event count mismatch'
          )

          check(
            dest_events.keys.sort==
            (before29.keys+[new_id]).sort,
            'Destination event count mismatch'
          )

          check(
            source_events.all?{
              |eid,e|Marshal.dump(e)==before18.fetch(eid)
            },
            'Unrelated Map018 event changed'
          )

          check(
            dest_events.all?{
              |eid,e|eid==new_id ||
              Marshal.dump(e)==before29.fetch(eid)
            },
            'Unrelated Map029 event changed'
          )

          check(
            map_fields.call(source)==fields18 &&
            map_fields.call(dest)==fields29,
            'Unrelated map field changed'
          )

          [[18,source],[29,dest]].each do |mid,m|

            p=path.call(format('Map%03d',mid))

            File.binwrite(p,Marshal.dump(m))

            reloaded=Marshal.load(
              File.binread(p)
            )

            check(
              Marshal.dump(reloaded)==Marshal.dump(m),
              "Map#{mid} roundtrip mismatch"
            )
          end

          m18=Marshal.load(
            File.binread(path.call('Map018'))
          )

          m29=Marshal.load(
            File.binread(path.call('Map029'))
          )

          check(
            !iv(m18,:@events).key?(6),
            'Source recruiter still exists'
          )

          check(
            Marshal.dump(
              iv(m29,:@events).fetch(new_id)
            )==expected,
            'Moved recruiter differs'
          )

          puts "PASS maps=#{maps.size}"
          puts "PASS original events=#{all_events}"
          puts "PASS Map018 EV6 -> Map029 EV#{new_id}"
          puts "PASS recruiter position #{x},#{y}"
          puts 'PASS recruiter renamed'
          puts 'PASS one recruiter moved'
          puts 'PASS all unrelated events unchanged'
          puts 'PASS all unrelated map fields unchanged'
          RUBY

          ruby -c /tmp/sl-v42-move.rb
          ruby /tmp/sl-v42-move.rb

      - name: Update mappings and verify all changes
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re

          root=Path('site')
          game=root/'knight/gameasync'

          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          files=[
              prefix+'Map018.rxdata',
              prefix+'Map029.rxdata'
          ]

          before=json.loads(
              Path('/tmp/sl42-before.json').read_text('utf8')
          )

          old_md5=json.loads(
              Path('/tmp/sl42-md5.json').read_text('utf8')
          )

          mapper=game/'mapping.js'

          s=mapper.read_bytes()

          for name in files:

              marker=(
                  'Data/'+name+'?h='
              ).encode('ascii')

              pattern=(
                  re.escape(marker)+rb'[0-9a-f]{32}'
              )

              matches=re.findall(pattern,s)

              assert len(matches)==1,name

              assert matches[0]==(
                  marker+old_md5[name].encode('ascii')
              ),name

              digest=hashlib.md5(
                  (game/'Data'/name).read_bytes()
              ).hexdigest()

              s=re.sub(
                  pattern,
                  lambda _:marker+digest.encode('ascii'),
                  s
              )

          mapper.write_bytes(s)

          loader=root/'knight/js/sl-assets-v229r115.js'

          s=loader.read_bytes()

          assert s.count(
              b"var version='V4.1';"
          )==1

          loader.write_bytes(
              s.replace(
                  b"var version='V4.1';",
                  b"var version='V4.2';"
              )
          )

          for name in ('index.html','knight/index.html'):

              p=root/name
              s=p.read_bytes()

              assert b'V4.1' in s

              p.write_bytes(
                  s.replace(
                      b'V4.1',b'V4.2'
                  ).replace(
                      b'v4.1',b'v4.2'
                  )
              )

          after={
              str(p.relative_to(root)):hashlib.sha256(
                  p.read_bytes()
              ).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          assert set(before)==set(after)

          allowed={
              'knight/gameasync/Data/'+n
              for n in files
          }|{
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html',
              'knight/index.html'
          }

          changed={
              p for p in before
              if before[p]!=after[p]
          }

          assert changed==allowed,sorted(changed^allowed)

          assert len(after)==6019

          monster_file=(
              'knight/gameasync/Data/'+prefix+
              'MonsterStats.rxdata'
          )

          assert before[monster_file]==after[monster_file]

          print('PASS approved file changes',len(changed))
          print('PASS unchanged files',len(before)-len(changed))
          print('PASS V4.1 monster data retained')
          print('PASS original scripts unchanged')
          print('PASS original actor data unchanged')
          print('PASS original companion functions unchanged')
          print('PASS original graphics unchanged')
          print('PASS no added files')
          print('PASS no removed files')
          print('PASS V4.2')
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Upload V4.2 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
