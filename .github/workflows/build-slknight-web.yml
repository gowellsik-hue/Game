# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R125
# BASE: deployed V229R121 (run 40641411815), excluding R122-R124.
# MAP045: preserve existing directions and add only the approved openings.
# (32657,32805): 3 -> 11 (DOWN + LEFT + UP).
# (32657,32807): 3 -> 7  (DOWN + LEFT + RIGHT).
# Restore the previously lost LEFT exit after going UP through 805.
# Preserve the original DOWN exit at 807.
# Eight reversible RGSS edges represent the approved S32 connections.
# Keep all other 450 masks, walls, doors, map46, monsters, sprites,
# actor coordinates, original map data, controls and preloading unchanged.
name: build-slknight-web.yml | V229R125 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: V229R125 Restore original R121 deployment
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40641411815
          name: github-pages
          github-token: ${{ github.token }}
          path: r121

      - name: V229R125 Restore two S32 passages without closing old paths
        shell: bash
        run: |
          set -euo pipefail

          test -s r121/artifact.tar
          mkdir -p site build
          tar -xf r121/artifact.tar -C site

          python3 - <<'BASE'
          from pathlib import Path
          import hashlib
          import json

          root=Path('site')
          before={
              str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          assert len(before)==5566,('Wrong baseline file count',len(before))

          expected={
              'knight/gameasync/Data/Scripts.rxdata':
                  '51bbd2b04e5a8e51a7ab95838ba3f7669009ffc1f66c1695c74ed35c6344e7ee',
              'knight/js/dpad.js':
                  '2bd401adf130339d154ce6a8efd0127cefd9b1bc58bc60d1de68e8b6d8b7a791',
              'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap045.rxdata':
                  'f47de87af6b4e607bf632818a711619dc8ca4e747196a123a76ac7db8ffc3ba6',
              'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap046.rxdata':
                  'dc89d908f5247442e08dddc11f5bcf6505a77890bd82ab59b790e00e3e5f024c'
          }

          for path,sha in expected.items():
              assert before[path]==sha,('Wrong baseline',path)

          assert 'V229R121' in (
              root/'knight/index.html'
          ).read_text('utf8')

          Path('build/before.json').write_text(
              json.dumps(before,sort_keys=True)
          )

          print('PASS exact R121 baseline')
          BASE

          cp site/knight/gameasync/Data/Scripts.rxdata build/scripts-before.rxdata

          cat > build/patch.rb <<'PATCH'
          require 'zlib'

          source=ARGV.fetch(0)
          destination=ARGV.fetch(1)

          archive=Marshal.load(File.binread(source))
          raise 'Wrong script count' unless archive.size==136

          old=Zlib::Inflate.inflate(archive[134][2])

          raise 'Original S32 graph missing' unless
            old.include?('module SLTI_Native66')

          raise 'Original corner masks missing' unless
            old.include?('module SLTI_V229R97Corner')

          raise 'Wrong baseline' if old.include?('SLTI_R124TwoOpen')
          raise 'Wrong baseline' if old.include?('SLTI_R123TwoOpen')
          raise 'Wrong baseline' if old.include?('SLTI_R122TwoOpen')
          raise 'Already patched' if old.include?('SLTI_R125TwoOpen')

          raise 'Character coordinate override unexpectedly present' if
            old.include?('slti_native66_prepare') ||
            old.include?('@slti_native66_')

          # Original 452 direction masks.
          # Keep all existing directions and add one bit at each selected tile.
          pattern=/data='([^']+)'\.unpack\('m'\)\[0\]\.unpack\('C\*'\)/

          matches=old.scan(pattern)
          raise 'Mask payload not unique' unless matches.size==1

          encoded=matches.first.first
          data=encoded.unpack('m')[0].unpack('C*')

          raise 'Wrong mask count' unless data.size==452*3

          changes={
            [32657,32805]=>11,
            [32657,32807]=>7
          }

          seen={}

          i=0
          while i<data.size
            point=[32576+data[i],32704+data[i+1]]

            if changes.key?(point)
              previous=data[i+2]
              raise "Unexpected previous mask #{point}" unless previous==3

              new_mask=changes.fetch(point)

              # ADD directions; never remove a previously allowed bit.
              raise "Direction removed #{point}" unless
                (new_mask & previous)==previous

              data[i+2]=new_mask
              seen[point]=true
            end

            i+=3
          end

          raise 'Wrong selected cells' unless
            seen.keys.sort==changes.keys.sort

          replacement="data='#{[data.pack('C*')].pack('m0')}'.unpack('m')[0].unpack('C*')"

          modified=old.sub(pattern,replacement)

          raise 'Mask replacement failed' if modified==old

          # Exactly two selected S32 cells:
          #
          # 805 UP    [89,79] <-> [89,78]
          # 805 DOWN  [89,79] <-> [89,80]
          # 805 LEFT  [89,79] <-> [88,79] <-> [87,79]
          #
          # 807 RIGHT [90,80] <-> [91,80] <-> [92,80]
          # 807 LEFT  [90,80] <-> [89,80]
          # 807 DOWN  [90,80] <-> [90,81]
          #
          # Total: eight reciprocal RGSS edges.
          # No other map location gets an additional connection.

          runtime=<<'RUNTIME'

          # V229R125: approved two-cell passage correction.
          # Preserve all existing S32 directions.
          # 805: LEFT/DOWN retained, UP added.
          # 807: LEFT/DOWN retained, RIGHT added.
          module SLTI_R125TwoOpen
            WIDTH=288

            # Bits:
            # UP=1, DOWN=2, LEFT=4, RIGHT=8.
            GATES={
              78*WIDTH+89=>2,
              79*WIDTH+87=>8,
              79*WIDTH+88=>12,
              79*WIDTH+89=>7,
              80*WIDTH+89=>9,
              80*WIDTH+90=>14,
              80*WIDTH+91=>12,
              80*WIDTH+92=>4,
              81*WIDTH+90=>1
            }.freeze

            def self.edge?(mid,x,y,d)
              return false unless mid==45
              return false if x<0 || x>=288 || y<0 || y>=144

              bit=case d
              when 8 then 1
              when 2 then 2
              when 4 then 4
              when 6 then 8
              else 0
              end

              return false if bit==0
              (GATES.fetch(y*WIDTH+x,0)&bit)!=0
            end
          end

          # Restore only the eight selected reciprocal crossings.
          # All other R44 movement rules remain unchanged.
          module SLTI_V229R44
            class << self
              alias slti_r125_original_allowed allowed?

              def allowed?(mid,x,y,d)
                return true if SLTI_R125TwoOpen.edge?(mid,x,y,d)
                slti_r125_original_allowed(mid,x,y,d)
              end
            end
          end

          # Keep original RPG tile and event collision processing.
          # Bypass the S32 nearest-cell restriction only at approved gates.
          class Game_Map
            alias slti_r125_original_passable passable?

            def passable?(x,y,d,self_event=nil)
              if SLTI_R125TwoOpen.edge?(@map_id,x,y,d)
                return slti_native66_original_passable(
                  x,y,d,self_event
                )
              end

              slti_r125_original_passable(
                x,y,d,self_event
              )
            end
          end
          RUNTIME

          modified+=runtime

          # Confirm the entire old script is untouched except two mask bytes
          # and the explicitly appended passage module.
          recovered=modified.sub(runtime,'').sub(
            replacement,
            "data='#{encoded}'.unpack('m')[0].unpack('C*')"
          )

          raise 'Unexpected modification to existing game code' unless
            recovered==old

          raise 'Native coordinate mapping changed' unless
            modified.include?(
              "if mid==45 || mid==46\n      px+=12\n      py+=6"
            )

          raise 'Original wall handling lost' unless
            modified.include?('def slti_r49_update_walls')

          raise 'Original monster respawn lost' unless
            modified.include?('module SLTI_R111Respawn')

          before=Marshal.load(File.binread(source))

          archive[134][2]=Zlib::Deflate.deflate(modified)

          archive.each_with_index do |entry,index|
            next if index==134
            raise "Unapproved script change #{index}" unless
              entry==before[index]
          end

          File.binwrite(destination,Marshal.dump(archive))
          File.binwrite('build/script134-r125.rb',modified)

          puts 'PASS only two additive S32 mask changes'
          puts 'PASS eight reciprocal RPG passage edges'
          puts 'PASS existing game scripts preserved'
          PATCH

          ruby -c build/patch.rb

          ruby build/patch.rb \
            build/scripts-before.rxdata \
            site/knight/gameasync/Data/Scripts.rxdata

          ruby -c build/script134-r125.rb

      - name: V229R125 Verify old paths remain and upper-left turn works
        shell: bash
        run: |
          set -euo pipefail

          cat > build/audit.rb <<'AUDIT'
          require 'zlib'

          before=Marshal.load(File.binread(ARGV.fetch(0)))
          after=Marshal.load(File.binread(ARGV.fetch(1)))

          script=lambda do |archive,i|
            Zlib::Inflate.inflate(archive[i][2])
          end

          Object.class_eval(script.call(before,21))

          [23,24,25,27].each do |i|
            Object.class_eval(script.call(before,i))
          end

          class Game_Event < Game_Character
          end

          class Game_Character
            def check_event_trigger_touch(*args)
            end
          end

          original=script.call(before,134)
          updated=script.call(after,134)

          segment=lambda do |source,start_marker,end_marker|
            a=source.index(start_marker)
            b=a && source.index(end_marker,a)

            raise "Missing section #{start_marker}" unless
              a && b && a<b

            source[a...b]
          end

          Object.class_eval(
            segment.call(
              original,
              "module SLTI_Native66\n",
              "\n# Replace the old R42/R44 graph"
            )
          )

          Object.class_eval(
            segment.call(
              original,
              "class Game_Map\n  alias slti_native66_original_passable passable?",
              "\n# V229R97:"
            )
          )

          Object.class_eval(
            segment.call(
              original,
              "module SLTI_V229R97Corner\n",
              "\n# V229R84:"
            )
          )

          start=original.index("# V229R84:")
          first=original.index("module SLTI_Native66\n",start)
          last=original.index("\n# V229R111:",first)

          raise 'Native path graph missing' unless first && last

          Object.class_eval(original[first...last])

          native=SLTI_Native66
          original_masks=SLTI_V229R97Corner::MASKS.dup

          raise 'Wrong original mask count' unless
            original_masks.size==452

          raise 'Wrong original 805' unless
            original_masks[[32657,32805]]==3

          raise 'Wrong original 807' unless
            original_masks[[32657,32807]]==3

          # Snapshot every existing native movement around both passages.
          # An existing allowed edge must never become blocked.
          directions=[2,4,6,8]
          native_before={}

          (32653..32661).each do |x|
            (32800..32811).each do |y|
              directions.each do |d|
                native_before[[x,y,d]]=native.native_target(45,x,y,d)
              end
            end
          end

          Object.send(:remove_const,:SLTI_V229R97Corner)

          Object.class_eval(
            segment.call(
              updated,
              "module SLTI_V229R97Corner\n",
              "\n# V229R84:"
            )
          )

          masks=SLTI_V229R97Corner::MASKS

          raise 'Mask count changed' unless masks.size==452

          expected_masks={
            [32657,32805]=>11,
            [32657,32807]=>7
          }

          changed=original_masks.keys.select do |point|
            original_masks[point]!=masks[point]
          end

          raise "Other S32 masks modified #{changed.inspect}" unless
            changed.sort==expected_masks.keys.sort

          expected_masks.each do |point,value|
            raise "Wrong mask #{point}" unless masks[point]==value
            raise "Original exits removed #{point}" unless
              (value&original_masks[point])==original_masks[point]
          end

          native_before.each do |key,old_target|
            next if old_target==nil

            new_target=native.native_target(45,*key)

            raise "Previously open S32 route blocked #{key.inspect}" unless
              new_target==old_target
          end

          # 805: UP / DOWN / LEFT.
          expected_805={
            8=>[32658,32804],
            2=>[32656,32806],
            4=>[32656,32804]
          }

          expected_805.each do |d,target|
            observed=native.native_target(45,32657,32805,d)

            raise "805 direction #{d} failed" unless
              observed==target
          end

          raise '805 unrequested RIGHT opened' unless
            native.native_target(45,32657,32805,6)==nil

          # 807: RIGHT / LEFT / DOWN.
          expected_807={
            6=>[32658,32808],
            4=>[32656,32806],
            2=>[32656,32808]
          }

          expected_807.each do |d,target|
            observed=native.native_target(45,32657,32807,d)

            raise "807 direction #{d} failed" unless
              observed==target
          end

          raise '807 unrequested UP opened' unless
            native.native_target(45,32657,32807,8)==nil

          # Ensure the reverse transitions also remain valid.
          [
            [32658,32804,2,32657,32805],
            [32656,32806,8,32657,32805],
            [32656,32804,6,32657,32805],
            [32658,32808,4,32657,32807],
            [32656,32806,6,32657,32807],
            [32656,32808,8,32657,32807]
          ].each do |x,y,d,tx,ty|
            raise "Reverse connection failed #{[x,y,d]}" unless
              native.native_target(45,x,y,d)==[tx,ty]
          end

          raise '1F projection changed' unless
            native.project(45,32655,32806)==[1416,1290]

          raise '2F projection changed' unless
            native.project(46,32655,32806)==[1416,1674]

          puts 'PASS 805 UP/DOWN/LEFT, 807 RIGHT/LEFT/DOWN'
          puts 'PASS original native movements preserved'
          puts 'PASS 450 other masks and both projection formulas unchanged'

          # Test original Game_Character movement and map collision stack.
          class MockMap < Game_Map
            def initialize(mid)
              @map_id=mid
              @map=Struct.new(:width,:height).new(
                mid==45 ? 288 : 336,
                mid==45 ? 144 : 168
              )
              @events={}
              @passages=Array.new(999,0)
              @priorities=Array.new(999,0)
            end

            def valid?(x,y)
              x>=0 && y>=0 &&
                x<@map.width && y<@map.height
            end
          end

          $game_map=MockMap.new(45)
          $game_player=Game_Character.new

          $game_player.instance_variable_set(
            :@character_name,'Kn'
          )

          DIRS={
            2=>[0,1],
            4=>[-1,0],
            6=>[1,0],
            8=>[0,-1]
          }

          def can?(x,y,d)
            $game_player.moveto(x,y)
            $game_player.passable?(x,y,d)
          end

          def snapshot(mid)
            $game_map=MockMap.new(mid)
            result={}

            (80..100).each do |x|
              (70..90).each do |y|
                DIRS.each_key do |d|
                  result[[x,y,d]]=can?(x,y,d)
                end
              end
            end

            result
          end

          base1=snapshot(45)
          base2=snapshot(46)

          marker=updated.index("\n# V229R125:")
          raise 'New runtime missing' unless marker

          Object.class_eval(updated[marker..-1])

          actual1=snapshot(45)
          actual2=snapshot(46)

          raise '2F movement altered' unless actual2==base2

          # No formerly valid 1F movement may be lost.
          lost=base1.keys.select do |key|
            base1[key] && !actual1[key]
          end

          raise "Previously open RPG movement lost: #{lost.inspect}" unless
            lost.empty?

          # Exactly eight reciprocal edges, 16 directed movements.
          expected=[
            [89,78,2],
            [89,79,8],

            [89,79,2],
            [89,80,8],

            [89,79,4],
            [88,79,6],
            [88,79,4],
            [87,79,6],

            [89,80,6],
            [90,80,4],

            [90,80,6],
            [91,80,4],
            [91,80,6],
            [92,80,4],

            [90,80,2],
            [90,81,8]
          ].sort

          modified=base1.keys.select do |key|
            base1[key]!=actual1[key]
          end

          raise "Unapproved movement modification #{(modified-expected).inspect}" unless
            (modified-expected).empty?

          expected.each do |key|
            raise "Required connection still blocked #{key.inspect}" unless
              actual1[key]
          end

          expected_gates={
            78*288+89=>2,
            79*288+87=>8,
            79*288+88=>12,
            79*288+89=>7,
            80*288+89=>9,
            80*288+90=>14,
            80*288+91=>12,
            80*288+92=>4,
            81*288+90=>1
          }

          raise 'Unexpected RPG gates' unless
            SLTI_R125TwoOpen::GATES==expected_gates

          # Exercise actual move_up, move_left, move_right and move_down.
          $game_map=MockMap.new(45)

          expected.each do |x,y,d|
            $game_player.moveto(x,y)

            target=[
              x+DIRS[d][0],
              y+DIRS[d][1]
            ]

            case d
            when 2
              $game_player.move_down
            when 4
              $game_player.move_left
            when 6
              $game_player.move_right
            when 8
              $game_player.move_up
            end

            actual=[$game_player.x,$game_player.y]

            raise "Actual character movement failed #{[x,y,d]}" unless
              actual==target
          end

          # Critical regression:
          # Go UP through 805, then LEFT twice to the old corridor.
          $game_player.moveto(89,80)
          $game_player.move_up

          raise '805 UP entry failed' unless
            [$game_player.x,$game_player.y]==[89,79]

          $game_player.move_left

          raise '805 first LEFT step failed' unless
            [$game_player.x,$game_player.y]==[88,79]

          $game_player.move_left

          raise '805 second LEFT step failed' unless
            [$game_player.x,$game_player.y]==[87,79]

          # Critical regression:
          # The old DOWN route under 807 must remain accessible.
          $game_player.moveto(90,80)
          $game_player.move_down

          raise '807 original DOWN route failed' unless
            [$game_player.x,$game_player.y]==[90,81]

          puts 'PASS 805 UP then LEFT then LEFT'
          puts 'PASS 807 original DOWN route preserved'
          puts 'PASS all 16 selected character movements'
          puts 'PASS no previously allowed movement removed'

          # Check connectivity from the original entrance area.
          $game_map=MockMap.new(45)

          start=[92,74]
          queue=[start]
          seen={start=>true}
          head=0

          while head<queue.length
            x,y=queue[head]
            head+=1

            DIRS.each do |d,(dx,dy)|
              nx=x+dx
              ny=y+dy

              next if nx<0 || nx>=288
              next if ny<0 || ny>=144

              next_cell=[nx,ny]
              next if seen[next_cell]

              if can?(x,y,d)
                seen[next_cell]=true
                queue<<next_cell
              end
            end
          end

          [
            [87,79],[88,79],[89,78],[89,79],
            [89,80],[90,80],[91,80],[92,80],[90,81]
          ].each do |cell|
            raise "Unreachable passage cell #{cell.inspect}" unless
              seen[cell]
          end

          raise 'Original corridor unexpectedly disconnected' if
            seen.size<155

          puts "PASS entrance connectivity: #{seen.size} reachable RPG cells"
          puts 'PASS no changes to 2F movement'
          AUDIT

          ruby -c build/audit.rb

          ruby build/audit.rb \
            build/scripts-before.rxdata \
            site/knight/gameasync/Data/Scripts.rxdata

      - name: V229R125 Refresh script cache and verify original assets
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'FILES'
          from pathlib import Path
          import hashlib
          import json
          import re

          root=Path('site')

          scripts=root/'knight/gameasync/Data/Scripts.rxdata'
          mapping=root/'knight/gameasync/mapping.js'

          text=mapping.read_text('utf8')

          text,count=re.subn(
              r'(Data/Scripts\.rxdata\?h=)[0-9a-f]{32}',
              lambda m:m.group(1)+hashlib.md5(
                  scripts.read_bytes()
              ).hexdigest(),
              text
          )

          assert count==1,('Missing script cache entry',count)
          mapping.write_text(text,encoding='utf8')

          for name in ('index.html','knight/index.html'):
              path=root/name
              html=path.read_text('utf8')

              assert 'V229R121' in html
              assert 'V229R125' not in html

              path.write_text(
                  html.replace('V229R121','V229R125')
                      .replace('v229r121','v229r125'),
                  encoding='utf8'
              )

          runtime=root/'knight/js/sl-assets-v229r115.js'
          code=runtime.read_text('utf8')

          assert code.count("var version='V229R121';")==1

          runtime.write_text(
              code.replace(
                  "var version='V229R121';",
                  "var version='V229R125';"
              ),
              encoding='utf8'
          )

          before=json.loads(
              Path('build/before.json').read_text('utf8')
          )

          after={
              str(p.relative_to(root)):
                  hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          assert len(before)==len(after)==5566
          assert before.keys()==after.keys()

          changed={
              p for p in before if before[p]!=after[p]
          }

          expected={
              'index.html',
              'knight/index.html',
              'knight/gameasync/mapping.js',
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/js/sl-assets-v229r115.js'
          }

          assert changed==expected,(
              'Unexpected modifications',
              changed^expected
          )

          for path in before:
              protected=(
                  path.startswith('knight/assets/')
                  or path.startswith('knight/gameasync/Graphics/')
                  or (
                      path.startswith('knight/gameasync/Data/')
                      and not path.endswith('/Scripts.rxdata')
                  )
                  or path in (
                      'knight/js/dpad.js',
                      'knight/js/drive.js'
                  )
              )

              if protected:
                  assert before[path]==after[path],(
                      'Protected file changed',
                      path
                  )

          assert 'js/sl-assets-v229r115.js?v=v229r125' in (
              root/'knight/index.html'
          ).read_text('utf8')

          print('PASS 5566 original files retained')
          print('PASS only 5 expected release files modified')
          print('PASS 1F/2F maps, walls, images and monsters unchanged')
          FILES

          node --check site/knight/js/dpad.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/gameasync/mapping.js

      - name: V229R125 Publish two corrected passages without closing old routes
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
