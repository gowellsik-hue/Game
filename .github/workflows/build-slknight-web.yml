name: build-slknight-web.yml | V4.17 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Resolve final V4.16 deployment
        id: baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BASE_SHA=9cab02b37866199fa1236481d1beb380ea3eccfb

          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/build-slknight-web.yml/runs" -f head_sha="$BASE_SHA" -f status=success -f per_page=100 > /tmp/sl417-runs.json

          RUN_ID=$(jq -er --arg sha "$BASE_SHA" '[.workflow_runs[] | select(.head_sha==$sha and .head_branch=="main" and .status=="completed" and .conclusion=="success")] | sort_by(.created_at) | last | .id // empty' /tmp/sl417-runs.json)

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" > /tmp/sl417-jobs.json

          jq -e '[.jobs[] | select(.name=="deploy" and .conclusion=="success")] | length==1' /tmp/sl417-jobs.json

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" > /tmp/sl417-artifacts.json

          jq -e '[.artifacts[] | select(.name=="github-pages" and .expired==false and .size_in_bytes>0)] | length==1' /tmp/sl417-artifacts.json

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Restore final V4.16 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: ${{ steps.baseline.outputs.run_id }}
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify original game
        shell: bash
        run: |
          set -euo pipefail

          test -s baseline/artifact.tar
          mkdir -p site
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib,json

          root=Path('site')
          game=root/'knight/gameasync'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          before={
              p.relative_to(root).as_posix():
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          assert len(before)==6086,len(before)

          for name in (
              'System','Map007','Map047','Actors',
              'Classes','Weapons','Armors','Items',
              'States','CommonEvents'
          ):
              q=game/'Data'/(pre+name+'.rxdata')
              assert q.is_file() and q.stat().st_size>4,name

          assert (game/'Data/Scripts.rxdata').stat().st_size>100000

          assert (root/'knight/js/sl-assets-v229r115.js').read_bytes().count(
              b"var version='V4.16';"
          )==1

          for name in ('index.html','knight/index.html'):
              assert b'V4.16' in (root/name).read_bytes(),name

          names=['Scripts.rxdata',pre+'Map007.rxdata']

          Path('/tmp/sl417-before.json').write_text(
              json.dumps(before,sort_keys=True),'utf8'
          )

          Path('/tmp/sl417-md5.json').write_text(
              json.dumps({
                  n:hashlib.md5(
                      (game/'Data'/n).read_bytes()
                  ).hexdigest()
                  for n in names
              }),'utf8'
          )

          print('PASS final V4.16 baseline')
          PYTHON

      - name: Rebuild single native character creation
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl417-patch.rb <<'RUBY'
          # encoding: UTF-8

          require 'zlib'
          require 'json'

          module RPG
            %w[Map MapInfo Tileset Event EventCommand MoveRoute MoveCommand AudioFile CommonEvent System Actor Class Weapon Armor Item Skill State].each{|n|const_set(n,::Class.new)}

            Event.const_set(:Page,::Class.new)
            Event::Page.const_set(:Condition,::Class.new)
            Event::Page.const_set(:Graphic,::Class.new)
            System.const_set(:Words,::Class.new)
            System.const_set(:TestBattler,::Class.new)
            self::Class.const_set(:Learning,::Class.new)
          end

          %w[Table Tone Color].each do |n|
            Object.const_set(n,Class.new do
              def self._load(raw)
                o=allocate
                o.instance_variable_set(:@raw,raw)
                o
              end

              def _dump(depth)
                @raw
              end
            end)
          end

          def iv(o,k);o.instance_variable_get(k);end
          def utf(s);s.to_s.dup.force_encoding('UTF-8');end
          def ck(v,m);raise m unless v;end
          def code(c);iv(c,:@code);end
          def par(c);iv(c,:@parameters);end

          def emit(l,c,d,p=[])
            x=RPG::EventCommand.new
            {code:c,indent:d,parameters:p}.each{
              |k,v|x.instance_variable_set("@#{k}",v)
            }
            l<<x
          end

          def one(s,a,b)
            ck(s.scan(a).size==1,"Anchor: #{a.inspect[0,120]}")
            s.sub(a){b}
          end

          root=ARGV.fetch(0)
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          path=->(n){File.join(root,pre+n+'.rxdata')}
          read=->(n){Marshal.load(File.binread(path.call(n)))}

          sys=read.call('System')
          map=read.call('Map007')
          island=read.call('Map047')

          ck(
            [:@start_map_id,:@start_x,:@start_y].map{
              |k|iv(sys,k)
            }==[7,9,6],
            'V4.16 start'
          )

          recruit=iv(island,:@events).values.select{
            |e|utf(iv(e,:@name))=='[ID고용사]'
          }

          ck(recruit.size==1,'Recruiter')

          forms=iv(recruit.first,:@pages).map do |page|

            pending=[]
            found=[]

            iv(page,:@list).each do |c|

              next unless code(c)==355

              s=utf(par(c)[0])

              if m=s.match(/\A@sl43_type = ("(?:\\.|[^"\\])*"); @sl43_stats = (\[[0-9, ]+\])/)

                pending<<[
                  JSON.parse(m[1]),
                  JSON.parse(m[2])
                ]

              elsif s.include?('@sl43_actor = Game_Actor.new(@sl43_slot)')

                m=s.match(/@class_id,\$data_actors\[(\d+)\]\.class_id\).*?\.set_graphic\(("(?:\\.|[^"\\])*"),0,.*?@sl43_form,("(?:\\.|[^"\\])*")\)/)

                ck(m&&!pending.empty?,'Recruiter profile')

                found<<[
                  JSON.parse(m[3]),
                  JSON.parse(m[2]),
                  m[1].to_i,
                  pending
                ]

                pending=[]
              end
            end

            ck(
              pending.empty?&&found.size==8,
              'Recruiter page'
            )

            found
          end

          ck(forms.uniq.size==1,'Recruiter pages disagree')

          forms=forms.first

          ck(
            forms.map(&:first)==%w[
              남기사 여기사 남요정 여요정
              남법사 여법사 남다엘 여다엘
            ],
            'Form order'
          )

          ck(
            forms.map{|f|f[3].size}==[2,2,3,3,3,3,3,3] &&
            forms.flat_map{|f|f[3]}.uniq.size==11,
            'Preset count'
          )

          ck(
            forms.all?{|f|f[3].all?{|_,s|s.size==6&&s.sum==75}},
            'Stats'
          )

          actors=read.call('Actors')
          classes=read.call('Classes')

          forms.each do |_,_,id,_|
            ck(
              actors[id]&&classes[iv(actors[id],:@class_id)],
              'Class template'
            )
          end

          sp=File.join(root,'Scripts.rxdata')
          rows=Marshal.load(File.binread(sp))

          ck(rows.size==137,'Scripts')

          before=rows.map{|r|Marshal.dump(r)}

          edit=->(i,&blk) do

            raw=utf(Zlib::Inflate.inflate(rows.fetch(i)[2]))
            s=raw.gsub("\r\n","\n")
            n=blk.call(s)

            ck(n!=s,"No change #{i}")

            RubyVM::InstructionSequence.compile(n)

            rows[i][2]=Zlib::Deflate.deflate(
              raw.include?("\r\n") ? n.gsub("\n","\r\n") : n
            )
          end

          es=iv(map,:@events)
          e=es.fetch(1)
          pg=iv(e,:@pages).fetch(0)
          old=iv(pg,:@list)

          ck(
            iv(e,:@name)=='EV001' &&
            iv(pg,:@trigger)==4 &&
            old.size==121,
            'Original EV001'
          )

          ck(
            [3,4,13,14,40,44,45,74,75,76,77,78,79,80,81,89,97,104,105,106,119,120].map{|i|code(old[i])}==
            [101,102,101,102,101,241,303,101,401,129,129,121,122,317,311,127,126,209,509,509,201,0],
            'Original commands'
          )

          ck(
            par(old[45])==[1,12] &&
            par(old[119])[0,2]==[0,47],
            'V4.16 transfer'
          )

          old_cmds=old.map{|c|Marshal.dump(c)}

          other=es.reject{|k,_|k==1}.transform_values{
            |v|Marshal.dump(v)
          }

          name_prompt=utf(par(old[40])[0])
          name_error=utf(par(old[47])[0])

          reserved=[46,51,56,61].map{
            |i|utf(par(old[i])[3])
          }

          ck(reserved.uniq.size==4,'Reserved names')

          profiles=[0,1].map do |sex|

            forms.each_with_index.select{
              |_,i|i%2==sex
            }.flat_map do |(form,graphic,template,presets),i|

              presets.map{
                |kind,stats|[form,graphic,template,kind,stats,i%2]
              }
            end
          end

          ck(
            profiles.map(&:size)==[11,11],
            'Two complete columns'
          )

          ck(
            profiles[0].map{|p|p[3]}==profiles[1].map{|p|p[3]},
            'Paired types'
          )

          list=old[0,3]+old[44,2]+old[76,4]+old[82,7]+[old[97]]

          route=Marshal.load(Marshal.dump(old[104]))

          route.instance_variable_set(:@indent,0)

          move=par(route)[1]
          steps=iv(move,:@list)

          ck(
            steps.map{|c|code(c)}==[41,29,0],
            'Original route'
          )

          steps.shift

          step=Marshal.load(Marshal.dump(old[106]))

          step.instance_variable_set(:@indent,0)

          step.instance_variable_set(
            :@parameters,[steps.first]
          )

          list.concat([route,step])
          list.concat(old[109,12])

          ck(
            list.none?{|c|[101,102,401].include?(code(c))} &&
            list.count{|c|code(c)==303}==1,
            'One creation screen'
          )

          ck(
            list[-2].equal?(old[119]) &&
            old.map{|c|Marshal.dump(c)}==old_cmds,
            'Original transfer'
          )

          pg.instance_variable_set(:@list,list)

          ck(
            es.reject{|k,_|k==1}.transform_values{
              |v|Marshal.dump(v)
            }==other,
            'Other events changed'
          )

          edit.call(94) do |s|

            s=one(
              s,
              'class Scene_Name',
              "class Scene_Name\n  SL417_PROFILES = #{profiles.inspect}\n  SL417_RESERVED = #{reserved.inspect}\n  SL417_TITLE = #{utf(par(old[13])[0]).inspect}"
            )

            s=one(
              s,
              '    @actor = $game_actors[$game_temp.name_actor_id]',
              <<~'SRC'.lines.map{|l|'    '+l}.join.chomp
          @actor = $game_actors[$game_temp.name_actor_id]

          @sl417_create = $game_map.map_id==7 && @actor.id==1

          if @sl417_create

            @sl417_phase=:failed
            @sl417_windows=[]

            begin

              @sl417_col=0

              SL417_PROFILES.each_with_index do |col,i|

                labels=col.map do |p|

                  kind=p[3]

                  kind += '법사' if p[0].end_with?('법사')
                  kind += '다엘' if p[0].end_with?('다엘')

                  p[0][0,1]+' '+kind
                end

                w=Window_Command.new(320,labels)

                @sl417_windows << w

                w.x=80+i*320
                w.y=64
                w.opacity=0
                w.back_opacity=0
                w.contents_opacity=255
                w.active=(i==0)
                w.index=i==0 ? 0 : -1
              end

              @sl417_header=Window_Help.new

              @sl417_header.x=80
              @sl417_header.y=0
              @sl417_header.opacity=0
              @sl417_header.back_opacity=0
              @sl417_header.contents_opacity=255

              @sl417_header.set_text(SL417_TITLE,1)

              @sl417_windows[0].draw_item(
                0,
                @sl417_windows[0].text_color(6)
              )

              File.open('SL417Name.tmp','wb'){
                |f|f.write("0\n")
              }

              Graphics.transition

              @sl417_phase=:waiting

              puts([
                'SL417|NAME',
                80,432,640,168,
                $game_temp.name_max_char,
                File.expand_path('SL417Name.tmp')
              ].join('|'))

            rescue Exception=>e

              puts(
                'SL417|FAIL|OPEN|'+
                e.class.to_s+'|'+e.message.to_s
              )

              puts(
                'SLRUNTIMEERR|'+
                e.class.to_s+'|'+e.message.to_s
              )
            end

            return
          end
          SRC
            )

            s=one(
              s,
              '    @edit_window.dispose',
              <<~'SRC'.lines.map{|l|'    '+l}.join.chomp
          if @sl417_create

            @sl417_windows.each{|w|w.dispose}

            @sl417_header.dispose if @sl417_header

            puts('SL417|NAME_CLOSE')

            return
          end

          @edit_window.dispose
          SRC
            )

            one(
              s,
              '    @edit_window.update',
              <<~'SRC'.lines.map{|l|'    '+l}.join.chomp
          if @sl417_create

            return unless @sl417_phase==:waiting

            stage='INPUT'

            begin

              col=@sl417_col

              w=@sl417_windows[col]

              row=w.index

              w.update

              if w.index!=row

                w.draw_item(row,w.normal_color)

                w.draw_item(w.index,w.text_color(6))
              end

              to=col

              to=0 if Input.trigger?(Input::LEFT)
              to=1 if Input.trigger?(Input::RIGHT)

              if to!=col

                row=w.index

                w.draw_item(row,w.normal_color)

                w.active=false
                w.index=-1

                @sl417_col=to

                w=@sl417_windows[to]

                w.active=true
                w.index=row

                w.draw_item(row,w.text_color(6))

                $game_system.se_play($data_system.cursor_se)
              end

              raw=File.open('SL417Name.tmp','rb'){
                |f|f.read
              }

              flag,name=raw.split("\n",2)

              return if flag=='2'

              return unless flag=='1' || Input.trigger?(Input::C)

              name=(name||'').force_encoding('UTF-8')

              File.open('SL417Name.tmp','wb'){
                |f|f.write("0\n"+name)
              }

              if !name.valid_encoding? ||
                 name.strip.empty? ||
                 name.split(//).size>$game_temp.name_max_char ||
                 name =~ /[\x00-\x1f\x7f\\]/ ||
                 SL417_RESERVED.include?(name.strip)

                $game_system.se_play($data_system.buzzer_se)

                puts('SL417|NAME_RETRY')

                return
              end

              @sl417_phase=:processing

              stage='PROFILE'

              form,graphic,template,kind,stats,sex=
                SL417_PROFILES[@sl417_col][w.index]

              @actor.instance_variable_set(:@sl43_form,form)

              @actor.instance_variable_set(:@sl43_type,kind)

              @actor.instance_variable_set(:@sl43_stats,stats.dup)

              @actor.instance_variable_set(
                :@sl417_base_graphic,
                graphic
              )

              @actor.instance_variable_set(
                :@class_id,
                $data_actors[template].class_id
              )

              @actor.set_graphic(
                graphic,0,
                @actor.battler_name,
                @actor.battler_hue
              )

              @actor.name=name.strip

              [425,469,426,962,966,968].each_with_index do |v,i|
                $game_variables[v]=stats[i]
              end

              $game_variables[48]=sex

              $game_switches[70]=(kind=='힘기사')

              stage='GROWTH'

              @actor.sl44_record_growth

              stage='EQUIPMENT'

              SL411.starter(@actor,true)

              expected=form.end_with?('기사') ? 170 :
                (
                  form.end_with?('요정') ? 1000 :
                  (form.end_with?('법사') ? 1001 : 1002)
                )

              raise 'Starter weapon not equipped' unless
                @actor.weapon_id==expected

              @sl417_phase=:done

              $game_system.se_play($data_system.decision_se)

              $scene=Scene_Map.new

            rescue Exception=>e

              @sl417_phase=:failed

              puts(
                'SL417|FAIL|'+stage+'|'+
                e.class.to_s+'|'+e.message.to_s
              )

              puts(
                'SLRUNTIMEERR|'+
                e.class.to_s+'|'+e.message.to_s
              )
            end

            return
          end

          @edit_window.update
          SRC
            )
          end

          File.write(
            '/tmp/sl417-ui.json',
            JSON.generate({
              prompt:name_prompt,
              error:name_error
            })
          )

          edit.call(17) do |s|

            s=one(
              s,
              "    if @actor_id == 1\n      kind=0",
              "    if @actor_id == 1 && !@sl417_base_graphic\n      kind=0"
            )

            s=one(
              s,
              '      ow=@sl44_origin_wis ||= w',
              "      ow=@sl44_origin_wis ||= w\n      if @sl417_base_graphic\n        c=$game_variables[426].to_i\n        w=$game_variables[966].to_i\n      end"
            )

            s=one(
              s,
              '    @sl44_player_highest ||= @level if @actor_id == 1',
              '    @sl44_player_highest ||= @level if @actor_id == 1 && !@sl417_base_graphic'
            )

            s=one(
              s,
              '      if @actor_id == 1 && @level > @sl44_player_highest',
              '      if @actor_id == 1 && !@sl417_base_graphic && @level > @sl44_player_highest'
            )

            s=one(
              s,
              '    return $data_classes[@class_id].name',
              "    return @sl43_form if @sl417_base_graphic\n    return $data_classes[@class_id].name"
            )

            s=one(
              s,
              '    @character_name = character_name',
              "    character_name=@sl417_base_graphic if @sl417_base_graphic && ['knight_men','여기사'].include?(character_name)\n    @character_name = character_name"
            )

            s=one(
              s,
              '      dex=@sl43_stats[1]+@dex_plus',
              "      dex=@sl43_stats[1]+@dex_plus\n      dex=$game_variables[469]+$game_variables[961] if @sl417_base_graphic"
            )

            s=one(
              s,
              '      return pdef1+pdef2+pdef3+pdef4+pdef5+@level/div+bonus',
              "      n=pdef1+pdef2+pdef3+pdef4+pdef5+@level/div+bonus\n      n+=$game_variables[1080]+$game_variables[920] if @sl417_base_graphic\n      return n"
            )

            s=one(
              s,
              "      w=@sl43_stats[4]\n      b=if w<=14; 0",
              "      w=@sl43_stats[4]\n      w=$game_variables[966] if @sl417_base_graphic\n      b=if w<=14; 0"
            )

            s=one(
              s,
              "      mr=if @sl43_form.end_with?('기사');",
              "      w=@sl43_stats[4] if @sl417_base_graphic\n      mr=if @sl43_form.end_with?('기사');"
            )

            one(
              s,
              '      return mdef1+mdef2+mdef3+mdef4+mdef5+@level/2+mr+b',
              "      n=mdef1+mdef2+mdef3+mdef4+mdef5+@level/2+mr+b\n      if @sl417_base_graphic\n        n+=$game_variables[925]\n        $MDEF=n\n      end\n      return n"
            )
          end

          edit.call(12) do |s|

            one(
              s,
              '(@sl46_stats_ready ? 0 : $game_variables[169] + $game_variables[170] + $game_variables[171])',
              '(@sl46_stats_ready && !@sl417_base_graphic ? 0 : $game_variables[169] + $game_variables[170] + $game_variables[171])'
            )
          end

          edit.call(117) do |s|

            one(
              s,
              '$n = n unless @sl46_stats_ready',
              '$n = n unless @sl46_stats_ready && !@sl417_base_graphic'
            )
          end

          [34,98].each do |i|

            edit.call(i) do |s|

              a='actor.instance_variable_get(:@sl46_stats_ready)'

              ck(
                s.scan(a).size==(i==34 ? 2 : 5),
                'Stat display anchors'
              )

              s.gsub(
                a,
                '('+a+' && !actor.instance_variable_get(:@sl417_base_graphic))'
              )
            end
          end

          edit.call(26) do |s|

            ck(
              s.include?('def self.starter(a,initial=false)'),
              'Existing starter'
            )

            s=one(
              s,
              '    a.id==1 ? 3213 : FORMS[a.instance_variable_get(:@sl43_form).to_s]',
              '    a.id==1 && !a.instance_variable_get(:@sl417_base_graphic) ? 3213 : FORMS[a.instance_variable_get(:@sl43_form).to_s]'
            )

            one(
              s,
              "  def self.pc_motion\n    w=SL49.weapon($game_actors[1])",
              "  def self.pc_motion\n    a=$game_actors[1]\n    return motion(a) if a.instance_variable_get(:@sl417_base_graphic)\n    w=SL49.weapon(a)"
            )
          end

          edit.call(71) do |s|

            one(
              s,
              '    a.id==1 ? [$game_switches[70] ? 20 : 16,12] :',
              '    a.id==1 && !a.instance_variable_get(:@sl417_base_graphic) ? [$game_switches[70] ? 20 : 16,12] :'
            )
          end

          edit.call(24) do |s|

            one(
              s,
              '          @character_name = command.parameters[0]',
              "          @character_name = command.parameters[0]\n          if self.is_a?(Game_Player) && ['knight_men','여기사'].include?(@character_name)\n            @character_name=$game_actors[1].instance_variable_get(:@sl417_base_graphic) || @character_name\n          end"
            )
          end

          edit.call(28) do |s|

            one(
              s,
              "      if @character.character_name=='knight_men좌표'",
              <<~'SRC'.lines.map{|l|'      '+l}.join.chomp
          leader=$game_party.actors[0]

