
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R40
# BASE: successful V229R38 (not the broken R39), run 39366339881
# WALL FIX: remove original opaque wall pixels from base terrain; redraw the
# exact original wall pixels as independent foreground wall fragments.
# WALL alpha 255 normally, 128 when it overlaps a character/monster;
# CHARACTER opacity remains untouched. Never resample collision from image.
# SOURCE: actual Sanctuary V4.1 collision marks wall-base candidates ONLY.
# Protect ALL native map components, all events, and all portal areas before
# blocking a wall foundation: never disconnect an existing walk corridor.
# Sound: original BGM * 0.60; keep R38 silent blacksmith SE and unchanged BGS.
# File and workflow label stay identical to previous revisions except R40.
name: build-slknight-web.yml | V229R40 | Clean Native Events and 2x Terrain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: V229R40 Restore last verified R38 game, never reuse R39 renderer
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39366339881
          name: github-pages
          github-token: ${{ github.token }}
          path: r38

      - name: V229R40 Restore Sanctuary native source collision and terrain
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39100619927
          name: Sanctuary-TI-Dungeon-V4.1-Original-Terrain-Walk
          github-token: ${{ github.token }}
          path: original-ti

      - name: V229R40 Verify clean R38 and prepare bounded image processing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s r38/artifact.tar
          test -s original-ti/preview/terrain-walk-v4.1.html
          tar -xf r38/artifact.tar -C site
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site');g=root/'knight/gameasync'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          expected={
            'Data/Scripts.rxdata':'f249b698ae6d1c72535ae2b12559e8bb10494657febc67ba0b23195944f4f7d0',
            f'Data/{pre}Map045.rxdata':'d9dc66271e48f051b0d35a2dce109777a14fd396f87fcd7d0e76b044b482e3ba',
            f'Data/{pre}Map046.rxdata':'c3f4cee70c9aff3459245727ccd49403079caa959aeebf00cf9eed99fb852059',
          }
          for rel,digest in expected.items():assert sha(g/rel)==digest,rel
          for name in ('index.html','knight/index.html'):
              assert 'V229R38' in (root/name).read_text(encoding='utf-8'),name
          h=(root/'knight/index.html').read_text(encoding='utf-8')
          assert h.count("var gain=k==='BGS'?0.20:(k==='BGM'?0.40:1);")==1
          source={str(p.relative_to(root)):sha(p) for p in root.rglob('*') if p.is_file()}
          assert len(source)==5472,len(source)
          Path('build/r38-baseline.json').write_text(json.dumps(source,sort_keys=True),encoding='utf-8')
          print('PASS original R38: 5472 files, Baphomet and map unchanged, blacksmith files intact')
          PY_BASE
          if python3 -c 'import PIL,cv2,numpy' >/dev/null 2>&1; then
            echo python3 > build/r40-python.txt
          else
            python3 -m venv /tmp/slti-r40-venv
            /tmp/slti-r40-venv/bin/python -m pip install --disable-pip-version-check -q pillow opencv-python-headless
            echo /tmp/slti-r40-venv/bin/python > build/r40-python.txt
          fi

      - name: V229R40 Read original native RGSS passage and original events
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r40_export_maps.rb <<'R40_EXPORT'
          require 'json';require 'base64';require 'zlib'
          module RPG
           class Map;end;class MapInfo;end;class AudioFile;end;class Tileset;end
           class Event;class Page;class Condition;end;class Graphic;end;end;end
           class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          class Table
           def self._load(raw);obj=allocate;obj.instance_variable_set(:@raw,raw);obj;end
           def _dump(d=0);@raw;end
           def header;@raw.unpack('V5');end
           def [](x,y=0,z=0);_,w,h,depth,_=header;@raw.byteslice(20+2*(x+y*w+z*w*h),2).unpack1('v');end
          end
          class Tone;def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end;def _dump(d=0);@raw;end;end
          class Color<Tone;end
          D=ARGV.fetch(0)+'/knight/gameasync/Data/'
          PRE='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          get=->(o,s){o.instance_variable_get('@'+s)}
          sets=Marshal.load(File.binread(D+PRE+'Tilesets.rxdata'))
          result={}
          [45,46].each do |id|
           m=Marshal.load(File.binread(D+("%sMap%03d.rxdata"%[PRE,id])))
           w=get.call(m,'width');h=get.call(m,'height'); tiles=get.call(m,'data');flags=get.call(sets.fetch(get.call(m,'tileset_id')),'passages');walk=[]
           h.times{|y|w.times{|x|walk << ((flags[tiles[x,y,0]]&15)==0 ? 1:0)}}
           events=get.call(m,'events').transform_values do |e|
            {'name'=>get.call(e,'name').to_s.dup.force_encoding('UTF-8').scrub,'xy'=>[get.call(e,'x'),get.call(e,'y')]}
           end
           result[id.to_s]={'w'=>w,'h'=>h,'walk64'=>Base64.strict_encode64(Zlib::Deflate.deflate(walk.pack('C*'))),'events'=>events}
           puts "Map #{id}: #{w}x#{h}; existing walk #{walk.sum}, #{events.size} events"
          end
          File.write(ARGV.fetch(1),JSON.generate(result))
          R40_EXPORT
          ruby -c /tmp/r40_export_maps.rb
          ruby /tmp/r40_export_maps.rb site build/r40-native-original.json

      - name: V229R40 Separate wall faces from terrain and select safe wall-foot blocks
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r40_prepare.py <<'R40_PREPARE'
          """R40 native Sanctuary wall/floor separation and safe collision candidate selection.
          No image-color collision inference; the V4.1 native source collision drives both masks.
          """
          import sys, json, re, base64, zlib, hashlib, time
          from collections import deque
          from pathlib import Path
          import cv2
          cv2.setNumThreads(1)
          import numpy as np
          from PIL import Image, ImageDraw

          root=Path(sys.argv[1]); htmlpath=Path(sys.argv[2]); reportdir=Path(sys.argv[3]);reportdir.mkdir(parents=True,exist_ok=True)
          game=root/'knight/gameasync'
          html=htmlpath.read_text(encoding='utf-8')
          source=json.loads(re.search(r'<script id="data" type="application/json">(.*?)</script>',html,re.S).group(1))
          current=json.loads((reportdir/'r40-native-original.json').read_text(encoding='utf-8'))
          report={}; collision_report={}
          for floor,mid,b,cols,rows in [('1',45,762,9,5),('2',46,1146,11,6)]:
              s=source[floor]; m=current[str(mid)]; w,h=m['w'],m['h']; print("BEGIN MAP",mid,time.time(),flush=True)
              assert (w,h)==((288,144) if mid==45 else (336,168))
              walk=np.frombuffer(zlib.decompress(base64.b64decode(m['walk64'])),np.uint8).reshape(h,w).copy()
              raw=base64.b64decode(s['collisionBase64']);cw,ch=s['width'],s['height']
              solid=np.frombuffer(raw,np.uint8).reshape(ch,cw)
              wx0,wy0=s['originX'],s['originY']
              sx0=min(t['x'] for t in s['tiles']);sy0=min(t['y'] for t in s['tiles'])
              first=s['tiles'][0];name=Path(first['src']).stem
              bx=int(name[:4],16);by=int(name[4:8],16)
              srcwx=32704+(bx-32767)*64;srcwy=32704+(by-32767)*64
              a=first['x']-12*(srcwx+srcwy)
              check_b=first['y']+378-6*(srcwy-srcwx)
              assert (a,check_b,sx0,sy0)==(-783360,b,768,384)
              assert ((w*16+511)//512,(h*16+511)//512)==(cols,rows)
              front=Image.new('L',(w*16,h*16),0);draw=ImageDraw.Draw(front)
              base=Image.new('L',(w*16,h*16),0);basedraw=ImageDraw.Draw(base)
              edges=0
              for y in range(1,ch-1):
                  for x in range(1,cw-1):
                      if solid[y,x]!=0:continue
                      mx=a+12*(x+wx0+y+wy0)-sx0
                      my=b+6*((y+wy0)-(x+wx0))-sy0
                      if not(-60<mx<w*16+60 and -60<my<h*16+60):continue
                      for dx,dy in [(-1,0),(0,1),(1,0),(0,-1)]:
                          if solid[y+dy,x+dx]==0:continue
                          is_front=(dx==-1 or dy==1)
                          if dx==-1:p1,p2=(mx-12,my),(mx,my+6)
                          elif dy==1:p1,p2=(mx,my+6),(mx+12,my)
                          elif dx==1:p1,p2=(mx,my-6),(mx+12,my)
                          else:p1,p2=(mx-12,my),(mx,my-6)
                          # Preserve wall side volumes as separated graphic; back-facing
                          # coverage is deliberately thin to avoid drawing on open floors.
                          depth=27 if is_front else 7
                          draw.polygon([(p1[0],p1[1]-3),(p2[0],p2[1]-3),
                                        (p2[0],p2[1]+depth),(p1[0],p1[1]+depth)],fill=255)
                          # Only SOUTH-facing wall's foundation is a collision candidate.
                          if is_front:
                              basedraw.polygon([(p1[0],p1[1]-1),(p2[0],p2[1]-1),
                                                (p2[0],p2[1]+6),(p1[0],p1[1]+6)],fill=255)
                          edges+=1
              foot=np.asarray(base)
              protected=set();source_portals=[]
              for entry in m['events'].values():
                  ex,ey=entry['xy'];
                  for yy in range(max(0,ey-1),min(h,ey+2)):
                      for xx in range(max(0,ex-1),min(w,ex+2)):protected.add((xx,yy))
              for p in s['portals']:
                  worldx,worldy=p['x'],p['y']
                  px=round(2*(a+12*(worldx+worldy)-sx0)/32)
                  py=round(2*(b+6*(worldy-worldx)-sy0)/32)
                  source_portals.append([p['name'],px,py])
                  for yy in range(max(0,py-3),min(h,py+4)):
                      for xx in range(max(0,px-3),min(w,px+4)):protected.add((xx,yy))
              can=[]
              for y in range(h):
                  for x in range(w):
                      if not walk[y,x] or (x,y) in protected:continue
                      px=x*16+8;py=y*16+14
                      if foot[py,px]==0:continue
                      u=(px+sx0-a)/12.0;v=(py+sy0-b)/6.0
                      gx=round((u-v)/2)-wx0;gy=round((u+v)/2)-wy0
                      if 0<=gx<cw and 0<=gy<ch and solid[gy,gx]!=0:
                          can.append((x,y))
              # Original connected components: block only foundations that do NOT split one.
              labels={};components=[];q=deque()
              for y in range(h):
                  for x in range(w):
                      if not walk[y,x] or (x,y) in labels:continue
                      idx=len(components);nodes=[];labels[(x,y)]=idx;q.append((x,y))
                      while q:
                          xx,yy=q.popleft();nodes.append((xx,yy))
                          for nx,ny in ((xx-1,yy),(xx+1,yy),(xx,yy-1),(xx,yy+1)):
                              if 0<=nx<w and 0<=ny<h and walk[ny,nx] and (nx,ny) not in labels:
                                  labels[(nx,ny)]=idx;q.append((nx,ny))
                      components.append({'nodes':nodes,'root':nodes[0],'total':len(nodes),'removed':0})
              allowed=[]
              for x,y in sorted(can,key=lambda p:(p[1]//4,p[0]//4,p[1],p[0])):
                  cmp=components[labels[(x,y)]]
                  if cmp['total']-cmp['removed']<4:continue
                  walk[y,x]=0
                  anchor=cmp['root']
                  if not walk[anchor[1],anchor[0]]:
                      anchor=next(((xx,yy) for xx,yy in cmp['nodes'] if walk[yy,xx]),None)
                  if anchor is None:walk[y,x]=1;continue
                  reached={anchor};q.append(anchor)
                  while q:
                      xx,yy=q.popleft()
                      for nx,ny in ((xx-1,yy),(xx+1,yy),(xx,yy-1),(xx,yy+1)):
                          pt=(nx,ny)
                          if 0<=nx<w and 0<=ny<h and labels.get(pt)==labels[(x,y)] and walk[ny,nx] and pt not in reached:
                              reached.add(pt);q.append(pt)
                  if len(reached)==cmp['total']-cmp['removed']-1:
                      allowed.append([x,y]);cmp['removed']+=1;cmp['root']=anchor
                  else:walk[y,x]=1
              for evt in m['events'].values():
                  ex,ey=evt['xy'];assert walk[ey,ex]==1,(mid,evt)
              collision_report[str(mid)]={'width':w,'height':h,'candidates':len(can),
                  'newlyBlocked':len(allowed),'blockedCells':allowed,
                  'originalWalkable':int(np.count_nonzero(walk))+len(allowed),
                  'remainingWalkable':int(np.count_nonzero(walk)),
                  'originalComponentSizes':[v['total'] for v in components],
                  'retainedComponentSizes':[v['total']-v['removed'] for v in components],
                  'allOriginalEventsPassable':True,'sourcePortalsProtected':source_portals}
              print("COLLISION DONE",mid,time.time(),flush=True)
              wall_chunks={};wall_pixels=0
              for cy in range(rows):
                  for cx in range(cols):
                      mask=np.asarray(front.crop((cx*512,cy*512,(cx+1)*512,(cy+1)*512)),np.uint8).copy()
                      path=game/'Graphics/Panoramas'/f'SLTI_{mid}_C{cx}_{cy}.png'
                      with Image.open(path) as im:original=np.asarray(im.convert('RGBA'),np.uint8).copy()
                      mask[original[:,:,3]!=255]=0
                      n=int(np.count_nonzero(mask))
                      if n<200:continue
                      wall_pixels+=n
                      # Remove wall pixels from their original, fully opaque backdrop.
                      # Inpaint an approximate hidden floor, while storing 1:1 original
                      # wall pixels in the new independent foreground RGBA texture.
                      # Restore hidden floor from nearby unmasked pixels with normalized
                      # Gaussian convolution. Unlike iterative inpainting this is bounded
                      # and avoids pathological stalls on wide continuous stone walls.
                      low_rgb=cv2.resize(original[:,:,:3],(128,128),interpolation=cv2.INTER_AREA).astype(np.float32)
                      low_mask=cv2.resize(mask,(128,128),interpolation=cv2.INTER_NEAREST)
                      good=(low_mask==0).astype(np.float32)
                      count=float(good.sum())
                      if count<1:
                          restored=low_rgb
                      else:
                          numerator=cv2.GaussianBlur(low_rgb*good[:,:,None],(0,0),12.0)
                          denominator=cv2.GaussianBlur(good,(0,0),12.0)
                          average=(low_rgb*good[:,:,None]).sum(axis=(0,1))/count
                          restored=numerator/np.maximum(denominator[:,:,None],0.0001)
                          restored[denominator<0.0001]=average
                      restored=np.clip(restored,0,255).astype(np.uint8)
                      base_rgb=cv2.resize(restored,(512,512),interpolation=cv2.INTER_LINEAR)
                      new_back=original.copy();new_back[:,:,:3][mask>0]=base_rgb[mask>0]
                      new_wall=original.copy();new_wall[:,:,3]=np.minimum(mask,original[:,:,3])
                      # An opaque wall foreground must reconstruct the pre-patch image.
                      # This detects accidental repainting of normally-visible terrain.
                      full=Image.alpha_composite(Image.fromarray(new_back,'RGBA'),Image.fromarray(new_wall,'RGBA'))
                      assert np.array_equal(np.asarray(full)[:,:,0:3],original[:,:,0:3]),(mid,cx,cy)
                      Image.fromarray(new_back,'RGBA').save(path,optimize=True)
                      out=game/'Graphics/Panoramas'/f'SLTIW_{mid}_C{cx}_{cy}.png'
                      Image.fromarray(new_wall,'RGBA').save(out,optimize=True)
                      tiles=[]
                      for ty in range(16):
                          for tx in range(16):
                              part=mask[ty*32:(ty+1)*32,tx*32:(tx+1)*32]
                              ys,xs=np.nonzero(part)
                              if not len(xs):continue
                              # Local pixel bbox improves sprite/actor collision tests.
                              tiles.append([tx,ty,int(xs.min()),int(ys.min()),int(xs.max())+1,int(ys.max())+1])
                      wall_chunks[f'{cx},{cy}']=tiles
                      print("CHUNK",mid,cx,cy,"processed",time.time(),flush=True)
              assert len(wall_chunks)>=8,(mid,len(wall_chunks))
              report[str(mid)]={'sourceDims':[w*16,h*16],'wallEdgeCount':edges,
                  'wallChunkCount':len(wall_chunks),'wallPixelCount':wall_pixels,
                  'chunks':wall_chunks,'maskGraphicAlpha':'foreground; 255 normally, 128 on actor overlap',
                  'baseChunkSource':'bounded approximate hidden-floor recovery at original SLTI_ path'}
              print(f'Map{mid} / wall mask {len(wall_chunks)} chunks {wall_pixels} pixels; safe collision {len(allowed)}/{len(can)}; walk remains {int(np.count_nonzero(walk))}',flush=True)
          (reportdir/'r40-wall-tiles.json').write_text(json.dumps(report,separators=(',',':')),encoding='utf-8')
          (reportdir/'r40-collision.json').write_text(json.dumps(collision_report,separators=(',',':')),encoding='utf-8')
          R40_PREPARE
          PYTHON="$(cat build/r40-python.txt)"
          "$PYTHON" /tmp/r40_prepare.py site original-ti/preview/terrain-walk-v4.1.html build

      - name: V229R40 Patch original RGSS walls without disconnecting any native corridor
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r40_patch_maps.rb <<'R40_PATCH_MAPS'
          require 'json';require 'digest'
          module RPG
           class Map;end;class MapInfo;end;class AudioFile;end;class Tileset;end
           class Event;class Page;class Condition;end;class Graphic;end;end;end
           class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          class Table
           def self._load(raw);obj=allocate;obj.instance_variable_set(:@raw,raw);obj;end
           def _dump(d=0);@raw;end
           def header;@raw.unpack('V5');end
           def values;@raw.byteslice(20..-1).unpack('v*');end
           def self.map(w,h,v);raise 'Incorrect table size' unless v.length==w*h*3;_load([3,w,h,3,v.length].pack('V5')+v.pack('v*'));end
           def [](x,y=0,z=0);_,w,h,depth,_=header;return nil if x<0||y<0||x>=w||y>=h||z<0||z>=depth;@raw.byteslice(20+2*(x+y*w+z*w*h),2).unpack1('v');end
          end
          class Tone;def self._load(raw);obj=allocate;obj.instance_variable_set(:@raw,raw);obj;end;def _dump(d=0);@raw;end;end
          class Color<Tone;end
          root=ARGV.fetch(0);audit=JSON.parse(File.read(ARGV.fetch(1)))
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          data=root+'/knight/gameasync/Data/'
          get=->(obj,k){obj.instance_variable_get('@'+k)}
          set=->(obj,k,v){obj.instance_variable_set('@'+k,v)}
          sets=Marshal.load(File.binread(data+pre+'Tilesets.rxdata'))
          original_core=Digest::SHA256.file(data+'Scripts.rxdata').hexdigest
          reports={}
          [45,46].each do |mid|
           mpath=data+("%sMap%03d.rxdata"%[pre,mid]);before=File.binread(mpath);m=Marshal.load(before)
           w,h=get.call(m,'width'),get.call(m,'height')
           d=audit.fetch(mid.to_s)
           raise 'Original geometry changed' unless [w,h]==[d['width'],d['height']]
           grid=get.call(m,'data');raise 'Native map data corrupted' unless grid.header==[3,w,h,3,w*h*3]
           values=grid.values
           set_id=get.call(m,'tileset_id');flags=get.call(sets.fetch(set_id),'passages')
           raise 'Expected native collision-only passage flag' unless flags[384]==0 && (flags[385]&15)==15
           first_events=get.call(m,'events').transform_values{|e|Digest::SHA256.hexdigest(Marshal.dump(e))}
           d.fetch('blockedCells').each do |x,y|
            raise 'Cannot block event or unrelated area' unless values[y*w+x]==384
            values[y*w+x]=385
           end
           set.call(m,'data',Table.map(w,h,values))
           restored=Marshal.load(Marshal.dump(m))
           raise 'Native table failed marshal roundtrip' unless get.call(restored,'data').header==[3,w,h,3,w*h*3]
           events=get.call(restored,'events')
           raise 'Game event altered by collision patch' unless events.transform_values{|e|Digest::SHA256.hexdigest(Marshal.dump(e))}==first_events
           events.each{|eid,e|x,y=get.call(e,'x'),get.call(e,'y');raise "Event trapped #{mid}/#{eid}" unless values[y*w+x]==384}
           File.binwrite(mpath,Marshal.dump(restored))
           reports[mid.to_s]={blocked:d.fetch('blockedCells').length,oldMapSHA256:Digest::SHA256.hexdigest(before),newMapSHA256:Digest::SHA256.file(mpath).hexdigest}
           puts "Map#{mid}: exact original events and game logic retained, #{d.fetch('blockedCells').length} confirmed wall foundations blocked"
          end
          raise 'Original engine changed by collision patch' unless Digest::SHA256.file(data+'Scripts.rxdata').hexdigest==original_core
          File.write(ARGV.fetch(2),JSON.pretty_generate(reports))
          R40_PATCH_MAPS
          ruby -c /tmp/r40_patch_maps.rb
          ruby /tmp/r40_patch_maps.rb site build/r40-collision.json build/r40-map-patch.json

      - name: V229R40 Patch ONLY active script97 with true translucent WALL fragments
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r40_patch_renderer.rb <<'R40_PATCH_RENDER'
          require 'json';require 'zlib';require 'digest'
          root=ARGV.fetch(0);meta=JSON.parse(File.read(ARGV.fetch(1)))
          path=root+'/knight/gameasync/Data/Scripts.rxdata'
          raw=File.binread(path);scripts=Marshal.load(raw)
          raise 'Original renderer script index changed' unless scripts[97][1].dup.force_encoding('UTF-8')=='해상도'
          code=Zlib::Inflate.inflate(scripts[97][2])
          raise 'R39 unwanted overlay still exists: start from R38' if code.include?('slti_update_occlusion')
          raise 'R38 terrain must be active' unless code.include?('slti_update_terrain if @slti_floor')
          init_anchor='    @slti_rows = @slti_floor == 45 ? 5 : (@slti_floor == 46 ? 6 : 0)'
          update_anchor="    for sprite in @character_sprites\n      sprite.update\n    end"
          dispose_anchor='    @panorama.dispose'
          [init_anchor,update_anchor,dispose_anchor].each{|tag|raise "Missing or duplicate anchor #{tag}" unless code.scan(tag).length==1}
          # Small 32x32 source masks permit selective per-wall opacity while leaving
          # nearby WALL pieces completely opaque (and actors completely unaffected).
          chunks=meta.keys.sort.map do |key|
           inner=meta.fetch(key).fetch('chunks').map do |coord,rects|
            x,y=coord.split(',').map(&:to_i)
            '['+x.to_s+','+y.to_s+']=>['+rects.map{|a|'['+a.map(&:to_i).join(',')+']'}.join(',')+']'
           end.join(',')
           key.to_i.to_s+'=>{'+inner+'}'
          end.join(',')
          setup=%Q{
              # V229R40: independent foreground graphic fragments; the original wall
              # pixels have been REMOVED from the base PNGs first.
              @slti_wall_chunks = {}
              @slti_wall_bitmaps = {}
              @slti_wall_sprites = {}
              @slti_wall_failed = false
              if @slti_floor
                @slti_wall_chunks = {#{chunks}}.fetch(@slti_floor,{})
              end
          }
          code=code.sub(init_anchor,init_anchor+setup)
          code=code.sub(update_anchor,update_anchor+"\n    slti_update_wall_faces if @slti_floor")
          cleanup=%q{
              # Fragments share a bitmap per visible source 512px chunk.
              if @slti_wall_sprites
                @slti_wall_sprites.each_value do |sp|
                  sp.bitmap = nil
                  sp.dispose
                end
                @slti_wall_sprites.clear
              end
              if @slti_wall_bitmaps
                @slti_wall_bitmaps.each_value do |bmp|
                  bmp.dispose if bmp != nil && !bmp.disposed?
                end
                @slti_wall_bitmaps.clear
              end
          }
          code=code.sub(dispose_anchor,cleanup+dispose_anchor)
          method=%q{
            # V229R40 layered walls: base image lacks the selected wall-face pixels;
            # 32px-source fragments reconstruct original 255-alpha walls above the floor.
            # Overlapping CHARACTER => opacity of WALL fragment 128, not character.
            # Never instantiate more than one image decode and 24 sprites per frame.
            def slti_update_wall_faces
              return if @slti_wall_failed
              camera_x = [$game_map.display_x.to_i / 4, 0].max
              camera_y = [$game_map.display_y.to_i / 4, 0].max
              viewport_w = @viewport2.rect.width
              viewport_h = @viewport2.rect.height
              needed = {}
              chunks_used = {}
              decoded = 0
              created = 0
              @slti_wall_chunks.each do |chunk,parts|
                cx,cy = chunk
                bx = cx * 1024 - camera_x
                by = cy * 1024 - camera_y
                next if bx >= viewport_w || by >= viewport_h || bx + 1024 <= 0 || by + 1024 <= 0
                bitmap = @slti_wall_bitmaps[chunk]
                if bitmap == nil
                  next if decoded >= 1
                  begin
                    bitmap = Bitmap.new("Graphics/Panoramas/SLTIW_#{@slti_floor}_C#{cx}_#{cy}")
                    @slti_wall_bitmaps[chunk] = bitmap
                    decoded += 1
                  rescue StandardError => error
                    p "SLTI WALL LOAD ERROR: #{error}"
                    @slti_wall_failed = true
                    return
                  end
                end
                chunks_used[chunk] = true
                parts.each do |record|
                  tx,ty,lx,ly,rx,ry = record
                  px = bx + tx * 64
                  py = by + ty * 64
                  next if px >= viewport_w || py >= viewport_h || px+64 <= 0 || py+64 <= 0
                  key = [cx,cy,tx,ty]
                  needed[key] = true
                  sprite = @slti_wall_sprites[key]
                  if sprite == nil
                    next if created >= 24
                    sprite = Sprite.new(@viewport2)
                    sprite.bitmap = bitmap
                    sprite.zoom_x = 2.0
                    sprite.zoom_y = 2.0
                    sprite.src_rect.set(tx*32,ty*32,32,32)
                    @slti_wall_sprites[key] = sprite
                    created += 1
                  end
                  sprite.x = px
                  sprite.y = py
                  # Pixel-accurate wall fragment bbox, not a broad event/camera rectangle.
                  fl = px+lx*2
                  ft = py+ly*2
                  fr = px+rx*2
                  fb = py+ry*2
                  blocker = nil
                  @character_sprites.each do |actor|
                    next if actor == nil || actor.disposed? || actor.bitmap == nil
                    next unless actor.visible && actor.opacity > 0
                    rect = actor.src_rect
                    next if rect == nil || rect.width <= 0 || rect.height <= 0
                    azx = actor.zoom_x
                    azy = actor.zoom_y
                    next if azx <= 0 || azy <= 0
                    al = actor.x - actor.ox*azx
                    at = actor.y - actor.oy*azy
                    ar = al + rect.width*azx
                    ab = at + rect.height*azy
                    if al < fr && ar > fl && at < fb && ab > ft
                      blocker = actor
                      break
                    end
                  end
                  if blocker
                    sprite.z = blocker.z + 1
                    sprite.opacity = 128
                  else
                    # Floor/backdrop is at -1500. Opaque wall is behind character.
                    sprite.z = -1200
                    sprite.opacity = 255
                  end
                end
              end
              @slti_wall_sprites.keys.each do |key|
                next if needed[key]
                sprite = @slti_wall_sprites.delete(key)
                sprite.bitmap = nil
                sprite.dispose
              end
              @slti_wall_bitmaps.keys.each do |key|
                next if chunks_used[key]
                bitmap = @slti_wall_bitmaps.delete(key)
                bitmap.dispose if bitmap != nil && !bitmap.disposed?
              end
            end
          }
          raise 'Unexpected script97 ending' unless code.rstrip.end_with?('end')
          code=code.rstrip.sub(/end\z/,method+"\nend\n")
          scripts[97][2]=Zlib::Deflate.deflate(code)
          File.binwrite(path,Marshal.dump(scripts))
          again=Marshal.load(File.binread(path));before=Marshal.load(raw)
          raise 'Unapproved engine scripts modified' unless before.each_index.all?{|i|i==97 || before[i]==again[i]}
          raise 'Actual renderer was not patched' if before[97]==again[97]
          raise 'Movement script changed' unless before[21]==again[21] && before[27]==again[27]
          File.write(ARGV.fetch(2),code)
          puts "PASS: script97 layered walls, wall fades 128/255; character opacity unchanged, 1 decode & 24 new sprites/frame"
          R40_PATCH_RENDER
          ruby -c /tmp/r40_patch_renderer.rb
          ruby /tmp/r40_patch_renderer.rb site build/r40-wall-tiles.json build/Spriteset_Map_V229R40.rb
          ruby -c build/Spriteset_Map_V229R40.rb

      - name: V229R40 Register split wall assets, refresh map/hash and BGM to 60 percent
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r40_register.py <<'R40_REGISTER'
          """Register R40's repaired base PNGs and newly separated wall foregrounds."""
          import sys,re,hashlib,json
          from pathlib import Path
          root=Path(sys.argv[1]);build=Path(sys.argv[2]);g=root/'knight/gameasync';wall=json.loads((build/'r40-wall-tiles.json').read_text(encoding='utf-8'))
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          changed=['Data/Scripts.rxdata']+[f'Data/{pre}Map{m:03}.rxdata' for m in (45,46)]
          add=[]
          for mid in ('45','46'):
              wallfiles=[]
              for tile in wall[mid]['chunks']:
                  x,y=map(int,tile.split(','))
                  original=f'Graphics/Panoramas/SLTI_{mid}_C{x}_{y}.png'
                  fname=f'Graphics/Panoramas/SLTIW_{mid}_C{x}_{y}.png'
                  assert (g/original).is_file() and (g/fname).is_file()
                  changed.append(original)
                  add.append(fname)
                  wallfiles.append(fname)
              manifest=root/'knight/preload/Data'/f'{pre}Map{int(mid):03}.rxdata.json'
              existing=json.loads(manifest.read_text(encoding='utf-8'))
              assert len(existing)==(45 if mid=='45' else 66)
              assert all(x.startswith('Graphics/Panoramas/SLTI_') for x in existing)
              assert len(existing+wallfiles)==len(set(existing+wallfiles))
              manifest.write_text(json.dumps(existing+wallfiles,separators=(',',':'))+'\n',encoding='utf-8')
          mapping=g/'mapping.js';s=mapping.read_text(encoding='utf-8')
          for rel in changed:
              digest=hashlib.md5((g/rel).read_bytes()).hexdigest()
              s,n=re.subn(re.escape(rel+'?h=')+r'[0-9a-f]{32}',lambda _:rel+'?h='+digest,s)
              assert n==1,(rel,n)
          new=[]
          for rel in add:
              key=rel.rsplit('.',1)[0].lower();digest=hashlib.md5((g/rel).read_bytes()).hexdigest()
              assert '["'+key+'",' not in s,(rel,'duplicate')
              new.append('['+json.dumps(key)+', '+json.dumps(rel+'?h='+digest)+'],\n')
          assert s.count('\n];\n\nvar mapping')==1
          s=s.replace('\n];\n\nvar mapping','\n'+''.join(new)+'];\n\nvar mapping',1)
          mapping.write_text(s,encoding='utf-8')
          for rel in ('index.html','knight/index.html'):
              p=root/rel;t=p.read_text(encoding='utf-8')
              assert 'V229R38' in t
              if rel=='knight/index.html':
                  old="var gain=k==='BGS'?0.20:(k==='BGM'?0.40:1);"
                  newgain="var gain=k==='BGS'?0.20:(k==='BGM'?0.60:1);"
                  assert t.count(old)==1
                  t=t.replace(old,newgain)
              p.write_text(t.replace('V229R38','V229R40').replace('v229r38','v229r40'),encoding='utf-8')
          (build/'r40-changed-file-list.json').write_text(json.dumps({'changed':changed,'added':add},ensure_ascii=False,indent=2))
          print('PASS R40: BGM 60%;',len(changed),'existing mapped assets changed,',len(add),'wall layers newly mapped; existing URLs & loader maintained')
          R40_REGISTER
          python3 /tmp/r40_register.py site build
          node --check site/knight/gameasync/mapping.js

      - name: V229R40 Run original native four-direction collision and connectedness tests
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r40_verify_maps.rb <<'R40_VERIFY_NATIVE'
          require 'json';require 'zlib';require 'digest'
          module RPG
           class Map;end;class MapInfo;end;class AudioFile;end;class Tileset;end
           class Event;class Page;class Condition;end;class Graphic;end;end;end
           class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          class Table
           def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
           def _dump(d=0);@raw;end
           def header;@raw.unpack('V5');end
           def [](x,y=0,z=0);_,w,h,depth,_=header;return nil if x<0 || y<0 || x>=w || y>=h || z<0 || z>=depth;@raw.byteslice(20+2*(x+y*w+z*w*h),2).unpack1('v');end
          end
          class Tone;def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end;def _dump(d=0);@raw;end;end
          class Color<Tone;end
          root=ARGV.fetch(0);audit=JSON.parse(File.read(ARGV.fetch(1)))
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO';dir=root+'/knight/gameasync/Data/'
          get=->(o,k){o.instance_variable_get('@'+k)}
          sets=Marshal.load(File.binread(dir+pre+'Tilesets.rxdata'))
          scripts=Marshal.load(File.binread(dir+'Scripts.rxdata'))
          eval(Zlib::Inflate.inflate(scripts[21][2]),TOPLEVEL_BINDING,'Original_Game_Map')
          class RPG::Map;attr_reader :width,:height,:data;end
          [45,46].each do |mid|
           d=audit.fetch(mid.to_s)
           map=Marshal.load(File.binread(dir+("%sMap%03d.rxdata"%[pre,mid])))
           w,h=get.call(map,'width'),get.call(map,'height')
           raise 'Geometry differs' unless [w,h]==[d['width'],d['height']]
           tab=get.call(map,'data')
           set=sets.fetch(get.call(map,'tileset_id'))
           passages=get.call(set,'passages');prior=get.call(set,'priorities')
           raise 'Blank upper layer differs' unless prior[0]==5
           native=Game_Map.allocate
           native.instance_variable_set(:@map,map)
           native.instance_variable_set(:@passages,passages)
           native.instance_variable_set(:@priorities,prior)
           native.instance_variable_set(:@events,{})
           blocked=d.fetch('blockedCells')
           blocked.each do |x,y|
            raise 'Missing block flag' unless tab[x,y,0]==385
            [2,4,6,8].each{|dir|raise "Native wall block is walkable #{mid}/#{x}/#{y}/#{dir}" if native.passable?(x,y,dir)}
           end
           remaining=(0...h).sum{|y|(0...w).count{|x|tab[x,y,0]==384}}
           raise 'Wrong walkable count' unless remaining==d.fetch('remainingWalkable')
           comps=[];seen={};q=[]
           h.times do |y|
            w.times do |x|
             next unless tab[x,y,0]==384 && !seen[[x,y]]
             q=[[x,y]];seen[[x,y]]=true;index=0
             while index<q.size
              u,v=q[index];index+=1
              [[u-1,v],[u+1,v],[u,v-1],[u,v+1]].each do |xx,yy|
               pt=[xx,yy]
               next if xx<0 || yy<0 || xx>=w || yy>=h || seen[pt] || tab[xx,yy,0]!=384
               seen[pt]=true;q<<pt
              end
             end
             comps<<q.size
            end
           end
           raise 'Native components changed' unless comps.sort==d.fetch('retainedComponentSizes').sort
           get.call(map,'events').each do |eid,event|
            x,y=get.call(event,'x'),get.call(event,'y')
            raise "Event blocked #{mid}/#{eid}" unless tab[x,y,0]==384
           end
           if mid==46
            b=get.call(map,'events').fetch(13)
            raise 'Baphomet removed' unless get.call(b,'name').to_s.dup.force_encoding('UTF-8').include?('바포메트') && [get.call(b,'x'),get.call(b,'y')]==[156,100]
           end
           puts "PASS native Map#{mid}: #{blocked.size} new wall foundation blocks; #{comps.size} original components retained, all monster/events walkable"
          end
          R40_VERIFY_NATIVE
          ruby -c /tmp/r40_verify_maps.rb
          ruby /tmp/r40_verify_maps.rb site build/r40-collision.json | tee build/r40-native-map-verify.txt

      - name: V229R40 Test WALL opacity not ACTOR, fragment limit and memory disposal
        shell: bash
        run: |
          set -euo pipefail
