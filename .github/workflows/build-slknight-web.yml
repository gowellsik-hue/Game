name: Deploy SLKnight V14.3z10.6e + SLFairy TRANSFORM PRELOAD YAML FIX

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  Z105_SHA: e19659507b466b87a671949532b02484bc1faaef
  Z104_SHA: e044e1b6c53646b4c4f21f2dfee4967a68fabbc4
  DUAL_BASE_SHA: 04ce66ec99abc10f77143de53650685db8949532
  CURRENT_Z10_SHA: f545634bafbe1e1e55aaf6489126ad17b07da382
  BASELINE_SHA: c6815cd461dba60ec131898e6d5dd8690dd915ae
  X2_SHA: 6d941bd643dda87b8267ba466e108d1904c22331
  Z1_SHA: 008b6abe81074b7af877806b45f2314004a74f66
  Z3_SHA: 5a46988b048764e8a99700998c1f4ab96a3ec5c1
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  FAIRY_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLFairy_Source_v1.zip
  FAIRY_SHA256: 67b88b5fe0cde3c9f2fada889815f9aa7d0fc94b378025529e9950d55151c70e
  FAIRY_7Z_PASSWORD: http://nemo838.tistory.com/
  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout z10.5 source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z105_SHA }}
          path: z105src

      - name: Checkout z10.4 source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z104_SHA }}
          path: z104src

      - name: Checkout dual base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.DUAL_BASE_SHA }}
          path: dualbase

      - name: Checkout z10 source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.CURRENT_Z10_SHA }}
          path: z10src

      - name: Checkout V14.3l baseline
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.BASELINE_SHA }}
          path: baseline

      - name: Checkout V14.3x2 auto base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.X2_SHA }}
          path: x2

      - name: Checkout V14.3z1 monster base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z1_SHA }}
          path: z1

      - name: Checkout V14.3z3 monster base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z3_SHA }}
          path: z3

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake cmake curl ffmpeg freepats git imagemagick libtool make mm-common patch pkg-config python3 rake ruby timidity unzip wget xz-utils fonts-nanum p7zip-full nodejs

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.MKXP_SRC_REF }}
          path: engine

      - name: Cache engine dependencies
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-${{ runner.os }}-${{ env.EMSDK_VER }}-onig25b

      - name: Extract stable preparation scripts
        run: |
          set -euo pipefail
          ruby -ryaml - <<'RB'
          doc=YAML.load_file('z105src/.github/workflows/build-slknight-web.yml')
          steps=doc.fetch('jobs').fetch('build').fetch('steps')

          wanted=[
            ['Extract already-passed z10.4 build steps','/tmp/prep_00.sh'],
            ['Run frozen successful build through repaired Fairy mappings','/tmp/prep_01.sh'],
            ['Canonicalize SLFairy protected data paths and title','/tmp/prep_02.sh'],
            ['Rebuild SLFairy mappings after canonicalization','/tmp/prep_03.sh'],
            ['Finalize browser boot bridge and cache isolation','/tmp/prep_04.sh']
          ]

          wanted.each do |name,path|
            step=steps.find{|s|s['name']==name}
            abort "MISSING PREP STEP: #{name}" unless step&&step['run']
            File.write(path,step['run'])
          end

          puts 'PREP_EXTRACT_OK'
          RB

      - name: Build Knight and prepare Fairy
        run: |
          set -euo pipefail
          for i in 0 1 2 3 4; do
            bash -e "$(printf '/tmp/prep_%02d.sh' "$i")"
          done
          echo PREP_BUILD_OK

      - name: Patch Fairy boot once
        run: |
          set -euo pipefail

          ruby -EUTF-8:UTF-8 -rzlib - fairy_player/gameasync/Data/Scripts.rxdata <<'RB'
          path=ARGV.fetch(0)
          scripts=Marshal.load(File.binread(path))

          def inflate(e)
            Zlib::Inflate.inflate(e[2]).force_encoding(Encoding::UTF_8)
          end

          def store(e,s)
            e[2]=Zlib::Deflate.deflate(s)
          end

          equip=scripts.find do |e|
            e.is_a?(Array)&&e.length>=3&&e[1].to_s=='Scene_Equip'
          end
          abort 'Scene_Equip missing' unless equip

          text=inflate(equip)
          rx=/    Graphics\.transition\r?\n.*?    loop do\r?\n.*?    @item_window5\.dispose\r?\n  end/m
          abort "Scene_Equip lifecycle=#{text.scan(rx).size}" unless text.scan(rx).size==1

          replacement=%q~    Graphics.transition
            end
            def dispose
              $game_switches[49] = false if $game_switches
              Graphics.freeze
              @help_window.dispose if @help_window != nil
              @left_window.dispose if @left_window != nil
              @right_window.dispose if @right_window != nil
              @item_window1.dispose if @item_window1 != nil
              @item_window2.dispose if @item_window2 != nil
              @item_window3.dispose if @item_window3 != nil
              @item_window4.dispose if @item_window4 != nil
              @item_window5.dispose if @item_window5 != nil
            end~
          replacement.gsub!(/^            /,'')
          text.sub!(rx,replacement)
          store(equip,text)

          sprite_entry=scripts.find do |e|
            e.is_a?(Array) &&
              e.length>=3 &&
              ((inflate(e).include?('class Sprite_Character < Sprite_Character')) rescue false)
          end

          output_entry=scripts.find do |e|
            next false unless e.is_a?(Array)&&e.length>=3

            begin
              s=inflate(e)
              s.include?('class Game_Event < Game_Event') &&
                s.include?('class Game_Player < Game_Player')
            rescue
              false
            end
          end

          abort 'broken Sprite_Character script missing' unless sprite_entry
          abort 'broken Game_Event script missing' unless output_entry

          id_sprite=%q~class Game_Character
            attr_accessor :sprite_id
          end

          class Sprite_Character
            alias sl_id_original_update update

            def create_id_sprite(text)
              bitmap=Bitmap.new(160,16)
              bitmap.font.name='NanumGothic'
              bitmap.font.size=12
              bitmap.font.bold=false
              bitmap.font.color.set(0,0,0)
              bitmap.draw_text(0,-1,160,16,text,1)
              bitmap.draw_text(0,1,160,16,text,1)
              bitmap.draw_text(-1,0,160,16,text,1)
              bitmap.draw_text(1,0,160,16,text,1)
              bitmap.font.color.set(255,255,255)
              bitmap.draw_text(0,0,160,16,text,1)

              @_id_sprite=Sprite.new(self.viewport)
              @_id_sprite.bitmap=bitmap
              @_id_sprite.opacity=255
              @_id_sprite.ox=80
              @_id_sprite.oy=14
              @_id_sprite.x=self.x
              @_id_sprite.y=self.y-self.oy/2
              @_id_sprite.z=9999
              @_id_sprite_visible=true
            end

            def dispose_id_sprite
              if @_id_sprite!=nil
                if @_id_sprite.bitmap!=nil&&!@_id_sprite.bitmap.disposed?
                  @_id_sprite.bitmap.dispose
                end

                @_id_sprite.dispose
                @_id_sprite=nil
              end

              @_id_sprite_visible=false
            end

            def update_id_sprite
              if @character.sprite_id!=nil&&@character.sprite_id.to_s!=''
                create_id_sprite(@character.sprite_id) unless @_id_sprite_visible
                @_id_sprite.x=self.x
                @_id_sprite.y=self.y-self.oy
              elsif @_id_sprite_visible
                dispose_id_sprite
              end
            end

            def update
              sl_id_original_update
              update_id_sprite
            end
          end~
          id_sprite.gsub!(/^          /,'')

          id_output=%q~class Game_Event
            alias sl_id_original_event_refresh refresh

            def refresh
              sl_id_original_event_refresh
              text=@event.name.dup
              text.gsub!(/\x5b[Ii][Dd](.+?)\x5d/){@sprite_id=$1}
              @sprite_id=nil if @erased||@character_name==''
            end
          end

          class Game_Player
            alias sl_id_original_player_refresh refresh

            def refresh
              sl_id_original_player_refresh
              @sprite_id=nil if $game_party.actors.size>0
            end
          end~
          id_output.gsub!(/^          /,'')

          store(sprite_entry,id_sprite)
          store(output_entry,id_output)

          resolutions=scripts.select do |e|
            e.is_a?(Array) &&
              e.length>=3 &&
              e[1].to_s.start_with?('Web Resolution')
          end

          abort "Web Resolution count=#{resolutions.size}" unless resolutions.size==1

          resolution=resolutions.first
          resolution[1]='Web Resolution 640x480'

          resolution_code=%q~$WINDOW_WIDTH = 640
          $WINDOW_HEIGHT = 480

          begin
            Graphics.resize_screen(640,480)
          rescue
          end~
          resolution_code.gsub!(/^          /,'')
          store(resolution,resolution_code)

          File.binwrite(path,Marshal.dump(scripts))

          scripts.each_with_index do |e,i|
            next unless e.is_a?(Array)&&e.length>=3

            begin
              code=inflate(e)
            rescue
              next
            end

            RubyVM::InstructionSequence.compile(
              code,
              "fairy_#{i}_#{e[1]}"
            )
          end

          puts 'FAIRY_BOOT_640_PATCH_OK'
          RB

      - name: Rebuild mapping and preload transforms
        run: |
          set -euo pipefail

          ruby -EUTF-8:UTF-8 -rjson - player/gameasync fairy_player/gameasync <<'RB'
          class RawMarshalObject
            def self._load(data)
              o=allocate
              o.instance_variable_set(:@raw,data)
              o
            end

            def _dump(_depth)
              @raw
            end
          end

          class Tone < RawMarshalObject; end
          class Color < RawMarshalObject; end
          class Rect < RawMarshalObject; end
          class Table < RawMarshalObject; end

          module RPG
            class AudioFile; end

            class Animation
              class Frame; end
              class Timing; end
            end

            class Map; end
            class CommonEvent; end

            class Event
              class Page
                class Condition; end
                class Graphic; end
              end
            end

            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
          end

          def iv(o,n)
            o.instance_variable_get("@#{n}")
          end

          def transform_names(game)
            cp=Dir.glob(
              File.join(game,'Data','*CommonEvents.rxdata')
            ).max_by{|p|File.size(p)}

            abort "CommonEvents missing: #{game}" unless cp&&File.size(cp)>1000

            ce=Marshal.load(File.binread(cp))
            names=[]

            [6,17,34].each do |id|
              event=ce[id]
              next unless event

              (iv(event,:list)||[]).each do |cmd|
                next unless iv(cmd,:code)==209

                params=iv(cmd,:parameters)||[]
                route=params[1]
                next unless route

                (iv(route,:list)||[]).each do |move|
                  next unless iv(move,:code)==41

                  p=iv(move,:parameters)||[]
                  name=p[0].to_s
                  names << name unless name.empty?
                end
              end
            end

            names=names.uniq.sort

            abort "No transform graphics found: #{game}" if names.empty?

            names.each do |name|
              file=File.join(
                game,
                'Graphics',
                'Characters',
                "#{name}.png"
              )

              abort "Missing transform graphic: #{file}" unless File.size?(file)
            end

            names
          end

          knight=transform_names(ARGV.fetch(0))
          fairy=transform_names(ARGV.fetch(1))

          File.write(
            '/tmp/knight_transform.json',
            JSON.generate(knight)
          )

          File.write(
            '/tmp/fairy_transform.json',
            JSON.generate(fairy)
          )

          puts "KNIGHT_TRANSFORMS=#{knight.join(',')}"
          puts "FAIRY_TRANSFORMS=#{fairy.join(',')}"
          RB

          (
            cd fairy_player/gameasync
            bash "$GITHUB_WORKSPACE/engine/extra/make_mapping.sh"
          )

          python3 - <<'PY'
          from pathlib import Path
          import json

          configs=[
              (
                  Path('player/index.html'),
                  json.loads(
                      Path('/tmp/knight_transform.json').read_text()
                  ),
                  'v143z106eknight',
                  'slknight_v106e_engine',
                  'SLKnight V14.3z10.6e'
              ),
              (
                  Path('fairy_player/index.html'),
                  json.loads(
                      Path('/tmp/fairy_transform.json').read_text()
                  ),
                  'v143z106eelf',
                  'slfairy_v106e_engine',
                  'SLFairy V14.3z10.6e'
              )
          ]

          def remove_legacy_touch(s,name):
              start="        if (!is_touch_device()) {"
              end="        resize();"

              if s.count(start)!=1:
                  raise SystemExit(
                      f'LEGACY TOUCH START {name} count={s.count(start)}'
                  )

              a=s.index(start)
              b=s.index(end,a)+len(end)
              s=s[:a]+s[b:]

              if 'is_touch_device()' in s:
                  raise SystemExit(
                      f'is_touch_device remains in {name}'
                  )

              if "bindKey('d-up'" in s:
                  raise SystemExit(
                      f'legacy bindKey remains in {name}'
                  )

              return s

          def inject_transform_preload(s,names,cache_tag,name):
              marker="}],\n            postRun:"

              if s.count(marker)!=1:
                  raise SystemExit(
                      f'PRE-RUN END {name} count={s.count(marker)}'
                  )

              js_names=json.dumps(
                  names,
                  ensure_ascii=False,
                  separators=(',',':')
              )

              block=f"""
            var slTransformSheets={js_names};
            slTransformSheets.forEach(function(name){{
              var file=name+'.png';
              var p='/game/Graphics/Characters/'+file;

              try{{
                if(FS.analyzePath(p).exists)FS.unlink(p);
              }}catch(e){{}}

              FS.createPreloadedFile(
                '/game/Graphics/Characters',
                file,
                encodeURI(
                  'gameasync/Graphics/Characters/'+
                  file+
                  '?v={cache_tag}'
                ),
                true,
                true,
                function(){{}},
                function(){{
                  console.error(
                    'SLTRANSFORMERR|'+file
                  );
                }}
              );
            }});
          """

              return s.replace(
                  marker,
                  block+marker,
                  1
              )

          for path,names,cache_tag,namespace,title in configs:
              s=path.read_text()

              s=remove_legacy_touch(
                  s,
                  str(path)
              )

              s=s.replace(
                  'position:fixed;left:8px;top:8px;',
                  'position:fixed;left:8px;bottom:8px;'
              )

              if path.as_posix().startswith('player/'):
                  s=s.replace(
                      'slknight_v14_engine',
                      namespace
                  )

                  s=s.replace(
                      'SLKnight V14.3z100',
                      title
                  )

                  s=s.replace(
                      'v143z100',
                      cache_tag
                  )

              else:
                  s=s.replace(
                      'slfairy_v105_engine',
                      namespace
                  )

                  s=s.replace(
                      'SLFairy V14.3z10.5',
                      title
                  )

                  s=s.replace(
                      'v143z105elf',
                      cache_tag
                  )

              s=inject_transform_preload(
                  s,
                  names,
                  cache_tag,
                  str(path)
              )

              path.write_text(s)

          p=Path('fairy_player/index.html')
          s=p.read_text()

          old_bridge="""  var log=console.log.bind(console);
            console.log=function(){
              var a=[].slice.call(arguments),t=a.join(' ');
              try{marker(t);}catch(e){log('SLAUDIOJSERR|'+e);}
              if(/SLRUNTIMEERR|SLSCRIPTERR/.test(t))err(t);
              log.apply(console,a);
            };
            window.addEventListener('error',function(e){err('JS ERROR | '+e.message);});"""

          old_bridge=old_bridge.replace(
              '            ',
              ''
          )

          new_bridge="""  function report(t){
            t=String(t||'');
            if(/SLRUNTIMEERR|SLSCRIPTERR|Message:|NO SUCH FILE|PHYSFS ERROR|Skipping loading| - err(?:$|\\s)|SLFONTERR|SLAUDIOJSERR|SLTRANSFORMERR/i.test(t))err(t);
          }
          var log=console.log.bind(console),elog=console.error.bind(console);
          console.log=function(){
            var a=[].slice.call(arguments),t=a.join(' ');
            try{
              marker(t);
            }catch(e){
              report('SLAUDIOJSERR|'+e);
              log('SLAUDIOJSERR|'+e);
            }
            report(t);
            log.apply(console,a);
          };
          console.error=function(){
            var a=[].slice.call(arguments),t=a.join(' ');
            report(t);
            elog.apply(console,a);
          };
          window.addEventListener('error',function(e){
            err('JS ERROR | '+e.message);
          });
          window.addEventListener('unhandledrejection',function(e){
            var r=e&&e.reason;
            err(
              'PROMISE ERROR | '+
              (r&&r.message?r.message:String(r))
            );
          });"""

          new_bridge=new_bridge.replace(
              '          ',
              ''
          )

          if s.count(old_bridge)!=1:
              raise SystemExit(
                  f'FAIRY ERROR BRIDGE count={s.count(old_bridge)}'
              )

          p.write_text(
              s.replace(
                  old_bridge,
                  new_bridge,
                  1
              )
          )

          print('TRANSFORM_PRELOAD_BROWSER_OK')
          PY

          grep -Fq 'slknight_v106e_engine' player/index.html
          grep -Fq 'SLKnight V14.3z10.6e' player/index.html
          grep -Fq 'v143z106eknight' player/index.html
          grep -Fq 'var slTransformSheets=' player/index.html
          grep -Fq 'SLTRANSFORMERR' player/index.html

          grep -Fq 'slfairy_v106e_engine' fairy_player/index.html
          grep -Fq 'SLFairy V14.3z10.6e' fairy_player/index.html
          grep -Fq 'v143z106eelf' fairy_player/index.html
          grep -Fq 'var slTransformSheets=' fairy_player/index.html
          grep -Fq 'SLTRANSFORMERR' fairy_player/index.html

      - name: Build dual site
        run: |
          set -euo pipefail

          rm -rf site
          mkdir -p site/knight site/elf

          cp -a player/. site/knight/
          cp -a fairy_player/. site/elf/

          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="ko">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
            <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
            <title>SLKnight + SLFairy</title>
            <style>
              html,body{margin:0;width:100%;height:100%;background:#080808;color:#fff;font-family:system-ui,sans-serif}
              .wrap{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px}
              .choices{display:flex;gap:16px}
              button{width:150px;height:160px;border:1px solid #777;border-radius:14px;background:#171717;color:#fff;font-size:25px}
            </style>
          </head>
          <body>
            <div class="wrap">
              <h1>캐릭터 선택</h1>
              <div class="choices">
                <button onclick="location.href='knight/?v='+Date.now()">기사</button>
                <button onclick="location.href='elf/?v='+Date.now()">요정</button>
              </div>
            </div>
          </body>
          </html>
          HTML

          touch site/.nojekyll

          rm -rf player
          mv site player

      - name: Sanity check
        run: |
          set -euo pipefail

          test -s player/knight/index.html
          test -s player/knight/mkxp.js
          test -s player/knight/mkxp.wasm
          test -s player/knight/gameasync/Data/Scripts.rxdata
          test -s player/knight/gameasync/mapping.js

          test -s player/elf/index.html
          test -s player/elf/mkxp.js
          test -s player/elf/mkxp.wasm
          test -s player/elf/gameasync/Data/Scripts.rxdata
          test -s player/elf/gameasync/mapping.js

          grep -Fq 'slknight_v106e_engine' player/knight/index.html
          grep -Fq 'SLKnight V14.3z10.6e' player/knight/index.html
          grep -Fq 'v143z106eknight' player/knight/index.html
          grep -Fq 'var slTransformSheets=' player/knight/index.html
          grep -Fq 'SLTRANSFORMERR' player/knight/index.html

          grep -Fq 'slfairy_v106e_engine' player/elf/index.html
          grep -Fq 'SLFairy V14.3z10.6e' player/elf/index.html
          grep -Fq 'v143z106eelf' player/elf/index.html
          grep -Fq 'var slTransformSheets=' player/elf/index.html
          grep -Fq 'SLTRANSFORMERR' player/elf/index.html
          grep -Fq 'position:fixed;left:8px;bottom:8px;' player/elf/index.html

          grep -Fq 'function report(t)' player/elf/index.html
          grep -Fq 'NO SUCH FILE' player/elf/index.html
          grep -Fq 'PHYSFS ERROR' player/elf/index.html
          grep -Fq 'SLTRANSFORMERR' player/elf/index.html
          grep -Fq 'console.error=function()' player/elf/index.html
          grep -Fq 'unhandledrejection' player/elf/index.html

          grep -Fq 'function isTouch()' player/elf/js/dpad.js
          grep -Fq 'function resizeCanvas()' player/elf/js/dpad.js
          grep -Fq 'function initSLTouchControls()' player/elf/js/dpad.js

          ! grep -Fq 'is_touch_device()' player/elf/index.html
          ! grep -Fq "bindKey('d-up'" player/elf/index.html
          ! grep -Fq 'is_touch_device()' player/knight/index.html
          ! grep -Fq "bindKey('d-up'" player/knight/index.html

          ruby -rzlib - player/elf/gameasync/Data/Scripts.rxdata <<'RB'
          scripts=Marshal.load(File.binread(ARGV[0]))

          entries=scripts.select do |e|
            e.is_a?(Array) &&
              e.length>=3 &&
              e[1].to_s.start_with?('Web Resolution')
          end

          abort "FINAL RESOLUTION COUNT=#{entries.size}" unless entries.size==1

          entry=entries.first
          code=Zlib::Inflate.inflate(entry[2])

          abort "WRONG RESOLUTION NAME=#{entry[1]}" unless entry[1].to_s=='Web Resolution 640x480'
          abort '640 WIDTH MISSING' unless code.include?('$WINDOW_WIDTH = 640')
          abort '480 HEIGHT MISSING' unless code.include?('$WINDOW_HEIGHT = 480')
          abort '640x480 RESIZE MISSING' unless code.include?('Graphics.resize_screen(640,480)')

          puts 'FAIRY_640_VERIFY_OK'
          RB

          echo TRANSFORM_PRELOAD_DUAL_BUILD_OK

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player

  deploy:
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
