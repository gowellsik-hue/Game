      - name: Apply V229 correction if source is V228
        shell: bash
        run: |
          set -euo pipefail
          if test "$(cat /tmp/v229/source_version)" = V228; then
            ruby /tmp/v229/source/v229_patch.rb site /tmp/v229/source/v229_runtime.rb
          else
            echo V229_VERIFIED_PUBLISHED_BUILD_REUSED
          fi

      - name: Validate V229 timing and event structure
        shell: bash
        run: |
          set -euo pipefail
          if test "$(cat /tmp/v229/source_version)" = V228; then
            ruby /tmp/v229/tests/test_structure.rb /tmp/v229/baseline site
          fi
          ruby /tmp/v229/tests/test_runtime.rb site

      - name: Refresh cache for patched V228 source only
        shell: bash
        run: |
          set -euo pipefail
          if test "$(cat /tmp/v229/source_version)" = V228; then
            python3 - <<'PY_CACHE'
          from pathlib import Path
          import hashlib,re
          root=Path('site/knight')
          mp=root/'gameasync/mapping.js'
          script=mp.read_text(encoding='utf-8')
          for path in (
            'Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata',
            'Data/Scripts.rxdata'):
            md5=hashlib.md5((root/'gameasync'/path).read_bytes()).hexdigest()
            script,count=re.subn(re.escape(path+'?h=')+r'[0-9a-f]{32}',lambda _:path+'?h='+md5,script)
            if count!=1:raise SystemExit('Missing or duplicate manifest entry '+path)
          mp.write_text(script,encoding='utf-8')
          index=root/'index.html'
          html=index.read_text(encoding='utf-8')
          old='gameasync/mapping.js?v=v228'
          if html.count(old)!=1:raise SystemExit('Incorrect original Knight version')
          index.write_text(html.replace(old,'gameasync/mapping.js?v=v229'),encoding='utf-8')
          print('V229_KNIGHT_CACHE_REFRESHED')
          PY_CACHE
          else
            echo V229_EXISTING_CACHE_REUSED
          fi

      - name: Verify V229 checksums and 5354-file inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import json,hashlib
          root=Path('site')
          before=json.loads(Path('/tmp/v229/original_hashes.json').read_text())
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if len(after)!=5354 or after.keys()!=before.keys():raise SystemExit('Game inventory changed')
          expected={
            'knight/index.html':'d376d842fbbde43c437fdfdb0bbdbf67b2e19bc640caaf1f0abc768ab8b66661',
            'knight/gameasync/mapping.js':'2e08a4c239001bc873b4dc7b45c54368e8dc30e8ce3b0f22fda9a5e4c6cb4ea8',
            'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata':'bbf5ec438a88f032780f9464a862ca4728f1f34afa1b74053ca7c6a9243ca3ed',
            'knight/gameasync/Data/Scripts.rxdata':'72d8c66be04fb793c2d9363a844740432a2ecf01d5c6cb13a518a4a62dd42eb2'
          }
          for name,digest in expected.items():
            if after.get(name)!=digest:raise SystemExit('V229 wrong SHA256 '+name)
          changed={name for name in after if after[name]!=before[name]}
          source=Path('/tmp/v229/source_version').read_text()
          if source=='V228' and changed!=set(expected):raise SystemExit('V229 modification scope violated: '+str(changed))
          if source=='V229' and changed:raise SystemExit('Repeat V229 build should not change files')
          script=(root/'knight/gameasync/mapping.js').read_text(encoding='utf-8')
          for path in ('Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata','Data/Scripts.rxdata'):
            md5=hashlib.md5((root/'knight/gameasync'/path).read_bytes()).hexdigest()
            if script.count(path+'?h='+md5)!=1:raise SystemExit('Broken asset MD5 mapping '+path)
          if (root/'knight/index.html').read_text(encoding='utf-8').count('gameasync/mapping.js?v=v229')!=1:
            raise SystemExit('Broken Knight cache version')
          print('V229_VALIDATED_SOURCE',source,'changed_files',len(changed),'all_5354_preserved')
          PY_FINAL

      - name: Upload verified V229 Pages site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
