
name: V229R10 | Reduction Armor Fix and Aligned Hotbars

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-slknight-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Restore verified V229R9 deployment
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          repository: gowellsik-hue/Game
          run-id: 39100666926
          name: github-pages
          github-token: ${{ github.token }}
          path: previous

      - name: Restore game or recover published site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          if test -s previous/artifact.tar; then
            tar -xf previous/artifact.tar -C site
          else
            python3 - <<'PY_RECOVER'
          from pathlib import Path
          from urllib.request import Request,urlopen
          from urllib.parse import quote
          from concurrent.futures import ThreadPoolExecutor,as_completed
          import hashlib,json,re,time
          base='https://gowellsik-hue.github.io/Game/'
          root=Path('site')
          fixed=('index.html','COPYING-mkxp-web.txt','manifest.webmanifest','mkxp.js','mkxp.wasm','js/drive.js','js/dpad.js','js/localforage.min.js')
          def get(url):
              for i in range(5):
                  try:
                      with urlopen(Request(url,headers={'User-Agent':'SLKnight-R10','Accept-Encoding':'identity'}),timeout=75) as r:
                          return r.read()
                  except Exception:
                      if i==4:raise
                      time.sleep(i+1)
          files={'index.html':(base+'index.html',None)}
          for game in ('knight','elf'):
              for name in fixed:
                  files[game+'/'+name]=(base+game+'/'+quote(name,safe='/'),None)
              mapping=game+'/gameasync/mapping.js'
              data=get(base+mapping+'?recover=v229r10')
              p=root/mapping;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
              body=data.decode('utf8').split('var mappingArray = ',1)[1].split('];',1)[0]+']'
              for _,asset in json.loads(re.sub(r',\s*\]$',']',body)):
                  name,sep,md5=asset.partition('?h=')
                  if '.' not in Path(name).name:continue
                  if name.startswith('/') or '..' in Path(name).parts:raise RuntimeError('Unsafe path')
                  rel=game+'/gameasync/'+name
                  if rel in files:raise RuntimeError('Duplicate asset '+rel)
                  files[rel]=(base+game+'/gameasync/'+quote(name,safe='/')+('?h='+md5 if sep else ''),md5 if sep else None)
          if len(files)!=5354:raise RuntimeError('Wrong asset count: '+str(len(files)))
          def fetch(item):
              name,(url,md5)=item
              data=get(url)
              if md5 and Path(name).name not in ('mapping.js','bitmap-map.js') and hashlib.md5(data).hexdigest()!=md5:raise RuntimeError('Invalid asset MD5 '+name)
              p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          with ThreadPoolExecutor(max_workers=12) as pool:
              jobs=[pool.submit(fetch,it) for it in files.items() if not (root/it[0]).is_file()]
              for job in as_completed(jobs):job.result()
          actual={str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}
          if actual!=set(files):raise RuntimeError('Recovery incomplete')
          print('RESTORED_5354_ASSETS')
          PY_RECOVER
          fi

      - name: Verify V229R9 or V229R10 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_SOURCE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if len(files)!=5354:raise SystemExit('Invalid game inventory '+str(len(files)))
          checks={
           'knight/js/dpad.js':('9176ec1bbd6ab11b7aaecb1bad81aa1b683635a0c7c0a85e8e274c4cafb5e734','cbebd992a1e83713cbd47dea54493a511f5a6d9f90a4fd58b23fd9d9540bd930'),
           'knight/gameasync/Data/Scripts.rxdata':('63910c57235aed76d1122aca27713685c3a119d980259539b85ac3d3648c62cb','6fa8cde279565e48ee5babb28dc8b7e0d2c048986e8339bab30bd7c43987ff01'),
           'knight/gameasync/mapping.js':('5e2a24757e01120808b08e4e4d9b247c08e2fdb5314720f8530b1e1935604254','1aa8038708c2587c157b5f08022565fda625cd969eb3c92ff1d1ca2c6e33f487'),
           'knight/index.html':('acebaa38a336df46768f94fd71aebe156ccfff77abd266468a3e598345084124','fa593d4ba80551adbd673b35bf5be6d7fc03891828e69fecece8afa3a7e204ec')}
          keep={
           'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata':'c1112940bc8ba843e0a7a108a09c09c00a8c952162c62b5f2119323353cb2959',
           'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap035.rxdata':'7aa9a3959547e86720a874d45ec2ec54247495f3de71c7e3ac033c340205b153'}
          for name,sha in keep.items():
           if files.get(name)!=sha:raise SystemExit('Unexpected gameplay data '+name)
          version='R9' if all(files.get(k)==v[0] for k,v in checks.items()) else 'R10' if all(files.get(k)==v[1] for k,v in checks.items()) else None
          if version is None:raise SystemExit('Unknown SLKnight version: refused to modify')
          Path('/tmp/slknight_r10_source').write_text(version)
          Path('/tmp/slknight_r10_before.json').write_text(json.dumps(files))
          Path('/tmp/slknight_r10_checks.json').write_text(json.dumps(checks))
          print('VERIFIED_SLKNIGHT_V229'+version,'FILES',len(files))
          PY_SOURCE

      - name: Fix native skill activation and align six-slot hotbars
        shell: bash
        run: |
          set -euo pipefail
          if test "$(cat /tmp/slknight_r10_source)" = R9; then
            ruby - site <<'RUBY_PATCH'
          require 'digest'
          require 'zlib'
          path=ARGV.fetch(0)+'/knight/gameasync/Data/Scripts.rxdata'
          expected='63910c57235aed76d1122aca27713685c3a119d980259539b85ac3d3648c62cb'
          raise 'Wrong V229R9 Scripts baseline' unless Digest::SHA256.file(path).hexdigest==expected
          scripts=Marshal.load(File.binread(path))
          raise 'Unexpected Scripts inventory' unless scripts.size==137 && scripts[134][1]=='V230 Boss Respawn 60s 180s' && scripts[135][1]=='V229R9 Native Knight Skills' && scripts[136][1]=='Main'
          source=Zlib::Inflate.inflate(scripts[135][2])
          def once!(text,old,new_text)
           c=text.scan(old).size
           raise "Expected exactly one #{old.inspect}, got #{c}" unless c==1
           text.sub(old,new_text)
          end
          old=<<~'SOURCE'
            def self.key_slot
              for i in 0...KEYS.size
                return i if Keyboard.testkey(KEYS[i])
              end
              nil
            end
          SOURCE
          new_code=<<~'SOURCE'
            def self.key_slot
              @key_down ||= Array.new(KEYS.size,false)
              found=nil
              for i in 0...KEYS.size
                down=Keyboard.getstate(KEYS[i])
                edge=Keyboard.testkey(KEYS[i])
                found=i if found.nil? && !@key_down[i] && (down || edge)
                @key_down[i]=down
              end
              found
            end
          SOURCE
          source=once!(source,old.lines.map{|line|'  '+line}.join,new_code.lines.map{|line|'  '+line}.join)
          source=once!(source,'return false if !$game_switches[367] || $game_switches[1011] || $game_switches[trigger]',
                              'return false if $game_switches[1011] || $game_switches[trigger]')
          source=once!(source,'    return fail_slot(slot) unless native_ready?(a,id)',
                              '    return fail_slot(slot) if a.nil? || a.dead? || $game_switches[1011] || $game_switches[NATIVE_SWITCHES[id]]')
          source=once!(source, '    return fail_slot(slot) if $game_system.map_interpreter.running? || $game_temp.common_event_id.to_i>0\n'.gsub('\\n',"\n"), '')
          File.binwrite('/tmp/slknight_r10_skill.rb',source)
          raise 'New script Ruby syntax invalid' unless system('ruby','-c','/tmp/slknight_r10_skill.rb',out:File::NULL)
          scripts[135][1]='V229R10 Native Skill Fix'.force_encoding('UTF-8')
          scripts[135][2]=Zlib::Deflate.deflate(source)
          File.binwrite(path,Marshal.dump(scripts))
          puts 'R10_SCRIPT_SHA '+Digest::SHA256.file(path).hexdigest

          RUBY_PATCH
            python3 - site <<'PY_DPAD'
          from pathlib import Path
          import hashlib
          import sys
          root=Path(sys.argv[1])/'knight'
          p=root/'js/dpad.js'
          expected='9176ec1bbd6ab11b7aaecb1bad81aa1b683635a0c7c0a85e8e274c4cafb5e734'
          assert hashlib.sha256(p.read_bytes()).hexdigest()==expected,'Wrong R9 JS base'
          s=p.read_text(encoding='utf8')
          a=s.index('function layoutSkillPad(')
          b=s.index('function layoutPadSoon()',a)
          old=s[a:b]
          new='''function layoutSkillPad(dpad,skillbar,w,h,portrait,midY,skillTop,cell,gap){
            const cols=portrait?3:2,rows=portrait?2:3;
            const barW=cols*cell+(cols-1)*gap,barH=rows*cell+(rows-1)*gap;
            const target=Math.max(0,midY-8);
            const clearance=10;
            const dsize=Math.max(50,Math.min(portrait?184:156,w-6,h-6,2*(target-6),2*(skillTop-target-clearance)));
            const cy=Math.max(dsize/2+6,Math.min(target,skillTop-dsize/2-clearance));
            centerBox(dpad,w/2,cy,dsize,dsize);
            box(skillbar,(w-barW)/2,skillTop,barW,barH);
            skillbar.style.gridTemplateColumns='repeat('+cols+','+cell+'px)';
            skillbar.style.gridTemplateRows='repeat('+rows+','+cell+'px)';
            skillbar.style.gap=gap+'px';
            skillbar.querySelectorAll('.sl-skill-slot').forEach(b=>{b.style.width=cell+'px';b.style.height=cell+'px';});
          }
          function layoutPad(){
            const canvas=document.getElementById('canvas'),pad=document.getElementById('sl-pad'),zone=document.getElementById('sl-joy-zone'),hot=document.getElementById('sl-hotbar'),atk=document.getElementById('sl-atk'),cancel=document.getElementById('sl-cancel'),dpad=document.getElementById('sl-dpad'),skillbar=document.getElementById('sl-skillbar');
            if(!canvas||!pad||!zone||!hot||!atk||!cancel||!dpad||!skillbar)return;
            const v=viewportBox(),cr=canvas.getBoundingClientRect(),leftSpace=Math.max(0,cr.left-v.left),rightSpace=Math.max(0,v.left+v.width-cr.right),bottomSpace=Math.max(0,v.top+v.height-cr.bottom);
            pad.style.left=Math.round(v.left)+'px';pad.style.top=Math.round(v.top)+'px';pad.style.width=Math.round(v.width)+'px';pad.style.height=Math.round(v.height)+'px';
            const portrait=v.height>v.width;
            const cols=portrait?3:2,rows=portrait?2:3,gap=portrait?8:6;
            const top=portrait?cr.bottom-v.top:cr.top-v.top,h=portrait?bottomSpace:cr.height;
            const leftW=portrait?Math.max(1,Math.min(v.width*0.52,v.width-170)):leftSpace;
            const rightLeft=portrait?leftW:cr.right-v.left;
            const rightW=portrait?Math.max(1,v.width-rightLeft):rightSpace;
            const zoneW=Math.max(1,leftW-8),zoneH=Math.max(1,h-16),zoneTop=top+8;
            const usable=Math.min(zoneW,Math.max(1,rightW-16));
            const cell=Math.max(22,Math.min(portrait?48:42,Math.floor((usable-6-(cols-1)*gap)/cols)));
            const barW=cols*cell+(cols-1)*gap,barH=rows*cell+(rows-1)*gap;
            hot.style.gridTemplateColumns='repeat('+cols+','+cell+'px)';
            hot.style.gridTemplateRows='repeat('+rows+','+cell+'px)';
            hot.style.gap=gap+'px';
            hot.querySelectorAll('.sl-hot').forEach(b=>{b.style.width=cell+'px';b.style.height=cell+'px';});
            box(zone,0,zoneTop,zoneW,zoneH);
            if(portrait){
              pad.dataset.mode='bottom';
              const atkY=Math.min(h*0.23,100),cancelY=Math.min(h*0.46,190);
              const hotTop=Math.max(top+12,top+h-barH-18);
              const hotLeft=rightLeft+Math.max(8,rightW-barW-16);
              layoutSkillPad(dpad,skillbar,zoneW,zoneH,true,(atkY+cancelY)/2,hotTop-zoneTop,cell,gap);
              centerBox(atk,rightLeft+rightW*0.70,top+atkY,94,94);
              centerBox(cancel,rightLeft+rightW*0.43,top+cancelY,62,62);
              box(hot,hotLeft,hotTop,barW,barH);
            }else{
              pad.dataset.mode='side';
              const cx=rightLeft+rightW/2;
              const hotTop=Math.max(top+8,top+h-barH-12);
              const hotLeft=rightLeft+Math.max(2,(rightW-barW)/2);
              layoutSkillPad(dpad,skillbar,zoneW,zoneH,false,h*(0.22+0.43)/2,hotTop-zoneTop,cell,gap);
              const atkSize=Math.min(82,Math.max(58,rightW-12)),xSize=Math.min(54,Math.max(44,rightW-20));
              centerBox(atk,cx,top+h*0.22,atkSize,atkSize);
              centerBox(cancel,cx,top+h*0.43,xSize,xSize);
              box(hot,hotLeft,hotTop,barW,barH);
            }
          }
          '''
          assert s.count(old)==1
          s=s.replace(old,new)
          assert 'layoutSkillPad(dpad,skillbar,zoneW,zoneH' in s
          p.write_text(s,encoding='utf8')
          print('R10_DPAD_SHA',hashlib.sha256(p.read_bytes()).hexdigest())

          PY_DPAD
            python3 - site <<'PY_CACHE'
          from pathlib import Path
          import hashlib,re,sys
          r=Path(sys.argv[1])/'knight'
          rel='Data/Scripts.rxdata'
          mp=r/'gameasync/mapping.js'
          s=mp.read_text(encoding='utf-8')
          md5=hashlib.md5((r/'gameasync'/rel).read_bytes()).hexdigest()
          s,n=re.subn(re.escape(rel+'?h=')+r'[0-9a-f]{32}',lambda _:rel+'?h='+md5,s)
          assert n==1,('Mapping entry count',n)
          mp.write_text(s,encoding='utf-8')
          idx=r/'index.html';html=idx.read_text(encoding='utf-8')
          for a,b in [('gameasync/mapping.js?v=v229r9','gameasync/mapping.js?v=v229r10'),('js/dpad.js?v=v229r9','js/dpad.js?v=v229r10')]:
              assert html.count(a)==1,(a,html.count(a))
              html=html.replace(a,b)
          idx.write_text(html,encoding='utf-8')
          for rel in ('js/dpad.js','gameasync/Data/Scripts.rxdata','gameasync/mapping.js','index.html'):
              p=r/rel
              print(rel,hashlib.sha256(p.read_bytes()).hexdigest())

          PY_CACHE
          else
            echo V229R10_ALREADY_APPLIED
          fi

      - name: Verify native skill triggers, hotbar layouts and game integrity
        shell: bash
        run: |
          set -euo pipefail
          node --check site/knight/js/dpad.js
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before=json.loads(Path('/tmp/slknight_r10_before.json').read_text())
          checks=json.loads(Path('/tmp/slknight_r10_checks.json').read_text())
          current={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if len(current)!=5354 or current.keys()!=before.keys():raise SystemExit('Asset inventory modified')
          for name,hashes in checks.items():
           if current.get(name)!=hashes[1]:raise SystemExit('Wrong V229R10 patch hash: '+name)
          changed={p for p in current if before[p]!=current[p]}
          version=Path('/tmp/slknight_r10_source').read_text()
          if version=='R9' and changed!=set(checks):raise SystemExit('Unexpected changed assets '+repr(sorted(changed)))
          if version=='R10' and changed:raise SystemExit('V229R10 rerun modified game')
          knight=root/'knight'
          mp=(knight/'gameasync/mapping.js').read_text(encoding='utf8')
          md5=hashlib.md5((knight/'gameasync/Data/Scripts.rxdata').read_bytes()).hexdigest()
          if mp.count('Data/Scripts.rxdata?h='+md5)!=1:raise SystemExit('Broken Scripts asset mapping')
          html=(knight/'index.html').read_text(encoding='utf8')
          for token in ('gameasync/mapping.js?v=v229r10','js/dpad.js?v=v229r10'):
           if html.count(token)!=1:raise SystemExit('Missing mobile cache version '+token)
          js=(knight/'js/dpad.js').read_text(encoding='utf8')
          for token in ('function layoutSkillPad(dpad,skillbar','box(skillbar,(w-barW)/2,skillTop,barW,barH)','gridTemplateRows','hotTop-zoneTop'):
           if token not in js:raise SystemExit('Missing aligned skills and items '+token)
          print('PASS_R10_5354_GAME_ASSETS_MODIFIED_ONLY',len(changed),'FILES')
          PY_FINAL
          ruby - <<'RUBY_VERIFY'
          require 'zlib'
          module RPG;class CommonEvent;end;class EventCommand;end;class MoveRoute;end;class MoveCommand;end;class AudioFile;end;end
          scripts=Marshal.load(File.binread('site/knight/gameasync/Data/Scripts.rxdata'))
          raise 'Boss respawn or script ordering changed' unless scripts.size==137 && scripts[134][1]=='V230 Boss Respawn 60s 180s' && scripts[135][1]=='V229R10 Native Skill Fix' && scripts[136][1]=='Main'
          source=Zlib::Inflate.inflate(scripts[135][2]);File.binwrite('/tmp/slknight_r10_verify.rb',source)
          raise 'Ruby syntax error' unless system('ruby','-c','/tmp/slknight_r10_verify.rb',out:File::NULL)
          raise 'Obsolete 367 requirement remains' if source.include?('!$game_switches[367]')
          raise 'Native event cast missing' unless source.include?('NATIVE_SWITCHES={7=>1007,8=>1008,9=>874}') && source.include?('$game_switches[NATIVE_SWITCHES[id]]=true')
          raise 'Key press edge fallback missing' unless source.include?('Keyboard.getstate(KEYS[i])') && source.include?('Keyboard.testkey(KEYS[i])')
          native=source.split('def self.native_cast',2)[1].split('def self.mode',2)[0]
          raise 'Map interpreter rejection remains' if native.include?('map_interpreter.running?')
          common=Marshal.load(File.binread('site/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata'))
          {7=>[846,1007,1006],8=>[966,1008,1009],9=>[848,874,872]}.each do |id,(event_id,trigger,buff)|
           e=common[event_id]
           raise 'Original cast event missing' unless e.instance_variable_get(:@trigger)==1 && e.instance_variable_get(:@switch_id)==trigger
           list=e.instance_variable_get(:@list)
           raise 'Buff switch not activated' unless list.any?{|c| c.instance_variable_get(:@code)==121 && c.instance_variable_get(:@parameters)==[buff,buff,0]}
           raise 'Buff icon refresh missing' unless list.any?{|c|c.instance_variable_get(:@code)==355 && c.instance_variable_get(:@parameters).join.include?('$KeyIcon.ShowIcon')}
           puts "PASS_NATIVE_#{id}_AUTORUN_#{event_id}_BUFF_#{buff}"
          end

          RUBY_VERIFY

      - name: Upload verified knight game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
