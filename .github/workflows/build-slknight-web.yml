
name: V229 | Reviewed Unified Knight Speed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-slknight-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Restore verified V229R2 artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          repository: gowellsik-hue/Game
          run-id: 38844717736
          name: github-pages
          github-token: ${{ github.token }}
          path: previous

      - name: Restore full game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          if test -s previous/artifact.tar; then
            tar -xf previous/artifact.tar -C site
          else
            python3 - <<'PY_FETCH'
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request,urlopen
          from concurrent.futures import ThreadPoolExecutor,as_completed
          import hashlib,json,re,time
          base='https://gowellsik-hue.github.io/Game/'
          root=Path('site')
          fixed=('index.html','COPYING-mkxp-web.txt','manifest.webmanifest','mkxp.js','mkxp.wasm','js/drive.js','js/dpad.js','js/localforage.min.js')
          def get(url):
            for attempt in range(5):
              try:
                with urlopen(Request(url,headers={'User-Agent':'SLKnight-Spirit-Aggro','Accept-Encoding':'identity'}),timeout=60) as resp:
                  return resp.read()
              except Exception:
                if attempt==4:raise
                time.sleep(attempt+1)
          files={'index.html':(base+'index.html',None)}
          for game in ('knight','elf'):
            for rel in fixed:
              files[game+'/'+rel]=(base+game+'/'+quote(rel,safe='/'),None)
            name=game+'/gameasync/mapping.js'
            blob=get(base+name+'?recover=spirit-r3')
            p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(blob)
            body=blob.decode('utf-8').split('var mappingArray = ',1)[1].split('];',1)[0]+']'
            for _,asset in json.loads(re.sub(r',\s*\]$',']',body)):
              rel,sep,md5=asset.partition('?h=')
              if '.' not in Path(rel).name:continue
              if rel.startswith('/') or '..' in Path(rel).parts:raise RuntimeError('Unsafe asset '+rel)
              name=game+'/gameasync/'+rel
              if name in files:raise RuntimeError('Duplicate asset '+name)
              files[name]=(base+game+'/gameasync/'+quote(rel,safe='/')+('?h='+md5 if sep else ''),md5 if sep else None)
          if len(files)!=5354:raise RuntimeError('Unexpected total file count')
          def fetch(item):
            name,(url,md5)=item
            data=get(url)
            if md5 and Path(name).name not in ('mapping.js','bitmap-map.js') and hashlib.md5(data).hexdigest()!=md5:
              raise RuntimeError('Bad MD5 '+name)
            p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          with ThreadPoolExecutor(max_workers=12) as pool:
            for job in as_completed([pool.submit(fetch,item) for item in files.items() if not (root/item[0]).is_file()]):job.result()
          if {str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}!=set(files):
            raise RuntimeError('Incomplete published game')
          print('RECOVERED_5354_FILES')
          PY_FETCH
          fi

      - name: Verify V229R2 or spirit-patched V229R3 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_SOURCE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if len(files)!=5354:raise SystemExit('Unknown asset count')
          target='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap035.rxdata'
          base={
            'knight/index.html':'f46be32a7c7ca0414d7ac9511926379973dc7c303af2f5dda4eadd443a60ca5b',
            'knight/gameasync/mapping.js':'8f1038ada15642711fa9e46115e560632fbea85a1ee1dfb944a96bb1be931ad6',
            target:'b7812023229e6d8413a79a11f8ff667a1a742c94688698f3a6ca7f0632421829'
          }
          final={
            'knight/index.html':'93e8fef889d16bd376dc5b4adb730d73f732eeaa38de6d34d67d186eb86d4ba4',
            'knight/gameasync/mapping.js':'0717f281157314632455974b0ccf8105046e764c8212081cca01cf1744d029ff',
            target:'ee13af3b9981ab9bde19cc938d288869b4a34b0d12365b69c3a5121c83107356'
          }
          keep={
            'knight/gameasync/Data/Scripts.rxdata':'9e3eaae707471a9ee395e5ede40b43bc8462f2be137bc9f3ffca484598062630',
            'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata':'bbf5ec438a88f032780f9464a862ca4728f1f34afa1b74053ca7c6a9243ca3ed'
          }
          if not all(files.get(k)==v for k,v in keep.items()):raise SystemExit('Unexpected V229 scripts or events')
          version='V229R2' if all(files.get(k)==v for k,v in base.items()) else 'V229R3' if all(files.get(k)==v for k,v in final.items()) else None
          if version is None:raise SystemExit('Unknown published edition; no changes')
          Path('/tmp/spirit_base_version').write_text(version)
          Path('/tmp/spirit_before.json').write_text(json.dumps(files))
          print('VERIFIED_SOURCE',version)
          PY_SOURCE

      - name: Restrict only spirit grave monsters to local pursuit
        shell: bash
        run: |
          set -euo pipefail
          if test "$(cat /tmp/spirit_base_version)" = V229R2; then
            ruby - site/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap035.rxdata <<'RUBY_PATCH'
          require 'digest'
          class Table
            def self._load(data); new(data); end
            def initialize(data); @data=data; end
            def _dump(depth); @data; end
          end
          module RPG
            class Map; end
            class Event; end
            class MoveRoute; end
            class MoveCommand; end
            class EventCommand; end
            class AudioFile; end
            class Event
              class Page
                class Condition; end
                class Graphic; end
              end
            end
          end
          path=ARGV.fetch(0)
          source=File.binread(path)
          current=Digest::SHA256.hexdigest(source)
          expected='b7812023229e6d8413a79a11f8ff667a1a742c94688698f3a6ca7f0632421829'
          abort('Unexpected Spirit Grave Map035 baseline') unless current==expected
          map=Marshal.load(source)
          events=map.instance_variable_get(:@events)
          ids=([2]+(4..10).to_a+(12..17).to_a)
          raise 'Unexpected monster count' unless ids.length==14
          change_count=0
          ids.each do |id|
            event=events.fetch(id)
            page=event.instance_variable_get(:@pages).fetch(0)
            route=page.instance_variable_get(:@move_route)
            commands=route.instance_variable_get(:@list)
            raise "Wrong default AI #{id}" unless page.instance_variable_get(:@move_type)==3 && page.instance_variable_get(:@trigger)==2
            head=commands.fetch(0)
            raise "No unconditional chase #{id}" unless head.instance_variable_get(:@code)==10 && head.instance_variable_get(:@parameters)==[]
            limit=id==16 ? 5 : 7
            if id==17
              raise 'Unexpected ghoul route' unless commands.map{|c|c.instance_variable_get(:@code)}==[10,0]
            else
              raise "Wrong route #{id}" unless commands.map{|c|c.instance_variable_get(:@code)}==[10,45,0]
              range=commands.fetch(1).instance_variable_get(:@parameters).fetch(0)
              raise "Unexpected old range #{id} #{range.inspect}" unless range.to_s.dup.force_encoding('UTF-8').start_with?("범위(#{limit},")
            end
            script="d=(self.x-$game_player.x).abs+(self.y-$game_player.y).abs; d<#{limit} ? move_toward_player : move_random"
            head.instance_variable_set(:@code,45)
            head.instance_variable_set(:@parameters,[script])
            change_count+=1
          end
          raise 'Wrong edit count' unless change_count==14
          File.binwrite(path,Marshal.dump(map))
          puts "SPIRIT_GRAVE_AGGRO_PATCHED_MONSTERS=#{change_count} SHA256=#{Digest::SHA256.file(path).hexdigest}"
          RUBY_PATCH
            python3 - <<'PY_CACHE'
          from pathlib import Path
          import hashlib,re
          root=Path('site/knight')
          rel='Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap035.rxdata'
          md5=hashlib.md5((root/'gameasync'/rel).read_bytes()).hexdigest()
          mapping=root/'gameasync/mapping.js'
          text=mapping.read_text(encoding='utf-8')
          text,n=re.subn(re.escape(rel+'?h=')+r'[0-9a-f]{32}',lambda _:rel+'?h='+md5,text)
          if n!=1:raise SystemExit('Map035 cache entry missing')
          mapping.write_text(text,encoding='utf-8')
          index=root/'index.html';html=index.read_text(encoding='utf-8')
          old='gameasync/mapping.js?v=v229r2'
          if html.count(old)!=1:raise SystemExit('Unexpected version marker')
          index.write_text(html.replace(old,'gameasync/mapping.js?v=v229r3'),encoding='utf-8')
          print('SPIRIT_GRAVE_CACHE_REFRESHED')
          PY_CACHE
          else
            echo SPIRIT_GRAVE_ALREADY_CORRECTED
          fi

      - name: Verify exact correction and unchanged gameplay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          old=json.loads(Path('/tmp/spirit_before.json').read_text())
          new={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if len(new)!=5354 or set(new)!=set(old):raise SystemExit('Unexpected game inventory change')
          target='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap035.rxdata'
          expected={
            'knight/index.html':'93e8fef889d16bd376dc5b4adb730d73f732eeaa38de6d34d67d186eb86d4ba4',
            'knight/gameasync/mapping.js':'0717f281157314632455974b0ccf8105046e764c8212081cca01cf1744d029ff',
            target:'ee13af3b9981ab9bde19cc938d288869b4a34b0d12365b69c3a5121c83107356'
          }
          if any(new.get(k)!=v for k,v in expected.items()):raise SystemExit('Unexpected final game data')
          changed={k for k in new if new[k]!=old[k]}
          source=Path('/tmp/spirit_base_version').read_text()
          if (source=='V229R2' and changed!=set(expected)) or (source=='V229R3' and changed):
            raise SystemExit('Outside target files changed '+repr(changed))
          key='Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap035.rxdata'
          mapping=(root/'knight/gameasync/mapping.js').read_text(encoding='utf-8')
          md5=hashlib.md5((root/'knight/gameasync'/key).read_bytes()).hexdigest()
          if mapping.count(key+'?h='+md5)!=1:raise SystemExit('Map035 cache mismatch')
          if (root/'knight/index.html').read_text(encoding='utf-8').count('gameasync/mapping.js?v=v229r3')!=1:
            raise SystemExit('Page cache version mismatch')
          print('PASS_SPIRIT_GRAVE_ONLY',len(changed),'modified,',5354-len(changed),'untouched')
          PY_VERIFY
          ruby - <<'RUBY_CHECK'
          class Table
            def self._load(data);new(data);end
            def initialize(data);@data=data;end
            def _dump(depth);@data;end
          end
          module RPG
            class Map;end
            class Event;end
            class MoveRoute;end
            class MoveCommand;end
            class EventCommand;end
            class AudioFile;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
          end
          path='site/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap035.rxdata'
          map=Marshal.load(File.binread(path))
          events=map.instance_variable_get(:@events)
          ids=[2]+(4..10).to_a+(12..17).to_a
          raise 'Monster count wrong' unless events.size==18 && ids.size==14
          ids.each do |id|
            page=events.fetch(id).instance_variable_get(:@pages).fetch(0)
            route=page.instance_variable_get(:@move_route).instance_variable_get(:@list)
            range=id==16 ? 5 : 7
            check="d=(self.x-$game_player.x).abs+(self.y-$game_player.y).abs; d<#{range} ? move_toward_player : move_random"
            raise "Wrong pursuit #{id}" unless route.first.instance_variable_get(:@code)==45 && route.first.instance_variable_get(:@parameters)==[check]
            raise "Attack trigger changed #{id}" unless page.instance_variable_get(:@trigger)==2
          end
          puts 'PASS_LOCAL_PURSUIT_ALL_14_MONSTERS_BOSS_RADIUS_5_OTHERS_7'
          RUBY_CHECK

      - name: Upload verified game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
