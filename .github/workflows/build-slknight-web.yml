# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R122
# BASE: verified deployed V229R121 (run 40641411815).
# AUTHORISED: Map045 S32 (32657,32807), (32657,32805) ONLY.
# Each already has approved native screen DOWN/LEFT mask 3.
# FIX: connect only their four S32 exits via five reversible RGSS 4-way edges.
# UNCHANGED: other 450 mask cells, S32 data, walls, 1F/2F images, actors,
# movement, respawns, events, monsters, controls and preload/download assets.
name: build-slknight-web.yml | V229R122 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R122 Restore approved R121 deployed game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40641411815
          name: github-pages
          github-token: ${{ github.token }}
          path: r121

      - name: V229R122 Add ONLY two marked S32 openings
        shell: bash
        run: |
          set -euo pipefail
          test -s r121/artifact.tar
          mkdir -p site build
          tar -xf r121/artifact.tar -C site
          python3 - <<'R122_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          assert len(before)==5566,('Unexpected R121 baseline file count',len(before))
          expected={
            'knight/gameasync/Data/Scripts.rxdata':'51bbd2b04e5a8e51a7ab95838ba3f7669009ffc1f66c1695c74ed35c6344e7ee',
            'knight/js/dpad.js':'2bd401adf130339d154ce6a8efd0127cefd9b1bc58bc60d1de68e8b6d8b7a791',
            'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap045.rxdata':'f47de87af6b4e607bf632818a711619dc8ca4e747196a123a76ac7db8ffc3ba6',
            'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap046.rxdata':'dc89d908f5247442e08dddc11f5bcf6505a77890bd82ab59b790e00e3e5f024c'}
          for name,sha in expected.items():
              assert before[name]==sha,('Wrong R121 deployed file',name)
          assert 'V229R121' in (root/'knight/index.html').read_text('utf8')
          Path('build/before.json').write_text(json.dumps(before,sort_keys=True))
          print('PASS actual deployed R121; all protected map assets intact')
          R122_BASE
          cp site/knight/gameasync/Data/Scripts.rxdata build/scripts-r121.rxdata
          cat > build/r122_patch.rb <<'R122_PATCH'
          require 'zlib'
          require 'digest'

          path=ARGV.fetch(0)
          out=ARGV.fetch(1)
          archive=Marshal.load(File.binread(path))
          raise 'Wrong original script count' unless archive.size==136
          old=Zlib::Inflate.inflate(archive[134][2])
          raise 'Already patched' if old.include?('module SLTI_R122TwoOpen')
          raise 'Missing R121 native graph' unless old.include?('module SLTI_Native66')
          raise 'Missing R97 masks' unless old.include?('module SLTI_V229R97Corner')
          raise 'Missing R44 fallback' unless old.include?('alias slti_native66_original_passable passable?')
          raise 'Actor override restored' if old.include?('slti_native66_prepare') || old.include?('@slti_native66_')

          module_code=lambda do |text,first,last|
            a=text.index(first)
            b=a && text.index(last,a)
            raise "Invalid module slice #{first}" unless a && b && a<b
            text[a...b]
          end
          s21=Zlib::Inflate.inflate(archive[21][2])
          Object.class_eval(module_code.call(s21,"module SLTI_V229R44\n","\nclass Game_Map"))
          Object.class_eval(module_code.call(old,"module SLTI_Native66\n","\n# Replace the old R42/R44 graph"))
          Object.class_eval(module_code.call(old,"module SLTI_V229R97Corner\n","\n# V229R84:"))
          a=old.index("\n# V229R84:")
          b=old.index("module SLTI_Native66\n",a)
          c=old.index("\n# V229R111:",b)
          raise 'No original direction module' unless a && b && c
          Object.class_eval(old[b...c])

          MASK=SLTI_V229R97Corner::MASKS
          N=SLTI_Native66
          SOURCES=[[32657,32807],[32657,32805]].freeze
          raise 'Approved source count changed' unless MASK.size==452
          raise 'Original extra opening changed' unless MASK[[32655,32806]]==12
          raise 'R93 alignment changed' unless N.project(45,32655,32806)==[1416,1290] && N.project(46,32655,32806)==[1416,1674]
          raise 'Two marked cells are not closed original S32' unless SOURCES.all?{|pt|N.value(45,*pt)==0 && MASK[pt]==3}

          step={2=>[0,1],4=>[-1,0],6=>[1,0],8=>[0,-1]}
          bit={2=>2,4=>4,6=>8,8=>1}
          reverse={2=>8,4=>6,6=>4,8=>2}
          open_bits=Hash.new(0)
          original_links=[]
          SOURCES.each do |pt|
            [2,4,6,8].each do |direction|
              target=N.native_target(45,*pt,direction)
              next if target==nil
              raise 'Extra opening in wrong S32 direction' unless [2,4].include?(direction)
              raise 'Connection points to wall' unless N.value(45,*target)!=0
              a=N.project(45,*pt).map{|n|n/16}
              b=N.project(45,*target).map{|n|n/16}
              dx=b[0]<=>a[0]
              dy=b[1]<=>a[1]
              length=(b[0]-a[0]).abs+(b[1]-a[1]).abs
              raise 'Unexpected diagonal or distance' if dx!=0 && dy!=0 || !length.between?(1,2)
              raise 'Not same direction as original mask' unless step[direction]==[dx,dy]
              original_links << [pt,direction,target]
              length.times do |i|
                x=a[0]+dx*i;y=a[1]+dy*i
                nx=x+dx;ny=y+dy
                raise 'Out-of-bounds output' unless x.between?(0,287) && nx.between?(0,287) && y.between?(0,143) && ny.between?(0,143)
                open_bits[[x,y]]|=bit[direction]
                open_bits[[nx,ny]]|=bit[reverse.fetch(direction)]
              end
            end
          end
          raise "Unexpected native links #{original_links.size}" unless original_links.size==4
          expected_bits={
            [87,79]=>8,
            [88,79]=>12,
            [89,79]=>6,
            [89,80]=>9,
            [90,80]=>6,
            [90,81]=>1
          }
          raise "Wrong exact bridge entries: #{open_bits.inspect}" unless open_bits==expected_bits
          expected_packed=expected_bits.map{|(x,y),v|[y*288+x,v]}.to_h

          # No S32 values, other yellow corners, characters, positions or images change.
          # Whitelist only five bidirectional RGSS edges derived from the two clicked cells.
          extra=<<'RUNTIME'

          # V229R122: ONLY user-selected Map045 S32 (32657,32807) and (32657,32805).
          # Each original yellow corner has approved screen DOWN and LEFT exits (mask 3).
          # Compile their four original S32 exits to five bidirectional 32px RPG edges.
          # No S32 tile, original corner mask, world object or actor-coordinate edit.
          module SLTI_R122TwoOpen
            WIDTH=288
            GATES={
              79*WIDTH+87=>8,
              79*WIDTH+88=>12,
              79*WIDTH+89=>6,
              80*WIDTH+89=>9,
              80*WIDTH+90=>6,
              81*WIDTH+90=>1
            }.freeze
            def self.edge?(map_id,x,y,d)
              return false unless map_id==45 && x>=0 && x<288 && y>=0 && y<144
              bit=(d==8 ? 1 : d==2 ? 2 : d==4 ? 4 : d==6 ? 8 : 0)
              bit!=0 && ((GATES.fetch(y*WIDTH+x,0) & bit)!=0)
            end
          end

          # Keep original R44 checks for all edges except these five approved links.
          module SLTI_V229R44
            class << self
              alias slti_r122_previous_allowed allowed?
              def allowed?(map_id,x,y,d)
                return true if SLTI_R122TwoOpen.edge?(map_id,x,y,d)
                slti_r122_previous_allowed(map_id,x,y,d)
              end
            end
          end

          # R121 native nearest() excludes S32=0; bypass it ONLY on the five approved
          # original connections, still delegating to original map/tile/event blocking.
          class Game_Map
            alias slti_r122_previous_passable passable?
            def passable?(x,y,d,self_event=nil)
              if SLTI_R122TwoOpen.edge?(@map_id,x,y,d)
                return slti_native66_original_passable(x,y,d,self_event)
              end
              slti_r122_previous_passable(x,y,d,self_event)
            end
          end
          RUNTIME
          raise 'Accidental reopening of many yellow cells' if extra.include?('419 yellow corners')
          new_text=old+extra
          archive[134][2]=Zlib::Deflate.deflate(new_text)
          File.binwrite(out,Marshal.dump(archive))
          File.binwrite('build/134-r122.rb',new_text)
          raise 'Changed script count' unless archive.size==136
          original_archive=Marshal.load(File.binread(path))
          archive.each_with_index{|entry,index|raise "Changed other script #{index}" unless index==134 || entry==original_archive[index]}
          puts "PASS patch: selected native cells #{SOURCES.inspect}, #{original_links.size} exact S32 links, 5 RGSS edges, no other scripts changed"
          R122_PATCH
          ruby -c build/r122_patch.rb
          ruby build/r122_patch.rb build/scripts-r121.rxdata site/knight/gameasync/Data/Scripts.rxdata
          ruby -c build/134-r122.rb

      - name: V229R122 Verify exact movement and all protected files
        shell: bash
        run: |
          set -euo pipefail
          cat > build/r122_test.rb <<'R122_TEST'
          require 'zlib'
          orig=Marshal.load(File.binread(ARGV.fetch(0)))
          patched=Marshal.load(File.binread(ARGV.fetch(1)))
          script=lambda{|a,i|Zlib::Inflate.inflate(a[i][2])}
          Object.class_eval(script.call(orig,21))
          [23,24,25,27].each{|i|Object.class_eval(script.call(orig,i))}
          class Game_Event < Game_Character;end
          class Game_Character
            def check_event_trigger_touch(*args);end
          end
          src=script.call(orig,134)
          seg=lambda do |a,b|
            x=src.index(a); y=x && src.index(b,x); raise "segment #{a} #{b} missing" unless x && y
            src[x...y]
          end
          Object.class_eval(seg.call("module SLTI_Native66\n", "\n# Replace the old R42/R44 graph"))
          Object.class_eval(seg.call("class Game_Map\n  alias slti_native66_original_passable passable?", "\n# V229R97:"))
          Object.class_eval(seg.call("module SLTI_V229R97Corner\n", "\n# V229R84:"))
          b=src.index("# V229R84:"); c=src.index("module SLTI_Native66\n",b); d=src.index("\n# V229R111:",c)
          Object.class_eval(src[c...d])
          class MockMap < Game_Map
           def initialize(mid)
             @map_id=mid
             @map=Struct.new(:width,:height).new(mid==45 ? 288 : 336,mid==45 ? 144 : 168)
             @events={}
             @passages=Array.new(999,0)
             @priorities=Array.new(999,0)
           end
           def valid?(x,y);x>=0 && y>=0 && x<@map.width && y<@map.height;end
          end
          $game_map=MockMap.new(45)
          $game_player=Game_Character.new
          $game_player.instance_variable_set(:@character_name,'Kn')
          DELTA={2=>[0,1],4=>[-1,0],6=>[1,0],8=>[0,-1]}
          REV={2=>8,4=>6,6=>4,8=>2}
          def can?(x,y,d)
           $game_player.moveto(x,y)
           $game_player.passable?(x,y,d)
          end
          def snap(mid,rx,ry)
           $game_map=MockMap.new(mid)
           h={}
           (rx[0]..rx[1]).each do |x|
            (ry[0]..ry[1]).each do |y|
             DELTA.each_key{|dir|h[[x,y,dir]]=can?(x,y,dir)}
            end
           end
           h
          end
          base1=snap(45,[84,94],[75,84]);base2=snap(46,[84,94],[75,84]);
          new=script.call(patched,134)
          raise 'Modified existing script instead of append' unless new.start_with?(src)
          extra=new[src.length..-1]
          raise 'Missing patch marker' unless extra.include?('module SLTI_R122TwoOpen')
          Object.class_eval(extra)
          after1=snap(45,[84,94],[75,84]);after2=snap(46,[84,94],[75,84]);
          raise 'Map46 altered' unless after2==base2
          expected=[[87,79,6],[88,79,4],[88,79,6],[89,79,4],
                    [89,79,2],[89,80,8],[89,80,6],[90,80,4],
                    [90,80,2],[90,81,8]].sort
          changes=(base1.keys.select{|k|base1[k]!=after1[k]}).sort
          raise "Altered moves outside selected edges: #{changes-expected}" unless (changes-expected).empty?
          expected.each{|k| raise "Target still blocked #{k}" unless after1[k]}
          mask=SLTI_R122TwoOpen::GATES
          raise 'Unexpected gate count' unless mask.size==6
          expected_bits={79*288+87=>8,79*288+88=>12,79*288+89=>6,80*288+89=>9,80*288+90=>6,81*288+90=>1}
          raise 'Different gate locations' unless mask==expected_bits
          puts "PASS only #{changes.length} previously-blocked directed edges enabled of #{base1.size} checked, no non-target changes"
          puts "PASS Map046 unchanged for #{base2.size} moves"
          # Actual player move: every side of every target edge.
          $game_map=MockMap.new(45)
          expected.each do |x,y,d|
            $game_player.moveto(x,y)
            next_pos=[x+DELTA[d][0],y+DELTA[d][1]]
            case d
            when 2;$game_player.move_down
            when 4;$game_player.move_left
            when 6;$game_player.move_right
            when 8;$game_player.move_up
            end
            got=[$game_player.x,$game_player.y]
            raise "Actual actor failed #{[x,y,d]}: #{got.inspect} != #{next_pos.inspect}" unless got==next_pos
          end
          puts 'PASS actual Game_Character#move_* for five links, forward + backward (10 directions)'
          # Zero unapproved S32 data changes.
          raise 'Unexpected S32 original data changes' unless SLTI_Native66.value(45,32657,32807)==0 && SLTI_Native66.value(45,32657,32805)==0
          raise 'Original corner masks changed' unless SLTI_V229R97Corner::MASKS.size==452 &&
            SLTI_V229R97Corner::MASKS[[32657,32807]]==3 && SLTI_V229R97Corner::MASKS[[32657,32805]]==3
          puts 'PASS existing R97 direction masks intact; Map045 only 2 chosen S32 openings'
          R122_TEST
          ruby -c build/r122_test.rb
          ruby build/r122_test.rb build/scripts-r121.rxdata site/knight/gameasync/Data/Scripts.rxdata
          python3 - <<'R122_FILES'
          from pathlib import Path
          import hashlib,json,re
          root=Path('site')
          scripts=root/'knight/gameasync/Data/Scripts.rxdata'
          mapping=root/'knight/gameasync/mapping.js'
          text=mapping.read_text('utf8')
          text,n=re.subn(r'(Data/Scripts\.rxdata\?h=)[0-9a-f]{32}',
                         lambda m:m.group(1)+hashlib.md5(scripts.read_bytes()).hexdigest(),text)
          assert n==1,('Script cache entry missing',n)
          mapping.write_text(text,encoding='utf8')
          for name in ('index.html','knight/index.html'):
              page=root/name
              html=page.read_text('utf8')
              assert 'V229R121' in html and 'V229R122' not in html
              page.write_text(html.replace('V229R121','V229R122')
                                  .replace('v229r121','v229r122'),encoding='utf8')
          runtime=root/'knight/js/sl-assets-v229r115.js'
          js=runtime.read_text('utf8')
          assert js.count("var version='V229R121';")==1
          runtime.write_text(js.replace("var version='V229R121';",
                                        "var version='V229R122';"),encoding='utf8')
          before=json.loads(Path('build/before.json').read_text('utf8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert len(after)==5566 and before.keys()==after.keys()
          changed={p for p in before if before[p]!=after[p]}
          expected={'index.html','knight/index.html',
                    'knight/gameasync/mapping.js','knight/gameasync/Data/Scripts.rxdata',
                    'knight/js/sl-assets-v229r115.js'}
          assert changed==expected,('Unexpected modifications',changed^expected)
          for p in before:
              if (p.startswith('knight/assets/') or
                  p.startswith('knight/gameasync/Graphics/') or
                  (p.startswith('knight/gameasync/Data/') and not p.endswith('/Scripts.rxdata')) or
                  p in ('knight/js/dpad.js','knight/js/drive.js')):
                  assert before[p]==after[p],('Protected asset changed',p)
          assert 'js/sl-assets-v229r115.js?v=v229r122' in (root/'knight/index.html').read_text('utf8')
          print('PASS only five expected release files; all map/images/walls/events/assets unchanged')
          R122_FILES
          node --check site/knight/js/dpad.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/gameasync/mapping.js

      - name: V229R122 Publish only the two confirmed passage fixes
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
