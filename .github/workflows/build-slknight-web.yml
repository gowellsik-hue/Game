name: build-slknight-web.yml | V4.16 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Resolve final V4.15 deployment
        id: baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BASE_SHA=09c0356b1bb3a077eac596d3d0bb465dcd8e0de5

          gh api \
            --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/build-slknight-web.yml/runs" \
            -f head_sha="$BASE_SHA" \
            -f status=success \
            -f per_page=100 \
            > /tmp/sl416-runs.json

          RUN_ID=$(jq -er \
            --arg sha "$BASE_SHA" \
            '[.workflow_runs[]
              | select(
                  .head_sha == $sha
                  and .head_branch == "main"
                  and .status == "completed"
                  and .conclusion == "success"
                )]
              | sort_by(.created_at)
              | last
              | .id // empty' \
            /tmp/sl416-runs.json)

          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" \
            > /tmp/sl416-jobs.json

          jq -e \
            '[.jobs[]
              | select(
                  .name == "deploy"
                  and .conclusion == "success"
                )]
              | length == 1' \
            /tmp/sl416-jobs.json

          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            > /tmp/sl416-artifacts.json

          jq -e \
            '[.artifacts[]
              | select(
                  .name == "github-pages"
                  and .expired == false
                  and .size_in_bytes > 0
                )]
              | length == 1' \
            /tmp/sl416-artifacts.json

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

          echo "PASS final V4.15 commit $BASE_SHA"
          echo "PASS successful deployment $RUN_ID"

      - name: Restore final V4.15 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: ${{ steps.baseline.outputs.run_id }}
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify original game
        shell: bash
        run: |
          set -euo pipefail

          test -s baseline/artifact.tar

          mkdir -p site
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          import json

          root = Path('site')
          game = root/'knight/gameasync'

          pre = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          before = {
              p.relative_to(root).as_posix():
                  hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          assert len(before) == 6086, len(before)

          required = [
              'System',
              'Map007',
              'Map029',
              'Map047'
          ]

          for name in required:
              p = game/'Data'/(pre+name+'.rxdata')
              assert p.is_file(), name
              assert p.stat().st_size > 4, name

          scripts = game/'Data/Scripts.rxdata'

          assert scripts.is_file()
          assert scripts.stat().st_size > 100000

          loader = root/'knight/js/sl-assets-v229r115.js'

          assert loader.read_bytes().count(
              b"var version='V4.15';"
          ) == 1

          for name in ('index.html', 'knight/index.html'):
              assert b'V4.15' in (root/name).read_bytes(), name

          names = [
              pre+'System.rxdata',
              pre+'Map007.rxdata'
          ]

          old_md5 = {
              name: hashlib.md5(
                  (game/'Data'/name).read_bytes()
              ).hexdigest()
              for name in names
          }

          Path('/tmp/sl416-before.json').write_text(
              json.dumps(before, sort_keys=True),
              'utf8'
          )

          Path('/tmp/sl416-md5.json').write_text(
              json.dumps(old_md5),
              'utf8'
          )

          print('PASS final V4.15 baseline')
          print('PASS 6086 original files')
          PYTHON

      - name: Restore original character creation
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl416-patch.rb <<'RUBY'
          require 'zlib'

          module RPG
            %w[
              Map
              MapInfo
              Tileset
              Event
              EventCommand
              MoveRoute
              MoveCommand
              AudioFile
              CommonEvent
              System
              Item
            ].each do |n|
              const_set(n, Class.new)
            end

            Event.const_set(:Page, Class.new)
            Event::Page.const_set(:Condition, Class.new)
            Event::Page.const_set(:Graphic, Class.new)

            System.const_set(:Words, Class.new)
            System.const_set(:TestBattler, Class.new)
          end

          %w[Table Tone Color].each do |n|
            Object.const_set(n, Class.new do
              def self._load(raw)
                o = allocate
                o.instance_variable_set(:@raw, raw)
                o
              end

              def _dump(depth)
                @raw
              end
            end)
          end

          def iv(o,k)
            o.instance_variable_get(k)
          end

          def check(ok,msg)
            raise msg unless ok
          end

          root = 'site/knight/gameasync/Data'

          pre = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          paths = %w[System Map007 Map047].to_h do |n|
            [n, File.join(root, pre+n+'.rxdata')]
          end

          raw = paths.transform_values do |f|
            File.binread(f)
          end

          sys = Marshal.load(raw.fetch('System'))

          creation = Marshal.load(
            raw.fetch('Map007')
          )

          island = Marshal.load(
            raw.fetch('Map047')
          )

          keys = [
            :@start_map_id,
            :@start_x,
            :@start_y
          ]

          old_start = keys.map do |k|
            iv(sys,k)
          end

          check(
            old_start[0] == 47 &&
            old_start.all? { |v| v.is_a?(Integer) },
            'Current Talking Island start missing'
          )

          _,x,y = old_start

          check(
            x.between?(0,iv(island,:@width)-1) &&
            y.between?(0,iv(island,:@height)-1),
            'Island start out of bounds'
          )

          check(
            9 < iv(creation,:@width) &&
            6 < iv(creation,:@height),
            'Original creation coordinates out of bounds'
          )

          scripts = Marshal.load(
            File.binread(
              File.join(root,'Scripts.rxdata')
            )
          )

          check(
            scripts.size == 137,
            'Unexpected script count'
          )

          source = scripts.map do |r|
            [
              r[1].to_s,
              Zlib::Inflate.inflate(r[2])
            ]
          end

          starts = source.select do |_,s|
            s.match?(
              /\$data_system\.start_map_id\b|\$data_system\.start_[xy]\b/
            )
          end

          check(
            starts.map(&:first) == ['Scene_Title'],
            'Unexpected startup references'
          )

          title = starts.first[1]

          check(
            title.include?(
              '$game_map.setup($data_system.start_map_id)'
            ) &&
            title.include?(
              '$game_player.moveto($data_system.start_x, $data_system.start_y)'
            ) &&
            title.include?(
              '$game_party.setup_starting_members'
            ),
            'Original new game path missing'
          )

          load = source.find do |n,_|
            n == 'Scene_Load'
          end

          check(
            load &&
            load[1].match?(
              /\$game_map\s*=\s*Marshal\.load\(file\)/
            ) &&
            load[1].match?(
              /\$game_player\s*=\s*Marshal\.load\(file\)/
            ),
            'Original save load path missing'
          )

          event = iv(
            creation,
            :@events
          ).fetch(1)

          check(
            iv(event,:@id) == 1 &&
            iv(event,:@name) == 'EV001',
            'Creation event identity mismatch'
          )

          pages = iv(event,:@pages)

          check(
            pages.size == 1 &&
            iv(pages[0],:@trigger) == 4,
            'Creation event page mismatch'
          )

          condition = iv(
            pages[0],
            :@condition
          )

          condition_keys = [
            :@switch1_valid,
            :@switch2_valid,
            :@variable_valid,
            :@self_switch_valid
          ]

          check(
            condition_keys.none? {
              |k| iv(condition,k)
            },
            'Creation page unexpectedly conditional'
          )

          list = iv(pages[0],:@list)

          codes = list.map do |c|
            iv(c,:@code)
          end

          check(
            list.size == 121 &&
            codes.count(102) == 2 &&
            codes.count(303) == 1 &&
            codes.include?(126) &&
            codes.include?(209),
            'Original creation command structure mismatch'
          )

          transfers = list.each_index.select do |i|
            codes[i] == 201
          end

          check(
            transfers == [119] &&
            codes[120] == 0,
            'Unexpected creation transfer commands'
          )

          command = list[119]

          params = iv(
            command,
            :@parameters
          )

          old_params = params.dup

          check(
            iv(command,:@indent) == 0 &&
            old_params == [0,29,83,52,2,1],
            'Original creation transfer mismatch'
          )

          before_sys = Marshal.dump(sys)
          before_map = Marshal.dump(creation)

          keys.zip([7,9,6]).each do |k,v|
            sys.instance_variable_set(k,v)
          end

          params[1,3] = [47,x,y]

          new_sys = Marshal.dump(sys)
          new_map = Marshal.dump(creation)

          verified_sys = Marshal.load(new_sys)
          verified_map = Marshal.load(new_map)

          check(
            keys.map {
              |k| iv(verified_sys,k)
            } == [7,9,6],
            'New game start mismatch'
          )

          verified_event = iv(
            verified_map,
            :@events
          ).fetch(1)

          verified_page = iv(
            verified_event,
            :@pages
          )[0]

          verified_list = iv(
            verified_page,
            :@list
          )

          verified_params = iv(
            verified_list[119],
            :@parameters
          )

          check(
            verified_params == [0,47,x,y,2,1],
            'New creation destination mismatch'
          )

          keys.zip(old_start).each do |k,v|
            verified_sys.instance_variable_set(k,v)
          end

          verified_params.replace(old_params)

          check(
            Marshal.dump(verified_sys) == before_sys,
            'Unapproved System change'
          )

          check(
            Marshal.dump(verified_map) == before_map,
            'Unapproved Map007 change'
          )

          File.binwrite(
            paths.fetch('System'),
            new_sys
          )

          File.binwrite(
            paths.fetch('Map007'),
            new_map
          )

          check(
            Marshal.dump(
              Marshal.load(
                File.binread(
                  paths.fetch('System')
                )
              )
            ) == new_sys,
            'System roundtrip failed'
          )

          check(
            Marshal.dump(
              Marshal.load(
                File.binread(
                  paths.fetch('Map007')
                )
              )
            ) == new_map,
            'Map007 roundtrip failed'
          )

          puts "PASS previous island start #{old_start.inspect}"
          puts 'PASS new game starts at Map007 (9,6)'
          puts "PASS existing creation transfers to Map047 (#{x},#{y})"
          puts 'PASS 120 untouched creation commands'
          puts 'PASS one existing transfer command changed'
          puts 'PASS existing save load path preserved'
          puts 'PASS all 137 game scripts untouched'
          RUBY

          ruby -c /tmp/sl416-patch.rb
          ruby /tmp/sl416-patch.rb

      - name: Update V4.16 data references
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          import json
          import re

          root = Path('site')
          game = root/'knight/gameasync'

          old_md5 = json.loads(
              Path('/tmp/sl416-md5.json').read_text('utf8')
          )

          mapper = game/'mapping.js'

          old_mapping_digest = hashlib.sha256(
              mapper.read_bytes()
          ).hexdigest()[:16]

          s = mapper.read_bytes()

          for name, previous in old_md5.items():
              marker = ('Data/'+name+'?h=').encode('ascii')

              pattern = (
                  re.escape(marker)
                  + rb'[0-9a-f]{32}'
              )

              expected = marker+previous.encode('ascii')

              assert re.findall(
                  pattern,s
              ) == [expected], name

              digest = hashlib.md5(
                  (game/'Data'/name).read_bytes()
              ).hexdigest()

              assert digest != previous, name

              updated = marker+digest.encode('ascii')

              s = re.sub(
                  pattern,
                  lambda _: updated,
                  s
              )

              assert s.count(updated) == 1, name

              print('PASS updated data reference',name,digest)

          mapper.write_bytes(s)

          mapping_digest = hashlib.sha256(
              mapper.read_bytes()
          ).hexdigest()[:16]

          bitmap_digest = hashlib.sha256(
              (game/'bitmap-map.js').read_bytes()
          ).hexdigest()[:16]

          loader = root/'knight/js/sl-assets-v229r115.js'

          old_loader_digest = hashlib.sha256(
              loader.read_bytes()
          ).hexdigest()[:16]

          s = loader.read_bytes()

          old = b"var version='V4.15';"
          new = b"var version='V4.16';"

          assert s.count(old) == 1

          loader.write_bytes(
              s.replace(old,new)
          )

          loader_digest = hashlib.sha256(
              loader.read_bytes()
          ).hexdigest()[:16]

          page = root/'knight/index.html'

          s = page.read_text('utf8')

          references = [
              (
                  'gameasync/mapping.js?v=v4.15&h='
                  + old_mapping_digest,
                  'gameasync/mapping.js?v=v4.16&h='
                  + mapping_digest,
                  1
              ),
              (
                  'gameasync/bitmap-map.js?v=v4.15&h='
                  + bitmap_digest,
                  'gameasync/bitmap-map.js?v=v4.16&h='
                  + bitmap_digest,
                  2
              ),
              (
                  'js/sl-assets-v229r115.js?v=v4.15&h='
                  + old_loader_digest,
                  'js/sl-assets-v229r115.js?v=v4.16&h='
                  + loader_digest,
                  1
              )
          ]

          for old,new,count in references:
              assert s.count(old) == count, old

              s = s.replace(old,new)

              assert s.count(new) == count, new

          assert 'V4.15' in s

          s = s.replace(
              'V4.15','V4.16'
          ).replace(
              'v4.15','v4.16'
          )

          page.write_text(s,'utf8')

          index_page = root/'index.html'

          s = index_page.read_text('utf8')

          assert 'V4.15' in s

          index_page.write_text(
              s.replace(
                  'V4.15','V4.16'
              ).replace(
                  'v4.15','v4.16'
              ),
              'utf8'
          )

          print('PASS updated mapping reference')
          print('PASS updated version references')
          PYTHON

      - name: Verify exact modification scope
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          import json

          root = Path('site')

          pre = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          before = json.loads(
              Path('/tmp/sl416-before.json').read_text('utf8')
          )

          after = {
              p.relative_to(root).as_posix():
                  hashlib.sha256(
                      p.read_bytes()
                  ).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          assert len(after) == 6086, len(after)

          assert set(before) == set(after)

          changed = {
              k for k in before
              if before[k] != after[k]
          }

          expected = {
              'knight/gameasync/Data/'+pre+'System.rxdata',
              'knight/gameasync/Data/'+pre+'Map007.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'knight/index.html',
              'index.html'
          }

          assert changed == expected, sorted(changed ^ expected)

          assert all(
              before[k] == after[k]
              for k in before
              if k not in expected
          )

          protected = [
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/Data/'+pre+'Map029.rxdata',
              'knight/gameasync/Data/'+pre+'Map047.rxdata',
              'knight/gameasync/bitmap-map.js',
              'knight/js/drive.js',
              'knight/js/dpad.js',
              'knight/mkxp.js',
              'knight/mkxp.wasm'
          ]

          for name in protected:
              assert name in before, name
              assert before[name] == after[name], name

          print('PASS six approved files modified')
          print('PASS 6080 original files unchanged')
          print('PASS all original game scripts unchanged')
          print('PASS existing character creation commands preserved')
          print('PASS Talking Island map unchanged')
          print('PASS companion system unchanged')
          print('PASS combat calculations unchanged')
          print('PASS inventory and menu unchanged')
          print('PASS HUD and mobile controls unchanged')
          print('PASS original save implementation unchanged')
          print('PASS original resource packs unchanged')
          print('PASS original engine unchanged')
          print('PASS V4.16')
          PYTHON

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/gameasync/bitmap-map.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: Upload V4.16
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
