
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R141
# BASE: exact successful V229R140 Pages artifact (run 40841869706).
# ONLY REQUEST: move player arrival and monster initial/respawn coordinates
# LEFT-DOWN by ONE native isometric grid step on TI Dungeon 1F/2F.
# Native projection: px=12*(x+y), py=6*(y-x), so native x-1 gives (-12,+6).
# Preserve Y values. Do not apply (-1,+1), which preserves x+y parity.
# DO NOT MODIFY: 384/385, R94 data, map graphics, movement engine,
# gameplay, NPCs, stairs triggers, monster data, or Map047.
name: build-slknight-web.yml | V229R141 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R141 Confirm the exact successful R140 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, urllib.request
          rid=40841869706
          sha='73a41cbeead1c99eeee8299eb4d9b34f0f0d0f12'
          url=f'https://api.github.com/repos/gowellsik-hue/Game/actions/runs/{rid}'
          req=urllib.request.Request(url,headers={
            'Authorization':'Bearer '+os.environ['GH_TOKEN'],
            'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as response:
            r=json.load(response)
          assert (r['id'],r['head_sha'],r['conclusion'])==(rid,sha,'success')
          print('PASS: exact successful R140 baseline')
          PY

      - name: V229R141 Download unchanged R140 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40841869706
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V229R141 Extract R140 and record baseline fingerprints
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('site')
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          assert len(hashes)==5663,('R140 file count changed',len(hashes))
          prefix='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          expected={
            29:'fce4017389aed05bbb58572313c4bb35ea1fa2b5887ba9ff47bf86bc766b8801',
            45:'a900c1354e9a18c7f7b9b83464a44127ad6ed1d8f7cf748a7c710192f529aa92',
            46:'8dd9a8ea8b91eaa1c70323a79714ec5abfe1a5ca349f8aec053e99b052178318'}
          for mid,sha in expected.items():
            assert hashes[prefix+('Map%03d.rxdata' % mid)]==sha,mid
          assert 'V229R140' in (root/'index.html').read_text('utf8')
          assert 'V229R140' in (root/'knight/index.html').read_text('utf8')
          (Path('build')/'before.json').write_text(json.dumps(hashes,sort_keys=True))
          print('PASS: R140 all 5663 files and 3 original maps match')
          PY

      - name: V229R141 Move player arrivals and monster spawn X one cell only
        shell: bash
        run: |
          set -euo pipefail
          cat > build/shift-only.rb <<'RUBY'
          module RPG
            class Map; end
            class Event; end
            class Event::Page; end
            class Event::Page::Condition; end
            class Event::Page::Graphic; end
            class EventCommand; end
            class MoveCommand; end
            class MoveRoute; end
            class MapInfo; end
            class AudioFile; end
            class Tileset; end
          end
          class Table
            def self._load(raw)
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end
            def _dump(_depth); @raw; end
          end
          class Tone
            def self._load(raw)
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end
            def _dump(_depth); @raw; end
          end
          class Color
            def self._load(raw)
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end
            def _dump(_depth); @raw; end
          end

          root=ARGV.fetch(0)
          dir=File.join(root,'knight/gameasync/Data')
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          count={}
          [29,45,46].each do |mid|
            path=File.join(dir,prefix+('Map%03d.rxdata' % mid))
            original=File.binread(path)
            map=Marshal.load(original)
            raise 'Noncanonical original RPG Map' unless Marshal.dump(map)==original
            ev=map.instance_variable_get(:@events)
            changes=[]
            change=lambda do |obj,var,new_value|
              old=obj.instance_variable_get(var)
              raise 'No-op or unexpected coordinate modification' if old==new_value
              changes << [obj,var,old]
              obj.instance_variable_set(var,new_value)
            end
            edit_params=lambda do |cmd,index,expected,replacement|
              p=cmd.instance_variable_get(:@parameters)
              raise 'Unexpected player or respawn coordinates' unless p[index]==expected
              altered=p.dup
              altered[index]=replacement
              change.call(cmd,:@parameters,altered)
            end

            if mid==29
              found=[]
              ev.each_value do |event|
                event.instance_variable_get(:@pages).each do |page|
                  page.instance_variable_get(:@list).each do |cmd|
                    next unless cmd.instance_variable_get(:@code)==201
                    p=cmd.instance_variable_get(:@parameters)
                    next unless p[0]==0 && p[1]==45
                    raise 'Unexpected 1F entry map or Y' unless p==[0,45,96,74,0,1]
                    edit_params.call(cmd,2,96,95)
                    found << event.instance_variable_get(:@id)
                  end
                end
              end
              raise 'Expected one existing 1F transfer' unless found==[11]
              count[mid]={player_in:1}
            else
              # Keep every non-monster event's map position unchanged.
              # Also keep all event pages, AI, drops, stairs triggers and graphics.
              monsters=0
              respawns=0
              ev.each_value do |event|
                name=event.instance_variable_get(:@name).to_s
                next unless name.start_with?('[ID')
                next if (mid==45 && event.instance_variable_get(:@id)==13) ||
                        (mid==46 && event.instance_variable_get(:@id)==3)
                x=event.instance_variable_get(:@x)
                change.call(event,:@x,x-1)
                monsters+=1
                event.instance_variable_get(:@pages).each do |page|
                  page.instance_variable_get(:@list).each do |cmd|
                    next unless cmd.instance_variable_get(:@code)==202
                    p=cmd.instance_variable_get(:@parameters)
                    next unless p[0]==0 && p[1]==0
                    edit_params.call(cmd,2,p[2],p[2]-1)
                    respawns+=1
                  end
                end
              end
              raise 'Unexpected number of original monster events' unless monsters==30
              count[mid]={monsters:monsters,respawns:respawns}
              if mid==45
                script=ev.fetch(1).instance_variable_get(:@pages).fetch(0).
                  instance_variable_get(:@list).find{|cmd|cmd.instance_variable_get(:@code)==355}
                params=script.instance_variable_get(:@parameters)
                old=params.fetch(0)
                raise 'Unexpected 2F player arrival script' unless
                  old.include?('player_new_map_id=46') &&
                  old.scan('player_new_x=76').size==1 &&
                  old.include?('player_new_y=94')
                change.call(script,:@parameters,[old.sub('player_new_x=76','player_new_x=75')])
                count[mid][:player_to_2f]=1
              else
                script=ev.fetch(2).instance_variable_get(:@pages).fetch(0).
                  instance_variable_get(:@list).find{|cmd|cmd.instance_variable_get(:@code)==355}
                params=script.instance_variable_get(:@parameters)
                old=params.fetch(0)
                raise 'Unexpected return to 1F player arrival script' unless
                  old.include?('player_new_map_id = 45') &&
                  old.scan('player_new_x = 96').size==1 &&
                  old.include?('player_new_y = 74')
                change.call(script,:@parameters,[old.sub('player_new_x = 96','player_new_x = 95')])
                count[mid][:player_to_1f]=1
              end
            end

            altered=Marshal.dump(map)
            raise 'Original map was not changed' if altered==original
            # Reverse every allowed coordinate mutation in-memory, then check
            # that the entire original serialized RPG Map is byte-identical.
            changes.reverse_each{|obj,var,value|obj.instance_variable_set(var,value)}
            raise 'Non-coordinate game data was modified' unless Marshal.dump(map)==original
            File.binwrite(path,altered)
            puts "PASS Map%03d: %s" % [mid,count[mid].inspect]
          end
          puts 'PASS: player and monster X-only spawn changes, Y unchanged'
          puts 'PASS: R94 collision, all scripts, events other than approved positions preserved'
          RUBY
          ruby -c build/shift-only.rb
          ruby build/shift-only.rb site

      - name: V229R141 Refresh only 3 map hashes and 3 version displays
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          root=Path('site')
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          index=root/'knight/gameasync/mapping.js'
          src=index.read_text('utf8')
          for mid in (29,45,46):
            key=prefix+('Map%03d' % mid)
            path=root/'knight/gameasync/Data'/(key+'.rxdata')
            pattern=r'(Data/'+re.escape(key)+r'\.rxdata\?h=)[0-9a-f]{32}'
            md5=hashlib.md5(path.read_bytes()).hexdigest()
            src,n=re.subn(pattern,lambda m:m.group(1)+md5,src)
            assert n==1,('Missing map cache key',mid,n)
          index.write_text(src,'utf8')
          for name in ('index.html','knight/index.html'):
            path=root/name
            txt=path.read_text('utf8')
            assert 'V229R140' in txt and 'V229R141' not in txt
            path.write_text(txt.replace('V229R140','V229R141').replace('v229r140','v229r141'),'utf8')
          asset=root/'knight/js/sl-assets-v229r115.js'
          src=asset.read_text('utf8')
          assert src.count("var version='V229R140';")==1
          asset.write_text(src.replace("var version='V229R140';","var version='V229R141';"),'utf8')
          assert 'js/sl-assets-v229r115.js?v=v229r141' in (root/'knight/index.html').read_text('utf8')
          print('PASS: 3 map cache entries and existing version stamps only')
          PY
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: V229R141 Enforce minimal file changes and identical collision tiles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('site')
          original=json.loads((Path('build')/'before.json').read_text('utf8'))
          updated={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                   for p in root.rglob('*') if p.is_file()}
          assert original.keys()==updated.keys(),'Original game files added or removed'
          prefix='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          expected={prefix+('Map%03d.rxdata' % mid) for mid in (29,45,46)}
          expected.update(('knight/gameasync/mapping.js','index.html',
                           'knight/index.html','knight/js/sl-assets-v229r115.js'))
          changed={name for name in original if original[name]!=updated[name]}
          assert changed==expected,('Unapproved changed files',sorted(changed^expected))
          assert len(updated)==5663
          print('PASS: only 3 RPG map files, map hash index, and 3 version displays changed')
          print('PASS: Scripts.rxdata, Tilesets.rxdata, Map047, all R94 384/385 unchanged')
          PY

      - name: V229R141 Publish unchanged game with coordinate-only correction
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
