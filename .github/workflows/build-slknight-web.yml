name: XP Engine Isolation Test V2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-slknight-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  ENGINE_REPO: white-axe/mkxp-z-libretro-emscripten
  ENGINE_REF: f0a1ff80f05dd0d1f8ca711485a5b0a601bc7502
  SITE_URL: https://gowellsik-hue.github.io/Game

jobs:
  build:
    name: Test official XP sample
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Install tools
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            unzip \
            innoextract \
            python3 \
            python3-pip

          python3 -m pip install \
            --break-system-packages \
            rpzip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Checkout clean Nostalgist frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          submodules: false
          path: engine

      - name: Reuse exact V7 threaded engine
        run: |
          set -e

          mkdir -p \
            engine/nostalgist/public

          curl -L \
            --fail \
            --retry 3 \
            -H 'Cache-Control: no-cache' \
            "${SITE_URL}/mkxp-z_libretro.js?run=${GITHUB_RUN_ID}" \
            -o engine/nostalgist/public/mkxp-z_libretro.js

          curl -L \
            --fail \
            --retry 3 \
            -H 'Cache-Control: no-cache' \
            "${SITE_URL}/mkxp-z_libretro.wasm?run=${GITHUB_RUN_ID}" \
            -o engine/nostalgist/public/mkxp-z_libretro.wasm

          test -s \
            engine/nostalgist/public/mkxp-z_libretro.js

          test -s \
            engine/nostalgist/public/mkxp-z_libretro.wasm

          echo "=== V7 THREADED ENGINE ==="

          ls -lh \
            engine/nostalgist/public/mkxp-z_libretro.js \
            engine/nostalgist/public/mkxp-z_libretro.wasm

          sha256sum \
            engine/nostalgist/public/mkxp-z_libretro.js \
            engine/nostalgist/public/mkxp-z_libretro.wasm

      - name: Download official RPG Maker XP sample
        run: |
          set -e

          curl -Lk \
            --fail \
            --retry 3 \
            -o knight-blade.zip \
            https://dl.komodo.jp/rpgmakerweb/sample-games/knight-blade-howling-of-kerberos.zip

          echo \
            "a47c9cf1eaa466fc0fcd5e4fff0143881d318a71424fe1fab823aa95acaac58c  knight-blade.zip" \
            | sha256sum -c -

          unzip -q \
            knight-blade.zip

          test -f \
            KN_E/Game.ini

          echo "=== KNIGHT BLADE FOUND ==="

          ls -lh \
            KN_E/Game.ini

      - name: Pack official XP sample
        run: |
          set -e

          rm -f \
            knight-blade.mkxpz

          cd KN_E

          rpzip -r \
            "${GITHUB_WORKSPACE}/knight-blade.mkxpz" \
            *

          cd "${GITHUB_WORKSPACE}"

          test -s \
            knight-blade.mkxpz

          unzip -tq \
            knight-blade.mkxpz \
            >/dev/null

          cp \
            knight-blade.mkxpz \
            engine/nostalgist/public/

          echo "=== KNIGHT BLADE MKXPZ ==="

          ls -lh \
            engine/nostalgist/public/knight-blade.mkxpz

      - name: Download official RPG Maker XP RTP
        run: |
          set -e

          curl -Lk \
            --fail \
            --retry 3 \
            -o xp_rtp104e.exe \
            https://dl.komodo.jp/rpgmakerweb/run-time-packages/xp_rtp104e.exe

          echo \
            "b3bd20ad7f413b40ac233aafd2e061de1dc429c2eadb59d0b3157ba3c47f16b2  xp_rtp104e.exe" \
            | sha256sum -c -

          rm -rf \
            app

          innoextract \
            xp_rtp104e.exe

          test -d \
            app

          echo "=== XP RTP EXTRACTED ==="

      - name: Pack official XP RTP
        run: |
          set -e

          rm -f \
            Standard.mkxpz

          cd app

          rpzip -r \
            "${GITHUB_WORKSPACE}/Standard.mkxpz" \
            *

          cd "${GITHUB_WORKSPACE}"

          test -s \
            Standard.mkxpz

          unzip -tq \
            Standard.mkxpz \
            >/dev/null

          cp \
            Standard.mkxpz \
            engine/nostalgist/public/

          echo "=== XP RTP MKXPZ ==="

          ls -lh \
            engine/nostalgist/public/Standard.mkxpz

      - name: Configure exact upstream XP test
        run: |
          set -e

          cat > engine/nostalgist/.env <<'ENVEOF'
          VITE_CORE_JS_PATH=./mkxp-z_libretro.js
          VITE_CORE_WASM_PATH=./mkxp-z_libretro.wasm
          VITE_GAME_NAME=KNight-Blade XP Engine Test
          VITE_GAME_PATH=./knight-blade.mkxpz
          VITE_RTP_PATH=./Standard.mkxpz
          VITE_XP_CONTROLS=true
          VITE_HAVE_OPFS=true
          VITE_REQUIRE_OPFS=false
          ENVEOF

          echo "=== TEST ENV ==="

          cat \
            engine/nostalgist/.env

      - name: Install frontend packages
        working-directory: engine/nostalgist
        run: |
          set -e

          npm install

      - name: Build clean upstream frontend
        working-directory: engine/nostalgist
        run: |
          set -e

          npm run build

          touch \
            dist/.nojekyll

      - name: Verify XP isolation package
        run: |
          set -e

          test -s \
            engine/nostalgist/dist/index.html

          test -s \
            engine/nostalgist/dist/coi-serviceworker.min.js

          test -s \
            engine/nostalgist/dist/mkxp-z_libretro.js

          test -s \
            engine/nostalgist/dist/mkxp-z_libretro.wasm

          test -s \
            engine/nostalgist/dist/knight-blade.mkxpz

          test -s \
            engine/nostalgist/dist/Standard.mkxpz

          echo \
            "XP_ENGINE_ISOLATION_V2_READY"

          ls -lh \
            engine/nostalgist/dist/mkxp-z_libretro.js \
            engine/nostalgist/dist/mkxp-z_libretro.wasm \
            engine/nostalgist/dist/knight-blade.mkxpz \
            engine/nostalgist/dist/Standard.mkxpz

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: engine/nostalgist/dist

  deploy:
    name: Deploy GitHub Pages

    needs:
      - build

    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
