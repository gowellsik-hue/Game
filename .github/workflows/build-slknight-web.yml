name: Deploy SLKnight Mobile Touch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-slknight-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  ENGINE_REPO: white-axe/mkxp-z-libretro-emscripten
  ENGINE_REF: f0a1ff80f05dd0d1f8ca711485a5b0a601bc7502

  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a

jobs:

  build:
    name: Build SLKnight mobile browser version
    runs-on: ubuntu-24.04
    timeout-minutes: 70

    steps:

      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            automake \
            libtool \
            zip \
            unzip \
            curl \
            universal-ctags \
            ruby \
            meson \
            cmake \
            ninja-build \
            python3 \
            python3-pip

          python3 -m pip install \
            --break-system-packages \
            rpzip


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'


      - name: Set up Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.8


      - name: Checkout mkxp-z web engine
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          submodules: recursive
          path: engine


      - name: Set up WASI SDK
        run: |
          set -e

          curl -L \
            --fail \
            --retry 3 \
            -o "${RUNNER_TEMP}/wasi-sdk.tar.gz" \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-30/wasi-sdk-30.0-x86_64-linux.tar.gz

          mkdir -p \
            "${RUNNER_TEMP}/wasi-sdk"

          tar -xzf \
            "${RUNNER_TEMP}/wasi-sdk.tar.gz" \
            -C "${RUNNER_TEMP}/wasi-sdk" \
            --strip-components=1


      - name: Set up Binaryen
        run: |
          set -e

          curl -L \
            --fail \
            --retry 3 \
            -o "${RUNNER_TEMP}/binaryen.tar.gz" \
            https://github.com/WebAssembly/binaryen/releases/download/version_126/binaryen-version_126-x86_64-linux.tar.gz

          mkdir -p \
            "${RUNNER_TEMP}/binaryen"

          tar -xzf \
            "${RUNNER_TEMP}/binaryen.tar.gz" \
            -C "${RUNNER_TEMP}/binaryen" \
            --strip-components=1


      - name: Build mkxp-z stage 1
        run: |
          set -e

          cd engine/mkxp-z/libretro

          CLICOLOR_FORCE=1 \
          make \
            -j "$(nproc)" \
            WASI_SDK="${RUNNER_TEMP}/wasi-sdk" \
            WASM_OPT="${RUNNER_TEMP}/binaryen/bin/wasm-opt"


      - name: Configure mkxp-z core
        run: |
          set -e

          cat > "${RUNNER_TEMP}/cross.ini" <<EOF
          [binaries]
          c = 'emcc'
          cpp = 'em++'
          ar = 'emar'
          cmake = 'cmake'

          [host_machine]
          system = 'emscripten'
          cpu_family = 'wasm32'
          cpu = 'wasm32'
          endian = 'little'

          [properties]
          cmake_toolchain_file = '$(em-config EMSCRIPTEN_ROOT)/cmake/Modules/Platform/Emscripten.cmake'
          EOF

          cd engine/mkxp-z

          CLICOLOR_FORCE=1 \
          meson setup \
            build \
            --cross-file "${RUNNER_TEMP}/cross.ini" \
            --buildtype release \
            -Db_lto=true \
            -Dlibretro=true \
            -Dlibretro_save_states=true \
            -Demscripten_threaded=true


      - name: Build mkxp-z core
        run: |
          set -e

          cd engine/mkxp-z/build

          CLICOLOR_FORCE=1 \
          ninja -v


      - name: Build WebAssembly frontend
        run: |
          set -e

          mv \
            engine/mkxp-z/build/mkxp-z_libretro.a \
            engine/retroarch/libretro_emscripten.a

          cd engine/retroarch

          CLICOLOR_FORCE=1 \
          emmake make \
            -f Makefile.emscripten \
            LIBRETRO=mkxp-z \
            HAVE_THREADS=1 \
            PROXY_TO_PTHREAD=1 \
            HAVE_AUDIOWORKLET=1 \
            HAVE_RWEBAUDIO=0 \
            HAVE_AL=0 \
            HAVE_WASMFS=1 \
            HAVE_EXTRA_WASMFS=1


      - name: Download SLKnight release
        run: |
          set -e

          curl -L \
            --fail \
            --retry 3 \
            -o slknight.zip \
            "${GAME_URL}"

          echo \
            "${GAME_SHA256}  slknight.zip" \
            | sha256sum -c -

          mkdir -p game

          unzip \
            -q \
            slknight.zip \
            -d game

          test -f \
            game/SLKnight_Android_JoiPlay/Game.ini


      - name: Patch SLKnight for browser engine
        run: |
          set -e

          GAME_DIR="game/SLKnight_Android_JoiPlay"

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "game/SLKnight_Android_JoiPlay/Game.ini"
          )

          raw = p.read_bytes().splitlines()

          out = []

          for line in raw:
              if line.startswith(b"Title="):
                  out.append(
                      b"Title=SLKnight"
                  )
              else:
                  out.append(line)

          p.write_bytes(
              b"\r\n".join(out)
              + b"\r\n"
          )
          PY


          ruby -rzlib - <<'RB'
          path =
            'game/SLKnight_Android_JoiPlay/Data/DCDIJDXDTWTQXQXJPWCOSXPLCLOLNGRIJOQARTLOScripts.rxdata'

          scripts =
            Marshal.load(
              File.binread(path)
            )

          changed_resize = false
          changed_browser = false

          scripts.each do |entry|

            next unless \
              entry.is_a?(Array) &&
              entry.length >= 3

            begin
              src =
                Zlib::Inflate.inflate(
                  entry[2]
                )
            rescue
              next
            end

            patched = src.dup


            resize_old =
              "if defined?($joiplay) && $joiplay\r\n" \
              "  begin\r\n" \
              "    Graphics.resize_screen($window_width, $window_height)\r\n" \
              "  rescue\r\n" \
              "  end\r\n" \
              "else\r\n" \
              "  Win32API.SetWindowPos($window_width, $window_height)\r\n" \
              "end"

            resize_new =
              "begin\r\n" \
              "  Graphics.resize_screen($window_width, $window_height)\r\n" \
              "rescue\r\n" \
              "end"


            if patched.include?(resize_old)

              patched.sub!(
                resize_old,
                resize_new
              )

              changed_resize = true

            end


            browser_old =
              "if defined?($joiplay) && $joiplay\r\n" \
              "      return\r\n" \
              "    end\r\n" \
              "    se = Win32API.new(\"shell32\", \"ShellExecute\", ['L','P','P','P','P','L'], 'L' )\r\n" \
              "    se.Call(0, \"open\", url, 0, 0, 0)"


            if patched.include?(browser_old)

              patched.sub!(
                browser_old,
                "return"
              )

              changed_browser = true

            end


            next if patched == src

            entry[2] =
              Zlib::Deflate.deflate(
                patched
              )

          end


          abort \
            'resize patch not found' \
            unless changed_resize

          abort \
            'browser patch not found' \
            unless changed_browser


          File.binwrite(
            path,
            Marshal.dump(scripts)
          )

          puts \
            'SLKnight browser patches applied'
          RB


          rm -f \
            "${GAME_DIR}/README_Android.txt"


      - name: Pack game as mkxpz
        run: |
          set -e

          cd \
            game/SLKnight_Android_JoiPlay

          rpzip \
            -r \
            "${GITHUB_WORKSPACE}/slknight.mkxpz" \
            *

          cd \
            "${GITHUB_WORKSPACE}"

          ls -lh \
            slknight.mkxpz


      - name: Patch mobile touch frontend
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path


          # --------------------------------------------------
          # viewport
          # --------------------------------------------------

          p = Path(
              "engine/nostalgist/index.html"
          )

          html = p.read_text(
              encoding="utf-8"
          )

          html = html.replace(
              '<meta name="viewport" content="width=device-width, initial-scale=1.0" />',
              '<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />',
              1
          )

          html = html.replace(
              '<p id="user-activation-prompt" style="display: none; font-size: 100px">',
              '<p id="user-activation-prompt" style="display:none;font-size:32px;text-align:center;line-height:1.5">터치해서 시작<br>▶',
              1
          )

          p.write_text(
              html,
              encoding="utf-8"
          )


          # --------------------------------------------------
          # main.ts
          # --------------------------------------------------

          p = Path(
              "engine/nostalgist/src/main.ts"
          )

          text = p.read_text(
              encoding="utf-8"
          )


          # --------------------------------------------------
          # visible runtime error box
          # --------------------------------------------------

          game_name_marker = '''if (GAME_NAME !== null) {
            document.title = GAME_NAME;
          }
          '''

          error_support = r'''

          const slErrorBox =
            document.createElement("div");

          slErrorBox.id =
            "sl-runtime-error";

          slErrorBox.style.cssText = `
            display:none;
            position:fixed;
            left:12px;
            right:12px;
            top:12px;
            z-index:99999;
            padding:12px 14px;
            border-radius:10px;
            background:rgba(80,0,0,.94);
            border:1px solid rgba(255,120,120,.8);
            color:white;
            font:13px/1.45 system-ui,sans-serif;
            white-space:pre-wrap;
            word-break:break-word;
            pointer-events:auto;
          `;

          document.body.appendChild(
            slErrorBox
          );

          const showSlError =
            (message: string) => {

              slErrorBox.textContent =
                "SLKnight 실행 오류\n\n" +
                message;

              slErrorBox.style.display =
                "block";

            };

          window.addEventListener(
            "error",
            (event) => {

              showSlError(
                event.message ||
                "Unknown browser error"
              );

            }
          );

          window.addEventListener(
            "unhandledrejection",
            (event) => {

              showSlError(
                String(
                  event.reason ??
                  "Unhandled promise rejection"
                )
              );

            }
          );

          '''

          if game_name_marker not in text:
              raise SystemExit(
                  "PATCH FAILED: GAME_NAME marker"
              )

          text = text.replace(
              game_name_marker,
              game_name_marker +
              error_support,
              1
          )


          # --------------------------------------------------
          # replace final game start
          # --------------------------------------------------

          start_marker =
              "await nostalgist.start();"


          mobile_touch_code = r'''

          // ==================================================
          // SLKnight Mobile Touch UI
          // ==================================================

          const stockGamepad =
            document.getElementById(
              "gamepad-target"
            );

          if (stockGamepad !== null) {
            stockGamepad.style.setProperty(
              "display",
              "none",
              "important"
            );
          }


          const mobileStyle =
            document.createElement(
              "style"
            );

          mobileStyle.textContent = `

            html,
            body {
              margin:0 !important;
              width:100% !important;
              height:100% !important;
              overflow:hidden !important;
              overscroll-behavior:none !important;
              touch-action:none !important;
              user-select:none !important;
              -webkit-user-select:none !important;
              -webkit-touch-callout:none !important;
              background:#000 !important;
            }

            #nostalgist-canvas {
              touch-action:none !important;
              user-select:none !important;
              -webkit-user-select:none !important;
            }

            #gamepad-target {
              display:none !important;
              pointer-events:none !important;
            }


            #sl-mobile-ui {
              position:fixed;
              inset:0;
              z-index:5000;
              pointer-events:none;
              touch-action:none;
            }


            #sl-joystick {
              position:absolute;

              left:
                max(
                  14px,
                  env(safe-area-inset-left)
                );

              bottom:
                max(
                  16px,
                  env(safe-area-inset-bottom)
                );

              width:178px;
              height:178px;

              border-radius:50%;

              pointer-events:auto;
              touch-action:none;
            }


            #sl-joy-base {
              position:absolute;

              left:19px;
              top:19px;

              width:140px;
              height:140px;

              border-radius:50%;

              border:
                2px solid
                rgba(230,230,230,.38);

              background:
                rgba(0,0,0,.18);

              box-shadow:
                inset 0 0 30px
                rgba(255,255,255,.03);
            }


            #sl-joy-knob {
              position:absolute;

              left:54px;
              top:54px;

              width:70px;
              height:70px;

              border-radius:50%;

              border:
                2px solid
                rgba(255,255,255,.62);

              background:
                rgba(40,40,40,.62);

              box-shadow:
                0 3px 14px
                rgba(0,0,0,.45);

              transform:
                translate(
                  0px,
                  0px
                );
            }


            #sl-actions {
              position:absolute;

              right:
                max(
                  14px,
                  env(safe-area-inset-right)
                );

              bottom:
                max(
                  14px,
                  env(safe-area-inset-bottom)
                );

              width:215px;
              height:205px;

              pointer-events:none;
            }


            .sl-touch-btn {
              position:absolute;

              display:flex;
              justify-content:center;
              align-items:center;

              box-sizing:border-box;

              border-radius:50%;

              border:
                2px solid
                rgba(255,255,255,.48);

              background:
                rgba(0,0,0,.38);

              color:
                rgba(255,255,255,.86);

              font:
                600 14px/1
                system-ui,sans-serif;

              text-align:center;

              pointer-events:auto;
              touch-action:none;

              box-shadow:
                0 4px 14px
                rgba(0,0,0,.35);

              backdrop-filter:
                blur(2px);
            }


            .sl-touch-btn.active {
              transform:scale(.93);

              background:
                rgba(255,255,255,.22);

              border-color:
                rgba(255,255,255,.9);
            }


            #sl-btn-f {
              width:88px;
              height:88px;

              right:0;
              bottom:32px;

              font-size:16px;
            }


            #sl-btn-h {
              width:58px;
              height:58px;

              right:94px;
              bottom:0;
            }


            #sl-btn-e {
              width:58px;
              height:58px;

              right:105px;
              bottom:70px;
            }


            #sl-btn-tab {
              width:58px;
              height:58px;

              right:55px;
              bottom:132px;

              font-size:11px;
            }


            #sl-hotbar {
              position:absolute;

              left:50%;
              bottom:
                max(
                  12px,
                  env(safe-area-inset-bottom)
                );

              transform:
                translateX(-50%);

              display:flex;
              gap:5px;

              pointer-events:auto;
            }


            .sl-hotkey {
              width:37px;
              height:37px;

              border-radius:9px;

              border:
                1px solid
                rgba(255,255,255,.38);

              background:
                rgba(0,0,0,.42);

              color:
                rgba(255,255,255,.82);

              font:
                600 14px
                system-ui,sans-serif;

              display:flex;
              align-items:center;
              justify-content:center;

              pointer-events:auto;
              touch-action:none;
            }


            .sl-hotkey.active {
              background:
                rgba(255,255,255,.25);

              transform:
                scale(.93);
            }


            #sl-control-hint {
              position:absolute;

              left:50%;
              top:
                max(
                  7px,
                  env(safe-area-inset-top)
                );

              transform:
                translateX(-50%);

              padding:
                4px 9px;

              border-radius:
                7px;

              background:
                rgba(0,0,0,.38);

              color:
                rgba(255,255,255,.62);

              font:
                11px
                system-ui,sans-serif;

              white-space:
                nowrap;

              pointer-events:none;

              opacity:.9;
            }


            @media
              (orientation:portrait) {

              #sl-joystick {
                width:155px;
                height:155px;
              }

              #sl-joy-base {
                left:17px;
                top:17px;

                width:121px;
                height:121px;
              }

              #sl-joy-knob {
                left:49px;
                top:49px;

                width:57px;
                height:57px;
              }

              #sl-actions {
                transform:
                  scale(.88);

                transform-origin:
                  right bottom;
              }

              #sl-hotbar {
                bottom:
                  185px;
              }

              .sl-hotkey {
                width:34px;
                height:34px;

                font-size:
                  13px;
              }

            }

          `;

          document.head.appendChild(
            mobileStyle
          );


          const mobileUi =
            document.createElement(
              "div"
            );

          mobileUi.id =
            "sl-mobile-ui";

          mobileUi.innerHTML = `

            <div id="sl-control-hint">
              왼쪽 이동 · 오른쪽 터치 액션
            </div>

            <div id="sl-joystick">

              <div
                id="sl-joy-base">
              </div>

              <div
                id="sl-joy-knob">
              </div>

            </div>


            <div id="sl-actions">

              <button
                id="sl-btn-f"
                class="sl-touch-btn"
                type="button">
                공격<br>F
              </button>

              <button
                id="sl-btn-h"
                class="sl-touch-btn"
                type="button">
                H
              </button>

              <button
                id="sl-btn-e"
                class="sl-touch-btn"
                type="button">
                E
              </button>

              <button
                id="sl-btn-tab"
                class="sl-touch-btn"
                type="button">
                TAB
              </button>

            </div>


            <div id="sl-hotbar">

              <button
                class="sl-hotkey"
                data-sl-key="1">
                1
              </button>

              <button
                class="sl-hotkey"
                data-sl-key="2">
                2
              </button>

              <button
                class="sl-hotkey"
                data-sl-key="3">
                3
              </button>

              <button
                class="sl-hotkey"
                data-sl-key="4">
                4
              </button>

              <button
                class="sl-hotkey"
                data-sl-key="5">
                5
              </button>

              <button
                class="sl-hotkey"
                data-sl-key="6">
                6
              </button>

              <button
                class="sl-hotkey"
                data-sl-key="7">
                7
              </button>

              <button
                class="sl-hotkey"
                data-sl-key="8">
                8
              </button>

            </div>

          `;


          document.body.appendChild(
            mobileUi
          );


          type SlKeySpec = {
            code: string;
            key: string;
            keyCode: number;
          };


          const slKeys:
            Record<string, SlKeySpec> = {

            UP: {
              code:
                "ArrowUp",
              key:
                "ArrowUp",
              keyCode:
                38,
            },

            DOWN: {
              code:
                "ArrowDown",
              key:
                "ArrowDown",
              keyCode:
                40,
            },

            LEFT: {
              code:
                "ArrowLeft",
              key:
                "ArrowLeft",
              keyCode:
                37,
            },

            RIGHT: {
              code:
                "ArrowRight",
              key:
                "ArrowRight",
              keyCode:
                39,
            },

            F: {
              code:
                "KeyF",
              key:
                "f",
              keyCode:
                70,
            },

            H: {
              code:
                "KeyH",
              key:
                "h",
              keyCode:
                72,
            },

            E: {
              code:
                "KeyE",
              key:
                "e",
              keyCode:
                69,
            },

            TAB: {
              code:
                "Tab",
              key:
                "Tab",
              keyCode:
                9,
            },

            "1": {
              code:
                "Digit1",
              key:
                "1",
              keyCode:
                49,
            },

            "2": {
              code:
                "Digit2",
              key:
                "2",
              keyCode:
                50,
            },

            "3": {
              code:
                "Digit3",
              key:
                "3",
              keyCode:
                51,
            },

            "4": {
              code:
                "Digit4",
              key:
                "4",
              keyCode:
                52,
            },

            "5": {
              code:
                "Digit5",
              key:
                "5",
              keyCode:
                53,
            },

            "6": {
              code:
                "Digit6",
              key:
                "6",
              keyCode:
                54,
            },

            "7": {
              code:
                "Digit7",
              key:
                "7",
              keyCode:
                55,
            },

            "8": {
              code:
                "Digit8",
              key:
                "8",
              keyCode:
                56,
            },

          };


          const heldKeys =
            new Set<string>();


          const emitSlKey =
            (
              name: string,
              down: boolean
            ) => {

              const spec =
                slKeys[name];

              if (spec === undefined) {
                return;
              }


              if (down) {

                if (
                  heldKeys.has(name)
                ) {
                  return;
                }

                heldKeys.add(name);

              } else {

                if (
                  !heldKeys.has(name)
                ) {
                  return;
                }

                heldKeys.delete(name);

              }


              const event =
                new KeyboardEvent(
                  down
                    ? "keydown"
                    : "keyup",
                  {
                    key:
                      spec.key,

                    code:
                      spec.code,

                    bubbles:
                      true,

                    cancelable:
                      true,

                    repeat:
                      false,
                  }
                );


              try {

                Object.defineProperty(
                  event,
                  "keyCode",
                  {
                    get:
                      () =>
                        spec.keyCode,
                  }
                );

                Object.defineProperty(
                  event,
                  "which",
                  {
                    get:
                      () =>
                        spec.keyCode,
                  }
                );

              } catch {
              }


              nostalgist
                .getCanvas()
                .dispatchEvent(
                  event
                );

            };


          const bindSlButton =
            (
              id: string,
              keyName: string
            ) => {

              const button =
                document.getElementById(
                  id
                );

              if (
                button === null
              ) {
                return;
              }


              button.addEventListener(
                "pointerdown",
                (event) => {

                  event.preventDefault();

                  button.classList.add(
                    "active"
                  );

                  try {

                    button.setPointerCapture(
                      event.pointerId
                    );

                  } catch {
                  }

                  emitSlKey(
                    keyName,
                    true
                  );

                  if (
                    "vibrate" in navigator
                  ) {
                    navigator.vibrate(
                      8
                    );
                  }

                }
              );


              const release =
                (
                  event: PointerEvent
                ) => {

                  event.preventDefault();

                  button.classList.remove(
                    "active"
                  );

                  emitSlKey(
                    keyName,
                    false
                  );

                };


              button.addEventListener(
                "pointerup",
                release
              );

              button.addEventListener(
                "pointercancel",
                release
              );

            };


          bindSlButton(
            "sl-btn-f",
            "F"
          );

          bindSlButton(
            "sl-btn-h",
            "H"
          );

          bindSlButton(
            "sl-btn-e",
            "E"
          );

          bindSlButton(
            "sl-btn-tab",
            "TAB"
          );


          for (
            const button
            of document.querySelectorAll<HTMLElement>(
              ".sl-hotkey"
            )
          ) {

            const key =
              button.dataset.slKey;

            if (
              key === undefined
            ) {
              continue;
            }

            button.addEventListener(
              "pointerdown",
              (event) => {

                event.preventDefault();

                button.classList.add(
                  "active"
                );

                emitSlKey(
                  key,
                  true
                );

              }
            );


            const release =
              (
                event: PointerEvent
              ) => {

                event.preventDefault();

                button.classList.remove(
                  "active"
                );

                emitSlKey(
                  key,
                  false
                );

              };


            button.addEventListener(
              "pointerup",
              release
            );

            button.addEventListener(
              "pointercancel",
              release
            );

          }


          // -----------------------------------------------
          // Analog-style virtual joystick
          // -----------------------------------------------

          const joystick =
            document.getElementById(
              "sl-joystick"
            );

          const knob =
            document.getElementById(
              "sl-joy-knob"
            );


          let joystickPointer:
            number | null =
              null;


          const joystickDirections =
            new Set<string>();


          const setJoystickDirections =
            (
              next:
                Set<string>
            ) => {

              for (
                const current
                of joystickDirections
              ) {

                if (
                  !next.has(current)
                ) {

                  emitSlKey(
                    current,
                    false
                  );

                }

              }


              for (
                const current
                of next
              ) {

                if (
                  !joystickDirections.has(
                    current
                  )
                ) {

                  emitSlKey(
                    current,
                    true
                  );

                }

              }


              joystickDirections.clear();

              for (
                const current
                of next
              ) {

                joystickDirections.add(
                  current
                );

              }

            };


          const updateJoystick =
            (
              clientX: number,
              clientY: number
            ) => {

              if (
                joystick === null ||
                knob === null
              ) {
                return;
              }


              const rect =
                joystick.getBoundingClientRect();


              const centerX =
                rect.left +
                rect.width / 2;

              const centerY =
                rect.top +
                rect.height / 2;


              let dx =
                clientX -
                centerX;

              let dy =
                clientY -
                centerY;


              const maxDistance =
                Math.min(
                  rect.width,
                  rect.height
                ) * 0.30;


              const distance =
                Math.hypot(
                  dx,
                  dy
                );


              if (
                distance >
                maxDistance
              ) {

                const scale =
                  maxDistance /
                  distance;

                dx *= scale;
                dy *= scale;

              }


              knob.style.transform =
                `translate(${dx}px, ${dy}px)`;


              const dead =
                maxDistance * 0.27;


              const next =
                new Set<string>();


              if (
                dx < -dead
              ) {
                next.add(
                  "LEFT"
                );
              }

              if (
                dx > dead
              ) {
                next.add(
                  "RIGHT"
                );
              }

              if (
                dy < -dead
              ) {
                next.add(
                  "UP"
                );
              }

              if (
                dy > dead
              ) {
                next.add(
                  "DOWN"
                );
              }


              setJoystickDirections(
                next
              );

            };


          const resetJoystick =
            () => {

              if (
                knob !== null
              ) {

                knob.style.transform =
                  "translate(0px, 0px)";

              }

              setJoystickDirections(
                new Set<string>()
              );

              joystickPointer =
                null;

            };


          if (
            joystick !== null
          ) {

            joystick.addEventListener(
              "pointerdown",
              (event) => {

                event.preventDefault();

                if (
                  joystickPointer !== null
                ) {
                  return;
                }

                joystickPointer =
                  event.pointerId;

                try {

                  joystick.setPointerCapture(
                    event.pointerId
                  );

                } catch {
                }

                updateJoystick(
                  event.clientX,
                  event.clientY
                );

              }
            );


            joystick.addEventListener(
              "pointermove",
              (event) => {

                if (
                  event.pointerId
                  !== joystickPointer
                ) {
                  return;
                }

                event.preventDefault();

                updateJoystick(
                  event.clientX,
                  event.clientY
                );

              }
            );


            joystick.addEventListener(
              "pointerup",
              (event) => {

                if (
                  event.pointerId
                  !== joystickPointer
                ) {
                  return;
                }

                event.preventDefault();

                resetJoystick();

              }
            );


            joystick.addEventListener(
              "pointercancel",
              () => {

                resetJoystick();

              }
            );

          }


          window.addEventListener(
            "blur",
            () => {

              for (
                const key
                of Array.from(
                  heldKeys
                )
              ) {

                emitSlKey(
                  key,
                  false
                );

              }

              resetJoystick();

            }
          );


          document.addEventListener(
            "contextmenu",
            (event) => {

              event.preventDefault();

            }
          );


          console.log(
            "[SLKnight] MOBILE_TOUCH_UI_READY"
          );


          try {

            await nostalgist.start();

            console.log(
              "[SLKnight] GAME_STARTED"
            );

          } catch (error) {

            showSlError(
              String(error)
            );

            throw error;

          }

          '''


