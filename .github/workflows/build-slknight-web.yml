            function marker(t){var i=t.indexOf('SLAUDIO|');if(i<0)return;var p=t.slice(i).split('|'),cmd=p[1]||'',k=cmd.split('_')[0];if(/_PLAY$/.test(cmd))play(k,p.slice(2,-2).join('|'),p[p.length-2],p[p.length-1]);else if(/_STOP$/.test(cmd))stop(k);else if(/_FADE$/.test(cmd))setTimeout(function(){stop(k);},Number(p[2])||0);}
