name: build-slknight-web.yml | V2.2 | Healer Aggro, Teleport Reset, Holy Walk Buff Icon

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Restore exact deployed V2.1 game without rebuilding existing features
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 43714437330
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify V2.1 source and prepare existing extraction environment
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build/v22
          tar -xf baseline/artifact.tar -C site
          test -s site/knight/gameasync/Data/Scripts.rxdata
          test -s site/knight/assets/map-047-v241.pack
          grep -q 'SLKnight V2.1' site/knight/index.html
          grep -q "var version='V2.1';" site/knight/js/sl-assets-v229r115.js
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet --disable-pip-version-check 'Pillow>=11,<13'

      - name: Capture exact V2.1 deployed game inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/v22
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(before)==6003,('Wrong V2.1 deployed game',len(before))
          Path('build/v22/v21-original-filehash.json').write_text(json.dumps(before,sort_keys=True),'utf8')
          PY

      - name: Retrieve all original Sanctuary Map4 source files
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 43157706909
          name: Sanctuary-Original-Map-4-Full
          github-token: ${{ github.token }}
          path: source-map4

      - name: Build original Map048 graphics and 194-point river boundary
        shell: bash
        run: |
          set -euo pipefail
          cat > build/v22/build_map048.py <<'V22_MAP48_SOURCE_EOF'
          from pathlib import Path
          from functools import lru_cache
          from PIL import Image,ImageChops,ImageDraw
          import collections,hashlib,json,re,struct,time
          from io import BytesIO

          W,H=768,384
          PW,PH=W*16,H*16
          XORG,YORG=32448,32064
          UORG=64854
          XSHIFT,YSHIFT=4,2679
          SITE=Path('site')
          ROOT=Path('source-map4')
          OUT=Path('build/v22')
          OUT.mkdir(parents=True,exist_ok=True)
          state=json.loads('{"mapId":4,"status":"river-aligned-draft-not-game-verified","sightOverlapCells":44,"sourceMap":{"x0":32448,"y0":32064,"width":1856,"height":1536,"sourceBlocks":602},"landmarks":[{"name":"글루디오","x":32608,"y":32734},{"name":"우드벡","x":32640,"y":33203},{"name":"은기사","x":33080,"y":33386}],"riverCut":[{"x":32520,"y":32440},{"x":32522,"y":32447},{"x":32525,"y":32454},{"x":32525,"y":32464},{"x":32525,"y":32474},{"x":32524,"y":32485},{"x":32524,"y":32494},{"x":32524,"y":32504},{"x":32525,"y":32512},{"x":32526,"y":32521},{"x":32528,"y":32528},{"x":32531,"y":32535},{"x":32535,"y":32542},{"x":32539,"y":32546},{"x":32545,"y":32550},{"x":32555,"y":32550},{"x":32568,"y":32546},{"x":32583,"y":32542},{"x":32598,"y":32537},{"x":32610,"y":32534},{"x":32622,"y":32532},{"x":32632,"y":32532},{"x":32640,"y":32533},{"x":32648,"y":32534},{"x":32658,"y":32534},{"x":32668,"y":32534},{"x":32676,"y":32535},{"x":32685,"y":32537},{"x":32693,"y":32538},{"x":32702,"y":32539},{"x":32712,"y":32539},{"x":32722,"y":32538},{"x":32733,"y":32537},{"x":32743,"y":32537},{"x":32754,"y":32535},{"x":32765,"y":32534},{"x":32777,"y":32532},{"x":32788,"y":32531},{"x":32798,"y":32531},{"x":32807,"y":32531},{"x":32818,"y":32529},{"x":32829,"y":32528},{"x":32839,"y":32528},{"x":32847,"y":32529},{"x":32856,"y":32531},{"x":32863,"y":32533},{"x":32872,"y":32534},{"x":32880,"y":32535},{"x":32890,"y":32535},{"x":32899,"y":32535},{"x":32910,"y":32534},{"x":32921,"y":32533},{"x":32932,"y":32532},{"x":32942,"y":32532},{"x":32950,"y":32533},{"x":32958,"y":32535},{"x":32965,"y":32538},{"x":32972,"y":32540},{"x":32981,"y":32542},{"x":32988,"y":32544},{"x":32995,"y":32546},{"x":33001,"y":32550},{"x":33004,"y":32557},{"x":33004,"y":32567},{"x":33005,"y":32575},{"x":33006,"y":32584},{"x":33006,"y":32594},{"x":33005,"y":32605},{"x":33005,"y":32614},{"x":33005,"y":32624},{"x":33005,"y":32634},{"x":33004,"y":32645},{"x":33001,"y":32657},{"x":33000,"y":32668},{"x":32999,"y":32679},{"x":32999,"y":32688},{"x":33000,"y":32697},{"x":33003,"y":32704},{"x":33005,"y":32711},{"x":33006,"y":32720},{"x":33006,"y":32729},{"x":33004,"y":32742},{"x":33001,"y":32754},{"x":32998,"y":32767},{"x":32993,"y":32782},{"x":32987,"y":32797},{"x":32981,"y":32813},{"x":32977,"y":32826},{"x":32978,"y":32835},{"x":32982,"y":32841},{"x":32988,"y":32845},{"x":32993,"y":32849},{"x":32999,"y":32853},{"x":33005,"y":32857},{"x":33009,"y":32863},{"x":33010,"y":32871},{"x":33007,"y":32883},{"x":33005,"y":32896},{"x":33001,"y":32909},{"x":32999,"y":32921},{"x":32998,"y":32932},{"x":32998,"y":32942},{"x":33000,"y":32949},{"x":33001,"y":32957},{"x":33003,"y":32966},{"x":33001,"y":32977},{"x":32999,"y":32989},{"x":32996,"y":33001},{"x":32995,"y":33012},{"x":32995,"y":33022},{"x":32998,"y":33029},{"x":33000,"y":33036},{"x":33004,"y":33042},{"x":33009,"y":33047},{"x":33015,"y":33051},{"x":33022,"y":33053},{"x":33032,"y":33053},{"x":33041,"y":33053},{"x":33050,"y":33054},{"x":33057,"y":33057},{"x":33063,"y":33060},{"x":33068,"y":33065},{"x":33074,"y":33069},{"x":33081,"y":33071},{"x":33089,"y":33074},{"x":33095,"y":33077},{"x":33098,"y":33083},{"x":33102,"y":33090},{"x":33107,"y":33094},{"x":33112,"y":33099},{"x":33117,"y":33104},{"x":33121,"y":33109},{"x":33129,"y":33111},{"x":33137,"y":33113},{"x":33144,"y":33115},{"x":33152,"y":33117},{"x":33159,"y":33120},{"x":33169,"y":33120},{"x":33181,"y":33117},{"x":33192,"y":33116},{"x":33201,"y":33116},{"x":33210,"y":33117},{"x":33218,"y":33119},{"x":33226,"y":33121},{"x":33232,"y":33125},{"x":33238,"y":33128},{"x":33243,"y":33133},{"x":33249,"y":33137},{"x":33254,"y":33142},{"x":33257,"y":33148},{"x":33260,"y":33155},{"x":33260,"y":33165},{"x":33261,"y":33173},{"x":33261,"y":33183},{"x":33263,"y":33190},{"x":33267,"y":33196},{"x":33269,"y":33204},{"x":33268,"y":33214},{"x":33263,"y":33229},{"x":33260,"y":33242},{"x":33256,"y":33256},{"x":33251,"y":33270},{"x":33249,"y":33282},{"x":33250,"y":33291},{"x":33252,"y":33298},{"x":33255,"y":33305},{"x":33258,"y":33311},{"x":33260,"y":33320},{"x":33261,"y":33328},{"x":33264,"y":33334},{"x":33268,"y":33341},{"x":33271,"y":33348},{"x":33274,"y":33354},{"x":33277,"y":33361},{"x":33279,"y":33368},{"x":33283,"y":33374},{"x":33286,"y":33381},{"x":33289,"y":33388},{"x":33291,"y":33395},{"x":33292,"y":33404},{"x":33294,"y":33412},{"x":33296,"y":33419},{"x":33298,"y":33427},{"x":33302,"y":33433},{"x":33304,"y":33440},{"x":33308,"y":33446},{"x":33312,"y":33452},{"x":33313,"y":33461},{"x":33313,"y":33470},{"x":33311,"y":33482},{"x":33311,"y":33492},{"x":33312,"y":33501},{"x":33315,"y":33507},{"x":33321,"y":33510}]}')
          assert state['mapId']==4 and state['status']=='river-aligned-draft-not-game-verified'
          assert len(state['riverCut'])==194 and state['sightOverlapCells']==44
          assert state['sourceMap']=={'x0':32448,'y0':32064,'width':1856,'height':1536,'sourceBlocks':602}
          manifest=json.loads((ROOT/'manifest.json').read_text('utf-8'))
          assert manifest['originalMapId']==4 and manifest['sourceBlocks']==602 and manifest['sourceFiles']==790
          assert len(manifest['files'])==792 and len(manifest['missingBlocks'])==94
          assert manifest['coveredCells']==2465792 and manifest['preferredSourceBlocks']=={'s32':559,'seg':43}

          def fx(wx,wy):return 6*(wx+wy-UORG)+XSHIFT
          def fy(wx,wy):return 3*(wy-wx)+YSHIFT

          cities={p['name']:(round(fx(p['x'],p['y'])/16),round(fy(p['x'],p['y'])/16)) for p in state['landmarks']}
          assert cities=={'글루디오':(183,191),'우드벡':(371,273),'은기사':(605,225)}
          line=[(fx(p['x'],p['y']),fy(p['x'],p['y'])) for p in state['riverCut']]
          assert all(line[i+1][0]>line[i][0] for i in range(len(line)-1))
          # Native preview's 44-cell sight strip is 132 pixels at the Map048 source scale.
          mask=Image.new('L',(PW,PH),0)
          d=ImageDraw.Draw(mask)
          d.polygon([(x,y-44*3) for x,y in line]+[(line[-1][0],PH),(line[0][0],PH)],fill=255)
          del d
          landmask=Image.new('L',(PW,PH),0)
          d=ImageDraw.Draw(landmask)
          d.polygon(line+[(line[-1][0],PH),(line[0][0],PH)],fill=255)
          del d
          # Art outside the review boundary remains absent. The sight strip has NO passage.
          mask_small=landmask.resize((W,H),Image.Resampling.NEAREST)

          idx=(ROOT/'Tile.idx').read_bytes()
          pak=(ROOT/'Tile.pak').read_bytes()
          n=struct.unpack_from('<I',idx)[0]
          assert n==4958 and len(idx)==4+n*28
          files={}
          for i in range(n):
           p=4+i*28
           off=struct.unpack_from('<I',idx,p)[0]
           name=idx[p+4:p+24].split(b'\0')[0].decode('ascii','replace').lower()
           size=struct.unpack_from('<I',idx,p+24)[0]
           assert name not in files and off+size<=len(pak)
           files[name]=(off,size)
          source_files=collections.defaultdict(dict)
          for e in manifest['files']:
           p=ROOT/e['file']
           assert p.is_file() and p.stat().st_size==e['size']
           assert hashlib.sha256(p.read_bytes()).hexdigest()==e['sha256'],('bad source hash',e['file'])
           if not e['file'].lower().endswith(('.s32','.seg')):continue
           stem=p.stem.lower();ext=p.suffix.lower()
           assert ext not in source_files[stem]
           source_files[stem][ext]=p
          assert len(source_files)==602

          stats=collections.Counter()
          missing_tiles=collections.Counter()
          @lru_cache(maxsize=20000)
          def tile_bitmap(tile,index):
           info=files.get(f'{tile}.til')
           if info is None:
            missing_tiles[('file',tile)]+=1;return None
           off,size=info
           blob=memoryview(pak)[off:off+size]
           if len(blob)<12:missing_tiles[('short',tile)]+=1;return None
           frames=struct.unpack_from('<I',blob,0)[0]
           if not (0<=index<frames<=2048):
            missing_tiles[('frame',tile,index)]+=1;return None
           base=4+4*(frames+1)
           a,b=struct.unpack_from('<II',blob,4+index*4)
           if a==b:return None
           if a>b or base+b>len(blob):
            missing_tiles[('offset',tile,index)]+=1;return None
           frame=blob[base+a:base+b]
           typ=frame[0]
           if typ not in (0,1,2,3,6,7,8,9,16,17,18,19,22,23,34,35):
            missing_tiles[('type',tile,index,typ)]+=1;return None
           rgba=bytearray(24*24*4)
           def dot(x,y,val):
            if 0<=x<24 and 0<=y<24:
             j=4*(y*24+x)
             rgba[j]=(val>>10&31)*255//31
             rgba[j+1]=(val>>5&31)*255//31
             rgba[j+2]=(val&31)*255//31
             rgba[j+3]=255
           p=1
           try:
            if not typ&2:
             for y in range(24):
              q=(y+1)*2 if y<12 else (23-y)*2
              x0=0 if typ&1 else 24-q
              for x in range(q):
               val=struct.unpack_from('<H',frame,p)[0];p+=2;dot(x0+x,y,val)
            else:
             xo,yo,_,rows=struct.unpack_from('<BBBB',frame,p);p+=4
             for y in range(rows):
              x=xo;segments=frame[p];p+=1
              for seg in range(segments):
               x+=frame[p]//2;p+=1
               span=frame[p];p+=1
               for j in range(span):
                val=struct.unpack_from('<H',frame,p)[0];p+=2;dot(x+j,yo+y,val)
               x+=span
           except (struct.error,IndexError):
            missing_tiles[('parse',tile,index)]+=1;return None
           # Scale original 12x12 native Map047 pixels to half for the 1,856x1,536 mainland projection.
           return Image.frombytes('RGBA',(24,24),bytes(rgba)).resize((6,6),Image.Resampling.NEAREST)

          # Verify every file (including both-format duplicates), but draw one preferred source per stem.
          ground=Image.new('RGBA',(PW,PH),(0,0,0,255))
          upper_entries=[];bound={};size_lookup={};layer5=[]
          parse_errors=[];nused=0
          start=time.time()
          for item,stem in enumerate(sorted(source_files)):
           ext='.s32' if '.s32' in source_files[stem] else '.seg'
           path=source_files[stem][ext];raw=path.read_bytes();s32=(ext=='.s32')
           bx=(int(stem[:4],16)-0x7e00)*64
           by=(int(stem[4:],16)-0x7e00)*64
           cols=128 if s32 else 64
           def xy(xx,yy,half=False):
            wx=bx+(xx//2 if s32 else xx);wy=by+yy
            return fx(wx,wy)+(6 if half and s32 and xx&1 else 0),fy(wx,wy)
           def on_canvas(x,y):return x<PW and y<PH and x+6>0 and y+6>0
           # check both .s32 and .seg separately for structure and parsability
           for other_ext,other_path in source_files[stem].items():
            rd=other_path.read_bytes();is32=other_ext=='.s32'
            first_size=32768 if is32 else 16384
            n2=struct.unpack_from('<H',rd,first_size)[0]
            p=first_size+2+n2*(6 if is32 else 4)+4096*(4 if is32 else 2)
            g=struct.unpack_from('<i',rd,p)[0];p+=4
            assert 0<=g<=30000,(stem,'layer4 groups',g)
            for i in range(g):
             gid,num=struct.unpack_from('<hH',rd,p);p+=4+num*(7 if is32 else 5)
            num5=struct.unpack_from('<i',rd,p)[0];p+=4+num5*5
            assert 0<=num5<200000 and p<=len(rd),(stem,'native layer totals',num5,p,len(rd))
            stats['source_files_verified']+=1
            stats['preferred_'+other_ext]+=int(other_ext==ext)
           # Floor and Layer2 draw using existing Map047 tile renderer.
           for yy in range(64):
            for xx in range(cols):
             index,tile,_=struct.unpack_from('<BHB',raw,4*(yy*cols+xx))
             x,y=xy(xx,yy,True)
             stats['floor_original']+=1
             if not on_canvas(x,y):continue
             stats['floor_clipped']+=1
             # SEG stores base Tile.idx identifiers in the low twelve bits.
             bmp=tile_bitmap(tile if s32 else tile&0x0fff,index)
             if bmp is not None:
              ground.alpha_composite(bmp,(x,y));stats['floor_drawn']+=1
           p=64*cols*4
           n2=struct.unpack_from('<H',raw,p)[0];p+=2
           for i in range(n2):
            if s32:
             xx,yy,index,tile,_=struct.unpack_from('<BBBHB',raw,p);p+=6
            else:
             xx,yy,index,tile=struct.unpack_from('<BBBB',raw,p);p+=4
            x,y=xy(xx,yy,True)
            stats['layer2_original']+=1
            if not on_canvas(x,y):continue
            stats['layer2_clipped']+=1
            bmp=tile_bitmap(tile,index)
            if bmp is not None:
             ground.alpha_composite(bmp,(x,y));stats['layer2_drawn']+=1
           p+=4096*(4 if s32 else 2)
           ngroups=struct.unpack_from('<i',raw,p)[0];p+=4
           stats['layer4_groups_original']+=ngroups
           for i in range(ngroups):
            gid,num=struct.unpack_from('<hH',raw,p);p+=4
            key=(stem,gid)
            assert key not in size_lookup
            size_lookup[key]=num
            box=[PW,PH,-1,-1]
            for j in range(num):
             if s32:
              xx,yy,layer,index,tile,_=struct.unpack_from('<BBBBhB',raw,p);p+=7
             else:
              xx,yy,layer,index,tile=struct.unpack_from('<BBBBB',raw,p);p+=5
             stats['layer4_original']+=1
             if tile<0:continue
             x,y=xy(xx,yy,True)
             if not on_canvas(x,y):continue
             stats['layer4_clipped']+=1
             box[0]=min(x,box[0]);box[1]=min(y,box[1]);box[2]=max(x+6,box[2]);box[3]=max(y+6,box[3])
             upper_entries.append((layer,x,y,tile,index))
            if box[2]>box[0] and box[3]>box[1]:
             bound[key]=[max(0,box[0]),max(0,box[1]),min(PW,box[2]),min(PH,box[3])]
           n5=struct.unpack_from('<i',raw,p)[0];p+=4
           for j in range(n5):
            xx,yy,gid,typ=struct.unpack_from('<BBHB',raw,p+j*5)
            x,y=xy(xx,yy,False)
            gx=(x+4)//16;gy=(y+4)//16
            stats['layer5_original']+=1
            if 0<=gx<W and 0<=gy<H:
             layer5.append((gx,gy,stem,gid,typ));stats['layer5_clipped']+=1
           nused+=1
           if nused%100==0:print('RENDER',nused,'/',len(source_files),'floor',stats['floor_drawn'],'L4',len(upper_entries),'time',round(time.time()-start,1),flush=True)

          assert stats['source_files_verified']==790 and nused==602
          print('RENDER ground completed after',round(time.time()-start,1),'seconds','L4 count',len(upper_entries),flush=True)
          # Fade image region: black outside all source boundaries; only native ground/structures are rendered.
          ground.paste((0,0,0,255),mask=ImageChops.invert(mask))
          upper=Image.new('RGBA',(PW,PH))
          upper_entries.sort(key=lambda x:x[0])
          for i,(_,x,y,tile,index) in enumerate(upper_entries):
           bmp=tile_bitmap(tile,index)
           if bmp is not None:
            upper.alpha_composite(bmp,(x,y));stats['layer4_drawn']+=1
           if i and i%300000==0:print('RENDER upper',i,'/',len(upper_entries),'time',round(time.time()-start,1),flush=True)
          upper.putalpha(ImageChops.multiply(upper.getchannel('A'),mask))
          # Original layer5 reference -> original Layer4 group, and foreground occlusion strictly on walkable side.
          refs={(stem,gid) for gx,gy,stem,gid,typ in layer5 if mask_small.getpixel((gx,gy)) and (stem,gid) in bound}
          ordered=sorted(refs)
          assert len(ordered)<65535
          serial={key:i+1 for i,key in enumerate(ordered)}
          boxes=[[0,0,0,0]]+[bound[key] for key in ordered]
          groups=[0]*(W*H);weights=[-1]*(W*H)
          for gx,gy,stem,gid,typ in layer5:
           if not mask_small.getpixel((gx,gy)):continue
           key=(stem,gid)
           if key not in serial:continue
           cell=gy*W+gx;score=size_lookup[key]
           if score>weights[cell]:groups[cell]=serial[key];weights[cell]=score
          assert any(groups), 'Source layer5 groups missing'
          atlas=Image.new('RGB',(W,H))
          atlas.putdata([(v&255,(v>>8)&255,0) for v in groups])
          panos=SITE/'knight/gameasync/Graphics/Panoramas'
          panos.mkdir(parents=True,exist_ok=True)
          atlas.save(panos/'SLTI_48_GID.png',optimize=True)
          images=[];fg=[]
          for gx in range(24):
           for gy in range(12):
            x,y=gx*512,gy*512
            name=f'SLTI_48_C{gx}_{gy}.png'
            crop=ground.crop((x,y,x+512,y+512)).convert('RGB');crop.save(panos/name,optimize=True);images.append(name)
            name=f'SLTI_48_L4_C{gx}_{gy}.png'
            crop=upper.crop((x,y,x+512,y+512))
            if crop.getbbox():fg.append([gx,gy]);crop.save(panos/name,optimize=True);images.append(name)
          images.append('SLTI_48_GID.png')
          hex_bounds=''.join(''.join(f'{c:04x}' for c in box) for box in boxes)
          assert len(hex_bounds)==16*len(boxes)
          (OUT/'map48-group-bounds.hex').write_text(hex_bounds,'ascii')
          (OUT/'map48-foreground-keys.json').write_text(json.dumps(fg,separators=(',',':')),'utf8')
          (OUT/'map48-generated-files.json').write_text(json.dumps(images,separators=(',',':')),'utf8')
          # Validate collision attributes per native original coverage and river cut.
          rawattr=(ROOT/'layer3-attr1-u16le.bin').read_bytes()
          coverage=(ROOT/'original-cell-coverage.bin').read_bytes()
          assert len(rawattr)==2*1856*1536 and len(coverage)==1856*1536
          # Use native mosaic interpolated river y for every Map048 pixel x.
          line_y=[0]*PW
          for i in range(len(line)-1):
           x0,y0=line[i];x1,y1=line[i+1]
           for xp in range(max(0,x0),min(PW,x1)):
            line_y[xp]=y0+(y1-y0)*(xp-x0)/(x1-x0)
          for i in range(0,max(0,line[0][0])):line_y[i]=line[0][1]
          for i in range(min(PW,line[-1][0]),PW):line_y[i]=line[-1][1]
          walk=bytearray(W*H*2);uncovered=0;land=0;passed=0;blocked=0;inside=0
          for ty in range(H):
           for tx in range(W):
            px,py=tx*16+8,ty*16+8
            u=UORG+(px-XSHIFT)/6;v=(py-YSHIFT)/3
