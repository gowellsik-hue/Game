          abort 'array copy weapon ids missing' unless actor.include?('weapon_array = self.weapon_ids.dup')
          abort 'array copy weapon slots missing' unless actor.include?('@weapon_slots = array.dup')
          abort 'array copy armor names missing' unless actor.include?('temp_array = @armor_slot_names.dup')
          abort 'array copy weapon names missing' unless actor.include?('temp_array = @weapon_slot_names.dup')
          abort 'array copy attacks missing' unless actor.include?('return attacks.dup')
          abort 'old weapon id copy remains' if actor.include?('Array.new(self.weapon_ids)')
          abort 'old weapon slot copy remains' if actor.include?('Array.new(array)')
          abort 'old armor name copy remains' if actor.include?('Array.new(@armor_slot_names)')
          abort 'old weapon name copy remains' if actor.include?('Array.new(@weapon_slot_names)')
          abort 'old attacks copy remains' if actor.include?('Array.new(attacks)')
          abort 'right wrapper trace missing' unless multi.include?('SLDBG|WR01')&&multi.include?('SLDBG|WR12')
          abort 'right refresh trace missing' unless multi.include?('SLDBG|RR01')&&multi.include?('SLDBG|RR11')
          abort 'right item trace missing' unless multi.include?('SLDBG|RN00')&&multi.include?('SLDBG|RN41')
          abort 'equip loop still present' if equip.match?(/loop do.*?Graphics\.update.*?Input\.update.*?update/m)
          abort 'equip dispose missing' unless equip.include?('def dispose')&&equip.include?('$game_switches[49] = true')
          abort 'equip shortcut changed' unless equip.include?('Keyboard.testkey(69)')
