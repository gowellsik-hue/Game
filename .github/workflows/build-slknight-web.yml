           end
           def dispose;@disposed=true;end
           def disposed?;@disposed;end
          end
          class MockMap
           attr_accessor :map_id,:display_x,:display_y,:events,:data
           attr_reader :width,:height
           def initialize(mid,map)
            @map_id=mid;@display_x=0;@display_y=0;@events={};@data=map.instance_variable_get(:@data)
            @w=map.instance_variable_get(:@width);@h=map.instance_variable_get(:@height)
            @width=@w;@height=@h
           end
           def valid?(x,y);x>=0 && y>=0 && x<@w && y<@h;end
           def passable?(x,y,d,self_event=nil);SLTI_V229R44.allowed?(@map_id,x,y,d);end
          end
          $game_switches=Hash.new(false)
          $game_variables=Hash.new(0)
          $game_self_switches=Hash.new(false)
          $game_player=Game_Player.new;$game_player.x=-999;$game_player.y=-999
          $game_map=nil
          scripts=Marshal.load(File.binread(File.join(ENV.fetch('R49_SITE'),'knight/gameasync/Data/Scripts.rxdata')))
          load File.join(ENV.fetch('R49_BUILD'),'r49-original-character.rb')
          code21=Zlib::Inflate.inflate(scripts[21][2]);eval(code21,TOPLEVEL_BINDING,'R44_GameMap')
          code26=Zlib::Inflate.inflate(scripts[26][2]);eval(code26,TOPLEVEL_BINDING,'NativeGameEvent')
          code103=Zlib::Inflate.inflate(scripts[103][2]);eval(code103.force_encoding('UTF-8'),TOPLEVEL_BINDING,'NativeRange')
          addon=File.binread(File.join(ENV.fetch('R49_BUILD'),'r49-existing-wall-renderer.rb'))
          marker='# V229R49: original isolated Sanctuary walls'
          raise 'Removed original R48 logic not found' unless addon.include?(marker)
          eval(addon[addon.index(marker)..-1].force_encoding('UTF-8'),TOPLEVEL_BINDING,'R49_Walls_and_Aggro')
          assert=lambda{|c,s|raise s unless c}
          counts={}; total=0; near=0; gatetests=0;blocked=0;wallmove=0;all_events=[]
          pre=File.join(ENV.fetch('R49_SITE'),'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO')
          [45,46].each do |mid|
           m=Marshal.load(File.binread(pre+('Map%03d.rxdata'%mid)))
           w=m.instance_variable_get(:@width);h=m.instance_variable_get(:@height)
           $game_map=MockMap.new(mid,m)
           $game_switches=Hash.new(false)
           $game_player.x=-999;$game_player.y=-999
           raw=mid==45 ? SLTI_V229R44::EDGES_45 : SLTI_V229R44::EDGES_46
           check_raw=File.binread(File.join(ENV.fetch('R49_BUILD'),"r44-map-#{mid}-edges.bin"))
           assert.call(raw==check_raw,'Movement mask does not match R48 original R44 graph')
           mobs=m.instance_variable_get(:@events).values.select{|ev|
            ev.name.to_s[0,3]=='[ID' && !(mid==45 && ev.id==13) && !(mid==46 && (ev.id==3 || ev.id==13)) }
           assert.call(mobs.size==(mid==45 ? 48 : 57),'Wrong monster count')
           mobs.each do |ev|
            id=ev.id; x=ev.instance_variable_get(:@x);y=ev.instance_variable_get(:@y)
