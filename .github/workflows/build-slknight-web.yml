          pairs=[
            ('player/js/drive.js','fairy_player/js/drive.js'),
            ('player/index.html','fairy_player/index.html'),
            ('player/.nojekyll','fairy_player/.nojekyll'),
            ('slknight-core-v144','slfairy-core-v144'),
            ('slknight_v14_engine','slfairy_v14_engine'),
            ('SLKnight V14.4b','SLFairy'),
            ('SLKnight','SLFairy')
          ]
          for a,b in pairs:s=s.replace(a,b)
          Path('/tmp/fairy_browser.sh').write_text(s)
          PY
          bash -n /tmp/fairy_browser.sh
          bash /tmp/fairy_browser.sh
          cp /tmp/mobile-ui.js fairy_player/js/dpad.js
          ruby /tmp/inject_mobile_ui.rb fairy_player/index.html SLFairy
          node --check fairy_player/js/dpad.js
          grep -Fq 'slfairy_v14_engine' fairy_player/index.html
          grep -Fq 'slfairy-core-v144.js' fairy_player/index.html
          grep -Fq 'id="sl-joystick"' fairy_player/index.html
          grep -Fq 'restoreLocalFilesBeforeRun' fairy_player/js/drive.js
          echo FAIRY_INDEPENDENT_MOBILE_OK

      - name: Assemble launcher only
        run: |
          set -euo pipefail
          rm -rf /tmp/sl_dual_site
          mkdir -p /tmp/sl_dual_site/knight /tmp/sl_dual_site/elf
          cp -a player/. /tmp/sl_dual_site/knight/
          cp -a fairy_player/. /tmp/sl_dual_site/elf/
          cat > /tmp/sl_dual_site/index.html <<'HTML'
          <!doctype html>
          <html lang="ko">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
            <title>SLKnight + SLFairy Mobile</title>
            <style>
              html,body{margin:0;width:100%;height:100%;background:#080808;color:#fff;font-family:system-ui,sans-serif}
              .wrap{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px}
              h1{font-size:30px;margin:0 0 12px}.choices{display:flex;gap:18px}.card{width:150px;height:170px;border:1px solid #777;border-radius:14px;background:#171717;color:#fff;font-size:25px;cursor:pointer}.card:active{transform:scale(.97)}.sub{font-size:13px;color:#aaa;text-align:center;max-width:360px;line-height:1.5}
            </style>
          </head>
          <body><div class="wrap"><h1>캐릭터 선택</h1><div class="choices"><button class="card" onclick="location.href='knight/'">기사</button><button class="card" onclick="location.href='elf/'">요정</button></div><div class="sub">기사와 요정은 각 원본에서 독립적으로 빌드되며 저장 데이터도 서로 분리됩니다.</div></div></body>
          </html>
          HTML
          touch /tmp/sl_dual_site/.nojekyll
          rm -rf player fairy_player
          mv /tmp/sl_dual_site player

      - name: Verify final independent package
        run: |
          set -euo pipefail
          test -s player/index.html
          test -s player/knight/index.html
          test -s player/elf/index.html
          test -s player/knight/mkxp.js
          test -s player/elf/mkxp.js
          test -s player/knight/mkxp.wasm
          test -s player/elf/mkxp.wasm
          test -s player/knight/slknight-core-v144.data
          test -s player/elf/slfairy-core-v144.data
          test -s player/knight/gameasync/Data/Scripts.rxdata
          test -s player/elf/gameasync/Data/Scripts.rxdata
          grep -Fq 'slknight_v14_engine' player/knight/index.html
          grep -Fq 'slfairy_v14_engine' player/elf/index.html
          grep -Fq 'id="sl-joystick"' player/knight/index.html
          grep -Fq 'id="sl-joystick"' player/elf/index.html
          grep -Fq 'initSLMobileControls' player/knight/js/dpad.js
          grep -Fq 'initSLMobileControls' player/elf/js/dpad.js
          ! grep -R -Fq 'tools-v149-complete.zip' player
          echo DUAL_INDEPENDENT_BASE60_PLUS_MOBILE_OK
          du -sh player

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
