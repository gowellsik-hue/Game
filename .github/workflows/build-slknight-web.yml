
name: V229 | Reviewed Unified Knight Speed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-slknight-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Try last verified knight deployment
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          repository: gowellsik-hue/Game
          run-id: 38869506499
          name: github-pages
          github-token: ${{ github.token }}
          path: previous

      - name: Restore complete deployed site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          if test -s previous/artifact.tar; then
            tar -xf previous/artifact.tar -C site
          else
            python3 - <<'PY_RECOVER'
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import hashlib, json, re, time
          base='https://gowellsik-hue.github.io/Game/'
          root=Path('site')
          fixed=('index.html','COPYING-mkxp-web.txt','manifest.webmanifest','mkxp.js','mkxp.wasm','js/drive.js','js/dpad.js','js/localforage.min.js')
          def get(url):
              for attempt in range(5):
                  try:
                      req=Request(url,headers={'User-Agent':'SLKnight-V229-R5','Accept-Encoding':'identity'})
                      with urlopen(req, timeout=75) as response:
                          return response.read()
                  except Exception:
                      if attempt==4: raise
                      time.sleep(attempt+1)
          files={'index.html':(base+'index.html',None)}
          for game in ('knight','elf'):
              for rel in fixed:
                  files[game+'/'+rel]=(base+game+'/'+quote(rel,safe='/'),None)
              mapping_name=game+'/gameasync/mapping.js'
              blob=get(base+mapping_name+'?recover=v229r5')
              p=root/mapping_name
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(blob)
              body=blob.decode('utf-8').split('var mappingArray = ',1)[1].split('];',1)[0]+']'
              for _,asset in json.loads(re.sub(r',\s*\]$',']',body)):
                  rel,sep,md5=asset.partition('?h=')
                  if '.' not in Path(rel).name: continue
                  if rel.startswith('/') or '..' in Path(rel).parts: raise RuntimeError('Unsafe asset path '+rel)
                  name=game+'/gameasync/'+rel
                  if name in files: raise RuntimeError('Duplicate asset '+name)
                  files[name]=(base+game+'/gameasync/'+quote(rel,safe='/')+('?h='+md5 if sep else ''),md5 if sep else None)
          if len(files)!=5354: raise RuntimeError('Unexpected total asset count '+str(len(files)))
          def fetch(item):
              name,(url,md5)=item
              data=get(url)
              if md5 and Path(name).name not in ('mapping.js','bitmap-map.js'):
                  if hashlib.md5(data).hexdigest()!=md5: raise RuntimeError('Asset checksum mismatch '+name)
              p=root/name
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(data)
          with ThreadPoolExecutor(max_workers=12) as pool:
              jobs=[pool.submit(fetch,item) for item in files.items() if not (root/item[0]).is_file()]
              for job in as_completed(jobs): job.result()
          actual={str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}
          if actual!=set(files): raise RuntimeError('Incomplete published game recovery')
          print('RESTORED_5354_PUBLISHED_ASSETS')
          PY_RECOVER
          fi

      - name: Verify original transformation menus
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_SOURCE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if len(hashes)!=5354: raise SystemExit('Unexpected asset count')
          common='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata'
          keep={
            'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap035.rxdata':'35f5fe74ec30d71614d1fc276d4044c816acf666758355b89a56cf8e71b6c27c',
            'knight/gameasync/Data/Scripts.rxdata':'9e3eaae707471a9ee395e5ede40b43bc8462f2be137bc9f3ffca484598062630'
          }
          r4={
            'knight/index.html':'53822d033c0a50747393a5ef0b6ebd36c9227ac15c7f130c476ad0da07fe422b',
            'knight/gameasync/mapping.js':'9d0d03d377657c064d7f2544caaf92a6f985ae94cd6d56e3f1de1539804bc32b',
            common:'bbf5ec438a88f032780f9464a862ca4728f1f34afa1b74053ca7c6a9243ca3ed'
          }
          r5={
            'knight/index.html':'c5dde3d791f901a180a2f13d43a20614702caeb657814e8b06d01424a27edc0e',
            'knight/gameasync/mapping.js':'aa72157f0b79cf1590eace5b7aae2004ad7c08090e67ea7f9b4d1aae31ce8624',
            common:'c1112940bc8ba843e0a7a108a09c09c00a8c952162c62b5f2119323353cb2959'
          }
          if any(hashes.get(k)!=v for k,v in keep.items()): raise SystemExit('Unexpected V229 gameplay data')
          version='V229R4' if all(hashes.get(k)==v for k,v in r4.items()) else 'V229R5' if all(hashes.get(k)==v for k,v in r5.items()) else None
          if not version: raise SystemExit('Unknown knight version; refusing to overwrite')
          Path('/tmp/knight_source_version').write_text(version)
          Path('/tmp/knight_before_sha256.json').write_text(json.dumps(hashes))
          print('VERIFIED_KNIGHT_SOURCE',version)
          PY_SOURCE

      - name: Remove 75 and 80 level polymorph menu options and branches
        shell: bash
        run: |
          set -euo pipefail
          if test "$(cat /tmp/knight_source_version)" = V229R4; then
            ruby - <<'RUBY_REMOVE'
          require 'digest'
          module RPG
           class CommonEvent;end
           class EventCommand;end
           class MoveRoute;end
           class MoveCommand;end
           class AudioFile;end
          end
          class Table
           def self._load(data);new(data);end
           def initialize(data);@data=data;end
           def _dump(depth);@data;end
          end
          path='site/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata'
          data=File.binread(path)
          expected='bbf5ec438a88f032780f9464a862ca4728f1f34afa1b74053ca7c6a9243ca3ed'
          raise 'CommonEvents base checksum mismatch' unless Digest::SHA256.hexdigest(data)==expected
          all=Marshal.load(data)
          raise 'Unexpected common event array length' unless all.size==1061
          changed={}
          [6,17].each do |eid|
           event=all.fetch(eid)
           name=event.instance_variable_get(:@name).dup.force_encoding('UTF-8')
           raise "Wrong common event #{eid}: #{name.inspect}" unless name.include?(eid==6 ? "\uBCC0\uC2E0\uC8FC\uBB38\uC11C" : "\uBCC0\uC2E0 \uC870\uC885 \uBC18\uC9C0")
           list=event.instance_variable_get(:@list)
           expected_length=eid==6 ? 690 : 709
           raise "Unexpected command count #{eid}" unless list.size==expected_length
           menu_matches=list.each_index.select do |ix|
            cmd=list[ix];next false unless cmd.instance_variable_get(:@code)==102
            options=cmd.instance_variable_get(:@parameters).fetch(0)
            options.is_a?(Array) && options.size==4 && options[0].start_with?('Lv65 ') && options[1].start_with?('Lv70 ') && options[2].start_with?('Lv75 ') && options[3].start_with?('Lv80 ')
           end
           raise "Expected exactly one high-level menu #{eid}" unless menu_matches.size==1
           menu_index=menu_matches.fetch(0)
           menu=list.fetch(menu_index)
           params=menu.instance_variable_get(:@parameters)
           raise 'Cancel handling changed' unless params[1]==5
           depth=menu.instance_variable_get(:@indent)
           branch_indices=(menu_index+1...list.size).select do |ix|
            cmd=list[ix]
            cmd.instance_variable_get(:@indent)==depth && [402,403,404].include?(cmd.instance_variable_get(:@code))
           end
           markers=branch_indices.take(6).map do |ix|
            cmd=list[ix];par=cmd.instance_variable_get(:@parameters)
            [ix,cmd.instance_variable_get(:@code),cmd.instance_variable_get(:@code)==402 ? par.fetch(0) : nil]
           end
           raise "Unexpected choice structure #{eid} #{markers.inspect}" unless markers.map{|x|x[1..2]}==[[402,0],[402,1],[402,2],[402,3],[403,nil],[404,nil]]
           first_to_remove=markers[2][0]
           cancel_start=markers[4][0]
           raise "Unexpected removed span #{eid}" unless [102,104].include?(cancel_start-first_to_remove)
           removed=list[first_to_remove...cancel_start]
           raise 'Removed branch indices unexpected' unless removed.select{|c|c.instance_variable_get(:@code)==402}.map{|c|c.instance_variable_get(:@parameters)[0]}==[2,3]
           raise 'Remove command indent mismatch' if removed.any?{|c|c.instance_variable_get(:@indent)<depth}
           options=params.fetch(0)
           params[0]=options.take(2)
           list.slice!(first_to_remove,cancel_start-first_to_remove)
           raise 'Menu altered unexpectedly' unless list.fetch(menu_index).instance_variable_get(:@parameters)[0].map{|x|x.slice(0,4)}==%w[Lv65 Lv70]
           changed[eid]=[expected_length,list.size,removed.length]
          end
          File.binwrite(path,Marshal.dump(all))
          newbytes=File.binread(path)
          verify=Marshal.load(newbytes)
          [6,17].each do |eid|
           list=verify.fetch(eid).instance_variable_get(:@list)
           raise 'Residual 75/80 options' if list.any?{|cmd|cmd.instance_variable_get(:@parameters).inspect.match?(/Lv75|Lv80/)}
           expected_size=eid==6 ? 588 : 605
           raise "Unexpected final size #{eid} #{list.size}" unless list.size==expected_size
          end
          puts "REMOVED=#{changed.inspect} COMMON_EVENTS_SHA256=#{Digest::SHA256.hexdigest(newbytes)}"
          RUBY_REMOVE
            python3 - <<'PY_CACHE'
          from pathlib import Path
          import hashlib,re
          root=Path('site/knight')
          rel='Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata'
          md5=hashlib.md5((root/'gameasync'/rel).read_bytes()).hexdigest()
          mp=root/'gameasync/mapping.js'
          s=mp.read_text(encoding='utf-8')
          s,n=re.subn(re.escape(rel+'?h=')+r'[0-9a-f]{32}',lambda _:rel+'?h='+md5,s)
          if n!=1: raise SystemExit('Expected exactly one CommonEvents mapping')
          mp.write_text(s,encoding='utf-8')
          index=root/'index.html'
          s=index.read_text(encoding='utf-8')
          old='gameasync/mapping.js?v=v229r4'
          if s.count(old)!=1: raise SystemExit('Unexpected source cache version')
          index.write_text(s.replace(old,'gameasync/mapping.js?v=v229r5'),encoding='utf-8')
          print('REMOVED_75_80_AND_REFRESHED_KNIGHT_CACHE')
          PY_CACHE
          else
            echo V229R5_ALREADY_APPLIED
          fi

      - name: Verify full game and choices integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CHECK'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          old=json.loads(Path('/tmp/knight_before_sha256.json').read_text())
          new={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if len(new)!=5354 or new.keys()!=old.keys(): raise SystemExit('Full site asset inventory changed')
          common='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata'
          expected={
            'knight/index.html':'c5dde3d791f901a180a2f13d43a20614702caeb657814e8b06d01424a27edc0e',
            'knight/gameasync/mapping.js':'aa72157f0b79cf1590eace5b7aae2004ad7c08090e67ea7f9b4d1aae31ce8624',
            common:'c1112940bc8ba843e0a7a108a09c09c00a8c952162c62b5f2119323353cb2959',
            'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap035.rxdata':'35f5fe74ec30d71614d1fc276d4044c816acf666758355b89a56cf8e71b6c27c',
            'knight/gameasync/Data/Scripts.rxdata':'9e3eaae707471a9ee395e5ede40b43bc8462f2be137bc9f3ffca484598062630'
          }
          for name,digest in expected.items():
              if new.get(name)!=digest: raise SystemExit('Unexpected asset digest '+name)
          changed={k for k in new if new[k]!=old[k]}
          wanted={'knight/index.html','knight/gameasync/mapping.js',common}
          version=Path('/tmp/knight_source_version').read_text()
          if (version=='V229R4' and changed!=wanted) or (version=='V229R5' and changed):
              raise SystemExit('Changes outside menu patch '+repr(changed))
          rel='Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata'
          mp=(root/'knight/gameasync/mapping.js').read_text(encoding='utf-8')
          md5=hashlib.md5((root/'knight/gameasync'/rel).read_bytes()).hexdigest()
          if mp.count(rel+'?h='+md5)!=1: raise SystemExit('CommonEvents mapping hash mismatch')
          if (root/'knight/index.html').read_text(encoding='utf-8').count('gameasync/mapping.js?v=v229r5')!=1:
              raise SystemExit('Knight HTML cache version mismatch')
          print('VALIDATED_75_80_REMOVAL_CHANGED_FILES',len(changed))
          PY_CHECK
          ruby - <<'RUBY_VERIFY'
          module RPG
           class CommonEvent;end
           class EventCommand;end
           class MoveRoute;end
           class MoveCommand;end
           class AudioFile;end
          end
          class Table
           def self._load(data);new(data);end
           def initialize(data);@data=data;end
           def _dump(depth);@data;end
          end
          path='site/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata'
          a=Marshal.load(File.binread(path))
          raise 'Common event count wrong' unless a.length==1061
          [6,17].each do |id|
           list=a.fetch(id).instance_variable_get(:@list)
           expected=id==6 ? 588 : 605
           raise "Event #{id} size wrong" unless list.length==expected
           matches=list.select do |cmd|
            if cmd.instance_variable_get(:@code)!=102
              false
            else
              opts=cmd.instance_variable_get(:@parameters).fetch(0)
              opts.length==2 && opts[0].start_with?('Lv65 ') && opts[1].start_with?('Lv70 ')
            end
           end
           raise "Expected only 65/70 choices in event #{id}" unless matches.length==1
           menu=matches.first
           ix=list.index(menu)
           depth=menu.instance_variable_get(:@indent)
           branches=list[(ix+1)..-1].select do |cmd|
            cmd.instance_variable_get(:@indent)==depth && [402,403,404].include?(cmd.instance_variable_get(:@code))
           end.take(4).map{|cmd|[cmd.instance_variable_get(:@code),cmd.instance_variable_get(:@code)==402 ? cmd.instance_variable_get(:@parameters)[0] : nil]}
           raise "Choice branches broken in event #{id}" unless branches==[[402,0],[402,1],[403,nil],[404,nil]]
           raise "Residual 75/80 menu #{id}" if list.any?{|cmd|cmd.instance_variable_get(:@parameters).inspect.match?(/Lv75|Lv80/)}
          end
          puts 'PASS_POLYMORPH_MENU_65_70_ONLY_BOTH_EVENTS'
          RUBY_VERIFY

      - name: Upload verified game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
