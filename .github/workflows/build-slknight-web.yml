
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V269
# PURPOSE: Emergency rollback of the broken V268 browser loader.
# BASE: Exact V267 successful GitHub Pages artifact, run 41441629897.
# IMPORTANT: NO source patching, NO browser loader replacements, NO asset changes.
# The published game is intentionally byte-for-byte V267.
# The workflow version is V269; in-game version labels remain V267 because
# changing them would invalidate the no-change rollback guarantee.

name: build-slknight-web.yml | V269 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: V269 Download last launchable V267 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41441629897
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V269 Restore and verify without modifying any game files
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          root=Path('site')
          files={str(p.relative_to(root)):p for p in root.rglob('*') if p.is_file()}
          assert len(files)==5610,('Unexpected V267 inventory',len(files))

          required=[
              'index.html',
              'knight/index.html',
              'knight/js/drive.js',
              'knight/js/sl-assets-v229r115.js',
              'knight/js/dpad.js',
              'knight/gameasync/mapping.js',
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap025.rxdata',
              'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap016.rxdata',
              'knight/assets/map-047-v241.pack',
          ]
          for name in required:
              assert name in files and files[name].stat().st_size>0,('Missing original file',name)

          for action in ('Idle','Walk','Attack','AltAttack','Spell','Hit','Death'):
              name='knight/gameasync/Graphics/Characters/SLZenith'+action+'.png'
              assert name in files and files[name].stat().st_size>0,name

          drive=files['knight/js/drive.js'].read_text('utf-8')
          loader=files['knight/js/sl-assets-v229r115.js'].read_text('utf-8')
          html=files['knight/index.html'].read_text('utf-8')
          for forbidden in ('slV268NetPending','slV268NetBlocked','slV268Drain',
                            'slV268DecodeFailed','slV268Stats','slV268ZenithReady'):
              assert forbidden not in drive+loader,('V268 broken patch retained',forbidden)
          assert 'function getLazyAsset(' in drive
          assert 'function preloadList(' in drive
          assert 'window.loadFileAsync' in drive
          assert "var version='V267';" in loader
          assert 'V267' in html
          assert 'v268' not in html.lower(), 'Broken V268 browser cache reference remains'

          inventory=hashlib.sha256()
          for name in sorted(files):
              inventory.update(name.encode('utf-8'))
              inventory.update(b'\0')
              inventory.update(hashlib.sha256(files[name].read_bytes()).digest())
          print('PASS byte-preserved V267 rollback, 5610 original game files')
          print('PASS V268 request/decode/prime patches absent')
          print('PASS original V267 browser loader, map and game scripts restored')
          print('V267_FILE_INVENTORY_SHA256='+inventory.hexdigest())
          PY
          node --check site/knight/js/drive.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/dpad.js

      - name: V269 Publish exact V267 game (no modifications)
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
