      - name: V229R27 Download the ENTIRE destination floor before native map transition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_ENTRY'
          from pathlib import Path
          root=Path('site/knight')
          loader=root/'js/drive.js'
          js=loader.read_text(encoding='utf-8')
          dummy='''        // Get filename
                  const file = mappingArray[i][1];'''
          changed=r'''        // Floor PNGs are not downloaded/registered in the village.
                  if (/^graphics\/panoramas\/slti_(?:45|46)_/i.test(mappingArray[i][0])) continue;
                  // Get filename
                  const file = mappingArray[i][1];'''
          assert js.count(dummy)==1,'createDummies anchor missing'
          js=js.replace(dummy,changed,1)

          # Hold the native Map045/Map046 load callback until ALL PNG bytes for that
          # floor are downloaded into Emscripten FS. No image decoding here.
          hook='''                window.fileAsyncCache[mappingKey] = 1;
                          if (!bitmap && window.setNotBusy) window.setNotBusy();
                          if (window.fileLoadedAsync) window.fileLoadedAsync(fullPath);
                          callback();
                          if (cb1) cb1();'''
          body='''                window.fileAsyncCache[mappingKey] = 1;
                          const destination = /^data\\/[^/]*map0?(45|46)$/.exec(mappingKey);
                          const finish = () => {
                              if (!bitmap && window.setNotBusy) window.setNotBusy();
                              if (window.fileLoadedAsync) window.fileLoadedAsync(fullPath);
                              callback();
                              if (cb1) cb1();
                          };
                          if (destination) {
                              const floor = Number(destination[1]);
                              const prepare = () => window.sltiDownloadFloor(floor).then(finish).catch(error => {
                                  console.error('SLTI floor download failed', floor, error);
                                  const p = document.getElementById('progress');
                                  if (p) {
                                      p.style.opacity = '1';
                                      p.innerHTML = 'Dungeon floor ' + floor + ' download failed. Tap to retry.';
                                      p.onclick = function() { p.onclick = null; prepare(); };
                                  }
                              });
                              prepare();
                          } else {
                              finish();
                          }'''
          assert js.count(hook)==1,'native map callback anchor missing'
          js=js.replace(hook,body,1)
          anchor='window.setBusy = function() {'
          prefetch=r'''// Download ONE COMPLETE FLOOR when Map045/Map046 is requested, not at startup.
          // Store compressed PNG bytes into the existing game FS WITHOUT decoding them.
          // The native loading callback stays blocked until all 45 or 66 files finish.
          // During movement Bitmap.new uses these cached files, making ZERO HTTP calls.
          window.sltiFloorDownloadPromises = {};
          window.sltiFloorCompleted = {};
          window.sltiDownloadFloor = function(floor) {
              if (floor !== 45 && floor !== 46) return Promise.reject(new Error('Unknown floor'));
              if (window.sltiFloorCompleted[floor]) return Promise.resolve();
              if (window.sltiFloorDownloadPromises[floor]) return window.sltiFloorDownloadPromises[floor];
              const prefix = 'graphics/panoramas/slti_' + floor + '_';
              const items = mappingArray.filter(row => row[0].indexOf(prefix) === 0);
              const expected = floor === 45 ? 45 : 66;
              if (items.length !== expected) return Promise.reject(new Error('Missing floor files: ' + items.length));
              let next = 0, done = 0;
              const progress = document.getElementById('progress');
              function show() {
                  if (progress) {
                      progress.style.opacity = '0.8';
                      progress.innerHTML = 'Dungeon ' + (floor === 45 ? '1F' : '2F') +
                                           ' download ' + done + '/' + expected;
                  }
              }
              function worker() {
                  if (next >= items.length) return Promise.resolve();
                  const row = items[next++];
                  const key = row[0], asset = row[1];
                  const full = '/game/' + asset.split('?')[0];
                  if (window.fileAsyncCache[key] && FS.analyzePath(full).exists) {
                      done++; show();
                      return worker();
                  }
                  const url = 'gameasync/' + asset;
                  const filename = asset.substring(asset.lastIndexOf('/') + 1).split('?')[0];
                  return new Promise((resolve, reject) => {
                      function attempt(retry) {
                          getLazyAsset(url, filename, data => {
                              if (!data || !data.byteLength) {
                                  if (retry < 2) return attempt(retry + 1);
                                  return reject(new Error('PNG download failed: ' + filename));
                              }
                              try {
                                  if (FS.analyzePath(full).exists) FS.unlink(full);
                                  FS.writeFile(full, new Uint8Array(data));
                                  window.fileAsyncCache[key] = 1;
                                  resolve();
                              } catch (error) { reject(error); }
                          }, true);
                      }
                      attempt(0);
                  }).then(() => {
                      done++; show();
                      return worker();
                  });
              }
              show();
              // At most three simultaneous compressed-file network downloads.
              // No 45-image decode and no 45-image texture allocation at floor entry.
              const task = Promise.all([worker(), worker(), worker()]).then(() => {
                  if (done !== expected) throw new Error('Incomplete floor: ' + done + '/' + expected);
                  window.sltiFloorCompleted[floor] = true;
                  if (progress) { progress.style.opacity = '0'; progress.onclick = null; }
              }).catch(error => {
                  delete window.sltiFloorDownloadPromises[floor];
                  throw error;
              });
              window.sltiFloorDownloadPromises[floor] = task;
              return task;
          };

          '''
          assert js.count(anchor)==1,'download insertion anchor missing'
          js=js.replace(anchor,prefetch+anchor,1)
          old='''        const mappingKey = getMappingKey(file);
                  const mappingValue = mapping[mappingKey];
                  if (!mappingValue || window.fileAsyncCache[mappingKey]) return;'''
          new='''        const mappingKey = getMappingKey(file);
                  // Never preload the other floor, or either map, while in the village.
                  if (/^graphics\\/panoramas\\/slti_(?:45|46)_/.test(mappingKey) ||
                      /^data\\/[^/]*map0?(45|46)$/.test(mappingKey)) return;
                  const mappingValue = mapping[mappingKey];
                  if (!mappingValue || window.fileAsyncCache[mappingKey]) return;'''
          assert js.count(old)==1,'preloadList anchor missing'
          js=js.replace(old,new,1)
          loader.write_text(js,encoding='utf-8')
          html=root/'index.html';t=html.read_text(encoding='utf-8')
          old='js/drive.js?v=v143z100'
          assert t.count(old)==1,'browser loader URL changed'
          html.write_text(t.replace(old,'js/drive.js?v=v229r27'),encoding='utf-8')
          print('PASS native Map045/046 load waits for complete floor PNG bytes; no image decode in downloader')
          PY_ENTRY
          node --check site/knight/js/drive.js

      - name: V229R27 Simulate boot, whole-floor entrance, and zero network walking
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS_FLOOR_GATE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const root='site/knight/';
          const files=new Map(),dirs=new Set(),requests=[];
          const FS={
            mkdir(path){dirs.add(path);},
            writeFile(path,bytes){files.set(path,bytes);},
            analyzePath(path){return {exists:files.has(path)||dirs.has(path)};},
            createPreloadedFile(path,name,bytes,r,w,ok){files.set(path+'/'+name,bytes);if(ok)ok();},
            unlink(path){files.delete(path);}
          };
          function FakeXHR(){this.readyState=0;this.status=200;this.responseType='';}
          FakeXHR.DONE=4;
          FakeXHR.prototype.open=function(method,url){this.url=url;};
          FakeXHR.prototype.send=function(){
            requests.push(this.url);
            setImmediate(()=>{
              this.response=new Uint8Array([137,80,78,71,99]).buffer;
              this.readyState=4;
              if(this.onreadystatechange)this.onreadystatechange();
            });
          };
          FakeXHR.prototype.abort=function(){};
          const progress={style:{},innerHTML:'',onclick:null};
          const spinner={style:{},innerHTML:''};
          const sandbox={FS,console,XMLHttpRequest:FakeXHR,
            document:{title:'',createElement:()=>({}),getElementById:id=>(id==='progress'?progress:spinner)},
            localforage:{},wTitle:'SLKnight',setTimeout,clearTimeout,
            fetch:()=>Promise.resolve({json:()=>Promise.resolve([])})};
          sandbox.window=sandbox;
          vm.createContext(sandbox);
          vm.runInContext(fs.readFileSync(root+'gameasync/mapping.js','utf8'),sandbox);
          vm.runInContext(fs.readFileSync(root+'js/drive.js','utf8'),sandbox);
          sandbox.createDummies();
          const assets=sandbox.mappingArray.filter(x=>/^graphics\/panoramas\/slti_(45|46)_/.test(x[0]));
          assert.equal(assets.length,111);
          const floorAssets=n=>assets.filter(x=>x[0].startsWith('graphics/panoramas/slti_'+n+'_'));
          const pathFor=row=>'/game/'+row[1].split('?')[0];
          assert.equal(floorAssets(45).filter(row=>files.has(pathFor(row))).length,0);
          assert.equal(floorAssets(46).filter(row=>files.has(pathFor(row))).length,0);
          sandbox.preloadList(['Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap045.rxdata',
             'Graphics/Panoramas/SLTI_45_C1_1.png']);
          assert.equal(requests.length,0,'Dungeon download occurred during village preload');
          function load(name){return new Promise((resolve,reject)=>{
            let count=0;
            sandbox.loadFileAsync(name,null,()=>{count++; if(count>1)reject(new Error('double callback'));else resolve();});
          });}
          (async()=>{
            const pre='Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap';
            await load(pre+'045.rxdata');
            assert.equal(requests.length,46,'Map045 + all 45 PNGs must download before first play frame');
            assert.equal(floorAssets(45).filter(row=>files.has(pathFor(row))).length,45);
            assert.equal(floorAssets(46).filter(row=>files.has(pathFor(row))).length,0);
            assert.equal(sandbox.sltiFloorCompleted[45],true);
            let before=requests.length;
            for(const row of floorAssets(45)){
              await load(row[1].split('?')[0]);
            }
            assert.equal(requests.length,before,'Walking across 1F caused network requests');
            await load(pre+'046.rxdata');
            assert.equal(requests.length,before+67,'Map046 + all 66 PNGs at 2F entrance');
            assert.equal(floorAssets(46).filter(row=>files.has(pathFor(row))).length,66);
            before=requests.length;
            for(const row of floorAssets(46))await load(row[1].split('?')[0]);
            await load(pre+'045.rxdata');
            assert.equal(requests.length,before,'Walking or revisiting floor caused network requests');
            console.log('PASS village=0; 1F enter=45 PNGs before game resumes; 1F walking=0; 2F enter=66; 2F walking=0; revisit=0');
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS_FLOOR_GATE

