name: Deploy SLKnight Runtime Log Capture V5

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-slknight-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  ENGINE_REPO: white-axe/mkxp-z-libretro-emscripten
  ENGINE_REF: f0a1ff80f05dd0d1f8ca711485a5b0a601bc7502
  SITE_URL: https://gowellsik-hue.github.io/Game

jobs:
  build:
    name: Build runtime logger V5
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Checkout frontend source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          submodules: false
          path: engine

      - name: Download existing single-thread engine and game
        run: |
          set -e
          mkdir -p engine/nostalgist/public

          for file in mkxp-z_libretro.js mkxp-z_libretro.wasm slknight.mkxpz
          do
            curl -L \
              --fail \
              --retry 3 \
              -H 'Cache-Control: no-cache' \
              "${SITE_URL}/${file}?run=${GITHUB_RUN_ID}" \
              -o "engine/nostalgist/public/${file}"
          done

          test -s engine/nostalgist/public/mkxp-z_libretro.js
          test -s engine/nostalgist/public/mkxp-z_libretro.wasm
          test -s engine/nostalgist/public/slknight.mkxpz

          ls -lh \
            engine/nostalgist/public/mkxp-z_libretro.js \
            engine/nostalgist/public/mkxp-z_libretro.wasm \
            engine/nostalgist/public/slknight.mkxpz

      - name: Configure single-thread frontend
        run: |
          set -e

          cat > engine/nostalgist/.env <<'ENVEOF'
          VITE_CORE_JS_PATH=./mkxp-z_libretro.js
          VITE_CORE_WASM_PATH=./mkxp-z_libretro.wasm
          VITE_GAME_NAME=SLKnight Runtime Logger V5
          VITE_GAME_PATH=./slknight.mkxpz
          VITE_XP_CONTROLS=true
          VITE_HAVE_OPFS=false
          VITE_REQUIRE_OPFS=false
          ENVEOF

      - name: Inject filtered runtime logger V5
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          index_path = Path("engine/nostalgist/index.html")
          html = index_path.read_text(encoding="utf-8")

          html = html.replace(
              '<meta name="viewport" content="width=device-width, initial-scale=1.0" />',
              '<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />',
              1,
          )

          html = html.replace(
              '<script src="./coi-serviceworker.min.js"></script>',
              '',
              1,
          )

          html = re.sub(
              r'<script>\s*// Send a dummy message every 5 seconds.*?</script>',
              '',
              html,
              count=1,
              flags=re.S,
          )

          html = re.sub(
              r'<p id="user-activation-prompt"[^>]*>\s*▶\s*</p>',
              '<p id="user-activation-prompt" style="display:none;font-size:18px;padding:14px 20px;border:1px solid #888;border-radius:10px;background:#111;color:#fff">화면을 터치해 실행</p>',
              html,
              count=1,
              flags=re.S,
          )

          index_path.write_text(
              html,
              encoding="utf-8"
          )

          main_path = Path(
              "engine/nostalgist/src/main.ts"
          )

          text = main_path.read_text(
              encoding="utf-8"
          )

          title_marker = (
              "if (GAME_NAME !== null) {\n"
              "  document.title = GAME_NAME;\n"
              "}\n"
          )

          if text.count(title_marker) != 1:
              raise SystemExit(
                  "PATCH FAILED: title marker"
              )

          logger = r'''

          const slLines: string[] = [];
          const slPinned: string[] = [];
          const slBox = document.createElement("div");

          slBox.id = "sl-runtime-log";

          slBox.style.cssText = `
            position: fixed;
            z-index: 2147483647;
            left: 5px;
            top: 5px;
            width: calc(100vw - 10px);
            max-height: 64vh;
            overflow: hidden;
            box-sizing: border-box;
            padding: 7px;
            border: 1px solid #aaa;
            border-radius: 6px;
            background: rgba(0,0,0,.92);
            color: #fff;
            font: 10px/1.28 monospace;
            white-space: pre-wrap;
            word-break: break-all;
            pointer-events: none;
          `;

          document.body.appendChild(slBox);

          const slString = (
            value: unknown
          ): string => {
            if (value instanceof Error) {
              return (
                value.stack ??
                value.message
              );
            }

            if (
              typeof value ===
              "string"
            ) {
              return value;
            }

            try {
              const json =
                JSON.stringify(value);

              if (
                typeof json ===
                "string"
              ) {
                return json;
              }
            } catch {
              // ignore
            }

            return String(value);
          };

          const slJoined = (
            ...values: unknown[]
          ) =>
            values
              .map(slString)
              .join(" ");

          const slImportant = (
            line: string
          ) => {
            const lower =
              line.toLowerCase();

            return [
              "error",
              "warn",
              "fatal",
              "exception",
              "loaderror",
              "runtimeerror",
              "syntaxerror",
              "nomethoderror",
              "errno",
              "failed",
              "failure",
              "not found",
              "no such file",
              "unsupported",
              "abort",
              "cannot",
              "could not",
              "invalid",
            ].some(
              (token) =>
                lower.includes(token)
            );
          };

          const slNoise = (
            line: string
          ) => {
            if (
              slImportant(line)
            ) {
              return false;
            }

            return (
              line.includes(
                "[libretro DEBUG]"
              ) ||
              line.includes(
                "wasi:filesystem/"
              ) ||
              line.includes(
                "descriptor.open-at("
              ) ||
              line.includes(
                "WASI resource created:"
              ) ||
              line.includes(
                "descriptor.read-via-stream("
              ) ||
              line.includes(
                "input-stream.read("
              ) ||
              line.includes(
                "pollable.block("
              )
            );
          };

          const slRender = () => {
            slBox.textContent = [
              "SLKnight RUNTIME LOG V5",
              "================================",
              ...slPinned.slice(-10),
              "--------------------------------",
              ...slLines.slice(-32),
            ].join("\n");
          };

          const slLog = (
            ...values: unknown[]
          ) => {
            const line =
              slJoined(...values);

            if (
              slNoise(line)
            ) {
              return;
            }

            slLines.push(line);

            if (
              slLines.length > 200
            ) {
              slLines.splice(
                0,
                slLines.length - 200
              );
            }

            slRender();
          };

          const slPin = (
            ...values: unknown[]
          ) => {
            const line =
              slJoined(...values);

            slPinned.push(line);

            if (
              slPinned.length > 30
            ) {
              slPinned.splice(
                0,
                slPinned.length - 30
              );
            }

            slRender();
          };

          const slConsoleLog =
            console.log.bind(console);

          const slConsoleInfo =
            console.info.bind(console);

          const slConsoleWarn =
            console.warn.bind(console);

          const slConsoleError =
            console.error.bind(console);

          console.log = (
            ...values: unknown[]
          ) => {
            slConsoleLog(...values);

            slLog(
              "[LOG]",
              ...values
            );
          };

          console.info = (
            ...values: unknown[]
          ) => {
            slConsoleInfo(...values);

            slLog(
              "[STDOUT]",
              ...values
            );
          };

          console.warn = (
            ...values: unknown[]
          ) => {
            slConsoleWarn(...values);

            slLog(
              "[WARN]",
              ...values
            );
          };

          console.error = (
            ...values: unknown[]
          ) => {
            slConsoleError(...values);

            slLog(
              "[STDERR]",
              ...values
            );
          };

          window.addEventListener(
            "error",
            (event) => {
              slPin(
                "[WINDOW ERROR]",
                event.message,
                event.filename,
                event.lineno,
                event.colno,
              );
            }
          );

          window.addEventListener(
            "unhandledrejection",
            (event) => {
              slPin(
                "[PROMISE ERROR]",
                event.reason,
              );
            }
          );

          slPin(
            "[BOOT] LOGGER READY"
          );
          '''

          text = text.replace(
              title_marker,
              title_marker + logger,
              1,
          )

          secure_marker = (
              "// Multithreaded WebAssembly "
              "requires a secure context"
          )

          opfs_marker = (
              "const opfs = !HAVE_OPFS"
          )

          secure_pos = text.find(
              secure_marker
          )

          opfs_pos = text.find(
              opfs_marker,
              secure_pos,
          )

          if (
              secure_pos < 0
              or opfs_pos < 0
          ):
              raise SystemExit(
                  "PATCH FAILED: COI region"
              )

          text = (
              text[:secure_pos]
              + 'slPin("[BOOT] SINGLE THREAD MODE");\n\n'
              + text[opfs_pos:]
          )

          old_libretro = (
              "libretro_log_level: "
              "import.meta.env.DEV ? 0 : 1,"
          )

          old_frontend = (
              "frontend_log_level: "
              "import.meta.env.DEV ? 0 : 1,"
          )

          if (
              text.count(
                  old_libretro
              ) != 1
          ):
              raise SystemExit(
                  "PATCH FAILED: libretro log level"
              )

          if (
              text.count(
                  old_frontend
              ) != 1
          ):
              raise SystemExit(
                  "PATCH FAILED: frontend log level"
              )

          text = text.replace(
              old_libretro,
              "libretro_log_level: 0,",
              1,
          )

          text = text.replace(
              old_frontend,
              "frontend_log_level: 0,",
              1,
          )

          prepare_marker = (
              "const nostalgist = "
              "await Nostalgist.prepare({"
          )

          if (
              text.count(
                  prepare_marker
              ) != 1
          ):
              raise SystemExit(
                  "PATCH FAILED: prepare marker"
              )

          text = text.replace(
              prepare_marker,
              'slPin("[BOOT] PREPARE BEGIN");\n\n'
              + prepare_marker,
              1,
          )

          after_prepare_marker = (
              "\n\nif (opfs !== null) {"
          )

          prepare_pos = text.find(
              prepare_marker
          )

          prepare_end = text.find(
              after_prepare_marker,
              prepare_pos,
          )

          if prepare_end < 0:
              raise SystemExit(
                  "PATCH FAILED: prepare end"
              )

          after_prepare = r'''

          slPin(
            "[BOOT] PREPARE COMPLETE"
          );

          try {
            const slFs =
              nostalgist
                .getEmscriptenFS();

            const slContentDir =
              "/home/web_user/retroarch/userdata/content";

            slPin(
              "[FS CONTENT]",
              slFs
                .readdir(
                  slContentDir
                )
                .join(" | "),
            );
          } catch (error) {
            slPin(
              "[FS CONTENT ERROR]",
              error
            );
          }

          try {
            const slModule =
              nostalgist
                .getEmscripten()
                .Module;

            const slOriginalCallMain =
              slModule
                .callMain
                .bind(slModule);

            slModule.callMain =
              (
                args: string[]
              ) => {
                slPin(
                  "[CALLMAIN]",
                  args.join(" "),
                );

                try {
                  return (
                    slOriginalCallMain(
                      args
                    )
                  );
                } catch (error) {
                  slPin(
                    "[CALLMAIN THROW]",
                    error,
                  );

                  throw error;
                }
              };
          } catch (error) {
            slPin(
              "[CALLMAIN WRAP ERROR]",
              error,
            );
          }
          '''

          text = (
              text[:prepare_end]
              + after_prepare
              + text[prepare_end:]
          )

          start_marker = (
              "await nostalgist.start();"
          )

          if (
              text.count(
                  start_marker
              ) != 1
          ):
              raise SystemExit(
                  "PATCH FAILED: start marker"
              )

          start_replacement = r'''

          slPin(
            "[START] CALLING CORE"
          );

          try {
            await nostalgist.start();

            slPin(
              "[START] RETURNED",
              "status=" +
                nostalgist.getStatus(),
            );
          } catch (error) {
            slPin(
              "[START ERROR]",
              error,
            );

            throw error;
          }

          let slBeat = 0;

          const slTimer =
            window.setInterval(
              () => {
                slBeat += 1;

                const canvas =
                  document
                    .getElementById(
                      "nostalgist-canvas",
                    )
                    as HTMLCanvasElement
                    | null;

                slPin(
                  "[HEARTBEAT " +
                    String(slBeat) +
                    "]",
                  "status=" +
                    nostalgist
                      .getStatus(),
                  "canvas=" +
                    String(
                      canvas?.width ?? 0
                    ) +
                    "x" +
                    String(
                      canvas?.height ?? 0
                    ),
                  "css=" +
                    String(
                      canvas
                        ?.clientWidth ?? 0
                    ) +
                    "x" +
                    String(
                      canvas
                        ?.clientHeight ?? 0
                    ),
                );

                if (
                  slBeat >= 12
                ) {
                  window.clearInterval(
                    slTimer
                  );
                }
              },
              2000,
            );
          '''

          text = text.replace(
              start_marker,
              start_replacement,
              1,
          )

          main_path.write_text(
              text,
              encoding="utf-8",
          )

          final_text = (
              main_path.read_text(
                  encoding="utf-8"
              )
          )

          required = [
              "SLKnight RUNTIME LOG V5",
              "slNoise",
              "[STDERR]",
              "[FS CONTENT]",
              "[CALLMAIN]",
              "[CALLMAIN THROW]",
              "[START] CALLING CORE",
              "[HEARTBEAT ",
              '.join("\\n")',
          ]

          for item in required:
              if (
                  item
                  not in final_text
              ):
                  raise SystemExit(
                      "FINAL VALIDATION FAILED: "
                      + item
                  )

          print(
              "SLKNIGHT_RUNTIME_LOG_V5_PATCH_OK"
          )
          PY

      - name: Install packages
        working-directory: engine/nostalgist
        run: |
          set -e
          npm install

      - name: Format patched source
        working-directory: engine/nostalgist
        run: |
          set -e
          npx prettier --write src/main.ts index.html

      - name: Type check patched source
        working-directory: engine/nostalgist
        run: |
          set -e
          npm run lint

      - name: Generate hashes and sizes
        working-directory: engine/nostalgist
        run: |
          set -e
          node update-env.ts

      - name: Build GitHub Pages version
        working-directory: engine/nostalgist
        run: |
          set -e
          npx vite build --base=./
          touch dist/.nojekyll

      - name: Verify output
        run: |
          set -e

          test -s engine/nostalgist/dist/index.html
          test -s engine/nostalgist/dist/mkxp-z_libretro.js
          test -s engine/nostalgist/dist/mkxp-z_libretro.wasm
          test -s engine/nostalgist/dist/slknight.mkxpz

          grep -Fq \
            'src="./assets/' \
            engine/nostalgist/dist/index.html

          grep -FRq \
            'SLKnight RUNTIME LOG V5' \
            engine/nostalgist/dist/assets

          grep -FRq \
            '[CALLMAIN]' \
            engine/nostalgist/dist/assets

          echo 'SLKNIGHT_RUNTIME_LOG_V5_BUILD_OK'

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: engine/nostalgist/dist

  deploy:
    name: Deploy GitHub Pages

    needs:
      - build

    runs-on:
      ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
