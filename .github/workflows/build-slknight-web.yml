
# FILE: .github/workflows/build-slknight-web.yml
# BASE VERSION: V276.7.4.1
# SPEED PATCH VERSION: V1.1
# BASE SUCCESSFUL RUN: 41969829452
#
# RULES:
# - Preserve the original workflow filename and title.
# - Preserve existing morph attack speed values.
# - Preserve existing animation frames, combat events and hit timing.
# - Do not add another Game_Player or Interpreter speed hook.
# - Modify only the existing SLV229::Speed calculation.
# - Haste, bravery and morph retain their existing coefficients.
# - Holy Walk: 32 seconds, movement x1.33, attack unchanged.
# - Slow: 64 seconds, movement x0.5, attack x0.5.
# - Independent status timers inside the existing Speed.tick.
# - Never multiply a previously modified speed a second time.
# - Stop the build if native spell entry points cannot be verified.
# - No automatic deployment of an unverified modification.

name: build-slknight-web.yml | V276.7.4 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Restore successful V276.7.4.1 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41969829452
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify successful game files
        shell: bash
        run: |
          set -euo pipefail

          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path('site')

          files = {
              str(p.relative_to(root)):
                  hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          assert len(files) == 5623, (
              'Successful file count', len(files)
          )

          pre = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          data = root / 'knight/gameasync/Data'

          for name in (
              pre + 'Map019.rxdata',
              pre + 'Map025.rxdata',
              pre + 'CommonEvents.rxdata',
              pre + 'Animations.rxdata',
              'Scripts.rxdata'
          ):
              assert (data / name).is_file(), name

          for name in ('index.html', 'knight/index.html'):
              assert 'V276.7.4.1' in (
                  root / name
              ).read_text('utf-8')

          Path('build/original_sha256.json').write_text(
              json.dumps(files),
              encoding='utf-8'
          )

          print('PASS V276.7.4.1 baseline')
          PY

      - name: Fix Queen native HP regeneration and death display
        shell: bash
        run: |
          set -euo pipefail

          cat > build/zq_native_events.rb <<'RUBY'
          module RPG
            class Map; end
            class Event
              class Page
                class Condition; end
                class Graphic; end
              end
            end
            class CommonEvent; end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
            class AudioFile; end
            class Animation
              class Frame; end
              class Timing; end
            end
          end

          class Table
            def self._load(bytes)
              obj = allocate
              obj.instance_variable_set(:@raw, bytes)
              obj
            end

            def _dump(level = 0)
              @raw
            end
          end

          class Tone
            def self._load(bytes)
              obj = allocate
              obj.instance_variable_set(:@raw, bytes)
              obj
            end

            def _dump(level = 0)
              @raw
            end
          end

          class Color < Tone; end

          def iv(object, name)
            object.instance_variable_get('@' + name.to_s)
          end

          def put(object, name, value)
            object.instance_variable_set('@' + name.to_s, value)
          end

          def copy(object)
            Marshal.load(Marshal.dump(object))
          end

          def check(condition, message)
            raise message unless condition
          end

          def command(template, code, indent, parameters)
            result = copy(template)
            put(result, :code, code)
            put(result, :indent, indent)
            put(result, :parameters, parameters)
            result
          end

          pre = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          root = 'site/knight/gameasync/Data/'

          path19 = root + pre + 'Map019.rxdata'
          path25 = root + pre + 'Map025.rxdata'
          common_path = root + pre + 'CommonEvents.rxdata'
          anims_path = root + pre + 'Animations.rxdata'
          script_path = root + 'Scripts.rxdata'

          map19 = Marshal.load(File.binread(path19))
          map25 = Marshal.load(File.binread(path25))
          common = Marshal.load(File.binread(common_path))
          animations = Marshal.load(File.binread(anims_path))

          scripts_before = File.binread(script_path)
          map19_before = File.binread(path19)
          anims_before = File.binread(anims_path)

          check(
            common.length == 1069,
            'Baseline CE count mismatch'
          )

          check(
            animations.length == 924,
            'Baseline animation count mismatch'
          )

          check(
            iv(map25, :events).length == 19,
            'Map025 event count mismatch'
          )

          check(
            !iv(map25, :events).key?(30),
            'Queen recovery event occupied'
          )

          queen = iv(map25, :events).fetch(29)
          pages = iv(queen, :pages)

          check(
            pages.length == 5,
            'Queen page count mismatch'
          )

          death_condition = iv(pages[3], :condition)

          check(
            iv(death_condition, :variable_id) == 4988,
            'HP variable mismatch'
          )

          check(
            iv(death_condition, :variable_value) == 520,
            'Queen max HP changed'
          )

          check(
            iv(pages[2], :list)[0]
              .instance_variable_get(:@parameters)[0]
              .include?('4988'),
            'Original Queen HP display not found'
          )

          source = iv(map19, :events).fetch(16)
          source_page = iv(source, :pages).fetch(0)
          source_list = iv(source_page, :list)

          check(
            iv(source_page, :trigger) == 4,
            'Death Knight regen not parallel'
          )

          check(
            iv(source_list[0], :code) == 106 &&
            iv(source_list[0], :parameters) == [100],
            'Death Knight 100-frame regen changed'
          )

          check(
            iv(source_list[29], :parameters) ==
              [1, 276, 0, 4000, 4],
            'Death Knight HP guard changed'
          )

          check(
            iv(source_list[30], :parameters) ==
              [1, 276, 0, 416, 1],
            'Death Knight minimum regen guard changed'
          )

          check(
            iv(source_list[31], :parameters) ==
              [276, 276, 2, 0, 416],
            'Death Knight native regen changed'
          )

          regen = copy(source)

          put(regen, :id, 30)
          put(regen, :name, '[ZQ] HP 회복')
          put(regen, :x, iv(queen, :x))
          put(regen, :y, iv(queen, :y))

          rp = iv(regen, :pages).fetch(0)

          put(rp, :through, true)
          put(rp, :trigger, 4)
          put(rp, :move_type, 0)
          put(rp, :walk_anime, false)
          put(rp, :step_anime, false)

          put(rp, :list, [
            command(source_list[0], 106, 0, [100]),
            command(source_list[1], 111, 0,
                    [1, 4988, 0, 520, 4]),
            command(source_list[2], 111, 1,
                    [1, 4988, 0, 50, 1]),
            command(source_list[3], 122, 2,
                    [4988, 4988, 2, 0, 50]),
            command(source_list[32], 355, 2, [
              '$m.drawMHP("제니스 퀸",$game_variables[4988],520,2)'
            ]),
            command(source_list[33], 0, 2, []),
            command(source_list[34], 412, 1, []),
            command(source_list[35], 0, 1, []),
            command(source_list[36], 412, 0, []),
            command(source_list[37], 0, 0, [])
          ])

          iv(map25, :events)[30] = regen

          death_graphic = iv(pages[3], :graphic)

          check(
            iv(death_graphic, :character_name) == 'SLZQBlank',
            'Original blank death page changed'
          )

          put(death_graphic, :character_name, 'SLZQDeath')
          put(death_graphic, :pattern, 0)

          death_event = common.fetch(1067)
          dl = iv(death_event, :list)

          ids = dl.select {
            |c| iv(c, :code) == 207
          }.map {
            |c| iv(c, :parameters)
          }

          check(
            ids == [[29, 920], [29, 921], [29, 922], [29, 923]],
            'Existing directional death animation changed'
          )

          check(
            dl.any? {
              |c| iv(c, :code) == 106 &&
                  iv(c, :parameters) == [70]
            },
            'Existing 70-frame death wait changed'
          )

          check(
            !dl.any? {
              |c| iv(c, :code) == 355 &&
                  iv(c, :parameters).join.include?('sl_attack_begin')
            },
            'Death visibility hook already present'
          )

          death_show = command(dl[1], 355, 0, [
            'e=$game_map.events[29]; e.sl_attack_begin("SLZQWalk",34) if e && e.respond_to?(:sl_attack_begin)'
          ])

          dl.insert(2, death_show)

          (920..923).each do |id|
            a = animations.fetch(id)

            check(
              iv(a, :frame_max) == 34 &&
              iv(a, :frames).length == 34,
              'Native death animation changed'
            )
          end

          File.binwrite(path25, Marshal.dump(map25))
          File.binwrite(common_path, Marshal.dump(common))

          check(
            File.binread(path19) == map19_before,
            'Death Knight data modified'
          )

          check(
            File.binread(anims_path) == anims_before,
            'Original animations modified'
          )

          check(
            File.binread(script_path) == scripts_before,
            'Original scripts modified'
          )

          verify_map = Marshal.load(File.binread(path25))
          verify_ce = Marshal.load(File.binread(common_path))
          vreg = iv(verify_map, :events).fetch(30)

          check(
            iv(iv(vreg, :pages)[0], :list).length == 10,
            'Regen command count'
          )

          check(
            iv(iv(vreg, :pages)[0], :trigger) == 4,
            'Regen not parallel'
          )

          check(
            iv(iv(verify_map, :events)[29], :pages)[3]
              .instance_variable_get(:@graphic)
              .instance_variable_get(:@character_name) ==
              'SLZQDeath',
            'Visible death graphic missing'
          )

          check(
            iv(verify_ce.fetch(1067), :list).length == 17,
            'Original death script modified unexpectedly'
          )

          puts 'PASS original Queen recovery and death'
          puts 'PASS original attacks, magic and movement preserved'
          RUBY

          ruby -c build/zq_native_events.rb
          ruby build/zq_native_events.rb

      - name: Apply Speed V1.1 inside existing SLV229 controller
        shell: bash
        run: |
          set -euo pipefail

          cat > build/speed_v11.rb <<'RUBY'
          require 'zlib'

          module RPG
            class CommonEvent; end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
            class AudioFile; end
          end

          def check(condition, message)
            raise message unless condition
          end

          def iv(object, name)
            object.instance_variable_get('@' + name.to_s)
          end

          def put(object, name, value)
            object.instance_variable_set('@' + name.to_s, value)
          end

          def replace_once(source, before, after, label)
            count = source.scan(Regexp.new(Regexp.escape(before))).length
            check(
              count == 1,
              "V1.1 source mismatch #{label}: #{count}"
            )
            source.sub(before, after)
          end

          def clone_command(template, code, indent, parameters)
            result = Marshal.load(Marshal.dump(template))
            put(result, :code, code)
            put(result, :indent, indent)
            put(result, :parameters, parameters)
            result
          end

          pre = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          root = 'site/knight/gameasync/Data/'

          script_path = root + 'Scripts.rxdata'
          common_path = root + pre + 'CommonEvents.rxdata'

          scripts = Marshal.load(File.binread(script_path))
          common = Marshal.load(File.binread(common_path))

          original_scripts = Marshal.load(Marshal.dump(scripts))
          original_common = Marshal.load(Marshal.dump(common))

          matches = scripts.each_index.select do |i|
            scripts[i].is_a?(Array) &&
            scripts[i][1].to_s == 'V229 Unified Speed Rules'
          end

          check(
            matches.length == 1,
            'Existing V229 controller not uniquely identified'
          )

          script_index = matches.fetch(0)
          entry = scripts.fetch(script_index)

          source = Zlib::Inflate.inflate(entry[2])

          check(
            source.scan('module SLV229').length == 1,
            'Unexpected speed module'
          )

          check(
            !source.include?('def self.holy_walk_active?'),
            'Holy Walk speed patch already installed'
          )

          check(
            !source.include?('def self.slow_active?'),
            'Slow speed patch already installed'
          )

          # Keep all existing V229 polymorph, potion and attack
          # coefficients exactly as they are.
          protected_attack = source[
            /    def self.attack_base_rate\n.*?^    end/m
          ]

          check(
            protected_attack &&
            protected_attack.include?('when :dk52'),
            'Existing polymorph attack table missing'
          )

          protected_wait = source[
            /    def self.convert_attack_wait\(.*?^    end/m
          ]

          check(
            protected_wait,
            'Original attack frame conversion missing'
          )

          # Independent status is stored in Game_System, like
          # existing haste/bravery state. No second update hook.
          extra_methods = <<'METHODS'

              def self.holy_walk_active?
                get(:@slv11_holy_frames).to_i > 0
              end

              def self.slow_active?
                get(:@slv11_slow_frames).to_i > 0
              end

              def self.use_holy_walk(seconds = 32)
                init
                duration = [seconds.to_i, 0].max
                put(:@slv11_holy_frames, duration * fps)
                apply_movement
              end

              def self.apply_slow(seconds = 64)
                init
                duration = [seconds.to_i, 0].max
                put(:@slv11_slow_frames, duration * fps)
                apply_movement
              end

          METHODS

          # Remove the heredoc's outer indentation only.
          extra_methods = extra_methods.lines.map do |line|
            line.start_with?('              ') ?
              line[10..-1] : line
          end.join

          source = replace_once(
            source,
            "    def self.move_rate\n",
            extra_methods + "    def self.move_rate\n",
            'existing movement method'
          )

          # Existing movement formula, without another multiplier
          # after apply_movement.
          old_move = <<'OLD'
              def self.move_rate
                polymorph_rate = form == :baphomet ? 1.5 : 1.0
                polymorph_rate *= 2.0 if haste_active?
                polymorph_rate *= 2.0 if brave_active?
                polymorph_rate
              end
          OLD

          new_move = <<'NEW'
              def self.move_rate
                polymorph_rate = form == :baphomet ? 1.5 : 1.0
                polymorph_rate *= 2.0 if haste_active?
                polymorph_rate *= 2.0 if brave_active?
                polymorph_rate *= 1.33 if holy_walk_active?
                polymorph_rate *= 0.5 if slow_active?
                polymorph_rate
              end
          NEW

          normalize = lambda do |s|
            s.lines.map {
              |line| line.start_with?('              ') ?
                line[10..-1] : line
            }.join
          end

          source = replace_once(
            source,
            normalize.call(old_move),
            normalize.call(new_move),
            'single movement calculation'
          )

          # Do not modify attack_base_rate or its morph table.
          # Holy Walk intentionally does not modify attack speed.
          old_attack = <<'OLD'
              def self.attack_rate
                rate = attack_base_rate
                rate *= HASTE_ATTACK if haste_active?
                rate *= BRAVE_ATTACK if brave_active?
                rate
              end
          OLD

          new_attack = <<'NEW'
              def self.attack_rate
                rate = attack_base_rate
                rate *= HASTE_ATTACK if haste_active?
                rate *= BRAVE_ATTACK if brave_active?
                rate *= 0.5 if slow_active?
                rate
              end
          NEW

          source = replace_once(
            source,
            normalize.call(old_attack),
            normalize.call(new_attack),
            'single attack calculation'
          )

          # Reuse the existing once-per-frame Speed.tick.
          # Do not create a new Game_Player update alias.
          old_tick = <<'OLD'
              put(:@slv229_brave_frames, old_brave - 1) if old_brave > 0
          OLD

          new_tick = <<'NEW'
              put(:@slv229_brave_frames, old_brave - 1) if old_brave > 0
              old_holy = get(:@slv11_holy_frames).to_i
              old_slow = get(:@slv11_slow_frames).to_i
              put(:@slv11_holy_frames, old_holy - 1) if old_holy > 0
              put(:@slv11_slow_frames, old_slow - 1) if old_slow > 0
          NEW

          source = replace_once(
            source,
            normalize.call(old_tick),
            normalize.call(new_tick),
            'existing independent timer loop'
          )

          # The original polymorph attack-speed table and
          # attack wait converter must remain byte-identical.
          check(
            source.include?(protected_attack),
            'Polymorph attack speed was modified'
          )

          check(
            source.include?(protected_wait),
            'Attack wait converter was modified'
          )

          check(
            source.scan('alias slv229_original_update').length == 1,
            'Player update hook changed'
          )

          check(
            source.scan('alias slv229_original_wait_command').length == 1,
            'Attack wait hook changed'
          )

          # Bind to existing callable CommonEvents only.
          # Unknown or conditional event implementations are
          # rejected rather than guessed or overwritten.
          def attach_existing_spell!(common, pattern, expression, label)
            found = []

            common.each_with_index do |event, id|
              next if id == 0 || event.nil?

              name = iv(event, :name).to_s.dup
              name.force_encoding('UTF-8')
              name = name.scrub

              if name.match?(pattern)
                found << [id, event, name]
              end
            end

            found_text = found.map {
              |id, event, name|
              "#{id}:#{name}:trigger=#{iv(event, :trigger)}"
            }.join(', ')

            check(
              found.length == 1,
              "#{label} event not unique: #{found_text}"
            )

            id, event, name = found.fetch(0)

            check(
              iv(event, :trigger).to_i == 0,
              "#{label} is not a callable event: #{id}"
            )

            commands = iv(event, :list)

            check(
              commands.is_a?(Array) && !commands.empty?,
              "#{label} has no native command list"
            )

            check(
              iv(commands.last, :code) == 0 &&
              iv(commands.last, :indent) == 0,
              "#{label} lacks a normal event terminator"
            )

            # Do not append an effect after conditionals,
            # exits or loops that may have skipped a cast.
            unsafe = [111, 112, 113, 115, 118, 119, 413]

            check(
              commands.none? { |c| unsafe.include?(iv(c, :code)) },
              "#{label} has conditional logic: manual source review needed"
            )

            check(
              commands.none? {
                |c| iv(c, :parameters).to_s.include?('SLV229::Speed.')
              },
              "#{label} already contains a speed call"
            )

            template = iv(common.fetch(3), :list).find {
              |c| iv(c, :code) == 355
            }

            check(
              !template.nil?,
              'Known V229 script command template missing'
            )

            commands.insert(
              commands.length - 1,
              clone_command(template, 355, 0, [expression])
            )

            puts "PASS #{label} linked to existing CE#{id}"
            id
          end

          holy_id = attach_existing_spell!(
            common,
            /홀리\s*워크|holy[\s_-]*walk/i,
            'SLV229::Speed.use_holy_walk(32)',
            'Holy Walk'
          )

          slow_id = attach_existing_spell!(
            common,
            /슬로우|\bslow\b/i,
            'SLV229::Speed.apply_slow(64)',
            'Slow'
          )

          check(
            holy_id != slow_id,
            'Both effects resolved to the same event'
          )

          # Verify precisely one original script entry changed.
          compressed = Zlib::Deflate.deflate(source)
          entry[2] = compressed

          script_diff = scripts.each_index.select do |i|
            scripts[i] != original_scripts[i]
          end

          check(
            script_diff == [script_index],
            "Unexpected RPG script changes: #{script_diff.inspect}"
          )

          # Exactly the two identified spell events may change.
          common_diff = common.each_index.select do |i|
            Marshal.dump(common[i]) !=
              Marshal.dump(original_common[i])
          end

          check(
            common_diff.sort == [holy_id, slow_id].sort,
            "Unexpected spell event edits: #{common_diff.inspect}"
          )

          File.binwrite(script_path, Marshal.dump(scripts))
          File.binwrite(common_path, Marshal.dump(common))

          # Reload both modified databases before continuing.
          verify_scripts = Marshal.load(File.binread(script_path))
          verify_common = Marshal.load(File.binread(common_path))

          verify_source = Zlib::Inflate.inflate(
            verify_scripts.fetch(script_index)[2]
          )

          check(
            verify_source.include?('def self.holy_walk_active?'),
            'Holy Walk controller missing'
          )

          check(
            verify_source.include?('def self.slow_active?'),
            'Slow controller missing'
          )

          check(
            verify_source.include?(protected_attack),
            'Morph speeds changed after serialization'
          )

          check(
            verify_source.include?(protected_wait),
            'Attack wait changed after serialization'
          )

          [
            [holy_id, 'SLV229::Speed.use_holy_walk(32)'],
            [slow_id, 'SLV229::Speed.apply_slow(64)']
          ].each do |id, expression|
            found = iv(verify_common.fetch(id), :list).any? do |c|
              iv(c, :code) == 355 &&
              iv(c, :parameters) == [expression]
            end

            check(found, "V1.1 spell trigger missing #{id}")
          end

          puts 'PASS Speed V1.1'
          puts 'PASS original haste and bravery rates preserved'
          puts 'PASS original polymorph attack speeds preserved'
          puts 'PASS no added player or interpreter hook'
          puts 'PASS independent Holy Walk and Slow timers'
          puts 'PASS original animation and combat event timing'
          RUBY

          ruby -c build/speed_v11.rb
          ruby build/speed_v11.rb

      - name: Refresh changed data hashes and displayed version
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          root = Path('site')
          game = root / 'knight/gameasync'
          data = game / 'Data'
          pre = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          mapping = game / 'mapping.js'
          content = mapping.read_text('utf-8')

          for name in (
              pre + 'Map025.rxdata',
              pre + 'CommonEvents.rxdata',
              'Scripts.rxdata'
          ):
              digest = hashlib.md5(
                  (data / name).read_bytes()
              ).hexdigest()

              token = (
                  re.escape('Data/' + name) +
                  r'\?h=[0-9a-f]{32}'
              )

              content, count = re.subn(
                  token,
                  'Data/' + name + '?h=' + digest,
                  content
              )

              assert count == 1, (
                  'Data mapping missing', name, count
              )

          mapping.write_text(content, encoding='utf-8')

          loader = root / 'knight/js/sl-assets-v229r115.js'
          loader_text = loader.read_text('utf-8')

          before = "var version='V276.7.4.1';"
          after = "var version='V276.7.4-S1.1';"

          assert loader_text.count(before) == 1, (
              'Display version not unique'
          )

          loader.write_text(
              loader_text.replace(before, after),
              encoding='utf-8'
          )

          for name in ('index.html', 'knight/index.html'):
              path = root / name
              text = path.read_text('utf-8')

              assert 'V276.7.4.1' in text, name

              text = text.replace(
                  'V276.7.4.1',
                  'V276.7.4-S1.1'
              ).replace(
                  '?v=v276.7.4.1',
                  '?v=v276.7.4-s1.1'
              )

              path.write_text(
                  text,
                  encoding='utf-8'
              )

          print('PASS changed data cache hashes')
          print('PASS visible Speed V1.1 version')
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Verify protected original files and Speed V1.1 scope
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path('site')

          original = json.loads(
              Path('build/original_sha256.json').read_text('utf-8')
          )

          current = {
              str(p.relative_to(root)):
                  hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          assert len(current) == 5623, (
              'Original file count changed'
          )

          assert set(original) == set(current), (
              'Original file inventory changed'
          )

          changed = {
              name for name in original
              if original[name] != current[name]
          }

          pre = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          allowed = {
              'knight/gameasync/Data/' +
                  pre + 'Map025.rxdata',
              'knight/gameasync/Data/' +
                  pre + 'CommonEvents.rxdata',
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html',
              'knight/index.html'
          }

          assert changed == allowed, (
              'Unexpected file changes',
              sorted(changed ^ allowed)
          )

          assert (
              'V276.7.4-S1.1' in
              (root / 'knight/index.html').read_text('utf-8')
          ), 'Speed version not visible'

          print('PASS only seven permitted game files changed')
          print('PASS all 5623 baseline file names preserved')
          print('PASS original maps and 4-direction passage preserved')
          print('PASS original monster and combat graphics preserved')
          print('PASS original attack animation frames preserved')
          print('PASS Queen native regeneration/death retained')
          print('PASS Speed V1.1 structural verification')
          PY

      - name: Publish verified Speed V1.1 game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

