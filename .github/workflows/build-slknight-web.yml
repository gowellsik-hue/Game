name: build-slknight-web.yml | V3.9 | Input Response

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Restore the exact successful V3.8 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45333575740
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Patch existing input duration and verify all original files
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar

          mkdir -p site
          tar -xf baseline/artifact.tar -C site

          test -s site/knight/gameasync/Data/Scripts.rxdata
          test -s site/knight/js/dpad.js
          test -s site/knight/js/sl-assets-v229r115.js

          python3 - <<'PY1'
          from pathlib import Path
          import hashlib,json

          root=Path('site')

          before={
              str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          assert len(before)==6013,(
              'Original V3.8 artifact file count mismatch',
              len(before)
          )

          loader=root/'knight/js/sl-assets-v229r115.js'

          assert loader.read_text('utf8').count(
              "var version='V3.8';"
          )==1,'Original V3.8 version mismatch'

          Path('before.json').write_text(
              json.dumps(before,sort_keys=True),
              'utf8'
          )
          PY1

          cat > /tmp/slv39.py <<'PY2'
          from pathlib import Path
          import re

          path=Path('site/knight/js/dpad.js')
          source=path.read_bytes().decode('utf8')

          definitions=list(re.finditer(
              r'\bfunction\s+pulseKey\s*\(',
              source
          ))

          assert len(definitions)==1,(
              'Original pulseKey definition count',
              len(definitions)
          )

          references=list(re.finditer(
              r'\bpulseKey\s*\(',
              source
          ))

          print('ORIGINAL_PULSE_REFERENCES',len(references))

          for match in references:
              start=source.rfind('\n',0,match.start())+1
              end=source.find('\n',match.end())

              if end==-1:
                  end=len(source)

              print(
                  'PULSE_REFERENCE',
                  source.count('\n',0,match.start())+1,
                  source[start:end]
              )

          original_k=re.compile(
              r'\bpulseKey\s*\(\s*k\s*,\s*120\s*\)'
          )

          original_key=re.compile(
              r'\bpulseKey\s*\(\s*key\s*,\s*120\s*\)'
          )

          assert original_k.search(source),(
              'Original array-key pulse call missing'
          )

          assert original_key.search(source),(
              'Original single-key pulse call missing'
          )

          call=re.compile(
              r'\bpulseKey\s*\(\s*[A-Za-z_$][\w$]*'
              r'\s*,\s*(120)\s*\)'
          )

          targets=list(call.finditer(source))

          assert len(targets)>=2,(
              'Original pulse duration targets',
              len(targets)
          )

          spans=[match.span(1) for match in targets]

          assert len(spans)==len(set(spans)),(
              'Duplicate duration targets',
              spans
          )

          for match in targets:
              print(
                  'INPUT_DURATION',
                  source.count('\n',0,match.start())+1,
                  match.group(),
                  '120ms -> 75ms'
              )

          result=source

          for start,end in reversed(spans):
              assert source[start:end]=='120'
              result=result[:start]+'75'+result[end:]

          assert result!=source
          assert not call.search(result),(
              'Original 120ms pulse calls remain'
          )

          restored=result

          for index,(start,end) in reversed(
              list(enumerate(spans))
          ):
              position=start-index

              assert restored[position:position+2]=='75'

              restored=(
                  restored[:position]
                  +'120'
                  +restored[position+2:]
              )

          assert restored==source,(
              'Unapproved input source changes'
          )

          for token in (
              'setTimeout',
              'clearTimeout',
              'setInterval',
              'clearInterval',
              'addEventListener',
              'removeEventListener',
              'simulateKeyEvent'
          ):
              assert result.count(token)==source.count(token),(
                  'Original input implementation changed',
                  token
              )

          assert len(re.findall(
              r'\bfunction\s+pulseKey\s*\(',
              result
          ))==1

          assert len(re.findall(
              r'\bpulseKey\s*\(',
              result
          ))==len(references)

          path.write_bytes(result.encode('utf8'))

          assert path.read_bytes().decode('utf8')==result

          print('PASS original pulse call targets:',len(targets))
          print('PASS all selected pulse durations changed to 75ms')
          print('PASS existing input functions unchanged')
          print('PASS existing input events unchanged')
          print('PASS existing key mappings unchanged')
          print('PASS no new timers or handlers')
          PY2

          python3 -m py_compile /tmp/slv39.py
          python3 /tmp/slv39.py

          node --check site/knight/js/dpad.js

          python3 - <<'PY3'
          from pathlib import Path
          import hashlib,json

          root=Path('site')

          loader=root/'knight/js/sl-assets-v229r115.js'
          source=loader.read_text('utf8')

          assert source.count("var version='V3.8';")==1

          loader.write_text(
              source.replace(
                  "var version='V3.8';",
                  "var version='V3.9';"
              ),
              'utf8'
          )

          for name in ('index.html','knight/index.html'):
              path=root/name
              source=path.read_text('utf8')

              assert 'V3.8' in source,(
                  'Missing original version',
                  name
              )

              path.write_text(
                  source.replace(
                      'V3.8','V3.9'
                  ).replace(
                      'v3.8','v3.9'
                  ),
                  'utf8'
              )

          before=json.loads(
              Path('before.json').read_text('utf8')
          )

          after={
              str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          assert before.keys()==after.keys(),(
              'Unexpected added or deleted files'
          )

          changed={
              p for p in before.keys()
              if before[p]!=after[p]
          }

          expected={
              'knight/js/dpad.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html',
              'knight/index.html'
          }

          assert changed==expected,(
              'Unapproved changed files',
              sorted(changed^expected)
          )

          assert before[
              'knight/gameasync/Data/Scripts.rxdata'
          ]==after[
              'knight/gameasync/Data/Scripts.rxdata'
          ],'Original game scripts changed'

          assert before[
              'knight/gameasync/mapping.js'
          ]==after[
              'knight/gameasync/mapping.js'
          ],'Original resource mapping changed'

          print('PASS V3.9: existing input pulse 120ms -> 75ms')
          print('PASS original movement and attack speed unchanged')
          print('PASS original companion behavior unchanged')
          print('PASS original engine and game data unchanged')
          print('PASS approved changed files:',len(changed))
          print('PASS untouched original files:',len(before)-len(changed))
          PY3

          node --check site/knight/js/dpad.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Upload V3.9 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
