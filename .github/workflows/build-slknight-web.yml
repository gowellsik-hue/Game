name: build-slknight-web.yml | V3.10 | Input Response

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Restore the exact successful V3.9 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45356394406
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Remove initial character selection
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar

          mkdir -p site
          tar -xf baseline/artifact.tar -C site

          test -s site/index.html
          test -s site/knight/index.html
          test -s site/knight/gameasync/Data/Scripts.rxdata
          test -s site/knight/js/dpad.js
          test -s site/knight/js/sl-assets-v229r115.js

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          import subprocess

          root=Path('site')

          before={
              str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          assert len(before)==6013,(
              'Original V3.9 artifact file count mismatch',
              len(before)
          )

          loader=root/'knight/js/sl-assets-v229r115.js'
          source=loader.read_text('utf8')

          assert source.count("var version='V3.9';")==1,(
              'Original V3.9 version mismatch'
          )

          launcher=root/'index.html'
          original=launcher.read_text('utf8')

          assert 'V3.9' in original

          source=original.replace(
              'V3.9','V3.10'
          ).replace(
              'v3.9','v3.10'
          )

          body_pattern=re.compile(
              r'(<body\b[^>]*>)(.*?)(</body\s*>)',
              re.I|re.S
          )

          bodies=list(body_pattern.finditer(source))

          assert len(bodies)==1,(
              'Original launcher body count',
              len(bodies)
          )

          match=bodies[0]
          body=match.group(2)

          assert len(re.findall(
              r'<button\b',body,re.I
          ))==2,(
              'Original character selection button count'
          )

          for side in ('knight','elf'):
              pattern=(
                  r'''location\.href\s*=\s*['"]'''
                  +side
                  +r'''/\?v=['"]\s*\+\s*Date\.now\(\)'''
              )

              assert len(re.findall(pattern,body))==1,(
                  'Original character entry missing',
                  side
              )

          assert '캐릭터 선택' in body

          assert not re.search(
              r'<script\b',body,re.I
          ),'Unexpected script in original character selection'

          new_body=(
              "<script>"
              "location.replace('knight/?v='+Date.now());"
              "</script>"
          )

          result=(
              source[:match.start(2)]
              +new_body
              +source[match.end(2):]
          )

          assert not re.search(
              r'<button\b',result,re.I
          )

          assert '캐릭터 선택' not in result

          assert result.count(
              "location.replace('knight/?v='+Date.now());"
          )==1

          assert "location.href='elf/" not in result

          script=re.search(
              r'<script>(.*?)</script>',
              new_body,
              re.S
          ).group(1)

          test=(
              "const assert=require('assert');"
              "let target;"
              "const location={replace:v=>target=v};"
              "Date.now=()=>123;"
              +script+
              "assert.strictEqual(target,'knight/?v=123');"
          )

          subprocess.run(
              ['node','-e',test],
              check=True
          )

          launcher.write_text(result,'utf8')

          knight=root/'knight/index.html'
          source=knight.read_text('utf8')

          assert 'V3.9' in source

          knight.write_text(
              source.replace(
                  'V3.9','V3.10'
              ).replace(
                  'v3.9','v3.10'
              ),
              'utf8'
          )

          source=loader.read_text('utf8')

          assert source.count(
              "var version='V3.9';"
          )==1

          loader.write_text(
              source.replace(
                  "var version='V3.9';",
                  "var version='V3.10';"
              ),
              'utf8'
          )

          after={
              str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          assert before.keys()==after.keys(),(
              'Unexpected added or deleted files'
          )

          changed={
              p for p in before.keys()
              if before[p]!=after[p]
          }

          expected={
              'index.html',
              'knight/index.html',
              'knight/js/sl-assets-v229r115.js'
          }

          assert changed==expected,(
              'Unapproved changed files',
              sorted(changed^expected)
          )

          assert before[
              'knight/gameasync/Data/Scripts.rxdata'
          ]==after[
              'knight/gameasync/Data/Scripts.rxdata'
          ]

          assert before[
              'knight/js/dpad.js'
          ]==after[
              'knight/js/dpad.js'
          ]

          assert before[
              'knight/gameasync/mapping.js'
          ]==after[
              'knight/gameasync/mapping.js'
          ]

          print('PASS V3.10 direct knight entry')
          print('PASS initial character selection removed')
          print('PASS V3.9 input response unchanged')
          print('PASS original companion behavior unchanged')
          print('PASS original save and game data unchanged')
          print('PASS approved changed files:',len(changed))
          print('PASS untouched original files:',len(before)-len(changed))
          PY

          node --check site/knight/js/dpad.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Upload V3.10 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
