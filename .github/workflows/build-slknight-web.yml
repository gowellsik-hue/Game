
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R60
# BASE: V229R59 successful run 39945570291.
# FLOOR SOURCE: V229R57 successful run 39894434720.
# FIX: remove Map046 dark smoke transferred into ground PNGs by R59.
# Keep R59 cleaned foreground wall PNGs and original R57 ground PNGs.
# PERF: avoid repeated Map046 floor work while the camera is stationary.
# KEEP: R59 monster recognition, 491EV balance, loot, collision, walls,
# 106 TI monsters, spawn positions, UI, saves, and original engine.
# Keep existing wall fade behavior. Do not shift collision coordinates.
name: build-slknight-web.yml | V229R60 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: V229R60 Restore successful R59 complete game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39945570291
          name: github-pages
          github-token: ${{ github.token }}
          path: r59

      - name: V229R60 Restore original R57 floor reference
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39894434720
          name: github-pages
          github-token: ${{ github.token }}
          path: r57

      - name: V229R60 Verify source and preserve original inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site source57 build
          test -s r59/artifact.tar
          test -s r57/artifact.tar

          tar -xf r59/artifact.tar -C site
          tar -xf r57/artifact.tar -C source57

          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib
          import json

          current=Path('site')
          original=Path('source57')

          for filename,root,version in (
              ('index.html',current,'V229R59'),
              ('knight/index.html',current,'V229R59'),
              ('index.html',original,'V229R57'),
              ('knight/index.html',original,'V229R57')
          ):
              assert version in (root/filename).read_text('utf-8'),filename

          pre='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          for mid in (45,46):
              name=pre+f'Map{mid:03d}.rxdata'
              assert (current/name).is_file(),name
              assert (current/name).read_bytes()==(original/name).read_bytes(),name

          files={
              str(p.relative_to(current)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in current.rglob('*') if p.is_file()
          }

          assert len(files)==5517,len(files)
          Path('build/r60-baseline.json').write_text(
              json.dumps(files,sort_keys=True)
          )

          print('PASS R59 5517 files, R57 reference, original TI maps')
          PY_BASE

      - name: V229R60 Remove transferred smoke from second-floor ground
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_GROUND'
          from pathlib import Path
          import hashlib
          import json
          import shutil
          import struct

          target=Path('site/knight/gameasync/Graphics/Panoramas')
          original=Path('source57/knight/gameasync/Graphics/Panoramas')

          def digest(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()

          restored=[]

          for source in sorted(original.glob('SLTI_46_C*.png')):
              destination=target/source.name
              assert destination.is_file(),source.name

              if digest(source)==digest(destination):
                  continue

              content=source.read_bytes()
              assert content.startswith(b'\x89PNG\r\n\x1a\n')
              width,height=struct.unpack('>II',content[16:24])
              assert (width,height)==(512,512),source.name

              wall_name=source.name.replace(
                  'SLTI_46_C','SLTI_46_W_C',1
              )
              wall=target/wall_name

              assert wall.is_file(),wall_name

              # R59 already removed the smoke from the foreground.
              # Restore only R57 ground. Do not roll back the cleaned wall.
              shutil.copy2(source,destination)
              assert digest(source)==digest(destination)

              restored.append(source.name)

          assert len(restored)==22,(
              'Unexpected R59 ground changes',len(restored)
          )

          result={
              'version':'V229R60',
              'source':'V229R59',
              'ground_reference':'V229R57',
              'restored_ground_pngs':restored,
              'restored_count':len(restored),
              'foreground_walls_preserved':True,
              'collision_files_modified':False
          }

          Path('build/r60-ground.json').write_text(
              json.dumps(result,indent=2)
          )

          print('PASS restored',len(restored),
                'original Map046 ground PNGs')
          PY_GROUND

      - name: V229R60 Optimize stationary second-floor terrain updates
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r60_optimize.rb <<'R60_RUBY'
          require 'zlib'
          require 'json'
          require 'digest'

          path='site/knight/gameasync/Data/Scripts.rxdata'
          original_bytes=File.binread(path)
          scripts=Marshal.load(original_bytes)
          baseline=Marshal.load(original_bytes)

          raise 'Unexpected script count' unless scripts.length==136

          index=97
          code=Zlib::Inflate.inflate(scripts[index][2])
          code.force_encoding('UTF-8')

          raise 'Original terrain method missing' unless
            code.include?('def slti_update_terrain')

          old_start=<<'OLD'
              return if viewport_w <= 0 || viewport_h <= 0
              left = [sx / 1024, 0].max
          OLD

          new_start=<<'NEW'
              return if viewport_w <= 0 || viewport_h <= 0
              # R60: floor textures are static. No need to recompute the same
              # visible chunks when camera position and map are unchanged.
              if @slti_floor==46 &&
                 @slti_r60_floor_ready &&
                 @slti_r60_floor_sx==sx &&
                 @slti_r60_floor_sy==sy &&
                 @slti_r60_floor_id==@slti_floor
                return
              end
              left = [sx / 1024, 0].max
          NEW

          raise 'Unexpected terrain entry layout' unless
            code.scan(old_start).length==1

          code=code.sub(old_start,new_start)

          old_end=<<'OLD'
                sprite.y=y*1024-sy
              end
            end

          end
          OLD

          new_end=<<'NEW'
                sprite.y=y*1024-sy
              end
              @slti_r60_floor_sx=sx
              @slti_r60_floor_sy=sy
              @slti_r60_floor_id=@slti_floor
              @slti_r60_floor_ready=(
                @slti_floor==46 &&
                !@slti_chunk_error &&
                @slti_chunks.length==required.length
              )
            end

          end
          NEW

          raise 'Unexpected terrain exit layout' unless
            code.scan(old_end).length==1

          code=code.sub(old_end,new_end)

          raise 'Terrain update method removed' unless
            code.include?('def slti_update_terrain')

          raise 'Missing camera invalidation' unless
            code.include?('@slti_r60_floor_sx==sx') &&
            code.include?('@slti_r60_floor_sy==sy')

          scripts[index][2]=Zlib::Deflate.deflate(code.b)

          raise 'Unrelated Ruby script modified' unless
            scripts.each_index.all?{|i|
              i==index || scripts[i]==baseline[i]
            }

          # R59 runtime including switch 6000, monster recognition,
          # existing reward data and original wall handling stays intact.
          raise 'R59 monster runtime changed' unless
            scripts[134]==baseline[134]

          File.binwrite(path,Marshal.dump(scripts))
          File.binwrite('build/r60-terrain.rb',code)

          report={
            version:'V229R60',
            source_scripts_sha256:Digest::SHA256.hexdigest(original_bytes),
            changed_script_indexes:[97],
            source_runtime_134_preserved:true,
            original_monster_recognition_preserved:true,
            original_491_reward_data_preserved:true,
            texture_cache_growth_added:false
          }

          File.write(
            'build/r60-performance.json',
            JSON.pretty_generate(report)
          )

          puts 'PASS Map046 stationary floor update guard'
          puts 'PASS script134 and all other Ruby scripts unchanged'
          R60_RUBY

          ruby -c /tmp/r60_optimize.rb
          ruby /tmp/r60_optimize.rb
          ruby -c build/r60-terrain.rb

      - name: V229R60 Verify ground restoration and engine preservation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY'
          from pathlib import Path
          import hashlib
          import json

          root=Path('site')
          base=Path('source57')
          ground=json.loads(
              Path('build/r60-ground.json').read_text()
          )
          perf=json.loads(
              Path('build/r60-performance.json').read_text()
          )

          rel=Path('knight/gameasync/Graphics/Panoramas')

          for name in ground['restored_ground_pngs']:
              assert (root/rel/name).read_bytes()==(
                  base/rel/name
              ).read_bytes(),name

          before=json.loads(
              Path('build/r60-baseline.json').read_text()
          )

          # All R59 maps, wall textures and monster events remain unchanged.
          for filename in before:
              if filename.startswith('knight/gameasync/Data/Map'):
                  assert hashlib.sha256(
                      (root/filename).read_bytes()
                  ).hexdigest()==before[filename],filename

              if '/Graphics/Panoramas/SLTI_46_W_' in filename:
                  assert hashlib.sha256(
                      (root/filename).read_bytes()
                  ).hexdigest()==before[filename],filename

          assert ground['restored_count']==22
          assert perf['changed_script_indexes']==[97]
          assert perf['source_runtime_134_preserved']

          print('PASS 22 original floor PNGs restored')
          print('PASS R59 foreground walls unchanged')
          print('PASS original maps, collision and monster events unchanged')
          PY_VERIFY

      - name: V229R60 Update exact resource hashes and version labels
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_MANIFEST'
          from pathlib import Path
          import hashlib
          import json
          import re

          root=Path('site')
          engine=root/'knight/gameasync'
          mapping=engine/'mapping.js'
          text=mapping.read_text('utf-8')

          def replace_hash(uri,path):
              global text
              digest=hashlib.md5(path.read_bytes()).hexdigest()
              pattern=re.escape(uri)+r'\?h=[0-9a-f]{32}'

              updated,count=re.subn(
                  pattern,
                  lambda m:uri+'?h='+digest,
                  text
              )

              assert count==1,(uri,count)
              text=updated

          replace_hash(
              'Data/Scripts.rxdata',
              engine/'Data/Scripts.rxdata'
          )

          report=json.loads(
              Path('build/r60-ground.json').read_text()
          )

          for filename in report['restored_ground_pngs']:
              relative='Graphics/Panoramas/'+filename
              replace_hash(relative,engine/relative)

          mapping.write_text(text,encoding='utf-8')

          for filename in ('index.html','knight/index.html'):
              file=root/filename
              source=file.read_text('utf-8')
              assert 'V229R59' in source,filename

              updated=source.replace(
                  'V229R59','V229R60'
              ).replace(
                  'v229r59','v229r60'
              )

              file.write_text(updated,encoding='utf-8')

          print('PASS script cache, 22 image hashes, version labels')
          PY_MANIFEST

          node --check site/knight/gameasync/mapping.js

      - name: V229R60 Final complete file and rollback safety check
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import hashlib
          import json

          root=Path('site')
          original=json.loads(
              Path('build/r60-baseline.json').read_text()
          )

          current={
              str(f.relative_to(root)):
              hashlib.sha256(f.read_bytes()).hexdigest()
              for f in root.rglob('*') if f.is_file()
          }

          assert len(original)==len(current)==5517
          assert original.keys()==current.keys()

          changed={
              name for name in original
              if original[name]!=current[name]
          }

          allowed={
              'index.html',
              'knight/index.html',
              'knight/gameasync/mapping.js',
              'knight/gameasync/Data/Scripts.rxdata'
          }

          ground=json.loads(
              Path('build/r60-ground.json').read_text()
          )

          allowed.update(
              'knight/gameasync/Graphics/Panoramas/'+name
              for name in ground['restored_ground_pngs']
          )

          assert changed==allowed,(
              'Unexpected modification',changed^allowed
          )

          for filename in ('index.html','knight/index.html'):
              assert 'V229R60' in (
                  root/filename
              ).read_text('utf-8')

          print('PASS: all 5517 original game files accounted for')
          print('PASS: only 22 floor PNGs and 4 web files modified')
          print('PASS: existing walls, maps, spawns and rewards preserved')
          PY_FINAL

      - name: V229R60 Upload terrain and preservation verification
        uses: actions/upload-artifact@v4
        with:
          name: SLKnight-V229R60-Terrain-Performance
          path: |
            build/r60-ground.json
            build/r60-performance.json
          retention-days: 30
          if-no-files-found: error

      - name: V229R60 Upload complete game to existing GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
