
# SLKnight V1.23: exact successful V1.22 game as baseline.
# Only player/polymorph attack picture first-load correction; no engine or combat changes.
name: build-slknight-web.yml | V1.23 | Original Attack Images

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Restore exact successful V1.22 deployed game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 42960404808
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify V1.22 original and record all file hashes
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          assert len(before)==5624, ('V1.22 file count',len(before))
          needed=['knight/gameasync/bitmap-map.js',
                  'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata',
                  'knight/assets/shared-v229r115.pack','knight/js/drive.js',
                  'knight/js/sl-assets-v229r115.js','knight/index.html','index.html']
          assert all(x in before for x in needed), 'V1.22 original files missing'
          assert "var version='V1.22';" in (root/'knight/js/sl-assets-v229r115.js').read_text('utf8')
          assert 'SLKnight V1.22' in (root/'knight/index.html').read_text('utf8')
          Path('build/v122_hashes.json').write_text(json.dumps(before),encoding='utf8')
          Path('build/v122_bitmap_map.js').write_bytes((root/'knight/gameasync/bitmap-map.js').read_bytes())
          print('PASS exact deployed V1.22 verified')
          PY

      - name: Remove only the original attack picture thumbnail path
        shell: bash
        run: |
          set -euo pipefail
          cat > build/patch_v123.rb <<'RUBY'
          require 'json'
          module RPG
            class CommonEvent; end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
            class AudioFile; end
          end
          root=ARGV.fetch(0)
          data=File.join(root,'gameasync/Data')
          common=File.join(data,'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata')
          ids=[1,7,42,45,49,50,115,208,214,415,416]
          events=Marshal.load(File.binread(common))
          keys=ids.flat_map do |id|
            list=events.fetch(id).instance_variable_get(:@list) || []
            list.filter_map do |cmd|
              next unless cmd.instance_variable_get(:@code)==231
              args=cmd.instance_variable_get(:@parameters)
              next unless args.is_a?(Array) && [30,42].include?(args[0])
              raise "CE#{id} invalid picture" unless args[1].is_a?(String) && !args[1].empty?
              'graphics/pictures/'+args[1].dup.force_encoding('UTF-8').downcase
            end
          end.uniq
          raise "Expected 322 original attack pictures; got #{keys.length}" unless keys.length==322
          pack=File.join(root,'assets/shared-v229r115.pack')
          File.open(pack,'rb') do |f|
            length=f.read(4).unpack1('V')
            contents=JSON.parse(f.read(length))
            raise 'Wrong original shared pack' unless contents['kind']=='shared'
            shared=contents.fetch('files').map{|row|row[0]}
            missing=keys-shared
            raise "Attack PNG absent from original pack: #{missing.inspect}" unless missing.empty?
          end
          preview=File.join(root,'gameasync/bitmap-map.js')
          original=File.binread(preview).force_encoding('UTF-8')
          raise 'Invalid bitmap mapping' unless original.valid_encoding?
          selected=keys.to_h{|key|[key,true]}
          found=[]
          changed=original.each_line.reject do |line|
            key=line[/^"([^"]+)": \[/,1]
            if key && selected[key]
              found << key
              true
            else
              false
            end
          end.join
          raise "Attack thumbnail mismatch #{found.length}/322" unless found.length==322 && found.uniq.length==322
          raise 'Other thumbnail data damaged' unless changed.start_with?('var bitmapSizeMapping = {') && changed.end_with?("};\n")
          File.binwrite(preview,changed)
          File.write('build/v123_attack_keys.json',JSON.generate(keys),mode:'w:UTF-8')
          html_path=File.join(root,'index.html')
          html=File.binread(html_path).force_encoding('UTF-8')
          first="getLazyAsset('gameasync/bitmap-map.js', 'Primary assets'"
          second="s.setAttribute('src', 'gameasync/bitmap-map.js');"
          raise 'Original thumbnail script tags changed' unless html.scan(first).length==1 && html.scan(second).length==1
          html=html.sub(first,"getLazyAsset('gameasync/bitmap-map.js?v=v1.23', 'Primary assets'")
          html=html.sub(second,"s.setAttribute('src', 'gameasync/bitmap-map.js?v=v1.23');")
          raise 'Original version missing' unless html.include?('V1.22') && html.include?('v1.22')
          File.binwrite(html_path,html.gsub('V1.22','V1.23').gsub('v1.22','v1.23'))
          root_html=File.join(root,'../index.html')
          launcher=File.binread(root_html).force_encoding('UTF-8')
          raise 'Launcher version missing' unless launcher.include?('V1.22')
          File.binwrite(root_html,launcher.gsub('V1.22','V1.23'))
          loader=File.join(root,'js/sl-assets-v229r115.js')
          source=File.binread(loader).force_encoding('UTF-8')
          raise 'Original loader version missing' unless source.scan("var version='V1.22';").length==1
          File.binwrite(loader,source.sub("var version='V1.22';","var version='V1.23';"))
          puts "PASS V1.23: #{ids.length} CEs / #{keys.length} attack pictures, original PNG load path"
          RUBY
          ruby -c build/patch_v123.rb
          ruby build/patch_v123.rb site/knight
          node --check site/knight/gameasync/bitmap-map.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Verify V1.22 non-target files are byte-identical
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          root=Path('site')
          before=json.loads(Path('build/v122_hashes.json').read_text('utf8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert set(after)==set(before), 'Game files added or deleted'
          changed={p for p in before if before[p]!=after[p]}
          allowed={'knight/gameasync/bitmap-map.js','knight/index.html',
                   'knight/js/sl-assets-v229r115.js','index.html'}
          assert changed==allowed, ('Unexpected changes',sorted(changed^allowed))
          keys=set(json.loads(Path('build/v123_attack_keys.json').read_text('utf8')))
          original=Path('build/v122_bitmap_map.js').read_text('utf8')
          current=(root/'knight/gameasync/bitmap-map.js').read_text('utf8')
          def key(line):
              m=re.match(r'^"([^"]+)": \[',line)
              return m.group(1) if m else None
          expected=''.join(line for line in original.splitlines(keepends=True) if key(line) not in keys)
          assert current==expected, 'Non-attack thumbnail entry changed'
          assert len(keys)==322 and not keys.intersection(set(filter(None,map(key,current.splitlines()))))
          html=(root/'knight/index.html').read_text('utf8')
          assert 'bitmap-map.js?v=v1.23' in html and 'SLKnight V1.23' in html
          assert "var version='V1.23';" in (root/'knight/js/sl-assets-v229r115.js').read_text('utf8')
          print('PASS 322 attack thumbnails removed; all other thumbnails byte-for-byte unchanged')
          print('PASS exactly four existing files changed; engine, combat, monsters and maps unchanged')
          PY

      - name: Publish V1.23 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
