
name: V229R6 | Boss Respawn 60s 180s

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-slknight-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Restore last verified V229R5 site
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          repository: gowellsik-hue/Game
          run-id: 39041185008
          name: github-pages
          github-token: ${{ github.token }}
          path: previous

      - name: Restore complete deployed site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          if test -s previous/artifact.tar; then
            tar -xf previous/artifact.tar -C site
          else
            python3 - <<'PY_RECOVER'
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import hashlib, json, re, time
          base='https://gowellsik-hue.github.io/Game/'
          root=Path('site')
          fixed=('index.html','COPYING-mkxp-web.txt','manifest.webmanifest','mkxp.js','mkxp.wasm','js/drive.js','js/dpad.js','js/localforage.min.js')
          def get(url):
              for attempt in range(5):
                  try:
                      req=Request(url,headers={'User-Agent':'SLKnight-V229-R6','Accept-Encoding':'identity'})
                      with urlopen(req, timeout=75) as response:
                          return response.read()
                  except Exception:
                      if attempt==4: raise
                      time.sleep(attempt+1)
          files={'index.html':(base+'index.html',None)}
          for game in ('knight','elf'):
              for rel in fixed:
                  files[game+'/'+rel]=(base+game+'/'+quote(rel,safe='/'),None)
              mapping_name=game+'/gameasync/mapping.js'
              blob=get(base+mapping_name+'?recover=v229r6')
              p=root/mapping_name
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(blob)
              body=blob.decode('utf-8').split('var mappingArray = ',1)[1].split('];',1)[0]+']'
              for _,asset in json.loads(re.sub(r',\s*\]$',']',body)):
                  rel,sep,md5=asset.partition('?h=')
                  if '.' not in Path(rel).name: continue
                  if rel.startswith('/') or '..' in Path(rel).parts: raise RuntimeError('Unsafe asset path '+rel)
                  name=game+'/gameasync/'+rel
                  if name in files: raise RuntimeError('Duplicate asset '+name)
                  files[name]=(base+game+'/gameasync/'+quote(rel,safe='/')+('?h='+md5 if sep else ''),md5 if sep else None)
          if len(files)!=5354: raise RuntimeError('Unexpected total asset count '+str(len(files)))
          def fetch(item):
              name,(url,md5)=item
              data=get(url)
              if md5 and Path(name).name not in ('mapping.js','bitmap-map.js'):
                  if hashlib.md5(data).hexdigest()!=md5: raise RuntimeError('Asset checksum mismatch '+name)
              p=root/name
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(data)
          with ThreadPoolExecutor(max_workers=12) as pool:
              jobs=[pool.submit(fetch,item) for item in files.items() if not (root/item[0]).is_file()]
              for job in as_completed(jobs): job.result()
          actual={str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}
          if actual!=set(files): raise RuntimeError('Incomplete published game recovery')
          print('RESTORED_5354_PUBLISHED_ASSETS')
          PY_RECOVER
          fi

      - name: Identify exact source version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/slv230
          python3 - <<'PY_SOURCE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if len(files)!=5354:raise SystemExit('Incorrect game file inventory')
          expected=json.loads('{"knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap001.rxdata":["08e7ed4b6d096c319dc59d9864227e7d308eb5976370113491fab2210ac51e2d","a1b45037751c4d70e082326e864f5e13cc9ddd2f618ca8a26e2b9e8238bb46e0"],"knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap002.rxdata":["c9aee9efb14a5004d0515f678342faa137d40e2755bd24a5261960983874ea92","08901325215234df6ace3ae3dbc71132db121bf0dde043c72537412f093d74f0"],"knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap003.rxdata":["b2f14e138dce41ca9d4cba144a43b162b5353dd3a0ca001cf4bb3990bb99886c","81a55de10a39cee2f99d88bfe69913fc84c1e74f118f8f4a2aa56caca4ee1208"],"knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap005.rxdata":["4591631f3cba26f183b07d8d95a2aa6271ccfb9325f0db40fc44578982fff674","73bee1c29812e3bdfa40a953803b45b9363278516069601a2aec7a7993337b41"],"knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap006.rxdata":["e5b85dfd7a9f3977834df9eddb11a3785997b54995369b54e0b430f28e788085","e4f566091923853c829d4daab5b736c8303a2af1f35ac7b0e1a179cc3f9a0393"],"knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap012.rxdata":["9519f32366ed981839cdc64aaa1340c47c2c592bd4e92ceb6ce7a1b3944ff590","88b456632269567d64ed270e13e0de21f082bd8e91bed47b012dc16b6974082d"],"knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap019.rxdata":["cc839df99d5d164efb978815a4d704db5be844032a13a828cf064dc0b9c5f89a","3c386b04dc6827677375974b0b4a689790f67a9f180d245673adb8c6b9e30b59"],"knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap021.rxdata":["406bfaf229fde973365145e439e872c1d8c6a4325ee35926bcb45995b9b8a3f2","44be1763f4cd85f813871c617405eb9dd080272155c6823a848591f40bac306c"],"knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap027.rxdata":["6a0ca388927a647ae37e7604d4011a0b2e6428df91f88f8625aeed0cbe97d0a9","07425f390c2d821e1dc34ee985f00dfdb2784e1d3971a5a52ced405dc3439946"],"knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap030.rxdata":["c08f4208c1af8819719c8477934571c222a45807bc958b007df043eb8853b0e4","33ec940e5b17661d951b7971ba128a93063b1bbc6d397b39d10af07dd34c10a4"],"knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap031.rxdata":["83bc1980a8c4ede51463919ff206b9f9e4e39580aed16968576f9fc5d611e81f","008e15c043d816684a169a390507eb4c2a2c23c543bbaa566863a3601d832886"],"knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap035.rxdata":["35f5fe74ec30d71614d1fc276d4044c816acf666758355b89a56cf8e71b6c27c","7aa9a3959547e86720a874d45ec2ec54247495f3de71c7e3ac033c340205b153"],"knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap041.rxdata":["7617383595b8fc2b5b34d6be344938d69c5642a9347dfdf8aa748bae814ea3e9","0fc92980fa1ff883e0ce114547a701cf62af85dc44031c3377c5ad64f6bee455"],"knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap042.rxdata":["853abb6dada3e94529d11d67dc2d5f3f545f4ff1b18a2a6c57be581b24c16323","89125561fc3926fc9d3fa69a8c8237c56f0dfa0f94652ca08c284394d9e8604d"],"knight/gameasync/Data/Scripts.rxdata":["9e3eaae707471a9ee395e5ede40b43bc8462f2be137bc9f3ffca484598062630","634ba0e18df087d04916aa1d6f808b43b27bb8579fb2c63b3cc202192c1a9ca0"],"knight/gameasync/mapping.js":["aa72157f0b79cf1590eace5b7aae2004ad7c08090e67ea7f9b4d1aae31ce8624","7e29e6eb85b2f5ee2f4575b63fe62d7468ae78503ee8014f42dd5e1d7264e2f1"],"knight/index.html":["c5dde3d791f901a180a2f13d43a20614702caeb657814e8b06d01424a27edc0e","aadd1381feaacad75bc4071ae7ed427d68b53d309680806495552637a92cf2f5"]}')
          if all(files.get(k)==v[0] for k,v in expected.items()):version='V229R5'
          elif all(files.get(k)==v[1] for k,v in expected.items()):version='V229R6'
          else:raise SystemExit('Unknown source version; refusing to patch')
          Path('/tmp/slv230/checks.json').write_text(json.dumps(expected))
          Path('/tmp/slv230/version').write_text(version)
          Path('/tmp/slv230/before.json').write_text(json.dumps(files))
          print('VERIFIED_SOURCE',version,'FILES',len(files))
          PY_SOURCE

      - name: Apply boss respawn patch to ordinary field maps only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/slv230
          if test "$(cat /tmp/slv230/version)" = V229R5; then
            ruby - site <<'RUBY_PATCH'
          require 'json'
          require 'digest'
          require 'zlib'
          module RPG
            class Map; end
            class Event; end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
            class AudioFile; end
            class CommonEvent; end
            class Event
              class Page
                class Condition; end
                class Graphic; end
              end
            end
          end
          class Tone
            def self._load(s); o=new; o.instance_variable_set(:@sl_binary,s); o; end
            def _dump(depth); @sl_binary; end
          end
          class Color
            def self._load(s); o=new; o.instance_variable_set(:@sl_binary,s); o; end
            def _dump(depth); @sl_binary; end
          end
          class Rect
            def self._load(s); o=new; o.instance_variable_set(:@sl_binary,s); o; end
            def _dump(depth); @sl_binary; end
          end
          class Table
            def self._load(data); new(data); end
            def initialize(data); @data=data; end
            def _dump(depth); @data; end
          end
          module SLRespawnBuilder
            PREFIX='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
            EXCLUDED=[16,43]
            FPS=50
            def self.command(code,parameters,indent=0)
              c=RPG::EventCommand.allocate
              c.instance_variable_set(:@code,code)
              c.instance_variable_set(:@parameters,parameters)
              c.instance_variable_set(:@indent,indent)
              c
            end
            def self.extract(data_root)
              targets={}
              skipped=[]
              (1..44).each do |map_id|
                f=File.join(data_root,'%sMap%03d.rxdata' % [PREFIX,map_id])
                map=Marshal.load(File.binread(f))
                if EXCLUDED.include?(map_id)
                  next
                end
                events=map.instance_variable_get(:@events)
                events.each do |id,e|
                  name=e.instance_variable_get(:@name).to_s.dup.force_encoding('UTF-8').scrub
                  pages=e.instance_variable_get(:@pages)
                  boss=pages.any?{|p| p.instance_variable_get(:@list).any?{|cmd| [355,655].include?(cmd.instance_variable_get(:@code)) && cmd.instance_variable_get(:@parameters).join(' ').include?('$m.drawMHP')}}
                  if !(boss && (name.start_with?('[ID') || (map_id==1 && id==1))) && !(map_id==19 && [3,4,5,6].include?(id) && name.match?(/\[ID(?:카스파|세마|메르키오르|발터자르)\]/))
                    next
                  end
                  midboss=(map_id==19 && [3,4,5,6].include?(id))
                  death=pages.each_with_index.select do |p,i|
                    cond=p.instance_variable_get(:@condition)
                    key=cond.instance_variable_get(:@self_switch_ch)
                    cond.instance_variable_get(:@self_switch_valid) && (key=='A'||key=='B') &&
                      p.instance_variable_get(:@list).any?{|cmd| cmd.instance_variable_get(:@code)==123 && cmd.instance_variable_get(:@parameters)==[key,1] && cmd.instance_variable_get(:@indent)==0}
                  end
                  if death.size!=1
                    skipped << [map_id,id,name,'custom event (not a regular death/revival page)']
                    next
                  end
                  page,index=death[0]
                  list=page.instance_variable_get(:@list)
                  reset_key=page.instance_variable_get(:@condition).instance_variable_get(:@self_switch_ch)
                  wait=list.select{|c|c.instance_variable_get(:@code)==106 && c.instance_variable_get(:@indent)==0}.map{|c|c.instance_variable_get(:@parameters)[0]}
                  if wait.size>1
                    raise "Multiple top-level waits #{map_id} #{id} #{wait.inspect}"
                  end
                  already=wait.inject(0,:+)
                  target=(midboss ? 60 : 180)*FPS/2
                  raise "Bad preexisting wait #{map_id}-#{id}" if target<=already
                  first_page=pages[0]
                  first_list=first_page.instance_variable_get(:@list)
                  moves=first_list.select{|c| c.instance_variable_get(:@code)==202 && c.instance_variable_get(:@parameters)[0..1]==[0,0]}.map{|c|c.instance_variable_get(:@parameters)[2..3]}.uniq
                  spawn_switch = first_list.select{|c| c.instance_variable_get(:@code)==121 && c.instance_variable_get(:@indent)==0 && c.instance_variable_get(:@parameters)[2]==0}.map{|c|c.instance_variable_get(:@parameters)[0]}.last
                  b_spawn=first_list.any?{|c|c.instance_variable_get(:@code)==123 && c.instance_variable_get(:@parameters)==['B',0]}
                  if first_list.any?{|c|c.instance_variable_get(:@code)==106 && c.instance_variable_get(:@indent)==0} && spawn_switch.nil? && !b_spawn
                    raise "Spawn delay without activation strategy #{map_id}:#{id}"
                  end
                  targets[[map_id,id]]={name:name,midboss:midboss,page:index,reset:reset_key,existing_wait:already,extra_wait:target-already,spawn_switch:spawn_switch,b_spawn:b_spawn,coords:moves,src:f}
                end
              end
              [targets,skipped]
            end
            def self.make_runtime(targets)
              table={}
              targets.each do |(map_id,id),a|
                (table[map_id]||={})[id]=[a[:reset],a[:spawn_switch],a[:b_spawn] ? 1 : 0,a[:coords]]
              end
              code=<<~'RUBY'
              module SLV230BossRespawn
                TARGETS=__TARGETS__
                def self.defeated
                  return {} if $game_system.nil?
                  $game_system.instance_variable_get(:@slv230_defeated) || {}
                end
                def self.enter(map_id)
                  data=TARGETS[map_id]
                  return if data.nil? || $game_self_switches.nil?
                  killed=defeated[map_id]
                  return if killed.nil?
                  killed.each_key do |event_id|
                    entry=data[event_id]
                    next if entry.nil?
                    $game_self_switches[[map_id,event_id,entry[0]]]=false
                  end
                end
                def self.update(map)
                  data=TARGETS[map.map_id]
                  return if data.nil? || $game_switches.nil? || $game_self_switches.nil?
                  killed=defeated[map.map_id]
                  return if killed.nil?
                  placed=map.instance_variable_get(:@slv230_placed) || {}
                  killed.each_key do |event_id|
                    entry=data[event_id]
                    next if entry.nil?
                    event=map.events[event_id]
                    next if event.nil?
                    dead=$game_self_switches[[map.map_id,event_id,entry[0]]]
                    if dead
                      placed[event_id]=false
                      next
                    end
                    if !placed[event_id] || (entry[1] && !$game_switches[entry[1]]) || (entry[2]==1 && !$game_self_switches[[map.map_id,event_id,'B']])
                      $game_switches[entry[1]]=true unless entry[1].nil?
                      $game_self_switches[[map.map_id,event_id,'B']]=true if entry[2]==1
                      positions=entry[3]
                      unless positions.empty?
                        p=positions[rand(positions.length)]
                        event.moveto(p[0],p[1])
                      end
                      event.refresh
                      placed[event_id]=true
                    end
                  end
                  map.instance_variable_set(:@slv230_placed,placed)
                end
              end
              class Game_Map
                alias slv230_respawn_old_setup setup
                alias slv230_respawn_old_update update
                def setup(map_id)
                  SLV230BossRespawn.enter(map_id)
                  slv230_respawn_old_setup(map_id)
                  @slv230_placed={}
                  SLV230BossRespawn.update(self)
                end
                def update
                  slv230_respawn_old_update
                  SLV230BossRespawn.update(self)
                end
              end
              RUBY
              code.sub('__TARGETS__',table.inspect)
            end
            def self.patch!(site)
              data_root=File.join(site,'knight/gameasync/Data')
              targets,skipped=extract(data_root)
              raise "Unexpected count #{targets.size}" unless targets.size==35
              raise "Unexpected boss count #{targets.values.count{|v|!v[:midboss]}}" unless targets.values.count{|v|!v[:midboss]}==31
              raise "Unexpected midboss count" unless targets.values.count{|v|v[:midboss]}==4
              changed={}
              targets.group_by{|(map_id,id),a|map_id}.each do |map_id, rows|
                path=rows.first[1][:src]
                map=Marshal.load(File.binread(path))
                events=map.instance_variable_get(:@events)
                rows.each do |(mid,id),a|
                  list=events[id].instance_variable_get(:@pages)[a[:page]].instance_variable_get(:@list)
                  reset_index=list.rindex{|c|c.instance_variable_get(:@code)==123 && c.instance_variable_get(:@parameters)==[a[:reset],1] && c.instance_variable_get(:@indent)==0}
                  raise "Wrong reset index" unless reset_index
                  marker="h=$game_system.instance_variable_get(:@slv230_defeated); h={} if h.nil?; (h[#{mid}]||={})[#{id}]=true; $game_system.instance_variable_set(:@slv230_defeated,h)"
                  list.insert(0,command(355,[marker]))
                  reset_index+=1
                  list.insert(reset_index,command(106,[a[:extra_wait]]))
                end
                File.binwrite(path,Marshal.dump(map))
                changed[map_id]=Digest::SHA256.file(path).hexdigest
              end
              script_path=File.join(data_root,'Scripts.rxdata')
              scripts=Marshal.load(File.binread(script_path))
              raise 'Scripts length changed' unless scripts.length==135 && scripts[134][1]=='Main'
              code=make_runtime(targets)
              work=ENV.fetch('SLV230_WORKDIR','/tmp/slv230')
              Dir.mkdir(work) unless Dir.exist?(work)
              File.binwrite(File.join(work,'runtime.rb'),code)
              raise 'Injected Ruby syntax incorrect' unless system('ruby','-c',File.join(work,'runtime.rb'),out:File::NULL)
              scripts.insert(134,[scripts.map{|s|s[0].to_i}.max+1,'V230 Boss Respawn 60s 180s',Zlib::Deflate.deflate(code)])
              File.binwrite(script_path,Marshal.dump(scripts))
              File.write(File.join(work,'targets.json'),JSON.pretty_generate(targets.to_a.map{|(mid,id),v|v.reject{|key,value|key==:src}.merge(map:mid,event:id)}))
              File.write(File.join(work,'skipped.json'),JSON.pretty_generate(skipped))
              puts "R6_PATCHED boss=#{targets.values.count{|v|!v[:midboss]}} mini=#{targets.values.count{|v|v[:midboss]}} maps=#{changed.keys.sort.inspect} skipped=#{skipped.size}"
              puts "R6_MAPS_SHA #{changed.inspect}"
              puts "R6_SCRIPTS_SHA #{Digest::SHA256.file(script_path).hexdigest}"
              [targets,changed]
            end
          end
          if __FILE__==$0
            SLRespawnBuilder.patch!(ARGV.fetch(0))
          end

          RUBY_PATCH
            python3 - <<'PY_CACHE'
          from pathlib import Path
          import hashlib,re
          root=Path('site/knight');prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          ids=[1,2,3,5,6,12,19,21,27,30,31,35,41,42]
          files=['Data/'+prefix+('Map%03d.rxdata'%m) for m in ids]+['Data/Scripts.rxdata']
          mp=root/'gameasync/mapping.js';src=mp.read_text(encoding='utf-8')
          for rel in files:
              md5=hashlib.md5((root/'gameasync'/rel).read_bytes()).hexdigest()
              src,count=re.subn(re.escape(rel+'?h=')+r'[0-9a-f]{32}',lambda _:rel+'?h='+md5,src)
              if count!=1:raise SystemExit('Unexpected mapping entry '+rel)
          mp.write_text(src,encoding='utf-8')
          index=root/'index.html';html=index.read_text(encoding='utf-8')
          old='gameasync/mapping.js?v=v229r5'
          if html.count(old)!=1:raise SystemExit('Unexpected source cache marker')
          index.write_text(html.replace(old,'gameasync/mapping.js?v=v229r6'),encoding='utf-8')
          print('V229R6_ASSET_MAPPING_UPDATED',len(files))
          PY_CACHE
          else
            echo V229R6_ALREADY_APPLIED
          fi

      - name: Verify boss-only changes, timers and excluded maps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import json,hashlib,re
          root=Path('site');older=json.loads(Path('/tmp/slv230/before.json').read_text())
          current={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          expected=json.loads(Path('/tmp/slv230/checks.json').read_text())
          if len(current)!=5354 or current.keys()!=older.keys():raise SystemExit('Site inventory changed')
          if any(current.get(k)!=v[1] for k,v in expected.items()):raise SystemExit('Final respawn asset checksums differ')
          changed={p for p in current if current[p]!=older[p]}
          source=Path('/tmp/slv230/version').read_text()
          if (source=='V229R5' and changed!=set(expected)) or (source=='V229R6' and changed):
              raise SystemExit('Unapproved game changes: '+repr(sorted(changed)))
          if any('Map016.rxdata' in n or 'Map043.rxdata' in n for n in changed):raise SystemExit('Excluded map modified')
          knight=root/'knight';mp=(knight/'gameasync/mapping.js').read_text(encoding='utf-8')
          for name in expected:
              if not name.startswith('knight/gameasync/Data/'):continue
              rel='Data/'+name.split('/Data/',1)[1]
              md5=hashlib.md5((knight/'gameasync'/rel).read_bytes()).hexdigest()
              if mp.count(rel+'?h='+md5)!=1:raise SystemExit('Invalid asset mapping '+rel)
          html=(knight/'index.html').read_text(encoding='utf-8')
          if html.count('gameasync/mapping.js?v=v229r6')!=1:raise SystemExit('Wrong cache version')
          print('PASS_5354_FILES',len(changed),'CHANGED,',5354-len(changed),'UNMODIFIED')
          PY_FINAL
          ruby - <<'RUBY_VALIDATE'
          require 'json'
          require 'zlib'
          module RPG
            class Map;end;class Event;end;class EventCommand;end;class MoveRoute;end;class MoveCommand;end;class AudioFile;end
            class Event;class Page;class Condition;end;class Graphic;end;end;end
          end
          class Table;def self._load(s);new(s);end;def initialize(s);@s=s;end;def _dump(d);@s;end;end
          class Tone;def self._load(s);new;end;end
          class Color;def self._load(s);new;end;end
          rows=JSON.parse(File.read('/tmp/slv230/targets.json')) if File.exist?('/tmp/slv230/targets.json')
          raise 'Patch inventory unavailable' if rows.nil? && File.read('/tmp/slv230/version')=='V229R5'
          if rows.nil?
            rows=[]
            map_to_ids={1=>[1],2=>[15],3=>[6],5=>[12],6=>[6],12=>[10],19=>[3,4,5,6,18],21=>[9,12,13,27],27=>[1],30=>[4,5,6,7,8,9,10,11],31=>[12],35=>[12,13,14,15],41=>[9],42=>[3,20,23,24,25]}
            map_to_ids.each do |m,ids|
              ids.each{|id|rows<<{'map'=>m,'event'=>id,'midboss'=>m==19 && [3,4,5,6].include?(id)}}
            end
          end
          raise 'Target count changed' unless rows.size==35
          raise 'Mini count changed' unless rows.count{|r|r['midboss']}==4
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          rows.each do |r|
            m=r['map'];id=r['event'];next if [16,43].include?(m)
            path='site/knight/gameasync/Data/%sMap%03d.rxdata' % [prefix,m]
            a=Marshal.load(File.binread(path))
            e=a.instance_variable_get(:@events).fetch(id)
            list=e.instance_variable_get(:@pages).find do |p|
              cond=p.instance_variable_get(:@condition)
              key=cond.instance_variable_get(:@self_switch_ch)
              cond.instance_variable_get(:@self_switch_valid) && p.instance_variable_get(:@list).any? do |c|
                c.instance_variable_get(:@code)==123 && c.instance_variable_get(:@parameters)==[key,1]
              end
            end.instance_variable_get(:@list)
            markers=list.select{|c|c.instance_variable_get(:@code)==355 && c.instance_variable_get(:@parameters).join.include?('@slv230_defeated')}
            raise 'Missing kill record' unless markers.size==1
            frames=list.select{|c|c.instance_variable_get(:@code)==106 && c.instance_variable_get(:@indent)==0}.sum{|c|c.instance_variable_get(:@parameters)[0]}
            want=r['midboss'] ? 1500 : 4500
            raise "Wrong event wait #{m}:#{id}: #{frames}" unless frames==want
          end
          scripts=Marshal.load(File.binread('site/knight/gameasync/Data/Scripts.rxdata'))
          raise 'Scripts reordered' unless scripts.size==136 && scripts[133][1]=='V229 Unified Speed Rules' && scripts[134][1]=='V230 Boss Respawn 60s 180s' && scripts[135][1]=='Main'
          puts 'PASS_BOSS_31_MINIBOSS_4_WAIT_FRAMES_AT_50FPS_AND_MAP_RESET_HOOK'

          RUBY_VALIDATE

      - name: Upload verified game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
