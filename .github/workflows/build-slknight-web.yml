
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R67
# BASE: successful deployed V229R66, run 40125737789, exactly 5517 files.
# KEEP: native Sanctuary S32, original engine, all monster/reward/respawn data.
# FIX: no sliding on blocked diagonal walls; entrance-safe distributed spawns.
# FIX: hide and stop updating unused dungeon tilemaps; lazy wall sub-sprites.
# KEEP ORIGINAL WORKFLOW NAME WORDING; version number is the only title change.
name: build-slknight-web.yml | V229R67 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R67 Restore full deployed V229R66 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40125737789
          name: github-pages
          github-token: ${{ github.token }}
          path: r66

      - name: V229R67 Verify exact deployed R66 baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s r66/artifact.tar
          tar -xf r66/artifact.tar -C site
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          base={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(base)==5517,len(base)
          assert 'V229R66' in (root/'index.html').read_text('utf-8')
          assert 'V229R66' in (root/'knight/index.html').read_text('utf-8')
          scripts=root/'knight/gameasync/Data/Scripts.rxdata'
          assert hashlib.sha256(scripts.read_bytes()).hexdigest()=='fe661024a9decb09a6d392594614005722ae7d9ee585c74f79a4f14975cbe678'
          Path('build/r67-baseline.json').write_text(json.dumps(base,sort_keys=True))
          print('PASS R66 baseline: 5517 exact game files and expected script hash')
          PY_BASE

      - name: V229R67 Extract existing game scripts 097 and 134
        shell: bash
        run: |
          set -euo pipefail
          ruby -rzlib - <<'RB_EXTRACT'
          archive=Marshal.load(File.binread('site/knight/gameasync/Data/Scripts.rxdata'))
          raise 'Unexpected original script count' unless archive.size==136
          raise 'Unexpected map renderer script' unless Zlib::Inflate.inflate(archive[97][2]).include?('slti_update_terrain')
          current=Zlib::Inflate.inflate(archive[134][2]).force_encoding('UTF-8')
          raise 'Missing R66 original S32 adapter' unless current.include?('module SLTI_Native66')
          raise 'Missing R49 foreground wall renderer' unless current.include?('def slti_r49_update_walls')
          raise 'Missing approved V230 rewards' unless current.include?('module SLV541')
          File.write('build/r66-097.rb',Zlib::Inflate.inflate(archive[97][2]).force_encoding('UTF-8'))
          File.write('build/r66-134.rb',current)
          puts 'PASS original game scripts extracted without rebuilding the engine'
          RB_EXTRACT

      - name: V229R67 Remove slide, repair floor layers and lazy-load walls
        shell: bash
        run: |
          set -euo pipefail
          cat > build/r67-runtime.rb <<'R67_RUBY'
          # V229R67: source-S32 guided spawn, native hard stops, and entrance clearance.
          # Does not change monster IDs, stats, loot, HP, kill timers or boss rooms.
          module SLTI_R67
            ENTRY = {45=>[32669,32802,95,73], 46=>[32665,32788,81,93]}
            MIN_DEPTH = {45=>45,46=>55}
            GUARD_DEPTH = 24
            @registry = {}

            def self.monster?(event)
              return false unless SLTI_V229R49.monster?(event)
              ref=event.instance_variable_get(:@event)
              return false if ref==nil
              # Preserve Baphomet EV13 and original inner-room King Bugbears by ID.
              mid=event.instance_variable_get(:@map_id)
              return false if mid==46 && [6,13,15,29,38,44].include?(ref.id)
              return true
            end

            def self.prepare(mid)
              return nil unless ENTRY.has_key?(mid)
              @registry={} if @registry==nil
              return @registry[mid] if @registry.has_key?(mid)
              w=SLTI_Native66::WIDTH[mid]
              h=SLTI_Native66::HEIGHT[mid]
              ox=SLTI_Native66::ORIGIN_X
              oy=SLTI_Native66::ORIGIN_Y
              start=ENTRY[mid]
              root=(start[1]-oy)*w+(start[0]-ox)
              distances=Array.new(w*h,-1)
              distances[root]=0
              queue=[[start[0],start[1]]]
              head=0
              bands={}
              dirs=[[1,0],[-1,0],[0,1],[0,-1]]
              while head<queue.size
                x,y=queue[head]
                head+=1
                index=(y-oy)*w+(x-ox)
                distance=distances[index]
                if distance>=MIN_DEPTH[mid] && ((x+y)&3)==0
                  px,py=SLTI_Native66.to_rgss(mid,x,y)
                  if (px-start[2]).abs+(py-start[3]).abs>=17
                    band=distance/20
                    bands[band]=[] unless bands.has_key?(band)
                    bands[band]<<[x,y,distance,px,py]
                  end
                end
                dirs.each do |dx,dy|
                  nx=x+dx;ny=y+dy
                  next if nx<ox || ny<oy || nx>=ox+w || ny>=oy+h
                  ni=(ny-oy)*w+(nx-ox)
                  next if distances[ni]>=0
                  next unless SLTI_Native66.edge?(mid,x,y,dx,dy)
                  distances[ni]=distance+1
                  queue<<[nx,ny]
                end
              end
              data={'distance'=>distances,'bands'=>bands,'connected'=>head}
              @registry[mid]=data
              return data
            end

            def self.depth(mid,x,y)
              data=prepare(mid)
              return -1 if data==nil
              ox=SLTI_Native66::ORIGIN_X
              oy=SLTI_Native66::ORIGIN_Y
              w=SLTI_Native66::WIDTH[mid]
              h=SLTI_Native66::HEIGHT[mid]
              return -1 if x<ox || y<oy || x>=ox+w || y>=oy+h
              return data['distance'][(y-oy)*w+(x-ox)]
            end

            def self.entrance_blocked?(mid,x,y)
              distance=depth(mid,x,y)
              return distance>=0 && distance<GUARD_DEPTH
            end

            def self.free?(event,rx,ry)
              mid=event.instance_variable_get(:@map_id)
              if $game_player!=nil && $game_map!=nil && $game_map.map_id==mid
                return false if (rx-$game_player.x).abs+(ry-$game_player.y).abs<15
              end
              if $game_map!=nil && $game_map.map_id==mid && $game_map.events!=nil
                $game_map.events.each_value do |other|
                  next if other==event || other.character_name.to_s==''
                  return false if (rx-other.x).abs+(ry-other.y).abs<4
                end
              end
              return true
            end

            def self.pick(event)
              return nil unless monster?(event)
              mid=event.instance_variable_get(:@map_id)
              data=prepare(mid)
              return nil if data==nil
              ref=event.instance_variable_get(:@event)
              origin=SLTI_Native66.nearest(mid,ref.x,ref.y,16)
              return nil if origin==nil
              home_depth=depth(mid,origin[0],origin[1])
              return nil if home_depth<0
              low=[MIN_DEPTH[mid],home_depth-25].max
              high=[low+50,home_depth+80].max
              # Widen the local region in stages, keeping the map's original weak/inner zoning.
              [65,120,1000].each do |max_radius|
                240.times do
                  min_bin=low/20
                  max_bin=high/20
                  band=min_bin+rand(max_bin-min_bin+1)
                  list=data['bands'][band]
                  next if list==nil || list.empty?
                  x,y,dist,rx,ry=list[rand(list.size)]
                  next if dist<low || dist>high
                  snap=SLTI_Native66.nearest(mid,rx,ry,16)
                  next if snap==nil || depth(mid,snap[0],snap[1])<low
                  next if (origin[0]-x).abs+(origin[1]-y).abs>max_radius
                  next unless free?(event,rx,ry)
                  return [rx,ry]
                end
              end
              return nil
            end
          end

          class Game_Map
            alias slti_r67_original_setup setup
            def setup(map_id)
              slti_r67_original_setup(map_id)
              return unless SLTI_R67::ENTRY.has_key?(map_id)
              SLTI_R67.prepare(map_id)
              @events.keys.sort.each do |id|
                event=@events[id]
                next unless SLTI_R67.monster?(event)
                original=event.instance_variable_get(:@event)
                next if event.instance_variable_get(:@page).equal?(original.pages[-1])
                target=SLTI_R67.pick(event)
                event.moveto(target[0],target[1]) if target!=nil
              end
            end
          end

          class Game_Event
            alias slti_r67_original_moveto moveto
            def moveto(x,y)
              if SLTI_R67.monster?(self) && @event!=nil && @page!=nil &&
                 @page.equal?(@event.pages[-1]) && $game_map!=nil &&
                 @map_id==$game_map.map_id
                target=SLTI_R67.pick(self)
                return slti_r67_original_moveto(target[0],target[1]) if target!=nil
              end
              slti_r67_original_moveto(x,y)
            end
          end

          class Game_Character
            alias slti_r67_original_native_move slti_native66_move
            def slti_native66_move(dir,turn=true)
              if SLTI_R67.monster?(self) && slti_native66_prepare
                target=SLTI_Native66.native_target(@slti_native66_map,
                  @slti_native66_x,@slti_native66_y,dir)
                if target!=nil && SLTI_R67.entrance_blocked?(@slti_native66_map,target[0],target[1])
                  return false
                end
              end
              slti_r67_original_native_move(dir,turn)
            end
          end
          R67_RUBY
          python3 - <<'PY_PATCH'
          from pathlib import Path
          script97=Path('build/r66-097.rb').read_text('utf-8')
          script134=Path('build/r66-134.rb').read_text('utf-8')
          appended=Path('build/r67-runtime.rb').read_text('utf-8')

          def replace_once(text,old,new,label):
              n=text.count(old)
              assert n==1, (label,'count',n)
              return text.replace(old,new,1)

          # Invisible tilemaps must not update on the two original dungeon floors.
          script97=replace_once(script97,
              '    @tilemap4.map_data = $game_map.data\n    update\n',
              '''    @tilemap4.map_data = $game_map.data
              if @slti_floor
                [@tilemap,@tilemap2,@tilemap3,@tilemap4].each do |layer|
                  layer.visible=false unless layer==nil
                end
              end
              update
          ''','hide all auxiliary tilemaps')
          for layer in ['@tilemap','@tilemap2','@tilemap3','@tilemap4']:
              script97=replace_once(script97, '    '+layer+'.update\n',
                                 '    '+layer+'.update unless @slti_floor\n', 'skip heavy hidden '+layer+' update')

          # An illegal diagonal step MUST stop, not slide into one open cardinal edge.
          script134=replace_once(script134,
          '''    # Input pad has four buttons: use ONE original open edge to slide
              # along a wall; never pretend a route through the blocked wall exists.
              if edge?(mid,x,y,dx,0)
                return [x+dx,y]
              end
              if edge?(mid,x,y,0,dy)
                return [x,y+dy]
              end
              return nil
          ''',
          '''    # No slide or axis fallback at blocked walls.
              return nil
          ''','delete wall slide')

          # Lazy wall sub-sprites: only create the visible pieces, not every stone object.
          script134=replace_once(script134,
          '''      sprites=[]
                data.each do |entry|
                  id,bx0,by0,bx1,by1=entry
                  left=(id%4)*128;top=(id/4)*64
                  s=Sprite.new(@viewport2)
                  s.bitmap=texture
                  s.src_rect.set(left,top,128,64)
                  s.zoom_x=2.0;s.zoom_y=2.0
                  sprites << [s,id,bx0,by0,bx1,by1]
                end
          ''',
          '''      sprites=[]
                data.each do |entry|
                  sprites << [nil,entry[0],entry[1],entry[2],entry[3],entry[4]]
                end
          ''','lazy wall sprites')
          script134=replace_once(script134,
          '''      pieces.each do |p|
                  s=p[0];s.bitmap=nil;s.dispose unless s.disposed?
                end
          ''',
          '''      pieces.each do |p|
                  s=p[0]
                  next if s==nil
                  s.bitmap=nil
                  s.dispose unless s.disposed?
                end
          ''','dispose lazy pieces')
          script134=replace_once(script134,
          '''        if wall_x+256<=0 || wall_y+128<=0 ||
                     wall_x>=@viewport2.rect.width || wall_y>=@viewport2.rect.height
                    s.visible=false if s.visible
                    next
                  end
                  s.visible=true unless s.visible
          ''',
          '''        if wall_x+256<=0 || wall_y+128<=0 ||
                     wall_x>=@viewport2.rect.width || wall_y>=@viewport2.rect.height
                    s.visible=false if s!=nil && s.visible
                    next
                  end
                  if s==nil
                    s=Sprite.new(@viewport2)
                    s.bitmap=item[0]
                    s.src_rect.set((id%4)*128,(id/4)*64,128,64)
                    s.zoom_x=2.0;s.zoom_y=2.0
                    part[0]=s
                  end
                  s.visible=true unless s.visible
          ''','create wall sub sprites when visible')
          script134=replace_once(script134,
          '''        item[1].each do |part|
                    s=part[0];s.bitmap=nil;s.dispose unless s.disposed?
                  end
          ''',
          '''        item[1].each do |part|
                    s=part[0]
                    next if s==nil
                    s.bitmap=nil
                    s.dispose unless s.disposed?
                  end
          ''','dispose lazy wall sprites')
          # Avoid per-frame wall bbox iteration when neither camera nor hero moved.
          script134=replace_once(script134,
          '''      actor_depth=hero.z
              end
              @slti_r49_walls.each do |key,item|
          ''',
          '''      actor_depth=hero.z
              end
              stamp=[sx,sy,@slti_chunks.length,@slti_r49_walls.length,
                     hashero ? hero.x : nil,hashero ? hero.y : nil,
                     hashero ? hero.z : nil,
                     hashero ? hero.src_rect.width : nil,
                     hashero ? hero.src_rect.height : nil]
              if @slti_r67_wall_stamp==stamp &&
                 @slti_r49_walls.length==@slti_chunks.length
                return
              end
              @slti_r67_wall_stamp=stamp
              @slti_r49_walls.each do |key,item|
          ''','wall unchanged fast path')
          assert 'SLTI_R67' not in script134
          script134+='\n'+appended
          Path('build/r67-097.rb').write_text(script97,encoding='utf-8')
          Path('build/r67-134.rb').write_text(script134,encoding='utf-8')
          print('Patched scripts:',len(script97),len(script134))
          PY_PATCH
          ruby -c build/r67-097.rb
          ruby -c build/r67-134.rb

      - name: V229R67 Verify no-slide and spawn distribution in authentic S32
        shell: bash
        run: |
          set -euo pipefail
          ruby - <<'RB_TEST'
          text=File.read('build/r67-134.rb',encoding:'UTF-8')
          pos=text.index('module SLTI_Native66')
          last=text.index("\nclass Game_Character",pos)
          raise 'Native S32 module not found' if pos==nil || last==nil
          eval(text[pos...last])
          code=File.read('build/r67-runtime.rb',encoding:'UTF-8')
          eval(code[0...code.index("\nclass Game_Map")])
          [45,46].each do |mid|
            data=SLTI_R67.prepare(mid)
            expected=mid==45 ? 5955 : 11665
            raise 'Changed original S32 connectivity' unless data['connected']==expected
            count=data['bands'].values.inject(0){|sum,b|sum+b.length}
            raise 'Too few safe distributed spawn cells' if count<1000
            width=SLTI_Native66::WIDTH[mid]
            height=SLTI_Native66::HEIGHT[mid]
            ox=SLTI_Native66::ORIGIN_X
            oy=SLTI_Native66::ORIGIN_Y
            tested=0
            height.times do |iy|
              width.times do |ix|
                x=ox+ix;y=oy+iy
                next if SLTI_Native66.value(mid,x,y)==0
                {2=>[-1,1],4=>[-1,-1],6=>[1,1],8=>[1,-1]}.each do |direction,delta|
                  target=SLTI_Native66.native_target(mid,x,y,direction)
                  dx,dy=delta
                  ok=SLTI_Native66.move_path?(mid,x,y,dx,dy)
                  raise 'SLIDING STILL PRESENT' unless (target==nil)==(!ok)
                  raise 'Changed one native move' if ok && target!=[x+dx,y+dy]
                  tested+=1
                end
              end
            end
            puts "PASS floor #{mid}: #{tested} native movements, no slide; #{count} safe spawn cells"
          end
          RB_TEST
          python3 - <<'PY_RENDER'
          from pathlib import Path
          old=Path('build/r66-097.rb').read_text('utf-8')
          new=Path('build/r67-097.rb').read_text('utf-8')
          assert 'layer.visible=false unless layer==nil' in new
          for layer in ('@tilemap','@tilemap2','@tilemap3','@tilemap4'):
            assert layer+'.update unless @slti_floor' in new
          assert old!=new
          w=Path('build/r67-134.rb').read_text('utf-8')
          assert 's=Sprite.new(@viewport2)' in w
          assert 'sprites << [nil,entry[0],entry[1],entry[2],entry[3],entry[4]]' in w
          assert 'No slide or axis fallback at blocked walls.' in w
          print('PASS floor: all four hidden tilemaps disabled; wall sprites created on demand')
          PY_RENDER

      - name: V229R67 Repack original engine scripts and refresh web hashes
        shell: bash
        run: |
          set -euo pipefail
          ruby -rzlib - <<'RB_REPACK'
          path='site/knight/gameasync/Data/Scripts.rxdata'
          a=Marshal.load(File.binread(path));before=Marshal.load(File.binread(path))
          raise 'Unexpected original script count' unless a.size==136
          {97=>'build/r67-097.rb',134=>'build/r67-134.rb'}.each do |index,file|
            a[index][2]=Zlib::Deflate.deflate(File.binread(file))
          end
          raise 'Unexpected script modification' unless a.each_index.all?{|i| i==97 || i==134 || a[i]==before[i]}
          File.binwrite(path,Marshal.dump(a))
          check=Marshal.load(File.binread(path))
          raise 'Missing no-slide change' if Zlib::Inflate.inflate(check[134][2]).include?('use ONE original open edge to slide')
          raise 'Missing safe spawn code' unless Zlib::Inflate.inflate(check[134][2]).include?('module SLTI_R67')
          puts 'PASS 134/136 script entries untouched; original game data unchanged'
          RB_REPACK
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import hashlib,re,json
          root=Path('site');game=root/'knight/gameasync';mapping=game/'mapping.js'
          txt=mapping.read_text('utf-8')
          digest=hashlib.md5((game/'Data/Scripts.rxdata').read_bytes()).hexdigest()
          txt,n=re.subn(r'Data/Scripts\.rxdata\?h=[0-9a-f]{32}',lambda m:'Data/Scripts.rxdata?h='+digest,txt)
          assert n==1,n
          mapping.write_text(txt,encoding='utf-8')
          for name in ('index.html','knight/index.html'):
            f=root/name;old=f.read_text('utf-8')
            assert 'V229R66' in old,name
            f.write_text(old.replace('V229R66','V229R67').replace('v229r66','v229r67'),encoding='utf-8')
          base=json.loads(Path('build/r67-baseline.json').read_text('utf-8'))
          now={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(now)==5517 and base.keys()==now.keys()
          changed={k for k in base if now[k]!=base[k]}
          allowed={'index.html','knight/index.html','knight/gameasync/mapping.js','knight/gameasync/Data/Scripts.rxdata'}
          assert changed==allowed,('Unexpected original game modification',changed^allowed)
          print('PASS 5517 files preserved; only native game scripts, hash and build labels changed')
          PY_FINAL
          node --check site/knight/gameasync/mapping.js

      - name: V229R67 Upload full original game to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
