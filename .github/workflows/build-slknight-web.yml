
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V270
# BASE: V267 successful run 41441629897. V268 broken loader is NOT inherited.
# PURPOSE: Remove redundant Zenith sprite update; reuse native attack objects.
# EVENT: Map025 EV29 only. No monster/common-event cloning.
# NATIVE: Kurtz/Death Knight reference: range 10, route [10,0], frequency 6.
# KEEP: Original title, attack ratio, native damage, drops and seven motion PNGs.
# LIMIT: Game start and real device frame pacing require deployment verification.

name: build-slknight-web.yml | V270 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: V270 Restore last launchable V267 game, not broken V268
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41441629897
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V270 Verify original files
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert len(files)==5610,('Unexpected V267 inventory',len(files))
          data='knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          for name in ['Scripts.rxdata',pre+'Map025.rxdata',pre+'Map016.rxdata',
                       pre+'Map021.rxdata',pre+'CommonEvents.rxdata']:
              assert data+name in files,name
          for action in ['Idle','Walk','Attack','AltAttack','Spell','Hit','Death']:
              assert 'knight/gameasync/Graphics/Characters/SLZenith'+action+'.png' in files
          drive=(root/'knight/js/drive.js').read_text('utf-8')
          loader=(root/'knight/js/sl-assets-v229r115.js').read_text('utf-8')
          assert 'slV268NetPending' not in drive
          assert 'slV268ZenithReady' not in loader
          assert "var version='V267';" in loader
          Path('build/before.json').write_text(json.dumps(files,sort_keys=True))
          print('PASS original V267 game; broken V268 loader absent')
          PY

      - name: V270 Remove redundant Zenith update and limit native chase
        shell: bash
        run: |
          set -euo pipefail
          cat > build/patch.rb <<'RUBY'
          # encoding: UTF-8
          require 'zlib'
          module RPG
            class Map;end
            class MapInfo;end
            class CommonEvent;end
            class AudioFile;end
            class Item;end
            class Weapon;end
            class Armor;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end
          class Table
            def self._load(raw)
              obj=allocate;obj.instance_variable_set(:@raw,raw);obj
            end
            def _dump(level=0);@raw;end
          end
          class Tone
            def self._load(raw)
              obj=allocate;obj.instance_variable_set(:@raw,raw);obj
            end
            def _dump(level=0);@raw;end
          end
          class Color<Tone;end
          def iv(o,key);o.instance_variable_get('@'+key.to_s);end
          def put(o,key,val);o.instance_variable_set('@'+key.to_s,val);end
          def replace_one(s,a,b,label)
            n=s.scan(a).length
            raise "#{label}: expected one, found #{n}" unless n==1
            s.sub(a,b)
          end
          root='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          path=root+pre+'Map025.rxdata'
          script_path=root+'Scripts.rxdata'
          map=Marshal.load(File.binread(path))
          original_events=iv(map,:events)
          boss=original_events.fetch(29)
          pages=iv(boss,:pages)
          raise 'Unexpected Zenith pages' unless pages.length==1
          page=pages.first
          route=iv(page,:move_route)
          raise 'V267 movement changed' unless
            iv(page,:move_type)==3 && iv(page,:move_frequency)==6 &&
            iv(page,:trigger)==0 &&
            iv(route,:list).map{|cmd|iv(cmd,:code)}==[10,0]
          raise 'Event commands unexpectedly restored' unless
            iv(page,:list).length==1 && iv(iv(page,:list)[0],:code)==0
          untouched=original_events.each_with_object({}) do |(id,ev),hash|
            hash[id]=Marshal.dump(ev) unless id==29
          end
          # Native 10/0 pursuit route is retained. No automatic chase at entry.
          # The original engine will activate this route only after acquisition.
          put(page,:move_type,0)
          untouched.each do |id,raw|
            raise "Unrelated event changed #{id}" unless
              Marshal.dump(original_events[id])==raw
          end
          File.binwrite(path,Marshal.dump(map))

          scripts=Marshal.load(File.binread(script_path))
          raise 'Unexpected script archive count' unless scripts.length==136
          indices=scripts.each_index.select do |i|
            scripts[i].is_a?(Array) && scripts[i][1]=='SLMonsterV267'
          end
          raise 'V267 monster runtime missing/duplicated' unless indices.length==1
          idx=indices.fetch(0)
          old_other={}
          scripts.each_with_index do |entry,i|
            old_other[i]=Marshal.dump(entry) unless i==idx || i==28
          end
          runtime=Zlib::Inflate.inflate(scripts[idx][2]).force_encoding('UTF-8')
          raise 'Invalid monster runtime encoding' unless runtime.valid_encoding?
          base_sprite=Zlib::Inflate.inflate(scripts[28][2])
          assert_stats=[':level=>60',':max_hp=>5200',':physical=>[50,100]',
            ':magic=>[150,300]',':attack_wait=>20',':attack_range=>3',
            ':accuracy=>9999',':exp=>43212',':adena=>[64800,151200]',
            'floor=80','[:weapon,41,50]','[26,26,0,2,0,6]']
          assert_stats.each{|s|raise "Approved value absent #{s}" unless runtime.include?(s)}
          drops=runtime.scan(/\[:(item|weapon|armor),(\d+),(\d+)\]/)
          raise 'Approved 20 drops changed' unless drops.length==20

          # 1. Remove the entire additional Sprite_Character#update override.
          # The native renderer in script 28 will handle all sprites ONCE.
          a=runtime.index("\nclass Sprite_Character\n")
          b=a && runtime.index("\nmodule SLMonster\n",a+1)
          raise 'V267 sprite wrapper boundaries changed' unless a && b && a<b
          legacy_sprite=runtime[a...b]
          raise 'Old sprite wrapper not recognized' unless
            legacy_sprite.include?('alias slm_v267_original_update update') &&
            legacy_sprite.include?('SLMonster.frame_info') &&
            legacy_sprite.include?('rect.set(frame*cw,row*ch,cw,ch)')
          runtime=runtime[0...a]+runtime[b..-1]
          raise 'Sprite wrapper still present' if runtime.include?('class Sprite_Character')

          # 2. Keep the existing Sprite_Character update chain, changing only Zenith's
          # frame width and animation source rectangle inside the native pass.
          width='@cw = bitmap.width / 4'
          new_width=<<'WIDTH'.rstrip
                  @slm_v270_cfg=nil
                  if @character.is_a?(Game_Event)
                    @slm_v270_cfg=SLMonster.config(
                      @character.instance_variable_get(:@map_id),
                      @character.instance_variable_get(:@id))
                  end
                  if @slm_v270_cfg
                    suffix=@character.character_name.sub(@slm_v270_cfg[:sprite],'')
                    columns=@slm_v270_cfg[:frames][suffix] || 4
                    @cw=bitmap.width/columns
                  else
                    @cw=bitmap.width/4
                  end
          WIDTH
          base_sprite=replace_one(base_sprite,width,new_width,'Native sprite frame columns')
          rectangle=/^[ \t]*sx = @character\.pattern \* @cw\r?\n[ \t]*sy = \(@character\.direction - 2\) \/ 2 \* @ch/
          new_rect=<<'RECT'.rstrip
                  info=@slm_v270_cfg && SLMonster.frame_info(@character)
                  if info && @character.character_name==@slm_v270_cfg[:sprite]+info[0]
                    sx=info[1]*@cw
                    sy=info[2]*@ch
                  else
                    sx=@character.pattern*@cw
                    sy=(@character.direction-2)/2*@ch
                  end
          RECT
          base_sprite=replace_one(base_sprite,rectangle,new_rect,'Native sprite rectangle')
          File.binwrite('build/native-sprite.rb',base_sprite)
          raise 'Native renderer syntax invalid' unless system('ruby','-c','build/native-sprite.rb')

          # 3. Reuse the same native Interpreter and 50 command objects.
          # Keep the CE57 command sequence and physical:magic 6:1 untouched.
          start=runtime.index('  def self.monster_attack(ev,c,s)')
          finish=start && runtime.index('  def self.reward(',start)
          raise 'Original monster_attack boundaries missing' unless start && finish
          old_attack=runtime[start...finish]
          ['Interpreter.new(0)','attack_commands(c)','s[:native_interpreter]'].each do |k|
            raise "Original attack has changed: #{k}" unless old_attack.include?(k)
          end
          attack=<<'ATTACK'
            def self.monster_attack(ev,c,s)
              active=s[:native_interpreter]
              if active && active.running?
                active.update
                return
              end
              target=actor
              return unless target && target.respond_to?(:hp)
              return if target.hp.to_i<=0
              d=distance(ev)
              return unless d
              unless d[0]<=c[:attack_range] && d[1]<=c[:attack_range]
                s[:attack_tick]=0
                return
              end
              s[:attack_tick]+=1
              return if s[:attack_tick]<c[:attack_wait]
              s[:attack_tick]=0
              return unless defined?(Interpreter)
              active ||= Interpreter.new(0)
              s[:native_interpreter]=active
              s[:native_commands] ||= attack_commands(c)
              active.setup(s[:native_commands],ev.instance_variable_get(:@id))
              s[:attack_count]+=1
              action=s[:attack_count].even? ? 'AltAttack' : 'Attack'
              motion(ev.instance_variable_get(:@map_id),
                     ev.instance_variable_get(:@id),action,c[:attack_wait])
            end

          ATTACK
          runtime=runtime[0...start]+attack+runtime[finish..-1]
          raise 'Interpreter still created in repeated attack branch' unless
            runtime.scan('Interpreter.new(0)').length==1 &&
            runtime.scan('attack_commands(c)').length==2

          # 4. A single update for this event in a Graphics frame.
          # No re-entrant attack, motion, or duplicate state tick.
          old_tick=/s=state\(map_id,event_id\)\n[ \t]*s\[:tick\]\+=1/
          new_tick=<<'TICK'.rstrip
              s=state(map_id,event_id)
              if defined?(Graphics) && Graphics.respond_to?(:frame_count)
                frame=Graphics.frame_count
                return if s[:last_update_frame]==frame
                s[:last_update_frame]=frame
              end
              s[:tick]+=1
              # Native movement is activated only after player acquisition.
              d=distance(ev)
              if d
                near=(d[0]+d[1]<=10)
                far=(d[0]+d[1]>=14)
                engaged=s[:engaged]==true
                if near && !engaged
                  s[:engaged]=true
                  ev.instance_variable_set(:@move_type,3)
                elsif far && engaged
                  s[:engaged]=false
                  ev.instance_variable_set(:@move_type,0)
                end
              end
          TICK
          runtime=replace_one(runtime,old_tick,new_tick,'single frame and acquisition')
          # The original R49 monster flag only covers Map045/046; do not set it
          # on every update of Map025 Zenith.
          runtime=replace_one(runtime,/^[ \t]*@monster=true if c\r?\n/,'','unused monster flag')

          # 5. Recompute walking? at most once per state tick; long idle hold
          # prevents repeated Walk/Idle bitmaps at every native move interval.
          old_walk=/def self\.walking\?\(ev,s\)\n[ \t]*moving=ev\.respond_to\?\(:moving\?\) && ev\.moving\?\n[ \t]*s\[:last_move_tick\]=s\[:tick\] if moving\n[ \t]*moving \|\| \(s\[:tick\]-s\[:last_move_tick\]<=24\)/
          new_walk=<<'WALK'.rstrip
              def self.walking?(ev,s)
                return s[:walk_cached] if s[:walk_cached_tick]==s[:tick]
                moving=ev.respond_to?(:moving?) && ev.moving?
                s[:last_move_tick]=s[:tick] if moving
                s[:walk_cached]=moving || (s[:tick]-s[:last_move_tick]<=120)
                s[:walk_cached_tick]=s[:tick]
                s[:walk_cached]
          WALK
          runtime=replace_one(runtime,old_walk,new_walk,'deduplicated walking status')
          raise 'Player attack input hook removed' unless runtime.include?('player_strike(map_id,event_id)')
          raise 'Game_Event native update hook removed' unless runtime.include?('SLMonster.update_event(self) if c')
          raise 'Native damage commands lost' unless runtime.include?('f.call(117,[57],1)')
          raise 'Drop table changed' unless runtime.scan(/\[:(item|weapon|armor),(\d+),(\d+)\]/)==drops
          raise 'Old passive damage returned' if runtime.include?('def self.player_attack(')
          runtime=runtime.gsub('slm_v267','slm_v270')
          File.write('build/monster-runtime.rb',runtime,encoding:'UTF-8')
          raise 'Monster runtime syntax invalid' unless system('ruby','-c','build/monster-runtime.rb')
          scripts[28][2]=Zlib::Deflate.deflate(base_sprite,9)
          scripts[idx][0]=99827001
          scripts[idx][1]='SLMonsterV270'
          scripts[idx][2]=Zlib::Deflate.deflate(runtime,9)
          old_other.each do |i,raw|
            raise "Other script changed #{i}" unless Marshal.dump(scripts[i])==raw
          end
          File.binwrite(script_path,Marshal.dump(scripts))
          restored=Marshal.load(File.binread(script_path))
          raise 'Runtime bytes mismatch' unless Zlib::Inflate.inflate(restored[idx][2]).b==runtime.b
          raise 'Native sprite bytes mismatch' unless Zlib::Inflate.inflate(restored[28][2]).b==base_sprite.b
          puts 'PASS removed standalone Sprite_Character.update override'
          puts 'PASS removed the extra Zenith renderer, retaining original rendering layers'
          puts 'PASS native Interpreter and native command graph reused'
          puts 'PASS one Zenith update per frame; no repeated bitmap state checks'
          puts 'PASS native pursuit activated at ten tiles, with hysteresis'
          puts 'PASS approved attack, twenty drops and all unrelated scripts preserved'
          RUBY
          ruby -c build/patch.rb
          ruby build/patch.rb

      - name: V270 Validate single renderer and no added loading hooks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          raw=Path('build/monster-runtime.rb').read_text('utf-8')
          renderer=Path('build/native-sprite.rb').read_bytes()
          assert 'class Sprite_Character' not in raw
          assert raw.count('class Game_Event')==1
          assert raw.count('SLMonster.update_event(self) if c')==1
          assert raw.count('Interpreter.new(0)')==1
          assert raw.count('s[:native_commands] ||= attack_commands(c)')==1
          assert 'frame=Graphics.frame_count' in raw
          assert 'SLMonster.frame_info(@character)'.encode() in renderer
          assert renderer.count(b'class Sprite_Character')==1
          print('PASS script 28 native renderer modified in place; no extra Zenith sprite override')
          print('PASS no duplicate monster runtime, one attack interpreter')
          PY
          ruby -c build/native-sprite.rb
          ruby -c build/monster-runtime.rb
          node --check site/knight/js/drive.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: V270 Test one interpreter, no duplicate update and native engagement
        shell: bash
        run: |
          set -euo pipefail
          cat > build/test_runtime.rb <<'TEST'
          class Game_Map
           attr_accessor :map_id,:events
           def setup(id);@map_id=id;end
          end
          class Game_Event
           attr_accessor :x,:y,:character_name,:direction,:move_queries
           def initialize(mid,id)
            @map_id=mid;@id=id;@x=0;@y=0;@direction=2;@move_type=0
            @move_queries=0;@character_name='SLZenithIdle'
           end
           def update;end
           def moving?;@move_queries+=1;false;end
           def erase;@erased=true;end
          end
          class Sprite_Character
           def update;end
          end
          module RPG
           class EventCommand;end
          end
          module Graphics
           @frame=0
           def self.frame_count;@frame;end
           def self.next_frame;@frame+=1;end
          end
          module Input
           C=13
           def self.trigger?(key);false;end
           def self.press?(key);false;end
          end
          class Interpreter
           @@created=0
           @@started=0
           def self.created;@@created;end
           def self.started;@@started;end
           def initialize(*args);@@created+=1;@running=false;end
           def setup(commands,event_id);@running=true;@@started+=1;end
           def running?;@running;end
           def update;@running=false;end
          end
          $game_player=Struct.new(:x,:y,:direction,:animation_id).new(22,22,2,0)
          actor=Struct.new(:hp,:atk,:agi,:exp).new(10000,100,100,0)
          $game_party=Struct.new(:actors).new([actor])
          $game_variables=Hash.new(0)
          $game_actors={}
          $data_animations=Array.new(100)
          $m=nil
          $game_map=Game_Map.new
          $game_map.setup(25)
          load 'build/monster-runtime.rb'
          boss=Game_Event.new(25,29)
          $game_map.events={29=>boss}
          Graphics.next_frame
          2.times{boss.update}
          s=SLMonster.state(25,29)
          raise 'Repeated update in one frame' unless s[:tick]==1
          raise 'Offscreen native route is active' unless boss.instance_variable_get(:@move_type)==0
          $game_player.x=2;$game_player.y=2
          Graphics.next_frame;boss.update
          raise 'Missing pursuit acquisition' unless boss.instance_variable_get(:@move_type)==3
          70.times{Graphics.next_frame;boss.update}
          raise 'Recreated attack interpreters' unless Interpreter.created==1
          raise 'No attack started' if Interpreter.started<2
          commands=s[:native_commands]
          raise 'Attack graph not cached' unless commands.is_a?(Array) && commands.length>0
          70.times{Graphics.next_frame;boss.update}
          raise 'Attack graph recreated' unless s[:native_commands].equal?(commands)
          a=boss.move_queries
          SLMonster.walking?(boss,s)
          SLMonster.walking?(boss,s)
          raise 'Walking state checked twice per tick' unless boss.move_queries==a
          $game_player.x=22;$game_player.y=22
          Graphics.next_frame;boss.update
          raise 'Chase remains active after disengagement' unless boss.instance_variable_get(:@move_type)==0
          puts 'PASS one monster update per Graphics frame, native acquisition, one Interpreter/graph, one walking calculation'
          TEST
          ruby -c build/test_runtime.rb
          ruby build/test_runtime.rb

      - name: V270 Test original renderer handles 12/13 frames without another wrapper
        shell: bash
        run: |
          set -euo pipefail
          cat > build/test_sprite.rb <<'TEST'
          module RPG
           class Sprite
            attr_accessor :bitmap,:ox,:oy,:visible,:x,:y,:z,:opacity,:blend_type,:bush_depth
            attr_reader :src_rect
            def initialize(*args);@src_rect=Rect.new;end
            def update;end
            def animation(*args);end
           end
           module Cache
            def self.character(filename,hue)
              case filename
              when /SLZenithWalk/ then Bitmap.new(12*40,4*60)
              when /SLZenithAttack/ then Bitmap.new(13*40,4*60)
              else Bitmap.new(4*32,4*32)
              end
            end
           end
          end
          class Bitmap
           attr_reader :width,:height
           def initialize(w,h);@width=w;@height=h;end
          end
          class Rect
           attr_reader :last
           def set(*args);@last=args;end
          end
          class Game_Event
           attr_accessor :tile_id,:character_name,:character_hue,:pattern,:direction,:transparent,
           :animation_id,:opacity,:blend_type,:bush_depth
           def initialize(map_id,event_id,char)
            @map_id=map_id;@id=event_id;@character_name=char;@character_hue=0
            @pattern=0;@direction=2;@tile_id=0;@transparent=false;@animation_id=0
            @opacity=255;@blend_type=0;@bush_depth=0
           end
           def screen_x;20;end;def screen_y;35;end;def screen_z(h);h;end
          end
          module SLMonster
           def self.config(mid,eid)
            return nil unless mid==25 && eid==29
            {sprite:'SLZenith',frames:{'Walk'=>12,'Attack'=>13,'Idle'=>11}}
           end
           def self.frame_info(ev)
            [ev.character_name=='SLZenithAttack' ? 'Attack' : 'Walk',5,2,
             ev.character_name=='SLZenithAttack' ? 13 : 12]
           end
          end
          load 'build/native-sprite.rb'
          spr=Sprite_Character.new(nil,Game_Event.new(25,29,'SLZenithWalk'))
          raise "wrong atlas column size #{spr.src_rect.last}" unless spr.src_rect.last==[200,120,40,60]
          spr.update
          raise 'wrong repeat renderer' unless spr.src_rect.last==[200,120,40,60]
          spr.instance_variable_get(:@character).character_name='SLZenithAttack'
          spr.update
          raise "wrong attack column #{spr.src_rect.last}" unless spr.src_rect.last==[200,120,40,60]
          normal=Sprite_Character.new(nil,Game_Event.new(21,27,'Kurtz'))
          raise "original 4-direction tile modified #{normal.src_rect.last}" unless normal.src_rect.last==[0,0,32,32]
          puts 'PASS native sprite single update (Walk 12 frames, Attack 13, original monster 4 frames)'
          TEST
          ruby -c build/test_sprite.rb
          ruby build/test_sprite.rb

      - name: V270 Refresh only Scripts.rxdata hash and version metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,hashlib
          root=Path('site')
          game=root/'knight/gameasync'
          manifest=game/'mapping.js'
          text=manifest.read_text('utf-8')
          name='Data/Scripts.rxdata'
          md5=hashlib.md5((game/name).read_bytes()).hexdigest()
          text,n=re.subn(r'(Data/Scripts\.rxdata\?h=)[0-9a-f]{32}',
                         lambda m:m.group(1)+md5,text)
          assert n==1,('Wrong mapping Script hash entries',n)
          manifest.write_text(text,'utf-8')
          loader=root/'knight/js/sl-assets-v229r115.js'
          s=loader.read_text('utf-8')
          assert s.count("var version='V267';")==1
          loader.write_text(s.replace("var version='V267';","var version='V270';"),'utf-8')
          for rel in ['index.html','knight/index.html']:
              p=root/rel;s=p.read_text('utf-8')
              assert 'V267' in s
              p.write_text(s.replace('V267','V270').replace('v267','v270'),'utf-8')
          print('PASS script cache hash updated; old browser loader code unchanged')
          PY
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: V270 Verify no event clones or unrelated assets changed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before=json.loads(Path('build/before.json').read_text('utf-8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          pre='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          allowed={pre+'Map025.rxdata','knight/gameasync/Data/Scripts.rxdata',
                   'knight/gameasync/mapping.js','knight/js/sl-assets-v229r115.js',
                   'index.html','knight/index.html'}
          assert len(after)==5610
          assert set(before)==set(after)
          changed={p for p in before if before[p]!=after[p]}
          assert changed==allowed,('Unapproved modified files',sorted(changed^allowed))
          for p in before:
