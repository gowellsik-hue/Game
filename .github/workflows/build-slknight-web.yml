
name: build-slknight-web.yml | V1.26 | Healer Aggro, Teleport Reset, Holy Walk Buff Icon

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Restore V1.25 deployed game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 43041917380
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify V1.25 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil, struct
          root = Path('site')
          files = {
              str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }
          assert len(files) == 5619, ('V1.25 file count', len(files))
          needed = [
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/mapping.js',
              'knight/gameasync/bitmap-map.js',
              'knight/js/sl-assets-v229r115.js',
              'knight/index.html',
              'index.html',
              'knight/gameasync/Graphics/Icons/홀리워크.png',
              'knight/gameasync/Graphics/Icons/홀리워크버프.png',
          ]
          assert all(n in files for n in needed), 'Incomplete V1.25 game'
          loader = (root/'knight/js/sl-assets-v229r115.js').read_text('utf8')
          assert "var version='V1.25';" in loader
          assert 'SLKnight V1.25' in (root/'knight/index.html').read_text('utf8')
          icons = root/'knight/gameasync/Graphics/Icons'
          for name, dims in [('홀리워크.png',(32,32)),('홀리워크버프.png',(38,37))]:
              png = (icons/name).read_bytes()
              assert png[:8] == b'\x89PNG\r\n\x1a\n'
              assert struct.unpack('>II',png[16:24]) == dims
          Path('build/before.json').write_text(json.dumps(files,ensure_ascii=False),encoding='utf8')
          shutil.copyfile(root/needed[0], 'build/Scripts.v125.rxdata')
          print('PASS: V1.25 successful deployed artifact / 5619 files / icons unchanged')
          PY

      - name: Patch V1.26 existing scripts
        shell: bash
        run: |
          set -euo pipefail
          cat > build/patch_v126.rb <<'RUBY_V126'
          require 'zlib'
          require 'digest'

          module RPG
            class Map; end
            class MapInfo; end
            class CommonEvent; end
            class Event
              class Page
                class Condition; end
                class Graphic; end
              end
            end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
            class AudioFile; end
            class Tileset; end
          end
          [Color = Class.new, Tone = Class.new, Table = Class.new].each do |klass|
            klass.define_singleton_method(:_load) do |raw|
              obj = allocate
              obj.instance_variable_set(:@sl_raw_payload, raw)
              obj
            end
            klass.define_method(:_dump) { |_limit| @sl_raw_payload }
          end

          ROOT = File.expand_path(ARGV.fetch(0))
          KNIGHT = File.join(ROOT,'knight')
          SCRIPTS = File.join(KNIGHT,'gameasync/Data/Scripts.rxdata')

          DATA_PREFIX = File.join(KNIGHT,'gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO')
          monster_count = 0
          healer_count = 0
          Dir.glob(DATA_PREFIX + 'Map[0-9][0-9][0-9].rxdata').sort.each do |path|
            map = Marshal.load(File.binread(path))
            map.instance_variable_get(:@events).each_value do |event|
              healer_count += 1 if event.instance_variable_get(:@name).to_s.b == '[ID힐러 마법사]'.b
              pages = event.instance_variable_get(:@pages)
              monster_count += 1 if pages.any? do |page|
                page.instance_variable_get(:@trigger) == 2 &&
                  page.instance_variable_get(:@list).any? do |cmd|
                    cmd.instance_variable_get(:@code) == 117 && cmd.instance_variable_get(:@parameters) == [62]
                  end
              end
            end
          end
          raise "Monster census #{monster_count}/427" unless monster_count == 427
          raise "Healer census #{healer_count}/39" unless healer_count == 39

          def check(value, msg)
            raise msg unless value
          end

          def once(src, before, after, label)
            n = src.scan(before).length
            check(n == 1, "#{label}: #{n} matches")
            src.sub(before,after)
          end

          scripts = Marshal.load(File.binread(SCRIPTS))
          patched = []

          def patch_script(scripts,name)
            row = scripts.find {|r| r.is_a?(Array) && r[1].to_s == name.b }
            check(row && row[2].is_a?(String), "Missing script #{name}")
            src = Zlib::Inflate.inflate(row[2]).force_encoding('UTF-8')
            check(src.valid_encoding?,"Invalid UTF-8: #{name}")
            nl = src.include?("\r\n") ? "\r\n" : "\n"
            out = yield(src,nl)
            check(out != src,"No changes in #{name}")
            check(out.valid_encoding?,"Invalid result UTF-8: #{name}")
            RubyVM::InstructionSequence.compile(out)
            row[2] = Zlib::Deflate.deflate(out.b)
          end

          patch_script(scripts,'버프,물약 이미지 출력') do |src,nl|
            old = '    $Buf_23.bitmap = RPG::Cache.icon("홀리워크버프")'
            add = [old,'    $Buf_23.zoom_x = 32.0 / 38.0','    $Buf_23.zoom_y = 32.0 / 37.0'].join(nl)
            once(src,old,add,'Holy Walk buff 623 zoom')
          end
          patched << '버프,물약 이미지 출력'

          patch_script(scripts,'Game_Event') do |src,nl|
            old = '    @list = @page.list'
            add = [old,
              '    @sl_v126_monster_attack = @trigger == 2 && @list.any? { |cmd| cmd.code == 117 && cmd.parameters[0] == 62 }',
              '    @sl_v126_target_id = nil unless @sl_v126_monster_attack'].join(nl)
            src = once(src,old,add,'Monster existing attack-page check')
            old = '      @list = nil'
            add = [old,'      @sl_v126_monster_attack = false','      @sl_v126_target_id = nil'].join(nl)
            src = once(src,old,add,'Clear attack-page target on empty page')

            anchor = '  def check_event_trigger_touch(x, y)'
            helper = <<~'HELPER'
            def sl_v126_monster_target
              return $game_player unless @sl_v126_monster_attack
              healer = @sl_v126_healer
              if healer.nil? || !$game_map.events[healer.id].equal?(healer)
                healer = $game_map.events.values.find do |event|
                  data = event.instance_variable_get(:@event)
                  data && data.name.to_s.unpack('C*') == '[ID힐러 마법사]'.unpack('C*')
                end
                @sl_v126_healer = healer
              end
              active = $game_switches[185] && healer && !healer.transparent &&
                       !healer.instance_variable_get(:@sl_healer_teleport) &&
                       $game_actors[3] && $game_actors[3].hp > 0
              if @sl_v126_target_id == 3
                return healer if active
                return nil if @starting || lock?
                @sl_v126_target_id = nil
              end
              return $game_player unless active
              return $game_player if @starting || lock?
              player_distance = (@x - $game_player.x).abs + (@y - $game_player.y).abs
              healer_distance = (@x - healer.x).abs + (@y - healer.y).abs
              if healer_distance < player_distance
                @sl_v126_target_id = 3
                return healer
              end
              $game_player
            end
            HELPER
            src = once(src,anchor,helper.lines.map{|line|line.chomp}.join(nl) + nl + '  ' + anchor.strip,'Monster shared target selector')

            old = 'if @trigger == 2 and x == $game_player.x and y == $game_player.y'
            add = 'if @trigger == 2 && (target = sl_v126_monster_target) && x == target.x && y == target.y'
            src = once(src,old,add,'Monster touch target')
            old = 'if @trigger == 2 and @x == $game_player.x and @y == $game_player.y'
            add = 'if @trigger == 2 && (target = sl_v126_monster_target) && @x == target.x && @y == target.y'
            once(src,old,add,'Monster overlap target')
          end
          patched << 'Game_Event'

          patch_script(scripts,'Game_Character 3') do |src,nl|
            a = src.index('  def move_toward_player')
            b = src.index('  def move_away_from_player',a)
            check(a && b, 'Move toward player branch missing')
            pre = src[0...a]
            method = src[a...b]
            tail = src[b..-1]
            old = '    sx = @x - $game_player.x' + nl + '    sy = @y - $game_player.y'
            add = ['    target = self.is_a?(Game_Event) ? sl_v126_monster_target : $game_player',
                   '    return if target.nil?',
                   '    sx = @x - target.x',
                   '    sy = @y - target.y'].join(nl)
            pre + once(method,old,add,'Monster chase target') + tail
          end
          patched << 'Game_Character 3'

          patch_script(scripts,'Interpreter 1') do |src,nl|
            anchor = '  def iterate_actor(parameter)'
            helper = <<~'HELPER'
            def sl_v126_attack_monster
              return nil if @event_id.to_i <= 0 || $game_map.nil? || @map_id != $game_map.map_id
              monster = $game_map.events[@event_id]
              return nil unless monster && monster.instance_variable_get(:@sl_v126_monster_attack)
              return nil unless @depth > 0 || @list.equal?(monster.list)
              monster
            end
            def sl_v126_actor_id(id)
              return id unless id == 1
              monster = sl_v126_attack_monster
              return id unless monster && monster.instance_variable_get(:@sl_v126_target_id) == 3
              healer = monster.instance_variable_get(:@sl_v126_healer)
              return nil unless healer && $game_switches[185] && !healer.transparent &&
                !healer.instance_variable_get(:@sl_healer_teleport) &&
                $game_actors[3] && $game_actors[3].hp > 0
              3
            end
            HELPER
            src = once(src,anchor,helper.lines.map{|line|line.chomp}.join(nl) + nl + '  ' + anchor.strip,'Interpreter attack target')
            old = '  def iterate_actor(parameter)' + nl
            add = [ '  def iterate_actor(parameter)',
                    '    parameter = sl_v126_actor_id(parameter)',
                    '    return if parameter.nil?' ].join(nl) + nl
            once(src,old,add,'Actor iterator target')
          end
          patched << 'Interpreter 1'

          patch_script(scripts,'Interpreter 2') do |src,nl|
            a = src.index('  def get_character(parameter)')
            b = src.index('  def operate_value(',a)
            check(a && b,'Interpreter character access missing')
            old = '      return $game_player'
            add = [ '      monster = sl_v126_attack_monster',
                    '      if monster && monster.instance_variable_get(:@sl_v126_target_id) == 3',
                    '        return nil if sl_v126_actor_id(1).nil?',
                    '        return monster.instance_variable_get(:@sl_v126_healer)',
                    '      end',
                    old ].join(nl)
            src[0...a] + once(src[a...b],old,add,'Interpreter monster graphic target') + src[b..-1]
          end
          patched << 'Interpreter 2'

          patch_script(scripts,'Interpreter 3') do |src,nl|
            old = '      actor = $game_actors[@parameters[1]]'
            add = [ '      actor_id = sl_v126_actor_id(@parameters[1])',
                    '      actor = actor_id ? $game_actors[actor_id] : nil' ].join(nl)
            once(src,old,add,'Actor conditions during attack')
          end
          patched << 'Interpreter 3'

          patch_script(scripts,'Interpreter 4') do |src,nl|
            old = '      actor = $game_actors[@parameters[4]]'
            add = [ '      actor_id = sl_v126_actor_id(@parameters[4])',
                    '      actor = actor_id ? $game_actors[actor_id] : nil' ].join(nl)
            once(src,old,add,'Actor stats during attack')
          end
          patched << 'Interpreter 4'

          check(patched.length == 7 && patched.uniq.length == 7, 'Wrong script patch count')
          File.binwrite(SCRIPTS, Marshal.dump(scripts))

          mapping_path = File.join(KNIGHT,'gameasync/mapping.js')
          mapping = File.binread(mapping_path).force_encoding('UTF-8')
          token = 'Data/Scripts.rxdata?h='
          regex = Regexp.new(Regexp.escape(token) + '[0-9a-f]{32}')
          check(mapping.scan(regex).length == 1, 'Script mapping hash mismatch')
          mapping = mapping.sub(regex,token + Digest::MD5.file(SCRIPTS).hexdigest)
          File.binwrite(mapping_path,mapping)

          html = File.join(KNIGHT,'index.html')
          data = File.binread(html).force_encoding('UTF-8')
          check(data.include?('V1.25') && data.include?('v1.25'),'V1.25 HTML version missing')
          File.binwrite(html,data.gsub('V1.25','V1.26').gsub('v1.25','v1.26'))

          root_html = File.join(ROOT,'index.html')
          data = File.binread(root_html).force_encoding('UTF-8')
          check(data.include?('V1.25'),'V1.25 launcher missing')
          File.binwrite(root_html,data.gsub('V1.25','V1.26'))

          loader = File.join(KNIGHT,'js/sl-assets-v229r115.js')
          data = File.binread(loader).force_encoding('UTF-8')
          check(data.scan("var version='V1.25';").size == 1,'V1.25 loader marker missing')
          File.binwrite(loader,data.sub("var version='V1.25';","var version='V1.26';"))
          puts "PASS: #{patched.length} original scripts edited, no event edits"
          puts 'PASS: 623 upper-right buff 32x32 display only; original icon preserved'
          puts 'PASS: original attack event/CE62 reused with healer target and teleport exclusion'
          RUBY_V126
          ruby -c build/patch_v126.rb
          ruby build/patch_v126.rb site
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Verify V1.26 exact change scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('site')
          before = json.loads(Path('build/before.json').read_text('utf8'))
          after = {
              str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }
          assert set(before) == set(after) and len(after) == 5619, 'Files added or removed'
          changed = {name for name in before if before[name] != after[name]}
          allowed = {
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'knight/index.html',
              'index.html',
          }
          assert changed == allowed, ('Unapproved file modifications', sorted(changed ^ allowed))
          scripts = root/'knight/gameasync/Data/Scripts.rxdata'
          mapping = (root/'knight/gameasync/mapping.js').read_text('utf8')
          token = 'Data/Scripts.rxdata?h='
          assert mapping.count(token + hashlib.md5(scripts.read_bytes()).hexdigest()) == 1
          assert "var version='V1.26';" in (root/'knight/js/sl-assets-v229r115.js').read_text('utf8')
          assert 'SLKnight V1.26' in (root/'knight/index.html').read_text('utf8')
          assert 'bitmap-map.js?v=v1.26' in (root/'knight/index.html').read_text('utf8')
          assert 'V1.26' in (root/'index.html').read_text('utf8')
          pre = 'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          assert pre+'Map043.rxdata' not in after and pre+'Map044.rxdata' not in after
          print('PASS: exactly five allowed files changed, 5619 files retained')
          PY
          ruby - <<'RUBY'
          before = Marshal.load(File.binread('build/Scripts.v125.rxdata'))
          after = Marshal.load(File.binread('site/knight/gameasync/Data/Scripts.rxdata'))
          raise 'Scripts count mismatch' unless before.length == after.length
          changed = []
          before.each_with_index do |prev,i|
            cur = after[i]
            next if prev == cur
            raise 'Script metadata changed' unless prev[0] == cur[0] && prev[1] == cur[1] && prev.size == cur.size
            changed << prev[1].to_s.b
          end
          expected = [
            'Game_Character 3','Game_Event',
            'Interpreter 1','Interpreter 2','Interpreter 3','Interpreter 4',
            '버프,물약 이미지 출력'
          ].map(&:b)
          raise "Unexpected script changes: #{changed.inspect}" unless changed.sort == expected.sort
          puts 'PASS: seven permitted original scripts changed; all other scripts byte-identical'
          RUBY

      - name: Publish V1.26 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
