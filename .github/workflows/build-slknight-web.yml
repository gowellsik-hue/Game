
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R104
# FIX: V229R103 rewrote Map045/Map046 Table values as ordinary Ruby objects.
# Restore RPG Maker's original Marshal user-defined Table encoding (u:Table).
# Keep all R103 source-layer smoke cleanup, 2F W graphics, monster positions,
# performance code, UI, 1F/2F floors, wall passability, and 4-way D-pad unchanged.
# No new graphics processing, no extra map events, no gameplay code patches.
name: build-slknight-web.yml | V229R104 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R104 Restore deployed R103 including source-clean dungeon art
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40446050339
          name: github-pages
          github-token: ${{ github.token }}
          path: r103

      - name: V229R104 Verify baseline and repair only two native map Tables
        shell: bash
        run: |
          set -euo pipefail
          test -s r103/artifact.tar
          mkdir -p site build
          tar -xf r103/artifact.tar -C site
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert len(files)==5517,('Wrong R103 baseline file count',len(files))
          assert files['knight/gameasync/Data/Scripts.rxdata']==\
            '5444d9f3994324ef114c4c4330221b6671fcab9a7af3cbc5df575a3f9accd109'
          assert files['knight/js/dpad.js']==\
            '2bd401adf130339d154ce6a8efd0127cefd9b1bc58bc60d1de68e8b6d8b7a791'
          for n in ('index.html','knight/index.html'):
            assert 'V229R103' in (root/n).read_text('utf-8'),n

          pano=root/'knight/gameasync/Graphics/Panoramas'
          assert len(list(pano.glob('SLTI_46_C*_*.png')))==66
          assert len(list(pano.glob('SLTI_46_W_C*_*.png')))==28
          Path('build/before.json').write_text(json.dumps(files,sort_keys=True))
          print('PASS exact R103 game and 2F floor/wall graphics restored')
          PY_BASE

          cat > build/repair-table.rb <<'RB_FIX'
          require 'digest'
          module RPG
            class Map; end; class MapInfo; end; class AudioFile; end
            class Tileset; end
            class Event
              class Page
                class Condition; end; class Graphic; end
              end
            end
            class EventCommand; end; class MoveRoute; end; class MoveCommand; end
          end
          # R103 had _load only. Without _dump it encoded the Table as o:Table.
          # RPG Maker expects a user-defined Table with its original raw data.
          class Table
            def self._load(bytes)
              result=allocate
              result.instance_variable_set(:@raw,bytes)
              result
            end
            def _dump(depth=0)
              @raw
            end
          end

          base='site/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap'
          old_hash={
            45=>'dfa393a1a39da3f147e480836b12eb85d3c76644e7a2b0880edce84d531cce64',
            46=>'e944fc52437afed515018bfdca76f5411cfd2e3af563f8a8f47ba1af7a42357c'
          }
          original_table_hash={
            45=>'1ee818d246aed62838744cd54b06c56792d5ba4dc5de1ef82eaa2ff01a3fd74c',
            46=>'8cd370e5bfc6e9dc483f5e35a03c6f9abac89539a35f8f8d06697771e827606c'
          }
          expected_events={45=>35,46=>34}
          [45,46].each do |mid|
            file=sprintf('%s%03d.rxdata',base,mid)
            bytes=File.binread(file)
            raise "Wrong R103 map #{mid}" unless Digest::SHA256.hexdigest(bytes)==old_hash.fetch(mid)
            raise "Missing original broken Table #{mid}" unless bytes.scan("o:\nTable").length==1
            raise "Unexpected preexisting Table #{mid}" if bytes.include?("u:\nTable")

            map=Marshal.load(bytes)
            grid=map.instance_variable_get(:@data)
            raise 'Not an RPG Table' unless grid.instance_of?(Table)
            payload=grid.instance_variable_get(:@raw)
            raise "R103 S32 grid was altered #{mid}" unless
              Digest::SHA256.hexdigest(payload)==original_table_hash.fetch(mid)
            events=map.instance_variable_get(:@events)
            raise "R103 events missing #{mid}" unless events.size==expected_events.fetch(mid)
            event_digest=Digest::SHA256.hexdigest(Marshal.dump(events))

            repaired=Marshal.dump(map)
            raise "Native Table not restored #{mid}" unless
              repaired.scan("u:\nTable").length==1 && !repaired.include?("o:\nTable")
            check=Marshal.load(repaired)
            raise "Event pages or coordinates changed #{mid}" unless
              Digest::SHA256.hexdigest(Marshal.dump(check.instance_variable_get(:@events)))==event_digest
            raise "Collision table bytes changed #{mid}" unless
              check.instance_variable_get(:@data).instance_variable_get(:@raw)==payload
            raise "Map geometry changed #{mid}" unless
              check.instance_variable_get(:@width)==map.instance_variable_get(:@width) &&
              check.instance_variable_get(:@height)==map.instance_variable_get(:@height)
            File.binwrite(file,repaired)
            puts "PASS Map#{mid}: o:Table -> u:Table; #{events.size} events and original S32 grid intact"
          end
          RB_FIX
          ruby -c build/repair-table.rb
          ruby build/repair-table.rb

      - name: V229R104 Refresh only two map cache entries and version labels
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CACHE'
          from pathlib import Path
          import hashlib,re
          root=Path('site')
          assets=root/'knight/gameasync'
          mapping=assets/'mapping.js'
          code=mapping.read_text('utf-8')
          for mid in (45,46):
            name=f'Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap{mid:03d}.rxdata'
            digest=hashlib.md5((assets/name).read_bytes()).hexdigest()
            pattern=rf'({re.escape(name)}\?h=)[0-9a-f]{{32}}'
            code,count=re.subn(pattern,lambda m:m.group(1)+digest,code)
            assert count==1,('Missing native map cache entry',name,count)
          mapping.write_text(code,encoding='utf-8')
          for name in ('index.html','knight/index.html'):
            path=root/name
            html=path.read_text('utf-8')
            assert 'V229R103' in html and 'V229R104' not in html,name
            path.write_text(html.replace('V229R103','V229R104')
                                .replace('v229r103','v229r104'),encoding='utf-8')
          print('PASS native map caches and R104 labels refreshed')
          PY_CACHE
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/dpad.js

      - name: V229R104 Audit exact change set and native Table round trip
        shell: bash
        run: |
          set -euo pipefail
          ruby - <<'RB_TABLE_CHECK'
          module RPG
            class Map; end; class MapInfo; end; class AudioFile; end
            class Tileset; end
            class Event
              class Page
                class Condition; end; class Graphic; end
              end
            end
            class EventCommand; end; class MoveRoute; end; class MoveCommand; end
          end
          class Table
            def self._load(bytes)
              result=allocate
              result.instance_variable_set(:@raw,bytes)
              result
            end
            def _dump(depth=0); @raw; end
          end
          [45,46].each do |mid|
            file=sprintf('site/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap%03d.rxdata',mid)
            raw=File.binread(file)
            raise 'Table is not native user-defined type' unless
              raw.scan("u:\nTable").size==1 && raw.scan("o:\nTable").empty?
            map=Marshal.load(raw)
            raise 'Table not recoverable' unless map.instance_variable_get(:@data).is_a?(Table)
            raise 'RPG map round trip unstable' unless Marshal.dump(map)==raw
            puts "PASS fresh Map#{mid} load and native Table marshal round trip"
          end
          RB_TABLE_CHECK
          python3 - <<'PY_DIFF'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before=json.loads(Path('build/before.json').read_text('utf-8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert len(after)==len(before)==5517 and after.keys()==before.keys()
          changed={name for name in before if before[name]!=after[name]}
          expected={'index.html','knight/index.html','knight/gameasync/mapping.js'}
          expected|={f'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap{mid:03d}.rxdata'
                    for mid in (45,46)}
          assert changed==expected,('Unexpected changes',changed^expected)
          print('PASS exactly 2 native map files, 1 cache, 2 HTML labels changed')
          print('PASS scripts, 1F/2F C and W images, monsters, 4-way D-pad all unchanged')
          PY_DIFF

      - name: V229R104 Publish fixed native Tables and preserved R103 game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
