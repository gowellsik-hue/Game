          ce68_list.concat(if_script(0,'$game_variables[121].to_i >= 3',[cmd(121,1,[998,998,1])]))
          ce68_list<<cmd(0,0,[])
          setiv(ce68,:list,ce68_list)
          setiv(ce68,:trigger,2)
          setiv(ce68,:switch_id,998)
          current[68]=ce68

