
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R126
# BASE: the deployed R121 (same clean 2F images as R125).
# 1F: restore source S32 player movement at the existing (+12,+6) projection.
# 2F and monsters: native RPG movement; remove costly 81-cell passability scan.
# RETAIN: 450 original corner masks + both approved R125 openings, all 8 gates.
# PROTECT: original 2F stain cleanup, terrain, wall graphics, doors, monsters,
# assets, inventory, combat, respawns and controls. No map or image edits.
name: build-slknight-web.yml | V229R126 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R126 Restore exact clean 2F R121 deployment
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40641411815
          name: github-pages
          github-token: ${{ github.token }}
          path: original

      - name: V229R126 Verify game source and protect original images
        shell: bash
        run: |
          set -euo pipefail
          test -s original/artifact.tar
          mkdir -p site build
          tar -xf original/artifact.tar -C site
          python3 - <<'CHECK'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          assert len(before)==5566,len(before)
          expected={
            'knight/gameasync/Data/Scripts.rxdata':
              '51bbd2b04e5a8e51a7ab95838ba3f7669009ffc1f66c1695c74ed35c6344e7ee',
            'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap045.rxdata':
              'f47de87af6b4e607bf632818a711619dc8ca4e747196a123a76ac7db8ffc3ba6',
            'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap046.rxdata':
              'dc89d908f5247442e08dddc11f5bcf6505a77890bd82ab59b790e00e3e5f024c'
          }
          for p,sha in expected.items():
            assert before.get(p)==sha,('Wrong source, refusing map edit',p)
          assert 'V229R121' in (root/'knight/index.html').read_text('utf8')
          Path('build/before.json').write_text(json.dumps(before,sort_keys=True))
          print('PASS original 5,566 files, including clean 2F art')
          CHECK

      - name: V229R126 Restore fast native 1F player without extra map patches
        shell: bash
        run: |
          set -euo pipefail
          cat > build/patch.rb <<'PATCH'
          require 'zlib'

          source = ARGV.fetch(0)
          destination = ARGV.fetch(1)
          archive = Marshal.load(File.binread(source))
          raise 'Wrong game script count' unless archive.length == 136
          original_entries = Marshal.load(File.binread(source))
          old = Zlib::Inflate.inflate(archive[134][2])
          raise 'Wrong R121 native source' unless old.include?("module SLTI_Native66\n") && old.include?("module SLTI_V229R97Corner\n")
          raise 'Unexpected actor mover' if old.include?('slti_native66_prepare') || old.include?('SLTI_R125TwoOpen')

          # Approved R125 adjustments. Keep all original 450 other S32 corner records.
          pattern = /data='([^']+)'\.unpack\('m'\)\[0\]\.unpack\('C\*'\)/
          found = old.scan(pattern)
          raise 'Wrong S32 corner table' unless found.length == 1
          encoded = found[0][0]
          data = encoded.unpack('m')[0].unpack('C*')
          raise 'Wrong S32 corner count' unless data.length == 452*3
          changes = {[32657,32805]=>11, [32657,32807]=>7}
          seen = []
          (0...data.length).step(3) do |i|
            xy = [32576+data[i], 32704+data[i+1]]
            next unless changes.key?(xy)
            raise "Incorrect source mask #{xy.inspect}" unless data[i+2]==3
            data[i+2]=changes[xy]
            seen << xy
          end
          raise 'Corner locations missing' unless seen.sort==changes.keys.sort
          replacement = "data='#{[data.pack('C*')].pack('m0')}'.unpack('m')[0].unpack('C*')"
          updated=old.sub(pattern,replacement)

          # Delete the obsolete 81-cell search in every RPG map passability query.
          slow = <<'OLD_PASSABILITY'
          class Game_Map
            alias slti_native66_original_passable passable?
            def passable?(x,y,d,self_event=nil)
              if SLTI_Native66.active_map?(@map_id) && (d==2 || d==4 || d==6 || d==8)
                cell=SLTI_Native66.nearest(@map_id,x,y,16)
                return false if cell==nil
                return SLTI_Native66.native_target(@map_id,cell[0],cell[1],d)!=nil
              end
              slti_native66_original_passable(x,y,d,self_event)
            end
          end
          OLD_PASSABILITY
          raise 'Slow map passability section not unique' unless updated.scan(slow).size == 1
          updated=updated.sub(slow,'')

          runtime = <<'RUNTIME'

          # V229R126: keep original 2F and monster movement, use exact S32 for the 1F hero.
          # R125 gates are additive and reciprocal. No runtime path scan or wall slide.
          module SLTI_R126Gates
            WIDTH=288
            EDGES={
              78*WIDTH+89=>2,
              79*WIDTH+87=>8,
              79*WIDTH+88=>12,
              79*WIDTH+89=>7,
              80*WIDTH+89=>9,
              80*WIDTH+90=>14,
              80*WIDTH+91=>12,
              80*WIDTH+92=>4,
              81*WIDTH+90=>1
            }.freeze
            def self.open?(map,x,y,d)
              return false unless map==45 && x>=0 && x<288 && y>=0 && y<144
              bit=(d==8 ? 1 : d==2 ? 2 : d==4 ? 4 : d==6 ? 8 : 0)
              return bit!=0 && (EDGES.fetch(y*WIDTH+x,0)&bit)!=0
            end
          end
          module SLTI_V229R44
            class << self
              alias slti_r126_standard_allowed allowed?
              def allowed?(map,x,y,d)
                return true if SLTI_R126Gates.open?(map,x,y,d)
                slti_r126_standard_allowed(map,x,y,d)
              end
            end
          end

          module SLTI_Native66
            def self.real(mid,x,y)
              px,py=project(mid,x,y)
              return [px*8-64,py*8-128]
            end
            def self.to_rgss(mid,x,y)
              px,py=project(mid,x,y)
              return [px/16,py/16]
            end
          end

          # Player-only 1F native steps. Standard RPG movement on 2F and all other maps.
          # No Game_Character overrides: monsters retain normal RGSS movement/AI.
          class Game_Player
            alias slti_r126_old_moveto moveto
            alias slti_r126_old_moving moving?
            alias slti_r126_old_update_move update_move
            alias slti_r126_old_down move_down
            alias slti_r126_old_left move_left
            alias slti_r126_old_right move_right
            alias slti_r126_old_up move_up
            alias slti_r126_old_passable passable?

            def slti_r126_prepare
              return false if $game_map==nil || $game_map.map_id!=45
              if @slti_r126_map!=45 || @slti_r126_x==nil
                point=SLTI_Native66.nearest(45,@x,@y,16)
                return false if point==nil
                @slti_r126_map=45
                @slti_r126_x,@slti_r126_y=point
                @slti_r126_tx,@slti_r126_ty=SLTI_Native66.real(45,point[0],point[1])
                @real_x=@slti_r126_tx
                @real_y=@slti_r126_ty
              end
              return true
            end

            def moveto(x,y)
              @slti_r126_map=nil
              @slti_r126_x=nil
              slti_r126_old_moveto(x,y)
              slti_r126_prepare
            end

            def moving?
              if slti_r126_prepare
                return @real_x!=@slti_r126_tx || @real_y!=@slti_r126_ty
              end
              slti_r126_old_moving
            end

            def update_move
              return slti_r126_old_update_move unless slti_r126_prepare
              speed=2**@move_speed
              @real_x=[@real_x+speed,@slti_r126_tx].min if @real_x<@slti_r126_tx
              @real_x=[@real_x-speed,@slti_r126_tx].max if @real_x>@slti_r126_tx
              @real_y=[@real_y+speed,@slti_r126_ty].min if @real_y<@slti_r126_ty
              @real_y=[@real_y-speed,@slti_r126_ty].max if @real_y>@slti_r126_ty
              if @walk_anime
                @anime_count+=1.5
              elsif @step_anime
                @anime_count+=1
              end
            end

            def passable?(x,y,d)
              return slti_r126_old_passable(x,y,d) unless slti_r126_prepare
              return false unless d==2 || d==4 || d==6 || d==8
              return SLTI_Native66.native_target(45,@slti_r126_x,@slti_r126_y,d)!=nil
            end

            def slti_r126_step(d)
              target=SLTI_Native66.native_target(45,@slti_r126_x,@slti_r126_y,d)
              return false if target==nil
              x,y=SLTI_Native66.to_rgss(45,target[0],target[1])
              return false unless $game_map.valid?(x,y)
              unless @through
                $game_map.events.each_value do |event|
                  next if event==self || event.through || event.character_name==''
                  return false if event.x==x && event.y==y
                end
              end
              @slti_r126_x,@slti_r126_y=target
              @slti_r126_tx,@slti_r126_ty=SLTI_Native66.real(45,target[0],target[1])
              @x=x
              @y=y
              increase_steps
              return true
            end

            def move_down(turn_enabled=true)
              return slti_r126_old_down(turn_enabled) unless slti_r126_prepare
              turn_down if turn_enabled
              check_event_trigger_touch(@x,@y+1) unless slti_r126_step(2)
            end
            def move_left(turn_enabled=true)
              return slti_r126_old_left(turn_enabled) unless slti_r126_prepare
              turn_left if turn_enabled
              check_event_trigger_touch(@x-1,@y) unless slti_r126_step(4)
            end
            def move_right(turn_enabled=true)
              return slti_r126_old_right(turn_enabled) unless slti_r126_prepare
              turn_right if turn_enabled
              check_event_trigger_touch(@x+1,@y) unless slti_r126_step(6)
            end
            def move_up(turn_enabled=true)
              return slti_r126_old_up(turn_enabled) unless slti_r126_prepare
              turn_up if turn_enabled
              check_event_trigger_touch(@x,@y-1) unless slti_r126_step(8)
            end
          end
          RUNTIME

          updated << runtime
          raise 'R126 patch invalid' unless updated.include?("class Game_Player\n") && !updated.include?(slow)
          archive[134][2]=Zlib::Deflate.deflate(updated.b)
          archive.each_with_index do |row,i|
            next if i==134
            raise "Unapproved script changed #{i}" unless row==original_entries[i]
          end
          File.binwrite(destination,Marshal.dump(archive))
          puts 'PASS: two additive S32 masks, no full map edits, no slow Game_Map nearest, 1F native player, 2F default movement'
          PATCH
          ruby -c build/patch.rb
          cp site/knight/gameasync/Data/Scripts.rxdata build/original-scripts.rxdata
          ruby build/patch.rb build/original-scripts.rxdata \
            site/knight/gameasync/Data/Scripts.rxdata
          ruby -rzlib -e 'a=Marshal.load(File.binread(ARGV[0]));print Zlib::Inflate.inflate(a[134][2])' \
            site/knight/gameasync/Data/Scripts.rxdata > build/script134-r126.rb
          ruby -c build/script134-r126.rb

      - name: V229R126 Test real actor path and 2F reachability
        shell: bash
        run: |
          set -euo pipefail
          cat > build/test.rb <<'TEST'
          require 'zlib'
          source=ARGV.fetch(0)
          archive=Marshal.load(File.binread(source))
          raise 'Wrong script count' unless archive.length==136
          s=lambda{|i|Zlib::Inflate.inflate(archive[i][2])}
          Object.class_eval(s.call(21))
          [23,24,25,27].each{|i|Object.class_eval(s.call(i))}
          class Game_Event < Game_Character; end
          class Game_Character;def check_event_trigger_touch(*args);end;end

          actor=s.call(134)
          segment=lambda do |start,finish|
            a=actor.index(start)
            b=a && actor.index(finish,a)
            raise "Missing movement code #{start}" unless a && b
            actor[a...b]
          end
          Object.class_eval(segment.call("module SLTI_Native66\n","\n# Replace the old R42/R44 graph"))
          Object.class_eval(segment.call("module SLTI_V229R97Corner\n","\n# V229R84:"))
          i=actor.index("# V229R84:")
          a=actor.index("module SLTI_Native66\n",i)
          b=actor.index("\n# V229R111:",a)
          Object.class_eval(actor[a...b])
          Object.class_eval(actor[actor.index("\n# V229R126:")..-1])

          raise '1F projection changed' unless SLTI_Native66.project(45,32655,32806)==[1416,1290]
          raise '2F projection changed' unless SLTI_Native66.project(46,32655,32806)==[1416,1674]
          raise 'S32 corners changed outside approval' unless SLTI_V229R97Corner::MASKS.length==452
          raise 'Wrong first corner' unless SLTI_V229R97Corner::MASKS[[32657,32805]]==11
          raise 'Wrong second corner' unless SLTI_V229R97Corner::MASKS[[32657,32807]]==7
          raise 'Per-move 81-cell scan still active' if actor.include?('cell=SLTI_Native66.nearest(@map_id,x,y,16)')

          # The 8 reciprocal RPG gate edges approved in R125 stay open.
          [[89,78,2],[89,79,8],[89,79,2],[89,80,8],
           [89,80,6],[90,80,4],[90,80,6],[91,80,4],
           [91,80,6],[92,80,4],[87,79,6],[88,79,4],
           [88,79,6],[89,79,4],[90,80,2],[90,81,8]].each do |x,y,d|
            raise "R125 gate lost #{[x,y,d]}" unless SLTI_V229R44.allowed?(45,x,y,d)
          end

          # Native graph: starting player -> requested coordinates -> 2F trigger.
          def native_path(start,goal)
            queue=[start];seen={start=>true};parent={};i=0
            while i<queue.length
              xy=queue[i];i+=1;break if xy==goal
              [2,4,6,8].each do |d|
                nxt=SLTI_Native66.native_target(45,xy[0],xy[1],d)
                next if nxt==nil || seen[nxt]
                seen[nxt]=true;parent[nxt]=[xy,d];queue<<nxt
              end
            end
            raise "Native passage disconnected at #{goal}" unless seen[goal]
            route=[];p=goal
            until p==start
              prev,dir=parent.fetch(p)
              route<<dir;p=prev
            end
            return route.reverse
          end

          class AuditMap < Game_Map
            attr_accessor :display_x,:display_y
            def initialize(mid)
              @map_id=mid
              @map=Struct.new(:width,:height).new(mid==45 ? 288 : 336,mid==45 ? 144 : 168)
              @events={}
              @passages=Array.new(999,0)
              @priorities=Array.new(999,0)
              @display_x=0;@display_y=0
            end
            def encounter_step;30;end
            def valid?(x,y);x>=0 && y>=0 && x<width && y<height;end
          end
          class AuditParty
            attr_reader :steps
            def initialize;@steps=0;end
            def increase_steps;@steps+=1;end
            def check_map_slip_damage;end
          end
          $game_party=AuditParty.new
          $game_map=AuditMap.new(45)
          $game_player=Game_Player.new
          $game_player.moveto(92,74)
          start=[$game_player.instance_variable_get(:@slti_r126_x),$game_player.instance_variable_get(:@slti_r126_y)]
          raise 'Wrong 1F start' unless start==[32665,32801]
          move={2=>:move_down,4=>:move_left,6=>:move_right,8=>:move_up}

          [[32699,32795],SLTI_Native66.nearest(45,153,72,16)].each do |goal|
            $game_player.moveto(92,74)
            route=native_path(start,goal)
            route.each do |d|
              $game_player.send(move[d])
              25.times{break unless $game_player.moving?;$game_player.update_move}
              raise 'Actor stalled in a wall' if $game_player.moving?
            end
            actual=[$game_player.instance_variable_get(:@slti_r126_x),$game_player.instance_variable_get(:@slti_r126_y)]
            raise "Actual player path failed #{goal}" unless actual==goal
            puts "PASS actual 1F player movement to #{goal.inspect} via #{route.length} steps"
          end
          raise '2F event not triggered at 153,72' unless
            ($game_player.x-153.0)**2+($game_player.y-72.375)**2<=9.0

          # On 2F, skip S32 actor mode and use standard RPG movement/monster collision.
          $game_map=AuditMap.new(46)
          $game_player.moveto(76,94)
          raise 'Unexpected 2F native override' if $game_player.slti_r126_prepare
          raise '2F camera coordinates changed' unless $game_player.instance_variable_get(:@real_x)==76*128
          q=[[76,94]];seen={[76,94]=>true};head=0
          while head<q.length
            x,y=q[head];head+=1
            [[2,0,1],[4,-1,0],[6,1,0],[8,0,-1]].each do |d,dx,dy|
              nxt=[x+dx,y+dy]
              next if seen[nxt] || !$game_map.valid?(*nxt)
              next unless $game_player.passable?(x,y,d)
              seen[nxt]=true;q<<nxt
            end
          end
          raise "2F standard path shrank to #{seen.length}" unless seen.length==6807
          raise '2F Baphomet not reachable' unless seen[[156,100]]
          puts 'PASS 2F original RPG movement, 6,807 connected tiles, Baphomet reachable'
          TEST
          ruby -c build/test.rb
          ruby build/test.rb site/knight/gameasync/Data/Scripts.rxdata

      - name: V229R126 Refresh only game script cache and protect 2F graphics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'FILES'
          from pathlib import Path
          import hashlib,json,re
          root=Path('site')
          scripts=root/'knight/gameasync/Data/Scripts.rxdata'
          mapping=root/'knight/gameasync/mapping.js'
          text=mapping.read_text('utf8')
          text,count=re.subn(r'(Data/Scripts\.rxdata\?h=)[0-9a-f]{32}',
              lambda m:m.group(1)+hashlib.md5(scripts.read_bytes()).hexdigest(),text)
          assert count==1,('Script cache entry missing',count)
          mapping.write_text(text,encoding='utf8')

          for name in ('index.html','knight/index.html'):
            path=root/name
            html=path.read_text('utf8')
            assert 'V229R121' in html and 'V229R126' not in html
            path.write_text(html.replace('V229R121','V229R126')
              .replace('v229r121','v229r126'),encoding='utf8')

          runtime=root/'knight/js/sl-assets-v229r115.js'
          code=runtime.read_text('utf8')
          assert code.count("var version='V229R121';")==1
          runtime.write_text(code.replace("var version='V229R121';",
              "var version='V229R126';"),encoding='utf8')

          before=json.loads(Path('build/before.json').read_text('utf8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          assert len(before)==len(after)==5566 and before.keys()==after.keys()
          changed={p for p in before if before[p]!=after[p]}
          expected={'index.html','knight/index.html',
            'knight/gameasync/mapping.js',
            'knight/gameasync/Data/Scripts.rxdata',
            'knight/js/sl-assets-v229r115.js'}
          assert changed==expected,('Unexpected file changes',sorted(changed^expected))
          for p in before:
            protected=(p.startswith('knight/assets/') or
              p.startswith('knight/gameasync/Graphics/') or
              p.startswith('knight/gameasync/Data/') and
                not p.endswith('/Scripts.rxdata') or
              p in ('knight/js/dpad.js','knight/js/drive.js'))
            if protected:
              assert before[p]==after[p],('Graphics/map/content changed',p)
          assert 'js/sl-assets-v229r115.js?v=v229r126' in \
            (root/'knight/index.html').read_text('utf8')
          print('PASS no 1F/2F terrain, stain, wall, monster, event, or D-pad changes')
          print('PASS only 5 version, script, and cache files changed')
          FILES
          node --check site/knight/js/dpad.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/gameasync/mapping.js

      - name: V229R126 Publish only verified game code
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
