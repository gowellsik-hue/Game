            t.gsub!(/\s*if \$game_switches\[49\] == false\r?\n\s*Input\.update\s*\r?\n\s*end\r?\n/,"     Input.update\n"); t.gsub!('if Keyboard.testkey(9) &&','if (Keyboard.testkey(9) || Input.trigger?(Input::Y)) &&'); t.gsub!('&& Keyboard.testkey(69) &&','&& (Keyboard.testkey(69) || Input.trigger?(Input::X)) &&'); put(map,t)
