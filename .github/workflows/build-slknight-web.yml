name: build-slknight-web.yml | V4.10 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Restore V4.9 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45925114157
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify V4.9 baseline
        shell: bash
        run: |
          set -euo pipefail

          test -s baseline/artifact.tar
          mkdir -p site
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib,json,re

          root=Path('site')
          game=root/'knight/gameasync'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          before={
              str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          assert len(before)==6033,len(before)

          loader=root/'knight/js/sl-assets-v229r115.js'

          assert loader.read_bytes().count(
              b"var version='V4.9';"
          )==1

          mapping=(game/'mapping.js').read_bytes()
          md5={}

          for mid in (29,47,48,49,50):
              name=pre+f'Map{mid:03d}.rxdata'
              p=game/'Data'/name

              digest=hashlib.md5(p.read_bytes()).hexdigest()

              marker=('Data/'+name+'?h=').encode('ascii')

              assert re.findall(
                  re.escape(marker)+rb'[0-9a-f]{32}',
                  mapping
              )==[marker+digest.encode('ascii')],name

              md5[name]=digest

          Path('/tmp/sl410-before.json').write_text(
              json.dumps(before,sort_keys=True),'utf8'
          )

          Path('/tmp/sl410-md5.json').write_text(
              json.dumps(md5,sort_keys=True),'utf8'
          )

          print('PASS V4.9 baseline',len(before))
          print('PASS original five map mappings')
          PYTHON

      - name: Clone existing recruiter into town centers
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl410-recruiters.rb <<'RUBY'
          # encoding: UTF-8
          require 'json'

          module RPG
            %w[
              Map MapInfo Event EventCommand MoveRoute
              MoveCommand AudioFile CommonEvent Tileset
            ].each{|n|const_set(n,Class.new)}

            Event.const_set(:Page,Class.new)
            Event::Page.const_set(:Condition,Class.new)
            Event::Page.const_set(:Graphic,Class.new)
          end

          %w[Table Tone Color].each do |name|
            Object.const_set(name,Class.new do
              def self._load(raw)
                o=allocate
                o.instance_variable_set(:@raw,raw)
                o
              end

              def _dump(depth)
                @raw
              end
            end)
          end

          class Table
            def get(x,y=0,z=0)
              w,h,d=@raw.unpack('V5')[1,3]

              return nil unless
                x.between?(0,w-1) &&
                y.between?(0,h-1) &&
                z.between?(0,d-1)

              @cells ||= @raw.byteslice(20..-1).unpack('v*')

              @cells[x+y*w+z*w*h]
            end
          end

          def iv(o,k)
            o.instance_variable_get(k)
          end

          def utf(s)
            s.to_s.dup.force_encoding('UTF-8')
          end

          def check(ok,msg)
            raise msg unless ok
          end

          def lists(m)
            iv(m,:@events).values.flat_map do |e|
              iv(e,:@pages).map{|p|iv(p,:@list)}
            end
          end

          def passable(m,tiles,x,y,d)
            return false unless
              x.between?(0,iv(m,:@width)-1) &&
              y.between?(0,iv(m,:@height)-1)

            ts=tiles.fetch(iv(m,:@tileset_id))
            bit=(1<<(d/2-1))&15

            [2,1,0].each do |z|
              id=iv(m,:@data).get(x,y,z)

              return false if id.nil?

              p=iv(ts,:@passages).get(id)
              q=iv(ts,:@priorities).get(id)

              return false if
                p.nil? ||
                q.nil? ||
                (p&bit)!=0 ||
                (p&15)==15

              return true if q==0
            end

            true
          end

          root=ARGV.fetch(0)
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          path=->(n){File.join(root,pre+n+'.rxdata')}
          read=->(n){Marshal.load(File.binread(path.call(n)))}

          files=Dir.glob(
            path.call('Map[0-9][0-9][0-9]')
          ).sort

          check(files.size==46,'Map count')

          maps=files.to_h do |f|
            [
              f[/Map(\d+)\.rxdata$/,1].to_i,
              Marshal.load(File.binread(f))
            ]
          end

          ce=read.call('CommonEvents')
          tiles=read.call('Tilesets')
          stats=read.call('MonsterStats')

          recruiters=maps.flat_map do |mid,m|
            iv(m,:@events).filter_map do |id,e|
              [mid,id] if utf(iv(e,:@name))=='[ID고용사]'
            end
          end

          check(
            recruiters==[[47,14]],
            'Existing recruiter count'
          )

          source=iv(maps.fetch(47),:@events).fetch(14)

          check(
            [iv(source,:@x),iv(source,:@y)]==[370,138],
            'Talking Island location'
          )

          pages=iv(source,:@pages)

          check(pages.size==2,'Source pages')

          hire=0

          pages.each do |p|
            check(
              iv(p,:@trigger)==0 &&
              !iv(iv(p,:@condition),:@self_switch_valid),
              'Local page state'
            )

            iv(p,:@list).each do |c|
              code=iv(c,:@code)
              q=iv(c,:@parameters)

              check(
                ![117,123,201,202,209,210,214].include?(code),
                "Local command #{code}"
              )

              s=code==355 ? q[0] :
                code==111 && q[0]==12 ? q[1] : nil

              next unless s.is_a?(String)

              s=utf(s)

              check(
                !s.match?(/@event_id|\$game_self_switches|\$game_map\.events|\$game_map\.map_id|\bMap0?47\b/),
                'Map-specific script'
              )

              hire+=1 if
                s.include?('$game_party.gain_weapon(w,1)')
            end
          end

          check(hire==16,'V4.8 equipment grant count')

          reserved=Hash.new{|h,k|h[k]=[]}

          all_lists=
            maps.values.flat_map{|m|lists(m)}+
            ce.compact.map{|e|iv(e,:@list)}

          all_lists.each do |l|
            l.each do |c|
              q=iv(c,:@parameters)

              if iv(c,:@code)==201 && q[0]==0
                reserved[q[1]]<<q[2,2]
              end
            end
          end

          placements={
            29=>[
              [49,72,48]
            ],
            48=>[
              [7,367,383],
              [8,744,546],
              [9,1212,450]
            ],
            49=>[
              [7,445,562],
              [8,595,410],
              [9,1204,221]
            ],
            50=>[
              [7,238,147]
            ]
          }

          check(
            placements.values.sum(&:size)==8,
            'Placement count'
          )

          changed=[]

          placements.each do |mid,rows|
            m=maps.fetch(mid)
            ev=iv(m,:@events)

            before=ev.transform_values{|e|Marshal.dump(e)}

            fields=m.instance_variables.reject do |k|
              k==:@events
            end.to_h do |k|
              [k,Marshal.dump(iv(m,k))]
            end

            ids=rows.map(&:first)

            lists(m).each do |l|
              l.each do |c|
                code=iv(c,:@code)
                q=iv(c,:@parameters)

                ref=code==111 && q[0]==6 ? q[1] :
                  [202,203,207,209,212,213].include?(code) ?
                  q[0] : nil

                check(
                  !ids.include?(ref),
                  "Existing event reference #{mid}:#{ref}"
                )
              end
            end

            rows.each do |id,x,y|

              check(
                !ev.key?(id) &&
                !stats.key?([mid,id]),
                "ID collision #{mid}:#{id}"
              )

              occupied=ev.values.map do |e|
                [iv(e,:@x),iv(e,:@y)]
              end

              check(
                !occupied.include?([x,y]) &&
                !reserved[mid].include?([x,y]),
                "Position collision #{mid}:#{x},#{y}"
              )

              directions=[
                [0,1,2],
                [-1,0,4],
                [1,0,6],
                [0,-1,8]
              ]

              directions.each do |dx,dy,d|
                check(
                  passable(m,tiles,x,y,d) &&
                  passable(m,tiles,x+dx,y+dy,10-d) &&
                  !occupied.include?([x+dx,y+dy]),
                  "Approach blocked #{mid}:#{x},#{y},#{d}"
                )
              end

              clone=Marshal.load(Marshal.dump(source))

              clone.instance_variable_set(:@id,id)
              clone.instance_variable_set(:@x,x)
              clone.instance_variable_set(:@y,y)

              ev[id]=clone

              puts "PASS Map#{mid} EV#{id} at #{x},#{y}"
            end

            target=path.call(format('Map%03d',mid))
            raw=Marshal.dump(m)

            File.binwrite(target,raw)

            m=Marshal.load(File.binread(target))
            out=iv(m,:@events)

            check(Marshal.dump(m)==raw,'Marshal roundtrip')

            check(
              out.keys.sort==(before.keys+ids).sort,
              'Event list changed'
            )

            check(
              before.all?{|id,bytes|
                Marshal.dump(out.fetch(id))==bytes
              },
              'Existing events changed'
            )

            check(
              fields.all?{|k,bytes|
                Marshal.dump(iv(m,k))==bytes
              },
              'Terrain or map fields changed'
            )

            rows.each do |id,x,y|
              e=out.fetch(id)

              check(
                [iv(e,:@id),iv(e,:@x),iv(e,:@y)]==[id,x,y],
                'Clone coordinates'
              )

              check(
                e.instance_variables.reject{|k|
                  [:@id,:@x,:@y].include?(k)
                }.all?{|k|
                  Marshal.dump(iv(e,k))==
                  Marshal.dump(iv(source,k))
                },
                'Clone differs'
              )
            end

            changed<<File.basename(target)
          end

          check(changed.size==4,'Changed map count')

          File.write(
            '/tmp/sl410-changed.json',
            JSON.generate(changed.sort)
          )

          puts 'PASS eight new recruiters, nine total'
          puts 'PASS original recruiter pages preserved'
          puts 'PASS all 16 initial equipment grant routes preserved'
          puts 'PASS all existing events and terrain preserved'
          RUBY

          ruby -c /tmp/sl410-recruiters.rb

          ruby /tmp/sl410-recruiters.rb site/knight/gameasync/Data

      - name: Update map mappings and V4.10 version
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib,json,re

          root=Path('site')
          game=root/'knight/gameasync'

          names=json.loads(
              Path('/tmp/sl410-changed.json').read_text('utf8')
          )

          old=json.loads(
              Path('/tmp/sl410-md5.json').read_text('utf8')
          )

          assert len(names)==4
          assert len(set(names))==4

          mapper=game/'mapping.js'
          s=mapper.read_bytes()

          for name in names:
              assert name in old,name

              p=game/'Data'/name

              marker=('Data/'+name+'?h=').encode('ascii')

              pattern=re.escape(marker)+rb'[0-9a-f]{32}'

              original=marker+old[name].encode('ascii')

              assert re.findall(pattern,s)==[original],name

              digest=hashlib.md5(p.read_bytes()).hexdigest()

              assert digest!=old[name],name

              s=re.sub(
                  pattern,
                  lambda _:marker+digest.encode('ascii'),
                  s
              )

          mapper.write_bytes(s)

          loader=root/'knight/js/sl-assets-v229r115.js'

          s=loader.read_bytes()

          assert s.count(b"var version='V4.9';")==1

          loader.write_bytes(
              s.replace(
                  b"var version='V4.9';",
                  b"var version='V4.10';"
              )
          )

          for name in ('index.html','knight/index.html'):
              p=root/name
              s=p.read_bytes()

              assert b'V4.9' in s,name

              p.write_bytes(
                  s.replace(b'V4.9',b'V4.10')
                   .replace(b'v4.9',b'v4.10')
              )

          print('PASS four updated map mappings')
          print('PASS V4.10 version')
          PYTHON

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Verify exact recruiter placement changes
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib,json

          root=Path('site')
          game=root/'knight/gameasync'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          before=json.loads(
              Path('/tmp/sl410-before.json').read_text('utf8')
          )

          after={
              str(p.relative_to(root)):hashlib.sha256(
                  p.read_bytes()
              ).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          assert set(before)==set(after)
          assert len(after)==6033

          changed={
              name for name in before
              if before[name]!=after[name]
          }

          maps={
              pre+f'Map{mid:03d}.rxdata'
              for mid in (29,48,49,50)
          }

          names=set(json.loads(
              Path('/tmp/sl410-changed.json').read_text('utf8')
          ))

          assert names==maps

          allowed={
              'knight/gameasync/Data/'+name
              for name in maps
          }|{
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html',
              'knight/index.html'
          }

          assert changed==allowed,sorted(changed^allowed)

          for name in (
              'Actors','Classes','Weapons','Armors',
              'Items','MonsterStats','CommonEvents',
              'Tilesets','System','MapInfos','Map047'
          ):
              key='knight/gameasync/Data/'+pre+name+'.rxdata'

              assert before[key]==after[key],name

          key='knight/gameasync/Data/Scripts.rxdata'

          assert before[key]==after[key]

          mapping=(game/'mapping.js').read_bytes()

          for name in names:
              p=game/'Data'/name

              marker=(
                  'Data/'+name+'?h='+
                  hashlib.md5(p.read_bytes()).hexdigest()
              ).encode('ascii')

              assert mapping.count(marker)==1,name

          assert len(changed)==8

          print('PASS 8 new recruiter NPCs')
          print('PASS 9 total recruiter NPCs')
          print('PASS original Talking Island recruiter unchanged')
          print('PASS original combat and movement scripts unchanged')
          print('PASS original engine and graphics unchanged')
          print('PASS modified files',len(changed))
          print('PASS unchanged files',len(before)-len(changed))
          print('PASS V4.10 recruiter placement')
          PYTHON

      - name: Upload V4.10 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
