
name: build-slknight-web.yml | V2.10 | Map048 Map049 Map050 Sparse Original Native Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download original Sanctuary Map4 source data
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 43157706909
          name: Sanctuary-Original-Map-4-Full
          github-token: ${{ github.token }}
          path: source-map4

      - name: Prepare original V2.10 steps and direct targeted corrections
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/v210/steps
          gh api \
            'repos/gowellsik-hue/Game/contents/.github/workflows/build-slknight-web.yml?ref=50a353ee08769cb8c8bfc8b5b4dd3254f46c0a9d' \
            --jq .content | base64 -d > build/v210/original-v210.yml
          test -s build/v210/original-v210.yml
          cat > build/v210/patch_steps.py <<'V210_PATCH_STEPS_EOF'
          from pathlib import Path

          src = Path('build/v210/original-v210.yml').read_text('utf8')
          out = Path('build/v210/steps')
          out.mkdir(parents=True,exist_ok=True)
          names = [
           'Restore exact V2.9 deployed game and snapshot every original file',
           'Retrieve last confirmed Map048 renderer and original V2.9 preloader verification',
           'Restore exact visual-extent masks from three re-extracted HTMLs',
           'Re-use the original renderer and retain only needed terrain chunks',
           'Replace 48 49 collision and register Map050 plus Oren destination',
           'Extend existing native renderer and scroll count for Map050',
           'Pack all three maps and remove duplicate individual full-size PNGs',
           'Verify every changed file and report actual map pack MB',
           'Reuse original native browser smoke test for Map050',
           'Reject any broken Map048 to Map049 bridge transition'
          ]
          for i,name in enumerate(names):
           marker='      - name: '+name+'\n'
           assert src.count(marker)==1,(name,'step missing')
           section=src.split(marker,1)[1].split('\n      - name: ',1)[0]
           tag='        run: |\n'
           assert section.count(tag)==1,(name,'no run block')
           lines=section.split(tag,1)[1].splitlines()
           assert all(not x or x.startswith('          ') for x in lines),(name,'bad indent')
           (out/f'{i:02d}.sh').write_text('\n'.join(x[10:] if x else '' for x in lines).rstrip()+'\n','utf8')

          def change(step,old,new,n=1):
           p=out/f'{step:02d}.sh'
           s=p.read_text('utf8')
           count=s.count(old)
           if count!=n:
            raise RuntimeError(f'step{step:02d} expected {n} substitutions, got {count}, expr={old[:120]!r}')
           p.write_text(s.replace(old,new),'utf8')

          # Original masks are restored unchanged by step 02; do not decode or redraw them.
          change(3,'49:346,50:208','49:345,50:207')
          change(3,"""blank=Image.new('RGBA',(512,512),(0,0,0,0))
          blank_buf=BytesIO()
          blank.save(blank_buf,format='PNG',optimize=True)
          blank_png=blank_buf.getvalue()
          """,'')
          change(3,
           r'''"if (gx,gy) in keep:\n   crop=ground.crop((x,y,x+512,y+512)).convert('RGBA')\n   crop.save(panos/name,optimize=True)\n  else:\n   (panos/name).write_bytes(blank_png)\n  images.append(name)"''',
           r'''"if (gx,gy) in keep:\n   crop=ground.crop((x,y,x+512,y+512)).convert('RGBA')\n   crop.save(panos/name,optimize=True)\n   images.append(name)"''')
          change(3,
           "rep('ground=1152,upper',f'ground={W//32*H//32},upper')",
           """rep('ground=1152,upper','ground=len(keep),upper')
           marker=f"images.append('SLTI_{mid}_GID.png')"
           assert s.count(marker)==1
           inventory=(
            f"(Path('build/v210')/'map{mid}-chunk-inventory.json').write_text("
            +"json.dumps({'keep':[list(p) for p in sorted(keep)],"
            +"'omit':[[gx,gy] for gx in range(W//32) for gy in range(H//32)"
            +" if (gx,gy) not in keep]},separators=(',',':')),'utf8')"
           )
           s=s.replace(marker,marker+'\\n'+inventory)""")

          # Use the current branch's map-data semantics for the unverified bridges.
          change(4,
           "maps[50].instance_variable_set(:@events,{})",
           "[48,49,50].each{|mid|maps[mid].instance_variable_set(:@events,{})}")
          change(4,
           'puts "PASS V2.9 Map048/Map049 event objects retained; Map050 added"',
           "puts 'PASS Map048/049/050 data; unverified bridge transfers excluded'")

          # Keep the original RGSS method. Filter its existing required-cell set only.
          change(5,
           "  s\nend\n\npatch_named(rows,'SLNativeLayerV241') do |s|",
           """  sparse_ground=<<-'V210_GROUND_FILTER_EOF'
              if @slti_floor && [48,49,50].include?(@slti_floor)
                bits=SLNativeLayerV241::SPARSE_GROUND_BITS[@slti_floor]
                raise 'Sparse terrain inventory missing' unless bits
                required.delete_if do |key,_|
                  x,y=key
                  idx=y*@slti_cols+x
                  ((bits[idx/8] || 0) & (1 << (idx%8)))==0
                end
              end
            V210_GROUND_FILTER_EOF
            s=replace_once(s,'    @slti_r111_active_chunks=required',
              sparse_ground+'    @slti_r111_active_chunks=required')
            s
          end

          patch_named(rows,'SLNativeLayerV241') do |s|""")
          change(5,
           "  bounds=File.read('build/v22/map50-group-bounds.hex').strip",
           """  dimensions={48=>[48,24],49=>[50,24],50=>[24,13]}
            masks={}
            dimensions.each do |mid,(w,h)|
              inv=JSON.parse(File.read("build/v210/map#{mid}-chunk-inventory.json"))
              points=inv.fetch('keep')
              bytes=Array.new((w*h+7)/8,0)
              points.each do |x,y|
                raise "Bad sparse terrain coordinate #{mid} #{x},#{y}" unless
                  x.between?(0,w-1) && y.between?(0,h-1)
                idx=y*w+x
                bytes[idx/8]|=1<<(idx%8)
              end
              raise "Bad sparse terrain count #{mid}" unless
                points.length=={48=>450,49=>345,50=>207}[mid]
              masks[mid]=bytes.pack('C*').unpack1('H*')
            end
            sparse_literal=masks.map{|mid,hex| "#{mid}=>['#{hex}'].pack('H*')"}.join(',')
            bounds=File.read('build/v22/map50-group-bounds.hex').strip""")
          change(5,
           r'''"  GROUP_BOUNDS_50=#{parts}\n  FOREGROUND_KEYS_50=#{JSON.generate(keys)}\n  FADE_ALPHA=135"''',
           r'''"  GROUP_BOUNDS_50=#{parts}\n  FOREGROUND_KEYS_50=#{JSON.generate(keys)}\n  SPARSE_GROUND_BITS={#{sparse_literal}}\n  FADE_ALPHA=135"''')

          # Register sparse real PNGs only, never transparent placeholders.
          change(6,
           " expected={f'SLTI_{mid}_C{x}_{y}.png' for x in range(w) for y in range(h)}",
           """ inv=json.loads(Path(f'build/v210/map{mid}-chunk-inventory.json').read_text('utf8'))
           keep={tuple(p) for p in inv['keep']}
           omit={tuple(p) for p in inv['omit']}
           assert len(keep)=={48:450,49:345,50:207}[mid]
           assert not keep&omit and len(keep)+len(omit)==w*h
           expected={f'SLTI_{mid}_C{x}_{y}.png' for x,y in keep}""")
          change(6,
           """ inv=json.loads(Path(f'build/v210/map{mid}-chunk-inventory.json').read_text('utf8'))
           assert len(inv['keep'])=={48:450,49:346,50:208}[mid]
           blank={(x,y) for x,y in inv['omit']}
           assert len(blank)+len(inv['keep'])==w*h
          """,'')
          change(6,' blank_hash=None\n','')
          change(6,
           """   if xy in blank:
              value=hashlib.sha256(content).hexdigest()
              if blank_hash is None:blank_hash=value
              assert blank_hash==value,(mid,xy,'non-blank omitted region')
          """,
           """   assert xy in keep,(mid,xy,'omitted region in pack')
          """)
          change(6,
           "'required_ground=',len(inv['keep']),'empty_ground=',len(inv['omit']),",
           "'required_ground=',len(keep),'omitted_ground=',len(omit),")
          change(6,
           '''rep("var version='V2.9';","var version='V2.10';")''',
           '''rep("if(head.files.length<290)throw new Error('Incomplete original Map'+mid+' images');",
              "if(head.files.length<(mid===50?209:290))throw new Error('Incomplete original Map'+mid+' images');")
          rep("var version='V2.9';","var version='V2.10';")''')

          # Verify that every included ground key belongs to the saved source mask.
          change(7,'49:346,50:208','49:345,50:207')
          change(7,'assert len(ground)==basechunks,(mid,len(ground))',
                   'assert len(ground)==keep,(mid,len(ground))')
          change(7,
           """ # Missing original terrain is tiny transparent assets, not duplicated full maps.
           inv=json.loads(Path(f'build/v210/map{mid}-chunk-inventory.json').read_text('utf8'))
           blanks=set(inv['omit'])
           for key,off,size in ground:
            part=key.rsplit('_c',1)[1].split('_')
            if (int(part[0]),int(part[1])) in blanks:
             assert size<5000,(mid,key,'large unused tile')
          """,
           """ inv=json.loads(Path(f'build/v210/map{mid}-chunk-inventory.json').read_text('utf8'))
           retained={tuple(p) for p in inv['keep']}
           omitted={tuple(p) for p in inv['omit']}
           assert len(retained)==keep and not retained&omitted
           assert len(retained)+len(omitted)==basechunks
           for key,off,size in ground:
            part=key.rsplit('_c',1)[1].split('_')
            assert (int(part[0]),int(part[1])) in retained,(mid,key,'omitted tile in pack')
          """)
          change(7,"'emptyPlaceholderTiles':basechunks-keep,",
                   "'omittedGroundTiles':basechunks-keep,")
          change(7,
           "print('PASS no unapproved modifications; native source image duplicates excluded')",
           "print('PASS no unapproved modifications; omitted ground has no PNG or pack entry')")

          # Bridge events remain explicitly excluded until the real bridge landing points are verified.
          change(9,
           'raise "Map#{id} bridge inventory changed" unless events.keys.sort==[1,2,3,4]',
           'raise "Unverified Map#{id} bridge event remains" unless events.empty?')
          change(9,
           'puts "BRIDGE PASS=#{results.count(true)} FAIL=#{results.count(false)} of #{results.size}"',
           "puts 'PASS no unverified bridge transfer events'")
          change(9,
           "raise 'V2.10 REJECTED: original bridge cells do not connect to re-extracted Map049. Do not deploy unusable crossings.' unless results.all?",
           "raise 'Unexpected bridge transfer' unless results.empty?")

          print('PASS ten original V2.10 steps extracted and targeted patch applied')
          V210_PATCH_STEPS_EOF
          python3 -m py_compile build/v210/patch_steps.py
          python3 build/v210/patch_steps.py
          for STEP in build/v210/steps/*.sh; do bash -n "$STEP"; done
          test -s build/v210/steps/02.sh

      - name: Build and verify maps 048 049 050
        shell: bash
        run: |
          set -euo pipefail
          for STEP in \
            build/v210/steps/00.sh \
            build/v210/steps/01.sh \
            build/v210/steps/02.sh \
            build/v210/steps/03.sh \
            build/v210/steps/04.sh \
            build/v210/steps/05.sh \
            build/v210/steps/06.sh \
            build/v210/steps/07.sh \
            build/v210/steps/08.sh \
            build/v210/steps/09.sh
          do
            echo "RUN $STEP"
            bash -e "$STEP"
          done
          test -s build/v210/size-report.json
          test -s site/knight/assets/map-048-v229r115.pack
          test -s site/knight/assets/map-049-v229r115.pack
          test -s site/knight/assets/map-050-v229r115.pack
          echo 'PASS V2.10 map build and static verification'

      - name: Publish V2.10 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
