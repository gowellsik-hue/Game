name: Deploy SLKnight V14.2g PAD CORE ONLY
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: slknight-github-pages, cancel-in-progress: true}
env:
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake cmake curl ffmpeg freepats git imagemagick libtool make mm-common patch pkg-config python3 rake ruby timidity unzip wget xz-utils fonts-nanum
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.MKXP_SRC_REF }}
          path: engine
      - name: Cache engine dependencies
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-${{ runner.os }}-${{ env.EMSDK_VER }}-onig25b
      - name: Patch engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def repl(path,old,new,count=1):
              p=Path(path);s=p.read_text();n=s.count(old)
              if n!=count: raise SystemExit(f'{path}: expected {count}, found {n}')
              p.write_text(s.replace(old,new,count))
          repl('engine/src/config.cpp','fixedFramerate = 40;','fixedFramerate = 0;')
          repl('engine/src/config.cpp','defScreenW = 640;','defScreenW = 800;')
          repl('engine/src/config.cpp','defScreenH = 480;','defScreenH = 600;')
          repl('engine/src/config.cpp','frameSkip = true;','frameSkip = false;')
          repl('engine/src/config.cpp','PO_DESC(smoothScaling, bool, true)','PO_DESC(smoothScaling, bool, false)')
          repl('engine/src/graphics.cpp','width = clamp(width, 1, 640);\n\theight = clamp(height, 1, 480);','width = clamp(width, 1, 800);\n\theight = clamp(height, 1, 600);')
          repl('engine/binding-mruby/binding-mruby.cpp','\tif (jsSkipFrame() == 1) return;','\t/* frame limiter disabled */')
          repl('engine/build.sh','./emsdk install latest','./emsdk install 3.1.37')
          repl('engine/build.sh','./emsdk activate latest','./emsdk activate 3.1.37')
          p=Path('engine/binding-mruby/graphics-binding.cpp');s=p.read_text()
          marker='''MRB_FUNCTION(graphicsFrameReset)\n{\n\tMRB_FUN_UNUSED_PARAM;\n\n\tshState->graphics().frameReset();\n\n\treturn mrb_nil_value();\n}\n'''
          extra=marker+'''\nMRB_FUNCTION(graphicsResizeScreen)\n{\n\tMRB_FUN_UNUSED_PARAM;\n\tmrb_int width, height;\n\tmrb_get_args(mrb, "ii", &width, &height);\n\tGUARD_EXC( shState->graphics().resizeScreen(width, height); )\n\treturn mrb_nil_value();\n}\n'''
          if s.count(marker)!=1: raise SystemExit('graphics marker mismatch')
          s=s.replace(marker,extra,1)
          reg='\tmrb_define_module_function(mrb, module, "frame_reset", graphicsFrameReset, MRB_ARGS_NONE());'
          if s.count(reg)!=1: raise SystemExit('graphics registration mismatch')
          s=s.replace(reg,reg+'\n\tmrb_define_module_function(mrb, module, "resize_screen", graphicsResizeScreen, MRB_ARGS_REQ(2));',1)
          p.write_text(s)
          p=Path('engine/extra/build_config.rb');s=p.read_text()
          gem="    conf.gem :github => 'pulsejet/mruby-marshal'"
          pin="    conf.gem :github => 'mattn/mruby-onig-regexp', :checksum_hash => '25b152264cd4dfac84aa39e5fbb428ec84b95e6a'\n"+gem
          if s.count(gem)!=1: raise SystemExit('mruby config mismatch')
          p.write_text(s.replace(gem,pin,1))
          PY
          grep -Fq 'fixedFramerate = 0;' engine/src/config.cpp
          grep -Fq 'frameSkip = false;' engine/src/config.cpp
          grep -Fq 'defScreenW = 800;' engine/src/config.cpp
          grep -Fq 'defScreenH = 600;' engine/src/config.cpp
          grep -Fq 'resize_screen' engine/binding-mruby/graphics-binding.cpp
          grep -Fq 'if (window.saveFile) window.saveFile(UTF8ToString(fullPathC));' engine/src/emscripten.cpp
          test "$(grep -Fc 'Asyncify.handleSleep' engine/src/emscripten.cpp)" -eq 1
      - name: Build engine
        run: |
          set -e
          mkdir -p engine/build/gameasync
          rm -rf engine/deps/mruby/build/repos/wasm32-unknown-gnu/mruby-onig-regexp
          cd engine
          bash build.sh
          cd ..
          rm -rf engine/build/gameasync
          test -s engine/build/index.html
          test -s engine/build/mkxp.js
          test -s engine/build/mkxp.wasm
      - name: Install game
        run: |
          set -e
          curl -L --fail --retry 3 -o game.zip "$GAME_URL"
          echo "$GAME_SHA256  game.zip" | sha256sum -c -
          unzip -q game.zip -d src
          rm -rf player
          cp -a engine/build player
          rm -rf player/gameasync player/preload
          mkdir -p player/gameasync/Fonts player/preload
          cp -a src/SLKnight_Android_JoiPlay/. player/gameasync/
          cp engine/extra/rgss.rb player/gameasync/rgss.rb
          cp engine/COPYING player/COPYING-mkxp-web.txt
          cp /usr/share/fonts/truetype/nanum/NanumGothic.ttf player/gameasync/Fonts/NanumGothic.ttf
          cp /usr/share/fonts/truetype/nanum/NanumGothicBold.ttf player/gameasync/Fonts/NanumGothicBold.ttf
          rm -f player/gameasync/Save*.rxdata player/gameasync/README_Android.txt
      - name: Patch game
        run: |
          ruby -EUTF-8:UTF-8 -rzlib - player/gameasync <<'RB'
          game=ARGV[0]
          ini_path=File.join(game,'Game.ini')
          ini=File.binread(ini_path)
          rel=ini[/^Scripts=(.+)$/i,1].to_s.strip.tr('\\','/')
          abort 'Scripts entry missing' if rel.empty?
          source_path=File.join(game,rel)
          scripts=Marshal.load(File.binread(source_path))
          compat=<<'RUBY'
          $joiplay=true
          module Kernel
            def exit(*args);nil;end
          end
          class Win32API
            def initialize(*args);@func=args[1].to_s;end
            def web_input(key)
              case key.to_i
              when 9,90 then Input::A
              when 13,32,67 then Input::C
              when 27,88 then Input::B
              when 65 then Input::X
              when 83 then Input::Y
              when 68 then Input::Z
              when 81 then Input::L
              when 87 then Input::R
              when 16 then Input::SHIFT
              when 17 then Input::CTRL
              when 18 then Input::ALT
              else nil
              end
            end
            def call(*args)
              code=web_input(args[0])
              return(code&&Input.trigger?(code)?1:0) if @func=='GetAsyncKeyState'
              return(code&&Input.press?(code)?-1:0) if @func=='GetKeyState'
              0
            end
            def Call(*args);call(*args);end
          end
          Font.default_name='NanumGothic'
          module Audio
            def self.sl_stream(kind,*parts);puts((['SLAUDIO',kind]+parts.collect{|v|v.to_s}).join('|'));end
            def self.bgm_play(filename,volume=100,pitch=100);sl_stream('BGM_PLAY',filename,volume,pitch);end
            def self.bgm_stop;sl_stream('BGM_STOP');end
            def self.bgm_fade(time);sl_stream('BGM_FADE',time);end
            def self.bgs_play(filename,volume=100,pitch=100);sl_stream('BGS_PLAY',filename,volume,pitch);end
            def self.bgs_stop;sl_stream('BGS_STOP');end
            def self.bgs_fade(time);sl_stream('BGS_FADE',time);end
          end
          RUBY
          scripts.insert(0,[0,'Web Compatibility',Zlib::Deflate.deflate(compat)])
          def inflate(e);Zlib::Inflate.inflate(e[2]).force_encoding(Encoding::UTF_8);end
          def deflate(e,s);e[2]=Zlib::Deflate.deflate(s);end
          def entry_for(a,n)
            e=a.find{|x|x.is_a?(Array)&&x.length>=3&&x[1].to_s==n}
            abort "missing #{n}" unless e
            e
          end
          def patch_begin_until(src)
            lines=src.lines
            lines.each_index do |i|
              m=lines[i].match(/^(\s*)end\s+until\s+(.+?)\s*$/)
              next unless m
              indent=m[1];cond=m[2];j=i-1
              while j>=0
                if lines[j][/^\s*/]==indent&&lines[j].strip=='begin'
                  lines[j]=indent+"loop do\n"
                  lines[i]=indent+"  break if #{cond}\n#{indent}end\n"
                  break
                end
                j-=1
              end
            end
            lines.join
          end
          def patch_scene_loop(src)
            lines=src.lines;i=0
            while i<lines.length
              unless lines[i].strip=='loop do';i+=1;next;end
              indent=lines[i][/^\s*/];sig=[];k=i+1
              while k<lines.length&&sig.length<8
                v=lines[k].strip
                sig<<[k,v,lines[k][/^\s*/]] unless v.empty?||v.start_with?('#')
                k+=1
              end
              finish=nil
              if sig.length>=7&&sig[0][1]=='Graphics.update'&&sig[1][1]=='Input.update'&&sig[2][1]=='update'&&sig[3][1]=='if $scene != self'&&sig[4][1]=='break'&&sig[5][1]=='end'&&sig[6][1]=='end'&&sig[6][2]==indent
                finish=sig[6][0]
              end
              if finish.nil?&&sig.length>=5&&sig[0][1]=='Graphics.update'&&sig[1][1]=='Input.update'&&sig[2][1]=='update'&&sig[3][1]=='break if $scene != self'&&sig[4][1]=='end'&&sig[4][2]==indent
                finish=sig[4][0]
              end
              lines[i..finish]=[indent+"end\n\n"+indent+"def dispose\n"] if finish
              i+=1
            end
            lines.join
          end
          id_sprite=<<'RUBY'
          class Game_Character;attr_accessor :sprite_id;end
          class Sprite_Character
            alias sl_id_original_update update
            def create_id_sprite(text)
              bitmap=Bitmap.new(160,16);bitmap.font.name='NanumGothic';bitmap.font.size=12;bitmap.font.bold=false
              bitmap.font.color.set(0,0,0);bitmap.draw_text(0,-1,160,16,text,1);bitmap.draw_text(0,1,160,16,text,1);bitmap.draw_text(-1,0,160,16,text,1);bitmap.draw_text(1,0,160,16,text,1)
              bitmap.font.color.set(255,255,255);bitmap.draw_text(0,0,160,16,text,1)
              @_id_sprite=Sprite.new(self.viewport);@_id_sprite.bitmap=bitmap;@_id_sprite.opacity=255;@_id_sprite.ox=80;@_id_sprite.oy=14;@_id_sprite.x=self.x;@_id_sprite.y=self.y-self.oy/2;@_id_sprite.z=9999;@_id_sprite_visible=true
            end
            def dispose_id_sprite
              if @_id_sprite!=nil
                @_id_sprite.bitmap.dispose if @_id_sprite.bitmap!=nil&&!@_id_sprite.bitmap.disposed?
                @_id_sprite.dispose;@_id_sprite=nil
              end
              @_id_sprite_visible=false
            end
            def update_id_sprite
              if @character.sprite_id!=nil&&@character.sprite_id.to_s!=''
                create_id_sprite(@character.sprite_id) unless @_id_sprite_visible
                @_id_sprite.x=self.x;@_id_sprite.y=self.y-self.oy
              elsif @_id_sprite_visible
                dispose_id_sprite
              end
            end
            def update;sl_id_original_update;update_id_sprite;end
          end
          RUBY
          id_output=<<'RUBY'
          class Game_Event
            alias sl_id_original_event_refresh refresh
            def refresh
              sl_id_original_event_refresh
              text=@event.name.dup;text.gsub!(/\[[Ii][Dd](.+?)\]/){@sprite_id=$1};@sprite_id=nil if @erased||@character_name==''
            end
          end
          class Game_Player
            alias sl_id_original_player_refresh refresh
            def refresh;sl_id_original_player_refresh;@sprite_id=nil if $game_party.actors.size>0;end
          end
          RUBY
          browser_loop=<<'RUBY'
          $prev_scene=nil
          $sl_last_scene_name=nil
          def main_update_loop
            begin
              if $scene!=nil
                active_scene=$scene;name=active_scene.class.to_s
                puts('SLFRAME|'+name) if $sl_last_scene_name!=name
                $sl_last_scene_name=name
                if active_scene!=$prev_scene
                  $prev_scene.dispose if $prev_scene!=nil&&$prev_scene.respond_to?(:dispose)
                  active_scene.main;$prev_scene=active_scene
                  return if $scene!=active_scene
                end
                Graphics.update;Input.update;active_scene.update if $scene==active_scene
              end
            rescue Exception=>e
              puts('SLRUNTIMEERR|'+e.class.to_s+'|'+e.message.to_s)
              e.backtrace[0,16].each{|line|puts('SLRUNTIMEBT|'+line.to_s)} if e.respond_to?(:backtrace)&&e.backtrace
            end
          end
          RUBY
          plane=0;ids=0;fonts=0
          font_rules=[
            [/((?:Font\.default_name)\s*=\s*)\[\s*["'][^"']*["']\s*\]/n,'\1"NanumGothic"'],
            [/(Font\.default_name\s*=\s*)["'][^"']*["']/n,'\1"NanumGothic"'],
            [/(\.font\.name\s*=\s*)["'][^"']*["']/n,'\1"NanumGothic"'],
            [/(\bFONT_NAME\s*=\s*)["'][^"']*["']/n,'\1"NanumGothic"']
          ]
          scripts.each_with_index do |entry,index|
            next unless entry.is_a?(Array)&&entry.length>=3
            name=entry[1].to_s
            begin;text=Zlib::Inflate.inflate(entry[2]);rescue;next;end
            font_rules.each{|rx,rep|fonts+=text.scan(rx).length;text.gsub!(rx,rep)}
            text.gsub!('defined?($joiplay) && $joiplay','$joiplay == true')
            if index==111
              text=id_sprite;ids+=1
            elsif index==112
              text=id_output;ids+=1
            elsif text.match?(/^\s*class\s+Plane\s*<\s*Sprite\b/n)
              text="# native Plane used on web\n";plane+=1
            end
            text=patch_begin_until(text)
            text=patch_scene_loop(text) unless name=='Main'||name=='Scene_Map'||name=='Scene_Equip'
            if name=='Main'
              text=browser_loop+text unless text.include?('def main_update_loop')
              text.sub!(/\n\s*while\s+\$scene\s*!=\s*nil\s*\r?\n\s*\$scene\.main\s*\r?\n\s*end\s*/m,"\n")
            end
            entry[2]=Zlib::Deflate.deflate(text)
          end
          abort "Plane patch=#{plane}" unless plane==1
          abort "ID patch=#{ids}" unless ids==2
          abort "font patch=#{fonts}" unless fonts>=10
          resolution=scripts[97];rt=inflate(resolution)
          abort 'resolution script mismatch' unless rt.include?('$WINDOW_WIDTH = 800')&&rt.include?('Graphics.resize_screen')
          abort 'resolution defined mismatch' if rt.include?('defined?($joiplay)')
          deflate(resolution,rt)
          save=entry_for(scripts,'Scene_Save');text=inflate(save);count=0
          text=text.sub(/    write_save_data\(file\)\r?\n    exit/){count+=1;"    write_save_data(file)\n    file.close\n    save_file_async(filename)"}
          abort "Scene_Save patch=#{count}" unless count==1
          abort 'Scene_Save menu flow mismatch' unless text.scan('$scene = Scene_Menu.new(4)').size==2
          abort 'Scene_Save map flow mismatch' unless text.scan('$scene = Scene_Map.new').size==2
          deflate(save,text)
          menu_fx=scripts.find{|e|e.is_a?(Array)&&e.length>=3&&((inflate(e).include?('XRXS_MP7_Module')) rescue false)}
          abort 'menu lifecycle missing' unless menu_fx
          text=inflate(menu_fx)
          wr=/  alias xrxs_mp7_main main\r?\n  def main\r?\n    create_spriteset\r?\n    xrxs_mp7_main\r?\n    dispose_spriteset\r?\n  end/
          matches=[]
          text.to_enum(:scan,wr).each{matches<<Regexp.last_match}
          abort "menu wrapper count=#{matches.size}" unless matches.size==8
          equip_index=nil
          matches.each_with_index do |m,i|
            prefix=text[0...m.begin(0)]
            classes=prefix.scan(/class\s+(Scene_[A-Za-z0-9_]+)/)
            equip_index=i if classes.last&&classes.last[0]=='Scene_Equip'
          end
          abort 'equip wrapper not found' if equip_index.nil?
          n=0
          text=text.gsub(wr) do |m|
            current=n;n+=1
            if current==equip_index
              m
            else
              "  alias xrxs_mp7_main main\n  def main\n    create_spriteset\n    xrxs_mp7_main\n  end\n  alias xrxs_mp7_dispose dispose\n  def dispose\n    xrxs_mp7_dispose\n    dispose_spriteset\n  end"
            end
          end
          ds=/  def dispose_spriteset\r?\n.*?    @spriteset\.dispose\r?\n  end/m
          abort 'dispose_spriteset mismatch' unless text.scan(ds).size==1
          text.sub!(ds,"  def dispose_spriteset\n    if @spriteset != nil\n      @spriteset.dispose\n      @spriteset = nil\n    end\n  end")
          deflate(menu_fx,text)
          multi=entry_for(scripts,'Multi-slot script : Windows');text=inflate(multi)
          text.gsub!('if defined? xrxs_additional_refresh','if respond_to?(:xrxs_additional_refresh)')
          deflate(multi,text)
          mog=scripts.find{|e|e.is_a?(Array)&&e.length>=3&&((inflate(e).include?('alias shud_main main')) rescue false)}
          abort 'MOG HUD missing' unless mog
          text=inflate(mog);text.gsub!('Viewport.new(0, 0, 640, 480)','Viewport.new(0, 0, $WINDOW_WIDTH, $WINDOW_HEIGHT)');deflate(mog,text)
          main=entry_for(scripts,'Main');abort 'Main regression' if inflate(main).include?('defined?')
          target=File.join(game,'Data','Scripts.rxdata');File.binwrite(target,Marshal.dump(scripts))
          File.delete(source_path) if File.expand_path(source_path)!=File.expand_path(target)
          lines=ini.split(/\r?\n/).map{|line|line=~/^Scripts=/i?'Scripts=Data\\Scripts.rxdata':line=~/^Title=/i?'Title=SLKnight':line}
          File.binwrite(ini_path,lines.join("\r\n")+"\r\n")
          class RawMarshalObject
            def self._load(data);o=allocate;o.instance_variable_set(:@raw,data);o;end
            def _dump(_depth);@raw;end
          end
          class Tone<RawMarshalObject;end
          class Color<RawMarshalObject;end
          class Rect<RawMarshalObject;end
          class Table<RawMarshalObject;end
          module RPG
            class AudioFile;end
            class Map;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end
          def iv(o,n);o.instance_variable_get("@#{n}");end
          def setiv(o,n,v);o.instance_variable_set("@#{n}",v);end
          map_path=Dir.glob(File.join(game,'Data','*Map029.rxdata')).max_by{|p|File.size(p)}
          abort 'Map029 missing' unless map_path&&File.size(map_path)>1000
          map=Marshal.load(File.binread(map_path));smith=(iv(map,:events)||{})[30]
          abort 'smith event missing' unless smith
          smith1="\uB300\uC7A5\uAC04 \uC18C\uB9AC";smith2=smith1+'2';patched=0
          (iv(smith,:pages)||[]).each do |page|
            route=iv(page,:move_route);next unless route
            (iv(route,:list)||[]).each do |cmd|
              next unless iv(cmd,:code)==44
              audio=(iv(cmd,:parameters)||[])[0];next unless audio
              an=iv(audio,:name).to_s.dup.force_encoding(Encoding::UTF_8);next unless an==smith1||an==smith2
              vol=iv(audio,:volume).to_i;pitch=iv(audio,:pitch).to_i
              code="dx=($game_player.x-@x).abs;dy=($game_player.y-@y).abs;d=[dx,dy].max;if d<=8;v=[#{vol}-d*3,6].max;$game_system.se_play(RPG::AudioFile.new(#{an.dump},v,#{pitch}));end"
              setiv(cmd,:code,45);setiv(cmd,:parameters,[code]);patched+=1
            end
          end
          abort "smith patch=#{patched}" unless patched==4
          File.binwrite(map_path,Marshal.dump(map))
          puts 'GAME_PATCH_OK'
          RB
          ruby - <<'RB'
          module RPG
            class Item;end
            class AudioFile;end
          end
          path=Dir.glob('player/gameasync/Data/*Items.rxdata').max_by{|p|File.size(p)}
          abort 'Items missing' unless path&&File.size(path)>1000
          items=Marshal.load(File.binread(path))
          abort 'item 3 missing' unless items[3]
          abort 'item 17 missing' unless items[17]
          items[3].instance_variable_set(:@common_event_id,8)
          abort 'item 17 changed' unless items[17].instance_variable_get(:@common_event_id)==6
          File.binwrite(path,Marshal.dump(items))
          puts 'ITEM_PATCH_OK'
          RB
      - name: Convert media
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,sys
          root=Path('player/gameasync/Audio')
          exts={'.mp3','.wav','.wma','.aac','.m4a','.flac','.mid','.midi'}
          failures=[]
          for src in [p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in exts]:
              out=src.with_suffix('.ogg');temp=None
              try:
                  inp=src
                  if src.suffix.lower() in {'.mid','.midi'}:
                      temp=src.with_name(src.name+'.wav')
                      subprocess.run(['timidity',str(src),'-Ow','-o',str(temp)],check=True)
                      inp=temp
                  subprocess.run(['ffmpeg','-nostdin','-v','error','-y','-i',str(inp),'-c:a','libvorbis','-q:a','4',str(out)],check=True)
                  if not out.exists() or out.stat().st_size==0: raise RuntimeError('empty output')
                  if temp and temp.exists(): temp.unlink()
                  if src!=out and src.exists(): src.unlink()
              except Exception as e:
                  failures.append((str(src),str(e)))
                  if temp and temp.exists(): temp.unlink()
          if failures:
              for f,e in failures: print(f+' -> '+e,file=sys.stderr)
              raise SystemExit(1)
          gfx=Path('player/gameasync/Graphics')
          for src in [p for p in gfx.rglob('*') if p.is_file() and p.suffix.lower() in {'.bmp','.gif','.webp','.tif','.tiff'}]:
              out=src.with_suffix('.png')
              subprocess.run(['convert',str(src)+'[0]',str(out)],check=True)
              if not out.exists() or out.stat().st_size==0: raise SystemExit('image conversion failed: '+str(src))
              src.unlink()
          PY
      - name: Build mappings
        run: |
          set -e
          cd player/gameasync
          bash ../../engine/extra/make_mapping.sh
          test -s mapping.js
          test -s bitmap-map.js
          grep -Fq 'Fonts/NanumGothic.ttf' mapping.js
          grep -Fq 'Fonts/NanumGothicBold.ttf' mapping.js
      - name: Patch browser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('player/js/drive.js');s=p.read_text()
          a=s.index('window.saveFile = function(filename, localOnly) {');b=s.index('\n};',a)+3
