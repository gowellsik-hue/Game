
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R157
# BASE: Successful V229R156 GitHub Pages artifact, run 41154696610.
# SCOPE: Move only Pandora away from the palm shadow into clear open ground
#        beside the same original Map047 outdoor stall.
# BEFORE -> AFTER: Pandora RPG (237,131) -> (241,129).
# PROVENANCE: Original Map047 stall art; candidate NPC XY is image-verified, not native server XY.
# VISIBILITY: Register [ID판도라] so the existing Game_Event ID-name logic can identify this NPC.
# NO EXTRA IMAGE: Original SLTI_47_C7_4.png and the full map preload pack remain
#                 byte-identical. Never paint or load a duplicated stall.
# PRESERVE: All six other NPC events and all shop/service implementations.
# PRESERVE: All collision values, no Map045/046, Map047 97-image preload,
#           all other maps, game scripts, monster balance, saves and controls.
name: build-slknight-web.yml | V229R157 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R157 Download unchanged V229R156 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41154696610
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V229R157 Extract and record every original game file
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          prefix='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          if len(before)!=5504:raise ValueError('Wrong original file count')
          if 'V229R156' not in (root/'knight/index.html').read_text('utf8'):
              raise ValueError('Wrong source version: expected V229R156')
          if prefix+'Map045.rxdata' in before or prefix+'Map046.rxdata' in before:
              raise ValueError('The deleted dungeon has unexpectedly returned')
          if before[prefix+'Map047.rxdata']=='404091bc0fde3c06e921bdcce693f0fa13ee5cfec631ad456581a9ca3ad4d20f':
              raise ValueError('Stale V229R155 map, expected V229R156')
          if before['knight/gameasync/Graphics/Panoramas/SLTI_47_C7_4.png']!='d1f321ba3012e9422e909b2ba4865dfcfaf188cb0671c459597f935537a26991':
              raise ValueError('Original Map047 outdoor stall art changed')
          if 'knight/assets/map-047-v229r151.pack' not in before:
              raise ValueError('Map047 full-image preload is missing')
          Path('build/before.json').write_text(json.dumps(before,sort_keys=True),'utf8')
          print('PASS complete V229R156 game, original Pandora backdrop and preload')
          PY

      - name: V229R157 Place Pandora on visible ground beside original crates
        shell: bash
        run: |
          set -euo pipefail
          cat > build/pandora.rb <<'RUBY'
          require 'digest'
          module RPG
            class Map; end
            class Event; end
            class Event::Page; end
            class Event::Page::Condition; end
            class Event::Page::Graphic; end
            class EventCommand; end
            class MoveCommand; end
            class MoveRoute; end
            class AudioFile; end
          end
          class Table
            def self._load(raw); o=allocate; o.instance_variable_set(:@raw,raw); o; end
            def _dump(_depth); @raw; end
          end
          class Tone
            def self._load(raw); o=allocate; o.instance_variable_set(:@raw,raw); o; end
            def _dump(_depth); @raw; end
          end
          class Color
            def self._load(raw); o=allocate; o.instance_variable_set(:@raw,raw); o; end
            def _dump(_depth); @raw; end
          end

          root='site/knight/gameasync'
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          file=File.join(root,'Data',prefix+'Map047.rxdata')
          original=File.binread(file)
          raise 'Stale V229R155 map' if
            Digest::SHA256.hexdigest(original)=='404091bc0fde3c06e921bdcce693f0fa13ee5cfec631ad456581a9ca3ad4d20f'
          map=Marshal.load(original)
          raise 'Map047 serialization mismatch' unless Marshal.dump(map)==original
          width=map.instance_variable_get(:@width)
          height=map.instance_variable_get(:@height)
          raise 'Wrong Map047 shape' unless [width,height]==[363,238]
          events=map.instance_variable_get(:@events)
          names=events.values.map{|e|e.instance_variable_get(:@name)}
          expected=['도린','게렝','판도라','선착장 관리인','루카스','라다르','라이엔'].map{|n|'TI_NPC_'+n}
          raise 'Unexpected current NPC event set' unless names.sort==expected.sort && events.length==7
          pandoras=events.values.select{|e|e.instance_variable_get(:@name)=='TI_NPC_판도라'}
          raise 'Pandora event is not unique' unless pandoras.length==1
          pandora=pandoras.first
          from=[pandora.instance_variable_get(:@x),pandora.instance_variable_get(:@y)]
          to=[241,129]
          raise "Unexpected Pandora original position #{from.inspect}" unless from==[237,131]
          original_events=events.reject{|k,v|v.equal?(pandora)}.transform_values{|e|Marshal.dump(e)}
          table=map.instance_variable_get(:@data).instance_variable_get(:@raw).b
          original_table=table.dup
          raise 'Wrong RPG collision header' unless table[0,20].unpack('V5')==[3,width,height,3,width*height*3]
          collision=table[20,width*height*2].unpack('v*')
          raise 'Original Map047 terrain changed' unless
            Digest::SHA256.hexdigest(table[20,width*height*2])=='01e647ea7825d94808596cb601d597d99cbd4cef32ea3261d7290359538561d0'
          walkable=->(x,y){x>=0 && y>=0 && x<width && y<height && collision[y*width+x]==384}
          raise 'Pandora new tile not originally passable' unless walkable.call(*to)
          around=[[to[0]-1,to[1]],[to[0]+1,to[1]],[to[0],to[1]-1],[to[0],to[1]+1]]
          raise 'Pandora position is not approachable' unless around.count{|x,y|walkable.call(x,y)}>=2
          chunk=File.join(root,'Graphics/Panoramas/SLTI_47_C7_4.png')
          raise 'Original crate backdrop changed' unless
            Digest::SHA256.file(chunk).hexdigest=='d1f321ba3012e9422e909b2ba4865dfcfaf188cb0671c459597f935537a26991'
          raise 'Pandora not in original backdrop chunk' unless [to[0]/32,to[1]/32]==[7,4]

          # Verify four-direction reachability from the original entry.
          start=[197,128]
          queue=[start];visited={start=>true};index=0
          while index<queue.length
            x,y=queue[index];index+=1
            [[x-1,y],[x+1,y],[x,y-1],[x,y+1]].each do |xx,yy|
              point=[xx,yy]
              next unless walkable.call(xx,yy) && !visited[point]
              visited[point]=true
              queue<<point
            end
          end
          raise 'Pandora unreachable on unchanged map' unless visited[to]

          # Preserve existing sprite and dialogue.
          # Only move Pandora and use the original game's [ID] NPC naming format.
          page=pandora.instance_variable_get(:@pages).first
          raise 'Unexpected Pandora event pages' unless pandora.instance_variable_get(:@pages).length==1
          graphic=page.instance_variable_get(:@graphic)
          raise 'Unexpected Pandora sprite' unless graphic.instance_variable_get(:@character_name)=='메티스'
          raise 'Pandora image not visible by event settings' unless
            graphic.instance_variable_get(:@opacity)==255 &&
            graphic.instance_variable_get(:@tile_id)==0
          condition=page.instance_variable_get(:@condition)
          [:switch1_valid,:switch2_valid,:variable_valid,:self_switch_valid].each do |flag|
            raise "Unexpected Pandora page condition #{flag}" unless
              condition.instance_variable_get(:"@#{flag}")==false
          end
          pandora.instance_variable_set(:@x,to[0])
          pandora.instance_variable_set(:@y,to[1])
          pandora.instance_variable_set(:@name,'[ID판도라]')

          raise 'Other NPC event changed' unless
            events.reject{|k,v|v.equal?(pandora)}.all?{|k,v|Marshal.dump(v)==original_events.fetch(k)}
          raise 'Map047 terrain changed' unless
            map.instance_variable_get(:@data).instance_variable_get(:@raw)==original_table

          updated=Marshal.dump(map)
          File.binwrite(file,updated)
          verify=Marshal.load(File.binread(file))
          raise 'Pandora not saved correctly' unless
            verify.instance_variable_get(:@events).values.count{|e|
              e.instance_variable_get(:@name)=='[ID판도라]' &&
              [e.instance_variable_get(:@x),e.instance_variable_get(:@y)]==to
            }==1
          raise 'Saved collision changed' unless
            verify.instance_variable_get(:@data).instance_variable_get(:@raw)==original_table
          puts "PASS Pandora #{from.inspect} -> #{to.inspect}, event ID-name enabled"
          puts 'PASS other six NPCs and original collision untouched'
          RUBY
          ruby -c build/pandora.rb
          ruby build/pandora.rb

      - name: V229R157 Refresh only Map047 cache and page versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          root=Path('site')
          game=root/'knight/gameasync'
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          filename=prefix+'Map047.rxdata'
          digest=hashlib.md5((game/'Data'/filename).read_bytes()).hexdigest()
          target=game/'mapping.js'
          text=target.read_text('utf8')
          pattern=r'(Data/'+re.escape(filename)+r'\?h=)[0-9a-f]{32}'
          text,count=re.subn(pattern,lambda m:m.group(1)+digest,text)
          if count!=1:raise ValueError('Map047 cache entry not unique')
          target.write_text(text,'utf8')
          for name in ('index.html','knight/index.html'):
              path=root/name
              old=path.read_text('utf8')
              if 'V229R156' not in old:
                  raise ValueError('Wrong page baseline '+name)
              path.write_text(old.replace('V229R156','V229R157')
                                 .replace('v229r156','v229r157'),'utf8')
          asset=root/'knight/js/sl-assets-v229r115.js'
          old=asset.read_text('utf8')
          token="var version='V229R156';"
          if old.count(token)!=1:
              raise ValueError('Wrong current asset version')
          asset.write_text(old.replace(token,"var version='V229R157';"),'utf8')
          if 'map-047-v229r151.pack' not in asset.read_text('utf8'):
              raise ValueError('Preloaded Map047 pack lost')
          if 'js/sl-assets-v229r115.js?v=v229r157' not in (root/'knight/index.html').read_text('utf8'):
              raise ValueError('Browser cache version was not refreshed')
          print('PASS Map047 cache and V229R157 version labels')
          PY
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/dpad.js
          node --check site/knight/js/drive.js

      - name: V229R157 Protect unrelated maps and game resources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before=json.loads(Path('build/before.json').read_text('utf8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          prefix='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          allowed={
              prefix+'Map047.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html',
              'knight/index.html'
          }
          if before.keys()!=after.keys():
              raise ValueError('Game files added or deleted')
          changed={name for name in before if before[name]!=after[name]}
          if changed!=allowed:
              raise ValueError('Unexpected changed files: '+repr(sorted(changed^allowed)))
          if before['knight/assets/map-047-v229r151.pack']!=after['knight/assets/map-047-v229r151.pack']:
              raise ValueError('Map preload pack changed')
          if before['knight/gameasync/Data/Scripts.rxdata']!=after['knight/gameasync/Data/Scripts.rxdata']:
              raise ValueError('Game scripts changed')
          for mid in (45,46):
              if prefix+f'Map{mid:03d}.rxdata' in after:
                  raise ValueError('Deleted dungeon returned')
          print('PASS only Pandora map data and four cache/version files changed')
          print('PASS other NPCs, collision, art, balance and controls preserved')
          PY

      - name: V229R157 Publish Pandora position and NPC identifier correction
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
