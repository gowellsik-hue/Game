          newpath=ROOT/'knight/gameasync/Data'/(PREFIX+'Map048.rxdata')
          new='["data/'+PREFIX.lower()+'map048", "Data/'+PREFIX+'Map048.rxdata?h='+hashlib.md5(newpath.read_bytes()).hexdigest()+'"],\n'
          s=s[:match.end()]+new+s[match.end():]
          anchor='["graphics/panoramas/slti_47_gid", '
          matches=list(re.finditer(r'^\["graphics/panoramas/slti_47_gid", [^\n]+\n',s,re.M))
          assert len(matches)==1
          rows=[]
          for name in images:
           p=PANO/name
           rows.append('["graphics/panoramas/'+name[:-4].lower()+'", "Graphics/Panoramas/'+name+'?h='+hashlib.md5(p.read_bytes()).hexdigest()+'"],\n')
          s=s[:matches[0].end()]+''.join(rows)+s[matches[0].end():]
          for name in ('MapInfos.rxdata','Scripts.rxdata'):
