name: Deploy SLKnight V14.3z6 CLEAN BUFF STATE + VERIFIED REMAINING 5 + DECOUPLED ORCS + FAST AUTO

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions: {contents: read, pages: write, id-token: write}

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  BASELINE_SHA: c6815cd461dba60ec131898e6d5dd8690dd915ae
  X2_SHA: 6d941bd643dda87b8267ba466e108d1904c22331
  Z1_SHA: 008b6abe81074b7af877806b45f2314004a74f66
  Z3_SHA: 5a46988b048764e8a99700998c1f4ab96a3ec5c1
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout frozen V14.3l baseline
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.BASELINE_SHA }}
          path: baseline

      - name: Checkout frozen V14.3x2 native auto base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.X2_SHA }}
          path: x2

      - name: Checkout frozen V14.3z1 verified monster base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z1_SHA }}
          path: z1

      - name: Checkout frozen V14.3z3 current success
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z3_SHA }}
          path: z3

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake cmake curl ffmpeg freepats git imagemagick libtool make mm-common patch pkg-config python3 rake ruby timidity unzip wget xz-utils fonts-nanum

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.MKXP_SRC_REF }}
          path: engine

      - name: Cache engine dependencies
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-${{ runner.os }}-${{ env.EMSDK_VER }}-onig25b

      - name: Extract frozen run scripts
        run: |
          ruby -ryaml - <<'RB'
          base=YAML.load_file('baseline/.github/workflows/build-slknight-web.yml')
          x2=YAML.load_file('x2/.github/workflows/build-slknight-web.yml')
          z1=YAML.load_file('z1/.github/workflows/build-slknight-web.yml')
          z3=YAML.load_file('z3/.github/workflows/build-slknight-web.yml')

          base_steps=base.fetch('jobs').fetch('build').fetch('steps')
          x2_steps=x2.fetch('jobs').fetch('build').fetch('steps')
          z1_steps=z1.fetch('jobs').fetch('build').fetch('steps')
          z3_steps=z3.fetch('jobs').fetch('build').fetch('steps')

          base_wanted={
            'Patch engine'=>'/tmp/base_patch_engine.sh',
            'Build engine'=>'/tmp/base_build_engine.sh',
            'Install game'=>'/tmp/base_install_game.sh',
            'Patch game'=>'/tmp/base_patch_game.sh',
            'Convert media'=>'/tmp/base_convert_media.sh',
            'Build mappings'=>'/tmp/base_build_mappings.sh',
            'Patch browser'=>'/tmp/base_patch_browser.sh',
            'Verify package'=>'/tmp/base_verify.sh'
          }
          x2_wanted={
            'Patch native Lineage hold attack'=>'/tmp/x2_native_auto.sh'
          }
          z3_wanted={
            'Patch Gnoll Neruga Drake Kelberos'=>'/tmp/z3_delta.sh',
            'Patch native Lineage hold attack + full-speed auto'=>'/tmp/z3_auto.sh',
            'Preload verified attack and breath assets'=>'/tmp/z3_preload.sh',
            'Verify V14.3z3 package'=>'/tmp/z3_verify.sh'
          }

          base_wanted.each do |name,path|
            step=base_steps.find{|x|x['name']==name}
            abort "BASELINE STEP MISSING: #{name}" unless step&&step['run']
            File.write(path,step['run'])
          end
          x2_wanted.each do |name,path|
            step=x2_steps.find{|x|x['name']==name}
            abort "X2 STEP MISSING: #{name}" unless step&&step['run']
            File.write(path,step['run'])
          end

          step=z1_steps.find{|x|x['name']=='Patch verified monster attacks only'}
          abort 'Z1 monster patch missing' unless step&&step['run']
          File.write('/tmp/z1_monster_patch.sh',step['run'])

          z3_wanted.each do |name,path|
            step=z3_steps.find{|x|x['name']==name}
            abort "Z3 STEP MISSING: #{name}" unless step&&step['run']
            File.write(path,step['run'])
          end

          puts 'FROZEN_SCRIPTS_Z6_OK'
          RB

      - name: Remove unsupported Orc alias mappings from z1 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('/tmp/z1_monster_patch.sh')
          s=p.read_text()

          s=s.replace(
              "# No separate 두다마라/로바 attack sheet exists; both use the\n"
              "# user-verified generic 오크.png / 오크모션 set.\n",
              ""
          )

          for attack_id,next_id in ((857,859),(860,862)):
              pat=rf'(?ms)^[ \t]*{attack_id}=>\{{\n.*?^[ \t]*\}},\n(?=[ \t]*{next_id}=>\{{)'
              s,n=re.subn(pat,'',s,count=1)
              if n!=1:
                  raise SystemExit(f'failed to remove unsupported attack {attack_id}: {n}')

          for bad in ("857=>{","860=>{","label:'두다마라오크'","label:'로바오크'"):
              if bad in s:
                  raise SystemExit('unsupported Orc mapping remains: '+bad)

          p.write_text(s)
          print('Z1_ORC_ALIAS_MAPPING_REMOVED')
          PY

      - name: Add user-verified remaining 5 monster mappings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('/tmp/z1_monster_patch.sh')
          s=p.read_text()

          for attack_id in (852,866,867,871,872):
              if re.search(rf'(?m)^[ \t]*{attack_id}=>\{{',s):
                  raise SystemExit(f'remaining mapping already exists: {attack_id}')

          def insert_before_id(src, attack_id, body):
              pat=rf'(?m)^([ \t]*){attack_id}=>\{{'
              matches=list(re.finditer(pat,src))
              if len(matches)!=1:
                  raise SystemExit(f'insertion anchor {attack_id} count={len(matches)}')
              m=matches[0]
              indent=m.group(1)
              block='\n'.join(indent+line if line else '' for line in body.splitlines())+'\n'
              return src[:m.start()]+block+src[m.start():]

          hob="""852=>{
            label:'홉고블린',coord:'홉고블린',dirs:{
              8=>['홉고블린모션',[0,1,2,3,4,5,6],false],
              6=>['홉고블린모션',[7,8,9,10,11,12,13],false],
              2=>['홉고블린모션',[14,15,16,17,18,19,20],false],
              4=>['홉고블린모션',[7,8,9,10,11,12,13],true]
            }
          },"""
          s=insert_before_id(s,853,hob)

          rest="""866=>{
            label:'좀비엘모어장군',coord:'좀비 엘모어 장군',dirs:{
              8=>['좀비엘모어장군모션',[0,1,2,3,4,5,6,7,8],false],
              6=>['좀비엘모어장군모션',[10,11,12,13,14,15,16,17,18],false],
              4=>['좀비엘모어장군모션',[10,11,12,13,14,15,16,17,18],true]
            }
          },
          867=>{
            label:'좀비엘모어병사',coord:'좀비 엘모어 병사',dirs:{
              8=>['좀비엘모어병사모션',[0,1,2,3,4,5,6],false],
              6=>['좀비엘모어병사모션',[7,8,9,10,11,12,13],false],
              2=>['좀비엘모어병사모션',[14,15,16,17,18,19,20],false],
              4=>['좀비엘모어병사모션',[7,8,9,10,11,12,13],true]
            }
          },
          871=>{
            label:'해골근위병',coord:'해골 근위병',dirs:{
              2=>['해골근위병모션',[0,1,2,3,4,5],false],
              4=>['해골근위병모션',[6,7,8,9,10,11],false],
              8=>['해골근위병모션',[12,13,14,15],false],
              6=>['해골근위병모션',[16,17,18,19],false]
            }
          },
          872=>{
            label:'해골돌격병',coord:'해골 돌격병',dirs:{
              2=>['해골돌격병모션',[0,1,2,3,4],false],
              4=>['해골돌격병모션',[5,6,7,8,9],false],
              8=>['해골돌격병모션',[10,11,12,13],false],
              6=>['해골돌격병모션',[5,6,7,8,9],true]
            }
          },"""
          s=insert_before_id(s,876,rest)

          old='abort "verified direction missing attack=#{attack_id} dir=#{dir}" unless spec'
          if s.count(old)!=1:
              raise SystemExit(f'direction-required marker count={s.count(old)}')
          s=s.replace(old,'next unless spec',1)

          pat=r'(?m)^([ \t]*)ids=data\[:ids\][ \t]*$'
          matches=list(re.finditer(pat,s))
          if len(matches)!=1:
              raise SystemExit(f'ids=data marker count={len(matches)}')
          m=matches[0]
          indent=m.group(1)
          replacement=(
              indent+"ids=data[:ids]\n"+
              indent+"id_map=[2,4,6,8].select{|d|ids[d]}.map{|d|\"#{d}=>#{ids[d]}\"}.join(',')\n"+
              indent+'abort "verified direction map empty attack=#{attack_id}" if id_map.empty?'
          )
          s=s[:m.start()]+replacement+s[m.end():]

          old='"{2=>#{ids[2]},4=>#{ids[4]},6=>#{ids[6]},8=>#{ids[8]}},"'
          if s.count(old)!=1:
              raise SystemExit(f'hard-coded direction-map count={s.count(old)}')
          s=s.replace(old,'"{#{id_map}},"',1)

          checks=(
              "8=>['홉고블린모션',[0,1,2,3,4,5,6],false]",
              "6=>['홉고블린모션',[7,8,9,10,11,12,13],false]",
              "2=>['홉고블린모션',[14,15,16,17,18,19,20],false]",
              "4=>['홉고블린모션',[7,8,9,10,11,12,13],true]",
              "8=>['좀비엘모어장군모션',[0,1,2,3,4,5,6,7,8],false]",
              "6=>['좀비엘모어장군모션',[10,11,12,13,14,15,16,17,18],false]",
              "4=>['좀비엘모어장군모션',[10,11,12,13,14,15,16,17,18],true]",
              "8=>['좀비엘모어병사모션',[0,1,2,3,4,5,6],false]",
              "6=>['좀비엘모어병사모션',[7,8,9,10,11,12,13],false]",
              "2=>['좀비엘모어병사모션',[14,15,16,17,18,19,20],false]",
              "4=>['좀비엘모어병사모션',[7,8,9,10,11,12,13],true]",
              "2=>['해골근위병모션',[0,1,2,3,4,5],false]",
              "4=>['해골근위병모션',[6,7,8,9,10,11],false]",
              "8=>['해골근위병모션',[12,13,14,15],false]",
              "6=>['해골근위병모션',[16,17,18,19],false]",
              "2=>['해골돌격병모션',[0,1,2,3,4],false]",
              "4=>['해골돌격병모션',[5,6,7,8,9],false]",
              "8=>['해골돌격병모션',[10,11,12,13],false]",
              "6=>['해골돌격병모션',[5,6,7,8,9],true]"
          )
          for needle in checks:
              if needle not in s:
                  raise SystemExit('confirmed mapping missing: '+needle)

          if re.search(r"2=>\['좀비엘모어장군모션'",s):
              raise SystemExit('unexpected zombie general D2 attack mapping')

          p.write_text(s)
          print('REMAINING_5_VERIFIED_MAPPINGS_ADDED')
          PY

      - name: Retarget inherited z3 scripts to z6 counts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          delta=Path('/tmp/z3_delta.sh')
          s=delta.read_text()
          replacements={
              'test "$(wc -l < player/gameasync/sl_attack_sheets.txt)" -eq 21':'test "$(wc -l < player/gameasync/sl_attack_sheets.txt)" -eq 25',
              'test "$(wc -l < player/gameasync/sl_attack_coords.txt)" -eq 18':'test "$(wc -l < player/gameasync/sl_attack_coords.txt)" -eq 22',
              'test "$(wc -l < player/gameasync/sl_attack_verified_ids.txt)" -eq 19':'test "$(wc -l < player/gameasync/sl_attack_verified_ids.txt)" -eq 22'
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit('delta count marker missing: '+old)
              s=s.replace(old,new)
          delta.write_text(s)

          preload=Path('/tmp/z3_preload.sh')
          s=preload.read_text()
          for old,new in (
              ('expected=21','expected=25'),
              ('sheets.length==21','sheets.length==25'),
              ('expected=18','expected=22'),
              ('chars.length==18','chars.length==22'),
              ('V14.3z3','V14.3z6'),
              ('v143z3','v143z6'),
              ('Z3','Z6'),
              ('z3','z6')
          ):
              s=s.replace(old,new)
          preload.write_text(s)

          verify=Path('/tmp/z3_verify.sh')
          s=verify.read_text()
          for old,new in (
              ('-eq 21','-eq 25'),
              ('-eq 18','-eq 22'),
              ('-eq 19','-eq 22'),
              ('V14.3z3','V14.3z6'),
              ('v143z3','v143z6'),
              ('FINAL_VERIFY_Z3','FINAL_VERIFY_Z6'),
              ('final_z3_verify','final_z6_verify')
          ):
              s=s.replace(old,new)
          verify.write_text(s)

          print('Z6_INHERITED_SCRIPTS_RETARGETED')
          PY

      - name: Patch engine
        run: bash /tmp/base_patch_engine.sh

      - name: Build engine
        run: bash /tmp/base_build_engine.sh

      - name: Install game
        run: bash /tmp/base_install_game.sh

      - name: Snapshot pristine gameplay state
        run: |
          ruby - <<'RB'
          game='player/gameasync'
          ce=Dir.glob(File.join(game,'Data','*CommonEvents.rxdata')).max_by{|p|File.size(p)}
          items=Dir.glob(File.join(game,'Data','*Items.rxdata')).max_by{|p|File.size(p)}
          abort 'pristine CommonEvents missing' unless ce&&File.size(ce)>1000
          abort 'pristine Items missing' unless items&&File.size(items)>1000
          File.binwrite('/tmp/pristine_common_events.rxdata',File.binread(ce))
          File.binwrite('/tmp/pristine_items.rxdata',File.binread(items))
          puts "PRISTINE_GAMEPLAY_SNAPSHOT_OK ce=#{File.size(ce)} items=#{File.size(items)}"
          RB

      - name: Patch game from V14.3l
        run: bash /tmp/base_patch_game.sh

      - name: Rebuild independent green courage and transform state
        run: |
          cat > /tmp/rebuild_buff_state.rb <<'RB'
          # encoding: UTF-8
          game=ARGV.fetch(0)
          pristine_ce_path=ARGV.fetch(1)
          pristine_items_path=ARGV.fetch(2)

          class RawMarshalObject
            def self._load(data)
              o=allocate
              o.instance_variable_set(:@raw,data)
              o
            end
            def _dump(_depth); @raw; end
          end
          class Tone < RawMarshalObject; end
          class Color < RawMarshalObject; end
          class Rect < RawMarshalObject; end
          class Table < RawMarshalObject; end
          module RPG
            class AudioFile; end
            class Animation
              class Frame; end
              class Timing; end
            end
            class Map; end
            class CommonEvent; end
            class Event
              class Page
                class Condition; end
                class Graphic; end
              end
            end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
            class Item; end
          end

          def iv(o,n); o.instance_variable_get("@#{n}"); end
          def setiv(o,n,v); o.instance_variable_set("@#{n}",v); end
          def deep(o); Marshal.load(Marshal.dump(o)); end

          def cmd(code,indent=0,params=[])
            c=RPG::EventCommand.new
            setiv(c,:code,code)
            setiv(c,:indent,indent)
            setiv(c,:parameters,params)
            c
          end

          def move_route(indent,specs)
            route=RPG::MoveRoute.new
            setiv(route,:repeat,false)
            setiv(route,:skippable,false)
            move=[]
            specs.each do |code,params|
              m=RPG::MoveCommand.new
              setiv(m,:code,code)
              setiv(m,:parameters,params)
              move<<m
            end
            tail=RPG::MoveCommand.new
            setiv(tail,:code,0)
            setiv(tail,:parameters,[])
            setiv(route,:list,move+[tail])
            [cmd(209,indent,[-1,route])] + move.map{|m|cmd(509,indent,[m])}
          end

          def speed(indent,value)
            move_route(indent,[[29,[value]]])
          end

          def base_graphic(indent)
            # variable 48: 1=female, otherwise male. Keep graphic change isolated to real transform expiry.
            female=move_route(indent+1,[[41,['여기사',0,2,0]]])
            male=move_route(indent+1,[[41,['knight_men',0,2,0]]])
            out=[cmd(111,indent,[1,48,0,1,0])]
            out.concat(female)
            out<<cmd(0,indent+1,[])
            out<<cmd(411,indent,[])
            out.concat(male)
            out<<cmd(0,indent+1,[])
            out<<cmd(412,indent,[])
            out
          end

          def if_script(indent,expr,yes,no=nil)
            out=[cmd(111,indent,[12,expr])]
            out.concat(yes)
            out<<cmd(0,indent+1,[])
            if no
              out<<cmd(411,indent,[])
              out.concat(no)
              out<<cmd(0,indent+1,[])
            end
            out<<cmd(412,indent,[])
            out
          end

          def if_switch(indent,switch_id,yes,no=nil)
            out=[cmd(111,indent,[0,switch_id,0])]
            out.concat(yes)
            out<<cmd(0,indent+1,[])
            if no
              out<<cmd(411,indent,[])
              out.concat(no)
              out<<cmd(0,indent+1,[])
            end
            out<<cmd(412,indent,[])
            out
          end

          def if_item(indent,item_id,yes,no=nil)
            out=[cmd(111,indent,[8,item_id])]
            out.concat(yes)
            out<<cmd(0,indent+1,[])
            if no
              out<<cmd(411,indent,[])
              out.concat(no)
              out<<cmd(0,indent+1,[])
            end
            out<<cmd(412,indent,[])
            out
          end

          def effective_base_speed(indent,green_floor=false)
            # Transform speeds taken from the original CE6 branches.
            # Baphomet=5, Assassin=3, the other verified transforms=4, base knight=2.
            other='[311,58,189,264,265,390,627,628,629].any?{|i|$game_variables[i].to_i==1}'
            floor=green_floor ? 3 : 2
            third=if_script(
              indent+2,
              other,
              speed(indent+3,4),
              speed(indent+3,floor)
            )
            second=if_script(
              indent+1,
              '$game_variables[309].to_i==1',
              speed(indent+2,3),
              third
            )
            if_script(
              indent,
              '$game_variables[263].to_i==1',
              speed(indent+1,5),
              second
            )
          end

          def courage_speed(indent)
            second=if_script(
              indent+1,
              '$game_variables[309].to_i==1',
              speed(indent+2,3),
              speed(indent+2,4)
            )
            if_script(
              indent,
              '$game_variables[263].to_i==1',
              speed(indent+1,5),
              second
            )
          end

          def refresh_ui(indent=0)
            [
              cmd(355,indent,['Guage.show']),
              cmd(355,indent,['$KeyIcon.ShowIcon'])
            ]
          end

          ce_path=Dir.glob(File.join(game,'Data','*CommonEvents.rxdata')).max_by{|p|File.size(p)}
          items_path=Dir.glob(File.join(game,'Data','*Items.rxdata')).max_by{|p|File.size(p)}
          abort 'CommonEvents missing' unless ce_path&&File.size(ce_path)>1000
          abort 'Items missing' unless items_path&&File.size(items_path)>1000
          abort 'pristine CommonEvents missing' unless File.size?(pristine_ce_path)
          abort 'pristine Items missing' unless File.size?(pristine_items_path)

          current=Marshal.load(File.binread(ce_path))
          pristine=Marshal.load(File.binread(pristine_ce_path))
          items=Marshal.load(File.binread(items_path))
          pristine_items=Marshal.load(File.binread(pristine_items_path))

          [3,4,6,8,10,33,34,68,107].each do |id|
            abort "pristine CE missing #{id}" unless pristine[id]
          end
          [2,3,17,37].each do |id|
            abort "item missing #{id}" unless items[id]&&pristine_items[id]
          end

          # CE6 is transformation itself. Keep it exactly pristine; potion logic must not edit it.
          current[6]=deep(pristine[6])

          # CE3: normal green potion. It stacks/extends speed time without touching courage or transform.
          ce3=deep(pristine[3])
          normal_existing=(
            [cmd(122,2,[110,110,2,0,300])] +
            refresh_ui(2) +
            [cmd(207,2,[-1,2]),cmd(115,2,[])]
          )
          strong_existing=(
            [cmd(122,1,[110,110,2,0,300])] +
            refresh_ui(1) +
            [cmd(207,1,[-1,2]),cmd(115,1,[])]
          )
          new_normal=[
            cmd(122,0,[110,110,0,0,0]),
            cmd(121,0,[368,368,1]),
            cmd(121,0,[171,171,0]),
            cmd(355,0,['$메세지.set_text2("갑자기 빠르게 움직입니다.")'])
          ]
          new_normal.concat(
            if_script(0,'!$game_switches[172]',effective_base_speed(1,true))
          )
          new_normal.concat(refresh_ui(0))
          new_normal<<cmd(207,0,[-1,2])
          new_normal<<cmd(0,0,[])
          normal_branch=if_switch(1,171,normal_existing,new_normal.map{|c|deep(c)})
          ce3_list=if_switch(0,368,strong_existing,normal_branch)
          ce3_list<<cmd(0,0,[])
          setiv(ce3,:list,ce3_list)
          current[3]=ce3

          # CE33: enhanced green potion. Refresh/upgrade enhanced speed only; preserve courage and transform.
          ce33=deep(pristine[33])
          ce33_list=[
            cmd(121,0,[171,171,1]),
            cmd(121,0,[368,368,0]),
            cmd(122,0,[110,110,0,0,0]),
            cmd(355,0,['$메세지.set_text2("갑자기 빠르게 움직입니다.")'])
          ]
          ce33_list.concat(if_script(0,'!$game_switches[172]',effective_base_speed(1,true)))
          ce33_list.concat(refresh_ui(0))
          ce33_list<<cmd(207,0,[-1,2])
          ce33_list<<cmd(0,0,[])
          setiv(ce33,:list,ce33_list)
          current[33]=ce33

          # Shared courage activation body: item 3 is non-consumable in DB, so CE8 consumes it exactly once.
          def courage_start(indent,activate_normal_green=false)
            out=[]
            out<<cmd(126,indent,[3,1,0,1])
            if activate_normal_green
              out<<cmd(126,indent,[2,1,0,1])
              out<<cmd(122,indent,[110,110,0,0,0])
              out<<cmd(121,indent,[368,368,1])
              out<<cmd(121,indent,[171,171,0])
            end
            out<<cmd(122,indent,[109,109,0,0,0])
            out<<cmd(121,indent,[1001,1001,1])
            out<<cmd(121,indent,[172,172,0])
            out<<cmd(121,indent,[1002,1002,0])
            out<<cmd(355,indent,['a = "몸 속 깊은 곳에서 피가 끓어 오르는 것을 느낍니다."'])
            out<<cmd(655,indent,['$메세지.set_text2(a)'])
            out.concat(courage_speed(indent))
            out.concat(refresh_ui(indent))
            out<<cmd(207,indent,[-1,270])
            out<<cmd(117,indent,[589])
            out
          end

          # CE8: courage. Existing green/strong green is never consumed or disabled.
          ce8=deep(pristine[8])
          already=[
            cmd(126,1,[3,1,0,1]),
            cmd(122,1,[109,109,2,0,300])
          ] + refresh_ui(1) + [cmd(207,1,[-1,270]),cmd(117,1,[589]),cmd(115,1,[])]
          with_green=courage_start(2,false)+[cmd(115,2,[])]
          with_item=courage_start(3,true)+[cmd(115,3,[])]
          no_green=[cmd(355,3,['$메세지.set_text2("초록 물약이 부족하여 용기의 물약을 사용할 수 없습니다.")'])]
          need_green=if_item(2,2,with_item,no_green)
          green_or_strong=if_script(1,'$game_switches[171] || $game_switches[368]',with_green,need_green)
          ce8_list=if_switch(0,172,already,green_or_strong)
          ce8_list<<cmd(0,0,[])
          setiv(ce8,:list,ce8_list)
          current[8]=ce8

          # CE4: courage timer. Expiry ends courage only and recalculates speed from remaining green/transform state.
          ce4=deep(pristine[4])
          warn4=[
            cmd(355,1,['$BufTime = 1']),
            cmd(355,1,['$메세지.set_text2("***용기의 물약 해제 : 10초전***")']),
