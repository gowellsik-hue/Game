
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R74
# SOURCE: exactly deployed V229R73 game, NOT a whole-game rollback.
# REMOVE: R71-R73 ad hoc player passage/coordinate masks and wrappers.
# KEEP: R49's already successful 902 painted wall sprites and full original floor.
# FIX: reconstruct physical wall-base COLLISION LAYER from those R49 painted
# subrectangles and original Sanctuary S32 Layer3; cut back one source row.
# DO NOT MODIFY: foreground wall graphics, opacity, monster collision, spawns,
# stats/drops, movement controls, source S32 or unrelated game code.
# For player only: precomputed whole-floor 4-way collision layer; no runtime
# coordinate exceptions, wall sliding, aliases, or state machine.
name: build-slknight-web.yml | V229R74 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R74 Restore current R73 site without old rollback
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40209895586
          name: github-pages
          github-token: ${{ github.token }}
          path: r73
      - name: V229R74 Retrieve Sanctuary original Layer3 collision data
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39385472903
          name: Sanctuary-Map-V6.3-Native-Passage-and-Wall-Groups-Handoff
          github-token: ${{ github.token }}
          path: source
      - name: V229R74 Verify the current deployed game and extract R49 sprites
        shell: bash
        run: |
          set -euo pipefail
          test -s r73/artifact.tar
          mkdir -p site build
          tar -xf r73/artifact.tar -C site
          python3 - <<'PY_VERIFY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(files)==5517,('Wrong deployed file count',len(files))
          for name in ('index.html','knight/index.html'):
            assert 'V229R73' in (root/name).read_text('utf-8')
          engine=root/'knight/gameasync/Data/Scripts.rxdata'
          assert hashlib.sha256(engine.read_bytes()).hexdigest()== 'f34903e8a9699ae2a101a3346292e40784eb92d64b946e04955af220f34a0b41'
          manifest=json.loads(Path('source/handoff-manifest.json').read_text('utf-8'))
          assert manifest['version']=='V6.3' and manifest['state']=='INTEGRATION_HANDOFF_NOT_APPLIED'
          assert not manifest['SanctuaryExecutableRulesVerified']
          Path('build/source-hashes.json').write_text(json.dumps(files,sort_keys=True))
          print('PASS current R73 actual deployment, 5517 files, original S32 verified')
          PY_VERIFY
          ruby -rzlib -rdigest - <<'RB_EXTRACT'
          a=Marshal.load(File.binread('site/knight/gameasync/Data/Scripts.rxdata'))
          raise 'Unexpected 136-script game engine' unless a.size==136
          src=Zlib::Inflate.inflate(a[134][2]).force_encoding('UTF-8')
          raise 'Wrong current R73 source' unless Digest::SHA256.hexdigest(src)=='e30c55e0d25a2c74d472718ca0d1b7585855afd165ffe4adc06ebf29376aaf56'
          raise 'Missing original separated R49 walls' unless src.include?('def slti_r49_update_walls') && src.include?('SLTI_V229R49::PARTS')
          raise 'Wrong R73 hack to remove' unless src.include?('module SLTI_WallBase73')
          raise 'Monster collision missing' unless src.include?(%q{return false if other.x==nx && other.y==ny && other.character_name!=''})
          File.binwrite('build/r73-script134.rb',src)
          puts 'PASS actual original wall-paint data and current R73 script extracted'
          RB_EXTRACT
      - name: V229R74 Read exact R49 painted wall-piece bounds
        shell: bash
        run: |
          set -euo pipefail
          cat > build/extract_parts.rb <<'RB_PARTS'
          require 'json'
          s=File.binread(ARGV[0]).force_encoding('UTF-8')
          line=s.lines.find{|v| v.start_with?('  PARTS=')}
          raise 'Missing original painted R49 PARTS' if line==nil
          eval("module SLTI_V229R49\n"+line+"end\n")
          parts=SLTI_V229R49::PARTS
          raise 'No actual bounding boxes' unless parts.size>30
          File.binwrite(ARGV[1],JSON.generate(parts))
          puts "Original painted wall pieces #{parts.size} chunks / #{parts.values.sum(&:length)} subrectangles"
          RB_PARTS
          ruby build/extract_parts.rb build/r73-script134.rb build/r49-parts.json
      - name: V229R74 Shrink complete physical wall-base collision layer by one row
        shell: bash
        run: |
          set -euo pipefail
          cat > build/compile_wallbase.py <<'PY_WALL_BASE'
          from pathlib import Path
          import sys,struct,zlib,json,hashlib,base64,textwrap,collections

          # Use R49's ACTUAL painted bitmap subrectangles: not Layer4 guesses, Layer5,
          # screenshot-specific locations, or legacy R71/R73 passage masks.
          SITE=Path(sys.argv[1]); WORK=Path(sys.argv[2]); SOURCE=Path(sys.argv[3]); WORK.mkdir(parents=True,exist_ok=True)
          PARTS=json.loads((WORK/'r49-parts.json').read_text())
          ROOT=SITE/'knight/gameasync/Graphics/Panoramas'
          OX,OY=32576,32704
          WIDTH={45:256,46:320};HEIGHT=256
          STEP={2:(-1,1),4:(-1,-1),6:(1,1),8:(1,-1)}
          BIT={2:1,4:2,6:4,8:8};REV={2:8,4:6,6:4,8:2}

          class PaintedR49Wall:
           def __init__(self,mid):
            self.mid=mid;self.cached={};self.rects={}
            for k,v in PARTS.items():
             floor,cx,cy=map(int,k.split(':'))
             if floor!=mid:continue
             self.rects[cx,cy]={p[0]:p[1:] for p in v}
           def read(self,chunk):
            if chunk in self.cached:return self.cached[chunk]
            cx,cy=chunk
            if chunk not in self.rects:
             self.cached[chunk]=None;return None
            path=ROOT/f'SLTI_{self.mid}_W_C{cx}_{cy}.png'
            data=path.read_bytes()
            assert data[:8]==b'\x89PNG\r\n\x1a\n'
            pos=8;streams=[];w=h=None
            while pos<len(data):
             n=struct.unpack_from('>I',data,pos)[0]
             typ=data[pos+4:pos+8];chunkdata=data[pos+8:pos+8+n];pos+=n+12
             if typ==b'IHDR':
              w,h,depth,color,comp,fil,intl=struct.unpack('>IIBBBBB',chunkdata)
              assert (depth,color,comp,fil,intl)==(8,6,0,0,0),path
             if typ==b'IDAT':streams.append(chunkdata)
             if typ==b'IEND':break
            stride=w*4;raw=zlib.decompress(b''.join(streams)); assert len(raw)==h*(stride+1)
            prev=bytearray(stride);alpha=bytearray(w*h);pos=0
            for y in range(h):
             mode=raw[pos];pos+=1
             line=bytearray(raw[pos:pos+stride]);pos+=stride
             if mode==1:
              for i in range(4,stride):line[i]=(line[i]+line[i-4])&255
             elif mode==2:
              for i in range(stride):line[i]=(line[i]+prev[i])&255
             elif mode==3:
              for i in range(stride):line[i]=(line[i]+((line[i-4] if i>=4 else 0)+prev[i])//2)&255
             elif mode==4:
              for i in range(stride):
               a=line[i-4] if i>=4 else 0;b=prev[i];c=prev[i-4] if i>=4 else 0
               p=a+b-c
               da=abs(p-a);db=abs(p-b);dc=abs(p-c)
               choose=a if da<=db and da<=dc else b if db<=dc else c
               line[i]=(line[i]+choose)&255
             else:assert mode==0,(path,mode)
             alpha[y*w:(y+1)*w]=line[3::4]
             prev=line
            self.cached[chunk]=(w,h,alpha)
            return self.cached[chunk]
           def alpha(self,px,py):
            if px<0 or py<0:return 0
            cx,cy=px//512,py//512;rects=self.rects.get((cx,cy))
            if rects is None:return 0
            lx,ly=px%512,py%512
            id=(ly//64)*4+(lx//128)
            box=rects.get(id)
            if box is None:return 0
            bx0,by0,bx1,by1=box
            if lx%128<bx0 or lx%128>=bx1 or ly%64<by0 or ly%64>=by1:return 0
            im=self.read((cx,cy));assert im
            w,h,alpha=im
            if lx>=w or ly>=h:return 0
            return alpha[ly*w+lx]
           def painted_foot(self,px,py):
            # The already separated R49 wall image is the full visible wall/occlusion layer.
            # Overlap of real stone pixels at the destination's source foot, not a guessed
            # rectangular Layer4 object, identifies the rear-side wall BASE border.
            samples=((0,0),(0,-4),(0,4),(-4,0),(4,0),(0,-8),(0,8),(0,-12),(0,12),(-8,0),(8,0))
            return sum(self.alpha(px+dx,py+dy)>=96 for dx,dy in samples)>=2
           def continuous_face(self,a,b):
            px0,py0=a;px1,py1=b
            # Walk sideways only along one uninterrupted painted wall strip, never across
            # an alpha gap such as a door or interrupted wall.
            return all(self.alpha(int(px0+(px1-px0)*q/4),int(py0+(py1-py0)*q/4))>=90 for q in range(5))

          stats={};graphs={}
          for mid,w in WIDTH.items():
           layer=PaintedR49Wall(mid)
           fl=1 if mid==45 else 2
           source=SOURCE/f'native/floor-{fl}-4way.bin'
           raw=source.read_bytes()
           assert len(raw)==w*HEIGHT
           meta=json.loads((SOURCE/f'native/floor-{fl}-index.json').read_text())
           assert hashlib.sha256(raw).hexdigest()==meta['passageSHA256']
           def idx(x,y):
            if x<OX or y<OY or x>=OX+w or y>=OY+HEIGHT:return -1
            return (y-OY)*w+(x-OX)
           def val(x,y):
            i=idx(x,y)
            return raw[i] if i>=0 and raw[i]!=255 else 0
           def edge(x,y,dx,dy):
            a=val(x,y);b=val(x+dx,y+dy)
            if dx>0:p,q=8,4
            elif dx<0:p,q=4,8
            elif dy>0:p,q=2,1
            else:p,q=1,2
            return bool(a&p and b&q)
           def graph_path(x,y,d):
            dx,dy=STEP[d]
            return (edge(x,y,dx,0) and edge(x+dx,y,0,dy)) or (edge(x,y,0,dy) and edge(x,y+dy,dx,0))
           graph=bytearray(w*HEIGHT)
           for y in range(OY,OY+HEIGHT):
            for x in range(OX,OX+w):
             if not val(x,y):continue
             at=idx(x,y)
             for d in STEP:
              if graph_path(x,y,d):graph[at]|=BIT[d]
           original=graph[:]
           # Connected regions in existing graph: never join disconnected original rooms.
           roots=[-1]*len(graph);components=0
           for k,v in enumerate(original):
            if not val(OX+k%w,OY+k//w) or roots[k]>=0:continue
            stack=[k];roots[k]=components
            while stack:
             i=stack.pop();y,x=divmod(i,w);x+=OX;y+=OY
             for d,(dx,dy) in STEP.items():
              if not original[i]&BIT[d]:continue
              j=idx(x+dx,y+dy)
              assert j>=0
              if roots[j]<0:roots[j]=components;stack.append(j)
            components+=1
           # The wall/floor visual split is the real baseline. Only erode the rear-facing
           # base by ONE source row where the paint intersects an original blocked DOWN edge.
           entries=set();blocked=0
           for y in range(OY,OY+HEIGHT-1):
            for x in range(OX+1,OX+w):
             if not val(x,y) or val(x-1,y+1) or graph_path(x,y,2):continue
             blocked+=1
             px=12*(x+y)-784128;py=6*(y-x)+(378 if mid==45 else 762)
             if layer.painted_foot(px,py+12):entries.add((x,y))
           # Select a continuous single-row wall-base layer; R49's exact pixel subrects
           # determine it. Do not touch original floor S32 or any existing edges.
           lane=set((x-1,y+1) for x,y in entries)
           for x,y in list(lane):
            px=12*(x+y)-784128;py=6*(y-x)+(378 if mid==45 else 762)
            for dx,dy in [(-1,-1),(1,1)]:
             nx,ny=x+dx,y+dy
             if val(nx,ny) or idx(nx,ny)<0:continue
             px2=12*(nx+ny)-784128;py2=6*(ny-nx)+(378 if mid==45 else 762)
             if layer.painted_foot(px2,py2) and layer.continuous_face((px,py),(px2,py2)):
              lane.add((nx,ny))
           # Accumulate owner components: where rear-face strips touch two original areas,
           # do NOT create a shortcut through the wall.
           owners=collections.defaultdict(set)
           for x,y in entries:
            origroot=roots[idx(x,y)]
            assert origroot>=0
            owners[x-1,y+1].add(origroot)
           # Each lane cell used as a lateral neighbor borrows its nearest entrance root;
           # connections only enabled between cells of the SAME original accessible region.
           adj=collections.defaultdict(list)
           for x,y in lane:
            for dx,dy in [(-1,-1),(1,1)]:
             n=(x+dx,y+dy)
             if n not in lane:continue
             px=12*(x+y)-784128;py=6*(y-x)+(378 if mid==45 else 762)
             px2=12*(n[0]+n[1])-784128;py2=6*(n[1]-n[0])+(378 if mid==45 else 762)
             if layer.continuous_face((px,py),(px2,py2)):adj[x,y].append(n)
           # Assign lane nodes to original components without merging them.
           queue=collections.deque(owners)
           for n in list(queue):
            if len(owners[n])!=1:raise AssertionError(('two rooms meet at same original wall entry',mid,n,owners[n]))
           while queue:
            n=queue.popleft();c=next(iter(owners[n]))
            for m in adj[n]:
             if owners[m] and c not in owners[m]:continue
             if not owners[m]:owners[m].add(c);queue.append(m)
           lane=set(owners)
           def add(a,b,d):
            ia=idx(*a);ib=idx(*b)
            assert ia>=0 and ib>=0 and (b[0]-a[0],b[1]-a[1])==STEP[d],(a,b,d)
            graph[ia]|=BIT[d];graph[ib]|=BIT[REV[d]]
           for x,y in entries:
            dest=(x-1,y+1)
            assert dest in lane
            add((x,y),dest,2)
           for x,y in sorted(lane):
            n=(x-1,y-1)
            if n in lane and n in adj[x,y] and owners[n]==owners[x,y]:
             add((x,y),n,4)
           for i,(old,new) in enumerate(zip(original,graph)):
            assert (old & new)==old
            if old==new:continue
            x=OX+i%w;y=OY+i//w
            for d,(dx,dy) in STEP.items():
             if old&BIT[d] or not new&BIT[d]:continue
             dest=(x+dx,y+dy)
             j=idx(*dest)
             assert j>=0 and graph[j]&BIT[REV[d]]
             if d==2:assert (x,y) in entries and dest in lane
             elif d==8:assert (x,y) in lane and dest in entries
             elif d in [4,6]:assert (x,y) in lane and dest in lane
             else:assert False
           for a in lane:
            assert not(graph[idx(*a)]&BIT[2]),('wall FRONT breach',mid,a)
            assert val(*a)==0
           # Tests reference location only; no location-specific passage code.
           if mid==45:
            assert (32656,32815) in entries
            assert (32655,32816) in lane
            assert (graph[idx(32655,32816)]&BIT[4]) and (32654,32815) in lane
            assert (graph[idx(32654,32815)]&BIT[6])
            assert not graph[idx(32655,32816)]&BIT[2]
            assert not graph[idx(32654,32815)]&BIT[4]
           rows=bytearray((len(graph)+1)//2)
           for i,v in enumerate(graph):
            assert v<16
            rows[i//2]|=v<<(4 if i&1 else 0)
           graphs[mid]=base64.b64encode(rows).decode('ascii')
           stats[mid]={"r49_painted_parts":sum(len(PARTS[k]) for k in PARTS if k.startswith(f'{mid}:')),
            "original_down_blocked_edges":blocked,"painted_wall_rear_edges":len(entries),"one_row_wallbase_cells":len(lane),
            "source_graph_components":components,"new_rear_down_edges":sum(bool(graph[idx(x,y)]&BIT[2]) for x,y in entries),
            "new_lateral_connections":sum(bool(graph[idx(x,y)]&BIT[4]) for x,y in lane),
            "no_new_front_down_from_wallbase":True,
            "original_edges_all_preserved":True,
            "runtime_coordinate_exceptions":0,"map_native_data_hash":hashlib.sha256(raw).hexdigest(),
            "physical_painted_wall_layer":True,"native_client_collision_verified":False}
           print('LAYER',mid,stats[mid],flush=True)
           (WORK/f'wallbase-graph-{mid}.bin').write_bytes(graph)
          (WORK/'wallbase-audit.json').write_text(json.dumps(stats,indent=2))
          (WORK/'wallbase-graph.json').write_text(json.dumps(graphs))
          PY_WALL_BASE
          python3 build/compile_wallbase.py site build source
          python3 - <<'PY_STATS'
          import json
          r=json.load(open('build/wallbase-audit.json'))
          assert r['45']['r49_painted_parts']==315 and r['46']['r49_painted_parts']==587
          assert [r['45']['painted_wall_rear_edges'],r['46']['painted_wall_rear_edges']]==[1553,1910]
          assert [r['45']['one_row_wallbase_cells'],r['46']['one_row_wallbase_cells']]==[1880,2352]
          assert r['45']['no_new_front_down_from_wallbase'] and r['46']['no_new_front_down_from_wallbase']
          print('PASS entire 1F/2F R49 wallbase layer, no wall-front breakthrough')
          PY_STATS
      - name: V229R74 Remove R73 move hacks and install new collision layer
        shell: bash
        run: |
          set -euo pipefail
          cat > build/patch_runtime.py <<'PY_LAYER_PATCH'
          from pathlib import Path
          import sys,json,base64,textwrap,hashlib
          WORK=Path(sys.argv[1]);old=(WORK/'r73-script134.rb').read_text('utf-8')
          assert 'module SLTI_WallBase73' in old
          anchor='# V229R73: whole-map REAR WALL BASE COLLISION LAYER'
          assert old.count(anchor)==1
          clean=old[:old.index(anchor)].rstrip('\n')+'\n'
          swap1='''    if self==$game_player && SLTI_WallBase73.active?(mid)
                adjusted=SLTI_WallBase73.player_target(mid,@slti_native66_x,@slti_native66_y,dir)
                target=adjusted if adjusted!=nil
              end
          '''
          swap2='''      if self==$game_player && SLTI_WallBase73.active?(@slti_native66_map)
                  return SLTI_WallBase73.player_target(
                    @slti_native66_map,@slti_native66_x,@slti_native66_y,d)!=nil
                end
          '''
          assert clean.count(swap1)==1 and clean.count(swap2)==1
          clean=clean.replace(swap1,'',1).replace(swap2,'',1)
          expected='feab7e8b371105936838f0de99fc6ed80bd36791540dd6347460cee270355bf2'
          assert hashlib.sha256(clean.encode('utf-8')).hexdigest()==expected, 'R73 removal changed unknown original script content'
          assert 'module SLTI_V229R49' in clean and 'SLTI_V229R49::PARTS' in clean
          assert 'module SLTI_Native66' in clean and 'def slti_r49_update_walls' in clean
          assert 'module SLTI_Rear71' not in clean and 'module SLTI_WallBase73' not in clean
          assert clean.count("return false if other.x==nx && other.y==ny && other.character_name!=''")==1

          blob=json.loads((WORK/'wallbase-graph.json').read_text())
          assert set(blob)=={'45','46'}
          def ruby_encoded(s):
           return '[\n      '+',\n      '.join('"'+q+'"' for q in textwrap.wrap(s,120))+"\n    ].join.unpack('m')[0]"
          # Physically materialize a separate wall-base collision layer from R49's
          # painted wall parts at BUILD time. There are no coordinate-specific exceptions.
          layer='''  # R74: precomputed whole-floor physical wall-base collision layer, derived
            # from the ALREADY SEPARATED R49 painted foreground and original source S32.
            # One screen-row shallower wall BASE, retaining the full visual wall layer.
            # Bits per native pixel: DOWN=1 LEFT=2 RIGHT=4 UP=8.
            # Player uses this corrected physical base; monsters retain original S32.
            WALL_BASE74={45=>__45__,46=>__46__}
            def self.wall_base74_bits(mid,x,y)
              w=WIDTH[mid]
              return 0 if w==nil || x<ORIGIN_X || y<ORIGIN_Y ||
                x>=ORIGIN_X+w || y>=ORIGIN_Y+HEIGHT[mid]
              p=(y-ORIGIN_Y)*w+(x-ORIGIN_X)
              c=WALL_BASE74[mid][p/2,1]
              return 0 if c==nil
              v=c.unpack('C')[0]
              return (p%2==0 ? (v&15) : (v>>4))
            end
            def self.wall_base74_target(mid,x,y,dir)
              moves={2=>[-1,1],4=>[-1,-1],6=>[1,1],8=>[1,-1]}
              d=moves[dir]
              return nil if d==nil
              bit=(dir==2 ? 1 : dir==4 ? 2 : dir==6 ? 4 : 8)
              return nil if (wall_base74_bits(mid,x,y)&bit)==0
              return [x+d[0],y+d[1]]
            end
            def self.wall_base74_walkable?(mid,x,y)
              wall_base74_bits(mid,x,y)!=0 || value(mid,x,y)!=0
            end
          '''
          layer=layer.replace('__45__',ruby_encoded(blob['45'])).replace('__46__',ruby_encoded(blob['46']))
          anchor='  def self.active_map?(mid)'
          assert clean.count(anchor)==1
          s=clean.replace(anchor,layer+anchor,1)
          # Choose the physical collision-layer at the native path lookup; no event or
          # movement wrappers. Player sprite collision uses the same 4-way map everywhere.
          oldmethod='  def self.native_target(mid,x,y,dir)\n'
          newmethod='  def self.native_target(mid,x,y,dir,wall_base=false)\n    return wall_base74_target(mid,x,y,dir) if wall_base && [2,4,6,8].include?(dir)\n'
          assert s.count(oldmethod)==1
          s=s.replace(oldmethod,newmethod,1)
          needle='''    target=SLTI_Native66.native_target(mid,@slti_native66_x,@slti_native66_y,dir)
          '''
          assert s.count(needle)==1
          s=s.replace(needle,'''    target=SLTI_Native66.native_target(mid,@slti_native66_x,@slti_native66_y,dir,self==$game_player)
          ''',1)
          needle='''      return SLTI_Native66.native_target(
                  @slti_native66_map,@slti_native66_x,@slti_native66_y,d)!=nil
          '''
          assert s.count(needle)==1
          s=s.replace(needle,'''      return SLTI_Native66.native_target(
                  @slti_native66_map,@slti_native66_x,@slti_native66_y,d,self==$game_player)!=nil
          ''',1)
          # Important: while RGSS map passable? applies to unrelated events, keep it
          # unchanged. Player's own passable? uses the rebuilt full wall-base layer.
          assert s.count("return false if other.x==nx && other.y==ny && other.character_name!=''")==1
          assert s.count('def slti_native66_move(dir,turn=true)')==2
          assert 'def slti_r49_update_walls' in s
          assert 'SLTI_WallBase73' not in s and 'SLTI_Rear71' not in s
          assert 'return false unless dir==8' not in s
          assert len(s)>len(clean)
          (WORK/'r74-script134.rb').write_text(s,'utf-8')
          (WORK/'r73-clean.rb').write_text(clean,'utf-8')
          print('PASS original R49 visual wall and original S32 recovered; precompiled wall-base physical layer replaces faulty mask overrides; monster/event collision unchanged')
          PY_LAYER_PATCH
          python3 build/patch_runtime.py build
          ruby -c build/r74-script134.rb
      - name: V229R74 Test all four directions, wall blocking and monster invariants
        shell: bash
        run: |
          set -euo pipefail
          cat > build/test_layer.rb <<'RB_LAYER_TEST'
          work=ARGV.fetch(0)
          require 'digest'
          source=File.binread("#{work}/r74-script134.rb").force_encoding('UTF-8')
          old=File.binread("#{work}/r73-clean.rb").force_encoding('UTF-8')
          raise 'Bad source recovered' unless Digest::SHA256.hexdigest(old)=='feab7e8b371105936838f0de99fc6ed80bd36791540dd6347460cee270355bf2'
          raise 'Runtime Zlib unexpectedly loaded' if defined?(Zlib)
          pos=source.index('module SLTI_Native66')
          fin=source.index("\nclass Game_Character",pos)
          raise 'Cannot isolate module' unless pos && fin
          eval(source[pos...fin])
          raise 'Runtime Zlib dependency' if defined?(Zlib)
          class Game_Map
           attr_accessor :events,:map_id
           def initialize(mid);@map_id=mid;@events={};end
           def valid?(x,y);x>=0 && y>=0 && x<(@map_id==45 ? 288 : 336) && y<(@map_id==45 ? 144 : 168);end
          end
          class Game_Character
           attr_accessor :x,:y,:through,:character_name
           def initialize(mid,x,y)
            @slti_native66_map=mid;@slti_native66_x=x;@slti_native66_y=y
            @x,@y=SLTI_Native66.to_rgss(mid,x,y)
            @through=false;@character_name='knight'
           end
           def slti_native66_prepare;true;end
           def increase_steps;end
           def cell;[@slti_native66_x,@slti_native66_y];end
          end
          p0=source.index('  def slti_native66_move(dir,turn=true)',fin)
          p1=source.index('  alias slti_native66_original_down',p0)
          raise 'Cannot find movement body' unless p0 && p1
          Game_Character.class_eval(source[p0...p1])
          counts={}
          [45,46].each do |mid|
           w=SLTI_Native66::WIDTH[mid];h=SLTI_Native66::HEIGHT[mid]
           extra=0;lat=0;orig=0;blocked=0;reverse=0
           h.times do |iy|
            w.times do |ix|
             x,y=32576+ix,32704+iy
             [2,4,6,8].each do |d|
              olddest=SLTI_Native66.native_target(mid,x,y,d)
              newdest=SLTI_Native66.native_target(mid,x,y,d,true)
              raise 'Old edge removed' if olddest!=nil && newdest!=olddest
              next unless newdest!=nil && olddest==nil
              dx,dy={2=>[-1,1],4=>[-1,-1],6=>[1,1],8=>[1,-1]}[d]
              raise 'Wrong layer step' unless newdest==[x+dx,y+dy]
              back={2=>8,4=>6,6=>4,8=>2}[d]
              raise 'Non-reciprocal physical edge' unless SLTI_Native66.native_target(mid,*newdest,back,true)==[x,y]
              case d
              when 2
                raise 'Down further into FRONT wall' if SLTI_Native66.value(mid,x,y)==0
                raise 'No actual wall base' unless SLTI_Native66.value(mid,*newdest)==0
                extra+=1
              when 8
                raise 'UP return not from base' unless SLTI_Native66.value(mid,x,y)==0
                reverse+=1
              else
                raise 'Lateral wall crossing from original ground' unless SLTI_Native66.value(mid,x,y)==0 && SLTI_Native66.value(mid,*newdest)==0
                lat+=1
              end
             end
             if SLTI_Native66.value(mid,x,y)==0 && SLTI_Native66.wall_base74_bits(mid,x,y)!=0
               blocked+=1
               raise 'Wall-base DEEP penetration' if SLTI_Native66.native_target(mid,x,y,2,true)!=nil
             end
            end
           end
           raise 'No new wall-base edges' unless extra>1000 && blocked>extra && reverse==extra
           counts[mid]=[extra,blocked,lat]
           puts "PASS map #{mid}: #{extra} consistent rear steps, #{blocked} painted wall-base cells, #{lat} lateral edges, no forward penetration"
          end
          raise 'Wrong screenshot position' unless SLTI_Native66.native_target(45,32656,32815,2,true)==[32655,32816]
          raise 'LEFT missing' unless SLTI_Native66.native_target(45,32655,32816,4,true)==[32654,32815]
          raise 'Return right missing' unless SLTI_Native66.native_target(45,32654,32815,6,true)==[32655,32816]
          raise 'Return up missing' unless SLTI_Native66.native_target(45,32655,32816,8,true)==[32656,32815]
          raise '2nd down wall breach' if SLTI_Native66.native_target(45,32655,32816,2,true)!=nil
          puts 'PASS screenshot DOWN LEFT RIGHT UP and front wall remains blocked'
          $game_map=Game_Map.new(45);$game_player=Game_Character.new(45,32656,32815)
          raise 'Real player DOWN failed' unless $game_player.slti_native66_move(2) && $game_player.cell==[32655,32816]
          raise 'Real player LEFT failed' unless $game_player.slti_native66_move(4) && $game_player.cell==[32654,32815]
          raise 'Real player RIGHT failed' unless $game_player.slti_native66_move(6) && $game_player.cell==[32655,32816]
          raise 'Real player UP failed' unless $game_player.slti_native66_move(8) && $game_player.cell==[32656,32815]
          puts 'PASS player 4-way runtime simulation without Zlib'
          $game_player=Game_Character.new(45,32656,32815)
          blocker=Game_Character.new(45,32655,32816)
          $game_map.events={1=>blocker}
          raise 'Event/monster collision bypass' if $game_player.slti_native66_move(2)
          monster=Game_Character.new(45,32656,32815)
          raise 'Monster inherited player-only wall reduction' if monster.slti_native66_move(2)
          puts 'PASS monster original S32 and event collision preserved'
          raise 'Original R49 painted layer changed' unless source.include?('def slti_r49_update_walls')
          raise 'Movement wrapper returned' unless source.scan('def slti_native66_move(dir,turn=true)').size==2
          raise 'Old illegal hacks present' if source.include?('SLTI_Rear71') || source.include?('SLTI_WallBase73') || source.include?('slti_r71_rear_from')
          puts 'PASS original R49 rendering and no old runtime movement overrides'
          RB_LAYER_TEST
          ruby --disable-gems build/test_layer.rb build
      - name: V229R74 Repack only the wall-base layer and confirm untouched assets
        shell: bash
        run: |
          set -euo pipefail
          ruby -rzlib - <<'RB_PACK'
          path='site/knight/gameasync/Data/Scripts.rxdata'
          original=Marshal.load(File.binread(path))
          a=Marshal.load(File.binread(path))
          raise 'Wrong game script count' unless a.size==136
          old=Zlib::Inflate.inflate(a[134][2]).force_encoding('UTF-8')
          raise 'Unexpected original script in current site' unless old==File.binread('build/r73-script134.rb').force_encoding('UTF-8')
          repaired=File.binread('build/r74-script134.rb')
          raise 'Unapproved R71/R73 passage hack survived' if repaired.include?('module SLTI_Rear71') || repaired.include?('module SLTI_WallBase73')
          raise 'Missing new source-derived collision map' unless repaired.include?('WALL_BASE74')
          a[134][2]=Zlib::Deflate.deflate(repaired)
          raise 'Another engine script changed' unless a.each_index.all?{|i|i==134 || a[i]==original[i]}
          File.binwrite(path,Marshal.dump(a))
          again=Marshal.load(File.binread(path))
          raise 'Wall layer not persisted' unless Zlib::Inflate.inflate(again[134][2]).include?('WALL_BASE74')
          puts 'PASS one corrected game script / 135 untouched scripts, original R49 walls kept'
          RB_PACK
          python3 - <<'PY_PACKAGE'
          from pathlib import Path
          import hashlib,json,re
          root=Path('site');game=root/'knight/gameasync'
          mapping=game/'mapping.js'
          text=mapping.read_text('utf-8')
          md5=hashlib.md5((game/'Data/Scripts.rxdata').read_bytes()).hexdigest()
          text,count=re.subn(r'Data/Scripts\.rxdata\?h=[0-9a-f]{32}',lambda m:'Data/Scripts.rxdata?h='+md5,text)
          assert count==1, count
          mapping.write_text(text,encoding='utf-8')
          for name in ('index.html','knight/index.html'):
            path=root/name
            old=path.read_text('utf-8')
            assert 'V229R73' in old
            path.write_text(old.replace('V229R73','V229R74').replace('v229r73','v229r74'),encoding='utf-8')
          original=json.loads(Path('build/source-hashes.json').read_text('utf-8'))
          now={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(now)==5517 and original.keys()==now.keys()
          changes={x for x in original if original[x]!=now[x]}
          allowed={'index.html','knight/index.html','knight/gameasync/mapping.js','knight/gameasync/Data/Scripts.rxdata'}
          assert changes==allowed,('Unapproved item/monster/asset/map change',changes^allowed)
          print('PASS 5517 files preserved, only engine script + hash + two version labels changed')
          PY_PACKAGE
          node --check site/knight/gameasync/mapping.js

      - name: V229R74 Upload corrected original game to existing GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
