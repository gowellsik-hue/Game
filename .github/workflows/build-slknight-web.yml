
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R101
# BASE: successful V229R97 game, run 40326370483.
# ORIGINAL: Sanctuary V4.1 native S32 terrain sheets, run 39100619927.
# FIX: undo only V229R48's cv2.inpaint replacement of pixel RGB behind walls.
# Restore exact original source pixels (not new textures) in 17 Map45 + 28 Map46 C chunks.
# No C chunk deletion, no W edits, no paint, no new overlay, no alpha change.
# Keep R97 movement, monster animations, events, original S32 and D-pad byte-for-byte.
name: build-slknight-web.yml | V229R101 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R101 Restore verified R97 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40326370483
          name: github-pages
          github-token: ${{ github.token }}
          path: r97

      - name: V229R101 Fetch original Sanctuary S32 terrain sheets
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39100619927
          name: Sanctuary-TI-Dungeon-V4.1-Original-Terrain-Walk
          github-token: ${{ github.token }}
          path: original-ti

      - name: V229R101 Undo only the R48 artificial ground behind walls
        shell: bash
        run: |
          set -euo pipefail
          test -s r97/artifact.tar
          test -s original-ti/preview/terrain-walk-v4.1.html
          mkdir -p site build
          tar -xf r97/artifact.tar -C site
          python3 - <<'PY_CHECK'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          original={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in root.rglob('*') if p.is_file()}
          assert len(original)==5517, ('Wrong R97 count',len(original))
          expected={'knight/gameasync/Data/Scripts.rxdata':
                     '62b575db7e96c954d0076d20642208880b46e9ae481246390031ec0c10015534'}
          for name,sha in expected.items():
            assert original[name]==sha, ('Wrong original engine',name)
          for name in ('index.html','knight/index.html'):
            assert 'V229R97' in (root/name).read_text('utf-8')
          Path('build/baseline.json').write_text(json.dumps(original,sort_keys=True))
          print('PASS R97 original engine, pad, both native maps and all wall graphics')
          PY_CHECK

          python3 -m venv build/env
          build/env/bin/pip install --quiet --disable-pip-version-check pillow numpy
          build/env/bin/python - <<'PY_UNDO'
          from pathlib import Path
          import json,re,hashlib
          import numpy as np
          from PIL import Image

          src=Path('original-ti/preview')
          html=(src/'terrain-walk-v4.1.html').read_text('utf-8')
          data=json.loads(re.search(r'<script id="data" type="application/json">(.*?)</script>',html,re.S).group(1))
          pano=Path('site/knight/gameasync/Graphics/Panoramas')
          mapping_path=Path('site/knight/gameasync/mapping.js')
          mapping=mapping_path.read_text('utf-8')
          report={}
          for floor,mid,cols,rows,nexpected,pexpected in [
              ('1',45,9,5,17,1461666),('2',46,11,6,28,2209829)]:
            blocks=data[floor]['tiles']
            x0=min(t['x'] for t in blocks);y0=min(t['y'] for t in blocks)
            sw=max(t['x']+1536 for t in blocks)-x0
            sh=max(t['y']+768 for t in blocks)-y0
            assert (sw,sh)==((4608,2304) if mid==45 else (5376,2688))
            # Reassemble the pixel-perfect V4.1 map images from the native S32 sheets.
            full=Image.new('RGBA',(sw,sh))
            original_walls=Image.new('RGBA',(sw,sh))
            for tile in blocks:
              offset=(tile['x']-x0,tile['y']-y0)
              with Image.open(src/tile['src']) as im:
                full.alpha_composite(im.convert('RGBA'),offset)
              with Image.open(src/'baseline'/tile['src']) as im:
                original_walls.alpha_composite(im.convert('RGBA'),offset)
            original_pixels=np.asarray(full)
            wall_alpha=np.asarray(original_walls.getchannel('A'))
            changed=[];rgb_pixels=0
            for cy in range(rows):
              for cx in range(cols):
                yy=512*cy;xx=512*cx
                native=np.zeros((512,512,4),np.uint8)
                patch=original_pixels[yy:min(yy+512,sh),xx:min(xx+512,sw)]
                native[:patch.shape[0],:patch.shape[1]]=patch
                mask=np.zeros((512,512),bool)
                wall=wall_alpha[yy:min(yy+512,sh),xx:min(xx+512,sw)]>0
                mask[:wall.shape[0],:wall.shape[1]]=wall
                path=pano/f'SLTI_{mid}_C{cx}_{cy}.png'
                assert path.exists(),path
                with Image.open(path) as im: current=np.asarray(im.convert('RGBA'))
                # Verify R48's only artificial edit before changing any graphics.
                assert np.array_equal(current[:,:,3],native[:,:,3]), ('Original alpha changed',path.name)
                edited=np.any(current[:,:,:3]!=native[:,:,:3],axis=2)
                assert not np.any(edited&(~mask)), ('Unexpected source difference',path.name)
                n=int(edited.sum())
                if not n:continue
                # Undo the entire source-verified inpaint: original RGBA, no fill or approximation.
                Image.fromarray(native,'RGBA').save(path,compress_level=1)
                with Image.open(path) as verify:
                  assert np.array_equal(np.asarray(verify.convert('RGBA')),native)
                changed.append(path.name);rgb_pixels+=n

                # The renderer's MD5 query must reflect the original art, not cached R48.
                digest=hashlib.md5(path.read_bytes()).hexdigest()
                expr=rf'(Graphics/Panoramas/{re.escape(path.name)}\?h=)[0-9a-f]{{32}}'
                mapping,count=re.subn(expr,lambda m:m.group(1)+digest,mapping)
                assert count==1, ('Missing cache entry',path.name,count)
            assert len(changed)==nexpected and rgb_pixels==pexpected, (
              'Unexpected native source comparison',mid,len(changed),rgb_pixels)
            report[str(mid)]={'restored_original_C':changed,'removed_R48_inpaint_pixels':rgb_pixels}
            print('PASS map',mid,'removed R48-only inpaint:',len(changed),'C chunks /',rgb_pixels,'RGB pixels')
          mapping_path.write_text(mapping,encoding='utf-8')
          Path('build/undo-R48-audit.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          PY_UNDO

          python3 - <<'PY_VERSION'
          from pathlib import Path
          for name in ('index.html','knight/index.html'):
            path=Path('site')/name
            original=path.read_text('utf-8')
            assert 'V229R97' in original and 'V229R101' not in original
            path.write_text(original.replace('V229R97','V229R101')
                                    .replace('v229r97','v229r101'),encoding='utf-8')
          PY_VERSION
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/dpad.js

      - name: V229R101 Verify exact change set and intact native game
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before=json.loads(Path('build/baseline.json').read_text('utf-8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert len(after)==5517 and after.keys()==before.keys()
          changed={p for p in before if before[p]!=after[p]}
          stats=json.loads(Path('build/undo-R48-audit.json').read_text('utf-8'))
          allowed={'index.html','knight/index.html','knight/gameasync/mapping.js'}
          for mid in (45,46):
            allowed|={f'knight/gameasync/Graphics/Panoramas/{x}'
                      for x in stats[str(mid)]['restored_original_C']}
          assert changed==allowed, ('Unexpected changed files',changed^allowed)
          assert after['knight/gameasync/Data/Scripts.rxdata']==before['knight/gameasync/Data/Scripts.rxdata']
          assert after['knight/js/dpad.js']==before['knight/js/dpad.js']
          assert all('/SLTI_45_W_' not in x and '/SLTI_46_W_' not in x for x in changed)
          assert all('Map045.rxdata' not in x and 'Map046.rxdata' not in x for x in changed)
          print('PASS R48 inpaint removed only: 17+28 original C chunks and 3 cache/version files')
          print('PASS original S32, 1F/2F wall W, monster code, D-pad and events byte-identical')
          PY_VERIFY

      - name: V229R101 Publish source-verified floor without R48 inpaint
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
