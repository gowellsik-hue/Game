          end
          class Sprite
           attr_accessor :bitmap,:zoom_x,:zoom_y,:opacity,:x,:y,:z,:ox,:oy,:visible,:src_rect
           def initialize(vp)
            @bitmap=nil;@zoom_x=1;@zoom_y=1;@opacity=255;@visible=true
            @src_rect=Rect.new;@ox=0;@oy=0;@x=0;@y=0;@z=0;@disposed=false
           end
