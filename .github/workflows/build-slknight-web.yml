          rep('function installMap47Files(){','function installMap47Files(mid){')
          rep('if(map47FilesReady)return Promise.resolve();','if((mid===47&&map47FilesReady)||(mid===48&&map48FilesReady))return Promise.resolve();')
          rep("if(!map47Keys||map47Keys.length<290)throw new Error('Map047 manifest missing');","var mapKeys=mid===48?map48Keys:map47Keys;\n    if(!mapKeys||mapKeys.length<290)throw new Error('Map'+mid+' manifest missing');")
          rep('var keys=map47Keys.slice(), next=0, done=0;','var keys=mapKeys.slice(), next=0, done=0;')
          rep("'Missing Map047 mapping '+key","'Missing Map'+mid+' mapping '+key")
          rep("'Missing Map047 resource directory '+key","'Missing Map'+mid+' resource directory '+key")
          rep("'Missing staged Map047 bytes '+key","'Missing staged Map'+mid+' bytes '+key")
          rep("'Map047 image installation '+key+': '+err","'Map'+mid+' image installation '+key+': '+err")
          rep("label('Map 47 graphics installed '+done+'/'+keys.length);","label('Map '+mid+' graphics installed '+done+'/'+keys.length);")
          rep("display('Preparing all Map 47 graphics before movement\\n'+done+'/'+keys.length);","display('Preparing all Map '+mid+' graphics before movement\\n'+done+'/'+keys.length);")
          rep("if(done!==map47Keys.length)throw new Error('Map047 was not fully installed');","if(done!==mapKeys.length)throw new Error('Map'+mid+' was not fully installed');")
          rep('map47FilesReady=true;','if(mid===47)map47FilesReady=true;\n      else map48FilesReady=true;')
          rep("label('Map 47 graphics installed '+done+'/'+map47Keys.length);","label('Map '+mid+' graphics installed '+done+'/'+mapKeys.length);")
          rep('return mid===47 ? installMap47Files().then(function(){return result;}) : result;','return (mid===47||mid===48) ? installMap47Files(mid).then(function(){return result;}) : result;')
          rep('if(mid<1||mid>47)return nativeMapLoad.apply(self,args);','if(mid<1||mid>48)return nativeMapLoad.apply(self,args);')
