          cat > build/v211/region.py <<'V211_REGION_PY_EOF'
          # Shared Map048/049/050 region geometry. Masks come from the three re-extracted
          # HTMLs: a native 16px tile is in the region when >=50% of its pixels are drawn.
          from pathlib import Path
          import base64,zlib

          CONF={48:(1536,768,64854,8,5358),49:(1600,768,64600,0,10798),50:(768,416,66027,4,13058)}
          KEEP={48:450,49:346,50:208}
          TILES={48:401255,49:296924,50:177101}
          XORG,YORG,MAPW,MAPH=32448,32064,1856,1536
          BX0,BY0=XORG//64,YORG//64
          BX1,BY1=(XORG+MAPW)//64,(YORG+MAPH)//64

          def load_masks(path):
              out={}
              for line in Path(path).read_text('ascii').splitlines():
                  if not line.strip():continue
                  mid,coded=line.split(' ',1);mid=int(mid)
                  W,H=CONF[mid][:2]
                  packed=zlib.decompress(base64.b85decode(coded))
                  assert len(packed)==W*H//8,(mid,'mask size')
                  cells=bytearray(W*H)
                  for i in range(W*H):
                      if packed[i>>3]>>(i&7)&1:cells[i]=1
                  assert sum(cells)==TILES[mid],(mid,'mask tile count',sum(cells))
                  out[mid]=bytes(cells)
              assert sorted(out)==[48,49,50]
              return out

          def keep_chunks(mid,cells):
              W,H=CONF[mid][:2]
              keep=set()
              for ty in range(H):
                  row=cells[ty*W:(ty+1)*W]
                  if not any(row):continue
                  for gx in range(W//32):
                      if any(row[gx*32:(gx+1)*32]):keep.add((gx,ty//32))
              assert len(keep)==KEEP[mid],(mid,'kept chunk count',len(keep))
              return keep

          class Geometry:
              def __init__(self,mid,cells):
                  self.mid=mid
                  self.W,self.H,self.U,self.XS,self.YS=CONF[mid]
                  self.PW,self.PH=self.W*16,self.H*16
                  self.cells=cells
                  W,H=self.W,self.H
                  # Summed-area table over the tile mask for O(1) rectangle queries.
                  sat=[0]*((W+1)*(H+1))
                  for y in range(H):
                      run=0;base=y*W;o=(y+1)*(W+1);p=y*(W+1)
                      for x in range(W):
                          run+=cells[base+x]
                          sat[o+x+1]=sat[p+x+1]+run
                  self.sat=sat
              def fx(self,wx,wy):return 12*(wx+wy-self.U)+self.XS
              def fy(self,wx,wy):return 6*(wy-wx)+self.YS
              def tiles_on(self,x0,y0,x1,y1):
                  # Inclusive tile rectangle; clipped to the map.
                  W,H=self.W,self.H
                  if x1<0 or y1<0 or x0>=W or y0>=H:return 0
                  x0=max(x0,0);y0=max(y0,0);x1=min(x1,W-1);y1=min(y1,H-1)
                  s=self.sat;w=W+1
                  return s[(y1+1)*w+x1+1]-s[y0*w+x1+1]-s[(y1+1)*w+x0]+s[y0*w+x0]
              def rect_on(self,x,y,w,h):
                  # Pixel rectangle [x,x+w) x [y,y+h) touches any region tile?
                  return self.tiles_on(x//16,y//16,(x+w-1)//16,(y+h-1)//16)>0
              def block_needed(self,bx,by):
                  # Every native layer of a 64x64 source block is drawn inside the
                  # footprint of its cells (floor and Layer2/4 at half steps, Layer5 at
                  # cell origin, collision sampled within +-12/+-6 px). A 16px margin
                  # covers all of them. Blocks with no such footprint are never extracted.
                  wx0,wy0=bx*64,by*64
                  xs=[self.fx(wx0+a,wy0+b) for a,b in ((0,0),(63,0),(0,63),(63,63))]
                  ys=[self.fy(wx0+a,wy0+b) for a,b in ((0,0),(63,0),(0,63),(63,63))]
                  if not self.rect_on(min(xs)-16,min(ys)-16,max(xs)-min(xs)+56,max(ys)-min(ys)+44):
                      return False
                  for yy in range(64):
                      for xx in range(64):
                          x=self.fx(wx0+xx,wy0+yy);y=self.fy(wx0+xx,wy0+yy)
                          if self.rect_on(x-16,y-16,56,44):return True
                  return False

          def stem_of(bx,by):return f'{bx+0x7e00:04x}{by+0x7e00:04x}'
          def block_of(stem):return int(stem[:4],16)-0x7e00,int(stem[4:],16)-0x7e00
          V211_REGION_PY_EOF
          cat > build/v211/plan_blocks.py <<'V211_PLAN_EOF'
          from pathlib import Path
          import json,sys,time
          sys.path.insert(0,'build/v211')
          from region import *
          t=time.time()
          masks=load_masks('build/v211/masks.txt')
          plan={}
          for mid in (48,49,50):
              keep_chunks(mid,masks[mid])
              g=Geometry(mid,masks[mid])
              plan[mid]=sorted(stem_of(bx,by) for by in range(BY0,BY1) for bx in range(BX0,BX1) if g.block_needed(bx,by))
              print('PLAN map',mid,'source blocks needed',len(plan[mid]),'of',(BX1-BX0)*(BY1-BY0),flush=True)
          union=sorted(set().union(*plan.values()))
          Path('build/v211/needed-blocks.json').write_text(json.dumps({'union':union,**{str(k):v for k,v in plan.items()}}),'utf8')
          print('PLAN union',len(union),'blocks; seconds',round(time.time()-t,1))
          V211_PLAN_EOF
          .venv/bin/python build/v211/plan_blocks.py
      - name: Extract only source blocks inside the regions (audit-sanctuary-maps.yml extractor)
        shell: bash
        run: |
          set -euo pipefail
          cat > build/v211/prepare_extract.py <<'V211_PREPARE_EXTRACT_EOF'
          # Re-use audit-sanctuary-maps.yml V6.13 extractor unchanged except for one
          # filter: blocks with no footprint inside Map048/049/050 are never read,
          # decompressed or written.
          from pathlib import Path
          import hashlib,sys
          wf=Path('build/v211/audit-sanctuary-maps.yml').read_text('utf8')
          assert hashlib.sha256(wf.encode('utf8')).hexdigest()=='4b75fd504ec750d8f0cdde5e7c0f392b9653852f10d88209312b5808446d6683','audit extractor changed'
          head="          cat > /tmp/extract-original-map.py <<'PY'\n"
          tail="\n          PY\n"
          assert wf.count(head)==1
          body=wf.split(head,1)[1].split(tail,1)[0]
          src='\n'.join(l[10:] if l.startswith(' '*10) else l for l in body.split('\n'))
          assert src.startswith('import hashlib')
          def rep(old,new):
              global src
              assert src.count(old)==1,('extractor anchor',old[:80],src.count(old))
              src=src.replace(old,new)
          rep("assert len(selected) == len(available), 'Incomplete original map file selection'\n",
          """assert len(selected) == len(available), 'Incomplete original map file selection'
          NEEDED = set(json.loads(Path(os.environ['NEEDED_BLOCKS']).read_text('utf-8'))['union'])
          assert NEEDED and NEEDED <= set(stem_list) | set(missing), 'Region needs blocks outside original Map4'
          SKIPPED = sorted(set(stem_list) - NEEDED)
          stem_list = [stem for stem in stem_list if stem in NEEDED]
          selected = [(ext, rec) for ext, rec in selected if Path(rec['name']).stem.lower() in NEEDED]
          print('REGION SUBSET extract', len(stem_list), 'blocks', len(selected), 'files; never extracted', len(SKIPPED), 'blocks', flush=True)
          """)
          rep("    gameFilesModified=False,\n","    gameFilesModified=False,\n    regionSubset=True,\n    neverExtractedBlocks=SKIPPED,\n")
          Path('build/v211/extract_region_blocks.py').write_text(src,'utf8')
          compile(src,'extract_region_blocks.py','exec')
          print('PASS extractor prepared',len(src.splitlines()),'lines')
          V211_PREPARE_EXTRACT_EOF
          .venv/bin/python build/v211/prepare_extract.py
          mkdir -p volumes source
          MAP_ID=4 NEEDED_BLOCKS=build/v211/needed-blocks.json .venv/bin/python -u build/v211/extract_region_blocks.py
          rm -rf volumes
          mv source source-map4
          du -sh source-map4
      - name: Render region chunks only (no placeholder, no full canvas)
        shell: bash
        run: |
          set -euo pipefail
          cat > build/v211/render_region.py <<'V211_RENDER_EOF'
          # Map048/049/050 native renderer, region-only.
          # Same original decoder (v27 tile_bitmap), same layer order and same Layer5/collision
          # rules as the original full-canvas renderer, but nothing outside the HTML region is
          # decoded, drawn, cut away afterwards or written: only region chunks exist.
          from pathlib import Path
          from functools import lru_cache
          from PIL import Image,ImageChops
          import collections,hashlib,json,struct,sys,textwrap,time
          sys.path.insert(0,'build/v211')
          from region import *

          MID=int(sys.argv[1])
          masks=load_masks('build/v211/masks.txt')
          cells=masks[MID]
          G=Geometry(MID,cells)
          W,H,PW,PH=G.W,G.H,G.PW,G.PH
          KEEPSET=keep_chunks(MID,cells)
          ROOT=Path('source-map4')
          OUT=Path('build/v211');OUT.mkdir(parents=True,exist_ok=True)
          PANOS=Path('site/knight/gameasync/Graphics/Panoramas');PANOS.mkdir(parents=True,exist_ok=True)
          plan=json.loads((OUT/'needed-blocks.json').read_text('utf8'))
          NEED=set(plan[str(MID)])

          # ---- original decoder, taken verbatim from the V2.7 Map048 renderer source ----
          wf=(OUT/'v27-source.yml').read_text('utf8')
          head="          cat > build/v22/build_map048.py <<'V22_MAP48_SOURCE_EOF'\n"
          tail='\n          V22_MAP48_SOURCE_EOF'
          assert wf.count(head)==1
          orig=textwrap.dedent(wf.split(head,1)[1].split(tail,1)[0])
          a=orig.index('stats=collections.Counter()\n');b=orig.index('ground=Image.new(',a)
          decoder=orig[a:b]
          assert decoder.count('def tile_bitmap(tile,index):')==1 and '@lru_cache(maxsize=20000)' in decoder
          manifest=json.loads((ROOT/'manifest.json').read_text('utf-8'))
          assert manifest['originalMapId']==4 and manifest['regionSubset'] is True
          assert manifest['bounds']=={'x0':XORG,'y0':YORG,'x1Exclusive':XORG+MAPW,'y1Exclusive':YORG+MAPH}
          idx=(ROOT/'Tile.idx').read_bytes();pak=(ROOT/'Tile.pak').read_bytes()
          n=struct.unpack_from('<I',idx)[0]
          assert n==4958 and len(idx)==4+n*28
          files={}
          for i in range(n):
              p=4+i*28
              off=struct.unpack_from('<I',idx,p)[0]
              name=idx[p+4:p+24].split(b'\0')[0].decode('ascii','replace').lower()
              size=struct.unpack_from('<I',idx,p+24)[0]
              assert name not in files and off+size<=len(pak)
              files[name]=(off,size)
          source_files=collections.defaultdict(dict)
          for e in manifest['files']:
              p=ROOT/e['file']
              assert p.is_file() and p.stat().st_size==e['size']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==e['sha256'],('bad source hash',e['file'])
              if not e['file'].lower().endswith(('.s32','.seg')):continue
              stem=p.stem.lower();ext=p.suffix.lower()
              assert ext not in source_files[stem]
              source_files[stem][ext]=p
          assert set(source_files)<=set(plan['union'])
          SKIPPED=set(manifest['neverExtractedBlocks'])
          assert not SKIPPED&NEED,(MID,'needed block was not extracted')
          ns={'collections':collections,'lru_cache':lru_cache,'struct':struct,'Image':Image,'files':files,'pak':pak}
          exec(compile(decoder,'v27_tile_bitmap','exec'),ns)
          tile_bitmap=ns['tile_bitmap'];stats=ns['stats'];missing_tiles=ns['missing_tiles']

          # ---- region chunk canvases (only kept chunks are ever allocated) ----
          ground={}
          def chunk_ground(key):
              im=ground.get(key)
              if im is None:
                  im=Image.new('RGBA',(512,512),(0,0,0,255));ground[key]=im
              return im
          def draw(target,getter,bmp,x,y):
              for cy in range(y>>9,(y+11>>9)+1):
                  for cx in range(x>>9,(x+11>>9)+1):
                      if (cx,cy) in KEEPSET:getter(target,(cx,cy)).alpha_composite(bmp,(x-cx*512,y-cy*512))
          def ground_get(_,key):return chunk_ground(key)

          def on_canvas(x,y):return x<PW and y<PH and x+12>0 and y+12>0
          fx,fy=G.fx,G.fy
          upper_entries=[];bound={};size_lookup={};layer5=[];used=0
          start=time.time()
          for stem in sorted(NEED&set(source_files)):
              ext='.s32' if '.s32' in source_files[stem] else '.seg'
              raw=source_files[stem][ext].read_bytes();s32=(ext=='.s32')
              bx,by=block_of(stem);bx*=64;by*=64
              cols=128 if s32 else 64
              def xy(xx,yy,half=False):
                  wx=bx+(xx//2 if half else xx);wy=by+yy
                  return fx(wx,wy)+(12 if half and xx&1 else 0),fy(wx,wy)
              for other_ext,other_path in source_files[stem].items():
                  rd=other_path.read_bytes();is32=(other_ext=='.s32')
                  first=32768 if is32 else 16384
                  n2=struct.unpack_from('<H',rd,first)[0]
                  p=first+2+n2*(6 if is32 else 4)+4096*(4 if is32 else 2)
                  g=struct.unpack_from('<i',rd,p)[0];p+=4
                  assert 0<=g<=30000,(stem,'layer4 groups',g)
                  for i in range(g):
                      gid,num=struct.unpack_from('<hH',rd,p);p+=4+num*(7 if is32 else 5)
                  num5=struct.unpack_from('<i',rd,p)[0];p+=4+num5*5
                  assert 0<=num5<200000 and p<=len(rd),(stem,'native layer totals')
                  stats['source_files_verified']+=1
              for yy in range(64):
                  for xx in range(128):
                      index,tile=struct.unpack_from('<BH' if s32 else '<BB',raw,(4 if s32 else 2)*(yy*128+xx))
                      x,y=xy(xx,yy,True)
                      stats['floor_original']+=1
                      if not G.rect_on(x,y,12,12):continue
                      bmp=tile_bitmap(tile,index)
                      if bmp is not None:draw(None,ground_get,bmp,x,y);stats['floor_drawn']+=1
              p=64*cols*4
              n2=struct.unpack_from('<H',raw,p)[0];p+=2
              for i in range(n2):
                  if s32:xx,yy,index,tile,_=struct.unpack_from('<BBBHB',raw,p);p+=6
                  else:xx,yy,tile,index=struct.unpack_from('<BBBB',raw,p);p+=4
                  x,y=xy(xx,yy,True)
                  stats['layer2_original']+=1
                  if not G.rect_on(x,y,12,12):continue
                  bmp=tile_bitmap(tile,index)
                  if bmp is not None and not (MID==48 and 110<=tile<=168 and index==34):
                      draw(None,ground_get,bmp,x,y);stats['layer2_drawn']+=1
              p+=4096*(4 if s32 else 2)
              ngroups=struct.unpack_from('<i',raw,p)[0];p+=4
              for i in range(ngroups):
                  gid,num=struct.unpack_from('<hH',raw,p);p+=4
                  key=(stem,gid)
                  assert key not in size_lookup
                  size_lookup[key]=num
                  box=[PW,PH,-1,-1]
                  for j in range(num):
                      if s32:xx,yy,layer,index,tile,_=struct.unpack_from('<BBBBhB',raw,p);p+=7
                      else:xx,yy,layer,index,tile=struct.unpack_from('<BBBBB',raw,p);p+=5
                      stats['layer4_original']+=1
                      if tile<0:continue
                      x,y=xy(xx,yy,True)
                      if not on_canvas(x,y):continue
                      box[0]=min(x,box[0]);box[1]=min(y,box[1]);box[2]=max(x+12,box[2]);box[3]=max(y+12,box[3])
                      if G.rect_on(x,y,12,12):upper_entries.append((layer,x,y,tile,index))
                  if box[2]>box[0] and box[3]>box[1]:
                      bound[key]=[max(0,box[0]),max(0,box[1]),min(PW,box[2]),min(PH,box[3])]
              n5=struct.unpack_from('<i',raw,p)[0];p+=4
              for j in range(n5):
                  xx,yy,gid,typ=struct.unpack_from('<BBHB',raw,p+j*5)
                  x,y=xy(xx,yy,False)
                  gx=(x+8)//16;gy=(y+8)//16
                  if 0<=gx<W and 0<=gy<H and cells[gy*W+gx]:layer5.append((gx,gy,stem,gid,typ))
              used+=1
              if used%50==0:print('RENDER',MID,used,'blocks','floor',stats['floor_drawn'],'time',round(time.time()-start,1),flush=True)
          print('RENDER ground done',MID,'blocks',used,'seconds',round(time.time()-start,1),flush=True)
          assert set(ground)==KEEPSET,(MID,'region chunk without terrain',len(KEEPSET-set(ground)))

          # Pixel-exact edge of the region inside kept chunks: same black fill as the
          # original V2.9 renderer (ground.paste black where outside the river/region).
          def chunk_mask(key):
              cx,cy=key
              m=bytearray(32*32)
              for ty in range(32):
                  r=(cy*32+ty)*W+cx*32
                  m[ty*32:(ty+1)*32]=cells[r:r+32]
              return Image.frombytes('L',(32,32),bytes(255 if v else 0 for v in m)).resize((512,512),Image.Resampling.NEAREST)

          upper={}
          def upper_get(_,key):
              im=upper.get(key)
              if im is None:im=Image.new('RGBA',(512,512));upper[key]=im
              return im
          upper_entries.sort(key=lambda e:e[0])
          for layer,x,y,tile,index in upper_entries:
              bmp=tile_bitmap(tile,index)
              if bmp is not None:draw(None,upper_get,bmp,x,y);stats['layer4_drawn']+=1

          images=[];fg=[];gk=[]
          for gx,gy in sorted(KEEPSET,key=lambda k:(k[1],k[0])):
              m=chunk_mask((gx,gy))
              im=ground.pop((gx,gy))
              im.paste((0,0,0,255),mask=ImageChops.invert(m))
              name=f'SLTI_{MID}_C{gx}_{gy}.png'
              im.convert('RGB').save(PANOS/name,optimize=True);images.append(name);gk.append([gx,gy])
              up=upper.pop((gx,gy),None)
              if up is not None:
                  up.putalpha(ImageChops.multiply(up.getchannel('A'),m))
                  if up.getbbox():
                      name=f'SLTI_{MID}_L4_C{gx}_{gy}.png'
                      up.save(PANOS/name,optimize=True);images.append(name);fg.append([gx,gy])
          assert not upper or all(k in KEEPSET for k in upper)

          refs={(stem,gid) for gx,gy,stem,gid,typ in layer5 if (stem,gid) in bound}
          ordered=sorted(refs)
          assert len(ordered)<65535
          serial={key:i+1 for i,key in enumerate(ordered)}
          boxes=[[0,0,0,0]]+[bound[key] for key in ordered]
          groups=[0]*(W*H);weights=[-1]*(W*H)
          for gx,gy,stem,gid,typ in layer5:
              key=(stem,gid)
              if key not in serial:continue
              c=gy*W+gx;score=size_lookup[key]
              if score>weights[c]:groups[c]=serial[key];weights[c]=score
          assert any(groups),'Source layer5 groups missing'
          atlas=Image.new('RGB',(W,H));atlas.putdata([(v&255,(v>>8)&255,0) for v in groups])
          atlas.save(PANOS/f'SLTI_{MID}_GID.png',optimize=True);images.append(f'SLTI_{MID}_GID.png')
          hexb=''.join(''.join(f'{c:04x}' for c in box) for box in boxes)
          (OUT/f'map{MID}-group-bounds.hex').write_text(hexb,'ascii')
          (OUT/f'map{MID}-foreground-keys.json').write_text(json.dumps(fg,separators=(',',':')),'utf8')
          (OUT/f'map{MID}-ground-keys.json').write_text(json.dumps(gk,separators=(',',':')),'utf8')
          (OUT/f'map{MID}-generated-files.json').write_text(json.dumps(images,separators=(',',':')),'utf8')

          rawattr=(ROOT/'layer3-attr1-u16le.bin').read_bytes()
          coverage=(ROOT/'original-cell-coverage.bin').read_bytes()
          assert len(rawattr)==2*MAPW*MAPH and len(coverage)==MAPW*MAPH
          walk=bytearray(W*H*2);land=passed=blocked=uncovered=0
          for ty in range(H):
              for tx in range(W):
                  val=385
                  if cells[ty*W+tx]:
                      px,py=tx*16+8,ty*16+8
                      u=G.U+(px-G.XS)/12;v=(py-G.YS)/6
                      wx=round((u-v)/2);wy=round((u+v)/2)
                      sx=wx-XORG;sy=wy-YORG;i=sy*MAPW+sx
                      if 0<=sx<MAPW and 0<=sy<MAPH and coverage[i]:
                          attr=struct.unpack_from('<H',rawattr,i*2)[0]
                          val=384 if attr&1==0 else 385;land+=1
                          passed+=(val==384);blocked+=(val==385)
                      else:
                          uncovered+=1
                          assert stem_of(wx//64,wy//64) not in SKIPPED,(MID,'region cell in never-extracted block',wx,wy)
                  struct.pack_into('<H',walk,2*(ty*W+tx),val)
          assert passed>0 and blocked>0
          (OUT/f'map{MID}-full-walk.bin').write_bytes(walk)
          report=dict(map=MID,stats=dict(stats),sourceBlocksUsed=used,regionTiles=TILES[MID],groundChunks=len(gk),
              gridChunks=W//32*H//32,neverRenderedChunks=W//32*H//32-len(gk),upper=len(fg),layer5Groups=len(ordered),
              collisionLand=land,collisionPassable=passed,collisionBlocked=blocked,collisionUncovered=uncovered,
              missingTileFrames=len(missing_tiles),seconds=round(time.time()-start,1))
          (OUT/f'map{MID}-build-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=1),'utf8')
          print('PASS map%03d'%MID,json.dumps(report,ensure_ascii=False),flush=True)
          V211_RENDER_EOF
          .venv/bin/python - <<'V211_REMOVE_OLD_TERRAIN'
          from pathlib import Path
          pano=Path('site/knight/gameasync/Graphics/Panoramas')
          for mid,expected in ((48,1530),(49,1885)):
              old=list(pano.glob(f'SLTI_{mid}_*.png'))
              assert len(old)==expected,(mid,'V2.9 images changed',len(old))
              for p in old:p.unlink()
          assert not list(pano.glob('SLTI_50_*.png'))
          print('PASS V2.9 full-grid Map048/049 PNGs removed before region render')
          V211_REMOVE_OLD_TERRAIN
          for MID in 48 49 50; do
            .venv/bin/python -u build/v211/render_region.py "$MID"
          done
      - name: Replace 48 49 collision, re-home bridges into Map048, register Map050 and Oren
        shell: bash
        run: |
          set -euo pipefail
          cat > build/v211/apply_native_map_data.rb <<'V211_APPLY_MAP_DATA_EOF'
          # encoding: UTF-8
          module RPG
            class Map;end
            class Event;end
            class Event::Page;end
            class Event::Page::Condition;end
            class Event::Page::Graphic;end
            class EventCommand;end
            class MoveCommand;end
            class MoveRoute;end
            class AudioFile;end
            class MapInfo;end
          end
          class Table
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(depth);@raw;end
          end
          class Tone
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(depth);@raw;end
          end
          class Color
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(depth);@raw;end
          end

          data='site/knight/gameasync/Data'
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          path=lambda{|name|File.join(data,prefix+name+'.rxdata')}
          files={48=>path.call('Map048'),49=>path.call('Map049'),50=>path.call('Map050')}
          infos_path=path.call('MapInfos')
          npc_path=path.call('Map029')
          raise 'Map050 exists in V2.9' if File.exist?(files[50])
          original={}
          [48,49].each{|mid|original[mid]=File.binread(files[mid])}
          old_infos=File.binread(infos_path)
          old_npc=File.binread(npc_path)
          infos=Marshal.load(old_infos)
          raise 'Original MapInfo keys missing' unless infos.key?(48)&&infos.key?(49)&&!infos.key?(50)

          def ivar(o,k);o.instance_variable_get(:"@#{k}");end
          def setv(o,k,v);o.instance_variable_set(:"@#{k}",v);end
          def make_command(code,indent,parameters)
            c=RPG::EventCommand.allocate
            setv(c,'code',code);setv(c,'indent',indent);setv(c,'parameters',parameters)
            c
          end

          maps={}
          [48,49].each do |mid|
            map=Marshal.load(original[mid])
            w,h={48=>[1536,768],49=>[1600,768]}[mid]
            raise "Unexpected Map#{mid} size" unless [ivar(map,'width'),ivar(map,'height')]==[w,h]
            raise "Map#{mid} original bridges changed" unless ivar(map,'events').keys.sort==[1,2,3,4]
            maps[mid]=map
          end
          maps[50]=Marshal.load(original[49])
          setv(maps[50],'events',{})

          walks={}
          {48=>[1536,768],49=>[1600,768],50=>[768,416]}.each do |mid,(w,h)|
            walk=File.binread("build/v211/map#{mid}-full-walk.bin")
            raise "Unexpected Map#{mid} collision length" unless walk.bytesize==w*h*2
            raise "Unexpected Map#{mid} collision values" unless walk.unpack('v*').all?{|v|v==384||v==385}
            walks[mid]=walk.dup
          end

          # V2.9 crossings: Map048 (x48,y48) <-> Map049 (x49,y49). The re-extracted Map049
          # no longer contains the far bank; both banks are inside Map048. Map049 tile =
          # Map048 tile + (190,340) exactly (same 16px native grid), so each crossing becomes
          # a Map048-internal transfer to the same original world position.
          DX,DY=190,340
          crossings=[[703,277,893,598],[704,277,894,598],[1381,385,1571,706],[1382,385,1572,706]]
          def open_walk(walk,w,x,y)
            walk.setbyte(2*(y*w+x),0x80);walk.setbyte(2*(y*w+x)+1,0x01)
          end
          m48=maps[48];m49=maps[49]
          ev48=ivar(m48,'events');ev49=ivar(m49,'events')
          crossings.each_with_index do |(x48,y48,x49,y49),i|
            e=ev48[i+1]
            raise 'Map048 bridge position changed' unless [ivar(e,'x'),ivar(e,'y')]==[x48,y48]
            list=ivar(ivar(e,'pages')[0],'list')
            t=list.select{|c|ivar(c,'code')==201}
            raise 'Map048 bridge command changed' unless t.size==1 && ivar(t[0],'parameters')[0,4]==[0,49,x49,y49-1]
            ivar(t[0],'parameters')[1]=48
            ivar(t[0],'parameters')[2]=x49-DX
            ivar(t[0],'parameters')[3]=y49-1-DY
            r=ev49[i+1]
            raise 'Map049 bridge position changed' unless [ivar(r,'x'),ivar(r,'y')]==[x49,y49]
            rl=ivar(ivar(r,'pages')[0],'list').select{|c|ivar(c,'code')==201}
            raise 'Map049 bridge command changed' unless rl.size==1 && ivar(rl[0],'parameters')[0,4]==[0,48,x48,y48+1]
            back=Marshal.load(Marshal.dump(r))
            setv(back,'id',5+i);setv(back,'x',x49-DX);setv(back,'y',y49-DY)
            setv(back,'name','Map048 Bridge Return')
            setv(e,'name','Map048 Bridge')
            ev48[5+i]=back
            [[x48,y48],[x48,y48+1],[x49-DX,y49-DY],[x49-DX,y49-1-DY]].each{|x,y|open_walk(walks[48],1536,x,y)}
          end
          setv(m49,'events',{})
          puts 'BRIDGE Map048 now holds both banks: 4 crossing + 4 return events; Map049 bridge events removed'

          {48=>[1536,768],49=>[1600,768],50=>[768,416]}.each do |mid,(w,h)|
            map=maps[mid]
            setv(map,'width',w);setv(map,'height',h)
            ivar(map,'data').instance_variable_set(:@raw,[3,w,h,3,3*w*h].pack('V5')+walks[mid]+("\0"*(4*w*h)))
            File.binwrite(files[mid],Marshal.dump(map))
            raise "Map#{mid} differs after saving" unless ivar(Marshal.load(File.binread(files[mid])),'width')==w
          end

          info=Marshal.load(Marshal.dump(infos.fetch(49)))
          setv(info,'name','오렌');setv(info,'order',50)
          infos[50]=info
          File.binwrite(infos_path,Marshal.dump(infos))
          raise 'MapInfos mismatch' unless Marshal.load(File.binread(infos_path)).keys.sort==infos.keys.sort

          npc=Marshal.load(old_npc)
          events=ivar(npc,'events')
          raise 'Teleport NPC missing' unless events.key?(11)
          event=events[11]
          raise 'Teleport NPC position changed' unless [ivar(event,'x'),ivar(event,'y')]==[70,48]
          page=ivar(event,'pages').first
          list=ivar(page,'list')
          choice=list.select{|c|ivar(c,'code')==102}
          raise 'Unexpected teleport menu count' unless choice.size==1
          root=ivar(choice.first,'indent')
          opts=ivar(choice.first,'parameters')
          raise 'V2.9 teleport options changed' unless
            opts.is_a?(Array)&&opts[0].size==12 && opts[0].last=='오크숲' && opts[1]==13 &&
            list.count{|c|ivar(c,'code')==201}==12

          w50,h50=768,416
          land=nil
          (0...w50*h50).each do |idx|
            next unless walks[50].byteslice(idx*2,2).unpack1('v')==384
            x,y=idx%w50,idx/w50
            candidate=[(x-w50/2).abs+(y-h50/2).abs,y,x]
            land=[candidate,x,y] if !land || (candidate<=>land[0])==-1
          end
          raise 'No original Oren passable tile' unless land
          orenx,oreny=land[1],land[2]
          cancel_idx=list.index{|c|ivar(c,'code')==403 && ivar(c,'indent')==root}
          raise 'V2.9 teleport cancel branch missing' unless cancel_idx
          opts[0] << '오렌'
          list.insert(cancel_idx,
            make_command(402,root,[12,'오렌']),
            make_command(201,root+1,[0,50,orenx,oreny,0,1]),
            make_command(0,root+1,[]))
          raise 'Teleport choice count not 13' unless
            opts[0].size==13 && list.count{|c|ivar(c,'code')==201}==13 && list.count{|c|ivar(c,'code')==402}==13
          File.binwrite(npc_path,Marshal.dump(npc))
          raise 'Other NPC event mutated' unless
            Marshal.load(old_npc).instance_variable_get(:@events).all?{|id,e|
              id==11 || Marshal.dump(e)==Marshal.dump(ivar(Marshal.load(File.binread(npc_path)),'events')[id])}
          puts "PASS Map048/049/050 collision from region-only render; Map050 registered"
          puts "PASS thirteen teleport destinations; Oren landing #{orenx},#{oreny}"
          V211_APPLY_MAP_DATA_EOF
          ruby -c build/v211/apply_native_map_data.rb
          ruby build/v211/apply_native_map_data.rb
      - name: Native renderer requests region chunks only; Map048/049 tables replaced; Map050 added
        shell: bash
        run: |
          set -euo pipefail
          cat > build/v211/patch_native_scripts.rb <<'V211_PATCH_SCRIPTS_EOF'
          # encoding: UTF-8
          require 'json'
          require 'zlib'
          file='site/knight/gameasync/Data/Scripts.rxdata'
          rows=Marshal.load(File.binread(file))
          raise 'Unexpected RGSS count' unless rows.size==137
          original=rows.map{|r|r.dup}

          def replace_once(s,old,new)
            raise "Missing/duplicate RGSS expression: #{old[0,110]}" unless s.scan(old).size==1
            s.sub(old){new}
          end
          def replace_regex_once(s,re,new,label)
            raise "Missing/duplicate RGSS block #{label}: #{s.scan(re).size}" unless s.scan(re).size==1
            s.sub(re){new}
          end
          def patch_named(rows,name)
            matches=rows.select{|r|r.is_a?(Array)&&r[1].to_s.dup.force_encoding('UTF-8')==name}
            raise "Missing or duplicate RGSS script #{name}" unless matches.size==1
            row=matches.first
            src=Zlib::Inflate.inflate(row[2]).force_encoding('UTF-8')
            raise "Invalid UTF-8 #{name}" unless src.valid_encoding?
            nl=src.include?("\r\n") ? "\r\n" : "\n"
            src=src.gsub("\r\n","\n")
            dst=yield src
            RubyVM::InstructionSequence.compile(dst)
            row[2]=Zlib::Deflate.deflate(dst.gsub("\n",nl).b)
          end
          def chunk_bits(keys,cols,rows)
            bits=Array.new(cols*rows,0)
            keys.each{|x,y| raise 'ground key outside grid' unless x.between?(0,cols-1)&&y.between?(0,rows-1); bits[y*cols+x]=1}
            bits.each_slice(4).map{|q|(q[0]|(q[1]||0)<<1|(q[2]||0)<<2|(q[3]||0)<<3).to_s(16)}.join
          end
          grid={48=>[48,24],49=>[50,24],50=>[24,13]}
          expected_keep={48=>450,49=>346,50=>208}
          ground={};upper={};bounds={}
          [48,49,50].each do |mid|
            ground[mid]=JSON.parse(File.read("build/v211/map#{mid}-ground-keys.json"))
            upper[mid]=JSON.parse(File.read("build/v211/map#{mid}-foreground-keys.json"))
            bounds[mid]=File.read("build/v211/map#{mid}-group-bounds.hex").strip
            raise "Map#{mid} ground keys" unless ground[mid].size==expected_keep[mid]
            raise "Map#{mid} upper keys outside region" unless (upper[mid]-ground[mid]).empty?
            raise "Map#{mid} bounds invalid" unless bounds[mid].match?(/\A[0-9a-f]+\z/) && bounds[mid].length%16==0 && bounds[mid].length>16
          end
          quoted=lambda{|hex|hex.scan(/.{1,30000}/).map{|p|"'#{p}'"}.join(" \\\n    ")}

          # Original terrain window loader: a chunk outside the HTML region is never in
          # the visible set, never prefetched and never requested from the filesystem.
          patch_named(rows,'해상도') do |s|
            s=replace_once(s,
              '@slti_floor = ([47,48,49].include?($game_map.map_id)) ? $game_map.map_id : nil',
              '@slti_floor = ([47,48,49,50].include?($game_map.map_id)) ? $game_map.map_id : nil')
            s=replace_once(s,
              '@slti_floor == 49 ? 50 : (@slti_floor == 48 ? 48 : (@slti_floor == 47 ? 24 : 0))',
              '@slti_floor == 50 ? 24 : (@slti_floor == 49 ? 50 : (@slti_floor == 48 ? 48 : (@slti_floor == 47 ? 24 : 0)))')
            s=replace_once(s,
              '(@slti_floor == 48 || @slti_floor == 49) ? 24 : (@slti_floor == 47 ? 12 : 0)',
              '@slti_floor == 50 ? 13 : ((@slti_floor == 48 || @slti_floor == 49) ? 24 : (@slti_floor == 47 ? 12 : 0))')
            s=replace_once(s,
              '([48,49].include?(@map_id)) ? width : $WINDOW_WIDTH',
              '([48,49,50].include?(@map_id)) ? width : $WINDOW_WIDTH')
            s=replace_once(s,
              '([48,49].include?(@map_id)) ? height : $WINDOW_HEIGHT',
              '([48,49,50].include?(@map_id)) ? height : $WINDOW_HEIGHT')
            s=replace_once(s,
              '(left..right).each{|x|required[[x,y]]=true}',
              '(left..right).each{|x|required[[x,y]]=true if SLNativeLayerV241.ground_chunk?(@slti_floor,x,y)}')
            prefetch='next if required.has_key?(candidate)'
            raise 'Unexpected prefetch guard count' if s.scan(prefetch).size>1
            if s.scan(prefetch).size==1
              s=replace_once(s,prefetch,prefetch+"\n          next unless SLNativeLayerV241.ground_chunk?(@slti_floor,cx,cy)")
            end
            raise 'Region ground filter missing' unless s.include?('SLNativeLayerV241.ground_chunk?(@slti_floor,x,y)')
            s
          end

          patch_named(rows,'SLNativeLayerV241') do |s|
            [48,49].each do |mid|
              s=replace_regex_once(s,/^  GROUP_BOUNDS_#{mid}='[0-9a-f]*'(?: \\\n    '[0-9a-f]*')*\n/,
                "  GROUP_BOUNDS_#{mid}=#{quoted.call(bounds[mid])}\n","GROUP_BOUNDS_#{mid}")
              s=replace_regex_once(s,/^  FOREGROUND_KEYS_#{mid}=\[[^\n]*\]\n/,
                "  FOREGROUND_KEYS_#{mid}=#{JSON.generate(upper[mid])}\n","FOREGROUND_KEYS_#{mid}")
            end
            table=grid.map{|mid,(c,r)|"#{mid}=>'#{chunk_bits(ground[mid],c,r)}'"}.join(',')
            cols=grid.map{|mid,(c,r)|"#{mid}=>#{c}"}.join(',')
            s=replace_once(s,'  FADE_ALPHA=135',
              "  GROUP_BOUNDS_50=#{quoted.call(bounds[50])}\n  FOREGROUND_KEYS_50=#{JSON.generate(upper[50])}\n"+
              "  GROUND_CHUNKS={#{table}}\n  GROUND_COLS={#{cols}}\n"+
              "  def self.ground_chunk?(floor,x,y)\n"+
              "    bits=GROUND_CHUNKS[floor]\n"+
              "    return true unless bits\n"+
              "    cols=GROUND_COLS[floor]\n"+
              "    return false if x<0 || y<0 || x>=cols\n"+
              "    i=y*cols+x\n"+
              "    return false if i>=bits.length*4\n"+
              "    bits[i/4,1].to_i(16)[i%4]==1\n"+
              "  end\n"+
              "  FADE_ALPHA=135")
            s=replace_once(s,
               'source=mapid==49 ? GROUP_BOUNDS_49 : (mapid==48 ? GROUP_BOUNDS_48 : GROUP_BOUNDS)',
               'source=mapid==50 ? GROUP_BOUNDS_50 : (mapid==49 ? GROUP_BOUNDS_49 : (mapid==48 ? GROUP_BOUNDS_48 : GROUP_BOUNDS))')
            old='$game_map.map_id==47 || $game_map.map_id==48 || $game_map.map_id==49'
            raise 'Map049 native branches missing' unless s.include?(old)
            s=s.gsub(old,'$game_map.map_id==47 || $game_map.map_id==48 || $game_map.map_id==49 || $game_map.map_id==50')
            s=replace_once(s,
               '(@slti_floor==49 && @slti_cols==50 && @slti_rows==24)',
               '(@slti_floor==49 && @slti_cols==50 && @slti_rows==24) || (@slti_floor==50 && @slti_cols==24 && @slti_rows==13)')
            s=replace_once(s,
              '@slti_floor==49 ? SLNativeLayerV241::FOREGROUND_KEYS_49 : (@slti_floor==48 ? SLNativeLayerV241::FOREGROUND_KEYS_48 : SLNativeLayerV241::FOREGROUND_KEYS)',
              '@slti_floor==50 ? SLNativeLayerV241::FOREGROUND_KEYS_50 : (@slti_floor==49 ? SLNativeLayerV241::FOREGROUND_KEYS_49 : (@slti_floor==48 ? SLNativeLayerV241::FOREGROUND_KEYS_48 : SLNativeLayerV241::FOREGROUND_KEYS))')
            s
          end

          patch_named(rows,'Window_Message') do |s|
            s=replace_once(s,'$game_temp.choice_max==12','$game_temp.choice_max==13')
            s=replace_once(s,'($game_temp.choice_start+12)*32','($game_temp.choice_start+13)*32')
            s=replace_once(s,'@item_max=12','@item_max=13')
            s
          end
          changed=rows.each_index.select{|i|rows[i][2]!=original[i][2]}
          expected=rows.each_index.select{|i|['해상도','SLNativeLayerV241','Window_Message'].include?(rows[i][1].to_s.dup.force_encoding('UTF-8'))}
          raise 'Unapproved RGSS script mutation' unless changed.sort==expected.sort && changed.size==3
          File.binwrite(file,Marshal.dump(rows))
          raise 'Serialized RGSS count changed' unless Marshal.load(File.binread(file)).size==137
          puts 'PASS terrain loader requests only region chunks; Map048/049 Layer4/Layer5 tables replaced; Map050 added'
          V211_PATCH_SCRIPTS_EOF
          ruby -c build/v211/patch_native_scripts.rb
          ruby build/v211/patch_native_scripts.rb
      - name: Pack region chunks only and register Map050
        shell: bash
        run: |
          set -euo pipefail
          cat > build/v211/pack_and_register.py <<'V211_PACK_EOF'
          from pathlib import Path
          import hashlib,json,re,struct

          root=Path('site')
          pano=root/'knight/gameasync/Graphics/Panoramas'
          data=root/'knight/gameasync/Data'
          asset=root/'knight/assets'
          work=Path('build/v211')
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          original=(asset/'map-047-v241.pack').read_bytes()
          n=struct.unpack_from('<I',original)[0]
          head=json.loads(original[4:4+n])
          body=memoryview(original)[4+n:]
          assert head['kind']=='map' and head['map_id']==47
          collision=[r for r in head['files'] if r[0]=='graphics/tilesets/slti_collision_transparent']
          assert len(collision)==1
          _,off,size=collision[0]
          extra=bytes(body[off:off+size])
          assert extra.startswith(b'\x89PNG\r\n\x1a\n')

          images={};sizes={}
          for mid in (48,49,50):
              names=json.loads((work/f'map{mid}-generated-files.json').read_text('utf8'))
              gk={tuple(k) for k in json.loads((work/f'map{mid}-ground-keys.json').read_text('utf8'))}
              fk={tuple(k) for k in json.loads((work/f'map{mid}-foreground-keys.json').read_text('utf8'))}
              expected={f'SLTI_{mid}_C{x}_{y}.png' for x,y in gk}|{f'SLTI_{mid}_L4_C{x}_{y}.png' for x,y in fk}|{f'SLTI_{mid}_GID.png'}
              assert set(names)==expected and len(names)==len(expected),(mid,'generated set')
              on_disk={p.name for p in pano.glob(f'SLTI_{mid}_*.png')}
              assert on_disk==expected,(mid,'only region chunks may exist on disk',len(on_disk^expected))
              oldpack=asset/f'map-{mid:03}-v229r115.pack'
              old_size=oldpack.stat().st_size if oldpack.exists() else None
              payload=bytearray();entries=[]
              for name in names:
                  content=(pano/name).read_bytes()
                  assert content.startswith(b'\x89PNG\r\n\x1a\n')
                  entries.append(['graphics/panoramas/'+name[:-4].lower(),len(payload),len(content)])
                  payload.extend(content)
              entries.append(['graphics/tilesets/slti_collision_transparent',len(payload),len(extra)])
              payload.extend(extra)
              nh=json.dumps({'kind':'map','map_id':mid,'files':entries},separators=(',',':')).encode('utf8')
              oldpack.write_bytes(struct.pack('<I',len(nh))+nh+payload)
              sizes[mid]=(old_size,oldpack.stat().st_size)
              print('PACK_SIZE',mid,'old=',old_size,'new=',oldpack.stat().st_size,'ground=',len(gk),'upper=',len(fk),'entries=',len(entries))
              images[mid]=names

          mapper=root/'knight/gameasync/mapping.js'
          s=mapper.read_text('utf8')
          filtered=[];removed={48:0,49:0}
          for l in s.splitlines(keepends=True):
              hit=re.match(r'^\s*\["graphics/panoramas/slti_(48|49)_',l)
              if hit:removed[int(hit.group(1))]+=1
              else:filtered.append(l)
          assert removed=={48:1530,49:1885},('Original V2.9 image mappings unexpected',removed)
          s=''.join(filtered)
          marker='"graphics/panoramas/slti_47_gid"'
          assert s.count(marker)==1
          insert=s.index('\n',s.index(marker))+1
          rows=[]
          for mid in (48,49,50):
              for name in images[mid]:
                  rows.append('["graphics/panoramas/'+name[:-4].lower()+'", "Graphics/Panoramas/'+name+
                              '?h='+hashlib.md5((pano/name).read_bytes()).hexdigest()+'"],\n')
          s=s[:insert]+''.join(rows)+s[insert:]
          map50=data/(prefix+'Map050.rxdata')
          assert map50.is_file()
          old49='"data/'+prefix.lower()+'map049"'
          assert s.count(old49)==1
          insert=s.index('\n',s.index(old49))+1
          s=s[:insert]+'["data/'+prefix.lower()+'map050", "Data/'+prefix+'Map050.rxdata?h='+hashlib.md5(map50.read_bytes()).hexdigest()+'"],\n'+s[insert:]
          for name in [prefix+'Map029.rxdata',prefix+'Map048.rxdata',prefix+'Map049.rxdata',prefix+'MapInfos.rxdata','Scripts.rxdata']:
              marker='Data/'+name+'?h='
              pattern=re.escape(marker)+r'[0-9a-f]{32}'
              assert len(re.findall(pattern,s))==1,(name,'original mapping missing or duplicate')
              s=re.sub(pattern,lambda m:marker+hashlib.md5((data/name).read_bytes()).hexdigest(),s)
          mapper.write_text(s,'utf8')

          loader=root/'knight/js/sl-assets-v229r115.js'
          s=loader.read_text('utf8')
          def rep(old,new):
              global s
              assert s.count(old)==1,('Missing original native asset loader expression',old[:110],s.count(old))
              s=s.replace(old,new)
          rep('var map47Keys=null, map47FilesReady=false, map48Keys=null, map48FilesReady=false, map49Keys=null, map49FilesReady=false;',
              'var map47Keys=null, map47FilesReady=false, map48Keys=null, map48FilesReady=false, map49Keys=null, map49FilesReady=false, map50Keys=null, map50FilesReady=false;')
          rep("if(kind==='map'&&(mid===47||mid===48||mid===49)){","if(kind==='map'&&(mid===47||mid===48||mid===49||mid===50)){")
          rep('if(mid===47)map47Keys=head.files.map(function(row){return row[0];});\n      else if(mid===48)map48Keys=head.files.map(function(row){return row[0];});\n      else map49Keys=head.files.map(function(row){return row[0];});',
              'if(mid===47)map47Keys=head.files.map(function(row){return row[0];});\n      else if(mid===48)map48Keys=head.files.map(function(row){return row[0];});\n      else if(mid===49)map49Keys=head.files.map(function(row){return row[0];});\n      else map50Keys=head.files.map(function(row){return row[0];});')
          rep('if((mid===47&&map47FilesReady)||(mid===48&&map48FilesReady)||(mid===49&&map49FilesReady))return Promise.resolve();',
              'if((mid===47&&map47FilesReady)||(mid===48&&map48FilesReady)||(mid===49&&map49FilesReady)||(mid===50&&map50FilesReady))return Promise.resolve();')
          rep('var mapKeys=mid===49?map49Keys:(mid===48?map48Keys:map47Keys);','var mapKeys=mid===50?map50Keys:(mid===49?map49Keys:(mid===48?map48Keys:map47Keys));')
          rep('if(mid===47)map47FilesReady=true;\n      else if(mid===48)map48FilesReady=true;\n      else map49FilesReady=true;',
              'if(mid===47)map47FilesReady=true;\n      else if(mid===48)map48FilesReady=true;\n      else if(mid===49)map49FilesReady=true;\n      else map50FilesReady=true;')
          rep('return (mid===47||mid===48||mid===49) ? installMap47Files(mid).then(function(){return result;}) : result;',
              'return (mid===47||mid===48||mid===49||mid===50) ? installMap47Files(mid).then(function(){return result;}) : result;')
          rep('if(mid<1||mid>49)return nativeMapLoad.apply(self,args);','if(mid<1||mid>50)return nativeMapLoad.apply(self,args);')
          rep("var version='V2.9';","var version='V2.11';")
          loader.write_text(s,'utf8')
          for name in ('index.html','knight/index.html'):
              p=root/name;text=p.read_text('utf8')
              assert 'V2.9' in text
              p.write_text(text.replace('V2.9','V2.11').replace('v2.9','v2.11'),'utf8')
          # Runtime bitmaps are installed from the .pack, so the duplicate loose PNGs are not published.
          for mid in (48,49,50):
              for p in pano.glob(f'SLTI_{mid}_*.png'):p.unlink()
              assert not list(pano.glob(f'SLTI_{mid}_*.png'))
          Path('build/v211/pack-sizes.json').write_text(json.dumps(sizes),'utf8')
          print('PASS packs contain region chunks only; zero placeholder images')
          V211_PACK_EOF
          .venv/bin/python build/v211/pack_and_register.py
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
      - name: Verify every changed file and report actual map pack MB
        shell: bash
        run: |
          set -euo pipefail
          cat > build/v211/verify_and_report.py <<'V211_VERIFY_EOF'
          from pathlib import Path
          import hashlib,json,struct

          root=Path('site')
          old=json.loads(Path('build/v211/before.json').read_text('utf8'))
          now={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          D='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          allowed={D+'Map029.rxdata',D+'Map048.rxdata',D+'Map049.rxdata',D+'MapInfos.rxdata',
                   'knight/gameasync/Data/Scripts.rxdata','knight/gameasync/mapping.js','knight/js/sl-assets-v229r115.js',
                   'knight/assets/map-048-v229r115.pack','knight/assets/map-049-v229r115.pack','index.html','knight/index.html'}
          added={D+'Map050.rxdata','knight/assets/map-050-v229r115.pack'}
          removed={p for p in old if p.startswith('knight/gameasync/Graphics/Panoramas/SLTI_48_') or
                   p.startswith('knight/gameasync/Graphics/Panoramas/SLTI_49_')}
          assert len(removed)==1530+1885,(len(removed),'V2.9 original PNG count')
          assert set(now)-set(old)==added,('unexpected additions',sorted((set(now)-set(old))^added)[:20])
          assert set(old)-set(now)==removed,('unexpected deletions',sorted((set(old)-set(now))^removed)[:20])
          changed={p for p in set(old)&set(now) if old[p]!=now[p]}
          assert changed==allowed,('unapproved original file mutation',sorted(changed^allowed))

          grid={48:(48,24),49:(50,24),50:(24,13)}
          keep={48:450,49:346,50:208}
          sizes=json.loads(Path('build/v211/pack-sizes.json').read_text('utf8'))
          report={}
          for mid in (48,49,50):
              p=root/f'knight/assets/map-{mid:03}-v229r115.pack'
              b=p.read_bytes();n=struct.unpack_from('<I',b)[0];h=json.loads(b[4:4+n]);body=memoryview(b)[4+n:]
              assert h['kind']=='map' and h['map_id']==mid
              keys=[e[0] for e in h['files']]
              assert len(set(keys))==len(keys)
              assert all(0<=o and z>7 and o+z<=len(body) and bytes(body[o:o+8])==b'\x89PNG\r\n\x1a\n' for _,o,z in h['files'])
              gk={tuple(k) for k in json.loads(Path(f'build/v211/map{mid}-ground-keys.json').read_text('utf8'))}
              ground=[k for k in keys if k.startswith(f'graphics/panoramas/slti_{mid}_c')]
              assert len(ground)==keep[mid]==len(gk),(mid,'ground chunks in pack',len(ground))
              for k in ground:
                  x,y=map(int,k.rsplit('_c',1)[1].split('_'))
                  assert (x,y) in gk,(mid,k,'chunk outside region packed')
              c,r=grid[mid]
              rep=json.loads(Path(f'build/v211/map{mid}-build-report.json').read_text('utf8'))
              report[mid]={'packMB_before':round(sizes[str(mid)][0]/1e6,3) if sizes[str(mid)][0] else None,
                           'packMB':round(len(b)/1e6,3),'regionGroundChunks':len(ground),
                           'neverRenderedChunks':c*r-len(ground),'upperChunks':rep['upper'],
                           'sourceBlocksUsed':rep['sourceBlocksUsed'],'packFiles':len(keys)}
              print('MAP_PACK',json.dumps({'map':mid,**report[mid]},ensure_ascii=False))
          man=json.loads(Path('source-map4/manifest.json').read_text('utf8'))
          total=sum(f.stat().st_size for f in root.rglob('*') if f.is_file())
          out={'v':'2.11','maps':report,'sourceBlocksExtracted':man['sourceBlocks'],
               'sourceBlocksNeverExtracted':len(man['neverExtractedBlocks']),'siteMB':round(total/1e6,3)}
          Path('build/v211/size-report.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),'utf8')
          print('SIZE_REPORT',json.dumps(out,ensure_ascii=False))
          assert total<950_000_000,('Pages remains too large; do not deploy',total)
          print('PASS no unapproved modifications; only region terrain published')
          V211_VERIFY_EOF
          .venv/bin/python build/v211/verify_and_report.py
