
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V244
# BASE: V241 successful run 41293648580
# FIX: V243 incorrectly expected direct CE922 calls.
# SOURCE ROUTE: Map025 EV11 -> SW448 -> CE462 -> CE922.
# NEW ROUTE: Map025 new EV -> isolated switch -> SLZenith attack.
# KEEP: Every existing map, NPC, event, item and Map047 renderer.
# GRAPHICS: Original Sanctuary actor SPR2807, 4 directions.
# ZENITH: Lv60 HP5200 physical50/100 magic150/300.
# STATUS: Prepared for GitHub Actions verification.

name: build-slknight-web.yml | V244 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: V244 Restore verified V241 baseline
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41293648580
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V244 Verify original inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s baseline/artifact.tar
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json

          root=Path("site")
          before={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob("*") if p.is_file()
          }

          assert len(before)==5603, "Wrong V241 inventory"

          path="knight/gameasync/Data/Scripts.rxdata"
          expected=(
              "f43507920c57e81ec1d219bae492f5e"
              "6191f6471f733d8d471f81e8515f7d167"
          )
          assert before[path]==expected, "V241 script mismatch"

          pre=(
              "knight/gameasync/Data/"
              "MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"
          )
          assert pre+"Map025.rxdata" in before
          assert pre+"Map045.rxdata" not in before
          assert pre+"Map046.rxdata" not in before
          assert "knight/assets/map-047-v241.pack" in before

          Path("build/before.json").write_text(
              json.dumps(before,sort_keys=True)
          )
          print("PASS V241 inventory and original scripts")
          PY

      - name: V244 Restore Sanctuary SPR2807 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p original packages

          gh run download 39386289505 \
            -R "$GITHUB_REPOSITORY" \
            -n audit-sanctuary-monsters-v34-all-source-database \
            -D original

          gh run download 39386289505 \
            -R "$GITHUB_REPOSITORY" \
            -n audit-sanctuary-monsters-v34-all-original-cardinal-gifs \
            -D packages

          test -s original/V34-all-cardinal-gif-manifest.csv

          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil

      - name: V244 Generate five original motion sheets
        shell: bash
        run: |
          set -euo pipefail
          cat > build/graphics.py <<'PY'
          import csv,io,hashlib,zipfile
          from pathlib import Path
          from PIL import Image

          root=Path("site/knight/gameasync/Graphics/Characters")
          root.mkdir(parents=True,exist_ok=True)

          with open(
              "original/V34-all-cardinal-gif-manifest.csv",
              encoding="utf-8-sig",newline=""
          ) as f:
              rows=[
                  r for r in csv.DictReader(f)
                  if int(r["actor"])==2807
                  and int(r["direction"]) in (1,3,5,7)
                  and r["byte_verified"]=="True"
              ]

          assert rows, "SPR2807 missing"
          wanted={
              r["gif"].removeprefix("gifs/"):r
              for r in rows
          }
          found={}

          archives=sorted(Path("packages").rglob(
              "V34-*-cardinal-gifs.zip"
          ))
          assert len(archives)==17, "Original archive count mismatch"

          for archive in archives:
              with zipfile.ZipFile(archive) as z:
                  for name in z.namelist():
                      if name not in wanted:
                          continue
                      raw=z.read(name)
                      assert hashlib.sha256(raw).hexdigest()==(
                          wanted[name]["gif_sha256"]
                      )
                      found[name]=raw

          assert set(found)==set(wanted), "Missing original GIF"

          groups={}
          for name,row in wanted.items():
              bank=int(row["bank"])
              direction=int(row["direction"])
              groups.setdefault(bank,{})[direction]=found[name]

          banks=[
              bank for bank in sorted(groups)
              if all(d in groups[bank] for d in (1,3,5,7))
          ]
          assert len(banks)>=5

          motions=[
              ("SLZenithWalk",banks[0]),
              ("SLZenithAttack",banks[1]),
              ("SLZenithHit",banks[2]),
              ("SLZenithDeath",banks[3]),
              ("SLZenithMagic",banks[4])
          ]

          for output,bank in motions:
              frames={}
              for row,direction in enumerate((1,3,5,7)):
                  with Image.open(
                      io.BytesIO(groups[bank][direction])
                  ) as gif:
                      count=max(1,gif.n_frames)
                      seq=[]
                      for i in range(4):
                          index=min(count-1,(i*count)//4)
                          gif.seek(index)
                          seq.append(gif.convert("RGBA").copy())
                      frames[row]=seq

              width=max(
                  im.width for seq in frames.values() for im in seq
              )
              height=max(
                  im.height for seq in frames.values() for im in seq
              )
              sheet=Image.new(
                  "RGBA",(width*4,height*4),(0,0,0,0)
              )
              for row,seq in frames.items():
                  for col,im in enumerate(seq):
                      x=col*width+(width-im.width)//2
                      y=row*height+(height-im.height)
                      sheet.alpha_composite(im,(x,y))

              path=root/(output+".png")
              sheet.save(path,optimize=True)
              assert path.stat().st_size>100
              print("PASS",output,"source bank",bank)

          print("PASS all five original-source sheets")
          PY
          python3 build/graphics.py

      - name: V244 Create isolated boss event and runtime
        shell: bash
        run: |
          set -euo pipefail

          cat > build/zenith.rb <<'RUBY'
          require 'zlib'
          require 'digest'

          module RPG
            class Map;end
            class MapInfo;end
            class AudioFile;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end

          class Table
            def self._load(raw)
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end
            def _dump(level=0);@raw;end
          end

          class Tone
            def self._load(raw)
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end
            def _dump(level=0);@raw;end
          end

          class Color<Tone;end

          def iv(obj,key)
            obj.instance_variable_get("@"+key.to_s)
          end

          def put(obj,key,value)
            obj.instance_variable_set("@"+key.to_s,value)
          end

          def event_command(code,params=[])
            obj=RPG::EventCommand.allocate
            put(obj,:code,code)
            put(obj,:indent,0)
            put(obj,:parameters,params)
            obj
          end

          ROOT='site/knight/gameasync/Data/'
          PRE='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          MAP=ROOT+PRE+'Map025.rxdata'
          SCRIPTS=ROOT+'Scripts.rxdata'

          NEW_HP=7001
          NEW_ATTACK_SWITCH=7002
          SOURCE_EVENT=11
          SOURCE_ATTACK_SWITCH=448

          map=Marshal.load(File.binread(MAP))
          events=iv(map,:events)
          raise 'Map025 event table unavailable' unless
            events.is_a?(Hash)

          source=events[SOURCE_EVENT]
          raise 'Original Medusa EV11 missing' unless source

          name=iv(source,:name).to_s.dup
          name.force_encoding('UTF-8')
          name=name.scrub
          raise "Wrong template #{name.inspect}" unless
            name.include?('메두사')

          originals={}
          events.each do |id,ev|
            originals[id]=Marshal.dump(ev)
          end

          boss=Marshal.load(Marshal.dump(source))
          boss_id=events.keys.max+1
          put(boss,:id,boss_id)
          put(boss,:name,'제니스 퀸')

          occupied=events.values.map do |ev|
            [iv(ev,:x),iv(ev,:y)]
          end

          sx=iv(source,:x)
          sy=iv(source,:y)
          width=iv(map,:width)
          height=iv(map,:height)

          spawn=nil
          (1..8).each do |radius|
            break if spawn
            (-radius..radius).each do |dy|
              break if spawn
              (-radius..radius).each do |dx|
                x=sx+dx
                y=sy+dy
                next unless [dx.abs,dy.abs].max==radius
                next if x<2 || y<2
                next if x>=width-2 || y>=height-2
                next if occupied.include?([x,y])
                spawn=[x,y]
                break
              end
            end
          end

          raise 'No unoccupied boss tile' unless spawn
          put(boss,:x,spawn[0])
          put(boss,:y,spawn[1])

          pages=iv(boss,:pages)
          raise 'Invalid monster event pages' unless
            pages.is_a?(Array) && pages.size>=4

          active=pages[1]
          active_cond=iv(active,:condition)

          old_attack_switches=iv(active,:list).select do |cmd|
            iv(cmd,:code)==121
          end.map do |cmd|
            iv(cmd,:parameters)[0]
          end.uniq

          unless old_attack_switches==[SOURCE_ATTACK_SWITCH]
            raise(
              "Expected Medusa attack SW448, got "+
              old_attack_switches.inspect
            )
          end

          # The source activation gate belongs to the original map.
          # A cloned boss must not enable/disable that shared gate.
          old_gate=iv(active_cond,:switch1_id)
          put(active_cond,:switch1_valid,false)

          death_candidates=pages.each_with_index.select do |page,index|
            iv(iv(page,:condition),:variable_valid)
          end
          raise 'Source HP condition missing' if
            death_candidates.empty?

          death,death_index=death_candidates.max_by do |page,index|
            iv(iv(page,:condition),:variable_value)
          end

          old_hp=iv(iv(death,:condition),:variable_id)
          raise 'Source HP variable invalid' unless
            old_hp.is_a?(Integer) && old_hp>0

          isolated_attack_count=0
          hp_rewrites=0

          pages.each do |page|
            condition=iv(page,:condition)

            if iv(condition,:variable_valid) &&
               iv(condition,:variable_id)==old_hp
              put(condition,:variable_id,NEW_HP)
            end

            if iv(condition,:switch1_valid) &&
               iv(condition,:switch1_id)==SOURCE_ATTACK_SWITCH
              put(condition,:switch1_id,NEW_ATTACK_SWITCH)
            end

            if iv(condition,:switch2_valid) &&
               iv(condition,:switch2_id)==SOURCE_ATTACK_SWITCH
              put(condition,:switch2_id,NEW_ATTACK_SWITCH)
            end

            graphic=iv(page,:graphic)
            put(graphic,:character_name,'SLZenithWalk')
            put(page,:move_speed,3)
            put(page,:move_frequency,6)

            commands=iv(page,:list)

            # Remove writes to a global activation gate.
            # Only the new cloned event is changed.
            if old_gate!=SOURCE_ATTACK_SWITCH
              commands.reject! do |cmd|
                next false unless iv(cmd,:code)==121
                p=iv(cmd,:parameters)
                p[0]==old_gate && p[1]==old_gate
              end
            end

            commands.each do |cmd|
              code=iv(cmd,:code)
              p=iv(cmd,:parameters)
              next unless p.is_a?(Array)

              case code
              when 121
                if p[0]==SOURCE_ATTACK_SWITCH &&
                   p[1]==SOURCE_ATTACK_SWITCH
                  p[0]=NEW_ATTACK_SWITCH
                  p[1]=NEW_ATTACK_SWITCH
                  isolated_attack_count+=1
                end

              when 122
                if p[0]==old_hp && p[1]==old_hp
                  p[0]=NEW_HP
                  p[1]=NEW_HP
                  hp_rewrites+=1
                end
                if p[3]==1 && p[4]==old_hp
                  p[4]=NEW_HP
                end

                if p[0]==335 && p[1]==335 && p[2]==0
                  p.replace([335,335,0,2,15,35])
                end

              when 111
                if p[0]==1 && p[1]==old_hp
                  p[1]=NEW_HP
                end
                if p[0]==0 &&
                   p[1]==SOURCE_ATTACK_SWITCH
                  p[1]=NEW_ATTACK_SWITCH
                end

              when 230
                p[0]=20 if p[0]==30

              when 355,655
                next unless p[0].is_a?(String)
                code_text=p[0].dup

                code_text.gsub!(
                  "$game_variables[#{old_hp}]",
                  "$game_variables[#{NEW_HP}]"
                )
                code_text.gsub!(
                  "$game_switches[#{SOURCE_ATTACK_SWITCH}]",
                  "$game_switches[#{NEW_ATTACK_SWITCH}]"
                )

                code_text.gsub!(
                  "$game_map.events[#{SOURCE_EVENT}]",
                  "$game_map.events[#{boss_id}]"
                )

                # Do not register this new switch with the
                # source Medusa common-event attack dispatcher.
                code_text.gsub!(
                  /SLMonsterAttackContext\.register\([^\)]*\)/,
                  'nil'
                )

                p[0]=code_text
              end
            end
          end

          raise 'No isolated attack switch found' unless
            isolated_attack_count>0

          raise 'No source HP writes found' unless
            hp_rewrites>0

          condition=iv(death,:condition)
          put(condition,:variable_valid,true)
          put(condition,:variable_id,NEW_HP)
          put(condition,:variable_value,5200)
          put(condition,:switch1_valid,false)
          put(condition,:switch2_valid,false)

          put(death,:list,[
            event_command(355,['SLZenith.reward']),
            event_command(230,[45]),
            event_command(116,[]),
            event_command(0,[])
          ])

          originals.each do |id,bytes|
            unless Marshal.dump(events[id])==bytes
              raise "Original event modified #{id}"
            end
          end

          events[boss_id]=boss
          File.binwrite(MAP,Marshal.dump(map))

          runtime=<<'SOURCE'
          module SLZenith
            MAP_ID=25
            EVENT_ID=__EVENT_ID__
            HP_VAR=7001
            ATTACK_SWITCH=7002

            LEVEL=60
            MAX_HP=5200
            PHYSICAL=[50,100]
            MAGIC=[150,300]
            ACCURACY=9999
            ATTACK_WAIT=20
            EXP=43212
            ADENA=[64800,151200]

            # Existing game inventory IDs only.
            # Per-thousand probabilities.
            DROPS=[
              [:item,35,30],
              [:item,34,20],
              [:item,33,100],
              [:item,37,100],
              [:armor,169,50],
              [:item,116,3],
              [:item,32,100],
              [:item,38,100],
              [:armor,289,30],
              [:weapon,123,30],
              [:weapon,18,50],
              [:item,3,200],
              [:weapon,1,50],
              [:armor,72,50],
              [:item,2,250],
              [:armor,303,2],
              [:item,43,100],
              [:armor,280,30],
              [:armor,12,50],
              [:armor,492,3]
            ]

            @paid=false
            @cooldown=0
            @poison_frames=0
            @poison_tick=0
            @slow_frames=0
            @original_speed=nil

            def self.actor
              $game_actors[1] if $game_actors
            end

            def self.event
              return nil unless $game_map
              return nil unless $game_map.map_id==MAP_ID
              return nil unless $game_map.events
              $game_map.events[EVENT_ID]
            end

            def self.animate(action)
              ev=event
              return unless ev
              ev.instance_variable_set(
                :@character_name,"SLZenith"+action
              )
              ev.instance_variable_set(:@pattern,0)
              ev.instance_variable_set(
                :@slz_anim_frames,
                action=='Death' ? 0 : 24
              )
            end

            def self.roll(range)
              range[0]+rand(range[1]-range[0]+1)
            end

            def self.attack
              return if @cooldown.to_i>0
              return unless event
              return unless $game_variables
              return if $game_variables[HP_VAR].to_i>=MAX_HP

              target=actor
              return unless target && target.hp>0

              if rand(7)==0
                damage=roll(MAGIC)
                defence=target.respond_to?(:mdef) ?
                  target.mdef.to_i : 0
                damage=[damage-defence,80].max
                animate('Magic')
              else
                damage=roll(PHYSICAL)
                defence=target.respond_to?(:pdef) ?
                  target.pdef.to_i : 0
                damage=[damage-defence,1].max
                animate('Attack')
              end

              target.hp=[target.hp-damage,0].max
              @cooldown=ATTACK_WAIT

              effect=rand(100)

              if effect<20
                @poison_frames=360
                @poison_tick=0
              elsif effect<30
                @slow_frames=180
                if $game_player
                  @original_speed||=
                    $game_player.instance_variable_get(
                      :@move_speed
                    )
                  current=@original_speed.to_i
                  $game_player.instance_variable_set(
                    :@move_speed,[current-1,1].max
                  )
                end
              end
            end

            def self.tick
              return unless $game_map &&
                $game_map.map_id==MAP_ID

              @cooldown-=1 if @cooldown.to_i>0

              if @poison_frames.to_i>0
                @poison_frames-=1
                @poison_tick+=1

                if @poison_tick>=180
                  @poison_tick=0
                  target=actor
                  if target && target.hp>0
                    target.hp=[target.hp-5,0].max
                  end
                end
              end

              if @slow_frames.to_i>0
                @slow_frames-=1

                if @slow_frames==0 &&
                   @original_speed && $game_player
                  $game_player.instance_variable_set(
                    :@move_speed,@original_speed
                  )
                  @original_speed=nil
                end
              end
            end

            def self.reward
              return unless $game_map &&
                $game_map.map_id==MAP_ID
              return unless $game_variables
              return if $game_variables[HP_VAR].to_i<MAX_HP
              return if @paid

              @paid=true

              gold=roll(ADENA)
              $game_party.gain_gold(gold)
              target=actor
              target.exp=target.exp+EXP if target

              $game_variables[333]=gold
              $game_variables[1926]=EXP

              DROPS.each do |kind,id,chance|
                next unless rand(1000)<chance
                case kind
                when :item
                  $game_party.gain_item(id,1)
                when :weapon
                  $game_party.gain_weapon(id,1)
                when :armor
                  $game_party.gain_armor(id,1)
                end
              end

              animate('Death')
            end

            def self.reset(next_map_id)
              if @original_speed && $game_player
                $game_player.instance_variable_set(
                  :@move_speed,@original_speed
                )
              end

              @paid=false
              @cooldown=0
              @poison_frames=0
              @poison_tick=0
              @slow_frames=0
              @original_speed=nil

              if next_map_id==MAP_ID && $game_variables
                $game_variables[HP_VAR]=0
                $game_switches[ATTACK_SWITCH]=false if
                  $game_switches
              end
            end
          end

          # Native monster event writes the isolated attack switch.
          # It no longer invokes the source Medusa CE462/CE922.
          class Interpreter
            alias slz_native_command_121 command_121

            def command_121
              if @map_id==SLZenith::MAP_ID &&
                 @event_id==SLZenith::EVENT_ID &&
                 @parameters.is_a?(Array)
                first,last,operation=@parameters
                if operation==0 &&
                   first<=SLZenith::ATTACK_SWITCH &&
                   last>=SLZenith::ATTACK_SWITCH
                  SLZenith.attack
                end
              end
              slz_native_command_121
            end
          end

          class Game_Event
            alias slz_native_update update

            def update
              slz_native_update
              return unless @map_id==SLZenith::MAP_ID &&
                @id==SLZenith::EVENT_ID

              frames=@slz_anim_frames.to_i
              if frames>0
                @slz_anim_frames=frames-1
                if @slz_anim_frames==0
                  @character_name='SLZenithWalk'
                end
              end

              hp=$game_variables[SLZenith::HP_VAR].to_i
              if @slz_last_hp!=hp
                @slz_last_hp=hp
                if $m && $m.respond_to?(:drawMHP)
                  $m.drawMHP(
                    '제니스 퀸',
                    $game_variables[SLZenith::HP_VAR],
                    SLZenith::MAX_HP,2
                  )
                end
              end
            end
          end

          class Game_Player
            alias slz_native_update update

            def update
              slz_native_update
              SLZenith.tick
            end
          end

          class Game_Map
            alias slz_native_setup setup

            def setup(map_id)
              SLZenith.reset(map_id)
              slz_native_setup(map_id)
            end
          end
          SOURCE

          runtime=runtime.sub('__EVENT_ID__',boss_id.to_s)

          scripts=Marshal.load(File.binread(SCRIPTS))
          unless scripts.is_a?(Array) && scripts.size>=130
            raise 'Unexpected source Scripts.rxdata structure'
          end

          if scripts.any?{|r|r.is_a?(Array) &&
            r[1].to_s.start_with?('SLZenithV')}
            raise 'Zenith already present in V241 baseline'
          end

          main_index=scripts.index do |row|
            row.is_a?(Array) && row[1].to_s=='Main'
          end
          main_index||=scripts.length-1

          scripts.insert(
            main_index,
            [
              99824401,
              'SLZenithV244',
              Zlib::Deflate.deflate(runtime,9)
            ]
          )

          File.binwrite(SCRIPTS,Marshal.dump(scripts))
          File.write('build/zenith-runtime.rb',runtime)

          report=[
            'Map025',
            "Event=#{boss_id}",
            "Spawn=#{spawn.inspect}",
            "OriginalHP=#{old_hp}",
            "NewHP=#{NEW_HP}",
            "OriginalAttackSW=#{SOURCE_ATTACK_SWITCH}",
            "NewAttackSW=#{NEW_ATTACK_SWITCH}",
            "IsolatedAttackWrites=#{isolated_attack_count}",
            "HPRewrites=#{hp_rewrites}",
            "RuntimeScriptIndex=#{main_index}"
          ].join("\n")+"\n"

          File.write('build/zenith-report.txt',report)

          loaded=Marshal.load(File.binread(MAP))
          raise 'Boss event missing after save' unless
            iv(loaded,:events).key?(boss_id)

          puts report
          puts 'PASS original Map025 events retained'
          puts 'PASS isolated HP and attack switch'
          RUBY

          ruby -c build/zenith.rb
          ruby build/zenith.rb
          ruby -c build/zenith-runtime.rb

      - name: V244 Test actual isolated attack switch
        shell: bash
        run: |
          set -euo pipefail

          cat > build/test-zenith.rb <<'RUBY'
          class Interpreter
            def command_121
              $native_switch_calls=
                ($native_switch_calls||0)+1
              true
            end
          end

          class Game_Event
            def update;end
          end

          class Game_Player
            attr_accessor :x,:y
            def initialize
              @x=11
              @y=10
              @move_speed=4
            end
            def update;end
          end

          class Game_Map
            attr_accessor :map_id,:events
            def initialize
              @map_id=25
              @events={}
            end
            def setup(id);@map_id=id;end
          end

          class ActorMock
            attr_accessor :hp,:exp
            def initialize
