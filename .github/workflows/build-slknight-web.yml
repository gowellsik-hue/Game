          def entry_for(scripts, name)
            e =
              scripts.find do |x|
                x.is_a?(Array) &&
                x.length >= 3 &&
                x[1].to_s == name
              end

            abort "missing script #{name}" unless e

            e
          end

          def src(e)
            Zlib::Inflate
              .inflate(e[2])
              .force_encoding(
                Encoding::UTF_8
              )
          end

          def put(e, s)
            e[2] =
              Zlib::Deflate.deflate(s)
          end

          compat =
            entry_for(
              scripts,
              'Web Compatibility'
            )

          text = src(compat)

          unless text.include?(
            '    when 65 then Input::X'
          )
            abort 'compat X key marker missing'
          end

          text.sub!(
            '    when 65 then Input::X',
            '    when 69,65 then Input::X'
          )

          unless text.include?(
            '    when 83 then Input::Y'
          )
            abort 'compat Y key marker missing'
          end

          text.sub!(
            '    when 83 then Input::Y',
