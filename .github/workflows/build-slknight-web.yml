
name: 'V209 | Knight Ettin Fix without Expiring Artifacts'

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Restore published V206 snapshot with SHA-256 checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          import hashlib, json, re, time

          BASE = "https://gowellsik-hue.github.io/Game/"
          ROOT = Path("site")
          FIXED = ("index.html", "COPYING-mkxp-web.txt",
                   "manifest.webmanifest", "mkxp.js", "mkxp.wasm",
                   "js/drive.js", "js/dpad.js", "js/localforage.min.js")
          LOCK = {
              "index.html": "cb972e363a37790bef24aafceae5bd12aaa686934acc4a4c052402006341a3ba",
              "knight/index.html": "69df0c66ae5ddf0167ae2b142fe5a55a1d45bca3c93b2e34c0034bb5bb36ea48",
              "elf/index.html": "933cb376a3eededa7ca9b54ad45458e4bae3a65dafde8d5f9f72ffdc09a59c99",
              "knight/gameasync/mapping.js": "986ca910a402fe8c8b92902ba8aad6509c3ac710d975a68a07552c4e0c61ee31",
              "elf/gameasync/mapping.js": "dd3bc6f82fe2347994969523e03f47824ce719d59db4840d71cd93a099ca9bde",
              "knight/gameasync/bitmap-map.js": "f9f29fca97904ad924d32b5a743931fb166beddc7fa2f2ceacc4259e8500cf45",
              "elf/gameasync/bitmap-map.js": "a17996d5aee6bf4767ef06dd499b35d3de10214e8d5bfd83ed0654c6fb0b8c26",
              "knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata":
                  "e200bdc0443f8e8802617f7ae76272584a73e7057d92b8d5868b766f5e946b00",
              "knight/gameasync/Data/Scripts.rxdata": "8966a677a9789f3e9c95a058659dcf22b51d98fb1c68dd946a4e6879cf2bbaec",
              "elf/gameasync/Data/Scripts.rxdata": "aaf22afd7d90bacd6586d9a1171e3af1ee9b067730d5d30170eb09b84420263e",
          }
          LOCK.update({
              "elf/COPYING-mkxp-web.txt": "8177f97513213526df2cf6184d8ff986c675afb514d4e68a404010521b880643",
              "elf/js/dpad.js": "52e1b860e2ad9c3f6194d7cf983bcf6fa1a43354650d71fd9fd11984761cde69",
              "elf/js/drive.js": "d93e3f623b11c3f0a7349ac267961e8fdb202dca6fb17d07465f10a386a85b1f",
              "elf/js/localforage.min.js": "1ff66c1e32922549d0c824076703e69fb5535857934c8faa8023f51a4881f732",
              "elf/manifest.webmanifest": "b5a68325f50f2a4eb99242270160d56094bd6365920396964875d64535b5e806",
              "elf/mkxp.js": "c768aa2a62dfae5ee019668e31d2e55b04a176c529daae6a5a4393c1db21ae9d",
              "elf/mkxp.wasm": "83f6138820a3587ec569bca801d3032ec39edfda1cb49fbb90ab3928821966bd",
              "knight/COPYING-mkxp-web.txt": "8177f97513213526df2cf6184d8ff986c675afb514d4e68a404010521b880643",
              "knight/js/dpad.js": "c137842818acf76a036127a0ffbae88e22affcba78ca70c3f1b4c76b52f86908",
              "knight/js/drive.js": "d93e3f623b11c3f0a7349ac267961e8fdb202dca6fb17d07465f10a386a85b1f",
              "knight/js/localforage.min.js": "1ff66c1e32922549d0c824076703e69fb5535857934c8faa8023f51a4881f732",
              "knight/manifest.webmanifest": "b5a68325f50f2a4eb99242270160d56094bd6365920396964875d64535b5e806",
              "knight/mkxp.js": "c768aa2a62dfae5ee019668e31d2e55b04a176c529daae6a5a4393c1db21ae9d",
              "knight/mkxp.wasm": "83f6138820a3587ec569bca801d3032ec39edfda1cb49fbb90ab3928821966bd",
          })

          def fetch(url):
              for attempt in range(6):
                  try:
                      req = Request(url, headers={"User-Agent": "V209-Snapshot-Recovery/1.0",
                                                  "Accept-Encoding": "identity"})
                      with urlopen(req, timeout=60) as response:
                          return response.read()
                  except HTTPError as exc:
                      if exc.code not in (408, 425, 429, 500, 502, 503, 504):
                          raise
                      if attempt == 5:
                          raise
                  except (URLError, TimeoutError):
                      if attempt == 5:
                          raise
                  time.sleep(1 + 2 * attempt)
              raise RuntimeError("Download exhausted: " + url)

          def download(job):
              name, url, md5 = job
              content = fetch(url)
              actual = hashlib.md5(content).hexdigest()
              if md5 and actual != md5:
                  raise RuntimeError(f"Asset mismatch: {name} ({actual} != {md5})")
              p = ROOT / name
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(content)
              return name

          ROOT.mkdir(exist_ok=True)
          files = {}
          files["index.html"] = (BASE + "index.html", None)
          for game in ("knight", "elf"):
              for rel in FIXED:
                  files[f"{game}/{rel}"] = (BASE + game + "/" + quote(rel, safe="/"), None)
              mapping_name = f"{game}/gameasync/mapping.js"
              mapping_bytes = fetch(BASE + mapping_name + "?v=v209-restore")
              (ROOT / mapping_name).parent.mkdir(parents=True, exist_ok=True)
              (ROOT / mapping_name).write_bytes(mapping_bytes)
              text = mapping_bytes.decode("utf-8")
              body = text.split("var mappingArray = ", 1)[1].split("];", 1)[0] + "]"
              mapping = json.loads(re.sub(r",\s*\]$", "]", body))
              for name, mapped in mapping:
                  rel, sep, digest = mapped.partition("?h=")
                  if "." not in Path(rel).name:
                      continue
                  out = game + "/gameasync/" + rel
                  if out in files:
                      raise RuntimeError("Repeated mapped path: " + out)
                  url = BASE + game + "/gameasync/" + quote(rel, safe="/")
                  if sep:
                      url += "?h=" + digest
                  expected = digest if (sep and Path(rel).name not in ("mapping.js", "bitmap-map.js")) else None
                  files[out] = (url, expected)

          if len(files) != 5355:
              raise RuntimeError(f"V206 manifest differs: {len(files)} files, expected 5355")

          jobs = [(name, url, md5) for name, (url, md5) in files.items()
                  if not (ROOT / name).exists()]
          print(f"Restoring {len(jobs)} published files, checking {len(files)} paths", flush=True)
          errors = []
          with ThreadPoolExecutor(max_workers=20) as pool:
              futures = {pool.submit(download, job): job[0] for job in jobs}
              for i, done in enumerate(as_completed(futures), 1):
                  try:
                      done.result()
                  except Exception as exc:
                      errors.append(str(exc))
                  if i % 250 == 0 or i == len(futures):
                      print(f"Downloaded {i}/{len(futures)}, errors={len(errors)}", flush=True)
          if errors:
              raise SystemExit("Mirror failed: " + " | ".join(errors[:8]))
          actual_files = {str(p.relative_to(ROOT)) for p in ROOT.rglob("*") if p.is_file()}
          if actual_files != set(files):
              raise SystemExit("V206 mirror incomplete or contains extra paths")
          for name, digest in LOCK.items():
              actual = hashlib.sha256((ROOT / name).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"V206 source version mismatch: {name} {actual} != {digest}")
          print("V209_COMPLETE_V206_SITE_RESTORED_AND_LOCKED", len(files), flush=True)
          PY

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('site')
          manifest={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          Path('/tmp/v209_source_manifest.json').write_text(json.dumps(manifest))
          old=Path('site/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata')
          Path('/tmp/v209_common_before.rxdata').write_bytes(old.read_bytes())
          print('V209_PROTECTED_BASELINE_FILES', len(manifest))
          PY

      - name: Remove only the invalid Knight Ettin accuracy multiplier
        shell: bash
        run: |
          set -euo pipefail
          ruby -EUTF-8:UTF-8 - site/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata <<'RB'
          # encoding: utf-8
          require 'digest'
          module RPG
            class CommonEvent; end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
            class AudioFile; end
          end
          class V209RawRGSS
            def initialize(bytes); @bytes = bytes; end
            def self._load(bytes); new(bytes); end
            def _dump(level); @bytes; end
          end
          class Tone < V209RawRGSS; end
          class Color < V209RawRGSS; end
          class Table < V209RawRGSS; end

          file = ARGV.fetch(0)
          original = File.binread(file)
          data = Marshal.load(original)
          abort 'Marshal baseline serialization differs' unless Marshal.dump(data) == original
          abort 'CommonEvents array missing' unless data.is_a?(Array) && data.length == 1000
          target = data.fetch(882)
          name = target.instance_variable_get(:@name).dup.force_encoding('UTF-8')
          abort "Wrong event #{name}" unless name == '[공격]에틴'
          list = target.instance_variable_get(:@list)
          invalid = [336, 336, 3, 1, 770]
          hits = list.each_index.select do |i|
            c = list[i]
            c.instance_variable_get(:@code) == 122 && c.instance_variable_get(:@parameters) == invalid
          end
          abort "Invalid multiplier count #{hits.size}" unless hits.size == 1
          at = hits.first
          before = list.fetch(at - 1)
          after = list.fetch(at + 1)
          abort 'Ettin initial hit roll has changed' unless
            before.instance_variable_get(:@code) == 122 &&
            before.instance_variable_get(:@parameters) == [336, 336, 0, 2, 40, 70]
          abort 'Ettin accuracy condition has changed' unless
            after.instance_variable_get(:@code) == 111 &&
            after.instance_variable_get(:@parameters) == [1, 336, 1, 337, 1]

          fingerprints = data.each_with_index.to_h do |e,i|
            [i, e.nil? ? nil : Digest::SHA256.hexdigest(Marshal.dump(e))]
          end
          list.delete_at(at)
          diff = data.each_with_index.filter_map do |e,i|
            digest = e.nil? ? nil : Digest::SHA256.hexdigest(Marshal.dump(e))
            i if digest != fingerprints[i]
          end
          abort "Unexpected events changed #{diff.inspect}" unless diff == [882]
          File.binwrite(file, Marshal.dump(data))
          puts 'V209_ONLY_KNIGHT_ETTIN_MULTIPLIER_REMOVED'
          RB

      - name: Refresh only Knight CommonEvents hash and cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re
          root = Path("site/knight")
          name = "MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata"
          data = root / "gameasync/Data" / name
          mapping = root / "gameasync/mapping.js"
          html = root / "index.html"
          original = mapping.read_text(encoding="utf-8")
          key = "data/" + name.removesuffix(".rxdata").lower()
          regex = (r'(\["' + re.escape(key) +
                   r'",\s*"Data/' + re.escape(name) + r'\?h=)([0-9a-f]{32})("\],)')
          match = list(re.finditer(regex, original))
          if len(match) != 1:
              raise SystemExit("Knight CommonEvents mapping not unique")
          old_digest = hashlib.md5(Path("/tmp/v209_common_before.rxdata").read_bytes()).hexdigest()
          if match[0].group(2) != old_digest:
              raise SystemExit("V206 CommonEvents mapping baseline differs")
          new_digest = hashlib.md5(data.read_bytes()).hexdigest()
          updated = re.sub(regex, lambda m: m.group(1)+new_digest+m.group(3), original)
          mapping.write_text(updated, encoding="utf-8")
          page = html.read_text(encoding="utf-8")
          old = "gameasync/mapping.js?v=v143z100"
          if page.count(old) != 1:
              raise SystemExit("Knight HTML mapping cache anchor missing")
          html.write_text(page.replace(old, "gameasync/mapping.js?v=v209", 1),
                          encoding="utf-8")
          print("V209_KNIGHT_DATA_CACHE_UPDATED")
          PY

      - name: Verify unchanged Fairy, saves and all other events
        shell: bash
        run: |
          set -euo pipefail
          ruby -EUTF-8:UTF-8 - /tmp/v209_common_before.rxdata site/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata <<'RB'
          # encoding: utf-8
          require 'digest'
          module RPG
            class CommonEvent; end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
            class AudioFile; end
          end
          class V209RawRGSS
            def initialize(b); @bytes=b; end
            def self._load(b); new(b); end
            def _dump(level); @bytes; end
          end
          class Tone < V209RawRGSS; end
          class Color < V209RawRGSS; end
          class Table < V209RawRGSS; end
          old = Marshal.load(File.binread(ARGV[0]))
          new = Marshal.load(File.binread(ARGV[1]))
          abort 'CommonEvents length differs' unless old.size == new.size
          changed = (0...old.size).select { |i| Marshal.dump(old[i]) != Marshal.dump(new[i]) }
          abort "Wrong events changed: #{changed.inspect}" unless changed == [882]
          a = old[882].instance_variable_get(:@list)
          b = new[882].instance_variable_get(:@list)
          test = a.dup
          command = test.delete_at(4)
          abort 'Wrong command removed' unless command.instance_variable_get(:@code) == 122 && command.instance_variable_get(:@parameters) == [336,336,3,1,770]
          abort 'Other Ettin commands changed' unless Marshal.dump(test) == Marshal.dump(b)
          puts 'V209_ONE_COMMAND_ONLY: KNIGHT_GENERAL_ETTIN'
          RB

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path("site")
          before = json.loads(Path("/tmp/v209_source_manifest.json").read_text())
          current = {
              str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob("*") if p.is_file()
          }
          if current.keys() != before.keys():
              raise SystemExit("A source file was added or removed")
          allowed = {
              "knight/index.html",
              "knight/gameasync/mapping.js",
              "knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata",
          }
          changed = {name for name in before if current[name] != before[name]}
          if changed != allowed:
              raise SystemExit("Unexpected changes: " + repr(changed))
          main = root / "knight"
          data = main / "gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata"
          mapping = (main / "gameasync/mapping.js").read_text(encoding="utf-8")
          html = (main / "index.html").read_text(encoding="utf-8")
          if "Data/" + data.name + "?h=" + hashlib.md5(data.read_bytes()).hexdigest() not in mapping:
              raise SystemExit("Patched CommonEvents mapping is stale")
          if html.count("gameasync/mapping.js?v=v209") != 1:
              raise SystemExit("Knight cache version not updated")
          if "slknight_v14_engine" not in html:
              raise SystemExit("Knight save namespace missing")
          print("V209_ALL_ELF_FILES_KNIGHT_SAVE_AND_OTHER_MONSTERS_PRESERVED")
          PY

          node --check site/knight/js/dpad.js
          node --check site/elf/js/dpad.js

      - name: Upload complete site to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
