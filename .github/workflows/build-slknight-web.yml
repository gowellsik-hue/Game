
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R132
# BASE: exact successful V229R131 deployment of commit 6319a8221f4aefb3cbbfbd593049a6001614bb5b.
# CHANGE: move actual initial player and monster spawn coordinates +1 X, +1 Y on Map045/046.
# CHANGE: move existing monster death-reposition destinations by same offset.
# KEEP: current S32 screen projection +12,+6 and inverse -12,-6, completely unchanged.
# KEEP: original 384/385 passage tiles, all approved openings, stairs detection, Baphomet event ID13.
# KEEP: all current R131 drops/rewards, cleaned 2F floor, walls, original event pages, and audio.
# NO new runtime movement, collision, pathfinding or projected spawn overrides.
name: build-slknight-web.yml | V229R132 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R132 Find successful exact R131 build, not R121
        id: base
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          sha='6319a8221f4aefb3cbbfbd593049a6001614bb5b'
          url='https://api.github.com/repos/gowellsik-hue/Game/actions/runs?head_sha='+sha+'&per_page=100'
          req=urllib.request.Request(url,headers={
            'Authorization':'Bearer '+os.environ['GH_TOKEN'],
            'Accept':'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=30) as r:
            runs=json.load(r)['workflow_runs']
          candidates=[r for r in runs if
            r['head_sha']==sha and r['conclusion']=='success' and
            r['path'].endswith('/build-slknight-web.yml') and
            r['name']=='build-slknight-web.yml | V229R131 | Clean Native Events and 2x Terrain']
          assert candidates,'R131 did not deploy successfully; stop instead of reverting to an older version'
          run=max(candidates,key=lambda r:r['run_number'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('run_id='+str(run['id'])+'\n')
          print('PASS exact deployed R131 run:',run['id'])
          PY

      - name: V229R132 Download the intact R131 published game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: ${{ steps.base.outputs.run_id }}
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V229R132 Verify all deployed files and map sources
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('site'); data=root/'knight/gameasync/Data'
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          assert len(before)==5566,('Unexpected R131 file count',len(before))
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          expected={
            prefix+'Map045.rxdata':'f47de87af6b4e607bf632818a711619dc8ca4e747196a123a76ac7db8ffc3ba6',
            prefix+'Map046.rxdata':'dc89d908f5247442e08dddc11f5bcf6505a77890bd82ab59b790e00e3e5f024c',
          }
          for file,sha in expected.items():
            assert hashlib.sha256((data/file).read_bytes()).hexdigest()==sha,('Wrong map baseline',file)
          assert 'V229R131' in (root/'knight/index.html').read_text('utf8')
          assert 'V229R131' in (root/'index.html').read_text('utf8')
          assert (data/'Scripts.rxdata').stat().st_size>200000
          assert (data/prefix+'Map029.rxdata').is_file()
          assert (root/'knight/gameasync/Graphics/Characters/바포메트.png').is_file()
          Path('build/before.json').write_text(json.dumps(before,sort_keys=True),encoding='utf8')
          print('PASS exact R131 files, both dungeon maps, boss graphic, 2F artwork preserved')
          PY

      - name: V229R132 Replace only actual spawn coordinates; preserve screen projection
        shell: bash
        run: |
          set -euo pipefail
          cat > build/spawn132.rb <<'RUBY'
          # encoding: UTF-8
          require 'zlib'
          module RPG
            class Map;end;class MapInfo;end;class AudioFile;end;class Tileset;end
            class Event;class Page;class Condition;end;class Graphic;end;end;end
            class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          class Table
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(d=0);@raw;end
          end
          class Tone
            def self._load(r);o=allocate;o.instance_variable_set(:@raw,r);o;end
            def _dump(d=0);@raw;end
          end
          class Color < Tone;end

          root=ARGV.fetch(0)
          base=File.join(root,'knight/gameasync/Data')
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          get=->(o,k){o.instance_variable_get('@'+k)}
          loadmap=->(id){Marshal.load(File.binread(File.join(base,pre+format('Map%03d.rxdata',id))))}
          savemap=->(id,obj){File.binwrite(File.join(base,pre+format('Map%03d.rxdata',id)),Marshal.dump(obj))}
          summary={}
          [45,46].each do |mid|
            map=loadmap.call(mid)
            events=get.call(map,'events')
            raise "Unexpected map event count #{mid}" unless events.length==(mid==45 ? 35 : 34)
            shifted=0;relocations=0
            events.each do |id,event|
              pages=get.call(event,'pages')
              next unless pages.length>=3
              graphic=get.call(pages.first,'graphic')
              next if get.call(graphic,'character_name').to_s.empty?
              ox=get.call(event,'x');oy=get.call(event,'y')
              event.instance_variable_set(:@x,ox+1)
              event.instance_variable_set(:@y,oy+1)
              shifted+=1
              # Monster event death pages contain ORIGINAL reposition coordinates;
              # move those literal spawn destinations, never replace movement logic.
              pages.each do |page|
                get.call(page,'list').each do |cmd|
                  next unless get.call(cmd,'code')==202
                  p=get.call(cmd,'parameters')
                  next unless p[0]==0 && p[1]==0 && p.length>=4
                  p[2]+=1;p[3]+=1
                  relocations+=1
                end
              end
            end
            raise "Unexpected monster count #{mid}: #{shifted}" unless shifted==32
            summary[mid]=[shifted,relocations]
            if mid==45
              e=events.fetch(1)
              raise 'Original stair trigger event changed' unless get.call(e,'x')==201 && get.call(e,'y')==76
              scripts=get.call(get.call(e,'pages').first,'list').select{|c|get.call(c,'code')==355}
              matches=scripts.select{|c|get.call(c,'parameters')[0].to_s.include?('$game_temp.player_new_map_id=46')}
              raise 'Stair transfer not unique' unless matches.length==1
              cmd=matches[0];p=get.call(cmd,'parameters');old=p[0]
              a='$game_temp.player_new_x=76';b='$game_temp.player_new_y=94'
              raise 'Wrong stair spawn source' unless old.scan(a).length==1 && old.scan(b).length==1
              p[0]=old.sub(a,'$game_temp.player_new_x=77').sub(b,'$game_temp.player_new_y=95')
            else
              # Only the existing return destination changes. Exit trigger remains at 81,94.
              e=events.fetch(2)
              raise 'Original exit trigger event moved' unless get.call(e,'x')==81 && get.call(e,'y')==94
              scripts=get.call(get.call(e,'pages').first,'list').select{|c|get.call(c,'code')==355}
              matches=scripts.select{|c|get.call(c,'parameters')[0].to_s.include?('$game_temp.player_new_map_id = 45')}
              raise 'Return transfer not unique' unless matches.length==1
              cmd=matches[0];p=get.call(cmd,'parameters');old=p[0]
              a='$game_temp.player_new_x = 96';b='$game_temp.player_new_y = 74'
              raise 'Wrong return spawn source' unless old.scan(a).length==1 && old.scan(b).length==1
              p[0]=old.sub(a,'$game_temp.player_new_x = 97').sub(b,'$game_temp.player_new_y = 75')
              boss=events.fetch(13)
              raise 'Baphomet event missing or duplicated' unless
                get.call(boss,'x')==157 && get.call(boss,'y')==101 &&
                get.call(boss,'pages').length==3 &&
                get.call(get.call(get.call(boss,'pages').first,'graphic'),'character_name').to_s.force_encoding('UTF-8')=='바포메트'
              raise 'Additional Baphomet found' unless events.values.count{|v|
                g=get.call(get.call(get.call(v,'pages').first,'graphic'),'character_name')
                g.to_s.force_encoding('UTF-8').scrub=='바포메트'}==1
            end
            savemap.call(mid,map)
          end
          # Real player entrance from Talking Island: Map029 EV11 destination 45.
          map29=loadmap.call(29)
          transfers=[]
          get.call(map29,'events').each_value do |event|
            get.call(event,'pages').each do |page|
              get.call(page,'list').each do |cmd|
                next unless get.call(cmd,'code')==201
                p=get.call(cmd,'parameters')
                next unless p[0]==0 && p[1]==45 && p[2]==96 && p[3]==74
                p[2]=97;p[3]=75;transfers<<get.call(event,'id')
              end
            end
          end
          raise 'Unexpected 1F entrance transfers' unless transfers==[11]
          savemap.call(29,map29)

          # All scripts, including original +12,+6 screen projection and inverse,
          # are preserved byte-identically. Never modify or override the projector.
          scripts=File.join(base,'Scripts.rxdata')
          raise 'Missing unchanged game scripts' unless File.file?(scripts)
          puts "PASS dungeon monster spawn positions: #{summary.inspect} (32 per floor, Baphomet included)"
          puts 'PASS player Map029->45 96,74 -> 97,75; Map045->46 76,94 -> 77,95; Map046->45 96,74 -> 97,75'
          puts 'PASS original projector +12,+6 and inverse -12,-6 untouched; no runtime overlay'
          RUBY
          ruby -c build/spawn132.rb
          ruby build/spawn132.rb site

      - name: V229R132 Refresh only changed cache entries, preserve all artwork
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'AUDIT'
          import hashlib,json,re
          from pathlib import Path
          root=Path('site');data=root/'knight/gameasync/Data'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          names=[pre+f'Map{i:03d}.rxdata' for i in (29,45,46)]
          mapping=root/'knight/gameasync/mapping.js'
          text=mapping.read_text('utf8')
          for name in names:
            p=data/name;pattern=r'(Data/'+re.escape(name)+r'\?h=)[0-9a-f]{32}'
            text,n=re.subn(pattern,lambda m:m.group(1)+hashlib.md5(p.read_bytes()).hexdigest(),text)
            assert n==1,('Missing data cache',name,n)
          mapping.write_text(text,encoding='utf8')
          for name in ('index.html','knight/index.html'):
            p=root/name;txt=p.read_text('utf8')
            assert 'V229R131' in txt and 'V229R132' not in txt
            p.write_text(txt.replace('V229R131','V229R132').replace('v229r131','v229r132'),encoding='utf8')
          runtime=root/'knight/js/sl-assets-v229r115.js';txt=runtime.read_text('utf8')
          assert txt.count("var version='V229R131';")==1
          runtime.write_text(txt.replace("var version='V229R131';","var version='V229R132';"),encoding='utf8')
          assert 'js/sl-assets-v229r115.js?v=v229r132' in (root/'knight/index.html').read_text('utf8')
          before=json.loads(Path('build/before.json').read_text('utf8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert before.keys()==after.keys() and len(after)==5566
          expected={'index.html','knight/index.html','knight/gameasync/mapping.js',
                    'knight/js/sl-assets-v229r115.js'}
          expected.update('knight/gameasync/Data/'+n for n in names)
          assert before['knight/gameasync/Data/Scripts.rxdata']==after['knight/gameasync/Data/Scripts.rxdata'], 'Screen projection must remain byte-identical'
          changed={name for name in before if before[name]!=after[name]}
          assert changed==expected,('Unapproved file modification',sorted(changed^expected))
          for p in before:
            if (p.startswith('knight/gameasync/Graphics/') or
                p.startswith('knight/assets/') or
                (p.startswith('knight/gameasync/Data/') and p not in expected) or
                p in ('knight/js/dpad.js','knight/js/drive.js')):
              assert before[p]==after[p],('Protected content changed',p)
          assert (data/pre+'Map045.rxdata').stat().st_size>100000
          assert (data/pre+'Map046.rxdata').stat().st_size>100000
          print('PASS exactly 7 allowed files changed; all game scripts (including screen projector), drop tables, 385 tiles, wall/floor art unchanged')
          AUDIT
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/dpad.js
          node --check site/knight/js/drive.js

      - name: V229R132 Publish existing R131 game with shifted real spawns
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
