          cat > /tmp/rgssad_extract.py <<'PY'
          from pathlib import Path
          import struct
          import sys

          MASK=0xffffffff
          KEY0=0xDEADCAFE

          def rotate(key):
              return ((key*7)+3)&MASK

          src=Path(sys.argv[1])
          out=Path(sys.argv[2])
          out.mkdir(parents=True,exist_ok=True)

          with src.open('rb') as handle:
              header=handle.read(8)

              if header[:7]!=b'RGSSAD\0' or len(header)!=8 or header[7]!=1:
                  raise SystemExit(f'unsupported RGSSAD header: {header!r}')

              key=KEY0
              count=0

              while True:
                  raw=handle.read(4)

                  if not raw:
                      break

                  if len(raw)!=4:
                      raise SystemExit('truncated filename length')

                  name_length=struct.unpack('<I',raw)[0]^key
                  key=rotate(key)

                  if name_length>4096:
                      raise SystemExit(f'bad filename length: {name_length}')

                  encoded=bytearray(handle.read(name_length))

                  if len(encoded)!=name_length:
                      raise SystemExit('truncated filename')

                  for i in range(name_length):
                      encoded[i]^=key&0xff
                      key=rotate(key)

                  raw=handle.read(4)

                  if len(raw)!=4:
                      raise SystemExit('truncated file length')

                  size=struct.unpack('<I',raw)[0]^key
                  key=rotate(key)

                  try:
                      name=bytes(encoded).decode('cp949')
                  except UnicodeDecodeError:
                      name=bytes(encoded).decode('utf-8','replace')

                  parts=[part for part in name.replace('\\','/').split('/') if part not in ('','.','..')]

                  if not parts:
                      raise SystemExit('unsafe path')

                  target=out.joinpath(*parts)
                  target.parent.mkdir(parents=True,exist_ok=True)

                  data_key=key
                  counter=0
                  remaining=size

                  with target.open('wb') as writer:
                      while remaining:
                          chunk=bytearray(handle.read(min(1<<20,remaining)))

                          if not chunk:
                              raise SystemExit(f'truncated data: {name}')

                          key_bytes=data_key.to_bytes(4,'little')

                          for i in range(len(chunk)):
                              chunk[i]^=key_bytes[counter]
                              counter=(counter+1)&3

                              if counter==0:
                                  data_key=rotate(data_key)
                                  key_bytes=data_key.to_bytes(4,'little')

                          writer.write(chunk)
                          remaining-=len(chunk)

                  count+=1

          print(f'FAIRY_RGSSAD_EXTRACT_OK {count}')
          PY

          python3 /tmp/rgssad_extract.py /tmp/fairy_raw/Game.rgssad /tmp/fairy_game

          cp /tmp/fairy_raw/Game.ini /tmp/fairy_game/Game.ini

          if [ -d /tmp/fairy_raw/Audio ]; then
            mkdir -p /tmp/fairy_game/Audio
            cp -a /tmp/fairy_raw/Audio/. /tmp/fairy_game/Audio/
          fi

          test -s /tmp/fairy_game/Data/Scripts.rxdata
          test -d /tmp/fairy_game/Graphics

          cp -a engine/build fairy_player
          rm -rf fairy_player/gameasync fairy_player/preload
          mkdir -p fairy_player/gameasync/Fonts fairy_player/preload

          cp -a /tmp/fairy_game/. fairy_player/gameasync/
          cp engine/extra/rgss.rb fairy_player/gameasync/rgss.rb
          cp engine/COPYING fairy_player/COPYING-mkxp-web.txt
          cp /usr/share/fonts/truetype/nanum/NanumGothic.ttf fairy_player/gameasync/Fonts/NanumGothic.ttf
          cp /usr/share/fonts/truetype/nanum/NanumGothicBold.ttf fairy_player/gameasync/Fonts/NanumGothicBold.ttf

          rm -f fairy_player/gameasync/Game.rgssad fairy_player/gameasync/Save*.rxdata

          echo FAIRY_SOURCE_READY

      - name: Patch Fairy web compatibility
        run: |
          cat > /tmp/patch_fairy.rb <<'RB'
          # encoding: UTF-8
          require 'zlib'

          game=ARGV.fetch(0)
          ini_path=File.join(game,'Game.ini')
          ini=File.binread(ini_path)

          relative=ini[/^Scripts=(.+)$/i,1].to_s.strip.tr('\\','/')
          abort 'Fairy Scripts entry missing' if relative.empty?

          source_path=File.join(game,relative)
          abort "Fairy scripts missing: #{source_path}" unless File.file?(source_path)

          scripts=Marshal.load(File.binread(source_path))

          def inflate(entry)
            Zlib::Inflate.inflate(entry[2]).force_encoding(Encoding::UTF_8)
          end

          def deflate(entry,source)
            entry[2]=Zlib::Deflate.deflate(source)
          end

          def entry_for(scripts,name)
            scripts.find { |entry| entry.is_a?(Array)&&entry.length>=3&&entry[1].to_s==name }
          end

          scripts.reject! do |entry|
            entry.is_a?(Array)&&entry.length>=3&&['Web Compatibility','Web Resolution 800x600','Mobile Diablo Assist'].include?(entry[1].to_s)
          end

          compatibility=<<'RUBY'
          $joiplay=true

          module Kernel
            def exit(*args);nil;end
          end

          class Win32API
            def initialize(*args);@func=args[1].to_s;end

            def web_input(key)
              case key.to_i
              when 9,90 then Input::A
              when 13,32,67 then Input::C
              when 27,88 then Input::B
              when 68 then Input::Z
              when 81 then Input::L
              when 83 then Input::Y
              when 87 then Input::R
              when 65 then Input::X
              when 16 then Input::SHIFT
              when 17 then Input::CTRL
              when 18 then Input::ALT
              else nil
              end
            end

            def call(*args)
              code=web_input(args[0])
              return(code&&Input.trigger?(code) ? 1 : 0) if @func=='GetAsyncKeyState'
              return(code&&Input.press?(code) ? -1 : 0) if @func=='GetKeyState'
              0
            end

            def Call(*args);call(*args);end
          end

          Font.default_name='NanumGothic'

          module Audio
            def self.sl_stream(kind,*parts);puts((['SLAUDIO',kind]+parts.collect{|value|value.to_s}).join('|'));end
            def self.bgm_play(filename,volume=100,pitch=100);sl_stream('BGM_PLAY',filename,volume,pitch);end
            def self.bgm_stop;sl_stream('BGM_STOP');end
            def self.bgm_fade(time);sl_stream('BGM_FADE',time);end
            def self.bgs_play(filename,volume=100,pitch=100);sl_stream('BGS_PLAY',filename,volume,pitch);end
            def self.bgs_stop;sl_stream('BGS_STOP');end
            def self.bgs_fade(time);sl_stream('BGS_FADE',time);end
          end
          RUBY

          scripts.insert(0,[0,'Web Compatibility',Zlib::Deflate.deflate(compatibility)])

          def patch_begin_until(source)
            lines=source.lines

            lines.each_index do |i|
              match=lines[i].match(/^(\s*)end\s+until\s+(.+?)\s*$/)
              next unless match

              indent=match[1]
              condition=match[2]
              j=i-1

              while j>=0
                if lines[j][/^\s*/]==indent&&lines[j].strip=='begin'
                  lines[j]=indent+"loop do\n"
                  lines[i]=indent+"  break if #{condition}\n#{indent}end\n"
                  break
                end

                j-=1
              end
            end

            lines.join
          end

          def patch_scene_loop(source)
            lines=source.lines
            i=0

            while i<lines.length
              unless lines[i].strip=='loop do'
                i+=1
                next
              end

              indent=lines[i][/^\s*/]
              significant=[]
              k=i+1

              while k<lines.length&&significant.length<8
                text=lines[k].strip
                significant << [k,text,lines[k][/^\s*/]] unless text.empty?||text.start_with?('#')
                k+=1
              end

              finish=nil

              if significant.length>=7&&significant[0][1]=='Graphics.update'&&significant[1][1]=='Input.update'&&significant[2][1]=='update'&&significant[3][1]=='if $scene != self'&&significant[4][1]=='break'&&significant[5][1]=='end'&&significant[6][1]=='end'&&significant[6][2]==indent
                finish=significant[6][0]
              elsif significant.length>=5&&significant[0][1]=='Graphics.update'&&significant[1][1]=='Input.update'&&significant[2][1]=='update'&&significant[3][1]=='break if $scene != self'&&significant[4][1]=='end'&&significant[4][2]==indent
                finish=significant[4][0]
              end

              lines[i..finish]=[indent+"end\n\n"+indent+"def dispose\n"] if finish
              i+=1
            end

            lines.join
          end

          browser_loop=<<'RUBY'
          $prev_scene=nil
          $sl_last_scene_name=nil

          def main_update_loop
            begin
              if $scene!=nil
                active_scene=$scene
                name=active_scene.class.to_s

                if $sl_last_scene_name!=name
                  puts('SLFRAME|'+name)
                  $sl_last_scene_name=name
                end

                if active_scene!=$prev_scene
                  $prev_scene.dispose if $prev_scene!=nil&&$prev_scene.respond_to?(:dispose)
                  active_scene.main
                  $prev_scene=active_scene
                  return if $scene!=active_scene
                end

                Graphics.update
                Input.update
                active_scene.update if $scene==active_scene
              end
            rescue Exception=>error
              puts('SLRUNTIMEERR|'+error.class.to_s+'|'+error.message.to_s)
              error.backtrace[0,16].each{|line|puts('SLRUNTIMEBT|'+line.to_s)} if error.respond_to?(:backtrace)&&error.backtrace
            end
          end
          RUBY

          font_rules=[
            [/((?:Font\.default_name)\s*=\s*)\[\s*["'][^"']*["']\s*\]/n,'\1"NanumGothic"'],
            [/(Font\.default_name\s*=\s*)["'][^"']*["']/n,'\1"NanumGothic"'],
            [/(\.font\.name\s*=\s*)["'][^"']*["']/n,'\1"NanumGothic"'],
            [/(\bFONT_NAME\s*=\s*)["'][^"']*["']/n,'\1"NanumGothic"']
          ]

          scripts.each do |entry|
            next unless entry.is_a?(Array)&&entry.length>=3

            name=entry[1].to_s

            begin
              source=inflate(entry)
            rescue
              next
            end

            font_rules.each { |rule,replacement| source.gsub!(rule,replacement) }

            source.gsub!('defined?($joiplay) && $joiplay','$joiplay == true')
            source="# native Plane used on web\n" if source.match?(/^\s*class\s+Plane\s*<\s*Sprite\b/n)
            source=patch_begin_until(source)
            source=patch_scene_loop(source) unless name=='Main'||name=='Scene_Map'

            if name=='Main'
              source=browser_loop+source unless source.include?('def main_update_loop')
              source.sub!(/\n\s*while\s+\$scene\s*!=\s*nil\s*\r?\n\s*\$scene\.main\s*\r?\n\s*end\s*/m,"\n")
            end

            deflate(entry,source)
          end

          resolution=entry_for(scripts,'해상도')

          if resolution
            source=inflate(resolution)
            source.gsub!('$WINDOW_WIDTH = 640','$WINDOW_WIDTH = 800')
            source.gsub!('$WINDOW_HEIGHT = 480','$WINDOW_HEIGHT = 600')
            source.gsub!('640, 480','800, 600')
            deflate(resolution,source)
          end

          scripts.each do |entry|
            next unless entry.is_a?(Array)&&entry.length>=3

            begin
              source=inflate(entry)
            rescue
              next
            end

            deflate(entry,"# web: XRXS menu transparency disabled\n") if source.include?('XRXS_MP7_Module')
          end

          main_index=scripts.index { |entry| entry.is_a?(Array)&&entry.length>=3&&entry[1].to_s=='Main' }
          abort 'Fairy Main missing' unless main_index

          resolution_shim=<<'RUBY'
          $WINDOW_WIDTH=800
          $WINDOW_HEIGHT=600

          begin
            Graphics.resize_screen(800,600)
          rescue
          end
          RUBY

          scripts.insert(main_index,[99999990,'Web Resolution 800x600',Zlib::Deflate.deflate(resolution_shim)])

          output=File.join(game,'Data','Scripts.rxdata')
          File.binwrite(output,Marshal.dump(scripts))

          if File.expand_path(source_path)!=File.expand_path(output)&&File.exist?(source_path)
            File.delete(source_path)
          end

          lines=ini.split(/\r?\n/).map do |line|
            if line=~/^Scripts=/i
              'Scripts=Data\\Scripts.rxdata'
            elsif line=~/^Title=/i
              'Title=SLFairy'
            else
              line
            end
          end

          File.binwrite(ini_path,lines.join("\r\n")+"\r\n")
          puts 'FAIRY_WEB_PATCH_OK'
          RB

          ruby -c /tmp/patch_fairy.rb

      - name: Patch and convert Fairy
        run: |
          ruby -EUTF-8:UTF-8 /tmp/patch_fairy.rb fairy_player/gameasync
          ruby -EUTF-8:UTF-8 /tmp/mobile_runtime.rb fairy_player fairy

          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          root=Path('fairy_player/gameasync')
          audio=root/'Audio'
          extensions={'.mp3','.wav','.wma','.aac','.m4a','.flac','.mid','.midi'}
          failures=[]

          if audio.exists():
              for src in [p for p in audio.rglob('*') if p.is_file() and p.suffix.lower() in extensions]:
                  out=src.with_suffix('.ogg')
                  temp=None

                  try:
                      input_file=src

                      if src.suffix.lower() in {'.mid','.midi'}:
                          temp=src.with_name(src.name+'.wav')
                          subprocess.run(['timidity',str(src),'-Ow','-o',str(temp)],check=True)
                          input_file=temp

                      subprocess.run(['ffmpeg','-nostdin','-v','error','-y','-i',str(input_file),'-c:a','libvorbis','-q:a','4',str(out)],check=True)

                      if not out.exists() or out.stat().st_size==0:
                          raise RuntimeError('empty output')

                      if temp and temp.exists():
                          temp.unlink()

                      if src!=out and src.exists():
                          src.unlink()

                  except Exception as error:
                      failures.append((str(src),str(error)))

                      if temp and temp.exists():
                          temp.unlink()

          if failures:
              for file,error in failures:
                  print(file+' -> '+error,file=sys.stderr)

              raise SystemExit(1)

          graphics=root/'Graphics'

          if graphics.exists():
              for src in [p for p in graphics.rglob('*') if p.is_file() and p.suffix.lower() in {'.bmp','.gif','.webp','.tif','.tiff'}]:
                  out=src.with_suffix('.png')
                  subprocess.run(['convert',str(src)+'[0]',str(out)],check=True)

                  if not out.exists() or out.stat().st_size==0:
                      raise SystemExit('image conversion failed: '+str(src))

                  src.unlink()

          print('FAIRY_MEDIA_OK')
          PY

      - name: Build Fairy independently
        run: |
          set -euo pipefail

          CORE="elf-core-${BUILD_ID}"

          /tmp/build_core.sh fairy_player "$CORE"

          python3 /tmp/configure_site.py fairy_player SLFairy elf slfairy_independent_save "$CORE" "$BUILD_ID"

          test -s "fairy_player/$CORE.data"
          test -s "fairy_player/$CORE.js"
          node --check fairy_player/js/mobile.js
          node --check fairy_player/js/drive.js

          ! grep -Fq 'is_touch_device' fairy_player/index.html
          ! grep -Fq 'bindKey(' fairy_player/index.html
          ! grep -Fq 'id="dpad"' fairy_player/index.html
          ! grep -Fq 'id="apad"' fairy_player/index.html

          grep -Fq 'id="sl-attack"' fairy_player/index.html
          grep -Fq "window.SL_VARIANT = 'elf'" fairy_player/index.html

          echo FAIRY_READY

      - name: Assemble launcher
        run: |
          set -euo pipefail

          rm -rf /tmp/site
          mkdir -p /tmp/site/knight /tmp/site/elf

          cp -a player/. /tmp/site/knight/
          cp -a fairy_player/. /tmp/site/elf/

          cat > /tmp/site/index.html <<HTML
          <!doctype html>
          <html lang="ko">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
            <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
            <meta http-equiv="Pragma" content="no-cache">
            <meta http-equiv="Expires" content="0">
            <title>SL Mobile</title>
            <style>
              html,body{margin:0;width:100%;height:100%;background:#080808;color:#fff;font-family:system-ui,sans-serif}
              .wrap{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px}
              .choices{display:flex;gap:18px}
              .card{width:150px;height:170px;border:1px solid #777;border-radius:14px;background:#171717;color:#fff;font-size:25px}
              .card:active{transform:scale(.97)}
            </style>
          </head>
          <body>
            <div class="wrap">
              <h1>캐릭터 선택</h1>
              <div class="choices">
                <button class="card" onclick="location.href='knight/?v=${BUILD_ID}'">기사</button>
                <button class="card" onclick="location.href='elf/?v=${BUILD_ID}'">요정</button>
              </div>
            </div>
          </body>
          </html>
          HTML

          touch /tmp/site/.nojekyll

          rm -rf player fairy_player
          mv /tmp/site player

      - name: Verify clean mobile package
        run: |
          set -euo pipefail

          test -s player/index.html
          test -s "player/knight/knight-core-${BUILD_ID}.data"
          test -s "player/knight/knight-core-${BUILD_ID}.js"
          test -s "player/elf/elf-core-${BUILD_ID}.data"
          test -s "player/elf/elf-core-${BUILD_ID}.js"

          for variant in knight elf; do
            test -s "player/$variant/index.html"
            test -s "player/$variant/mkxp.js"
            test -s "player/$variant/mkxp.wasm"
            test -s "player/$variant/js/mobile.js"
            test -s "player/$variant/js/drive.js"
            test -s "player/$variant/gameasync/mapping.js"
            test -s "player/$variant/gameasync/Data/Scripts.rxdata"
            test ! -e "player/$variant/js/dpad.js"

            ! grep -Fq 'is_touch_device' "player/$variant/index.html"
            ! grep -Fq 'bindKey(' "player/$variant/index.html"
            ! grep -Fq 'id="dpad"' "player/$variant/index.html"
            ! grep -Fq 'id="apad"' "player/$variant/index.html"

            grep -Fq 'id="sl-stick-zone"' "player/$variant/index.html"
            grep -Fq 'id="sl-attack"' "player/$variant/index.html"
            grep -Fq 'id="sl-edit"' "player/$variant/index.html"
            grep -Fq "v=${BUILD_ID}" "player/$variant/index.html"
            grep -Fq 'sl-layout-' "player/$variant/js/mobile.js"
            grep -Fq "bindButton('sl-attack', 68, true)" "player/$variant/js/mobile.js"

            node --check "player/$variant/js/mobile.js"
            node --check "player/$variant/js/drive.js"
          done

          grep -Fq "knight-core-${BUILD_ID}.js?v=${BUILD_ID}" player/knight/index.html
          grep -Fq "elf-core-${BUILD_ID}.js?v=${BUILD_ID}" player/elf/index.html

          ruby -EUTF-8:UTF-8 -rzlib - <<'RB'
          paths=[
            'player/knight/gameasync/Data/Scripts.rxdata',
            'player/elf/gameasync/Data/Scripts.rxdata'
          ]

          paths.each do |path|
            scripts=Marshal.load(File.binread(path))

            all=scripts.map do |entry|
              begin
                Zlib::Inflate.inflate(entry[2]).force_encoding(Encoding::UTF_8)
              rescue
                ''
              end
            end.join("\n")

            abort "#{path}: target lock missing" unless all.include?('sl_mobile_toggle_target')
            abort "#{path}: attack tick missing" unless all.include?('sl_mobile_attack_tick')
            abort "#{path}: boot marker missing" unless all.include?('SLBOOT|RUBY_MAIN')
            abort "#{path}: old auto attack remains" if all.include?('$mobile_auto_attack_active')
          end

          puts 'RUBY_RUNTIME_VERIFY_OK'
          RB

          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          for base in [Path('player/knight'),Path('player/elf')]:
              html=(base/'index.html').read_text()
              scripts=re.findall(r'<script(?:\s+[^>]*)?>(.*?)</script>',html,re.S)

              for index,source in enumerate(scripts):
                  if not source.strip():
                      continue

                  path=Path(f'/tmp/{base.name}-{index}.js')
                  path.write_text(source)
                  subprocess.run(['node','--check',str(path)],check=True)

          print('INLINE_JS_VERIFY_OK')
          PY

          ! grep -R -Fq 'tools-v149-complete.zip' player

          echo "BUILD_ID=${BUILD_ID}"
          echo CLEAN_MOBILE_VERIFY_OK
          du -sh player

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
