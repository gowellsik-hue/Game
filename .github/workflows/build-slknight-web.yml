name: build-slknight-web.yml | V4.17 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Resolve final V4.16 deployment
        id: baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BASE_SHA=9cab02b37866199fa1236481d1beb380ea3eccfb

          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/build-slknight-web.yml/runs" \
            -f head_sha="$BASE_SHA" \
            -f status=success \
            -f per_page=100 \
            > /tmp/sl417-runs.json

          RUN_ID=$(jq -er \
            --arg sha "$BASE_SHA" \
            '[.workflow_runs[]
              | select(
                  .head_sha==$sha
                  and .head_branch=="main"
                  and .status=="completed"
                  and .conclusion=="success"
                )]
              | sort_by(.created_at)
              | last
              | .id // empty' \
            /tmp/sl417-runs.json)

          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" \
            > /tmp/sl417-jobs.json

          jq -e \
            '[.jobs[]
              | select(
                  .name=="deploy"
                  and .conclusion=="success"
                )]
              | length==1' \
            /tmp/sl417-jobs.json

          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            > /tmp/sl417-artifacts.json

          jq -e \
            '[.artifacts[]
              | select(
                  .name=="github-pages"
                  and .expired==false
                  and .size_in_bytes>0
                )]
              | length==1' \
            /tmp/sl417-artifacts.json

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Restore final V4.16 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: ${{ steps.baseline.outputs.run_id }}
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Restore existing V4.17 implementation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SOURCE_SHA=9d888aa37a7f8daba370841a674966516f0863a7
          BLOB_SHA=f96ebb769414cc534adf968a32729715265e1c34

          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/contents/.github/workflows/build-slknight-web.yml" \
            -f ref="$SOURCE_SHA" \
            --jq '.content' \
            | base64 --decode \
            > /tmp/sl417-existing.yml

          test "$(git hash-object /tmp/sl417-existing.yml)" = "$BLOB_SHA"

          python3 - <<'PYTHON'
          from pathlib import Path

          src=Path('/tmp/sl417-existing.yml').read_text('utf8')

          scripts={
              'Restore pinned creation source':
                  '/tmp/sl417-load-existing.sh',

              'Verify original game':
                  '/tmp/sl417-existing-verify.sh',

              'Restore character creation scene':
                  '/tmp/sl417-existing-creation.sh',

              'Verify all 22 name-first creation paths':
                  '/tmp/sl417-existing-test.sh',

              'Separate name input from engine callbacks':
                  '/tmp/sl417-existing-bridge.sh',

              'Update V4.17 data references':
                  '/tmp/sl417-existing-mapping.sh',

              'Verify exact modification scope':
                  '/tmp/sl417-existing-scope.sh'
          }

          for name,path in scripts.items():

              marker='      - name: '+name+'\n'

              assert src.count(marker)==1,name

              section=src.split(marker,1)[1].split(
                  '\n      - name: ',1
              )[0]

              anchor='        run: |\n'

              assert section.count(anchor)==1,name

              lines=section.split(anchor,1)[1].split('\n')

              out=[]

              for line in lines:

                  if line.startswith('          '):
                      out.append(line[10:])

                  elif line=='':
                      out.append(line)

                  else:
                      break

              result='\n'.join(out).rstrip()+'\n'

              assert result.startswith(
                  'set -euo pipefail\n'
              ),name

              Path(path).write_text(
                  result,'utf8'
              )

              print('PASS original step:',name)

          print('PASS existing V4.17 source')
          PYTHON

          for script in \
            /tmp/sl417-load-existing.sh \
            /tmp/sl417-existing-verify.sh \
            /tmp/sl417-existing-creation.sh \
            /tmp/sl417-existing-test.sh \
            /tmp/sl417-existing-bridge.sh \
            /tmp/sl417-existing-mapping.sh \
            /tmp/sl417-existing-scope.sh
          do
            bash -n "$script"
          done

          bash -euo pipefail \
            /tmp/sl417-load-existing.sh

      - name: Verify original game
        shell: bash
        run: |
          set -euo pipefail

          bash -euo pipefail \
            /tmp/sl417-existing-verify.sh

      - name: Fix native name reading and decision position
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path

          patch=Path('/tmp/sl417-run-creation.sh')
          test=Path('/tmp/sl417-run-test.sh')

          original=patch.read_text('utf8')
          updated=original

          changes=[
              (
                  'w.y=112',
                  'w.y=80'
              ),
              (
                  '@sl417_header.y=64',
                  '@sl417_header.y=48'
              ),
              (
                  '@sl417_decision.y=496',
                  '@sl417_decision.y=432'
              ),
              (
                  "      raw=File.open('SL417Name.tmp','rb'){\n"
                  "        |f|f.read\n"
                  "      }",

                  "      n=File.size('SL417Name.tmp')\n"
                  "      return if n<=2\n"
                  "\n"
                  "      raw=File.open('SL417Name.tmp','rb'){\n"
                  "        |f|f.read(n)\n"
                  "      }"
              ),
              (
                  "name=(name||'').force_encoding('UTF-8')",
                  "name=(name||'').strip"
              ),
              (
                  "      File.open('SL417Name.tmp','wb'){\n"
                  '        |f|f.write("0\\n"+name)\n'
                  "      }\n"
                  "\n"
                  "      if !name.valid_encoding? ||",

                  "      File.open('SL417Name.tmp','wb'){\n"
                  '        |f|f.write("0\\n")\n'
                  "      }\n"
                  "\n"
                  "      if !name.valid_encoding? ||"
              ),
              (
                  "      if !name.valid_encoding? ||\n"
                  "         name.strip.empty? ||\n"
                  "         name.split(//).size>$game_temp.name_max_char ||",

                  "      if name.empty? ||\n"
                  "         name.unpack('U*').size>$game_temp.name_max_char ||"
              )
          ]

          for old,new in changes:

              assert updated.count(old)==1,old

              updated=updated.replace(old,new,1)

          assert len(changes)==7

          reverse=updated

          for old,new in reversed(changes):

              assert reverse.count(new)==1,new

              reverse=reverse.replace(new,old,1)

          assert reverse==original

          patch.write_text(updated,'utf8')

          original_test=test.read_text('utf8')

          assert original_test.count(
              'decision.y==496'
          )==1

          updated_test=original_test.replace(
              'decision.y==496',
              'decision.y==432',
              1
          )

          assert updated_test.replace(
              'decision.y==432',
              'decision.y==496',
              1
          )==original_test

          test.write_text(updated_test,'utf8')

          print('PASS exact seven runtime replacements')
          print('PASS original character profiles retained')
          print('PASS original direction handling retained')
          print('PASS original confirmation handling retained')
          print('PASS original equipment handling retained')
          print('PASS native file length reading')
          print('PASS native UTF-8 character counting')
          print('PASS decision within visible screen')
          PYTHON

          bash -n /tmp/sl417-run-creation.sh

          bash -n /tmp/sl417-run-test.sh

          bash -euo pipefail \
            /tmp/sl417-existing-creation.sh

          ruby - <<'RUBY'
          require 'zlib'

          path='site/knight/gameasync/Data/Scripts.rxdata'

          rows=Marshal.load(File.binread(path))

          raise 'Script count' unless rows.size==137

          s=Zlib::Inflate.inflate(
            rows.fetch(94)[2]
          ).force_encoding('UTF-8')

          RubyVM::InstructionSequence.compile(s)

          raise 'Unbounded name read' if
            s.include?('|f|f.read'+"\n")

          raise 'Unsupported name encoding' if
            s.include?("name=(name||'').force_encoding")

          raise 'Unsupported encoding validation' if
            s.include?('!name.valid_encoding?')

          raise 'Missing native length' unless
            s.include?("n=File.size('SL417Name.tmp')")

          raise 'Missing idle guard' unless
            s.include?('return if n<=2')

          raise 'Missing bounded read' unless
            s.include?('|f|f.read(n)')

          raise 'Missing UTF-8 count' unless
            s.include?("name.unpack('U*').size")

          raise 'Old payload retained' if
            s.include?('|f|f.write("0\n"+name)')

          raise 'List position' unless
            s.include?('w.y=80')

          raise 'Header position' unless
            s.include?('@sl417_header.y=48')

          raise 'Decision position' unless
            s.include?('@sl417_decision.y=432')

          puts 'PASS compiled native creation script'
          RUBY

      - name: Verify all 22 name-first creation paths
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path

          test=Path('/tmp/sl417-test-original.rb')

          original=test.read_text('utf8')

          anchor="require 'ostruct'\n"

          replacement="""require 'ostruct'

          class << File
            alias_method :sl417_fixture_open, :open

            def open(path,*args,&block)
              value=sl417_fixture_open(path,*args,&block)

              if block &&
                 path=='SL417Name.tmp' &&
                 args==['rb'] &&
                 value.is_a?(String)

                value.force_encoding('UTF-8')
              end

              value
            end
          end
          """

          assert original.count(anchor)==1

          updated=original.replace(
              anchor,
              replacement,
              1
          )

          assert updated.count(replacement)==1

          assert updated.replace(
              replacement,
              anchor,
              1
          )==original

          test.write_text(updated,'utf8')

          print('PASS test-only Ruby encoding compatibility')
          PYTHON

          ruby -c /tmp/sl417-test-original.rb

          bash -euo pipefail \
            /tmp/sl417-existing-test.sh

      - name: Restore unchanged name input bridge
        shell: bash
        run: |
          set -euo pipefail

          bash -euo pipefail \
            /tmp/sl417-existing-bridge.sh

      - name: Update V4.17 data references
        shell: bash
        run: |
          set -euo pipefail

          bash -euo pipefail \
            /tmp/sl417-existing-mapping.sh

      - name: Verify exact modification scope
        shell: bash
        run: |
          set -euo pipefail

          bash -euo pipefail \
            /tmp/sl417-existing-scope.sh

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          import json

          root=Path('site')

          before=json.loads(
              Path('/tmp/sl417-before.json').read_text('utf8')
          )

          after={
              p.relative_to(root).as_posix():
                  hashlib.sha256(
                      p.read_bytes()
                  ).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          assert len(after)==6086

          assert set(before)==set(after)

          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          expected={
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/Data/'+pre+'Map007.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'knight/index.html',
              'index.html'
          }

          changed={
              name
              for name in before
              if before[name]!=after[name]
          }

          assert changed==expected,sorted(changed^expected)

          protected=[
              'knight/js/dpad.js',
              'knight/js/drive.js',
              'knight/mkxp.js',
              'knight/mkxp.wasm',
              'knight/gameasync/bitmap-map.js',
              'knight/gameasync/Data/'+pre+'System.rxdata',
              'knight/gameasync/Data/'+pre+'Map047.rxdata',
              'knight/gameasync/Data/'+pre+'Actors.rxdata',
              'knight/gameasync/Data/'+pre+'Classes.rxdata',
              'knight/gameasync/Data/'+pre+'Weapons.rxdata',
              'knight/gameasync/Data/'+pre+'Armors.rxdata',
              'knight/gameasync/Data/'+pre+'Items.rxdata',
              'knight/gameasync/Data/'+pre+'CommonEvents.rxdata'
          ]

          for name in protected:

              assert name in before,name

              assert before[name]==after[name],name

          print('PASS existing game controls unchanged')
          print('PASS existing engine unchanged')
          print('PASS existing equipment data unchanged')
          print('PASS existing map data unchanged')
          print('PASS 6080 original files unchanged')
          print('PASS V4.17')
          PYTHON

      - name: Upload V4.17
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
