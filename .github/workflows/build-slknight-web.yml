          game = ARGV[0]

          class RawMarshalObject
            def self._load(data)
              obj = allocate
              obj.instance_variable_set(
                :@raw,
                data
              )

              obj
            end

            def _dump(_depth)
              @raw
            end
          end

          class Tone < RawMarshalObject
          end

