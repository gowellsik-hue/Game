          GL4BFAIEAh4GCgYQAggGAggYugEMAgYCJAgeFgQEGLoBDAIGAiQIHhYEBBi0AQ4C
          CgIcDAwCEAIKChICDLgBDgIKAhwMDAIQAgoKEgIMtgEMAigOCAQkCBq6AQwCKA4I
          BCQIGroBCAIUAhASCAIGAhQCDgIYvgEIAhQCEBIIAgYCFAIOAhiyAQYCCgImDgQC
          AgQGAhICDAIEBBiyAQYCCgImDgQCAgQGAhICDAIEBBiuAS4CCg4IBgQCCgIUAg4C
          AgQQrAEuAgoOCAYEAgoCFAIOAgIEEKgBAgQMBCgGDAIKAggCCAIKAh4CEqABAgQM
          BCgGDAIKAggCCAIKAh4CEp4BGgIgChwEFAISAhACEJ4BGgIgChwEFAISAhACEJ4B
          HAIWAgQIDAIUAgQCGgIIAgwCCqYBHAIWAgQIDAIUAgQCGgIIAgwCCq4BEAIWAgYG
          DgIKAgwCBAIGAgwEEAQQrgEQAhYCBgYOAgoCDAIEAgYCDAQQBBCyASwIDgIGAiYM
          GLoBLAgOAgYCJgwYvAECBBwCCggmAgQCCBQUvAECBBwCCggmAgQCCBQUxAEgAggG
          JgIKGBDGASACCAYmAgoYEMYBCgIMAgQCBAIWAhQCChwSxAEKAgwCBAIEAhYCFAIK
          HBLMAUgCCCQK0AFIAggkCtQBBgI2AgqGAgYCNgIKiAIEAhoCCgIKAgqMAgQCGgIK
          AgoCCowCHAIIAgQQBJACHAIIAgQQBJoCGBQGngIYFAacAhYCAhAIngIWAgIQCLIC
          DAgGtgIMCAa4AgYCCr4CBgIKwgIKxgIKxgIGygIGumo=
          """

          SOURCE = {
              45: dict(w=256, h=256, rw=288, rh=144, yoff=378,
                       data=S32_45, r94=R94_45,
                       packed_sha='427aaeb58e1049facf024d7114c13e16bd77c61e31240f8ff0f3139f0cdc03e2',
                       source_sha='92b5cf7c1c89ae4b88f80e70ba56c851d1913df4b9b40f5ecae9ce7fbe893b53',
                       rpg_sha='1228f0f3e6df3452196901469ceb02d17802a6747fecfb9db23e595baa279011'),
              46: dict(w=320, h=256, rw=336, rh=168, yoff=762,
                       data=S32_46, r94=R94_46,
                       packed_sha='153c47499fb220727831d05332c15db28ce88888da7c4f25f3053bad81f3796c',
                       source_sha='01b211b563d76bc27838e221c356e5a4be909fbc35af22bf224869105fb8bd68',
                       rpg_sha='b50a46669deba5026cf0d27eb9564397cbbb1278bfab43c6137cf69f69f49606')
          }
          ORIGIN_X, ORIGIN_Y = 32576, 32704
          MOVE = {2: (-1,1), 4: (-1,-1), 6: (1,1), 8: (1,-1)}
          BIT = {2:1,4:2,6:4,8:8}
          OPPOSITE = {2:8,4:6,6:4,8:2}

          def unbase(text):
              return base64.b64decode(''.join(text.split()), validate=True)

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def decode_rle(encoded, width, height):
              binary=unbase(encoded)
              out=bytearray()
              value=0
              length=0
              shift=0
              for byte in binary:
                  length |= (byte & 127) << shift
                  if byte & 128:
                      shift+=7
                      if shift>28:raise ValueError('Invalid varint')
                      continue
                  if not length:raise ValueError('Empty run')
                  if len(out)+length>width*height:raise ValueError('RLE overflow')
                  out.extend(bytes([value])*length)
                  value ^= 1
                  length=0
                  shift=0
              if shift or length or len(out)!=width*height:
                  raise ValueError('Invalid exact RPG dimensions')
              return bytes(out)

          grids={}
          original_rpg={}
          for mid, info in SOURCE.items():
              compressed=unbase(info['data'])
              if sha(compressed)!=info['packed_sha']:
                  raise ValueError(f'Map{mid} compressed S32 source bytes mismatch')
              # Two compression formats; both decode to exact original S32 bytes.
              source=bz2.decompress(compressed) if mid==46 else zlib.decompress(compressed)
              if len(source)!=info['w']*info['h'] or sha(source)!=info['source_sha']:
                  raise ValueError(f'Map{mid} original S32 coordinates mismatch')
              grids[mid]=source
              print(f'PASS Map{mid}: exact S32 native coordinate source')
              rpg=decode_rle(info['r94'],info['rw'],info['rh'])
              if sha(rpg)!=info['rpg_sha']:
                  raise ValueError(f'Map{mid} R94 RPG coordinates mismatch')
              original_rpg[mid]=rpg
              print(f'PASS Map{mid}: exact R94 RPG coordinates by SHA256')

          def source_value(mid, x, y):
              info=SOURCE[mid]
              rx,ry=x-ORIGIN_X,y-ORIGIN_Y
              if not (0<=rx<info['w'] and 0<=ry<info['h']):return 255
              return grids[mid][ry*info['w']+rx]

          exception_compressed=unbase(S32_EXCEPTIONS)
          if sha(exception_compressed)!='450ab2266bc556177c1f7603460a197aeb3c2b87e5fe29138830d97105e0b53b':
              raise ValueError('Embedded R94 direction mask copy differs from original ZIP')
          packed=zlib.decompress(exception_compressed)
          if sha(packed)!='9ea6dffb96e7afeee9526b36df2a0719bda5f729a11fde09489be90f893e668a':
              raise ValueError('Changed R94 original direction table')
          if len(packed)%3:raise ValueError('Invalid exception coordinate triples')
          masks={}
          for i in range(0,len(packed),3):
              x=ORIGIN_X+packed[i]
              y=ORIGIN_Y+packed[i+1]
              mask=packed[i+2]
              if (x,y) in masks or mask not in (3,12):
                  raise ValueError(f'Invalid direction mask at {x},{y}')
              if source_value(45,x,y)!=0:
                  raise ValueError(f'Original S32 wall overridden at {x},{y}')
              masks[x,y]=mask
              for direction,(dx,dy) in MOVE.items():
                  neighbor=source_value(45,x+dx,y+dy)
                  allowed=bool(mask & BIT[direction]) and neighbor not in (0,255)
                  incoming=bool(mask & BIT[OPPOSITE[direction]])
                  # The stored mask is directional; no binary-open
                  # inference is made from source wall and floor counts.
                  if allowed and (x+dx,y+dy) in masks:
                      raise ValueError(f'Two adjacent wall exceptions at {x},{y}')
          if masks.get((32655,32806))!=12:
              raise ValueError('Designated direction mask not found by coordinate')

          # Transform this ONE approved native source coordinate to RPG pixel/cell.
          native_x,native_y=32655,32806
          if source_value(45,native_x,native_y)!=0:
              raise ValueError('Designated S32 point is not original wall')
          for direction,(dx,dy) in MOVE.items():
              neighbor=source_value(45,native_x+dx,native_y+dy)
              expected=3 if direction in (6,8) else 0
              if neighbor!=expected:
                  raise ValueError(f'Wrong native neighbor {direction} at {native_x+dx},{native_y+dy}: {neighbor}')
              allowed=(masks[(native_x,native_y)] & BIT[direction])!=0
              if allowed!=(direction in (6,8)):
                  raise ValueError(f'Wrong approved direction at {native_x},{native_y},{direction}')

          # Map045 1-cell projection offset comes from R94; no similar 2F shift.
          px=12*(native_x+native_y)-784128+12
          py=6*(native_y-native_x)+SOURCE[45]['yoff']+6
          rpg_x,rpg_y=px//16,py//16
          if (px,py)!=(1416,1290) or (rpg_x,rpg_y)!=(88,80):
              raise ValueError(f'Wrong native-to-RPG projection: {px},{py} => {rpg_x},{rpg_y}')

          pos=rpg_y*SOURCE[45]['rw']+rpg_x
          if original_rpg[45][pos]!=0:
              raise ValueError(f'Approved native wall not blocked in R94 RPG: {rpg_x},{rpg_y}')
          repaired=bytearray(original_rpg[45])
          repaired[pos]=1
          # Coordinate-based exact diff; do not accept based on open-tile counts.
          modified=[(i%SOURCE[45]['rw'],i//SOURCE[45]['rw'])
                    for i,(a,b) in enumerate(zip(original_rpg[45],repaired)) if a!=b]
          if modified!=[(rpg_x,rpg_y)]:
              raise ValueError(f'Unapproved map cell: {modified}')
          for mid,arr in ((45,repaired),(46,original_rpg[46])):
              Path(f'build/r94-map{mid:03d}.bin').write_bytes(arr)
          if Path('build/r94-map046.bin').read_bytes()!=original_rpg[46]:
              raise ValueError('Floor 2 coordinate data changed')
          print(f'PASS approved native ({native_x},{native_y), 6/8 only, RPG ({rpg_x},{rpg_y}) 385->384')
          print('PASS all other R94 RPG coordinates remain byte-identical')
          PY
          python3 build/coordinate_source.py

      - name: V229R147 Apply verified RPG collision layer only
        shell: bash
        run: |
          set -euo pipefail
          cat > build/apply_r94.rb <<'RUBY'
          module RPG
            class Map; end
            class Event; end
            class Event::Page; end
            class Event::Page::Condition; end
            class Event::Page::Graphic; end
            class EventCommand; end
            class MoveCommand; end
            class MoveRoute; end
            class MapInfo; end
            class AudioFile; end
            class Tileset; end
          end
          class Table
            def self._load(raw)
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end
            def _dump(_depth); @raw; end
          end
          class Tone
            def self._load(raw)
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end
            def _dump(_depth); @raw; end
          end
          class Color
            def self._load(raw)
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end
            def _dump(_depth); @raw; end
          end

          root='site/knight/gameasync/Data'
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          {45=>[288,144],46=>[336,168]}.each do |mid,(width,height)|
            filename=File.join(root,prefix+format('Map%03d.rxdata',mid))
            original_binary=File.binread(filename)
            map=Marshal.load(original_binary)
            raise "Map#{mid}: original serialization mismatch" unless
              Marshal.dump(map)==original_binary
            raise "Map#{mid}: dimensions changed" unless
              map.instance_variable_get(:@width)==width &&
              map.instance_variable_get(:@height)==height
            table=map.instance_variable_get(:@data)
            original_raw=table.instance_variable_get(:@raw)
            total=width*height
            header=[3,width,height,3,total*3]
            raise "Map#{mid}: unexpected table geometry" unless
              original_raw[0,20].unpack('V5')==header &&
              original_raw.bytesize==20+total*6
            layer_bytes=total*2
            existing=original_raw[20,layer_bytes].unpack('v*')
            raise "Map#{mid}: non-384/385 terrain" unless
              existing.all?{|id|id==384 || id==385}
            mask=File.binread(format('build/r94-map%03d.bin',mid))
            raise "Map#{mid}: invalid exact terrain coordinate bytes" unless
              mask.bytesize==total && mask.bytes.all?{|v|v==0 || v==1}
            target=mask.bytes.map{|v|v==1 ? 384 : 385}.pack('v*')
            modified_raw=original_raw.b.dup
            modified_raw[20,layer_bytes]=target
            raise "Map#{mid}: upper layers changed" unless
              modified_raw[20+layer_bytes,total*4]==original_raw[20+layer_bytes,total*4]
            table.instance_variable_set(:@raw,modified_raw)
            modified_binary=Marshal.dump(map)
            table.instance_variable_set(:@raw,original_raw)
            raise "Map#{mid}: game events changed" unless Marshal.dump(map)==original_binary
            File.binwrite(filename,modified_binary) if modified_binary!=original_binary
            saved=Marshal.load(File.binread(filename))
            raw=saved.instance_variable_get(:@data).instance_variable_get(:@raw)
            raise "Map#{mid}: on-disk collision mismatch" unless
              raw[20,layer_bytes]==target &&
              raw[20+layer_bytes,total*4]==original_raw[20+layer_bytes,total*4]
            puts "PASS Map#{mid}: exact coordinate buffer restored, no other map layers"
          end
          RUBY
          ruby -c build/apply_r94.rb
          ruby build/apply_r94.rb

      - name: V229R147 Update map cache hashes and version labels
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          root=Path('site')
          mapping=root/'knight/gameasync/mapping.js'
          text=mapping.read_text('utf8')
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          for floor in (45,46):
              filename=prefix+f'Map{floor:03d}.rxdata'
              digest=hashlib.md5((root/'knight/gameasync/Data'/filename).read_bytes()).hexdigest()
              pattern=r'(Data/'+re.escape(filename)+r'\?h=)[0-9a-f]{32}'
              text,n=re.subn(pattern,lambda m:m.group(1)+digest,text)
              if n!=1:raise ValueError(f'Map{floor} cache entry not unique')
          mapping.write_text(text,encoding='utf8')
          for name in ('index.html','knight/index.html'):
              path=root/name
              before=path.read_text('utf8')
              if 'V229R142' not in before:raise ValueError(f'Wrong game baseline: {name}')
              path.write_text(before.replace('V229R142','V229R147')
                                    .replace('v229r142','v229r147'),encoding='utf8')
          assets=root/'knight/js/sl-assets-v229r115.js'
          original=assets.read_text('utf8')
          token="var version='V229R142';"
          if original.count(token)!=1:raise ValueError('Unexpected asset version')
          assets.write_text(original.replace(token,"var version='V229R147';"),'utf8')
          if 'js/sl-assets-v229r115.js?v=v229r147' not in (root/'knight/index.html').read_text('utf8'):
              raise ValueError('Game assets cache version mismatch')
          print('PASS map cache SHA pointers and V229R147 page labels')
          PY
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/dpad.js
          node --check site/knight/js/drive.js

      - name: V229R147 Protect all unrelated files and controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before=json.loads(Path('build/before.json').read_text('utf8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          if before.keys()!=after.keys():raise ValueError('Original game file set changed')
          prefix='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          allowed={prefix+'Map045.rxdata',prefix+'Map046.rxdata',
                   'knight/gameasync/mapping.js','index.html','knight/index.html',
                   'knight/js/sl-assets-v229r115.js'}
          changed={p for p in before if before[p]!=after[p]}
          if changed-allowed:
              raise ValueError('Unapproved file mutation: '+', '.join(sorted(changed-allowed)))
          for original_file in (prefix+'Map029.rxdata',prefix+'Map047.rxdata',
                                'knight/gameasync/Data/Scripts.rxdata',
                                'knight/js/dpad.js','knight/js/drive.js'):
              if before[original_file]!=after[original_file]:
                  raise ValueError(f'Protected original changed: {original_file}')
          print('PASS only Map045/046 384/385 data, mapping cache and version stamps touched')
          print('PASS S32 original scripts, approved directional exceptions and all controls untouched')
          print('PASS monsters, spawns, events, art and all other maps untouched')
          PY

      - name: V229R147 Publish coordinate-verified original game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

