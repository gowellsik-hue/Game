
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V1.6
# BASE: successful V1.4 game artifact run 42326754572
# KEEP: existing inventory assignment, nine hotbar slots, healer and movement
# KEEP: V1.5 approved monster statistics and 184 added drop rolls
# FIX: Fire Ghost native CE721/CE722 routes and item hotbar slots 7-9
# EXCLUDE: Zenith Queen / new timers / new drop engine
name: build-slknight-web.yml | V1.6 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Restore last successful V1.4
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 42326754572
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Check V1.4 base
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY_V16_BASE'
          from pathlib import Path
          import hashlib, json

          root=Path('site')
          manifest={
              str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }
          assert len(manifest)==5623,len(manifest)
          required=(
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/js/dpad.js',
              'knight/index.html'
          )
          assert all(x in manifest for x in required)
          assert "var version='V1.4';" in (
              root/'knight/js/sl-assets-v229r115.js'
          ).read_text('utf8')

          Path('build/v14_manifest.json').write_text(
              json.dumps(manifest),encoding='utf8'
          )
          print('PASS base V1.4',len(manifest),'files')
          PY_V16_BASE

      - name: Directly edit existing V1.4 game data
        shell: bash
        run: |
          set -euo pipefail
          cat > build/patch_v16.rb <<'RUBY_V16'
          # encoding: utf-8
          require 'zlib'
          require 'digest'

          SITE = File.expand_path(ARGV.fetch(0))
          DATA_DIR = File.join(SITE,'knight/gameasync/Data')
          PRE = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          class Module
            def const_missing(name)
              const_set(name,Class.new)
            end
          end

          class Table
            def self._load(x)
              o=allocate
              o.instance_variable_set(:@raw,x)
              o
            end
            def _dump(depth); @raw; end
          end

          class Color
            def self._load(x)
              o=allocate
              o.instance_variable_set(:@raw,x)
              o
            end
            def _dump(depth); @raw; end
          end

          class Tone
            def self._load(x)
              o=allocate
              o.instance_variable_set(:@raw,x)
              o
            end
            def _dump(depth); @raw; end
          end

          module RPG
            class Map; end
            class AudioFile; end
            class Event
              class Page
                class Condition; end
                class Graphic; end
              end
            end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
            class CommonEvent; end
            class Item; end
            class Weapon; end
            class Armor; end
          end

          def check(ok,msg)
            raise "V1.6 ORIGINAL MISMATCH: #{msg}" unless ok
          end

          def iv(o,k)
            o.instance_variable_get(k)
          end

          def cp(c)
            iv(c,:@parameters)
          end

          def cc(c)
            iv(c,:@code)
          end

          def setp(c,v)
            c.instance_variable_set(:@parameters,v)
          end

          def file(mid)
            File.join(DATA_DIR,PRE+format('Map%03d.rxdata',mid))
          end

          def exact(list,c,before,after,label)
            found=list.select{|e|cc(e)==c && cp(e)==before}
            check(found.size==1,"#{label} found #{found.size}")
            setp(found[0],after)
          end

          def replace_text(list,a,b,label)
            found=list.select do |e|
              [355,655].include?(cc(e)) &&
              cp(e).size==1 &&
              cp(e)[0].is_a?(String) &&
              cp(e)[0].include?(a)
            end
            check(found.size==1,"#{label} found #{found.size}")
            setp(found[0],[cp(found[0])[0].sub(a,b)])
          end

          MAP_IDS=[3,4,31,35,37,41].freeze
          maps=MAP_IDS.to_h do |mid|
            [mid,Marshal.load(File.binread(file(mid)))]
          end

          def event(maps,id)
            mid,eid=id.split(':').map(&:to_i)
            check(mid!=25,"no Zenith Queen edits")
            ev=iv(maps.fetch(mid),:@events)[eid]
            check(!ev.nil?,"missing event #{id}")
            ev
          end

          def page(ev,i)
            p=iv(ev,:@pages)[i]
            check(!p.nil?,"event page #{i} missing")
            p
          end

          def list(pg)
            iv(pg,:@list)
          end

          # Existing dodge variable 335 only.
          DODGE={
            '35:17'=>[20,40,8,16],
            '37:1'=>[12,20,5,15],
            '37:4'=>[12,20,5,15],
            '37:5'=>[10,30,5,20],
            '37:6'=>[10,30,5,20],
            '41:9'=>[30,50,1,10],
            '41:10'=>[10,40,1,8],
            '41:11'=>[10,40,1,8],
            '41:18'=>[10,40,1,8]
          }.freeze

          DODGE.each do |key,(lo,hi,newlo,newhi)|
            count=0
            iv(event(maps,key),:@pages).each do |pg|
              next unless iv(pg,:@trigger)==2
              list(pg).each do |c|
                next unless cc(c)==122
                next unless cp(c)[0,4]==[335,335,0,2]
                check(cp(c)[4,2]==[lo,hi],
                      "unexpected dodge #{key}")
                setp(c,[335,335,0,2,newlo,newhi])
                count+=1
              end
            end
            check(count>0,"missing dodge roll #{key}")
          end

          # Original Turtle / Beholder attack commands.
          attack=list(page(event(maps,'41:3'),0))
          exact(
            attack,122,[26,26,0,0,100],
            [26,26,0,0,35],'turtle attack 1'
          )
          exact(
            attack,122,[26,26,0,0,200],
            [26,26,0,0,70],'turtle attack 2'
          )
          exact(
            attack,111,[1,26,0,70,2],
            [1,26,0,20,2],'turtle minimum'
          )

          [12,13,14].each do |pi|
            exact(
              list(page(event(maps,'41:3'),pi)),
              111,[1,26,0,30,2],[1,26,0,20,2],
              "beholder min #{pi}"
            )
          end

          # Original common attack events.
          cp_path=File.join(DATA_DIR,PRE+'CommonEvents.rxdata')
          ces=Marshal.load(File.binread(cp_path))

          {
            797=>[[25,30],[50,60]],
            877=>[[60,75],[120,150]]
          }.each do |id,pairs|
            pairs.each do |oldval,newval|
              exact(
                list(ces[id]),122,
                [26,26,0,0,oldval],
                [26,26,0,0,newval],
                "CE#{id} attack #{oldval}"
              )
            end
          end

          exact(
            list(ces[797]),122,
            [336,336,0,2,9999,9999],
            [336,336,0,2,50,120],
            'ghoul hit'
          )

          exact(
            list(ces[877]),111,
            [1,26,0,30,2],
            [1,26,0,35,2],
            'Drake minimum'
          )

          # Drake attack wait:
          # Forgotten Island = 20, other regions = 30.
          # No attack-wait commands are changed.

          # Keep one original Turtle EXP/Adena reward.
          turtle=event(maps,'41:9')
          replace_text(
            list(page(turtle,1)),
            ',100000,2)',',2400,2)','turtle HUD'
          )

          regen=list(page(event(maps,'41:19'),0))
          exact(
            regen,111,
            [1,241,0,100000,4],
            [1,241,0,2400,4],
            'turtle regeneration cap'
          )
          replace_text(
            regen,',100000,2)',',2400,2)','turtle regen HUD'
          )

          old_death=list(page(turtle,2))
          old_rewards=[
            [122,[333,333,0,2,1,9999999]],
            [125,[0,1,333]],
            [122,[1926,1926,0,0,160000]],
            [122,[1926,1926,3,1,3]],
            [122,[1926,1926,4,1,1927]],
            [315,[1,0,1,1926]]
          ]

          old_rewards.each do |id,args|
            matched=old_death.select do |c|
              cc(c)==id && cp(c)==args
            end
            check(
              matched.size==1,
              "turtle duplicate XP/Adena #{id} #{args.inspect}"
            )
            old_death.delete(matched[0])
          end

          # V1.5 approved shared native drops.
          GROUPS={
            655=>'a255:200',
            661=>'a118:5000',
            699=>'a278:100 a277:100',
            704=>'a278:100 a277:100',
            714=>'i18:5000 i32:2000 i33:2000',
            718=>'a158:3000 i32:1000',
            728=>'i54:2000',
            730=>'i33:3000 i32:3000 i69:100',
            731=>'i32:3000 i33:3000 i34:100',
            745=>'i11:3000 i9:3000 i12:3000 i10:3000 i57:1000 i77:1000 i78:1000 i79:1000 i2:10000'
          }.freeze

          # Keep local death-page drops from V1.5.
          LOCAL={
            '35:12'=>'i57:2000 i77:2000 i78:2000 i79:2000 i2:10000',
            '35:13'=>'i57:2000 i77:2000 i78:2000 i79:2000 i2:10000',
            '35:14'=>'i57:2000 i77:2000 i78:2000 i79:2000 i2:10000',
            '35:15'=>'i57:2000 i77:2000 i78:2000 i79:2000 i2:10000',
            '35:17'=>'i33:4000 a555:1500 a556:1500',
            '35:16'=>'i57:2000 i77:2000 i78:2000 i79:2000',
            '3:23'=>'i108:1000',
            '3:25'=>'i108:1000',
            '31:11'=>'w123:5000 a289:5000 a94:10000 a105:10000 a60:10000 a275:1500 i104:3000 i105:3000 i32:15000 i33:15000 i34:6000 i35:9000'
          }.freeze

          USES={
            655=>['17:14','17:15'],
            661=>%w[
              21:6 21:7 21:8
              22:11 22:12 22:13
              23:13 23:14
            ],
            699=>%w[3:13 3:14],
            704=>%w[3:22],
            714=>%w[8:9 8:10 8:12],
            718=>%w[9:6 9:7 9:9 9:16 43:30],
            728=>%w[11:8 11:9 11:10],
            730=>%w[11:7 11:11 43:20],
            731=>%w[11:12 11:13],
            745=>%w[
              35:2 35:4 35:5 35:6 35:7
              35:8 35:9 35:10 43:13 43:14
            ]
          }.freeze

          MAP_DIR=Dir.glob(
            File.join(DATA_DIR,PRE+'Map[0-9][0-9][0-9].rxdata')
          )

          usage=Hash.new{|h,k|h[k]=[]}

          MAP_DIR.each do |fname|
            mid=fname[/Map(\d{3})\.rxdata$/,1].to_i
            m=maps[mid] || Marshal.load(File.binread(fname))
            iv(m,:@events).each do |eid,ev|
              next if ev.nil?
              iv(ev,:@pages).each do |pg|
                next unless iv(pg,:@trigger)==4
                list(pg).each do |c|
                  next unless cc(c)==117
                  next unless USES.key?(cp(c)[0])
                  usage[cp(c)[0]] << "#{mid}:#{eid}"
                end
              end
            end
          end

          USES.each do |ce,expected|
            check(
              usage[ce].sort==expected.sort,
              "shared CE#{ce} reaches non-target EV"
            )
          end

          def parse_drops(text)
            text.split.map do |spec|
              m=/\A([iwa])(\d+):(\d+)\z/.match(spec)
              check(!m.nil?,"invalid drop #{spec}")
              kind={
                'i'=>'item',
                'w'=>'weapon',
                'a'=>'armor'
              }.fetch(m[1])
              id=m[2].to_i
              rate=m[3].to_i
              check(
                id>0 && rate.between?(1,100000),
                "invalid drop numbers #{spec}"
              )
              [kind,id,rate]
            end
          end

          def extra_script(drops)
            lines=['slv437_messages=[]']
            drops.each do |kind,id,rate|
              table={
                'item'=>'items',
                'weapon'=>'weapons',
                'armor'=>'armors'
              }.fetch(kind)

              lines << "if rand(100000)<#{rate}"
              lines << '  slv437_count=(1)'
              lines << "  $game_party.gain_#{kind}(#{id},slv437_count)"
              lines << "  slv437_name=($data_#{table}[#{id}] && $data_#{table}[#{id}].name) || ''"
              lines << "  slv437_messages << (slv437_name + ' '+slv437_count.to_s+'개') unless slv437_name.empty?"
              lines << 'end'
            end
            lines << 'unless slv437_messages.empty?'
            lines << "  $메세지.set_text2(slv437_messages.join(', ')+' 획득 했습니다.')"
            lines << 'end'
            lines.join("\n")+"\n"
          end

          added=0

          GROUPS.each do |ce_id,drops_text|
            arr=parse_drops(drops_text)
            cmds=list(ces[ce_id])
            candidates=cmds.select do |c|
              cc(c)==355 &&
              cp(c).length==1 &&
              cp(c)[0].start_with?("slv437_messages=[]\n")
            end

            check(
              candidates.size==1,
              "CE#{ce_id} original slv437 loot source"
            )

            original=cp(candidates[0])[0]
            marker="unless slv437_messages.empty?\n"

            check(
              original.scan(marker).size==1,
              "CE#{ce_id} loot footer"
            )

            arr.each do |kind,id,_|
              check(
                !original.include?("$game_party.gain_#{kind}(#{id},"),
                "CE#{ce_id} duplicate #{kind}#{id}"
              )
            end

            additions=extra_script(arr).split(marker,2)[0].sub(
              /\Aslv437_messages=\[\]\n/,''
            )
            setp(candidates[0],[
              original.sub(marker,additions+marker)
            ])
            added+=arr.length*USES.fetch(ce_id).length
          end

          # V1.6 Fire Ghost:
          # Map004 EV5/8 green, EV7/9 red.
          # CE721 red: keep existing native drop event.
          # CE722 green: modify existing rolls and add native branches.
          # CE1059: do not edit.
          #
          # Item 2  = speed potion 20%
          # Item 37 = greater haste potion 10%
          # Item 3  = courage potion 12.5%
          # Item 35 = blessed armor scroll 0.1%

          def ghost_native_block(cmds,item_id)
            hits=cmds.each_index.select do |i|
              cc(cmds[i])==126 && cp(cmds[i])[0]==item_id
            end
            check(
              hits.size==1,
              "ghost item#{item_id} original grant count #{hits.size}"
            )

            ri=hits.first
            reward_indent=iv(cmds[ri],:@indent)

            candidates=(0...ri).to_a.reverse.select do |i|
              cc(cmds[i])==111 &&
              iv(cmds[i],:@indent)==reward_indent-1 &&
              cp(cmds[i]).is_a?(Array) &&
              cp(cmds[i])[0]==1
            end
            check(
              !candidates.empty?,
              "ghost item#{item_id} original condition missing"
            )
            bi=candidates.first
            condition=cp(cmds[bi])
            check(
              condition.length==5 &&
              condition[2,3]==[0,0,0],
              "ghost item#{item_id} condition mismatch"
            )

            variable=condition[1]
            level=iv(cmds[bi],:@indent)

            before=(0...bi).to_a.reverse.find do |i|
              cc(cmds[i])==122 &&
              iv(cmds[i],:@indent)==level &&
              cp(cmds[i])[0,4]==[variable,variable,0,2]
            end
            check(
              !before.nil?,
              "ghost item#{item_id} random source missing"
            )

            after=((ri+1)...cmds.length).find do |i|
              cc(cmds[i])==412 &&
              iv(cmds[i],:@indent)==level
            end
            check(
              !after.nil?,
              "ghost item#{item_id} condition end missing"
            )

            check(
              cp(cmds[before])[4]==0,
              "ghost item#{item_id} random must begin at zero"
            )

            [before,after,cp(cmds[before])[5]]
          end

          def ghost_native_rate(cmds,item_id,expected,maximum)
            first,last,oldmax=ghost_native_block(cmds,item_id)
            check(
              oldmax==expected || oldmax==maximum,
              "ghost item#{item_id} RNG expected #{expected} or #{maximum}, got #{oldmax}"
            )
            if oldmax!=maximum
              old=cp(cmds[first])
              setp(cmds[first],old[0,5]+[maximum])
            end
          end

          ce1059_before=Marshal.dump(ces[1059])
          red_before=Marshal.dump(ces[721])

          red=list(ces[721])
          green=list(ces[722])

          # Red ghost must already have the four approved native rolls.
          {
            2=>4,
            37=>9,
            3=>7,
            35=>999
          }.each do |item_id,maximum|
            first,last,oldmax=ghost_native_block(red,item_id)
            check(
              oldmax==maximum,
              "CE721 red ghost item#{item_id} expected 0..#{maximum}, got 0..#{oldmax}"
            )
          end

          # Change only the two existing green potion RNG ranges.
          ghost_native_rate(green,2,1,4)
          ghost_native_rate(green,37,1,9)

          [3,35].each do |item_id|
            check(
              !green.any?{|c|cc(c)==126 && cp(c)[0]==item_id},
              "CE722 duplicate item#{item_id}"
            )
          end

          # Copy the two original red native drop branches into green.
          # Existing code 122/111/126 and original messages are retained.
          additions=[3,35].flat_map do |item_id|
            first,last,maximum=ghost_native_block(red,item_id)
            red[first..last].map do |command|
              Marshal.load(Marshal.dump(command))
            end
          end

          check(
            cc(green.last)==0,
            "CE722 final command missing"
          )
          green.insert(green.length-1,*additions)

          check(
            Marshal.dump(ces[721])==red_before,
            "CE721 red ghost modified unexpectedly"
          )
          check(
            Marshal.dump(ces[1059])==ce1059_before,
            "CE1059 modified unexpectedly"
          )

          # Restore original green/red drop routes.
          # First inspect the native death page. When the death page calls
          # CE320 or CE328, correct that existing handler instead.
          ghost_routes={
            5=>[722,320],
            8=>[722,320],
            7=>[721,328],
            9=>[721,328]
          }

          ghost_routes.each do |eid,(target,death_ce)|
            ev=event(maps,"4:#{eid}")
            calls=iv(ev,:@pages).flat_map do |pg|
              next [] unless iv(pg,:@trigger)==4
              list(pg).select{|c|cc(c)==117}
            end

            direct=calls.select{|c|cp(c)==[1059]}

            if direct.size==1
              check(
                !calls.any?{|c|cp(c)==[target]},
                "Map004 EV#{eid} duplicate drop route"
              )
              setp(direct.first,[target])
              next
            end

            check(
              direct.empty?,
              "Map004 EV#{eid} multiple CE1059 calls"
            )

            if calls.any?{|c|cp(c)==[target]}
              next
            end

            check(
              calls.any?{|c|cp(c)==[death_ce]},
              "Map004 EV#{eid} native death CE#{death_ce} missing"
            )

            handler=list(ces[death_ce])
            original=handler.select do |c|
              cc(c)==117 && cp(c)==[1059]
            end
            restored=handler.select do |c|
              cc(c)==117 && cp(c)==[target]
            end

            if original.size==1 && restored.empty?
              setp(original.first,[target])
            else
              check(
                original.empty? && restored.size==1,
                "CE#{death_ce} cannot restore single native drop route"
              )
            end
          end

          puts 'PASS Fire Ghost original CE721/CE722 routes'
          puts 'PASS CE1059 unchanged, no duplicate ghost drop engine'

          # Keep original local death pages.
          LOCAL.each do |ref,drops_text|
            mid,eid=ref.split(':').map(&:to_i)
            obj=event(maps,ref)
            death_index=(ref=='31:11' ? 1 : 2)
            pg=page(obj,death_index)

            check(
              iv(pg,:@trigger)==4,
              "#{ref} expected native death event"
            )

            cmds=list(pg)
            check(
              cc(cmds.last)==0,
              "#{ref} death end missing"
            )

            drops=parse_drops(drops_text)
            check(
              !cmds.any? do |c|
                [355,655].include?(cc(c)) &&
                cp(c)[0].to_s.include?('slv437_messages=[]')
              end,
              "#{ref} already has added script"
            )

            newc=RPG::EventCommand.allocate
            newc.instance_variable_set(:@code,355)
            newc.instance_variable_set(:@indent,0)
            newc.instance_variable_set(
              :@parameters,[extra_script(drops)]
            )
            cmds.insert(0,newc)
            added+=drops.length
          end

          check(
            added==184,
            "expected 184 approved item rolls; got #{added}"
          )

          # Original SLV541 statistics and reward observer.
          sp=File.join(DATA_DIR,'Scripts.rxdata')
          scripts=Marshal.load(File.binread(sp))

          idx=scripts.each_index.find do |i|
            scripts[i].is_a?(Array) &&
            scripts[i][1]=='V230 Boss Respawn 60s 180s'
          end
          check(!idx.nil?,"V1.4 original SLV541 script")

          source=Zlib::Inflate.inflate(
            scripts[idx][2]
          ).force_encoding('UTF-8')

          line=source.match(/^  DATA=(\{.*\})$/)
          check(!line.nil?,"SLV541 DATA literal")
          stats=eval(line[1])

          STATS={
            '3:6'=>{
              11=>['60/120','75/150'],
              12=>['30','35']
            },
            '5:12'=>{
              11=>['60/120','75/150'],
              12=>['30','35']
            },
            '6:6'=>{
              11=>['60/120','75/150'],
              12=>['30','35']
            },
            '35:17'=>{
              9=>['9999~9999','50~120'],
              10=>['25/50','30/60']
            },
            '41:9'=>{
              0=>[50712,1601],
              1=>[127000,16800],
              2=>[76200,10080],
              3=>[177800,23520],
              4=>[100000,2400],
              7=>[65,40],
              11=>['100/200','35/70'],
              12=>['70','20']
            },
            '41:10'=>{
              12=>['30','20']
            },
            '41:11'=>{
              12=>['30','20']
            },
            '41:18'=>{
              12=>['30','20']
            }
          }.freeze

          STATS.each do |ref,patch|
            mid,eid=ref.split(':').map(&:to_i)
            row=stats.fetch(mid).fetch(eid)
            patch.each do |ix,(before,after)|
              check(
                row[ix]==before,
                "#{ref}[#{ix}] expected #{before.inspect}, saw #{row[ix].inspect}"
              )
              row[ix]=after
            end
          end

          source=source.sub(
            line[0],'  DATA='+stats.inspect
          )
          check(
            source.include?('def self.observe(event)') &&
            source.include?('def self.pay(event,data)'),
            "existing reward observer preserved"
          )
          scripts[idx][2]=Zlib::Deflate.deflate(source.b)

          # Keep existing SLHotbar 1-9 slots, inventory assignment and use.
          # Only add an input fallback to triggered_slot for mobile J/K/L.
          hot=scripts.find do |it|
            it.is_a?(Array) && it[1]=='Mobile Hotbar'
          end
          check(!hot.nil?,"original item hotbar")

          hot_code=Zlib::Inflate.inflate(
            hot[2]
          ).force_encoding('UTF-8')

          check(
            hot_code.include?(
              'KEYS=[Input::X,Input::Y,Input::Z,Input::L,Input::F6]'
            ),
            "original five native input constants"
          )

          check(
            [74,75,76].all? do |vk|
              hot_code.include?(
                "return #{vk-68} if Keyboard.testkey(#{vk})"
              )
            end,
            "original JKL input"
          )

          check(
            hot_code.include?('def self.assign_from_window(window)'),
            "original inventory assignment"
          )
          check(
            hot_code.include?('for i in 0...9'),
            "original nine-slot rendering"
          )

          slot_anchor="  def self.triggered_slot\n"
          check(
            hot_code.scan(slot_anchor).size==1,
            "original hotbar trigger method"
          )

          bridge=<<'SLOT_BRIDGE'
            if Input.press?(Input::SHIFT)
              return 6 if Input.trigger?(Input::F7)
              return 7 if Input.trigger?(Input::F8)
              return 8 if Input.trigger?(Input::F9)
            end
          SLOT_BRIDGE

          hot_code=hot_code.sub(
            slot_anchor,
            slot_anchor+bridge
          )

          # Prevent the existing skill shortcut and default spell handlers
          # from consuming the same Shift+F7/F8/F9 input.
          assigned_anchor=<<'ASSIGNED_OLD'
            def self.assigned?(slot)
              slots[slot].to_i > 0
            end
          ASSIGNED_OLD

          assigned_new=<<'ASSIGNED_NEW'
            def self.assigned?(slot)
              if slot>=0 && slot<=2 && Input.press?(Input::SHIFT)
                keys=[Input::F7,Input::F8,Input::F9]
                return true if Input.trigger?(keys[slot])
              end
              slots[slot].to_i > 0
            end
          ASSIGNED_NEW

          check(
            hot_code.scan(assigned_anchor).size==1,
            "original skill assigned method"
          )
          hot_code=hot_code.sub(
            assigned_anchor,assigned_new
          )

          skill_anchor="  def self.index_pressed\n"
          check(
            hot_code.scan(skill_anchor).size==1,
            "original skill input method"
          )

          skill_guard=<<'SKILL_GUARD'
            if Input.press?(Input::SHIFT) &&
               (Input.trigger?(Input::F7) ||
                Input.trigger?(Input::F8) ||
                Input.trigger?(Input::F9))
              return nil
            end
          SKILL_GUARD

          hot_code=hot_code.sub(
            skill_anchor,
            skill_anchor+skill_guard
          )

          hot[2]=Zlib::Deflate.deflate(hot_code.b)

          File.binwrite(sp,Marshal.dump(scripts))
          File.binwrite(cp_path,Marshal.dump(ces))

          MAP_IDS.each do |mid|
            File.binwrite(
              file(mid),Marshal.dump(maps.fetch(mid))
            )
          end

          # Refresh existing cache hashes for changed native data.
          mapping_path=File.join(
            SITE,'knight/gameasync/mapping.js'
          )
          mapping=File.binread(
            mapping_path
          ).force_encoding('UTF-8')

          ([sp,cp_path]+MAP_IDS.map{|id|file(id)}).each do |path|
            rel='Data/'+File.basename(path)
            digest=Digest::MD5.file(path).hexdigest
            regex=Regexp.new(
              Regexp.escape(rel)+'\?h=[a-f0-9]{32}'
            )
            check(
              mapping.scan(regex).length==1,
              "cache #{rel}"
            )
            mapping.gsub!(regex,"#{rel}?h=#{digest}")
          end

          File.binwrite(mapping_path,mapping)

          # Update version labels only after patch validation.
          loader=File.join(
            SITE,'knight/js/sl-assets-v229r115.js'
          )
          t=File.binread(loader)
          check(
            t.include?("var version='V1.4';"),
            "V1.4 loader marker"
          )
          File.binwrite(
            loader,
            t.sub(
              "var version='V1.4';",
              "var version='V1.6';"
            )
          )

          ['index.html','knight/index.html'].each do |name|
            path=File.join(SITE,name)
            t=File.binread(path)
            check(
              t.include?('V1.4'),
              "V1.4 title #{name}"
            )
            File.binwrite(
              path,
              t.gsub('V1.4','V1.6').gsub('v1.4','v1.6')
            )
          end

          puts "PASS V1.6 native patch: #{MAP_IDS.length} maps, #{GROUPS.length} shared CEs, #{LOCAL.length} local events, #{added} additional item rolls"
          puts 'PASS original inventory registration preserved'
          puts 'PASS JKL native input fallback installed'
          puts 'PASS no change to healer, movement or Zenith Queen'
          RUBY_V16

          ruby -c build/patch_v16.rb
          ruby build/patch_v16.rb site

      - name: Connect mobile JKL buttons to existing engine input
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_V16_INPUT'
          from pathlib import Path

          path=Path('site/knight/js/dpad.js')
          source=path.read_text('utf8')

          assert 'function simulateKeyEvent(' in source, \
              'V1.4 native key event dispatcher missing'

          for expected in (
              "hotButton(hot,6,'J',74)",
              "hotButton(hot,7,'K',75)",
              "hotButton(hot,8,'L',76)"
          ):
              assert expected in source, \
                  f'V1.4 original item button missing: {expected}'

          assert 'SLK_V16_JKL_BRIDGE' not in source, \
              'duplicate JKL input bridge'

          # Existing UI button IDs/labels and item registration stay intact.
          # Only the simulated event enters already-supported Input constants.
          bridge=r'''
          /* SLK_V16_JKL_BRIDGE */
          (function(){
            const originalSimulateKeyEvent=simulateKeyEvent;

            simulateKeyEvent=function(eventType,keyCode,charCode){
              let nativeCode=null;

              if(keyCode===74) nativeCode=118;
              if(keyCode===75) nativeCode=119;
              if(keyCode===76) nativeCode=120;

              if(nativeCode===null){
                return originalSimulateKeyEvent(
                  eventType,keyCode,charCode
                );
              }

              if(eventType==='keydown'){
                originalSimulateKeyEvent('keydown',16);
                return originalSimulateKeyEvent(
                  'keydown',nativeCode,charCode
                );
              }

              if(eventType==='keyup'){
                originalSimulateKeyEvent(
                  'keyup',nativeCode,charCode
                );
                return originalSimulateKeyEvent(
                  'keyup',16
                );
              }

              return originalSimulateKeyEvent(
                eventType,keyCode,charCode
              );
            };
          })();
          '''

          path.write_text(
              source.rstrip()+'\n'+bridge+'\n',
              encoding='utf8'
          )
          print('PASS existing mobile JKL buttons linked to native input')
          PY_V16_INPUT

          node --check site/knight/js/dpad.js

      - name: Regression test original item-slot registration
        shell: bash
        run: |
          set -euo pipefail
          cat > build/verify_v16.rb <<'RUBY_V16_VERIFY'
          require 'zlib'

          module RPG
            class Item; end
          end

          root=ARGV.fetch(0)
          sc=Marshal.load(
            File.binread(
              File.join(root,'knight/gameasync/Data/Scripts.rxdata')
            )
          )

          idx=sc.index do |x|
            x.is_a?(Array) && x[1]=='Mobile Hotbar'
          end
          raise 'original item hotbar missing' unless idx

          hot=Zlib::Inflate.inflate(
            sc[idx][2]
          ).force_encoding('UTF-8')

          raise 'original JKL lost' unless (74..76).all? do |k|
            hot.include?("Keyboard.testkey(#{k})")
          end

          raise 'native bridge missing' unless hot.include?(
            'Input.press?(Input::SHIFT)'
          )

          module Input
            X=1
            Y=2
            Z=3
            L=4
            F6=5
            SHIFT=6
            F7=7
            F8=8
            F9=9

            @pressed={}
            @triggered={}

            def self.press?(code)
              !!@pressed[code]
            end

            def self.trigger?(code)
              !!@triggered[code]
            end

            def self.combo(index)
              @pressed={SHIFT=>true}
              @triggered={
                [F7,F8,F9][index]=>true
              }
            end
          end

          module Keyboard
            def self.testkey(code)
              false
            end
          end

          class Scene_Item
            def update_item; end
          end

          class Scene_Item2
            def update_item; end
          end

          class Scene_Map
            def update; end
          end

          class RPG::Item
            attr_accessor :id,:common_event_id,:scope
            attr_accessor :consumable,:menu_se,:name,:icon_name

            def initialize(id)
              @id=id
              @common_event_id=80
              @scope=0
              @consumable=false
              @menu_se='ok'
              @name="Item#{id}"
              @icon_name='test'
            end
          end

          class FakeSystem
            attr_accessor :sounds

            def initialize
              @sounds=[]
            end

            def se_play(a)
              @sounds << a
            end
          end

          class FakeParty
            def item_number(id)
              2
            end

            def item_can_use?(id)
              true
            end

            def lose_item(id,count)
            end
          end

          $game_system=FakeSystem.new
          $game_party=FakeParty.new
          $data_system=Struct.new(
            :decision_se,:buzzer_se
          ).new('ok','bad')

          $data_items=Array.new(200)
          $game_temp=Struct.new(
            :common_event_id
          ).new(0)

          [101,102,103].each do |id|
            $data_items[id]=RPG::Item.new(id)
          end

          eval(hot,TOPLEVEL_BINDING,'Mobile Hotbar')

          raise 'not nine slots' unless SLHotbar.slots.size==9

          3.times do |index|
            Input.combo(index)

            selected=Struct.new(:item).new(
              $data_items[101+index]
            )

            raise "registration failed #{index+7}" unless
              SLHotbar.assign_from_window(selected)

            raise "item slot #{index+7} wrong" unless
              SLHotbar.slots[index+6]==101+index

            raise "skill conflict #{index+7}" unless
              SLV14Skills.index_pressed.nil?

            raise "legacy conflict #{index+7}" unless
              SLV14Skills.assigned?(index)

            raise "use slot #{index+7} failed" unless
              SLHotbar.use_triggered

            raise 'original item common event missing' unless
              $game_temp.common_event_id==80
          end

          puts 'PASS simulated native 7-9 registration and item use'
          puts 'NOTE browser input must be verified in real gameplay'
          RUBY_V16_VERIFY

          ruby -c build/verify_v16.rb
          ruby build/verify_v16.rb site

      - name: Verify all non-target game files unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_V16_VERIFY'
          from pathlib import Path
          import hashlib,json

          root=Path('site')
          before=json.loads(
              Path('build/v14_manifest.json').read_text('utf8')
          )

          after={
              str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          assert len(after)==5623
          assert set(after)==set(before)

          pre='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          required={
              'knight/gameasync/Data/Scripts.rxdata',
              pre+'CommonEvents.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'knight/js/dpad.js',
              'index.html',
              'knight/index.html'
          }

          required|={
              pre+f'Map{mid:03d}.rxdata'
              for mid in (3,31,35,37,41)
          }

          allowed=required|{
              pre+'Map004.rxdata'
          }

          changed={
              k for k in after
              if before[k]!=after[k]
          }

          assert required.issubset(changed), {
              'missing_required':sorted(required-changed)
          }
          assert changed.issubset(allowed), {
              'unexpected':sorted(changed-allowed)
          }

          # Queen and all unrelated maps must stay identical.
          assert before[pre+'Map025.rxdata']==after[pre+'Map025.rxdata']

          mapping=(
              root/'knight/gameasync/mapping.js'
          ).read_text('utf8')

          for rel in sorted(allowed):
              if '/Data/' not in rel:
                  continue
              file=root/rel
              digest=hashlib.md5(
                  file.read_bytes()
              ).hexdigest()
              assert mapping.count(
                  'Data/'+file.name+'?h='+digest
              )==1,rel

          loader=(
              root/'knight/js/sl-assets-v229r115.js'
          ).read_text('utf8')
          assert "var version='V1.6';" in loader

          dpad=(
              root/'knight/js/dpad.js'
          ).read_text('utf8')
          assert dpad.count('SLK_V16_JKL_BRIDGE')==1
          assert "hotButton(hot,6,'J',74)" in dpad
          assert "hotButton(hot,7,'K',75)" in dpad
          assert "hotButton(hot,8,'L',76)" in dpad

          print(
              'PASS V1.6 approved file changes:',
              len(changed)
          )
          print(
              'PASS original item buttons, healer, movement and Queen preserved'
          )
          PY_V16_VERIFY

      - name: Publish V1.6
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

