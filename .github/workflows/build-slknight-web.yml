# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R112
# BASE: successfully deployed V229R111, run 40523152040.
# FIX: the R111 preload queue skipped pre-existing one-byte dummy files and
#      incorrectly flagged images as cached without writing valid PNG data.
# SCOPE: edit only knight/js/drive.js and two version labels in index.html.
# KEEP: exact R111 native coordinate system, original shifted artwork,
#       both map files, doors, monsters, collision, renderer and four-way pad.
name: build-slknight-web.yml | V229R112 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R112 Restore exact deployed R111
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40523152040
          name: github-pages
          github-token: ${{ github.token }}
          path: r111

      - name: V229R112 Fix preloaded PNG dummy-file corruption only
        shell: bash
        run: |
          set -euo pipefail
          test -s r111/artifact.tar
          mkdir -p site build
          tar -xf r111/artifact.tar -C site
          python3 - <<'PY_FIX'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          assert len(before)==5517, ('Wrong R111 baseline',len(before))
          expected={
            'knight/js/drive.js':'833a13026929d62d24a5ad645a8af764511fe40584ebefcf5d1b3251d9a35573',
            'knight/gameasync/Data/Scripts.rxdata':'e7cc01b36ad7edc18d8026854f4ae37932ebadb74e54d2b43ab47cc6ae112aee',
            'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap045.rxdata':'f47de87af6b4e607bf632818a711619dc8ca4e747196a123a76ac7db8ffc3ba6',
            'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap046.rxdata':'dc89d908f5247442e08dddc11f5bcf6505a77890bd82ab59b790e00e3e5f024c',
            'knight/js/dpad.js':'2bd401adf130339d154ce6a8efd0127cefd9b1bc58bc60d1de68e8b7a791'}
          for path,sha in expected.items():
            assert before[path]==sha,('Unexpected R111 file',path)
          Path('build/before.json').write_text(json.dumps(before,sort_keys=True))
          drive=root/'knight/js/drive.js'
          src=drive.read_text('utf-8')
          marker="if (!FS.analyzePath(folder+'/'+filename).exists){"
          assert src.count(marker)==1 and src.count('R111_SANCTUARY_QUEUE')==1
          assert src.count('FS.createDataFile(folder,filename')==1
          start=src.index(marker)
          end_marker='window.fileAsyncCache[key]=1;'
          stop=src.index(end_marker,start)+len(end_marker)
          indent=src[src.rfind(chr(10),0,start)+1:start]
          assert indent.strip()=='' and len(indent)>0
          js=[
            '// Mapped files start as one-byte placeholders.',
            '// Replace the dummy before recording a successful load.',
            'var png=new Uint8Array(bytes);',
            'if (png.length<24 || png[0]!==137 || png[1]!==80 ||',
            '    png[2]!==78 || png[3]!==71 || png[4]!==13 ||',
            '    png[5]!==10 || png[6]!==26 || png[7]!==10) {',
            "    throw new Error('Invalid or incomplete PNG');",
            '}',
            "var target=folder+'/'+filename;",
            "FS.writeFile(target,png,{flags:'w'});",
            'if (FS.stat(target).size!==png.length) {',
            "    throw new Error('PNG file size mismatch');",
            '}',
            'window.fileAsyncCache[key]=1;'
          ]
          src=(src[:start]+(chr(10)+indent).join(js)+src[stop:])
          src=src.replace('R111_SANCTUARY_QUEUE','R112_SANCTUARY_QUEUE')
          drive.write_text(src,encoding='utf-8')
          begin=src.index('// R112_SANCTUARY_QUEUE')
          end=src.index('\nwindow.fileLoadedAsync = function(file) {',begin)
          Path('build/r112-preload.js').write_text(src[begin:end],encoding='utf-8')
          for name in ('index.html','knight/index.html'):
            path=root/name
            html=path.read_text('utf-8')
            assert 'V229R111' in html and 'V229R112' not in html
            if name=='knight/index.html':
              assert html.count('js/drive.js?v=v229r111')==1
            path.write_text(html.replace('V229R111','V229R112')
                                .replace('v229r111','v229r112'),encoding='utf-8')
          print('PASS R111 baseline; dummy PNG overwrite; version labels')
          PY_FIX
          node --check site/knight/js/drive.js
          node --check build/r112-preload.js
          cat > build/r112-preload-test.js <<'R112_TEST'
          const fs=require('fs');
          const vm=require('vm');
          const assert=require('assert');
          const mappingJs=fs.readFileSync('site/knight/gameasync/mapping.js','utf8');
          const injected=fs.readFileSync('build/r112-preload.js','utf8');
          const mappingContext={};
          vm.runInNewContext(mappingJs,mappingContext);
          const map=mappingContext.mapping;
          async function test(mid){
            const files=new Map();
            const completed={};
            const requests=[];
            const assetRoot='site/knight/gameasync/';
            const entries=Object.keys(map).filter(k=>
              new RegExp('^graphics/panoramas/slti_'+mid+'_(?:c\\d+_\\d+|w_c\\d+_\\d+)$','i').test(k));
            const expected=mid===45?62:94;
            assert.equal(entries.length,expected,'Expected original C/W set');
            // Match the original engine: dummy files exist before an image loads.
            for(const k of entries){
              const v=map[k].split('?')[0];
              files.set('/game/'+v,Buffer.from('1'));
            }
            const sandbox={
              mapping:map,window:{fileAsyncCache:{}},console,
              setTimeout,clearTimeout,
              getMappingKey:f=>f.toLowerCase().replace(/\.[^/.]+$/,''),
              getLazyAsset:(url,filename,callback)=>{
                const rel=url.replace(/^gameasync\//,'').split('?')[0];
                requests.push(rel);
                setTimeout(()=>callback(fs.readFileSync(assetRoot+rel)),0);
              },
              FS:{
                analyzePath:path=>({exists:files.has(path)}),
                writeFile:(path,bytes)=>files.set(path,Buffer.from(bytes)),
                stat:path=>({size:files.get(path).length}),
                createPreloadedFile:()=>{throw new Error('Unexpected eager PNG decode');}
              }
            };
            vm.runInNewContext(injected,sandbox);
            const floorJson=JSON.parse(fs.readFileSync(
              'site/knight/preload/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap0'+mid+'.rxdata.json','utf8'));
            sandbox.preloadList(floorJson);
            await new Promise((resolve,reject)=>{
              const deadline=Date.now()+10000;
              function poll(){
                if(Object.keys(sandbox.window.fileAsyncCache).length===expected)return resolve();
                if(Date.now()>deadline)return reject(new Error('Preload stopped '+mid));
                setTimeout(poll,5);
              }
              poll();
            });
            assert.equal(requests.length,expected);
            for(const k of entries){
              assert.equal(sandbox.window.fileAsyncCache[k],1,'Missing cache flag '+k);
              const v=map[k].split('?')[0];
              const original=fs.readFileSync(assetRoot+v);
              assert.deepEqual(files.get('/game/'+v),original,'PNG was not written '+k);
            }
            console.log('PASS Map'+mid+': '+expected+' original images overwrite dummy bytes, exact PNG contents and cache flags');
          }
          (async()=>{await test(45);await test(46);})().catch(e=>{console.error(e);process.exit(1);});
          R112_TEST
          node build/r112-preload-test.js

      - name: V229R112 Audit exact changes and game data integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_AUDIT'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before=json.loads(Path('build/before.json').read_text('utf-8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert len(after)==len(before)==5517 and after.keys()==before.keys()
          changed={p for p in before if before[p]!=after[p]}
          expected={'index.html','knight/index.html','knight/js/drive.js'}
          assert changed==expected,('Unexpected game changes',changed^expected)
          for path in before:
            if path not in expected:
              assert after[path]==before[path],('Game data changed',path)
          html=(root/'knight/index.html').read_text('utf-8')
          src=(root/'knight/js/drive.js').read_text('utf-8')
          assert 'js/drive.js?v=v229r112' in html
          assert "FS.writeFile(target,png,{flags:'w'});" in src
          assert 'R112_SANCTUARY_QUEUE' in src
          assert 'FS.createDataFile(folder,filename' not in src
          print('PASS only three changed files: both version labels and drive.js')
          print('PASS Scripts.rxdata, Map045/046, all Graphics and 4-way pad unchanged')
          PY_AUDIT

      - name: V229R112 Publish exact R111 game with corrected PNG loading
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
