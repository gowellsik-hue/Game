            assert.call(mob.instance_variable_get(:@page)==ev.pages[0],"Idle page not selected #{mid}/#{id}")
            good=[[1,0,6],[-1,0,4],[0,1,2],[0,-1,8]].find do |dx,dy,dir|
             nx=x+dx;ny=y+dy
             $game_map.valid?(nx,ny) && SLTI_V229R44.allowed?(mid,x,y,dir) &&
              SLTI_V229R44.allowed?(mid,nx,ny,10-dir) && m.instance_variable_get(:@data)[nx,ny,0]==384
            end
