name: Deploy SLKnight V14.3y MONSTER ATTACK CE TRIGGER
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency:
  group: slknight-github-pages
  cancel-in-progress: true
env:
  BASELINE_SHA: c6815cd461dba60ec131898e6d5dd8690dd915ae
  X2_SHA: 6d941bd643dda87b8267ba466e108d1904c22331
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout frozen V14.3l baseline
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.BASELINE_SHA }}
          path: baseline

      - name: Checkout frozen V14.3x2 success
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.X2_SHA }}
          path: x2

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake cmake curl ffmpeg freepats git imagemagick libtool make mm-common patch pkg-config python3 rake ruby timidity unzip wget xz-utils fonts-nanum

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.MKXP_SRC_REF }}
          path: engine

      - name: Cache engine dependencies
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-${{ runner.os }}-${{ env.EMSDK_VER }}-onig25b

      - name: Extract frozen run scripts
        run: |
          ruby -ryaml - <<'RB'
          base=YAML.load_file('baseline/.github/workflows/build-slknight-web.yml')
          x2=YAML.load_file('x2/.github/workflows/build-slknight-web.yml')
          base_steps=base.fetch('jobs').fetch('build').fetch('steps')
          x2_steps=x2.fetch('jobs').fetch('build').fetch('steps')

          base_wanted={
            'Patch engine'=>'/tmp/base_patch_engine.sh',
            'Build engine'=>'/tmp/base_build_engine.sh',
            'Install game'=>'/tmp/base_install_game.sh',
            'Patch game'=>'/tmp/base_patch_game.sh',
            'Convert media'=>'/tmp/base_convert_media.sh',
            'Build mappings'=>'/tmp/base_build_mappings.sh',
            'Patch browser'=>'/tmp/base_patch_browser.sh',
            'Verify package'=>'/tmp/base_verify.sh'
          }

          x2_wanted={
            'Backup pristine potion event'=>'/tmp/x2_backup_potion.sh',
            'Restore ordinary potion logic'=>'/tmp/x2_restore_potion.sh',
            'Fix green and bravery stacking'=>'/tmp/x2_stack_potion.sh',
            'Patch native Lineage hold attack'=>'/tmp/x2_native_auto.sh',
            'Preload monster attack assets'=>'/tmp/x2_preload_monster.sh'
          }

          base_wanted.each do |name,path|
            step=base_steps.find{|x|x['name']==name}
            abort "BASELINE STEP MISSING: #{name}" unless step&&step['run']
            File.write(path,step['run'])
          end

          x2_wanted.each do |name,path|
            step=x2_steps.find{|x|x['name']==name}
            abort "X2 STEP MISSING: #{name}" unless step&&step['run']
            File.write(path,step['run'])
          end

          puts 'FROZEN_SCRIPTS_OK'
          RB

      - name: Patch engine
        run: bash /tmp/base_patch_engine.sh

      - name: Build engine
        run: bash /tmp/base_build_engine.sh

      - name: Install game
        run: bash /tmp/base_install_game.sh

      - name: Backup pristine potion event
        run: bash /tmp/x2_backup_potion.sh

      - name: Patch game from V14.3l
        run: bash /tmp/base_patch_game.sh

      - name: Restore ordinary potion logic
        run: bash /tmp/x2_restore_potion.sh

      - name: Fix green and bravery stacking
        run: bash /tmp/x2_stack_potion.sh

      - name: Patch monster attack at common-event cycle
        run: |
          cat > /tmp/monster_ce_patch.rb <<'RB'
          # encoding: UTF-8
          require 'shellwords'
          require 'zlib'
          game=ARGV.fetch(0)

          class RawMarshalObject
            def self._load(data)
              o=allocate
              o.instance_variable_set(:@raw,data)
              o
            end
            def _dump(_depth); @raw; end
          end

          class Tone < RawMarshalObject; end
          class Color < RawMarshalObject; end
          class Rect < RawMarshalObject; end
          class Table < RawMarshalObject; end

          module RPG
            class AudioFile; end
            class Animation
              class Frame; end
              class Timing; end
            end
            class Map; end
            class CommonEvent; end
            class Event
              class Page
                class Condition; end
                class Graphic; end
              end
            end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
          end

          def iv(o,n); o.instance_variable_get("@#{n}"); end
          def setiv(o,n,v); o.instance_variable_set("@#{n}",v); end

          def sl_norm_name(s)
            s.to_s.dup.force_encoding(Encoding::UTF_8)
             .gsub(/\[공격\]/,'')
             .gsub(/[\s\-·ㆍ]/,'')
             .gsub(/[()]/,'')
          end

          def sl_runs(a)
            runs=[]
            cur=[]
            prev=nil
            a.each do |n|
              if !prev.nil?&&n!=prev+1
                runs<<cur unless cur.empty?
                cur=[]
              end
              cur<<n
              prev=n
            end
            runs<<cur unless cur.empty?
            runs
          end

          def sl_split_balanced(a,count=4)
            n=a.length
            out=[]
            count.times do |i|
              s=(i*n.to_f/count).round
              e=((i+1)*n.to_f/count).round
              out<<a[s...e].to_a
            end
            out
          end

          def sl_direction_groups(path,sheet)
            if sheet=='흑기사모션'
              return {
                2=>[10,11,12,13,14,15,16],
                4=>[17,18,19,20],
                6=>[5,6,7,8,9],
                8=>[21,22,0,1,2,3,4]
              }
            end

            cmd="convert #{Shellwords.escape(path)} -crop 192x192 +repage -channel A -format '%[fx:mean]\\n' info: 2>/dev/null"
            means=`#{cmd}`.lines.map{|x|x.to_f}
            used=[]
            means.each_with_index{|v,i|used<<i if v>0.00001}
            return nil if used.length<8

            runs=sl_runs(used)
            groups=
              if runs.length>=4
                runs[0,4]
              elsif runs.length==2&&runs.all?{|r|r.length>=4}
                sl_split_balanced(runs[0],2)+sl_split_balanced(runs[1],2)
              else
                sl_split_balanced(used,4)
              end

            return nil unless groups&&groups.length==4&&groups.all?{|g|!g.empty?}
            {2=>groups[0],4=>groups[1],6=>groups[2],8=>groups[3]}
          end

          def sl_fit(seq,target)
            return [] if seq.empty?||target<=0
            return Array.new(target,seq[0]) if seq.length==1
            return [seq[0]] if target==1

            out=[]
            target.times do |i|
              src=((i*(seq.length-1).to_f)/(target-1)).round
              out<<seq[src]
            end
            out
          end

          def sl_target_frames(wait,source_count)
            desired=[(wait*0.80).round,1].max
            target=[desired,source_count].max
            [target,wait].min
          end

          ce_path=Dir.glob(File.join(game,'Data','*CommonEvents.rxdata')).max_by{|p|File.size(p)}
          anim_path=Dir.glob(File.join(game,'Data','*Animations.rxdata')).max_by{|p|File.size(p)}
          scripts_path=File.join(game,'Data','Scripts.rxdata')
          abort 'CommonEvents missing' unless ce_path&&File.size(ce_path)>1000
          abort 'Animations missing' unless anim_path&&File.size(anim_path)>1000
          abort 'Scripts missing' unless File.size?(scripts_path)

          common_events=Marshal.load(File.binread(ce_path))
          animations=Marshal.load(File.binread(anim_path))
          scripts=Marshal.load(File.binread(scripts_path))

          runtime=<<'RUBY'
          module SLMonsterAttackContext
            @pending={}

            def self.register(switch_id,map_id,event_id)
              @pending={} unless @pending.is_a?(Hash)
              @pending[switch_id.to_i]=[map_id.to_i,event_id.to_i]
            end

            def self.start(switch_id,ids,coord_name,frames)
              @pending={} unless @pending.is_a?(Hash)
              data=@pending.delete(switch_id.to_i)
              return if data==nil
              return unless data[0]==$game_map.map_id

              event=$game_map.events[data[1]]
              return if event==nil
              return if event.instance_variable_get(:@erased)

              aid=ids[event.direction]
              return if aid==nil

              event.sl_attack_begin(coord_name,frames)
              event.animation_id=aid
            end
          end

          class Game_Character
            def sl_attack_begin(coord_name,frames)
              frames=frames.to_i
              return if frames<=0
              return if coord_name==nil
              return if coord_name.to_s==''

              unless @sl_attack_swap_active
                @sl_attack_original_name=@character_name
                @sl_attack_original_hue=@character_hue
                @sl_attack_original_tile_id=@tile_id
                @sl_attack_original_transparent=@transparent
              end

              @sl_attack_swap_active=true
              @sl_attack_swap_frames=frames
              @sl_attack_coord_name=coord_name.to_s
              @tile_id=0
              @character_name=@sl_attack_coord_name
            end

            def sl_attack_tick
              return unless @sl_attack_swap_active
              @sl_attack_swap_frames=@sl_attack_swap_frames.to_i-1
              sl_attack_finish if @sl_attack_swap_frames<=0
            end

            def sl_attack_finish
              return unless @sl_attack_swap_active

              if @character_name==@sl_attack_coord_name
                @tile_id=@sl_attack_original_tile_id
                @character_name=@sl_attack_original_name
                @character_hue=@sl_attack_original_hue
                @transparent=@sl_attack_original_transparent
              end

              @sl_attack_swap_active=false
              @sl_attack_swap_frames=0
              @sl_attack_coord_name=nil
              @sl_attack_original_name=nil
              @sl_attack_original_hue=nil
              @sl_attack_original_tile_id=nil
              @sl_attack_original_transparent=nil
            end
          end

          class Sprite_Character
            alias sl_attack_coordinate_original_update update
            def update
              sl_attack_coordinate_original_update
              @character.sl_attack_tick if @character!=nil
            end
          end
          RUBY

          scripts.delete_if do |e|
            e.is_a?(Array)&&e.length>=3&&[
              'Monster Attack Body Hide',
              'Monster Attack Coordinate Swap',
              'Monster Attack CE Trigger'
            ].include?(e[1].to_s)
          end

          main_pos=scripts.index{|e|e.is_a?(Array)&&e.length>=3&&e[1].to_s=='Main'}
          abort 'Main insertion point missing' unless main_pos
          scripts.insert(main_pos,[999997,'Monster Attack CE Trigger',Zlib::Deflate.deflate(runtime)])

          anim_dir=File.join(game,'Graphics','Animations')
          motion_assets={}
          Dir.glob(File.join(anim_dir,'*.png')).sort.each do |p|
            sheet=File.basename(p,'.png').dup.force_encoding(Encoding::UTF_8)
            next unless sheet.include?('모션')
            next if sheet.include?('죽음')
            next if sheet.include?('맞음')
            next if sheet.start_with?('물약')
            next if sheet.match?(/모션\d+\z/)
            key=sl_norm_name(sheet.sub(/[\s\-]*모션\z/,''))
            motion_assets[key]||=[sheet,p] unless key.empty?
          end

          char_dir=File.join(game,'Graphics','Characters')
          coord_assets={}
          Dir.glob(File.join(char_dir,'*좌표.png')).sort.each do |p|
            name=File.basename(p,'.png').dup.force_encoding(Encoding::UTF_8)
            key=sl_norm_name(name.sub(/[\s\-]*좌표\z/,''))
            coord_assets[key]||=name unless key.empty?
          end

          normal_assets={}
          Dir.glob(File.join(char_dir,'*.png')).sort.each do |p|
            name=File.basename(p,'.png').dup.force_encoding(Encoding::UTF_8)
            next if name.end_with?('좌표')
            key=sl_norm_name(name)
            normal_assets[key]||=[name,p] unless key.empty?
          end

          motion_assets.each_key do |sheet_key|
            next if coord_assets[sheet_key]
            normal=normal_assets[sheet_key]
            next unless normal

            coord_name=normal[0]+'좌표'
            coord_path=File.join(char_dir,coord_name+'.png')
            dims=`identify -format '%wx%h' #{Shellwords.escape(normal[1])}`.strip
            abort "coordinate size failed #{normal[0]}" unless dims.match?(/\A\d+x\d+\z/)

            ok=system('convert','-size',dims,'xc:none',coord_path)
            abort "coordinate generation failed #{normal[0]}" unless ok&&File.size?(coord_path)
            coord_assets[sheet_key]=coord_name
          end

          attack_ids={}
          common_events.each_with_index do |ce,id|
            next unless ce
            name=iv(ce,:name).to_s.dup.force_encoding(Encoding::UTF_8)
            next unless name.start_with?('[공격]')

            monster=sl_norm_name(name)
            candidates=motion_assets.keys.select{|k|monster.include?(k)}
            next if candidates.empty?

            key=candidates.max_by{|k|k.length}
            sheet=motion_assets[key][0]
            sheet_key=sl_norm_name(sheet.sub(/[\s\-]*모션\z/,''))
            coord=coord_assets[sheet_key]
            abort "coordinate missing for #{sheet}" unless coord

            attack_ids[id]={sheet:sheet,path:motion_assets[key][1],coord:coord}
          end

          removed_old=0
          common_events.compact.each do |ce|
            list=iv(ce,:list)||[]
            before=list.length
            list.delete_if do |cmd|
              next false unless iv(cmd,:code)==355
              txt=(iv(cmd,:parameters)||[])[0].to_s
              txt.include?('aid={2=>500,4=>501,6=>502,8=>503}')||
                txt.include?('SLMonsterAttackContext.start(')
            end
            removed_old+=before-list.length
          end

          base_attack=animations.compact.find do |a|
            frames=iv(a,:frames)
            frames.is_a?(Array)&&frames[0]&&iv(frames[0],:cell_data)
          end
          abort 'animation frame template missing' unless base_attack

          next_anim=[animations.length,600].max
          generated={}
          used_sheets={}
          used_coords={}
          switch_anim={}
          caller_patched=0

          make_anim=lambda do |id,sheet,patterns,wait,dir,target|
            timeline=sl_fit(patterns,target)
            anim=Marshal.load(Marshal.dump(base_attack))
            setiv(anim,:id,id)
            setiv(anim,:name,"SLM #{sheet} #{dir} W#{wait} F#{target}")
            setiv(anim,:animation_name,sheet)
            setiv(anim,:animation_hue,0)
            setiv(anim,:position,1)
            setiv(anim,:frame_max,timeline.length)
            setiv(anim,:timings,[])

            frames=[]
            timeline.each do |pattern|
              frame=Marshal.load(Marshal.dump(iv(base_attack,:frames)[0]))
              setiv(frame,:cell_max,1)
              table=Table.allocate
              setiv(table,:raw,[2,1,8,1,8].pack('L<5')+[pattern,0,0,100,0,0,255,0].pack('s<8'))
              setiv(frame,:cell_data,table)
              frames<<frame
            end
            setiv(anim,:frames,frames)
            animations[id]=anim
          end

          common_events.each_with_index do |ce,cid|
            next unless ce
            switch_id=iv(ce,:switch_id).to_i
            next if switch_id<=0

            list=iv(ce,:list)||[]
            i=0
            while i<list.length
              call=list[i]
              unless iv(call,:code)==117
                i+=1
                next
              end

              attack_id=(iv(call,:parameters)||[])[0].to_i
              meta=attack_ids[attack_id]
              unless meta
                i+=1
                next
              end

              indent=iv(call,:indent).to_i
              wait_cmd=nil
              ((i+1)...[i+10,list.length].min).each do |j|
                c=list[j]
                ci=iv(c,:indent).to_i
                break if ci<indent
                if iv(c,:code)==106&&ci==indent
                  wait_cmd=c
                  break
                end
              end

              unless wait_cmd
                i+=1
                next
              end

              cycle_wait=(iv(wait_cmd,:parameters)||[])[0].to_i
              unless cycle_wait>=8
                i+=1
                next
              end

              groups=sl_direction_groups(meta[:path],meta[:sheet])
              unless groups
                i+=1
                next
              end

              source_max=groups.values.map(&:length).max
              target=sl_target_frames(cycle_wait,source_max)
              duration_frames=target*2
              cycle_frames=cycle_wait*2
              abort "animation exceeds cycle #{meta[:sheet]} cycle=#{cycle_frames} duration=#{duration_frames}" if duration_frames>cycle_frames

              key=[meta[:sheet],cycle_wait,target]
              data=generated[key]
              unless data
                ids={}
                [2,4,6,8].each do |dir|
                  id=next_anim
                  next_anim+=1
                  make_anim.call(id,meta[:sheet],groups[dir],cycle_wait,dir,target)
                  ids[dir]=id
                end
                data={ids:ids,swap_frames:duration_frames,coord:meta[:coord]}
                generated[key]=data
                used_sheets[meta[:sheet]]=true
                used_coords[meta[:coord]]=true
              end

              if switch_anim[switch_id]&&switch_anim[switch_id][:ids]!=data[:ids]
                abort "switch collision #{switch_id}"
              end
              switch_anim[switch_id]=data

              ids=data[:ids]
              start_cmd=RPG::EventCommand.new
              setiv(start_cmd,:code,355)
              setiv(start_cmd,:indent,indent)
              setiv(
                start_cmd,
                :parameters,
                [
                  "SLMonsterAttackContext.start(#{switch_id},{2=>#{ids[2]},4=>#{ids[4]},6=>#{ids[6]},8=>#{ids[8]}},#{data[:coord].dump},#{data[:swap_frames]})"
                ]
              )

              windup=(cycle_wait*0.45).round
              windup=2 if windup<2
              windup=cycle_wait-2 if windup>cycle_wait-2
              recovery=cycle_wait-windup
              abort "wait split mismatch caller=#{cid}" unless windup+recovery==cycle_wait

              windup_cmd=RPG::EventCommand.new
              setiv(windup_cmd,:code,106)
              setiv(windup_cmd,:indent,indent)
              setiv(windup_cmd,:parameters,[windup])
              setiv(wait_cmd,:parameters,[recovery])

              list.insert(i,start_cmd)
              list.insert(i+1,windup_cmd)
              caller_patched+=1
              i+=3
            end
          end

          abort 'no monster attack callers patched' if caller_patched==0

          map_patched=0
          maps_touched={}
          switches_seen={}
          removed_map_old=0
          map_groups=Dir.glob(
            File.join(game,'Data','*Map[0-9][0-9][0-9].rxdata')
          ).group_by{|p|File.basename(p)[/Map\d{3}/]}

          map_groups.each do |map_key,paths|
            map_path=paths.max_by{|p|File.size(p)}
            next unless map_path&&File.size(map_path)>100

            map=Marshal.load(File.binread(map_path))
            changed=false

            (iv(map,:events)||{}).each do |eid,event|
              (iv(event,:pages)||[]).each do |page|
                list=iv(page,:list)||[]

                before=list.length
                list.delete_if do |cmd|
                  next false unless iv(cmd,:code)==355
                  txt=(iv(cmd,:parameters)||[])[0].to_s
                  (txt.include?('sl_attack_begin(')&&txt.include?('e.animation_id=aid'))||
                    txt.include?('SLMonsterAttackContext.register(')
                end
                if list.length!=before
                  removed_map_old+=before-list.length
                  changed=true
                end

                i=0
                while i<list.length
                  cmd=list[i]
                  unless iv(cmd,:code)==121
                    i+=1
                    next
                  end

                  p=iv(cmd,:parameters)||[]
                  first=p[0].to_i
                  last=p[1].to_i
                  state=p[2].to_i
                  unless state==0&&first==last
                    i+=1
                    next
                  end

                  info=switch_anim[first]
                  unless info
                    i+=1
                    next
                  end

                  reg_cmd=RPG::EventCommand.new
                  setiv(reg_cmd,:code,355)
                  setiv(reg_cmd,:indent,iv(cmd,:indent).to_i)
                  setiv(
                    reg_cmd,
                    :parameters,
                    [
                      "SLMonsterAttackContext.register(#{first},$game_map.map_id,#{eid}) unless $game_switches[#{first}]"
                    ]
                  )

                  list.insert(i,reg_cmd)
                  map_patched+=1
                  switches_seen[first]=true
                  changed=true
                  i+=2
                end
              end
            end

            if changed
              File.binwrite(map_path,Marshal.dump(map))
              maps_touched[map_key]=true
            end
          end

          missing=switch_anim.keys.reject{|sid|switches_seen[sid]}
          puts "UNSEEN_SWITCHES=#{missing.sort.join(',')}" unless missing.empty?
          abort 'no map attack registrations patched' if map_patched==0

          File.binwrite(ce_path,Marshal.dump(common_events))
          File.binwrite(anim_path,Marshal.dump(animations))
          File.binwrite(scripts_path,Marshal.dump(scripts))
          File.write(File.join(game,'sl_attack_sheets.txt'),used_sheets.keys.sort.join("\n")+"\n")
          File.write(File.join(game,'sl_attack_coords.txt'),used_coords.keys.sort.join("\n")+"\n")

          puts(
            "MONSTER_ATTACK_CE_V143Y " \
            "callers=#{caller_patched} " \
            "registrations=#{map_patched} " \
            "maps=#{maps_touched.length} " \
            "switches=#{switches_seen.length}/#{switch_anim.length} " \
            "sheets=#{used_sheets.length} " \
            "coords=#{used_coords.length} " \
            "generated=#{generated.length*4} " \
            "removed_old=#{removed_old} " \
            "removed_map_old=#{removed_map_old}"
          )
          RB

          ruby -c /tmp/monster_ce_patch.rb
          ruby -EUTF-8:UTF-8 /tmp/monster_ce_patch.rb player/gameasync

      - name: Convert media
        run: bash /tmp/base_convert_media.sh

      - name: Build mappings
        run: bash /tmp/base_build_mappings.sh

      - name: Patch browser from V14.3l
        run: bash /tmp/base_patch_browser.sh

      - name: Verify frozen V14.3l baseline
        run: bash /tmp/base_verify.sh

      - name: Patch native Lineage hold attack
        run: bash /tmp/x2_native_auto.sh

      - name: Preload monster attack assets
        run: |
          bash /tmp/x2_preload_monster.sh
          sed -i 's/V14\.3x2/V14.3y/g; s/v143x2/v143y/g' player/index.html
          grep -Fq 'v143y' player/index.html

      - name: Verify V14.3y package
        run: |
          set -e

          test -s player/index.html
          test -s player/gameasync/sl_attack_sheets.txt
          test -s player/gameasync/sl_attack_coords.txt
          test "$(wc -l < player/gameasync/sl_attack_sheets.txt)" -ge 20
          test "$(wc -l < player/gameasync/sl_attack_coords.txt)" -ge 20

          grep -Fq 'slAttackSheets' player/index.html
          grep -Fq 'slAttackCoords' player/index.html
          grep -Fq 'v143y' player/index.html
          grep -Fq 'function attackButton(parent)' player/js/dpad.js
          grep -Fq "b.textContent=(auto||ready)?'AUTO':'ATK'" player/js/dpad.js
          grep -Fq 'window.slAttackAutoCancel=cancelAuto' player/js/dpad.js
          grep -Fq "attackButton(pad);const slCancel=" player/js/dpad.js

          ! grep -Fq \
            "var ka='/game/Graphics/Animations/흑기사모션.png'" \
            player/index.html

          cat > /tmp/final_verify.rb <<'RB'
          # encoding: UTF-8
          require 'zlib'
          game=ARGV.fetch(0)

          class RawMarshalObject
            def self._load(data)
              o=allocate
              o.instance_variable_set(:@raw,data)
              o
            end
            def _dump(_depth); @raw; end
          end

          class Tone < RawMarshalObject; end
          class Color < RawMarshalObject; end
          class Rect < RawMarshalObject; end
          class Table < RawMarshalObject; end

          module RPG
            class AudioFile; end
            class Animation
              class Frame; end
              class Timing; end
            end
            class CommonEvent; end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
            class Map; end
            class Event
              class Page
                class Condition; end
                class Graphic; end
              end
            end
          end

          def iv(o,n); o.instance_variable_get("@#{n}"); end

          cp=Dir.glob(File.join(game,'Data','*CommonEvents.rxdata')).max_by{|p|File.size(p)}
          ap=Dir.glob(File.join(game,'Data','*Animations.rxdata')).max_by{|p|File.size(p)}
          ce=Marshal.load(File.binread(cp))
          an=Marshal.load(File.binread(ap))

          final_green=iv(ce[3],:list)||[]
          final_bravery=iv(ce[8],:list)||[]

          abort 'final green stack effect missing' unless
            iv(final_green[2],:code)==207&&iv(final_green[2],:parameters)==[-1,2]
          abort 'final green stack exit missing' unless iv(final_green[3],:code)==115
          abort 'final bravery stack effect missing' unless
            iv(final_bravery[2],:code)==207&&iv(final_bravery[2],:parameters)==[-1,270]
          abort 'final bravery stack effect event missing' unless
            iv(final_bravery[3],:code)==117&&iv(final_bravery[3],:parameters)==[589]
          abort 'final bravery stack exit missing' unless iv(final_bravery[4],:code)==115

          scripts=Marshal.load(File.binread(File.join(game,'Data','Scripts.rxdata')))

          custom_auto=scripts.select do |e|
            e.is_a?(Array)&&e.length>=3&&[
              'Persistent Auto Attack',
              'Lineage Auto Attack',
              'Mobile Diablo Assist'
            ].include?(e[1].to_s)
          end
          abort "custom auto attack remains=#{custom_auto.length}" unless custom_auto.empty?

          monster_scripts=scripts.select do |e|
            e.is_a?(Array)&&e.length>=3&&e[1].to_s=='Monster Attack CE Trigger'
          end
          abort "monster CE runtime count=#{monster_scripts.length}" unless monster_scripts.length==1

          runtime=Zlib::Inflate.inflate(monster_scripts[0][2]).force_encoding(Encoding::UTF_8)
          [
            'module SLMonsterAttackContext',
            'data=@pending.delete(switch_id.to_i)',
            'event.sl_attack_begin(coord_name,frames)',
            'event.animation_id=aid',
            'def sl_attack_tick'
          ].each do |needle|
            abort "monster runtime marker missing #{needle}" unless runtime.include?(needle)
          end

          old_monster=scripts.select do |e|
            e.is_a?(Array)&&e.length>=3&&[
              'Monster Attack Body Hide',
              'Monster Attack Coordinate Swap'
            ].include?(e[1].to_s)
          end
          abort "old monster runtime remains=#{old_monster.length}" unless old_monster.empty?

          bad=[]
          slm=0
          an.compact.each do |a|
            name=iv(a,:name).to_s.dup.force_encoding(Encoding::UTF_8)
            next unless name.start_with?('SLM ')
            slm+=1
            m=name.match(/ W(\d+) F(\d+)$/)
            next unless m
            wait=m[1].to_i
            frames=m[2].to_i
            bad<<[iv(a,:id),frames,wait] if frames>wait
          end
          abort "animation exceeds cycle units #{bad.inspect}" unless bad.empty?
          abort "generated animations too small=#{slm}" unless slm>=80

          expected_callers={
            24=>[110,851,[11,14],'놀좌표',40],
            25=>[112,850,[9,11],'오크전사좌표',32],
            27=>[113,853,[14,16],'흑기사좌표',48],
            424=>[407,853,[14,16],'흑기사좌표',48]
          }

          expected_callers.each do |cid,data|
            sid,aid,waits_expected,coord,frames=data
            x=ce[cid]
            abort "caller #{cid} missing" unless x
            abort "caller #{cid} switch mismatch" unless iv(x,:switch_id).to_i==sid
            list=iv(x,:list)||[]

            start=list.find do |c|
              iv(c,:code)==355&&
              (iv(c,:parameters)||[])[0].to_s.include?("SLMonsterAttackContext.start(#{sid},")
            end
            abort "caller #{cid} CE animation start missing" unless start

            txt=(iv(start,:parameters)||[])[0].to_s
            m=txt.match(/SLMonsterAttackContext\.start\(\d+,\{[^}]+\},(.+),(\d+)\)\z/)
            abort "caller #{cid} start parse failed" unless m
            actual_coord=eval(m[1])
            actual_frames=m[2].to_i
            abort "caller #{cid} coord=#{actual_coord.inspect}" unless actual_coord==coord
            abort "caller #{cid} swap frames=#{actual_frames}" unless actual_frames==frames

            waits=list.select{|c|iv(c,:code)==106}.map{|c|(iv(c,:parameters)||[])[0].to_i}
            abort "caller #{cid} waits=#{waits.inspect}" unless waits==waits_expected

            call=list.find{|c|iv(c,:code)==117}
            abort "caller #{cid} attack mismatch" unless
              call&&(iv(call,:parameters)||[])[0].to_i==aid
          end

          registrations=0
          map_motion_starts=0
          specific={}
          map_groups=Dir.glob(
            File.join(game,'Data','*Map[0-9][0-9][0-9].rxdata')
          ).group_by{|p|File.basename(p)[/Map\d{3}/]}

          map_groups.each do |key,paths|
            pth=paths.max_by{|p|File.size(p)}
            next unless pth&&File.size(pth)>100
            map=Marshal.load(File.binread(pth))

            (iv(map,:events)||{}).each do |eid,event|
              (iv(event,:pages)||[]).each do |page|
                (iv(page,:list)||[]).each do |cmd|
                  next unless iv(cmd,:code)==355
                  txt=(iv(cmd,:parameters)||[])[0].to_s

                  if txt.include?('SLMonsterAttackContext.register(')
                    registrations+=1
                    if key=='Map029'&&[6,19,23,15].include?(eid)
                      specific[eid]=txt
                    end
                  end

                  if txt.include?('sl_attack_begin(')&&txt.include?('e.animation_id=aid')
                    map_motion_starts+=1
                  end
                end
              end
            end
          end

          abort "registrations too small=#{registrations}" unless registrations>=1000
          abort "map animation reset scripts remain=#{map_motion_starts}" unless map_motion_starts==0

          {
            6=>'SLMonsterAttackContext.register(110,$game_map.map_id,6)',
            19=>'SLMonsterAttackContext.register(112,$game_map.map_id,19)',
            23=>'SLMonsterAttackContext.register(113,$game_map.map_id,23)',
            15=>'SLMonsterAttackContext.register(407,$game_map.map_id,15)'
          }.each do |eid,needle|
            abort "Map029 event #{eid} registration missing" unless
              specific[eid]&&specific[eid].include?(needle)
          end

          expected={
            '놀모션'=>20,
            '오크전사모션'=>16,
            '흑기사모션'=>24
          }

          expected.each do |sheet,frames|
            found=an.compact.select do |a|
              iv(a,:animation_name).to_s.dup.force_encoding(Encoding::UTF_8)==sheet&&
              iv(a,:name).to_s.include?(" F#{frames}")
            end
            abort "#{sheet} frame target missing" if found.empty?
          end

          puts(
            "FINAL_VERIFY_V143Y " \
            "native_hold_auto=ok " \
            "ce_motion=ok " \
            "registrations=#{registrations} " \
            "map_resets=#{map_motion_starts} " \
            "animations=#{slm}"
          )
          RB

          ruby -c /tmp/final_verify.rb
          ruby -EUTF-8:UTF-8 /tmp/final_verify.rb player/gameasync

          for n in '오크전사' '놀' '흑기사' '드레이크' '오크'; do
            normal="$(identify -format '%wx%h' "player/gameasync/Graphics/Characters/${n}.png")"
            coord="$(identify -format '%wx%h' "player/gameasync/Graphics/Characters/${n}좌표.png")"
            echo "$n normal=$normal coord=$coord"
            test "$normal" = "$coord"
          done

          for n in '드레이크' '오크'; do
            alpha_max="$(convert "player/gameasync/Graphics/Characters/${n}좌표.png" -alpha extract -format '%[fx:maxima]' info: 2>/dev/null)"
            echo "$n coord_alpha_max=$alpha_max"
            awk -v value="$alpha_max" 'BEGIN { exit !((value+0.0)==0.0) }'
          done

          du -sh player

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
