name: V217 | Fairy ATK Uses Original F-Key Combat - Gnoll Regression

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Restore exact successful V216 Pages artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: github-pages
          run-id: 38522314631
          github-token: ${{ github.token }}
          path: previous

      - name: Restore site and verify V216 baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          if test -s previous/artifact.tar; then
            tar -xf previous/artifact.tar -C site
            echo V217_RESTORED_FROM_V216_ARTIFACT
          else
            echo V217_ARTIFACT_UNAVAILABLE_RECOVER_V216_PUBLISHED_SITE
            python3 - <<'PY_RESTORE'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          import hashlib, json, re, time
          root=Path('site')
          base='https://gowellsik-hue.github.io/Game/'
          fixed=('index.html','COPYING-mkxp-web.txt','manifest.webmanifest','mkxp.js',
                 'mkxp.wasm','js/drive.js','js/dpad.js','js/localforage.min.js')
          def get(url):
              for attempt in range(6):
                  try:
                      with urlopen(Request(url,headers={'User-Agent':'V217-Gnoll-Native-Input',
                          'Accept-Encoding':'identity'}),timeout=60) as response:
                          return response.read()
                  except Exception:
                      if attempt==5:raise
                      time.sleep(1+2*attempt)
          files={'index.html':(base+'index.html',None)}
          for game in ('knight','elf'):
              for rel in fixed:
                  files[game+'/'+rel]=(base+game+'/'+quote(rel,safe='/'),None)
              name=game+'/gameasync/mapping.js'
              data=get(base+name+'?restore=v216')
              target=root/name;target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(data)
              body=data.decode('utf-8').split('var mappingArray = ',1)[1].split('];',1)[0]+']'
              for _,mapped in json.loads(re.sub(r',\s*\]$',']',body)):
                  rel,sep,md5=mapped.partition('?h=')
                  if '.' not in Path(rel).name:continue
                  if rel.startswith('/') or '..' in Path(rel).parts:
                      raise RuntimeError('Unsafe asset '+rel)
                  name=game+'/gameasync/'+rel
                  if name in files:raise RuntimeError('Duplicate asset '+name)
                  files[name]=(base+game+'/gameasync/'+quote(rel,safe='/')+
                      ('?h='+md5 if sep else ''),md5 if sep else None)
          if len(files)!=5354:raise RuntimeError('Wrong V216 file count '+str(len(files)))
          def job(item):
              name,(url,digest)=item;raw=get(url)
              if digest and hashlib.md5(raw).hexdigest()!=digest:
                  raise RuntimeError('Published asset hash mismatch: '+name)
              target=root/name;target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(raw)
          todo=[x for x in files.items() if not (root/x[0]).is_file()]
          with ThreadPoolExecutor(max_workers=16) as pool:
              for done in as_completed([pool.submit(job,x) for x in todo]):done.result()
          actual={str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}
          if actual!=set(files):raise RuntimeError('Incomplete V216 recovery')
          print('V217_V216_RECOVERED',len(actual))
          PY_RESTORE
          fi
          python3 - <<'PY_LOCK'
