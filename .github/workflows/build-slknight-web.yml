name: V228 | Same-Map Parity and Ettin Voices Only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: slknight-github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Restore complete successful V227 deployment
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: github-pages
          run-id: 38682183284
          github-token: ${{ github.token }}
          path: previous

      - name: Recover and verify V227 source or already deployed V228
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          if test -s previous/artifact.tar; then
            tar -xf previous/artifact.tar -C site
            echo V228_RESTORED_SUCCESSFUL_V227_ARTIFACT
          else
            echo V228_V227_ARTIFACT_EXPIRED_RECONSTRUCT_PUBLISHED_SITE
            python3 - <<'PY_RECOVER'
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request,urlopen
          from concurrent.futures import ThreadPoolExecutor,as_completed
          import hashlib,json,re,time
          root=Path('site');base='https://gowellsik-hue.github.io/Game/'
          fixed=('index.html','COPYING-mkxp-web.txt','manifest.webmanifest','mkxp.js',
                 'mkxp.wasm','js/drive.js','js/dpad.js','js/localforage.min.js')
          def get(url):
              for k in range(6):
                  try:
                      req=Request(url,headers={'User-Agent':'SLKnight-V228','Accept-Encoding':'identity'})
                      with urlopen(req,timeout=60) as rsp:return rsp.read()
                  except Exception:
                      if k==5:raise
                      time.sleep(2+k*2)
          files={'index.html':(base+'index.html',None)}
          for game in ('knight','elf'):
              for rel in fixed:files[game+'/'+rel]=(base+game+'/'+quote(rel,safe='/'),None)
              name=game+'/gameasync/mapping.js'
              blob=get(base+name+'?reload=v228')
              f=root/name;f.parent.mkdir(parents=True,exist_ok=True);f.write_bytes(blob)
              body=blob.decode('utf-8').split('var mappingArray = ',1)[1].split('];',1)[0]+']'
              for _,asset in json.loads(re.sub(r',\s*\]$',']',body)):
                  rel,sep,md5=asset.partition('?h=')
                  if '.' not in Path(rel).name:continue
                  if rel.startswith('/') or '..' in Path(rel).parts:raise RuntimeError('Unsafe asset '+rel)
                  name=game+'/gameasync/'+rel
                  if name in files:raise RuntimeError('Duplicate asset '+name)
                  files[name]=(base+game+'/gameasync/'+quote(rel,safe='/')+('?h='+md5 if sep else ''),md5 if sep else None)
          if len(files)!=5354:raise RuntimeError('Incomplete published manifest')
          def fetch(item):
              name,(url,digest)=item;blob=get(url)
              if digest and Path(name).name not in ('mapping.js','bitmap-map.js'):
                  if hashlib.md5(blob).hexdigest()!=digest:raise RuntimeError('Asset MD5 '+name)
              p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(blob)
          with ThreadPoolExecutor(max_workers=12) as ex:
              for job in as_completed([ex.submit(fetch,item) for item in files.items() if not (root/item[0]).is_file()]):job.result()
          if {str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}!=set(files):
              raise RuntimeError('Incomplete published file inventory')
          print('V228_RECOVERED_PUBLISHED_5354_FILES')
          PY_RECOVER
          fi
          python3 - <<'PY_SOURCE'
          from pathlib import Path
          import hashlib,json,re,shutil
          root=Path('site')
          paths={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if len(paths)!=5354:raise SystemExit('Expected exactly 5354 source game files')
          known={
           'index.html':'cb972e363a37790bef24aafceae5bd12aaa686934acc4a4c052402006341a3ba',
           'elf/index.html':'c4a3b2556c05dad54317168eca7a2421c961139bc3f500ca33a4bae74b7b387a',
           'knight/gameasync/Data/Scripts.rxdata':'8966a677a9789f3e9c95a058659dcf22b51d98fb1c68dd946a4e6879cf2bbaec'
          }
          for name,sha in known.items():
              if paths.get(name)!=sha:raise SystemExit('Refuse wrong edition '+name)
          for game in ('knight','elf'):
              script=(root/game/'gameasync/mapping.js').read_text(encoding='utf-8')
              body=script.split('var mappingArray = ',1)[1].split('];',1)[0]+']'
              for _,asset in json.loads(re.sub(r',\s*\]$',']',body)):
                  path,sep,digest=asset.partition('?h=')
                  if not sep or '.' not in Path(path).name or path in ('mapping.js','bitmap-map.js'):continue
                  f=root/game/'gameasync'/path
                  if hashlib.md5(f.read_bytes()).hexdigest()!=digest:raise SystemExit('Wrong mapping MD5 '+game+'/'+path)
          html=(root/'knight/index.html').read_text(encoding='utf-8')
          if 'gameasync/mapping.js?v=v228' in html:
              ce_data=(root/'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata').read_bytes()
              if ce_data.count(b'V228 Dream Spirit isolated attack map42 event')!=8 or b'V228 Dream Spirit attack using native sound' in ce_data:
                  raise SystemExit('Other V228 revision detected, refusing to silently reuse it')
              samples={'에틴 공격.ogg':'14a3c7485a172f8096024a9883f3d13bd0abbe8c7584cff9df8396719dbfff81',
                       '에틴 죽음.ogg':'a6a7847d755717a6dea67820b9c12aeff2a1cdc39f719902799f5494d5f61137'}
              for name,expected in samples.items():
                  if hashlib.sha256((root/'knight/gameasync/Audio/SE'/name).read_bytes()).hexdigest()!=expected:
                      raise SystemExit('V228 Ettin audio variant mismatch '+name)
              print('V228_ALREADY_PUBLISHED_REUSE_VERIFIED')
              Path('/tmp/v228_skip').write_text('yes')
          elif 'gameasync/mapping.js?v=v227' in html:
              required='e6af758e80b44c166969be8f5292de56565313c3e0a378e92abf92eca1ab84e9'
              if paths['knight/index.html']!=required:raise SystemExit('Unknown V227 index, unsafe to patch')
              Path('/tmp/v228_before.json').write_text(json.dumps(paths))
              prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
              dst=Path('/tmp/v228_original/knight/gameasync/Data');dst.mkdir(parents=True,exist_ok=True)
              for n in (2,3,4,5,6,8,11,12,13,14,15,16,17,19,21,22,23,26,29,35,37,41,42,43):
                  name=prefix+'Map%03d.rxdata'%n
                  shutil.copyfile(root/'knight/gameasync/Data'/name,dst/name)
              name=prefix+'CommonEvents.rxdata'
              shutil.copyfile(root/'knight/gameasync/Data'/name,dst/name)
              print('V228_LOCKED_FULL_SUCCESSFUL_V227_BASELINE')
          else:raise SystemExit('Not V227 or V228: refuse unknown game source')
          PY_SOURCE
          if test -f /tmp/v228_skip; then
            echo 'skip_patch=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip_patch=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply V228 consistent combat rewards and exact Ettin voices
        if: steps.restore.outputs.skip_patch != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/slv228
          base64 -d <<'V228_AUDIO_AND_RUBY' | tar -xz -C /tmp/slv228
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          V228_AUDIO_AND_RUBY
          python3 - <<'PY_INTEGRITY'
          from pathlib import Path
          import hashlib
          root=Path('/tmp/slv228')
          expected={'v228_patch.rb': '6daca1ebaa666cdacf7d8946f92f7a97a9b025418d9ee94fa7ba0bde70ca4158', 'v228_verify.rb': 'a2f1510d1e0fb5336ca2bef9691d0c3dd238fe39e189d659f52068c912f715a3', 'ettin_attack.ogg': '14a3c7485a172f8096024a9883f3d13bd0abbe8c7584cff9df8396719dbfff81', 'ettin_death.ogg': 'a6a7847d755717a6dea67820b9c12aeff2a1cdc39f719902799f5494d5f61137'}
          for name,digest in expected.items():
              f=root/name
              if f.stat().st_size<1000 or hashlib.sha256(f.read_bytes()).hexdigest()!=digest:
                  raise SystemExit('V228_BUNDLED_CONTENT_CORRUPT '+name)
          print('V228_BUNDLE_FOUR_ASSETS_INTEGRITY_VERIFIED')
          PY_INTEGRITY
          ruby /tmp/slv228/v228_patch.rb site
          python3 - <<'PY_VOICE'
          from pathlib import Path
          root=Path('site/knight/gameasync/Audio/SE')
          for dst,src in [('에틴 공격.ogg','ettin_attack.ogg'),('에틴 죽음.ogg','ettin_death.ogg')]:
              if not (root/dst).is_file():raise SystemExit('No target Ettin recording '+dst)
              blob=(Path('/tmp/slv228')/src).read_bytes()
              if not blob.startswith(b'OggS'):raise SystemExit('Invalid bundled OGG '+src)
              (root/dst).write_bytes(blob)
              print('V228_VOICE_REPLACED',dst,len(blob))
          PY_VOICE
          ruby /tmp/slv228/v228_verify.rb site /tmp/v228_original

      - name: Refresh 27 Knight data and Ettin audio mapping hashes
        if: steps.restore.outputs.skip_patch != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CACHE'
          from pathlib import Path
          import hashlib,re
          root=Path('site/knight')
          mp=root/'gameasync/mapping.js'
          script=mp.read_text(encoding='utf-8')
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          maps=(2,3,4,5,6,8,11,12,13,14,15,16,17,19,21,22,23,26,29,35,37,41,42,43)
          changed=['Data/'+prefix+'Map%03d.rxdata'%n for n in maps]
          changed+=['Data/'+prefix+'CommonEvents.rxdata','Audio/SE/에틴 공격.ogg','Audio/SE/에틴 죽음.ogg']
          for asset in changed:
              digest=hashlib.md5((root/'gameasync'/asset).read_bytes()).hexdigest()
              expr=re.escape(asset+'?h=')+r'[0-9a-f]{32}'
              script,n=re.subn(expr,lambda _:asset+'?h='+digest,script)
              if n!=1:raise SystemExit('Missing or ambiguous Knight cache hash '+asset)
          mp.write_text(script,encoding='utf-8')
          html_path=root/'index.html';html=html_path.read_text(encoding='utf-8')
          old='gameasync/mapping.js?v=v227'
          if html.count(old)!=1:raise SystemExit('Unknown Knight cache HTML version')
          html_path.write_text(html.replace(old,'gameasync/mapping.js?v=v228'),encoding='utf-8')
          print('V228_UPDATED_27_KNIGHT_DATA_AND_VOICE_HASHES_AND_KNIGHT_INDEX')
          PY_CACHE

      - name: Confirm all 5354 game assets and unchanged V227 state
        if: steps.restore.outputs.skip_patch != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import json,re,hashlib
          base=Path('site')
          old=json.loads(Path('/tmp/v228_before.json').read_text())
          new={str(p.relative_to(base)):hashlib.sha256(p.read_bytes()).hexdigest() for p in base.rglob('*') if p.is_file()}
          if new.keys()!=old.keys() or len(new)!=5354:raise SystemExit('V228 unexpected game file inventory')
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          maps=(2,3,4,5,6,8,11,12,13,14,15,16,17,19,21,22,23,26,29,35,37,41,42,43)
          files={'knight/index.html','knight/gameasync/mapping.js'}
          files|={'knight/gameasync/Data/'+prefix+'Map%03d.rxdata'%n for n in maps}
          files|={'knight/gameasync/Data/'+prefix+'CommonEvents.rxdata',
                  'knight/gameasync/Audio/SE/에틴 공격.ogg','knight/gameasync/Audio/SE/에틴 죽음.ogg'}
          changed={name for name in old if old[name]!=new[name]}
          if changed!=files:raise SystemExit('V228 unexpected edited assets '+repr(changed^files))
          mapping=(base/'knight/gameasync/mapping.js').read_text(encoding='utf-8')
          for name in files:
              if not name.startswith('knight/gameasync/') or name.endswith('/mapping.js'):continue
              asset=name.split('knight/gameasync/',1)[1]
              md5=hashlib.md5((base/name).read_bytes()).hexdigest()
              if mapping.count(asset+'?h='+md5)!=1:raise SystemExit('Wrong game asset cache MD5 '+name)
          assert new['knight/gameasync/Data/Scripts.rxdata']==old['knight/gameasync/Data/Scripts.rxdata']
          assert new['knight/gameasync/Audio/SE/에틴 맞음.ogg']==old['knight/gameasync/Audio/SE/에틴 맞음.ogg']
          assert new['elf/index.html']==old['elf/index.html']
          assert (base/'knight/index.html').read_text(encoding='utf-8').count('gameasync/mapping.js?v=v228')==1
          print('V228_29_INTENDED_FILES_CHANGED_AND_5325_UNTOUCHED_V227_ASSETS_IDENTICAL')
          print('V228_V227_DROPS_HEALER_COMBAT_ELF_ENGINE_PRESERVED')
          PY_FINAL

      - name: Upload complete verified Pages game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
