name: Deploy SLKnight mkxp-web V14.5 COMPLETE MOBILE
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: slknight-github-pages, cancel-in-progress: true}
env:
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake cmake curl ffmpeg freepats git imagemagick libtool make mm-common patch pkg-config python3 rake ruby timidity unzip wget xz-utils fonts-nanum

      - name: Checkout mkxp-web source
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.MKXP_SRC_REF }}
          path: engine

      - name: Cache mkxp-web dependencies
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-deps-${{ runner.os }}-emsdk-${{ env.EMSDK_VER }}-v2-onig25b

      - name: Patch engine 800x600 50fps
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def repl(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != count:
                  raise SystemExit(f'{path}: expected {count} copies, found {n}: {old!r}')
              p.write_text(s.replace(old, new, count))

          repl(
              'engine/src/config.cpp',
              'fixedFramerate = 40;',
              'fixedFramerate = 0;'
          )

          repl(
              'engine/src/config.cpp',
              'defScreenW = 640;',
              'defScreenW = 800;'
          )

          repl(
              'engine/src/config.cpp',
              'defScreenH = 480;',
              'defScreenH = 600;'
          )

          repl(
              'engine/src/config.cpp',
              'frameSkip = true;',
              'frameSkip = false;'
          )

          repl(
              'engine/src/config.cpp',
              'PO_DESC(smoothScaling, bool, true)',
              'PO_DESC(smoothScaling, bool, false)'
          )

          repl(
              'engine/src/graphics.cpp',
              'width = clamp(width, 1, 640);\n\theight = clamp(height, 1, 480);',
              'width = clamp(width, 1, 800);\n\theight = clamp(height, 1, 600);'
          )

          p = Path('engine/binding-mruby/graphics-binding.cpp')
          s = p.read_text()

          marker = '''MRB_FUNCTION(graphicsFrameReset)
          {
          \tMRB_FUN_UNUSED_PARAM;

          \tshState->graphics().frameReset();

          \treturn mrb_nil_value();
          }
          '''

          add = marker + '''
          MRB_FUNCTION(graphicsResizeScreen)
          {
          \tMRB_FUN_UNUSED_PARAM;
          \tmrb_int width, height;
          \tmrb_get_args(mrb, "ii", &width, &height);
          \tGUARD_EXC( shState->graphics().resizeScreen(width, height); )
          \treturn mrb_nil_value();
          }
          '''

          if s.count(marker) != 1:
              raise SystemExit('graphicsFrameReset marker mismatch')

          s = s.replace(marker, add, 1)

          reg = '\tmrb_define_module_function(mrb, module, "frame_reset", graphicsFrameReset, MRB_ARGS_NONE());'

          if s.count(reg) != 1:
              raise SystemExit('frame_reset registration mismatch')

          s = s.replace(
              reg,
              reg + '\n\tmrb_define_module_function(mrb, module, "resize_screen", graphicsResizeScreen, MRB_ARGS_REQ(2));',
              1
          )

          p.write_text(s)

          repl(
              'engine/binding-mruby/binding-mruby.cpp',
              '\tif (jsSkipFrame() == 1) return;',
              '\t/* V14: Graphics.frame_rate is the only frame limiter. */'
          )

          repl(
              'engine/build.sh',
              './emsdk install latest',
              './emsdk install 3.1.37'
          )

          repl(
              'engine/build.sh',
              './emsdk activate latest',
              './emsdk activate 3.1.37'
          )

          p = Path('engine/extra/build_config.rb')
          s = p.read_text()

          gem = "    conf.gem :github => 'pulsejet/mruby-marshal'"

          pin = (
              "    conf.gem :github => 'mattn/mruby-onig-regexp', "
              ":checksum_hash => '25b152264cd4dfac84aa39e5fbb428ec84b95e6a'\n"
              + gem
          )

          if s.count(gem) != 1:
              raise SystemExit('mruby-marshal build_config marker mismatch')

          p.write_text(s.replace(gem, pin, 1))

          print('ENGINE_PATCH_OK')
          PY

          grep -Fq 'fixedFramerate = 0;' engine/src/config.cpp
          grep -Fq 'frameSkip = false;' engine/src/config.cpp
          grep -Fq 'defScreenW = 800;' engine/src/config.cpp
          grep -Fq 'defScreenH = 600;' engine/src/config.cpp
          grep -Fq 'resize_screen' engine/binding-mruby/graphics-binding.cpp
          grep -Fq 'if (window.saveFile) window.saveFile(UTF8ToString(fullPathC));' engine/src/emscripten.cpp
          grep -Fq "checksum_hash => '25b152264cd4dfac84aa39e5fbb428ec84b95e6a'" engine/extra/build_config.rb

      - name: Build patched mkxp-web engine
        run: |
          set -e

          mkdir -p engine/build/gameasync

          rm -rf \
            engine/deps/mruby/build/repos/wasm32-unknown-gnu/mruby-onig-regexp

          cd engine
          bash build.sh
          cd ..

          rm -rf engine/build/gameasync

          test -s engine/build/index.html
          test -s engine/build/mkxp.js
          test -s engine/build/mkxp.wasm

          echo ENGINE_BUILD_OK

      - name: Download and install game
        run: |
          set -e

          curl -L --fail --retry 3 \
            -o game.zip \
            "$GAME_URL"

          echo "$GAME_SHA256  game.zip" | sha256sum -c -

          unzip -q game.zip -d src

          rm -rf player

          cp -a engine/build player

          rm -rf \
            player/gameasync \
            player/preload

          mkdir -p \
            player/gameasync/Fonts \
            player/preload

          cp -a \
            src/SLKnight_Android_JoiPlay/. \
            player/gameasync/

          cp \
            engine/extra/rgss.rb \
            player/gameasync/rgss.rb

          cp \
            engine/COPYING \
            player/COPYING-mkxp-web.txt

          cp \
            /usr/share/fonts/truetype/nanum/NanumGothic.ttf \
            player/gameasync/Fonts/NanumGothic.ttf

          cp \
            /usr/share/fonts/truetype/nanum/NanumGothicBold.ttf \
            player/gameasync/Fonts/NanumGothicBold.ttf

          rm -f \
            player/gameasync/Save*.rxdata \
            player/gameasync/README_Android.txt

      - name: Patch game scripts and data
        run: |
          ruby -EUTF-8:UTF-8 -rzlib - player/gameasync <<'RB'
          # encoding: UTF-8

          game = ARGV[0]

          ini_path = File.join(game, 'Game.ini')
          ini = File.binread(ini_path)

          rel = ini[/^Scripts=(.+)$/i, 1].to_s.strip.tr('\\', '/')

          abort 'Scripts entry missing' if rel.empty?

          source_path = File.join(game, rel)
          scripts = Marshal.load(File.binread(source_path))

          compat = <<'RUBY'
          $joiplay = true

          module Kernel
            def exit(*args)
              nil
            end
          end

          class Win32API
            def initialize(*args)
              @func = args[1].to_s
            end

            def web_input(key)
              case key.to_i
              when 9, 90
                Input::A
              when 13, 32, 67
                Input::C
              when 27, 88
                Input::B
              when 68
                Input::Z
              when 81
                Input::L
              when 83
                Input::Y
              when 87
                Input::R
              when 65
                Input::X
              when 16
                Input::SHIFT
              when 17
                Input::CTRL
              when 18
                Input::ALT
              else
                nil
              end
            end

            def call(*args)
              code = web_input(args[0])

              if @func == 'GetAsyncKeyState'
                return code && Input.trigger?(code) ? 1 : 0
              end

              if @func == 'GetKeyState'
                return code && Input.press?(code) ? -1 : 0
              end

              0
            end

            def Call(*args)
              call(*args)
            end
          end

          Font.default_name = 'NanumGothic'

          module Audio
            def self.sl_stream(kind, *parts)
              puts(
                (
                  ['SLAUDIO', kind] +
                  parts.collect { |v| v.to_s }
                ).join('|')
              )
            end

            def self.bgm_play(filename, volume = 100, pitch = 100)
              sl_stream('BGM_PLAY', filename, volume, pitch)
            end

            def self.bgm_stop
              sl_stream('BGM_STOP')
            end

            def self.bgm_fade(time)
              sl_stream('BGM_FADE', time)
            end

            def self.bgs_play(filename, volume = 100, pitch = 100)
              sl_stream('BGS_PLAY', filename, volume, pitch)
            end

            def self.bgs_stop
              sl_stream('BGS_STOP')
            end

            def self.bgs_fade(time)
              sl_stream('BGS_FADE', time)
            end
          end
          RUBY

          scripts.insert(
            0,
            [
              0,
              'Web Compatibility',
              Zlib::Deflate.deflate(compat)
            ]
          )

          def patch_begin_until(src)
            lines = src.lines

            lines.each_index do |i|
              m = lines[i].match(
                /^(\s*)end\s+until\s+(.+?)\s*$/
              )

              next unless m

              indent = m[1]
              cond = m[2]

              j = i - 1

              while j >= 0
                if lines[j][/^\s*/] == indent &&
                   lines[j].strip == 'begin'

                  lines[j] = indent + "loop do\n"

                  lines[i] =
                    indent +
                    "  break if #{cond}\n" +
                    indent +
                    "end\n"

                  break
                end

                j -= 1
              end
            end

            lines.join
          end

          def patch_scene_loop(src)
            lines = src.lines
            i = 0

            while i < lines.length
              unless lines[i].strip == 'loop do'
                i += 1
                next
              end

              indent = lines[i][/^\s*/]

              sig = []
              k = i + 1

              while k < lines.length && sig.length < 8
                s = lines[k].strip

                unless s.empty? || s.start_with?('#')
                  sig << [
                    k,
                    s,
                    lines[k][/^\s*/]
                  ]
                end

                k += 1
              end

              finish = nil

              if sig.length >= 7 &&
                 sig[0][1] == 'Graphics.update' &&
                 sig[1][1] == 'Input.update' &&
                 sig[2][1] == 'update' &&
                 sig[3][1] == 'if $scene != self' &&
                 sig[4][1] == 'break' &&
                 sig[5][1] == 'end' &&
                 sig[6][1] == 'end' &&
                 sig[6][2] == indent

                finish = sig[6][0]
              end

              if finish.nil? &&
                 sig.length >= 5 &&
                 sig[0][1] == 'Graphics.update' &&
                 sig[1][1] == 'Input.update' &&
                 sig[2][1] == 'update' &&
                 sig[3][1] == 'break if $scene != self' &&
                 sig[4][1] == 'end' &&
                 sig[4][2] == indent

                finish = sig[4][0]
              end

              if finish
                lines[i..finish] = [
                  indent +
                  "end\n\n" +
                  indent +
                  "def dispose\n"
                ]
              end

              i += 1
            end

            lines.join
          end

          id_sprite = <<'RUBY'
          class Game_Character
            attr_accessor :sprite_id
          end

          class Sprite_Character
            alias sl_id_original_update update

            def create_id_sprite(text)
              bitmap = Bitmap.new(160, 16)

              bitmap.font.name = 'NanumGothic'
              bitmap.font.size = 12
              bitmap.font.bold = false

              bitmap.font.color.set(0, 0, 0)

              bitmap.draw_text(
                0, -1, 160, 16,
                text, 1
              )

              bitmap.draw_text(
                0, 1, 160, 16,
                text, 1
              )

              bitmap.draw_text(
                -1, 0, 160, 16,
                text, 1
              )

              bitmap.draw_text(
                1, 0, 160, 16,
                text, 1
              )

              bitmap.font.color.set(
                255, 255, 255
              )

              bitmap.draw_text(
                0, 0, 160, 16,
                text, 1
              )

              @_id_sprite =
                Sprite.new(self.viewport)

              @_id_sprite.bitmap = bitmap
              @_id_sprite.opacity = 255
              @_id_sprite.ox = 80
              @_id_sprite.oy = 14
              @_id_sprite.x = self.x
              @_id_sprite.y =
                self.y - self.oy / 2
              @_id_sprite.z = 9999
              @_id_sprite_visible = true
            end

            def dispose_id_sprite
              if @_id_sprite != nil
                if @_id_sprite.bitmap != nil &&
                   !@_id_sprite.bitmap.disposed?

                  @_id_sprite.bitmap.dispose
                end

                @_id_sprite.dispose
                @_id_sprite = nil
              end

              @_id_sprite_visible = false
            end

            def update_id_sprite
              if @character.sprite_id != nil &&
                 @character.sprite_id.to_s != ''

                unless @_id_sprite_visible
                  create_id_sprite(
                    @character.sprite_id
                  )
                end

                @_id_sprite.x = self.x
                @_id_sprite.y =
                  self.y - self.oy

              elsif @_id_sprite_visible
                dispose_id_sprite
              end
            end

            def update
              sl_id_original_update
              update_id_sprite
            end
          end
          RUBY

          id_output = <<'RUBY'
          class Game_Event
            alias sl_id_original_event_refresh refresh

            def refresh
              sl_id_original_event_refresh

              text = @event.name.dup

              text.gsub!(
                /\[[Ii][Dd](.+?)\]/
              ) do
                @sprite_id = $1
              end

              @sprite_id = nil if @erased
              @sprite_id = nil if @character_name == ''
            end
          end

          class Game_Player
            alias sl_id_original_player_refresh refresh

            def refresh
              sl_id_original_player_refresh

              if $game_party.actors.size > 0
                @sprite_id = nil
              end
            end
          end
          RUBY

          browser_loop = <<'RUBY'
          $prev_scene = nil
          $sl_last_scene_name = nil

          def main_update_loop
            begin
              if $scene != nil
                active_scene = $scene
                name = active_scene.class.to_s

                if $sl_last_scene_name != name
                  puts(
                    'SLFRAME|' + name
                  )
                end

                $sl_last_scene_name = name

                if active_scene != $prev_scene
                  if $prev_scene != nil &&
                     $prev_scene.respond_to?(:dispose)

                    $prev_scene.dispose
                  end

                  active_scene.main

                  $prev_scene = active_scene

                  return if $scene != active_scene
                end

                Graphics.update
                Input.update

                if $scene == active_scene
                  active_scene.update
                end
              end

            rescue Exception => e
              puts(
                'SLRUNTIMEERR|' +
                e.class.to_s +
                '|' +
                e.message.to_s
              )

              if e.respond_to?(:backtrace) &&
                 e.backtrace

                e.backtrace[0, 16].each do |line|
                  puts(
                    'SLRUNTIMEBT|' +
                    line.to_s
                  )
                end
              end
            end
          end
          RUBY

          plane = 0
          ids = 0
          fonts = 0

          font_rules = [
            [
              /((?:Font\.default_name)\s*=\s*)\[\s*["'][^"']*["']\s*\]/n,
              '\1"NanumGothic"'
            ],
            [
              /(Font\.default_name\s*=\s*)["'][^"']*["']/n,
              '\1"NanumGothic"'
            ],
            [
              /(\.font\.name\s*=\s*)["'][^"']*["']/n,
              '\1"NanumGothic"'
            ],
            [
              /(\bFONT_NAME\s*=\s*)["'][^"']*["']/n,
              '\1"NanumGothic"'
            ]
          ]

          scripts.each_with_index do |entry, index|
            next unless entry.is_a?(Array)
            next unless entry.length >= 3

            name = entry[1].to_s

            begin
              text =
                Zlib::Inflate.inflate(
                  entry[2]
                )
            rescue
              next
            end

            font_rules.each do |rx, rep|
              fonts += text.scan(rx).length
              text.gsub!(rx, rep)
            end

            text.gsub!(
              'defined?($joiplay) && $joiplay',
              '$joiplay == true'
            )

            if index == 111
              text = id_sprite
              ids += 1

            elsif index == 112
              text = id_output
              ids += 1

            elsif text.match?(
              /^\s*class\s+Plane\s*<\s*Sprite\b/n
            )
              text =
                "# native Plane used on web\n"

              plane += 1
            end

            text =
              patch_begin_until(text)

            unless name == 'Main' ||
                   name == 'Scene_Map'

              text =
                patch_scene_loop(text)
            end

            if name == 'Main'
              unless text.include?(
                'def main_update_loop'
              )
                text =
                  browser_loop +
                  text
              end

              text.sub!(
                /\n\s*while\s+\$scene\s*!=\s*nil\s*\r?\n\s*\$scene\.main\s*\r?\n\s*end\s*/m,
                "\n"
              )
            end

            entry[2] =
              Zlib::Deflate.deflate(text)
          end

          abort "Plane patch=#{plane}" unless plane == 1
          abort "ID patch=#{ids}" unless ids == 2
          abort "font patch=#{fonts}" unless fonts >= 10

          def entry_for(scripts, name)
            e = scripts.find do |x|
              x.is_a?(Array) &&
              x.length >= 3 &&
              x[1].to_s == name
            end

            abort "missing #{name}" unless e

            e
          end

          def inflate(e)
            Zlib::Inflate
              .inflate(e[2])
              .force_encoding(
                Encoding::UTF_8
              )
          end

          def deflate(e, s)
            e[2] =
              Zlib::Deflate.deflate(s)
          end

          resolution = scripts[97]
          rt = inflate(resolution)

          unless rt.include?(
            '$WINDOW_WIDTH = 800'
          ) &&
          rt.include?(
            'Graphics.resize_screen'
          )
            abort 'resolution script mismatch'
          end

          if rt.include?(
            'defined?($joiplay)'
          )
            abort 'resolution defined? remains'
          end

          deflate(
            resolution,
            rt
          )

          equip =
            entry_for(
              scripts,
              'Scene_Equip'
            )

          text = inflate(equip)

          eqrx =
            /    loop do\r?\n.*?^    end\r?\n(?=    #[^\n]*\r?\n    Graphics\.freeze)/m

          unless text.scan(eqrx).size == 1
            abort 'Scene_Equip loop patch mismatch'
          end

          text.sub!(
            eqrx,
            "  end\n" +
            "  def dispose\n" +
            "    $game_switches[49] = true\n"
          )

          deflate(equip, text)

          save =
            entry_for(
              scripts,
              'Scene_Save'
            )

          text = inflate(save)

          n = 0

          text =
            text.sub(
              /    write_save_data\(file\)\r?\n    exit/
            ) do
              n += 1

              "    write_save_data(file)\n" +
              "    file.close\n" +
              "    save_file_async(filename)"
            end

          abort "Scene_Save persist patch=#{n}" unless n == 1

          deflate(
            save,
            text
          )

          menu_fx =
            scripts.find do |e|
              next false unless e.is_a?(Array)
              next false unless e.length >= 3

              begin
                inflate(e).include?(
                  'XRXS_MP7_Module'
                )
              rescue
                false
              end
            end

          abort 'menu lifecycle script missing' unless menu_fx

          text = inflate(menu_fx)

          ds =
            /  def dispose_spriteset\r?\n.*?    @spriteset\.dispose\r?\n  end/m

          unless text.scan(ds).size == 1
            abort 'dispose_spriteset mismatch'
          end

          text.sub!(
            ds,
            "  def dispose_spriteset\n" +
            "    if @spriteset != nil\n" +
            "      @spriteset.dispose\n" +
            "      @spriteset = nil\n" +
            "    end\n" +
            "  end"
          )

          wr =
            /  alias xrxs_mp7_main main\r?\n  def main\r?\n    create_spriteset\r?\n    xrxs_mp7_main\r?\n    dispose_spriteset\r?\n  end/

          unless text.scan(wr).size == 8
            abort 'menu wrapper mismatch'
          end

          text.gsub!(
            wr,
            "  alias xrxs_mp7_main main\n" +
            "  def main\n" +
            "    create_spriteset\n" +
            "    xrxs_mp7_main\n" +
            "  end\n" +
            "  alias xrxs_mp7_dispose dispose\n" +
            "  def dispose\n" +
            "    xrxs_mp7_dispose\n" +
            "    dispose_spriteset\n" +
            "  end"
          )

          deflate(
            menu_fx,
            text
          )

          multi =
            entry_for(
              scripts,
              'Multi-slot script : Windows'
            )

          text =
            inflate(multi)

          old_ms =
            / alias g7_ms_scene_equip_main main\r?\n def main\r?\n  @additional_initialize_done = false\r?\n  g7_ms_scene_equip_main\r?\n  for i in 5\.\.\.@item_windows\.size\r?\n   @item_windows\[i\]\.dispose unless @item_windows\[i\]\.nil\?\r?\n  end\r?\n end/

          unless text.scan(old_ms).size == 1
            abort 'multislot lifecycle mismatch'
          end

          text.sub!(
            old_ms,
            " alias g7_ms_scene_equip_main main\n" +
            " def main\n" +
            "  @additional_initialize_done = false\n" +
            "  g7_ms_scene_equip_main\n" +
            " end\n" +
            " alias g7_ms_scene_equip_dispose dispose\n" +
            " def dispose\n" +
            "  if @item_windows != nil\n" +
            "   for i in 5...@item_windows.size\n" +
            "    @item_windows[i].dispose unless @item_windows[i].nil?\n" +
            "   end\n" +
            "  end\n" +
            "  g7_ms_scene_equip_dispose\n" +
            " end"
          )

          text.gsub!(
            'if defined? xrxs_additional_refresh',
            'if respond_to?(:xrxs_additional_refresh)'
          )

          deflate(
            multi,
            text
          )

          mog =
            scripts.find do |e|
              next false unless e.is_a?(Array)
              next false unless e.length >= 3

              begin
                inflate(e).include?(
                  'alias shud_main main'
                )
              rescue
                false
              end
            end

          abort 'MOG HUD missing' unless mog

          text = inflate(mog)

          text.gsub!(
            'Viewport.new(0, 0, 640, 480)',
            'Viewport.new(0, 0, $WINDOW_WIDTH, $WINDOW_HEIGHT)'
          )

          deflate(
            mog,
            text
          )

          title =
            entry_for(
