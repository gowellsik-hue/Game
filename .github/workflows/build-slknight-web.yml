
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R52
# SOURCE: V230 V5.41-v2 491EV from supplied SLKnight_V5.41_YML_v2(2).html.
# ALL 491 V230 numbers are unchanged; v2 clarifies EXP and money interval rules.
# BASE: deployed V229R50 run 39731583731. Do NOT drop original wall layers or TI mobs.
# APPLY: 490 hunted event EXP values exactly once, no 4x/12x added.
# Adena: 62 source-defined boss 60-140% bands ONLY; normals have no declared bands.
# 212 positive-money normal EVs retain original R50 common/event RNG shapes
# normalized to their V230 base value; 162 without native RNG keep specified base.
# Zero Adena: 44 regular, 10 bosses, 1 nonhunt NPC, all remain zero.
# KEEP: original item drop common events; suppress only old EXP/Adena payouts.
# APPLY: exact HP thresholds, dodge rolls and active monster move-speed/frequency settings.
# Keep original attack CE, monster animations, visuals, portals, 106 TI monster spawns.
# Do not change unseen special-attack mechanics that V5.41 marks 'untracked'.
# Keep Baal deleted and Gir battlefield preserved. No game2 changes.
name: build-slknight-web.yml | V229R52 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R52 Restore successful deployed R50 and preserve other gameplay
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39731583731
          name: github-pages
          github-token: ${{ github.token }}
          path: r50

      - name: V229R52 Verify R50 deployed baseline and original drop CEs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s r50/artifact.tar
          tar -xf r50/artifact.tar -C site
          cat > /tmp/baseline.py <<'R52_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site');p='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          expected={'Scripts.rxdata':'a2b0373ae6c0fe16364529e761a19ed0a4fdff6726d1d1e5149b83bac7a943b6',
                    p+'CommonEvents.rxdata':'c1112940bc8ba843e0a7a108a09c09c00a8c952162c62b5f2119323353cb2959'}
          for n,v in expected.items():
           f=root/'knight/gameasync/Data'/n
           assert f.is_file() and hashlib.sha256(f.read_bytes()).hexdigest()==v,(n,'Unexpected R50 base')
          for f in ('index.html','knight/index.html'):
           assert 'V229R50' in (root/f).read_text('utf-8'), f
          baseline={str(f.relative_to(root)):hashlib.sha256(f.read_bytes()).hexdigest() for f in root.rglob('*') if f.is_file()}
          assert len(baseline)==5517,len(baseline)
          Path('build/r52-baseline.json').write_text(json.dumps(baseline,sort_keys=True))
          print('PASS exact V229R50 deployed baseline 5517 files, loot common events intact')
          R52_BASE
          python3 /tmp/baseline.py

