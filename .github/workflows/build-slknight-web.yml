
name: V204 | Fairy Shop Icons, Existing Attack Motion and Save Menu

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Restore exact V203 deployment
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 38193144067
          github-token: ${{ github.token }}
          path: prior

      - name: Extract and guard unchanged game
        shell: bash
        run: |
          set -euo pipefail
          test -s prior/artifact.tar
          mkdir -p site
          tar -xf prior/artifact.tar -C site
          for f in site/elf/index.html site/elf/gameasync/Data/Scripts.rxdata site/elf/gameasync/mapping.js site/elf/js/dpad.js site/elf/mkxp.wasm site/knight/index.html site/knight/gameasync/Data/Scripts.rxdata site/knight/js/dpad.js; do
            test -s "$f"
          done
          sha256sum \
            site/knight/index.html \
            site/knight/gameasync/Data/Scripts.rxdata \
            site/knight/js/dpad.js \
            site/elf/js/dpad.js \
            site/elf/mkxp.js \
            site/elf/mkxp.wasm \
            site/elf/gameasync/Data/VIQLMRLKMVIPVMJHOCSULWPCHOJTMRVIAFODOARHMap029.rxdata > /tmp/v204_unchanged.sha
          cp site/elf/gameasync/Data/Scripts.rxdata /tmp/v204_original_scripts.rxdata
          echo V204_V203_BASE_LOCKED

      - name: Restore missing merchant icons using authentic Knight assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re, shutil
          base = Path('site')
          icons = base/'elf/gameasync/Graphics/Icons'
          mapping_file = base/'elf/gameasync/mapping.js'
          mapping = mapping_file.read_text(encoding='utf-8')
          additions = []
          for name in ('주홍물약', '고기', '마법망토'):
              source = base/'knight/gameasync/Graphics/Icons'/(name+'.png')
              target = icons/(name+'.png')
              if not source.is_file() or source.read_bytes()[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit('Original Knight merchant icon missing: '+name)
              if target.exists() or ('"graphics/icons/'+name.lower()+'"') in mapping:
                  raise SystemExit('Unexpected existing Fairy icon: '+name)
              shutil.copyfile(source,target)
              digest = hashlib.md5(target.read_bytes()).hexdigest()
              addons = ['graphics/icons/'+name.lower(), 'Graphics/Icons/'+name+'.png?h='+digest]
              additions.append('['+json.dumps(addons[0],ensure_ascii=False)+', '+json.dumps(addons[1],ensure_ascii=False)+'],')

          # The bow-glove icon is missing in both original games.
          # Use an existing bow icon without changing item data.
          name='골무'
          source = icons/'장궁.png'
          target = icons/(name+'.png')
          if not source.is_file() or source.read_bytes()[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('Fairy bow icon fallback missing')
          if target.exists() or ('"graphics/icons/'+name+'"') in mapping:
              raise SystemExit('Bow-glove icon already present')
          shutil.copyfile(source,target)
          digest=hashlib.md5(target.read_bytes()).hexdigest()
          additions.append('['+json.dumps('graphics/icons/'+name,ensure_ascii=False)+', '+json.dumps('Graphics/Icons/'+name+'.png?h='+digest,ensure_ascii=False)+'],')

          patched,count = re.subn(r'^\];\s*$',lambda m:'\n'.join(additions)+'\n];',mapping,count=1,flags=re.M)
          if count!=1: raise SystemExit('Fairy mapping closing anchor missing')
          mapping_file.write_text(patched,encoding='utf-8')
          print('V204_FOUR_MERCHANT_ICONS_RESTORED')
          PY

      - name: Connect existing Fairy attack motion and enable Save menu
        shell: bash
        run: |
          set -euo pipefail
          ruby -rzlib - site/elf/gameasync/Data/Scripts.rxdata <<'RB'
          path=ARGV.fetch(0)
          scripts=Marshal.load(File.binread(path))
          target=scripts.select{|e|e.is_a?(Array)&&e[1].to_s=='SLFairy NPC Safe Target V201'}
          menu=scripts.select{|e|e.is_a?(Array)&&e[1].to_s=='Scene_Menu'}
          save=scripts.select{|e|e.is_a?(Array)&&e[1].to_s=='Scene_Save'}
          load=scripts.select{|e|e.is_a?(Array)&&e[1].to_s=='Scene_Load'}
          abort 'Expected one each of target, menu, save and load' unless [target,menu,save,load].all?{|a|a.size==1}

          source=Zlib::Inflate.inflate(target[0][2]).force_encoding('UTF-8')
          anchor="        if SLFairyTargetV201.ready?(enemy)\n          enemy.start"
          replacement="        if SLFairyTargetV201.ready?(enemy)\n"+
            "          # Existing Fairy motion event requires switch 763.\n"+
            "          # Only arm it for actual monster targets, never NPC interaction.\n"+
            "          $game_switches[763] = true if $game_switches && !$game_switches[763]\n"+
            "          enemy.start"
          abort 'Attack-event anchor missing' unless source.scan(anchor).size==1
          source.sub!(anchor,replacement)
          RubyVM::InstructionSequence.compile(source,'Fairy Target V204')
          target[0][1]='SLFairy NPC Safe Target and Motion V204'
          target[0][2]=Zlib::Deflate.deflate(source)

          ms=Zlib::Inflate.inflate(menu[0][2]).force_encoding('UTF-8').gsub("\r\n","\n")
          old=%Q{    s4 = "능력치"\n    s5 = "종료"\n    @command_window = Window_Command.new(160, [s1, s2, s3, s4, s5])}
          fresh=%Q{    s4 = "능력치"\n    s5 = "저장"\n    s6 = "종료"\n    @command_window = Window_Command.new(160, [s1, s2, s3, s4, s5, s6])}
          abort 'Scene_Menu command anchor mismatch' unless ms.scan(old).size==1
          ms.sub!(old,fresh)
          old_command='      when 4  # 게임 종료'
          new_command="      when 4  # 저장\n"+
            "        $game_system.se_play($data_system.decision_se)\n"+
            "        $scene = Scene_Save.new\n"+
            "      when 5  # 게임 종료"
          abort 'Scene_Menu save branch anchor mismatch' unless ms.scan(old_command).size==1
          ms.sub!(old_command,new_command)
          RubyVM::InstructionSequence.compile(ms,'Fairy Menu V204')
          menu[0][2]=Zlib::Deflate.deflate(ms)

          # mkxp-web save-file compatibility.
          ss=Zlib::Inflate.inflate(save[0][2]).force_encoding('UTF-8').gsub("\r\n","\n")
          save_anchor="    Marshal.dump($game_player, file)\n"
          abort 'Scene_Save writing anchor missing' unless ss.scan(save_anchor).size==1
          ss.sub!(save_anchor,save_anchor+"    Marshal.dump(1, file)\n")
          abort 'Browser save persistence hook absent' unless ss.include?('save_file_async(filename)')
          RubyVM::InstructionSequence.compile(ss,'Fairy Save V204')
          save[0][2]=Zlib::Deflate.deflate(ss)

          # Correct the existing system-state restore typo.
          ls=Zlib::Inflate.inflate(load[0][2]).force_encoding('UTF-8').gsub("\r\n","\n")
          broken='    $game_system6488    = Marshal.load(file)'
          fixed='    $game_system        = Marshal.load(file)'
          abort 'Scene_Load restore anchor missing' unless ls.scan(broken).size==1
          ls.sub!(broken,fixed)
          RubyVM::InstructionSequence.compile(ls,'Fairy Load V204')
          load[0][2]=Zlib::Deflate.deflate(ls)

          File.binwrite(path,Marshal.dump(scripts))
          puts 'V204_MOTION_SWITCH_AND_SAVE_MENU_CONNECTED'
          RB

      - name: Update only Fairy scripts hash and page cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          root=Path('site/elf')
          scripts=root/'gameasync/Data/Scripts.rxdata'
          mapping=root/'gameasync/mapping.js'
          html=root/'index.html'
          digest=hashlib.md5(scripts.read_bytes()).hexdigest()
          content=mapping.read_text(encoding='utf-8')
          rx=r'(\["data/scripts",\s*"Data/Scripts\.rxdata\?h=)[0-9a-f]{32}("\],)'
          content,count=re.subn(rx,lambda m:m.group(1)+digest+m.group(2),content)
          if count!=1:raise SystemExit('Fairy Scripts mapping not unique')
          mapping.write_text(content,encoding='utf-8')
          page=html.read_text(encoding='utf-8')
          for old,new in (
              ('gameasync/mapping.js?v=fairy203','gameasync/mapping.js?v=fairy204'),
              ("box.textContent='V203 '+state","box.textContent='V204 '+state"),
          ):
              if page.count(old)!=1:raise SystemExit('Fairy HTML version marker mismatch: '+old)
              page=page.replace(old,new,1)
          html.write_text(page,encoding='utf-8')
          print('V204_FAIRY_CACHE_REFRESHED')
          PY

      - name: Validate motion, save and load, merchant icons and unchanged Knight
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c /tmp/v204_unchanged.sha
          node --check site/elf/js/dpad.js
          grep -Fq 'gameasync/mapping.js?v=fairy204' site/elf/index.html
          grep -Fq "box.textContent='V204 '+state" site/elf/index.html
          ruby -rzlib - /tmp/v204_original_scripts.rxdata site/elf/gameasync/Data/Scripts.rxdata <<'RB'
          original=Marshal.load(File.binread(ARGV[0]))
          current=Marshal.load(File.binread(ARGV[1]))
          abort 'Script count changed' unless original.size==current.size
          changed=(0...original.size).select{|i|original[i]!=current[i]}
          abort "Unexpected Ruby changes: #{changed.inspect}" unless changed.size==4
          names=changed.map{|i|original[i][1].to_s}.sort
          abort "Wrong Ruby scripts changed: #{names.inspect}" unless names==['SLFairy NPC Safe Target V201','Scene_Menu','Scene_Save','Scene_Load'].sort
          motion=current.find{|e|e.is_a?(Array)&&e[1].to_s=='SLFairy NPC Safe Target and Motion V204'}
          menu=current.find{|e|e.is_a?(Array)&&e[1].to_s=='Scene_Menu'}
          save=current.find{|e|e.is_a?(Array)&&e[1].to_s=='Scene_Save'}
          load=current.find{|e|e.is_a?(Array)&&e[1].to_s=='Scene_Load'}
          t=Zlib::Inflate.inflate(motion[2]).force_encoding('UTF-8');m=Zlib::Inflate.inflate(menu[2]).force_encoding('UTF-8')
          abort 'Existing motion switch not connected' unless t.include?('$game_switches[763] = true if $game_switches && !$game_switches[763]')
          abort 'NPC fallthrough lost' unless t.include?('sl_fairy_v201_native_there(triggers)')
          abort 'Save menu absent' unless m.include?('s5 = "저장"') && m.include?('s6 = "종료"')
          abort 'Save scene not connected' unless m.include?('$scene = Scene_Save.new')
          abort 'Exit moved incorrectly' unless m.include?('when 5  # 게임 종료')
          sv=Zlib::Inflate.inflate(save[2]).force_encoding('UTF-8')
          ld=Zlib::Inflate.inflate(load[2]).force_encoding('UTF-8')
          abort 'No persistent browser save' unless sv.include?('save_file_async(filename)')
          abort 'Marshal footer missing' unless sv.include?('Marshal.dump(1, file)')
          abort 'System restore typo unresolved' if ld.include?('$game_system6488')
          abort 'Game system restore absent' unless ld.include?('$game_system        = Marshal.load(file)')
          RubyVM::InstructionSequence.compile(t,'V204 Motion')
          RubyVM::InstructionSequence.compile(m,'V204 Save Menu')
          RubyVM::InstructionSequence.compile(sv,'V204 Save')
          RubyVM::InstructionSequence.compile(ld,'V204 Load')
          puts 'V204_ONLY_TARGET_MENU_SAVE_LOAD_SCRIPTS_CHANGED'
          RB
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          root=Path('site/elf/gameasync')
          text=(root/'mapping.js').read_text(encoding='utf-8')
          for name in ('주홍물약','고기','골무','마법망토'):
              icon=root/'Graphics/Icons'/(name+'.png')
              if not icon.is_file() or icon.read_bytes()[:8]!=b'\x89PNG\r\n\x1a\n':
                  raise SystemExit('Missing merchant icon '+name)
              uri='Graphics/Icons/'+name+'.png?h='+hashlib.md5(icon.read_bytes()).hexdigest()
              if uri not in text or text.count('"graphics/icons/'+name.lower()+'"')!=1:
                  raise SystemExit('Incorrect merchant icon mapping '+name)
          scripts=(root/'Data/Scripts.rxdata').read_bytes()
          if 'Data/Scripts.rxdata?h='+hashlib.md5(scripts).hexdigest() not in text:
              raise SystemExit('Stale Scripts mapping')
          print('V204_MERCHANT_ICONS_AND_HASH_VERIFIED')
          PY
          echo V204_STATIC_VALIDATION_PASSED

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
