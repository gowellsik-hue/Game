          camera_y=cy*1024+ty*64-py
          $game_map=Map.new;$game_map.display_x=camera_x*4;$game_map.display_y=camera_y*4
          hero=Sprite.new(nil);hero.bitmap=Bitmap.new('hero');hero.src_rect=Rect.new(60,80)
          hero.x=px+lx*2+10;hero.y=py+ly*2+15;hero.ox=12;hero.oy=16;hero.z=300;hero.opacity=255
          instance=Spriteset_Map.allocate
          instance.instance_variable_set(:@slti_floor,45)
          instance.instance_variable_set(:@slti_wall_chunks,chunks)
          instance.instance_variable_set(:@slti_wall_bitmaps,{})
          instance.instance_variable_set(:@slti_wall_sprites,{})
          instance.instance_variable_set(:@slti_wall_failed,false)
          instance.instance_variable_set(:@character_sprites,[hero])
          vp=Object.new;vp.define_singleton_method(:rect){Rect.new(800,600)}
