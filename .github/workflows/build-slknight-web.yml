name: build-slknight-web.yml | V4.14 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Restore V4.13 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45953980268
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Restore verified V4.14 implementation source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: 554844c39cef42bcc1cc62c30d18759909638c78
          path: verified-414
          sparse-checkout: .github/workflows/build-slknight-web.yml
          sparse-checkout-cone-mode: false

      - name: Prepare corrected V4.14 implementation
        shell: bash
        run: |
          set -euo pipefail

          test -s baseline/artifact.tar

          git -C verified-414 show \
            HEAD:.github/workflows/build-slknight-web.yml \
            > /tmp/sl414-prev.yml

          test "$(git hash-object /tmp/sl414-prev.yml)" = \
            "90192a5661e62ff7267ff0741d20fcfa67fc4257"

          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          import textwrap

          source=Path('/tmp/sl414-prev.yml').read_text('utf8')

          blocks=dict(
              re.findall(
                  r"^          cat > /tmp/(sl414-[^ ]+\.rb) <<'RUBY'\n(.*?)^          RUBY$",
                  source,
                  re.M|re.S
              )
          )

          assert set(blocks)=={
              'sl414-runtime.rb',
              'sl414-patch.rb',
              'sl414-test.rb'
          }

          blocks={
              name:textwrap.dedent(body)
              for name,body in blocks.items()
          }

          python_blocks=re.findall(
              r"^          python3 - <<'PYTHON'\n(.*?)^          PYTHON$",
              source,
              re.M|re.S
          )

          assert len(python_blocks)==2

          baseline=textwrap.dedent(python_blocks[0])
          verify=textwrap.dedent(python_blocks[1])

          def once(s,a,b):
              n=s.count(a)
              assert n==1,(a,n)
              return s.replace(a,b,1)

          def section(s,start,end,replacement):
              assert s.count(start)==1,start
              assert s.count(end)==1,end
              i=s.index(start)
              j=s.index(end,i)
              return s[:i]+replacement+s[j:]

          runtime=blocks['sl414-runtime.rb']

          start=runtime.index('  def self.draw(w)\n')
          end=runtime.index('  class Menu\n',start)

          draw=runtime[start:end]

          draw=once(
              draw,
              '    return unless w.visible\n',
              '    return unless w.visible\n'
              '    w.contents_opacity=255\n'
          )

          draw=once(
              draw,
              '    w.instance_variable_set(\n'
              '      :@sl414_info,info\n'
              '    )\n\n',
              ''
          )

          changes=[
              (
                  '      x=122+i*86\n      y=365\n',
                  '      x=i*86\n      y=0\n'
              ),
              ('x,y,85,98,','x,y,85,93,'),
              ('x+85,y,1,98,','x+85,y,1,93,'),
              ('iy=y+52+(j/3)*23','iy=y+52+(j/3)*20'),
              ('Rect.new(ix,iy,25,23)','Rect.new(ix,iy,25,20)'),
              ('ix-1,iy+12,26,11,','ix-1,iy+9,26,11,'),
              ('ix-2,iy+11,26,11,','ix-2,iy+8,26,11,')
          ]

          for old,new in changes:
              draw=once(draw,old,new)

          ending='  end\n\n'

          assert draw.endswith(ending)

          draw=(
              draw[:-len(ending)]
              +'    w.instance_variable_set(:@sl414_info,info)\n'
              +ending
          )

          revised_runtime=(
              runtime[:start]
              +draw
              +runtime[end:]
          )

          assert revised_runtime[:start]==runtime[:start]

          assert revised_runtime.endswith(runtime[end:])

          patch=blocks['sl414-patch.rb']

          scene_branch=r'''  when 78
              old="    $메세지 = Window_Help2.new\n"

              new=<<~'SRC'.gsub(/^/,'    ')
              $메세지 = Window_Help2.new
              $메세지.x=122
              $메세지.y=475
              $메세지.width=376
              $메세지.height=125
              $메세지.contents.dispose
              $메세지.contents=Bitmap.new(344,93)
              $메세지.ox=0
              $메세지.oy=0
              $메세지.opacity=0
              $메세지.back_opacity=0
              $메세지.contents_opacity=255
              $메세지.z=999999
              SRC

              s=one(s,old,new)

              one(
                s,
                "      sl_native_skill_icons\n      Graphics.update\n",
                "      sl_native_skill_icons\n      SL414.draw($메세지)\n      Graphics.update\n"
              )

          '''

          scene_branch=(
              '  when 78\n'
              +textwrap.indent(
                  textwrap.dedent(
                      scene_branch.split('\n',1)[1]
                  ),
                  '    '
              )
          )

          patch=section(
              patch,
              '  when 78\n',
              '  when 80,81\n',
              scene_branch
          )

          message_branch=r'''  when 100
              one(
                s,
                "  def set_text2(text)\n",
                "  def set_text2(text)\n    return if self.equal?($메세지)\n"
              )

          '''

          message_branch=(
              '  when 100\n'
              +textwrap.indent(
                  textwrap.dedent(
                      message_branch.split('\n',1)[1]
                  ),
                  '    '
              )
          )

          patch=section(
              patch,
              '  when 100\n',
              '  when 127\n',
              message_branch
          )

          assert patch.count('SL414.draw($메세지)')==1

          test=blocks['sl414-test.rb']

          test=once(
              test,
              '  attr_accessor :visible\n',
              '  attr_accessor :visible,:contents_opacity\n'
          )

          test=once(
              test,
              'c[4]==98',
              'c[4]==93'
          )

          test=once(
              test,
              'c[1].x>=208',
              'c[1].x>=86'
          )

          test+=r'''

          class Bitmap < BitmapMock

            attr_reader :width,:height

            def initialize(w,h)
              super()
              @width=w
              @height=h
            end

            def dispose
              @disposed=true
            end

            def disposed?
              @disposed==true
            end

          end

          class Window_Base

            attr_accessor :x,:y,:width,:height
            attr_accessor :contents,:visible,:opacity
            attr_accessor :back_opacity,:contents_opacity
            attr_accessor :ox,:oy,:z

            def initialize(x,y,w,h)
              @x=x
              @y=y
              @width=w
              @height=h
            end

            def disposed?
              false
            end

          end

          scene=read.call(78)

          frame="      sl_native_skill_icons\n"+
                "      SL414.draw($메세지)\n"+
                "      Graphics.update\n"

          assert(
            scene.scan(frame).size==1,
            'Native Scene_Map render loop'
          )

          setup=scene[
            /^    \$메세지 = Window_Help2.new\n.*?(?=^    \$KeyIcon = IconShow.new)/m
          ]

          assert(
            setup,
            'Actual original message window initialization'
          )

          eval(
            read.call(100),
            TOPLEVEL_BINDING,
            'Window_Help2'
          )

          eval(
            setup,
            TOPLEVEL_BINDING,
            'Actual native HUD setup'
          )

          w=$메세지

          assert(
            [
              w.x+16,
              w.y+16,
              w.contents.width,
              w.contents.height
            ]==[138,491,344,93],
            'Exact original central message screen bounds'
          )

          assert(
            w.contents_opacity==255 &&
            w.opacity==0 &&
            w.z==999999,
            'Native HUD contents explicitly visible'
          )

          SL414::IDS.each do |id|
            SL414.designate(4,id)
          end

          $game_temp.message_window_showing=false

          SL414.draw(w)

          assert(
            w.visible,
            'Native message window displays party HUD'
          )

          fills=w.contents.calls.select{
            |q|q[0]==:fill &&
              q[3]==85 &&
              q[4]==93
          }

          assert(
            fills.map{|q|q[1]}==[0,86,172,258],
            'Four equal native HUD columns'
          )

          w.contents.calls.each do |q|

            case q[0]

            when :fill,:text
              x,y,ww,hh=q[1,4]

            when :icon
              r=q[1]
              x,y,ww,hh=r.x,r.y,r.width,r.height

            else
              next

            end

            assert(
              x>=0 &&
              y>=0 &&
              x+ww<=344 &&
              y+hh<=93,
              'Native HUD drawing inside bitmap'
            )

          end

          icons=w.contents.calls.select{
            |q|q[0]==:icon
          }

          assert(
            icons.count{
              |q|q[1].x>=86 && q[1].x<172
            }==6,
            'All six designated items fit inside one companion column'
          )

          assert(
            icons.all?{|q|q[1].x>=86},
            'No designated item icons in hero column'
          )

          old=w.contents.calls.dup

          w.set_text2('Original legacy message')

          assert(
            w.contents.calls==old,
            'Legacy message cannot overwrite party HUD'
          )

          $game_temp.message_window_showing=true

          SL414.draw(w)

          assert(
            !w.visible,
            'Native dialogue is not obstructed'
          )

          $game_temp.message_window_showing=false

          SL414.draw(w)

          assert(
            w.visible,
            'Party HUD returns after dialogue'
          )

          actor=$game_actors[4]

          actor.hp=actor.hp-1

          SL414.draw(w)

          assert(
            w.contents.calls.any?{
              |q|q[0]==:text &&
                q[5]=="HP #{actor.hp}/#{actor.maxhp}"
            },
            'Actual companion HP change refreshes native HUD'
          )

          puts 'PASS corrected native HUD lifecycle'
          '''

          cache_fix=r'''
          mapping_digest=hashlib.sha256(
              mapper.read_bytes()
          ).hexdigest()[:16]

          references=0

          path_pattern=re.compile(
              r"""(["'])([^"'<> \t\r\n]*mapping\.js)(?:\?[^"'<> \t\r\n]*)?\1""",
              re.I
          )

          for name in ('index.html','knight/index.html'):

              p=root/name
              html=p.read_text('utf8')

              def replace_mapping(m):

                  global references

                  raw=m.group(2)

                  if not raw.lower().endswith('mapping.js'):
                      return m.group(0)

                  if raw.startswith(('http:','https:','//')):
                      return m.group(0)

                  target=(p.parent/raw).resolve()

                  if target!=mapper.resolve():
                      return m.group(0)

                  references+=1

                  quote=m.group(1)

                  return (
                      quote
                      +raw
                      +'?v=V4.14&h='
                      +mapping_digest
                      +quote
                  )

              new_html=path_pattern.sub(replace_mapping,html)

              if new_html!=html:
                  p.write_text(new_html,'utf8')

          assert references>=1,'Actual mapping.js load reference not found'

          print(
              'PASS cache-keyed mapping.js references',
              references,
              mapping_digest
          )

          '''

          verify=once(
              verify,
              'after={\n',
              textwrap.dedent(cache_fix)+'after={\n'
          )

          output={
              'sl414-runtime.rb':revised_runtime,
              'sl414-patch.rb':patch,
              'sl414-test.rb':test,
              'sl414-baseline.py':baseline,
              'sl414-verify.py':verify
          }

          for name,body in output.items():

              if name.endswith('.py'):
                  compile(body,name,'exec')

              Path('/tmp',name).write_text(body,'utf8')

          print('PASS exact previous source verified')
          print('PASS original inventory implementation retained')
          print('PASS native HUD coordinates corrected')
          print('PASS legacy message output isolated')
          print('PASS original version retained: V4.14')
          PYTHON

          ruby -c /tmp/sl414-patch.rb
          ruby -c /tmp/sl414-test.rb

      - name: Verify V4.13 baseline
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p site
          tar -xf baseline/artifact.tar -C site

          python3 /tmp/sl414-baseline.py

      - name: Apply designated items and corrected native HUD
        shell: bash
        run: |
          set -euo pipefail

          ruby /tmp/sl414-patch.rb \
            site/knight/gameasync/Data

      - name: Verify original inventory and corrected HUD
        shell: bash
        run: |
          set -euo pipefail

          ruby /tmp/sl414-test.rb \
            site/knight/gameasync/Data/Scripts.rxdata

      - name: Verify exact V4.14 scope and cache mapping
        shell: bash
        run: |
          set -euo pipefail

          python3 /tmp/sl414-verify.py

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Upload V4.14 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
