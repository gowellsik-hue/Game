          setiv(items[2],:consumable,iv(pristine_items[2],:consumable))
          setiv(items[3],:consumable,iv(pristine_items[3],:consumable))
          setiv(items[17],:consumable,iv(pristine_items[17],:consumable))
          setiv(items[37],:consumable,iv(pristine_items[37],:consumable))

          # Structural guards: no potion/courage CE is allowed to reset transformation state or graphics.
          transform_vars=[58,189,263,264,265,309,311,390,627,628,629]
          transform_switches=[54,60,152,154,253,254,255,869,870]
          [3,4,8,10,33,107].each do |id|
            list=iv(current[id],:list)||[]
            list.each do |c|
              code=iv(c,:code)
              par=iv(c,:parameters)||[]
              if code==122 && transform_vars.include?(par[0].to_i)
                abort "CE#{id} resets transform variable #{par[0]}"
              end
              if code==121 && transform_switches.include?(par[0].to_i)
                abort "CE#{id} resets transform switch #{par[0]}"
              end
              if code==209
                route=par[1]
                (iv(route,:list)||[]).each do |mc|
                  abort "CE#{id} changes character graphic" if iv(mc,:code)==41
                end
              elsif code==509
                mc=par[0]
                abort "CE#{id} changes character graphic" if mc&&iv(mc,:code)==41
              end
            end
          end

          abort 'CE6 changed during buff rebuild' unless Marshal.dump(current[6])==Marshal.dump(pristine[6])
          abort 'normal green trigger wrong' unless iv(current[10],:trigger)==2&&iv(current[10],:switch_id)==171
          abort 'courage trigger wrong' unless iv(current[4],:trigger)==2&&iv(current[4],:switch_id)==1002
          abort 'enhanced green trigger wrong' unless iv(current[107],:trigger)==2&&iv(current[107],:switch_id)==368
          abort 'move-speed trigger wrong' unless iv(current[68],:trigger)==2&&iv(current[68],:switch_id)==998

          # Potion timers must never start the old transform-reset movement-speed common event.
          [3,4,8,10,33,107].each do |id|
            bad=(iv(current[id],:list)||[]).any? do |c|
              iv(c,:code)==121 && (iv(c,:parameters)||[])[0].to_i==998 && (iv(c,:parameters)||[])[2].to_i==0
            end
