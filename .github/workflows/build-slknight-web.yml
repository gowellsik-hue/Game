let atkDragAuto=false;
let atkPointer=null;

atk.addEventListener('pointerdown',e=>{
  atkPointer=e.pointerId;
  atkDragAuto=false;
  atk.setPointerCapture(e.pointerId);
  sendKey(67,true);
});

atk.addEventListener('pointermove',e=>{
  if(e.pointerId!==atkPointer)return;

  const r=atk.getBoundingClientRect();
  const outside=
    e.clientX<r.left ||
    e.clientX>r.right ||
    e.clientY<r.top ||
    e.clientY>r.bottom;

  if(outside){
    atkDragAuto=true;
    atk.classList.add('auto-ready');
  }
});

atk.addEventListener('pointerup',e=>{
  sendKey(67,false);

  if(atkDragAuto){
    // Ruby 쪽에 자동공격 ON 신호
  }

  atkDragAuto=false;
  atkPointer=null;
  atk.classList.remove('auto-ready');
});
