            [a,b,c].each{|e|e.update}

            raise 'overlap during approach' unless
              [a,b,c,m,$game_player].map{
                |e|[e.x,e.y]
              }.uniq.size==5

            break if $hits.map{|x|x[4]}.uniq.sort==[4,5,6]

          end

          check(
