name: Deploy SLKnight + SLFairy - Boot Fix + Mobile Rework

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-slknight-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  BASE60_SHA: 75e884598cc5ced1ba9a3f090ee0806367976931
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  FAIRY_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLFairy_Source_v1.zip
  FAIRY_SHA256: 67b88b5fe0cde3c9f2fada889815f9aa7d0fc94b378025529e9950d55151c70e
  FAIRY_7Z_PASSWORD: http://nemo838.tistory.com/
  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake cmake curl ffmpeg freepats git imagemagick \
            libtool make mm-common patch pkg-config python3 rake ruby \
            timidity unzip wget xz-utils fonts-nanum p7zip-full

      - name: Create build id
        run: |
          set -euo pipefail
          echo "BUILD_ID=${GITHUB_RUN_NUMBER}-${GITHUB_SHA::8}" >> "$GITHUB_ENV"

      - name: Checkout proven run 60 workflow
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.BASE60_SHA }}
          path: baseline60

      - name: Checkout mkxp-web
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.MKXP_SRC_REF }}
          path: engine

      - name: Restore exact run 60 dependency cache
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-deps-Linux-emsdk-3.1.37-v2-onig25b
          fail-on-cache-miss: true

      - name: Extract proven run 60 steps
        run: |
          set -euo pipefail
          ruby -ryaml - <<'RB'
          doc = YAML.load_file('baseline60/.github/workflows/build-slknight-web.yml')
          steps = doc.fetch('jobs').fetch('build').fetch('steps')
          wanted = {
            'Patch engine 800x600 50fps' => '/tmp/base60_patch_engine.sh',
            'Build patched mkxp-web engine' => '/tmp/base60_build_engine.sh',
            'Download and install game' => '/tmp/base60_install_knight.sh',
            'Patch game scripts and data' => '/tmp/base60_patch_knight.sh',
            'Convert media' => '/tmp/base60_convert_media.sh',
            'Build async mappings' => '/tmp/base60_mapping.sh',
            'Build Emscripten preload package' => '/tmp/base60_preload.sh',
            'Patch browser save controls audio and layout' => '/tmp/base60_browser.sh'
          }
          wanted.each do |name, path|
            step = steps.find { |s| s['name'] == name }
            abort "BASE60_STEP_MISSING #{name}" unless step && step['run']
            File.write(path, "set -euo pipefail\n" + step['run'] + "\n")
          end
          puts 'BASE60_EXTRACT_OK'
          RB
          for file in /tmp/base60_*.sh; do
            bash -n "$file"
          done

      - name: Patch engine exactly like run 60
        run: |
          bash /tmp/base60_patch_engine.sh

      - name: Build engine with run 60 dependency state
        run: |
          bash /tmp/base60_build_engine.sh
          test -s engine/build/index.html
          test -s engine/build/mkxp.js
          test -s engine/build/mkxp.wasm
          sha256sum engine/build/mkxp.js engine/build/mkxp.wasm

      - name: Build Knight base exactly like run 60
        run: |
          bash /tmp/base60_install_knight.sh
          bash /tmp/base60_patch_knight.sh
          test -s player/gameasync/Data/Scripts.rxdata
          echo KNIGHT_BASE60_OK

      - name: Create common mobile runtime patch
        run: |
          cat > /tmp/mobile_runtime.rb <<'RB'
          # encoding: UTF-8
          require 'zlib'

          root = ARGV.fetch(0)
          mode = ARGV.fetch(1)
          path = File.join(root, 'gameasync', 'Data', 'Scripts.rxdata')
          scripts = Marshal.load(File.binread(path))

          def entry_for(scripts, name)
            scripts.find do |entry|
              entry.is_a?(Array) &&
                entry.length >= 3 &&
                entry[1].to_s == name
            end
          end

          def inflate(entry)
            Zlib::Inflate.inflate(entry[2]).force_encoding(Encoding::UTF_8)
          end

          def deflate(entry, source)
            entry[2] = Zlib::Deflate.deflate(source)
          end

          scripts.reject! do |entry|
            entry.is_a?(Array) &&
              entry.length >= 3 &&
              entry[1].to_s == 'Mobile Diablo Assist'
          end

          map = entry_for(scripts, 'Scene_Map')
          if map
            source = inflate(map)
            unless source.include?('SL_MOBILE_MAP_UNLOCK')
              source.sub!(
                /  def main\r?\n/,
                "  def main\n    $game_switches[49] = false if $game_switches\n    puts('SL_MOBILE_MAP_UNLOCK')\n"
              )
            end
            source.gsub!(
              /\s*if \$game_switches\[49\] == false\r?\n\s*Input\.update\s*\r?\n\s*end\r?\n/,
              "\n     Input.update\n"
            )
            deflate(map, source)
          end

          equip = entry_for(scripts, 'Scene_Equip')
          if equip
            source = inflate(equip)
            source.gsub!('$game_switches[49] = true', '$game_switches[49] = false')
            deflate(equip, source)
          end

          save = entry_for(scripts, 'Scene_Save')
          if save
            source = inflate(save)
            unless source.include?('save_file_async(filename)')
              source.sub!(
                /    write_save_data\(file\)\r?\n    exit/,
                "    write_save_data(file)\n    file.close\n    save_file_async(filename)"
              )
            end
            unless source.include?('SL_MOBILE_SAVE_UNLOCK')
              source.sub!(
                '    save_file_async(filename)',
                "    save_file_async(filename)\n    $game_switches[49] = false if $game_switches\n    puts('SL_MOBILE_SAVE_UNLOCK')"
              )
            end
            source.gsub!('$scene = Scene_Menu.new(4)', '$scene = Scene_Map.new')
            deflate(save, source)
          end

          default_slots = mode == 'knight' ? [114, 3, 17, 2] : [0, 0, 0, 0]

          assist = <<RUBY
          \$sl_attack_target_id = 0
          \$sl_attack_pulse_event_id = 0
          \$sl_attack_cooldown = 0

          class Game_Event
            def sl_mobile_enemy_event?
              event_data = instance_variable_get(:@event)
              page_data = instance_variable_get(:@page)
              erased = instance_variable_get(:@erased)
              return false if event_data == nil || page_data == nil || erased
              name = event_data.instance_variable_get(:@name).to_s
              return false unless name[0,3] == '[ID'
              return false if self.through
              return false unless self.trigger == 2
              true
            end
          end

          class Interpreter
            alias sl_targetlock_original_command_111 command_111
            def command_111
              if \$sl_attack_pulse_event_id.to_i > 0 &&
                 @event_id == \$sl_attack_pulse_event_id &&
                 @parameters[0] == 11 &&
                 @parameters[1] == 13
                \$sl_attack_pulse_event_id = 0
                @branch[@list[@index].indent] = true
                @branch.delete(@list[@index].indent)
                return true
              end
              sl_targetlock_original_command_111
            end
          end

          class Game_System
            def sl_quick_items
              @sl_quick_items = #{default_slots.inspect} if @sl_quick_items == nil
              @sl_quick_items
            end
            def sl_quick_items=(value)
              @sl_quick_items = value
            end
          end

          module SLMobileQuick
            def self.emit_labels
              return if \$game_system == nil
              \$game_system.sl_quick_items.each_with_index do |id, index|
                item = id.to_i > 0 && \$data_items ? \$data_items[id.to_i] : nil
                name = item ? item.name.to_s.gsub('|', '/') : '비어있음'
                puts('SLQS|' + (index + 1).to_s + '|' + name)
              end
            end

            def self.use(slot)
              return if \$game_party == nil || \$game_system == nil
              id = \$game_system.sl_quick_items[slot].to_i
              item = id > 0 && \$data_items ? \$data_items[id] : nil
              unless item && item.is_a?(RPG::Item) && \$game_party.item_number(id) > 0
                \$game_system.se_play(\$data_system.buzzer_se) if \$data_system
                return
              end

              if #{mode.dump} == 'knight' && id == 114
                if \$game_switches[367] == true && \$game_party.item_number(114) >= 1
                  \$game_party.lose_item(114, 1)
                  \$game_temp.common_event_id = 2
                  if \$game_switches[1081] == true && defined?(\$p) && \$p
                    actor = \$game_party.actors[0]
                    \$p.drawPHP(actor.hp, actor.maxhp, actor.sp, actor.maxsp)
                  end
                  \$KeyIcon.ShowIcon if defined?(\$KeyIcon) && \$KeyIcon
                else
                  \$game_system.se_play(\$data_system.buzzer_se)
                end
                return
              end

              unless \$game_party.item_can_use?(id)
                \$game_system.se_play(\$data_system.buzzer_se)
                return
              end

              used = false
              if item.scope >= 3
                if item.scope == 4 || item.scope == 6
                  for actor in \$game_party.actors
                    used |= actor.item_effect(item)
                  end
                else
                  actor = \$game_party.actors[0]
                  used = actor ? actor.item_effect(item) : false
                end
              elsif item.common_event_id > 0
                used = true
              end

              if used
                \$game_system.se_play(item.menu_se)
                \$game_party.lose_item(id, 1) if item.consumable
                \$game_temp.common_event_id = item.common_event_id if item.common_event_id > 0
                \$KeyIcon.ShowIcon if defined?(\$KeyIcon) && \$KeyIcon
              else
                \$game_system.se_play(\$data_system.buzzer_se)
              end
            end
          end

          class Scene_MobileQuick
            def initialize(slot_index = 0)
              @slot_index = slot_index
            end

            def main
              @help_window = Window_Help.new
              @help_window.set_text('빠른슬롯을 선택한 뒤 소지 아이템을 지정하세요.')
              build_slot_window
              @item_window = Window_Item.new
              @item_window.help_window = @help_window
              @item_window.active = false
              @item_window.visible = false
              Graphics.transition
            end

            def build_slot_window
              old_index = @slot_window ? @slot_window.index : @slot_index
              @slot_window.dispose if @slot_window
              names = []
              \$game_system.sl_quick_items.each_with_index do |id, index|
                item = id.to_i > 0 && \$data_items ? \$data_items[id.to_i] : nil
                names << "\#{index + 1}. \#{item ? item.name.to_s : '비어 있음'}"
              end
              @slot_window = Window_Command.new(300, names)
              @slot_window.x = 0
              @slot_window.y = 64
              @slot_window.index = [[old_index, 0].max, 3].min
            end

            def dispose
              Graphics.freeze
              @help_window.dispose if @help_window
              @slot_window.dispose if @slot_window
              @item_window.dispose if @item_window
            end

            def update
              @help_window.update
              @slot_window.update
              @item_window.update

              if @slot_window.active
                if Input.trigger?(Input::B)
                  \$game_system.se_play(\$data_system.cancel_se)
                  \$scene = Scene_Map.new
                  return
                end
                if Input.trigger?(Input::C)
                  \$game_system.se_play(\$data_system.decision_se)
                  @slot_index = @slot_window.index
                  @slot_window.active = false
                  @item_window.visible = true
                  @item_window.active = true
                  @item_window.index = 0
                  return
                end
              else
                if Input.trigger?(Input::B)
                  \$game_system.se_play(\$data_system.cancel_se)
                  @item_window.active = false
                  @item_window.visible = false
                  @slot_window.active = true
                  return
                end
                if Input.trigger?(Input::C)
                  item = @item_window.item
                  unless item && item.is_a?(RPG::Item)
                    \$game_system.se_play(\$data_system.buzzer_se)
                    return
                  end
                  \$game_system.sl_quick_items[@slot_index] = item.id
                  \$game_system.se_play(\$data_system.decision_se)
                  @item_window.active = false
                  @item_window.visible = false
                  build_slot_window
                  @slot_window.active = true
                  SLMobileQuick.emit_labels
                  return
                end
              end
            end
          end

          class Game_Player
            def sl_mobile_front_enemy
              tx = self.x
              ty = self.y
              case self.direction
              when 2
                ty += 1
              when 4
                tx -= 1
              when 6
                tx += 1
              when 8
                ty -= 1
              end
              for event in \$game_map.events.values
                next unless event.sl_mobile_enemy_event?
                return event if event.x == tx && event.y == ty
              end
              nil
            end

            def sl_mobile_target_event
              id = \$sl_attack_target_id.to_i
              return nil if id <= 0
              event = \$game_map.events[id]
              return nil if event == nil
              return nil unless event.sl_mobile_enemy_event?
              distance = (event.x - self.x).abs + (event.y - self.y).abs
              return nil unless distance == 1
              event
            end

            def sl_mobile_clear_target
              if \$sl_attack_target_id.to_i > 0
                \$sl_attack_target_id = 0
                \$sl_attack_pulse_event_id = 0
                puts('SLTARGET|0')
              end
            end

            def sl_mobile_toggle_target
              if sl_mobile_target_event
                sl_mobile_clear_target
                return
              end
              target = sl_mobile_front_enemy
              if target
                \$sl_attack_target_id = target.id
                puts('SLTARGET|' + target.id.to_s)
              else
                sl_mobile_clear_target
              end
            end

            def sl_mobile_attack_tick
              \$sl_attack_cooldown -= 1 if \$sl_attack_cooldown > 0
              target = sl_mobile_target_event
              if target == nil
                sl_mobile_clear_target
                return
              end
              return if moving?
              return if @move_route_forcing
              return if \$game_temp.message_window_showing
              return if \$game_system.map_interpreter.running?
              return if \$sl_attack_cooldown > 0

              dx = target.x - self.x
              dy = target.y - self.y
              if dx > 0
                turn_right
              elsif dx < 0
                turn_left
              elsif dy > 0
                turn_down
              else
                turn_up
              end

              target.turn_toward_player
              \$sl_attack_pulse_event_id = target.id
              \$sl_attack_cooldown = 18
              target.start
            end
          end

          class Scene_Map
            alias sl_mobile_runtime_main main
            def main
              puts('SLBOOT|SCENE_MAP')
              SLMobileQuick.emit_labels
              sl_mobile_runtime_main
            end

            alias sl_mobile_runtime_update update
            def update
              if Input.trigger?(Input::Z)
                \$game_player.sl_mobile_toggle_target
              end
              if Input.trigger?(Input::F5)
                \$scene = Scene_MobileQuick.new
                return
              end
              SLMobileQuick.use(0) if Input.trigger?(Input::F6)
              SLMobileQuick.use(1) if Input.trigger?(Input::F7)
              SLMobileQuick.use(2) if Input.trigger?(Input::F8)
              SLMobileQuick.use(3) if Input.trigger?(Input::F9)
              \$game_player.sl_mobile_attack_tick
              sl_mobile_runtime_update
            end
          end
          RUBY

          main_index = scripts.index do |entry|
            entry.is_a?(Array) &&
              entry.length >= 3 &&
              entry[1].to_s == 'Main'
          end
          abort 'Main script missing' unless main_index

          scripts.insert(
            main_index,
            [99999991, 'Mobile Diablo Assist', Zlib::Deflate.deflate(assist)]
          )

          main = entry_for(scripts, 'Main')
          if main
            source = inflate(main)
            source = "puts('SLBOOT|RUBY_MAIN')\n" + source unless source.include?('SLBOOT|RUBY_MAIN')
            deflate(main, source)
          end

          title = entry_for(scripts, 'Scene_Title')
          if title
            source = inflate(title)
            unless source.include?('SLBOOT|SCENE_TITLE')
              source.sub!(
                /  def main\r?\n/,
                "  def main\n    puts('SLBOOT|SCENE_TITLE')\n"
              )
            end
            deflate(title, source)
          end

          File.binwrite(path, Marshal.dump(scripts))
          puts "MOBILE_RUNTIME_PATCH_OK #{mode}"
          RB
          ruby -c /tmp/mobile_runtime.rb

      - name: Apply new target-lock runtime to Knight
        run: |
          ruby -EUTF-8:UTF-8 /tmp/mobile_runtime.rb player knight

      - name: Finish Knight using proven run 60 conversion
        run: |
          bash /tmp/base60_convert_media.sh
          bash /tmp/base60_mapping.sh
          bash /tmp/base60_preload.sh
          bash /tmp/base60_browser.sh

      - name: Create new mobile UI
        run: |
          cat > /tmp/mobile-ui.js <<'JS'
          (function(){
            "use strict";
            const variant = window.SL_VARIANT || "game";
            const layoutKey = "sl-layout-" + variant;
            const keysDown = new Set();
            const lastTap = {};
            let editMode = false;
            let dragNode = null;
            let dragOffsetX = 0;
            let dragOffsetY = 0;
            let dragMoved = false;
            let joyPointer = null;
            let joyOriginX = 0;
            let joyOriginY = 0;

            function emit(type, code) {
              const e = document.createEventObject ? document.createEventObject() : document.createEvent("Events");
              if (e.initEvent) e.initEvent(type, true, true);
              e.keyCode = code;
              e.which = code;
              e.charCode = 0;
              if (typeof JSEvents !== "undefined" && JSEvents.eventHandlers) {
                for (let i = 0; i < JSEvents.eventHandlers.length; i++) {
                  const h = JSEvents.eventHandlers[i];
                  if ((h.target === Module["canvas"] || h.target === window) && h.eventTypeString === type) {
                    h.handlerFunc(e);
                  }
                }
              } else if (typeof Module !== "undefined" && Module["canvas"]) {
                if (Module["canvas"].dispatchEvent) {
                  Module["canvas"].dispatchEvent(e);
                } else {
                  Module["canvas"].fireEvent("on" + type, e);
                }
              }
            }

            function keyDown(code) {
              if (keysDown.has(code)) return;
              keysDown.add(code);
              emit("keydown", code);
            }

            function keyUp(code) {
              if (!keysDown.has(code)) return;
              keysDown.delete(code);
              emit("keyup", code);
            }

            function tap(code) {
              keyDown(code);
              setTimeout(function(){ keyUp(code); }, 90);
            }

            function releaseDirections() {
              [37, 38, 39, 40].forEach(keyUp);
            }

            function isTouchDevice() {
              return "ontouchstart" in window || navigator.maxTouchPoints > 0;
            }

            function resizeCanvas() {
              const canvas = document.getElementById("canvas");
              if (!canvas) return;
              if (window.innerHeight > window.innerWidth) {
                canvas.style.height = "unset";
                canvas.style.width = "100%";
              } else {
                canvas.style.width = "unset";
                canvas.style.height = "100%";
              }
            }

            function saveLayout() {
              const data = {};
              document.querySelectorAll(".sl-movable").forEach(function(node){
                const rect = node.getBoundingClientRect();
                data[node.id] = {
                  x: rect.left / window.innerWidth,
                  y: rect.top / window.innerHeight,
                  scale: Number(node.dataset.scale || 1)
                };
              });
              localStorage.setItem(layoutKey, JSON.stringify(data));
            }

            function loadLayout() {
              let data = {};
              try {
                data = JSON.parse(localStorage.getItem(layoutKey) || "{}");
              } catch (e) {}
              document.querySelectorAll(".sl-movable").forEach(function(node){
                const item = data[node.id];
                if (!item) return;
                node.style.left = Math.max(0, item.x * window.innerWidth) + "px";
                node.style.top = Math.max(0, item.y * window.innerHeight) + "px";
                node.style.right = "auto";
                node.style.bottom = "auto";
                node.dataset.scale = String(item.scale || 1);
                node.style.transform = "scale(" + (item.scale || 1) + ")";
              });
            }

            function cycleScale(node) {
              const scale = Number(node.dataset.scale || 1);
              const next = scale < 0.9 ? 1 : scale < 1.1 ? 1.2 : 0.82;
              node.dataset.scale = String(next);
              node.style.transform = "scale(" + next + ")";
              saveLayout();
            }

            function setEditMode(enabled) {
              editMode = !!enabled;
              document.body.classList.toggle("sl-editing", editMode);
              const button = document.getElementById("sl-edit");
              if (button) button.textContent = editMode ? "완료" : "배치";
              releaseDirections();
            }

            function bindButton(id, code, tapOnly) {
              const node = document.getElementById(id);
              if (!node) return;

              node.addEventListener("pointerdown", function(e){
                e.preventDefault();
                e.stopPropagation();

                if (editMode) {
                  dragNode = node;
                  dragMoved = false;
                  const rect = node.getBoundingClientRect();
                  dragOffsetX = e.clientX - rect.left;
                  dragOffsetY = e.clientY - rect.top;
                  if (node.setPointerCapture) node.setPointerCapture(e.pointerId);
                  return;
                }

                node.classList.add("active");
                if (tapOnly) {
                  tap(code);
                } else {
                  keyDown(code);
                }
              });

              node.addEventListener("pointermove", function(e){
                if (!editMode || dragNode !== node) return;
                e.preventDefault();
                dragMoved = true;

                const rect = node.getBoundingClientRect();
                let x = e.clientX - dragOffsetX;
                let y = e.clientY - dragOffsetY;

                x = Math.max(0, Math.min(window.innerWidth - rect.width, x));
                y = Math.max(0, Math.min(window.innerHeight - rect.height, y));

                node.style.left = x + "px";
                node.style.top = y + "px";
                node.style.right = "auto";
                node.style.bottom = "auto";
              });

              function release(e) {
                if (e && e.preventDefault) e.preventDefault();
                node.classList.remove("active");

                if (editMode) {
                  if (dragNode === node) {
                    dragNode = null;
                    const now = Date.now();
                    if (!dragMoved && lastTap[id] && now - lastTap[id] < 350) {
                      cycleScale(node);
                      lastTap[id] = 0;
                    } else {
                      lastTap[id] = now;
                    }
                    saveLayout();
                  }
                  return;
                }

                if (!tapOnly) keyUp(code);
              }

              node.addEventListener("pointerup", release);
              node.addEventListener("pointercancel", release);
              node.addEventListener("lostpointercapture", release);
            }

            function initJoystick() {
              const zone = document.getElementById("sl-stick-zone");
              const stick = document.getElementById("sl-joystick");
              const knob = document.getElementById("sl-joy-knob");
              if (!zone || !stick || !knob) return;

              function update(e) {
                let dx = e.clientX - joyOriginX;
                let dy = e.clientY - joyOriginY;
                const max = 48;
                const length = Math.hypot(dx, dy) || 1;
                const scale = Math.min(1, max / length);

                dx *= scale;
                dy *= scale;

                knob.style.transform = "translate(" + dx + "px," + dy + "px)";

                const nx = dx / max;
                const ny = dy / max;
                const next = [];

                if (Math.abs(nx) > 0.24) next.push(nx > 0 ? 39 : 37);
                if (Math.abs(ny) > 0.24) next.push(ny > 0 ? 40 : 38);

                [37, 38, 39, 40].forEach(function(code){
                  if (next.indexOf(code) >= 0) {
                    keyDown(code);
                  } else {
                    keyUp(code);
                  }
                });
              }

              zone.addEventListener("pointerdown", function(e){
                if (editMode) return;
                e.preventDefault();

                joyPointer = e.pointerId;
                joyOriginX = e.clientX;
                joyOriginY = e.clientY;

                stick.style.display = "block";
                stick.style.left = (joyOriginX - 70) + "px";
                stick.style.top = (joyOriginY - 70) + "px";

                if (zone.setPointerCapture) zone.setPointerCapture(e.pointerId);
                update(e);
              });

              zone.addEventListener("pointermove", function(e){
                if (e.pointerId !== joyPointer) return;
                e.preventDefault();
                update(e);
              });

              function end(e) {
                if (joyPointer !== null && e && e.pointerId !== undefined && e.pointerId !== joyPointer) return;
                joyPointer = null;
                releaseDirections();
                knob.style.transform = "translate(0px,0px)";
                stick.style.display = "none";
              }

              zone.addEventListener("pointerup", end);
              zone.addEventListener("pointercancel", end);
              zone.addEventListener("lostpointercapture", end);
            }

            window.slSetQuickLabel = function(slot, label) {
              const node = document.getElementById("sl-q" + String(slot));
              if (!node) return;
              const text = String(label || "").trim();
