
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V247
# BASE: V241 successful run 41293648580
# SOURCE: Original Map016 EV8 + CE179 + CE901, cloned and isolated
# GRAPHICS: Sanctuary SPR2807, verified direction codes 1,3,5,7
# GRAPHICS: 7 banks 0,8,16,24,32,40,48; ALL frames, 28 original GIFs
# KEEP: All maps, actors, NPCs, loot, CE179/901 and Map047
# MAGIC FX: Existing original Animations.rxdata IDs 25,14,15,16
# FX: Reuse original Graphics/Animations PNGs, native Sprite_Character playback
# FX: Four original effects cycle only on Zenith magic branch, player target
# KEEP: no changes to attack damage, drop rates, existing animation assets
# STATUS: Local native source validation; GitHub/real play not yet verified
name: build-slknight-web.yml | V247 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: V247 Download verified successful V241 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41293648580
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V247 Verify immutable V241 source
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build original packages
          tar -xf baseline/artifact.tar -C site
          python3 - <<'CHECK_V241'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert len(files)==5603,('Wrong V241 game inventory',len(files))
          expected='f43507920c57e81ec1d219bae492f5e6191f6471f733d8d471f81e8515f7d167'
          assert files['knight/gameasync/Data/Scripts.rxdata']==expected
          pre='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          assert pre+'Map016.rxdata' in files
          assert pre+'Map025.rxdata' in files
          assert pre+'Map047.rxdata' in files
          assert pre+'Map045.rxdata' not in files
          assert pre+'Map046.rxdata' not in files
          assert 'knight/assets/map-047-v241.pack' in files
          Path('build/before.json').write_text(json.dumps(files,sort_keys=True))
          print('PASS verified immutable V241 inventory',len(files))
          CHECK_V241

      - name: V247 Verify four native magic effects and their mapping
        shell: bash
        run: |
          set -euo pipefail
          cat > build/test-native-fx.rb <<'V247_NATIVE_FX'
          module RPG
            class Animation
              class Frame;end
              class Timing;end
            end
            class AudioFile;end
          end
          class Table
            def self._load(raw)
              o=allocate;o.instance_variable_set(:@raw,raw);o
            end
          end
          class Tone
            def self._load(raw)
              o=allocate;o.instance_variable_set(:@raw,raw);o
            end
          end
          class Color<Tone;end
          root='site/knight/gameasync/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          path=root+'Data/'+pre+'Animations.rxdata'
          data=Marshal.load(File.binread(path))
          mapping=File.read(root+'mapping.js')
          expected={
            25=>['추가타격+15','이펙트마법',10],
            14=>['물의 대정령 마법','물의 대정령 마법',24],
            15=>['불의 대정령 마법','불의 대정령 마법',15],
            16=>['땅의 대정령 마법','땅의 대정령 마법',22]
          }
          expected.each do |id,(label,graphic,frames)|
            item=data.fetch(id)
            name=item.instance_variable_get(:@name).dup.force_encoding('UTF-8').scrub
            art=item.instance_variable_get(:@animation_name).dup.force_encoding('UTF-8').scrub
            count=item.instance_variable_get(:@frames).size
            raise "Wrong FX label #{id}: #{name}" unless name==label
            raise "Wrong FX graphic #{id}: #{art}" unless art==graphic
            raise "Wrong FX frames #{id}: #{count}" unless count==frames
            png=root+'Graphics/Animations/'+art+'.png'
            raise "Original FX PNG missing #{id}" unless File.size?(png)
            key='graphics/animations/'+graphic.downcase
            raise "Native FX mapping missing #{id}" unless mapping.include?(key)
            puts "PASS original native FX #{id}: #{name} / #{frames}F"
          end
          V247_NATIVE_FX
          ruby -c build/test-native-fx.rb
          ruby build/test-native-fx.rb

      - name: V247 Download Sanctuary V34 original source archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p original packages
          gh run download 39386289505 \
            -R "$GITHUB_REPOSITORY" \
            -n audit-sanctuary-monsters-v34-all-source-database \
            -D original
          gh run download 39386289505 \
            -R "$GITHUB_REPOSITORY" \
            -n audit-sanctuary-monsters-v34-all-original-cardinal-gifs \
            -D packages
          test -s original/V34-all-cardinal-gif-manifest.csv
          test "$(find packages -type f -name 'V34-*-cardinal-gifs.zip' | wc -l)" -eq 17
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil
          python3 -c 'import PIL;print("PASS Pillow",PIL.__version__)'

      - name: V247 Create all 28 verified original sprite frames
        shell: bash
        run: |
          set -euo pipefail
          cat > build/graphics.py <<'V247_GRAPHICS'
          import csv,io,hashlib,json,zipfile
          from pathlib import Path
          from PIL import Image

          MANIFEST=Path('original/V34-all-cardinal-gif-manifest.csv')
          PACKAGES=Path('packages')
          OUTPUT=Path('site/knight/gameasync/Graphics/Characters')
          OUTPUT.mkdir(parents=True,exist_ok=True)
          BANKS={0:'Walk',8:'Idle',16:'Attack',24:'AltAttack',32:'Spell',40:'Hit',48:'Death'}
          EXPECTED={0:12,8:11,16:13,24:14,32:14,40:2,48:17}
          # Native RPG Sprite_Character rows: 2 down, 4 left, 6 right, 8 up.
          # Verified Sanctuary GIF direction codes: 5 down, 7 left, 3 right, 1 up.
          ROW_DIRECTIONS=(5,7,3,1)
          with MANIFEST.open(encoding='utf-8-sig',newline='') as f:
              rows=[r for r in csv.DictReader(f)
                    if int(r['actor'])==2807
                    and int(r['bank']) in BANKS
                    and int(r['direction']) in ROW_DIRECTIONS
                    and r['byte_verified']=='True']
          assert len(rows)==28,('Expected 28 distinct original GIF rows',len(rows))
          wanted={}
          for row in rows:
              key=(int(row['bank']),int(row['direction']))
              assert key not in wanted,('Duplicate original bank/direction',key)
              wanted[key]=row
          assert set(wanted)=={(b,d) for b in BANKS for d in ROW_DIRECTIONS}

          # All 17 source ZIPs are kept as verified in V34, no re-rendered replacement.
          archives=sorted(PACKAGES.rglob('V34-*-cardinal-gifs.zip'))
          assert len(archives)==17,('Source V34 archive inventory changed',len(archives))
          by_path={v['gif'].removeprefix('gifs/'):k for k,v in wanted.items()}
          found={}
          for archive in archives:
              with zipfile.ZipFile(archive) as z:
                  for name in z.namelist():
                      key=by_path.get(name)
                      if key is None:
                          continue
                      raw=z.read(name)
                      sha=hashlib.sha256(raw).hexdigest()
                      assert sha==wanted[key]['gif_sha256'],('Original GIF SHA mismatch',name)
                      assert key not in found,('Duplicated GIF across ZIPs',name)
                      found[key]=raw
          assert set(found)==set(wanted),('Incomplete original 28 GIFs',set(wanted)-set(found))

          result={}
          for bank,action in BANKS.items():
              images={}
              for direction in ROW_DIRECTIONS:
                  key=(bank,direction)
                  with Image.open(io.BytesIO(found[key])) as gif:
                      assert gif.n_frames==int(wanted[key]['frames'])
                      assert gif.n_frames==EXPECTED[bank]
                      frames=[]
                      for frame in range(gif.n_frames):
                          gif.seek(frame)
                          frames.append(gif.convert('RGBA').copy())
                      images[direction]=frames

              w=max(frame.width for seq in images.values() for frame in seq)
              h=max(frame.height for seq in images.values() for frame in seq)
              count=EXPECTED[bank]
              sheet=Image.new('RGBA',(w*count,h*4),(0,0,0,0))
              for row,direction in enumerate(ROW_DIRECTIONS):
                  for col,frame in enumerate(images[direction]):
                      x=col*w+(w-frame.width)//2
                      y=row*h+(h-frame.height)
                      sheet.alpha_composite(frame,(x,y))

              path=OUTPUT/('SLZenith'+action+'.png')
              sheet.save(path,optimize=True)
              assert path.stat().st_size>100
              result[action]={'bank':bank,'frames':count,'cell':[w,h],
                              'rows':list(ROW_DIRECTIONS),'file':path.name}
              print('PASS',action,'bank',bank,'native 4 rows',ROW_DIRECTIONS,'full frames',count)

          Path('build/zenith-sheet-layout.json').write_text(json.dumps(result,indent=2))
          assert len(result)==7
          print('PASS 7 native sheets from 28 verified, untrimmed original GIFs')
          V247_GRAPHICS
          python3 build/graphics.py

      - name: V247 Inject isolated native CE179 CE901 combat
        shell: bash
        run: |
          set -euo pipefail
          cat > build/zenith-runtime.rb <<'V247_RUNTIME'
          # SLZenith V247: native hybrid damage, full-frame 4-direction visuals.
          module SLZenith
            MAP_ID=25
            EVENT_ID=__EVENT_ID__
            HP_VAR=7001
            ATTACK_SWITCH=7002
            LEVEL=60
            MAX_HP=5200
            PHYSICAL=[50,100]
            MAGIC=[150,300]
            ACCURACY=9999
            HIT_RANDOM=[15,35]
            ATTACK_WAIT=20
            # Verified native animations, NOT Zenith-exclusive artwork.
            # 25: 추가타격+15; 14: 물; 15: 불; 16: 땅.
            MAGIC_FX_IDS=[25,14,15,16]
            MAGIC_FX_GRAPHICS=['이펙트마법','물의 대정령 마법',
                               '불의 대정령 마법','땅의 대정령 마법']
            EXP=43212
            ADENA=[64800,151200]
            FRAMES={'Walk'=>12,'Idle'=>11,'Attack'=>13,'AltAttack'=>14,
                    'Spell'=>14,'Hit'=>2,'Death'=>17}
            DROPS=[
              [:item,35,30],[:item,34,20],[:item,33,100],
              [:item,37,100],[:armor,169,50],[:item,116,3],
              [:item,32,100],[:item,38,100],[:armor,289,30],
              [:weapon,123,30],[:weapon,18,50],[:item,3,200],
              [:weapon,1,50],[:armor,72,50],[:item,2,250],
              [:armor,303,2],[:item,43,100],[:armor,280,30],
              [:armor,12,50],[:armor,492,3]
            ]

            @paid=false
            @engaged=false
            @magic_fx_index=0

            def self.event
              return nil unless $game_map && $game_map.map_id==MAP_ID
              return nil unless $game_map.events
              $game_map.events[EVENT_ID]
            end

            def self.roll(pair)
              pair[0]+rand(pair[1]-pair[0]+1)
            end

            def self.preload
              return unless defined?(RPG::Cache)
              FRAMES.keys.each do |action|
                RPG::Cache.character('SLZenith'+action,0)
              end
              # All four assets are already in the V241 original game.
              # Load them before Map025 gameplay, not on every spell.
              MAGIC_FX_GRAPHICS.each do |name|
                RPG::Cache.animation(name,0)
              end
            end

            def self.show_hp
              return unless @engaged && $game_variables
              return unless $m && $m.respond_to?(:drawMHP)
              $m.drawMHP('제니스 퀸',$game_variables[HP_VAR].to_i,MAX_HP,2)
            end

            def self.engage
              return if @paid || !event
              first=!@engaged
              @engaged=true
              show_hp if first
            end

            def self.action(name,duration)
              ev=event
              return unless ev
              return if @paid && name!='Death'
              ev.slz_action_start(name,duration)
            end

            def self.attack_start
              engage
              action('Attack',ATTACK_WAIT)
            end

            def self.magic_start
              engage
              # Original SPR2807 bank 32: native casting motion.
              action('Spell',ATTACK_WAIT)
              play_magic_effect
            end

            def self.play_magic_effect
              return unless $game_map && $game_map.map_id==MAP_ID
              return unless $game_player && $data_animations
              return unless $game_player.respond_to?(:animation_id=)
              # CE901 magic branch calls magic_start exactly once.
              # RPG Sprite_Character consumes the target's animation_id
              # and draws the verified original graphic at the target.
              n=@magic_fx_index.to_i%MAGIC_FX_IDS.length
              id=MAGIC_FX_IDS[n]
              return unless $data_animations[id]
              $game_player.animation_id=id
              @magic_fx_index=(n+1)%MAGIC_FX_IDS.length
            end

            def self.hit
              engage
              action('Hit',14)
              show_hp
            end

            def self.reward
              return unless $game_map && $game_map.map_id==MAP_ID
              return unless $game_variables && $game_party
              return if @paid
              return if $game_variables[HP_VAR].to_i<MAX_HP
              @paid=true
              @engaged=true

              gold=roll(ADENA)
              $game_party.gain_gold(gold)
              actor=$game_actors[1] if $game_actors
              actor.exp=actor.exp+EXP if actor
              $game_variables[333]=gold
              $game_variables[1926]=EXP

              DROPS.each do |kind,id,chance|
                next unless rand(1000)<chance
                case kind
                when :item then $game_party.gain_item(id,1)
                when :weapon then $game_party.gain_weapon(id,1)
                when :armor then $game_party.gain_armor(id,1)
                end
              end

              action('Death',42)
              show_hp
            end

            def self.reset(map_id)
              @paid=false
              @engaged=false
              @magic_fx_index=0
              $game_switches[ATTACK_SWITCH]=false if $game_switches
              $game_variables[HP_VAR]=0 if map_id==MAP_ID && $game_variables
            end
          end

          class Game_Event
            alias slz_v247_native_update update

            def slz_action_start(name,duration)
              @slz_action=name
              @slz_action_tick=0
              @slz_action_duration=duration
              @slz_visual_tick=0
              @character_name='SLZenith'+name
            end

            def slz_frame(total)
              tick=@slz_visual_tick.to_i
              if @slz_action=='Death'
                return [tick/2,total-1].min
              elsif @slz_action
                duration=[@slz_action_duration.to_i,1].max
                return [tick*total/duration,total-1].min
              end
              step=(@character_name=='SLZenithWalk' ? 2 : 4)
              (tick/step)%total
            end

            def update
              slz_v247_native_update
              return unless @map_id==SLZenith::MAP_ID && @id==SLZenith::EVENT_ID
              @slz_visual_tick=@slz_visual_tick.to_i+1
              return unless $game_variables
              hp=$game_variables[SLZenith::HP_VAR].to_i

              if hp>=SLZenith::MAX_HP
                unless @slz_action=='Death'
                  slz_action_start('Death',42)
                end
                return
              end

              if !@slz_last_hp.nil? && hp>@slz_last_hp
                SLZenith.hit
              end
              @slz_last_hp=hp

              if @slz_action && @slz_action!='Death'
                @slz_action_tick=@slz_action_tick.to_i+1
                if @slz_action_tick>=@slz_action_duration.to_i
                  @slz_action=nil
                  @slz_visual_tick=0
                end
              end

              if !@slz_action
                name=moving? ? 'SLZenithWalk' : 'SLZenithIdle'
                if @character_name!=name
                  @character_name=name
                  @slz_visual_tick=0
                end
              end
            end
          end

          class Sprite_Character
            alias slz_v247_native_update update
            def update
              slz_v247_native_update
              return unless @character && $game_map && $game_map.map_id==SLZenith::MAP_ID
              return unless @character.is_a?(Game_Event)
              return unless @character.instance_variable_get(:@id)==SLZenith::EVENT_ID
              return unless @tile_id==0 && bitmap
              name=@character.character_name.to_s
              return unless name.start_with?('SLZenith')
              action=name.sub('SLZenith','')
              total=SLZenith::FRAMES[action]
              return unless total
              raise 'Zenith sprite width mismatch' unless bitmap.width%total==0
              raise 'Zenith sprite height mismatch' unless bitmap.height%4==0
              @cw=bitmap.width/total
              @ch=bitmap.height/4
              row=(@character.direction-2)/2
              return unless row.between?(0,3)
              frame=@character.slz_frame(total)
              self.src_rect.set(frame*@cw,row*@ch,@cw,@ch)
              self.ox=@cw/2
              self.oy=@ch
              self.z=@character.screen_z(@ch)
            end
          end

          class Game_Map
            alias slz_v247_native_setup setup
            def setup(map_id)
              SLZenith.reset(map_id)
              slz_v247_native_setup(map_id)
              SLZenith.preload if map_id==SLZenith::MAP_ID
            end
          end
          V247_RUNTIME
          cat > build/zenith.rb <<'V247_PATCH'
          require 'zlib'
          require 'digest'
          require 'json'
          module RPG
            class Map;end; class MapInfo;end; class AudioFile;end; class CommonEvent;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end; class MoveRoute;end; class MoveCommand;end
          end
          class Table
            def self._load(raw); obj=allocate;obj.instance_variable_set(:@raw,raw);obj;end
            def _dump(level=0);@raw;end
          end
          class Tone
            def self._load(raw); obj=allocate;obj.instance_variable_set(:@raw,raw);obj;end
            def _dump(level=0);@raw;end
          end
          class Color<Tone;end

          def iv(obj,key);obj.instance_variable_get('@'+key.to_s);end
          def put(obj,key,value);obj.instance_variable_set('@'+key.to_s,value);end
          def cmd(code,params=[],indent=0)
            obj=RPG::EventCommand.allocate
            put(obj,:code,code)
            put(obj,:indent,indent)
            put(obj,:parameters,params)
            obj
          end
          ROOT='site/knight/gameasync/Data/'
          PRE='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          MAP16=ROOT+PRE+'Map016.rxdata'
          MAP25=ROOT+PRE+'Map025.rxdata'
          COMMON=ROOT+PRE+'CommonEvents.rxdata'
          SCRIPTS=ROOT+'Scripts.rxdata'
          HP_VAR=7001
          ATTACK_SW=7002
          OLD_HP=1980
          OLD_ATTACK_SW=133
          MAGIC_SW=135
          MAX_HP=5200

          source_map=Marshal.load(File.binread(MAP16))
          map=Marshal.load(File.binread(MAP25))
          common=Marshal.load(File.binread(COMMON))
          scripts=Marshal.load(File.binread(SCRIPTS))
          source=iv(source_map,:events).fetch(8)
          source_name=iv(source,:name).to_s.dup.force_encoding('UTF-8').scrub
          raise "Wrong source actor: #{source_name}" unless source_name.include?('데스나이트')
          raise 'Invalid common event table' unless common.is_a?(Array) && common[179] && common[901]
          raise 'Wrong engine scripts' unless scripts.is_a?(Array) && scripts.size==137
          raise 'Existing Zenith injection' if scripts.any?{|row|row.is_a?(Array) && row[1].to_s.start_with?('SLZenithV')}
          old_ce179=Marshal.dump(common[179]);old_ce901=Marshal.dump(common[901]);old_map16=Marshal.dump(source_map)
          originals=iv(map,:events).transform_values{|e| Marshal.dump(e)}

          # Clone CE901 from the original hybrid damage command graph.
          attack=Marshal.load(old_ce901)
          attack_id=common.size
          put(attack,:id,attack_id)
          put(attack,:name,'[공격]제니스 퀸')
          physical_low=physical_high=magic_low=magic_high=magic_action=0
          native_damage=0
          iv(attack,:list).each do |c|
            code=iv(c,:code);p=iv(c,:parameters)
            next unless p.is_a?(Array)
            if code==122 && p[0]==26 && p[1]==26 && p[2]==0 && p[3]==0
              case p[4]
              when 35; p[4]=50; physical_low+=1
              when 70; p[4]=100; physical_high+=1
              when 150; magic_low+=1
              when 300; magic_high+=1
              end
            elsif code==121 && p==[MAGIC_SW,MAGIC_SW,0]
              put(c,:code,355)
              put(c,:parameters,['SLZenith.magic_start'])
              magic_action+=1
            elsif code==250
              f=p[0]
              s=iv(f,:name).to_s.dup.force_encoding('UTF-8').scrub rescue ''
              if s.include?('데스나이트')
                put(c,:code,355)
                put(c,:parameters,['nil'])
              end
            end
            native_damage+=1 if code==311
          end
          raise 'Incomplete native physical branches' unless [physical_low,physical_high]==[1,1]
          raise 'Incomplete native magic branches' unless [magic_low,magic_high]==[1,1]
          raise 'No native magic animation hook' unless magic_action==1
          raise 'Missing original RPG event damage' unless native_damage>=2
          common << attack

          # Clone source CE179 attack cycle, preserving native 5-frame startup.
          cycle=Marshal.load(old_ce179)
          cycle_id=common.size
          put(cycle,:id,cycle_id)
          put(cycle,:name,'[공격주기]제니스 퀸')
          put(cycle,:trigger,2)
          put(cycle,:switch_id,ATTACK_SW)
          cycle_entries=iv(cycle,:list)
          raise 'Unexpected CE179 length' unless cycle_entries.size==6
          expected=[355,106,117,106,121,0]
          actual=cycle_entries.map{|c|iv(c,:code)}
          raise "Unexpected CE179 native path #{actual.inspect}" unless actual==expected
          put(cycle_entries[0],:parameters,['SLZenith.attack_start'])
          raise 'Native startup changed' unless iv(cycle_entries[1],:parameters)==[5]
          raise 'Wrong source combat call' unless iv(cycle_entries[2],:parameters)==[901]
          put(cycle_entries[2],:parameters,[attack_id])
          raise 'Wrong source recovery' unless iv(cycle_entries[3],:parameters)==[7]
          put(cycle_entries[3],:parameters,[15])
          raise 'Wrong source attack switch' unless iv(cycle_entries[4],:parameters)==[133,133,1]
          put(cycle_entries[4],:parameters,[ATTACK_SW,ATTACK_SW,1])
          common << cycle

          # Use the original boss movement/hit graph; only clone pages 1 and 2.
          source_pages=iv(source,:pages)
          raise 'Native boss layout changed' unless source_pages.size==5
          active=Marshal.load(Marshal.dump(source_pages[1]))
          death=Marshal.load(Marshal.dump(source_pages[2]))
          raise 'Wrong active native trigger' unless iv(active,:trigger)==2
          raise 'Wrong death native condition' unless iv(iv(death,:condition),:variable_id)==OLD_HP && iv(iv(death,:condition),:variable_value)==4000

          original_events=iv(map,:events)
          ref=original_events.fetch(11)
          occupied=original_events.values.map{|ev|[iv(ev,:x),iv(ev,:y)]}
          width=iv(map,:width);height=iv(map,:height)
          sx=iv(ref,:x);sy=iv(ref,:y)
          spawn=nil
          (1..10).each do |radius|
            break if spawn
            (-radius..radius).each do |dy|
              break if spawn
              (-radius..radius).each do |dx|
                xx=sx+dx;yy=sy+dy
                next unless [dx.abs,dy.abs].max==radius
                next unless xx>=2 && yy>=2 && xx<width-2 && yy<height-2
                next if occupied.include?([xx,yy])
                spawn=[xx,yy]
                break
              end
            end
          end
          raise 'No available target spawn' unless spawn

          boss=Marshal.load(Marshal.dump(source))
          boss_id=original_events.keys.max+1
          put(boss,:id,boss_id)
          put(boss,:name,'제니스 퀸')
          put(boss,:x,spawn[0]);put(boss,:y,spawn[1])
          put(boss,:pages,[active,death])

          cond=iv(active,:condition)
          put(cond,:switch1_valid,false)
          put(cond,:switch2_valid,false)
          put(cond,:variable_valid,false)
          put(cond,:self_switch_valid,false)
          put(iv(active,:graphic),:character_name,'SLZenithIdle')
          put(active,:move_speed,3)
          put(active,:move_frequency,6)

          attack_regs=attack_switches=hp_writes=bar_hooks=0
          iv(active,:list).each do |c|
            code=iv(c,:code);p=iv(c,:parameters)
            next unless p.is_a?(Array)
            case code
            when 355,655
              next unless p[0].is_a?(String)
              text=p[0].dup
              if text.include?('drawMHP')
                put(c,:parameters,['SLZenith.engage'])
                bar_hooks+=1
              elsif text.include?('SLMonsterAttackContext.register')
                # Original context pairs belong only to Death Knight.
                # The isolated CE cycle does not use context queues.
                put(c,:parameters,['nil'])
                attack_regs+=1
              elsif text.include?("$game_variables[#{OLD_HP}]")
                put(c,:parameters,[text.gsub("$game_variables[#{OLD_HP}]","$game_variables[#{HP_VAR}]")])
              end
            when 121
              if p==[OLD_ATTACK_SW,OLD_ATTACK_SW,0]
                put(c,:parameters,[ATTACK_SW,ATTACK_SW,0]);attack_switches+=1
              end
            when 122
              if p[0]==OLD_HP && p[1]==OLD_HP
                p[0]=HP_VAR;p[1]=HP_VAR;hp_writes+=1
              end
              if p[3]==1 && p[4]==OLD_HP
                p[4]=HP_VAR
              end
            when 111
              p[1]=HP_VAR if p[0]==1 && p[1]==OLD_HP
            end
          end
          puts "COUNTS switches=#{attack_switches} registers=#{attack_regs} hp_writes=#{hp_writes} bar=#{bar_hooks}"
          raise 'Missing native attack routes' unless attack_switches>=4 && attack_regs==attack_switches
          raise 'No native damage receiver' unless hp_writes>=12
          raise 'HP display not isolated' unless bar_hooks==1

          # New death page: independent payout, native event erase.
          cond=iv(death,:condition)
          put(cond,:variable_valid,true)
          put(cond,:variable_id,HP_VAR)
          put(cond,:variable_value,MAX_HP)
          put(cond,:switch1_valid,false)
          put(cond,:switch2_valid,false)
          put(cond,:self_switch_valid,false)
          put(iv(death,:graphic),:character_name,'SLZenithDeath')
          put(death,:trigger,4)
          put(death,:list,[
            cmd(355,['SLZenith.reward']),
            cmd(106,[42]),
            cmd(116,[]),
            cmd(0,[])
          ])

          original_events.each do |id,ev|
            raise "Original Map025 event modified #{id}" unless Marshal.dump(ev)==originals[id]
          end
          raise 'Original Death Knight map modified' unless Marshal.dump(source_map)==old_map16
          raise 'Original CE179 changed' unless Marshal.dump(common[179])==old_ce179
          raise 'Original CE901 changed' unless Marshal.dump(common[901])==old_ce901

          original_events[boss_id]=boss
          File.binwrite(MAP25,Marshal.dump(map))
          File.binwrite(COMMON,Marshal.dump(common))

          runtime=File.read('build/zenith-runtime.rb').sub('__EVENT_ID__',boss_id.to_s)
          raise 'Missing embedded event ID' if runtime.include?('__EVENT_ID__')
          main_index=scripts.index{|r|r.is_a?(Array) && r[1]=='Main'}
          raise 'Missing main script' unless main_index
          scripts.insert(main_index,[99824701,'SLZenithV247',Zlib::Deflate.deflate(runtime,9)])
          File.binwrite(SCRIPTS,Marshal.dump(scripts))
          File.write('build/zenith-runtime.rb',runtime)
          File.write('build/zenith-report.json',JSON.pretty_generate({
            version:'V247',source:'Map016 EV8 / CE179 / CE901',target:'Map025',
            event_id:boss_id,spawn:spawn,attack_ce:attack_id,attack_cycle_ce:cycle_id,
            attack_switch:ATTACK_SW,hp_variable:HP_VAR,max_hp:MAX_HP,
            native_attack_paths:attack_switches,hit_writes:hp_writes,
            graphics:'SPR2807 7 banks x 4 cardinal directions',
            native_frame_counts:[12,11,13,14,14,2,17]
          }))
          puts File.read('build/zenith-report.json')
          puts 'PASS original map, CE179 and CE901 unchanged'
          V247_PATCH
          ruby -c build/zenith-runtime.rb
          ruby -c build/zenith.rb
          ruby build/zenith.rb
          ruby -c build/zenith-runtime.rb

      - name: V247 Verify native attack and hit event graph
        shell: bash
        run: |
          set -euo pipefail
          cat > build/test-native.rb <<'V247_NATIVE_TEST'
          require 'json';require 'zlib'
          module RPG
            class Map;end;class MapInfo;end;class AudioFile;end;class CommonEvent;end
            class Event;class Page;class Condition;end;class Graphic;end;end;end
            class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          class Table
            def self._load(x);o=allocate;o.instance_variable_set(:@raw,x);o;end
            def _dump(level=0);@raw;end
          end
          class Tone
            def self._load(x);o=allocate;o.instance_variable_set(:@raw,x);o;end
            def _dump(level=0);@raw;end
          end
          class Color<Tone;end
          def iv(o,k);o.instance_variable_get('@'+k.to_s);end
          root='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          original_map=Marshal.load(File.binread(root+pre+'Map016.rxdata'))
          map=Marshal.load(File.binread(root+pre+'Map025.rxdata'))
          common=Marshal.load(File.binread(root+pre+'CommonEvents.rxdata'))
          scripts=Marshal.load(File.binread(root+'Scripts.rxdata'))
          source=iv(original_map,:events).fetch(8)
          raise unless iv(source,:name).dup.force_encoding('UTF-8').scrub.include?('데스나이트')
          assert=lambda{|a,b|raise b unless a}
          assert.call(iv(map,:events).size==19,'Wrong boss map inventory')
          boss=iv(map,:events).fetch(29)
          assert.call(iv(boss,:pages).size==2,'Not isolated from colosseum wave gates')
          active,death=iv(boss,:pages)
          assert.call(!iv(iv(active,:condition),:switch1_valid),'Old wave gate remains')
          assert.call(iv(iv(death,:condition),:variable_id)==7001,'Wrong HP variable')
          assert.call(iv(iv(death,:condition),:variable_value)==5200,'Wrong HP threshold')
          assert.call(iv(death,:trigger)==4,'Death parallel event missing')
          assert.call(iv(death,:list).map{|c|iv(c,:code)}==[355,106,116,0],'Death payout/erase wrong')
          cycle=common.fetch(1062);damage=common.fetch(1061)
          assert.call(iv(cycle,:trigger)==2 && iv(cycle,:switch_id)==7002,'Independent attack cycle missing')
          assert.call(iv(cycle,:list).map{|c|iv(c,:code)}==[355,106,117,106,121,0],'Attack source cycle differs')
          assert.call(iv(cycle,:list).map{|c|iv(c,:parameters)}[1..4]==[[5],[1061],[15],[7002,7002,1]],'Original attack wait missing')
          p=iv(damage,:list)
          values=p.select{|c|iv(c,:code)==122}.map{|c|iv(c,:parameters)}
          [50,100,150,300].each{|v|assert.call(values.any?{|a|a[0]==26 && a[4]==v},"Missing physical/magic #{v}")}
          assert.call(p.count{|c|iv(c,:code)==311}>=2,'Native HP damage missing')
          assert.call(p.any?{|c|iv(c,:code)==117 && iv(c,:parameters)==[57]},'Native MDEF route missing')
          assert.call(p.any?{|c|iv(c,:code)==355 && iv(c,:parameters)==['SLZenith.magic_start']},'Magic motion hook missing')
          assert.call(p.none?{|c|iv(c,:code)==121 && iv(c,:parameters)[0]==135},'Old DK magic switch leaked')
          assert.call(iv(active,:list).count{|c|iv(c,:code)==121 && iv(c,:parameters)==[7002,7002,0]}==17,'Native attack directions/branches missing')
          assert.call(iv(active,:list).count{|c|iv(c,:code)==122 && iv(c,:parameters)[0]==7001}==20,'Independent HP hit missing')
          injected=scripts.find{|r|r.is_a?(Array) && r[1]=='SLZenithV247'}
          assert.call(!!injected,'Runtime script missing')
          runtime=Zlib::Inflate.inflate(injected[2]);raise unless runtime.include?('class Sprite_Character')
          assert.call(runtime.include?("'Death'=>17"),'Death frame count changed')
          assert.call(runtime.scan(/\[:(?:item|weapon|armor),/).length==20,'Drop table damaged')
          puts 'PASS native CE179/CE901 preserved, independent CE1062/1061 routed'
          puts 'PASS source hit check, native physical/MDEF, 20 hit writes, 17 attack paths'
          puts 'PASS isolated HP, death, reward, native runtime actor sprite'
          V247_NATIVE_TEST
          ruby -c build/test-native.rb
          ruby build/test-native.rb

      - name: V247 Smoke-test actor 4 directions reward and reset
        shell: bash
        run: |
          set -euo pipefail
          cat > build/test-runtime.rb <<'V247_RUNTIME_TEST'
          class Game_Event
            attr_accessor :character_name,:direction
            def update;end
            def moving?;false;end
            def screen_z(x);500;end
          end
          class Game_Map
            attr_accessor :map_id,:events
            def setup(id);@map_id=id;end
          end
          class Sprite_Character
            attr_accessor :ox,:oy,:z,:src_rect
            def initialize(e,bitmap)
              @character=e;@tile_id=0;@bitmap=bitmap
              @src_rect=Struct.new(:x,:y,:width,:height) {def set(x,y,w,h);self.x=x;self.y=y;self.width=w;self.height=h;end}.new
            end
            def bitmap;@bitmap;end
            def update;end
          end
          class DummyParty
           attr_reader :gold,:dropped
           def initialize;@gold=0;@dropped=[];end
           def gain_gold(n);@gold+=n;end
           def gain_item(id,n);@dropped<<[:item,id,n];end
           def gain_weapon(id,n);@dropped<<[:weapon,id,n];end
           def gain_armor(id,n);@dropped<<[:armor,id,n];end
          end
          class DummyActor;attr_accessor :exp;def initialize;@exp=0;end;end
          $game_map=Game_Map.new
          $game_map.map_id=25
          boss=Game_Event.new
          boss.instance_variable_set(:@id,29)
          boss.instance_variable_set(:@map_id,25)
          boss.direction=2
          boss.character_name='SLZenithIdle'
          $game_map.events={29=>boss}
          $game_variables=Hash.new(0)
          $game_switches=Hash.new(false)
          $game_party=DummyParty.new
          $game_actors={1=>DummyActor.new}
          # Game_Player has native animation_id accessor in original RGSS.
          $game_player=Struct.new(:animation_id).new(0)
          $data_animations=Array.new(26)
          [25,14,15,16].each{|id|$data_animations[id]=Object.new}
          $m=nil
          load 'build/zenith-runtime.rb'
          raise 'Wrong new sprite ID' unless SLZenith::EVENT_ID==29
          raise 'Wrong motion count' unless SLZenith::FRAMES.size==7
          SLZenith.attack_start
          raise 'Attack animation failed' unless boss.character_name=='SLZenithAttack'
          [25,14,15,16,25].each do |id|
            $game_player.animation_id=0
            SLZenith.magic_start
            raise 'Magic animation failed' unless boss.character_name=='SLZenithSpell'
            raise "Wrong native magic FX ID #{id}" unless $game_player.animation_id==id
          end
          SLZenith.hit
          raise 'Hit animation failed' unless boss.character_name=='SLZenithHit'
          [:physical,:magic].each do |type|
            raise 'Wrong pair' unless SLZenith.const_get(type==:physical ? 'PHYSICAL' : 'MAGIC').size==2
          end
          $game_variables[7001]=5200
          SLZenith.reward
          raise 'Death animation failed' unless boss.character_name=='SLZenithDeath'
          raise 'Reward amount wrong' unless (64800..151200).include?($game_party.gold)
          raise 'Reward EXP wrong' unless $game_actors[1].exp==43212
          old=$game_party.gold
          SLZenith.reward
          raise 'Reward duplicated' unless $game_party.gold==old
          SLZenith.reset(27)
          raise 'Switch retained across maps' unless $game_switches[7002]==false
          raise 'HP should only reset on target map' unless $game_variables[7001]==5200
          SLZenith.reset(25)
          raise 'HP not reset on entry' unless $game_variables[7001]==0
          $game_player.animation_id=0
          SLZenith.magic_start
          raise 'Magic effect rotation reset failed' unless $game_player.animation_id==25
          bmp=Struct.new(:width,:height).new(12*144,4*120)
          boss.character_name='SLZenithWalk'
          sprite=Sprite_Character.new(boss,bmp)
          for direction in [2,4,6,8]
            boss.direction=direction
            sprite.update
            raise 'Wrong sprite row' unless sprite.src_rect.y == ((direction-2)/2)*120
            raise 'Wrong sprite width' unless sprite.src_rect.width==144
          end
          puts 'PASS real native-sized 4-direction row mapping on Sprite_Character'
          puts 'PASS native boss action, all four original FX IDs, HP reset and rewards'
          V247_RUNTIME_TEST
          ruby -c build/test-runtime.rb
          ruby build/test-runtime.rb

      - name: V247 Refresh graphic and native RXData mappings
        shell: bash
        run: |
          set -euo pipefail
          cat > build/mapping.py <<'V247_MAPPING'
          from pathlib import Path
          import hashlib,re
          root=Path('site')
          mapping=root/'knight/gameasync/mapping.js'
          s=mapping.read_text('utf-8')
          anchor='];\n\nvar mapping = {}'
          assert s.count(anchor)==1,('Unique native mapping anchor missing',s.count(anchor))
          motions=('Walk','Idle','Attack','AltAttack','Spell','Hit','Death')
          entries=[]
          for motion in motions:
              name='SLZenith'+motion
              path=root/'knight/gameasync/Graphics/Characters'/f'{name}.png'
              assert path.is_file(),f'Missing original motion {motion}'
              digest=hashlib.md5(path.read_bytes()).hexdigest()
              entries.append(f'["graphics/characters/{name.lower()}", "Graphics/Characters/{name}.png?h={digest}"],')
          s=s.replace(anchor,'\n'+'\n'.join(entries)+'\n'+anchor)
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          data=root/'knight/gameasync/Data'
          for path in (data/(pre+'Map025.rxdata'),data/'Scripts.rxdata',data/(pre+'CommonEvents.rxdata')):
              key='Data/'+path.name
              digest=hashlib.md5(path.read_bytes()).hexdigest()
              pattern='('+re.escape(key)+r'\?h=)[0-9a-f]{32}'
              s,count=re.subn(pattern,lambda m:m.group(1)+digest,s)
              assert count==1,('Original data mapping missing or duplicated',key,count)
          mapping.write_text(s,'utf-8')
          loader=root/'knight/js/sl-assets-v229r115.js'
          script=loader.read_text('utf-8')
          old="var version='V241';"
          assert script.count(old)==1,('Original loader version anchor changed',script.count(old))
          loader.write_text(script.replace(old,"var version='V247';"),'utf-8')
          for relative in ('index.html','knight/index.html'):
              path=root/relative
              html=path.read_text('utf-8')
              assert 'V241' in html,('Baseline version not found',relative)
              html=html.replace('V241','V247').replace('?v=v241','?v=v247')
              path.write_text(html,'utf-8')
          print('PASS 7 full-frame sprites + 3 native RXData paths + V247 cache labels')
          V247_MAPPING
          python3 build/mapping.py
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: V247 Verify original game resources preserved
        shell: bash
        run: |
          set -euo pipefail
          cat > build/verify.py <<'V247_INVENTORY'
          from pathlib import Path
          import hashlib,json,struct
          from PIL import Image
          root=Path('site')
          before=json.loads(Path('build/before.json').read_text())
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          pre='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          allowed={pre+'Map025.rxdata',pre+'CommonEvents.rxdata','knight/gameasync/Data/Scripts.rxdata','knight/gameasync/mapping.js','knight/js/sl-assets-v229r115.js','index.html','knight/index.html'}
          added={'knight/gameasync/Graphics/Characters/SLZenith'+m+'.png' for m in ('Walk','Idle','Attack','AltAttack','Spell','Hit','Death')}
          changed={p for p in before if before[p]!=after.get(p)}
          assert changed==allowed,('Changed path whitelist mismatch',sorted(changed^allowed))
          assert (set(after)-set(before))==added,('Unexpected new files',sorted((set(after)-set(before))^added))
          assert not(set(before)-set(after)),('Deleted original files',sorted(set(before)-set(after)))
          assert len(before)==5603,len(before)
          assert len(after)==5610,len(after)
          for mid in (45,46):assert pre+f'Map{mid:03d}.rxdata' not in after
          for key in (pre+'Map016.rxdata','knight/assets/map-047-v241.pack'):
           assert after[key]==before[key],('Protected source modified',key)
          frames={'Walk':12,'Idle':11,'Attack':13,'AltAttack':14,'Spell':14,'Hit':2,'Death':17}
          for name,n in frames.items():
           p=root/f'knight/gameasync/Graphics/Characters/SLZenith{name}.png'
           with Image.open(p) as im:
            im.verify()
           with Image.open(p) as im:
            assert im.width%n==0 and im.height%4==0,(name,im.size,n)
          print('PASS source inventory',len(before),'->',len(after))
          print('PASS all 7 complete original banks / native 4 cardinal rows')
          for art in ('이펙트마법','물의 대정령 마법','불의 대정령 마법','땅의 대정령 마법'):
           key='knight/gameasync/Graphics/Animations/'+art+'.png'
           assert after[key]==before[key],('Original animation graphic changed',art)
          print('PASS original FX graphics, Map016, Map047, all NPCs unchanged')

          # Map sprite event, CE graph, death and variable isolation.
          report=json.loads(Path('build/zenith-report.json').read_text('utf-8'))
          assert report['event_id']==29
          assert report['attack_ce']==1061
          assert report['attack_cycle_ce']==1062
          assert report['native_attack_paths']==17
          assert report['hit_writes']==20
          assert report['spawn']==[102,90]
          print('PASS Map025 boss EV29 and 17 native attack paths, 20 damage receivers')
          V247_INVENTORY
          python3 build/verify.py

      - name: V247 Publish original game with Zenith Queen
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

