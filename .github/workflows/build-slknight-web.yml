          ! test -e fairy_player/gameasync/Game.rgssad
          grep -Fq 'slfairy_v143z10_1_engine' fairy_player/index.html
          grep -Fq 'SLFairy V14.3z10.1' fairy_player/index.html
          grep -Fq 'v143z10_1elf' fairy_player/index.html
          ! grep -Fq 'slAttackSheets' fairy_player/index.html
          ! grep -Fq 'slAttackCoords' fairy_player/index.html
          grep -Fq "hotButton(hot,0,'A',117)" fairy_player/js/dpad.js
          grep -Fq "hotButton(hot,1,'S',118)" fairy_player/js/dpad.js
          grep -Fq "hotButton(hot,2,'D',119)" fairy_player/js/dpad.js
          grep -Fq "hotButton(hot,3,'Q',120)" fairy_player/js/dpad.js
          grep -Fq "hotButton(hot,4,'F',116)" fairy_player/js/dpad.js
          ! grep -Fq "hotButton(hot,4,'Z',117)" fairy_player/js/dpad.js
          node --check fairy_player/js/dpad.js
          node --check fairy_player/js/drive.js
          ruby -EUTF-8:UTF-8 -rzlib - fairy_player/gameasync/Data/Scripts.rxdata <<'RB'
          a=Marshal.load(File.binread(ARGV[0]))
          entries=a.select{|e|e.is_a?(Array)&&e.length>=3}
          names=entries.map{|e|e[1].to_s}
          abort 'Fairy Web Compatibility missing' unless names.include?('Web Compatibility')
          abort 'Fairy mobile assist missing' unless names.include?('Mobile Diablo Assist')
          abort 'Fairy web resolution missing' unless names.include?('Web Resolution 800x600')
          compat=entries.find{|e|e[1].to_s=='Web Compatibility'}
          mobile=entries.find{|e|e[1].to_s=='Mobile Diablo Assist'}
          c=Zlib::Inflate.inflate(compat[2]).force_encoding(Encoding::UTF_8)
          m=Zlib::Inflate.inflate(mobile[2]).force_encoding(Encoding::UTF_8)
          ['when 116 then Input::F5','when 117 then Input::F6','when 118 then Input::F7','when 119 then Input::F8','when 120 then Input::F9'].each{|x|abort "Fairy key bridge missing #{x}" unless c.include?(x)}
          abort 'Fairy current hotbar state protocol missing' unless m.include?('SLHOT|STATE|')
          abort 'Fairy current hotbar mode protocol missing' unless m.include?('SLHOT|MODE|use')
          puts 'FAIRY_SCRIPT_VERIFY_OK'
          RB
          echo FAIRY_FILES=$(find fairy_player/gameasync -type f | wc -l)
          du -sh fairy_player

      - name: Build Knight + Fairy class launcher
        run: |
