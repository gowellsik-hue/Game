
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R49
# BASE: successful deployed V229R48 run 39717031708, not broken R44/R46 graphics.
# Original R48 separated Sanctuary FLOOR and WALL PNGs remain byte-identical.
# FIX: all 105 regular monsters can switch from idle to attack on first sight.
# FIX: remove 89 unused switch23 page conditions, 16 stale zombie variable guards,
# and route 16 zombie combat checks to their independent recognition switches.
# FIX: wall is a foreground layer over character AND monster, wall-only fade on overlap.
# FIX: regular monsters cannot bypass native wall collision even when through mode toggles.
# Preserve all 106 spawn XY, 1 Baphomet, all map art/audio/stairs/mobile controls.
# No game2, no new textures, no unrelated game data or workflow changes.
name: build-slknight-web.yml | V229R49 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R49 Restore successful R48 separated-floor-and-wall game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39717031708
          name: github-pages
          github-token: ${{ github.token }}
          path: r48

      - name: V229R49 Restore original approved R44 native wall graph for verification
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39598356143
          name: SLKnight-V229R44-Wall-Collision-Player-Translucency-106-Monsters
          github-token: ${{ github.token }}
          path: native

      - name: V229R49 Verify actual R48 code, assets and collision before changes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r49_verify.py <<'R49_EMBEDDED'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          expected={
              'Data/Scripts.rxdata':'b83cc34ca002cb24342c02acd3c9b1f17d5b193d6c7900c3a3cef35dd3c85030',
              f'Data/{pre}Map045.rxdata':'db55be6f496a4bb347aabc2587804344b798836c87ae325a19c69d76eec5f694',
              f'Data/{pre}Map046.rxdata':'db048c6c281db1b45a8034b286fffcfa0cd007e980bb17ba4bfa2ec32eeb9544'}
          for name,digest in expected.items():
              f=root/'knight/gameasync'/name
              assert f.is_file() and hashlib.sha256(f.read_bytes()).hexdigest()==digest,name
          assert 'V229R48' in (root/'index.html').read_text('utf-8')
          assert 'V229R48' in (root/'knight/index.html').read_text('utf-8')
          baseline={str(f.relative_to(root)):hashlib.sha256(f.read_bytes()).hexdigest() for f in root.rglob('*') if f.is_file()}
          assert len(baseline)==5517,len(baseline)
          for mid in (45,46):
              count=len(list((root/'knight/gameasync/Graphics/Panoramas').glob(f'SLTI_{mid}_W_C*_*.png')))
              assert count==(17 if mid==45 else 28),(mid,count)
              size=(288*144 if mid==45 else 336*168)
              assert (Path('build')/f'r44-map-{mid}-edges.bin').stat().st_size==size
          Path('build/r49-baseline.json').write_text(json.dumps(baseline,sort_keys=True))
          print('PASS approved R48 baseline: 5517 files, true separate walls 17+28, untouched 106-monster map and R44 collision graph')
          R49_EMBEDDED
          mkdir -p site build
          test -s r48/artifact.tar
          tar -xf r48/artifact.tar -C site
          cp native/r44-map-45-edges.bin build/
          cp native/r44-map-46-edges.bin build/
          python3 /tmp/r49_verify.py

      - name: V229R49 Fix all 105 real monster activation pages and 16 zombie damage gates
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r49_map_patch.rb <<'R49_EMBEDDED'
          require 'json'
          require 'digest'
          require 'zlib'
          module RPG
           class Map;end;class MapInfo;end;class AudioFile;end;class Tileset;end
           class Event;class Page;class Condition;end;class Graphic;end;end;end
           class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          class Table
           def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
           def _dump(d=0);@raw;end
           def [](x,y=0,z=0)
            _,w,h,depth,_=@raw.unpack('V5')
            return nil if x<0 || y<0 || x>=w || y>=h || z<0 || z>=depth
            @raw.byteslice(20+2*(x+y*w+z*w*h),2).unpack('v')[0]
           end
          end
          class Tone;def self._load(r);o=allocate;o.instance_variable_set(:@raw,r);o;end;def _dump(d=0);@raw;end;end
          class Color<Tone;end

          site=ARGV.fetch(0)
          report=ARGV.fetch(1)
          Dir.mkdir(report) unless Dir.exist?(report)
          root=File.join(site,'knight/gameasync/Data')
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          expected={45=>'db55be6f496a4bb347aabc2587804344b798836c87ae325a19c69d76eec5f694',46=>'db048c6c281db1b45a8034b286fffcfa0cd007e980bb17ba4bfa2ec32eeb9544'}
          info={};mob_total=0;conditional=0;variable_gate=0;combat_gate=0
          [45,46].each do |mid|
           path=File.join(root,pre+('Map%03d.rxdata'%mid))
           raise "R48 map source hash mismatch #{mid}" unless Digest::SHA256.file(path).hexdigest==expected[mid]
           old=Marshal.load(File.binread(path));map=Marshal.load(File.binread(path))
           all=map.instance_variable_get(:@events);prior=old.instance_variable_get(:@events)
           raise 'Map event count changed' unless all.size==(mid==45 ? 53 : 62)
           changed=[];counts=Hash.new(0)
           all.each do |id,ev|
            name=ev.instance_variable_get(:@name).to_s.dup.force_encoding('UTF-8').scrub
            next unless name.start_with?('[ID')
            next if (mid==45 && id==13) || (mid==46 && id==3)
            if mid==46 && id==13
             raise 'Moved boss' unless [ev.instance_variable_get(:@x),ev.instance_variable_get(:@y)]==[156,100]
             next
            end
            mob_total+=1;counts[name]+=1
            pages=ev.instance_variable_get(:@pages)
            page=pages.fetch(1);c=page.instance_variable_get(:@condition)
            raise "No first-aggro switch #{mid}/#{id}" unless c.instance_variable_get(:@switch1_valid)
            if c.instance_variable_get(:@switch2_valid)
             raise "Unexpected condition #{mid}/#{id}" unless c.instance_variable_get(:@switch2_id)==23
             c.instance_variable_set(:@switch2_valid,false)
             changed<<id;conditional+=1
            end
            if c.instance_variable_get(:@variable_valid)
             raise "Unexpected page1 variable gate #{mid}/#{id}" unless mid==45 && c.instance_variable_get(:@variable_value)==1
             c.instance_variable_set(:@variable_valid,false)
             changed<<id;variable_gate+=1
             # Zombies' attack event was ALSO gated by global switch 23 in the
             # interpreter branch, separately from page activation. Use this mob's
             # own first-recognition switch so damage becomes reachable.
             commands=page.instance_variable_get(:@list)
             branch_ops=commands.select{|op|op.instance_variable_get(:@code)==111 &&
               (p=op.instance_variable_get(:@parameters))==[0,23,0]}
             raise "Zombie combat gate missing #{mid}/#{id}" unless branch_ops.size==1
             branch_ops[0].instance_variable_get(:@parameters)[1]=c.instance_variable_get(:@switch1_id)
             combat_gate+=1
            end
            oldev=prior.fetch(id)
            raise 'Monster moved' unless [ev.instance_variable_get(:@x),ev.instance_variable_get(:@y)]==[oldev.instance_variable_get(:@x),oldev.instance_variable_get(:@y)]
            # Original walkable and original respawn coordinates must remain untouched.
            raise 'Monster page layout changed' unless pages.size==4
           end
           all.each do |id,ev|
            if !changed.include?(id)
             raise "Unintended event mutation: #{mid} #{id}" unless Marshal.dump(prior.fetch(id))==Marshal.dump(ev)
            else
             a=Marshal.load(Marshal.dump(ev));cc=a.instance_variable_get(:@pages)[1].instance_variable_get(:@condition)
             cc.instance_variable_set(:@switch2_valid,true) if cc.instance_variable_get(:@switch2_id)==23
             if mid==45 && cc.instance_variable_get(:@variable_value)==1
              cc.instance_variable_set(:@variable_valid,true)
              commands=a.instance_variable_get(:@pages)[1].instance_variable_get(:@list)
              branch=commands.select{|op|op.instance_variable_get(:@code)==111 && (p=op.instance_variable_get(:@parameters))==[0,cc.instance_variable_get(:@switch1_id),0]}
              raise "Zombie combat restoration mismatch #{mid}/#{id}" unless branch.size==1
              branch[0].instance_variable_get(:@parameters)[1]=23
             end
             raise "Unexpected event change #{id}" unless Marshal.dump(a)==Marshal.dump(prior.fetch(id))
            end
           end
           raise 'Map changed' unless Marshal.dump(old.instance_variable_get(:@data))==Marshal.dump(map.instance_variable_get(:@data))
           File.binwrite(path,Marshal.dump(map))
           info[mid.to_s]={'monster_count'=>mid==45 ? 48 : 57,'disabled_stale_second_conditions'=>changed.size,'ids'=>changed,'species'=>counts}
           puts "Map #{mid}: #{counts.values.sum} regular mobs, #{changed.size} secondary page blockers removed"
          end
          raise "Monster count mismatch #{mob_total}" unless mob_total==105
          raise "Unexpected switch blockers #{conditional}" unless conditional==89
          raise "Unexpected variable blockers #{variable_gate}" unless variable_gate==16
          raise "Unexpected global combat gates #{combat_gate}" unless combat_gate==16
          File.write(File.join(report,'r49-events.json'),JSON.pretty_generate(info))
          R49_EMBEDDED
          ruby -c /tmp/r49_map_patch.rb
          ruby /tmp/r49_map_patch.rb site build

      - name: V229R49 Repair existing wall sprite order and native monster movement in place
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r49_script_patch.rb <<'R49_EMBEDDED'
          require 'digest'
          require 'zlib'
          site=ARGV.fetch(0)
          report=ARGV.fetch(1)
          path=File.join(site,'knight/gameasync/Data/Scripts.rxdata')
          expected='b83cc34ca002cb24342c02acd3c9b1f17d5b193d6c7900c3a3cef35dd3c85030'
          raise 'Wrong R48 script asset' unless Digest::SHA256.file(path).hexdigest==expected
          scripts=Marshal.load(File.binread(path))
          original=Marshal.load(File.binread(path))
          fetch=lambda{|id|Zlib::Inflate.inflate(scripts.fetch(id).fetch(2))}
          char=fetch.call(23)
          renderer=fetch.call(134)
          sprite=fetch.call(28)
          raise 'R48 must already have separate wall image sprites' unless renderer.include?('module SLTI_V229R48') && renderer.include?('def slti_r48_update_walls') && renderer.include?('PARTS=')
          raise 'Player alpha regression in base' if sprite.include?('SLTI_V229R44.wall_overlap?')
          raise 'Missing normal character alpha' unless sprite.include?('self.opacity = @character.opacity')
          raise 'Original movement method changed' unless char.scan('def passable?(x, y, d)').length==1
          char_guard=<<'R49_CHAR'
            def passable?(x, y, d)
              # R49: apply the exact native directional graph to regular dungeon monsters
              # even if a forced move route momentarily enables RGSS through mode.
              if $game_map != nil && ($game_map.map_id == 45 || $game_map.map_id == 46) &&
                 [2,4,6,8].include?(d)
                evt = (self.is_a?(Game_Event) ? @event : nil)
                regular = evt != nil && evt.name.to_s[0,3] == '[ID' &&
                          !(($game_map.map_id == 45 && evt.id == 13) ||
                            ($game_map.map_id == 46 && (evt.id == 3 || evt.id == 13)))
                if regular || self == $game_player
                  nx = x + (d == 6 ? 1 : d == 4 ? -1 : 0)
                  ny = y + (d == 2 ? 1 : d == 8 ? -1 : 0)
                  return false unless SLTI_V229R44.allowed?($game_map.map_id,x,y,d)
                  return false unless SLTI_V229R44.allowed?($game_map.map_id,nx,ny,10-d)
                  # The remaining twelve R44 floor bridges are needed for player access.
                  # Monsters must not climb their old visual wall-tile footprints.
                  return false if regular && $game_map.data[nx,ny,0] == 385
                end
              end
          R49_CHAR
          char=char.sub('  def passable?(x, y, d)',char_guard.chomp)
          raise 'Dungeon movement guard missing' unless char.include?('regular && $game_map.data[nx,ny,0] == 385')
          # Replace R48 logic instead of installing another nested alias/override.
          renamed=renderer.gsub('SLTI_V229R48','SLTI_V229R49').gsub('slti_r48','slti_r49').gsub('V229R48','V229R49')
          old_sight=<<'OLD'
              # Allow near visible corners: a short actual traversable passage is NOT vision
              # through a wall. 10-step original radius is retained, never extended.
              return route?(mid,ax,ay,bx,by,[distance-1,manhattan+3].min)
          OLD
          new_sight=<<'NEW'
              # A very close diagonal can use an open L-shaped pair, but a detour
              # around a wall is never treated as direct first sight.
              return false if manhattan > 3
              return route?(mid,ax,ay,bx,by,manhattan)
          NEW
          raise 'Sight branch changed' unless renamed.scan(old_sight).length==1
          renamed=renamed.sub(old_sight,new_sight)
          old_depth=<<'OLD'
                  if overlap
                    s.z=actor_depth+2
                    s.opacity=148  # fade WALL, never player; actual source alpha remains intact
                  else
                    s.z=bottom+2
                    s.opacity=255
                  end
          OLD
          new_depth=<<'NEW'
                  # All original wall faces are foreground over actor AND monster sprites.
                  # Fade only the wall piece actually covering the player sprite.
                  s.z=4096
                  s.opacity=overlap ? 148 : 255
          NEW
          raise 'Wall depth branch changed' unless renamed.scan(old_depth).length==1
          renamed=renamed.sub(old_depth,new_depth)
          raise 'Old renderer alias remains' if renamed.include?('slti_r48_') || renamed.include?('SLTI_V229R48')
          raise 'Must not overwrite actor alpha' if renamed.include?('hero.opacity=') || renamed.include?('self.opacity=148')
          raise 'Original attack wall check missing' unless renamed.include?('attack_open?') && renamed.include?('command_311')
          scripts[23][2]=Zlib::Deflate.deflate(char)
          scripts[134][2]=Zlib::Deflate.deflate(renamed)
          scripts.each_index{|i|raise "Unrelated script #{i} changed" unless [23,134].include?(i) || scripts[i]==original[i]}
          File.binwrite(path,Marshal.dump(scripts))
          File.binwrite(File.join(report,'r49-original-character.rb'),char)
          File.binwrite(File.join(report,'r49-existing-wall-renderer.rb'),renamed)
          puts 'PASS R49 core: movement script23 and existing separated-wall script134 only; no extra alias layers, player alpha unchanged'
          R49_EMBEDDED
          ruby -c /tmp/r49_script_patch.rb
          ruby /tmp/r49_script_patch.rb site build
          ruby -c build/r49-original-character.rb
          ruby -c build/r49-existing-wall-renderer.rb

      - name: V229R49 Run actual native event page, first sight, movement and wall layering tests
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r49_test.rb <<'R49_EMBEDDED'
          require 'zlib'
          require 'json'
          require 'digest'
          module RPG
           class Map;end;class MapInfo;end;class AudioFile;end;class Tileset;end
           class Event;attr_reader :id,:name,:pages,:x,:y;class Page;attr_reader :condition,:graphic,:move_route,:move_type,:move_speed,:move_frequency,:walk_anime,:step_anime,:direction_fix,:through,:always_on_top,:trigger,:list;class Condition;attr_reader :switch1_id,:switch1_valid,:switch2_id,:switch2_valid,:variable_valid,:variable_id,:variable_value,:self_switch_valid,:self_switch_ch;end;class Graphic;attr_reader :tile_id,:character_name,:character_hue,:direction,:pattern,:opacity,:blend_type;end;end;end
           class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          class Table
           def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
           def _dump(d=0);@raw;end
           def [](x,y=0,z=0)
            _,w,h,depth,_=@raw.unpack('V5')
            return nil if x<0 || y<0 || x>=w || y>=h || z<0 || z>=depth
            @raw.byteslice(20+2*(x+y*w+z*w*h),2).unpack('v')[0]
           end
          end
          class Tone;def self._load(r);o=allocate;o.instance_variable_set(:@raw,r);o;end;def _dump(d=0);@raw;end;end
          class Color<Tone;end
          class Game_Character
           attr_accessor :x,:y,:through,:character_name
           def initialize;@x=0;@y=0;@through=false;@character_name='';@original_direction=2;@original_pattern=0;@move_route_forcing=false;end
           def moveto(x,y);@x=x;@y=y;end
           def turn_toward_player;end
           def lock?;false;end
          end
