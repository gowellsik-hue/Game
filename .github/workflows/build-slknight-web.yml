                "RPG::AudioFile.new(" \
                "#{name.dump},v,#{pitch}" \
                "));" \
                "end"

              setiv(
                cmd,
                :code,
                45
              )

              setiv(
                cmd,
                :parameters,
                [code]
              )

              patched += 1
            end
