
name: build-slknight-web.yml | V2.8 | Map049 Orc Forest to Valakas and Bridge Transit

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Restore last confirmed V2.7 game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site baseline build/v28
          RUN_ID="$(gh api 'repos/gowellsik-hue/Game/actions/workflows/build-slknight-web.yml/runs?status=success&per_page=100' --jq '.workflow_runs[] | select(.head_sha=="3c82c3b4ed77baab032e23cb6f4a1385755b377b") | .id' | head -n 1)"
          test -n "$RUN_ID"
          gh run download "$RUN_ID" --repo gowellsik-hue/Game --name github-pages --dir baseline
          test -s baseline/artifact.tar
          tar -xf baseline/artifact.tar -C site
          test -s site/knight/gameasync/Data/Scripts.rxdata
          test -s site/knight/assets/map-048-v229r115.pack
          grep -q 'V2.7' site/knight/index.html
          grep -q "var version='V2.7';" site/knight/js/sl-assets-v229r115.js
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet --disable-pip-version-check 'Pillow>=11,<13'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          assert len(before)>6003
          Path('build/v28/before.json').write_text(json.dumps(before,sort_keys=True),'utf8')
          print('PASS V2.7 baseline',len(before))
          PY

      - name: Download original Sanctuary Map4 data
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 43157706909
          name: Sanctuary-Original-Map-4-Full
          github-token: ${{ github.token }}
          path: source-map4

      - name: Build Map049 from original Map4 renderer
        shell: bash
        run: |
          set -euo pipefail
          gh api 'repos/gowellsik-hue/Game/contents/.github/workflows/build-slknight-web.yml?ref=3c82c3b4ed77baab032e23cb6f4a1385755b377b' --jq .content | base64 -d > build/v28/v27-source.yml
          cat > build/v28/prepare_map049.py <<'PY'
          from pathlib import Path
          import textwrap

          workflow=Path('build/v28/v27-source.yml').read_text('utf8')
          begin="          cat > build/v22/build_map048.py <<'V22_MAP48_SOURCE_EOF'\n"
          end="\n          V22_MAP48_SOURCE_EOF"
          assert workflow.count(begin)==1
          source=textwrap.dedent(workflow.split(begin,1)[1].split(end,1)[0])

          def change(old,new):
           global source
           assert source.count(old)==1,('Unexpected original source',old)
           source=source.replace(old,new)

          change('UORG=64854','UORG=64600')
          change('XSHIFT,YSHIFT=8,5358','XSHIFT,YSHIFT=0,10798')
          change(
           "assert cities=={'글루디오':(366,382),'우드벡':(742,546),'은기사':(1210,450)}",
           'assert len(cities)==3'
          )

          first=source.index("mask=Image.new('L',(PW,PH),0)")
          last=source.index("idx=(ROOT/'Tile.idx').read_bytes()",first)

          mask_code="""zones49=[
           (32512,32192,32960,32576),
           (32960,32192,33216,32512),
           (33216,32192,33472,32512),
           (33472,32128,33856,32512),
           (32960,32512,33280,33024)
          ]

          zone_mask=Image.new('L',(PW,PH),0)
          for x0,y0,x1,y1 in zones49:
           points=[
            (fx(x0,y0),fy(x0,y0)),
            (fx(x1,y0),fy(x1,y0)),
            (fx(x1,y1),fy(x1,y1)),
            (fx(x0,y1),fy(x0,y1))
           ]
           ImageDraw.Draw(zone_mask).polygon(points,fill=255)

          north_sight=Image.new('L',(PW,PH),0)
          sight_points=[
           (0,0),(PW,0)
          ]+[
           (x,y+264) for x,y in reversed(line)
          ]+[
           (0,line[0][1]+264)
          ]
          ImageDraw.Draw(north_sight).polygon(sight_points,fill=255)

          north_land=Image.new('L',(PW,PH),0)
          land_points=[
           (0,0),(PW,0)
          ]+list(reversed(line))+[
           (0,line[0][1])
          ]
          ImageDraw.Draw(north_land).polygon(land_points,fill=255)

          mask=ImageChops.multiply(zone_mask,north_sight)
          landmask=ImageChops.multiply(zone_mask,north_land)
          mask_small=landmask.resize((W,H),Image.Resampling.NEAREST)

          """
          source=source[:first]+mask_code+source[last:]

          change(
           'assert len(source_files)==602',
           """assert len(source_files)==602
          requested={
           (x,y)
           for x0,y0,x1,y1 in zones49
           for y in range(y0,y1,64)
           for x in range(x0,x1,64)
          }
          available={
           ((int(stem[:4],16)-0x7e00)*64,
            (int(stem[4:],16)-0x7e00)*64)
           for stem in source_files
          }
          assert len(requested)==158
          assert len(requested&available)==157
          assert requested-available=={(33792,32128)}"""
          )

          change(
           'inland=py>=line_y[px]',
           'inland=bool(landmask.getpixel((px,py)))'
          )
          change(
           'if bmp is not None and not (110<=tile<=168 and index==34):',
           'if bmp is not None:'
          )

          source=source.replace('SLTI_48_','SLTI_49_')
          source=source.replace('map48-','map49-')
          source=source.replace("print('PASS map048'","print('PASS map049'")

          assert 'SLTI_48_' not in source
          assert 'map48-' not in source
          assert 'SLTI_49_GID.png' in source
          assert 'map49-full-walk.bin' in source

          Path('build/v28/build_map049.py').write_text(source,'utf8')
          print('PASS Map049 source prepared')
          PY
          .venv/bin/python -m py_compile build/v28/prepare_map049.py
          .venv/bin/python build/v28/prepare_map049.py
          .venv/bin/python -m py_compile build/v28/build_map049.py
          .venv/bin/python -u build/v28/build_map049.py

      - name: Register Map049 and connect bridge and teleport NPC
        shell: bash
        run: |
          set -euo pipefail
          cat > build/v28/connect_map049.rb <<'RUBY'
          # encoding: UTF-8
          module RPG
            class Map;end
            class Event;end
            class Event::Page;end
            class Event::Page::Condition;end
            class Event::Page::Graphic;end
            class EventCommand;end
            class MoveCommand;end
            class MoveRoute;end
            class AudioFile;end
            class MapInfo;end
          end
          class Table
            def self._load(raw)
              o=allocate
              o.instance_variable_set(:@raw,raw)
              o
            end
            def _dump(depth);@raw;end
          end
          class Tone
            def self._load(raw)
              o=allocate
              o.instance_variable_set(:@raw,raw)
              o
            end
            def _dump(depth);@raw;end
          end
          class Color
            def self._load(raw)
              o=allocate
              o.instance_variable_set(:@raw,raw)
              o
            end
            def _dump(depth);@raw;end
          end

          data='site/knight/gameasync/Data'
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          f29=File.join(data,prefix+'Map029.rxdata')
          f47=File.join(data,prefix+'Map047.rxdata')
          f48=File.join(data,prefix+'Map048.rxdata')
          f49=File.join(data,prefix+'Map049.rxdata')
          fi=File.join(data,prefix+'MapInfos.rxdata')

          raise 'Map049 exists' if File.exist?(f49)

          before29=File.binread(f29)
          before47=File.binread(f47)
          before48=File.binread(f48)
          before_infos=File.binread(fi)

          map29=Marshal.load(before29)
          map48=Marshal.load(before48)
          infos=Marshal.load(before_infos)
          old_infos=infos.transform_values{|v|Marshal.dump(v)}

          raise 'Map048 missing' unless infos.key?(48)
          raise 'Map049 already registered' if infos.key?(49)
          raise 'Map048 events must be empty' unless
            map48.instance_variable_get(:@events).empty?
          raise 'Map048 size changed' unless
            [map48.instance_variable_get(:@width),
             map48.instance_variable_get(:@height)]==[1536,768]

          walk=File.binread('build/v22/map49-full-walk.bin')
          raise 'Wrong Map049 collision size' unless walk.bytesize==1536*768*2
          raise 'Wrong collision values' unless walk.unpack('v*').all?{|v|v==384||v==385}

          map49=Marshal.load(before48)
          map49.instance_variable_set(:@events,{})
          map49.instance_variable_set(:@width,1536)
          map49.instance_variable_set(:@height,768)
          map49.instance_variable_get(:@data).instance_variable_set(
            :@raw,
            [3,1536,768,3,3*1536*768].pack('V5')+
            walk+("\0"*(1536*768*4))
          )

          info=Marshal.load(Marshal.dump(infos[48]))
          info.instance_variable_set(:@name,'오크숲·요정숲·용의 계곡·화룡의 둥지')
          info.instance_variable_set(:@order,49)
          infos[49]=info

          def passable(map,x,y)
            return false unless x.between?(0,1535)&&y.between?(0,767)
            raw=map.instance_variable_get(:@data).instance_variable_get(:@raw)
            raw.byteslice(20+2*(y*1536+x),2).unpack1('v')==384
          end

          def open_cell(map,x,y)
            raise 'Bridge opening outside map' unless x.between?(0,1535)&&y.between?(0,767)
            table=map.instance_variable_get(:@data)
            raw=table.instance_variable_get(:@raw).dup
            offset=20+2*(y*1536+x)
            raw.setbyte(offset,0x80)
            raw.setbyte(offset+1,0x01)
            table.instance_variable_set(:@raw,raw)
          end

          # Original Gludio–Orc Forest bridge, two adjacent boundary cells.
          crossings=[
            [244,293,434,632],
            [245,293,435,632]
          ]

          crossings.each do |x48,y48,x49,y49|
            open_cell(map48,x48,y48)
            open_cell(map48,x48,y48+1)
            open_cell(map49,x49,y49)
            open_cell(map49,x49,y49-1)
            raise 'Map048 bridge opening failed' unless
              passable(map48,x48,y48)&&passable(map48,x48,y48+1)
            raise 'Map049 bridge opening failed' unless
              passable(map49,x49,y49)&&passable(map49,x49,y49-1)
          end

          npc_events=map29.instance_variable_get(:@events)
          raise 'Teleport NPC missing' unless npc_events.key?(11)
          npc=npc_events[11]
          raise 'Unexpected teleport NPC location' unless
            [npc.instance_variable_get(:@x),npc.instance_variable_get(:@y)]==[70,48]

          def make_command(code,indent,parameters)
            c=RPG::EventCommand.allocate
            c.instance_variable_set(:@code,code)
            c.instance_variable_set(:@indent,indent)
            c.instance_variable_set(:@parameters,parameters)
            c
          end

          def bridge_event(template,id,x,y,mapid,tx,ty,direction)
            e=Marshal.load(Marshal.dump(template))
            e.instance_variable_set(:@id,id)
            e.instance_variable_set(:@name,'Map049 Bridge')
            e.instance_variable_set(:@x,x)
            e.instance_variable_set(:@y,y)
            pages=e.instance_variable_get(:@pages)
            raise 'Wrong bridge template' unless pages.size==1
            page=pages[0]
            page.instance_variable_set(:@trigger,1)
            page.instance_variable_set(:@through,true)
            page.instance_variable_set(:@move_type,0)
            page.instance_variable_set(:@walk_anime,false)
            page.instance_variable_set(:@step_anime,false)
            page.instance_variable_set(:@always_on_top,false)
            condition=page.instance_variable_get(:@condition)
            [:switch1_valid,:switch2_valid,:variable_valid,:self_switch_valid].each do |key|
              condition.instance_variable_set(:"@#{key}",false)
            end
            graphic=page.instance_variable_get(:@graphic)
            graphic.instance_variable_set(:@tile_id,0)
            graphic.instance_variable_set(:@character_name,'')
            page.instance_variable_set(:@list,[
              make_command(201,0,[0,mapid,tx,ty,direction,1]),
              make_command(0,0,[])
            ])
            e
          end

          crossings.each_with_index do |(x48,y48,x49,y49),i|
            map48.instance_variable_get(:@events)[i+1]=
              bridge_event(npc,i+1,x48,y48,49,x49,y49-1,8)
            map49.instance_variable_get(:@events)[i+1]=
              bridge_event(npc,i+1,x49,y49,48,x48,y48+1,2)
          end

          # Find a valid landing tile near the original Orc Forest location.
          wx,wy=32715,32448
          x0=((12*(wx+wy-64600))/16.0).round
          y0=((6*(wy-wx)+10798)/16.0).round
          landing=nil

          (0..48).each do |radius|
            break if landing
            (-radius..radius).each do |dy|
              break if landing
              (-radius..radius).each do |dx|
                next unless dx.abs+dy.abs==radius
                x=x0+dx
                y=y0+dy
                if passable(map49,x,y)
                  landing=[x,y]
                  break
                end
              end
            end
          end
          raise 'No original Orc Forest landing tile' unless landing
          puts "Map049 Orc Forest landing #{landing.inspect}"

          # Reuse all existing teleport routes; remove Next/Cancel items.
          old_list=npc.instance_variable_get(:@pages)[0].instance_variable_get(:@list)
          raise 'Wrong original teleport count' unless
            old_list.count{|c|c.instance_variable_get(:@code)==201}==11
          raise 'Wrong original menu' unless
            old_list[3].instance_variable_get(:@code)==102

          root_indent=old_list[3].instance_variable_get(:@indent)
          original_routes=[]

          old_list.each_with_index do |cmd,i|
            next unless cmd.instance_variable_get(:@code)==402
            parameters=cmd.instance_variable_get(:@parameters)
            next unless parameters.is_a?(Array)&&parameters.size==2
            name=parameters[1]
            next unless name.is_a?(String)
            next if name.include?('다음')||name.include?('취소')

            branch_indent=cmd.instance_variable_get(:@indent)
            j=i+1
            j+=1 while j<old_list.size &&
                       old_list[j].instance_variable_get(:@indent)>branch_indent
            body=old_list[(i+1)...j].map{|c|Marshal.load(Marshal.dump(c))}
            next unless body.any?{|c|c.instance_variable_get(:@code)==201}
            body.each do |c|
              depth=c.instance_variable_get(:@indent)
              c.instance_variable_set(:@indent,depth+root_indent-branch_indent)
            end
            original_routes << [name,body]
          end

          raise 'Original 11 teleport routes not found' unless
            original_routes.size==11 &&
            original_routes.map(&:first).uniq.size==11 &&
            original_routes.sum{|name,body|
              body.count{|c|c.instance_variable_get(:@code)==201}
            }==11

          names=original_routes.map(&:first)+['오크숲']
          root_end=(4...old_list.size).find do |i|
            c=old_list[i]
            c.instance_variable_get(:@code)==404 &&
              c.instance_variable_get(:@indent)==root_indent
          end
          raise 'Original teleport menu end missing' unless root_end

          new_list=old_list[0...3].map{|c|Marshal.load(Marshal.dump(c))}
          new_list << make_command(102,root_indent,[names,5])

          original_routes.each_with_index do |(name,body),index|
            new_list << make_command(402,root_indent,[index,name])
            new_list.concat(body)
          end

          new_list << make_command(402,root_indent,[11,'오크숲'])
          new_list << make_command(201,root_indent+1,
                                   [0,49,landing[0],landing[1],0,1])
          new_list << make_command(0,root_indent+1,[])
          new_list << make_command(403,root_indent,[])
          new_list << make_command(0,root_indent+1,[])
          new_list << make_command(404,root_indent,[])
          new_list.concat(
            old_list[(root_end+1)..-1].map{|c|Marshal.load(Marshal.dump(c))}
          )

          raise 'Wrong destination count' unless
            new_list.count{|c|c.instance_variable_get(:@code)==201}==12
          raise 'Wrong choice count' unless
            new_list.count{|c|c.instance_variable_get(:@code)==102}==1 &&
            new_list.count{|c|c.instance_variable_get(:@code)==402}==12
          raise 'Next/Cancel item remains' if names.any?{|n|
            n.include?('다음')||n.include?('취소')
          }

          npc.instance_variable_get(:@pages)[0].instance_variable_set(:@list,new_list)

          File.binwrite(f48,Marshal.dump(map48))
          File.binwrite(f49,Marshal.dump(map49))
          File.binwrite(f29,Marshal.dump(map29))
          File.binwrite(fi,Marshal.dump(infos))

          raise 'Map047 modified' unless File.binread(f47)==before47

          verified_infos=Marshal.load(File.binread(fi))
          raise 'MapInfos count wrong' unless
            verified_infos.keys.sort==(old_infos.keys+[49]).sort
          old_infos.each do |id,bytes|
            raise 'Existing map information modified' unless
              Marshal.dump(verified_infos[id])==bytes
          end

          original_events=Marshal.load(before29).instance_variable_get(:@events)
          updated_events=Marshal.load(File.binread(f29)).instance_variable_get(:@events)
          original_events.each do |id,e|
            next if id==11
            raise 'Other teleport-map event modified' unless
              Marshal.dump(e)==Marshal.dump(updated_events[id])
          end

          [map48,map49].each do |map|
            raise 'Bridge event count wrong' unless
              map.instance_variable_get(:@events).keys.sort==[1,2]
          end

          puts 'PASS Map049 original terrain registered'
          puts 'PASS Map048 and Map049 two-way bridge transfers'
          puts 'PASS space teleporter 12 destinations; no Next/Cancel items'
          RUBY
          ruby -c build/v28/connect_map049.rb
          ruby build/v28/connect_map049.rb

      - name: Extend native renderer and teleport window for Map049
        shell: bash
        run: |
          set -euo pipefail
          cat > build/v28/patch_map049_scripts.rb <<'RUBY'
          # encoding: UTF-8
          require 'json'
          require 'zlib'

          file='site/knight/gameasync/Data/Scripts.rxdata'
          rows=Marshal.load(File.binread(file))
          raise 'Wrong RGSS script count' unless rows.size==137
          before=rows.map{|r|r.dup}

          lookup=lambda do |name|
            a=rows.select{|r|
              r.is_a?(Array) &&
              r[1].to_s.dup.force_encoding('UTF-8')==name
            }
            raise "Missing or duplicate RGSS script #{name}" unless a.size==1
            a.first
          end

          replace_once=lambda do |s,old,new|
            raise "Missing script expression: #{old[0,70]}" unless s.scan(old).size==1
            s.sub(old,new)
          end

          res=lookup.call('해상도')
          s=Zlib::Inflate.inflate(res[2]).force_encoding('UTF-8')
          nl=s.include?("\r\n") ? "\r\n" : "\n"
          s=s.gsub("\r\n","\n")

          s=replace_once.call(
            s,
            '@slti_floor = ($game_map.map_id == 47 || $game_map.map_id == 48) ? $game_map.map_id : nil',
            '@slti_floor = ([47,48,49].include?($game_map.map_id)) ? $game_map.map_id : nil'
          )
          s=replace_once.call(
            s,
            '@slti_floor == 48 ? 48 : (@slti_floor == 47 ? 24 : 0)',
            '(@slti_floor == 48 || @slti_floor == 49) ? 48 : (@slti_floor == 47 ? 24 : 0)'
          )
          s=replace_once.call(
            s,
            '@slti_floor == 48 ? 24 : (@slti_floor == 47 ? 12 : 0)',
            '(@slti_floor == 48 || @slti_floor == 49) ? 24 : (@slti_floor == 47 ? 12 : 0)'
          )
          s=replace_once.call(
            s,
            '@map_id == 48 ? width : $WINDOW_WIDTH',
            '([48,49].include?(@map_id)) ? width : $WINDOW_WIDTH'
          )
          s=replace_once.call(
            s,
            '@map_id == 48 ? height : $WINDOW_HEIGHT',
            '([48,49].include?(@map_id)) ? height : $WINDOW_HEIGHT'
          )
          RubyVM::InstructionSequence.compile(s)
          res[2]=Zlib::Deflate.deflate(s.gsub("\n",nl).b)

          res=lookup.call('SLNativeLayerV241')
          s=Zlib::Inflate.inflate(res[2]).force_encoding('UTF-8')
          nl=s.include?("\r\n") ? "\r\n" : "\n"
          s=s.gsub("\r\n","\n")

          hex=File.read('build/v22/map49-group-bounds.hex').strip
          keys=JSON.parse(File.read('build/v22/map49-foreground-keys.json'))

          raise 'Map049 bounds invalid' unless
            hex.match?(/\A[0-9a-f]+\z/) &&
            hex.length%16==0 && hex.length>16
          raise 'Map049 foreground invalid' unless
            keys.size>0 &&
            keys.all?{|k|
              k.is_a?(Array)&&k.size==2&&
              k[0].between?(0,47)&&k[1].between?(0,23)
            }

          parts=hex.scan(/.{1,30000}/).map{|p|"'#{p}'"}.join(" \\\n    ")
          s=replace_once.call(
            s,'  FADE_ALPHA=135',
            "  GROUP_BOUNDS_49=#{parts}\n  FOREGROUND_KEYS_49=#{JSON.generate(keys)}\n  FADE_ALPHA=135"
          )
          s=replace_once.call(
            s,
            'source=mapid==48 ? GROUP_BOUNDS_48 : GROUP_BOUNDS',
            'source=mapid==49 ? GROUP_BOUNDS_49 : (mapid==48 ? GROUP_BOUNDS_48 : GROUP_BOUNDS)'
          )

          old_condition='$game_map.map_id==47 || $game_map.map_id==48'
          raise 'Original renderer conditions missing' unless s.include?(old_condition)
          s=s.gsub(
            old_condition,
            '$game_map.map_id==47 || $game_map.map_id==48 || $game_map.map_id==49'
          )
          s=replace_once.call(
            s,
            '(@slti_floor==47 && @slti_cols==24 && @slti_rows==12) || (@slti_floor==48 && @slti_cols==48 && @slti_rows==24)',
            '(@slti_floor==47 && @slti_cols==24 && @slti_rows==12) || ((@slti_floor==48 || @slti_floor==49) && @slti_cols==48 && @slti_rows==24)'
          )
          s=replace_once.call(
            s,
            '@slti_floor==48 ? SLNativeLayerV241::FOREGROUND_KEYS_48 : SLNativeLayerV241::FOREGROUND_KEYS',
            '@slti_floor==49 ? SLNativeLayerV241::FOREGROUND_KEYS_49 : (@slti_floor==48 ? SLNativeLayerV241::FOREGROUND_KEYS_48 : SLNativeLayerV241::FOREGROUND_KEYS)'
          )

          RubyVM::InstructionSequence.compile(s)
          res[2]=Zlib::Deflate.deflate(s.gsub("\n",nl).b)

          res=lookup.call('Window_Message')
          s=Zlib::Inflate.inflate(res[2]).force_encoding('UTF-8')
          raise 'Invalid message script' unless s.valid_encoding?
          nl=s.include?("\r\n") ? "\r\n" : "\n"

          scroll=<<'SCROLL_RUBY'
          class Window_Message
            alias sltp_original_refresh refresh
            alias sltp_original_update_cursor_rect update_cursor_rect
            alias sltp_original_update update

            def sltp_teleport_scroll?
              $game_map && $game_map.map_id==29 &&
                $game_temp.choice_max==12
            end

            def refresh
              if sltp_teleport_scroll?
                if self.contents.nil? || self.contents.height<384
                  old=self.contents
                  self.contents=Bitmap.new(self.width-32,384)
                  old.dispose if old && !old.disposed?
                end
                self.oy=0
              elsif self.contents &&
                    self.contents.height>self.height-32
                old=self.contents
                self.contents=Bitmap.new(self.width-32,self.height-32)
                old.dispose unless old.disposed?
                self.oy=0
              end
              sltp_original_refresh
              if sltp_teleport_scroll?
                @item_max=12
                @column_max=1
              end
            end

            def update_cursor_rect
              if sltp_teleport_scroll?
                Window_Selectable.instance_method(
                  :update_cursor_rect).bind(self).call
              else
                sltp_original_update_cursor_rect
              end
            end

            def update
              if sltp_teleport_scroll? &&
                 @contents_showing &&
                 Input.trigger?(Input::B)
                $game_system.se_play($data_system.cancel_se)
                $game_temp.choice_proc.call(-1)
                terminate_message
                return
              end
              sltp_original_update
            end
          end
          SCROLL_RUBY

          s=s.gsub("\r\n","\n")+"\n"+scroll
          RubyVM::InstructionSequence.compile(s)
          res[2]=Zlib::Deflate.deflate(s.gsub("\n",nl).b)

          changed=rows.each_index.select{|i|rows[i][2]!=before[i][2]}
          expected=rows.each_index.select{|i|
            ['해상도','SLNativeLayerV241','Window_Message'].include?(
              rows[i][1].to_s.dup.force_encoding('UTF-8'))
          }
          raise 'Unexpected game script modification' unless
            changed.sort==expected.sort && changed.size==3

          File.binwrite(file,Marshal.dump(rows))
          raise 'Scripts verification failed' unless
            Marshal.load(File.binread(file)).size==137

          puts 'PASS Map049 renderer and 12-item teleport scrolling'
          RUBY
          ruby -c build/v28/patch_map049_scripts.rb
          ruby build/v28/patch_map049_scripts.rb

      - name: Pack Map049 and extend original asset loader
        shell: bash
        run: |
          set -euo pipefail
          cat > build/v28/pack_map049.py <<'PY'
          from pathlib import Path
          import hashlib,json,re,struct

          root=Path('site')
          out=Path('build/v22')
          pano=root/'knight/gameasync/Graphics/Panoramas'
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          images=json.loads((out/'map49-generated-files.json').read_text('utf8'))
          keys=json.loads((out/'map49-foreground-keys.json').read_text('utf8'))

          expected={f'SLTI_49_C{x}_{y}.png'
                    for x in range(48) for y in range(24)}
          expected|={f'SLTI_49_L4_C{x}_{y}.png' for x,y in keys}
          expected.add('SLTI_49_GID.png')

          assert set(images)==expected
          assert len(images)==1152+len(keys)+1
          assert len(set(images))==len(images)
          assert all((pano/n).is_file() for n in images)

          original=(root/'knight/assets/map-047-v241.pack').read_bytes()
          n=struct.unpack_from('<I',original,0)[0]
          head=json.loads(original[4:4+n])
          body=memoryview(original)[4+n:]
          assert head['kind']=='map' and head['map_id']==47

          collision_rows=[
           x for x in head['files']
           if x[0]=='graphics/tilesets/slti_collision_transparent'
          ]
          assert len(collision_rows)==1
          key,off,size=collision_rows[0]
          collision=bytes(body[off:off+size])
          assert collision.startswith(b'\x89PNG\r\n\x1a\n')

          entries=[]
          payload=bytearray()

          for name in images:
           content=(pano/name).read_bytes()
           assert content.startswith(b'\x89PNG\r\n\x1a\n')
           key='graphics/panoramas/'+name[:-4].lower()
           entries.append([key,len(payload),len(content)])
           payload.extend(content)

          entries.append([
           'graphics/tilesets/slti_collision_transparent',
           len(payload),len(collision)
          ])
          payload.extend(collision)

          header=json.dumps({
           'kind':'map',
           'map_id':49,
           'files':entries
          },separators=(',',':')).encode('utf8')

          pack=root/'knight/assets/map-049-v229r115.pack'
          assert not pack.exists()
          pack.write_bytes(
           struct.pack('<I',len(header))+header+payload
          )

          mapper=root/'knight/gameasync/mapping.js'
          s=mapper.read_text('utf8')
          assert 'map049.rxdata' not in s.lower()

          marker='"data/'+prefix.lower()+'map048"'
          assert s.count(marker)==1
          i=s.index('\n',s.index(marker))+1
          data49=root/'knight/gameasync/Data'/(prefix+'Map049.rxdata')
          row='["data/'+prefix.lower()+'map049", "Data/'+prefix+'Map049.rxdata?h='+hashlib.md5(data49.read_bytes()).hexdigest()+'"],\n'
          s=s[:i]+row+s[i:]

          marker='"graphics/panoramas/slti_48_gid"'
          assert s.count(marker)==1
          i=s.index('\n',s.index(marker))+1
          rows=[]
          for name in images:
           p=pano/name
           rows.append(
            '["graphics/panoramas/'+name[:-4].lower()+
            '", "Graphics/Panoramas/'+name+'?h='+
            hashlib.md5(p.read_bytes()).hexdigest()+'"],\n'
           )
          s=s[:i]+''.join(rows)+s[i:]

          modified=[
           prefix+'Map029.rxdata',
           prefix+'Map048.rxdata',
           prefix+'MapInfos.rxdata',
           'Scripts.rxdata'
          ]

          for filename in modified:
           p=root/'knight/gameasync/Data'/filename
           marker='Data/'+filename+'?h='
           pattern=re.escape(marker)+r'[0-9a-f]{32}'
           assert len(re.findall(pattern,s))==1,filename
           s=re.sub(
            pattern,
            marker+hashlib.md5(p.read_bytes()).hexdigest(),
            s
           )

          mapper.write_text(s,'utf8')

          loader=root/'knight/js/sl-assets-v229r115.js'
          s=loader.read_text('utf8')

          def replace(old,new):
           global s
           assert s.count(old)==1,('Loader expression not unique',old)
           s=s.replace(old,new)

          replace(
           'var map47Keys=null, map47FilesReady=false, map48Keys=null, map48FilesReady=false;',
           'var map47Keys=null, map47FilesReady=false, map48Keys=null, map48FilesReady=false, map49Keys=null, map49FilesReady=false;'
          )
          replace(
           "if(kind==='map'&&(mid===47||mid===48)){\n      if(head.files.length<290)throw new Error('Incomplete original Map'+mid+' images');\n      if(mid===47)map47Keys=head.files.map(function(row){return row[0];});\n      else map48Keys=head.files.map(function(row){return row[0];});\n    }",
           "if(kind==='map'&&(mid===47||mid===48||mid===49)){\n      if(head.files.length<290)throw new Error('Incomplete original Map'+mid+' images');\n      if(mid===47)map47Keys=head.files.map(function(row){return row[0];});\n      else if(mid===48)map48Keys=head.files.map(function(row){return row[0];});\n      else map49Keys=head.files.map(function(row){return row[0];});\n    }"
          )
          replace(
           'if((mid===47&&map47FilesReady)||(mid===48&&map48FilesReady))return Promise.resolve();',
           'if((mid===47&&map47FilesReady)||(mid===48&&map48FilesReady)||(mid===49&&map49FilesReady))return Promise.resolve();'
          )
          replace(
           'var mapKeys=mid===48?map48Keys:map47Keys;',
           'var mapKeys=mid===49?map49Keys:(mid===48?map48Keys:map47Keys);'
          )
          replace(
           'if(mid===47)map47FilesReady=true;\n      else map48FilesReady=true;',
           'if(mid===47)map47FilesReady=true;\n      else if(mid===48)map48FilesReady=true;\n      else map49FilesReady=true;'
          )
          replace(
           'return (mid===47||mid===48) ? installMap47Files(mid).then(function(){return result;}) : result;',
           'return (mid===47||mid===48||mid===49) ? installMap47Files(mid).then(function(){return result;}) : result;'
          )
          replace(
           'if(mid<1||mid>48)return nativeMapLoad.apply(self,args);',
           'if(mid<1||mid>49)return nativeMapLoad.apply(self,args);'
          )
          replace("var version='V2.7';","var version='V2.8';")
          loader.write_text(s,'utf8')

          for name in ('index.html','knight/index.html'):
           p=root/name
           old=p.read_text('utf8')
           assert 'V2.7' in old
           p.write_text(
            old.replace('V2.7','V2.8').replace('v2.7','v2.8'),
            'utf8'
           )

          print('PASS Map049 native pack',len(entries),'files')
          print('PASS Map029, Map048, Map049 and Scripts mapping')
          PY
          .venv/bin/python -m py_compile build/v28/pack_map049.py
          .venv/bin/python build/v28/pack_map049.py
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Verify V2.8 native maps and file preservation
        shell: bash
        run: |
          set -euo pipefail
          cat > build/v28/verify_map049.py <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib,json,struct

          root=Path('site')
          work=Path('build/v22')

          before=json.loads(
           Path('build/v28/before.json').read_text('utf8')
          )
          after={
           str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
           for p in root.rglob('*') if p.is_file()
          }

          imgs=json.loads(
           (work/'map49-generated-files.json').read_text('utf8')
          )

          added={
           'knight/gameasync/Graphics/Panoramas/'+name
           for name in imgs
          }
          added.update({
           'knight/assets/map-049-v229r115.pack',
           'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap049.rxdata'
          })

          changed={
           'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap029.rxdata',
           'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap048.rxdata',
           'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMapInfos.rxdata',
           'knight/gameasync/Data/Scripts.rxdata',
           'knight/gameasync/mapping.js',
           'knight/js/sl-assets-v229r115.js',
           'index.html',
           'knight/index.html'
          }

          assert set(after)-set(before)==added,(
           'Unexpected additional files',
           sorted((set(after)-set(before))^added)[:40]
          )
          assert set(before)-set(after)==set()
          actual={k for k in before if before[k]!=after[k]}
          assert actual==changed,(
           'Unexpected original modification',sorted(actual^changed)
          )

          assert after['knight/assets/map-047-v241.pack']==before[
           'knight/assets/map-047-v241.pack']
          assert after[
           'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap047.rxdata'
          ]==before[
           'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap047.rxdata'
          ]

          pano=root/'knight/gameasync/Graphics/Panoramas'
          for name in imgs:
           with Image.open(pano/name) as im:
            size=(1536,768) if name.endswith('_GID.png') else (512,512)
            assert im.size==size,(name,im.size)

          pack=(root/'knight/assets/map-049-v229r115.pack').read_bytes()
          n=struct.unpack_from('<I',pack,0)[0]
          head=json.loads(pack[4:4+n])
          payload=memoryview(pack)[4+n:]
          assert head['kind']=='map' and head['map_id']==49
          assert len(head['files'])==len(imgs)+1
          assert len({r[0] for r in head['files']})==len(head['files'])

          for key,offset,length in head['files']:
           assert 0<=offset<len(payload) and length>=8
           assert offset+length<=len(payload)
           if key.startswith('graphics/panoramas/slti_49_'):
            name='SLTI_49_'+key.split('slti_49_',1)[1]+'.png'
            matches=[f for f in imgs if f.lower()==name.lower()]
            assert len(matches)==1
            assert bytes(payload[offset:offset+length])==(
             pano/matches[0]).read_bytes()

          mapping=(root/'knight/gameasync/mapping.js').read_text('utf8')
          assert mapping.lower().count('map049.rxdata')==1

          for name in imgs:
           p=pano/name
           marker='Graphics/Panoramas/'+name+'?h='+hashlib.md5(
            p.read_bytes()).hexdigest()
           assert mapping.count(marker)==1,name

          for name in (
           'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap029.rxdata',
           'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap048.rxdata',
           'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap049.rxdata',
           'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMapInfos.rxdata',
           'Scripts.rxdata'
          ):
           p=root/'knight/gameasync/Data'/name
           marker='Data/'+name+'?h='+hashlib.md5(
            p.read_bytes()).hexdigest()
           assert mapping.count(marker)==1,name

          loader=(root/'knight/js/sl-assets-v229r115.js').read_text('utf8')
          assert "var version='V2.8';" in loader
          assert 'map49Keys' in loader
          assert 'map49FilesReady' in loader
          assert 'mid<1||mid>49' in loader

          report=json.loads(
           (work/'map49-build-report.json').read_text('utf8')
          )
          assert report['sourceBlocks']==602
          assert report['sourceFiles']==790
          assert report['collision_passable']>0
          assert report['collision_blocked']>0

          print('PASS V2.7 original assets preserved except approved V2.8 changes')
          print('PASS Map049 source images',len(imgs))
          print('PASS original source blocks 602 and source files 790')
          print('PASS Map049 pack payload and all MD5 mappings')
          print('PASS Map048 and Map049 transfer data built')
          PY
          .venv/bin/python -m py_compile build/v28/verify_map049.py
          .venv/bin/python build/v28/verify_map049.py

      - name: Verify Map049 image preinstallation
        shell: bash
        run: |
          set -euo pipefail
          cat > build/v28/verify_browser_map049.js <<'JS'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const path=require('node:path');

          const root=path.resolve('site/knight');
          const installed=new Set();
          let callbacks=0;

          const context={
            console,TextDecoder,DataView,Uint8Array,ArrayBuffer,
            AbortController,setTimeout,clearTimeout,
            Promise,Error,Number,String,Object,
            document:{
              body:{appendChild(){}},
              createElement(tag){
                return {
                  tag,style:{},append(){},remove(){},
                  onclick:null,textContent:''
                };
              },
              getElementById(){return null}
            },
            window:{
              fileAsyncCache:{},
              loadFileAsync(fullPath,bitmap,callback){
                callbacks++;
                if(callbacks===3 &&
                   !installed.has('/game/Graphics/Panoramas/SLTI_49_GID.png'))
                  throw Error('Map049 graphics not installed');
                if(typeof callback==='function')callback();
              },
              getLazyAsset(){}
            },
            FS:{
              createPreloadedFile(
                folder,name,bytes,canRead,canWrite,ok,fail,
                dontCreate,canOwn,preFinish
              ){
                if(!(bytes instanceof Uint8Array)||bytes.length<8)
                  throw Error('Invalid image data');
                installed.add(folder+'/'+name);
                if(typeof preFinish==='function')preFinish();
                ok();
              },
              unlink(){}
            },
            fetch(url){
              const f=path.join(root,String(url));
              if(!fs.existsSync(f))
                return Promise.resolve({
                  ok:false,status:404,headers:new Map(),body:null
                });
              return Promise.resolve({
                ok:true,status:200,headers:new Map(),body:null,
                arrayBuffer(){
                  const b=fs.readFileSync(f);
                  return Promise.resolve(
                    b.buffer.slice(
                      b.byteOffset,b.byteOffset+b.byteLength
                    )
                  );
                }
              });
            }
          };

          vm.createContext(context);
          vm.runInContext(
            fs.readFileSync(path.join(root,'gameasync/mapping.js'),'utf8'),
            context,{filename:'mapping.js'}
          );
          vm.runInContext(
            fs.readFileSync(path.join(root,'js/sl-assets-v229r115.js'),'utf8'),
            context,{filename:'sl-assets-v229r115.js'}
          );

          function load(mid){
            return new Promise((resolve,reject)=>{
              const timer=setTimeout(
                ()=>reject(Error('Map'+mid+' load timeout')),30000
              );
              try{
                context.window.loadFileAsync(
                  'gameasync/Data/Map'+String(mid).padStart(3,'0')+'.rxdata',
                  false,()=>{
                    clearTimeout(timer);
                    resolve();
                  }
                );
              }catch(e){
                clearTimeout(timer);
                reject(e);
              }
            });
          }

          function pack(mid){
            const name=mid===47
              ?'map-047-v241.pack'
              :'map-'+String(mid).padStart(3,'0')+'-v229r115.pack';
            const content=fs.readFileSync(
              path.join(root,'assets',name)
            );
            const n=content.readUInt32LE(0);
            return JSON.parse(content.subarray(4,4+n));
          }

          async function main(){
            for(const mid of [47,48,49]){
              await load(mid);
              const h=pack(mid);
              const missing=h.files.filter(
                row=>!context.window.fileAsyncCache[row[0]]
              );
              if(missing.length)
                throw Error('Map'+mid+' skipped '+missing.length+' assets');
            }

            if(callbacks!==3)
              throw Error('Expected three native map loads');

            if(!installed.has(
              '/game/Graphics/Panoramas/SLTI_49_GID.png'
            ))throw Error('Map049 GID missing');

            if(!installed.has(
              '/game/Graphics/Tilesets/SLTI_Collision_Transparent.png'
            ))throw Error('Native collision tileset missing');

            console.log(
              'PASS Map047, Map048 and Map049 all preloaded'
            );
            console.log(
              'PASS Map049 graphics available before player movement'
            );
          }

          main().catch(e=>{
            console.error(e);
            process.exitCode=1;
          });
          JS
          node --check build/v28/verify_browser_map049.js
          node build/v28/verify_browser_map049.js

      - name: Publish V2.8 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
