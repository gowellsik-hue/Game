
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V241
# BUILD FAILURE FIX: V240 published guard was y>=HEIGHT, preventing all group lookups.
# V241 corrects to y<HEIGHT and enforces that exact condition in the build.
# BASE: V237 verified working Map047, run 41283407978.
# NATIVE SOURCE: V238 build (S32 Layer1+2 ground and Layer5 group geometry), run 41288672333.
# FIX: Separate original bare ground and Layer4; fade the real house/tree at 135/255.
# BOOT FIX: Keep V237 engine/startup; 194 staged images instead of V238's 289.
# BOOT FIX: Keep 55 KB original-group script instead of V238's 400 KB data literal.
# WALK: All required images are installed and decoded before map movement.
# WALK: No network request, Bitmap.new, Bitmap.dispose, or Sprite.new per movement.
# KEEP: Original Map047 384/385 collision data, 4-way movement, Pandora/NPCs,
#       other maps/monsters/items/saves, original source art and removed dungeons.
# FILE/TITLE: Unchanged except version label. SOURCE NOT APPLIED; mobile QA pending.
name: build-slknight-web.yml | V241 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V241 Download last working V237 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41283407978
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V241 Download native S32 underlay extracted by V238
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41288672333
          name: github-pages
          github-token: ${{ github.token }}
          path: native-source

      - name: V241 Verify working startup and original S32 material
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site source build
          test -s baseline/artifact.tar
          test -s native-source/artifact.tar
          tar -xf baseline/artifact.tar -C site
          tar -xf native-source/artifact.tar -C source --wildcards \
            './knight/gameasync/Data/Scripts.rxdata' \
            './knight/assets/map-047-v238.pack' \
            './knight/gameasync/Graphics/Panoramas/SLTI_47_G_C*.png'
          python3 - <<'PY_VERIFY'
          from pathlib import Path
          import hashlib,json,struct
          root=Path('site');n=Path('source')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          if len(before)!=5601:raise ValueError('Expected 5601 V237 game files')
          if 'V237' not in (root/'knight/index.html').read_text('utf8'):
              raise ValueError('Baseline must be V237: do not use black-screen V238 game')
          script='knight/gameasync/Data/Scripts.rxdata'
          if before[script]!='87c0a831061edc0c1d0307cac48125e6d434ea159000fa22dabcabc6d8644a82':
              raise ValueError('Baseline V237 RGSS mismatch')
          source_script=n/script
          if hashlib.sha256(source_script.read_bytes()).hexdigest()!='9a4ce12f08ed5abd61a7f0afe9eed85c839b698726d19ca2678a1893af319464':
              raise ValueError('Source V238 native group extraction mismatch')
          if before['knight/gameasync/Graphics/Panoramas/SLTI_47_C7_4.png']!='d1f321ba3012e9422e909b2ba4865dfcfaf188cb0671c459597f935537a26991':
              raise ValueError('Original Talking Island graphics changed')
          root_pack=root/'knight/assets/map-047-v234.pack'
          h=struct.unpack('<I',root_pack.read_bytes()[:4])[0]
          head=json.loads(root_pack.read_bytes()[4:4+h])
          if head['kind']!='map' or head['map_id']!=47 or len(head['files'])!=193:
              raise ValueError('V237 pre-entry preload must be 193 images')
          for x in range(12):
              for y in range(8):
                  for tag in ('','L4_'):
                      key=f'knight/gameasync/Graphics/Panoramas/SLTI_47_{tag}C{x}_{y}.png'
                      if key not in before:raise ValueError('Missing original graphics '+key)
                  if not (n/f'knight/gameasync/Graphics/Panoramas/SLTI_47_G_C{x}_{y}.png').is_file():
                      raise ValueError('Missing genuine S32 ground chunk')
          prefix='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          if prefix+'Map047.rxdata' not in before:raise ValueError('Map047 missing')
          for mid in (45,46):
              if prefix+f'Map{mid:03d}.rxdata' in before:raise ValueError('Deleted dungeon returned')
          Path('build/before.json').write_text(json.dumps(before,sort_keys=True))
          print('PASS verified working V237 startup, original S32 source, graphics and NPC maps')
          PY_VERIFY

      - name: V241 Recover exact S32 object IDs without runtime giant constants
        shell: bash
        run: |
          set -euo pipefail
          cat > build/extract_groups.rb <<'V241_GROUPS_RB'
          require 'json'
          require 'zlib'
          require 'digest'

          path='source/knight/gameasync/Data/Scripts.rxdata'
          raw=File.binread(path)
          expected='9a4ce12f08ed5abd61a7f0afe9eed85c839b698726d19ca2678a1893af319464'
          raise 'Source V238 RGSS script checksum changed' unless Digest::SHA256.hexdigest(raw)==expected
          scripts=Marshal.load(raw)
          raise 'V238 Layer4 source section missing' unless scripts.size==137 && scripts[-2][1]=='SLNativeLayerV238' && scripts[-1][1]=='Main'
          code=Zlib::Inflate.inflate(scripts[-2][2])
          group_hex=code[/GROUP_HEX='([0-9a-f]+)'/,1]
          boxes_json=code[/GROUP_BOXES=(\[\[.*?\]\])\n/,1]
          keys_json=code[/FOREGROUND_KEYS=(\[\[.*?\]\])\n/,1]
          raise 'Missing original Layer5 S32 group data' unless group_hex && boxes_json && keys_json
          raise 'Wrong source Layer5 grid' unless group_hex.length==363*238*4
          boxes=JSON.parse(boxes_json)
          keys=JSON.parse(keys_json)
          raise 'Wrong native original Layer4 groups' unless boxes.size==2949 && keys.size==73
          raise 'Group bounds outside original terrain' unless boxes.all?{|b|b.size==4 && b.all?{|v|v.is_a?(Integer)&&v.between?(0,65535)}}
          raise 'Invalid original Layer4 keys' unless keys.all?{|x,y|x.between?(0,11)&&y.between?(0,7)}
          house_group=group_hex[(130*363+187)*4,4].to_i(16)
          raise 'Original photographed roof group not retained' unless house_group==2081 && boxes[house_group]==[2936,2042,3068,2186]
          File.write('build/group_cells.hex',group_hex)
          File.write('build/group_bounds.hex',boxes.flatten.pack('n*').unpack1('H*'))
          File.write('build/foreground_keys.json',JSON.generate(keys))
          puts "PASS genuine V238 S32 data: #{boxes.size-1} groups, #{keys.size} upper chunks, roof group #{house_group}"
          V241_GROUPS_RB
          ruby -c build/extract_groups.rb
          ruby build/extract_groups.rb

      - name: V241 Replace flattened base graphics INSIDE the 193 original slots
        shell: bash
        run: |
          set -euo pipefail
          cat > build/repack.py <<'V241_REPACK_PY'
          from pathlib import Path
          import struct,json,re,zlib,hashlib
          base=Path('site');source=Path('source');out=Path('build')
          pack=base/'knight/assets/map-047-v234.pack'
          raw=pack.read_bytes(); n=struct.unpack_from('<I',raw)[0]
          manifest=json.loads(raw[4:4+n]);body=memoryview(raw)[4+n:]
          rows=manifest['files']
          if manifest['kind']!='map' or manifest['map_id']!=47 or len(rows)!=193:
              raise ValueError('Wrong known working V237 original Map047 assets')
          # Verify the source floor assets came from the same successful V238 artifact.
          source_pack=source/'knight/assets/map-047-v238.pack'
          if hashlib.sha256(source_pack.read_bytes()).hexdigest() != '93c1024ea7e1f08d0144ca3d54309b5461dfc0215679a3c824806c2fb8b317cc':
              raise ValueError('Original source reconstructed S32 underlay differs')
          blob=source_pack.read_bytes();start=struct.unpack_from('<I',blob)[0];shead=json.loads(blob[4:4+start]);sbody=memoryview(blob)[4+start:]
          sindex={row[0]:row for row in shead['files']}
          if len(shead['files'])!=289:raise ValueError('Wrong V238 underlay pack manifest')

          def checked_png(bytes_,name):
              if not bytes_.startswith(b'\x89PNG\r\n\x1a\n'):raise ValueError('Not PNG '+name)
              return bytes_

          def native_ground(x,y):
              p=source/f'knight/gameasync/Graphics/Panoramas/SLTI_47_G_C{x}_{y}.png'
              b=checked_png(p.read_bytes(),str(p))
              key=f'graphics/panoramas/slti_47_g_c{x}_{y}'
              row=sindex[key]
              if b!=bytes(sbody[row[1]:row[1]+row[2]]):raise ValueError('Ground original does not match source pack '+key)
              return b

          newrows=[];parts=[];offset=0;ground_count=0
          for key,start,length in rows:
              hit=re.fullmatch(r'graphics/panoramas/slti_47_c(\d+)_(\d+)',key)
              if hit:
                  x,y=map(int,hit.groups())
                  content=native_ground(x,y)
                  ground_count+=1
              else:
                  content=checked_png(bytes(body[start:start+length]),key)
              parts.append(content)
              newrows.append([key,offset,len(content)])
              offset+=len(content)
          if ground_count!=96:raise ValueError('Did not substitute 96 original floor images')
          # 363 x 238 RGB lookup: Red = group ID low 8 bits; Green = high 8 bits.
          hexgrid=(out/'group_cells.hex').read_text('ascii').strip()
          if len(hexgrid)!=363*238*4:raise ValueError('Wrong source Layer5 lookup grid')
          scan=bytearray()
          for y in range(238):
              scan.append(0)
              for x in range(363):
                  val=int(hexgrid[(y*363+x)*4:(y*363+x+1)*4],16)
                  if not 0<=val<2949:raise ValueError('Bad group pixel')
                  scan.extend([val&255,val>>8,0])
          def chunk(tag,payload):
              return struct.pack('>I',len(payload))+tag+payload+struct.pack('>I',zlib.crc32(tag+payload)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',363,238,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(bytes(scan),9))+chunk(b'IEND',b'')
          gid_path=base/'knight/gameasync/Graphics/Panoramas/SLTI_47_GID.png'
          gid_path.write_bytes(png)
          key='graphics/panoramas/slti_47_gid'
          newrows.append([key,offset,len(png)]);parts.append(png)
          if len(newrows)!=194 or newrows[:193]!=[[r[0],r[1],r[2]] for r in newrows[:193]]:
              raise ValueError('Internal manifest validation failed')
          header=json.dumps({'kind':'map','map_id':47,'files':newrows},separators=(',',':')).encode()
          result=struct.pack('<I',len(header))+header+b''.join(parts)
          target=base/'knight/assets/map-047-v241.pack'
          target.write_bytes(result)
          # Validate data roundtrip and preserve 97 existing NPC/shared/Layer4 pack entries.
          test=target.read_bytes();h=struct.unpack_from('<I',test)[0];m=json.loads(test[4:4+h]);b=test[4+h:]
          assert len(m['files'])==194 and m['files'][0][0]==rows[0][0]
          for i,(name,s,l) in enumerate(rows):
              if not re.fullmatch(r'graphics/panoramas/slti_47_c\d+_\d+',name):
                  ss,ll=m['files'][i][1:]
                  assert b[ss:ss+ll]==bytes(body[s:s+l]),'Unchanged original entry was modified'
          assert len(newrows)==194
          (out/'asset_metrics.json').write_text(json.dumps({'images':194,'bytes':len(result),'group_png':len(png),'ground_substituted':ground_count}))
          print('PASS 194 original-map resources: 96 ground underlays, 97 other originals, 1 S32 group atlas')
          print('PASS 193 original keys preserved, no additional 96 floor RAM assets, pack',len(result),'bytes')
          V241_REPACK_PY
          python3 build/repack.py

      - name: V241 Install separate ground, original Layer4 and group fade renderer
        shell: bash
        run: |
          set -euo pipefail
          cat > build/runtime_template.rb <<'V241_RUNTIME_RB'
          # V241 - native ground and Layer4 objects are separate image layers.
          # Graphics are downloaded and decoded only before Map047 gameplay begins.
          # The actor stays opaque; the original Layer4 group becomes translucent.
          # Layer5 lookup is a preloaded 363x238 Bitmap; never compile a giant
          # 345,576-character Ruby map literal on mobile. All runtime art is
          # prepared on Map047 entry, with zero graphics allocations on movement.
          module SLNativeLayerV241
            WIDTH=363
            HEIGHT=238
            GROUP_BOUNDS='__GROUP_BOUNDS__'
            FOREGROUND_KEYS=__FOREGROUND_KEYS__
            FADE_ALPHA=135
            def self.group_at(bitmap,x,y)
              return 0 unless bitmap && x>=0 && y>=0 && x<WIDTH && y<HEIGHT
              color=bitmap.get_pixel(x,y)
              color.red.to_i+256*color.green.to_i
            end
            def self.box_for(id)
              return nil if id<=0 || id>=2949
              p=GROUP_BOUNDS[id*16,16]
              return nil unless p && p.length==16
              [p[0,4].to_i(16),p[4,4].to_i(16),p[8,4].to_i(16),p[12,4].to_i(16)]
            end
          end
          class Sprite_Character
            alias sl_v241_normal_character_update update
            def update
              sl_v241_normal_character_update
              # The building/tree fades, not the character.
              if $game_map && $game_map.map_id==47 && $game_player &&
                 @character && @character.equal?($game_player)
                self.opacity=@character.opacity
              end
            end
          end

          class Spriteset_Map
            alias sl_v241_normal_initialize initialize
            alias sl_v241_normal_map_update update
            alias sl_v241_original_slti_update_terrain slti_update_terrain
            alias sl_v241_normal_dispose dispose

            def initialize
              @sl_v241_ready=false
              sl_v241_normal_initialize
              return unless $game_map && $game_map.map_id==47
              sl_v241_prepare
              @sl_v241_ready=true
              sl_v241_refresh
            end

            def sl_v241_prepare
              raise 'V241 incompatible Map047 terrain' unless @slti_floor==47 &&
                @slti_cols==12 && @slti_rows==8 && @slti_chunks.empty?
              # Game filesystem contains true ground in original floor resource slots.
              # Staged base resource keys now contain the original Layer1+2 ground pixels.
              12.times do |x|
                8.times do |y|
                  name='Graphics/Panoramas/SLTI_47_C'+x.to_s+'_'+y.to_s
                  sp=Sprite.new(@viewport2)
                  sp.bitmap=Bitmap.new(name)
                  sp.zoom_x=2.0
                  sp.zoom_y=2.0
                  sp.z=-1500
                  sp.visible=false
                  @slti_chunks[[x,y]]=sp
                end
              end
              raise 'V241 original ground incomplete' unless @slti_chunks.length==96

              @sl_v241_gid_bitmap=Bitmap.new('Graphics/Panoramas/SLTI_47_GID')
              @sl_v241_upper={}
              SLNativeLayerV241::FOREGROUND_KEYS.each do |key|
                x,y=key
                name='Graphics/Panoramas/SLTI_47_L4_C'+x.to_s+'_'+y.to_s
                sp=Sprite.new(@viewport2)
                sp.bitmap=Bitmap.new(name)
                sp.z=0
                sp.zoom_x=2.0
                sp.zoom_y=2.0
                sp.visible=false
                @sl_v241_upper[key]=sp
              end
              # Crop an active building's bounds out of the predecoded chunk image.
              # Fixed pool; no new Sprite or Bitmap allocations when the actor moves.
              @sl_v241_pieces=[]
              40.times do
                sp=Sprite.new(@viewport2)
                sp.zoom_x=2.0
                sp.zoom_y=2.0
                sp.visible=false
                @sl_v241_pieces << sp
              end
              @sl_v241_active={}
              @sl_v241_last_camera=nil
              @sl_v241_last_group=nil
            end

            def slti_update_terrain
              if $game_map && $game_map.map_id==47
                sl_v241_refresh if @sl_v241_ready
              else
                sl_v241_original_slti_update_terrain
              end
            end

            def sl_v241_show_piece(bitmap,chunkx,chunky,rect,z,opacity,camx,camy,index)
              return index if rect[2]<=rect[0] || rect[3]<=rect[1]
              sp=@sl_v241_pieces[index]
              raise 'V241 foreground group exceeds cached sprite pool' unless sp
              sp.bitmap=bitmap unless sp.bitmap.equal?(bitmap)
              sp.src_rect.set(rect[0],rect[1],rect[2]-rect[0],rect[3]-rect[1])
              sp.x=2*(chunkx*512+rect[0])-camx
              sp.y=2*(chunky*512+rect[1])-camy
              sp.z=z
              sp.opacity=opacity
              sp.visible=true
              index+1
            end

            def sl_v241_refresh
              camx=[$game_map.display_x.to_i/4,0].max
              camy=[$game_map.display_y.to_i/4,0].max
              vw=@viewport2.rect.width
              vh=@viewport2.rect.height
              return if vw<=0 || vh<=0
              return unless $game_player
              player_tile=[$game_player.x,$game_player.y]
              if @sl_v241_last_player_tile!=player_tile
                @sl_v241_last_player_tile=player_tile
                @sl_v241_last_group=SLNativeLayerV241.group_at(@sl_v241_gid_bitmap,$game_player.x,$game_player.y)
              end
              gid=@sl_v241_last_group||0
              return if @sl_v241_last_camera==[camx,camy] && @sl_v241_visible_group==gid
              @sl_v241_last_camera=[camx,camy]
              @sl_v241_visible_group=gid
              box=(gid>0 ? SLNativeLayerV241.box_for(gid) : nil)
              left=[camx/1024,0].max
              top=[camy/1024,0].max
              right=[(camx+vw-1)/1024,11].min
              bottom=[(camy+vh-1)/1024,7].min
              active={}
              if left<=right && top<=bottom
                (top..bottom).each do |y|
                  (left..right).each{|x|active[[x,y]]=true}
                end
              end
              prev=@sl_v241_active||{}
              prev.each_key do |key|
                next if active[key]
                base=@slti_chunks[key]
                base.visible=false if base
                upper=@sl_v241_upper[key]
                upper.visible=false if upper
              end
              piece_index=0
              active.each_key do |key|
                x,y=key
                ground=@slti_chunks[key]
                ground.visible=true
                ground.x=x*1024-camx
                ground.y=y*1024-camy
                upper=@sl_v241_upper[key]
                next unless upper
                upper.x=x*1024-camx
                upper.y=y*1024-camy
                # Crop only the current native Layer4 group, rather than making a whole
                # map/chunk semi-transparent. This includes a roof crossing chunks.
                l=box ? [box[0]-x*512,0].max : 0
                t=box ? [box[1]-y*512,0].max : 0
                r=box ? [box[2]-x*512,512].min : 0
                b=box ? [box[3]-y*512,512].min : 0
                if box && r>l && b>t
                  upper.visible=false
                  bitmap=upper.bitmap
                  # Non-overlapping four opaque rectangles, plus the faded group box.
                  piece_index=sl_v241_show_piece(bitmap,x,y,[0,0,512,t],0,255,camx,camy,piece_index)
                  piece_index=sl_v241_show_piece(bitmap,x,y,[0,b,512,512],0,255,camx,camy,piece_index)
                  piece_index=sl_v241_show_piece(bitmap,x,y,[0,t,l,b],0,255,camx,camy,piece_index)
                  piece_index=sl_v241_show_piece(bitmap,x,y,[r,t,512,b],0,255,camx,camy,piece_index)
                  piece_index=sl_v241_show_piece(bitmap,x,y,[l,t,r,b],9999,SLNativeLayerV241::FADE_ALPHA,camx,camy,piece_index)
                else
                  upper.visible=true
                  upper.opacity=255
                  upper.z=0
                end
              end
              while piece_index<@sl_v241_pieces.length
                @sl_v241_pieces[piece_index].visible=false
                piece_index+=1
              end
              @sl_v241_active=active
              @slti_r60_floor_ready=true
            end

            def update
              sl_v241_normal_map_update
              sl_v241_refresh if @sl_v241_ready && $game_map && $game_map.map_id==47
            end

            def dispose
              if @sl_v241_pieces
                @sl_v241_pieces.each do |sp|
                  next if sp.disposed?
                  sp.bitmap=nil
                  sp.dispose
                end
                @sl_v241_pieces=nil
              end
              if @sl_v241_upper
                @sl_v241_upper.each_value do |sp|
                  next if sp.disposed?
                  bitmap=sp.bitmap
                  sp.bitmap=nil
                  sp.dispose
                  bitmap.dispose if bitmap && !bitmap.disposed?
                end
                @sl_v241_upper=nil
              end
              if @sl_v241_gid_bitmap && !@sl_v241_gid_bitmap.disposed?
                @sl_v241_gid_bitmap.dispose
              end
              @sl_v241_gid_bitmap=nil
              # Original Spriteset_Map.dispose disposes the ground sprites and bitmaps.
              sl_v241_normal_dispose
            end
          end
          V241_RUNTIME_RB
          cat > build/patch_runtime.rb <<'V241_PATCH_RB'
          require 'json'
          require 'zlib'
          require 'digest'
          file='site/knight/gameasync/Data/Scripts.rxdata'
          raw=File.binread(file)
          expected='87c0a831061edc0c1d0307cac48125e6d434ea159000fa22dabcabc6d8644a82'
          raise 'Expected working V237 game scripts, not broken V238 scripts' unless Digest::SHA256.hexdigest(raw)==expected
          scripts=Marshal.load(raw)
          raise 'Working V237 section layout changed' unless scripts.length==137 && scripts[-2][1]=='SLNativeLayerV237' && scripts[-1][1]=='Main'
          bounds=File.read('build/group_bounds.hex').strip
          keys=JSON.parse(File.read('build/foreground_keys.json'))
          raise 'Wrong original S32 group bounds' unless bounds.length==2949*16
          raise 'Wrong Layer4 visible chunk count' unless keys.length==73
          source=File.read('build/runtime_template.rb')
          raise 'Unexpected renderer placeholders' unless source.scan('__GROUP_BOUNDS__').size==1 && source.scan('__FOREGROUND_KEYS__').size==1
          source=source.sub('__GROUP_BOUNDS__',bounds).sub('__FOREGROUND_KEYS__',JSON.generate(keys))
          raise 'V238 giant group lookup leaked' if source.include?('GROUP_HEX=') || source.include?('GROUP_BOXES=')
          raise 'Runtime source unexpectedly large' unless source.bytesize<66000
          raise 'Original artwork not placed in upper layer' unless source.include?('SLTI_47_L4_C') && source.include?('FADE_ALPHA=135')
          raise 'Ground source not correctly substituted' unless source.include?("name='Graphics/Panoramas/SLTI_47_C'")
          raise 'Missing preinstalled pixel lookup' unless source.include?("Bitmap.new('Graphics/Panoramas/SLTI_47_GID')")
          raise 'V241 group_at contains incorrect height guard' unless source.include?('bitmap && x>=0 && y>=0 && x<WIDTH && y<HEIGHT')
          raise 'V240 regression y>=HEIGHT returned zero for every map tile' if source.include?('y>=HEIGHT')
          raise 'Unapproved runtime PNG decode' if source.include?('Zlib::') || source.include?('Base64') || source.include?('createPreloadedFile')
          File.write('build/runtime_v241.rb',source)
          scripts[-2][1]='SLNativeLayerV241'
          scripts[-2][2]=Zlib::Deflate.deflate(source,9)
          File.binwrite(file,Marshal.dump(scripts))
          check=Marshal.load(File.binread(file));prior=Marshal.load(raw)
          raise 'Original 136 RGSS sections not preserved' unless check.size==prior.size && check[0...-2]==prior[0...-2] && check[-1]==prior[-1]
          puts 'PASS V237 startup sections unchanged, only native transparency section V241 replaced'
          puts "PASS compact 55KB S32 layer renderer, #{keys.size} Layer4 chunks, original group-specific fade"
          V241_PATCH_RB
          ruby -c build/runtime_template.rb
          ruby -c build/patch_runtime.rb
          ruby build/patch_runtime.rb
