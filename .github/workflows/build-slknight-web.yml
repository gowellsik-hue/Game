name: build-slknight-web.yml | V2.11 | Map048 Map049 Map050 Region-Only Extraction

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Restore exact V2.9 deployed game and snapshot every original file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site baseline build/v211
          RUN_ID="$(gh api 'repos/gowellsik-hue/Game/actions/workflows/build-slknight-web.yml/runs?status=success&per_page=100' --jq '.workflow_runs[] | select(.head_sha=="dd5303061eae982f978bb62bd8e813d014826826") | .id' | head -n 1)"
          test -n "$RUN_ID"
          gh run download "$RUN_ID" --repo gowellsik-hue/Game --name github-pages --dir baseline
          test -s baseline/artifact.tar
          tar -xf baseline/artifact.tar -C site
          rm -rf baseline
          test -s site/knight/gameasync/Data/Scripts.rxdata
          test -s site/knight/assets/map-048-v229r115.pack
          test -s site/knight/assets/map-049-v229r115.pack
          grep -q "var version='V2.9';" site/knight/js/sl-assets-v229r115.js
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet --disable-pip-version-check 'Pillow>=11,<13'
          python3 - <<'V211_INITIAL_SNAPSHOT'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          assert len(before)>8500
          Path('build/v211/before.json').write_text(json.dumps(before,sort_keys=True),'utf8')
          print('PASS exact last deployed V2.9 baseline',len(before))
          V211_INITIAL_SNAPSHOT
      - name: Fetch pinned original extractor, renderer and smoke test
        shell: bash
        run: |
          set -euo pipefail
          gh api 'repos/gowellsik-hue/Game/contents/.github/workflows/audit-sanctuary-maps.yml?ref=678bba77a7ab4bfa6ae7e1468933dc9bcc1e6540' --jq .content | base64 -d > build/v211/audit-sanctuary-maps.yml
          gh api 'repos/gowellsik-hue/Game/contents/.github/workflows/build-slknight-web.yml?ref=3c82c3b4ed77baab032e23cb6f4a1385755b377b' --jq .content | base64 -d > build/v211/v27-source.yml
          gh api 'repos/gowellsik-hue/Game/contents/.github/workflows/build-slknight-web.yml?ref=dd5303061eae982f978bb62bd8e813d014826826' --jq .content | base64 -d > build/v211/v29-source.yml
          test -s build/v211/audit-sanctuary-maps.yml
          test -s build/v211/v27-source.yml
          test -s build/v211/v29-source.yml
      - name: Region masks from the three re-extracted HTMLs (tile >=50% drawn)
        shell: bash
        run: |
          set -euo pipefail
          # SLKnight_Map048/049/050_ReExtracted.html sha256 prefixes: 3415aed3 / c1217c6b / 6bdd7217
          cat > build/v211/masks.txt <<'V211_REGION_MASKS_EOF'
