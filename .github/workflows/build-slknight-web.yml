            cmd(355,1,['$BufTime = 0'])
          ]
          expire4=[
            cmd(117,1,[589]),
            cmd(122,1,[109,109,0,0,0]),
            cmd(121,1,[172,172,1]),
            cmd(121,1,[1002,1002,1]),
            cmd(121,1,[1001,1001,1]),
