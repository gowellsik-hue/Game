
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R72
# BASE: successful deployed V229R71, run 40204488805.
# BOOT FIX: remove newly introduced runtime Zlib dependency from R71 wall masks.
# KEEP: R71 universal rear-wall DOWN+UP only, original 4-direction control.
# NO CHANGE: monster collisions/spawns, wall positions, floor PNGs, game resources.
name: build-slknight-web.yml | V229R72 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R72 Restore exact R71 deployed game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40204488805
          name: github-pages
          github-token: ${{ github.token }}
          path: r71

      - name: V229R72 Validate source and remove boot-time Zlib dependency only
        shell: bash
        run: |
          set -euo pipefail
          test -s r71/artifact.tar
          mkdir -p site build
          tar -xf r71/artifact.tar -C site
          python3 - <<'PY_BOOT_PATCH'
          from pathlib import Path
          import hashlib, json, base64, zlib, re, textwrap
          root=Path('site')
          game=root/'knight/gameasync'
          archive=game/'Data/Scripts.rxdata'
          actual={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          assert len(actual)==5517,('Unexpected deployed file count',len(actual))
          assert 'V229R71' in (root/'index.html').read_text('utf-8')
          assert 'V229R71' in (root/'knight/index.html').read_text('utf-8')
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==\
              'a2415b76d463599a1593b3673ac01a02145bd4b8bff910e417fc37331f77ca27',\
              'Not the audited deployed R71 script'
          Path('build/r72-original-files.json').write_text(json.dumps(actual,sort_keys=True))
          print('PASS original 5517-file R71 deployment verified')
          PY_BOOT_PATCH

          ruby -rzlib - <<'RB_EXTRACT'
          a=Marshal.load(File.binread('site/knight/gameasync/Data/Scripts.rxdata'))
          raise 'Wrong engine script count' unless a.size==136
          src=Zlib::Inflate.inflate(a[134][2]).force_encoding('UTF-8')
          raise 'R71 player-only rear step missing' unless src.include?('module SLTI_Rear71')
          raise 'R71 original collision modified' unless src.include?(%q{return false if other.x==nx && other.y==ny && other.character_name!=''})
          raise 'No-slide rule missing' unless src.include?('No slide or axis fallback at blocked walls.')
          raise 'Unexpected movement mapping' unless src.include?('moves={2=>[-1,1],4=>[-1,-1],6=>[1,1],8=>[1,-1]')
          File.binwrite('build/r71-script134.rb',src)
          puts 'PASS R71 136-script engine, unchanged monster collision and 4-button movement'
          RB_EXTRACT

          python3 - <<'PY_REPACK_MASK'
          from pathlib import Path
          import re,hashlib,base64,zlib,textwrap
          src=Path('build/r71-script134.rb').read_text('utf-8')
          pos=src.index('module SLTI_Rear71')
          before=src[:pos]
          module=src[pos:]
          pat=re.compile(r"(?P<mid>45|46)=>Zlib::Inflate\.inflate\('(?P<blob>[A-Za-z0-9+/=]+)'\.unpack\('m'\)\[0\]\)")
          expected={45:(8192,'be9a6253d460d6b757221412054f4225dab3cc44eb2ab804fd2d3f07a3441439',595),
                    46:(10240,'789aba521b448328f526c7dfec3294a751cc8df83455aaa0e4073969f6ede857',733)}
          used=[]
          def rewrite(match):
              mid=int(match.group('mid'))
              assert mid not in used,('Duplicate wall map',mid)
              used.append(mid)
              mask=zlib.decompress(base64.b64decode(match.group('blob'),validate=True))
              size,sha,count=expected[mid]
              assert len(mask)==size,(mid,'Incorrect decoded wall mask size')
              assert hashlib.sha256(mask).hexdigest()==sha,(mid,'Wall data changed')
              assert sum(b.bit_count() for b in mask)==count,(mid,'Wrong rear step candidates')
              # Decode with the same Ruby String#unpack used by original R67.
              # No Zlib constant, require, or inflate call in runtime Ruby.
              encoded=base64.b64encode(mask).decode('ascii')
              pieces=textwrap.wrap(encoded,120)
              quoted=',\n      '.join('"'+p+'"' for p in pieces)
              return f'{mid}=>[\n      {quoted}\n    ].join.unpack(\'m\')[0]'
          after,n=pat.subn(rewrite,module)
          assert n==2 and sorted(used)==[45,46],('Unexpected source mask form',n,used)
          assert 'Zlib' not in after, 'Boot-time Ruby Zlib dependency remains'
          fixed=before+after
          assert fixed.startswith(before), 'Existing R71 engine code changed'
          assert fixed.count('module SLTI_Rear71')==1
          Path('build/r72-script134.rb').write_text(fixed,encoding='utf-8')
          print('PASS decoded both original R71 masks outside game, kept exact 595/733 candidates')
          PY_REPACK_MASK
          ruby -c build/r72-script134.rb

      - name: V229R72 Test Ruby startup without Zlib and preserve gameplay changes
        shell: bash
        run: |
          set -euo pipefail
          # This boot test is deliberately run WITHOUT loading zlib.
          # Previous R71 failed this test at module evaluation (NameError: Zlib).
          ruby --disable-gems - <<'RB_BOOT'
          raise 'Test accidentally loaded Zlib' if defined?(Zlib)
          source=File.read('build/r72-script134.rb',encoding:'UTF-8')
          start=source.index('module SLTI_Rear71')
          raise 'Missing R71 rear module' if start==nil
          class Game_Character
            def slti_native66_move(*args);false;end
            def moveto(*args);end
          end
          eval(source[start..-1])
          raise 'Could not initialize wall masks at startup' unless defined?(SLTI_Rear71::MASK)
          [45,46].each do |mid|
            mask=SLTI_Rear71::MASK[mid]
            expected=mid==45 ? 8192 : 10240
            count=mid==45 ? 595 : 733
            raise 'Malformed mask' unless mask.bytesize==expected
            actual=mask.unpack('C*').inject(0){|sum,b|sum+b.to_s(2).count('1')}
            raise 'Rear-cell count changed' unless actual==count
            puts "PASS Map#{mid} runtime loads #{actual} rear cells without Zlib"
          end
          raise 'Original rear-step target missing' unless SLTI_Rear71.down?(45,32656,32815)
          raise 'Additional wall crossing allowed' if SLTI_Rear71.down?(45,32655,32816)
          puts 'PASS startup module evaluated without Zlib; reverse-only rear step preserved'
          RB_BOOT

          python3 - <<'PY_GAME_GUARDS'
          from pathlib import Path
          a=Path('build/r71-script134.rb').read_text('utf-8')
          b=Path('build/r72-script134.rb').read_text('utf-8')
          start=a.index('module SLTI_Rear71')
          assert b[:start]==a[:start], 'Original R71 engine or collision was modified'
          for marker in ('slti_r71_original_move','slti_r71_rear_move','slti_r71_rear_from',
                         'No slide or axis fallback at blocked walls.',
                         "return false if other.x==nx && other.y==ny && other.character_name!=''"):
              assert marker in b,(marker,'Missing original logic')
          assert b.count('def slti_native66_move(dir,turn=true)')==a.count('def slti_native66_move(dir,turn=true)')
          print('PASS original wall coordinates, 4-button control, monster collision and spawn unchanged')
          PY_GAME_GUARDS

      - name: V229R72 Repack one engine script and refresh web hashes
        shell: bash
        run: |
          set -euo pipefail
          ruby -rzlib - <<'RB_PACK'
          path='site/knight/gameasync/Data/Scripts.rxdata'
          a=Marshal.load(File.binread(path))
          old=Marshal.load(File.binread(path))
          raise 'Wrong script count' unless a.size==136
          original=Zlib::Inflate.inflate(a[134][2]).force_encoding('UTF-8')
          raise 'R71 baseline mismatch' unless original==File.read('build/r71-script134.rb',encoding:'UTF-8')
          a[134][2]=Zlib::Deflate.deflate(File.binread('build/r72-script134.rb'))
          raise 'Unexpected engine script changed' unless a.each_index.all?{|i|i==134 || a[i]==old[i]}
          File.binwrite(path,Marshal.dump(a))
          verify=Marshal.load(File.binread(path))
          raise 'Game patch missing' unless Zlib::Inflate.inflate(verify[134][2]).include?('module SLTI_Rear71')
          puts 'PASS 135 untouched Ruby scripts; only startup-safe mask encoding changed'
          RB_PACK
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import hashlib,json,re
          root=Path('site')
          game=root/'knight/gameasync'
          mapping=game/'mapping.js'
          text=mapping.read_text('utf-8')
          digest=hashlib.md5((game/'Data/Scripts.rxdata').read_bytes()).hexdigest()
          text,n=re.subn(r'Data/Scripts\.rxdata\?h=[0-9a-f]{32}',
                         lambda match:'Data/Scripts.rxdata?h='+digest,text)
          assert n==1,n
          mapping.write_text(text,encoding='utf-8')
          for name in ('index.html','knight/index.html'):
              path=root/name
              original=path.read_text('utf-8')
              assert 'V229R71' in original,name
              path.write_text(original.replace('V229R71','V229R72').replace('v229r71','v229r72'),encoding='utf-8')
          initial=json.loads(Path('build/r72-original-files.json').read_text('utf-8'))
          final={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert len(final)==5517 and final.keys()==initial.keys()
          changed={p for p in final if initial[p]!=final[p]}
          allowed={'index.html','knight/index.html','knight/gameasync/mapping.js',
                   'knight/gameasync/Data/Scripts.rxdata'}
          assert changed==allowed,('Unrequested game edits',changed^allowed)
          print('PASS complete 5517-file game; only startup script/hash/version labels changed')
          PY_FINAL
          node --check site/knight/gameasync/mapping.js

      - name: V229R72 Upload full game to existing GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
