
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V238
# BASE: Successfully deployed V237, run 41283407978.
# FIX: Existing Panorama already contains opaque houses/trees; fading extra
#      Layer4 imagery cannot reveal the ground hidden inside that Panorama.
# ACTUAL CHANGE: Reconstruct true Layer1+Layer2 underlay from native Map0 S32.
# ACTUAL CHANGE: Draw original Layer4 as a separate fully visible object layer.
# ACTUAL CHANGE: Native Layer5 group fades the HOUSE/TREE graphic (135/255),
#                not the actor. Groups spanning image chunks fade together.
# PRELOAD: Original 193 images + 96 ground-only tiles; install all 289 files
#          before entering Map047, decode all ground/foreground bitmaps once.
# MOVEMENT: No network requests, Bitmap.new/Bitmap.dispose or Sprite.new.
# PRESERVE: All existing 384/385 collision cells, 4-way movement, NPCs,
#           Pandora, original graphics, other maps, characters and controls.
# KEEP DELETED: Talking Island Dungeon Map045 and Map046.
# STATUS: Source/local visual and logic tests passed; mobile verification pending.
name: build-slknight-web.yml | V238 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: V238 Download last deployed V237 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41283407978
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V238 Preserve original game and record hashes
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build source
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,struct
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          if len(before)!=5601:raise ValueError('Wrong original V237 file inventory')
          if 'V237' not in (root/'knight/index.html').read_text('utf8'):
              raise ValueError('Wrong deployed V237 baseline')
          file='knight/gameasync/Data/Scripts.rxdata'
          if before[file]!='87c0a831061edc0c1d0307cac48125e6d434ea159000fa22dabcabc6d8644a82':
              raise ValueError('Scripts.rxdata does not match successful V237')
          prefix='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          if prefix+'Map047.rxdata' not in before:raise ValueError('Original Map047 missing')
          for mid in (45,46):
              if prefix+f'Map{mid:03d}.rxdata' in before:
                  raise ValueError('Deleted dungeon returned')
          original='knight/gameasync/Graphics/Panoramas/SLTI_47_C7_4.png'
          if before[original]!='d1f321ba3012e9422e909b2ba4865dfcfaf188cb0671c459597f935537a26991':
              raise ValueError('Original Panorama changed')
          p=root/'knight/assets/map-047-v234.pack'
          with p.open('rb') as f:
              h=struct.unpack('<I',f.read(4))[0]
              manifest=json.loads(f.read(h))
          if manifest.get('kind')!='map' or manifest.get('map_id')!=47 or len(manifest['files'])!=193:
              raise ValueError('Original 193 images not staged')
          for x in range(12):
              for y in range(8):
                  for tag in ('','L4_'):
                      path=f'knight/gameasync/Graphics/Panoramas/SLTI_47_{tag}C{x}_{y}.png'
                      if path not in before:raise ValueError('Original image missing '+path)
          Path('build/before.json').write_text(json.dumps(before,sort_keys=True),'utf8')
          print('PASS V237 deployed original, original 193-image pack, NPCs and deleted dungeon')
          PY

      - name: V238 Retrieve genuine original S32 and Tile.idx/Tile.pak
        shell: bash
        run: |
          set -euo pipefail
          gh release download v1.0.0 -R gowellsik-hue/Game   -p 'Sanctuary.of.Aden.-.Copy.z32'   -p 'Sanctuary.of.Aden.-.Copy.z33'   -p 'Sanctuary.of.Aden.-.Copy.z34'   -p 'Sanctuary.of.Aden.-.Copy.z35'   -p 'Sanctuary.of.Aden.-.Copy.z36'   -p 'Sanctuary.of.Aden.-.Copy.zip'   -D source --clobber
          for n in 32 33 34 35 36; do test -s "source/Sanctuary.of.Aden.-.Copy.z${n}"; done
          test -s source/Sanctuary.of.Aden.-.Copy.zip
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet --disable-pip-version-check 'Pillow>=11,<13'

      - name: V238 Reconstruct original Layer1/2 ground and Layer4 object bounds
        shell: bash
        run: |
          set -euo pipefail
          cat > build/build_ground.py <<'V238_NATIVE_PY'
          from pathlib import Path
          from collections import Counter,defaultdict
          from functools import lru_cache
          import struct, zlib, json, re, sys, time, hashlib
          from PIL import Image

          ROOT=Path(sys.argv[1] if len(sys.argv)>1 else '/mnt/data/work_layer')
          SITE=Path(sys.argv[2] if len(sys.argv)>2 else '/mnt/data/v237_e2e/site')
          OUT=Path(sys.argv[3] if len(sys.argv)>3 else '/mnt/data/v238_work')
          OUT.mkdir(parents=True,exist_ok=True)
          STEM=('Sanctuary.of.Aden.-.Copy' if (ROOT/'Sanctuary.of.Aden.-.Copy.zip').is_file() else 'Sanctuary of Aden - Copy')
          raw=(ROOT/(STEM+'.zip')).read_bytes()
          entries=[];p=0
          while True:
           p=raw.find(b'PK\x01\x02',p)
           if p<0 or p+46>len(raw):break
           h=struct.unpack_from('<IHHHHHHIIIHHHHHII',raw,p)
           n,ext,cmt=h[10:13];end=p+46+n+ext+cmt
           if not (0<n<=1024 and end<=len(raw)):
            p+=4;continue
           filename=raw[p+46:p+46+n].decode('utf8' if h[3]&0x800 else 'cp949','replace').replace('\\','/')
           if re.search(r'/map/0/[a-f0-9]{8}\.s32$',filename,re.I) or filename.lower().endswith(('/tile.idx','/tile.pak')):
            entries.append(dict(name=filename,method=h[4],crc=h[7],comp=h[8],size=h[9],disk=h[13],off=h[16]))
           p=end
          maps=[e for e in entries if e['name'].endswith('.s32')]
          if len(maps)!=64:raise ValueError('Expected 64 original S32 map/0 regions, got '+str(len(maps)))
          @lru_cache(maxsize=2)
          def volume(d):
           if not 0<=d<=45:raise ValueError('S32 split disk missing '+str(d))
           filename=STEM+(f'.z{d+1:02d}' if d<45 else '.zip')
           return (ROOT/filename).read_bytes()
          def read_span(d,o,length):
           out=bytearray()
           while len(out)<length:
            b=volume(d)
            if o>len(b):raise ValueError('bad split ZIP local offset')
            n=min(length-len(out),len(b)-o)
            if n==0:d+=1;o=0;continue
            out.extend(b[o:o+n]);o+=n
            if o==len(b):d+=1;o=0
           return bytes(out)
          def advance(d,o,length):
           while length:
            b=volume(d);n=min(length,len(b)-o)
            if n<0:raise ValueError('Bad local header')
            length-=n;o+=n
            if o==len(b):d+=1;o=0
           return d,o
          def extract(e):
           d,o=e['disk'],e['off'];hd=read_span(d,o,30)
           if hd[:4]!=b'PK\x03\x04':raise ValueError('Missing original ZIP entry '+e['name'])
           n,ex=struct.unpack_from('<HH',hd,26)
           d,o=advance(d,o,30+n+ex)
           blob=read_span(d,o,e['comp'])
           data=zlib.decompress(blob,-15) if e['method']==8 else blob
           if len(data)!=e['size'] or zlib.crc32(data)&0xffffffff!=e['crc']:
            raise ValueError('Original file validation failed '+e['name'])
           return data
          idx=extract(next(e for e in entries if e['name'].lower().endswith('/tile.idx')))
          pak=extract(next(e for e in entries if e['name'].lower().endswith('/tile.pak')))
          n=struct.unpack_from('<I',idx,0)[0]
          if n<4000 or len(idx)!=4+28*n:raise ValueError('Wrong original Tile.idx')
          files={}
          for i in range(n):
           o=4+i*28
           offset=struct.unpack_from('<I',idx,o)[0];size=struct.unpack_from('<I',idx,o+24)[0]
           name=idx[o+4:o+24].split(b'\0')[0].decode('ascii','replace').lower()
           files[name]=(offset,size)
          @lru_cache(maxsize=14000)
          def tile_bitmap(tile,index):
           item=files.get(f'{tile}.til')
           if item is None:return None
           offset,size=item
           blob=memoryview(pak)[offset:offset+size]
           if len(blob)<12:return None
           frames=struct.unpack_from('<I',blob,0)[0]
           if index>=frames or frames>2048:return None
           base=4+4*(frames+1)
           a,b=struct.unpack_from('<II',blob,4+index*4)
           if a>=b or base+b>len(blob):return None
           frame=blob[base+a:base+b];typ=frame[0]
           if typ not in (0,1,2,3,6,7,8,9,16,17,18,19,22,23,34,35):return None
           rgba=bytearray(24*24*4)
           def dot(x,y,val):
            if 0<=x<24 and 0<=y<24:
             j=4*(y*24+x)
             rgba[j]=(val>>10&31)*255//31
             rgba[j+1]=(val>>5&31)*255//31
             rgba[j+2]=(val&31)*255//31
             rgba[j+3]=255
           p=1
           try:
            if not typ&2:
             for y in range(24):
              q=(y+1)*2 if y<12 else (23-y)*2
              x0=0 if typ&1 else 24-q
              for x in range(q):
               val=struct.unpack_from('<H',frame,p)[0];p+=2;dot(x0+x,y,val)
            else:
             xo,yo,_,rows=struct.unpack_from('<BBBB',frame,p);p+=4
             for y in range(rows):
              x=xo;segments=frame[p];p+=1
              for seg in range(segments):
               x+=frame[p]//2;p+=1
               span=frame[p];p+=1
               for j in range(span):
                val=struct.unpack_from('<H',frame,p)[0];p+=2;dot(x+j,yo+y,val)
               x+=span
           except (struct.error,IndexError):return None
           return Image.frombytes('RGBA',(24,24),bytes(rgba)).resize((12,12),Image.Resampling.NEAREST)

          W,H=6144,4096;GAME_W,GAME_H=363,238
          canvas=Image.new('RGBA',(W,H),(0,0,0,255))
          # Composite all original floor tiles first, then original Layer2 overlays.
          base_floor=[];layer2=[];groups={};layer5=[];bounds={};sizes={};stats=Counter()
          start=time.monotonic()
          for e in maps:
           data=extract(e)
           stem=e['name'].rsplit('/',1)[-1].split('.')[0].lower()
           bx=int(stem[:4],16);by=int(stem[4:8],16)
           ox=(bx-0x7fff)*64+0x7fff-63;oy=(by-0x7fff)*64+0x7fff-63
           for yy in range(64):
            for xx in range(128):
             index,tile,_=struct.unpack_from('<BHB',data,4*(yy*128+xx))
             nx=ox+xx//2;ny=oy+yy
             x=12*(nx+ny-65024)-2800+12*(xx&1)
             y=6*(ny-nx)-166
             if x>-12 and y>-12 and x<W and y<H:
              base_floor.append((x,y,tile,index));stats['floor']+=1
           p=128*64*4;cnt=struct.unpack_from('<H',data,p)[0];p+=2
           for j in range(cnt):
            xx,yy,index,tile,_=struct.unpack_from('<BBBHB',data,p);p+=6
            nx=ox+xx//2;ny=oy+yy
            x=12*(nx+ny-65024)-2800+12*(xx&1)
            y=6*(ny-nx)-166
            if x>-12 and y>-12 and x<W and y<H:
             layer2.append((x,y,tile,index));stats['layer2']+=1
           p+=64*64*4
           ngroups=struct.unpack_from('<i',data,p)[0];p+=4
           if not 0<=ngroups<100000:raise ValueError('Original Layer4 group count invalid')
           for j in range(ngroups):
            gid,count=struct.unpack_from('<hH',data,p);p+=4
            key=(stem,gid)
            sizes[key]=count
            bound=[W,H,-1,-1]
            for k in range(count):
             xx,yy,layer,index,tile,_=struct.unpack_from('<BBBBhB',data,p);p+=7
             nx=ox+xx//2;ny=oy+yy
             x=12*(nx+ny-65024)-2800+12*(xx&1)
             y=6*(ny-nx)-166
             if tile>=0 and x<W and y<H and x+12>0 and y+12>0:
              bound[0]=min(x,bound[0]);bound[1]=min(y,bound[1])
              bound[2]=max(x+12,bound[2]);bound[3]=max(y+12,bound[3])
            if bound[2]>bound[0] and bound[3]>bound[1]:
             bounds[key]=[max(0,bound[0]),max(0,bound[1]),min(W,bound[2]),min(H,bound[3])]
           n5=struct.unpack_from('<i',data,p)[0];p+=4
           if not 0<=n5<200000:raise ValueError('Invalid native Layer5 count')
           for j in range(n5):
            xx,yy,gid,typ=struct.unpack_from('<BBHB',data,p+j*5)
            nx=ox+xx//2;ny=oy+yy
            x=12*(nx+ny-65024)-2800+6*(xx&1)
            y=6*(ny-nx)-166
            cx=(x+8)//16;cy=(y+8)//16
            if 0<=cx<GAME_W and 0<=cy<GAME_H:
             layer5.append((cx,cy,stem,gid,typ))
          print('S32 parsed',len(base_floor),len(layer2),len(bounds),len(layer5),'elapsed',round(time.monotonic()-start,2),flush=True)
          for group in (base_floor,layer2):
           for i,(x,y,tile,index) in enumerate(group):
            bitmap=tile_bitmap(tile,index)
            if bitmap is not None: canvas.alpha_composite(bitmap,(x,y))
            if i%70000==0 and i>0:print('draw',i,'elapsed',round(time.monotonic()-start,1),flush=True)
          print('floor-only rendered',round(time.monotonic()-start,2),flush=True)
          # Map only genuine Layer5-backed groups to RPG tiles; group identity scoped to S32 block.
          referenced={k for cx,cy,stem,gid,typ in layer5 for k in [(stem,gid)] if k in bounds}
          ordered=sorted(referenced)
          serial={key:i+1 for i,key in enumerate(ordered)}
          boxes=[[0,0,0,0]]+[bounds[key] for key in ordered]
          cell_groups=[0]*(GAME_W*GAME_H)
          cell_weights=[-1]*(GAME_W*GAME_H)
          for cx,cy,stem,gid,typ in layer5:
           key=(stem,gid)
           if key not in serial:continue
           i=cy*GAME_W+cx
           score=sizes[key]
           if score>cell_weights[i]:cell_groups[i]=serial[key];cell_weights[i]=score
          if cell_groups[130*GAME_W+187]==0:raise ValueError('Screenshot house Layer5 group missing')
          (OUT/'map047_group_cells.hex').write_text(''.join(f'{v:04x}' for v in cell_groups),'ascii')
          (OUT/'map047_group_boxes.json').write_text(json.dumps(boxes,separators=(',',':')),'utf8')
          (OUT/'map047_group_stats.json').write_text(json.dumps({'groups':len(ordered),'cells':sum(v!=0 for v in cell_groups),'house_group':cell_groups[130*GAME_W+187],'house_bounds':boxes[cell_groups[130*GAME_W+187]],'floor':len(base_floor),'layer2':len(layer2)},indent=2),'utf8')
          print('Map cells mapped',sum(bool(v) for v in cell_groups),'groups',len(ordered),'house',boxes[cell_groups[130*GAME_W+187]],'elapsed',round(time.monotonic()-start,1),flush=True)
          # Store newly extracted *underlay* assets without overwriting any current game art.
          panodir=SITE/'knight/gameasync/Graphics/Panoramas';panodir.mkdir(parents=True,exist_ok=True)
          for x in range(12):
           for y in range(8):
            part=canvas.crop((512*x,512*y,512*(x+1),512*(y+1))).convert('RGB')
            part.save(panodir/f'SLTI_47_G_C{x}_{y}.png',optimize=True)
          # The original Layer4 source assets remain untouched; only their non-empty keys are loaded.
          fg=[]
          for gx in range(12):
           for gy in range(8):
            pic=Image.open(panodir/f'SLTI_47_L4_C{gx}_{gy}.png')
            if pic.mode!='RGBA' or pic.size!=(512,512):raise ValueError('Invalid original Layer4 RGBA file')
            if pic.getextrema()[3][1]>0:fg.append([gx,gy])
          if len(fg)!=73:raise ValueError('Original 73 foreground chunks changed')
          (OUT/'foreground_keys.json').write_text(json.dumps(fg,separators=(',',':')),'utf8')
          print('96 ground-only PNGs, 73 native Layer4 keys prepared',round(time.monotonic()-start,1),flush=True)
          # Verify exact alignment: old flattened Panorama should closely equal floor + native layer4.
          # Difference can arise from the original S32 renderer's tile overlap order near boundaries.
          probe=(5,4)
          base=canvas.crop((512*probe[0],512*probe[1],512*(probe[0]+1),512*(probe[1]+1)))
          l4=Image.open(panodir/f'SLTI_47_L4_C{probe[0]}_{probe[1]}.png').convert('RGBA')
          base.alpha_composite(l4)
          original=Image.open(panodir/f'SLTI_47_C{probe[0]}_{probe[1]}.png').convert('RGB')
          from PIL import ImageChops,ImageStat
          diff=ImageChops.difference(base.convert('RGB'),original)
          mae=sum(ImageStat.Stat(diff).mean)/3.0
          if mae>25:raise ValueError('Native ground/Layer4 alignment failed: mean error '+str(mae))
          print('S32 ground + Layer4 original image alignment MAE',round(mae,3),'elapsed',round(time.monotonic()-start,1),flush=True)
          base.convert('RGB').save(OUT/'v238_house_composite.png')
          canvas.crop((512*probe[0],512*probe[1],512*(probe[0]+1),512*(probe[1]+1))).convert('RGB').save(OUT/'v238_house_ground.png')
          V238_NATIVE_PY
          .venv/bin/python build/build_ground.py source site build
          test -s build/map047_group_cells.hex
          test -s build/map047_group_boxes.json
          test -s build/foreground_keys.json
          test -s site/knight/gameasync/Graphics/Panoramas/SLTI_47_G_C5_4.png

      - name: V238 Replace V237 renderer with native ground and object fade
        shell: bash
        run: |
          set -euo pipefail
          cat > build/runtime_template.rb <<'V238_RUNTIME_RB'
          # V238 - native ground and Layer4 objects are separate image layers.
          # Graphics are downloaded and decoded only before Map047 gameplay begins.
          # The actor stays opaque; the original Layer4 group becomes translucent.
          module SLNativeLayerV238
            WIDTH=363
            HEIGHT=238
            GROUP_HEX='__GROUP_HEX__'
            GROUP_BOXES=__GROUP_BOXES__
            FOREGROUND_KEYS=__FG_KEYS__
            FADE_ALPHA=135

            def self.group_at(x,y)
              return 0 if x<0 || y<0 || x>=WIDTH || y>=HEIGHT
              part=GROUP_HEX[(y*WIDTH+x)*4,4]
              part ? part.to_i(16) : 0
            end
            def self.box_for(x,y)
              id=group_at(x,y)
              id>0 ? GROUP_BOXES[id] : nil
            end
          end

          class Sprite_Character
            alias sl_v238_normal_character_update update
            def update
              sl_v238_normal_character_update
              # The building/tree fades, not the character.
              if $game_map && $game_map.map_id==47 && $game_player &&
                 @character && @character.equal?($game_player)
                self.opacity=@character.opacity
              end
            end
          end

          class Spriteset_Map
            alias sl_v238_normal_initialize initialize
            alias sl_v238_normal_map_update update
            alias sl_v238_original_slti_update_terrain slti_update_terrain
            alias sl_v238_normal_dispose dispose

            def initialize
              @sl_v238_ready=false
              sl_v238_normal_initialize
              return unless $game_map && $game_map.map_id==47
              sl_v238_prepare
              @sl_v238_ready=true
              sl_v238_refresh
            end

            def sl_v238_prepare
              raise 'V238 incompatible Map047 terrain' unless @slti_floor==47 &&
                @slti_cols==12 && @slti_rows==8 && @slti_chunks.empty?
              # The original 96 rendered Panorama chunks remain untouched on disk.
              # Use instead the 96 genuine Layer1+2 ground chunks reconstructed by S32.
              12.times do |x|
                8.times do |y|
                  name='Graphics/Panoramas/SLTI_47_G_C'+x.to_s+'_'+y.to_s
                  sp=Sprite.new(@viewport2)
                  sp.bitmap=Bitmap.new(name)
                  sp.zoom_x=2.0
                  sp.zoom_y=2.0
                  sp.z=-1500
                  sp.visible=false
                  @slti_chunks[[x,y]]=sp
                end
              end
              raise 'V238 original ground incomplete' unless @slti_chunks.length==96

              @sl_v238_upper={}
              SLNativeLayerV238::FOREGROUND_KEYS.each do |key|
                x,y=key
                name='Graphics/Panoramas/SLTI_47_L4_C'+x.to_s+'_'+y.to_s
                sp=Sprite.new(@viewport2)
                sp.bitmap=Bitmap.new(name)
                sp.z=0
                sp.zoom_x=2.0
                sp.zoom_y=2.0
                sp.visible=false
                @sl_v238_upper[key]=sp
              end
              # Crop an active building's bounds out of the predecoded chunk image.
              # Fixed pool; no new Sprite or Bitmap allocations when the actor moves.
              @sl_v238_pieces=[]
              40.times do
                sp=Sprite.new(@viewport2)
                sp.zoom_x=2.0
                sp.zoom_y=2.0
                sp.visible=false
                @sl_v238_pieces << sp
              end
              @sl_v238_active={}
              @sl_v238_last_camera=nil
              @sl_v238_last_group=nil
            end

            def slti_update_terrain
              if $game_map && $game_map.map_id==47
                sl_v238_refresh if @sl_v238_ready
              else
                sl_v238_original_slti_update_terrain
              end
            end

            def sl_v238_show_piece(bitmap,chunkx,chunky,rect,z,opacity,camx,camy,index)
              return index if rect[2]<=rect[0] || rect[3]<=rect[1]
              sp=@sl_v238_pieces[index]
              raise 'V238 foreground group exceeds cached sprite pool' unless sp
              sp.bitmap=bitmap unless sp.bitmap.equal?(bitmap)
              sp.src_rect.set(rect[0],rect[1],rect[2]-rect[0],rect[3]-rect[1])
              sp.x=2*(chunkx*512+rect[0])-camx
              sp.y=2*(chunky*512+rect[1])-camy
              sp.z=z
              sp.opacity=opacity
              sp.visible=true
              index+1
            end

            def sl_v238_refresh
              camx=[$game_map.display_x.to_i/4,0].max
              camy=[$game_map.display_y.to_i/4,0].max
              vw=@viewport2.rect.width
              vh=@viewport2.rect.height
              return if vw<=0 || vh<=0
              if @sl_v238_last_camera==[camx,camy] &&
                 @sl_v238_last_group==SLNativeLayerV238.group_at($game_player.x,$game_player.y)
                return
              end
              @sl_v238_last_camera=[camx,camy]
              gid=SLNativeLayerV238.group_at($game_player.x,$game_player.y)
              @sl_v238_last_group=gid
              box=(gid>0 ? SLNativeLayerV238::GROUP_BOXES[gid] : nil)
              left=[camx/1024,0].max
              top=[camy/1024,0].max
              right=[(camx+vw-1)/1024,11].min
              bottom=[(camy+vh-1)/1024,7].min
              active={}
              if left<=right && top<=bottom
                (top..bottom).each do |y|
                  (left..right).each{|x|active[[x,y]]=true}
                end
              end
              prev=@sl_v238_active||{}
              prev.each_key do |key|
                next if active[key]
                base=@slti_chunks[key]
                base.visible=false if base
                upper=@sl_v238_upper[key]
                upper.visible=false if upper
              end
              piece_index=0
              active.each_key do |key|
                x,y=key
                ground=@slti_chunks[key]
                ground.visible=true
                ground.x=x*1024-camx
                ground.y=y*1024-camy
                upper=@sl_v238_upper[key]
                next unless upper
                upper.x=x*1024-camx
                upper.y=y*1024-camy
                # Crop only the current native Layer4 group, rather than making a whole
                # map/chunk semi-transparent. This includes a roof crossing chunks.
                l=box ? [box[0]-x*512,0].max : 0
                t=box ? [box[1]-y*512,0].max : 0
                r=box ? [box[2]-x*512,512].min : 0
                b=box ? [box[3]-y*512,512].min : 0
                if box && r>l && b>t
                  upper.visible=false
                  bitmap=upper.bitmap
                  # Non-overlapping four opaque rectangles, plus the faded group box.
                  piece_index=sl_v238_show_piece(bitmap,x,y,[0,0,512,t],0,255,camx,camy,piece_index)
                  piece_index=sl_v238_show_piece(bitmap,x,y,[0,b,512,512],0,255,camx,camy,piece_index)
                  piece_index=sl_v238_show_piece(bitmap,x,y,[0,t,l,b],0,255,camx,camy,piece_index)
                  piece_index=sl_v238_show_piece(bitmap,x,y,[r,t,512,b],0,255,camx,camy,piece_index)
                  piece_index=sl_v238_show_piece(bitmap,x,y,[l,t,r,b],9999,SLNativeLayerV238::FADE_ALPHA,camx,camy,piece_index)
                else
                  upper.visible=true
                  upper.opacity=255
                  upper.z=0
                end
              end
              while piece_index<@sl_v238_pieces.length
                @sl_v238_pieces[piece_index].visible=false
                piece_index+=1
              end
              @sl_v238_active=active
              @slti_r60_floor_ready=true
            end

            def update
              sl_v238_normal_map_update
              sl_v238_refresh if @sl_v238_ready && $game_map && $game_map.map_id==47
            end

            def dispose
              if @sl_v238_pieces
                @sl_v238_pieces.each do |sp|
                  next if sp.disposed?
                  sp.bitmap=nil
                  sp.dispose
                end
                @sl_v238_pieces=nil
              end
              if @sl_v238_upper
                @sl_v238_upper.each_value do |sp|
                  next if sp.disposed?
                  bitmap=sp.bitmap
                  sp.bitmap=nil
                  sp.dispose
                  bitmap.dispose if bitmap && !bitmap.disposed?
                end
                @sl_v238_upper=nil
              end
              # Original Spriteset_Map.dispose disposes the ground sprites and bitmaps.
              sl_v238_normal_dispose
            end
          end
          V238_RUNTIME_RB
          cat > build/patch_rgss.rb <<'V238_PATCH_RB'
          require 'json'
          require 'zlib'
          require 'digest'
          require 'fileutils'

          root=ENV.fetch('V238_SITE','/mnt/data/v238_work/site')
          build=ENV.fetch('V238_BUILD','/mnt/data/v238_work')
          path=File.join(root,'knight/gameasync/Data/Scripts.rxdata')
          original=File.binread(path)
          expected='87c0a831061edc0c1d0307cac48125e6d434ea159000fa22dabcabc6d8644a82'
          raise 'V237 Pages Scripts.rxdata differs' unless Digest::SHA256.hexdigest(original)==expected
          scripts=Marshal.load(original)
          raise 'V237 original script layout changed' unless scripts.size==137 &&
            scripts[-2][1]=='SLNativeLayerV237' && scripts[-1][1]=='Main'
          source=File.read(File.join(build,'runtime_template.rb'))
          mask=File.read(File.join(build,'map047_group_cells.hex')).strip
          boxes=JSON.parse(File.read(File.join(build,'map047_group_boxes.json')))
          keys=JSON.parse(File.read(File.join(build,'foreground_keys.json')))
          raise 'Wrong native group hex map' unless mask.length==363*238*4 && mask.match?(/\A[0-9a-f]+\z/)
          raise 'Wrong Layer4 group count' unless boxes.length==2949
          raise 'Wrong nonempty original Layer4 count' unless keys.length==73
          raise 'Native building at (187,130) not mapped' unless mask[(130*363+187)*4,4].to_i(16)>0
          raise 'Placeholder not unique' unless source.scan('__GROUP_HEX__').length==1 &&
            source.scan('__GROUP_BOXES__').length==1 && source.scan('__FG_KEYS__').length==1
          source=source.sub('__GROUP_HEX__',mask).sub('__GROUP_BOXES__',JSON.generate(boxes)).sub('__FG_KEYS__',JSON.generate(keys))
          raise 'Missing dynamic fade across group boundaries' unless source.include?('GROUP_BOXES[gid]') && source.include?('sl_v238_show_piece')
          raise 'Moving map still decodes images' if source.split('def sl_v238_refresh',2)[1].split('\n  def update',2)[0].include?('Bitmap.new')
          raise 'Moving map creates sprites' if source.split('def sl_v238_refresh',2)[1].split('\n  def update',2)[0].include?('Sprite.new')
          raise 'Display still fades actor' if source.include?('self.opacity=150') || source.include?('self.opacity=135')
          File.binwrite(File.join(build,'runtime_v238.rb'),source)
          scripts[-2][1]='SLNativeLayerV238'
          scripts[-2][2]=Zlib::Deflate.deflate(source,9)
          File.binwrite(path,Marshal.dump(scripts))
          check=Marshal.load(File.binread(path));orig=Marshal.load(original)
          raise 'Unexpected other RGSS modification' unless check.length==orig.length && check[0...-2]==orig[0...-2] && check[-1]==orig[-1]
          raise 'Missing native renderer' unless check[-2][1]=='SLNativeLayerV238'
          puts 'PASS real V237 RGSS source and original 136 sections unchanged'
          puts "PASS Layer5 groups: #{boxes.length-1}, 73 native upper graphics, original ground"
          puts 'PASS move-time renderer has no PNG/Bitmap allocation'
          V238_PATCH_RB
          V238_SITE=site V238_BUILD=build ruby build/patch_rgss.rb
          ruby -c build/runtime_v238.rb

      - name: V238 Append 96 ground tiles to the pre-entry Map047 pack
        shell: bash
        run: |
          set -euo pipefail
          cat > build/build_pack.py <<'V238_PACK_PY'
          from pathlib import Path
          import json,struct,hashlib,re
          from PIL import Image
          import os
          site=Path(os.environ.get('V238_SITE','/mnt/data/v238_work/site'))
          b=Path(os.environ.get('V238_BUILD','/mnt/data/v238_work'))
          pan=site/'knight/gameasync/Graphics/Panoramas'
          fg=[]
          for x in range(12):
           for y in range(8):
            name=f'SLTI_47_L4_C{x}_{y}.png'
            pic=Image.open(pan/name)
            if pic.mode!='RGBA' or pic.size!=(512,512):raise ValueError('Original Layer4 image modified: '+name)
            if pic.getextrema()[3][1]>0: fg.append([x,y])
          if len(fg)!=73:raise ValueError('Unexpected original visible Layer4 assets: '+str(len(fg)))
          (b/'foreground_keys.json').write_text(json.dumps(fg,separators=(',',':')),'utf8')
          pack=site/'knight/assets/map-047-v234.pack'
          data=pack.read_bytes();n=struct.unpack_from('<I',data,0)[0];head=json.loads(data[4:4+n]);oldbody=data[4+n:]
          if len(head['files'])!=193 or head['kind']!='map' or head['map_id']!=47:raise ValueError('Wrong original V237 source pack')
          rows=list(head['files']);offset=len(oldbody);newbytes=[]
          for x in range(12):
           for y in range(8):
            name=f'SLTI_47_G_C{x}_{y}.png'
            raw=(pan/name).read_bytes()
            if raw[:8]!=b'\x89PNG\r\n\x1a\n':raise ValueError('Wrong native ground source '+name)
            key='graphics/panoramas/'+name[:-4].lower()
            rows.append([key,offset,len(raw)]);newbytes.append(raw);offset+=len(raw)
          manifest=json.dumps({'kind':'map','map_id':47,'files':rows},ensure_ascii=False,separators=(',',':')).encode()
          newpack=struct.pack('<I',len(manifest))+manifest+oldbody+b''.join(newbytes)
          target=site/'knight/assets/map-047-v238.pack';target.write_bytes(newpack)
          if rows[:193]!=head['files'] or oldbody!=newpack[4+len(manifest):4+len(manifest)+len(oldbody)]:raise ValueError('Source 193 images modified in new pack')
          print('PASS 193 original + 96 native ground images in one pre-entry pack, bytes',len(newpack),flush=True)
          # Original file mapping is an array of [extensionless key, URL].
          mapping=site/'knight/gameasync/mapping.js'
          s=mapping.read_text('utf8')
          anchor='];\n\nvar mapping = {}'
          if s.count(anchor)!=1:raise ValueError('Unexpected mapping.js structure')
          entries=[]
          for x in range(12):
           for y in range(8):
            name=f'SLTI_47_G_C{x}_{y}.png'
            raw=(pan/name).read_bytes()
            key='graphics/panoramas/'+name[:-4].lower()
            val='Graphics/Panoramas/'+name+'?h='+hashlib.md5(raw).hexdigest()
            entries.append('['+json.dumps(key)+', '+json.dumps(val)+'],')
          s=s.replace(anchor,'\n'+'\n'.join(entries)+'\n'+anchor)
          scripts=site/'knight/gameasync/Data/Scripts.rxdata'
          digest=hashlib.md5(scripts.read_bytes()).hexdigest()
          s,n=re.subn(r'(Data/Scripts\.rxdata\?h=)[0-9a-f]{32}',lambda m:m.group(1)+digest,s)
          if n!=1:raise ValueError('Original script hash not mapped once')
          mapping.write_text(s,'utf8')
          # V237 pre-entry pack loader installs every key before Map047 data callback.
          loader=site/'knight/js/sl-assets-v229r115.js'
          t=loader.read_text('utf8')
          if t.count("var version='V237';")!=1 or t.count('map-047-v234.pack')!=1:raise ValueError('Wrong V237 preload bootstrap')
          if t.count('193')!=6:raise ValueError('Unexpected count constant in loader: '+str(t.count('193')))
          t=t.replace("var version='V237';","var version='V238';").replace('map-047-v234.pack','map-047-v238.pack')
          t=t.replace('193','289')
          if not all(key in t for key in ['if(done!==289)','if(head.files.length!==289)','map47FilesReady=true','installMap47Files()']):raise ValueError('V238 does not gate full pre-entry install')
          loader.write_text(t,'utf8')
          for name in ('index.html','knight/index.html'):
           p=site/name;s=p.read_text('utf8')
           if 'V237' not in s:raise ValueError('Original page version missing '+name)
           p.write_text(s.replace('V237','V238').replace('v237','v238'),'utf8')
          if 'js/sl-assets-v229r115.js?v=v238' not in (site/'knight/index.html').read_text('utf8'):raise ValueError('Browser token not updated')
          print('PASS V238 mapping, RGSS script hash, 289/289 pre-entry gate and version',flush=True)
          V238_PACK_PY
          V238_SITE=site V238_BUILD=build .venv/bin/python build/build_pack.py
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: V238 Test movement allocations and house fading across chunks
        shell: bash
        run: |
          set -euo pipefail
          cat > build/test_runtime.rb <<'V238_SMOKE_RB'
          # Local model of only the RGSS Sprite/Bitmap API, for control-flow and allocations.
          class Rect
            attr_accessor :width,:height
            def initialize(w=800,h=600);@width=w;@height=h;end
            def set(*a);@values=a;end
          end
          class Bitmap
            @@creates=0
            def self.creates;@@creates;end
            def initialize(path);@@creates+=1;@path=path;end
            def disposed?;false;end
            def dispose;end
          end
          class Sprite
            @@creates=0
            def self.creates;@@creates;end
            attr_accessor :bitmap,:z,:zoom_x,:zoom_y,:visible,:opacity,:src_rect,:x,:y
            def initialize(viewport=nil);@@creates+=1;@src_rect=Rect.new;@visible=true;@bitmap=nil;end
            def disposed?;false;end
            def dispose;end
          end
          class Sprite_Character
            attr_accessor :opacity
            def update;end
          end
          View=Struct.new(:rect)
          GameMap=Struct.new(:map_id,:display_x,:display_y)
          GamePlayer=Struct.new(:x,:y)
          $game_map=GameMap.new(47,22800,15600)
          $game_player=GamePlayer.new(187,130)
          class Spriteset_Map
            def initialize
              @viewport2=View.new(Rect.new(800,600))
              @slti_floor=47;@slti_cols=12;@slti_rows=8;@slti_chunks={}
              @slti_r60_floor_ready=false
              update
            end
            def update
              slti_update_terrain
            end
            def slti_update_terrain;end
            def dispose
              @slti_chunks.each_value do |sp|
                if sp.bitmap
                  sp.bitmap.dispose
                end
                sp.dispose
              end
            end
          end
          load 'build/runtime_v238.rb'
          raise 'No roof group' if SLNativeLayerV238.group_at(187,130)==0
          raise 'Wrong roof bounds' unless SLNativeLayerV238.box_for(187,130)==[2936,2042,3068,2186]
          raise 'Should be a different building group' if SLNativeLayerV238.group_at(187,130)==SLNativeLayerV238.group_at(187,136)
          map=Spriteset_Map.new
          bitmaps=Bitmap.creates; sprites=Sprite.creates
          raise "Wrong initial decoding #{bitmaps}" unless bitmaps==169
          raise "Wrong initial sprite count #{sprites}" unless sprites==209
          fade=map.instance_variable_get(:@sl_v238_pieces).select{|sp|sp.visible && sp.opacity==135}
          raise 'No group opacity fades or incomplete cross-chunk fade' unless fade.length==2
          raise 'Should still show ground-only floor' unless map.instance_variable_get(:@slti_chunks).length==96
          300.times do |i|
            $game_map.display_x=(i%100)*12
            $game_map.display_y=(i%80)*8
            $game_player.x=i%45+150
            $game_player.y=i%24+120
            map.update
          end
          raise 'A Bitmap allocated on movement' unless bitmaps==Bitmap.creates
          raise 'A Sprite allocated on movement' unless sprites==Sprite.creates
          $game_player.x=187;$game_player.y=130
          $game_map.display_x=22800;$game_map.display_y=15600
          map.update
          # Moving the actor away returns full opacity to the foreground.
          $game_player.x=0;$game_player.y=0
          map.update
          raise 'Group still faded outside native Layer5' if map.instance_variable_get(:@sl_v238_pieces).any?(&:visible)
          raise 'All native house graphics disappeared' if map.instance_variable_get(:@sl_v238_upper).values.none?(&:visible)
          puts 'PASS 300 frames: zero movement Bitmap/Sprite allocations'
          puts 'PASS house group 182 fades across two chunk boundaries, returns to full opacity outside native Layer5'
          puts 'PASS original 96 floor and 73 upper images ready at map entry'
          V238_SMOKE_RB
          ruby build/test_runtime.rb

      - name: V238 Verify all originals and zero movement-time downloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,struct
          root=Path('site')
          before=json.loads(Path('build/before.json').read_text('utf8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          allowed={'knight/gameasync/Data/Scripts.rxdata',
                   'knight/gameasync/mapping.js',
                   'knight/js/sl-assets-v229r115.js','index.html','knight/index.html'}
          new={'knight/assets/map-047-v238.pack'}
          new|={f'knight/gameasync/Graphics/Panoramas/SLTI_47_G_C{x}_{y}.png'
                for x in range(12) for y in range(8)}
          if set(after)-set(before)!=new or set(before)-set(after):
              raise ValueError('Unexpected game files added or deleted')
          modified={p for p in before if before[p]!=after[p]}
          if modified!=allowed:raise ValueError('Unapproved original changes: '+repr(modified^allowed))
          if len(after)!=5698:raise ValueError('Unexpected final file count')
          prefix='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          for mid in (45,46):
              if prefix+f'Map{mid:03d}.rxdata' in after:raise ValueError('Dungeon restored')
          for p in [prefix+'Map047.rxdata',
                    'knight/assets/map-047-v234.pack',
                    'knight/gameasync/Graphics/Panoramas/SLTI_47_C7_4.png']:
              if before[p]!=after[p]:raise ValueError('Original game art or collision changed '+p)
          for x in range(12):
              for y in range(8):
                  for tag in ('','L4_'):
                      p=f'knight/gameasync/Graphics/Panoramas/SLTI_47_{tag}C{x}_{y}.png'
                      if before[p]!=after[p]:raise ValueError('Original PNG changed: '+p)
          pack=(root/'knight/assets/map-047-v238.pack').read_bytes()
          n=struct.unpack_from('<I',pack,0)[0]
          manifest=json.loads(pack[4:4+n])
          if len(manifest['files'])!=289:raise ValueError('Map047 289 graphics not installed')
          loader=(root/'knight/js/sl-assets-v229r115.js').read_text('utf8')
          if not all(s in loader for s in ('head.files.length!==289','done!==289',
                  'map47FilesReady=true','installMap47Files()','map-047-v238.pack')):
              raise ValueError('Map047 289-image pre-entry install is missing')
          ruby=Path('build/runtime_v238.rb').read_text('utf8')
          if 'GROUP_BOXES' not in ruby or 'sl_v238_show_piece' not in ruby or 'FADE_ALPHA=135' not in ruby:
              raise ValueError('Original house/tree fade is not implemented')
          for routine in ('def sl_v238_show_piece','def sl_v238_refresh'):
              section=ruby.split(routine,1)[1].split('  def ',1)[0]
              if any(s in section for s in ('Bitmap.new','Sprite.new','bitmap.dispose','createPreloadedFile')):
                  raise ValueError('Movement renderer allocates or reloads resources: '+routine)
          print('PASS 5601 originals preserved except five scripts/cache/version changes')
          print('PASS 96 new original ground-only tiles; original 193 graphics remain intact')
          print('PASS 289 pre-installed images, no new assets on movement')
          print('PASS native Layer4 group is translucent, actor stays opaque, no collision changes')
          PY

      - name: V238 Publish Map047 with original ground and faded objects
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

