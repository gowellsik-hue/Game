          infos=Marshal.load(mapinfos_bytes)
          raise 'Map047 dimensions unexpected' unless [map47.instance_variable_get(:@width),map47.instance_variable_get(:@height)]==[768,384]
          raise 'Map048 already in mapinfos' if infos.key?(48)
          raise 'Map047 info missing' unless infos[47]
          old_info=infos.transform_values{|info|Marshal.dump(info)}
          walk_bytes=File.binread(walk)
          raise 'Wrong native Map048 terrain size' unless walk_bytes.bytesize==768*384*2
          values=walk_bytes.unpack('v*')
          raise 'Map048 terrain must be 384 or 385' unless values.all?{|v|v==384||v==385}
          map48=Marshal.load(map47_bytes)
          map48.instance_variable_set(:@events,{})
          map48.instance_variable_set(:@width,768)
          map48.instance_variable_set(:@height,384)
          map48.instance_variable_get(:@data).instance_variable_set(:@raw,[3,768,384,3,3*768*384].pack('V5')+walk_bytes+("\0"*(768*384*4)))
          info=RPG::MapInfo.allocate
          info.instance_variable_set(:@scroll_x,0)
          info.instance_variable_set(:@name,'글루디오·우드벡·은기사')
