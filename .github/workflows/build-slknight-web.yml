
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R142
# BASE: Successful V229R138, run 40834745896.
# R140: REJECTED - incorrect 384/385 remapping.
# R141: REJECTED - incorrect player/monster coordinate shifting.
#
# RESTORE:
#   - R94 original 384/385 tiles on Map045 and Map046.
#   - Original R138 player and monster coordinates.
# CHANGE:
#   - Map045 (88,80): tile 385 -> 384 (approved manual opening).
# PRESERVE:
#   - Existing RPG 4-direction movement.
#   - Scripts, events, monster logic, stairs and graphics.
#   - Existing Talking Island Map047 and all other maps.
# VALIDATE:
#   - R94 tile hashes and original map hashes.
#   - Player entry/transfer coordinates.
#   - Monster initial and respawn coordinates.
#   - 4-direction connectivity, including the manual opening.
#   - Exact permitted file differences.
#   - Abort before deployment on any failed assertion.

name: build-slknight-web.yml | V229R142 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: V229R142 Verify successful R138 baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import json
          import urllib.request

          rid = 40834745896
          sha = '6f156306b7260a272397177c196ba7ccfaa8b77b'

          req = urllib.request.Request(
              f'https://api.github.com/repos/gowellsik-hue/Game/actions/runs/{rid}',
              headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json'
              }
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              run = json.load(response)

          assert run['id'] == rid
          assert run['head_sha'] == sha
          assert run['conclusion'] == 'success'
          assert run['path'].split('@', 1)[0].endswith(
              '/build-slknight-web.yml'
          )

          print('PASS: exact successful R138 baseline')
          PY

      - name: V229R142 Download original R138 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40834745896
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V229R142 Extract and fingerprint untouched game
        shell: bash
        run: |
          set -euo pipefail

          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path('site')
          before = {
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          assert len(before) == 5663, 'Unexpected baseline file count'

          prefix = (
              'knight/gameasync/Data/'
              'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          )

          expected = {
              29: 'fce4017389aed05bbb58572313c4bb35ea1fa2b5887ba9ff47bf86bc766b8801',
              45: 'f47de87af6b4e607bf632818a711619dc8ca4e747196a123a76ac7db8ffc3ba6',
              46: 'dc89d908f5247442e08dddc11f5bcf6505a77890bd82ab59b790e00e3e5f024c'
          }

          for mid, sha in expected.items():
              name = prefix + f'Map{mid:03d}.rxdata'
              assert before[name] == sha, (
                  f'REJECT: unexpected original Map{mid:03d}'
              )

          assert prefix + 'Map047.rxdata' in before
          assert 'V229R138' in (root / 'index.html').read_text('utf8')
          assert 'V229R138' in (
              root / 'knight/index.html'
          ).read_text('utf8')

          Path('build/before.json').write_text(
              json.dumps(before, sort_keys=True)
          )

          print('PASS: all original R138 files verified')
          PY

      - name: V229R142 Restore exact R94 and open designated tile
        shell: bash
        run: |
          set -euo pipefail

          cat > build/verify_r94.rb <<'RUBY'
          require 'digest'

          module RPG
            class Map; end
            class Event; end
            class Event::Page; end
            class Event::Page::Condition; end
            class Event::Page::Graphic; end
            class EventCommand; end
            class MoveCommand; end
            class MoveRoute; end
            class MapInfo; end
            class AudioFile; end
            class Tileset; end
          end

          class Table
            def self._load(raw)
              obj = allocate
              obj.instance_variable_set(:@raw, raw)
              obj
            end

            def _dump(_depth)
              @raw
            end
          end

          class Tone
            def self._load(raw)
              obj = allocate
              obj.instance_variable_set(:@raw, raw)
              obj
            end

            def _dump(_depth)
              @raw
            end
          end

          class Color
            def self._load(raw)
              obj = allocate
              obj.instance_variable_set(:@raw, raw)
              obj
            end

            def _dump(_depth)
              @raw
            end
          end

          root = ARGV.fetch(0)
          directory = File.join(root, 'knight/gameasync/Data')
          prefix = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          def reject!(message)
            raise "R142 REJECTED: #{message}"
          end

          def unpack_map(directory, prefix, id)
            path = File.join(
              directory,
              prefix + format('Map%03d.rxdata', id)
            )
            binary = File.binread(path)
            map = Marshal.load(binary)

            reject!("Map#{id} serialization mismatch") unless
              Marshal.dump(map) == binary

            [map, path, binary]
          end

          def layer(map, width, height)
            dimensions = [
              map.instance_variable_get(:@width),
              map.instance_variable_get(:@height)
            ]

            reject!('Unexpected RPG map size') unless
              dimensions == [width, height]

            table = map.instance_variable_get(:@data)
            raw = table.instance_variable_get(:@raw)

            reject!('Unexpected RPG Table header') unless
              raw[0, 20].unpack('V5') ==
              [3, width, height, 3, width * height * 3]

            reject!('Unexpected RPG Table length') unless
              raw.bytesize == 20 + width * height * 6

            cells = raw[20, width * height * 2].unpack('v*')

            reject!('Non-384/385 terrain tile detected') unless
              cells.all? { |id| id == 384 || id == 385 }

            [table, raw, cells]
          end

          def verify_original_r94!(cells, expected, count)
            actual = cells.map { |t| t == 384 ? 1 : 0 }.pack('C*')

            reject!('R94 green count mismatch') unless
              actual.bytes.count(1) == count

            reject!('R94 collision data mismatch') unless
              Digest::SHA256.hexdigest(actual) == expected
          end

          def flood(cells, width, height, x, y)
            reject!('Player start outside map') unless
              x.between?(0, width - 1) &&
              y.between?(0, height - 1)

            first = y * width + x
            reject!('Player starts on blocked tile') unless
              cells[first] == 384

            visited = Array.new(width * height, false)
            queue = [first]
            visited[first] = true
            head = 0

            while head < queue.length
              pos = queue[head]
              head += 1

              cx = pos % width
              cy = pos / width

              neighbors = [
                [cx - 1, cy],
                [cx + 1, cy],
                [cx, cy - 1],
                [cx, cy + 1]
              ]

              neighbors.each do |nx, ny|
                next unless nx.between?(0, width - 1)
                next unless ny.between?(0, height - 1)

                target = ny * width + nx

                next unless cells[target] == 384
                next if visited[target]

                visited[target] = true
                queue << target
              end
            end

            [visited, queue.length]
          end

          def verify_monsters!(
            map, floor, cells, width, height, connected,
            expected_respawns
          )
            monsters = 0
            respawns = 0

            events = map.instance_variable_get(:@events)

            events.each_value do |event|
              name = event.instance_variable_get(:@name).to_s
              next unless name.start_with?('[ID')

              eid = event.instance_variable_get(:@id)

              # Original special boss events are untouched.
              next if floor == 45 && eid == 13
              next if floor == 46 && eid == 3

              x = event.instance_variable_get(:@x)
              y = event.instance_variable_get(:@y)

              reject!("Map#{floor} invalid monster coordinate") unless
                x.is_a?(Integer) &&
                y.is_a?(Integer) &&
                x.between?(0, width - 1) &&
                y.between?(0, height - 1)

              index = y * width + x

              reject!("Map#{floor} monster on tile 385") unless
                cells[index] == 384

              reject!("Map#{floor} monster unreachable") unless
                connected[index]

              monsters += 1

              event.instance_variable_get(:@pages).each do |page|
                page.instance_variable_get(:@list).each do |cmd|
                  next unless cmd.instance_variable_get(:@code) == 202

                  params = cmd.instance_variable_get(:@parameters)
                  next unless params[0] == 0 && params[1] == 0

                  rx = params[2]
                  ry = params[3]

                  reject!("Map#{floor} invalid respawn coordinate") unless
                    rx.is_a?(Integer) &&
                    ry.is_a?(Integer) &&
                    rx.between?(0, width - 1) &&
                    ry.between?(0, height - 1)

                  index = ry * width + rx

                  reject!("Map#{floor} respawn on tile 385") unless
                    cells[index] == 384

                  reject!("Map#{floor} respawn unreachable") unless
                    connected[index]

                  respawns += 1
                end
              end
            end

            reject!("Map#{floor} monster count #{monsters}") unless
              monsters == 30

            reject!("Map#{floor} respawn count #{respawns}") unless
              respawns == expected_respawns

            puts(
              "PASS Map#{floor}: #{monsters} initial spawns, " \
              "#{respawns} respawn positions, all reachable"
            )
          end

          map29, path29, bin29 = unpack_map(directory, prefix, 29)
          map45, path45, bin45 = unpack_map(directory, prefix, 45)
          map46, path46, bin46 = unpack_map(directory, prefix, 46)

          tilesets = Marshal.load(
            File.binread(File.join(directory, prefix + 'Tilesets.rxdata'))
          )

          passages = tilesets.fetch(31).
            instance_variable_get(:@passages).
            instance_variable_get(:@raw)

          reject!('Tile 384 passage attribute changed') unless
            passages[20 + 384 * 2, 2].unpack1('v') == 0

          reject!('Tile 385 passage attribute changed') unless
            passages[20 + 385 * 2, 2].unpack1('v') == 15

          table45, raw45, original45 = layer(map45, 288, 144)
          table46, raw46, original46 = layer(map46, 336, 168)

          # These hashes are calculated from the R94 original HTML's
          # binary 384/385 arrays, not from R140 or R141.
          verify_original_r94!(
            original45,
            '1228f0f3e6df3452196901469ceb02d17802a6747fecfb9db23e595baa279011',
            3724
          )

          verify_original_r94!(
            original46,
            'b50a46669deba5026cf0d27eb9564397cbbb1278bfab43c6137cf69f69f49606',
            7100
          )

          # Manually approved opening.
          gx = 88
          gy = 80
          gate_index = gy * 288 + gx

          reject!('Manual opening baseline is not 385') unless
            original45[gate_index] == 385

          # The R94 original approach tile must remain open.
          reject!('R94 approach is blocked') unless
            original45[79 * 288 + 88] == 384

          corrected45 = original45.dup
          corrected45[gate_index] = 384

          reject!('Wrong corrected green count') unless
            corrected45.count(384) == 3725

          differences = original45.each_index.select do |i|
            original45[i] != corrected45[i]
          end

          reject!('Unapproved collision differences') unless
            differences == [gate_index]

          # Verify original player entry from the existing town NPC.
          event11 = map29.instance_variable_get(:@events).fetch(11)
          entries = []

          event11.instance_variable_get(:@pages).each do |page|
            page.instance_variable_get(:@list).each do |cmd|
              next unless cmd.instance_variable_get(:@code) == 201
              p = cmd.instance_variable_get(:@parameters)
              entries << p if p[0] == 0 && p[1] == 45
            end
          end

          reject!('Unexpected 1F entry coordinate') unless
            entries == [[0, 45, 96, 74, 0, 1]]

          # Preserve existing stairs and transfer scripts.
          up_script = map45.instance_variable_get(:@events).fetch(1).
            instance_variable_get(:@pages).fetch(0).
            instance_variable_get(:@list).find do |cmd|
              cmd.instance_variable_get(:@code) == 355
            end

          reject!('Missing 1F to 2F transfer') unless up_script

          up_text = up_script.instance_variable_get(:@parameters).fetch(0)

          reject!('Unexpected 2F entry coordinate') unless
            up_text.include?('player_new_map_id=46') &&
            up_text.include?('player_new_x=76') &&
            up_text.include?('player_new_y=94')

          down_script = map46.instance_variable_get(:@events).fetch(2).
            instance_variable_get(:@pages).fetch(0).
            instance_variable_get(:@list).find do |cmd|
              cmd.instance_variable_get(:@code) == 355
            end

          reject!('Missing 2F to 1F transfer') unless down_script

          down_text = down_script.instance_variable_get(:@parameters).fetch(0)

          reject!('Unexpected 1F return coordinate') unless
            down_text.include?('player_new_map_id = 45') &&
            down_text.include?('player_new_x = 96') &&
            down_text.include?('player_new_y = 74')

          # Only original RPG 4-direction connectivity is considered.
          connected45, count45 = flood(
            corrected45, 288, 144, 96, 74
          )

          connected46, count46 = flood(
            original46, 336, 168, 76, 94
          )

          reject!('1F reachable component changed unexpectedly') unless
            count45 == 3713

          reject!('2F reachable component changed unexpectedly') unless
            count46 == 7056

          reject!('Manual opening unreachable') unless
            connected45[gate_index]

          verify_monsters!(
            map45, 45, corrected45, 288, 144, connected45, 90
          )

          verify_monsters!(
            map46, 46, original46, 336, 168, connected46, 87
          )

          # Apply the one approved tile change only.
          modified_raw = raw45.b.dup
          modified_raw[20 + gate_index * 2, 2] = [384].pack('v')

          reject!('Unexpected modification to other map layers') unless
            modified_raw[20 + 288 * 144 * 2..-1] ==
            raw45[20 + 288 * 144 * 2..-1]

          table45.instance_variable_set(:@raw, modified_raw)
          modified_binary = Marshal.dump(map45)

          reject!('Unexpected serialized map size') unless
            modified_binary.bytesize == bin45.bytesize

          binary_difference_count = (0...bin45.bytesize).count do |i|
            bin45.getbyte(i) != modified_binary.getbyte(i)
          end

          reject!('More than one game data byte changed') unless
            binary_difference_count == 1

          # Reverse the temporary edit and prove that all original
          # events, monster data, scripts and other fields are intact.
          table45.instance_variable_set(:@raw, raw45)

          reject!('Other Map045 data changed') unless
            Marshal.dump(map45) == bin45

          reject!('Map029 changed') unless
            File.binread(path29) == bin29

          reject!('Map046 changed') unless
            File.binread(path46) == bin46

          File.binwrite(path45, modified_binary)

          saved = Marshal.load(File.binread(path45))
          _, _, saved_cells = layer(saved, 288, 144)

          reject!('Saved manual opening mismatch') unless
            saved_cells == corrected45

          puts 'PASS: exact R94 baseline on 1F and 2F'
          puts 'PASS: designated opening 385 -> 384'
          puts 'PASS: original player entries and stairs preserved'
          puts 'PASS: 4-direction route reaches designated opening'
          puts 'PASS: only one Map045 tile byte modified'
          RUBY

          ruby -c build/verify_r94.rb
          ruby build/verify_r94.rb site

      - name: V229R142 Update modified map cache and version only
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          root = Path('site')
          prefix = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          key = prefix + 'Map045'
          path = root / 'knight/gameasync/Data' / (key + '.rxdata')
          mapping = root / 'knight/gameasync/mapping.js'

          source = mapping.read_text('utf8')

          pattern = (
              r'(Data/' + re.escape(key) +
              r'\.rxdata\?h=)[0-9a-f]{32}'
          )

          digest = hashlib.md5(path.read_bytes()).hexdigest()

          source, n = re.subn(
              pattern,
              lambda m: m.group(1) + digest,
              source
          )

          assert n == 1, 'REJECT: Map045 cache mismatch'
          mapping.write_text(source, 'utf8')

          for name in ('index.html', 'knight/index.html'):
              file = root / name
              text = file.read_text('utf8')

              assert 'V229R138' in text
              assert 'V229R142' not in text

              text = text.replace('V229R138', 'V229R142')
              text = text.replace('v229r138', 'v229r142')

              file.write_text(text, 'utf8')

          asset = root / 'knight/js/sl-assets-v229r115.js'
          source = asset.read_text('utf8')

          assert source.count("var version='V229R138';") == 1

          asset.write_text(
              source.replace(
                  "var version='V229R138';",
                  "var version='V229R142';"
              ),
              'utf8'
          )

          assert (
              'js/sl-assets-v229r115.js?v=v229r142'
              in (root / 'knight/index.html').read_text('utf8')
          )

          print('PASS: one map cache and three version files updated')
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: V229R142 Reject all unapproved file modifications
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path('site')
          before = json.loads(Path('build/before.json').read_text())

          after = {
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          assert before.keys() == after.keys(), (
              'REJECT: original game files added or deleted'
          )

          prefix = (
              'knight/gameasync/Data/'
              'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          )

          expected = {
              prefix + 'Map045.rxdata',
              'knight/gameasync/mapping.js',
              'index.html',
              'knight/index.html',
              'knight/js/sl-assets-v229r115.js'
          }

          modified = {
              name for name in before
              if before[name] != after[name]
          }

          assert modified == expected, (
              'REJECT: unexpected changed files',
              sorted(modified ^ expected)
          )

          assert len(after) == 5663

          # The other dungeon floor and original player transfer
          # events must be byte-for-byte unchanged.
          for mid in (29, 46, 47):
              key = prefix + f'Map{mid:03d}.rxdata'
              assert before[key] == after[key], (
                  f'REJECT: Map{mid:03d} changed'
              )

          for name in (
              'knight/gameasync/Data/Scripts.rxdata',
              prefix + 'Tilesets.rxdata'
          ):
              assert before[name] == after[name], (
                  'REJECT: RPG engine or passage settings changed'
              )

          print('PASS: exactly five permitted files changed')
          print('PASS: game movement engine unchanged')
          print('PASS: Map029, Map046, Map047 unchanged')
          print('PASS: existing monsters, graphics and stairs preserved')
          print('PASS: all rejection gates passed')
          PY

      - name: V229R142 Publish only after every verification passes
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
