
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V276.2
# BASE: V276 successful run 41570716894
# TARGET: Map025 EV29, independent Death Knight clone
# CHANGE: Zenith Queen stats, combat values, name and rewards
# FIX: Correct Ruby syntax in serialized reward verification
# KEEP: V276 native movement, event and common-event connections
# KEEP: All original and cloned image files unchanged
# KEEP: Original Death Knight and all unrelated monsters unchanged
# NO NEW GAME RUNTIME OR PER-FRAME HOOKS
# STATUS: GitHub Actions and actual gameplay not yet verified

name: build-slknight-web.yml | V276.2 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: V276.2 Restore successful V276 clone
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41570716894
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V276.2 Verify original clone and inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s baseline/artifact.tar
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json

          root=Path("site")
          before={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob("*") if p.is_file()
          }

          pre="MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"
          data=root/"knight/gameasync/Data"

          for name in (
              "Scripts.rxdata",
              pre+"Map016.rxdata",
              pre+"Map025.rxdata",
              pre+"CommonEvents.rxdata"
          ):
              assert (data/name).is_file(),name

          expected=(
              "f43507920c57e81ec1d219bae492f5e"
              "6191f6471f733d8d471f81e8515f7d167"
          )

          assert before["knight/gameasync/Data/Scripts.rxdata"]==expected
          assert "V276" in (root/"knight/index.html").read_text("utf-8")

          Path("build/before.json").write_text(
              json.dumps(before,sort_keys=True),
              encoding="utf-8"
          )

          print("PASS successful V276 source")
          print("PASS original V241 game engine intact")
          print("PASS existing independent Death Knight clone retained")
          PY

      - name: V276.2 Apply approved Zenith Queen attributes
        shell: bash
        run: |
          set -euo pipefail

          cat > build/stats.rb <<'RUBY'
          # encoding: UTF-8
          require 'json'

          module RPG
            class Map;end
            class CommonEvent;end
            class AudioFile;end

            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end

            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end

          class Table
            def self._load(raw)
              o=allocate
              o.instance_variable_set(:@raw,raw)
              o
            end
            def _dump(level=0);@raw;end
          end

          class Tone
            def self._load(raw)
              o=allocate
              o.instance_variable_set(:@raw,raw)
              o
            end
            def _dump(level=0);@raw;end
          end

          class Color<Tone;end

          def iv(obj,key)
            obj.instance_variable_get('@'+key.to_s)
          end

          def put(obj,key,value)
            obj.instance_variable_set('@'+key.to_s,value)
          end

          def command(code,parameters=[],indent=0)
            obj=RPG::EventCommand.allocate
            put(obj,:code,code)
            put(obj,:parameters,parameters)
            put(obj,:indent,indent)
            obj
          end

          def readable(value)
            value.to_s.dup.force_encoding('UTF-8').scrub
          end

          ROOT='site/knight/gameasync/Data/'
          PRE='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          MAP16=ROOT+PRE+'Map016.rxdata'
          MAP25=ROOT+PRE+'Map025.rxdata'
          COMMON=ROOT+PRE+'CommonEvents.rxdata'
          SCRIPTS=ROOT+'Scripts.rxdata'

          EVENT_ID=29
          HP_VAR=4988
          ATTACK_SW=5991
          MAGIC_SW=5992

          LEVEL=60
          MAX_HP=5200
          PHYSICAL=[50,100]
          MAGIC=[150,300]
          ACCURACY=9999
          HIT_RANDOM=[15,35]
          MOVE_SPEED=3
          MOVE_FREQUENCY=6
          ATTACK_WAIT=20
          EXP=43212
          ADENA=[64800,151200]
          MAGIC_FLOOR=80

          # Rates are per 1000. Quantity is one per successful roll.
          DROPS=[
            [:item,35,30],
            [:item,34,20],
            [:item,33,100],
            [:item,37,100],
            [:armor,169,50],
            [:item,116,3],
            [:item,32,100],
            [:item,38,100],
            [:armor,289,30],
            [:weapon,123,30],
            [:weapon,41,50],
            [:item,3,200],
            [:weapon,1,50],
            [:armor,72,50],
            [:item,2,250],
            [:armor,303,2],
            [:item,43,100],
            [:armor,280,30],
            [:armor,12,50],
            [:armor,492,3]
          ]

          raise 'Wrong drop count' unless DROPS.length==20
          raise 'Invalid drop rate' unless DROPS.all?{
            |kind,id,rate|
            [:item,:weapon,:armor].include?(kind) &&
            id>0 && rate>=0 && rate<=1000
          }

          original_map16=File.binread(MAP16)
          original_scripts=File.binread(SCRIPTS)

          map=Marshal.load(File.binread(MAP25))
          common=Marshal.load(File.binread(COMMON))
          events=iv(map,:events)
          boss=events.fetch(EVENT_ID)
          pages=iv(boss,:pages)

          raise 'V276 five-page clone missing' unless pages.length==5
          raise 'Wrong clone event' unless
            readable(iv(boss,:name)).include?('데스나이트')

          other_events=events.each_with_object({}) do |(id,event),h|
            h[id]=Marshal.dump(event) unless id==EVENT_ID
          end

          # Do not modify any original or unrelated common event.
          original_common=common.map do |ce|
            ce.nil? ? nil : Marshal.dump(ce)
          end

          # Locate copies produced by V276, not the source CEs.
          def cloned_ce(common,original_id)
            source=common.fetch(original_id)
            expected='[DK2F] '+readable(iv(source,:name))

            matches=common.each_index.select do |id|
              ce=common[id]
              ce && id!=original_id &&
              readable(iv(ce,:name))==expected
            end

            raise "Clone CE #{original_id} missing or duplicate" unless
              matches.length==1

            [matches.first,common[matches.first]]
          end

          id57,ce57=cloned_ce(common,57)
          id179,ce179=cloned_ce(common,179)
          id901,ce901=cloned_ce(common,901)

          private_ids=[id179,id901]

          raise 'Attack switch changed' unless
            iv(ce179,:trigger)==2 &&
            iv(ce179,:switch_id)==ATTACK_SW

          # 1. Name and level metadata.
          # Level metadata is retained for future data inspection.
          # The native engine is not replaced with a custom level system.
          put(boss,:name,'제니스 퀸')
          put(boss,:sl_level,LEVEL)

          # 2. Movement, incoming hit check and maximum HP.
          hit_updates=0
          hp_display_updates=0
          wait_updates=0

          original_graphics=pages.map do |page|
            Marshal.dump(iv(page,:graphic))
          end

          pages.each_with_index do |page,index|
            if index<=2
              put(page,:move_speed,MOVE_SPEED)
              put(page,:move_frequency,MOVE_FREQUENCY)
            end

            cond=iv(page,:condition)

            if iv(cond,:variable_valid) &&
               iv(cond,:variable_id)==HP_VAR &&
               iv(cond,:variable_value)==4000
              put(cond,:variable_value,MAX_HP)
            end

            (iv(page,:list)||[]).each do |cmd|
              code=iv(cmd,:code)
              p=iv(cmd,:parameters)
              next unless p.is_a?(Array)

              if code==122 &&
                 p[0]==335 && p[1]==335 &&
                 p[2]==0
                p.replace([
                  335,335,0,2,
                  HIT_RANDOM[0],HIT_RANDOM[1]
                ])
                hit_updates+=1
              end

              if code==111 &&
                 p[0]==1 && p[1]==HP_VAR &&
                 p[4]==4000
                p[4]=MAX_HP
              end

              if code==230 && index==1 && p==[30]
                p[0]=ATTACK_WAIT
                wait_updates+=1
              end

              next unless code==355 || code==655
              next unless p[0].is_a?(String)
              next unless p[0].b.include?('drawMHP'.b)

              script=p[0].dup.b

              ['UTF-8','CP949'].each do |encoding|
                old_name='데스나이트'.encode(encoding).b
                new_name='제니스 퀸'.encode(encoding).b
                script=script.gsub(old_name,new_name)
              end

              script=script.gsub(/\b4000\b/n,'5200'.b)

              p[0]=script
              hp_display_updates+=1
            end
          end

          raise 'Native player hit check not found' if hit_updates==0

          # 3. Original physical/magic attack command graph.
          attack_list=iv(ce901,:list)
          raise 'Native attack graph absent' unless attack_list.is_a?(Array)

          native_ratio=attack_list.count do |cmd|
            iv(cmd,:code)==122 &&
            iv(cmd,:parameters)==[26,26,0,2,0,6]
          end

          native_magic_gate=attack_list.count do |cmd|
            iv(cmd,:code)==111 &&
            iv(cmd,:parameters)==[1,26,0,1,0]
          end

          raise 'Original 6:1 distribution absent' unless
            native_ratio==1 && native_magic_gate==1

          # Edit only the two original physical-damage assignments.
          physical_low=0
          physical_high=0
          magic_low=0
          magic_high=0

          attack_list.each do |cmd|
            next unless iv(cmd,:code)==122
            p=iv(cmd,:parameters)
            next unless p.is_a?(Array)
            next unless p[0,4]==[26,26,0,0]

            case p[4]
            when 35
              p[4]=PHYSICAL[0]
              physical_low+=1
            when 70
              p[4]=PHYSICAL[1]
              physical_high+=1
            when MAGIC[0]
              magic_low+=1
            when MAGIC[1]
              magic_high+=1
            end
          end

          raise 'Physical-damage endpoints not found' unless
            physical_low==1 && physical_high==1

          raise 'Magic endpoints changed' unless
            magic_low>=1 && magic_high>=1

          # 4. Native accuracy variable and comparison.
          # This uses the existing RPG event command, not new combat logic.
          gate=attack_list.index do |cmd|
            iv(cmd,:code)==111 &&
            iv(cmd,:parameters)==[1,336,1,337,1]
          end

          raise 'Native physical accuracy gate missing' unless gate

          accuracy_assignments=attack_list.select do |cmd|
            p=iv(cmd,:parameters)
            iv(cmd,:code)==122 &&
            p.is_a?(Array) &&
            p[0]==336 && p[1]==336 &&
            p[2]==0 && p[3]==2
          end

          if accuracy_assignments.empty?
            template=attack_list[gate]
            attack_list.insert(
              gate,
              command(
                122,
                [336,336,0,2,ACCURACY,ACCURACY],
                iv(template,:indent)
              )
            )
          else
            accuracy_assignments.each do |cmd|
              p=iv(cmd,:parameters)
              p[4]=ACCURACY
              p[5]=ACCURACY
            end
          end

          raise 'Accuracy 9999 not wired' unless
            attack_list.any? do |cmd|
              iv(cmd,:code)==122 &&
              iv(cmd,:parameters)==[
                336,336,0,2,ACCURACY,ACCURACY
              ]
            end

          # Preserve native CE57, original defense calculation
          # and the existing minimum magic damage of 80.
          raise 'Private CE57 not connected' unless
            attack_list.any? do |cmd|
              iv(cmd,:code)==117 &&
              iv(cmd,:parameters)==[id57]
            end

          raise 'Native magic floor missing' unless
            attack_list.any? do |cmd|
              iv(cmd,:code)==311 &&
              iv(cmd,:parameters)==[
                1,1,0,MAGIC_FLOOR,false
              ]
            end

          raise 'Native player damage command missing' unless
            attack_list.count{|cmd|iv(cmd,:code)==311}>=2

          # 5. Native attack cycle: 5 startup + 15 recovery.
          # Total 20 frames, using the existing CE179 loop.
          cycle=iv(ce179,:list)

          expected_codes=[355,106,117,106,121,0]

          raise 'Original attack cycle changed' unless
            cycle.map{|cmd|iv(cmd,:code)}==expected_codes

          raise 'Original startup changed' unless
            iv(cycle[1],:parameters)==[5]

          raise 'Wrong independent attack reference' unless
            iv(cycle[2],:parameters)==[id901]

          raise 'Original recovery wait changed' unless
            iv(cycle[3],:parameters)==[7]

          put(cycle[3],:parameters,[ATTACK_WAIT-5])

          raise 'Attack switch reset changed' unless
            iv(cycle[4],:parameters)==[
              ATTACK_SW,ATTACK_SW,1
            ]

          # 6. Native death event reward.
          # No custom Ruby module, update hook or extra interpreter.
          # All payouts execute once through the original event page.
          reward_script=<<~REWARD
            gold=#{ADENA[0]}+rand(#{ADENA[1]-ADENA[0]+1})
            $game_party.gain_gold(gold)
            $game_variables[333]=gold
            $game_variables[1926]=#{EXP}
            a=nil
            if $game_party.respond_to?(:actors)
              actors=$game_party.actors
              a=actors[0] if actors && !actors.empty?
            end
            a=$game_actors[1] if !a && $game_actors
            a.exp=a.exp+#{EXP} if a
            #{DROPS.inspect}.each do |kind,id,rate|
              next unless rand(1000)<rate
              case kind
              when :item
                $game_party.gain_item(id,1)
              when :weapon
                $game_party.gain_weapon(id,1)
              when :armor
                $game_party.gain_armor(id,1)
              end
            end
          REWARD

          death=pages[2]
          death_condition=iv(death,:condition)

          put(death_condition,:variable_valid,true)
          put(death_condition,:variable_id,HP_VAR)
          put(death_condition,:variable_value,MAX_HP)
          put(death_condition,:switch1_valid,false)
          put(death_condition,:switch2_valid,false)
          put(death_condition,:self_switch_valid,false)

          put(death,:trigger,4)
          put(death,:move_type,0)
          put(death,:through,true)

          # Keep the same death-page graphic.
          put(death,:list,[
            command(355,[reward_script]),
            command(230,[45]),
            command(116,[]),
            command(0,[])
          ])

          # 7. Strict protection of unrelated data.
          other_events.each do |id,raw|
            raise "Other monster changed: #{id}" unless
              Marshal.dump(events[id])==raw
          end

          original_common.each_with_index do |raw,id|
            next if private_ids.include?(id)

            current=common[id]
            actual=current.nil? ? nil : Marshal.dump(current)

            raise "Unrelated common event changed: #{id}" unless
              actual==raw
          end

          pages.each_with_index do |page,index|
            raise "Image changed on page #{index}" unless
              Marshal.dump(iv(page,:graphic))==original_graphics[index]
          end

          raise 'Original Death Knight map modified' unless
            File.binread(MAP16)==original_map16

          raise 'Original game engine modified' unless
            File.binread(SCRIPTS)==original_scripts

          raise 'Wrong death HP' unless
            iv(death_condition,:variable_value)==5200

          raise 'Wrong reward command sequence' unless
            iv(death,:list).map{|cmd|iv(cmd,:code)}==
            [355,230,116,0]

          File.binwrite(MAP25,Marshal.dump(map))
          File.binwrite(COMMON,Marshal.dump(common))

          File.write(
            'build/stats-report.json',
            JSON.pretty_generate({
              version:'V276.2',
              monster:'제니스 퀸',
              map:25,
              event:29,
              level:LEVEL,
              hp:MAX_HP,
              physical:PHYSICAL,
              magic:MAGIC,
              accuracy:ACCURACY,
              hit_random:HIT_RANDOM,
              move_speed:MOVE_SPEED,
              move_frequency:MOVE_FREQUENCY,
              attack_wait:ATTACK_WAIT,
              magic_floor:MAGIC_FLOOR,
              exp:EXP,
              adena:ADENA,
              drops:DROPS,
              native_attack_ce:id901,
              native_cycle_ce:id179,
              native_damage_ce:id57,
              hit_command_updates:hit_updates,
              hp_display_updates:hp_display_updates,
              attack_wait_updates:wait_updates
            }),
            encoding:'UTF-8'
          )

          puts 'PASS Zenith Queen name and level metadata'
          puts 'PASS HP5200, player hit 15-35'
          puts 'PASS physical 50-100, magic 150-300'
          puts 'PASS original physical:magic ratio 6:1'
          puts 'PASS accuracy 9999 through native event variables'
          puts 'PASS native magic floor 80 and private CE57'
          puts 'PASS native attack interval 20'
          puts 'PASS movement speed 3 and frequency 6'
          puts 'PASS EXP43212, Adena64800-151200, 20 approved drops'
          puts 'PASS original monster events and game scripts untouched'
          puts 'PASS all original and cloned graphics unchanged'
          RUBY

          ruby -c build/stats.rb
          ruby build/stats.rb

      - name: V276.2 Verify saved native monster data
        shell: bash
        run: |
          set -euo pipefail

          cat > build/verify_data.rb <<'RUBY'
          require 'json'

          module RPG
            class Map;end
            class CommonEvent;end
            class AudioFile;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end

          class Table
            def self._load(raw)
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end
            def _dump(level=0);@raw;end
          end

          class Tone
            def self._load(raw)
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end
            def _dump(level=0);@raw;end
          end

          class Color<Tone;end

          def iv(o,k);o.instance_variable_get('@'+k.to_s);end

          data='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          map=Marshal.load(File.binread(data+pre+'Map025.rxdata'))
          common=Marshal.load(File.binread(data+pre+'CommonEvents.rxdata'))

          boss=iv(map,:events).fetch(29)
          pages=iv(boss,:pages)

          raise 'Wrong boss name' unless
            iv(boss,:name)=='제니스 퀸'

          raise 'Wrong level metadata' unless
            iv(boss,:sl_level)==60

          raise 'Original page structure lost' unless
            pages.length==5

          raise 'Wrong movement speed' unless
            pages[0,3].all?{|p|iv(p,:move_speed)==3}

          raise 'Wrong movement frequency' unless
            pages[0,3].all?{|p|iv(p,:move_frequency)==6}

          death=pages[2]
          condition=iv(death,:condition)

          raise 'Wrong HP threshold' unless
            iv(condition,:variable_id)==4988 &&
            iv(condition,:variable_value)==5200

          raise 'Death must remain a native parallel event' unless
            iv(death,:trigger)==4

          commands=iv(death,:list)

          raise 'Wrong reward event' unless
            commands.map{|cmd|iv(cmd,:code)}==[355,230,116,0]

          payout=iv(commands[0],:parameters)[0]

          [
            '64800+rand(86401)',
            '43212',
            'rand(1000)',
            'gain_item',
            'gain_weapon',
            'gain_armor'
          ].each do |required|
            raise "Reward data missing #{required}" unless
              payout.include?(required)
          end

          puts 'PASS V276.2 serialized event and reward data'
          RUBY

          ruby -c build/verify_data.rb
          ruby build/verify_data.rb

      - name: V276.2 Refresh resource hashes and version
        shell: bash
        run: |
          set -euo pipefail

          cat > build/update.py <<'PY'
          from pathlib import Path
          import re
          import hashlib

          root=Path("site")
          game=root/"knight/gameasync"
          mapping=game/"mapping.js"

          text=mapping.read_text("utf-8")
          pre="MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"

          for path in (
              game/"Data"/(pre+"Map025.rxdata"),
              game/"Data"/(pre+"CommonEvents.rxdata")
          ):
              key="Data/"+path.name
              digest=hashlib.md5(path.read_bytes()).hexdigest()

              pattern="("+re.escape(key)+r"\?h=)[0-9a-f]{32}"

              text,count=re.subn(
                  pattern,
                  lambda match:match.group(1)+digest,
                  text
              )

              assert count==1,(key,count)

          mapping.write_text(text,encoding="utf-8")

          loader=root/"knight/js/sl-assets-v229r115.js"
          source=loader.read_text("utf-8")

          assert source.count("var version='V276';")==1

          loader.write_text(
              source.replace(
                  "var version='V276';",
                  "var version='V276.2';"
              ),
              encoding="utf-8"
          )

          for name in ("index.html","knight/index.html"):
              path=root/name
              html=path.read_text("utf-8")

              assert "V276" in html,name

              path.write_text(
                  html.replace("V276","V276.2")
                      .replace("v276","v276.2"),
                  encoding="utf-8"
              )

          print("PASS V276.2 version and new RXData hashes")
          PY

          python3 build/update.py

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/dpad.js

      - name: V276.2 Protect all unrelated original game files
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json

          root=Path("site")

          before=json.loads(
              Path("build/before.json").read_text("utf-8")
          )

          after={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob("*") if p.is_file()
          }

          pre="knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"

          allowed={
              pre+"Map025.rxdata",
              pre+"CommonEvents.rxdata",
              "knight/gameasync/mapping.js",
              "knight/js/sl-assets-v229r115.js",
              "index.html",
              "knight/index.html"
          }

          assert set(before)==set(after),(
              "Files added or removed"
          )

          changed={
              name for name in before
              if before[name]!=after[name]
          }

          assert changed==allowed,(
              "Unexpected game modification",
              sorted(changed^allowed)
          )

          for path in before:
              if path.startswith("knight/gameasync/Graphics/"):
                  assert before[path]==after[path],path

              if path.startswith(pre+"Map") and path!=pre+"Map025.rxdata":
                  assert before[path]==after[path],path

          protected=[
              "knight/gameasync/Data/Scripts.rxdata",
              pre+"Map016.rxdata",
              "knight/js/drive.js",
              "knight/js/dpad.js",
              "knight/assets/map-047-v241.pack"
          ]

          for path in protected:
              assert before[path]==after[path],path

          report=json.loads(
              Path("build/stats-report.json").read_text("utf-8")
          )

          assert report["version"]=="V276.2"
          assert report["hp"]==5200
          assert report["physical"]==[50,100]
          assert report["magic"]==[150,300]
          assert report["accuracy"]==9999
          assert report["hit_random"]==[15,35]
          assert report["attack_wait"]==20
