
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V233
# BASE: Successful V232 Pages artifact, run 41216514904.
# FIX: V232 black screen during startup. The new RGSS code invoked runtime
#      Zlib::Inflate even though the mkxp/mruby game runtime does not expose
#      that Ruby standard-library API. Decode once during GitHub build instead.
# BEFORE -> AFTER: runtime Zlib mask decompression -> static hexadecimal mask.
# PRESERVE: Exactly the original V232 Layer5 bitmap and its game-coordinate cells.
# PRESERVE: V232 Map047 map/collision, NPCs/Pandora, Panorama, 97-image preload,
#           all other graphics, maps, gameplay scripts, controls and saves.
# KEEP DELETED: Talking Island Dungeon Map045 and Map046.
# TITLE: Keep original title wording; update only version label.
name: build-slknight-web.yml | V233 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V233 Download complete successful V232 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41216514904
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V233 Protect deployed V232 game before modification
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          prefix='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          if len(before)!=5504:raise ValueError('Wrong V232 file count')
          if 'V232' not in (root/'knight/index.html').read_text('utf8'):
              raise ValueError('Not the successful V232 game')
          if before['knight/gameasync/Data/Scripts.rxdata']!='eeecbcfd88fc642767f652e44d8ed5d14695da8fb736db1e04d6fc26987cb54e':
              raise ValueError('Unexpected source Scripts.rxdata')
          if before['knight/gameasync/Graphics/Panoramas/SLTI_47_C7_4.png']!='d1f321ba3012e9422e909b2ba4865dfcfaf188cb0671c459597f935537a26991':
              raise ValueError('Original Map047 Panorama changed')
          if 'knight/assets/map-047-v229r151.pack' not in before:
              raise ValueError('Existing Map047 preload missing')
          if prefix+'Map047.rxdata' not in before:
              raise ValueError('Original Map047 missing')
          for mid in (45,46):
              if prefix+f'Map{mid:03d}.rxdata' in before:
                  raise ValueError('Removed dungeon has returned')
          Path('build/before.json').write_text(json.dumps(before,sort_keys=True),'utf8')
          print('PASS successful V232 files, 97-image pack and deleted dungeons')
          PY

      - name: V233 Remove startup Zlib dependency without changing Layer5 data
        shell: bash
        run: |
          set -euo pipefail
          cat > build/fix-opacity.rb <<'RUBY'
          require 'zlib'
          require 'base64'
          require 'digest'

          path='site/knight/gameasync/Data/Scripts.rxdata'
          original=File.binread(path)
          raise 'Wrong V232 scripts' unless Digest::SHA256.hexdigest(original)=='eeecbcfd88fc642767f652e44d8ed5d14695da8fb736db1e04d6fc26987cb54e'
          scripts=Marshal.load(original)
          raise 'Wrong original script count' unless scripts.size==137
          raise 'Expected exact V232 patch before Main' unless scripts[-2][1]=='SLNativeLayer5V232' && scripts[-1][1]=='Main'
          old=Zlib::Inflate.inflate(scripts[-2][2])
          raise 'Wrong V232 native Layer5 source' unless Digest::SHA256.hexdigest(old)=='a5d56142e7aa47e905324d703f02a918bf4addf7e6283a18e4924b498790727d'
          encoded=old.match(/'([A-Za-z0-9+\/=]+)'\.unpack\('m'\)\[0\]/)
          raise 'Original V232 Layer5 bitmap missing' unless encoded
          raw=Zlib::Inflate.inflate(Base64.strict_decode64(encoded[1]))
          raise 'Native Layer5 byte count mismatch' unless raw.bytesize==10800
          raise 'Native Layer5 content changed' unless Digest::SHA256.hexdigest(raw)=='88bd18b349fc4b5a263258d46a482967445e4a4a49bd75f3d078b76d3d5dd930'
          hex=raw.unpack('H*')[0]

          patch=<<'PATCH'
          # Original Map047 S32 Layer5 bitmask, predecoded during the build.
          # No runtime Zlib, Base64 or other Ruby standard-library dependencies.
          module SLNativeLayer5V233
            WIDTH = 363
            HEIGHT = 238
            MASK_HEX = '__HEX__'

            def self.behind_object?(x,y)
              return false if x < 0 || y < 0 || x >= WIDTH || y >= HEIGHT
              pos = y * WIDTH + x
              # Hex stores each byte high-nibble first; bit 0 is low-nibble.
              offset = (pos >> 3) * 2 + ((pos & 4) == 0 ? 1 : 0)
              nibble = MASK_HEX[offset,1]
              return false unless nibble
              (nibble.to_i(16) & (1 << (pos & 3))) != 0
            end
          end

          class Sprite_Character
            alias sl_v233_original_update update
            def update
              sl_v233_original_update
              return unless $game_map && $game_map.map_id == 47
              return unless $game_player && @character
              return unless @character.equal?($game_player)
              source_opacity = @character.opacity
              if SLNativeLayer5V233.behind_object?(@character.x,@character.y)
                self.opacity = source_opacity < 150 ? source_opacity : 150
              else
                self.opacity = source_opacity
              end
            end
          end
          PATCH

          raise 'Expected one mask marker' unless patch.scan('__HEX__').length==1
          patch=patch.sub('__HEX__',hex)
          raise 'Unexpected runtime decompressor' if patch.include?('Zlib::') || patch.include?(".unpack('m')")
          raise 'Embedded mask altered' unless [patch[/MASK_HEX = '([0-9a-f]+)'/,1]].pack('H*')==raw
          File.binwrite('build/sl-native-layer5-v233.rb',patch)
          scripts[-2][1]='SLNativeLayer5V233'
          scripts[-2][2]=Zlib::Deflate.deflate(patch)
          new_data=Marshal.dump(scripts)
          File.binwrite(path,new_data)
          confirm=Marshal.load(File.binread(path))
          raise 'Wrong script location' unless confirm.size==137 && confirm[-2][1]=='SLNativeLayer5V233' && confirm[-1][1]=='Main'
          before=Marshal.load(original)
          raise 'Other original RGSS scripts changed' unless confirm[0...-2]==before[0...-2] && confirm[-1]==before[-1]
          puts 'PASS original Layer5 bitmap byte-for-byte unchanged'
          puts 'PASS no Zlib or Base64 dependency at game start'
          puts 'PASS all other 136 original RGSS sections preserved'
          RUBY
          ruby -c build/fix-opacity.rb
          ruby build/fix-opacity.rb
          ruby -c build/sl-native-layer5-v233.rb

      - name: V233 Update only game script cache and displayed version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          root=Path('site')
          script=root/'knight/gameasync/Data/Scripts.rxdata'
          digest=hashlib.md5(script.read_bytes()).hexdigest()
          mapping=root/'knight/gameasync/mapping.js'
          old=mapping.read_text('utf8')
          new,n=re.subn(r'(Data/Scripts\.rxdata\?h=)[0-9a-f]{32}',
                         lambda m:m.group(1)+digest,old)
          if n!=1:raise ValueError('Original Scripts.rxdata cache entry not unique')
          mapping.write_text(new,'utf8')
          for name in ('index.html','knight/index.html'):
              p=root/name
              old=p.read_text('utf8')
              if 'V232' not in old:raise ValueError('Wrong page baseline '+name)
              p.write_text(old.replace('V232','V233').replace('v232','v233'),'utf8')
          assets=root/'knight/js/sl-assets-v229r115.js'
          old=assets.read_text('utf8')
          if old.count("var version='V232';")!=1:raise ValueError('Wrong asset preload version')
          new=old.replace("var version='V232';","var version='V233';")
          if 'map-047-v229r151.pack' not in new:
              raise ValueError('Original Map047 preload lost')
          assets.write_text(new,'utf8')
          if 'js/sl-assets-v229r115.js?v=v233' not in (root/'knight/index.html').read_text('utf8'):
              raise ValueError('HTML cache tag was not updated')
          print('PASS V233 cache, pages, unchanged predownload pack')
          PY
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: V233 Verify all unapproved game changes are absent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before=json.loads(Path('build/before.json').read_text('utf8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          allowed={'knight/gameasync/Data/Scripts.rxdata',
                   'knight/gameasync/mapping.js',
                   'knight/js/sl-assets-v229r115.js',
                   'index.html','knight/index.html'}
          if before.keys()!=after.keys():raise ValueError('Unexpected game files added/deleted')
          changed={name for name in before if before[name]!=after[name]}
          if changed!=allowed:raise ValueError('Unapproved file changes: '+repr(sorted(changed^allowed)))
          prefix='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          for mid in (45,46):
              if prefix+f'Map{mid:03d}.rxdata' in after:raise ValueError('Deleted dungeon returned')
          for name in (prefix+'Map047.rxdata','knight/assets/map-047-v229r151.pack',
                       'knight/gameasync/Graphics/Panoramas/SLTI_47_C7_4.png'):
              if before[name]!=after[name]:raise ValueError('Original native map/preload altered: '+name)
          print('PASS only scripts and four cache/version files modified')
          print('PASS all maps, original NPCs, collision, graphics and preload preserved')
          PY

      - name: V233 Publish corrected original Layer5 opacity game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
