
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R47
# BASE: deployed successful V229R44, GitHub run 39598356143; discard bad R45/R46.
# CHANGE: PHYSICALLY separate the original Sanctuary 1F/2F floor and wall textures.
# CHANGE: render distinct wall sprite sections with wall-only fade; player stays opaque.
# CHANGE: initial recognition and attack cannot pass through the same R44 movement walls.
# KEEP: R44 passage graph, 106 approved monster spawns, Baphomet original event 13,
#       all 1F/2F stairs, all other maps/game assets and existing mobile input/audio.
# The 12 R44 native-connected 1F bridge cells are displayed as floor, not wall-top.
# Does not touch game2. This is original Game GitHub Pages only.
name: build-slknight-web.yml | V229R47 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R47 Restore last approved R44 original 106-monster game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39598356143
          name: github-pages
          github-token: ${{ github.token }}
          path: r44

      - name: V229R47 Restore the existing native R44 strict passage and bridge audit
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39598356143
          name: SLKnight-V229R44-Wall-Collision-Player-Translucency-106-Monsters
          github-token: ${{ github.token }}
          path: r44-masks

      - name: V229R47 Verify original assets, wall graph and base revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s r44/artifact.tar
          tar -xf r44/artifact.tar -C site
          cp r44-masks/r44-map-45-edges.bin build/
          cp r44-masks/r44-map-46-edges.bin build/
          cp r44-masks/r44-collision-audit.json build/
          python3 - <<'R47_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site');pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          expected={'Data/Scripts.rxdata':'82c10608c869bdb25dfd9056fa1e2c9c11d9071a682e45ba4428e5b48c11974f',
           f'Data/{pre}Map045.rxdata':'611b55b73d42d96f6527d3e97d0abd562efdc538391a91b4893f50e9fd117a7c',
           f'Data/{pre}Map046.rxdata':'554ed7c437238f27f33f1073e6e286a83aa1736dcbf4c95229bb30cfdfe03c5a'}
          for name,expected_sha in expected.items():
           p=root/'knight/gameasync'/name
           assert p.exists() and hashlib.sha256(p.read_bytes()).hexdigest()==expected_sha,name
          for mid,n in [(45,288*144),(46,336*168)]:
           assert (Path('build')/f'r44-map-{mid}-edges.bin').stat().st_size==n
          assert 'V229R44' in (root/'index.html').read_text('utf-8')
          a={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(a)==5472,len(a)
          Path('build/r47-baseline.json').write_text(json.dumps(a,sort_keys=True))
          print('PASS R47 baseline: R44 5,472 original files, exact 106-monster maps, unaltered passage graph')
          R47_BASE

      - name: V229R47 Export original map wall tile coordinates without changing maps
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r47-export.rb <<'R47_EMBEDDED'
          require 'json';require 'digest'
          module RPG
            class Map;end;class AudioFile;end;class MapInfo;end;class Tileset;end
            class Event;class Page;class Condition;end;class Graphic;end;end;end
            class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          class Table
           def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
           def _dump(d=0);@raw;end
           def [](x,y=0,z=0);_,w,h,depth,_=@raw.unpack('V5');@raw.byteslice(20+2*(x+y*w+z*w*h),2).unpack('v')[0];end
          end
          class Tone;def self._load(r);o=allocate;o.instance_variable_set(:@raw,r);o;end;def _dump(d=0);@raw;end;end
          class Color<Tone;end
          prefix=File.join(ARGV.fetch(0),'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO')
          [45,46].each do |mid|
           m=Marshal.load(File.binread(prefix+('Map%03d.rxdata'%mid)))
           w=m.instance_variable_get(:@width);h=m.instance_variable_get(:@height);data=m.instance_variable_get(:@data)
           raw=Array.new(w*h)
           h.times{|y|w.times{|x|t=data[x,y,0];raise "unexpected #{mid} #{x} #{y} #{t}" unless [384,385].include?(t);raw[y*w+x]=t==385 ? 1 : 0}}
           File.binwrite(File.join(ARGV.fetch(1),"r47-walls-#{mid}.bin"),raw.pack('C*'))
           puts "Map #{mid} #{w} #{h} walls #{raw.sum} SHA #{Digest::SHA256.hexdigest(raw.pack('C*'))}"
          end
          R47_EMBEDDED
          ruby -c /tmp/r47-export.rb
          ruby /tmp/r47-export.rb site build

      - name: V229R47 Keep all 106 monster coordinates; isolate 88 detection switches
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r47-monster-events.rb <<'R47_EMBEDDED'
          require 'json'; require 'digest'; require 'set'
          module RPG
           class Map;end;class MapInfo;end;class AudioFile;end;class Tileset;end
           class Event;class Page;class Condition;end;class Graphic;end;end;end
           class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          class Table
           def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
           def _dump(d=0);@raw;end
           def [](x,y=0,z=0);_,w,h,depth,_=@raw.unpack('V5');return nil if x<0 || y<0 || x>=w || y>=h || z<0 || z>=depth; @raw.byteslice(20+2*(x+y*w+z*w*h),2).unpack('v')[0];end
          end
          class Tone
           def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
           def _dump(d=0);@raw;end
          end
          class Color<Tone;end

          def iv(o,k);o.instance_variable_get('@'+k.to_s);end
          def sv(o,k,v);o.instance_variable_set('@'+k.to_s,v);end
          def chk(c,msg);raise msg unless c;end
          site=ARGV.fetch(0); out=ARGV.fetch(1)
          Dir.mkdir(out) unless Dir.exist?(out)
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          root=File.join(site,'knight/gameasync/Data')
          expected_hash={45=>'611b55b73d42d96f6527d3e97d0abd562efdc538391a91b4893f50e9fd117a7c',46=>'554ed7c437238f27f33f1073e6e286a83aa1736dcbf4c95229bb30cfdfe03c5a'}
          expected={45=>{'해골'=>18,'좀비'=>16,'스파토이'=>14},46=>{'버그베어'=>27,'켈베로스'=>25,'킹 버그베어'=>5,'바포메트'=>1}}
          clones=0;details={}
          [45,46].each do |mid|
           path=File.join(root,pre+('Map%03d.rxdata'%mid))
           chk(Digest::SHA256.file(path).hexdigest==expected_hash[mid],"Wrong source R44 map #{mid}")
           before=Marshal.load(File.binread(path));game=Marshal.load(File.binread(path))
           previous=iv(before,'events');events=iv(game,'events')
           chk(events.size==(mid==45 ? 53 : 62),"Map event size changed #{mid}")
           w,h=iv(game,'width'),iv(game,'height')
           edge=File.binread(File.join(out,"r44-map-#{mid}-edges.bin"))
           chk(edge.bytesize==w*h,"Missing original approved collision #{mid}")
           # Explicitly retain all terrain/wall tiles and their original map data.
           data=iv(game,'data')
           wall=Array.new(w*h)
           h.times{|y|w.times{|x|
             t=data[x,y,0]
             chk(t==384 || t==385,"Unexpected original tile #{t} at #{x},#{y}")
             wall[y*w+x]=t==385 ? 1 : 0
           }}
           File.binwrite(File.join(out,"r47-wall-#{mid}.bin"),wall.pack('C*'))
           changed=[]
           events.each do |id,e|
             name=iv(e,'name').to_s.dup.force_encoding('UTF-8').scrub
             next unless name.start_with?('[ID') && !name.include?('힐러') && !name.include?('바포메트')
             next unless id>=16
             pages=iv(e,'pages')
             chk(pages.size==4,"Wrong cloned mob page count: #{mid} / #{id}")
             cond=iv(pages[1],'condition')
             chk(!iv(cond,'switch1_valid'),"Cloned mob already gated unexpectedly: #{mid} / #{id}")
             prior=iv(cond,'switch1_id')
             sid=5000+(mid-45)*100+id
             sv(cond,'switch1_valid',true)
             sv(cond,'switch1_id',sid)
             route=iv(iv(pages[0],'move_route'),'list')
             matches=route.select{|m|iv(m,'code')==45 && iv(m,'parameters').is_a?(Array) && iv(m,'parameters')[0].to_s.dup.force_encoding('UTF-8').scrub.match(/^범위\(10,\d+,1\)$/)}
             chk(matches.size==1,"No unique detection script: #{mid}/#{id}")
             old_script=iv(matches[0],'parameters')[0]
             chk(old_script.include?(prior.to_s),"Wrong old detection ID #{mid}/#{id}")
             iv(matches[0],'parameters')[0]="범위(10,#{sid},1)"
             death=iv(pages[3],'list')
             chk(death.count{|c|iv(c,'code')==202}==3,"Clone respawn changed #{mid}/#{id}")
             reset=death.find{|c|iv(c,'code')==123 && iv(c,'parameters')[0]=='A'}
             chk(!reset.nil?,"Missing original death switch reset #{mid}/#{id}")
             ins=RPG::EventCommand.allocate
             sv(ins,'code',121);sv(ins,'parameters',[sid,sid,1]);sv(ins,'indent',0)
             death.insert(death.index(reset),ins)
             changed<<{'eventID'=>id,'oldDetectionSwitch'=>prior,'newDetectionSwitch'=>sid,'route'=>iv(matches[0],'parameters')[0]}
           end
           chk(changed.length==(mid==45 ? 39 : 49),"Unexpected # cloned mobs #{mid}/#{changed.length}")
           originalIDs=previous.keys.select{|id|id<16}
           originalIDs.each{|id|chk(Marshal.dump(previous.fetch(id))==Marshal.dump(events.fetch(id)),"Existing original event changed #{mid}/#{id}")}
           # Map terrain/walls, existing 106 monster locations, respawn destinations, sprites and other fields unchanged.
           chk(Marshal.dump(iv(before,'data'))==Marshal.dump(iv(game,'data')),"Terrain edited #{mid}")
           events.each{|id,ev|chk([iv(ev,'x'),iv(ev,'y')]==[iv(previous.fetch(id),'x'),iv(previous.fetch(id),'y')],"Spawn moved #{mid}/#{id}")}
           if mid==46
             boss=events.fetch(13)
             chk([iv(boss,'x'),iv(boss,'y')]==[156,100],"Boss moved")
           end
           File.binwrite(path,Marshal.dump(game))
           details[mid]={'clonesGated'=>changed.length,'switches'=>changed,'unchangedEvents'=>events.length}
           clones+=changed.length
           puts "R47 map #{mid}: cloned aggro gates restored #{changed.length}, all existing original events/XY preserved"
          end
          chk(clones==88,"Wrong clone count")
          File.write(File.join(out,'r47-clone-gate-audit.json'),JSON.pretty_generate(details))
          R47_EMBEDDED
          ruby -c /tmp/r47-monster-events.rb
          ruby /tmp/r47-monster-events.rb site build

      - name: V229R47 Create truly separate FLOOR and WALL original panorama textures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow numpy opencv-python-headless
          cat > /tmp/r47-split.py <<'R47_EMBEDDED'
          from pathlib import Path
          from PIL import Image
          import cv2, numpy as np, hashlib, json, re, sys

          ROOT=Path(sys.argv[1]); BUILD=Path(sys.argv[2]); BUILD.mkdir(parents=True,exist_ok=True)
          DIR=ROOT/'knight/gameasync/Graphics/Panoramas'
          REPORT={'version':'V229R47','layers':{},'masks':{},'changed':[]}
          BRIDGES=json.loads((BUILD/'r44-collision-audit.json').read_text())
          for mid,w,h in [(45,288,144),(46,336,168)]:
              raw=(BUILD/f'r47-walls-{mid}.bin').read_bytes()
              assert len(raw)==w*h
              wall=np.frombuffer(raw,dtype=np.uint8).reshape(h,w)
              old_edge=(BUILD/f'r44-map-{mid}-edges.bin').read_bytes()
              assert len(old_edge)==w*h
              # Do not use visible texture colors as colliders; mask comes from the original RGSS terrain.
              distance=cv2.distanceTransform(wall,cv2.DIST_L2,3)
              # Keep elevated wall footprint near traversable floor; omit inaccessible distant dark/unused canvas.
              boundary=((wall>0)&(distance<3.5)).astype(np.uint8)
              boundary_count=int(boundary.sum())
              # R44 native verified exceptions are the only deliberately traversable '385' cells.
              # Remove their visible wall skin so the original native passage does not look like wall walking.
              bridge_tile=np.zeros((h,w),np.uint8)
              for xy in BRIDGES[str(mid)]['R44NativeBridgeTiles']:
                  bx,by=xy;assert wall[by,bx] and old_edge[by*w+bx]>0
                  bridge_tile[by,bx]=1
              assert boundary_count>1000
              changed_tiles=0;total_pixels=0; files=0
              for source in sorted(DIR.glob(f'SLTI_{mid}_C*_*.png')):
                  m=re.fullmatch(rf'SLTI_{mid}_C(\d+)_(\d+)\.png',source.name)
                  if not m: continue
                  cx,cy=map(int,m.groups())
                  rgba=np.array(Image.open(source).convert('RGBA'))
                  assert rgba.shape==(512,512,4)
                  x0=cx*32;y0=cy*32
                  tx=np.arange(x0,x0+32)
                  ty=np.arange(y0,y0+32)
                  mask_tile=np.zeros((32,32),np.uint8)
                  passage_tile=np.zeros((32,32),np.uint8)
                  ix=(tx>=0)&(tx<w);iy=(ty>=0)&(ty<h)
                  if ix.any() and iy.any():
                      # Place only original, explicitly non-traversable wall tile footprints in foreground.
                      mask_tile[np.ix_(iy,ix)] = boundary[np.ix_(ty[iy],tx[ix])]
                      passage_tile[np.ix_(iy,ix)] = bridge_tile[np.ix_(ty[iy],tx[ix])]
                  mask_tile[passage_tile>0]=0
                  mask=np.repeat(np.repeat(mask_tile,16,axis=0),16,axis=1)
                  repair=np.repeat(np.repeat(passage_tile,16,axis=0),16,axis=1)
                  mask=((mask>0)&(rgba[:,:,3]>=254)).astype(np.uint8)
                  covered=int(mask.sum())
                  fixes=((repair>0)&(rgba[:,:,3]>=254)).astype(np.uint8)
                  if covered or fixes.any():
                      # Remove the wall's pixels from the FLOOR texture; do not duplicate a wall image.
                      # Inpainting only supplies hidden floor texture. The original wall pixels are unchanged.
                      # Low-resolution inpainting is bounded and deterministic even for large solid wall regions.
                      # A full 512px Telea fill is prohibitively slow on nearly-solid chunks.
                      rgb_low=cv2.resize(rgba[:,:,:3],(64,64),interpolation=cv2.INTER_AREA)
                      cover_low=cv2.resize(((mask|fixes)*255).astype(np.uint8),(64,64),interpolation=cv2.INTER_NEAREST)
                      rgb_fill=cv2.inpaint(rgb_low,cover_low,2,cv2.INPAINT_TELEA)
                      rgb=cv2.resize(rgb_fill,(512,512),interpolation=cv2.INTER_LINEAR)
                      ground=rgba.copy();ground[:,:,:3][(mask|fixes)>0]=rgb[(mask|fixes)>0]
                      face=np.zeros_like(rgba);face[mask>0]=rgba[mask>0]
                      out=DIR/f'SLTI_{mid}_W_C{cx}_{cy}.png'
                      Image.fromarray(face).save(out,optimize=True)
                      Image.fromarray(ground).save(source,optimize=True)
                      # All original opaque PNG pixels must be EXACTLY recovered with wall overlay on top.
                      reconstruction=ground.copy();reconstruction[mask>0]=face[mask>0]
                      # transparent pixels remain unchanged because masked pixels were opaque.
                      assert np.array_equal(reconstruction[fixes==0],rgba[fixes==0]),(mid,cx,cy,'bad layer separation')
                      tiles=int(mask_tile.sum());changed_tiles+=tiles;total_pixels+=covered;files+=1
                      blocks=[]
                      # Segment the wall texture in small rectangles; avoid full-screen wall opacity changes.
                      for by in range(8):
                          for bx in range(4):
                              if np.any(face[by*64:by*64+64,bx*128:bx*128+128,3]>0):
                                  blocks.append(by*4+bx)
                      REPORT['layers'][f'{mid}:{cx}:{cy}']=blocks
                      REPORT['changed'].append(source.name)
                  else:
                      REPORT['layers'][f'{mid}:{cx}:{cy}']=[]
              REPORT['masks'][str(mid)]={'visualizedNativeFloorBridges':int(bridge_tile.sum()),'wallBoundaryTiles':boundary_count,'layeredRGSSWallTiles':changed_tiles,'layeredSourcePixels':total_pixels,'sourceChunksWithWall':files,'sourceMapTiles':w*h,'originalMovementBitsUnchanged':True}
              print(mid,REPORT['masks'][str(mid)],flush=True)
          assert len(REPORT['layers'])==111,len(REPORT['layers'])
          assert all(v['sourceChunksWithWall']>10 for v in REPORT['masks'].values())
          (BUILD/'r47-layer-manifest.json').write_text(json.dumps(REPORT,ensure_ascii=False,indent=2))
          R47_EMBEDDED
          python3 -m py_compile /tmp/r47-split.py
          python3 /tmp/r47-split.py site build

      - name: V229R47 Remove player translucency; implement independent wall sprites, initial sight and attack walls
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r47-addon.rb <<'R47_ADDON_SOURCE'
          # R47: Actual separated floor and wall textures. No player-opacity overrides.
          module SLTI_V229R47
            PARTS = __WALL_PARTS__
            def self.monster?(entity)
              return false unless entity.is_a?(Game_Event)
              mid = entity.instance_variable_get(:@map_id)
              return false unless mid == 45 || mid == 46
              ev = entity.instance_variable_get(:@event)
              return false if ev == nil
              name=ev.name.to_s
              return name[0,3]=='[ID' && name.index('힐러')==nil
            end

            def self.step?(mid,x,y,d)
              return SLTI_V229R44.allowed?(mid,x,y,d)
            end
            def self.pair_step?(mid,x,y,dx,dy)
              if dx != 0 && dy != 0
                horiz=dx>0 ? 6 : 4
                vert=dy>0 ? 2 : 8
                a=step?(mid,x,y,horiz) && step?(mid,x+dx,y,vert)
                b=step?(mid,x,y,vert) && step?(mid,x,y+dy,horiz)
                return a || b
              elsif dx != 0
                return step?(mid,x,y,dx>0 ? 6 : 4)
              elsif dy != 0
                return step?(mid,x,y,dy>0 ? 2 : 8)
              end
              true
            end
            # Wall-aware ray; accepts either open turn at a true diagonal tile corner.
            # Unlike the over-strict R46 test, it does not require BOTH diagonal paths.
            def self.line_open?(mid,ax,ay,bx,by)
              w=mid==45 ? 288 : (mid==46 ? 336 : 0)
              h=mid==45 ? 144 : (mid==46 ? 168 : 0)
              return false if w==0 || ax<0 || ay<0 || bx<0 || by<0 || ax>=w || bx>=w || ay>=h || by>=h
              bits=mid==45 ? SLTI_V229R44::EDGES_45 : SLTI_V229R44::EDGES_46
              return false if bits[ay*w+ax,1].unpack('C')[0]==0 || bits[by*w+bx,1].unpack('C')[0]==0
              dx=bx-ax;dy=by-ay
              n=[dx.abs,dy.abs].max
              return true if n==0
              x=ax;y=ay
              for i in 1..n
                nx=ax+(dx*i.to_f/n).round
                ny=ay+(dy*i.to_f/n).round
                sx=nx-x;sy=ny-y
                return false unless pair_step?(mid,x,y,sx,sy)
                x=nx;y=ny
              end
              x==bx && y==by
            end
            def self.attack_open?(entity)
              return true unless monster?(entity) && $game_player!=nil
              line_open?($game_map.map_id,entity.x,entity.y,$game_player.x,$game_player.y)
            end
          end

          class Game_Character
            alias slti_r47_original_range 범위
            def 범위(dist,switch_id,mode)
              on=(mode==1 || mode=='on' || mode=='온')
              if on && !$game_switches[switch_id] && SLTI_V229R47.monster?(self)
                return unless SLTI_V229R47.line_open?($game_map.map_id,self.x,self.y,$game_player.x,$game_player.y)
              end
              slti_r47_original_range(dist,switch_id,mode)
            end
          end

          class Game_Event
            alias slti_r47_original_initialize initialize
            def initialize(map_id,event)
              if (map_id==45 || map_id==46) && event.name.to_s[0,3]=='[ID' && event.name.index('힐러')==nil
                cond=event.pages[1].condition
                $game_switches[cond.switch1_id]=false if cond.switch1_valid
              end
              slti_r47_original_initialize(map_id,event)
            end
          end

          class Interpreter
            alias slti_r47_original_command_111 command_111
            def command_111
              if @parameters[0]==11 && @parameters[1]==13 && (@map_id==45 || @map_id==46) && @event_id.to_i>0
                mob=$game_map.events[@event_id]
                if mob!=nil && SLTI_V229R47.monster?(mob) && !SLTI_V229R47.attack_open?(mob)
                  @branch[@list[@index].indent]=false
                  return command_skip
                end
              end
              slti_r47_original_command_111
            end
            # A common event inherits the parent monster's event_id in original RGSS.
            # Suppress only wall-blocked monster damage; never stop an acquired chase.
            alias slti_r47_original_command_311 command_311
            def command_311
              if (@map_id==45 || @map_id==46) && @event_id.to_i>0
                mob=$game_map.events[@event_id]
                return true if mob!=nil && SLTI_V229R47.monster?(mob) && !SLTI_V229R47.attack_open?(mob)
              end
              slti_r47_original_command_311
            end
          end

          # Both assets are distinct textures; no copying the original combined background
          # over the hero, and NO alpha changes to Sprite_Character.
          class Spriteset_Map
            alias slti_r47_native_initialize initialize
            def initialize
              @slti_wall_layers={}
              slti_r47_native_initialize
            end
            alias slti_r47_native_update update
            def update
              slti_r47_native_update
              slti_r47_update_walls if @slti_floor==45 || @slti_floor==46
            end
            def slti_r47_update_walls
              return if @slti_chunk_error
              @slti_wall_layers={} if @slti_wall_layers==nil
              @slti_wall_layers.keys.each do |key|
                next if @slti_chunks.has_key?(key)
                item=@slti_wall_layers.delete(key)
                item[1].each{|tuple|s=tuple[0];s.bitmap=nil;s.dispose unless s.disposed?}
                item[0].dispose if item[0]!=nil && !item[0].disposed?
              end
              # The original terrain loader loads at most one new floor chunk per frame.
              # Load at most ONE matching wall texture per frame, sharing it between wall sections.
              added=0
              @slti_chunks.keys.each do |key|
                next if @slti_wall_layers.has_key?(key)
                cx,cy=key
                parts=SLTI_V229R47::PARTS["#{@slti_floor}:#{cx}:#{cy}"]
                if parts==nil || parts.empty?
                  @slti_wall_layers[key]=[nil,[]]
                  next
                end
                next if added>=1
                filename="Graphics/Panoramas/SLTI_#{@slti_floor}_W_C#{cx}_#{cy}"
                texture=Bitmap.new(filename)
                sprites=[]
                parts.each do |part|
                  sx=(part%4)*128;sy=(part/4)*64
                  s=Sprite.new(@viewport2)
                  s.bitmap=texture
                  s.src_rect.set(sx,sy,128,64)
                  s.zoom_x=2.0;s.zoom_y=2.0
                  s.opacity=255
                  sprites << [s,sx,sy]
                end
                @slti_wall_layers[key]=[texture,sprites]
                added+=1
              end
              sx=[$game_map.display_x.to_i/4,0].max
              sy=[$game_map.display_y.to_i/4,0].max
              hero=@character_sprites[@character_sprites.length-1]
              if hero!=nil && hero.bitmap!=nil
                left=hero.x-hero.ox
                right=left+hero.src_rect.width
                top=hero.y-hero.oy
                bottom=top+hero.src_rect.height
                hz=hero.z
              else
                left=0;right=0;top=0;bottom=0;hz=0
              end
              @slti_wall_layers.each do |key,item|
                cx,cy=key
                item[1].each do |tuple|
                  s,xx,yy=tuple
                  s.x=cx*1024+xx*2-sx
                  s.y=cy*1024+yy*2-sy
                  s.z=s.y+128+8
                  overlap=s.x<right && s.x+256>left && s.y<bottom && s.y+128>top
                  s.opacity=(overlap && s.z>=hz) ? 148 : 255
                end
              end
            end
            alias slti_r47_native_dispose dispose
            def dispose
              if @slti_wall_layers!=nil
                @slti_wall_layers.each_value do |item|
                  item[1].each{|tuple|s=tuple[0];s.bitmap=nil;s.dispose unless s.disposed?}
                  item[0].dispose if item[0]!=nil && !item[0].disposed?
                end
                @slti_wall_layers.clear
              end
              slti_r47_native_dispose
            end
          end
          R47_ADDON_SOURCE
          cat > /tmp/r47-patch.rb <<'R47_PATCH_SOURCE'
          require 'digest';require 'zlib';require 'json'
          site=ARGV.fetch(0);build=ARGV.fetch(1)
          path=File.join(site,'knight/gameasync/Data/Scripts.rxdata')
          expected='82c10608c869bdb25dfd9056fa1e2c9c11d9071a682e45ba4428e5b48c11974f'
          raise 'Wrong R44 scripts' unless Digest::SHA256.file(path).hexdigest==expected
          scripts=Marshal.load(File.binread(path));original=Marshal.load(File.binread(path))
          code28=Zlib::Inflate.inflate(scripts.fetch(28)[2]);code97=Zlib::Inflate.inflate(scripts.fetch(97)[2]);code103=Zlib::Inflate.inflate(scripts.fetch(103)[2]);code134=Zlib::Inflate.inflate(scripts.fetch(134)[2]);code21=Zlib::Inflate.inflate(scripts.fetch(21)[2])
          raise 'R44 passage graph missing' unless code21.include?('module SLTI_V229R44')
          raise 'Renderer missing native chunk terrain code' unless code97.include?('def slti_update_terrain') && code97.include?('@slti_chunks')
          raise 'Original range missing' unless code103.dup.force_encoding('UTF-8').scrub.include?('def 범위(dist_n, 스위치아이디, 방식)')
          # DELETE R44's player transparency block entirely, never redirect it.
          alpha=/# Original wall-front behavior: player translucent where a wall face\n# rises in front of the character\. Do not change enemies or other maps\.\nif @character == \$game_player &&\n   \(\$game_map\.map_id == 45 \|\| \$game_map\.map_id == 46\) &&\n   SLTI_V229R44\.wall_overlap\?\(\$game_map\.map_id,@character\.x,@character\.y\)\n  self\.opacity = 144 if self\.opacity > 144\nend\n/
          raise 'R44 player transparency source changed' unless code28.scan(alpha).length==1
          code28=code28.sub(alpha,'')
          raise 'Original sprite opacity assignment missing' unless code28.include?('self.opacity = @character.opacity')
          manifest=JSON.parse(File.read(File.join(build,'r47-layer-manifest.json')))
          pieces=manifest.fetch('layers').reject{|k,v|v.empty?}
          raise 'Wall parts empty' unless pieces.length>=25
          addon=File.binread('/tmp/r47-addon.rb')
          raise 'Parts anchor missing' unless addon.scan('__WALL_PARTS__').size==1
          addon=addon.sub('__WALL_PARTS__',pieces.inspect)
          anchor='# Both assets are distinct textures'
          a,b=addon.split(anchor,2)
          raise 'Missing wall renderer' unless b && b.include?('class Spriteset_Map')
          vision=a
          renderer=anchor+b
          raise 'Must not alter player opacity' if renderer.include?('self.opacity = @character') || vision.include?('slti_r46')
          code134=code134+"\n"+vision+"\n"+renderer
          scripts[28][2]=Zlib::Deflate.deflate(code28)
          scripts[134][2]=Zlib::Deflate.deflate(code134)
          scripts.each_index{|i|raise "Unapproved script change #{i}" unless [28,134].include?(i) || scripts[i]==original[i]}
          raise 'R44 movement code changed' unless scripts[21]==original[21]
          File.binwrite(path,Marshal.dump(scripts))
          File.binwrite(File.join(build,'r47-script28.rb'),code28)
          File.binwrite(File.join(build,'r47-script134.rb'),code134)
          File.binwrite(File.join(build,'r47-script103-original.rb'),code103)
          File.binwrite(File.join(build,'r47-script97-original.rb'),code97)
          File.binwrite(File.join(build,'r47-script21.rb'),code21)
          puts "R47 scripts: 28 opaque actor, 134 late-stage LOS/attack/independent wall sprites, 97/103 unmodified; layers #{pieces.length}"
          R47_PATCH_SOURCE
          ruby -c /tmp/r47-addon.rb
          ruby -c /tmp/r47-patch.rb
          ruby /tmp/r47-patch.rb site build
          ruby -c build/r47-script28.rb
          ruby -c build/r47-script134.rb

      - name: V229R47 Test real R44 wall rays, close-range recognition, attack protection and wall-only sprite fading
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r47-smoke.rb <<'R47_EMBEDDED'
          require 'json';require 'digest'
          class Rect
            attr_reader :x,:y,:width,:height
            def initialize(x=0,y=0,w=0,h=0);@x=x;@y=y;@width=w;@height=h;end
            def set(x,y,w,h);@x=x;@y=y;@width=w;@height=h;end
          end
          class Bitmap
            def initialize(*args);@disposed=false;end
            def dispose;@disposed=true;end
            def disposed?;@disposed;end
          end
          class Sprite
            attr_accessor :bitmap,:opacity,:zoom_x,:zoom_y,:z,:x,:y,:src_rect,:ox,:oy
            def initialize(*args);@src_rect=Rect.new;@disposed=false;end
            def dispose;@disposed=true;end
            def disposed?;@disposed;end
          end
          class Game_Character
            attr_accessor :x,:y
          end
          class Game_Event < Game_Character
            def initialize(mid,event);@map_id=mid;@event=event;@x=event.x;@y=event.y;end
          end
          class Interpreter
            def command_111;@test_hit=true;true;end
            def command_311;@damage_hit=true;true;end
            def command_skip;@skip_hit=true;true;end
          end
          class Spriteset_Map
            def initialize;end
            def update;end
            def dispose;end
          end
          class StubEvent
            attr_accessor :id,:name,:x,:y,:pages
            def initialize(i,n,x,y,sw)
              @id=i;@name=n;@x=x;@y=y
              cond=Struct.new(:switch1_id,:switch1_valid).new(sw,true)
              @pages=[nil,Struct.new(:condition).new(cond)]
            end
          end
          class StubMap
            attr_accessor :map_id,:events,:display_x,:display_y
            def initialize(mid);@map_id=mid;@events={};@display_x=0;@display_y=0;end
          end
          $game_switches=Hash.new(false)
          $game_player=Struct.new(:x,:y).new(0,0)
          $game_map=StubMap.new(45)
          load 'build/r47-script21.rb'
          load 'build/r47-script103-original.rb'
          addon=File.binread('build/r47-script134.rb')
          anchor='# R47: Actual separated floor and wall textures.'
          raise 'Missing late game addon' unless addon.include?(anchor)
          eval(addon[addon.index(anchor)..-1].force_encoding('UTF-8'), TOPLEVEL_BINDING, 'R47LateAddon')
          manifest=JSON.parse(File.read('build/r47-layer-manifest.json'))
          assertions=0
          [45,46].each do |mid|
            $game_map.map_id=mid
            w,h=mid==45 ? [288,144] : [336,168]
            raw=File.binread("build/r44-map-#{mid}-edges.bin")
            assert=0;blocked=0
            (0...raw.bytesize).step(6) do |k|
              next if raw.getbyte(k)==0
              x=k%w;y=k/w
              [[1,0,6],[-1,0,4],[0,1,2],[0,-1,8]].each do |dx,dy,dir|
                xx=x+dx;yy=y+dy
                next if xx<0||xx>=w||yy<0||yy>=h||raw.getbyte(yy*w+xx)==0
                want=SLTI_V229R44.allowed?(mid,x,y,dir)
                actual=SLTI_V229R47.line_open?(mid,x,y,xx,yy)
                raise "LOS wall violation #{mid},#{x},#{y}" unless actual==want
                want ? assert+=1 : blocked+=1
              end
            end
            raise 'No blocked wall edges tested' unless blocked>5
            assertions+=assert+blocked
            puts "MAP #{mid} native edge LOS: #{assert+blocked} tests, open #{assert}, walls #{blocked}"
            pairs=[]
            (0...raw.bytesize).each do |k|
              next if raw.getbyte(k)==0
              x=k%w;y=k/w
              next unless x+1<w
              nx=x+1;ny=y
              next if raw.getbyte(ny*w+nx)==0
              good=SLTI_V229R47.line_open?(mid,x,y,nx,ny)
              pairs << [x,y,nx,ny,good]
              break if pairs.any?{|t|t[4]} && pairs.any?{|t|!t[4]}
            end
            good=pairs.find{|p|p[4]};bad=pairs.find{|p|!p[4]}
            raise 'Missing good/bad fixtures' unless good && bad
            bx,by,pbx,pby,_=bad
            mob=StubEvent.new(16,'[ID해골]',bx,by,5000+mid)
            $game_map.events={16=>Game_Event.new(mid,mob)}
            entity=$game_map.events[16]
            sid=mob.pages[1].condition.switch1_id
            $game_switches[sid]=true
            entity=Game_Event.new(mid,mob)
            raise 'Stale aggro gate not reset' if $game_switches[sid]
            $game_player.x=pbx;$game_player.y=pby
            entity.범위(10,sid,1)
            raise 'Monster recognized across wall' if $game_switches[sid]
            # This tests nearby open edge recognition separately from wall fixture.
            ax,ay,qx,qy,_=good
            mob=StubEvent.new(17,'[ID해골]',ax,ay,sid+1)
            entity=Game_Event.new(mid,mob)
            $game_map.events={17=>entity}
            $game_player.x=qx;$game_player.y=qy
            entity.범위(10,sid+1,1)
            raise 'Adjacent monster not recognized' unless $game_switches[sid+1]
            $game_player.x=pbx;$game_player.y=pby
            entity.범위(10,sid+1,1)
            raise 'Aggro dropped after sight loss' unless $game_switches[sid+1]
            # Original monster damage only: if wall blocks, interpreter suppresses HP change.
            $game_map.events={16=>Game_Event.new(mid,StubEvent.new(16,'[ID해골]',bx,by,sid))}
            it=Interpreter.new
            it.instance_variable_set(:@map_id,mid)
            it.instance_variable_set(:@event_id,16)
            it.command_311
            raise 'Wall attack damage not blocked' if it.instance_variable_get(:@damage_hit)
            $game_player.x=bx;$game_player.y=by
            it.command_311
            raise 'Valid hit incorrectly blocked' unless it.instance_variable_get(:@damage_hit)
          end
          # Actual shared separated-wall bitmap with segmented sprites, NOT character opacity.
          $game_map.map_id=45
          $game_map.display_x=3*1024*4
          $game_map.display_y=2*1024*4
          hero=Sprite.new
          hero.bitmap=Bitmap.new(12,12)
          hero.ox=0;hero.oy=0;hero.x=250;hero.y=250;hero.z=160
          hero.src_rect.set(0,0,220,200)
          layer=Spriteset_Map.allocate
          layer.instance_variable_set(:@slti_floor,45)
          layer.instance_variable_set(:@slti_chunk_error,false)
          layer.instance_variable_set(:@slti_chunks,{[3,2]=>Sprite.new})
          layer.instance_variable_set(:@slti_wall_layers,{})
          layer.instance_variable_set(:@viewport2,Object.new)
          layer.instance_variable_set(:@character_sprites,[hero])
          layer.slti_r47_update_walls
          item=layer.instance_variable_get(:@slti_wall_layers)[[3,2]]
          raise 'No original isolated wall PNG loaded' unless item && item[0] && item[1].size>0
          raise 'No actual faded WALL sprite' unless item[1].any?{|t|t[0].opacity==148}
          raise 'Hero opacity changed!' unless hero.opacity.nil?
          raise 'No fully opaque wall sections' unless item[1].any?{|t|t[0].opacity==255}
          puts "PASS #{assertions} real wall LOS probes; initial detection and retained aggro; hit blocking; #{item[1].size} separately rendered wall sections; player alpha untouched"
          R47_EMBEDDED
          ruby /tmp/r47-smoke.rb | tee build/r47-game-tests.txt

      - name: V229R47 Register 31 separate wall PNG assets and update the visible version
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r47-manifest.py <<'R47_EMBEDDED'
          from pathlib import Path
          import hashlib,re,json,sys
          site=Path(sys.argv[1]);build=Path(sys.argv[2]);manifest=json.loads((build/'r47-layer-manifest.json').read_text())
          map_path=site/'knight/gameasync/mapping.js';data=map_path.read_text('utf-8')
          root=site/'knight/gameasync'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          existing=['Data/Scripts.rxdata',f'Data/{pre}Map045.rxdata',f'Data/{pre}Map046.rxdata']
          existing += [f'Graphics/Panoramas/{n}' for n in manifest['changed']]
          for name in existing:
              raw=(root/name).read_bytes();needle=name+'?h='
              data,n=re.subn(re.escape(needle)+r'[0-9a-f]{32}',lambda _:needle+hashlib.md5(raw).hexdigest(),data)
              assert n==1,(name,n)
          entries=[]
          for key,ids in manifest['layers'].items():
              if not ids:continue
              mid,cx,cy=key.split(':')
              filename=f'SLTI_{mid}_W_C{cx}_{cy}.png'
              target=root/'Graphics/Panoramas'/filename
              assert target.is_file() and target.stat().st_size>100
              name=f'Graphics/Panoramas/{filename}'
              assert name+'?h=' not in data
              entries.append(f'["graphics/panoramas/{filename[:-4].lower()}", "{name}?h={hashlib.md5(target.read_bytes()).hexdigest()}"],')
          assert len(entries)==31,len(entries)
          assert data.count('\n];\n\nvar mapping = {};')==1
          # Insert new texture resolutions before the original mappingArray ends.
          data=data.replace('\n];\n\nvar mapping = {};','\n'+ '\n'.join(entries)+'\n];\n\nvar mapping = {};')
          map_path.write_text(data,'utf-8')
          for f in (site/'index.html',site/'knight/index.html'):
              text=f.read_text('utf-8');assert 'V229R44' in text,f
              f.write_text(text.replace('V229R44','V229R47').replace('v229r44','v229r47'),'utf-8')
          print('R47 mapping updated:',len(existing),'existing files +',len(entries),'new true wall assets; title/version V229R47')
          R47_EMBEDDED
          python3 /tmp/r47-manifest.py site build
          node --check site/knight/gameasync/mapping.js

      - name: V229R47 Reject unrelated changes and retain all 106 monsters, walls, stairs and sounds
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'R47_FINAL'
          from pathlib import Path
          import hashlib,json,re
          site=Path('site');build=Path('build')
          before=json.loads((build/'r47-baseline.json').read_text())
          after={str(p.relative_to(site)):hashlib.sha256(p.read_bytes()).hexdigest() for p in site.rglob('*') if p.is_file()}
          manifest=json.loads((build/'r47-layer-manifest.json').read_text())
          old_changed={k for k in before if after.get(k)!=before[k]}
          pre='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          allowed={'index.html','knight/index.html','knight/gameasync/mapping.js','knight/gameasync/Data/Scripts.rxdata',pre+'Map045.rxdata',pre+'Map046.rxdata'}
          allowed.update('knight/gameasync/Graphics/Panoramas/'+n for n in manifest['changed'])
          assert old_changed==allowed,('Unapproved old files changed',old_changed^allowed)
          new={k for k in after if k not in before}
          expected=set()
          for key,blocks in manifest['layers'].items():
           if blocks:
            mid,cx,cy=key.split(':')
            expected.add(f'knight/gameasync/Graphics/Panoramas/SLTI_{mid}_W_C{cx}_{cy}.png')
          assert new==expected and len(expected)==31,(len(new),len(expected))
          assert len(before)==5472 and len(after)==5503
          for mid,n in [(45,288*144),(46,336*168)]:
           e=(build/f'r44-map-{mid}-edges.bin').read_bytes()
           assert len(e)==n
          assert manifest['masks']['45']['visualizedNativeFloorBridges']==12
          assert manifest['masks']['46']['visualizedNativeFloorBridges']==0
          assert 'V229R47' in (site/'index.html').read_text('utf-8')
          assert 'V229R47' in (site/'knight/index.html').read_text('utf-8')
          assert 'player alpha untouched' in (build/'r47-game-tests.txt').read_text()
          result={'version':'V229R47','originalR44Files':5472,'finalFiles':5503,
           'newSeparateWallTextures':31,'changedOriginalWallFloorChunks':len(manifest['changed']),
           'approvedMonsterCount':106,'baphometEventID':13,'baphometXY':[156,100],
           'firstAggroRequiresClearNativeRoute':True,'laterAggroPersists':True,
           'wallBlockedAttackSuppressed':True,'playerOpacityPatched':False,
           'nativeCollisionMaskChanged':False,'mobileRealPlayTested':False}
          (build/'r47-integrity.json').write_text(json.dumps(result,indent=2))
          print('PASS R47 complete: physically separate wall and floor assets; preserved 106 monsters and R44 collision; wall-only translucency')
          R47_FINAL

      - name: V229R47 Upload authentic separate wall layer and combat regression audit
        uses: actions/upload-artifact@v4
        with:
          name: SLKnight-V229R47-Separate-Native-Walls-and-106-Monsters
          path: |
            build/r47-layer-manifest.json
            build/r47-game-tests.txt
            build/r47-integrity.json
            build/r47-clone-gate-audit.json
          retention-days: 30
          if-no-files-found: error

      - name: V229R47 Upload corrected original SLKnight to the SAME GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
