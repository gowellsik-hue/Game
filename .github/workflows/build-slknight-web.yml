      - name: Prepare L1J physical combat runtime
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl49-runtime.rb <<'RUBY'
          # encoding: UTF-8
          module SL49
            TRAITS=__TRAITS__
            STATS=__STATS__

            WEAPONS={
              '일본도'=>[41,10,12,1,0,'iron','sword',0],
              '레이피어'=>[42,11,6,0,0,'oriharukon','sword',0],
