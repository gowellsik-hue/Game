
name: V203 | Fairy Combat SE Browser Bridge - Knight Unchanged

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Restore successful V202 deployment
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 38187544636
          github-token: ${{ github.token }}
          path: prior

      - name: Extract and protect existing game files
        shell: bash
        run: |
          set -euo pipefail
          test -s prior/artifact.tar
          mkdir -p site
          tar -xf prior/artifact.tar -C site
          for f in site/knight/index.html site/knight/gameasync/Data/Scripts.rxdata site/knight/js/dpad.js site/elf/index.html site/elf/gameasync/Data/Scripts.rxdata site/elf/js/dpad.js site/elf/gameasync/mapping.js site/elf/gameasync/Audio/SE/여요정주먹.ogg site/elf/mkxp.wasm; do
            test -s "$f"
          done
          sha256sum site/knight/index.html site/knight/gameasync/Data/Scripts.rxdata site/knight/js/dpad.js site/elf/js/dpad.js site/elf/mkxp.js site/elf/mkxp.wasm > /tmp/v203_unchanged.sha
          cp site/elf/gameasync/Data/Scripts.rxdata /tmp/v203_original_scripts.rxdata
          echo V203_V202_BASE_PROTECTED

      - name: Route Fairy SE to existing browser audio bridge
        shell: bash
        run: |
          set -euo pipefail
          ruby -rzlib - site/elf/gameasync/Data/Scripts.rxdata <<'RB'
          path = ARGV.fetch(0)
          scripts = Marshal.load(File.binread(path))
          matching = scripts.select { |entry| entry.is_a?(Array) && entry[1].to_s == 'Web Compatibility' }
          abort "Web Compatibility count=#{matching.length}" unless matching.length == 1
          entry = matching[0]
          code = Zlib::Inflate.inflate(entry[2]).force_encoding('UTF-8')
          old = "  def self.bgs_fade(time);sl_stream('BGS_FADE',time);end\nend"
          new_code = "  def self.bgs_fade(time);sl_stream('BGS_FADE',time);end\n" +
            "  def self.se_play(filename,volume=100,pitch=100);sl_stream('SE_PLAY',filename,volume,pitch);end\n" +
            "  def self.se_stop;sl_stream('SE_STOP');end\nend"
          abort 'Fairy audio hook anchor mismatch' unless code.scan(old).length == 1
          code.sub!(old, new_code)
          abort 'Native SE route remains' unless code.include?("def self.se_play(filename,volume=100,pitch=100)")
          RubyVM::InstructionSequence.compile(code, 'Fairy Web Compatibility V203')
          entry[2] = Zlib::Deflate.deflate(code)
          File.binwrite(path, Marshal.dump(scripts))
          puts 'V203_FAIRY_NATIVE_SE_BYPASSED'
          RB

      - name: Add SE channel and update Fairy cache and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          root = Path('site/elf')
          html_file = root / 'index.html'
          html = html_file.read_text(encoding='utf-8')
          replacements = (
              ('var ch={BGM:new Audio(),BGS:new Audio()},pending=[];',
               'var ch={BGM:new Audio(),BGS:new Audio(),SE:new Audio()},pending=[];'),
              ("return encodeURI('gameasync/'+p+'.ogg?v=v143z100');",
               "return encodeURI('gameasync/'+p+'.ogg?v=v203');"),
              ('gameasync/mapping.js?v=fairy202',
               'gameasync/mapping.js?v=fairy203'),
              ("box.textContent='V202 '+state", "box.textContent='V203 '+state"),
              ("    if(pos>=0)lastTarget=s.slice(pos,pos+75);",
               "    if(pos>=0)lastTarget=s.slice(pos,pos+75);\n"
               "    pos=s.indexOf('SLAUDIO|SE_PLAY|');\n"
               "    if(pos>=0)lastTarget=s.slice(pos,pos+75);"),
          )
          for old, new in replacements:
              if html.count(old) != 1:
                  raise SystemExit('Fairy bridge anchor mismatch: ' + old)
              html = html.replace(old, new, 1)
          html_file.write_text(html, encoding='utf-8')
          script_data = root / 'gameasync/Data/Scripts.rxdata'
          digest = hashlib.md5(script_data.read_bytes()).hexdigest()
          mapping_file = root / 'gameasync/mapping.js'
          mapping = mapping_file.read_text(encoding='utf-8')
          rx = r'(\["data/scripts",\s*"Data/Scripts\.rxdata\?h=)[0-9a-f]{32}("\],)'
          patched, count = re.subn(rx, lambda m: m.group(1) + digest + m.group(2), mapping)
          if count != 1:
              raise SystemExit('Fairy Scripts mapping hash mismatch')
          mapping_file.write_text(patched, encoding='utf-8')
          print('V203_BROWSER_SE_CHANNEL_AND_MAPPING_OK')
          PY

      - name: Validate single Ruby script change and unchanged combat input
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c /tmp/v203_unchanged.sha
          node --check site/elf/js/dpad.js
          ruby -rzlib - /tmp/v203_original_scripts.rxdata site/elf/gameasync/Data/Scripts.rxdata <<'RB'
          before = Marshal.load(File.binread(ARGV[0]))
          after = Marshal.load(File.binread(ARGV[1]))
          abort 'Fairy Scripts array size changed' unless before.size == after.size
          changed = (0...before.size).select { |i| before[i] != after[i] }
          abort "Unexpected Fairy script changes: #{changed.inspect}" unless changed.size == 1
          original = before[changed[0]]
          modified = after[changed[0]]
          abort 'Wrong script patched' unless original[1] == 'Web Compatibility' && modified[1] == original[1]
          old = Zlib::Inflate.inflate(original[2])
          now = Zlib::Inflate.inflate(modified[2])
          expected = old.sub("  def self.bgs_fade(time);sl_stream('BGS_FADE',time);end\nend",
            "  def self.bgs_fade(time);sl_stream('BGS_FADE',time);end\n" +
            "  def self.se_play(filename,volume=100,pitch=100);sl_stream('SE_PLAY',filename,volume,pitch);end\n" +
            "  def self.se_stop;sl_stream('SE_STOP');end\nend")
          abort 'Other Ruby source changed' unless now == expected
          RubyVM::InstructionSequence.compile(now, 'Fairy Audio V203')
          puts 'V203_ONLY_AUDIO_COMPATIBILITY_CHANGED'
          RB
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('site/elf')
          scripts = (root / 'gameasync/Data/Scripts.rxdata').read_bytes()
          mapping = (root / 'gameasync/mapping.js').read_text(encoding='utf-8')
          html = (root / 'index.html').read_text(encoding='utf-8')
          assert 'Data/Scripts.rxdata?h=' + hashlib.md5(scripts).hexdigest() in mapping
          assert 'gameasync/mapping.js?v=fairy203' in html
          assert 'var ch={BGM:new Audio(),BGS:new Audio(),SE:new Audio()}' in html
          assert 'SLAUDIO|SE_PLAY|' in html
          assert "box.textContent='V203 '+state" in html
          assert 'js/dpad.js?v=fairy198' in html
          print('V203_NO_CONTROL_OR_HUD_REGRESSION')
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
