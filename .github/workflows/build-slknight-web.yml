            cond=ev.pages[1].condition
            assert.call(!cond.switch2_valid && !cond.instance_variable_get(:@variable_valid),"Monster page still blocked by second condition #{mid}/#{id}")
            if mid==45 && cond.instance_variable_get(:@variable_value)==1
             combats=ev.pages[1].instance_variable_get(:@list).select{|op|op.instance_variable_get(:@code)==111 && op.instance_variable_get(:@parameters)==[0,cond.switch1_id,0]}
             assert.call(combats.size==1,"Zombie attack command still gated by switch23: #{id}")
            end
