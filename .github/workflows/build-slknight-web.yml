
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R62
# BASE: successful V229R61 game run 40077912569.
# FIX: fire, wind, ice, earth Fang monsters: hit-taken random 1-10 to 1-12.
# SCOPE: Map035 EV 2,4,5,6,7,8,9,10 and Map043 EV 13,14; 4 directions each.
# KEEP: variable 334 accuracy random 1-8, all other combat stats, original
# movement, maps, sprites, 491EV reward data, drops, monster AI, and engine.
# No extra files are added to the published site.
name: build-slknight-web.yml | V229R62 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R62 Restore entire successful R61 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40077912569
          name: github-pages
          github-token: ${{ github.token }}
          path: r61

      - name: V229R62 Verify source inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s r61/artifact.tar
          tar -xf r61/artifact.tar -C site
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          for name in ('index.html','knight/index.html'):
              assert 'V229R61' in (root/name).read_text('utf-8'),name
          old={str(f.relative_to(root)):hashlib.sha256(f.read_bytes()).hexdigest()
               for f in root.rglob('*') if f.is_file()}
          assert len(old)==5517,len(old)
          Path('build/r62-baseline.json').write_text(json.dumps(old,sort_keys=True))
          print('PASS R61 original game: 5517 files verified')
          PY_BASE

      - name: V229R62 Patch only the ten Fang monster events
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r62_patch.rb <<'R62_PATCH'
          # encoding: UTF-8
          require 'digest'
          require 'json'

          module RPG
            class Map; end
            class AudioFile; end
            class Event
              class Page
                class Condition; end
                class Graphic; end
              end
            end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
          end
          class Table
            def self._load(raw)
              item=allocate
              item.instance_variable_set(:@rgss_bytes,raw)
              item
            end
            def _dump(level=0); @rgss_bytes; end
          end
          class Tone
            def self._load(raw)
              item=allocate
              item.instance_variable_set(:@rgss_bytes,raw)
              item
            end
            def _dump(level=0); @rgss_bytes; end
          end
          class Color < Tone; end

          root=ARGV.fetch(0)
          report_path=ARGV.fetch(1)
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          folder=File.join(root,'knight/gameasync/Data')

          # Each monster has four directional hit handlers.
          # Variable 334 is separate accuracy random and remains unchanged.
          TARGETS={
            35=>{
              2=>['화염의 이빨',904],4=>['화염의 이빨',905],
              5=>['바람의 이빨',906],6=>['바람의 이빨',907],
              7=>['빙하의 이빨',908],8=>['빙하의 이빨',909],
              9=>['대지의 이빨',910],10=>['대지의 이빨',911]
            },
            43=>{
              13=>['빙하의 이빨',909],14=>['대지의 이빨',910]
            }
          }.freeze
          BASE_SHA={
            35=>'42b1491a9449959ba6a04d0340e85185d5a8d45e216e400386a26002b34e90dd',
            43=>'cbdb37f87a40b13e231075a3366690e328e8ffa6eda0c7f321454f4004bcb889'
          }.freeze

          def affected_commands(event,variable,maximum,operation=1)
            pages=event.instance_variable_get(:@pages)
            expected=[variable,variable,operation,4,1,maximum]
            pages.each_with_index.flat_map do |page,page_number|
              Array(page.instance_variable_get(:@list)).each_with_index.filter_map do |command,index|
                next unless command.instance_variable_get(:@code)==122
                next unless command.instance_variable_get(:@parameters)==expected
                [page_number,index,command]
              end
            end
          end

          report={version:'V229R62',base:'V229R61',changed_events:[],
            changed_commands:0,old_random:'1~10',new_random:'1~12',
            unchanged_accuracy_random:'1~8'}

          TARGETS.each do |mid,records|
            path=File.join(folder,prefix+format('Map%03d.rxdata',mid))
            raw=File.binread(path)
            raise "Wrong R61 map source: #{mid}" unless Digest::SHA256.hexdigest(raw)==BASE_SHA.fetch(mid)
            original=Marshal.load(raw)
            changed=Marshal.load(raw)
            orig_events=original.instance_variable_get(:@events)
            events=changed.instance_variable_get(:@events)
            raise 'Event ID set changed' unless orig_events.keys==events.keys
            orig_fields=original.instance_variables.reject{|v|v==:@events}.map{|v|[v,Marshal.dump(original.instance_variable_get(v))]}
            changed_fields=changed.instance_variables.reject{|v|v==:@events}.map{|v|[v,Marshal.dump(changed.instance_variable_get(v))]}
            raise 'Map non-event content changed' unless orig_fields==changed_fields
            records.each do |eid,(name,varid)|
              ev=events.fetch(eid)
              original_ev=orig_events.fetch(eid)
              actual_name=ev.instance_variable_get(:@name).to_s.dup.force_encoding('UTF-8')
              raise "Unexpected name Map#{mid} EV#{eid}: #{actual_name}" unless actual_name=="[ID#{name}]"
              matches=affected_commands(ev,varid,10)
              raise "Expected four directional hit-random commands Map#{mid} EV#{eid}, got #{matches.length}" unless matches.length==4
              raise 'Found hit-random command on wrong event page' unless matches.all?{|page,index,cmd|page==0}
              accuracy=affected_commands(ev,334,8,0)
              raise "Accuracy roll mismatch Map#{mid} EV#{eid}" unless accuracy.length==4
              matches.each do |page,index,command|
                command.instance_variable_get(:@parameters)[5]=12
                report[:changed_commands]+=1
              end
              restored_ev=Marshal.load(Marshal.dump(ev))
              affected_commands(restored_ev,varid,12).each do |page,index,command|
                command.instance_variable_get(:@parameters)[5]=10
              end
              raise "Unintended event alteration Map#{mid} EV#{eid}" unless Marshal.dump(restored_ev)==Marshal.dump(original_ev)
              report[:changed_events] << {map:mid,event:eid,monster:name,variable:varid,directions:4,old:'1~10',new:'1~12'}
            end
            events.each do |eid,event|
              next if records.key?(eid)
              raise "Unrelated event changed Map#{mid} EV#{eid}" unless Marshal.dump(event)==Marshal.dump(orig_events[eid])
            end
            File.binwrite(path,Marshal.dump(changed))
            verified=Marshal.load(File.binread(path))
            records.each do |eid,(name,varid)|
              ev=verified.instance_variable_get(:@events).fetch(eid)
              raise "New hit-random not written Map#{mid} EV#{eid}" unless affected_commands(ev,varid,12).length==4
              raise "Old range remains Map#{mid} EV#{eid}" unless affected_commands(ev,varid,10).empty?
              raise "Accuracy range modified Map#{mid} EV#{eid}" unless affected_commands(ev,334,8,0).length==4
            end
            puts "PASS Map#{format('%03d',mid)}: #{records.length} fangs, #{records.length*4} hit-random commands upgraded"
          end
          raise 'Expected 10 events / 40 commands' unless report[:changed_events].length==10 && report[:changed_commands]==40
          File.write(report_path,JSON.pretty_generate(report))
          puts 'PASS all 10 elemental fangs, 40 directions; accuracy, loot, monster identity and other events unchanged'
          R62_PATCH
          ruby -c /tmp/r62_patch.rb
          ruby /tmp/r62_patch.rb site build/r62-changes.json

      - name: V229R62 Update only two map hashes and verify preservation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'R62_VERIFY'
          from pathlib import Path
          import hashlib,json,re

          root=Path('site')
          engine=root/'knight/gameasync'
          mapping=engine/'mapping.js'
          text=mapping.read_text(encoding='utf-8')
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          for mid in (35,43):
              uri=f'Data/{prefix}Map{mid:03}.rxdata'
              fp=engine/uri
              digest=hashlib.md5(fp.read_bytes()).hexdigest()
              text,n=re.subn(re.escape(uri)+r'\?h=[a-f0-9]{32}',lambda m:uri+'?h='+digest,text)
              assert n==1,('missing or duplicate hash',uri,n)
          mapping.write_text(text,encoding='utf-8')
          for name in ('index.html','knight/index.html'):
              page=root/name
              original=page.read_text(encoding='utf-8')
              assert 'V229R61' in original,name
              page.write_text(original.replace('V229R61','V229R62').replace('v229r61','v229r62'),encoding='utf-8')
          base=json.loads(Path('build/r62-baseline.json').read_text(encoding='utf-8'))
          now={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(base)==len(now)==5517 and base.keys()==now.keys()
          changed={p for p in base if base[p]!=now[p]}
          expected={'index.html','knight/index.html','knight/gameasync/mapping.js',*(f'knight/gameasync/Data/{prefix}Map{mid:03}.rxdata' for mid in (35,43))}
          assert changed==expected,('unexpected file change',sorted(changed^expected))
          report=json.loads(Path('build/r62-changes.json').read_text(encoding='utf-8'))
          assert len(report['changed_events'])==10 and report['changed_commands']==40
          assert sorted((x['map'],x['event']) for x in report['changed_events'])==sorted([(35,i) for i in (2,4,5,6,7,8,9,10)]+[(43,13),(43,14)])
          assert hashlib.sha256((engine/'Data/Scripts.rxdata').read_bytes()).hexdigest()==base['knight/gameasync/Data/Scripts.rxdata']
          print('PASS 5517 preserved files, only two fang maps, mapping hash and two labels changed')
          print('PASS 10 fang events / 40 hit random commands; untouched accuracy and original runtime')
          R62_VERIFY
          node --check site/knight/gameasync/mapping.js

      - name: V229R62 Upload 10-event hit-random audit
        uses: actions/upload-artifact@v4
        with:
          name: SLKnight-V229R62-Fang-Hit-Random
          path: build/r62-changes.json
          retention-days: 30
          if-no-files-found: error

      - name: V229R62 Upload complete game to original GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
