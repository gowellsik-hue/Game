name: Deploy SLKnight Clean Web Runtime
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: slknight-github-pages, cancel-in-progress: true}
env:
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake cmake curl ffmpeg freepats git imagemagick libtool make mm-common patch pkg-config python3 rake ruby timidity unzip wget xz-utils fonts-nanum

      - name: Checkout mkxp-web source
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.MKXP_SRC_REF }}
          path: engine

      - name: Cache mkxp-web dependencies
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-deps-${{ runner.os }}-emsdk-${{ env.EMSDK_VER }}-v2-onig25b

      - name: Patch engine
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one target, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'engine/src/config.cpp',
              'fixedFramerate = 40;',
              'fixedFramerate = 0;'
          )

          replace_once(
              'engine/src/config.cpp',
              'defScreenW = 640;',
              'defScreenW = 800;'
          )

          replace_once(
              'engine/src/config.cpp',
              'defScreenH = 480;',
              'defScreenH = 600;'
          )

          replace_once(
              'engine/src/config.cpp',
              'frameSkip = true;',
              'frameSkip = false;'
          )

          replace_once(
              'engine/src/config.cpp',
              'PO_DESC(smoothScaling, bool, true)',
              'PO_DESC(smoothScaling, bool, false)'
          )

          replace_once(
              'engine/src/graphics.cpp',
              'width = clamp(width, 1, 640);\n\theight = clamp(height, 1, 480);',
              'width = clamp(width, 1, 800);\n\theight = clamp(height, 1, 600);'
          )

          replace_once(
              'engine/binding-mruby/binding-mruby.cpp',
              '\tif (jsSkipFrame() == 1) return;',
              '\t/* Browser timing is driven by RGSS Graphics.frame_rate. */'
          )

          replace_once(
              'engine/build.sh',
              './emsdk install latest',
              './emsdk install 3.1.37'
          )

          replace_once(
              'engine/build.sh',
              './emsdk activate latest',
              './emsdk activate 3.1.37'
          )

          p = Path('engine/binding-mruby/graphics-binding.cpp')
          text = p.read_text()

          marker = '''MRB_FUNCTION(graphicsFrameReset)\n{\n\tMRB_FUN_UNUSED_PARAM;\n\n\tshState->graphics().frameReset();\n\n\treturn mrb_nil_value();\n}\n'''

          addition = marker + '''\nMRB_FUNCTION(graphicsResizeScreen)\n{\n\tMRB_FUN_UNUSED_PARAM;\n\tmrb_int width, height;\n\tmrb_get_args(mrb, "ii", &width, &height);\n\tGUARD_EXC( shState->graphics().resizeScreen(width, height); )\n\treturn mrb_nil_value();\n}\n'''

          if text.count(marker) != 1:
              raise SystemExit('graphicsFrameReset marker mismatch')

          text = text.replace(marker, addition, 1)

          registration = '\tmrb_define_module_function(mrb, module, "frame_reset", graphicsFrameReset, MRB_ARGS_NONE());'

          if text.count(registration) != 1:
              raise SystemExit('frame_reset registration mismatch')

          text = text.replace(
              registration,
              registration + '\n\tmrb_define_module_function(mrb, module, "resize_screen", graphicsResizeScreen, MRB_ARGS_REQ(2));',
              1
          )

          p.write_text(text)

          p = Path('engine/extra/build_config.rb')
          text = p.read_text()

          marker = "    conf.gem :github => 'pulsejet/mruby-marshal'"
          pin = (
              "    conf.gem :github => 'mattn/mruby-onig-regexp', "
              ":checksum_hash => '25b152264cd4dfac84aa39e5fbb428ec84b95e6a'\n"
              + marker
          )

          if text.count(marker) != 1:
              raise SystemExit('mruby-marshal marker mismatch')

          p.write_text(text.replace(marker, pin, 1))

          save_src = Path('engine/src/emscripten.cpp').read_text()
          start = save_src.index('EM_JS(void, save_file_async_js')
          end = save_src.index('});', start) + 3
          save_block = save_src[start:end]

          if 'Asyncify.handleSleep' in save_block:
              raise SystemExit('save_file_async_js must stay non-blocking')

          if 'window.saveFile' not in save_block:
              raise SystemExit('save_file_async_js callback missing')

          print('ENGINE_PATCH_OK')
          PY

      - name: Build engine
        run: |
          set -e

          mkdir -p engine/build/gameasync
          rm -rf engine/deps/mruby/build/repos/wasm32-unknown-gnu/mruby-onig-regexp

          cd engine
          bash build.sh
          cd ..

          rm -rf engine/build/gameasync

          test -s engine/build/index.html
          test -s engine/build/mkxp.js
          test -s engine/build/mkxp.wasm

          echo ENGINE_BUILD_OK

      - name: Install game
        run: |
          set -e

          curl -L --fail --retry 3 -o game.zip "$GAME_URL"
          echo "$GAME_SHA256  game.zip" | sha256sum -c -

          unzip -q game.zip -d src

          rm -rf player
          cp -a engine/build player

          rm -rf player/gameasync player/preload
          mkdir -p player/gameasync/Fonts player/preload/Data

          cp -a src/SLKnight_Android_JoiPlay/. player/gameasync/
          cp engine/extra/rgss.rb player/gameasync/rgss.rb
          cp engine/COPYING player/COPYING-mkxp-web.txt

          cp /usr/share/fonts/truetype/nanum/NanumGothic.ttf \
            player/gameasync/Fonts/NanumGothic.ttf

          cp /usr/share/fonts/truetype/nanum/NanumGothicBold.ttf \
            player/gameasync/Fonts/NanumGothicBold.ttf

          rm -f player/gameasync/Save*.rxdata
          rm -f player/gameasync/README_Android.txt

      - name: Patch RGSS runtime cleanly
        run: |
          ruby -EUTF-8:UTF-8 -rzlib - player/gameasync <<'RB'
          game = ARGV[0]

          ini_path = File.join(game, 'Game.ini')
          ini = File.binread(ini_path)

          scripts_rel = ini[/^Scripts=(.+)$/i, 1].to_s.strip.tr('\\', '/')
          abort 'Scripts entry missing' if scripts_rel.empty?

          source_path = File.join(game, scripts_rel)
          scripts = Marshal.load(File.binread(source_path))

          def source_of(entry)
            Zlib::Inflate.inflate(entry[2]).force_encoding(Encoding::UTF_8)
          end

          def set_source(entry, source)
            entry[2] = Zlib::Deflate.deflate(source)
          end

          def entry_named(scripts, name)
            entry = scripts.find do |e|
              e.is_a?(Array) &&
                e.length >= 3 &&
                e[1].to_s == name
            end

            abort "missing script: #{name}" unless entry
            entry
          end

          def entry_containing(scripts, marker)
            entry = scripts.find do |e|
              next false unless e.is_a?(Array) && e.length >= 3

              begin
                source_of(e).include?(marker)
              rescue
                false
              end
            end

            abort "missing script containing: #{marker}" unless entry
            entry
          end

          def patch_begin_until(source)
            lines = source.lines

            lines.each_index do |i|
              match = lines[i].match(
                /^(\s*)end\s+until\s+(.+?)\s*$/
              )

              next unless match

              indent = match[1]
              condition = match[2]
              j = i - 1

              while j >= 0
                if lines[j][/^\s*/] == indent &&
                   lines[j].strip == 'begin'
                  lines[j] = indent + "loop do\n"
                  lines[i] =
                    indent +
                    "  break if #{condition}\n" +
                    indent +
                    "end\n"
                  break
                end

                j -= 1
              end
            end

            lines.join
          end

          def patch_standard_scene_loop(source)
            lines = source.lines
            i = 0

            while i < lines.length
              unless lines[i].strip == 'loop do'
                i += 1
                next
              end

              indent = lines[i][/^\s*/]
              significant = []
              k = i + 1

              while k < lines.length && significant.length < 8
                stripped = lines[k].strip

                unless stripped.empty? || stripped.start_with?('#')
                  significant << [
                    k,
                    stripped,
                    lines[k][/^\s*/]
                  ]
                end

                k += 1
              end

              finish = nil

              if significant.length >= 7 &&
                 significant[0][1] == 'Graphics.update' &&
                 significant[1][1] == 'Input.update' &&
                 significant[2][1] == 'update' &&
                 significant[3][1] == 'if $scene != self' &&
                 significant[4][1] == 'break' &&
                 significant[5][1] == 'end' &&
                 significant[6][1] == 'end' &&
                 significant[6][2] == indent
                finish = significant[6][0]
              elsif significant.length >= 5 &&
                    significant[0][1] == 'Graphics.update' &&
                    significant[1][1] == 'Input.update' &&
                    significant[2][1] == 'update' &&
                    significant[3][1] == 'break if $scene != self' &&
                    significant[4][1] == 'end' &&
                    significant[4][2] == indent
                finish = significant[4][0]
              end

              if finish
                lines[i..finish] = [
                  indent +
                  "end\n\n" +
                  indent +
                  "def dispose\n"
                ]

                i += 1
                next
              end

              i += 1
            end

            lines.join
          end

          compat = <<'RUBY'
          $joiplay = true

          module Kernel
            def exit(*args)
              nil
            end
          end

          class Win32API
            def initialize(*args)
              @func = args[1].to_s
            end

            def web_input(key)
              case key.to_i
              when 9,90
                Input::A
              when 13,32,67
                Input::C
              when 27,88
                Input::B
              when 68
                Input::Z
              when 81
                Input::L
              when 83
                Input::Y
              when 87
                Input::R
              when 65
                Input::X
              when 16
                Input::SHIFT
              when 17
                Input::CTRL
              when 18
                Input::ALT
              else
                nil
              end
            end

            def call(*args)
              code = web_input(args[0])

              if @func == 'GetAsyncKeyState'
                return code && Input.trigger?(code) ? 1 : 0
              end

              if @func == 'GetKeyState'
                return code && Input.press?(code) ? -1 : 0
              end

              0
            end

            def Call(*args)
              call(*args)
            end
          end

          Font.default_name = 'NanumGothic'

          module Audio
            def self.sl_stream(kind, *parts)
              puts(
                (
                  ['SLAUDIO', kind] +
                  parts.collect { |v| v.to_s }
                ).join('|')
              )
            end

            def self.bgm_play(filename, volume = 100, pitch = 100)
              sl_stream(
                'BGM_PLAY',
                filename,
                volume,
                pitch
              )
            end

            def self.bgm_stop
              sl_stream('BGM_STOP')
            end

            def self.bgm_fade(time)
              sl_stream(
                'BGM_FADE',
                time
              )
            end

            def self.bgs_play(filename, volume = 100, pitch = 100)
              sl_stream(
                'BGS_PLAY',
                filename,
                volume,
                pitch
              )
            end

            def self.bgs_stop
              sl_stream('BGS_STOP')
            end

            def self.bgs_fade(time)
              sl_stream(
                'BGS_FADE',
                time
              )
            end
          end
          RUBY

          scripts.insert(
            0,
            [
              0,
              'Web Compatibility',
              Zlib::Deflate.deflate(compat)
            ]
          )

          font_rules = [
            [
              /((?:Font\.default_name)\s*=\s*)\[\s*["'][^"']*["']\s*\]/n,
              '\1"NanumGothic"'
            ],
            [
              /(Font\.default_name\s*=\s*)["'][^"']*["']/n,
              '\1"NanumGothic"'
            ],
            [
              /(\.font\.name\s*=\s*)["'][^"']*["']/n,
              '\1"NanumGothic"'
            ],
            [
              /(\bFONT_NAME\s*=\s*)["'][^"']*["']/n,
              '\1"NanumGothic"'
            ]
          ]

          scripts.each do |entry|
            next unless entry.is_a?(Array) &&
                        entry.length >= 3

            name = entry[1].to_s

            begin
              text = source_of(entry)
            rescue
              next
            end

            font_rules.each do |rx, replacement|
              text.gsub!(
                rx,
                replacement
              )
            end

            text.gsub!(
              'defined?($joiplay) && $joiplay',
              '$joiplay == true'
            )

            text = patch_begin_until(text)

            unless [
              'Main',
              'Scene_Map',
              'Scene_Equip',
              'Scene_Gameover'
            ].include?(name)
              text = patch_standard_scene_loop(text)
            end

            set_source(
              entry,
              text
            )
          end

          plane_entry = scripts.find do |entry|
            next false unless entry.is_a?(Array) &&
                              entry.length >= 3

            begin
              source_of(entry).match?(
                /^\s*class\s+Plane\s*<\s*Sprite\b/n
              )
            rescue
              false
            end
          end

          abort 'Plane compatibility script missing' unless plane_entry

          set_source(
            plane_entry,
            "# native Plane used on web\n"
          )

          id_sprite = entry_named(
            scripts,
            '아이디 설정'
          )

          set_source(
            id_sprite,
            <<'RUBY'
          class Game_Character
            attr_accessor :sprite_id
          end

          class Sprite_Character
            alias sl_id_original_update update

            def create_id_sprite(text)
              bitmap = Bitmap.new(
                160,
                16
              )

              bitmap.font.name = 'NanumGothic'
              bitmap.font.size = 12
              bitmap.font.bold = false

              bitmap.font.color.set(
                0,
                0,
                0
              )

              bitmap.draw_text(
                0,
                -1,
                160,
                16,
                text,
                1
              )

              bitmap.draw_text(
                0,
                1,
                160,
                16,
                text,
                1
              )

              bitmap.draw_text(
                -1,
                0,
                160,
                16,
                text,
                1
              )

              bitmap.draw_text(
                1,
                0,
                160,
                16,
                text,
                1
              )

              bitmap.font.color.set(
                255,
                255,
                255
              )

              bitmap.draw_text(
                0,
                0,
                160,
                16,
                text,
                1
              )

              @_id_sprite = Sprite.new(
                self.viewport
              )

              @_id_sprite.bitmap = bitmap
              @_id_sprite.opacity = 255
              @_id_sprite.ox = 80
              @_id_sprite.oy = 14
              @_id_sprite.x = self.x
              @_id_sprite.y = self.y - self.oy / 2
              @_id_sprite.z = 9999
              @_id_sprite_visible = true
            end

            def dispose_id_sprite
              if @_id_sprite != nil
                if @_id_sprite.bitmap != nil &&
                   !@_id_sprite.bitmap.disposed?
                  @_id_sprite.bitmap.dispose
                end

                @_id_sprite.dispose
                @_id_sprite = nil
              end

              @_id_sprite_visible = false
            end

            def update_id_sprite
              if @character.sprite_id != nil &&
                 @character.sprite_id.to_s != ''
                unless @_id_sprite_visible
                  create_id_sprite(
                    @character.sprite_id
                  )
                end

                @_id_sprite.x = self.x
                @_id_sprite.y = self.y - self.oy
              elsif @_id_sprite_visible
                dispose_id_sprite
              end
            end

            def update
              sl_id_original_update
              update_id_sprite
            end
          end
          RUBY
          )

          id_output = entry_named(
            scripts,
            '아이디 출력'
          )

          set_source(
            id_output,
            <<'RUBY'
          class Game_Event
            alias sl_id_original_event_refresh refresh

            def refresh
              sl_id_original_event_refresh

              text = @event.name.dup

              text.gsub!(
                /\[[Ii][Dd](.+?)\]/
              ) do
                @sprite_id = $1
              end

              if @erased ||
                 @character_name == ''
                @sprite_id = nil
              end
            end
          end

          class Game_Player
            alias sl_id_original_player_refresh refresh

            def refresh
              sl_id_original_player_refresh

              if $game_party.actors.size > 0
                @sprite_id = nil
              end
            end
          end
          RUBY
          )

          resolution = entry_containing(
            scripts,
            'Graphics.resize_screen'
          )

          resolution_text = source_of(
            resolution
          )

          unless resolution_text.include?(
                   '$WINDOW_WIDTH = 800'
                 ) &&
                 resolution_text.include?(
                   '$WINDOW_HEIGHT = 600'
                 )
            abort '800x600 resolution script missing'
          end

          set_source(
            resolution,
            resolution_text
          )

          equip = entry_named(
            scripts,
            'Scene_Equip'
          )

          equip_text = source_of(
            equip
          )

          equip_loop =
            /\n    # 메인 루프\r?\n    loop do\r?\n.*?      if \$scene != self\r?\n\s*\$game_switches\[49\] = true\r?\n        break\r?\n      end\r?\n    end\r?\n    # 트란지션 준비/m

          equip_replacement =
            "\n" \
            "    # Web: initialization ends here; browser loop drives update.\n" \
            "  end\n\n" \
            "  def dispose\n" \
            "    # 트란지션 준비"

          count = 0

          equip_text =
            equip_text.sub(
              equip_loop
            ) do
              count += 1
              equip_replacement
            end

          abort "Scene_Equip loop patch=#{count}" unless count == 1

          equip_text.gsub!(
            /\n\s*if Keyboard\.testkey\(69\)\s*\r?\n\s*\$scene = Scene_Map\.new\s*\r?\n\s*end\s*\r?\n/m,
            "\n"
          )

          old_refresh =
            "    @item_window.update\n" \
            "    refresh\n"

          new_refresh = <<'RUBY'
              @item_window.update

              state = [
                @right_window.index,
                @right_window.active,
                @item_window.index,
                @item_window.active
              ]

              if @sl_equip_state != state
                refresh

                @sl_equip_state = [
                  @right_window.index,
                  @right_window.active,
                  @item_window.index,
                  @item_window.active
                ]
              end
          RUBY

          refresh_count =
            equip_text.scan(
              Regexp.new(
                Regexp.escape(
                  old_refresh
                )
              )
            ).size

          abort 'Scene_Equip refresh target mismatch' unless refresh_count == 1

          equip_text.sub!(
            old_refresh,
            new_refresh
          )

          initial_refresh =
            "    refresh\n" \
            "    # 트란지션 실행"

          initial_state =
            "    refresh\n" \
            "    @sl_equip_state = [" \
            "@right_window.index, " \
            "@right_window.active, " \
            "@item_window.index, " \
            "@item_window.active" \
            "]\n" \
            "    # 트란지션 실행"

          initial_count =
            equip_text.scan(
              Regexp.new(
                Regexp.escape(
                  initial_refresh
                )
              )
            ).size

          abort 'Scene_Equip initial refresh target mismatch' unless initial_count == 1

          equip_text.sub!(
            initial_refresh,
            initial_state
          )

          set_source(
            equip,
            equip_text
          )

          gameover = entry_named(
            scripts,
            'Scene_Gameover'
          )

          gameover_text = source_of(
            gameover
          )

          gameover_loop =
            /\n    # 메인 루프\r?\n    loop do\r?\n      \$game_system\.me_play\(\$data_system\.gameover_me\)\r?\n      # 게임 화면을 갱신\r?\n      Graphics\.update\r?\n      # 입력 정보를 갱신\r?\n      Input\.update\r?\n      # 프레임 갱신\r?\n      update\r?\n      # 화면이 바뀌면 루프를 중단\r?\n      if \$scene != self\r?\n        break\r?\n      end\r?\n    end\r?\n    # 트란지션 준비/m

          gameover_replacement =
            "\n" \
            "    $game_system.me_play($data_system.gameover_me)\n" \
            "    # Web: initialization ends here; browser loop drives update.\n" \
            "  end\n\n" \
            "  def dispose\n" \
            "    # 트란지션 준비"

          count = 0

          gameover_text =
            gameover_text.sub(
              gameover_loop
            ) do
              count += 1
              gameover_replacement
            end

          abort "Scene_Gameover loop patch=#{count}" unless count == 1

          gameover_text.sub!(
            /^[ \t]*exit\r?\n([ \t]*# 타이틀 화면으로 전환해\r?\n[ \t]*\$scene = Scene_Title\.new)/,
            '\1'
          )

          set_source(
            gameover,
            gameover_text
          )

          scene_map = entry_named(
            scripts,
            'Scene_Map'
          )

          map_text =
            source_of(
              scene_map
            ).gsub(
              "\r\n",
              "\n"
            )

          main_pos =
            map_text.index(
              "  def main\n"
            )

          abort 'Scene_Map main missing' unless main_pos

          loop_comment =
            map_text.index(
              "    # 메인 루프\n",
              main_pos
            )

          abort 'Scene_Map main loop comment missing' unless loop_comment

          loop_line =
            map_text.index(
              "    loop do #루프 시작\n",
              loop_comment
            )

          abort 'Scene_Map loop start missing' unless loop_line

          pre_start =
            loop_line +
            "    loop do #루프 시작\n".length

          graphics_marker =
            map_text.index(
              "      # 게임 화면을 갱신\n",
              pre_start
            )

          abort 'Scene_Map graphics marker missing' unless graphics_marker

          pre_frame =
            map_text[
              pre_start...
              graphics_marker
            ]

          loop_end =
            map_text.index(
              "    end #루프 끝\n",
              graphics_marker
            )

          abort 'Scene_Map loop end missing' unless loop_end

          after_loop =
            loop_end +
            "    end #루프 끝\n".length

          update_comment =
            map_text.index(
              "  #--------------------------------------------------------------------------\n" \
