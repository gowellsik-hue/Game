
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R98
# BASE: successfully deployed V229R97 (run 40326370483).
# FIX: remove only the smooth gray matte baked into 2F floor C panoramas.
# Preserve the original stone texture using clean source pixels from 2F C3_1.
# No 2F floor deletion, no wall W edits, no engine, monster, S32 or D-pad edits.
# All V229R97 movement, UI and terrain corrections are retained byte-for-byte.
name: build-slknight-web.yml | V229R98 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R98 Restore successful deployed R97 without changing the engine
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40326370483
          name: github-pages
          github-token: ${{ github.token }}
          path: r97

      - name: V229R98 Remove only 2F baked-in floor smear
        shell: bash
        run: |
          set -euo pipefail
          test -s r97/artifact.tar
          mkdir -p site build
          tar -xf r97/artifact.tar -C site
          python3 - <<'PY_BASE'
          from pathlib import Path
          import json,hashlib
          root=Path('site')
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert len(files)==5517, ('Unexpected R97 file count',len(files))
          assert 'V229R97' in (root/'index.html').read_text('utf-8')
          assert 'V229R97' in (root/'knight/index.html').read_text('utf-8')
          assert (root/'knight/js/dpad.js').is_file()
          assert (root/'knight/gameasync/Data/Scripts.rxdata').is_file()
          Path('build/r97-files.json').write_text(json.dumps(files,sort_keys=True))
          print('PASS restored R97: 5517 files, original D-pad and engine')
          PY_BASE

          python3 -m venv build/clean-venv
          build/clean-venv/bin/pip install --disable-pip-version-check --quiet pillow numpy opencv-python-headless
          build/clean-venv/bin/python - <<'PY_CLEAN'
          from pathlib import Path
          import re,hashlib,json
          import cv2
          import numpy as np
          from PIL import Image

          pano=Path('site/knight/gameasync/Graphics/Panoramas')
          chunks=sorted(pano.glob('SLTI_46_C*.png'))
          assert len(chunks)==66, ('Wrong 2F floor chunk count',len(chunks))
          walls=sorted(pano.glob('SLTI_46_W_*.png'))
          assert len(walls)>=20, ('Original 2F walls are missing',len(walls))
          wall_hash={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in walls}

          # Sample original 2F stone texture, not generated graphics or black fill.
          with Image.open(pano/'SLTI_46_C3_1.png') as image:
            clean=np.asarray(image.convert('RGB'),dtype=np.uint8)[:320,:320].copy()
          assert clean.shape==(320,320,3)
          gclean=cv2.cvtColor(clean,cv2.COLOR_RGB2GRAY).astype(np.float32)
          mean=cv2.boxFilter(gclean,-1,(9,9))
          var=cv2.boxFilter(gclean*gclean,-1,(9,9))-mean*mean
          assert np.count_nonzero(var<70)<1000, 'Original clean floor sample failed'

          mapping_path=Path('site/knight/gameasync/mapping.js')
          mapping=mapping_path.read_text('utf-8')
          nine=np.ones((9,9),np.uint8)
          seven=np.ones((7,7),np.uint8)
          changed=[]
          total_replaced=0
          for path in chunks:
            match=re.fullmatch(r'SLTI_46_C(\d+)_(\d+)\.png',path.name)
            assert match, ('Wrong 2F chunk name',path.name)
            cx,cy=map(int,match.groups())
            assert 0<=cx<11 and 0<=cy<6
            with Image.open(path) as image:
              pixels=np.asarray(image.convert('RGBA'),dtype=np.uint8).copy()
            h,w=pixels.shape[:2]
            assert (w,h)==(512,512)
            grayscale=cv2.cvtColor(pixels[:,:,:3],cv2.COLOR_RGB2GRAY).astype(np.float32)
            avg=cv2.boxFilter(grayscale,-1,(9,9))
            variance=cv2.boxFilter(grayscale*grayscale,-1,(9,9))-avg*avg
            # Smooth low-texture blobs: exclude rock, stairs, walls and transparency.
            matte=((variance<70)&(grayscale>15)&(pixels[:,:,3]>200)).astype(np.uint8)*255
            matte=cv2.morphologyEx(matte,cv2.MORPH_CLOSE,nine)
            n,labels,stats,_=cv2.connectedComponentsWithStats(matte,8)
            selected=np.zeros((h,w),np.uint8)
            for label in range(1,n):
              if stats[label,cv2.CC_STAT_AREA]>=800:
                selected[labels==label]=255
            selected=cv2.dilate(selected,seven)
            selected=(selected!=0)&(pixels[:,:,3]>200)&(grayscale>15)
            amount=int(selected.sum())
            if not amount:
              continue
            yy,xx=np.indices((h,w))
            original_alpha=pixels[:,:,3].copy()
            floor=clean[(cy*512+yy+180)%320,(cx*512+xx+70)%320]
            pixels[selected,:3]=floor[selected]
            assert np.array_equal(pixels[:,:,3],original_alpha)
            Image.fromarray(pixels).save(path,optimize=True)
            changed.append(path.name)
            total_replaced+=amount
            digest=hashlib.md5(path.read_bytes()).hexdigest()
            pattern=rf'(Graphics/Panoramas/{re.escape(path.name)}\?h=)[0-9a-f]{{32}}'
            mapping,count=re.subn(pattern,lambda m:m.group(1)+digest,mapping)
            assert count==1, ('Missing changed chunk cache entry',path.name,count)

          assert len(changed)>=20 and total_replaced>=1000000, (
            '2F stain removal unexpectedly incomplete',len(changed),total_replaced)
          assert {p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in walls}==wall_hash
          mapping_path.write_text(mapping,encoding='utf-8')
          Path('build/r98-floor-stats.json').write_text(json.dumps({
            'changed':changed,'replaced_pixels':total_replaced},sort_keys=True))
          print('PASS 2F smear removal:',len(changed),'floor chunks,',total_replaced,
                'gray pixels; original wall chunks and floor alpha retained')
          PY_CLEAN

          python3 - <<'PY_VERSION'
          from pathlib import Path
          for name in ('index.html','knight/index.html'):
            path=Path('site')/name
            text=path.read_text('utf-8')
            assert 'V229R97' in text and 'V229R98' not in text
            path.write_text(text.replace('V229R97','V229R98')
                                .replace('v229r97','v229r98'),encoding='utf-8')
          PY_VERSION
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/dpad.js

      - name: V229R98 Verify only floor matte and cache were modified
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_AUDIT'
          from pathlib import Path
          import json,hashlib
          root=Path('site')
          original=json.loads(Path('build/r97-files.json').read_text('utf-8'))
          result={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          assert len(result)==5517 and result.keys()==original.keys()
          modified={name for name in result if result[name]!=original[name]}
          stats=json.loads(Path('build/r98-floor-stats.json').read_text('utf-8'))
          floor={f'knight/gameasync/Graphics/Panoramas/{name}' for name in stats['changed']}
          expected={'index.html','knight/index.html','knight/gameasync/mapping.js'}|floor
          assert modified==expected, ('Unexpected changed files',modified^expected)
          assert len(floor)>=20 and stats['replaced_pixels']>=1000000
          assert result['knight/gameasync/Data/Scripts.rxdata']==original['knight/gameasync/Data/Scripts.rxdata']
          assert result['knight/js/dpad.js']==original['knight/js/dpad.js']
          assert not any('/SLTI_46_W_' in name for name in modified)
          assert not any('/SLTI_45_' in name for name in modified)
          print('PASS only 2F floor matte, mapping cache and 2 version labels changed')
          print('PASS 1F, 2F walls, monster movement, S32, D-pad and game engine unchanged')
          PY_AUDIT

      - name: V229R98 Publish cleaned 2F with original gameplay
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
