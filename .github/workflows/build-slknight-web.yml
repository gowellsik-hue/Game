
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V243
# BASE: V241 successful run 41293648580
# FIX: V242 Map025 event-name binary/UTF-8 comparison failure.
# TARGET: Zenith Queen, existing Tower of Insolence 2F, Map025.
# KEEP: Every existing map, event, NPC, item and Map047 renderer.
# DATA: Lv60 HP5200 physical 50/100 magic 150/300.
# SOURCE: Sanctuary SPR 2807.
# ITEM: Existing Zenith Ring armor ID492, no new item definition.
# RUNTIME: Original motion sheets, mixed attack, poison, slow web,
#          EXP, Adena, item drops, respawn reset.
# VALIDATION: Source parsing, Ruby syntax, reward smoke test,
#             all unrelated game-file hashes preserved.

name: build-slknight-web.yml | V243 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: V243 Restore successful V241 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41293648580
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V243 Verify original game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s baseline/artifact.tar
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json

          root=Path("site")
          before={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob("*") if p.is_file()
          }

          assert len(before)==5603, "Wrong V241 inventory"

          scripts="knight/gameasync/Data/Scripts.rxdata"
          expected=(
              "f43507920c57e81ec1d219bae492f5e"
              "6191f6471f733d8d471f81e8515f7d167"
          )
          assert before[scripts]==expected, "Wrong V241 scripts"

          pre=(
              "knight/gameasync/Data/"
              "MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"
          )
          assert pre+"Map025.rxdata" in before
          assert pre+"Map045.rxdata" not in before
          assert pre+"Map046.rxdata" not in before
          assert "knight/assets/map-047-v241.pack" in before

          Path("build/before.json").write_text(
              json.dumps(before,sort_keys=True)
          )
          print("PASS V241 baseline")
          PY

      - name: V243 Restore original Sanctuary GIF source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p original packages

          gh run download 39386289505 \
            -R "$GITHUB_REPOSITORY" \
            -n audit-sanctuary-monsters-v34-all-source-database \
            -D original

          gh run download 39386289505 \
            -R "$GITHUB_REPOSITORY" \
            -n audit-sanctuary-monsters-v34-all-original-cardinal-gifs \
            -D packages

          test -s original/V34-all-cardinal-gif-manifest.csv

          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil

      - name: V243 Build Zenith Queen 4-direction graphics
        shell: bash
        run: |
          set -euo pipefail

          cat > build/graphics.py <<'PY'
          import csv,io,hashlib,zipfile
          from pathlib import Path
          from PIL import Image

          root=Path("site/knight/gameasync/Graphics/Characters")
          root.mkdir(parents=True,exist_ok=True)

          with open(
              "original/V34-all-cardinal-gif-manifest.csv",
              encoding="utf-8-sig",
              newline=""
          ) as f:
              rows=[
                  r for r in csv.DictReader(f)
                  if int(r["actor"])==2807
                  and int(r["direction"]) in (1,3,5,7)
                  and r["byte_verified"]=="True"
              ]

          assert rows, "Original SPR2807 not found"

          required={
              r["gif"].removeprefix("gifs/"):r
              for r in rows
          }
          loaded={}

          archives=sorted(Path("packages").rglob(
              "V34-*-cardinal-gifs.zip"
          ))
          assert len(archives)==17, "Wrong original archives"

          for archive in archives:
              with zipfile.ZipFile(archive) as z:
                  for name in z.namelist():
                      if name not in required:
                          continue
                      data=z.read(name)
                      expected=required[name]["gif_sha256"]
                      assert hashlib.sha256(data).hexdigest()==expected
                      loaded[name]=data

          assert set(loaded)==set(required), "Missing original GIF"

          groups={}
          for name,record in required.items():
              bank=int(record["bank"])
              direction=int(record["direction"])
              groups.setdefault(bank,{})[direction]=loaded[name]

          banks=[
              b for b in sorted(groups)
              if all(d in groups[b] for d in (1,3,5,7))
          ]
          assert len(banks)>=5, "Insufficient motion banks"

          motions=[
              ("SLZenithWalk",banks[0]),
              ("SLZenithAttack",banks[1]),
              ("SLZenithHit",banks[2]),
              ("SLZenithDeath",banks[3]),
              ("SLZenithMagic",banks[4]),
          ]

          for output,bank in motions:
              frames={}

              for row,direction in enumerate((1,3,5,7)):
                  raw=groups[bank][direction]
                  with Image.open(io.BytesIO(raw)) as gif:
                      count=max(gif.n_frames,1)
                      indexes=[
                          min(count-1,(i*count)//4)
                          for i in range(4)
                      ]
                      seq=[]
                      for index in indexes:
                          gif.seek(index)
                          seq.append(gif.convert("RGBA").copy())
                      frames[row]=seq

              width=max(
                  im.width for seq in frames.values()
                  for im in seq
              )
              height=max(
                  im.height for seq in frames.values()
                  for im in seq
              )

              sheet=Image.new(
                  "RGBA",(width*4,height*4),(0,0,0,0)
              )

              for row,seq in frames.items():
                  for col,im in enumerate(seq):
                      x=col*width+(width-im.width)//2
                      y=row*height+(height-im.height)
                      sheet.alpha_composite(im,(x,y))

              path=root/(output+".png")
              sheet.save(path,optimize=True)
              assert path.stat().st_size>100
              print("PASS",output,"bank",bank)

          print("PASS five original SPR2807 motion sheets")
          PY

          python3 build/graphics.py

      - name: V243 Install Zenith Queen event and battle runtime
        shell: bash
        run: |
          set -euo pipefail

          cat > build/zenith.rb <<'RUBY'
          require 'zlib'
          require 'digest'

          module RPG
            class Map;end
            class MapInfo;end
            class AudioFile;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end

          class Table
            def self._load(raw)
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end
            def _dump(level=0);@raw;end
          end

          class Tone
            def self._load(raw)
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end
            def _dump(level=0);@raw;end
          end

          class Color<Tone;end

          def iv(obj,name)
            obj.instance_variable_get("@"+name.to_s)
          end

          def put(obj,name,value)
            obj.instance_variable_set("@"+name.to_s,value)
          end

          def command(code,params=[])
            obj=RPG::EventCommand.allocate
            put(obj,:code,code)
            put(obj,:indent,0)
            put(obj,:parameters,params)
            obj
          end

          ROOT='site/knight/gameasync/Data/'
          PRE='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          MAP=ROOT+PRE+'Map025.rxdata'
          SCRIPTS=ROOT+'Scripts.rxdata'
          HPVAR=2991

          map=Marshal.load(File.binread(MAP))
          events=iv(map,:events)
          raise 'Map025 event table invalid' unless
            events.is_a?(Hash)

          template=events[11]
          raise 'Map025 EV11 missing' unless template

          # V243 FIX: Marshal returns binary-encoded source names.
          # Compare their UTF-8 contents, not their ASCII-8BIT labels.
          template_name=iv(template,:name).to_s.dup
          template_name.force_encoding('UTF-8')
          template_name=template_name.scrub

          unless template_name.include?('메두사')
            raise "Wrong source event: #{template_name.inspect}"
          end

          original_count=events.size
          original_bytes={}
          events.each do |id,ev|
            original_bytes[id]=Marshal.dump(ev)
          end

          boss=Marshal.load(Marshal.dump(template))
          boss_id=events.keys.max+1

          put(boss,:id,boss_id)
          put(boss,:name,'제니스 퀸')

          occupied=events.values.map do |e|
            [iv(e,:x),iv(e,:y)]
          end

          sx=iv(template,:x)
          sy=iv(template,:y)
          width=iv(map,:width)
          height=iv(map,:height)

          spawn=nil
          (1..8).each do |radius|
            break if spawn
            (-radius..radius).each do |dy|
              break if spawn
              (-radius..radius).each do |dx|
                next unless [dx.abs,dy.abs].max==radius
                x=sx+dx
                y=sy+dy
                next if x<2 || y<2
                next if x>=width-2 || y>=height-2
                next if occupied.include?([x,y])
                spawn=[x,y]
                break
              end
            end
          end
          raise 'No available boss spawn tile' unless spawn

          put(boss,:x,spawn[0])
          put(boss,:y,spawn[1])

          pages=iv(boss,:pages)
          raise 'No original monster pages' unless
            pages.is_a?(Array) && pages.size>=2

          keyed=pages.each_with_index.select do |page,index|
            iv(iv(page,:condition),:variable_valid)
          end
          raise 'HP death condition missing' if keyed.empty?

          death,deathindex=keyed.max_by do |page,index|
            iv(iv(page,:condition),:variable_value)
          end

          oldhp=iv(iv(death,:condition),:variable_id)
          raise 'Original HP variable missing' unless oldhp

          attack_calls=0

          pages.each_with_index do |page,index|
            cond=iv(page,:condition)

            if iv(cond,:variable_valid) &&
               iv(cond,:variable_id)==oldhp
              put(cond,:variable_id,HPVAR)
              if page.equal?(death)
                put(cond,:variable_value,5200)
              end
            end

            graphic=iv(page,:graphic)
            put(graphic,:character_name,'SLZenithWalk')
            put(page,:move_speed,3)
            put(page,:move_frequency,6)

            iv(page,:list).each do |cmd|
              code=iv(cmd,:code)
              params=iv(cmd,:parameters)
              next unless params.is_a?(Array)

              if code==122
                if params[0]==oldhp && params[1]==oldhp
                  params[0]=HPVAR
                  params[1]=HPVAR
                end

                if params[0]==335 &&
                   params[1]==335 &&
                   params[2]==0
                  params.replace([335,335,0,2,15,35])
                end

              elsif code==111 && params[0]==1
                params[1]=HPVAR if params[1]==oldhp

              elsif code==117 && params[0]==922
                attack_calls+=1

              elsif code==230 && params[0]==30
                params[0]=20

              elsif (code==355 || code==655) &&
                    params[0].is_a?(String)
                params[0]=params[0].gsub(
                  "$game_variables[#{oldhp}]",
                  "$game_variables[#{HPVAR}]"
                )
              end
            end
          end

          raise 'Source attack CE922 not linked' if attack_calls==0

          # New boss uses its own HP, reward and death sequence.
          put(death,:list,[
            command(355,['SLZenith.reward']),
            command(230,[45]),
            command(116,[]),
            command(0,[])
          ])

          # Preserve every original event object unchanged.
          events.each do |id,ev|
            raise "Original event #{id} changed" unless
              Marshal.dump(ev)==original_bytes[id]
          end

          events[boss_id]=boss
          raise 'Original event lost' unless
            events.size==original_count+1

          File.binwrite(MAP,Marshal.dump(map))

          runtime=<<'SOURCE'
          module SLZenith
            MAP_ID=25
            EVENT_ID=__BOSS_ID__
            HP_VAR=2991
            LEVEL=60
            MAX_HP=5200
            PHYSICAL=[50,100]
            MAGIC=[150,300]
            ACCURACY=9999
            ATTACK_WAIT=20
            EXP=43212
            GOLD_MIN=64800
            GOLD_MAX=151200

            # [existing inventory kind, ID, per-thousand chance]
            DROPS=[
              [:item,35,30],
              [:item,34,20],
              [:item,33,100],
              [:item,37,100],
              [:armor,169,50],
              [:item,116,3],
              [:item,32,100],
              [:item,38,100],
              [:armor,289,30],
              [:weapon,123,30],
              [:weapon,18,50],
              [:item,3,200],
              [:weapon,1,50],
              [:armor,72,50],
              [:item,2,250],
              [:armor,303,2],
              [:item,43,100],
              [:armor,280,30],
              [:armor,12,50],
              [:armor,492,3]
            ]

            @paid={}
            @poison_frames=0
            @poison_tick=0
            @slow_frames=0
            @old_speed=nil

            def self.actor
              return nil unless $game_actors
              $game_actors[1]
            end

            def self.event
              return nil unless $game_map &&
                $game_map.map_id==MAP_ID
              return nil unless $game_map.events
              $game_map.events[EVENT_ID]
            end

            def self.animation(name)
              ev=event
              return unless ev
              ev.instance_variable_set(
                :@character_name,'SLZenith'+name
              )
              ev.instance_variable_set(:@pattern,0)
              frames=name=='Death' ? 0 : 24
              ev.instance_variable_set(
                :@slz_anim_frames,frames
              )
            end

            def self.attack
              target=actor
              return unless target && target.hp>0
              return unless event

              if rand(7)==0
                base=MAGIC[rand(2)]
                defence=target.respond_to?(:mdef) ?
                  target.mdef.to_i : 0
                damage=[base-defence,80].max
                animation('Magic')
              else
                base=PHYSICAL[rand(2)]
                defence=target.respond_to?(:pdef) ?
                  target.pdef.to_i : 0
                damage=[base-defence,1].max
                animation('Attack')
              end

              target.hp=[target.hp-damage,0].max

              # Poison and slowing web are separate effects.
              roll=rand(100)
              if roll<20
                @poison_frames=360
                @poison_tick=0
              elsif roll<30
                @slow_frames=180
                if $game_player
                  @old_speed||=$game_player.instance_variable_get(
                    :@move_speed
                  )
                  speed=@old_speed.to_i
                  $game_player.instance_variable_set(
                    :@move_speed,[speed-1,1].max
                  )
                end
              end
            end

            def self.update_effects
              if @poison_frames>0
                @poison_frames-=1
                @poison_tick+=1
                if @poison_tick>=180
                  @poison_tick=0
                  target=actor
                  if target && target.hp>0
                    target.hp=[target.hp-5,0].max
                  end
                end
              end

              if @slow_frames>0
                @slow_frames-=1
                if @slow_frames==0 && @old_speed &&
                   $game_player
                  $game_player.instance_variable_set(
                    :@move_speed,@old_speed
                  )
                  @old_speed=nil
                end
              end
            end

            def self.reward
              return unless $game_map &&
                $game_map.map_id==MAP_ID
              return if @paid[EVENT_ID]
              @paid[EVENT_ID]=true

              money=GOLD_MIN+rand(GOLD_MAX-GOLD_MIN+1)
              $game_party.gain_gold(money)

              if actor
                actor.exp=actor.exp+EXP
              end

              $game_variables[333]=money
              $game_variables[1926]=EXP

              DROPS.each do |kind,id,permille|
                next unless rand(1000)<permille

                case kind
                when :item
                  $game_party.gain_item(id,1)
                when :weapon
                  $game_party.gain_weapon(id,1)
                when :armor
                  $game_party.gain_armor(id,1)
                end
              end

              animation('Death')
            end

            def self.reset_map
              if @old_speed && $game_player
                $game_player.instance_variable_set(
                  :@move_speed,@old_speed
                )
              end
              @paid.clear
              @poison_frames=0
              @poison_tick=0
              @slow_frames=0
              @old_speed=nil
            end
          end

          class Interpreter
            alias slz_original_common_event command_117

            def command_117
              if @map_id==SLZenith::MAP_ID &&
                 @event_id==SLZenith::EVENT_ID &&
                 @parameters[0]==922
                SLZenith.attack
                return true
              end
              slz_original_common_event
            end
          end

          class Game_Event
            alias slz_original_update update

            def update
              slz_original_update
              return unless @map_id==SLZenith::MAP_ID &&
                @id==SLZenith::EVENT_ID

              count=@slz_anim_frames.to_i
              if count>0
                @slz_anim_frames=count-1
                if @slz_anim_frames==0
                  @character_name='SLZenithWalk'
                end
              end
            end
          end

          class Game_Player
            alias slz_original_update update

            def update
              slz_original_update
              SLZenith.update_effects
            end
          end

          class Game_Map
            alias slz_original_setup setup

            def setup(map_id)
              SLZenith.reset_map
              slz_original_setup(map_id)
            end
          end
          SOURCE

          runtime=runtime.sub('__BOSS_ID__',boss_id.to_s)

          scripts=Marshal.load(File.binread(SCRIPTS))
          unless scripts.is_a?(Array) &&
                 scripts[-1][1]=='Main'
            raise 'Invalid V241 RGSS script layout'
          end

          if scripts.any?{|row|row[1]=='SLZenithV243'}
            raise 'Zenith V243 installed twice'
          end

          scripts.insert(
            scripts.length-1,
            [
              99824301,
              'SLZenithV243',
              Zlib::Deflate.deflate(runtime,9)
            ]
          )

          File.binwrite(SCRIPTS,Marshal.dump(scripts))
          File.write('build/zenith-runtime.rb',runtime)

          File.write(
            'build/zenith-event.txt',
            "Map025 EV#{boss_id}\n"+
            "HP variable #{HPVAR}\n"+
            "Previous template HP #{oldhp}\n"+
            "Spawn #{spawn.inspect}\n"+
            "CE922 calls #{attack_calls}\n"
          )

          verify=Marshal.load(File.binread(MAP))
          unless iv(verify,:events).key?(boss_id)
            raise 'Boss event not saved'
          end

          unless scripts[-2][1]=='SLZenithV243'
            raise 'Boss runtime not inserted'
          end

          puts "PASS Zenith Queen Map025 EV#{boss_id}"
          puts "PASS Lv60 HP5200 physical50/100 magic150/300"
          puts "PASS original events preserved"
          RUBY

          ruby -c build/zenith.rb
          ruby build/zenith.rb
          ruby -c build/zenith-runtime.rb
          cat build/zenith-event.txt

      - name: V243 Smoke-test battle and rewards
        shell: bash
        run: |
          set -euo pipefail

          cat > build/test-zenith.rb <<'RUBY'
          class Interpreter
            def command_117;true;end
          end
          class Game_Event
            def update;end
          end
          class Game_Player
            def update;end
          end
          class Game_Map
            attr_accessor :map_id,:events
            def initialize
              @map_id=25
              @events={}
            end
            def setup(id);@map_id=id;end
          end
          class TestActor
            attr_accessor :hp,:exp
            def initialize
              @hp=10000
              @exp=0
            end
            def mdef;0;end
            def pdef;0;end
          end
          class TestParty
            attr_reader :gold
            def initialize;@gold=0;end
            def gain_gold(n);@gold+=n;end
            def gain_item(id,n);end
            def gain_weapon(id,n);end
            def gain_armor(id,n);end
          end

          load 'build/zenith-runtime.rb'

          $game_map=Game_Map.new
          $game_player=Game_Player.new
          $game_actors={1=>TestActor.new}
          $game_party=TestParty.new
          $game_variables=Hash.new(0)

          event=Game_Event.new
          $game_map.events[SLZenith::EVENT_ID]=event

          raise 'Wrong HP' unless SLZenith::MAX_HP==5200
          raise 'Wrong physical' unless
            SLZenith::PHYSICAL==[50,100]
          raise 'Wrong magic' unless
            SLZenith::MAGIC==[150,300]
          raise 'Wrong drop count' unless
            SLZenith::DROPS.length==20
          raise 'Wrong Zenith ring' unless
            SLZenith::DROPS.include?([:armor,492,3])

          hp=$game_actors[1].hp
          SLZenith.attack
          raise 'No attack damage' unless
            $game_actors[1].hp<hp

          SLZenith.reward

          raise 'Wrong EXP' unless
            $game_actors[1].exp==43212
          raise 'Wrong Adena interval' unless
            (64800..151200).include?($game_party.gold)

          gold=$game_party.gold
          exp=$game_actors[1].exp
          SLZenith.reward

          raise 'Duplicate Adena' unless
            gold==$game_party.gold
          raise 'Duplicate EXP' unless
            exp==$game_actors[1].exp

          SLZenith.reset_map
          raise 'Respawn reset failed' unless
            SLZenith.instance_variable_get(:@paid).empty?

          puts 'PASS attack, damage and 20 drop records'
          puts 'PASS EXP 43212 and variable Adena'
          puts 'PASS no double payment and reset'
          RUBY

          ruby -c build/test-zenith.rb
          ruby build/test-zenith.rb

      - name: V243 Register new character resources
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re

          root=Path("site")
          mapping=root/"knight/gameasync/mapping.js"
          old=mapping.read_text("utf-8")

          anchor="];\n\nvar mapping = {}"
          assert old.count(anchor)==1, "Mapping anchor changed"

          entries=[]
          for motion in ("Walk","Attack","Hit","Death","Magic"):
              name="SLZenith"+motion
              path=root/(
                  "knight/gameasync/Graphics/Characters/"
                  +name+".png"
              )
              digest=hashlib.md5(path.read_bytes()).hexdigest()
              entries.append(
                  '["graphics/characters/'+name.lower()+
                  '", "Graphics/Characters/'+name+
                  '.png?h='+digest+'"],'
              )

          new=old.replace(
              anchor,"\n"+"\n".join(entries)+"\n"+anchor
          )

          pre="MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"

          changed=[
              (
                  "Data/"+pre+"Map025.rxdata",
                  root/"knight/gameasync/Data"/
                  (pre+"Map025.rxdata")
              ),
              (
                  "Data/Scripts.rxdata",
                  root/"knight/gameasync/Data/Scripts.rxdata"
              )
          ]

          for key,path in changed:
              digest=hashlib.md5(path.read_bytes()).hexdigest()
              pattern="("+re.escape(key)+r"\?h=)[0-9a-f]{32}"
              new,count=re.subn(
                  pattern,
                  lambda match:match.group(1)+digest,
                  new
              )
              assert count==1, "Missing asset hash "+key

          mapping.write_text(new,"utf-8")

          loader=root/"knight/js/sl-assets-v229r115.js"
          text=loader.read_text("utf-8")
          old_version="var version='V241';"
          assert text.count(old_version)==1
          loader.write_text(
              text.replace(
                  old_version,"var version='V243';"
              ),
              "utf-8"
          )

          for rel in ("index.html","knight/index.html"):
              file=root/rel
              text=file.read_text("utf-8")
              assert "V241" in text
              text=text.replace("V241","V243")
              text=text.replace(
                  "js/sl-assets-v229r115.js?v=v241",
                  "js/sl-assets-v229r115.js?v=v243"
              )
              file.write_text(text,"utf-8")

          print("PASS new sprites and versioned asset mappings")
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: V243 Protect all existing game content
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json

          root=Path("site")
          before=json.loads(
              Path("build/before.json").read_text("utf-8")
          )
          after={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob("*") if p.is_file()
          }

          pre=(
              "knight/gameasync/Data/"
              "MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"
          )

          allowed={
              pre+"Map025.rxdata",
              "knight/gameasync/Data/Scripts.rxdata",
              "knight/gameasync/mapping.js",
              "knight/js/sl-assets-v229r115.js",
              "index.html",
              "knight/index.html"
          }

          motions=("Walk","Attack","Hit","Death","Magic")
          new_files={
              "knight/gameasync/Graphics/Characters/"
              "SLZenith"+motion+".png"
              for motion in motions
          }

          modified={
              name for name in before
              if after.get(name)!=before[name]
          }
          added=set(after)-set(before)
          removed=set(before)-set(after)

          assert modified==allowed, (
              "Unexpected existing-file edits",
              sorted(modified^allowed)
          )
          assert added==new_files, (
              "Unexpected new files",
              sorted(added^new_files)
          )
          assert not removed, (
              "Removed original files",sorted(removed)
          )

          for mid in (45,46):
              assert pre+f"Map{mid:03d}.rxdata" not in after

          key="knight/assets/map-047-v241.pack"
          assert after[key]==before[key], "Map047 modified"

          print("PASS all original events except added Map025 boss")
          print("PASS Map047 and other maps unchanged")
          print("PASS five new graphics resources")
          PY

      - name: V243 Publish Zenith Queen
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

