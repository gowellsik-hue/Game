          bridge = <<'JS'
          <script>
          (function(){
            var ch={
              BGM:new Audio(),
              BGS:new Audio()
            };

            var pending=[];

            ch.BGM.loop=true;
            ch.BGS.loop=true;

            function urlFor(n){
              var p=
                String(n||'')
                  .replace(/\\/g,'/')
                  .replace(
                    /\.(ogg|mp3|wav|wma|aac|m4a|flac|mid|midi)$/i,
                    ''
                  );

              return encodeURI(
                'gameasync/'+
                p+
                '.ogg?v=v145'
              );
            }

            function safe(a){
              if(!a||!a.src)
                return;

              try{
                var p=a.play();

                if(p&&p.catch)
                  p.catch(
                    function(){
                      if(
                        pending.indexOf(a)<0
                      ){
                        pending.push(a);
                      }
                    }
                  );

              }catch(e){
                if(
                  pending.indexOf(a)<0
                ){
                  pending.push(a);
                }
              }
            }

            function retry(){
              var x=pending.slice();
              pending.length=0;
              x.forEach(safe);
            }

            [
              'touchstart',
              'pointerdown',
              'keydown',
              'mousedown'
            ].forEach(
              function(n){
                window.addEventListener(
                  n,
                  retry,
                  {passive:true}
                );
              }
            );

            function stop(k){
              var a=ch[k];

              if(!a)
                return;

              a.pause();

              try{
                a.currentTime=0;
              }catch(e){}
            }

            function play(k,n,v,p){
              var a=ch[k];

              if(!a||!n)
                return;

              var u=urlFor(n);

              if(
                a.getAttribute(
                  'data-sl-src'
                )!==u
              ){
                a.pause();
                a.src=u;
                a.setAttribute(
                  'data-sl-src',
                  u
                );
                a.load();
              }

              var gain=
                k==='BGS' ?
                0.20 :
                1;

              a.volume=
                Math.max(
                  0,
                  Math.min(
                    1,
                    Number(v||100) /
                    100 *
                    gain
                  )
                );

              a.playbackRate=
                Math.max(
                  .5,
                  Math.min(
                    1.5,
                    Number(p||100) /
                    100
                  )
                );

              safe(a);
            }

            function marker(t){
              var ai=
                t.indexOf(
                  'SLAUDIO|'
                );

              if(ai>=0){
                var p=
                  t.slice(ai)
                    .split('|');

                var cmd=p[1]||'';

                var k=
                  cmd.split('_')[0];

                if(
                  /_PLAY$/.test(cmd)
                ){
                  play(
                    k,
                    p.slice(2,-2).join('|'),
                    p[p.length-2],
                    p[p.length-1]
                  );
                } else if(
                  /_STOP$/.test(cmd)
                ){
                  stop(k);
                } else if(
                  /_FADE$/.test(cmd)
                ){
                  setTimeout(
                    function(){
                      stop(k);
                    },
                    Number(p[2])||0
                  );
                }
              }

              var qi=
                t.indexOf(
                  'SLQS|'
                );

              if(qi>=0){
                var q=
                  t.slice(qi)
                    .split('|');

                if(
                  window.slSetQuickLabel &&
                  q.length>=3
                ){
                  window.slSetQuickLabel(
                    q[1],
                    q.slice(2).join('|')
                  );
                }
              }
            }

            function err(t){
              var p=
                document.getElementById(
                  'slerr'
                );

              if(!p){
                p=
                  document.createElement(
                    'pre'
                  );

                p.id='slerr';

                p.style=
                  'position:fixed;' +
                  'left:8px;' +
                  'top:8px;' +
                  'right:8px;' +
                  'max-height:70vh;' +
                  'overflow:auto;' +
                  'z-index:999999;' +
                  'background:#000;' +
                  'color:#fff;' +
                  'border:2px solid #d33;' +
                  'padding:10px;' +
                  'font:14px monospace;' +
                  'white-space:pre-wrap';

                document.body.appendChild(p);
              }

              p.textContent=String(t);
            }

            var log=
              console.log.bind(console);

            console.log=function(){
              var a=
                [].slice.call(
                  arguments
                );

              var t=a.join(' ');

              try{
                marker(t);
              }catch(e){
                log(
                  'SLMARKERERR|'+e
                );
              }

              if(
                /SLRUNTIMEERR|SLSCRIPTERR/.test(t)
              ){
                err(t);
              }

              log.apply(
                console,
                a
              );
            };

            window.addEventListener(
              'error',
              function(e){
                err(
                  'JS ERROR | '+
                  e.message
                );
              }
            );

            window.slAudioBridge=ch;
          })();
          </script>
