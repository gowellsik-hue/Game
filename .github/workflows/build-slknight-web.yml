          # encoding: UTF-8
          # V4.37 approved drops only. Preserve original non-drop events and all source assets.
          module RPG
            class CommonEvent; end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
            class AudioFile; end
            class Map; end
            class Event; end
            class Event::Page; end
            class Event::Page::Condition; end
            class Event::Page::Graphic; end
          end
          class Table
            def self._load(raw); o=new; o.instance_variable_set(:@raw_dump,raw); o; end
            def _dump(depth); @raw_dump; end
          end
          class Tone
            def self._load(raw); o=new; o.instance_variable_set(:@raw_dump,raw); o; end
            def _dump(depth); @raw_dump; end
          end
          class Color
            def self._load(raw); o=new; o.instance_variable_set(:@raw_dump,raw); o; end
            def _dump(depth); @raw_dump; end
          end

          root=ARGV.fetch(0)
          manifest=ARGV.fetch(1)
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          data_dir=File.join(root,'knight','gameasync','Data')
          files={}
          File.foreach(manifest,encoding:'UTF-8') do |line|
            line=line.strip
            next if line.empty? || line.start_with?('#')
            key,contents=line.split('=',2)
            raise "Duplicate key #{key}" if files.key?(key)
            files[key]=contents.split(',').map do |str|
              type,id,rate,qty=str.split('/',4)
              raise "Invalid data #{key}: #{str}" unless [126,127,128].include?(type.to_i) && (0..100000).include?(rate.to_i) && qty.match?(/\A\d+\z|\A\d+\.\.\d+\z/)
              [type.to_i,id.to_i,rate.to_i,qty]
            end
          end
          raise "Wrong source count #{files.length}" unless files.length==134
          raise "Wrong drop count" unless files.values.sum(&:length)==1001

          # build a Ruby script whose RNG directly realizes each approved marginal rate.
          def script_for(key,arr)
            lines=[]
            lines << 'slv437_messages=[]'
            arr.each do |type,id,rate,qty|
              next if rate==0
              q=qty.include?('..') ? (l,h=qty.split('..').map(&:to_i);"#{l}+rand(#{h-l+1})") : qty
              op={126=>'gain_item',127=>'gain_weapon',128=>'gain_armor'}.fetch(type)
              rate_expr=(key=="ce-692" && type==126 && id==2) ? "($game_map.map_id==26 ? 12500 : 10000)" : rate.to_s
              lines << "if rand(100000)<#{rate_expr}"
              lines << "  slv437_count=(#{q})"
              lines << "  $game_party.#{op}(#{id},slv437_count)"
              db={126=>'$data_items',127=>'$data_weapons',128=>'$data_armors'}.fetch(type)
              lines << "  slv437_name=(#{db}[#{id}] && #{db}[#{id}].name) || ''"
              lines << "  slv437_messages << (slv437_name + ' '+slv437_count.to_s+'개') unless slv437_name.empty?"
              lines << 'end'
            end
            lines << 'unless slv437_messages.empty?'
            lines << "  $메세지.set_text2(slv437_messages.join(', ')+' 획득 했습니다.')"
            lines << 'end'
            lines.join("\n")
          end

          def command(code,indent,params)
            obj=RPG::EventCommand.allocate
            obj.instance_variable_set(:@code,code)
            obj.instance_variable_set(:@indent,indent)
            obj.instance_variable_set(:@parameters,params)
            obj
          end

          def c_code(c); c.instance_variable_get(:@code); end
          def c_par(c); c.instance_variable_get(:@parameters); end

          def alter(cmds,key,arr,all_original)
            raise "Empty commands #{key}" if cmds.empty?
            wanted=arr.map{|type,id,_,_|[type,id]}.uniq
            old=0
            (0...cmds.length).each do |i|
              c=cmds[i];code=c_code(c)
              next unless [126,127,128].include?(code) && (all_original || wanted.include?([code,c_par(c)[0]]))
              raise "Deletion of non-award #{key}" unless c_par(c)[1]==0
              c.instance_variable_set(:@code,355)
              c.instance_variable_set(:@parameters,['nil'])
              old+=1
              # Mute the old per-item message, but retain every other game command.
              j=i+1
              while j<cmds.length && [355,655].include?(c_code(cmds[j]))
                t=c_par(cmds[j])[0].to_s.force_encoding('UTF-8').scrub
                if t.include?('set_text2') || t.include?('획득') || t.match?(/\A\s*[ab]\s*=/)
                  cmds[j].instance_variable_set(:@parameters,['nil'])
                end
                j+=1
              end
            end
            raise "No existing award in #{key}" if old==0
            # Insert once before original closing respawn / self-switch, not on repeat frames.
            end_at=cmds.rindex{|c| [117,123].include?(c_code(c)) && c.instance_variable_get(:@indent)==0 }
            end_at=cmds.length-1 if end_at.nil?
            code=script_for(key,arr)
            cmds.insert(end_at,command(355,0,[code]))
            old
          end

          common_path=File.join(data_dir,prefix+'CommonEvents.rxdata')
          common=Marshal.load(File.binread(common_path))
          modified=0;awards_disabled=0
          files.each do |key,arr|
            next unless key.start_with?('ce-')
            id=key.sub('ce-','').to_i
            raise "Wrong CE #{id}" unless common[id] && common[id].instance_variable_get(:@name).to_s.force_encoding('UTF-8').start_with?('[아이템]')
            arr_cmds=common[id].instance_variable_get(:@list)
            awards_disabled+=alter(arr_cmds,key,arr,true)
            modified+=1
          end
          File.binwrite(common_path,Marshal.dump(common))

          maps_modified=[];event_pages=0
          [26,37,41,42].each do |mid|
            path=File.join(data_dir,prefix+format('Map%03d.rxdata',mid))
            map=Marshal.load(File.binread(path))
            applicable=files.select{|key,_| key.start_with?("ev-#{mid}-")}
            candidates={}
            applicable.each do |key,arr|
              name=key.sub("ev-#{mid}-",'').sub(/-\d+$/,'')
              matched=0
              map.instance_variable_get(:@events).each_value do |evt|
                next unless evt.instance_variable_get(:@name).to_s.force_encoding('UTF-8')=="[ID#{name}]"
                evt.instance_variable_get(:@pages).each_with_index do |page,pi|
                  cmds=page.instance_variable_get(:@list)
                  wanted=arr.map{|kind,id,_,_|[kind,id]}.uniq
                  actual=cmds.map{|c| [c_code(c),c_par(c)[0]] if [126,127,128].include?(c_code(c))}.compact
                  next if (wanted & actual).empty?
                  awards_disabled+=alter(cmds,"#{key} ev#{evt.instance_variable_get(:@id)} page#{pi}",arr,false)
                  matched+=1;event_pages+=1
                end
              end
              if matched==0
                if mid==26 && key=="ev-26-거대 개미-0"
                  refs=map.instance_variable_get(:@events).values.select{|e|e.instance_variable_get(:@name).to_s.force_encoding("UTF-8")=="[ID거대 개미]"}
                  raise "Missing giant ant CE692" unless refs.length==4 && refs.all?{|e|e.instance_variable_get(:@pages).any?{|p|p.instance_variable_get(:@list).any?{|c|c_code(c)==117 && c_par(c)[0]==692}}}
                  warn "PASS map26 giant ants call CE692; map-specific speed potion 12.5%, other maps 10%"
                  next
                end
                raise "No map event #{key}"
              end
              candidates[key]=matched
            end
            if !applicable.empty? && mid!=26
              File.binwrite(path,Marshal.dump(map))
              maps_modified<<mid
            end
          end
          raise "Wrong modified sources #{modified} or maps #{maps_modified.inspect}" unless modified==111 && maps_modified==[37,41,42]
          puts "PASS V4.37 1001 rate+quantity records, #{modified} common events, #{files.length-modified} map sources"
          puts "PASS updated #{event_pages} map monster death pages; disabled #{awards_disabled} original grant commands"
          puts 'PASS no new game items, maps, animations, movement logic or other scripts'
          RUBY
          ruby -c build/apply_drop_v437.rb
          ruby build/apply_drop_v437.rb site build/v437_drops.txt
          # Verify exact approved item probabilities and no changed terrain layers.
          ruby -e 'd=File.read("build/v437_drops.txt");abort "Missing eggs" unless d.include?("126/167/0/1");abort "Missing new rewards" unless d.include?("ce-749=")'

