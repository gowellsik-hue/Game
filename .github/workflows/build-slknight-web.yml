
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V1.5
# BASE: successful V1.4 run 42326754572
# PRINCIPLE: modify existing data and native event commands only
# KEEP: healer, maps, movement, original skills, collision, UI
# EXCLUDE: Zenith Queen
# NO: new combat engine, drop engine, keyboard chord, runtime timer
name: build-slknight-web.yml | V1.5 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Restore successful V1.4 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 42326754572
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify V1.4 original
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib

          root = Path("site")
          files = {
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob("*") if p.is_file()
          }
          assert len(files) == 5623, len(files)
          assert "var version='V1.4';" in (
              root / "knight/js/sl-assets-v229r115.js"
          ).read_text("utf-8")
          assert "SLKnight V1.4" in (
              root / "knight/index.html"
          ).read_text("utf-8")
          Path("build/v14_manifest.json").write_text(
              json.dumps(files), encoding="utf-8"
          )
          print("PASS original V1.4:", len(files), "files")
          PY

      - name: Prepare original RPG Maker data classes
        shell: bash
        run: |
          set -euo pipefail
          cat > build/rpg_data.rb <<'RUBY'
          # encoding: utf-8
          class Module
            def const_missing(name)
              const_set(name, Class.new)
            end
          end

          class Table
            def self._load(raw)
              obj = allocate
              obj.instance_variable_set(:@raw, raw)
              obj
            end
            def _dump(depth)
              @raw
            end
          end

          class Color
            def self._load(raw)
              obj = allocate
              obj.instance_variable_set(:@raw, raw)
              obj
            end
            def _dump(depth)
              @raw
            end
          end

          class Tone
            def self._load(raw)
              obj = allocate
              obj.instance_variable_set(:@raw, raw)
              obj
            end
            def _dump(depth)
              @raw
            end
          end

          module RPG
            class Map; end
            class AudioFile; end
            class Event
              class Page
                class Condition; end
                class Graphic; end
              end
            end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
            class CommonEvent; end
            class Item; end
            class Weapon; end
            class Armor; end
          end
          RUBY

      - name: Patch existing V1.4 game data only
        shell: bash
        run: |
          set -euo pipefail
          cat > build/patch_v15.rb <<'RUBY'
          # encoding: utf-8
          require 'zlib'
          require 'digest'
          require_relative 'rpg_data'

          ROOT = File.expand_path('site')
          DIR = File.join(ROOT, 'knight/gameasync/Data')
          PRE = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          SCRIPT_PATH = File.join(DIR, 'Scripts.rxdata')
          COMMON_PATH = File.join(DIR, PRE + 'CommonEvents.rxdata')

          def verify(ok, message)
            raise "V1.5 BASE MISMATCH: #{message}" unless ok
          end

          def iv(obj, key)
            obj.instance_variable_get(key)
          end

          def code(command)
            iv(command, :@code)
          end

          def params(command)
            iv(command, :@parameters)
          end

          def set_params(command, values)
            command.instance_variable_set(:@parameters, values)
          end

          def command(id, indent, values)
            obj = RPG::EventCommand.allocate
            obj.instance_variable_set(:@code, id)
            obj.instance_variable_set(:@indent, indent)
            obj.instance_variable_set(:@parameters, values)
            obj
          end

          def exact_change(list, id, before, after, label)
            hits = list.select do |c|
              code(c) == id && params(c) == before
            end
            verify(hits.size == 1, "#{label}: #{hits.size} matches")
            set_params(hits.first, after)
          end

          def change_script_text(list, before, after, label)
            hits = list.select do |c|
              [355, 655].include?(code(c)) &&
                params(c).size == 1 &&
                params(c)[0].is_a?(String) &&
                params(c)[0].include?(before)
            end
            verify(hits.size == 1, "#{label}: #{hits.size} matches")
            old = params(hits.first)[0]
            set_params(hits.first, [old.sub(before, after)])
          end

          def map_path(id)
            File.join(DIR, PRE + format('Map%03d.rxdata', id))
          end

          # 1. Only maps containing approved changes.
          MAP_IDS = [3,4,8,9,11,17,21,22,23,31,35,37,41,43]
          maps = {}
          MAP_IDS.each do |mid|
            path = map_path(mid)
            verify(File.file?(path), "missing map #{mid}")
            maps[mid] = Marshal.load(File.binread(path))
          end

          def event(maps, key)
            mid, eid = key.split(':').map(&:to_i)
            verify(mid != 25, "Zenith Queen map excluded")
            map = maps.fetch(mid)
            obj = iv(map, :@events)[eid]
            verify(!obj.nil?, "missing event #{key}")
            obj
          end

          def page(obj, index)
            result = iv(obj, :@pages)[index]
            verify(!result.nil?, "missing event page #{index}")
            result
          end

          def commands(obj)
            iv(obj, :@list)
          end

          # 2. Existing dodge variable 335.
          # No new dodge calculation.
          DODGE = {
            '35:17' => [20,40,8,16],
            '37:1'  => [12,20,5,15],
            '37:4'  => [12,20,5,15],
            '37:5'  => [10,30,5,20],
            '37:6'  => [10,30,5,20],
            '41:9'  => [30,50,1,10],
            '41:10' => [10,40,1,8],
            '41:11' => [10,40,1,8],
            '41:18' => [10,40,1,8]
          }

          DODGE.each do |key, values|
            old_low, old_high, new_low, new_high = values
            changed = 0
            iv(event(maps, key), :@pages).each do |pg|
              next unless iv(pg, :@trigger) == 2
              commands(pg).each do |c|
                next unless code(c) == 122
                next unless params(c)[0,4] == [335,335,0,2]
                verify(
                  params(c)[4,2] == [old_low,old_high],
                  "unexpected dodge #{key}"
                )
                set_params(
                  c, [335,335,0,2,new_low,new_high]
                )
                changed += 1
              end
            end
            verify(changed > 0, "no dodge branches #{key}")
          end

          # 3. Existing Map041 attack events.
          attack_event = event(maps, '41:3')
          attack_pages = iv(attack_event, :@pages)

          exact_change(
            commands(attack_pages[0]), 122,
            [26,26,0,0,100], [26,26,0,0,35],
            'turtle attack first value'
          )
          exact_change(
            commands(attack_pages[0]), 122,
            [26,26,0,0,200], [26,26,0,0,70],
            'turtle attack second value'
          )
          exact_change(
            commands(attack_pages[0]), 111,
            [1,26,0,70,2], [1,26,0,20,2],
            'turtle minimum damage'
          )

          [12,13,14].each do |index|
            exact_change(
              commands(attack_pages[index]), 111,
              [1,26,0,30,2], [1,26,0,20,2],
              "beholder minimum damage page #{index}"
            )
          end

          # 4. Existing common attack events.
          common = Marshal.load(File.binread(COMMON_PATH))

          {
            797 => [[25,30],[50,60]],
            877 => [[60,75],[120,150]]
          }.each do |id, pairs|
            list = commands(common[id])
            pairs.each do |before, after|
              exact_change(
                list, 122,
                [26,26,0,0,before],
                [26,26,0,0,after],
                "CE#{id} attack #{before}"
              )
            end
          end

          exact_change(
            commands(common[797]), 122,
            [336,336,0,2,9999,9999],
            [336,336,0,2,50,120],
            'CE797 ghoul accuracy'
          )

          exact_change(
            commands(common[877]), 111,
            [1,26,0,30,2],
            [1,26,0,35,2],
            'CE877 Drake minimum damage'
          )

          # 5. Turtle existing HP display and regeneration.
          turtle = event(maps, '41:9')
          change_script_text(
            commands(page(turtle, 1)),
            ',100000,2)', ',2400,2)',
            'turtle HP display'
          )

          regeneration = event(maps, '41:19')
          exact_change(
            commands(page(regeneration, 0)), 111,
            [1,241,0,100000,4],
            [1,241,0,2400,4],
            'turtle regeneration cap'
          )
          change_script_text(
            commands(page(regeneration, 0)),
            ',100000,2)', ',2400,2)',
            'turtle regeneration display'
          )

          # 6. Monster bonus drops:
          # Use native RPG event commands:
          # 111 condition -> 126/127/128 reward -> 412 end.
          # No separate runtime class, engine or drop module.
          #
          # i=item, w=weapon, a=armor.
          # Rates are integer units out of 100000.
          # Every new reward quantity is one.
          GROUPS = [
            [
              '35:12 35:13 35:14 35:15',
              'i57:2000 i77:2000 i78:2000 i79:2000 i2:10000'
            ],
            [
              '35:2 35:4 35:5 35:6 35:7 35:8 35:9 35:10 43:13 43:14',
              'i11:3000 i9:3000 i12:3000 i10:3000 i57:1000 i77:1000 i78:1000 i79:1000 i2:10000'
            ],
            [
              '35:17',
              'i33:4000 a555:1500 a556:1500'
            ],
            [
              '35:16',
              'i57:2000 i77:2000 i78:2000 i79:2000'
            ],
            [
              '11:8 11:9 11:10',
              'i54:2000'
            ],
            [
              '11:7 11:11 43:20',
              'i33:3000 i32:3000 i69:100'
            ],
            [
              '9:6 9:7 9:9 9:16 43:30',
              'a158:3000 i32:1000'
            ],
            [
              '4:5 4:8',
              'i3:12500 i35:100'
            ],
            [
              '3:22',
              'a278:100 a277:100'
            ],
            [
              '3:23 3:25',
              'i108:1000'
            ],
            [
              '3:13 3:14',
              'a278:100 a277:100'
            ],
            [
              '11:12 11:13',
              'i32:3000 i33:3000 i34:100'
            ],
            [
              '8:9 8:10 8:12',
              'i18:5000 i32:2000 i33:2000'
            ],
            [
              '17:14 17:15',
              'a255:200'
            ],
            [
              '21:6 21:7 21:8 22:11 22:12 22:13 23:13 23:14',
              'a118:5000'
            ],
            [
              '31:11',
              'w123:5000 a289:5000 a94:10000 a105:10000 a60:10000 a275:1500 i104:3000 i105:3000 i32:15000 i33:15000 i34:6000 i35:9000'
            ]
          ]

          bonuses = {}
          GROUPS.each do |members, rewards|
            drops = rewards.split.map do |spec|
              match = /\A([iwa])(\d+):(\d+)\z/.match(spec)
              verify(!match.nil?, "bad bonus specification #{spec}")
              kind = match[1]
              id = match[2].to_i
              chance = match[3].to_i
              verify(
                id > 0 && chance.between?(1,100000),
                "bad bonus values #{spec}"
              )
              [kind,id,chance]
            end
            members.split.each do |key|
              verify(!bonuses.key?(key), "duplicate monster #{key}")
              bonuses[key] = drops
            end
          end

          verify(bonuses.size == 50, 'bonus monster count')
          verify(
            bonuses.values.sum(&:size) == 188,
            'bonus probability count'
          )

          bonus_additions = 0

          bonuses.each do |key, drops|
            obj = event(maps, key)
            death_index = key == '31:11' ? 1 : 2
            death = page(obj, death_index)
            verify(
              iv(death, :@trigger) == 4,
              "unexpected death page #{key}"
            )
            list = commands(death)
            verify(
              code(list.last) == 0,
              "missing event terminator #{key}"
            )

            additions = []
            drops.each do |kind,id,chance|
              change_code = {
                'i' => 126,
                'w' => 127,
                'a' => 128
              }.fetch(kind)

              # Do not duplicate an existing native reward
              # of the same type and item ID on this death page.
              duplicated = list.any? do |c|
                code(c) == change_code &&
                  params(c)[0].to_i == id
              end
              verify(
                !duplicated,
                "existing death reward already present #{key} #{kind}#{id}"
              )

              additions << command(
                111, 0,
                [12, "rand(100000) < #{chance}"]
              )
              additions << command(
                change_code, 1,
                [id,0,0,1]
              )
              additions << command(412, 0, [])
              bonus_additions += 1
            end

            # Run inside the original death event, before
            # its existing self-switch and completion.
            list.insert(0, *additions)
          end

          verify(
            bonus_additions == 188,
            'new native drop commands'
          )

          # 7. Modify the existing monster DATA literal directly.
          # Do not append runtime override statements.
          scripts = Marshal.load(File.binread(SCRIPT_PATH))

          def script_index(scripts, marker)
            found = scripts.each_index.select do |i|
              entry = scripts[i]
              next false unless entry.is_a?(Array)
              begin
                Zlib::Inflate.inflate(entry[2]).include?(marker)
              rescue
                false
              end
            end
            verify(
              found.size == 1,
              "script #{marker.inspect}: #{found.inspect}"
            )
            found.first
          end

          data_index = script_index(
            scripts, "module SLV541\n  DATA="
          )
          data_source = Zlib::Inflate.inflate(
            scripts[data_index][2]
          ).force_encoding('UTF-8')

          match = data_source.match(/^  DATA=(\{.*\})$/)
          verify(!match.nil?, 'original SLV541 DATA literal')

          # This is the existing game's trusted literal, not
          # a second runtime monster database.
          data = eval(match[1])

          STAT = {
            '3:6' => {
              11 => ['60/120','75/150'],
              12 => ['30','35']
            },
            '5:12' => {
              11 => ['60/120','75/150'],
              12 => ['30','35']
            },
            '6:6' => {
              11 => ['60/120','75/150'],
              12 => ['30','35']
            },
            '35:17' => {
              9 => ['9999~9999','50~120'],
              10 => ['25/50','30/60']
            },
            '41:9' => {
              0 => [50712,1601],
              1 => [127000,16800],
              2 => [76200,10080],
              3 => [177800,23520],
              4 => [100000,2400],
              7 => [65,40],
              11 => ['100/200','35/70'],
              12 => ['70','20']
            },
            '41:10' => {
              12 => ['30','20']
            },
            '41:11' => {
              12 => ['30','20']
            },
            '41:18' => {
              12 => ['30','20']
            }
          }

          STAT.each do |key, fields|
            mid, eid = key.split(':').map(&:to_i)
            verify(mid != 25, 'Zenith Queen prohibited')
            row = data.fetch(mid).fetch(eid)
            fields.each do |index, pair|
              before, after = pair
              verify(
                row[index] == before,
                "stat source mismatch #{key}[#{index}]"
              )
              row[index] = after
            end
          end

          # Direct replacement of the original literal.
          new_data_line = '  DATA=' + data.inspect
          data_source.sub!(match[0], new_data_line)

          # The existing reward observer must remain present.
          verify(
            data_source.include?('rewarded?') &&
              data_source.include?('def self.observe'),
            'existing SLV541 reward observer missing'
          )

          scripts[data_index][2] =
            Zlib::Deflate.deflate(data_source.b)

          # 8. Remove duplicate native turtle payout.
          # Keep the already-existing SLV541 reward observer.
          # No new payout calculation or runtime guard.
          turtle_death = commands(page(turtle, 2))
          legacy_rewards = [
            [122,[333,333,0,2,1,9999999]],
            [122,[1926,1926,0,0,160000]],
            [125,[0,1,333]],
            [315,[1,0,1,1926]]
          ]

          legacy_rewards.each do |id, values|
            hits = turtle_death.select do |c|
              code(c) == id && params(c) == values
            end
            verify(
              hits.size == 1,
              "turtle duplicate reward #{id} #{values.inspect}"
            )
            turtle_death.delete(hits.first)
          end

          # 9. Fix the original item registration lookup only.
          # Preserve inventory selection and existing item use.
          # No Shift+F7 shortcuts, JavaScript timers, or dpad changes.
          hotbar_index = scripts.each_index.find do |i|
            scripts[i].is_a?(Array) &&
              scripts[i][1].to_s == 'Mobile Hotbar'
          end
          verify(!hotbar_index.nil?, 'Mobile Hotbar source')

          hotbar = Zlib::Inflate.inflate(
            scripts[hotbar_index][2]
          ).force_encoding('UTF-8')

          verify(
            hotbar.include?('def self.triggered_slot') &&
              hotbar.include?('KEYS.size'),
            'original item assignment loop'
          )
          verify(
            hotbar.include?('LEGACY=[[1,70,86]'),
            'original V1.4 item slots'
          )

          # Fix only if the original registration KEY list
          # is the six-entry numeric list.
          key_match = hotbar.match(
            /^([ \t]*KEYS\s*=\s*)\[(\d+(?:\s*,\s*\d+){5})\][ \t]*$/
          )
          verify(
            !key_match.nil?,
            'item registration KEYS not verified; refuse rewrite'
          )
          existing_keys = key_match[2].split(',').map(&:to_i)
          verify(
            existing_keys.size == 6,
            'item registration source is not six slots'
          )

          expanded_keys = existing_keys + [74,75,76]
          hotbar.sub!(
            key_match[0],
            key_match[1] + '[' + expanded_keys.join(',') + ']'
          )
          scripts[hotbar_index][2] =
            Zlib::Deflate.deflate(hotbar.b)

          # 10. Write only original data files.
          File.binwrite(SCRIPT_PATH, Marshal.dump(scripts))
          File.binwrite(COMMON_PATH, Marshal.dump(common))

          MAP_IDS.each do |mid|
            File.binwrite(
              map_path(mid), Marshal.dump(maps[mid])
            )
          end

          # 11. Update cache hashes for changed original data.
          mapping_path = File.join(
            ROOT, 'knight/gameasync/mapping.js'
          )
          mapping = File.binread(mapping_path).force_encoding('UTF-8')

          modified_data = [
            SCRIPT_PATH,
            COMMON_PATH
          ] + MAP_IDS.map { |mid| map_path(mid) }

          modified_data.each do |path|
            relative = 'Data/' + File.basename(path)
            md5 = Digest::MD5.file(path).hexdigest
            pattern = Regexp.new(
              Regexp.escape(relative) + '\\?h=[a-f0-9]{32}'
            )
            verify(
              mapping.scan(pattern).size == 1,
              "cache mapping #{relative}"
            )
            mapping.gsub!(
              pattern, "#{relative}?h=#{md5}"
            )
          end
          File.binwrite(mapping_path, mapping)

          # 12. Version labels only.
          loader_path = File.join(
            ROOT, 'knight/js/sl-assets-v229r115.js'
          )
          loader = File.binread(loader_path)
          verify(
            loader.include?("var version='V1.4';"),
            'loader version'
          )
          File.binwrite(
            loader_path,
            loader.sub(
              "var version='V1.4';",
              "var version='V1.5';"
            )
          )

          ['index.html','knight/index.html'].each do |rel|
            path = File.join(ROOT, rel)
            content = File.binread(path)
            verify(
              content.include?('V1.4'),
              "version label #{rel}"
            )
            File.binwrite(
              path,
              content.gsub('V1.4','V1.5')
                     .gsub('v1.4','v1.5')
            )
          end

          puts 'PASS native event modification complete'
          puts "PASS #{STAT.size} stat EVs"
          puts "PASS #{DODGE.size} dodge EVs"
          puts "PASS #{bonuses.size} bonus monster EVs"
          puts "PASS #{bonus_additions} native drop conditions"
          puts 'PASS no added runtime module'
          puts 'PASS original item registration structure retained'
          RUBY

          ruby -c build/patch_v15.rb
          ruby build/patch_v15.rb

      - name: Verify V1.5 changes and unchanged game files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re

          root = Path('site')
          before = json.loads(
              Path('build/v14_manifest.json').read_text()
          )
          after = {
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          assert len(after) == 5623
          assert before.keys() == after.keys()

          prefix = (
              'knight/gameasync/Data/'
              'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          )

          allowed = {
              'knight/gameasync/Data/Scripts.rxdata',
              prefix + 'CommonEvents.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html',
              'knight/index.html'
          }

          maps = [3,4,8,9,11,17,21,22,23,31,35,37,41,43]
          allowed |= {
              prefix + f'Map{x:03d}.rxdata' for x in maps
          }

          changed = {
              path for path in before
              if before[path] != after[path]
          }

          assert changed == allowed, {
              'missing': sorted(allowed - changed),
              'unexpected': sorted(changed - allowed)
          }

          # All unrelated RPG data and all original resources
          # must remain byte-for-byte identical.
          queen = prefix + 'Map025.rxdata'
          assert before[queen] == after[queen]

          # No independent hotbar input or timer changes.
          assert before['knight/js/dpad.js'] == after['knight/js/dpad.js']

          mapping = (
              root / 'knight/gameasync/mapping.js'
          ).read_text('utf-8')

          for filename in (
              ['Scripts.rxdata',
               'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata']
              + [
                  'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
                  + f'Map{x:03d}.rxdata'
                  for x in maps
              ]
          ):
              path = root / 'knight/gameasync/Data' / filename
              digest = hashlib.md5(path.read_bytes()).hexdigest()
              assert mapping.count(
                  'Data/' + filename + '?h=' + digest
              ) == 1, filename

          loader = (
              root / 'knight/js/sl-assets-v229r115.js'
          ).read_text('utf-8')
          assert "var version='V1.5';" in loader

