name: build-slknight-web.yml | V4.9 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Restore V4.8 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45919348509
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Retrieve frozen V4.9 patch source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: e25068012e029a4d3704c8f9cb0afc683c99ce03
          path: frozen-v49
          persist-credentials: false
          fetch-depth: 1

      - name: Verify and extract original patch steps
        shell: bash
        run: |
          set -euo pipefail

          test "$(git -C frozen-v49 rev-parse HEAD)" = \
            "e25068012e029a4d3704c8f9cb0afc683c99ce03"

          test "$(git -C frozen-v49 rev-parse HEAD:.github/workflows/build-slknight-web.yml)" = \
            "afabbb2ae261596e670b1509d92c1d245aeca319"

          ruby -ryaml - <<'RUBY'
          source='frozen-v49/.github/workflows/build-slknight-web.yml'

          workflow=YAML.safe_load(
            File.read(source,encoding:'UTF-8')
          )

          steps=workflow.fetch('jobs').fetch('build').fetch('steps')

          wanted={
            'Verify V4.8 baseline'=>'verify',
            'Prepare original L1J monster traits'=>'traits',
            'Prepare L1J physical combat runtime'=>'runtime',
            'Replace verified physical combat event paths'=>'apply',
            'Update data mappings and version'=>'mapping',
            'Verify exact combat changes'=>'final'
          }

          wanted.each do |name,key|
            matches=steps.select{|s|s['name']==name}

            raise "Missing original step #{name}" unless matches.size==1

            run=matches.first.fetch('run')

            raise "Empty original step #{name}" unless run.is_a?(String) && !run.empty?

            File.binwrite("/tmp/sl49-v49-#{key}.sh",run)
          end

          puts 'PASS frozen V4.9 workflow source'
          RUBY

          for name in verify traits runtime apply mapping final; do
            bash -n "/tmp/sl49-v49-${name}.sh"
          done

      - name: Verify V4.8 baseline
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/sl49-v49-verify.sh

      - name: Prepare original L1J monster traits
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/sl49-v49-traits.sh

      - name: Prepare original physical combat runtime
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/sl49-v49-runtime.sh

      - name: Separate monster data from startup compilation
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl49-boot-fix.rb <<'RUBY'
          # encoding: UTF-8

          def once(s,a,b,n=1)
            count=s.scan(a).size

            raise "Anchor #{a.inspect}: #{count}/#{n}" unless count==n

            s.gsub(a){b}
          end

          s=File.read('/tmp/sl49-runtime.rb',encoding:'UTF-8')

          s=once(
            s,
            /  TRAITS=__TRAITS__\n  STATS=__STATS__/,
            <<~'SRC'.chomp.gsub(/^/,'  ')
            def self.stats(mid,eid)
              if @stats.nil?
                data=load_data('Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMonsterStats.rxdata')
                @stats={}
                data.each{|key,row| (@stats[key[0]] ||= {})[key[1]]=row}
              end
              map=@stats[mid]
              map && map[eid]
            end
          SRC
          )

          s=once(
            s,
            /t=TRAITS\.fetch\(\[mid,eid\]\)[;\s]+s=STATS\.fetch\(\[mid,eid\]\)/,
            's=stats(mid,eid); t=s[:sl49_traits]'
          )

          s=once(
            s,
            /t=TRAITS\[\[mid,eid\]\][;\s]+s=STATS\[\[mid,eid\]\]/,
            's=stats(mid,eid); t=s && s[:sl49_traits]'
          )

          s=once(
            s,
            /t=TRAITS\.fetch\(ctx\);? */,
            '',
            2
          )

          s=once(
            s,
            's=STATS.fetch(ctx)',
            's=stats(*ctx)'
          )

          raise 'Embedded monster data remains' if
            s.match?(/\b(?:TRAITS|STATS|__TRAITS__|__STATS__)\b/)

          raise 'Runtime too large' if s.bytesize>16000

          RubyVM::InstructionSequence.compile(s)

          File.binwrite('/tmp/sl49-runtime-fixed.rb',s)

          p='/tmp/sl49-v49-apply.sh'
          s=File.read(p,encoding:'UTF-8')

          old=<<~'OLD'.chomp
          runtime=File.read(
            '/tmp/sl49-runtime.rb',
            encoding:'UTF-8'
          ).sub('__TRAITS__'){
            traits.inspect
          }.sub('__STATS__'){
            stats.inspect
          }
          OLD

          s=once(
            s,
            old,
            "runtime=File.read('/tmp/sl49-runtime-fixed.rb',encoding:'UTF-8')"
          )

          s=once(
            s,
            'SL49::TRAITS.has_key?([@map_id,@event_id])',
            'SL49.stats(@map_id,@event_id)'
          )

          File.binwrite(p,s)

          puts 'PASS embedded monster data removed'
          puts 'PASS lazy monster data access'
          puts 'PASS original combat formulas retained'
          RUBY

          ruby -c /tmp/sl49-boot-fix.rb
          ruby /tmp/sl49-boot-fix.rb

          ruby -c /tmp/sl49-runtime-fixed.rb
          bash -n /tmp/sl49-v49-apply.sh

      - name: Apply corrected physical combat patch
        shell: bash
        run: |
          set -euo pipefail

          bash /tmp/sl49-v49-apply.sh

      - name: Merge traits into existing MonsterStats data
        shell: bash
        run: |
          set -euo pipefail

          ruby -rdigest -rjson -rzlib - <<'RUBY'
          root='site/knight/gameasync/Data'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          name=pre+'MonsterStats.rxdata'
          path=File.join(root,name)

          raw=File.binread(path)

          raise 'Original MonsterStats checksum' unless
            Digest::SHA256.hexdigest(raw)==
            'b75e5047db2bb6a5a9217f730a909a911fb2020e8d5952e90e37dced9bd52d93'

          old=Marshal.load(raw)
          data=Marshal.load(raw)

          traits={}
          npcs={}

          File.foreach('/tmp/sl49_npc_traits.txt') do |line|
            id,sz,u,h,r,lv,ev=line.split

            raise 'Duplicate NPC' if npcs[id]

            raise 'Invalid NPC size' unless
              ['small','large'].include?(sz)

            npcs[id]=true

            ev.split(',').each do |entry|
              key=entry.split(':').map(&:to_i)

              raise "Duplicate trait #{key.inspect}" if traits[key]

              traits[key]=[
                sz,u.to_i,h.to_i,r.to_i,lv.to_i
              ]
            end
          end

          raise 'NPC count' unless npcs.size==142

          raise 'Monster count' unless
            old.size==421 &&
            traits.size==421 &&
            traits.keys.sort==old.keys.sort

          raise 'Original stat count' unless
            old.values.inject(0){|n,row|n+row.size}==3368

          traits.each do |key,t|
            raise 'Unexpected existing trait' if
              data.fetch(key).has_key?(:sl49_traits)

            data.fetch(key)[:sl49_traits]=t
          end

          raise 'Original stats changed' unless
            data.all?{|key,row|
              row.reject{|k,v|k==:sl49_traits}==old[key] &&
              row[:sl49_traits]==traits[key]
            }

          merged=Marshal.dump(data)

          File.binwrite(path,merged)

          raise 'MonsterStats roundtrip' unless
            Marshal.load(File.binread(path))==data

          names=JSON.parse(
            File.read('/tmp/sl49-changed.json',encoding:'UTF-8')
          )

          raise 'Unexpected original data count' unless
            names.size==37 && names.uniq.size==37

          raise 'Unexpected duplicate data' if names.include?(name)

          names<<name

          File.write(
            '/tmp/sl49-changed.json',
            JSON.generate(names.sort)
          )

          puts 'PASS 3368 original stat fields preserved'
          puts 'PASS 421 monster traits merged'
          puts "PASS MonsterStats bytes #{merged.bytesize}"
          RUBY

      - name: Verify startup data access and combat runtime
        shell: bash
        run: |
          set -euo pipefail

          ruby -rzlib - <<'RUBY'
          # encoding: UTF-8

          $sl49_data_root='site/knight/gameasync'
          $sl49_reads=0

          def load_data(path)
            $sl49_reads+=1

            Marshal.load(
              File.binread(File.join($sl49_data_root,path))
            )
          end

          runtime=File.read(
            '/tmp/sl49-runtime-fixed.rb',
            encoding:'UTF-8'
          )

          eval(runtime)

          raise 'Data loaded during startup' unless $sl49_reads==0

          name='Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMonsterStats.rxdata'

          expected=Marshal.load(
            File.binread(File.join($sl49_data_root,name))
          )

          raise 'Monster count' unless expected.size==421

          expected.each do |key,row|
            actual=SL49.stats(key[0],key[1])

            raise "Incorrect monster data #{key.inspect}" unless
              actual==row
          end

          raise 'Repeated monster data loading' unless $sl49_reads==1

          raise 'Unmapped monster lookup' unless
            SL49.stats(999,999).nil?

          raise 'STR hit table' unless SL49::STR_HIT.size==59
          raise 'DEX hit table' unless SL49::DEX_HIT.size==60
          raise 'STR damage table' unless SL49::STR_DMG.size==128
          raise 'DEX damage table' unless SL49::DEX_DMG.size==128

          rows=Marshal.load(
            File.binread(
              File.join($sl49_data_root,'Data/Scripts.rxdata')
            )
          )

          entry=rows.select{|r|
            r && r[1].to_s.dup.force_encoding('UTF-8')=='Interpreter 3'
          }

          raise 'Interpreter 3 count' unless entry.size==1

          source=Zlib::Inflate.inflate(entry.first[2])

          raise 'Oversized startup script' if source.bytesize>32000

          raise 'Embedded monster table remains' if
            source.include?('TRAITS=') ||
            source.include?('STATS=')

          RubyVM::InstructionSequence.compile(
            source.force_encoding('UTF-8')
          )

          puts "PASS Interpreter 3 bytes #{source.bytesize}"
          puts 'PASS no combat data loading during script initialization'
          puts 'PASS 421 monster lookups'
          puts 'PASS monster data loaded once'
          RUBY

      - name: Update mapping verification for separated data
        shell: bash
        run: |
          set -euo pipefail

          ruby - <<'RUBY'
          def once(s,a,b)
            raise "Anchor #{a.inspect}" unless s.scan(a).size==1

            s.sub(a){b}
          end

          p='/tmp/sl49-v49-mapping.sh'
          s=File.read(p,encoding:'UTF-8')

          s=once(
            s,
            'assert len(names)==37',
            'assert len(names)==38'
          )

          s=once(
            s,
            'assert len(set(names))==37',
            'assert len(set(names))==38'
          )

          s=once(
            s,
            'PASS 37 updated data mappings',
            'PASS 38 updated data mappings'
          )

          File.binwrite(p,s)

          p='/tmp/sl49-v49-final.sh'
          s=File.read(p,encoding:'UTF-8')

          s=once(
            s,
            "    pre+'CommonEvents.rxdata'\n}",
            "    pre+'CommonEvents.rxdata',\n    pre+'MonsterStats.rxdata'\n}"
          )

          s=once(
            s,
            "'Armors','Items','MonsterStats',",
            "'Armors','Items',"
          )

          s=once(
            s,
            'assert len(changed)==41',
            'assert len(changed)==42'
          )

          File.binwrite(p,s)

          puts 'PASS separated data mapping verification'
          RUBY

          bash -n /tmp/sl49-v49-mapping.sh
          bash -n /tmp/sl49-v49-final.sh

      - name: Update data mappings and version
        shell: bash
        run: |
          set -euo pipefail

          bash /tmp/sl49-v49-mapping.sh

      - name: Verify exact combat changes
        shell: bash
        run: |
          set -euo pipefail

          bash /tmp/sl49-v49-final.sh

      - name: Verify final startup script and original engine
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib,json,re

          root=Path('site')
          game=root/'knight/gameasync'

          before=json.loads(
              Path('/tmp/sl49-before.json').read_text('utf8')
          )

          after={
              str(p.relative_to(root)):hashlib.sha256(
                  p.read_bytes()
              ).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          assert len(after)==6033
          assert set(before)==set(after)

          changed={
              name for name in before
              if before[name]!=after[name]
          }

          assert len(changed)==42

          for name in before:
              if name.endswith('.wasm') or name.endswith('.pack'):
                  assert before[name]==after[name],name

          assert all(
              before[name]==after[name]
              for name in before
              if name.endswith('/mkxp.js')
              or name.endswith('/drive.js')
              or name.endswith('/bitmap-map.js')
          )

          mapping=(game/'mapping.js').read_bytes()

          name='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMonsterStats.rxdata'

          for filename in ('Scripts.rxdata',name):
              raw=(game/'Data'/filename).read_bytes()

              marker=(
                  'Data/'+filename+'?h='+
                  hashlib.md5(raw).hexdigest()
              ).encode('ascii')

              assert mapping.count(marker)==1,filename

          loader=root/'knight/js/sl-assets-v229r115.js'

          assert loader.read_bytes().count(
              b"var version='V4.9';"
          )==1

          print('PASS original engine unchanged')
          print('PASS original asset packs unchanged')
          print('PASS modified files',len(changed))
          print('PASS unchanged files',len(before)-len(changed))
          print('PASS V4.9 startup correction')
          PYTHON

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Upload V4.9 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
