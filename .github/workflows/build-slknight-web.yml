name: Deploy SLKnight V14.3z8 CLEAN BUFF STATE + VERIFIED REMAINING 5 + DECOUPLED ORCS + FAST AUTO

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions: {contents: read, pages: write, id-token: write}

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  BASELINE_SHA: c6815cd461dba60ec131898e6d5dd8690dd915ae
  X2_SHA: 6d941bd643dda87b8267ba466e108d1904c22331
  Z1_SHA: 008b6abe81074b7af877806b45f2314004a74f66
  Z3_SHA: 5a46988b048764e8a99700998c1f4ab96a3ec5c1
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout frozen V14.3l baseline
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.BASELINE_SHA }}
          path: baseline

      - name: Checkout frozen V14.3x2 native auto base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.X2_SHA }}
          path: x2

      - name: Checkout frozen V14.3z1 verified monster base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z1_SHA }}
          path: z1

      - name: Checkout frozen V14.3z3 current success
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z3_SHA }}
          path: z3

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake cmake curl ffmpeg freepats git imagemagick libtool make mm-common patch pkg-config python3 rake ruby timidity unzip wget xz-utils fonts-nanum

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.MKXP_SRC_REF }}
          path: engine

      - name: Cache engine dependencies
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-${{ runner.os }}-${{ env.EMSDK_VER }}-onig25b

      - name: Extract frozen run scripts
        run: |
          ruby -ryaml - <<'RB'
          base=YAML.load_file('baseline/.github/workflows/build-slknight-web.yml')
          x2=YAML.load_file('x2/.github/workflows/build-slknight-web.yml')
          z1=YAML.load_file('z1/.github/workflows/build-slknight-web.yml')
          z3=YAML.load_file('z3/.github/workflows/build-slknight-web.yml')

          base_steps=base.fetch('jobs').fetch('build').fetch('steps')
          x2_steps=x2.fetch('jobs').fetch('build').fetch('steps')
          z1_steps=z1.fetch('jobs').fetch('build').fetch('steps')
          z3_steps=z3.fetch('jobs').fetch('build').fetch('steps')

          base_wanted={
            'Patch engine'=>'/tmp/base_patch_engine.sh',
            'Build engine'=>'/tmp/base_build_engine.sh',
            'Install game'=>'/tmp/base_install_game.sh',
            'Patch game'=>'/tmp/base_patch_game.sh',
            'Convert media'=>'/tmp/base_convert_media.sh',
            'Build mappings'=>'/tmp/base_build_mappings.sh',
            'Patch browser'=>'/tmp/base_patch_browser.sh',
            'Verify package'=>'/tmp/base_verify.sh'
          }
          x2_wanted={
            'Patch native Lineage hold attack'=>'/tmp/x2_native_auto.sh'
          }
          z3_wanted={
            'Patch Gnoll Neruga Drake Kelberos'=>'/tmp/z3_delta.sh',
            'Patch native Lineage hold attack + full-speed auto'=>'/tmp/z3_auto.sh',
            'Preload verified attack and breath assets'=>'/tmp/z3_preload.sh',
            'Verify V14.3z3 package'=>'/tmp/z3_verify.sh'
          }

          base_wanted.each do |name,path|
            step=base_steps.find{|x|x['name']==name}
            abort "BASELINE STEP MISSING: #{name}" unless step&&step['run']
            File.write(path,step['run'])
          end
          x2_wanted.each do |name,path|
            step=x2_steps.find{|x|x['name']==name}
            abort "X2 STEP MISSING: #{name}" unless step&&step['run']
            File.write(path,step['run'])
          end

          step=z1_steps.find{|x|x['name']=='Patch verified monster attacks only'}
          abort 'Z1 monster patch missing' unless step&&step['run']
          File.write('/tmp/z1_monster_patch.sh',step['run'])

          z3_wanted.each do |name,path|
            step=z3_steps.find{|x|x['name']==name}
            abort "Z3 STEP MISSING: #{name}" unless step&&step['run']
            File.write(path,step['run'])
          end

          puts 'FROZEN_SCRIPTS_Z8_OK'
          RB

      - name: Remove unsupported Orc alias mappings from z1 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('/tmp/z1_monster_patch.sh')
          s=p.read_text()

          s=s.replace(
              "# No separate 두다마라/로바 attack sheet exists; both use the\n"
              "# user-verified generic 오크.png / 오크모션 set.\n",
              ""
          )

          for attack_id,next_id in ((857,859),(860,862)):
              pat=rf'(?ms)^[ \t]*{attack_id}=>\{{\n.*?^[ \t]*\}},\n(?=[ \t]*{next_id}=>\{{)'
              s,n=re.subn(pat,'',s,count=1)
              if n!=1:
                  raise SystemExit(f'failed to remove unsupported attack {attack_id}: {n}')

          for bad in ("857=>{","860=>{","label:'두다마라오크'","label:'로바오크'"):
              if bad in s:
                  raise SystemExit('unsupported Orc mapping remains: '+bad)

          p.write_text(s)
          print('Z1_ORC_ALIAS_MAPPING_REMOVED')
          PY

      - name: Add user-verified remaining 5 monster mappings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('/tmp/z1_monster_patch.sh')
          s=p.read_text()

          for attack_id in (852,866,867,871,872):
              if re.search(rf'(?m)^[ \t]*{attack_id}=>\{{',s):
                  raise SystemExit(f'remaining mapping already exists: {attack_id}')

          def insert_before_id(src, attack_id, body):
              pat=rf'(?m)^([ \t]*){attack_id}=>\{{'
              matches=list(re.finditer(pat,src))
              if len(matches)!=1:
                  raise SystemExit(f'insertion anchor {attack_id} count={len(matches)}')
              m=matches[0]
              indent=m.group(1)
              block='\n'.join(indent+line if line else '' for line in body.splitlines())+'\n'
              return src[:m.start()]+block+src[m.start():]

          hob="""852=>{
            label:'홉고블린',coord:'홉고블린',dirs:{
              8=>['홉고블린모션',[0,1,2,3,4,5,6],false],
              6=>['홉고블린모션',[7,8,9,10,11,12,13],false],
              2=>['홉고블린모션',[14,15,16,17,18,19,20],false],
              4=>['홉고블린모션',[7,8,9,10,11,12,13],true]
            }
          },"""
          s=insert_before_id(s,853,hob)

          rest="""866=>{
            label:'좀비엘모어장군',coord:'좀비 엘모어 장군',dirs:{
              8=>['좀비엘모어장군모션',[0,1,2,3,4,5,6,7,8],false],
              6=>['좀비엘모어장군모션',[10,11,12,13,14,15,16,17,18],false],
              4=>['좀비엘모어장군모션',[10,11,12,13,14,15,16,17,18],true]
            }
          },
          867=>{
            label:'좀비엘모어병사',coord:'좀비 엘모어 병사',dirs:{
              8=>['좀비엘모어병사모션',[0,1,2,3,4,5,6],false],
              6=>['좀비엘모어병사모션',[7,8,9,10,11,12,13],false],
              2=>['좀비엘모어병사모션',[14,15,16,17,18,19,20],false],
              4=>['좀비엘모어병사모션',[7,8,9,10,11,12,13],true]
            }
          },
          871=>{
            label:'해골근위병',coord:'해골 근위병',dirs:{
              2=>['해골근위병모션',[0,1,2,3,4,5],false],
              4=>['해골근위병모션',[6,7,8,9,10,11],false],
              8=>['해골근위병모션',[12,13,14,15],false],
              6=>['해골근위병모션',[16,17,18,19],false]
            }
          },
          872=>{
            label:'해골돌격병',coord:'해골 돌격병',dirs:{
              2=>['해골돌격병모션',[0,1,2,3,4],false],
              4=>['해골돌격병모션',[5,6,7,8,9],false],
              8=>['해골돌격병모션',[10,11,12,13],false],
              6=>['해골돌격병모션',[5,6,7,8,9],true]
            }
          },"""
          s=insert_before_id(s,876,rest)

          old='abort "verified direction missing attack=#{attack_id} dir=#{dir}" unless spec'
          if s.count(old)!=1:
              raise SystemExit(f'direction-required marker count={s.count(old)}')
          s=s.replace(old,'next unless spec',1)

          pat=r'(?m)^([ \t]*)ids=data\[:ids\][ \t]*$'
          matches=list(re.finditer(pat,s))
          if len(matches)!=1:
              raise SystemExit(f'ids=data marker count={len(matches)}')
          m=matches[0]
          indent=m.group(1)
          replacement=(
              indent+"ids=data[:ids]\n"+
              indent+"id_map=[2,4,6,8].select{|d|ids[d]}.map{|d|\"#{d}=>#{ids[d]}\"}.join(',')\n"+
              indent+'abort "verified direction map empty attack=#{attack_id}" if id_map.empty?'
          )
          s=s[:m.start()]+replacement+s[m.end():]

          old='"{2=>#{ids[2]},4=>#{ids[4]},6=>#{ids[6]},8=>#{ids[8]}},"'
          if s.count(old)!=1:
              raise SystemExit(f'hard-coded direction-map count={s.count(old)}')
          s=s.replace(old,'"{#{id_map}},"',1)

          checks=(
              "8=>['홉고블린모션',[0,1,2,3,4,5,6],false]",
              "6=>['홉고블린모션',[7,8,9,10,11,12,13],false]",
              "2=>['홉고블린모션',[14,15,16,17,18,19,20],false]",
              "4=>['홉고블린모션',[7,8,9,10,11,12,13],true]",
              "8=>['좀비엘모어장군모션',[0,1,2,3,4,5,6,7,8],false]",
              "6=>['좀비엘모어장군모션',[10,11,12,13,14,15,16,17,18],false]",
              "4=>['좀비엘모어장군모션',[10,11,12,13,14,15,16,17,18],true]",
              "8=>['좀비엘모어병사모션',[0,1,2,3,4,5,6],false]",
              "6=>['좀비엘모어병사모션',[7,8,9,10,11,12,13],false]",
              "2=>['좀비엘모어병사모션',[14,15,16,17,18,19,20],false]",
              "4=>['좀비엘모어병사모션',[7,8,9,10,11,12,13],true]",
              "2=>['해골근위병모션',[0,1,2,3,4,5],false]",
              "4=>['해골근위병모션',[6,7,8,9,10,11],false]",
              "8=>['해골근위병모션',[12,13,14,15],false]",
              "6=>['해골근위병모션',[16,17,18,19],false]",
              "2=>['해골돌격병모션',[0,1,2,3,4],false]",
              "4=>['해골돌격병모션',[5,6,7,8,9],false]",
              "8=>['해골돌격병모션',[10,11,12,13],false]",
              "6=>['해골돌격병모션',[5,6,7,8,9],true]"
          )
          for needle in checks:
              if needle not in s:
                  raise SystemExit('confirmed mapping missing: '+needle)

          if re.search(r"2=>\['좀비엘모어장군모션'",s):
              raise SystemExit('unexpected zombie general D2 attack mapping')

          p.write_text(s)
          print('REMAINING_5_VERIFIED_MAPPINGS_ADDED')
          PY

      - name: Retarget inherited z3 scripts to z8 counts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          delta=Path('/tmp/z3_delta.sh')
          s=delta.read_text()
          replacements={
              'test "$(wc -l < player/gameasync/sl_attack_sheets.txt)" -eq 21':'test "$(wc -l < player/gameasync/sl_attack_sheets.txt)" -eq 25',
              'test "$(wc -l < player/gameasync/sl_attack_coords.txt)" -eq 18':'test "$(wc -l < player/gameasync/sl_attack_coords.txt)" -eq 22',
              'test "$(wc -l < player/gameasync/sl_attack_verified_ids.txt)" -eq 19':'test "$(wc -l < player/gameasync/sl_attack_verified_ids.txt)" -eq 22'
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit('delta count marker missing: '+old)
              s=s.replace(old,new)
          delta.write_text(s)

          preload=Path('/tmp/z3_preload.sh')
          s=preload.read_text()
          for old,new in (
              ('expected=21','expected=25'),
              ('sheets.length==21','sheets.length==25'),
              ('expected=18','expected=22'),
              ('chars.length==18','chars.length==22'),
              ('V14.3z3','V14.3z8'),
              ('v143z3','v143z8'),
              ('Z3','Z8'),
              ('z3','z8')
          ):
              s=s.replace(old,new)
          preload.write_text(s)

          verify=Path('/tmp/z3_verify.sh')
          s=verify.read_text()
          for old,new in (
              ('-eq 21','-eq 25'),
              ('-eq 18','-eq 22'),
              ('-eq 19','-eq 22'),
              ('V14.3z3','V14.3z8'),
              ('v143z3','v143z8'),
              ('FINAL_VERIFY_Z3','FINAL_VERIFY_Z8'),
              ('final_z3_verify','final_z8_verify')
          ):
              s=s.replace(old,new)
          verify.write_text(s)

          print('Z8_INHERITED_SCRIPTS_RETARGETED')
          PY

      - name: Patch engine
        run: bash /tmp/base_patch_engine.sh

      - name: Build engine
        run: bash /tmp/base_build_engine.sh

      - name: Install game
        run: bash /tmp/base_install_game.sh

      - name: Patch game from V14.3l
        run: bash /tmp/base_patch_game.sh

      - name: Rebuild timed buff state as independent state machine
        run: |
          cat > /tmp/rebuild_buff_state_v2.rb <<'RB'
          # encoding: UTF-8
          game=ARGV.fetch(0)
          
          class RawMarshalObject
            def self._load(data); o=allocate; o.instance_variable_set(:@raw,data); o; end
            def _dump(_depth); @raw; end
          end
          class Tone < RawMarshalObject; end
          class Color < RawMarshalObject; end
          class Rect < RawMarshalObject; end
          class Table < RawMarshalObject; end
          module RPG
            class AudioFile; end
            class Animation; class Frame; end; class Timing; end; end
            class Map; end
            class CommonEvent; end
            class Event; class Page; class Condition; end; class Graphic; end; end; end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
            class Item; end
          end
          
          def iv(o,n); o.instance_variable_get("@#{n}"); end
          def setiv(o,n,v); o.instance_variable_set("@#{n}",v); end
          
          def cmd(code,indent=0,params=[])
            c=RPG::EventCommand.new
            setiv(c,:code,code)
            setiv(c,:indent,indent)
            setiv(c,:parameters,params)
            c
          end
          
          def switch_cmd(indent,id,on)
            cmd(121,indent,[id,id,on ? 0 : 1])
          end
          
          def var_set(indent,id,val); cmd(122,indent,[id,id,0,0,val]); end
          def var_add(indent,id,val); cmd(122,indent,[id,id,1,0,val]); end
          def var_sub(indent,id,val); cmd(122,indent,[id,id,2,0,val]); end
          
          def move_route(indent,specs)
            route=RPG::MoveRoute.new
            setiv(route,:repeat,false)
            setiv(route,:skippable,false)
            moves=specs.map do |code,params|
              m=RPG::MoveCommand.new
              setiv(m,:code,code)
              setiv(m,:parameters,params)
              m
            end
            tail=RPG::MoveCommand.new
            setiv(tail,:code,0)
            setiv(tail,:parameters,[])
            setiv(route,:list,moves+[tail])
            [cmd(209,indent,[-1,route])] + moves.map{|m|cmd(509,indent,[m])}
          end
          
          def speed(indent,value); move_route(indent,[[29,[value]]]); end
          
          def branch_script(indent,expr,yes,no=nil)
            out=[cmd(111,indent,[12,expr])]
            out.concat(yes)
            out<<cmd(0,indent+1,[])
            if no
              out<<cmd(411,indent,[])
              out.concat(no)
              out<<cmd(0,indent+1,[])
            end
            out<<cmd(412,indent,[])
            out
          end
          
          def branch_switch(indent,id,yes,no=nil)
            out=[cmd(111,indent,[0,id,0])]
            out.concat(yes)
            out<<cmd(0,indent+1,[])
            if no
              out<<cmd(411,indent,[])
              out.concat(no)
              out<<cmd(0,indent+1,[])
            end
            out<<cmd(412,indent,[])
            out
          end
          
          def branch_item(indent,id,yes,no=nil)
            out=[cmd(111,indent,[8,id])]
            out.concat(yes)
            out<<cmd(0,indent+1,[])
            if no
              out<<cmd(411,indent,[])
              out.concat(no)
              out<<cmd(0,indent+1,[])
            end
            out<<cmd(412,indent,[])
            out
          end
          
          def ui_refresh(indent)
            [cmd(355,indent,['Guage.show']),cmd(355,indent,['$KeyIcon.ShowIcon'])]
          end
          
          def call_speed_recalc(indent)
            [cmd(117,indent,[68])]
          end
          
          def effective_speed_tree(indent)
            other='[58,138,189,264,265,311,390,627,628,629].any?{|i|$game_variables[i].to_i==1}'
            fallback=branch_script(
              indent+2,
              other,
              speed(indent+3,4),
              branch_script(
                indent+3,
                '$game_switches[172]',
                speed(indent+4,4),
                branch_script(
                  indent+4,
                  '$game_switches[171] || $game_switches[368]',
                  speed(indent+5,3),
                  speed(indent+5,2)
                )
              )
            )
            assassin=branch_script(
              indent+1,
              '$game_variables[309].to_i==1',
              speed(indent+2,3),
              fallback
            )
            branch_script(
              indent,
              '$game_variables[263].to_i==1',
              speed(indent+1,5),
              assassin
            )
          end
          
          def append_common_call(ce,common_id)
            list=iv(ce,:list)||[]
            while !list.empty? && iv(list[-1],:code)==0
              list.pop
            end
            exists=list.any? do |c|
              iv(c,:code)==117 && (iv(c,:parameters)||[])==[common_id]
            end
            list<<cmd(117,0,[common_id]) unless exists
            list<<cmd(0,0,[])
            setiv(ce,:list,list)
          end
          
          ce_path=Dir.glob(File.join(game,'Data','*CommonEvents.rxdata')).max_by{|p|File.size(p)}
          item_path=Dir.glob(File.join(game,'Data','*Items.rxdata')).max_by{|p|File.size(p)}
          abort 'CommonEvents missing' unless ce_path&&File.size(ce_path)>1000
          abort 'Items missing' unless item_path&&File.size(item_path)>1000
          
          ce=Marshal.load(File.binread(ce_path))
          items=Marshal.load(File.binread(item_path))
          [3,4,6,8,10,17,33,34,59,60,68,107].each{|id|abort "CE#{id} missing" unless ce[id]}
          [2,3,17,37].each{|id|abort "item#{id} missing" unless items[id]}
          
          # -----------------------------------------------------------------------------
          # Ownership model
          # 171 = normal green active
          # 368 = enhanced green active
          # 110 = elapsed green counter. 300 normal / 1800 enhanced.
          # 172 = courage active
          # 1002 = courage timer trigger
          # 109 = elapsed courage counter. 300 threshold.
          # 54 + transform variables belong ONLY to transformation events.
          # 998 remains the original transform/haste speed-refresh switch. Potion events never toggle it.
          # -----------------------------------------------------------------------------
          
          # CE3 normal green: repeated use ADDS 300 ticks. If enhanced green is active,
          # normal green adds 300 to the enhanced timer instead of downgrading it.
          ce3=ce[3]
          normal_on=(
            [var_sub(2,110,300),switch_cmd(2,171,true)]
          )
          normal_new=(
            [var_set(2,110,0),switch_cmd(2,368,false),switch_cmd(2,171,true)]
          )
          normal_branch=branch_switch(1,171,normal_on,normal_new)
          strong_active=(
            [var_sub(1,110,300),switch_cmd(1,171,false)]
          )
          ce3_list=branch_switch(0,368,strong_active,normal_branch)
          ce3_list += [cmd(355,0,['$메세지.set_text2("갑자기 빠르게 움직입니다.")'])]
          ce3_list += ui_refresh(0)
          ce3_list += [cmd(207,0,[-1,2])]
          ce3_list += call_speed_recalc(0)
          ce3_list << cmd(0,0,[])
          setiv(ce3,:list,ce3_list)
          setiv(ce3,:trigger,0)
          setiv(ce3,:switch_id,1)
          
          # CE33 enhanced green: repeated use ADDS 1800 ticks. Upgrading from normal
          # green preserves ALL remaining normal-green time and adds a full 1800 ticks.
          ce33=ce[33]
          strong_stack=[var_sub(1,110,1800),switch_cmd(1,171,false)]
          upgrade_from_normal=[var_sub(2,110,300),switch_cmd(2,171,false),switch_cmd(2,368,true)]
          strong_new=[var_set(2,110,0),switch_cmd(2,171,false),switch_cmd(2,368,true)]
          upgrade_branch=branch_switch(1,171,upgrade_from_normal,strong_new)
          ce33_list=branch_switch(0,368,strong_stack,upgrade_branch)
          ce33_list += [cmd(355,0,['$메세지.set_text2("갑자기 빠르게 움직입니다.")'])]
          ce33_list += ui_refresh(0)
          ce33_list += [cmd(207,0,[-1,2])]
          ce33_list += call_speed_recalc(0)
          ce33_list << cmd(0,0,[])
          setiv(ce33,:list,ce33_list)
          setiv(ce33,:trigger,0)
          setiv(ce33,:switch_id,1)
          
          # CE8 courage: repeated use ADDS 300 ticks. Green/strong green continue their
          # own timers concurrently. If no green is active, one normal green potion is
          # consumed and started exactly once, preserving the original usage requirement.
          ce8=ce[8]
          start_courage=[
            cmd(126,2,[3,1,0,1]),
            var_set(2,109,0),
            switch_cmd(2,1001,false),
            switch_cmd(2,172,true),
            switch_cmd(2,1002,true),
            cmd(355,2,['a = "몸 속 깊은 곳에서 피가 끓어 오르는 것을 느낍니다."']),
            cmd(655,2,['$메세지.set_text2(a)'])
          ] + ui_refresh(2) + [cmd(207,2,[-1,270]),cmd(117,2,[589])] + call_speed_recalc(2)
          
          start_with_green=[
            cmd(126,3,[2,1,0,1]),
            var_set(3,110,0),
            switch_cmd(3,368,false),
            switch_cmd(3,171,true),
            cmd(126,3,[3,1,0,1]),
            var_set(3,109,0),
            switch_cmd(3,1001,false),
            switch_cmd(3,172,true),
            switch_cmd(3,1002,true),
            cmd(355,3,['a = "몸 속 깊은 곳에서 피가 끓어 오르는 것을 느낍니다."']),
            cmd(655,3,['$메세지.set_text2(a)'])
          ] + ui_refresh(3) + [cmd(207,3,[-1,270]),cmd(117,3,[589])] + call_speed_recalc(3)
          
          no_green=[cmd(355,3,['$메세지.set_text2("초록 물약이 부족하여 용기의 물약을 사용할 수 없습니다.")'])]
          need_green=branch_item(2,2,start_with_green,no_green)
          start_if_green=branch_script(1,'$game_switches[171] || $game_switches[368]',start_courage,need_green)
          stack_courage=[
            cmd(126,1,[3,1,0,1]),
            var_sub(1,109,300)
          ] + ui_refresh(1) + [cmd(207,1,[-1,270]),cmd(117,1,[589])] + call_speed_recalc(1)
          ce8_list=branch_switch(0,172,stack_courage,start_if_green)
          ce8_list<<cmd(0,0,[])
          setiv(ce8,:list,ce8_list)
          setiv(ce8,:trigger,0)
          setiv(ce8,:switch_id,1)
          
          # CE4 courage timer owns courage ONLY. Transform and green states are never
          # cancelled here. That prevents courage expiry from corrupting transform/green.
          ce4=ce[4]
          warn4=[
            cmd(355,1,['$BufTime = 1']),
            cmd(355,1,['$메세지.set_text2("***용기의 물약 해제 : 10초전***")']),
            cmd(655,1,['Guage.show']),
            cmd(355,1,['$BufTime = 0'])
          ]
          expire4=[
            var_set(1,109,0),
            switch_cmd(1,172,false),
            switch_cmd(1,1002,false),
            cmd(355,1,['a = "***당신의 기분이 보통으로 돌아왔습니다.***"']),
            cmd(655,1,['$메세지.set_text2(a)'])
          ] + ui_refresh(1) + [cmd(117,1,[589])] + call_speed_recalc(1)
          ce4_list=[cmd(106,0,[20]),var_add(0,109,1)]
          ce4_list += branch_script(0,'$game_variables[109].to_i == 290',warn4)
          ce4_list += branch_script(0,'$game_variables[109].to_i >= 300',expire4)
          ce4_list << cmd(0,0,[])
          setiv(ce4,:list,ce4_list)
          setiv(ce4,:trigger,2)
          setiv(ce4,:switch_id,1002)
          
          # CE10 normal green timer owns normal-green ONLY.
          ce10=ce[10]
          warn10=[
            cmd(355,1,['$BufTime = 1']),
            cmd(355,1,['$메세지.set_text2("***속도 향상 물약 해제 : 10초전***")']),
            cmd(655,1,['Guage.show']),
            cmd(355,1,['$BufTime = 0'])
          ]
          expire10=[
            var_set(1,110,0),
            switch_cmd(1,171,false),
            cmd(355,1,['$메세지.set_text2("***느려지는 것을 느낍니다.***")'])
          ] + ui_refresh(1) + call_speed_recalc(1)
          ce10_list=[cmd(106,0,[20]),var_add(0,110,1)]
          ce10_list += branch_script(0,'$game_variables[110].to_i == 290',warn10)
          ce10_list += branch_script(0,'$game_variables[110].to_i >= 300',expire10)
          ce10_list << cmd(0,0,[])
          setiv(ce10,:list,ce10_list)
          setiv(ce10,:trigger,2)
          setiv(ce10,:switch_id,171)
          
          # CE107 enhanced green timer owns enhanced-green ONLY.
          ce107=ce[107]
          warn107=[
            cmd(355,1,['$BufTime = 1']),
            cmd(355,1,['$메세지.set_text2("***강화 속도 향상 물약 해제 : 10초전***")']),
            cmd(655,1,['Guage.show']),
            cmd(355,1,['$BufTime = 0'])
          ]
          expire107=[
            var_set(1,110,0),
            switch_cmd(1,368,false),
            cmd(355,1,['$메세지.set_text2("***느려지는 것을 느낍니다.***")'])
          ] + ui_refresh(1) + call_speed_recalc(1)
          ce107_list=[cmd(106,0,[20]),var_add(0,110,1)]
          ce107_list += branch_script(0,'$game_variables[110].to_i == 1790',warn107)
          ce107_list += branch_script(0,'$game_variables[110].to_i >= 1800',expire107)
          ce107_list << cmd(0,0,[])
          setiv(ce107,:list,ce107_list)
          setiv(ce107,:trigger,2)
          setiv(ce107,:switch_id,368)
          
          # CE68 is a pure derived movement-speed calculator. It keeps the original
          # switch-998 parallel trigger for transform/haste compatibility, but potion
          # events invoke CE68 directly and never toggle 998.
          ce68=ce[68]
          ce68_list=effective_speed_tree(0)
          ce68_list<<switch_cmd(0,998,false)
          ce68_list<<cmd(0,0,[])
          setiv(ce68,:list,ce68_list)
          setiv(ce68,:trigger,2)
          setiv(ce68,:switch_id,998)
          
          # Transform menu and transform-control ring keep their original transform logic.
          # They call CE68 directly for final speed reconciliation; they do not toggle switch 998.
          append_common_call(ce[6],68)
          append_common_call(ce[17],68)

          # CE59 is the game's real transform-recognition OFF event. Keep its 638..691
          # recognition flags and additionally drop already-acquired monster aggro on the
          # current map. This prevents a monster that was chasing before polymorph from
          # continuing to recognize the transformed player.
          ce59=ce[59]
          ce59_list=iv(ce59,:list)||[]
          while !ce59_list.empty? && iv(ce59_list[-1],:code)==0
            ce59_list.pop
          end
          deaggro_script=<<'SCRIPT'
          # SL_TRANSFORM_DEAGGRO_V1
          begin
            if defined?($game_map) && $game_map && defined?($game_self_switches) && $game_self_switches
              changed=false
              $game_map.events.each do |eid,ev|
                raw=ev.instance_variable_get(:@event)
                pages=raw && raw.pages
                chasing=pages && pages.any? do |page|
                  route=page.move_route
                  page.trigger.to_i==2 &&
                    page.move_type.to_i==3 &&
                    route && route.list &&
                    route.list.any?{|mc|mc.code.to_i==10}
                end
                next unless chasing
                key=[$game_map.map_id,eid,'A']
                if $game_self_switches[key]
                  $game_self_switches[key]=false
                  changed=true
                end
                ev.sl_attack_finish if ev.respond_to?(:sl_attack_finish)
                ev.sl_breath_finish if ev.respond_to?(:sl_breath_finish)
                ev.animation_id=0 if ev.respond_to?(:animation_id=)
              end
              $game_map.need_refresh=true if changed
            end
            SLMonsterAttackContext.instance_variable_set(:@pending,{}) if defined?(SLMonsterAttackContext)
            SLBreathContext.instance_variable_set(:@pending,{}) if defined?(SLBreathContext)
          rescue
          end
          SCRIPT
          ce59_list<<cmd(355,0,[deaggro_script])
          ce59_list<<cmd(0,0,[])
          setiv(ce59,:list,ce59_list)

          # CE60 is the original recognition ON event. Do not alter it.
          ce60=ce[60]
          abort 'CE59 recognition-off range missing' unless (iv(ce59,:list)||[]).any?{|c|iv(c,:code)==122&&(iv(c,:parameters)||[])==[638,691,0,0,0]}
          abort 'CE60 recognition-on range missing' unless (iv(ce60,:list)||[]).any?{|c|iv(c,:code)==122&&(iv(c,:parameters)||[])==[638,691,0,0,1]}
          
          # Explicit item routing. Do not change the transformation common-event itself.
          setiv(items[2],:common_event_id,3)
          setiv(items[3],:common_event_id,8)
          setiv(items[17],:common_event_id,6)
          setiv(items[37],:common_event_id,33)
          
          # -----------------------------------------------------------------------------
          # Structural invariants
          # -----------------------------------------------------------------------------
          transform_vars=[58,138,189,263,264,265,309,311,390,627,628,629]
          transform_switches=[54,60,152,154,253,254,255,845,869,870]
          [3,4,8,10,33,107].each do |id|
            (iv(ce[id],:list)||[]).each do |c|
              code=iv(c,:code)
              par=iv(c,:parameters)||[]
              if code==122 && transform_vars.include?(par[0].to_i)
                abort "CE#{id} writes transform variable #{par[0]}"
              end
              if code==121 && transform_switches.include?(par[0].to_i)
                abort "CE#{id} writes transform switch #{par[0]}"
              end
              if code==209
                route=par[1]
                (iv(route,:list)||[]).each{|mc|abort "CE#{id} changes character graphic" if iv(mc,:code)==41}
              elsif code==509
                mc=par[0]
                abort "CE#{id} changes character graphic" if mc&&iv(mc,:code)==41
              end
            end
          end
          
          # No green event may switch courage off; no courage event may switch green off.
          [3,10,33,107].each do |id|
            abort "CE#{id} writes courage state" if (iv(ce[id],:list)||[]).any? do |c|
              iv(c,:code)==121 && [172,1002].include?((iv(c,:parameters)||[])[0].to_i)
            end
          end
          abort 'CE4 writes green state' if (iv(ce[4],:list)||[]).any?{|c|iv(c,:code)==121&&[171,368].include?((iv(c,:parameters)||[])[0].to_i)}

          # Potion/courage events must never toggle transform/haste switch 998.
          [3,4,8,10,33,107].each do |id|
            bad=(iv(ce[id],:list)||[]).any? do |c|
              iv(c,:code)==121 && (iv(c,:parameters)||[])[0].to_i==998
            end
            abort "CE#{id} touches switch998" if bad
            abort "CE#{id} missing direct speed recalc" unless (iv(ce[id],:list)||[]).any?{|c|iv(c,:code)==117&&(iv(c,:parameters)||[])==[68]}
          end

          # Transform activation must retain recognition OFF and de-aggro behavior.
          rec_script=(iv(ce59,:list)||[]).select{|c|iv(c,:code)==355}.map{|c|(iv(c,:parameters)||[])[0].to_s}.join("\n")
          abort 'transform deaggro hook missing' unless rec_script.include?('SL_TRANSFORM_DEAGGRO_V1')

          # Pure CE68 may only write switch 998 and movement speed routes.
          (iv(ce68,:list)||[]).each do |c|
            code=iv(c,:code)
            par=iv(c,:parameters)||[]
            if code==121
              abort 'CE68 writes non-998 switch' unless par[0].to_i==998
            elsif code==122
              abort 'CE68 writes variable'
            elsif code==209
              route=par[1]
              (iv(route,:list)||[]).each do |mc|
                abort 'CE68 changes graphics' if iv(mc,:code)==41
                abort 'CE68 non-speed movement command' unless [0,29].include?(iv(mc,:code).to_i)
              end
            elsif code==509
              mc=par[0]
              abort 'CE68 changes graphics' if mc&&iv(mc,:code)==41
              abort 'CE68 non-speed continuation' if mc&&iv(mc,:code).to_i!=29
            end
          end
          
          # Stacking math proof for elapsed-counter representation.
          [-3600,-1800,-600,-300,0,120,299].each do |elapsed|
            normal_before=300-elapsed
            normal_after=300-(elapsed-300)
            abort 'normal +300 math broken' unless normal_after==normal_before+300
          
            strong_before=1800-elapsed
            strong_plus_normal=1800-(elapsed-300)
            abort 'enhanced +normal300 math broken' unless strong_plus_normal==strong_before+300
          
            strong_after=1800-(elapsed-1800)
            abort 'enhanced +1800 math broken' unless strong_after==strong_before+1800
          
            courage_before=300-elapsed
            courage_after=300-(elapsed-300)
            abort 'courage +300 math broken' unless courage_after==courage_before+300
          end
          [-600,-300,0,120,299].each do |elapsed|
            old_remaining=300-elapsed
            upgraded_elapsed=elapsed-300
            upgraded_remaining=1800-upgraded_elapsed
            abort 'normal->enhanced carry math broken' unless upgraded_remaining==old_remaining+1800
          end
          
          # Item contracts used by events.
          abort 'normal green routing wrong' unless iv(items[2],:common_event_id)==3&&iv(items[2],:consumable)==true
          abort 'courage routing wrong' unless iv(items[3],:common_event_id)==8&&iv(items[3],:consumable)==false
          abort 'transform routing wrong' unless iv(items[17],:common_event_id)==6&&iv(items[17],:consumable)==false
          abort 'enhanced green routing wrong' unless iv(items[37],:common_event_id)==33&&iv(items[37],:consumable)==true
          
          File.binwrite(ce_path,Marshal.dump(ce))
          File.binwrite(item_path,Marshal.dump(items))
          puts "BUFF_STATE_V3_OK ce3=#{iv(ce3,:list).length} ce4=#{iv(ce4,:list).length} ce8=#{iv(ce8,:list).length} ce10=#{iv(ce10,:list).length} ce33=#{iv(ce33,:list).length} ce68=#{iv(ce68,:list).length} ce107=#{iv(ce107,:list).length}"
          RB

          ruby -c /tmp/rebuild_buff_state_v2.rb
          ruby -EUTF-8:UTF-8 /tmp/rebuild_buff_state_v2.rb player/gameasync

