
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R37
# BASE: deployed V229R35, GitHub Actions run 39361637398
# 1F: KEEP R35 all-stairs-open temporary exploration rule.
# 2F: REMOVE R35 broad automatic return areas. Only original to1's
# walkable tile (81,94) may return, after standing for 80 game frames.
# 2F Baphomet: original Map043 Event046 battle logic, source world (32706,32846)
# mapped to walkable, reachable Map046 tile (156,100), Event013.
# No new boss engine, sprites, movement, graphics, or collision modifications.
name: build-slknight-web.yml | V229R37 | Clean Native Events and 2x Terrain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R37 Restore exact R35 deployed site
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39361637398
          name: github-pages
          github-token: ${{ github.token }}
          path: r35

      - name: V229R37 Verify untouched R35 game baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s r35/artifact.tar
          mkdir -p site build
          tar -xf r35/artifact.tar -C site
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site');g=root/'knight/gameasync/Data'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          expected={
            'Scripts.rxdata':'f249b698ae6d1c72535ae2b12559e8bb10494657febc67ba0b23195944f4f7d0',
            pre+'Map045.rxdata':'d9dc66271e48f051b0d35a2dce109777a14fd396f87fcd7d0e76b044b482e3ba',
            pre+'Map046.rxdata':'0c12b314f80b47ef1c19f22109b8f456dd43e5e56b2730adbc90384a3be674aa',
          }
          for name,sha in expected.items():
            assert hashlib.sha256((g/name).read_bytes()).hexdigest()==sha,name
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          assert len(before)==5472,len(before)
          for page in ('index.html','knight/index.html'):
            assert 'V229R35' in (root/page).read_text(encoding='utf-8'),page
          Path('build/r35-hashes.json').write_text(json.dumps(before,sort_keys=True))
          print('PASS exact R35 baseline; 1F all-stairs test remains intact')
          PY_BASE

      - name: V229R37 Replace ONLY 2F automatic return watcher
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r37_return.rb <<'RUBY_PATCH'
          require 'json'
          require 'digest'
          module RPG
            class Map;end;class MapInfo;end;class AudioFile;end;class Tileset;end
            class Event
              class Page
                class Condition;end;class Graphic;end
              end
            end
            class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          class Table
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(depth=0);@raw;end
            def [](x,y=0,z=0)
              _,w,h,l,_=@raw.unpack('V5')
              return nil if x<0||y<0||z<0||x>=w||y>=h||z>=l
              @raw.byteslice(20+2*(x+y*w+z*w*h),2).unpack1('v')
            end
          end
          class Tone
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(depth=0);@raw;end
          end
          class Color<Tone;end
          def field(o,n);o.instance_variable_get('@'+n);end
          def assign(o,n,value);o.instance_variable_set('@'+n,value);end
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          root='site/knight/gameasync/Data/'
          path=root+pre+'Map046.rxdata'
          m=Marshal.load(File.binread(path))
          raise 'Unexpected floor geometry' unless [field(m,'width'),field(m,'height')]==[336,168]
          events=field(m,'events')
          raise '2F existing event count changed' unless events.size==12
          e=events.fetch(2)
          raise 'Not R35 test watcher' unless field(e,'name')=='SLTI_V229R35_TEST_46'
          raise 'Wrong original to1 anchor' unless [field(e,'x'),field(e,'y')]==[81,94]
          pages=field(e,'pages')
          raise 'Unexpected extra event pages' unless pages.length==1
          page=pages.first
          raise 'Parallel watcher missing' unless field(page,'trigger')==4 && field(page,'through')==true
          commands=field(page,'list')
          raise 'R35 watcher commands changed' unless commands.map{|c|field(c,'code')}==[355,0]
          old=field(commands.first,'parameters').fetch(0)
          raise 'Expected wide R35 portal condition missing' unless old.include?('locations=[[') && old.include?('**2<=9.0')
          sets=Marshal.load(File.binread(root+pre+'Tilesets.rxdata'))
          ts=sets.fetch(field(m,'tileset_id'))
          tile=field(m,'data')[81,94,0]
          raise 'Real return tile is blocked' unless (field(ts,'passages')[tile]&15)==0
          landing=field(m,'data')[76,94,0]
          raise '2F arrival unexpectedly blocked' unless (field(ts,'passages')[landing]&15)==0
          before=events.transform_values{|ev|Marshal.dump(ev)}
          # Test exit: only the TRUE 2F to1 approach tile, no 3-cell radius.
          # Pause for 80 Graphics frames (about two seconds at 40 fps).
          # Any move away resets the hold; all other 2F portal candidates are inert.
          new_script=<<~'RUBY_CODE'
            if $game_map && $game_map.map_id == 46 && $game_player && $game_temp
              if $game_player.x == 81 && $game_player.y == 94 && !$game_temp.player_transferring
                frame = Graphics.frame_count
                started = $game_map.instance_variable_get(:@slti_r37_exit_start)
                if started == nil || frame < started
                  $game_map.instance_variable_set(:@slti_r37_exit_start, frame)
                elsif frame - started >= 80 && !$game_temp.in_battle &&
                      !$game_temp.message_window_showing && !$game_temp.transition_processing
                  $game_temp.player_new_map_id = 45
                  $game_temp.player_new_x = 96
                  $game_temp.player_new_y = 74
                  $game_temp.player_new_direction = 2
                  $game_temp.player_transferring = true
                  $game_map.instance_variable_set(:@slti_r37_exit_start, nil)
                end
              else
                $game_map.instance_variable_set(:@slti_r37_exit_start, nil)
              end
            end
          RUBY_CODE
          assign(commands.first,'parameters',[new_script])
          assign(e,'name','SLTI_V229R37_HOLD_TO1_46')
          events.each do |eid,ev|
            next if eid==2
            raise "Other 2F event changed: #{eid}" unless Marshal.dump(ev)==before.fetch(eid)
          end
          File.binwrite(path,Marshal.dump(m))
          File.write('build/r37-return-script.rb',new_script)
          File.write('build/r37-patch-report.json',JSON.pretty_generate({
            'version'=>'V229R37','map'=>46,'eventId'=>2,
            'oldWatcher'=>'11 portal candidates, 3-tile radius each, automatic 1F transfer',
            'newWatcher'=>'only (81,94), stay for >=80 game frames',
            'landing2F'=>[76,94],'return1F'=>[45,96,74],
            'sourceEvents'=>12,'removedWideAreaWatcher'=>true,
            'preserveMap45'=>true,'baphometAddedInNextStep'=>true
          }))
          puts 'PASS Map046 event 2 replaced; 11 old auto-return regions removed'
          RUBY_PATCH
          ruby -c /tmp/r37_return.rb
          ruby /tmp/r37_return.rb
          ruby -c build/r37-return-script.rb

      - name: V229R37 Clone native Baphomet boss into actual 2F spawn
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r37_baphomet.rb <<'RUBY_BAPHOMET'
          require 'json'
          require 'digest'
          module RPG
            class Map;end;class MapInfo;end;class AudioFile;end;class Tileset;end
            class Event
              class Page
                class Condition;end;class Graphic;end
              end
            end
            class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          class Table
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(depth=0);@raw;end
            def [](x,y=0,z=0)
              _,w,h,d,_=@raw.unpack('V5')
              return nil if x<0||y<0||z<0||x>=w||y>=h||z>=d
              @raw.byteslice(20+2*(x+y*w+z*w*h),2).unpack1('v')
            end
          end
          class Tone
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(depth=0);@raw;end
          end
          class Color<Tone;end
          def get(o,n);o.instance_variable_get('@'+n);end
          def set(o,n,v);o.instance_variable_set('@'+n,v);end

          dir='site/knight/gameasync/'
          base=dir+'Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          srcpath=base+pre+'Map043.rxdata'
          dstpath=base+pre+'Map046.rxdata'
          origsrc=File.binread(srcpath)
          raise 'Wrong original Baphomet source map' unless
            Digest::SHA256.hexdigest(origsrc)=='812fd3cf12f5bac934971b7b29c225c34fc4233cbdfdb01ff2d65efb099e0c89'
          source=Marshal.load(origsrc)
          native=get(source,'events').fetch(46)
          raise 'Source is not Baphomet' unless get(native,'name').dup.force_encoding('UTF-8').scrub.include?('바포메트')
          source_pages=get(native,'pages')
          raise 'Original Baphomet attack/death pages missing' unless source_pages.size==3
          raise 'Wrong Baphomet live graphics' unless
            get(get(source_pages[0],'graphic'),'character_name').dup.force_encoding('UTF-8')=='바포메트'
          raise 'Wrong Baphomet HP logic' unless
            get(source_pages[0],'list').any?{|c|get(c,'code')==355 &&
              get(c,'parameters').first.to_s.include?('1974],3000,2')}
          # Native graphics and sound must already be in the existing game.
          %w[바포메트.png 바포메트맞음.png 바포메트좌표.png 바포메트죽음캐릭터.png].each do |file|
            raise "Missing existing boss asset #{file}" unless File.size?(dir+'Graphics/Characters/'+file)
          end
          target=Marshal.load(File.binread(dstpath))
          raise 'Wrong Sanctuary 2F geometry' unless [get(target,'width'),get(target,'height')]==[336,168]
          events=get(target,'events')
          raise 'Baseline 2F monsters changed' unless events.size==12 && !events.key?(13)
          raise 'Return watcher missing' unless get(events.fetch(2),'name')=='SLTI_V229R37_HOLD_TO1_46'
          sets=Marshal.load(File.binread(base+pre+'Tilesets.rxdata'))
          flags=get(sets.fetch(get(target,'tileset_id')),'passages')
          tiles=get(target,'data')
          w,h=336,168
          walk=->(x,y){x>=0&&y>=0&&x<w&&y<h && (flags[tiles[x,y,0]]&15)==0}
          # World (32706,32846) from Talking Island Dungeon 2F Baphomet room.
          # Original S32 projection: x=2*(-783360+12*(wx+wy)-768)/32
          #                          y=2*(1146+6*(wy-wx)-384)/32
          wx,wy=32706,32846
          fx=2.0*(-783360+12*(wx+wy)-768)/32.0
          fy=2.0*(1146+6*(wy-wx)-384)/32.0
          bx,by=fx.round,fy.round
          raise 'World-to-map boss coordinates drifted' unless [bx,by]==[156,100]
          raise 'Baphomet boss tile blocked' unless walk.call(bx,by)
          raise 'Baphomet overlaps an existing event' if
            events.values.any?{|e|get(e,'x')==bx && get(e,'y')==by}
          # Verify boss room is reachable by walking from real 2F arrival.
          entry=[76,94];queue=[entry];distance={entry=>0};q=0
          while q<queue.size && !distance.key?([bx,by])
            x,y=queue[q];q+=1
            [[x-1,y],[x+1,y],[x,y-1],[x,y+1]].each do |nx,ny|
              p=[nx,ny]
              next if distance.key?(p)||!walk.call(nx,ny)
              distance[p]=distance[[x,y]]+1
              queue<<p
            end
          end
          raise 'Baphomet cannot be reached from 2F entrance' unless distance.key?([bx,by])
          raise 'Unexpected shortest dungeon route' unless distance[[bx,by]]==98

          # REUSE the unmodified original monster pages. Only the event identity,
          # placement and attack-context event ID have to change.
          before=events.transform_values{|e|Marshal.dump(e)}
          boss=Marshal.load(Marshal.dump(native))
          set(boss,'id',13)
          set(boss,'x',bx)
          set(boss,'y',by)
          patched=0
          get(boss,'pages').each do |page|
            get(page,'list').each do |command|
              next unless get(command,'code')==355
              params=get(command,'parameters')
              next unless params.is_a?(Array) && params.first.is_a?(String)
              line=params.first
              old='SLMonsterAttackContext.register(190,$game_map.map_id,46)'
              next unless line.include?(old)
              set(command,'parameters',[line.gsub(old,'SLMonsterAttackContext.register(190,$game_map.map_id,13)')]+params.drop(1))
              patched+=1
            end
          end
          raise 'Original boss attack context absent' unless patched>=8
          raise 'Boss event graphic changed' unless
            get(get(get(boss,'pages')[0],'graphic'),'character_name').dup.force_encoding('UTF-8')=='바포메트'
          events[13]=boss
          raise 'Event loss' unless events.size==13
          before.each{|id,bytes|raise "Existing event changed #{id}" unless Marshal.dump(events.fetch(id))==bytes}
          File.binwrite(dstpath,Marshal.dump(target))
          raise 'Source boss modified' unless Digest::SHA256.file(srcpath).hexdigest==Digest::SHA256.hexdigest(origsrc)
          report={
            version:'V229R37',sourceMap:43,sourceEvent:46,targetMap:46,targetEvent:13,
            sourceWorld:[wx,wy],projected:[fx,fy],spawn:[bx,by],
            sourceBossHealth:3000,originalBattlePages:3,attackContextRewrites:patched,
            originalFloorEvents:12,updatedFloorEvents:13,
            reachableFrom2FArrival:true,shortestWalkingPath:distance[[bx,by]],
            existingSprites:true,spawnIsTestImmediate:true,
            'note'=>'R35 all 1F stairs remain open; R37 2F return only on 80-frame hold at 81,94'
          }
          File.write('build/r37-baphomet-spawn.json',JSON.pretty_generate(report))
          puts "PASS BAPHOMET native event13 at (#{bx},#{by}), #{distance[[bx,by]]} tiles from 2F arrival, #{patched} attack-ID rewrites"
          RUBY_BAPHOMET
          ruby -c /tmp/r37_baphomet.rb
          ruby /tmp/r37_baphomet.rb

      - name: V229R37 Update Map046 hash and visible version only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_INDEX'
          from pathlib import Path
          import hashlib,re
          root=Path('site');g=root/'knight/gameasync'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          rel=f'Data/{pre}Map046.rxdata'
          mapping=g/'mapping.js';s=mapping.read_text(encoding='utf-8')
          digest=hashlib.md5((g/rel).read_bytes()).hexdigest()
          s,n=re.subn(re.escape(rel+'?h=')+r'[0-9a-f]{32}',lambda _:rel+'?h='+digest,s)
          assert n==1,n
          mapping.write_text(s,encoding='utf-8')
          for name in ('index.html','knight/index.html'):
            p=root/name;s=p.read_text(encoding='utf-8')
            assert 'V229R35' in s
            p.write_text(s.replace('V229R35','V229R37').replace('v229r35','v229r37'),encoding='utf-8')
          print('PASS original game loader unchanged; only Map046 asset hash updated')
          PY_INDEX
          node --check site/knight/gameasync/mapping.js

      - name: V229R37 Verify native parallel event and 80-frame exit guard
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r37_test.rb <<'RUBY_TEST'
          require 'zlib'
          require 'ostruct'
          module RPG
            class Map;end;class MapInfo;end;class AudioFile;end;class Tileset;end
            class Event
              def method_missing(n,*args)
                return instance_variable_get('@'+n.to_s) if args.empty? && instance_variable_defined?('@'+n.to_s)
                super
              end
              class Page
                def method_missing(n,*args)
                  return instance_variable_get('@'+n.to_s) if args.empty? && instance_variable_defined?('@'+n.to_s)
                  super
                end
                class Condition
                  def method_missing(n,*args)
                    return instance_variable_get('@'+n.to_s) if args.empty? && instance_variable_defined?('@'+n.to_s)
                    super
                  end
                end
                class Graphic
                  def method_missing(n,*args)
                    return instance_variable_get('@'+n.to_s) if args.empty? && instance_variable_defined?('@'+n.to_s)
                    super
                  end
                end
              end
            end
            class EventCommand;attr_reader :code,:parameters,:indent;end
            class MoveRoute;end;class MoveCommand;end
          end
          class Table
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(d=0);@raw;end
          end
          class Tone
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(d=0);@raw;end
          end
          class Color<Tone;end
          class Graphics
            @@frame_count=0
            def self.frame_count;@@frame_count;end
            def self.frame_count=(v);@@frame_count=v;end
          end
          class Game_Character
            attr_reader :x,:y
            def initialize
              @x=0;@y=0;@character_name='';@through=true;@original_direction=2;@original_pattern=0
            end
            def moveto(x,y);@x=x;@y=y;end
            def update;end
            def jumping?;false;end
          end
          root='site/knight/gameasync/Data/'
          scripts=Marshal.load(File.binread(root+'Scripts.rxdata'))
          [69,70,75,26].each{|i|eval(Zlib::Inflate.inflate(scripts[i][2]),TOPLEVEL_BINDING,"Core_#{i}")}
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          map=Marshal.load(File.binread(root+pre+'Map046.rxdata'))
          event=map.instance_variable_get(:@events).fetch(2)
          raise 'Incorrect parallel event' unless event.instance_variable_get(:@pages).first.instance_variable_get(:@trigger)==4
          $game_switches=Hash.new(false)
          $game_variables=Hash.new(0)
          $game_self_switches={}
          $game_temp=OpenStruct.new(player_transferring:false,in_battle:false,
            message_window_showing:false,transition_processing:false,
            forcing_battler:nil,battle_calling:false,shop_calling:false,
            name_calling:false,menu_calling:false,save_calling:false,gameover:false)
          $game_player=OpenStruct.new(x:76,y:94)
          $game_map=OpenStruct.new(map_id:46)
          runtime=Game_Event.new(46,event)
          run_tick=lambda{|x,y,f|
            $game_player.x=x;$game_player.y=y;Graphics.frame_count=f
            runtime.update
          }
          [ [76,94],[77,94],[78,94],[79,94],[80,94],[87,92],
            [92,93],[98,96],[161,109],[162,64],[177,54],[200,60],[227,59] ].each_with_index do |(x,y),i|
            run_tick.call(x,y,100+i)
            raise "Unexpected 1F transfer from #{x},#{y}" if $game_temp.player_transferring
          end
          # A short pass through the authentic exit tile must NOT return.
          (0..50).each{|i|run_tick.call(81,94,200+i)}
          raise 'Short visit unexpectedly returned to 1F' if $game_temp.player_transferring
          run_tick.call(82,94,251)
          raise 'Moving away unexpectedly returned' if $game_temp.player_transferring
          (0..79).each{|i|run_tick.call(81,94,400+i)}
          raise 'Returned before 80 frames elapsed' if $game_temp.player_transferring
          run_tick.call(81,94,480)
          raise 'Explicit hold did not transfer' unless $game_temp.player_transferring &&
            [$game_temp.player_new_map_id,$game_temp.player_new_x,$game_temp.player_new_y]==[45,96,74]
          puts 'PASS actual Game_Event.update -> Interpreter: wander safely; 2F to1 requires 80-frame hold'
          RUBY_TEST
          ruby -c /tmp/r37_test.rb
          ruby /tmp/r37_test.rb | tee build/r37-event-test.txt
          python3 - <<'PY_INTEGRITY'
          from pathlib import Path
          import hashlib,json
          p=Path('site')
          old=json.loads(Path('build/r35-hashes.json').read_text())
          new={str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest()
               for f in p.rglob('*') if f.is_file()}
          assert len(old)==5472 and old.keys()==new.keys()
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          only={f'knight/gameasync/Data/{prefix}Map046.rxdata',
                'knight/gameasync/mapping.js','index.html','knight/index.html'}
          changed={x for x in old if old[x]!=new[x]}
          assert changed==only,('Unexpected changed files',changed^only)
          assert 'V229R37' in (p/'knight/index.html').read_text(encoding='utf-8')
          assert 'V229R37' in (p/'index.html').read_text(encoding='utf-8')
          print('PASS only 4 files changed. R35 Map045, core scripts, graphics, collision untouched; Map046 has native Baphomet')
          PY_INTEGRITY

      - name: V229R37 Validate boss pages, native graphics, HP, and reachable placement
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r37_verify_boss.rb <<'RUBY_VERIFY_BOSS'
          require 'json'
          module RPG
            class Map;end;class MapInfo;end;class AudioFile;end;class Tileset;end
            class Event;class Page;class Condition;end;class Graphic;end;end;end
            class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          class Table
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(d=0);@raw;end
            def [](x,y=0,z=0)
              _,w,h,d,_=@raw.unpack('V5')
              return nil if x<0||y<0||z<0||x>=w||y>=h||z>=d
              @raw.byteslice(20+2*(x+y*w+z*w*h),2).unpack1('v')
            end
          end
          class Tone
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(depth=0);@raw;end
          end
          class Color<Tone;end
          def g(o,k);o.instance_variable_get('@'+k);end
          root='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          m=Marshal.load(File.binread(root+pre+'Map046.rxdata'))
          original=Marshal.load(File.binread(root+pre+'Map043.rxdata'))
          boss=g(m,'events').fetch(13)
          source=g(original,'events').fetch(46)
          raise 'Baphomet source event not cloned' unless g(boss,'name')==g(source,'name')
          raise 'Wrong boss spawn' unless [g(boss,'x'),g(boss,'y')]==[156,100]
          raise 'Boss event count changed' unless g(m,'events').size==13
          a=g(boss,'pages');b=g(source,'pages')
          raise 'Original boss pages lost' unless a.size==b.size && a.size==3
          a.zip(b).each do |current,src|
            raise 'Boss trigger changed' unless g(current,'trigger')==g(src,'trigger')
            raise 'Boss graphic changed' unless Marshal.dump(g(current,'graphic'))==Marshal.dump(g(src,'graphic'))
            raise 'Boss condition changed' unless Marshal.dump(g(current,'condition'))==Marshal.dump(g(src,'condition'))
            one=g(current,'list');two=g(src,'list')
            raise 'Original battle sequence modified' unless one.map{|c|g(c,'code')}==two.map{|c|g(c,'code')}
          end
          attack=g(a.first,'list').select{|c|g(c,'code')==355 && g(c,'parameters').first.to_s.include?('SLMonsterAttackContext.register')}
          raise 'Native Baphomet attacks disconnected' unless attack.size>=8 &&
            attack.all?{|c|g(c,'parameters').first.include?('register(190,$game_map.map_id,13)')}
          raise 'Native Baphomet HP gauge missing' unless
            g(a.first,'list').any?{|c|g(c,'code')==355 && g(c,'parameters').first.to_s.include?('1974],3000,2')}
          # Probe the actual rendering page: first-page sprite available when game
          # switches and self-switches are initially off and damage counter is 0.
          cond=g(a[0],'condition')
          raise 'Boss blocked by startup page condition' if g(cond,'switch1_valid') || g(cond,'switch2_valid') || g(cond,'variable_valid') || g(cond,'self_switch_valid')
          raise 'Baphomet is not a blocking monster' if g(a.first,'through')
          puts 'PASS original Baphomet sprite, combat commands, 3000-HP gauge, death and attack pages preserved'
          RUBY_VERIFY_BOSS
          ruby -c /tmp/r37_verify_boss.rb
          ruby /tmp/r37_verify_boss.rb | tee build/r37-baphomet-test.txt
          cat > /tmp/r37_native_baphomet_spawn.rb <<'RUBY_BOSS_RUNTIME'
          require 'zlib'
          require 'ostruct'
          module RPG
           class Map;end;class MapInfo;end;class AudioFile;end;class Tileset;end
           class Event
            def method_missing(n,*args)
             return instance_variable_get('@'+n.to_s) if args.empty? && instance_variable_defined?('@'+n.to_s)
             super
            end
            class Page
             def method_missing(n,*args)
              return instance_variable_get('@'+n.to_s) if args.empty? && instance_variable_defined?('@'+n.to_s)
              super
             end
             class Condition
              def method_missing(n,*args)
               return instance_variable_get('@'+n.to_s) if args.empty? && instance_variable_defined?('@'+n.to_s)
               super
              end
             end
             class Graphic
              def method_missing(n,*args)
               return instance_variable_get('@'+n.to_s) if args.empty? && instance_variable_defined?('@'+n.to_s)
               super
              end
             end
            end
           end
           class EventCommand; attr_reader :code,:parameters,:indent;end
           class MoveRoute;end;class MoveCommand;end
          end
          class Table
           def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
           def _dump(d=0);@raw;end
          end
          class Tone
           def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
           def _dump(d=0);@raw;end
          end
          class Color<Tone;end
          class Game_Character
           attr_reader :x,:y
           def initialize
            @x=0;@y=0;@character_name='';@through=true;@original_direction=2;@original_pattern=0
           end
           def moveto(x,y);@x=x;@y=y;end
           def update;end
           def jumping?;false;end
          end
          root='site/knight/gameasync/Data/'
          pr='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          scripts=Marshal.load(File.binread(root+'Scripts.rxdata'))
          [69,70,75,26].each{|i|eval(Zlib::Inflate.inflate(scripts[i][2]),TOPLEVEL_BINDING,"OriginalScript#{i}")}
          $game_switches=Hash.new(false)
          $game_variables=Hash.new(0)
          $game_self_switches={}
          $game_player=OpenStruct.new(x:76,y:94)
          $game_map=OpenStruct.new(map_id:46)
          $game_temp=OpenStruct.new(player_transferring:false,in_battle:false,message_window_showing:false,transition_processing:false,forcing_battler:nil,battle_calling:false,shop_calling:false,name_calling:false,menu_calling:false,save_calling:false,gameover:false)
          map=Marshal.load(File.binread(root+pr+'Map046.rxdata'))
          boss=map.instance_variable_get(:@events).fetch(13)
          runtime=Game_Event.new(46,boss)
          puts "BAPHOMET INIT pos #{runtime.instance_variable_get(:@x)},#{runtime.instance_variable_get(:@y)} char #{runtime.instance_variable_get(:@character_name).inspect} trigger #{runtime.trigger} through #{runtime.instance_variable_get(:@through)}"
          raise 'wrong graphic' unless runtime.instance_variable_get(:@character_name).dup.force_encoding('UTF-8')=='바포메트'
          raise 'wrong trigger' unless runtime.trigger==2
          raise 'wrong event collision' if runtime.instance_variable_get(:@through)
          RUBY_BOSS_RUNTIME
          ruby /tmp/r37_native_baphomet_spawn.rb | tee build/r37-boss-native-spawn.txt

      - name: V229R37 Upload safe floor exploration audit
        uses: actions/upload-artifact@v4
        with:
          name: SLKnight-V229R37-2F-Exploration-and-Baphomet-Audit
          path: |
            build/r37-patch-report.json
            build/r37-event-test.txt
            build/r37-return-script.rb
            build/r37-baphomet-spawn.json
            build/r37-baphomet-test.txt
            build/r37-boss-native-spawn.txt
          if-no-files-found: error
          retention-days: 30

      - name: V229R37 Publish existing GitHub Pages game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
