          from pathlib import Path
          p=Path('player/js/drive.js');s=p.read_text()
          old='if (bitmap && bitmapSizeMapping[mappingKey]) {'
          new='if (bitmap && bitmapSizeMapping[mappingKey] && mappingKey.indexOf("graphics/tilesets/") !== 0) {'
