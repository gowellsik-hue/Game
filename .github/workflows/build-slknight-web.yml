
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R17 / NPC-to-Sanctuary original TI dungeon entry and return
name: build-slknight-web.yml | V229R17 | Sanctuary TI Dungeon Entry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: V229R17 Restore last successful V229R16 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39136791761
          name: github-pages
          github-token: ${{ github.token }}
          path: previous

      - name: V229R17 Restore original Sanctuary 1F-2F terrain
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39100619927
          name: Sanctuary-TI-Dungeon-V4.1-Original-Terrain-Walk
          github-token: ${{ github.token }}
          path: original-ti

      - name: V229R17 Verify both successful baselines
        shell: bash
        run: |
          set -euo pipefail
          test -s previous/artifact.tar
          test -s original-ti/preview/terrain-walk-v4.1.html
          mkdir -p site
          tar -xf previous/artifact.tar -C site
          python3 - <<'PY_BASE_R17'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(hashes)==5354,('Invalid original file count',len(hashes))
          reference={
            'index.html':'a6a2c3f52bfe87e1e5821a383effae83074fdb54725f80e23454d17aa6f8f220',
            'knight/index.html':'94dbbad46625685fe5e9f3aaa660b53c3221b1a7ebaa016a4241b96cea490f27',
            'knight/gameasync/mapping.js':'53ef0647a4c39ea15cb603adbb71fe4bc726b0cb4b5ec864c7473c4bd628d5c1',
            'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap029.rxdata':'2b99c87f691fece863c850f2217e538e3f6f76787b290507c8212b621beaf305',
            'knight/gameasync/Data/Scripts.rxdata':'ac9aa3508341546e8467454a87b728b232fea910734357e3df4711e9cc82a61c',
          }
          for path,sha in reference.items():assert hashes.get(path)==sha,(path,hashes.get(path))
          Path('/tmp/sl-r17-before.json').write_text(json.dumps(hashes))
          print('V229R16 original game verified:',len(hashes),'assets')
          PY_BASE_R17

      - name: V229R17 Replace teleporter placeholder with real entry signal
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/sl-ti-r17.rb <<'RUBY_R17'
          require 'digest'
          module RPG
            class AudioFile;end
            class Map;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end
          class Table
            def self._load(blob)
              obj=allocate
              obj.instance_variable_set(:@serialized_data,blob)
              obj
            end
            def _dump(level=0); @serialized_data;end
          end
          class Tone < Table;end
          class Color < Table;end
          path=ARGV.fetch(0)
          original=File.binread(path)
          map=Marshal.load(original)
          raise 'Original data roundtrip failed' unless Marshal.dump(map)==original
          events=map.instance_variable_get(:@events)
          event=events.fetch(11)
          raise 'Wrong teleporter event' unless event.instance_variable_get(:@x)==70 && event.instance_variable_get(:@y)==48
          pages=event.instance_variable_get(:@pages)
          raise 'NPC changed pages' unless pages.length==1
          list=pages[0].instance_variable_get(:@list)
          source= '말섬던전은 별도 맵 연결 후 이용할 수 있습니다.'
          found=list.each_index.select do |i|
            c=list[i]
            c.instance_variable_get(:@code)==101 && c.instance_variable_get(:@parameters)==[source]
          end
          raise "Expected one obsolete placeholder, found #{found.size}" unless found.length==1
          idx=found.first
          raise 'Wrong branch preceding placeholder' unless list[idx-1].instance_variable_get(:@code)==402 && list[idx-1].instance_variable_get(:@parameters)==[1,'말섬던전']
          prior_list=Marshal.dump(event)
          command=list[idx]
          command.instance_variable_set(:@code,355)
          command.instance_variable_set(:@parameters,["puts 'SLTI|ENTER|V229R17'"])
          # Save only event 11. Compare the complete original map after restoring event 11.
          data=Marshal.dump(map)
          check=Marshal.load(data)
          check.instance_variable_get(:@events)[11]=Marshal.load(prior_list)
          raise 'Unrelated map content changed' unless Marshal.dump(check)==original
          File.binwrite(path,data)
          check2=Marshal.load(File.binread(path))
          list2=check2.instance_variable_get(:@events)[11].instance_variable_get(:@pages)[0].instance_variable_get(:@list)
          raise 'Entry script absent' unless list2.count{|c|c.instance_variable_get(:@code)==355 && c.instance_variable_get(:@parameters)==["puts 'SLTI|ENTER|V229R17'"]}==1
          raise 'Old placeholder still active' if list2.any?{|c|c.instance_variable_get(:@parameters)==[source]}
          raise 'Transfer commands were altered' unless list2.select{|c|c.instance_variable_get(:@code)==201}.map{|c|c.instance_variable_get(:@parameters)}==list.select{|c|c.instance_variable_get(:@code)==201}.map{|c|c.instance_variable_get(:@parameters)}
          puts "V229R17 NPC patched: old placeholder replaced by executable map-entry signal, SHA=#{Digest::SHA256.hexdigest(data)}"
          RUBY_R17
          ruby -c /tmp/sl-ti-r17.rb
          ruby /tmp/sl-ti-r17.rb site/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap029.rxdata

      - name: V229R17 Install original Sanctuary dungeon and floor navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 - site original-ti <<'PY_VIEW_R17'
          import sys, zipfile, json, re, shutil
          from pathlib import Path
          root=Path(sys.argv[1]); source_dir=Path(sys.argv[2]); target=root/'knight'/'sanctuary';target.mkdir(parents=True,exist_ok=True)
          files=list((source_dir/'preview'/'tiles').glob('*/*.png'))
          assert len(files)==28, ('Terrain tile count changed',len(files))
          for source_file in files:
              destination=target/source_file.relative_to(source_dir/'preview')
              destination.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(source_file,destination)
          html=(source_dir/'preview'/'terrain-walk-v4.1.html').read_text(encoding='utf-8')
          assert '<title>TI Dungeon V4.1 Original Terrain Movement</title>' in html

          def once(a,b):
              global html
              assert html.count(a)==1, ('Need exactly one source snippet',a[:110],html.count(a))
              html=html.replace(a,b,1)

          once('<title>TI Dungeon V4.1 Original Terrain Movement</title>','<title>SLKnight V229R17 · 말섬던전 (Sanctuary 1F·2F)</title>')
          once('<b>TI Dungeon V4.1</b>','<b>말섬던전 · <span id="floor-label">1층</span></b>')
          once('<a href="index.html" style="color:#cce7ff">Map</a>', '<button type="button" id="leave-dungeon">은기사마을 복귀</button>')
          once('#pad button{height:40px;font-size:22px;touch-action:none;padding:0}', '#pad button{height:56px;font-size:26px;touch-action:none;padding:0}\n#floor,#jump{display:none}\n#player{width:60px;height:60px;background:transparent;border:none;border-radius:0;box-shadow:none;z-index:9;transform:translate(-50%,-80%)}\n#player canvas{width:60px;height:60px;image-rendering:pixelated}\nheader b{flex:1}\n#leave-dungeon{background:#315941;border-color:#78ac8a}')
          once('Original terrain. Collision bit 0 is provisional. Yellow = portal candidate; no automatic warp.', 'Sanctuary 원본 지형. 통행 판정 및 1↔2층 도착 위치는 검증 중입니다. 몬스터 전투는 아직 연결되지 않았습니다.')
          # Preserve the exact original terrain/coordinate JSON.
          source=json.loads(re.search(r'<script id="data" type="application/json">(.*?)</script>',html,re.S).group(1))
          assert set(source)=={'1','2'} and sum(len(m['tiles']) for m in source.values())==28
          assert sum(len(m['collisionBase64']) for m in source.values())>100000
          # Floor links use source target map IDs; arrival points remain candidates.
          once('function walk(dx,dy){\n  const nx=x+dx,ny=y+dy,ix=nx-map.originX,iy=ny-map.originY;', '''function walk(dx,dy){
            const nx=x+dx,ny=y+dy,ix=nx-map.originX,iy=ny-map.originY;
            const gate=map.portals.find(p=>p.x===nx&&p.y===ny);
            if(gate && map.mapId===1 && gate.name==='to2' && gate.targetMapId===2){changeFloor('2','to1');return;}
            if(gate && map.mapId===2 && gate.name==='to1' && gate.targetMapId===1){changeFloor('1','to2');return;}
            if(gate && map.mapId===1 && gate.name==='go_00' && gate.targetMapId===0){leaveDungeon();return;}''')
          once('function open(){\n  stop();', '''function changeFloor(id,landingName){
            floor.value=id;
            open();
            const landing=map.portals.find(p=>p.name===landingName&&p.nearestWalkable);
            if(landing){x=landing.nearestWalkable.x;y=landing.nearestWalkable.y;camera();}
          }
          function leaveDungeon(){closed=true;stop();window.parent.postMessage({type:'SLTI|EXIT|V229R17'},window.location.origin);}
          function open(){
            stop();''')
          once('  camera();\n}\n\nfloor.onchange=open;', '''  document.getElementById('floor-label').textContent=map.mapId+'층';
            camera();
          }

          document.getElementById('leave-dungeon').onclick=leaveDungeon;
          floor.onchange=open;''')
          once('let map,mask,x,y,scale=1,player,repeat=null;', 'let map,mask,x,y,scale=1,player,repeat=null,closed=false;')
          once('    e.preventDefault();stop();walk(dx,dy);\n    repeat=setInterval(()=>walk(dx,dy),130);', '    e.preventDefault();stop();const oldFloor=map.mapId;walk(dx,dy);\n    if(!closed && map.mapId===oldFloor)repeat=setInterval(()=>walk(dx,dy),130);')
          # Display one original knight character frame in the dungeon.
          once("  player.id='player';player.className='pin';\n  world.append(player);", """  player.id='player';player.className='pin';
            const spriteCanvas=document.createElement('canvas');spriteCanvas.width=90;spriteCanvas.height=80;
            player.append(spriteCanvas);
            const actor=new Image();actor.src='../gameasync/Graphics/Characters/knight_men.png';
            actor.onload=()=>{
              const ctx=spriteCanvas.getContext('2d',{willReadFrequently:true});
              ctx.drawImage(actor,0,0,90,80,0,0,90,80);
              const pixels=ctx.getImageData(0,0,90,80);
              for(let i=0;i<pixels.data.length;i+=4){
                if(pixels.data[i]<38 && pixels.data[i+1]>172 && pixels.data[i+2]<38) pixels.data[i+3]=0;
              }
              ctx.putImageData(pixels,0,0);
            };
            world.append(player);""")
          # Retain the original V4.1 walkable test spawn.
          result=json.loads(re.search(r'<script id="data" type="application/json">(.*?)</script>',html,re.S).group(1))
          assert result==source
          assert 'function changeFloor' in html and "SLTI|EXIT|V229R17" in html
          (target/'index.html').write_text(html,encoding='utf-8')
          print('V229R17 Sanctuary terrain staged',len(files),'original S32 PNGs, two floors')

          PY_VIEW_R17

      - name: V229R17 Connect NPC output to dungeon, return and version
        shell: bash
        run: |
          set -euo pipefail
          python3 - site <<'PY_INDEX_R17'
          from pathlib import Path
          import hashlib,re,sys
          root=Path(sys.argv[1]); knight=root/'knight'
          rel='Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap029.rxdata'
          path=knight/'gameasync/mapping.js'; mapping=path.read_text(encoding='utf-8')
          md5=hashlib.md5((knight/'gameasync'/rel).read_bytes()).hexdigest()
          mapping,n=re.subn(re.escape(rel+'?h=')+r'[0-9a-f]{32}',lambda m:rel+'?h='+md5,mapping)
          assert n==1
          path.write_text(mapping,encoding='utf-8')
          index=knight/'index.html'; page=index.read_text(encoding='utf-8')
          def replace_once(a,b):
              global page
              assert page.count(a)==1,('Source changed',a,page.count(a))
              page=page.replace(a,b,1)
          replace_once('  function marker(t){\n', "  function marker(t){\n    if(t.includes('SLTI|ENTER|V229R17')){window.slOpenSanctuary && window.slOpenSanctuary();return;}\n")
          bridge="""
          <script id="slti-v229r17-bridge">
          (function(){
            'use strict';
            let layer=null, iframe=null;
            window.slOpenSanctuary=function(){
              if(layer)return;
              layer=document.createElement('div');layer.id='slti-layer';
              layer.style.cssText='position:fixed;inset:0;background:#101823;z-index:2147483000;';
              iframe=document.createElement('iframe');iframe.id='slti-frame';
              iframe.setAttribute('title','Sanctuary 말섬 던전');
              iframe.style.cssText='display:block;width:100%;height:100%;border:0;';
              iframe.src='sanctuary/index.html?v=v229r17';
              layer.appendChild(iframe);document.body.appendChild(layer);
              console.info('SLTI|OPEN|V229R17');
            };
            window.addEventListener('message',function(evt){
              if(!iframe||evt.source!==iframe.contentWindow||evt.origin!==window.location.origin)return;
              if(!evt.data||evt.data.type!=='SLTI|EXIT|V229R17')return;
              layer.remove();layer=null;iframe=null;
              const canvas=document.getElementById('canvas');if(canvas)canvas.focus();
              console.info('SLTI|RETURN|V229R17');
            });
          })();
          </script>
          """
          replace_once('</body>',bridge+'\n</body>')
          replace_once('<title>SLKnight V229R16</title>','<title>SLKnight V229R17</title>')
          replace_once("var wTitle = 'SLKnight V229R16'","var wTitle = 'SLKnight V229R17'")
          replace_once('>V229R16</div>','>V229R17</div>')
          replace_once('gameasync/mapping.js?v=v229r16','gameasync/mapping.js?v=v229r17')
          replace_once('js/dpad.js?v=v229r16','js/dpad.js?v=v229r17')
          index.write_text(page,encoding='utf-8')
          home=root/'index.html'; s=home.read_text(encoding='utf-8')
          assert s.count('V229R16')==2
          home.write_text(s.replace('V229R16','V229R17'),encoding='utf-8')
          print('V229R17 game entry bridge connected')
          PY_INDEX_R17

      - name: V229R17 Verify intentional changes and original dungeon data
        shell: bash
        run: |
          set -euo pipefail
          node --check site/knight/js/dpad.js
          python3 - <<'PY_VERIFY_R17'
          from pathlib import Path
          import base64,hashlib,json,re,subprocess
          root=Path('site')
          original=json.loads(Path('/tmp/sl-r17-before.json').read_text())
          actual={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          changed={name for name,sha in original.items() if actual.get(name)!=sha}
          expectedChanged={'index.html','knight/index.html','knight/gameasync/mapping.js','knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap029.rxdata'}
          assert changed==expectedChanged,(changed,expectedChanged)
          assert len(original)==5354 and len(actual)==5383,('File count',len(actual))
          new=set(actual)-set(original)
          assert len(new)==29 and 'knight/sanctuary/index.html' in new
          pngs=list((root/'knight/sanctuary/tiles').glob('*/*.png'))
          assert len(pngs)==28
          for img in pngs:
              assert img.read_bytes()==(Path('original-ti/preview/tiles')/img.parent.name/img.name).read_bytes()
          html=(root/'knight/sanctuary/index.html').read_text(encoding='utf-8')
          match=re.search(r'<script id="data" type="application/json">(.*?)</script>',html,re.S)
          assert match
          data=json.loads(match.group(1));assert set(data)=={'1','2'}
          for floor in ('1','2'):
              m=data[floor]
              assert len(base64.b64decode(m['collisionBase64']))==m['width']*m['height']
          assert len(data['1']['tiles'])==12 and len(data['2']['tiles'])==16
          page=(root/'knight/index.html').read_text(encoding='utf-8')
          assert 'SLTI|ENTER|V229R17' in page and 'SLTI|EXIT|V229R17' in page
          assert 'SLKnight V229R17' in page and 'gameasync/mapping.js?v=v229r17' in page
          assert "var namespace = 'slknight_v14_engine'" in page
          assert 'V229R17' in (root/'index.html').read_text(encoding='utf-8')
          for filename in ('knight/index.html','knight/sanctuary/index.html'):
              source=(root/filename).read_text(encoding='utf-8')
              for i,block in enumerate(re.finditer(r'<script([^>]*)>(.*?)</script>',source,re.S)):
                  attrs,js=block.groups()
                  if 'application/json' in attrs or not js.strip():continue
                  check=Path('/tmp/r17-check-'+filename.replace('/','-')+'-'+str(i)+'.js')
                  check.write_text(js)
                  subprocess.run(['node','--check',str(check)],check=True)
          print('V229R17 OK: NPC entry, original terrain, portal test and return are packaged')
          PY_VERIFY_R17

      - name: V229R17 Upload complete game build
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
