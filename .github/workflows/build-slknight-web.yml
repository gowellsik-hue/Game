name: Deploy SLKnight V14.3z1 VERIFIED MONSTER ATTACK 14

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions: {contents: read, pages: write, id-token: write}

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  BASELINE_SHA: c6815cd461dba60ec131898e6d5dd8690dd915ae
  X2_SHA: 6d941bd643dda87b8267ba466e108d1904c22331
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout frozen V14.3l baseline
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.BASELINE_SHA }}
          path: baseline

      - name: Checkout frozen V14.3x2 success
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.X2_SHA }}
          path: x2

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake cmake curl ffmpeg freepats git imagemagick libtool make mm-common patch pkg-config python3 rake ruby timidity unzip wget xz-utils fonts-nanum

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.MKXP_SRC_REF }}
          path: engine

      - name: Cache engine dependencies
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-${{ runner.os }}-${{ env.EMSDK_VER }}-onig25b

      - name: Extract frozen run scripts
        run: |
          ruby -ryaml - <<'RB'
          base=YAML.load_file('baseline/.github/workflows/build-slknight-web.yml')
          x2=YAML.load_file('x2/.github/workflows/build-slknight-web.yml')
          base_steps=base.fetch('jobs').fetch('build').fetch('steps')
          x2_steps=x2.fetch('jobs').fetch('build').fetch('steps')

          base_wanted={
            'Patch engine'=>'/tmp/base_patch_engine.sh',
            'Build engine'=>'/tmp/base_build_engine.sh',
            'Install game'=>'/tmp/base_install_game.sh',
            'Patch game'=>'/tmp/base_patch_game.sh',
            'Convert media'=>'/tmp/base_convert_media.sh',
            'Build mappings'=>'/tmp/base_build_mappings.sh',
            'Patch browser'=>'/tmp/base_patch_browser.sh',
            'Verify package'=>'/tmp/base_verify.sh'
          }

          x2_wanted={
            'Backup pristine potion event'=>'/tmp/x2_backup_potion.sh',
            'Restore ordinary potion logic'=>'/tmp/x2_restore_potion.sh',
            'Fix green and bravery stacking'=>'/tmp/x2_stack_potion.sh',
            'Patch native Lineage hold attack'=>'/tmp/x2_native_auto.sh',
            'Preload monster attack assets'=>'/tmp/x2_preload_monster.sh'
          }

          base_wanted.each do |name,path|
            step=base_steps.find{|x|x['name']==name}
            abort "BASELINE STEP MISSING: #{name}" unless step&&step['run']
            File.write(path,step['run'])
          end

          x2_wanted.each do |name,path|
            step=x2_steps.find{|x|x['name']==name}
            abort "X2 STEP MISSING: #{name}" unless step&&step['run']
            File.write(path,step['run'])
          end

          puts 'FROZEN_SCRIPTS_OK'
          RB

      - name: Patch engine
        run: bash /tmp/base_patch_engine.sh

      - name: Build engine
        run: bash /tmp/base_build_engine.sh

      - name: Install game
        run: bash /tmp/base_install_game.sh

      - name: Backup pristine potion event
        run: bash /tmp/x2_backup_potion.sh

      - name: Patch game from V14.3l
        run: bash /tmp/base_patch_game.sh

      - name: Restore ordinary potion logic
        run: bash /tmp/x2_restore_potion.sh

      - name: Fix green and bravery stacking
        run: bash /tmp/x2_stack_potion.sh

      - name: Patch verified monster attacks only
        run: |
          cat > /tmp/monster_verified_patch.rb <<'RB'
          # encoding: UTF-8
          require 'zlib'
          game=ARGV.fetch(0)

          class RawMarshalObject
            def self._load(data)
              o=allocate
              o.instance_variable_set(:@raw,data)
              o
            end
            def _dump(_depth); @raw; end
          end

          class Tone < RawMarshalObject; end
          class Color < RawMarshalObject; end
          class Rect < RawMarshalObject; end
          class Table < RawMarshalObject; end

          module RPG
            class AudioFile; end
            class Animation
              class Frame; end
              class Timing; end
            end
            class Map; end
            class CommonEvent; end
            class Event
              class Page
                class Condition; end
                class Graphic; end
              end
            end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
          end

          def iv(o,n); o.instance_variable_get("@#{n}"); end
          def setiv(o,n,v); o.instance_variable_set("@#{n}",v); end

          def sl_norm_name(s)
            s.to_s.dup.force_encoding(Encoding::UTF_8)
             .gsub(/\[공격\]/,'')
             .gsub(/[\s\-·ㆍ]/,'')
             .gsub(/[()]/,'')
          end

          # ------------------------------------------------------------------
          # VERIFIED ONLY
          # User-confirmed successful motion sets:
          # 데스나이트 / 바포메트 / 서큐버스 / 스파토이 / 아투바오크 / 에틴
          # 오우거 / 오크전사 / 해골 / 오크 / 간디오크 / 흑기사 / 무리안 / 터틀드래곤
          #
          # EXCLUDED: 버그베어, 킹버그베어 and every still-unverified monster.
          # Direction numbers: 2=down, 4=left, 6=right, 8=up.
          # Each direction entry = [sheet, pattern_array, mirror]
          # ------------------------------------------------------------------
          verified={
            850=>{
              label:'오크전사',coord:'오크전사',dirs:{
                8=>['오크전사모션',[0,1,2,3],false],
                6=>['오크전사모션',[5,6,7,8],false],
                2=>['오크전사모션',[10,11,12,13],false],
                4=>['오크전사모션',[15,16,17,18],false]
              }
            },
            853=>{
              label:'흑기사',coord:'흑기사',dirs:{
                8=>['흑기사모션',[0,1,2,3,4],false],
                6=>['흑기사모션',[5,6,7,8,9],false],
                2=>['흑기사모션',[10,11,12,13,14],false],
                # Verified left attack = right attack mirrored.
                4=>['흑기사모션',[5,6,7,8,9],true]
              }
            },
            854=>{
              label:'터틀드래곤',coord:'터틀드래곤',dirs:{
                8=>['터틀드래곤모션',[14,15,16,17,18,19,20],false],
                6=>['터틀드래곤모션2',[0,1,2,3,4,5,6,7],false],
                2=>['터틀드래곤모션',[0,1,2,3,4,5,6],false],
                4=>['터틀드래곤모션',[7,8,9,10,11,12,13],false]
              }
            },
            856=>{
              label:'간디오크',coord:'간디오크',dirs:{
                8=>['간디오크모션',[0,1,2,3],false],
                6=>['간디오크모션',[4,5,6,7],false],
                2=>['간디오크모션',[8,9,10,11],false],
                4=>['간디오크모션',[12,13,14,15],false]
              }
            },
            # No separate 두다마라/로바 attack sheet exists; both use the
            # user-verified generic 오크.png / 오크모션 set.
            857=>{
              label:'두다마라오크',coord:'오크',dirs:{
                8=>['오크모션',[0,1,2,3,4],false],
                6=>['오크모션',[5,6,7,8,9],false],
                2=>['오크모션',[10,11,12,13,14],false],
                4=>['오크모션',[15,16,17,18,19],false]
              }
            },
            859=>{
              label:'아투바오크',coord:'아투바오크',dirs:{
                8=>['아투바오크모션',[0,1,2,3,4],false],
                6=>['아투바오크모션',[5,6,7,8,9],false],
                2=>['아투바오크모션',[10,11,12,13,14],false],
                4=>['아투바오크모션',[15,16,17,18,19],false]
              }
            },
            860=>{
              label:'로바오크',coord:'오크',dirs:{
                8=>['오크모션',[0,1,2,3,4],false],
                6=>['오크모션',[5,6,7,8,9],false],
                2=>['오크모션',[10,11,12,13,14],false],
                4=>['오크모션',[15,16,17,18,19],false]
              }
            },
            862=>{
              label:'오우거',coord:'오우거',dirs:{
                8=>['오우거모션',[0,1,2,3,4,5],false],
                6=>['오우거모션',[6,7,8,9,10,11],false],
                2=>['오우거모션',[12,13,14,15,16,17],false],
                4=>['오우거모션',[18,19,20,21,22,23],false]
              }
            },
            876=>{
              label:'스파토이',coord:'스파토이',dirs:{
                8=>['스파토이-모션',[0,1,2,3],false],
                6=>['스파토이-모션',[5,6,7,8],false],
                2=>['스파토이-모션',[10,11,12,13],false],
                4=>['스파토이-모션',[15,16,17,18],false]
              }
            },
            880=>{
              label:'무리안',coord:'무리안',dirs:{
                8=>['무리안모션',[0,1,2,3],false],
                6=>['무리안모션',[4,5,6,7],false],
                2=>['무리안모션',[8,9,10,11],false],
                4=>['무리안모션',[12,13,14,15],false]
              }
            },
            881=>{
              label:'서큐버스',coord:'서큐버스',dirs:{
                8=>['서큐버스 모션',[0,1,2,3,4],false],
                6=>['서큐버스 모션',[5,6,7,8,9],false],
                2=>['서큐버스 모션',[10,11,12,13,14],false],
                4=>['서큐버스 모션',[15,16,17,18,19],false]
              }
            },
            882=>{
              label:'에틴',coord:'에틴',dirs:{
                8=>['에틴모션',[0,1,2,3,4,5],false],
                6=>['에틴모션',[6,7,8,9,10,11],false],
                2=>['에틴모션',[12,13,14,15,16,17],false],
                4=>['에틴모션',[18,19,20,21,22,23],false]
              }
            },
            893=>{
              label:'해골',coord:'해골',dirs:{
                8=>['해골모션',[0,1,2,3],false],
                6=>['해골모션',[5,6,7,8],false],
                2=>['해골모션',[10,11,12,13],false],
                4=>['해골모션',[15,16,17,18],false]
              }
            },
            901=>{
              label:'데스나이트',coord:'데스나이트',dirs:{
                8=>['데스나이트-모션',[0,1,2,3,4,5],false],
                6=>['데스나이트-모션',[6,7,8,9,10,11],false],
                2=>['데스나이트-모션',[12,13,14,15,16,17],false],
                4=>['데스나이트-모션',[18,19,20,21,22,23],false]
              }
            },
            953=>{
              label:'바포메트',coord:'바포메트',dirs:{
                8=>['바포메트모션',[0,1,2,3,4],false],
                6=>['바포메트모션',[5,6,7,8,9],false],
                2=>['바포메트모션',[10,11,12,13,14],false],
                4=>['바포메트모션',[15,16,17,18,19],false]
              }
            }
          }

          ce_path=Dir.glob(File.join(game,'Data','*CommonEvents.rxdata')).max_by{|p|File.size(p)}
          anim_path=Dir.glob(File.join(game,'Data','*Animations.rxdata')).max_by{|p|File.size(p)}
          scripts_path=File.join(game,'Data','Scripts.rxdata')
          abort 'CommonEvents missing' unless ce_path&&File.size(ce_path)>1000
          abort 'Animations missing' unless anim_path&&File.size(anim_path)>1000
          abort 'Scripts missing' unless File.size?(scripts_path)

          common_events=Marshal.load(File.binread(ce_path))
          animations=Marshal.load(File.binread(anim_path))
          scripts=Marshal.load(File.binread(scripts_path))

          verified.each do |attack_id,meta|
            ce=common_events[attack_id]
            abort "verified attack CE missing #{attack_id}" unless ce
            actual=iv(ce,:name).to_s.dup.force_encoding(Encoding::UTF_8)
            abort "verified CE name mismatch #{attack_id}=#{actual}" unless actual.start_with?('[공격]')
          end

          anim_dir=File.join(game,'Graphics','Animations')
          verified.values.each do |meta|
            meta[:dirs].each_value do |spec|
              sheet=spec[0]
              path=File.join(anim_dir,sheet+'.png')
              abort "verified attack sheet missing #{sheet}" unless File.size?(path)
            end
          end

          char_dir=File.join(game,'Graphics','Characters')
          coord_assets={}
          normal_assets={}

          Dir.glob(File.join(char_dir,'*좌표.png')).sort.each do |p|
            name=File.basename(p,'.png').dup.force_encoding(Encoding::UTF_8)
            key=sl_norm_name(name.sub(/[\s\-]*좌표\z/,''))
            coord_assets[key]||=name unless key.empty?
          end

          Dir.glob(File.join(char_dir,'*.png')).sort.each do |p|
            name=File.basename(p,'.png').dup.force_encoding(Encoding::UTF_8)
            next if name.end_with?('좌표')
            key=sl_norm_name(name)
            normal_assets[key]||=[name,p] unless key.empty?
          end

          # All verified coordinate files already exist in the frozen build.
          # Resolve them before mutation so a missing one fails loudly.
          verified.values.each do |meta|
            key=sl_norm_name(meta[:coord])
            unless coord_assets[key]
              normal=normal_assets[key]
              abort "verified coord/normal missing #{meta[:coord]}" unless normal
              coord_name=normal[0]+'좌표'
              dims=`identify -format '%wx%h' "#{normal[1]}"`.strip
              abort "coordinate size failed #{normal[0]}" unless dims.match?(/\A\d+x\d+\z/)
              ok=system('convert','-size',dims,'xc:none',File.join(char_dir,coord_name+'.png'))
              abort "coordinate generation failed #{normal[0]}" unless ok
              coord_assets[key]=coord_name
            end
          end

          runtime=<<'RUBY'
          module SLMonsterAttackContext
            @pending={}

            def self.register(switch_id,map_id,event_id)
              @pending={} unless @pending.is_a?(Hash)
              sid=switch_id.to_i
              @pending[sid]||=[]
              data=[map_id.to_i,event_id.to_i]
              @pending[sid]<<data unless @pending[sid].include?(data)
            end

            def self.start(switch_id,ids,coord_name,frames)
              @pending={} unless @pending.is_a?(Hash)
              sid=switch_id.to_i
              queue=@pending[sid]
              return if queue==nil||queue.empty?

              data=queue.shift
              @pending.delete(sid) if queue.empty?
              return unless data[0]==$game_map.map_id

              event=$game_map.events[data[1]]
              return if event==nil
              return if event.instance_variable_get(:@erased)

              aid=ids[event.direction]
              return if aid==nil

              event.sl_attack_begin(coord_name,frames)
              event.animation_id=aid
            end
          end

          class Game_Character
            alias sl_attack_lock_original_update update

            def update
              return if @sl_attack_active
              sl_attack_lock_original_update
            end

            def sl_attack_begin(coord_name,frames)
              frames=frames.to_i
              return if frames<=0

              sl_attack_finish if @sl_attack_active

              @sl_attack_active=true
              @sl_attack_coord_name=coord_name.to_s
              @sl_attack_expected_frames=frames
              @sl_attack_animation_seen=false
              @sl_attack_start_guard=6
              @sl_attack_original_direction_fix=@direction_fix
              @sl_attack_locked_direction=@direction
              @direction_fix=true
            end

            def sl_attack_active?
              @sl_attack_active==true
            end

            def sl_attack_animation_seen?
              @sl_attack_animation_seen==true
            end

            def sl_attack_animation_seen
              return unless @sl_attack_active
              @sl_attack_animation_seen=true
            end

            def sl_attack_start_guard_tick
              return unless @sl_attack_active
              return if @sl_attack_animation_seen
              @sl_attack_start_guard=@sl_attack_start_guard.to_i-1
              sl_attack_finish if @sl_attack_start_guard<=0
            end

            def sl_attack_finish
              return unless @sl_attack_active

              @direction_fix=@sl_attack_original_direction_fix unless @sl_attack_original_direction_fix.nil?
              @direction=@sl_attack_locked_direction unless @sl_attack_locked_direction.nil?

              @sl_attack_active=false
              @sl_attack_coord_name=nil
              @sl_attack_expected_frames=0
              @sl_attack_animation_seen=false
              @sl_attack_start_guard=0
              @sl_attack_original_direction_fix=nil
              @sl_attack_locked_direction=nil
            end
          end

          class Sprite_Character
            alias sl_attack_visual_original_update update

            def update
              sl_attack_visual_original_update
              return if @character==nil
              return unless @character.sl_attack_active?

              if @_animation!=nil
                @character.sl_attack_animation_seen
                self.visible=false
              elsif @character.sl_attack_animation_seen?
                @character.sl_attack_finish
              else
                @character.sl_attack_start_guard_tick
              end
            end
          end
          RUBY

          scripts.delete_if do |e|
            e.is_a?(Array)&&e.length>=3&&[
              'Monster Attack Body Hide',
              'Monster Attack Coordinate Swap',
              'Monster Attack CE Trigger',
              'Verified Monster Attack 14'
            ].include?(e[1].to_s)
          end

          main_pos=scripts.index{|e|e.is_a?(Array)&&e.length>=3&&e[1].to_s=='Main'}
          abort 'Main insertion point missing' unless main_pos
          scripts.insert(main_pos,[999997,'Verified Monster Attack 14',Zlib::Deflate.deflate(runtime)])

          # Remove old generated start commands / old baseline black-knight injection.
          removed_old=0
          common_events.compact.each do |ce|
            list=iv(ce,:list)||[]
            before=list.length
            list.delete_if do |cmd|
              next false unless iv(cmd,:code)==355
              txt=(iv(cmd,:parameters)||[])[0].to_s
              txt.include?('SLMonsterAttackContext.start(')||
                txt.include?('aid={2=>500,4=>501,6=>502,8=>503}')||
                txt.include?('e.animation_id=500 if $game_map.map_id==29&&e')
            end
            removed_old+=before-list.length
          end

          def sl_fit(seq,target)
            return [] if seq.empty?||target<=0
            return Array.new(target,seq[0]) if seq.length==1
            return [seq[0]] if target==1
            return seq[0,target] if target<=seq.length

            hold=[[target/seq.length,1].max,3].min
            core=[]
            seq.each{|pattern|hold.times{core<<pattern}}
            extra=target-core.length
            return core[0,target] if extra<=0

            impact_ratio=0.45/0.80
            impact_src=((seq.length-1)*impact_ratio).round
            impact_core=impact_src*hold+(hold/2)
            impact_dst=(target*impact_ratio).round
            lead=impact_dst-impact_core
            lead=0 if lead<0
            lead=extra if lead>extra
            tail=extra-lead
            Array.new(lead,seq[0])+core+Array.new(tail,seq[-1])
          end

          def sl_target_frames(wait,source_count)
            desired=[(wait*0.80).round,1].max
            target=[desired,source_count].max
            [target,wait].min
          end

          base_attack=animations.compact.find do |a|
            frames=iv(a,:frames)
            frames.is_a?(Array)&&frames[0]&&iv(frames[0],:cell_data)
          end
          abort 'animation frame template missing' unless base_attack

          next_anim=[animations.length,600].max
          generated={}
          used_sheets={}
          used_coords={}
          switch_anim={}
          caller_patched=0
          attack_ids_seen={}

          make_anim=lambda do |id,attack_id,sheet,patterns,wait,dir,target,mirror|
            timeline=sl_fit(patterns,target)

            anim=Marshal.load(Marshal.dump(base_attack))
            setiv(anim,:id,id)
            setiv(anim,:name,"SLV #{attack_id} #{sheet} D#{dir} W#{wait} F#{target} M#{mirror ? 1 : 0}")
            setiv(anim,:animation_name,sheet)
            setiv(anim,:animation_hue,0)
            setiv(anim,:position,1)
            setiv(anim,:frame_max,timeline.length)
            setiv(anim,:timings,[])

            frames=[]
            timeline.each do |pattern|
              frame=Marshal.load(Marshal.dump(iv(base_attack,:frames)[0]))
              setiv(frame,:cell_max,1)

              table=Table.allocate
              setiv(
                table,
                :raw,
                [2,1,8,1,8].pack('L<5')+
                  [pattern,0,0,100,0,(mirror ? 1 : 0),255,0].pack('s<8')
              )

              setiv(frame,:cell_data,table)
              frames<<frame
            end

            setiv(anim,:frames,frames)
            animations[id]=anim
          end

          common_events.each_with_index do |ce,cid|
            next unless ce
            switch_id=iv(ce,:switch_id).to_i
            next if switch_id<=0

            list=iv(ce,:list)||[]
            i=0

            while i<list.length
              call=list[i]
              unless iv(call,:code)==117
                i+=1
                next
              end

              attack_id=(iv(call,:parameters)||[])[0].to_i
              meta=verified[attack_id]
              unless meta
                i+=1
                next
              end

              indent=iv(call,:indent).to_i
              wait_cmd=nil
              ((i+1)...[i+10,list.length].min).each do |j|
                c=list[j]
                ci=iv(c,:indent).to_i
                break if ci<indent
                if iv(c,:code)==106&&ci==indent
                  wait_cmd=c
                  break
                end
              end

              unless wait_cmd
                i+=1
                next
              end

              cycle_wait=(iv(wait_cmd,:parameters)||[])[0].to_i
              unless cycle_wait>=8
                i+=1
                next
              end

              source_max=meta[:dirs].values.map{|x|x[1].length}.max
              target=sl_target_frames(cycle_wait,source_max)
              duration_frames=target*2
              cycle_frames=cycle_wait*2
              abort "animation exceeds cycle attack=#{attack_id}" if duration_frames>cycle_frames

              key=[attack_id,cycle_wait,target]
              data=generated[key]

              unless data
                ids={}
                [2,4,6,8].each do |dir|
                  spec=meta[:dirs][dir]
                  abort "verified direction missing attack=#{attack_id} dir=#{dir}" unless spec
                  sheet,patterns,mirror=spec

                  id=next_anim
                  next_anim+=1
                  make_anim.call(id,attack_id,sheet,patterns,cycle_wait,dir,target,mirror)
                  ids[dir]=id
                  used_sheets[sheet]=true
                end

                coord_key=sl_norm_name(meta[:coord])
                coord=coord_assets[coord_key]
                abort "verified coordinate missing #{meta[:coord]}" unless coord
                used_coords[coord]=true

                data={ids:ids,swap_frames:duration_frames,coord:coord}
                generated[key]=data
              end

              if switch_anim[switch_id]&&switch_anim[switch_id][:ids]!=data[:ids]
                abort "switch collision #{switch_id}"
              end
              switch_anim[switch_id]=data
              attack_ids_seen[attack_id]=true

              ids=data[:ids]
              start_cmd=RPG::EventCommand.new
              setiv(start_cmd,:code,355)
              setiv(start_cmd,:indent,indent)
              setiv(
                start_cmd,
                :parameters,
                [
                  "SLMonsterAttackContext.start(" \
                  "#{switch_id}," \
                  "{2=>#{ids[2]},4=>#{ids[4]},6=>#{ids[6]},8=>#{ids[8]}}," \
                  "#{data[:coord].dump}," \
                  "#{data[:swap_frames]})"
                ]
              )

              windup=(cycle_wait*0.45).round
              windup=2 if windup<2
              windup=cycle_wait-2 if windup>cycle_wait-2
              recovery=cycle_wait-windup

              windup_cmd=RPG::EventCommand.new
              setiv(windup_cmd,:code,106)
              setiv(windup_cmd,:indent,indent)
              setiv(windup_cmd,:parameters,[windup])
              setiv(wait_cmd,:parameters,[recovery])

              list.insert(i,start_cmd)
              list.insert(i+1,windup_cmd)
              caller_patched+=1
              i+=3
            end
          end

          abort 'no verified monster attack callers patched' if caller_patched==0

          missing_attack_ids=verified.keys.reject{|id|attack_ids_seen[id]}
          puts "UNUSED_VERIFIED_ATTACK_IDS=#{missing_attack_ids.sort.join(',')}" unless missing_attack_ids.empty?

          map_patched=0
          maps_touched={}
          switches_seen={}
          removed_map_old=0

          map_groups=Dir.glob(File.join(game,'Data','*Map[0-9][0-9][0-9].rxdata')).group_by do |p|
            File.basename(p)[/Map\d{3}/]
          end

          map_groups.each do |map_key,paths|
            map_path=paths.max_by{|p|File.size(p)}
            next unless map_path&&File.size(map_path)>100

            map=Marshal.load(File.binread(map_path))
            changed=false

            (iv(map,:events)||{}).each do |eid,event|
              (iv(event,:pages)||[]).each do |page|
                list=iv(page,:list)||[]
                before=list.length

                list.delete_if do |cmd|
                  next false unless iv(cmd,:code)==355
                  txt=(iv(cmd,:parameters)||[])[0].to_s
                  (txt.include?('sl_attack_begin(')&&txt.include?('e.animation_id=aid'))||
                    txt.include?('SLMonsterAttackContext.register(')
                end

                if list.length!=before
                  removed_map_old+=before-list.length
                  changed=true
                end

                i=0
                while i<list.length
                  cmd=list[i]
                  unless iv(cmd,:code)==121
                    i+=1
                    next
                  end

                  p=iv(cmd,:parameters)||[]
                  first=p[0].to_i
                  last=p[1].to_i
                  state=p[2].to_i
                  unless state==0&&first==last
                    i+=1
                    next
                  end

                  info=switch_anim[first]
                  unless info
                    i+=1
                    next
                  end

                  reg_cmd=RPG::EventCommand.new
                  setiv(reg_cmd,:code,355)
                  setiv(reg_cmd,:indent,iv(cmd,:indent).to_i)
                  setiv(
                    reg_cmd,
                    :parameters,
                    [
                      "SLMonsterAttackContext.register(" \
                      "#{first}," \
                      "$game_map.map_id," \
                      "#{eid}) unless $game_switches[#{first}]"
                    ]
                  )

                  list.insert(i,reg_cmd)
                  map_patched+=1
                  switches_seen[first]=true
                  changed=true
                  i+=2
                end
              end
            end

            if changed
              File.binwrite(map_path,Marshal.dump(map))
              maps_touched[map_key]=true
            end
          end

          abort 'no verified map attack registrations patched' if map_patched==0

          File.binwrite(ce_path,Marshal.dump(common_events))
          File.binwrite(anim_path,Marshal.dump(animations))
          File.binwrite(scripts_path,Marshal.dump(scripts))

          File.write(File.join(game,'sl_attack_sheets.txt'),used_sheets.keys.sort.join("\n")+"\n")
          File.write(File.join(game,'sl_attack_coords.txt'),used_coords.keys.sort.join("\n")+"\n")
          File.write(File.join(game,'sl_attack_verified_ids.txt'),verified.keys.sort.join("\n")+"\n")

          puts(
            "MONSTER_ATTACK_VERIFIED14 " \
            "callers=#{caller_patched} " \
            "registrations=#{map_patched} " \
            "maps=#{maps_touched.length} " \
            "switches=#{switches_seen.length}/#{switch_anim.length} " \
            "sheets=#{used_sheets.length} " \
            "coords=#{used_coords.length} " \
            "generated=#{generated.length*4} " \
            "removed_old=#{removed_old} " \
            "removed_map_old=#{removed_map_old}"
          )
          RB

          ruby -c /tmp/monster_verified_patch.rb
          ruby -EUTF-8:UTF-8 /tmp/monster_verified_patch.rb player/gameasync

      - name: Convert media
        run: bash /tmp/base_convert_media.sh

      - name: Build mappings
        run: bash /tmp/base_build_mappings.sh

      - name: Patch browser from V14.3l
        run: bash /tmp/base_patch_browser.sh

      - name: Verify frozen V14.3l baseline
        run: bash /tmp/base_verify.sh

      - name: Patch native Lineage hold attack
        run: bash /tmp/x2_native_auto.sh

      - name: Preload verified monster attack assets
        run: |
          bash /tmp/x2_preload_monster.sh
          sed -i 's/V14\.3x2/V14.3z1/g; s/v143x2/v143z1/g' player/index.html
          grep -Fq 'v143z1' player/index.html

      - name: Verify V14.3z1 verified package
        run: |
          set -e

          test -s player/index.html
          test -s player/gameasync/sl_attack_sheets.txt
          test -s player/gameasync/sl_attack_coords.txt
          test -s player/gameasync/sl_attack_verified_ids.txt

          # 14 user-confirmed motion sets; Turtle uses a second sheet for right attack.
          test "$(wc -l < player/gameasync/sl_attack_sheets.txt)" -eq 15
          test "$(wc -l < player/gameasync/sl_attack_coords.txt)" -eq 14
          test "$(wc -l < player/gameasync/sl_attack_verified_ids.txt)" -eq 15

          # Bugbear / King Bugbear and all failed monsters must not be preloaded.
          ! grep -Fq '버그베어' player/gameasync/sl_attack_sheets.txt
          ! grep -Fq '킹버그베어' player/gameasync/sl_attack_sheets.txt
          ! grep -Fq '네루가' player/gameasync/sl_attack_sheets.txt
          ! grep -Fq '드레이크' player/gameasync/sl_attack_sheets.txt
          ! grep -Fq '켈베로스' player/gameasync/sl_attack_sheets.txt

          grep -Fxq '흑기사모션' player/gameasync/sl_attack_sheets.txt
          grep -Fxq '간디오크모션' player/gameasync/sl_attack_sheets.txt
          grep -Fxq '무리안모션' player/gameasync/sl_attack_sheets.txt
          grep -Fxq '터틀드래곤모션' player/gameasync/sl_attack_sheets.txt
          grep -Fxq '터틀드래곤모션2' player/gameasync/sl_attack_sheets.txt
          grep -Fxq '오크모션' player/gameasync/sl_attack_sheets.txt

          grep -Fxq '850' player/gameasync/sl_attack_verified_ids.txt
          grep -Fxq '853' player/gameasync/sl_attack_verified_ids.txt
          grep -Fxq '854' player/gameasync/sl_attack_verified_ids.txt
          grep -Fxq '856' player/gameasync/sl_attack_verified_ids.txt
          grep -Fxq '857' player/gameasync/sl_attack_verified_ids.txt
          grep -Fxq '859' player/gameasync/sl_attack_verified_ids.txt
          grep -Fxq '860' player/gameasync/sl_attack_verified_ids.txt
          grep -Fxq '862' player/gameasync/sl_attack_verified_ids.txt
          grep -Fxq '876' player/gameasync/sl_attack_verified_ids.txt
          grep -Fxq '880' player/gameasync/sl_attack_verified_ids.txt
          grep -Fxq '881' player/gameasync/sl_attack_verified_ids.txt
          grep -Fxq '882' player/gameasync/sl_attack_verified_ids.txt
          grep -Fxq '893' player/gameasync/sl_attack_verified_ids.txt
          grep -Fxq '901' player/gameasync/sl_attack_verified_ids.txt
          grep -Fxq '953' player/gameasync/sl_attack_verified_ids.txt

          grep -Fq 'slAttackSheets' player/index.html
          grep -Fq 'slAttackCoords' player/index.html
          grep -Fq 'v143z1' player/index.html
          grep -Fq 'function attackButton(parent)' player/js/dpad.js
          grep -Fq "b.textContent=(auto||ready)?'AUTO':'ATK'" player/js/dpad.js
          grep -Fq 'window.slAttackAutoCancel=cancelAuto' player/js/dpad.js
          grep -Fq "attackButton(pad);const slCancel=" player/js/dpad.js

          cat > /tmp/final_verified.rb <<'RB'
          # encoding: UTF-8
          require 'zlib'
          game=ARGV.fetch(0)

          class RawMarshalObject
            def self._load(data)
              o=allocate
              o.instance_variable_set(:@raw,data)
              o
            end
            def _dump(_depth); @raw; end
          end

          class Tone < RawMarshalObject; end
          class Color < RawMarshalObject; end
          class Rect < RawMarshalObject; end
          class Table < RawMarshalObject; end

          module RPG
            class AudioFile; end
            class Animation
              class Frame; end
              class Timing; end
            end
            class CommonEvent; end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
            class Map; end
            class Event
              class Page
                class Condition; end
                class Graphic; end
              end
            end
          end

          def iv(o,n); o.instance_variable_get("@#{n}"); end

          cp=Dir.glob(File.join(game,'Data','*CommonEvents.rxdata')).max_by{|p|File.size(p)}
          ap=Dir.glob(File.join(game,'Data','*Animations.rxdata')).max_by{|p|File.size(p)}
          ce=Marshal.load(File.binread(cp))
          an=Marshal.load(File.binread(ap))
          scripts=Marshal.load(File.binread(File.join(game,'Data','Scripts.rxdata')))

          custom_auto=scripts.select do |e|
            e.is_a?(Array)&&e.length>=3&&[
              'Persistent Auto Attack',
              'Lineage Auto Attack',
              'Mobile Diablo Assist'
            ].include?(e[1].to_s)
          end
          abort "custom auto attack remains=#{custom_auto.length}" unless custom_auto.empty?

          monster_scripts=scripts.select do |e|
            e.is_a?(Array)&&e.length>=3&&e[1].to_s=='Verified Monster Attack 14'
          end
          abort "verified monster runtime count=#{monster_scripts.length}" unless monster_scripts.length==1

          runtime=Zlib::Inflate.inflate(monster_scripts[0][2]).force_encoding(Encoding::UTF_8)
          [
            'module SLMonsterAttackContext',
            '@pending[sid]||=[]',
            'event.sl_attack_begin(coord_name,frames)',
            'event.animation_id=aid',
            'return if @sl_attack_active',
            '@character.sl_attack_animation_seen',
            'self.visible=false',
            'def sl_attack_finish'
          ].each do |needle|
            abort "runtime marker missing #{needle}" unless runtime.include?(needle)
          end

          old=scripts.select do |e|
            e.is_a?(Array)&&e.length>=3&&[
              'Monster Attack Body Hide',
              'Monster Attack Coordinate Swap',
              'Monster Attack CE Trigger'
            ].include?(e[1].to_s)
          end
          abort "old monster runtime remains=#{old.length}" unless old.empty?

          slv=an.compact.select do |a|
            iv(a,:name).to_s.dup.force_encoding(Encoding::UTF_8).start_with?('SLV ')
          end
          abort "verified animations too small=#{slv.length}" unless slv.length>=40

          forbidden=['버그베어','킹버그베어','네루가','드레이크','켈베로스']
          slv.each do |a|
            name=iv(a,:name).to_s.dup.force_encoding(Encoding::UTF_8)
            sheet=iv(a,:animation_name).to_s.dup.force_encoding(Encoding::UTF_8)
            forbidden.each do |bad|
              abort "forbidden generated animation #{name}" if name.include?(bad)||sheet.include?(bad)
            end
          end

          black_left=slv.find do |a|
            n=iv(a,:name).to_s.dup.force_encoding(Encoding::UTF_8)
            n.include?('SLV 853 흑기사모션 D4 ')&&n.end_with?('M1')
          end
          abort 'verified black-knight mirrored left missing' unless black_left

          turtle_right=slv.find do |a|
            n=iv(a,:name).to_s.dup.force_encoding(Encoding::UTF_8)
            n.include?('SLV 854 터틀드래곤모션2 D6 ')
          end
          abort 'verified turtle right sheet missing' unless turtle_right

          starts=0
          ce.compact.each do |x|
            (iv(x,:list)||[]).each do |cmd|
              next unless iv(cmd,:code)==355
              txt=(iv(cmd,:parameters)||[])[0].to_s
              starts+=1 if txt.include?('SLMonsterAttackContext.start(')
            end
          end
          abort 'verified CE starts missing' if starts==0

          registrations=0
          map_groups=Dir.glob(File.join(game,'Data','*Map[0-9][0-9][0-9].rxdata')).group_by{|p|File.basename(p)[/Map\d{3}/]}
          map_groups.each_value do |paths|
            pth=paths.max_by{|p|File.size(p)}
            next unless pth&&File.size(pth)>100
            map=Marshal.load(File.binread(pth))
            (iv(map,:events)||{}).each_value do |event|
              (iv(event,:pages)||[]).each do |page|
                (iv(page,:list)||[]).each do |cmd|
                  next unless iv(cmd,:code)==355
                  txt=(iv(cmd,:parameters)||[])[0].to_s
                  registrations+=1 if txt.include?('SLMonsterAttackContext.register(')
                end
              end
            end
          end
          abort 'verified registrations missing' if registrations==0

          puts "FINAL_VERIFY_V143Z1 verified_animations=#{slv.length} starts=#{starts} registrations=#{registrations}"
          RB

          ruby -c /tmp/final_verified.rb
          ruby -EUTF-8:UTF-8 /tmp/final_verified.rb player/gameasync

          du -sh player

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
