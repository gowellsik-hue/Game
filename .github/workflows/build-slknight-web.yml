
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V266
# BASE: V265 successful run 41436712682
# SCOPE: Map025 EV29 only
# FIX 1: Remove repeated event-touch starts and event interpreter locking.
# FIX 2: Poll actual player attack input during the existing monster update.
# FIX 3: Stop approach movement at cardinal melee adjacency.
# FIX 4: Keep walking graphics stable across short movement gaps.
# KEEP: Original title, monster stats, 6:1 attack selection, native
#       damage commands, HP, EXP, drops, animations and all other files.
# STATUS: Build-time simulation only; real mobile gameplay unverified.

name: build-slknight-web.yml | V266 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: V266 Restore exact deployed V265 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41436712682
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V266 Verify and extract V265 inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s baseline/artifact.tar
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root=Path('site')
          before={
              str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }
          assert len(before)==5610,len(before)

          data=root/'knight/gameasync/Data'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          for name in ('Map025','Map016','CommonEvents','Items','Weapons','Armors'):
              assert (data/(pre+name+'.rxdata')).is_file(),name
          assert (data/'Scripts.rxdata').is_file()

          for action in ('Walk','Idle','Attack','AltAttack','Spell','Hit','Death'):
              path=root/'knight/gameasync/Graphics/Characters'/('SLZenith'+action+'.png')
              assert path.is_file(),str(path)

          Path('build/before.json').write_text(
              json.dumps(before,sort_keys=True),encoding='utf-8'
          )
          print('PASS V265 inventory: 5610 files')
          print('PASS original boss motion sheets')
          PY

      - name: V266 Correct only Zenith event and existing runtime
        shell: bash
        run: |
          set -euo pipefail
          cat > build/patch.rb <<'RUBY'
          # encoding: UTF-8
          require 'zlib'

          module RPG
            class Map;end
            class MapInfo;end
            class CommonEvent;end
            class AudioFile;end
            class Item;end
            class Weapon;end
            class Armor;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end

          class Table
            def self._load(raw)
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end
            def _dump(level=0);@raw;end
          end

          class Tone
            def self._load(raw)
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end
            def _dump(level=0);@raw;end
          end
          class Color<Tone;end

          def iv(obj,key)
            obj.instance_variable_get('@'+key.to_s)
          end
          def put(obj,key,value)
            obj.instance_variable_set('@'+key.to_s,value)
          end

          def replace_once(source,old,new_code,label)
            count=source.scan(old).length
            raise "Unexpected #{label} count #{count}" unless count==1
            source.sub(old,new_code)
          end

          root='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          map_path=root+pre+'Map025.rxdata'
          scripts_path=root+'Scripts.rxdata'

          map=Marshal.load(File.binread(map_path))
          scripts=Marshal.load(File.binread(scripts_path))
          events=iv(map,:events)
          boss=events.fetch(29)
          pages=iv(boss,:pages)
          raise 'Unexpected Zenith page count' unless pages.length==1
          page=pages.first
          old_list=iv(page,:list)

          raise 'Wrong old trigger' unless iv(page,:trigger)==2
          raise 'Wrong original chase type' unless iv(page,:move_type)==2
          raise 'Wrong old command list' unless
            old_list.length==2 &&
            iv(old_list[0],:code)==355 &&
            iv(old_list[0],:parameters)==['SLMonster.player_strike(25,29)'] &&
            iv(old_list[1],:code)==0

          untouched_events={}
          events.each do |id,event|
            untouched_events[id]=Marshal.dump(event) unless id==29
          end

          # Contact no longer starts a blocking map event.
          # The same event and its original chase configuration remain.
          put(page,:trigger,0)
          put(page,:list,[old_list.last])

          untouched_events.each do |id,raw|
            raise "Other event changed #{id}" unless
              Marshal.dump(events[id])==raw
          end

          indices=scripts.each_index.select do |i|
            scripts[i].is_a?(Array) && scripts[i][1]=='SLMonsterV265'
          end
          raise 'V265 runtime missing or duplicated' unless indices.length==1
          index=indices.first
          original_other_scripts={}
          scripts.each_with_index do |entry,i|
            original_other_scripts[i]=Marshal.dump(entry) unless i==index
          end

          runtime=Zlib::Inflate.inflate(scripts[index][2]).force_encoding('UTF-8')
          raise 'Invalid runtime encoding' unless runtime.valid_encoding?

          [
            ':level=>60',':max_hp=>5200',':physical=>[50,100]',
            ':magic=>[150,300]',':attack_wait=>20',
            ':hit_random=>[15,35]',':exp=>43212',
            ':adena=>[64800,151200]','floor=80'
          ].each do |marker|
            raise "Missing approved parameter #{marker}" unless runtime.include?(marker)
          end

          drops=runtime.scan(/\[:(item|weapon|armor),(\d+),(\d+)\]/)
          raise 'Drop count changed' unless drops.length==20
          raise 'Two-handed sword link changed' unless
            runtime.include?('[:weapon,41,50]')

          # V265 called player_strike from an Event Touch page.
          # Call it only from the normal per-frame monster update instead.
          runtime=replace_once(
            runtime,
            /^[ \t]*# Player hit requires input\.$/,
            '              player_strike(map_id,event_id)',
            'player input hook'
          )

          # Native Approach (2) keeps trying to occupy the player's cell.
          # Disable self movement at one cardinal tile, then resume pursuit.
          movement_hook=<<'MOVE'
                  if c
                    @monster=true
                    d=SLMonster.distance(self)
                    @move_type=(d && d[0]+d[1]<=1) ? 0 : 2
                  end
          MOVE
          runtime=replace_once(
            runtime,
            /^[ \t]*@monster=true if c$/,
            movement_hook.rstrip,
            'chase hook'
          )

          # Prevent rapid Walk/Idle bitmap swapping between native steps.
          runtime=replace_once(
            runtime,
            ':last_player_action_tick=>-100,',
            ":last_player_action_tick=>-100,\n"+
            '                :last_move_tick=>-100,',
            'last movement state'
          )

          moving_pattern=/moving=ev\.respond_to\?\(:moving\?\)\s*&&\s*ev\.moving\?/
          raise 'Walking hooks changed' unless runtime.scan(moving_pattern).length==2
          runtime=runtime.gsub(moving_pattern,'moving=walking?(ev,s)')

          runtime += <<'WALK'

          module SLMonster
            def self.walking?(ev,s)
              moving=ev.respond_to?(:moving?) && ev.moving?
              s[:last_move_tick]=s[:tick] if moving
              moving || (s[:tick]-s[:last_move_tick]<=4)
            end
          end
          WALK

          alias_count=runtime.scan('slm_v265').length
          raise 'V265 aliases missing' unless alias_count>=3
          runtime=runtime.gsub('slm_v265','slm_v266')

          raise 'Old passive proximity damage' if
            runtime.include?('def self.player_attack(')
          raise 'Old direct monster HP reduction' if
            runtime.include?('target.hp=[current-damage,0].max')
          raise 'Attack ratios or drops changed' unless
            runtime.include?('[26,26,0,2,0,6]') &&
            runtime.include?('[:weapon,41,50]') &&
            runtime.scan(/\[:(item|weapon|armor),(\d+),(\d+)\]/)==drops

          File.write('build/monster-runtime.rb',runtime,encoding:'UTF-8')
          raise 'Invalid Ruby runtime' unless
            system('ruby','-c','build/monster-runtime.rb')

          scripts[index][0]=99826601
          scripts[index][1]='SLMonsterV266'
          scripts[index][2]=Zlib::Deflate.deflate(runtime,9)

          original_other_scripts.each do |i,raw|
            raise "Other script changed #{i}" unless
              Marshal.dump(scripts[i])==raw
          end

          File.binwrite(map_path,Marshal.dump(map))
          File.binwrite(scripts_path,Marshal.dump(scripts))

          reloaded_map=Marshal.load(File.binread(map_path))
          reloaded_page=iv(iv(reloaded_map,:events).fetch(29),:pages).first
          raise 'Contact trigger remains' unless iv(reloaded_page,:trigger)==0
          raise 'Event command remains' unless
            iv(reloaded_page,:list).length==1 &&
            iv(iv(reloaded_page,:list).first,:code)==0
          raise 'Chase disabled in DB' unless iv(reloaded_page,:move_type)==2

          restored=Marshal.load(File.binread(scripts_path))
          raise 'Runtime serialization mismatch' unless
            restored[index][1]=='SLMonsterV266' &&
            Zlib::Inflate.inflate(restored[index][2]).b==runtime.b

          puts 'PASS event touch removed without cloning'
          puts 'PASS per-frame input-only player attacks'
          puts 'PASS no adjacent chase jitter'
          puts 'PASS stable walking image selection'
          puts 'PASS existing native monster attacks unchanged'
          puts 'PASS all twenty original drops unchanged'
          puts 'PASS all other events and scripts unchanged'
          RUBY

          ruby -c build/patch.rb
          ruby build/patch.rb

      - name: V266 Test nonblocking input and movement
        shell: bash
        run: |
          set -euo pipefail
          cat > build/test.rb <<'RUBY'
          class Game_Map
            attr_accessor :map_id,:events
            def setup(id);@map_id=id;end
          end
          class Game_Event
            attr_accessor :x,:y,:direction,:character_name,:moving
            def update;end
            def moving?;@moving==true;end
            def erase;@erased=true;end
            def screen_z(_);500;end
          end
          class Sprite_Character
            def update;end
          end
          module RPG
            class EventCommand;end
          end
          module Input
            C=13
            def self.pressed=(value);@pressed=value;end
            def self.trigger?(key);@pressed==true && key==C;end
            def self.press?(key);@pressed==true && key==C;end
          end
          class Interpreter
            def initialize(*);@running=false;end
            def setup(commands,event_id);@running=true;end
            def update;@running=false;end
            def running?;@running;end
          end
          class DummyActor
            attr_accessor :hp,:exp,:atk,:agi
            def initialize
              @hp=10000;@exp=0;@atk=100;@agi=100
            end
          end
          class DummyParty
            attr_reader :actors,:gold,:rewards
            def initialize(actor)
              @actors=[actor];@gold=0;@rewards=[]
            end
            def gain_gold(v);@gold+=v;end
            def gain_item(id,n);@rewards << [:item,id,n];end
            def gain_weapon(id,n);@rewards << [:weapon,id,n];end
            def gain_armor(id,n);@rewards << [:armor,id,n];end
          end
          class DummyPlayer
            attr_accessor :x,:y,:direction,:animation_id
          end

          $game_variables=Hash.new(0)
          $game_switches=Hash.new(false)
          $game_actors={}
          $game_map=Game_Map.new
          $game_player=DummyPlayer.new
          $game_player.x=101
          $game_player.y=100
          $game_player.direction=4
          actor=DummyActor.new
          $game_party=DummyParty.new(actor)
          $data_animations=Array.new(26)
          [25,14,15,16].each{|id|$data_animations[id]=Object.new}
          $m=nil

          load 'build/monster-runtime.rb'
          c=SLMonster.config(25,29)
          raise 'Boss registry missing' unless c
          raise 'Approved stats changed' unless
            c[:level]==60 && c[:max_hp]==5200 &&
            c[:physical]==[50,100] && c[:magic]==[150,300] &&
            c[:attack_wait]==20 && c[:drops].length==20

          boss=Game_Event.new
          boss.instance_variable_set(:@map_id,25)
          boss.instance_variable_set(:@id,29)
          boss.instance_variable_set(:@move_type,2)
          boss.x=100;boss.y=100;boss.direction=2
          boss.character_name='SLZenithIdle'
          $game_map.events={29=>boss}
          $game_map.setup(25)

          Input.pressed=false
          25.times{boss.update}
          raise 'Passive boss HP loss' unless $game_variables[7001]==0
          raise 'Adjacent chase not paused' unless
            boss.instance_variable_get(:@move_type)==0

          Input.pressed=true
          boss.update
          raise 'Player attack not wired to update' unless
            $game_variables[7001]==100
          boss.update
          raise 'Duplicate attack without cooldown' unless
            $game_variables[7001]==100

          Input.pressed=false
          $game_player.x=107
          boss.moving=true
          boss.update
          raise 'Pursuit not resumed' unless
            boss.instance_variable_get(:@move_type)==2
          raise 'Walking graphics not selected' unless
            SLMonster.walking?(boss,SLMonster.state(25,29))
          boss.moving=false
          boss.update
          raise 'Walk/Idle switched immediately' unless
            SLMonster.walking?(boss,SLMonster.state(25,29))
          5.times{boss.update}
          raise 'Idle failed to resume' if
            SLMonster.walking?(boss,SLMonster.state(25,29))

          commands=SLMonster.attack_commands(c)
          pairs=commands.map{|v|[v.instance_variable_get(:@code),v.instance_variable_get(:@parameters)]}
          for entry in [
            [122,[26,26,0,2,0,6]],
            [311,[1,1,0,80,false]],
            [311,[1,1,1,26,false]],
            [117,[57]]
          ]
            raise "Combat command removed #{entry}" unless pairs.include?(entry)
          end

          $game_variables[7001]=5200
          boss.update
          gold=$game_party.gold
          exp=actor.exp
          raise 'Adena reward invalid' unless gold.between?(64800,151200)
          raise 'EXP reward invalid' unless exp==43212
          50.times{boss.update}
          raise 'Duplicate reward' unless $game_party.gold==gold && actor.exp==exp
          raise 'Boss death not erased' unless boss.instance_variable_get(:@erased)

          other=Game_Event.new
          other.instance_variable_set(:@map_id,25)
          other.instance_variable_set(:@id,3)
          other.instance_variable_set(:@move_type,2)
          other.update
          raise 'Unrelated monster move type modified' unless
            other.instance_variable_get(:@move_type)==2

          puts 'PASS no passive proximity player damage'
          puts 'PASS direct input hits boss through update'
          puts 'PASS native chase pauses only at melee adjacency'
          puts 'PASS walking-to-idle image hysteresis'
          puts 'PASS approved native command list preserved'
          puts 'PASS one death and reward'
          puts 'PASS unrelated event bypass'
          RUBY

          ruby -c build/test.rb
          ruby build/test.rb

      - name: V266 Refresh resource hashes and cache versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          root=Path('site')
          data=root/'knight/gameasync/Data'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          mapping=root/'knight/gameasync/mapping.js'
          contents=mapping.read_text('utf-8')
          for path in (data/(pre+'Map025.rxdata'),data/'Scripts.rxdata'):
              key='Data/'+path.name
              digest=hashlib.md5(path.read_bytes()).hexdigest()
              pattern='('+re.escape(key)+r'\?h=)[0-9a-f]{32}'
              contents,n=re.subn(pattern,lambda m:m.group(1)+digest,contents)
              assert n==1,(key,n)
          mapping.write_text(contents,encoding='utf-8')

          loader=root/'knight/js/sl-assets-v229r115.js'
          js=loader.read_text('utf-8')
          assert js.count("var version='V265';")==1
          loader.write_text(js.replace("var version='V265';","var version='V266';"),encoding='utf-8')

          for relative in ('index.html','knight/index.html'):
              path=root/relative
              html=path.read_text('utf-8')
              assert 'V265' in html,relative
              html=html.replace('V265','V266').replace('?v=v265','?v=v266')
              path.write_text(html,encoding='utf-8')

          print('PASS V266 resource hashes and cache version')
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: V266 Verify unchanged game and original assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root=Path('site')
          before=json.loads(Path('build/before.json').read_text())
          after={
              str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }
          pre='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          allowed={
              pre+'Map025.rxdata',
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html','knight/index.html'
          }
          changed={k for k in before if before[k]!=after.get(k)}
          assert len(after)==5610
          assert set(before)==set(after)
          assert changed==allowed,sorted(changed^allowed)

          protected=[
              pre+'Map016.rxdata',pre+'CommonEvents.rxdata',
              pre+'Items.rxdata',pre+'Weapons.rxdata',
              pre+'Armors.rxdata',pre+'Map047.rxdata',
              'knight/assets/map-047-v241.pack'
          ]
          for name in protected:
              assert before[name]==after[name],name
          for action in ('Walk','Idle','Attack','AltAttack','Spell','Hit','Death'):
              name='knight/gameasync/Graphics/Characters/SLZenith'+action+'.png'
              assert before[name]==after[name],name
          print('PASS all other 5604 files byte-identical to V265')
          print('PASS map, bosses, items, drops, graphics and engine preserved')
          PY

      - name: V266 Publish game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
