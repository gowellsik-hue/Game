      - name: Verify exact V4.14 scope
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib,json,re

          root=Path('site')

          mapper=root/'knight/gameasync/mapping.js'

          script=root/'knight/gameasync/Data/Scripts.rxdata'

          before=json.loads(
              Path('/tmp/sl414-before.json').read_text('utf8')
          )

          old=before[
              script.relative_to(root).as_posix()
          ]['md5']

          new=hashlib.md5(
              script.read_bytes()
          ).hexdigest()

          s=mapper.read_text('utf8')

          marker='Data/Scripts.rxdata?h='

          assert old!=new

          assert re.findall(
              re.escape(marker)+r'[0-9a-f]{32}',
              s
          )==[marker+old]

          mapper.write_text(
              s.replace(marker+old,marker+new),
              'utf8'
          )

          loader=root/'knight/js/sl-assets-v229r115.js'

          s=loader.read_bytes()

          assert s.count(
              b"var version='V4.13';"
          )==1

          loader.write_bytes(
              s.replace(
                  b"var version='V4.13';",
                  b"var version='V4.14';"
              )
          )

          for name in ('index.html','knight/index.html'):
              p=root/name

              s=p.read_bytes()

              assert b'V4.13' in s,name

              p.write_bytes(
                  s.replace(b'V4.13',b'V4.14')
                   .replace(b'v4.13',b'v4.14')
              )

          after={
              p.relative_to(root).as_posix():
                hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          assert len(after)==6085

          assert set(after)==set(before)

          changed={
              k for k in before
              if before[k]['sha256']!=after[k]
          }

          allowed={
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html',
              'knight/index.html'
          }

          assert changed==allowed,sorted(changed^allowed)

          print('PASS four-character HUD')
          print('PASS designated item icons')
          print('PASS individual inventory and automatic purchase allocation')
          print('PASS original potion values and actor-specific recovery')
          print('PASS original arrow consumption branches')
          print('PASS original 50:50 EXP and party bonuses')
          print('PASS all maps, CE data, graphics and equipment preserved')
          print('PASS 6080 unchanged files')
          print('PASS V4.14 candidate')
          PYTHON

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js

