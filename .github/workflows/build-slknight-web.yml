      - name: Import complete monster stat data
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl-v41-import.rb <<'RUBY'
          require 'digest'

          module RPG
            %w[Actor Item AudioFile CommonEvent EventCommand Event MoveRoute MoveCommand Map].each do |n|
              const_set(n,Class.new) unless const_defined?(n,false)
            end

            Event.const_set(
              :Page,Class.new
            ) unless Event.const_defined?(:Page,false)

            Event::Page.const_set(
              :Condition,Class.new
            ) unless Event::Page.const_defined?(:Condition,false)

            Event::Page.const_set(
              :Graphic,Class.new
            ) unless Event::Page.const_defined?(:Graphic,false)
          end

          %w[Table Tone Color].each do |n|
            Object.const_set(
              n,Class.new
            ) unless Object.const_defined?(n)

            Object.const_get(n).define_singleton_method(:_load) do |raw|
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end
          end

          source='/tmp/sl41-all-rows.txt'

          raise 'Stat source checksum mismatch' unless
            Digest::SHA256.file(source).hexdigest==
            '432f968dbb5f5e9c48dad01aaebbfa74c31139ee5609f3a77333a3508efd663c'

          keys=[:str,:con,:dex,:int,:wis,:ac,:mr,:dr]

          stats={}
          npcs={}

          File.foreach(source) do |line|
            f=line.split

            raise 'Invalid stat row' unless f.size==10

            npc=Integer(f[0],10)

            raise "Duplicate NPC #{npc}" if npcs.key?(npc)

            npcs[npc]=true

            values=f[1,8].map{|v|Integer(v,10)}

            f[9].split(',').each do |ev|
              id=ev.split(':').map{|v|Integer(v,10)}

              raise "Invalid event #{ev}" unless
                id.size==2 && id.all?{|v|v>0}

              raise "Duplicate event #{ev}" if stats.key?(id)

              stats[id]=Hash[keys.zip(values)]
            end
          end

          raise 'NPC count mismatch' unless npcs.size==142

          raise 'EV count mismatch' unless stats.size==421

          raise 'Map count mismatch' unless
            stats.keys.map(&:first).uniq.size==36

          raise 'Field count mismatch' unless
            stats.values.sum(&:size)==3368

          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          data='site/knight/gameasync/Data'

          verified=0

          stats.keys.group_by(&:first).sort.each do |mid,ids|

            path=File.join(
              data,
              prefix+format('Map%03d.rxdata',mid)
            )

            raise "Missing map #{mid}" unless File.file?(path)

            map=Marshal.load(File.binread(path))

            events=map.instance_variable_get(:@events)

            raise "Invalid map events #{mid}" unless events.is_a?(Hash)

            ids.sort.each do |id|

              eid=id[1]

              event=events[eid]

              raise "Missing event #{id.join(':')}" unless
                event && event.instance_variable_get(:@id)==eid

              name=event.instance_variable_get(
                :@name
              ).to_s.dup.force_encoding('UTF-8').scrub

              raise "Companion matched as monster #{id.join(':')}" if
                name.start_with?('동료 ')

              verified+=1
            end
          end

          raise 'Verified EV count mismatch' unless verified==421

          path=File.join(
            data,
            prefix+'MonsterStats.rxdata'
          )

          raise 'Monster stat data already exists' if File.exist?(path)

          ordered=Hash[stats.sort_by{|id,_|id}]

          File.binwrite(
            path,
            Marshal.dump(ordered)
          )

          actual=Marshal.load(File.binread(path))

          raise 'Stat data roundtrip mismatch' unless
            actual==ordered && actual.size==421

          raise 'Unexpected field' unless
            actual.values.all?{
              |r|r.keys==keys &&
              r.values.all?{|v|v.is_a?(Integer)}
            }

          puts 'PASS 142 NPC IDs'
          puts 'PASS 36 target maps'
          puts 'PASS 421 EV verified'
          puts 'PASS 421 EV imported'
          puts 'PASS 3368 stat fields'
          puts 'PASS 0 unmatched EV'
          puts 'PASS 0 duplicate EV'
          puts 'PASS 8 stat fields per EV'
          RUBY

          ruby -c /tmp/sl-v41-import.rb
          ruby /tmp/sl-v41-import.rb

      - name: Register monster data and update version
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          root=Path('site')
          game=root/'knight/gameasync'

          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          filename=prefix+'MonsterStats.rxdata'

          data=game/'Data'/filename

          assert data.is_file()
          assert data.stat().st_size>10

          mapper=game/'mapping.js'

          original=mapper.read_bytes()

          anchor=(
              '"data/'+prefix.lower()+'map001"'
          ).encode('ascii')

          key=(
              'data/'+prefix.lower()+'monsterstats'
          )

          assert original.count(anchor)==1
          assert key.encode('ascii') not in original

          position=original.index(
              b'\n',
              original.index(anchor)
          )+1

          newline=(
              b'\r\n'
              if original[position-2:position]==b'\r\n'
              else b'\n'
          )

          checksum=hashlib.md5(
              data.read_bytes()
          ).hexdigest()

          row=(
              '["'+key+'", "Data/'+filename+
              '?h='+checksum+'"],'
          ).encode('ascii')+newline

          updated=(
              original[:position]+row+original[position:]
          )

          assert (
              updated[:position]+
              updated[position+len(row):]
          )==original

          assert updated.count(key.encode('ascii'))==1

          mapper.write_bytes(updated)

          loader=root/'knight/js/sl-assets-v229r115.js'

          original=loader.read_bytes()

          assert original.count(
              b"var version='V3.14';"
          )==1

          loader.write_bytes(
              original.replace(
                  b"var version='V3.14';",
                  b"var version='V4.1';"
              )
          )

          for name in ('index.html','knight/index.html'):

              path=root/name
              original=path.read_bytes()

              assert b'V3.14' in original

              updated=original.replace(
                  b'V3.14',b'V4.1'
              ).replace(
                  b'v3.14',b'v4.1'
              )

              path.write_bytes(updated)

          print('PASS monster stat data mapping')
          print('PASS V4.1 version')
          PY

          node --check site/knight/gameasync/mapping.js

          node --check site/knight/js/sl-assets-v229r115.js

      - name: Verify all original functions and assets unchanged
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root=Path('site')

          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          before=json.loads(
              Path('/tmp/sl-v41-before.json').read_text('utf8')
          )

          after={
              str(p.relative_to(root)):hashlib.sha256(
                  p.read_bytes()
              ).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          added=set(after)-set(before)

          removed=set(before)-set(after)

          changed={
              p
              for p in before.keys() & after.keys()
              if before[p]!=after[p]
          }

          allowed_added={
              'knight/gameasync/Data/'+prefix+
              'MonsterStats.rxdata'
          }

          allowed_changed={
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html',
              'knight/index.html'
          }

          assert added==allowed_added,sorted(added)

          assert not removed,sorted(removed)

          assert changed==allowed_changed,sorted(changed)

          assert len(before)==6018

          assert len(after)==6019

          original_data={
              p
              for p in before
              if p.startswith('knight/gameasync/Data/')
          }

          assert original_data

          for p in original_data:
              assert before[p]==after[p],p

          assert (
              b"var version='V4.1';" in
              (root/'knight/js/sl-assets-v229r115.js').read_bytes()
          )

          print('PASS all original map data unchanged')
          print('PASS all original common events unchanged')
          print('PASS all original combat scripts unchanged')
          print('PASS all original character data unchanged')
          print('PASS all original companion functions unchanged')
          print('PASS all original graphics unchanged')
          print('PASS all original engine files unchanged')
          print('PASS original data files',len(original_data))
          print('PASS unchanged files',len(before)-len(changed))
          print('PASS approved mapping and version changes',len(changed))
          print('PASS new monster data files',len(added))
          print('PASS removed files',len(removed))
          PY

      - name: Upload V4.1 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
