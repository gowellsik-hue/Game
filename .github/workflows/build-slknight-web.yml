name: Deploy SLKnight + SLFairy Clean Mobile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-slknight-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  BASE60_SHA: 75e884598cc5ced1ba9a3f090ee0806367976931
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  FAIRY_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLFairy_Source_v1.zip
  FAIRY_SHA256: 67b88b5fe0cde3c9f2fada889815f9aa7d0fc94b378025529e9950d55151c70e
  FAIRY_7Z_PASSWORD: http://nemo838.tistory.com/
  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake cmake curl ffmpeg freepats git imagemagick libtool make mm-common patch pkg-config python3 rake ruby timidity unzip wget xz-utils fonts-nanum p7zip-full

      - name: Set build id
        run: |
          echo "BUILD_ID=${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:8}" >> "$GITHUB_ENV"

      - name: Checkout proven run 60
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.BASE60_SHA }}
          path: baseline60

      - name: Checkout mkxp-web
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.MKXP_SRC_REF }}
          path: engine

      - name: Restore proven engine dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-deps-${{ runner.os }}-emsdk-${{ env.EMSDK_VER }}-v2-onig25b

      - name: Verify proven dependency cache
        run: |
          test "${{ steps.deps-cache.outputs.cache-hit }}" = "true"
          echo RUN60_DEPENDENCY_CACHE_OK

      - name: Extract proven run 60 steps
        run: |
          set -euo pipefail
          ruby -ryaml - <<'RB'
          doc = YAML.load_file('baseline60/.github/workflows/build-slknight-web.yml')
          steps = doc.fetch('jobs').fetch('build').fetch('steps')
          wanted = {
            'Patch engine 800x600 50fps' => '/tmp/base60_patch_engine.sh',
            'Build patched mkxp-web engine' => '/tmp/base60_build_engine.sh',
            'Download and install game' => '/tmp/base60_install_knight.sh',
            'Patch game scripts and data' => '/tmp/base60_patch_knight.sh',
            'Convert media' => '/tmp/base60_convert_knight.sh'
          }
          wanted.each do |name, path|
            step = steps.find { |item| item['name'] == name }
            abort "BASE60_STEP_MISSING #{name}" unless step && step['run']
            File.write(path, "set -euo pipefail\n#{step['run']}\n")
          end
          puts 'BASE60_STEPS_READY'
          RB
          for file in /tmp/base60_*.sh; do bash -n "$file"; done

      - name: Patch engine exactly like run 60
        run: |
          bash /tmp/base60_patch_engine.sh

      - name: Install clean mobile shell
        run: |
          rm -f engine/extra/js/dpad.js

          cat > engine/extra/js/mobile.js <<'JS'
          (function(){
            'use strict';

            const keys = new Set();
            const lastTap = {};
            let editMode = false;
            let dragNode = null;
            let dragOffsetX = 0;
            let dragOffsetY = 0;
            let dragMoved = false;
            let joystickPointer = null;
            let joystickOriginX = 0;
            let joystickOriginY = 0;

            function emit(type, code) {
              const event = document.createEventObject ? document.createEventObject() : document.createEvent('Events');
              if (event.initEvent) event.initEvent(type, true, true);
              event.keyCode = code;
              event.which = code;
              event.charCode = 0;

              if (typeof JSEvents !== 'undefined' && JSEvents.eventHandlers) {
                for (let i = 0; i < JSEvents.eventHandlers.length; i++) {
                  const handler = JSEvents.eventHandlers[i];
                  if ((handler.target === Module['canvas'] || handler.target === window) && handler.eventTypeString === type) {
                    handler.handlerFunc(event);
                  }
                }
              } else if (typeof Module !== 'undefined' && Module['canvas']) {
                if (Module['canvas'].dispatchEvent) {
                  Module['canvas'].dispatchEvent(event);
                } else {
                  Module['canvas'].fireEvent('on' + type, event);
                }
              }
            }

            function keyDown(code) {
              if (keys.has(code)) return;
              keys.add(code);
              emit('keydown', code);
            }

            function keyUp(code) {
              if (!keys.has(code)) return;
              keys.delete(code);
              emit('keyup', code);
            }

            function tap(code) {
              keyDown(code);
              setTimeout(function(){ keyUp(code); }, 90);
            }

            function releaseDirections() {
              [37, 38, 39, 40].forEach(keyUp);
            }

            function isTouchDevice() {
              return 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            }

            function resizeCanvas() {
              const canvas = document.getElementById('canvas');
              if (!canvas) return;

              if (innerHeight > innerWidth) {
                canvas.style.height = 'unset';
                canvas.style.width = '100%';
              } else {
                canvas.style.width = 'unset';
                canvas.style.height = '100%';
              }
            }

            function layoutKey() {
              return 'sl-layout-' + (window.SL_VARIANT || 'game');
            }

            function saveLayout() {
              const data = {};

              document.querySelectorAll('.sl-movable').forEach(function(node){
                const rect = node.getBoundingClientRect();
                data[node.id] = {
                  x: rect.left / innerWidth,
                  y: rect.top / innerHeight,
                  scale: Number(node.dataset.scale || 1)
                };
              });

              localStorage.setItem(layoutKey(), JSON.stringify(data));
            }

            function loadLayout() {
              let data = {};

              try {
                data = JSON.parse(localStorage.getItem(layoutKey()) || '{}');
              } catch (error) {}

              document.querySelectorAll('.sl-movable').forEach(function(node){
                const item = data[node.id];
                if (!item) return;

                node.style.left = Math.max(0, item.x * innerWidth) + 'px';
                node.style.top = Math.max(0, item.y * innerHeight) + 'px';
                node.style.right = 'auto';
                node.style.bottom = 'auto';
                node.dataset.scale = String(item.scale || 1);
                node.style.transform = 'scale(' + (item.scale || 1) + ')';
              });
            }

            function cycleScale(node) {
              const current = Number(node.dataset.scale || 1);
              const next = current < 0.9 ? 1 : current < 1.1 ? 1.2 : 0.82;

              node.dataset.scale = String(next);
              node.style.transform = 'scale(' + next + ')';
              saveLayout();
            }

            function setEditMode(enabled) {
              editMode = !!enabled;
              document.body.classList.toggle('sl-editing', editMode);

              const button = document.getElementById('sl-edit');
              if (button) button.textContent = editMode ? '완료' : '배치';

              releaseDirections();
            }

            function bindButton(id, code, tapOnly) {
              const node = document.getElementById(id);
              if (!node) return;

              node.addEventListener('pointerdown', function(event){
                event.preventDefault();
                event.stopPropagation();

                if (editMode) {
                  dragNode = node;
                  dragMoved = false;

                  const rect = node.getBoundingClientRect();
                  dragOffsetX = event.clientX - rect.left;
                  dragOffsetY = event.clientY - rect.top;

                  if (node.setPointerCapture) node.setPointerCapture(event.pointerId);
                  return;
                }

                node.classList.add('active');

                if (tapOnly) {
                  tap(code);
                } else {
                  keyDown(code);
                }
              });

              node.addEventListener('pointermove', function(event){
                if (!editMode || dragNode !== node) return;

                event.preventDefault();
                dragMoved = true;

                const rect = node.getBoundingClientRect();
                let x = event.clientX - dragOffsetX;
                let y = event.clientY - dragOffsetY;

                x = Math.max(0, Math.min(innerWidth - rect.width, x));
                y = Math.max(0, Math.min(innerHeight - rect.height, y));

                node.style.left = x + 'px';
                node.style.top = y + 'px';
                node.style.right = 'auto';
                node.style.bottom = 'auto';
              });

              function release(event) {
                if (event && event.preventDefault) event.preventDefault();

                node.classList.remove('active');

                if (editMode) {
                  if (dragNode === node) {
                    dragNode = null;

                    const now = Date.now();

                    if (!dragMoved && lastTap[id] && now - lastTap[id] < 350) {
                      cycleScale(node);
                      lastTap[id] = 0;
                    } else {
                      lastTap[id] = now;
                    }

                    saveLayout();
                  }

                  return;
                }

                if (!tapOnly) keyUp(code);
              }

              node.addEventListener('pointerup', release);
              node.addEventListener('pointercancel', release);
              node.addEventListener('lostpointercapture', release);
            }

            function initJoystick() {
              const zone = document.getElementById('sl-stick-zone');
              const joystick = document.getElementById('sl-joystick');
              const knob = document.getElementById('sl-joy-knob');

              if (!zone || !joystick || !knob) return;

              function update(event) {
                let dx = event.clientX - joystickOriginX;
                let dy = event.clientY - joystickOriginY;

                const max = 48;
                const length = Math.hypot(dx, dy) || 1;
                const scale = Math.min(1, max / length);

                dx *= scale;
                dy *= scale;

                knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';

                const nx = dx / max;
                const ny = dy / max;
                const next = [];

                if (Math.abs(nx) > 0.24) next.push(nx > 0 ? 39 : 37);
                if (Math.abs(ny) > 0.24) next.push(ny > 0 ? 40 : 38);

                [37, 38, 39, 40].forEach(function(code){
                  if (next.indexOf(code) >= 0) {
                    keyDown(code);
                  } else {
                    keyUp(code);
                  }
                });
              }

              zone.addEventListener('pointerdown', function(event){
                if (editMode) return;

                event.preventDefault();

                joystickPointer = event.pointerId;
                joystickOriginX = event.clientX;
                joystickOriginY = event.clientY;

                joystick.style.display = 'block';
                joystick.style.left = (joystickOriginX - 70) + 'px';
                joystick.style.top = (joystickOriginY - 70) + 'px';

                if (zone.setPointerCapture) zone.setPointerCapture(event.pointerId);

                update(event);
              });

              zone.addEventListener('pointermove', function(event){
                if (event.pointerId !== joystickPointer) return;
                event.preventDefault();
                update(event);
              });

              function end(event) {
                if (joystickPointer !== null && event && event.pointerId !== undefined && event.pointerId !== joystickPointer) return;

                joystickPointer = null;
                releaseDirections();

                knob.style.transform = 'translate(0,0)';
                joystick.style.display = 'none';
              }

              zone.addEventListener('pointerup', end);
              zone.addEventListener('pointercancel', end);
              zone.addEventListener('lostpointercapture', end);
            }

            window.slSetQuickLabel = function(slot, label) {
              const node = document.getElementById('sl-q' + slot);
              if (!node) return;

              const text = String(label || '').trim();
              node.textContent = text ? text.slice(0, 8) : String(slot);
              node.title = text;
            };

            window.addEventListener('sl-log', function(event){
              const text = String(event.detail || '');

              if (text.indexOf('SLTARGET|') >= 0) {
                const target = text.slice(text.indexOf('SLTARGET|')).split('|')[1];
                const attack = document.getElementById('sl-attack');

                if (attack) attack.classList.toggle('locked', !!target && target !== '0');
              }

              if (text.indexOf('SLQS|') >= 0) {
                const parts = text.slice(text.indexOf('SLQS|')).split('|');

                if (parts.length >= 3) {
                  window.slSetQuickLabel(parts[1], parts.slice(2).join('|'));
                }
              }
            });

            window.addEventListener('load', function(){
              const ui = document.getElementById('sl-mobile-ui');
              if (!ui) return;

              if (!isTouchDevice()) {
                ui.style.display = 'none';
                resizeCanvas();
                return;
              }

              initJoystick();

              bindButton('sl-attack', 68, true);
              bindButton('sl-confirm', 67, false);
              bindButton('sl-cancel', 88, false);
              bindButton('sl-bag', 83, false);
              bindButton('sl-equip', 65, false);
              bindButton('sl-slots', 116, true);
              bindButton('sl-q1', 117, true);
              bindButton('sl-q2', 118, true);
              bindButton('sl-q3', 119, true);
              bindButton('sl-q4', 120, true);

              const editButton = document.getElementById('sl-edit');

              if (editButton) {
                editButton.addEventListener('pointerdown', function(event){
                  event.preventDefault();
                  event.stopPropagation();
                  setEditMode(!editMode);
                });
              }

              loadLayout();
              resizeCanvas();
              addEventListener('resize', resizeCanvas);
            });
          })();
          JS

          cat > engine/extra/shell.html <<'HTML'
          <!doctype html>
          <html lang="ko">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
            <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
            <meta http-equiv="Pragma" content="no-cache">
            <meta http-equiv="Expires" content="0">
            <link rel="manifest" href="manifest.webmanifest">
            <title>__TITLE__</title>

            <script>
              var namespace = '__NAMESPACE__';
              var wTitle = '__TITLE__';
              window.SL_VARIANT = '__VARIANT__';
              window.SL_BUILD_ID = '__BUILD_ID__';
              document.title = wTitle;
            </script>

            <script src="js/localforage.min.js"></script>
            <script src="gameasync/mapping.js?v=__BUILD_ID__"></script>
            <script src="js/drive.js?v=__BUILD_ID__"></script>
            <script src="js/mobile.js?v=__BUILD_ID__"></script>

            <style>
              html,body,#main{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
              #canvas{padding:0;margin:0 auto;display:block;border:0;background:#000;height:100%;max-height:100vh;max-width:100vw}
              #spinner{position:fixed;left:18px;bottom:38px;z-index:9000;opacity:.55}
              .spinner{width:28px;height:28px;border:8px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
              @keyframes spin{to{transform:rotate(360deg)}}
              #progress{position:fixed;left:0;bottom:0;z-index:9001;background:rgba(255,255,255,.85);color:#000;padding:4px 10px;border-radius:0 7px 0 0;font:13px monospace;white-space:pre-wrap}
              #fullscreen{position:fixed;right:8px;bottom:8px;z-index:5300;color:#fff;opacity:.6;font-size:26px;cursor:pointer}
              #sl-mobile-ui{position:fixed;inset:0;z-index:5000;pointer-events:none;touch-action:none;user-select:none;-webkit-user-select:none}
              #sl-stick-zone{position:fixed;left:0;top:0;width:48vw;height:100vh;z-index:5001;pointer-events:auto;touch-action:none}
              #sl-joystick{display:none;position:fixed;width:140px;height:140px;border-radius:50%;z-index:5002;pointer-events:none}
              #sl-joy-base{position:absolute;inset:12px;border-radius:50%;border:2px solid rgba(255,255,255,.36);background:rgba(0,0,0,.25);box-shadow:inset 0 0 22px rgba(0,0,0,.45)}
              #sl-joy-knob{position:absolute;left:45px;top:45px;width:50px;height:50px;border-radius:50%;border:2px solid rgba(255,255,255,.82);background:rgba(35,35,35,.75);box-shadow:0 3px 14px rgba(0,0,0,.5)}
              .sl-btn{position:fixed;z-index:5100;box-sizing:border-box;border-radius:50%;border:2px solid rgba(255,255,255,.48);background:rgba(0,0,0,.48);color:#fff;font:600 12px system-ui,sans-serif;pointer-events:auto;touch-action:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transform-origin:center}
              .sl-btn.active{background:rgba(255,255,255,.24);border-color:#fff}
              .sl-btn.locked{border-color:#ffb347;background:rgba(140,70,0,.62);box-shadow:0 0 12px rgba(255,160,40,.7)}
              #sl-attack{width:92px;height:92px;right:18px;bottom:18px;font-size:18px}
              #sl-confirm{width:60px;height:60px;right:118px;bottom:22px}
              #sl-cancel{width:56px;height:56px;right:102px;bottom:92px}
              #sl-bag{width:52px;height:52px;right:34px;bottom:124px}
              #sl-equip{width:52px;height:52px;right:94px;bottom:154px}
              #sl-slots{width:48px;height:48px;right:158px;bottom:104px}
              #sl-q1{width:52px;height:52px;right:232px;bottom:164px}
              #sl-q2{width:52px;height:52px;right:174px;bottom:180px}
              #sl-q3{width:52px;height:52px;right:116px;bottom:196px}
              #sl-q4{width:52px;height:52px;right:58px;bottom:212px}
              #sl-edit{position:fixed;right:10px;top:10px;width:58px;height:36px;border-radius:10px;z-index:5200;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.55);color:#fff;pointer-events:auto;touch-action:none}
              .sl-editing .sl-movable{outline:2px dashed rgba(255,210,70,.9)}
            </style>
          </head>
          <body>
            <div id="main">
              <div id="spinner"><div class="spinner"></div></div>
              <div id="progress">HTML READY</div>
              <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1" width="800" height="600"></canvas>
            </div>

            <div id="sl-mobile-ui">
              <div id="sl-stick-zone"></div>
              <div id="sl-joystick">
                <div id="sl-joy-base"></div>
                <div id="sl-joy-knob"></div>
              </div>
              <button id="sl-attack" class="sl-btn sl-movable">공격</button>
              <button id="sl-confirm" class="sl-btn sl-movable">확인</button>
              <button id="sl-cancel" class="sl-btn sl-movable">취소</button>
              <button id="sl-bag" class="sl-btn sl-movable">가방</button>
              <button id="sl-equip" class="sl-btn sl-movable">장비</button>
              <button id="sl-slots" class="sl-btn sl-movable">슬롯</button>
              <button id="sl-q1" class="sl-btn sl-movable">1</button>
              <button id="sl-q2" class="sl-btn sl-movable">2</button>
              <button id="sl-q3" class="sl-btn sl-movable">3</button>
              <button id="sl-q4" class="sl-btn sl-movable">4</button>
              <button id="sl-edit">배치</button>
            </div>

            <div onclick="fullscreen()" id="fullscreen">⛶</div>

            <script>
              var bitmapSizeMapping = {};
              window.SL_BOOT_STAGE = 'HTML READY';

              function slProgress() {
                return document.getElementById('progress');
              }

              function slBootStage(stage) {
                window.SL_BOOT_STAGE = String(stage || '');
                const node = slProgress();

                if (node) {
                  node.style.display = 'block';
                  node.style.opacity = '.85';
                  node.textContent = window.SL_BOOT_STAGE;
                }
              }

              function slBootReady(stage) {
                window.SL_BOOT_STAGE = stage || 'READY';

                const progress = slProgress();
                const spinner = document.getElementById('spinner');

                if (progress) progress.style.display = 'none';
                if (spinner) spinner.style.display = 'none';
              }

              function slBootFail(message) {
                const node = slProgress();
                if (!node) return;

                node.style.display = 'block';
                node.style.left = '8px';
                node.style.right = '8px';
                node.style.top = '8px';
                node.style.bottom = 'auto';
                node.style.opacity = '1';
                node.style.background = '#000';
                node.style.color = '#fff';
                node.style.border = '2px solid #d33';
                node.style.padding = '10px';
                node.textContent = 'BOOT ERROR\n' + message;
              }

              (function(){
                const channels = {BGM:new Audio(), BGS:new Audio()};
                const pending = [];

                channels.BGM.loop = true;
                channels.BGS.loop = true;

                function audioUrl(name) {
                  const path = String(name || '').replace(/\\/g, '/').replace(/\.(ogg|mp3|wav|wma|aac|m4a|flac|mid|midi)$/i, '');
                  return encodeURI('gameasync/' + path + '.ogg?v=__BUILD_ID__');
                }

                function safePlay(audio) {
                  if (!audio || !audio.src) return;

                  try {
                    const promise = audio.play();

                    if (promise && promise.catch) {
                      promise.catch(function(){
                        if (pending.indexOf(audio) < 0) pending.push(audio);
                      });
                    }
                  } catch (error) {
                    if (pending.indexOf(audio) < 0) pending.push(audio);
                  }
                }

                ['touchstart','pointerdown','keydown','mousedown'].forEach(function(name){
                  addEventListener(name, function(){
                    pending.splice(0).forEach(safePlay);
                  }, {passive:true});
                });

                function stop(kind) {
                  const audio = channels[kind];
                  if (!audio) return;

                  audio.pause();

                  try {
                    audio.currentTime = 0;
                  } catch (error) {}
                }

                function play(kind, name, volume, pitch) {
                  const audio = channels[kind];
                  if (!audio || !name) return;

                  const url = audioUrl(name);

                  if (audio.dataset.slSrc !== url) {
                    audio.pause();
                    audio.src = url;
                    audio.dataset.slSrc = url;
                    audio.load();
                  }

                  audio.volume = Math.max(0, Math.min(1, Number(volume || 100) / 100 * (kind === 'BGS' ? 0.2 : 1)));
                  audio.playbackRate = Math.max(0.5, Math.min(1.5, Number(pitch || 100) / 100));

                  safePlay(audio);
                }

                const originalLog = console.log.bind(console);

                console.log = function(){
                  const args = Array.prototype.slice.call(arguments);
                  const text = args.join(' ');

                  try {
                    dispatchEvent(new CustomEvent('sl-log', {detail:text}));
                  } catch (error) {}

                  if (text.indexOf('SLAUDIO|') >= 0) {
                    const parts = text.slice(text.indexOf('SLAUDIO|')).split('|');
                    const command = parts[1] || '';
                    const kind = command.split('_')[0];

                    if (/_PLAY$/.test(command)) {
                      play(kind, parts.slice(2, -2).join('|'), parts[parts.length - 2], parts[parts.length - 1]);
                    } else if (/_STOP$/.test(command)) {
                      stop(kind);
                    } else if (/_FADE$/.test(command)) {
                      setTimeout(function(){ stop(kind); }, Number(parts[2]) || 0);
                    }
                  }

                  if (text.indexOf('SLBOOT|RUBY_MAIN') >= 0) slBootStage('RUBY MAIN');

                  if (text.indexOf('SLBOOT|SCENE_TITLE') >= 0 || text.indexOf('SLFRAME|Scene_Title') >= 0) {
                    slBootReady('SCENE TITLE');
                  }

                  if (text.indexOf('SLBOOT|SCENE_MAP') >= 0 || text.indexOf('SLFRAME|Scene_Map') >= 0) {
                    slBootReady('SCENE MAP');
                  }

                  if (text.indexOf('SLRUNTIMEERR|') >= 0 || text.indexOf('SLSCRIPTERR|') >= 0) {
                    slBootFail(text);
                  }

                  originalLog.apply(console, args);
                };
              })();

              addEventListener('error', function(event){
                slBootFail('JS ERROR | ' + event.message);
              });

              addEventListener('unhandledrejection', function(event){
                slBootFail('PROMISE ERROR | ' + String(event.reason));
              });

              var Module = {
                preRun: [
