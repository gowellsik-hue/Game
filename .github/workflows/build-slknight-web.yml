
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R32
# SOURCE: successful V229R21 Pages artifact, run 39153955510
# R31 map collision resampling, free nearest-cell event placement,
# and R31 sprite data are NOT used.
# Gameplay: R21 passage flags expanded exactly 2x2;
# all R21 event/transfer coordinates use x2.
# Visuals: R21 exact tiles reconstructed as bounded chunks
# and displayed at 2x; native visual tiles are transparent.
# No changes to drive.js, dpad.js, battle/movement scripts
# or maps 1..44 except existing town transfer (Map029).
name: build-slknight-web.yml | V229R32 | Clean Native Events and 2x Terrain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: V229R32 Restore successful R21 native map/game as the ONLY input
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39153955510
          name: github-pages
          github-token: ${{ github.token }}
          path: r21

      - name: "V229R32 Verify original R21 files; never use R31 output"
        shell: bash
        run: |
          set -euo pipefail
          test -s r21/artifact.tar
          mkdir -p site build
          tar -xf r21/artifact.tar -C site
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json
          p=Path('site'); g=p/'knight/gameasync'
          files=[f for f in p.rglob('*') if f.is_file()]
          assert len(files)==5358, len(files)
          script=g/'Data/Scripts.rxdata'
          expected='ac9aa3508341546e8467454a87b728b232fea910734357e3df4711e9cc82a61c'
          assert hashlib.sha256(script.read_bytes()).hexdigest()==expected
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          for n in (29,45,46):
              assert (g/'Data'/f'{pre}Map{n:03}.rxdata').is_file()
          for n in (45,46):
              assert (g/'Graphics/Tilesets'/f'SLTI_{n}_Original.png').is_file()
          for f in (p/'index.html',p/'knight/index.html'):
              assert 'V229R21' in f.read_text(encoding='utf-8')
          original={str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in files}
          Path('build/r21-sha256.json').write_text(json.dumps(original,sort_keys=True),encoding='utf-8')
          assert not (p/'knight/sanctuary').exists()
          print('PASS: verified 5358 R21 files, untouched engine script, both playable native maps')
          PY_BASE
          if ! python3 -c 'from PIL import Image' >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3-pil
          fi

      - name: "V229R32 Transform ONLY R21 maps: exact 2x passage and event coordinates"
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r32_maps.rb <<'RUBY_MAP'
          require 'json'
          require 'zlib'
          require 'base64'
          require 'digest'
          module RPG
            class Map;end; class MapInfo;end; class AudioFile;end; class Tileset;end
            class Event
              class Page
                class Condition;end; class Graphic;end
              end
            end
            class EventCommand;end; class MoveRoute;end; class MoveCommand;end
          end
          class Table
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(depth=0);@raw;end
            def self.of(values)
              _load([1,values.length,1,1,values.length].pack('V5')+values.pack('v*'))
            end
            def self.map(w,h,values)
              raise 'Map cell count mismatch' unless values.length==w*h
              _load([3,w,h,3,w*h*3].pack('V5')+values.pack('v*')+("\0"*(4*w*h)))
            end
            def header;@raw.unpack('V5');end
            def values;@raw.byteslice(20..-1).unpack('v*');end
            def [](x,y=0,z=0)
              _,w,h,depth,_=header
              return nil if x<0||y<0||z<0||x>=w||y>=h||z>=depth
              @raw.byteslice(20+2*(x+y*w+z*w*h),2).unpack1('v')
            end
          end
          class Tone
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(depth=0);@raw;end
          end
          class Color<Tone;end
          def field(o,n);o.instance_variable_get('@'+n);end
          def setfield(o,n,v);o.instance_variable_set('@'+n,v);end
          root='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          file=->(n){root+('%sMap%03d.rxdata'%[pre,n])}
          sets_path=root+pre+'Tilesets.rxdata'
          sets=Marshal.load(File.binread(sets_path))
          script_hash=Digest::SHA256.file(root+'Scripts.rxdata').hexdigest
          before=(1..44).to_h{|i|[i,Digest::SHA256.file(file.call(i)).hexdigest]}
          report={}
          [ [45,14,144,72], [46,12,168,84] ].each do |mid,expect_events,expect_w,expect_h|
            original=Marshal.load(File.binread(file.call(mid)))
            w=field(original,'width');h=field(original,'height')
            raise "Wrong original R21 map size #{mid}" unless [w,h]==[expect_w,expect_h]
            events=field(original,'events')
            raise 'R21 original events missing' unless events.size==expect_events
            tile_id=field(original,'tileset_id')
            tile_set=sets.fetch(tile_id)
            raise 'Incorrect R21 atlas' unless field(tile_set,'tileset_name')=="SLTI_#{mid}_Original"
            passages=field(tile_set,'passages').values
            data=field(original,'data')
            raise 'Incorrect R21 native table' unless data.header==[3,w,h,3,w*h*3]
            ids=(0...h).flat_map{|y|(0...w).map{|x|data[x,y,0]}}
            raise 'Unexpected source tiles' unless ids.all?{|i|i>=384 && i<passages.length}
            old_walk=ids.map{|i|(passages[i]&15)==0 ? 1 : 0}
            raise 'No R21 passage cells' if old_walk.sum<200
            enlarged=Array.new(w*h*4)
            (0...h).each do |y|
              (0...w).each do |x|
                value=old_walk[y*w+x]==1 ? 384 : 385
                j=(y*2)*(w*2)+(x*2)
                enlarged[j]=value;enlarged[j+1]=value
                enlarged[j+2*w]=value;enlarged[j+2*w+1]=value
              end
            end
            raise 'Undefined enlarged tiles' if enlarged.any?(&:nil?)
            field(original,'events').each do |eid,e|
              setfield(e,'x',field(e,'x')*2)
              setfield(e,'y',field(e,'y')*2)
              field(e,'pages').each do |page|
                (field(page,'list')||[]).each do |cmd|
                  code=field(cmd,'code');params=field(cmd,'parameters')
                  next unless params.is_a?(Array)
                  if code==201 && params.size>=4 && params[0]==0 && [45,46].include?(params[1])
                    revised=params.dup;revised[2]*=2;revised[3]*=2
                    setfield(cmd,'parameters',revised)
                  elsif code==202 && params.size>=4 && params[0]==0 && params[1]==0
                    revised=params.dup;revised[2]*=2;revised[3]*=2
                    setfield(cmd,'parameters',revised)
                  end
                end
              end
            end
            setfield(original,'width',w*2);setfield(original,'height',h*2)
            setfield(original,'data',Table.map(w*2,h*2,enlarged))
            # R21 graphic atlas is source ONLY; collision tile layer is now transparent.
            setfield(tile_set,'tileset_name','SLTI_Collision_Transparent')
            setfield(tile_set,'autotile_names',Array.new(7,''))
            setfield(tile_set,'passages',Table.of(Array.new(386,0).tap{|a|a[385]=15}))
            setfield(tile_set,'priorities',Table.of(Array.new(386,0).tap{|a|a[0]=5}))
            setfield(tile_set,'terrain_tags',Table.of(Array.new(386,0)))
            File.binwrite(file.call(mid),Marshal.dump(original))
            report[mid.to_s]={
              'source_width'=>w,'source_height'=>h,'width'=>w*2,'height'=>h*2,
              'source_events'=>expect_events,'atlas'=>"SLTI_#{mid}_Original.png",
              'source_ids_zlib64'=>Base64.strict_encode64(Zlib::Deflate.deflate(ids.pack('v*'),9)),
              'source_walk_zlib64'=>Base64.strict_encode64(Zlib::Deflate.deflate(old_walk.pack('C*'),9)),
              'walkable_source'=>old_walk.sum,'walkable_expanded'=>old_walk.sum*4,
              'events'=>events.transform_values{|e|[field(e,'x'),field(e,'y')]}
            }
            puts "Map#{mid}: #{w}x#{h} => #{w*2}x#{h*2}; exact R21 walk x4; #{events.size} events doubled"
          end
          # Change only the EXISTING Silver Knight Town teleport destination.
          town=Marshal.load(File.binread(file.call(29)))
          npc=field(town,'events').fetch(11)
          raise 'Wrong teleporter' unless [field(npc,'x'),field(npc,'y')]==[70,48]
          commands=field(field(npc,'pages').first,'list')
          matches=commands.select{|c|field(c,'code')==201 && (p=field(c,'parameters')).is_a?(Array) && p[0,2]==[0,45]}
          raise 'R21 town transfer missing or duplicate' unless matches.size==1
          target=matches.first;old=field(target,'parameters')
          raise 'R21 known dungeon entrance moved' unless old[2,2]==[48,37]
          changed=old.dup;changed[2]*=2;changed[3]*=2
          setfield(target,'parameters',changed)
          File.binwrite(file.call(29),Marshal.dump(town))
          File.binwrite(sets_path,Marshal.dump(sets))
          (1..44).each do |mid|
            next if mid==29
            raise "Existing map #{mid} modified" unless before[mid]==Digest::SHA256.file(file.call(mid)).hexdigest
          end
          raise 'R21 engine script modified' unless script_hash==Digest::SHA256.file(root+'Scripts.rxdata').hexdigest
          report['town_to_45']={'before'=>old[2,2],'after'=>changed[2,2]}
          File.write('build/r32-maps.json',JSON.generate(report))
          puts 'PASS R21 collision magnification: no new raster samples, no nearest-cell monster moves'
          RUBY_MAP
          ruby -c /tmp/r32_maps.rb
          ruby /tmp/r32_maps.rb

      - name: V229R32 Reconstruct R21 ORIGINAL pixels as bounded 512px chunks
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r32_chunks.py <<'PY_CHUNKS'
          from PIL import Image
          from pathlib import Path
          import json,zlib,base64,struct,math,hashlib
          root=Path('site/knight/gameasync')
          source=json.loads(Path('build/r32-maps.json').read_text())
          out=root/'Graphics/Panoramas'
          out.mkdir(parents=True,exist_ok=True)
          report={}
          for mid in (45,46):
              m=source[str(mid)]
              w,h=m['source_width'],m['source_height']
              raw=zlib.decompress(base64.b64decode(m['source_ids_zlib64']))
              ids=struct.unpack('<'+'H'*(w*h),raw)
              origin=root/'Graphics/Tilesets'/m['atlas']
              with Image.open(origin) as opened:
                  atlas=opened.convert('RGBA')
              image=Image.new('RGBA',(w*32,h*32))
              for y in range(h):
                  for x in range(w):
                      t=ids[y*w+x]-384
                      assert t>=0 and (t//8+1)*32<=atlas.height
                      src=((t%8)*32,(t//8)*32,(t%8+1)*32,(t//8+1)*32)
                      image.paste(atlas.crop(src),(x*32,y*32))
              cols=math.ceil(image.width/512);rows=math.ceil(image.height/512)
              names=[]
              for cy in range(rows):
                  for cx in range(cols):
                      part=image.crop((cx*512,cy*512,(cx+1)*512,(cy+1)*512))
                      name=f'SLTI_{mid}_C{cx}_{cy}.png'
                      part.save(out/name,optimize=True)
                      names.append('Graphics/Panoramas/'+name)
              assert len(names)==(45 if mid==45 else 66),len(names)
              report[str(mid)]={
                  'source_image':list(image.size),'output_image':[image.width*2,image.height*2],
                  'chunk_size_source':512,'chunk_scale':2,'cols':cols,'rows':rows,
                  'chunk_files':names,'source_rgba_sha256':hashlib.sha256(image.tobytes()).hexdigest(),
              }
              print(f'Map{mid}: {cols}x{rows} = {len(names)} source chunks; exact R21 graphic at 2x')
              del atlas,image
          Path('build/r32-chunks.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          blank=Image.new('RGBA',(256,32),(0,0,0,0))
          blank.save(root/'Graphics/Tilesets/SLTI_Collision_Transparent.png')
          PY_CHUNKS
          python3 /tmp/r32_chunks.py

      - name: V229R32 Attach on-screen-only chunk renderer to original active script 97
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r32_render.rb <<'RUBY_RENDER'
          require 'zlib'
          require 'digest'
          path='site/knight/gameasync/Data/Scripts.rxdata'
          original=File.binread(path)
          raise 'Wrong R21 engine' unless Digest::SHA256.hexdigest(original)=='ac9aa3508341546e8467454a87b728b232fea910734357e3df4711e9cc82a61c'
          scripts=Marshal.load(original)
          raise 'No late Spriteset_Map' unless scripts.length>97 && scripts[97][1].dup.force_encoding('UTF-8')=='해상도'
          code=Zlib::Inflate.inflate(scripts[97][2])
          raise 'Active renderer not unique' unless code.scan('class Spriteset_Map').size==1
          raise 'Incorrect RGSS viewport' unless code.include?('@tilemap = Tilemap.new(@viewport2)')
          init='    @panorama.z = -2000'
          update='    @tilemap4.update'
          dispose='    @panorama.dispose'
          [init,update,dispose].each{|part|raise "Missing/duplicate renderer anchor #{part}" unless code.scan(part).size==1}
          code=code.sub(init,init+%q{
              @slti_floor = [45,46].include?($game_map.map_id) ? $game_map.map_id : nil
              @slti_chunks = {}
              @slti_chunk_error = false
              @slti_cols = @slti_floor == 45 ? 9 : (@slti_floor == 46 ? 11 : 0)
              @slti_rows = @slti_floor == 45 ? 5 : (@slti_floor == 46 ? 6 : 0)
              if @slti_floor
                [@tilemap, @tilemap2, @tilemap3, @tilemap4].each do |layer|
                  layer.visible = false if layer != nil && layer.respond_to?(:visible=)
                end
              end
          })
          code=code.sub(update,update+%q{
              slti_update_terrain if @slti_floor
          })
          code=code.sub(dispose,%q{
              if @slti_chunks
                @slti_chunks.each_value do |sprite|
                  texture=sprite.bitmap
                  sprite.bitmap=nil
                  sprite.dispose
                  texture.dispose if texture != nil && !texture.disposed?
                end
                @slti_chunks.clear
              end
          }+dispose)
          method=%q{
            # 1 decoded texture per call, never all 45/66 simultaneously.
            # R21 graphics/collision are already 2x-aligned by native map data.
            def slti_update_terrain
              return if @slti_chunk_error
              sx = [$game_map.display_x.to_i / 4, 0].max
              sy = [$game_map.display_y.to_i / 4, 0].max
              viewport_w = @viewport2.rect.width
              viewport_h = @viewport2.rect.height
              return if viewport_w <= 0 || viewport_h <= 0
              left = [sx / 1024, 0].max
              top = [sy / 1024, 0].max
              right = [(sx + viewport_w - 1) / 1024, @slti_cols - 1].min
              bottom = [(sy + viewport_h - 1) / 1024, @slti_rows - 1].min
              required={}
              if left<=right && top<=bottom
                (top..bottom).each{|y|(left..right).each{|x|required[[x,y]]=true}}
              end
              @slti_chunks.keys.each do |key|
                next if required[key]
                sprite=@slti_chunks.delete(key)
                texture=sprite.bitmap
                sprite.bitmap=nil
                sprite.dispose
                texture.dispose if texture != nil && !texture.disposed?
              end
              new_count=0
              required.each_key do |key|
                x,y=key
                sprite=@slti_chunks[key]
                if sprite==nil
                  next if new_count>=1
                  sprite=Sprite.new(@viewport2)
                  sprite.z=-1500
                  sprite.zoom_x=2.0
                  sprite.zoom_y=2.0
                  filename="Graphics/Panoramas/SLTI_#{@slti_floor}_C#{x}_#{y}"
                  begin
                    sprite.bitmap=Bitmap.new(filename)
                  rescue StandardError => error
                    sprite.dispose
                    @slti_chunk_error=true
                    p "SLTI CHUNK LOAD ERROR: #{filename}: #{error.message}"
                    return
                  end
                  @slti_chunks[key]=sprite
                  new_count+=1
                end
                sprite.x=x*1024-sx
                sprite.y=y*1024-sy
              end
            end
          }
          raise 'Unexpected source ending' unless code.rstrip.end_with?('end')
          code=code.rstrip.sub(/end\z/,method+"\nend\n")
          scripts[97][2]=Zlib::Deflate.deflate(code)
          File.binwrite(path,Marshal.dump(scripts))
          raise 'Unexpected script edits' unless scripts.each_index.all?{|i|i==97 || scripts[i]==Marshal.load(original)[i]}
          File.write('build/Spriteset_Map_V229R32.rb',code)
          puts 'PASS Script97 only: 2x bounded background chunks, hide old tilemaps, preserve native drive/movement'
          RUBY_RENDER
          ruby -c /tmp/r32_render.rb
          ruby /tmp/r32_render.rb
          ruby -c build/Spriteset_Map_V229R32.rb

      - name: V229R32 Register R21-derived assets in untouched native loader
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r32_index.py <<'PY_REGISTER'
          from pathlib import Path
          import hashlib,re,json
          site=Path('site');game=site/'knight/gameasync'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          changed=['Data/Scripts.rxdata','Data/'+pre+'Tilesets.rxdata','Data/'+pre+'Map029.rxdata']
          changed += [f'Data/{pre}Map{n:03}.rxdata' for n in (45,46)]
          new=['Graphics/Tilesets/SLTI_Collision_Transparent.png']
          manifest=json.loads(Path('build/r32-chunks.json').read_text())
          for n in ('45','46'):
              names=manifest[n]['chunk_files']
              new+=names
              dst=site/'knight/preload/Data'/f'{pre}Map{int(n):03}.rxdata.json'
              dst.parent.mkdir(parents=True,exist_ok=True)
              assert not dst.exists(),dst
              dst.write_text(json.dumps(names,separators=(',',':'))+'\n',encoding='utf-8')
          p=game/'mapping.js';s=p.read_text(encoding='utf-8')
          for item in changed:
              h=hashlib.md5((game/item).read_bytes()).hexdigest()
              s,k=re.subn(re.escape(item+'?h=')+r'[a-f0-9]{32}',lambda m:item+'?h='+h,s)
              assert k==1,('Expected exactly one original R21 mapping',item,k)
          lines=[]
          for item in new:
              blob=(game/item).read_bytes()
              key=item.rsplit('.',1)[0].lower()
              assert ('["'+key+'",') not in s,key
              lines.append('['+json.dumps(key)+', '+json.dumps(item+'?h='+hashlib.md5(blob).hexdigest())+'],\n')
          assert s.count('\n];\n\nvar mapping')==1
          s=s.replace('\n];\n\nvar mapping','\n'+''.join(lines)+'];\n\nvar mapping',1)
          p.write_text(s,encoding='utf-8')
          for html in (site/'index.html',site/'knight/index.html'):
              code=html.read_text(encoding='utf-8')
              assert 'V229R21' in code
              html.write_text(code.replace('V229R21','V229R32').replace('v229r21','v229r32'),encoding='utf-8')
          Path('build/r32-assets.json').write_text(json.dumps({'modified':changed,'added':new},indent=2))
          print('PASS 2x chunks only in per-floor manifests; original R21 loader source unchanged')
          PY_REGISTER
          python3 /tmp/r32_index.py
          node --check site/knight/gameasync/mapping.js

      - name: V229R32 Verify native collision 4 ways and event coordinates
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r32_verify.rb <<'RUBY_VERIFY'
          require 'json';require 'zlib';require 'base64';require 'digest'
          module RPG
            class Map;end;class MapInfo;end;class AudioFile;end;class Tileset;end
            class Event;class Page;class Condition;end;class Graphic;end;end;end
            class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          class Table
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(depth=0);@raw;end
            def header;@raw.unpack('V5');end
            def [](x,y=0,z=0)
              _,w,h,depth,_=header
              return nil if x<0||y<0||z<0||x>=w||y>=h||z>=depth
              @raw.byteslice(20+2*(x+y*w+z*w*h),2).unpack1('v')
            end
          end
          class Tone;def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end;def _dump(depth=0);@raw;end;end
          class Color<Tone;end
          def field(o,n);o.instance_variable_get('@'+n);end
          game='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          mp=->(i){game+('%sMap%03d.rxdata'%[pre,i])}
          sets=Marshal.load(File.binread(game+pre+'Tilesets.rxdata'))
          scripts=Marshal.load(File.binread(game+'Scripts.rxdata'))
          eval(Zlib::Inflate.inflate(scripts[21][2]),TOPLEVEL_BINDING,'Original_R21_Game_Map')
          class RPG::Map;attr_reader :width,:height,:data;end
          meta=JSON.parse(File.read('build/r32-maps.json'))
          [[45,14],[46,12]].each do |id,expected|
            m=Marshal.load(File.binread(mp.call(id)))
            d=meta.fetch(id.to_s);w=d.fetch('source_width');h=d.fetch('source_height')
            walk=Zlib::Inflate.inflate(Base64.strict_decode64(d.fetch('source_walk_zlib64'))).bytes
            raise 'Bad R21 collision mask' unless walk.length==w*h
            events=field(m,'events')
            raise 'Event loss' unless events.length==expected
            raise 'R32 doubled map size differs' unless [field(m,'width'),field(m,'height')]==[w*2,h*2]
            ts=sets.fetch(field(m,'tileset_id'))
            passages=field(ts,'passages');priorities=field(ts,'priorities')
            raise 'Wrong collision-only tileset' unless field(ts,'tileset_name')=='SLTI_Collision_Transparent'
            raise 'Blank upper layer wrongly blocking' unless priorities[0]==5 && passages[0]==0
            mapdata=field(m,'data')
            raise 'Wrong three-layer table' unless mapdata.header==[3,w*2,h*2,3,w*h*12]
            native=Game_Map.allocate
            native.instance_variable_set(:@map,m)
            native.instance_variable_set(:@passages,passages)
            native.instance_variable_set(:@priorities,priorities)
            native.instance_variable_set(:@events,{})
            for y in 0...(h*2)
              for x in 0...(w*2)
                source_walk=walk[(y/2)*w+(x/2)]==1
                tile_id=mapdata[x,y,0]
                raise 'Unknown tile id' unless tile_id==(source_walk ? 384 : 385)
                [2,4,6,8].each do |dir|
                  got=native.passable?(x,y,dir)
                  raise "Native passage fail #{id}/#{x}/#{y}/#{dir}" unless got==source_walk
                end
              end
            end
            events.each do |eid,e|
              x=field(e,'x');y=field(e,'y')
              raise 'Event coordinate not scaled' unless x.even? && y.even?
              raise 'R21 event placed on blocked cell' unless walk[(y/2)*w+(x/2)]==1
              field(e,'pages').each do |page|
                field(page,'list').each do |c|
                  p=field(c,'parameters');next unless p.is_a?(Array)
                  if field(c,'code')==202 && p[0,2]==[0,0]
                    raise 'Event move coordinate not scaled' unless p[2].even? && p[3].even?
                  end
                end
              end
            end
            puts "PASS MAP #{id}: native 4-direction collision #{w*2}x#{h*2}, #{events.size} original events"
          end
          town=Marshal.load(File.binread(mp.call(29)))
          npc=field(town,'events').fetch(11)
          pages=field(npc,'pages')
          transfers=field(pages.first,'list').select{|c|field(c,'code')==201 && (p=field(c,'parameters')).is_a?(Array) && p[0,2]==[0,45]}
          raise 'Town dungeon transfer missing' unless transfers.size==1 && field(transfers.first,'parameters')[2,2]==[96,74]
          puts 'PASS 1F/2F portals and existing town destination share the same 2x transform'
          RUBY_VERIFY
          ruby -c /tmp/r32_verify.rb
          ruby /tmp/r32_verify.rb | tee build/r32-native-verify.txt

      - name: V229R32 Verify exclusive file changes and bounded graphic chunks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_FINAL'
          from pathlib import Path
          from PIL import Image
          import hashlib,json
          p=Path('site');g=p/'knight/gameasync'
          source=json.loads(Path('build/r21-sha256.json').read_text())
          target={str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in p.rglob('*') if f.is_file()}
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          modified={
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/Data/'+pre+'Tilesets.rxdata',
              'knight/gameasync/Data/'+pre+'Map029.rxdata',
              'knight/gameasync/Data/'+pre+'Map045.rxdata',
              'knight/gameasync/Data/'+pre+'Map046.rxdata',
              'knight/gameasync/mapping.js','index.html','knight/index.html',
          }
          actual={f for f in source if source[f]!=target.get(f)}
          assert actual==modified,('Unexpected original asset modifications',actual^modified)
          assert source['knight/js/drive.js']==target['knight/js/drive.js']
          assert source['knight/js/dpad.js']==target['knight/js/dpad.js']
          assets=json.loads(Path('build/r32-assets.json').read_text())
          expected_add={'knight/gameasync/'+f for f in assets['added']}
          expected_add|={f'knight/preload/Data/{pre}Map{n:03}.rxdata.json' for n in (45,46)}
          assert set(target)-set(source)==expected_add
          info=json.loads(Path('build/r32-chunks.json').read_text())
          for n in ('45','46'):
              files=info[n]['chunk_files']
              assert len(files)==(45 if n=='45' else 66)
              for f in files:
                  with Image.open(g/f) as img: assert img.size==(512,512)
          assert 'V229R32' in (p/'index.html').read_text(encoding='utf-8')
          assert 'V229R32' in (p/'knight/index.html').read_text(encoding='utf-8')
          assert 'R31' not in (Path('build/Spriteset_Map_V229R32.rb').read_text())
          assert (g/'Graphics/Tilesets/SLTI_Collision_Transparent.png').is_file()
          assert not (p/'knight/sanctuary').exists()
          print('PASS R32: original R21 engine and 43 non-town maps intact; exactly 111 floor chunks registered')
          print('NOTE: STATIC native collision test; mobile memory and foreground wall occlusion still need gameplay verification.')
          PY_FINAL

      - name: V229R32 Upload full map-transform and renderer audit
        uses: actions/upload-artifact@v4
        with:
          name: SLKnight-V229R32-R21-Based-Map-Audit
          path: |
            build/r21-sha256.json
            build/r32-maps.json
            build/r32-chunks.json
            build/r32-assets.json
            build/Spriteset_Map_V229R32.rb
            build/r32-native-verify.txt
          if-no-files-found: error
          retention-days: 30

      - name: V229R32 Upload existing game to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
