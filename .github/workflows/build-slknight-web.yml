      - name: Test V1.4 actors, shortcuts, spells and teleport
        shell: bash
        run: |
          set -euo pipefail
          cat > build/test_v14.rb <<'RUBY_V14_TEST'
          # encoding: utf-8
          module Input
            F7=118;F8=119;F9=120;CTRL=17;ALT=18;SHIFT=16
            X=65;Y=83;Z=68;L=81;F6=117
            @p={}
            def self.trigger?(x);@p[x]||false;end
            def self.simulate(h);@p=h;end
          end
          module Keyboard
            @p={}
            def self.testkey(x);@p[x]||false;end
            def self.simulate(h);@p=h;end
          end
          module RPG
           class Item;end
           class Skill
             attr_accessor :id,:name,:icon_name,:description,:sp_cost,:scope,:occasion,:common_event_id
             def initialize(id,name)
               @id=id;@name=name;@icon_name='dummy';@description='';@sp_cost=0;@scope=0;@occasion=0;@common_event_id=0
             end
           end
          end
          class Actor
           attr_reader :id,:name,:skills
           attr_accessor :hp,:maxhp,:maxsp,:sp
           def initialize(id)
            @id=id;@name=id==1 ? '기사' : '힐러 마법사';@skills=[];@hp=500;@maxhp=1000;@maxsp=100;@sp=100
           end
           def learn_skill(id);@skills << id unless @skills.include?(id);end
           def forget_skill(id);@skills.delete(id);end
           def skill_learn?(id);@skills.include?(id);end
          end
          class FakeParty
           attr_accessor :actors
           def initialize;@actors=[];end
           def item_number(id);id==15 ? 5 : 0;end
           def lose_item(id,n);@lost=[id,n];end
           def lost;@lost;end
          end
          class GameSystem
           def se_play(*args);end
          end
          class GamePlayer
           attr_accessor :animation_id
          end
          class Guage
           def self.show;end
          end
          class Scene_Item;def update_item;end;end
          class Scene_Item2;def update_item;end;end
          class Scene_Map;def update;end;end
          $game_party=FakeParty.new
          $game_actors={1=>Actor.new(1),3=>Actor.new(3)}
          $game_party.actors=[$game_actors[1]]
          $game_switches=Hash.new(false)
          $game_variables=Hash.new(0)
          $game_system=GameSystem.new
          $data_system=Struct.new(:decision_se,:buzzer_se).new("decision","beep")
          $game_player=GamePlayer.new
          $game_temp=Struct.new(:common_event_id).new(0)
          $data_skills=Array.new(100)
          $data_skills[6]=RPG::Skill.new(6,'디스인티그레이트')
          [1,7,8,9].each{|i|$data_skills[i]=RPG::Skill.new(i,'기사스킬 '+i.to_s)}
          $data_items=Array.new(200)
          $메세지=nil;$KeyIcon=nil
          class FakeWindow
           def skill;@skill;end
           def initialize(skill);@skill=skill;end
          end
          load 'build/v14_130.rb'
          def assert(x,m);raise 'V1.4 TEST FAILED: '+m unless x;end
          assert(SLV14Menu.members.size==1,'unhired menu size')
          $game_switches[185]=true
          assert(SLV14Menu.members.size==2 && SLV14Menu.actor(1).id==3, 'hired menu second actor')
          SLV14Skills.prepare
          assert($game_actors[3].skill_learn?(90),'healer greater heal available')
          assert(!$game_actors[3].skill_learn?(91),'immune scroll required')
          $game_switches[384]=true;$game_switches[385]=true;$game_switches[812]=true
          SLV14Skills.prepare
          assert([90,91,92,93].all?{|id|$game_actors[3].skill_learn?(id)},'learned spells available')
          $game_system.instance_variable_set(:@sl_hotbar_slots,[23,31,0,0,0,0])
          assert(SLHotbar.slots.size==9 && SLHotbar.slots[0]==23 && SLHotbar.slots[1]==31, 'item slot migration')
          assert(SLV14Skills.slots.size==9, 'skill slots 9')
          Keyboard.simulate({55=>true})
          assert(SLV14Skills.index_pressed==6,'skill seventh shortcut')
          Keyboard.simulate({})
          Input.simulate({Input::F8=>true})
          assert(SLV14Skills.assign_from_window(FakeWindow.new($data_skills[91]),$game_actors[3]),'assign skill second slot')
          assert(SLV14Skills.slots[1]==3091,'assign distinct healer actor id')
          Input.simulate({})
          $game_variables[459]=100
          $game_actors[1].hp=500
          assert(SLV14Skills.cast_healer(90),'greater heal cast')
          assert($game_variables[459]==84 && $game_actors[1].hp.between?(600,620),'greater heal exact cost and range')
          assert($game_player.animation_id==269,'existing heal animation')
          assert(SLV14Skills.cast_healer(91),'immune cast')
          assert($game_variables[459]==54 && $game_switches[382] && $game_switches[386] && $game_party.lost==[15,2],'immune native states and cost')
          assert(SLV14Skills.cast_healer(92),'advance cast')
          assert($game_actors[1].maxhp==1300 && $game_actors[1].maxsp==130,'advance one-time bonus')
          assert($game_variables[459]==34 && $game_switches[383],'advance original switch')
          assert(SLV14Skills.cast_healer(93),'holy cast')
          assert($game_switches[811] && $game_variables[879]==0,'holy native timer')
          $game_switches[94]=true
          before_mp=$game_variables[459]
          assert(!SLV14Skills.cast_healer(91) && $game_variables[459]==before_mp,'immune auto double charge guard')
          $game_switches[94]=false
          $game_switches[95]=true
          assert(!SLV14Skills.cast_healer(92) && $game_variables[459]==before_mp,'advance auto double charge guard')
          $game_switches[95]=false
          assert(!SLV14Skills.cast_healer(94),'unverified cast must fail closed')
          $game_switches[185]=false
          assert(SLV14Menu.members.size==1 && !SLV14Skills.cast_healer(90),'unhired cannot cast')
          puts 'PASS V1.4 menu actor, nine item/skill slots, save migration, 4 healer spells and cast guards'
          RUBY_V14_TEST
          cat > build/test_v14_teleport.rb <<'RUBY_V14_TELEPORT_TEST'
          # encoding: utf-8
          class Game_Character
            attr_accessor :x, :y, :direction, :character_name
            def initialize(x=0,y=0,d=2,name='')
              @x,@y,@direction,@character_name=x,y,d,name
            end
            def moveto(x,y); @x,@y=x,y; end
            def moving?; false; end
          end
          class Game_Event < Game_Character
            def initialize(x,y,d=2,name='[ID힐러 마법사]')
              super(x,y,d,name)
              @event=Struct.new(:name).new(name)
            end
          end
          load 'build/v14_25.rb'
          class Game_Character
            def move_up(*); @y-=1; end
            def move_down(*); @y+=1; end
            def move_left(*); @x-=1; end
            def move_right(*); @x+=1; end
          end
          class FakeMap
            attr_accessor :events, :blocked
            def initialize; @events={}; @blocked=[]; end
            def valid?(x,y); x>=0 && y>=0 && x<100 && y<100; end
            def passable?(x,y,d,event=nil); !@blocked.include?([x,y]); end
          end
          def check(ok,msg); raise 'V1.4 TELEPORT TEST: '+msg unless ok; end
          $game_switches=Hash.new(false)
          $game_switches[185]=true
          $game_map=FakeMap.new
          $game_player=Game_Character.new(20,20,2)
          healer=Game_Event.new(20,40)
          $game_map.events={1=>healer}
          healer.move_toward_player
          check([healer.x,healer.y]==[20,16], '20 tile -> four behind')
          healer.move_toward_player
          check([healer.x,healer.y]==[20,16], 'no instantaneous teleport loop')
          (3..5).each do |d|
            healer.moveto(20,20+d)
            healer.move_toward_player
            check([healer.x,healer.y]==[20,20+d], "hold distance #{d}")
          end
          (6..19).each do |d|
            healer.moveto(20,20+d)
            healer.move_toward_player
            check([healer.x,healer.y]==[20,19+d], "native chase #{d}")
          end
          (1..2).each do |d|
            healer.moveto(20,20+d)
            healer.move_toward_player
            check([healer.x,healer.y]==[20,21+d], 'retreat')
          end
          $game_map.blocked=[[20,16]]
          healer.moveto(20,40)
          healer.move_toward_player
          check([healer.x,healer.y]==[20,17], 'fallback to 3')
          $game_map.blocked=[[20,16],[20,17],[20,15]]
          healer.moveto(20,40)
          healer.move_toward_player
          check([healer.x,healer.y]==[20,40], 'all fallback blocked means stay')
          $game_map.blocked=[]
          [2,4,6,8].each do |dir|
            $game_player.direction=dir
            dx,dy={2=>[0,-1],4=>[1,0],6=>[-1,0],8=>[0,1]}[dir]
            healer.moveto(40,40)
            healer.move_toward_player
            check([healer.x,healer.y]==[20+4*dx,20+4*dy], "dir #{dir}")
          end
          other=Game_Event.new(20,29,2,'[ID오우거]')
          other.move_toward_player
          check([other.x,other.y]==[20,28], 'other NPC unchanged')
          $game_switches[185]=false
          healer.moveto(20,40)
          healer.move_toward_player
          check([healer.x,healer.y]==[20,39], 'unhired healer unchanged')
          puts 'PASS V1.4 teleport at 20, 6..19 chase, hold, retreat, fallback, four directions, isolation'
          RUBY_V14_TELEPORT_TEST
          ruby build/test_v14.rb
          ruby build/test_v14_teleport.rb

      - name: Refresh cache and visible V1.4
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          root=Path('site')
          mapping=root/'knight/gameasync/mapping.js'
          source=mapping.read_text('utf-8')
          rel='Data/Scripts.rxdata'
          digest=hashlib.md5((root/'knight/gameasync'/rel).read_bytes()).hexdigest()
          source,count=re.subn(re.escape(rel)+r'\?h=[0-9a-f]{32}',
                               lambda _:rel+'?h='+digest,source)
          assert count==1,count
          mapping.write_text(source,'utf-8')
          loader=root/'knight/js/sl-assets-v229r115.js'
          source=loader.read_text('utf-8')
          assert source.count("var version='V1.3';")==1
          loader.write_text(source.replace("var version='V1.3';", "var version='V1.4';"),'utf-8')
          for rel in ('index.html','knight/index.html'):
              path=root/rel
              source=path.read_text('utf-8')
              assert 'V1.3' in source,rel
              path.write_text(source.replace('V1.3','V1.4').replace('?v=v1.3','?v=v1.4'),'utf-8')
          print('PASS V1.4 display and JS cache hashes')
          PY
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Verify V1.4 approved changes only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          original=json.loads(Path('build/original.json').read_text('utf-8'))
          current={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                   for p in root.rglob('*') if p.is_file()}
          assert len(current)==5623 and set(current)==set(original)
          changed={p for p in original if original[p]!=current[p]}
          allowed={
            'knight/gameasync/Data/Scripts.rxdata',
            'knight/gameasync/mapping.js',
            'knight/js/dpad.js',
            'knight/js/sl-assets-v229r115.js',
            'index.html',
            'knight/index.html',
          }
          assert changed==allowed, sorted(changed ^ allowed)
          assert 'V1.4' in (root/'knight/index.html').read_text('utf-8')
          print('PASS only 6 authorized files changed')
          print('PASS all 41 healer maps untouched')
          print('PASS monster / item database / event data untouched')
          print('PASS no sprite rewrite or new timer')
          PY

      - name: Publish V1.4 game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
