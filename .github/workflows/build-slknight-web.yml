
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V251
# BASE: V247 successful run 41382471524
# FIX: V250 runtime serialization comparison
# FIX: Optional Map025 cache preload
# FIX: Zenith-only sprite renderer guards
# DISPLAY: SLKnight V251 always visible in game
# KEEP: Original maps, NPCs, combat, drops and graphics
# STATUS: GitHub Actions and mobile verification pending

name: build-slknight-web.yml | V251 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: V251 Restore successful V247 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41382471524
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V251 Verify original inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s baseline/artifact.tar
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          root=Path('site')
          files={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }
          assert len(files)==5610,(
              'Wrong V247 inventory',len(files)
          )

          pre=(
              'knight/gameasync/Data/'
              'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          )

          for mid in (16,25,47):
              assert pre+f'Map{mid:03d}.rxdata' in files

          for mid in (45,46):
              assert pre+f'Map{mid:03d}.rxdata' not in files

          assert 'knight/assets/map-047-v241.pack' in files

          for action in (
              'Walk','Idle','Attack','AltAttack',
              'Spell','Hit','Death'
          ):
              key=(
                  'knight/gameasync/Graphics/'
                  'Characters/SLZenith'+action+'.png'
              )
              assert key in files

          Path('build/before.json').write_text(
              json.dumps(files,sort_keys=True)
          )
          print('PASS V247 source inventory 5610')
          PY

      - name: V251 Repair native Zenith runtime
        shell: bash
        run: |
          set -euo pipefail

          cat > build/repair.rb <<'RUBY'
          require 'zlib'

          path='site/knight/gameasync/Data/Scripts.rxdata'
          scripts=Marshal.load(File.binread(path))

          raise 'Invalid script table' unless
            scripts.is_a?(Array)

          indices=scripts.each_index.select do |i|
            scripts[i].is_a?(Array) &&
              scripts[i][1]=='SLZenithV247'
          end
          raise 'V247 runtime not unique' unless
            indices.size==1

          index=indices.first
          entry=scripts[index]
          source=Zlib::Inflate.inflate(entry[2])
          original=source.dup

          def replace_one(source,pattern,replacement,label)
            count=source.scan(pattern).length
            raise(
              "Source anchor #{label}: #{count}"
            ) unless count==1
            source.sub(pattern){replacement}
          end

          required=[
            'MAX_HP=5200',
            'PHYSICAL=[50,100]',
            'MAGIC=[150,300]',
            'ACCURACY=9999',
            'HIT_RANDOM=[15,35]',
            'ATTACK_WAIT=20',
            'EXP=43212',
            'ADENA=[64800,151200]',
            'MAGIC_FX_IDS=[25,14,15,16]'
          ]
          required.each do |value|
            raise "Missing #{value}" unless
              source.include?(value)
          end

          # Avoid optional RPG::Cache calls on Map025.
          # Original motion graphics stay installed.
          source=replace_one(
            source,
            /^  def self\.preload\n.*?^  end(?=\n\n  def self\.show_hp)/m,
            "  def self.preload\n    true\n  end",
            'preload'
          )

          # Not every browser engine exposes moving?.
          source=replace_one(
            source,
            "name=moving? ? 'SLZenithWalk' : 'SLZenithIdle'",
            "name=(respond_to?(:moving?) && moving?) ? 'SLZenithWalk' : 'SLZenithIdle'",
            'movement state'
          )

          # Preserve native update, guarding only
          # the new Zenith-specific sprite drawing.
          sprite=<<'SPRITE'
          class Sprite_Character
            alias slz_v247_native_update update

            def update
              slz_v247_native_update

              return unless $game_map &&
                $game_map.map_id==SLZenith::MAP_ID

              return unless @character &&
                @character.is_a?(Game_Event)

              return unless
                @character.instance_variable_get(:@id)==
                SLZenith::EVENT_ID

              begin
                return unless @tile_id==0
                return unless
                  @character.respond_to?(:character_name)

                name=@character.character_name.to_s
                return unless name.start_with?('SLZenith')

                action=name.sub('SLZenith','')
                total=SLZenith::FRAMES[action]
                return unless total && total>0

                bmp=respond_to?(:bitmap) ?
                  bitmap : @bitmap
                return unless bmp &&
                  bmp.respond_to?(:width) &&
                  bmp.respond_to?(:height)
                return unless
                  bmp.width.to_i>0 &&
                  bmp.height.to_i>0
                return unless
                  bmp.width%total==0 &&
                  bmp.height%4==0

                return unless
                  @character.respond_to?(:direction) &&
                  @character.respond_to?(:slz_frame)

                direction=@character.direction.to_i
                return unless [2,4,6,8].include?(direction)

                rect=respond_to?(:src_rect) ?
                  src_rect : @src_rect
                return unless rect &&
                  rect.respond_to?(:set)

                cw=bmp.width/total
                ch=bmp.height/4
                row=(direction-2)/2
                frame=@character.slz_frame(total)

                return unless frame.is_a?(Integer)
                return unless frame.between?(0,total-1)

                @cw=cw
                @ch=ch
                rect.set(frame*cw,row*ch,cw,ch)

                if respond_to?(:ox=)
                  self.ox=cw/2
                else
                  @ox=cw/2
                end

                if respond_to?(:oy=)
                  self.oy=ch
                else
                  @oy=ch
                end

                if respond_to?(:z=) &&
                   @character.respond_to?(:screen_z)
                  self.z=@character.screen_z(ch)
                end

              rescue StandardError => e
                SLZenith.instance_variable_set(
                  :@last_sprite_error,
                  e.class.to_s+': '+e.message.to_s
                )
              end
            end
          end
          SPRITE

          source=replace_one(
            source,
            /^class Sprite_Character\n.*?^end(?=\n\nclass Game_Map)/m,
            sprite,
            'sprite renderer'
          )

          source=source.sub(
            'SLZenith V247:',
            'SLZenith V251:'
          )

          # All original Game_Event and Game_Map
          # wrappers remain untouched.
          raise 'Game_Event alias lost' unless
            source.include?(
              'alias slz_v247_native_update update'
            )

          raise 'Native map setup lost' unless
            source.include?(
              'alias slz_v247_native_setup setup'
            )

          required.each do |value|
            raise "Combat changed: #{value}" unless
              source.include?(value)
          end

          drops=/DROPS=\[\n.*?\n  \]/m
          raise 'Drop table changed' unless
            original[drops] &&
            source[drops]==original[drops]

          motions=/FRAMES=\{.*?\}/m
          raise 'Motion table changed' unless
            source[motions]==original[motions]

          File.write('build/zenith-runtime.rb',source)

          entry[0]=99825101
          entry[1]='SLZenithV251'
          entry[2]=Zlib::Deflate.deflate(source,9)

          File.binwrite(path,Marshal.dump(scripts))

          verify=Marshal.load(File.binread(path))
          restored=Zlib::Inflate.inflate(
            verify[index][2]
          )

          # Compare bytes, not encoding labels.
          raise 'Script name mismatch' unless
            verify[index][1]=='SLZenithV251'
          raise 'Runtime serialization mismatch' unless
            restored.b==source.b

          puts 'PASS byte-exact runtime roundtrip'
          puts 'PASS original event and map hooks retained'
          puts 'PASS optional preload safely disabled'
          puts 'PASS isolated Zenith sprite protection'
          puts 'PASS combat, drops and motion values unchanged'
          RUBY

          ruby -c build/repair.rb
          ruby build/repair.rb
          ruby -c build/zenith-runtime.rb

      - name: V251 Test Map025 initialization and sprites
        shell: bash
        run: |
          set -euo pipefail

          cat > build/test.rb <<'RUBY'
          class Game_Event
            attr_accessor :character_name,:direction
            def update;end
            def screen_z(h);500;end
          end

          class Game_Map
            attr_accessor :map_id,:events
            def setup(id)
              @map_id=id
              :native_ready
            end
          end

          class Sprite_Character
            attr_accessor :src_rect,:ox,:oy,:z
            def update;end
            def bitmap;@bitmap;end
          end

          $game_map=Game_Map.new
          $game_map.events={}
          $game_variables=Hash.new(0)
          $game_switches=Hash.new(false)
          $m=nil

          module RPG
            module Cache
              def self.character(*args)
                raise NoMethodError,'cache unavailable'
              end
              def self.animation(*args)
                raise NoMethodError,'cache unavailable'
              end
            end
          end

          load 'build/zenith-runtime.rb'

          raise 'Wrong runtime ID' unless
            SLZenith::EVENT_ID==29

          raise 'Wrong combat' unless
            SLZenith::PHYSICAL==[50,100] &&
            SLZenith::MAGIC==[150,300] &&
            SLZenith::MAX_HP==5200

          raise 'Wrong drops' unless
            SLZenith::DROPS.size==20 &&
            SLZenith::DROPS.include?([:armor,492,3])

          $game_map.setup(25)
          raise 'Map025 setup failed' unless
            $game_map.map_id==25

          boss=Game_Event.new
          boss.instance_variable_set(:@id,29)
          boss.instance_variable_set(:@map_id,25)
          boss.direction=2
          boss.character_name='SLZenithIdle'
          $game_map.events[29]=boss

          # No moving? method exists in this mock.
          boss.update

          sprite=Sprite_Character.new
          sprite.instance_variable_set(:@character,boss)
          sprite.instance_variable_set(:@tile_id,0)

          # No bitmap: must use safe native fallback.
          sprite.update

          rect=Struct.new(
            :x,:y,:width,:height
          ) do
            def set(x,y,w,h)
              self.x=x
              self.y=y
              self.width=w
              self.height=h
            end
          end.new

          bitmap=Struct.new(
            :width,:height
          ).new(11*144,4*120)

          sprite.instance_variable_set(:@bitmap,bitmap)
          sprite.src_rect=rect

          [2,4,6,8].each do |direction|
            boss.direction=direction
            sprite.update

            expected=((direction-2)/2)*120
            raise 'Sprite direction wrong' unless
              rect.y==expected &&
              rect.width==144 &&
              rect.height==120
          end

          raise 'Sprite rendering error' if
            SLZenith.instance_variable_get(
              :@last_sprite_error
            )

          $game_map.setup(47)
          raise 'Map047 setup failed' unless
            $game_map.map_id==47

          puts 'PASS Map025 setup with unavailable cache'
          puts 'PASS missing movement method'
          puts 'PASS missing bitmap fallback'
          puts 'PASS all four original sprite directions'
          puts 'PASS Map047 setup preserved'
          RUBY

          ruby -c build/test.rb
          ruby build/test.rb

      - name: V251 Install visible version label
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib,re
          from pathlib import Path

          root=Path('site')
          script=root/'knight/gameasync/Data/Scripts.rxdata'
          mapping=root/'knight/gameasync/mapping.js'

          content=mapping.read_text('utf-8')
          digest=hashlib.md5(
              script.read_bytes()
          ).hexdigest()

          content,count=re.subn(
              r'(Data/Scripts\.rxdata\?h=)[0-9a-f]{32}',
              lambda m:m.group(1)+digest,
              content
          )
          assert count==1,(
              'Scripts mapping mismatch',count
          )
          mapping.write_text(content,'utf-8')

          loader=root/'knight/js/sl-assets-v229r115.js'
          js=loader.read_text('utf-8')
          assert js.count("var version='V247';")==1

          loader.write_text(
              js.replace(
                  "var version='V247';",
                  "var version='V251';"
              ),
              'utf-8'
          )

          motions=(
              'Walk','Idle','Attack','AltAttack',
              'Spell','Hit','Death'
          )

          preloads=[]
          for motion in motions:
              name='SLZenith'+motion
              pattern=(
                  re.escape(
                      'Graphics/Characters/'+name+'.png'
                  )+r'\?h=([0-9a-f]{32})'
              )
              match=re.search(pattern,content)
              assert match,(
                  'Original motion mapping missing',name
              )

              url=(
                  'gameasync/Graphics/Characters/'+
                  name+'.png?h='+match.group(1)
              )
              preloads.append(
                  '<link rel="preload" as="image" href="'+
                  url+'">'
              )

          badge=(
              '<div id="slknight-v251-version" '
              'style="position:fixed;top:32px;left:8px;'
              'z-index:2147483000;pointer-events:none;'
              'border:1px solid #888;border-radius:4px;'
              'padding:3px 8px;background:rgba(0,0,0,.85);'
              'color:#fff;font:700 12px monospace">'
              'SLKnight V251</div>'
          )

          for relative in (
              'index.html','knight/index.html'
          ):
              path=root/relative
              html=path.read_text('utf-8')

              assert 'V247' in html,relative
              html=html.replace('V247','V251')
              html=html.replace('?v=v247','?v=v251')

              if relative=='knight/index.html':
                  assert html.count('</head>')==1
                  assert html.count('</body>')==1

                  html=html.replace(
                      '</head>',
                      '\n'.join(preloads)+'\n</head>',
                      1
                  )
                  html=html.replace(
                      '</body>',
                      badge+'\n</body>',
                      1
                  )

              path.write_text(html,'utf-8')

          game=(
              root/'knight/index.html'
          ).read_text('utf-8')
          assert game.count('slknight-v251-version')==1
          assert game.count('SLKnight V251')==1

          print('PASS V251 loader and Scripts hash')
          print('PASS all seven original sheets preloaded')
          print('PASS V251 permanently visible on game screen')
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: V251 Verify protected game resources
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          root=Path('site')
          before=json.loads(
              Path('build/before.json').read_text()
          )
          after={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          allowed={
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html',
              'knight/index.html'
          }

          changed={
              name for name in before
              if before[name]!=after.get(name)
          }
          assert changed==allowed,(
              'Unexpected changed files',
              sorted(changed^allowed)
          )
          assert set(before)==set(after)
          assert len(after)==5610

          pre=(
              'knight/gameasync/Data/'
              'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          )

          protected=[
              pre+'Map016.rxdata',
              pre+'Map025.rxdata',
              pre+'Map047.rxdata',
              pre+'CommonEvents.rxdata',
              'knight/assets/map-047-v241.pack'
          ]

          for name in protected:
              assert before[name]==after[name],name

          for motion in (
              'Walk','Idle','Attack','AltAttack',
              'Spell','Hit','Death'
          ):
              path=(
                  'knight/gameasync/Graphics/'
                  'Characters/SLZenith'+motion+'.png'
              )
              assert before[path]==after[path]

          for name in (
              '이펙트마법',
              '물의 대정령 마법',
              '불의 대정령 마법',
              '땅의 대정령 마법'
          ):
              path=(
                  'knight/gameasync/Graphics/'
                  'Animations/'+name+'.png'
              )
              assert before[path]==after[path]

          print('PASS original Map025 and NPCs unchanged')
          print('PASS Map016, Map047 and CE data unchanged')
          print('PASS original 28 motions and four FX retained')
          print('PASS V247 inventory 5610 preserved')
          PY

      - name: V251 Publish game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
