
name: V229R7 | Mobile Skill Button and Larger Dpad

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-slknight-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Try verified V229R6 Pages artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          repository: gowellsik-hue/Game
          run-id: 39047481826
          name: github-pages
          github-token: ${{ github.token }}
          path: previous

      - name: Restore game or recover published site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          if test -s previous/artifact.tar; then
            tar -xf previous/artifact.tar -C site
          else
            python3 - <<'PY_RECOVER'
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import hashlib, json, re, time
          base='https://gowellsik-hue.github.io/Game/'
          root=Path('site')
          fixed=('index.html','COPYING-mkxp-web.txt','manifest.webmanifest','mkxp.js','mkxp.wasm','js/drive.js','js/dpad.js','js/localforage.min.js')
          def get(url):
              for attempt in range(5):
                  try:
                      req=Request(url,headers={'User-Agent':'SLKnight-V229-R6','Accept-Encoding':'identity'})
                      with urlopen(req, timeout=75) as response:
                          return response.read()
                  except Exception:
                      if attempt==4: raise
                      time.sleep(attempt+1)
          files={'index.html':(base+'index.html',None)}
          for game in ('knight','elf'):
              for rel in fixed:
                  files[game+'/'+rel]=(base+game+'/'+quote(rel,safe='/'),None)
              mapping_name=game+'/gameasync/mapping.js'
              blob=get(base+mapping_name+'?recover=v229r6')
              p=root/mapping_name
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(blob)
              body=blob.decode('utf-8').split('var mappingArray = ',1)[1].split('];',1)[0]+']'
              for _,asset in json.loads(re.sub(r',\s*\]$',']',body)):
                  rel,sep,md5=asset.partition('?h=')
                  if '.' not in Path(rel).name: continue
                  if rel.startswith('/') or '..' in Path(rel).parts: raise RuntimeError('Unsafe asset path '+rel)
                  name=game+'/gameasync/'+rel
                  if name in files: raise RuntimeError('Duplicate asset '+name)
                  files[name]=(base+game+'/gameasync/'+quote(rel,safe='/')+('?h='+md5 if sep else ''),md5 if sep else None)
          if len(files)!=5354: raise RuntimeError('Unexpected total asset count '+str(len(files)))
          def fetch(item):
              name,(url,md5)=item
              data=get(url)
              if md5 and Path(name).name not in ('mapping.js','bitmap-map.js'):
                  if hashlib.md5(data).hexdigest()!=md5: raise RuntimeError('Asset checksum mismatch '+name)
              p=root/name
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(data)
          with ThreadPoolExecutor(max_workers=12) as pool:
              jobs=[pool.submit(fetch,item) for item in files.items() if not (root/item[0]).is_file()]
              for job in as_completed(jobs): job.result()
          actual={str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}
          if actual!=set(files): raise RuntimeError('Incomplete published game recovery')
          print('RESTORED_5354_PUBLISHED_ASSETS')
          PY_RECOVER
          fi

      - name: Verify V229R6 or V229R7 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if len(files)!=5354:raise SystemExit('Unexpected total game files: '+str(len(files)))
          expected={
           'knight/js/dpad.js':('c137842818acf76a036127a0ffbae88e22affcba78ca70c3f1b4c76b52f86908','ad6140d7ba7e39f87f81244812b41dcb6b1baff2eb89eb42e797e728a8449a2b'),
           'knight/gameasync/Data/Scripts.rxdata':('634ba0e18df087d04916aa1d6f808b43b27bb8579fb2c63b3cc202192c1a9ca0','67d0ae5bdebf1002907cc1edc2a166c54971731059979c4b0253a7565ddc1495'),
           'knight/gameasync/mapping.js':('7e29e6eb85b2f5ee2f4575b63fe62d7468ae78503ee8014f42dd5e1d7264e2f1','c1c45fa4362c08de14980ca6ef0b847b1f8873085dcbac5e04f25fa09d9a7746'),
           'knight/index.html':('aadd1381feaacad75bc4071ae7ed427d68b53d309680806495552637a92cf2f5','219323b14d61190422cbd27f147e3f41a79d02558d8c728e636e74cec5cae5ea')
          }
          keep={
           'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata':'c1112940bc8ba843e0a7a108a09c09c00a8c952162c62b5f2119323353cb2959'
          }
          if any(files.get(k)!=v for k,v in keep.items()):raise SystemExit('Boss or transformation source has changed')
          version='V229R6' if all(files.get(k)==v[0] for k,v in expected.items()) else 'V229R7' if all(files.get(k)==v[1] for k,v in expected.items()) else None
          if version is None:raise SystemExit('Unexpected game version: refusing to modify')
          Path('/tmp/sl_ui_version').write_text(version)
          Path('/tmp/sl_ui_before.json').write_text(json.dumps(files))
          Path('/tmp/sl_ui_checks.json').write_text(json.dumps(expected))
          print('SL_KNIGHT_TOUCH_SOURCE',version,len(files))
          PY_VERIFY

      - name: Add skill key and expand movement buttons
        shell: bash
        run: |
          set -euo pipefail
          if test "$(cat /tmp/sl_ui_version)" = V229R6; then
          python3 - <<'PY_DPAD'
          from pathlib import Path
          import hashlib

          root=Path('site/knight')
          p=root/'js/dpad.js'
          s=p.read_text(encoding='utf-8')

          def replace_once(old,new,label):
              global s
              n=s.count(old)
              if n!=1:
                  raise RuntimeError(f'{label} expected once, got {n}')
              s=s.replace(old,new,1)

          replace_once("const canvas=document.getElementById('canvas'),pad=document.getElementById('sl-pad'),zone=document.getElementById('sl-joy-zone'),hot=document.getElementById('sl-hotbar'),atk=document.getElementById('sl-atk'),cancel=document.getElementById('sl-cancel');\n  if(!canvas||!pad||!zone||!hot||!atk||!cancel)return;",
          "const canvas=document.getElementById('canvas'),pad=document.getElementById('sl-pad'),zone=document.getElementById('sl-joy-zone'),hot=document.getElementById('sl-hotbar'),atk=document.getElementById('sl-atk'),cancel=document.getElementById('sl-cancel'),dpad=document.getElementById('sl-dpad'),skill=document.getElementById('sl-skill');\n  if(!canvas||!pad||!zone||!hot||!atk||!cancel||!dpad||!skill)return;", 'layout controls')

          anchor='function layoutPad(){'
          newfn='''function layoutSkillPad(dpad,skill,w,h,portrait){
            const buttonH=portrait?52:46,gap=portrait?12:10;
            const targetSize=portrait?184:156;
            const size=Math.max(114,Math.min(targetSize,w+12,h-buttonH-gap-14));
            const cy=Math.max(size/2+7,Math.min(h*0.5+(portrait?18:12),h-size/2-gap-buttonH-7));
            centerBox(dpad,w/2,cy,size,size);
            centerBox(skill,w/2,cy+size/2+gap+buttonH/2,Math.min(w+8,portrait?100:90),buttonH);
          }
          '''
          replace_once(anchor,newfn+anchor,'skill layout helper')

          replace_once('const hotW=160,hotH=104,top=cr.bottom-v.top,h=bottomSpace,leftW=Math.max(1,v.width*0.46),rightLeft=leftW,rightW=Math.max(1,v.width-rightLeft);',
                       'const hotW=160,hotH=104,top=cr.bottom-v.top,h=bottomSpace,leftW=Math.max(1,Math.min(v.width*0.52,v.width-170)),rightLeft=leftW,rightW=Math.max(1,v.width-rightLeft);','portrait left control area')
          replace_once('box(zone,0,top+8,leftW-8,Math.max(1,h-16));',
                       'box(zone,0,top+8,leftW-8,Math.max(1,h-16));\n    layoutSkillPad(dpad,skill,Math.max(1,leftW-8),Math.max(1,h-16),true);', 'portrait skill layout')
          replace_once('box(zone,0,top+8,Math.max(1,leftW-8),Math.max(1,h-16));',
                       'box(zone,0,top+8,Math.max(1,leftW-8),Math.max(1,h-16));\n    layoutSkillPad(dpad,skill,Math.max(1,leftW-8),Math.max(1,h-16),false);', 'landscape skill layout')

          old_css='''#sl-dpad{position:absolute;left:50%;top:calc(50% + 18px);width:156px;height:156px;transform:translate(-50%,-50%)}
          .sl-dir{position:absolute;width:52px;height:52px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;border-radius:12px;background:rgba(55,55,55,.52);border:2px solid rgba(255,255,255,.30);color:#fff;font:700 22px sans-serif;text-shadow:0 1px 2px #000;pointer-events:auto;touch-action:none}
          .sl-dir.pressed{background:rgba(225,225,225,.62);transform:scale(.94)}
          #sl-up{left:52px;top:0}#sl-left{left:0;top:52px}#sl-right{right:0;top:52px}#sl-down{left:52px;bottom:0}
          #sl-pad[data-mode="side"] #sl-dpad{width:126px;height:126px}
          #sl-pad[data-mode="side"] .sl-dir{width:42px;height:42px;font-size:18px}
          #sl-pad[data-mode="side"] #sl-up{left:42px}#sl-pad[data-mode="side"] #sl-left{top:42px}#sl-pad[data-mode="side"] #sl-right{top:42px}#sl-pad[data-mode="side"] #sl-down{left:42px}'''
          new_css='''#sl-dpad{position:absolute;width:184px;height:184px}
          .sl-dir{position:absolute;width:33.3333%;height:33.3333%;display:flex;align-items:center;justify-content:center;box-sizing:border-box;border-radius:13px;background:rgba(55,55,55,.62);border:2px solid rgba(255,255,255,.42);color:#fff;font:700 24px sans-serif;text-shadow:0 1px 2px #000;pointer-events:auto;touch-action:none}
          .sl-dir.pressed{background:rgba(225,225,225,.72);transform:scale(.96)}
          #sl-up{left:33.3333%;top:0}#sl-left{left:0;top:33.3333%}#sl-right{right:0;top:33.3333%}#sl-down{left:33.3333%;bottom:0}
          #sl-pad[data-mode="side"] .sl-dir{font-size:21px}
          #sl-skill{border-radius:14px;background:rgba(46,70,99,.83);font:700 17px sans-serif;letter-spacing:1px;min-height:44px;box-shadow:0 2px 9px rgba(0,0,0,.35)}
          #sl-skill.pressed{background:rgba(112,153,201,.90)}'''
          replace_once(old_css,new_css,'dpad CSS')
          replace_once('const dpad=document.createElement(\'div\');dpad.id=\'sl-dpad\';zone.appendChild(dpad);\n  dirButton(dpad,\'sl-up\',\'▲\',38);dirButton(dpad,\'sl-left\',\'◀\',37);dirButton(dpad,\'sl-right\',\'▶\',39);dirButton(dpad,\'sl-down\',\'▼\',40);',
          '''const dpad=document.createElement('div');dpad.id='sl-dpad';zone.appendChild(dpad);
            dirButton(dpad,'sl-up','▲',38);dirButton(dpad,'sl-left','◀',37);dirButton(dpad,'sl-right','▶',39);dirButton(dpad,'sl-down','▼',40);
            const slSkill=button(zone,'sl-skill','기술',75,'sl-btn',true);
            slSkill.title='기술창 열기';slSkill.setAttribute('aria-label','기술창 열기');''', 'skill button DOM')
          assert 'sl-skill' in s and 'layoutSkillPad' in s
          p.write_text(s,encoding='utf-8')
          print('V229R7_DPAD_SHA',hashlib.sha256(p.read_bytes()).hexdigest())
          PY_DPAD
          ruby - <<'RUBY_SKILL'
          require 'zlib'
          require 'digest'
          path='site/knight/gameasync/Data/Scripts.rxdata'
          scripts=Marshal.load(File.binread(path))
          raise 'Unexpected script count' unless scripts.length==136 && scripts[-1][1]=='Main' && scripts[-2][1]=='V230 Boss Respawn 60s 180s'
          code=<<~'SCRIPT'
          module SLV229TouchSkill
            @direct=false
            class << self
              attr_accessor :direct
            end
          end
          class Scene_Map
            alias slv229_ui_prev_update update
            def update
              slv229_ui_prev_update
              return unless $scene.equal?(self)
              return unless Keyboard.testkey(75)
              return if $game_system.menu_disabled || $game_system.map_interpreter.running?
              return if $game_temp.message_window_showing || $game_temp.player_transferring
              return if $game_party.actors.empty? || $game_party.actors[0].restriction >= 2
              return if $game_switches[965]
              $game_temp.menu_calling=false
              $game_temp.menu_beep=false
              $game_player.straighten
              $game_system.se_play($data_system.decision_se)
              SLV229TouchSkill.direct=true
              $scene=Scene_Skill.new(0)
            end
          end
          class Scene_Skill
            alias slv229_ui_prev_skill_update update_skill
            def update_skill
              if SLV229TouchSkill.direct && Input.trigger?(Input::B)
                $game_system.se_play($data_system.cancel_se)
                SLV229TouchSkill.direct=false
                $scene=Scene_Map.new
                return
              end
              slv229_ui_prev_skill_update
              SLV229TouchSkill.direct=false unless $scene.is_a?(Scene_Skill)
            end
          end
          SCRIPT
          File.binwrite('/tmp/slv229_touch_script.rb',code)
          raise 'New Ruby script has syntax error' unless system('ruby','-c','/tmp/slv229_touch_script.rb',out:File::NULL)
          idx=scripts.length-1
          scripts.insert(idx,[scripts.map{|entry|entry[0].to_i}.max+1,'V229 Mobile Skill Button',Zlib::Deflate.deflate(code)])
          raise 'Previous code changed' unless scripts.length==137 && scripts[135][1]=='V229 Mobile Skill Button' && scripts[136][1]=='Main'
          File.binwrite(path,Marshal.dump(scripts))
          puts 'V229R7_SCRIPTS_SHA '+Digest::SHA256.file(path).hexdigest
          RUBY_SKILL
          python3 - <<'PY_CACHE'
          from pathlib import Path
          import hashlib,re
          root=Path('site/knight')
          rel='Data/Scripts.rxdata'
          path=root/'gameasync/mapping.js'
          s=path.read_text(encoding='utf-8')
          md5=hashlib.md5((root/'gameasync'/rel).read_bytes()).hexdigest()
          s,n=re.subn(re.escape(rel+'?h=')+r'[0-9a-f]{32}',lambda _:rel+'?h='+md5,s)
          assert n==1,('Mapping entry',n)
          path.write_text(s,encoding='utf-8')
          index=root/'index.html'
          s=index.read_text(encoding='utf-8')
          for old,new in [('gameasync/mapping.js?v=v229r6','gameasync/mapping.js?v=v229r7'),('js/dpad.js?v=v143z100','js/dpad.js?v=v229r7')]:
              assert s.count(old)==1,(old,s.count(old))
              s=s.replace(old,new,1)
          index.write_text(s,encoding='utf-8')
          for name in ('js/dpad.js','gameasync/mapping.js','index.html'):
           p=root/name
           print('V229R7_'+p.name.upper()+'_SHA',hashlib.sha256(p.read_bytes()).hexdigest())
          PY_CACHE
          else
            echo V229R7_ALREADY_APPLIED
          fi

      - name: Verify mobile input and preserve all other gameplay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          old=json.loads(Path('/tmp/sl_ui_before.json').read_text())
          new={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          expected=json.loads(Path('/tmp/sl_ui_checks.json').read_text())
          if new.keys()!=old.keys() or len(new)!=5354:raise SystemExit('Game asset inventory changed')
          for name,(before,after) in expected.items():
           if new.get(name)!=after:raise SystemExit('Incorrect patched asset: '+name+' '+str(new.get(name)))
          changed={k for k in new if new[k]!=old[k]}
          version=Path('/tmp/sl_ui_version').read_text()
          if version=='V229R6' and changed!=set(expected):raise SystemExit('Unexpected modified files '+str(changed))
          if version=='V229R7' and changed:raise SystemExit('R7 reapplication changed files '+str(changed))
          index=(root/'knight/index.html').read_text(encoding='utf-8')
          if index.count('gameasync/mapping.js?v=v229r7')!=1 or index.count('js/dpad.js?v=v229r7')!=1:raise SystemExit('Mobile cache invalid')
          rel='Data/Scripts.rxdata'
          md5=hashlib.md5((root/'knight/gameasync'/rel).read_bytes()).hexdigest()
          mp=(root/'knight/gameasync/mapping.js').read_text(encoding='utf-8')
          if mp.count(rel+'?h='+md5)!=1:raise SystemExit('Scripts asset hash not updated')
          js=(root/'knight/js/dpad.js').read_text(encoding='utf-8')
          for term in ('layoutSkillPad(dpad,skill','sl-skill','기술창 열기',"'기술',75",'width:33.3333%'):
           if term not in js:raise SystemExit('Missing mobile skill control '+term)
          print('PASS_TOUCH_R7_4_CHANGED_FILES',len(changed),'UNCHANGED',len(new)-len(changed))
          PY_FINAL
          ruby - <<'RUBY_VERIFY'
          require 'zlib'
          a=Marshal.load(File.binread('site/knight/gameasync/Data/Scripts.rxdata'))
          raise 'Wrong script inventory' unless a.size==137 && a[134][1]=='V230 Boss Respawn 60s 180s' && a[135][1]=='V229 Mobile Skill Button' && a[136][1]=='Main'
          code=Zlib::Inflate.inflate(a[135][2])
          raise 'Shortcut key wrong' unless code.include?('Keyboard.testkey(75)')
          raise 'Direct skill screen missing' unless code.include?('$scene=Scene_Skill.new(0)')
          raise 'Direct cancel should return to map' unless code.include?('$scene=Scene_Map.new') && code.include?('SLV229TouchSkill.direct=false')
          puts 'PASS_V229R7_SKILL_ENTRY_CANCEL_AND_BOSS_CODE_PRESERVED'
          RUBY_VERIFY
          node --check site/knight/js/dpad.js

      - name: Upload verified knight site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
