
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R133
# BASE: exact successful V229R131 build from commit 6319a8221f4aefb3cbbfbd593049a6001614bb5b.
# CHANGE: remove -12,-6 inverse adjustment ONLY inside SLTI_Native66.nearest.
# KEEP: original +12,+6 projection on map45 and map46, unchanged.
# KEEP: original player/monster spawn coordinates, events, Baphomet, stairs and respawn logic.
# KEEP: original 384/385 map tiles, approved directional passages, cleaned 2F art and drops.
# NO: new coordinate offset, map edit, monster relocation, collision or movement override.
name: build-slknight-web.yml | V229R133 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R133 Find the successful V229R131 published artifact
        id: base
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          expected_sha='6319a8221f4aefb3cbbfbd593049a6001614bb5b'
          url=('https://api.github.com/repos/gowellsik-hue/Game/actions/'
               'workflows/build-slknight-web.yml/runs?per_page=100')
          req=urllib.request.Request(url,headers={
            'Authorization':'Bearer '+os.environ['GH_TOKEN'],
            'Accept':'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=30) as response:
            runs=json.load(response)['workflow_runs']
          matches=[]
          for run in runs:
            # GitHub can return the workflow path with an @refs/heads/main suffix.
            path=run.get('path','').split('@',1)[0]
            if (run.get('head_sha')==expected_sha and
                run.get('conclusion')=='success' and
                path.endswith('/build-slknight-web.yml')):
              matches.append(run)
          if not matches:
            raise SystemExit('No successful exact R131 run. Refuse to use R121 or R132 instead.')
          run=max(matches,key=lambda r:r['run_number'])
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf8') as f:
            f.write('run_id='+str(run['id'])+'\n')
          print('PASS exact successful R131 run',run['id'])
          PY

      - name: V229R133 Download the intact R131 Pages artifact
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: ${{ steps.base.outputs.run_id }}
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V229R133 Verify the source, 2F artwork and original event coordinates
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          assert len(before)==5566,('Unexpected R131 file count',len(before))
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          data=root/'knight/gameasync/Data'
          expected={
            'Map045.rxdata':'f47de87af6b4e607bf632818a711619dc8ca4e747196a123a76ac7db8ffc3ba6',
            'Map046.rxdata':'dc89d908f5247442e08dddc11f5bcf6505a77890bd82ab59b790e00e3e5f024c'}
          for filename,sha in expected.items():
            path=data/(prefix+filename)
            assert hashlib.sha256(path.read_bytes()).hexdigest()==sha,('Map source mismatch',filename)
          assert 'V229R131' in (root/'index.html').read_text('utf8')
          assert 'V229R131' in (root/'knight/index.html').read_text('utf8')
          assert (data/'Scripts.rxdata').is_file()
          assert (data/(prefix+'Map029.rxdata')).is_file()
          assert (root/'knight/gameasync/Graphics/Characters/바포메트.png').is_file()
          Path('build/before.json').write_text(json.dumps(before,sort_keys=True),encoding='utf8')
          print('PASS R131 map data, original events and smoke-cleaned 2F images kept')
          PY

      - name: V229R133 Remove only the native lookup inverse adjustment
        shell: bash
        run: |
          set -euo pipefail
          cat > build/remove_inverse.rb <<'RUBY'
          require 'zlib'
          path=ARGV.fetch(0)
          scripts=Marshal.load(File.binread(path))
          original=Marshal.load(File.binread(path))
          raise 'Unexpected script count' unless scripts.length==136
          source=Zlib::Inflate.inflate(scripts[134][2])
          inverse="    if mid==45 || mid==46\n      native_u-=12\n      native_v-=6\n    end\n"
          raise 'Wrong inverse lookup baseline' unless source.scan(inverse).length==1
          raise 'Original projection missing' unless source.include?(
            "if mid==45 || mid==46\n      px+=12\n      py+=6\n    end")
          raise 'Original R111 respawn missing' unless source.include?('module SLTI_R111Respawn')
          raise 'Original boss code missing' unless source.include?('module SLV230BossRespawn')
          raise 'Original nearest lookup missing' unless source.include?('def self.nearest(mid,rx,ry,radius=16)')
          modified=source.sub(inverse,'')
          raise 'Unexpected replacement' unless modified.length==source.length-inverse.length
          raise 'Projection changed' unless modified.include?(
            "if mid==45 || mid==46\n      px+=12\n      py+=6\n    end")
          scripts[134][2]=Zlib::Deflate.deflate(modified)
          scripts.each_with_index do |item,index|
            next if index==134
            raise "Unapproved script change #{index}" unless item==original[index]
          end
          File.binwrite(path,Marshal.dump(scripts))
          File.binwrite('build/script134-r133.rb',modified)
          puts 'PASS only nearest() inverse -12,-6 removed; map45/46 display projection unchanged'
          RUBY
          ruby -c build/remove_inverse.rb
          ruby build/remove_inverse.rb site/knight/gameasync/Data/Scripts.rxdata
          ruby -c build/script134-r133.rb

      - name: V229R133 Refresh script cache and verify no other game changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'AUDIT'
          from pathlib import Path
          import hashlib,json,re
          root=Path('site')
          script=root/'knight/gameasync/Data/Scripts.rxdata'
          mapping=root/'knight/gameasync/mapping.js'
          text=mapping.read_text('utf8')
          pattern=r'(Data/Scripts\.rxdata\?h=)[0-9a-f]{32}'
          text,count=re.subn(pattern,lambda m:m.group(1)+hashlib.md5(script.read_bytes()).hexdigest(),text)
          assert count==1,('Missing script cache entry',count)
          mapping.write_text(text,encoding='utf8')
          for name in ('index.html','knight/index.html'):
            path=root/name
            content=path.read_text('utf8')
            assert 'V229R131' in content and 'V229R133' not in content
            path.write_text(content.replace('V229R131','V229R133').replace('v229r131','v229r133'),encoding='utf8')
          runtime=root/'knight/js/sl-assets-v229r115.js'
          content=runtime.read_text('utf8')
          assert content.count("var version='V229R131';")==1
          runtime.write_text(content.replace("var version='V229R131';","var version='V229R133';"),encoding='utf8')
          assert 'js/sl-assets-v229r115.js?v=v229r133' in (root/'knight/index.html').read_text('utf8')
          before=json.loads(Path('build/before.json').read_text('utf8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert before.keys()==after.keys() and len(after)==5566
          changed={name for name in before if before[name]!=after[name]}
          expected={'index.html','knight/index.html','knight/gameasync/mapping.js',
                    'knight/gameasync/Data/Scripts.rxdata','knight/js/sl-assets-v229r115.js'}
          assert changed==expected,('Unexpected source modifications',sorted(changed^expected))
          for name in before:
            if (name.startswith('knight/gameasync/Graphics/') or
                name.startswith('knight/assets/') or
                (name.startswith('knight/gameasync/Data/') and name not in expected) or
                name in ('knight/js/dpad.js','knight/js/drive.js')):
              assert before[name]==after[name],('Protected content modified',name)
          print('PASS exactly 5 changed files: script, mapping cache, two HTML versions and version JS')
          print('PASS player/monster spawns unchanged; Baphomet, passages and original 2F artwork retained')
          AUDIT
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/dpad.js
          node --check site/knight/js/drive.js

      - name: V229R133 Publish unmodified maps with inverse lookup removed
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
