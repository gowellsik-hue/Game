name: "Deploy SLKnight + SLFairy from Proven #60 Base"

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-slknight-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  BASE60_SHA: 75e884598cc5ced1ba9a3f090ee0806367976931
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  FAIRY_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLFairy_Source_v1.zip
  FAIRY_SHA256: 67b88b5fe0cde3c9f2fada889815f9aa7d0fc94b378025529e9950d55151c70e
  FAIRY_7Z_PASSWORD: http://nemo838.tistory.com/
  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake cmake curl ffmpeg freepats git imagemagick libtool make mm-common patch pkg-config python3 rake ruby timidity unzip wget xz-utils fonts-nanum p7zip-full

      - name: Checkout proven run 60 source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.BASE60_SHA }}
          path: baseline60

      - name: Checkout clean mkxp-web source
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.MKXP_SRC_REF }}
          path: engine

      - name: Extract exact successful run 60 steps
        run: |
          ruby -ryaml - <<'RB'
          doc=YAML.load_file('baseline60/.github/workflows/build-slknight-web.yml')
          steps=doc.fetch('jobs').fetch('build').fetch('steps')
          wanted={
            'Patch engine 800x600 50fps'=>'/tmp/base60_patch_engine.sh',
            'Build patched mkxp-web engine'=>'/tmp/base60_build_engine.sh',
            'Download and install game'=>'/tmp/base60_install_knight.sh',
            'Patch game scripts and data'=>'/tmp/base60_patch_knight.sh',
            'Convert media'=>'/tmp/base60_convert_media.sh',
            'Build async mappings'=>'/tmp/base60_mapping.sh',
            'Build Emscripten preload package'=>'/tmp/base60_preload.sh',
            'Patch browser save controls audio and layout'=>'/tmp/base60_browser.sh'
          }
          wanted.each do |name,path|
            step=steps.find{|s|s['name']==name}
            abort "BASE60_STEP_MISSING #{name}" unless step && step['run']
            File.write(path,"set -euo pipefail\n"+step['run']+"\n")
          end
          puts 'BASE60_EXTRACT_OK'
          RB
          for f in /tmp/base60_*.sh; do bash -n "$f"; done

      - name: Patch engine exactly like successful run 60
        run: bash /tmp/base60_patch_engine.sh

      - name: Build engine exactly like successful run 60
        run: bash /tmp/base60_build_engine.sh

      - name: Build Knight base exactly like successful run 60
        run: |
          bash /tmp/base60_install_knight.sh
          bash /tmp/base60_patch_knight.sh
          cp player/gameasync/Data/Scripts.rxdata /tmp/knight-base60-scripts.rxdata
          echo KNIGHT_BASE60_GAME_PATCH_OK

      - name: Apply later successful mobile runtime fixes to Knight
        run: |
          cat > /tmp/patch_knight_mobile.rb <<'RB'
          # encoding: UTF-8
          require 'zlib'
          root = ARGV.fetch(0)
          path = File.join(root, 'gameasync', 'Data', 'Scripts.rxdata')
          scripts = Marshal.load(File.binread(path))

          def entry_for(scripts, name)
            e = scripts.find { |x| x.is_a?(Array) && x.length >= 3 && x[1].to_s == name }
            abort "missing script #{name}" unless e
            e
          end
          def src(e); Zlib::Inflate.inflate(e[2]).force_encoding(Encoding::UTF_8); end
          def put(e, s); e[2] = Zlib::Deflate.deflate(s); end

          map = entry_for(scripts, 'Scene_Map')
          text = src(map)
          unless text.include?('SLMOBILE_MAP_UNLOCK')
            n=0
            text=text.sub(/  def main\r?\n/){n+=1;"  def main\n    $game_switches[49] = false\n    puts('SLMOBILE_MAP_UNLOCK')\n"}
            abort "Scene_Map main patch=#{n}" unless n==1
          end
          text.gsub!(/     if \$game_switches\[49\] == false\r?\n     Input\.update\s*\r?\n     end\r?\n/, "     Input.update\n")
          text.gsub!('if Keyboard.testkey(9) &&', 'if (Keyboard.testkey(9) || Input.trigger?(Input::Y)) &&')
          text.gsub!('&& Keyboard.testkey(69) &&', '&& (Keyboard.testkey(69) || Input.trigger?(Input::X)) &&')
          put(map,text)

          equip=entry_for(scripts,'Scene_Equip')
          text=src(equip)
          text.gsub!('$game_switches[49] = true','$game_switches[49] = false')
          put(equip,text)

          save=entry_for(scripts,'Scene_Save')
          text=src(save)
          unless text.include?('SLSAVE_UNLOCK')
            text.sub!('    save_file_async(filename)', "    save_file_async(filename)\n    $game_switches[49] = false\n    puts('SLSAVE_UNLOCK')") or abort 'save async marker missing'
            if text.match?(/  def on_cancel\r?\n/)
              text.sub!(/  def on_cancel\r?\n/, "  def on_cancel\n    $game_switches[49] = false\n")
            end
          end
          text.gsub!('$scene = Scene_Menu.new(4)', '$scene = Scene_Map.new')
          put(save,text)

          scripts.each do |e|
            next unless e.is_a?(Array)&&e.length>=3
            begin; t=src(e); rescue; next; end
            put(e,"# web: XRXS menu transparency disabled\n") if t.include?('XRXS_MP7_Module')
          end

          assist = <<'RUBY'
          $mobile_auto_attack_active = false
          $mobile_auto_attack_event_id = 0
          $mobile_auto_attack_cooldown = 0

          class Game_Event
            def sl_mobile_enemy_event?
              event_data = instance_variable_get(:@event)
              page_data = instance_variable_get(:@page)
              erased = instance_variable_get(:@erased)
              return false if event_data == nil || page_data == nil || erased
              name = event_data.instance_variable_get(:@name).to_s
              return false unless name[0,3] == "[ID"
              return false if self.through
              return false unless self.trigger == 2
              true
            end
          end

          class Interpreter
            alias sl_mobile_original_command_111 command_111
            def command_111
              if $mobile_auto_attack_active && @event_id == $mobile_auto_attack_event_id && @parameters[0] == 11 && @parameters[1] == 13
                $mobile_auto_attack_active = false
                @branch[@list[@index].indent] = true
                @branch.delete(@list[@index].indent)
                return true
              end
              sl_mobile_original_command_111
            end
          end

          class Game_System
            def sl_quick_items
              @sl_quick_items = [114, 3, 17, 2] if @sl_quick_items == nil
              @sl_quick_items
            end
            def sl_quick_items=(v); @sl_quick_items = v; end
          end

          module SLMobileQuick
            def self.emit_labels
              $game_system.sl_quick_items.each_with_index do |id,i|
                item=(id.to_i>0 && $data_items) ? $data_items[id.to_i] : nil
                name=item ? item.name.to_s.gsub('|','/') : '비어있음'
                puts('SLQS|'+(i+1).to_s+'|'+name)
              end
            end
            def self.use(slot)
              return if $game_party == nil || $game_system == nil
              id=$game_system.sl_quick_items[slot].to_i
              item=(id>0 && $data_items) ? $data_items[id] : nil
              unless item && item.is_a?(RPG::Item) && $game_party.item_number(id)>0
                $game_system.se_play($data_system.buzzer_se) if $data_system
                return
              end
              if id == 114
                if $game_switches[367] == true && $game_party.item_number(114) >= 1
                  $game_party.lose_item(114,1)
                  $game_temp.common_event_id=2
                  if $game_switches[1081] == true && defined?($p) && $p
                    $p.drawPHP($game_party.actors[0].hp,$game_party.actors[0].maxhp,$game_party.actors[0].sp,$game_party.actors[0].maxsp)
                  end
                  $KeyIcon.ShowIcon if defined?($KeyIcon) && $KeyIcon
                else
                  $game_system.se_play($data_system.buzzer_se)
                end
                return
              end
              unless $game_party.item_can_use?(id)
                $game_system.se_play($data_system.buzzer_se)
                return
              end
              used=false
              if item.scope>=3
                if item.scope==4 || item.scope==6
                  for actor in $game_party.actors; used |= actor.item_effect(item); end
                else
                  actor=$game_party.actors[0]
                  used=actor ? actor.item_effect(item) : false
                end
              elsif item.common_event_id>0
                used=true
              end
              if used
                $game_system.se_play(item.menu_se)
                $game_party.lose_item(id,1) if item.consumable
                $game_temp.common_event_id=item.common_event_id if item.common_event_id>0
                $KeyIcon.ShowIcon if defined?($KeyIcon) && $KeyIcon
                Guage.show if defined?(Guage)
              else
                $game_system.se_play($data_system.buzzer_se)
              end
            end
          end

          class Scene_MobileQuick
            def initialize(slot_index=0); @slot_index=slot_index; end
            def main
              @help_window=Window_Help.new
              @help_window.set_text('빠른슬롯을 선택한 뒤 소지 아이템을 지정하세요.')
              build_slot_window
              @item_window=Window_Item.new
              @item_window.help_window=@help_window
              @item_window.active=false
              @item_window.visible=false
              Graphics.transition
            end
            def build_slot_window
              old_index=@slot_window ? @slot_window.index : @slot_index
              @slot_window.dispose if @slot_window
              names=[]
              $game_system.sl_quick_items.each_with_index do |id,i|
                item=(id.to_i>0 && $data_items) ? $data_items[id.to_i] : nil
                names << "#{i+1}. #{item ? item.name.to_s : '비어 있음'}"
              end
              @slot_window=Window_Command.new(300,names)
              @slot_window.x=0; @slot_window.y=64
              @slot_window.index=[[old_index,0].max,3].min
            end
            def dispose
              Graphics.freeze
              @help_window.dispose if @help_window
              @slot_window.dispose if @slot_window
              @item_window.dispose if @item_window
            end
            def update
              @help_window.update; @slot_window.update; @item_window.update
              if @slot_window.active
                if Input.trigger?(Input::B)
                  $game_system.se_play($data_system.cancel_se); $scene=Scene_Map.new; return
                end
                if Input.trigger?(Input::C)
                  $game_system.se_play($data_system.decision_se)
                  @slot_index=@slot_window.index
                  @slot_window.active=false; @item_window.visible=true; @item_window.active=true; @item_window.index=0
                  @help_window.set_text('이 슬롯에 넣을 소지 아이템을 선택하세요.'); return
                end
              else
                if Input.trigger?(Input::B)
                  $game_system.se_play($data_system.cancel_se)
                  @item_window.active=false; @item_window.visible=false; @slot_window.active=true
                  @help_window.set_text('빠른슬롯을 선택한 뒤 소지 아이템을 지정하세요.'); return
                end
                if Input.trigger?(Input::C)
                  item=@item_window.item
                  unless item && item.is_a?(RPG::Item)
                    $game_system.se_play($data_system.buzzer_se); return
                  end
                  $game_system.sl_quick_items[@slot_index]=item.id
                  $game_system.se_play($data_system.decision_se)
                  @item_window.active=false; @item_window.visible=false
                  build_slot_window; @slot_window.active=true
                  @help_window.set_text('지정 완료. 다른 슬롯도 설정할 수 있습니다.')
                  SLMobileQuick.emit_labels; return
                end
              end
            end
          end

          class Game_Player
            alias sl_mobile_original_update update
            def update
              sl_mobile_original_update
              $mobile_auto_attack_cooldown-=1 if $mobile_auto_attack_cooldown>0
              $mobile_auto_attack_active=false if $mobile_auto_attack_active && $mobile_auto_attack_cooldown<=8
              return if moving? || @move_route_forcing
              return if $game_temp.message_window_showing
              return if $game_system.map_interpreter.running?
              return if $game_switches[743]
              return if $mobile_auto_attack_cooldown>0
              target=nil
              for event in $game_map.events.values
                next unless event.sl_mobile_enemy_event?
                dx=event.x-self.x; dy=event.y-self.y
                if dx.abs+dy.abs==1; target=event; break; end
              end
              return if target==nil
              dx=target.x-self.x; dy=target.y-self.y
              dx>0 ? turn_right : dx<0 ? turn_left : dy>0 ? turn_down : turn_up
              target.turn_toward_player
              $mobile_auto_attack_event_id=target.id
              $mobile_auto_attack_active=true
              $mobile_auto_attack_cooldown=20
              target.start
            end
          end

          class Scene_Map
            alias sl_mobile_quick_main main
            def main; SLMobileQuick.emit_labels; sl_mobile_quick_main; end
            alias sl_mobile_quick_update update
            def update
              if Input.trigger?(Input::F5); $scene=Scene_MobileQuick.new; return; end
              SLMobileQuick.use(0) if Input.trigger?(Input::F6)
              SLMobileQuick.use(1) if Input.trigger?(Input::F7)
              SLMobileQuick.use(2) if Input.trigger?(Input::F8)
              SLMobileQuick.use(3) if Input.trigger?(Input::F9)
              sl_mobile_quick_update
            end
          end
          RUBY

          scripts.reject!{|e|e.is_a?(Array)&&e[1].to_s=='Mobile Diablo Assist'}
          main_index=scripts.index{|e|e.is_a?(Array)&&e.length>=3&&e[1].to_s=='Main'}
          abort 'Main script missing for mobile assist' unless main_index
          scripts.insert(main_index,[99999991,'Mobile Diablo Assist',Zlib::Deflate.deflate(assist)])
          File.binwrite(path,Marshal.dump(scripts))
          puts 'KNIGHT_MOBILE_RUNTIME_OK'
          RB
          ruby -c /tmp/patch_knight_mobile.rb
          ruby -EUTF-8:UTF-8 /tmp/patch_knight_mobile.rb player

      - name: Finish Knight with successful run 60 media mapping preload browser
        run: |
          bash /tmp/base60_convert_media.sh
          bash /tmp/base60_mapping.sh
          bash /tmp/base60_preload.sh
          bash /tmp/base60_browser.sh

      - name: Install latest successful custom mobile UI
        run: |
          cat > /tmp/mobile-ui.js <<'JS'
          function simulateKeyEvent(eventType,keyCode,charCode){var e=document.createEventObject?document.createEventObject():document.createEvent('Events');if(e.initEvent)e.initEvent(eventType,true,true);e.keyCode=keyCode;e.which=keyCode;e.charCode=charCode||0;if(typeof JSEvents!=='undefined'&&JSEvents.eventHandlers&&JSEvents.eventHandlers.length>0){for(var i=0;i<JSEvents.eventHandlers.length;++i){var h=JSEvents.eventHandlers[i];if((h.target==Module['canvas']||h.target==window)&&h.eventTypeString==eventType)h.handlerFunc(e);}}else if(typeof Module!=='undefined'&&Module['canvas']){Module['canvas'].dispatchEvent?Module['canvas'].dispatchEvent(e):Module['canvas'].fireEvent('on'+eventType,e);}}
          const slKeysDown=new Set();
          function slKeyDown(code){if(slKeysDown.has(code))return;slKeysDown.add(code);simulateKeyEvent('keydown',code,0);}
          function slKeyUp(code){if(!slKeysDown.has(code))return;slKeysDown.delete(code);simulateKeyEvent('keyup',code,0);}
          function slTapKey(code){slKeyDown(code);setTimeout(function(){slKeyUp(code);},90);}
          function bindKey(elem,key){const node=document.getElementById(elem);if(!node)return;node.addEventListener('pointerdown',function(e){e.preventDefault();if(node.setPointerCapture)node.setPointerCapture(e.pointerId);slKeyDown(key);node.classList.add('active');});const release=function(e){if(e&&e.preventDefault)e.preventDefault();slKeyUp(key);node.classList.remove('active');};node.addEventListener('pointerup',release);node.addEventListener('pointercancel',release);node.addEventListener('lostpointercapture',release);}
          function is_touch_device(){return('ontouchstart'in window)||(navigator.maxTouchPoints>0);}
          const resize=function(){const el=document.getElementById('canvas');if(!el)return;if(window.innerHeight>window.innerWidth){el.style.height='unset';el.style.width='100%';}else{el.style.width='unset';el.style.height='100%';}};
          window.addEventListener('resize',resize);window.addEventListener('load',resize);
          window.slSetQuickLabel=function(slot,label){const node=document.getElementById('sl-q'+String(slot));if(!node)return;const text=String(label||'').trim();node.textContent=text.length>8?text.slice(0,8):(text||String(slot));node.title=text;};
          function initSLMobileControls(){const ui=document.getElementById('sl-mobile-ui');if(!ui)return;if(!is_touch_device()){ui.style.display='none';resize();return;}const joy=document.getElementById('sl-joystick');const knob=document.getElementById('sl-joy-knob');let joyPointer=null;const arrows=[37,38,39,40];function setArrows(next){arrows.forEach(function(code){if(next.indexOf(code)>=0)slKeyDown(code);else slKeyUp(code);});}function updateJoy(e){const r=joy.getBoundingClientRect();const cx=r.left+r.width/2;const cy=r.top+r.height/2;let dx=e.clientX-cx;let dy=e.clientY-cy;const max=Math.max(34,r.width*0.31);const len=Math.hypot(dx,dy)||1;const scale=Math.min(1,max/len);dx*=scale;dy*=scale;knob.style.transform='translate('+dx+'px,'+dy+'px)';const nx=dx/max,ny=dy/max,next=[];if(Math.abs(nx)>0.28)next.push(nx>0?39:37);if(Math.abs(ny)>0.28)next.push(ny>0?40:38);setArrows(next);}joy.addEventListener('pointerdown',function(e){e.preventDefault();joyPointer=e.pointerId;if(joy.setPointerCapture)joy.setPointerCapture(e.pointerId);updateJoy(e);});joy.addEventListener('pointermove',function(e){if(e.pointerId!==joyPointer)return;e.preventDefault();updateJoy(e);});function endJoy(e){if(joyPointer!==null&&e&&e.pointerId!==undefined&&e.pointerId!==joyPointer)return;joyPointer=null;setArrows([]);knob.style.transform='translate(0px,0px)';}joy.addEventListener('pointerup',endJoy);joy.addEventListener('pointercancel',endJoy);joy.addEventListener('lostpointercapture',endJoy);bindKey('sl-confirm',67);bindKey('sl-cancel',88);bindKey('sl-bag',83);bindKey('sl-equip',65);const config=document.getElementById('sl-config');if(config){config.addEventListener('pointerdown',function(e){e.preventDefault();config.classList.add('active');slTapKey(116);});config.addEventListener('pointerup',function(){config.classList.remove('active');});config.addEventListener('pointercancel',function(){config.classList.remove('active');});}[117,118,119,120].forEach(function(code,index){const button=document.getElementById('sl-q'+String(index+1));if(!button)return;button.addEventListener('pointerdown',function(e){e.preventDefault();button.classList.add('active');slTapKey(code);});button.addEventListener('pointerup',function(){button.classList.remove('active');});button.addEventListener('pointercancel',function(){button.classList.remove('active');});});resize();}
          JS
          node --check /tmp/mobile-ui.js
          cp /tmp/mobile-ui.js player/js/dpad.js

          cat > /tmp/inject_mobile_ui.rb <<'RB'
          path,title=ARGV
          html=File.read(path)
          return_marker='sl-mobile-success-ui'
          exit 0 if html.include?(return_marker)
          css=<<'CSS'
          <style id="sl-mobile-success-ui">
          #dpad,#apad{display:none!important}
          #sl-mobile-ui{position:fixed;inset:0;z-index:5000;pointer-events:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
          #sl-joystick{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:178px;height:178px;border-radius:50%;pointer-events:auto;touch-action:none}
          #sl-joy-base{position:absolute;inset:19px;border-radius:50%;border:2px solid rgba(255,255,255,.34);background:rgba(0,0,0,.20);box-shadow:inset 0 0 22px rgba(0,0,0,.25)}
          #sl-joy-knob{position:absolute;left:54px;top:54px;width:70px;height:70px;border-radius:50%;border:2px solid rgba(255,255,255,.66);background:rgba(35,35,35,.64);box-shadow:0 3px 14px rgba(0,0,0,.45);transform:translate(0,0)}
          #sl-actions{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));width:290px;height:205px;pointer-events:none}
          .sl-btn{position:absolute;box-sizing:border-box;border-radius:50%;border:2px solid rgba(255,255,255,.48);background:rgba(0,0,0,.42);color:#fff;font:600 12px system-ui,sans-serif;pointer-events:auto;touch-action:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .sl-btn.active{transform:scale(.93);background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.9)}
          #sl-confirm{width:84px;height:84px;right:0;bottom:0;font-size:15px}#sl-cancel{width:60px;height:60px;right:94px;bottom:4px}#sl-bag{width:54px;height:54px;right:7px;bottom:96px}#sl-equip{width:54px;height:54px;right:70px;bottom:116px}#sl-config{width:42px;height:42px;right:160px;bottom:62px;font-size:17px}
          #sl-q1,#sl-q2,#sl-q3,#sl-q4{width:54px;height:54px;bottom:148px;font-size:10px;padding:2px}#sl-q1{right:228px}#sl-q2{right:171px}#sl-q3{right:114px}#sl-q4{right:57px}
          @media(orientation:portrait){#sl-joystick{width:154px;height:154px}#sl-joy-base{inset:17px}#sl-joy-knob{left:47px;top:47px;width:60px;height:60px}#sl-actions{transform:scale(.86);transform-origin:right bottom}}
          </style>
          CSS
          controls=<<'HTML'
          <div id="sl-mobile-ui">
            <div id="sl-joystick"><div id="sl-joy-base"></div><div id="sl-joy-knob"></div></div>
            <div id="sl-actions">
              <button id="sl-q1" class="sl-btn">1</button><button id="sl-q2" class="sl-btn">2</button><button id="sl-q3" class="sl-btn">3</button><button id="sl-q4" class="sl-btn">4</button>
              <button id="sl-config" class="sl-btn">⚙</button><button id="sl-bag" class="sl-btn">가방</button><button id="sl-equip" class="sl-btn">장비</button><button id="sl-cancel" class="sl-btn">취소</button><button id="sl-confirm" class="sl-btn">확인</button>
            </div>
          </div>
          <script>window.addEventListener('load',function(){if(window.initSLMobileControls)window.initSLMobileControls();});</script>
          HTML
          html.sub!('</head>',css+"\n</head>") or abort 'head close missing'
          html.sub!('</body>',controls+"\n</body>") or abort 'body close missing'
          File.write(path,html)
          puts "MOBILE_UI_INJECT_OK #{title}"
          RB
          ruby /tmp/inject_mobile_ui.rb player/index.html SLKnight
          node --check player/js/dpad.js
          grep -Fq 'id="sl-joystick"' player/index.html
          grep -Fq 'initSLMobileControls' player/js/dpad.js
