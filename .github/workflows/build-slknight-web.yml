name: build-slknight-web.yml | V3.14 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Restore exact V3.13 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45413629181
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Restore original SPR audit
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45347986505
          name: audit-sanctuary-monsters-v46-all-spr-audit
          github-token: ${{ github.token }}
          path: audit

      - name: Restore verified V3.13 source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: 9b584b5ab994e1d48c8f50b376e063f783e71d22
          path: verified-v313

      - name: Restore verified original SPR decoder
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: e2dfa04c9aecac1431aaf48637a138bb5b6c9a62
          path: verified-v37

      - name: Restore existing source processing steps
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow=Path(
              'verified-v313/.github/workflows/build-slknight-web.yml'
          ).read_text('utf8')

          def run_block(name):

              marker='      - name: '+name+'\n'

              assert workflow.count(marker)==1,name

              section=workflow.split(
                  marker,1
              )[1].split(
                  '\n      - name: ',1
              )[0]

              marker='        run: |\n'

              assert section.count(marker)==1,name

              return textwrap.dedent(
                  section.split(marker,1)[1]
              ).rstrip()+'\n'

          verify=run_block(
              'Verify baseline and all eight character sources'
          )

          assert verify.count(
              'len(before)==6013'
          )==1

          assert verify.count('V3.11')==2

          verify=verify.replace(
              'len(before)==6013',
              'len(before)==6018'
          ).replace(
              'V3.11','V3.13'
          )

          Path('/tmp/slv314_verify.sh').write_text(
              verify,'utf8'
          )

          Path('/tmp/slv314_restore.sh').write_text(
              run_block('Restore original SPR archive'),
              'utf8'
          )

          Path('/tmp/slv314_decoder.sh').write_text(
              run_block('Restore existing coordinate decoder'),
              'utf8'
          )

          original=run_block(
              'Composite all eight original character sheets'
          )

          marker="cat > /tmp/slv313_graphics.py <<'PY'\n"

          assert original.count(marker)==1

          source=original.split(
              marker,1
          )[1].split(
              '\nPY\n',1
          )[0]

          compile(source,'original-v313','exec')

          Path('/tmp/slv314_original_graphics.py').write_text(
              source+'\n','utf8'
          )

          print('PASS exact V3.13 source processing restored')
          PY

          bash -n /tmp/slv314_verify.sh
          bash -n /tmp/slv314_restore.sh
          bash -n /tmp/slv314_decoder.sh

          bash /tmp/slv314_verify.sh

      - name: Restore original body and shadow SPR data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          bash /tmp/slv314_restore.sh
          bash /tmp/slv314_decoder.sh

      - name: Correct existing character ground alignment
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source=Path(
              '/tmp/slv314_original_graphics.py'
          ).read_text('utf8')

          start_marker='            head=[\n'
          end_marker='            relative_body={'

          assert source.count(start_marker)==1
          assert source.count(end_marker)==1

          start=source.index(start_marker)
          end=source.index(end_marker,start)

          original=source[start:end]

          assert 'if y<y0+12' in original
          assert 'ay=y1+1' in original
          assert 'assert head' in original

          replacement=textwrap.indent(
              textwrap.dedent('''
              support=[
                  y
                  for x,y in body
                  if (x+1,y) in body
              ]

              assert support,(name,sub,col)

              ay=max(support)+1

              feet=[
                  (x,y)
                  for x,y in body
                  if ay-8<=y<ay
              ]

              assert feet,(name,sub,col)

              ax=(
                  min(x for x,y in feet)
                  +max(x for x,y in feet)
                  +1
              )//2

              print(
                  'GROUND_ANCHOR',
                  name,sub,col,
                  ax,ay
              )

              ''').lstrip('\n'),
              '            '
          )

          source=(
              source[:start]
              +replacement
              +source[end:]
          )

          start_marker=(
              "    if graphic in "
              "('knight_men','여요정','법사'):"
          )

          end_marker='    path=game/rel'

          assert source.count(start_marker)==1
          assert source.count(end_marker)==1

          start=source.index(start_marker)
          end=source.index(end_marker,start)

          original=source[start:end]

          assert 'assert not matches,graphic' in original

          replacement=(
              "    assert len(matches)==1,(graphic,matches)\n"
              "    rel=matches[0]\n"
              "    assert (game/rel).is_file()\n\n"
          )

          source=(
              source[:start]
              +replacement
              +source[end:]
          )

          old='    result.save(path,optimize=True)\n'

          assert source.count(old)==1

          replacement=textwrap.indent(
              textwrap.dedent('''
              with Image.open(path) as image:
                  previous=image.convert('RGBA')

              assert previous.width%n==0
              assert previous.height%4==0

              old_cw=previous.width//n
              old_ch=previous.height//4

              assert old_ch==96,(
                  name,previous.size
              )

              verified=0

              for row in range(4):

                  for col in range(n):

                      old_cell=previous.crop((
                          col*old_cw,
                          row*old_ch,
                          (col+1)*old_cw,
                          (row+1)*old_ch
                      ))

                      new_cell=result.crop((
                          col*cw,
                          row*ch,
                          (col+1)*cw,
                          (row+1)*ch
                      ))

                      old_bounds=old_cell.getchannel(
                          'A'
                      ).getbbox()

                      new_bounds=new_cell.getchannel(
                          'A'
                      ).getbbox()

                      assert old_bounds and new_bounds,(
                          name,row,col
                      )

                      old_sprite=old_cell.crop(
                          old_bounds
                      )

                      new_sprite=new_cell.crop(
                          new_bounds
                      )

                      assert old_sprite.size==new_sprite.size,(
                          name,row,col,
                          'Original sprite size changed'
                      )

                      assert old_sprite.tobytes()==new_sprite.tobytes(),(
                          name,row,col,
                          'Original composite pixels changed'
                      )

                      verified+=1

                      print(
                          'CENTER',
                          name,row,col,
                          'before',old_bounds,
                          'after',new_bounds
                      )

              assert verified==4*n

              if previous.size!=result.size or previous.tobytes()!=result.tobytes():

                  result.save(path,optimize=True)

              print(
                  'PASS',
                  name,
                  verified,
                  'original frames preserved'
              )
              ''').lstrip('\n'),
              '    '
          )

          source=source.replace(
              old,replacement
          )

          old="        'height':ch*4\n"

          assert source.count(old)==1

          source=source.replace(
              old,
              "        'height':ch*4,\n"
              "        'ground':ground\n"
          )

          compile(
              source,
              'slv314_graphics',
              'exec'
          )

          Path('/tmp/slv314_graphics.py').write_text(
              source,'utf8'
          )

          print('PASS existing compositor directly modified')
          PY

          /tmp/slv313-venv/bin/python \
            -m py_compile /tmp/slv314_graphics.py

          /tmp/slv313-venv/bin/python \
            /tmp/slv314_graphics.py

          python3 - <<'PY'
          from pathlib import Path
          import json

          manifest=json.loads(
              Path('/tmp/slv313-graphics.json').read_text('utf8')
          )

          assert len(manifest)==8

          assert len({
              row['graphic']
              for row in manifest
          })==8

          assert sum(
              row['frames']*4
              for row in manifest
          )==160

          grounds={
              row['ground']
              for row in manifest
          }

          assert len(grounds)==1

          ground=grounds.pop()

          assert ground>=17

          print('PASS all eight characters aligned')
          print('PASS 160 original composite frames preserved')
          print('COMMON_GROUND',ground)
          PY

      - name: Correct existing companion separation conditions
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/slv314.rb <<'RUBY'
          require 'zlib'
          require 'json'
          require 'digest'

          def check(ok,message)
            raise message unless ok
          end

          def utf(value)
            value.to_s.dup.force_encoding('UTF-8')
          end

          def rep(source,old,new,label)
            count=source.scan(old).size
            check(count==1,"#{label}: expected one match, got #{count}")
            source.sub(old,new)
          end

          def edit_script(rows,name)

            matches=rows.select do |row|
              row.is_a?(Array) && utf(row[1])==name
            end

            check(
              matches.size==1,
              "#{name}: original script not unique"
            )

            row=matches.first

            original=Zlib::Inflate.inflate(
              row[2]
            ).force_encoding('UTF-8')

            check(
              original.valid_encoding?,
              "#{name}: invalid encoding"
            )

            crlf=original.include?("\r\n")

            source=original.gsub(
              "\r\n","\n"
            )

            updated=yield(source)

            check(
              source!=updated,
              "#{name}: no changes"
            )

            RubyVM::InstructionSequence.compile(
              updated
            )

            row[2]=Zlib::Deflate.deflate(
              crlf ? updated.gsub("\n","\r\n").b : updated.b
            )
          end

          root='site/knight/gameasync'

          path=root+'/Data/Scripts.rxdata'

          rows=Marshal.load(
            File.binread(path)
          )

          check(
            rows.size==137,
            "Original script count #{rows.size}"
          )

          original_rows=rows.map do |row|
            row.is_a?(Array) ? row.dup : row
          end

          edit_script(rows,'Game_Character 3') do |source|

            first=source.index(
              '  def move_toward_player'
            )

            check(
              !first.nil?,
              'Original chase method missing'
            )

            last=source.index(
              '  def move_away_from_player',
              first
            )

            check(
              !last.nil?,
              'Original chase boundary missing'
            )

            original=source[first...last]

            method=original.dup

            check(
              method.include?('return if @sl_healer_teleport'),
              'Original teleport guard missing'
            )

            check(
              method.include?('return if d <= 5'),
              'Original chase distance missing'
            )

            check(
              method.include?('if d <= 2'),
              'Original separation distance missing'
            )

            old="if d <= 1 || outside || (@event.name.to_s.start_with?('동료 ') && $game_map.events.values.any? { |e| e != self && e.character_name != '' && e.x == @x && e.y == @y && e.instance_variable_get(:@event) && (e.instance_variable_get(:@event).name == '[ID힐러 마법사]' || e.instance_variable_get(:@event).name.to_s.start_with?('동료 ')) })"

            new="if d <= 1 || outside || $game_map.events.values.any? { |e| e != self && e.character_name != '' && e.instance_variable_get(:@event) && (e.instance_variable_get(:@event).name == '[ID힐러 마법사]' || e.instance_variable_get(:@event).name.to_s.start_with?('동료 ')) && e.instance_variable_get(:@id) < @id && (e.x-@x).abs <= 1 && (e.y-@y).abs <= 1 }"

            method=rep(
              method,
              old,
              new,
              'Original companion overlap condition'
            )

            old="e != self && e.character_name != '' && ((e.x == tx && e.y == ty) || (e.instance_variable_get(:@sl_healer_teleport) && e.instance_variable_get(:@sl_healer_teleport)[0,2] == [tx,ty]))"

            new="e != self && e.character_name != '' && ((e.instance_variable_get(:@event) && (e.instance_variable_get(:@event).name == '[ID힐러 마법사]' || e.instance_variable_get(:@event).name.to_s.start_with?('동료 '))) ? (((e.x-tx).abs <= 1 && (e.y-ty).abs <= 1) || (e.instance_variable_get(:@sl_healer_teleport) && (e.instance_variable_get(:@sl_healer_teleport)[0]-tx).abs <= 1 && (e.instance_variable_get(:@sl_healer_teleport)[1]-ty).abs <= 1)) : ((e.x == tx && e.y == ty) || (e.instance_variable_get(:@sl_healer_teleport) && e.instance_variable_get(:@sl_healer_teleport)[0,2] == [tx,ty])))"

            method=rep(
              method,
              old,
              new,
              'Original occupied and reserved destination condition'
            )

            check(
              method.include?('return if d <= 5'),
              'Original chase distance changed'
            )

            check(
              method.include?('if d <= 2'),
              'Original player separation changed'
            )

            check(
              method.scan('@sl_healer_teleport = [tx, ty, Graphics.frame_count]').size==1,
              'Original teleport assignment changed'
            )

            rep(
              source,
              original,
              method,
              'Existing follower movement method'
            )
          end

          manifest=JSON.parse(
            File.read('/tmp/slv313-graphics.json')
          )

          check(
            manifest.size==8,
            'Character manifest count differs'
          )

          grounds=manifest.map do |row|
            Integer(row.fetch('ground'))
          end.uniq

          check(
            grounds.size==1,
            'Different character ground offsets'
          )

          ground=grounds.first

          expected=['Game_Character 3']

          if ground!=17

            names=manifest.map do |row|
              row.fetch('graphic')
            end

            edit_script(rows,'Sprite_Character') do |source|

              old="        self.oy = @ch\n"

              new="        self.oy = @ch + (#{names.inspect}.include?(@character_name) ? #{17-ground} : 0)\n"

              rep(
                source,
                old,
                new,
                'Existing character vertical origin'
              )
            end

            expected << 'Sprite_Character'
          end

          changed=rows.each_index.select do |i|
            rows[i]!=original_rows[i]
          end.map do |i|
            utf(rows[i][1])
          end.sort

          check(
            changed==expected.sort,
            "Unexpected script changes #{changed.inspect}"
          )

          File.binwrite(
            path,
            Marshal.dump(rows)
          )

          check(
            Marshal.load(File.binread(path))==rows,
            'Script serialization differs'
          )

          puts 'PASS existing overlap condition extended'
          puts 'PASS all seven followers use separation'
          puts 'PASS neighboring tile occupancy checked'
          puts 'PASS reserved teleport destinations checked'
          puts 'PASS lower event ID retains position'
          puts 'PASS original chase distance retained'
          puts 'PASS original teleport path retained'
          puts 'PASS original movement and animation rates retained'
          puts "PASS changed scripts #{changed.inspect}"
          RUBY

          ruby -c /tmp/slv314.rb
          ruby /tmp/slv314.rb

      - name: Verify separation predicates
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/slv314_test.rb <<'RUBY'
          require 'zlib'

          Event=Struct.new(:name)

          class TestCharacter

            attr_accessor :x,:y,:character_name

            def initialize(id,name,x,y,pending=nil,graphic='test')

              @id=id
              @event=Event.new(name)
              @x=x
              @y=y
              @character_name=graphic
              @sl_healer_teleport=pending
            end
          end

          rows=Marshal.load(
            File.binread(
              'site/knight/gameasync/Data/Scripts.rxdata'
            )
          )

          row=rows.find do |r|
            r.is_a?(Array) &&
            r[1].to_s.dup.force_encoding('UTF-8')=='Game_Character 3'
          end

          raise 'Original script missing' unless row

          source=Zlib::Inflate.inflate(
            row[2]
          ).force_encoding('UTF-8')

          first=source.index(
            '  def move_toward_player'
          )

          last=source.index(
            '  def move_away_from_player',
            first
          )

          method=source[first...last]

          overlaps=method.lines.select do |line|
            line.include?('if d <= 1 || outside ||') &&
            line.include?('e.instance_variable_get(:@id) < @id')
          end

          raise 'Overlap condition missing' unless overlaps.size==1

          overlap=overlaps.first.strip.sub(
            'if d <= 1 || outside || ',
            ''
          ).sub(
            '$game_map.events.values',
            'events'
          )

          marker="e != self && e.character_name != '' && ((e.instance_variable_get(:@event)"

          occupied=method.lines.select do |line|
            line.include?(marker)
          end

          raise 'Destination condition missing' unless occupied.size==1

          line=occupied.first

          start=line.index(marker)

          expression=line[start..-1].strip

          depth=0
          finish=nil

          expression.each_char.with_index do |ch,i|

            depth+=1 if ch=='('
            depth-=1 if ch==')'

            if ch==')' && depth==0
              finish=i
              break
            end
          end

          raise 'Destination expression boundary missing' unless finish

          expression=expression[0..finish]

          TestCharacter.class_eval(
            "def overlap(events)\n#{overlap}\nend"
          )

          TestCharacter.class_eval(
            "def blocked(events,tx,ty)\nevents.any? { |e| #{expression} }\nend"
          )

          healer=TestCharacter.new(
            1,'[ID힐러 마법사]',0,0
          )

          fairy=TestCharacter.new(
            2,'동료 여요정',0,1
          )

          knight=TestCharacter.new(
            3,'동료 여기사',5,5,[2,2,10]
          )

          npc=TestCharacter.new(
            4,'NPC',8,8
          )

          hidden=TestCharacter.new(
            5,'동료 남요정',1,1,nil,''
          )

          def check(ok,label)

            raise "FAIL #{label}" unless ok

            puts "PASS #{label}"
          end

          check(
            fairy.overlap([healer,fairy]),
            'Neighboring follower detected'
          )

          check(
            !healer.overlap([healer,fairy]),
            'Lower event ID retains position'
          )

          check(
            fairy.blocked([healer],1,1),
            'Adjacent destination rejected'
          )

          check(
            !fairy.blocked([healer],2,0),
            'Separated destination accepted'
          )

          check(
            fairy.blocked([knight],3,3),
            'Adjacent reserved destination rejected'
          )

          check(
            fairy.blocked([npc],8,8),
            'Original NPC occupancy retained'
          )

          check(
            !fairy.blocked([npc],8,9),
            'Original neighboring NPC tile retained'
          )

          check(
            !fairy.blocked([hidden],1,1),
            'Inactive companion ignored'
          )
          RUBY

          ruby -c /tmp/slv314_test.rb
          ruby /tmp/slv314_test.rb

      - name: Update resource checksums and version
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re

          root=Path('site')
          game=root/'knight/gameasync'

          manifest=json.loads(
              Path('/tmp/slv313-graphics.json').read_text('utf8')
          )

          assert len(manifest)==8

          mapper=game/'mapping.js'

          original=mapper.read_text('utf8')
          mapping=original

          resources=[
              row['relative']
              for row in manifest
          ]+[
              'Data/Scripts.rxdata'
          ]

          assert len(resources)==9
          assert len(set(resources))==9

          for rel in resources:

              path=game/rel

              assert path.is_file(),rel

              pattern=re.compile(
                  re.escape(rel)+r'\?h=[0-9a-f]{32}'
              )

              assert len(
                  pattern.findall(mapping)
              )==1,rel

              checksum=hashlib.md5(
                  path.read_bytes()
              ).hexdigest()

              mapping=pattern.sub(
                  rel+'?h='+checksum,
                  mapping
              )

          mapper.write_text(
              mapping,'utf8'
          )

          loader=root/'knight/js/sl-assets-v229r115.js'

          source=loader.read_text('utf8')

          assert source.count(
              "var version='V3.13';"
          )==1

          loader.write_text(
              source.replace(
                  "var version='V3.13';",
                  "var version='V3.14';"
              ),
              'utf8'
          )

          for name in (
              'index.html',
              'knight/index.html'
          ):

              path=root/name

              source=path.read_text('utf8')

              assert 'V3.13' in source

              path.write_text(
                  source.replace(
                      'V3.13','V3.14'
                  ).replace(
                      'v3.13','v3.14'
                  ),
                  'utf8'
              )

          before=json.loads(
              Path('/tmp/slv313-before.json').read_text('utf8')
          )

          after={
              str(p.relative_to(root)):hashlib.sha256(
                  p.read_bytes()
              ).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          assert len(before)==6018
          assert len(after)==6018

          assert before.keys()==after.keys(),(
              'Unexpected added or removed game files'
          )

          changed={
              name
              for name in before
              if before[name]!=after[name]
          }

          approved_graphics={
              'knight/gameasync/'+row['relative']
              for row in manifest
          }

          required={
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html',
              'knight/index.html'
          }

          approved=approved_graphics|required

          assert required<=changed,(
              'Required changes missing',
              sorted(required-changed)
          )

          assert changed<=approved,(
              'Unapproved changes',
              sorted(changed-approved)
          )

          assert changed&approved_graphics,(
              'No character alignment changes'
          )

          for path in before:

              if path.startswith('knight/gameasync/Data/'):

                  if path.endswith('Scripts.rxdata'):
                      continue

                  assert before[path]==after[path],(
                      'Unapproved game data change',
                      path
                  )

          assert before[
              'knight/js/dpad.js'
          ]==after[
              'knight/js/dpad.js'
          ]

          assert "location.replace('knight/?v='+Date.now());" in (
              root/'index.html'
          ).read_text('utf8')

          for name in sorted(changed):

              print('CHANGED',name)

          print('PASS V3.14 companion separation')
          print('PASS eight character ground alignment')
          print('PASS 160 original walking frames preserved')
          print('PASS original scale 100 percent')
          print('PASS original body and shadow relationship')
          print('PASS original map events and actor data unchanged')
          print('PASS original engine and input handling unchanged')
          print('PASS no added or removed game files')
          print('PASS changed files',len(changed))
          print('PASS untouched files',len(before)-len(changed))
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/dpad.js

      - name: Upload V3.14 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
