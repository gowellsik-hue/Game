          # encoding: UTF-8
          game='player/gameasync'
          
          class RawMarshalObject
            def self._load(data); o=allocate; o.instance_variable_set(:@raw,data); o; end
            def _dump(_depth); @raw; end
          end
          class Tone < RawMarshalObject; end
          class Color < RawMarshalObject; end
          class Rect < RawMarshalObject; end
          class Table < RawMarshalObject; end
          module RPG
            class AudioFile; end
            class Animation; class Frame; end; class Timing; end; end
            class CommonEvent; end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
            class Item; end
          end
          
          def iv(o,n); o.instance_variable_get("@#{n}"); end
          
          cp=Dir.glob(File.join(game,'Data','*CommonEvents.rxdata')).max_by{|p|File.size(p)}
          ip=Dir.glob(File.join(game,'Data','*Items.rxdata')).max_by{|p|File.size(p)}
          abort 'final CommonEvents missing' unless cp&&File.size(cp)>1000
          abort 'final Items missing' unless ip&&File.size(ip)>1000
          ce=Marshal.load(File.binread(cp))
          items=Marshal.load(File.binread(ip))
          
          abort 'normal green timer trigger wrong' unless iv(ce[10],:trigger)==2&&iv(ce[10],:switch_id)==171
          abort 'courage timer trigger wrong' unless iv(ce[4],:trigger)==2&&iv(ce[4],:switch_id)==1002
          abort 'enhanced green timer trigger wrong' unless iv(ce[107],:trigger)==2&&iv(ce[107],:switch_id)==368
          abort 'speed refresh trigger wrong' unless iv(ce[68],:trigger)==2&&iv(ce[68],:switch_id)==998
          
          transform_vars=[58,138,189,263,264,265,309,311,390,627,628,629]
          transform_switches=[54,60,152,154,253,254,255,845,869,870]
          [3,4,8,10,33,107].each do |id|
            (iv(ce[id],:list)||[]).each do |c|
              code=iv(c,:code)
              par=iv(c,:parameters)||[]
              abort "CE#{id} writes transform variable #{par[0]}" if code==122&&transform_vars.include?(par[0].to_i)
              abort "CE#{id} writes transform switch #{par[0]}" if code==121&&transform_switches.include?(par[0].to_i)
              if code==209
                route=par[1]
                (iv(route,:list)||[]).each{|mc|abort "CE#{id} changes character graphic" if iv(mc,:code)==41}
              elsif code==509
                mc=par[0]
                abort "CE#{id} changes character graphic" if mc&&iv(mc,:code)==41
              end
            end
          end
          
          [3,10,33,107].each do |id|
            abort "CE#{id} writes courage state" if (iv(ce[id],:list)||[]).any? do |c|
              iv(c,:code)==121 && [172,1002].include?((iv(c,:parameters)||[])[0].to_i)
            end
          end
          abort 'CE4 writes green state' if (iv(ce[4],:list)||[]).any? do |c|
            iv(c,:code)==121 && [171,368].include?((iv(c,:parameters)||[])[0].to_i)
          end
          
          # Required stacking operations.
          ce3=iv(ce[3],:list)||[]
          ce33=iv(ce[33],:list)||[]
          ce8=iv(ce[8],:list)||[]
          abort 'normal green +300 stack missing' unless ce3.count{|c|iv(c,:code)==122&&(iv(c,:parameters)||[])==[110,110,2,0,300]}>=2
          abort 'enhanced green +1800 stack missing' unless ce33.any?{|c|iv(c,:code)==122&&(iv(c,:parameters)||[])==[110,110,2,0,1800]}
          abort 'normal->enhanced carry missing' unless ce33.any?{|c|iv(c,:code)==122&&(iv(c,:parameters)||[])==[110,110,2,0,300]}
          abort 'courage +300 stack missing' unless ce8.any?{|c|iv(c,:code)==122&&(iv(c,:parameters)||[])==[109,109,2,0,300]}
          abort 'courage timer start missing' unless ce8.any?{|c|iv(c,:code)==121&&(iv(c,:parameters)||[])==[1002,1002,0]}
          abort 'courage item consume missing' unless ce8.any?{|c|iv(c,:code)==126&&(iv(c,:parameters)||[])==[3,1,0,1]}
          abort 'auto normal-green consume missing' unless ce8.any?{|c|iv(c,:code)==126&&(iv(c,:parameters)||[])==[2,1,0,1]}
          
          # Pure speed resolver: only speed route + switch998 OFF, no graphics or state writes.
          ce68=iv(ce[68],:list)||[]
          ce68.each do |c|
            code=iv(c,:code)
            par=iv(c,:parameters)||[]
            if code==121
              abort 'CE68 writes non-998 switch' unless par[0].to_i==998
            elsif code==122
              abort 'CE68 writes variable'
            elsif code==209
              route=par[1]
              (iv(route,:list)||[]).each do |mc|
                abort 'CE68 changes graphics' if iv(mc,:code)==41
                abort 'CE68 non-speed movement command' unless [0,29].include?(iv(mc,:code).to_i)
              end
            elsif code==509
              mc=par[0]
              abort 'CE68 changes graphics' if mc&&iv(mc,:code)==41
              abort 'CE68 non-speed continuation' if mc&&iv(mc,:code).to_i!=29
            end
          end
          abort 'CE68 does not self-clear' unless ce68.any?{|c|iv(c,:code)==121&&(iv(c,:parameters)||[])==[998,998,1]}
          
          # Transform itself remains owned by CE6/17/34. We only append one speed refresh.
          [6,17].each do |id|
            list=iv(ce[id],:list)||[]
            abort "CE#{id} missing direct speed recalc" unless list.any?{|c|iv(c,:code)==117&&(iv(c,:parameters)||[])==[68]}
          end
          abort 'transform timer trigger changed' unless iv(ce[34],:trigger)==2&&iv(ce[34],:switch_id)==54

          [3,4,8,10,33,107].each do |id|
            list=iv(ce[id],:list)||[]
            abort "CE#{id} touches switch998" if list.any?{|c|iv(c,:code)==121&&(iv(c,:parameters)||[])[0].to_i==998}
            abort "CE#{id} missing direct speed recalc" unless list.any?{|c|iv(c,:code)==117&&(iv(c,:parameters)||[])==[68]}
          end
          ce59=iv(ce[59],:list)||[]
          ce60=iv(ce[60],:list)||[]
          abort 'CE59 recognition-off range missing' unless ce59.any?{|c|iv(c,:code)==122&&(iv(c,:parameters)||[])==[638,691,0,0,0]}
          abort 'CE60 recognition-on range missing' unless ce60.any?{|c|iv(c,:code)==122&&(iv(c,:parameters)||[])==[638,691,0,0,1]}
          deaggro=ce59.select{|c|iv(c,:code)==355}.map{|c|(iv(c,:parameters)||[])[0].to_s}.join("\n")
          abort 'transform deaggro hook missing' unless deaggro.include?('SL_TRANSFORM_DEAGGRO_V1')
          abort 'transform deaggro does not clear chase A' unless deaggro.include?("$game_self_switches[key]=false")
          abort 'transform deaggro does not clear monster attack pending' unless deaggro.include?('SLMonsterAttackContext.instance_variable_set(:@pending,{})')
          
          # Old temporary potion systems must not be referenced.
          text=[3,4,8,10,33,68,107].flat_map{|id|iv(ce[id],:list)||[]}.select{|c|iv(c,:code)==355}.map{|c|(iv(c,:parameters)||[])[0].to_s}.join("\n")
          ['SL_GREEN_STACK_V3','SL_GREEN_STACK_V4_SAFE','SL_BRAVERY_STACK_V3','SL_BRAVERY_STACK_V4_SAFE','SL_GREEN_BANK_','@sl_green_bank'].each do |needle|
            abort "legacy buff state remains #{needle}" if text.include?(needle)
          end
          abort 'courage calls synthetic CE' if ce8.any?{|c|iv(c,:code)==117&&(iv(c,:parameters)||[])[0].to_i>=1000}
          
          abort 'item2 routing wrong' unless iv(items[2],:common_event_id)==3&&iv(items[2],:consumable)==true
          abort 'item3 routing wrong' unless iv(items[3],:common_event_id)==8&&iv(items[3],:consumable)==false
          abort 'item17 routing wrong' unless iv(items[17],:common_event_id)==6&&iv(items[17],:consumable)==false
          abort 'item37 routing wrong' unless iv(items[37],:common_event_id)==33&&iv(items[37],:consumable)==true
          
          # Exact timer arithmetic proofs.
          [-3600,-1800,-600,-300,0,120,299].each do |elapsed|
            abort 'normal add math' unless 300-(elapsed-300)==(300-elapsed)+300
            abort 'strong+normal add math' unless 1800-(elapsed-300)==(1800-elapsed)+300
            abort 'strong add math' unless 1800-(elapsed-1800)==(1800-elapsed)+1800
            abort 'courage add math' unless 300-(elapsed-300)==(300-elapsed)+300
          end
          [-600,-300,0,120,299].each do |elapsed|
            old_remaining=300-elapsed
            new_remaining=1800-(elapsed-300)
            abort 'normal->strong carry math' unless new_remaining==old_remaining+1800
          end
          
          puts 'FINAL_BUFF_STATE_V3_OK'
          RB

          du -sh player

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
