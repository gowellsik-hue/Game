# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R119
# BASE: deployed V229R117, run 40624859427. Do not base on R118.
# REMOVE: all added player/monster native coordinate and mover overrides.
# KEEP: approved R97 direction masks, map passability, extra passage,
#       wall depth/opacity, native maps, doors, respawn distribution and downloads.
# MAP ONLY: both floor AND wall artwork shift right 24 / down 12 rendered px.
# NO EXTRA CHANGES: no map data/events/collisions/monster spawn editing.
name: build-slknight-web.yml | V229R119 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R119 Restore deployed R117 (not R118)
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40624859427
          name: github-pages
          github-token: ${{ github.token }}
          path: r117

      - name: V229R119 Verify original and remove actor coordinates only
        shell: bash
        run: |
          set -euo pipefail
          test -s r117/artifact.tar
          mkdir -p site build
          tar -xf r117/artifact.tar -C site
          python3 - <<'BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          assert len(before)==5566,('Wrong R117 artifact',len(before))
          expected={
           'knight/gameasync/Data/Scripts.rxdata':'26e9eab43df5ea98406db49881ba45b3eb27af72ada6781ec317f3f4aa6db599',
           'knight/js/dpad.js':'2bd401adf130339d154ce6a8efd0127cefd9b1bc58bc60d1de68e8b7a791',
           'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap045.rxdata':'f47de87af6b4e607bf632818a711619dc8ca4e747196a123a76ac7db8ffc3ba6',
           'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap046.rxdata':'dc89d908f5247442e08dddc11f5bcf6505a77890bd82ab59b790e00e3e5f024c'
          }
          for name,sha in expected.items():assert before[name]==sha,('Wrong baseline',name)
          assert 'V229R117' in (root/'knight/index.html').read_text('utf8')
          Path('build/before.json').write_text(json.dumps(before,sort_keys=True))
          print('PASS R117 exact baseline and protected map files')
          BASE
          cat > build/r119.rb <<'R119_RUBY'
          require 'zlib'
          file=ARGV.fetch(0)
          scripts=Marshal.load(File.binread(file))
          raise 'Unexpected scripts count' unless scripts.length==136
          old97=Zlib::Inflate.inflate(scripts[97][2]); old134=Zlib::Inflate.inflate(scripts[134][2]);s=old134;t=old97

          def exact(s, old, replacement, label)
           n=s.scan(Regexp.new(Regexp.escape(old))).size
           raise "#{label} count #{n}" unless n==1
           s.sub(old,replacement)
          end

          def cut_range(s,first,last,label)
           i=s.index(first)
           j=s.index(last,i||0)
           raise "#{label} missing" unless i && j && i<j
           [s[0...i]+s[j..-1],s[i...j]]
          end

          # Remove the entire actor state/position/movement modification (hero AND monsters).
          s,removed_actor=cut_range(s,"\nclass Game_Character\n  alias slti_native66_original_moveto moveto", "\n# Replace the old R42/R44 graph", 'actor coordinate/movement override')
          %w[slti_native66_prepare slti_native66_move slti_native66_original_moveto slti_native66_original_update_move].each do |tag|
           raise "missing expected actor override #{tag}" unless removed_actor.include?(tag)
          end
          # Restore the base Game_Character#passable? supplied by script23, including its
          # existing R49/R44 wall constraints; keep the separately approved R97 map graph.
          s,removed_actor_pass=cut_range(s,"\nclass Game_Character\n  alias slti_native66_original_passable passable?", "\n# V229R97:", 'actor passable override')
          raise 'missing bad actor passable use' unless removed_actor_pass.include?('slti_native66_prepare')

          # The approved S32 grid projection and inverse MUST remain byte-identical.
          # They define passage masks, NOT actor position overrides. Deleting these
          # previously broke the user's approved open route and wall collision.
          raise 'Approved two-floor map-space projection missing' unless s.include?("if mid==45 || mid==46\n      px+=12\n      py+=6")
          raise 'Approved map-space inverse missing' unless s.include?("if mid==45 || mid==46\n      native_u-=12\n      native_v-=6")
          # Remove dead actor-only conversion helpers; no active actor state uses them.
          s=exact(s,<<'ACTOR_CONVERSION','', 'remove unused actor real and RGSS coordinate conversions')
            def self.real(mid,x,y)
              px,py=project(mid,x,y)
              # screen_x=real_x/4+16, screen_y=real_y/4+32, terrain=source x2
              return [px*8-64,py*8-128]
            end
            def self.to_rgss(mid,x,y)
              px,py=project(mid,x,y)
              return [px/16,py/16]
            end
          ACTOR_CONVERSION

          # Keep existing approved randomized spawns; remove only references to deleted
          # actor-native coordinate state and use the original R49 walkable grid.
          s=exact(s,"    last_native=event.instance_variable_get(:@slti_r111_last_native)\n",'', 'remove old native last spawn')
          s=exact(s,"      native=SLTI_Native66.nearest(mid,x,y,16)\n      next if native==nil || last_native==native\n", "      next unless SLTI_V229R49.walkable?(mid,x,y)\n", 'remove respawn coordinate transform')
          s=exact(s,<<'ORIGINAL',<<'RESTORED', 'remove monster native collision state')
                  if SLTI_V229R49.monster?(other)
                    other.slti_native66_prepare
                    ox=other.instance_variable_get(:@slti_native66_x)
                    oy=other.instance_variable_get(:@slti_native66_y)
                    occupied=(ox==native[0] && oy==native[1])
                  else
                    occupied=(other.x==x && other.y==y)
                  end
          ORIGINAL
                  occupied=(other.x==x && other.y==y)
          RESTORED
          s=exact(s,"      event.instance_variable_set(:@slti_r111_last_native,native)\n", '', 'delete native respawn state')

          # Map art only: native source tile is +12,+6; at 2x draw resolution use +24,+12.
          # Apply to BOTH floors' floor sprites and wall sprites. Keep collision masks byte identical.
          t=exact(t,'left=[sx/1024,0].max', 'left=[(sx-24)/1024,0].max', 'floor cull left')
          t=exact(t,'top=[sy/1024,0].max', 'top=[(sy-12)/1024,0].max', 'floor cull top')
          t=exact(t,'right=[(sx+vw-1)/1024,@slti_cols-1].min','right=[(sx+vw-1-24)/1024,@slti_cols-1].min','floor cull right')
          t=exact(t,'bottom=[(sy+vh-1)/1024,@slti_rows-1].min','bottom=[(sy+vh-1-12)/1024,@slti_rows-1].min','floor cull bottom')
          {
           'sprite.x=key[0]*1024-sx'=>'sprite.x=key[0]*1024-sx+24',
           'sprite.y=key[1]*1024-sy'=>'sprite.y=key[1]*1024-sy+12',
           'sprite.x=x*1024-sx'=>'sprite.x=x*1024-sx+24',
           'sprite.y=y*1024-sy'=>'sprite.y=y*1024-sy+12'
          }.each{|old,newer| t=exact(t,old,newer,'floor drawn tile')}
          {
           'wall_x=cx*1024+(id%4)*256-sx'=>'wall_x=cx*1024+(id%4)*256-sx+24',
           'wall_y=cy*1024+(id/4)*128-sy'=>'wall_y=cy*1024+(id/4)*128-sy+12'
          }.each{|old,newer| s=exact(s,old,newer,'wall drawn tile')}

          # Guardrails: do not destroy original S32 edge table, the approved extra opening,
          # walls, doors, R49 AI, actor direction masks, or monster event positions.
          raise 'removed map edge graph' unless s.include?('module SLTI_Native66') && s.include?('module SLTI_V229R97Corner')
          raise 'removed map passability override' unless s.include?('alias slti_native66_original_passable passable?')
          raise 'removed original R49 wall restriction' unless s.include?('module SLTI_V229R49') && s.include?('SLTI_V229R44.allowed?')
          raise 'left actor native coords' if s.include?('slti_native66_prepare') || s.include?('@slti_native66_') || s.include?('slti_native66_move')
          raise 'map projection unexpectedly deleted' unless s.include?('px+=12') && s.include?('native_u-=12')
          raise 'deleted approved respawn' unless s.include?('module SLTI_R111Respawn')
          raise 'changed approved masks' unless old134[/# V229R97:.*?(?=\n# V229R84:)/m]==s[/# V229R97:.*?(?=\n# V229R84:)/m]
          raise 'changed native edge bytes' unless old134[/  EDGES=\{.*?\n  \}/m]==s[/  EDGES=\{.*?\n  \}/m]
          raise 'unapproved change in map load/runtime' if !t.include?('slti_update_terrain')

          scripts[97][2]=Zlib::Deflate.deflate(t)
          scripts[134][2]=Zlib::Deflate.deflate(s)
          File.binwrite(file,Marshal.dump(scripts))
          File.binwrite(ENV.fetch('R119_97_OUT','build/97-r119.rb'),t)
          File.binwrite(ENV.fetch('R119_134_OUT','build/134-r119.rb'),s)
          puts "PASS only actor-native coordinate overrides removed; original map masks and passability kept"
          puts "PASS floor +24,+12 and wall +24,+12 on both floors"
          puts "PASS Ruby scripts: 134 #{old134.lines.length}=>#{s.lines.length}, 97 #{old97.lines.length}=>#{t.lines.length}"

          R119_RUBY
          ruby -c build/r119.rb
          ruby build/r119.rb site/knight/gameasync/Data/Scripts.rxdata
          ruby -c build/97-r119.rb
          ruby -c build/134-r119.rb

      - name: V229R119 Refresh script cache and version labels only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'CACHE'
          from pathlib import Path
          import hashlib,re
          root=Path('site')
          base=root/'knight/gameasync'
          scripts=base/'Data/Scripts.rxdata'
          mapping=base/'mapping.js'
          content=mapping.read_text('utf8')
          content,count=re.subn(r'(Data/Scripts\.rxdata\?h=)[0-9a-f]{32}',
             lambda m:m.group(1)+hashlib.md5(scripts.read_bytes()).hexdigest(),content)
          assert count==1,('Scripts mapping missing',count)
          mapping.write_text(content,encoding='utf8')
          for name in ('index.html','knight/index.html'):
              page=root/name
              text=page.read_text('utf8')
              assert 'V229R117' in text
              page.write_text(text.replace('V229R117','V229R119')
                              .replace('v229r117','v229r119'),encoding='utf8')
          runtime=root/'knight/js/sl-assets-v229r115.js'
          code=runtime.read_text('utf8')
          assert code.count("var version='V229R117';")==1
          runtime.write_text(code.replace("var version='V229R117';",
              "var version='V229R119';"),encoding='utf8')
          CACHE
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: V229R119 Audit only actor cleanup and both map images
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'AUDIT'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before=json.loads(Path('build/before.json').read_text('utf8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert len(before)==len(after)==5566 and before.keys()==after.keys()
          changed={p for p in before if before[p]!=after[p]}
          expected={'index.html','knight/index.html',
                    'knight/gameasync/mapping.js','knight/gameasync/Data/Scripts.rxdata',
                    'knight/js/sl-assets-v229r115.js'}
          assert changed==expected,('Unapproved files',changed^expected)
          for path in before:
              if (path.startswith('knight/assets/') or
                  path.startswith('knight/gameasync/Graphics/') or
                  (path.startswith('knight/gameasync/Data/') and not path.endswith('Scripts.rxdata')) or
                  path in ('knight/js/drive.js','knight/js/dpad.js')):
                  assert before[path]==after[path],('Protected item changed',path)
          s=Path('build/134-r119.rb').read_text('utf8')
          t=Path('build/97-r119.rb').read_text('utf8')
          for obsolete in ('slti_native66_prepare','@slti_native66_',
                           'slti_native66_move','slti_native66_original_moveto'):
              assert obsolete not in s,('Actor coordinate code remains',obsolete)
          # Keep all approved corridor/direction-mask logic intact.
          assert 'module SLTI_V229R97Corner' in s
          assert 'module SLTI_Native66' in s
          assert 'def self.native_target' in s
          assert 'def passable?(x,y,d,self_event=nil)' in s
          assert 'module SLTI_R111Respawn' in s
          assert 'def slti_r49_update_walls' in s
          assert 'wall_x=cx*1024+(id%4)*256-sx+24' in s
          assert 'wall_y=cy*1024+(id/4)*128-sy+12' in s
          assert 'sprite.x=x*1024-sx+24' in t
          assert 'sprite.y=y*1024-sy+12' in t
          assert 'sprite.x=key[0]*1024-sx+24' in t
          assert 'sprite.y=key[1]*1024-sy+12' in t
          print('PASS actor coordinate overrides removed, both floors +24,+12 art')
          print('PASS R97 passages, wall logic, original maps/spawns and packs retained')
          AUDIT

      - name: V229R119 Publish unchanged gameplay with shifted dungeon artwork
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
