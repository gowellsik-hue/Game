name: Deploy SLKnight V14.3z4 CLEAN POTION + DECOUPLED ORCS + FAST AUTO

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions: {contents: read, pages: write, id-token: write}

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  BASELINE_SHA: c6815cd461dba60ec131898e6d5dd8690dd915ae
  X2_SHA: 6d941bd643dda87b8267ba466e108d1904c22331
  Z1_SHA: 008b6abe81074b7af877806b45f2314004a74f66
  Z3_SHA: 5a46988b048764e8a99700998c1f4ab96a3ec5c1
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout frozen V14.3l baseline
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.BASELINE_SHA }}
          path: baseline

      - name: Checkout frozen V14.3x2 potion base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.X2_SHA }}
          path: x2

      - name: Checkout frozen V14.3z1 verified monster base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z1_SHA }}
          path: z1

      - name: Checkout frozen V14.3z3 current success
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z3_SHA }}
          path: z3

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake cmake curl ffmpeg freepats git imagemagick libtool make mm-common patch pkg-config python3 rake ruby timidity unzip wget xz-utils fonts-nanum

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.MKXP_SRC_REF }}
          path: engine

      - name: Cache engine dependencies
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-${{ runner.os }}-${{ env.EMSDK_VER }}-onig25b

      - name: Extract frozen run scripts
        run: |
          ruby -ryaml - <<'RB'
          base=YAML.load_file('baseline/.github/workflows/build-slknight-web.yml')
          x2=YAML.load_file('x2/.github/workflows/build-slknight-web.yml')
          z1=YAML.load_file('z1/.github/workflows/build-slknight-web.yml')
          z3=YAML.load_file('z3/.github/workflows/build-slknight-web.yml')

          base_steps=base.fetch('jobs').fetch('build').fetch('steps')
          x2_steps=x2.fetch('jobs').fetch('build').fetch('steps')
          z1_steps=z1.fetch('jobs').fetch('build').fetch('steps')
          z3_steps=z3.fetch('jobs').fetch('build').fetch('steps')

          base_wanted={
            'Patch engine'=>'/tmp/base_patch_engine.sh',
            'Build engine'=>'/tmp/base_build_engine.sh',
            'Install game'=>'/tmp/base_install_game.sh',
            'Patch game'=>'/tmp/base_patch_game.sh',
            'Convert media'=>'/tmp/base_convert_media.sh',
            'Build mappings'=>'/tmp/base_build_mappings.sh',
            'Patch browser'=>'/tmp/base_patch_browser.sh',
            'Verify package'=>'/tmp/base_verify.sh'
          }

          x2_wanted={
            'Backup pristine potion event'=>'/tmp/x2_backup_potion.sh',
            'Restore ordinary potion logic'=>'/tmp/x2_restore_potion.sh'
          }

          z3_wanted={
            'Patch Gnoll Neruga Drake Kelberos'=>'/tmp/z3_delta.sh',
            'Patch native Lineage hold attack + full-speed auto'=>'/tmp/z3_auto.sh',
            'Preload verified attack and breath assets'=>'/tmp/z3_preload.sh',
            'Verify V14.3z3 package'=>'/tmp/z3_verify.sh'
          }

          base_wanted.each do |name,path|
            step=base_steps.find{|x|x['name']==name}
            abort "BASELINE STEP MISSING: #{name}" unless step&&step['run']
            File.write(path,step['run'])
          end

          x2_wanted.each do |name,path|
            step=x2_steps.find{|x|x['name']==name}
            abort "X2 STEP MISSING: #{name}" unless step&&step['run']
            File.write(path,step['run'])
          end

          step=z1_steps.find{|x|x['name']=='Patch verified monster attacks only'}
          abort 'Z1 monster patch missing' unless step&&step['run']
          File.write('/tmp/z1_monster_patch.sh',step['run'])

          z3_wanted.each do |name,path|
            step=z3_steps.find{|x|x['name']==name}
            abort "Z3 STEP MISSING: #{name}" unless step&&step['run']
            File.write(path,step['run'])
          end

          puts 'FROZEN_SCRIPTS_Z4_OK'
          RB

      - name: Remove unsupported Orc alias mappings from z1 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('/tmp/z1_monster_patch.sh')
          s=p.read_text()

          s=s.replace(
              "# No separate 두다마라/로바 attack sheet exists; both use the\n"
              "# user-verified generic 오크.png / 오크모션 set.\n",
              ""
          )

          for attack_id,next_id in ((857,859),(860,862)):
              pat=rf'(?ms)^[ \t]*{attack_id}=>\{{\n.*?^[ \t]*\}},\n(?=[ \t]*{next_id}=>\{{)'
              s,n=re.subn(pat,'',s,count=1)
              if n!=1:
                  raise SystemExit(f'failed to remove unsupported attack {attack_id}: {n}')

          for bad in (
              "857=>{",
              "860=>{",
              "label:'두다마라오크'",
              "label:'로바오크'"
          ):
              if bad in s:
                  raise SystemExit(
                      'unsupported Orc mapping remains: '+bad
                  )

          p.write_text(s)
          print('Z1_ORC_ALIAS_MAPPING_REMOVED')
          PY

      - name: Retarget inherited z3 scripts to cleaned z4 counts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          delta=Path('/tmp/z3_delta.sh')
          s=delta.read_text()

          replacements={
              'test "$(wc -l < player/gameasync/sl_attack_sheets.txt)" -eq 21':
              'test "$(wc -l < player/gameasync/sl_attack_sheets.txt)" -eq 20',

              'test "$(wc -l < player/gameasync/sl_attack_coords.txt)" -eq 18':
              'test "$(wc -l < player/gameasync/sl_attack_coords.txt)" -eq 17',

              'test "$(wc -l < player/gameasync/sl_attack_verified_ids.txt)" -eq 19':
              'test "$(wc -l < player/gameasync/sl_attack_verified_ids.txt)" -eq 17'
          }

          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(
                      'delta count marker missing: '+old
                  )
              s=s.replace(old,new)

          delta.write_text(s)

          preload=Path('/tmp/z3_preload.sh')
          s=preload.read_text()

          for old,new in (
              ('expected=21','expected=20'),
              ('sheets.length==21','sheets.length==20'),
              ('expected=18','expected=17'),
              ('chars.length==18','chars.length==17'),
              ('V14.3z3','V14.3z4'),
              ('v143z3','v143z4'),
              ('Z3','Z4'),
              ('z3','z4')
          ):
              s=s.replace(old,new)

          preload.write_text(s)

          verify=Path('/tmp/z3_verify.sh')
          s=verify.read_text()

          for old,new in (
              ('-eq 21','-eq 20'),
              ('-eq 18','-eq 17'),
              ('-eq 19','-eq 17'),
              ('V14.3z3','V14.3z4'),
              ('v143z3','v143z4'),
              ('FINAL_VERIFY_Z3','FINAL_VERIFY_Z4'),
              ('final_z3_verify','final_z4_verify')
          ):
              s=s.replace(old,new)

          verify.write_text(s)

          print('Z4_INHERITED_SCRIPTS_RETARGETED')
          PY

      - name: Patch engine
        run: bash /tmp/base_patch_engine.sh

      - name: Build engine
        run: bash /tmp/base_build_engine.sh

      - name: Install game
        run: bash /tmp/base_install_game.sh

      - name: Backup pristine potion event
        run: bash /tmp/x2_backup_potion.sh

      - name: Patch game from V14.3l
        run: bash /tmp/base_patch_game.sh

      - name: Restore ordinary potion logic
        run: bash /tmp/x2_restore_potion.sh

      - name: Patch safe potion stacking without timeout hook
        run: |
          cat > /tmp/fix_potion_stack_v4.rb <<'RB'
          # encoding: UTF-8
          game=ARGV.fetch(0)

          class RawMarshalObject
            def self._load(data)
              o=allocate
              o.instance_variable_set(:@raw,data)
              o
            end

            def _dump(_depth)
              @raw
            end
          end

          class Tone < RawMarshalObject; end
          class Color < RawMarshalObject; end
          class Rect < RawMarshalObject; end
          class Table < RawMarshalObject; end

          module RPG
            class AudioFile; end

            class Animation
              class Frame; end
              class Timing; end
            end

            class Map; end
            class CommonEvent; end

            class Event
              class Page
                class Condition; end
                class Graphic; end
              end
            end

            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
          end

          def iv(o,n)
            o.instance_variable_get("@#{n}")
          end

          def setiv(o,n,v)
            o.instance_variable_set("@#{n}",v)
          end

          def cmd(code,indent,params)
            c=RPG::EventCommand.new
            setiv(c,:code,code)
            setiv(c,:indent,indent)
            setiv(c,:parameters,params)
            c
          end

          ce_path=Dir.glob(
            File.join(
              game,
              'Data',
              '*CommonEvents.rxdata'
            )
          ).max_by{|p|File.size(p)}

          abort 'CommonEvents missing' unless
            ce_path&&File.size(ce_path)>1000

          ces=Marshal.load(
            File.binread(ce_path)
          )

          ce3=ces[3]
          ce4=ces[4]
          ce8=ces[8]

          abort 'CE3/4/8 missing' unless
            ce3&&ce4&&ce8

          l3=iv(ce3,:list)||[]
          l4=iv(ce4,:list)||[]
          l8=iv(ce8,:list)||[]

          green_script=<<'SCRIPT'
          # SL_GREEN_STACK_V4_SAFE
          if $game_switches[171] || $game_switches[368]
            $game_variables[110] =
              $game_variables[110].to_i - 300

            Guage.show
            $KeyIcon.ShowIcon
            $sl_green_stack_skip = true
          else
            $sl_green_stack_skip = false
          end
          SCRIPT

          setiv(
            ce3,
            :list,
            [
              cmd(
                355,
                0,
                [green_script]
              ),
              cmd(
                111,
                0,
                [
                  12,
                  '$sl_green_stack_skip == true'
                ]
              ),
              cmd(
                207,
                1,
                [-1,2]
              ),
              cmd(
                115,
                1,
                []
              ),
              cmd(
                412,
                0,
                []
              )
            ]+l3
          )

          bravery_script=<<'SCRIPT'
          # SL_BRAVERY_STACK_V4_SAFE
          if $game_switches[172]
            $game_variables[109] =
              $game_variables[109].to_i - 300

            $game_party.lose_item(3,1)

            Guage.show
            $KeyIcon.ShowIcon
            $sl_bravery_stack_skip = true
          else
            $sl_bravery_stack_skip = false
          end
          SCRIPT

          setiv(
            ce8,
            :list,
            [
              cmd(
                355,
                0,
                [bravery_script]
              ),
              cmd(
                111,
                0,
                [
                  12,
                  '$sl_bravery_stack_skip == true'
                ]
              ),
              cmd(
                207,
                1,
                [-1,270]
              ),
              cmd(
                117,
                1,
                [589]
              ),
              cmd(
                115,
                1,
                []
              ),
              cmd(
                412,
                0,
                []
              )
            ]+l8
          )

          l3=iv(ce3,:list)||[]
          l4=iv(ce4,:list)||[]
          l8=iv(ce8,:list)||[]

          gs=l3.index do |c|
            iv(c,:code)==355&&
            (iv(c,:parameters)||[])[0]
              .to_s
              .include?(
                'SL_GREEN_STACK_V4_SAFE'
              )
          end

          bs=l8.index do |c|
            iv(c,:code)==355&&
            (iv(c,:parameters)||[])[0]
              .to_s
              .include?(
                'SL_BRAVERY_STACK_V4_SAFE'
              )
          end

          abort 'green stack marker missing' unless
            gs==0

          abort 'bravery stack marker missing' unless
            bs==0

          abort 'green stack effect missing' unless
            iv(l3[2],:code)==207&&
            iv(l3[2],:parameters)==[-1,2]

          abort 'green stack exit missing' unless
            iv(l3[3],:code)==115

          abort 'bravery stack effect missing' unless
            iv(l8[2],:code)==207&&
            iv(l8[2],:parameters)==[-1,270]

          abort 'bravery stack event missing' unless
            iv(l8[3],:code)==117&&
            iv(l8[3],:parameters)==[589]

          abort 'bravery stack exit missing' unless
            iv(l8[4],:code)==115

          potion_scripts=
            (l3+l4+l8)
              .select{|c|iv(c,:code)==355}
              .map do |c|
                (iv(c,:parameters)||[])[0].to_s
              end
              .join("\n")

          abort 'legacy green-bank hook remains' if
            potion_scripts.include?(
              'SL_GREEN_BANK_'
            )

          abort 'legacy green-bank storage remains' if
            potion_scripts.include?(
              '@sl_green_bank'
            )

          abort 'direct move-speed mutation remains' if
            potion_scripts.include?(
              'instance_variable_set(:@move_speed'
            )

          File.binwrite(
            ce_path,
            Marshal.dump(ces)
          )

          puts(
            "POTION_STACK_V4_SAFE_OK " \
            "ce3=#{l3.length} " \
            "ce8=#{l8.length} " \
            "ce4=#{l4.length}"
          )
          RB

          ruby -c /tmp/fix_potion_stack_v4.rb
          ruby -EUTF-8:UTF-8 \
            /tmp/fix_potion_stack_v4.rb \
            player/gameasync

      - name: Patch verified monster attacks without fake Orc aliases
        run: |
          bash /tmp/z1_monster_patch.sh

          test \
            "$(wc -l < player/gameasync/sl_attack_sheets.txt)" \
            -eq 14

          test \
            "$(wc -l < player/gameasync/sl_attack_coords.txt)" \
            -eq 13

          test \
            "$(wc -l < player/gameasync/sl_attack_verified_ids.txt)" \
            -eq 13

          ! grep -Fxq \
            '857' \
            player/gameasync/sl_attack_verified_ids.txt

          ! grep -Fxq \
            '860' \
            player/gameasync/sl_attack_verified_ids.txt

      - name: Patch Gnoll Neruga Drake Kelberos
        run: bash /tmp/z3_delta.sh

      - name: Convert media
        run: bash /tmp/base_convert_media.sh

      - name: Build mappings
        run: bash /tmp/base_build_mappings.sh

      - name: Patch browser from V14.3l
        run: bash /tmp/base_patch_browser.sh

      - name: Verify frozen V14.3l baseline
        run: bash /tmp/base_verify.sh

      - name: Patch native Lineage auto attack at full input rate
        run: bash /tmp/z3_auto.sh

      - name: Preload cleaned verified attack and breath assets
        run: bash /tmp/z3_preload.sh

      - name: Verify V14.3z4 cleaned package
        run: |
          bash /tmp/z3_verify.sh

          test \
            "$(wc -l < player/gameasync/sl_attack_sheets.txt)" \
            -eq 20

          test \
            "$(wc -l < player/gameasync/sl_attack_coords.txt)" \
            -eq 17

          test \
            "$(wc -l < player/gameasync/sl_attack_verified_ids.txt)" \
            -eq 17

          ! grep -Fxq \
            '857' \
            player/gameasync/sl_attack_verified_ids.txt

          ! grep -Fxq \
            '860' \
            player/gameasync/sl_attack_verified_ids.txt

          grep -Fq \
            'v143z4' \
            player/index.html

          ruby -EUTF-8:UTF-8 - <<'RB'
          game='player/gameasync'

          class RawMarshalObject
            def self._load(data)
              o=allocate
              o.instance_variable_set(:@raw,data)
              o
            end

            def _dump(_depth)
              @raw
            end
          end

          class Tone < RawMarshalObject; end
          class Color < RawMarshalObject; end
          class Rect < RawMarshalObject; end
          class Table < RawMarshalObject; end

          module RPG
            class AudioFile; end

            class Animation
              class Frame; end
              class Timing; end
            end

            class CommonEvent; end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
          end

          def iv(o,n)
            o.instance_variable_get("@#{n}")
          end

          cp=Dir.glob(
            File.join(
              game,
              'Data',
              '*CommonEvents.rxdata'
            )
          ).max_by{|p|File.size(p)}

          ce=Marshal.load(
            File.binread(cp)
          )

          text=
            [3,4,8]
              .flat_map do |id|
                iv(ce[id],:list)||[]
              end
              .select do |c|
                iv(c,:code)==355
              end
              .map do |c|
                (iv(c,:parameters)||[])[0].to_s
              end
              .join("\n")

          abort 'old green-bank logic survived' if
            text.include?(
              'SL_GREEN_BANK_'
            )

          abort 'old green-bank state survived' if
            text.include?(
              '@sl_green_bank'
            )

          abort 'old direct move-speed mutation survived' if
            text.include?(
              'instance_variable_set(:@move_speed'
            )

          abort 'safe green stack missing' unless
            text.include?(
              'SL_GREEN_STACK_V4_SAFE'
            )

          abort 'safe bravery stack missing' unless
            text.include?(
              'SL_BRAVERY_STACK_V4_SAFE'
            )

          puts 'FINAL_POTION_SOFTLOCK_GUARD_OK'
          RB

          du -sh player

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
