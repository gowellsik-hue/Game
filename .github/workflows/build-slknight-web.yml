
name: V229 | Reviewed Unified Knight Speed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-slknight-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Recover verified V229 game artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          repository: gowellsik-hue/Game
          run-id: 38833547149
          name: github-pages
          github-token: ${{ github.token }}
          path: previous

      - name: Restore full game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          if test -s previous/artifact.tar; then
            tar -xf previous/artifact.tar -C site
          else
            python3 - <<'PY_FETCH'
          from pathlib import Path
          from urllib.request import Request,urlopen
          from urllib.parse import quote
          from concurrent.futures import ThreadPoolExecutor,as_completed
          import hashlib,json,re,time
          base='https://gowellsik-hue.github.io/Game/'
          root=Path('site')
          fixed=('index.html','COPYING-mkxp-web.txt','manifest.webmanifest','mkxp.js','mkxp.wasm','js/drive.js','js/dpad.js','js/localforage.min.js')
          def get(url):
            for attempt in range(5):
              try:
                with urlopen(Request(url,headers={'User-Agent':'SLKnight-V229-R1','Accept-Encoding':'identity'}),timeout=60) as response:
                  return response.read()
              except Exception:
                if attempt==4:raise
                time.sleep(attempt+1)
          files={'index.html':(base+'index.html',None)}
          for game in ('knight','elf'):
            for rel in fixed:
              files[game+'/'+rel]=(base+game+'/'+quote(rel,safe='/'),None)
            name=game+'/gameasync/mapping.js'
            blob=get(base+name+'?recovery=229r1')
            f=root/name;f.parent.mkdir(parents=True,exist_ok=True);f.write_bytes(blob)
            array=blob.decode('utf-8').split('var mappingArray = ',1)[1].split('];',1)[0]+']'
            for _,asset in json.loads(re.sub(r',\s*\]$',']',array)):
              rel,sep,md5=asset.partition('?h=')
              if '.' not in Path(rel).name:continue
              if rel.startswith('/') or '..' in Path(rel).parts:raise RuntimeError('Unsafe path '+rel)
              name=game+'/gameasync/'+rel
              if name in files:raise RuntimeError('Duplicate '+name)
              files[name]=(base+game+'/gameasync/'+quote(rel,safe='/')+('?h='+md5 if sep else ''),md5 if sep else None)
          if len(files)!=5354:raise RuntimeError('Wrong file count')
          def fetch(item):
            name,(url,md5)=item
            data=get(url)
            if md5 and Path(name).name not in ('mapping.js','bitmap-map.js') and hashlib.md5(data).hexdigest()!=md5:
              raise RuntimeError('Corrupt file '+name)
            path=root/name;path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data)
          with ThreadPoolExecutor(max_workers=12) as pool:
            for result in as_completed([pool.submit(fetch,item) for item in files.items() if not (root/item[0]).is_file()]):result.result()
          if {str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}!=set(files):raise RuntimeError('Incomplete recovery')
          print('COMPLETE_SITE_RESTORED')
          PY_FETCH
          fi

      - name: Verify V229 baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CHECK'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if len(hashes)!=5354:raise SystemExit('Wrong game inventory')
          base={
            'knight/index.html':'d376d842fbbde43c437fdfdb0bbdbf67b2e19bc640caaf1f0abc768ab8b66661',
            'knight/gameasync/mapping.js':'2e08a4c239001bc873b4dc7b45c54368e8dc30e8ce3b0f22fda9a5e4c6cb4ea8',
            'knight/gameasync/Data/Scripts.rxdata':'72d8c66be04fb793c2d9363a844740432a2ecf01d5c6cb13a518a4a62dd42eb2',
            'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata':'bbf5ec438a88f032780f9464a862ca4728f1f34afa1b74053ca7c6a9243ca3ed'
          }
          final={
            'knight/index.html':'c972da44d2a87ed6a60eefda1e7521e0e5eff221568ce956516d23e3bc79c738',
            'knight/gameasync/mapping.js':'7a4ca5406d36631e627090f7b23dc470bd9650c728de4338104c888c81027d2d',
            'knight/gameasync/Data/Scripts.rxdata':'cfe8a3a81b392907a6056a8d96bfec5d6609557aa4118132f54a6d63fa198fa4',
            'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata':'bbf5ec438a88f032780f9464a862ca4728f1f34afa1b74053ca7c6a9243ca3ed'
          }
          version='V229' if all(hashes.get(k)==v for k,v in base.items()) else 'V229R1' if all(hashes.get(k)==v for k,v in final.items()) else None
          if not version:raise SystemExit('Not the exact V229 source; refusing to modify')
          Path('/tmp/slv229_source').write_text(version)
          Path('/tmp/slv229_before').write_text(json.dumps(hashes))
          print('VERIFIED_SOURCE',version)
          PY_CHECK

      - name: Fix only right-side tile priorities
        shell: bash
        run: |
          set -euo pipefail
          if test "$(cat /tmp/slv229_source)" = V229; then
            ruby - <<'RUBY_FIX'
          require 'zlib'
          require 'digest'
          path='site/knight/gameasync/Data/Scripts.rxdata'
          scripts=Marshal.load(File.binread(path))
          raise 'Wrong script count' unless scripts.length==135
          target=scripts[97]
          raise 'Wrong resolution script' unless target && target[1].to_s.dup.force_encoding('UTF-8').include?('해상도')
          old=Zlib::Inflate.inflate(target[2])
          anchor='@tilemap2.map_data = $game_map.data'
          addition='@tilemap2.priorities = $game_map.priorities'
          raise 'Ambiguous target' unless old.scan(anchor).length==1 && !old.include?(addition)
          changed=old.sub(/(\s*#{Regexp.escape(anchor)})(\r?\n)/) { "#{$1}#{$2}    #{addition}#{$2}" }
          raise 'Patch failed' unless changed.include?(addition)
          raise 'Unexpected lower-screen change' unless changed.include?('@tilemap3.map_data = $game_map.data') && changed.include?('@tilemap4.map_data = $game_map.data')
          target[2]=Zlib::Deflate.deflate(changed)
          File.binwrite(path,Marshal.dump(scripts))
          expected='cfe8a3a81b392907a6056a8d96bfec5d6609557aa4118132f54a6d63fa198fa4'
          raise 'Unexpected script output' unless Digest::SHA256.file(path).hexdigest==expected
          RUBY_FIX
            python3 - <<'PY_CACHE'
          from pathlib import Path
          import hashlib,re
          root=Path('site/knight')
          rel='Data/Scripts.rxdata'
          md5=hashlib.md5((root/'gameasync'/rel).read_bytes()).hexdigest()
          p=root/'gameasync/mapping.js'
          data=p.read_text(encoding='utf-8')
          data,n=re.subn(re.escape(rel+'?h=')+r'[0-9a-f]{32}',lambda _:rel+'?h='+md5,data)
          if n!=1:raise SystemExit('Mapping update failed')
          p.write_text(data,encoding='utf-8')
          index=root/'index.html'
          html=index.read_text(encoding='utf-8')
          marker='gameasync/mapping.js?v=v229'
          if html.count(marker)!=1:raise SystemExit('Unexpected game cache version')
          index.write_text(html.replace(marker,'gameasync/mapping.js?v=v229r1'),encoding='utf-8')
          PY_CACHE
          else
            echo V229_RIGHT_TILEMAP_ALREADY_CORRECTED
          fi

      - name: Verify no unintended modifications
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          old=json.loads(Path('/tmp/slv229_before').read_text())
          new={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if len(new)!=5354 or new.keys()!=old.keys():raise SystemExit('Game inventory changed')
          expected={
            'knight/index.html':'c972da44d2a87ed6a60eefda1e7521e0e5eff221568ce956516d23e3bc79c738',
            'knight/gameasync/mapping.js':'7a4ca5406d36631e627090f7b23dc470bd9650c728de4338104c888c81027d2d',
            'knight/gameasync/Data/Scripts.rxdata':'cfe8a3a81b392907a6056a8d96bfec5d6609557aa4118132f54a6d63fa198fa4',
            'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata':'bbf5ec438a88f032780f9464a862ca4728f1f34afa1b74053ca7c6a9243ca3ed'
          }
          if any(new.get(k)!=v for k,v in expected.items()):raise SystemExit('Unexpected patched file checksums')
          touched={k for k in new if new[k]!=old[k]}
          wanted=set(expected)-{'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata'}
          version=Path('/tmp/slv229_source').read_text()
          if version=='V229' and touched!=wanted:raise SystemExit('Additional files changed '+repr(touched))
          if version=='V229R1' and touched:raise SystemExit('Repeat execution unexpectedly changed files')
          html=(root/'knight/index.html').read_text(encoding='utf-8')
          if html.count('gameasync/mapping.js?v=v229r1')!=1:raise SystemExit('Wrong client cache version')
          mapping=(root/'knight/gameasync/mapping.js').read_text(encoding='utf-8')
          rel='Data/Scripts.rxdata'
          md5=hashlib.md5((root/'knight/gameasync'/rel).read_bytes()).hexdigest()
          if mapping.count(rel+'?h='+md5)!=1:raise SystemExit('Wrong asset mapping')
          print('V229_RIGHT_TILEMAP_VERIFIED',version,len(touched))
          PY_FINAL

      - name: Upload verified game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
