
name: V214 | Restore Original Fairy Combat - Range Scan Only

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions:
  contents:
    read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Restore exact V212 published source
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: github-pages
          run-id: 38428850772
          github-token: ${{ github.token }}
          path: prior

      - name: Reconstruct original site and lock all resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          if test -s prior/artifact.tar; then
            tar -xf prior/artifact.tar -C site
            echo RESTORED_V212_FROM_ARTIFACT
          else
            python3 - <<'PY_RESTORE'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          import hashlib, json, re, time

          root = Path('site')
          base = 'https://gowellsik-hue.github.io/Game/'
          fixed = (
              'index.html',
              'COPYING-mkxp-web.txt',
              'manifest.webmanifest',
              'mkxp.js',
              'mkxp.wasm',
              'js/drive.js',
              'js/dpad.js',
              'js/localforage.min.js'
          )

          def download_bytes(url):
              for attempt in range(6):
                  try:
                      req = Request(
                          url,
                          headers={
                              'User-Agent': 'Fairy-V214',
                              'Accept-Encoding': 'identity'
                          }
                      )
                      with urlopen(req, timeout=60) as r:
                          return r.read()
                  except Exception:
                      if attempt == 5:
                          raise
                      time.sleep(1 + 2 * attempt)

          paths = {
              'index.html': (base + 'index.html', None)
          }

          for game in ('knight', 'elf'):
              for f in fixed:
                  paths[game + '/' + f] = (
                      base + game + '/' + quote(f, safe='/'),
                      None
                  )

              name = game + '/gameasync/mapping.js'
              contents = download_bytes(
                  base + name + '?snapshot=v212'
              )
              p = root / name
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(contents)

              text = contents.decode('utf-8')
              body = (
                  text.split('var mappingArray = ', 1)[1]
                  .split('];', 1)[0] + ']'
              )

              for _, mapped in json.loads(
                  re.sub(r',\s*\]$', ']', body)
              ):
                  rel, sep, md5 = mapped.partition('?h=')

                  if '.' not in Path(rel).name:
                      continue
                  if '..' in Path(rel).parts or rel.startswith('/'):
                      raise RuntimeError('Unsafe mapped filename')

                  dest = game + '/gameasync/' + rel
                  if dest in paths:
                      raise RuntimeError(
                          'Duplicate asset: ' + dest
                      )

                  url = (
                      base + game + '/gameasync/'
                      + quote(rel, safe='/')
                  )
                  paths[dest] = (
                      url + ('?h=' + md5 if sep else ''),
                      md5 if sep else None
                  )

          if len(paths) != 5355:
              raise RuntimeError(
                  'Wrong source file count: ' + str(len(paths))
              )

          def job(p):
              name, (url, md5) = p
              raw = download_bytes(url)

              if md5 and hashlib.md5(raw).hexdigest() != md5:
                  raise RuntimeError(
                      'Mapped file hash mismatch: ' + name
                  )

              dst = root / name
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_bytes(raw)

          pending = [
              v for v in paths.items()
              if not (root / v[0]).is_file()
          ]

          with ThreadPoolExecutor(max_workers=16) as pool:
              futures = [
                  pool.submit(job, p) for p in pending
              ]
              for i, future in enumerate(
                  as_completed(futures), 1
              ):
                  future.result()
                  if i % 500 == 0:
                      print(
                          'Restored', i, '/', len(pending),
                          flush=True
                      )

          actual = {
              str(p.relative_to(root))
              for p in root.rglob('*') if p.is_file()
          }

          if actual != set(paths):
              raise RuntimeError(
                  'Published site incomplete'
              )

          print('RESTORED_V212_FROM_PUBLISHED_SITE')
          PY_RESTORE
          fi

          python3 - <<'PY_LOCK'
          from pathlib import Path
          import hashlib, json

          root = Path('site')
          checks = {
              'knight/index.html':
                  '38b008e7e31b5a7f8eee1aac255641adf1c38a6927ecd8a2b4a29e71e7f1b8a4',
              'knight/gameasync/Data/Scripts.rxdata':
                  '8966a677a9789f3e9c95a058659dcf22b51d98fb1c68dd946a4e6879cf2bbaec',
              'elf/index.html':
                  'ecb0f8cfc9cc47c2b842d854b5d8ea59566c0d1560f931912af85f92bc75b253',
              'elf/gameasync/mapping.js':
                  '8762e27569d5825fc42513adb0f104373d67d2dd6ac4145823cbfbf3448a69b0',
              'elf/gameasync/Data/Scripts.rxdata':
                  'ea3f4e63ec352c4dd3241740dee43a3d769b7693b870fcbeda8bde02b49fbbc8',
              'elf/js/dpad.js':
                  '52e1b860e2ad9c3f6194d7cf983bcf6fa1a43354650d71fd9fd11984761cde69',
              'elf/mkxp.wasm':
                  '83f6138820a3587ec569bca801d3032ec39edfda1cb49fbb90ab3928821966bd'
          }

          source = {
              str(p.relative_to(root)):
                  hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          if len(source) != 5355:
              raise SystemExit(
                  'Incomplete V212 files: ' + str(len(source))
              )

          for name, value in checks.items():
              if source.get(name) != value:
                  raise SystemExit(
                      'Wrong V212 source: ' + name
                  )

          Path('/tmp/v214_original.json').write_text(
              json.dumps(source), encoding='utf-8'
          )
          Path('/tmp/v214_original_scripts.rxdata').write_bytes(
              (root / 'elf/gameasync/Data/Scripts.rxdata').read_bytes()
          )

          print('V214_V212_SOURCE_VERIFIED_5355')
          PY_LOCK

      - name: Delete invented combat overrides and extend native targeting only
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v214_patch.rb <<'RUBY_PATCH'
          # encoding: utf-8
          require 'zlib'

          path = ARGV.fetch(0)
          scripts = Marshal.load(File.binread(path))

          player = scripts.select do |e|
            e.is_a?(Array) && e[1].to_s == 'Game_Player'
          end

          addon = scripts.select do |e|
            e.is_a?(Array) &&
              e[1].to_s == 'SLFairy Native Monster AI and Hit V212'
          end

          unless player.size == 1 && addon.size == 1
            abort "Expected original player and one injected addon"
          end

          source_original = Zlib::Inflate.inflate(
            player.first[2]
          ).force_encoding('UTF-8')

          crlf = source_original.include?("\r\n")
          source = source_original.gsub("\r\n", "\n")

          marker = "  def check_event_trigger_there(triggers)\n"
          start = source.index(marker)
          finish = start && source.index("\n  end\n", start)

          abort 'Original Game_Player method missing' unless
            start && finish

          method = source[
            start...(finish + "\n  end\n".length)
          ]

          unless method.rstrip.end_with?("return result\n  end")
            abort 'Original method return changed'
          end

          extension = <<'RANGE'
              # V214: extend target discovery only.
              # Original events perform all combat processing.
              if result == false &&
                 triggers == [0,1,2] &&
                 Input.press?(Input::C) &&
                 !$game_system.map_interpreter.running? &&
                 !$game_temp.message_window_showing &&
                 !$game_switches[743]

                actor = $game_party.actors[0]
                weapon = actor && $data_weapons &&
                         $data_weapons[actor.weapon_id.to_i]

                bow_name = weapon ?
                  weapon.name.to_s.dup.force_encoding('UTF-8') : ''

                player_name = @character_name.to_s.dup
                player_name.force_encoding('UTF-8')

                bow = bow_name.include?('활') ||
                      bow_name.include?('궁') ||
                      bow_name.downcase.include?('bow') ||
                      (
                        actor &&
                        actor.weapon_id.to_i == 0 &&
                        (
                          player_name.include?('요정') ||
                          player_name.include?('엘프')
                        )
                      )

                if bow
                  dx = (
                    @direction == 6 ? 1 :
                    @direction == 4 ? -1 : 0
                  )
                  dy = (
                    @direction == 2 ? 1 :
                    @direction == 8 ? -1 : 0
                  )

                  if dx != 0 || dy != 0
                    x = @x
                    y = @y

                    (1..8).each do |distance|
                      nx = x + dx
                      ny = y + dy

                      break unless $game_map.valid?(nx, ny)
                      break unless sl214_terrain_open?(
                        x, y, @direction
                      )
                      break unless sl214_terrain_open?(
                        nx, ny, 10 - @direction
                      )

                      tile_events = $game_map.events.values.select do |ev|
                        ev.x == nx && ev.y == ny
                      end

                      enemy = tile_events.find do |ev|
                        raw = ev.instance_variable_get(:@event)

                        raw &&
                          raw.name.to_s.start_with?('[ID') &&
                          ev.instance_variable_get(:@page) &&
                          !ev.instance_variable_get(:@erased) &&
                          !ev.instance_variable_get(:@starting) &&
                          !ev.jumping? &&
                          !ev.through &&
                          ev.character_name.to_s != '' &&
                          [0,1,2].include?(ev.trigger) &&
                          ev.list &&
                          ev.list.size > 1
                      end

                      # Preserve native NPC interaction.
                      # NPCs and solid objects block ranged targeting.
                      blocked = tile_events.any? do |ev|
                        ev != enemy &&
                          !ev.through &&
                          ev.character_name.to_s != ''
                      end
                      break if blocked

                      if enemy && distance > 1
                        enemy.turn_toward_player

                        # ORIGINAL RPG Maker event.
                        # No independent hit/damage/animation logic.
                        enemy.start

                        result = true
                        break
                      end

                      # One-tile monsters use the original method.
                      break if enemy

                      x = nx
                      y = ny
                    end
                  end
                end
              end
          RANGE

          return_at = method.rindex("    return result\n")
          abort 'Native return statement missing' unless return_at

          modified = (
            method[0...return_at] +
            extension +
            method[return_at..-1]
          )

          source = source.sub(method, modified)

          helper = <<'HELPER'
            # Terrain only. Does not replace native event collision.
            def sl214_terrain_open?(x, y, direction)
              return false unless $game_map.valid?(x, y)

              mask = (
                1 << (direction / 2 - 1)
              ) & 0x0f

              [2,1,0].each do |layer|
                tile = $game_map.data[x, y, layer]
                return false if tile.nil?

                passage = $game_map.passages[tile]

                if passage.nil? ||
                   (passage & mask) != 0 ||
                   (passage & 0x0f) == 0x0f
                  return false
                end

                if $game_map.priorities[tile] == 0
                  return true
                end
              end

              true
            end

          HELPER

          source = source.sub(marker, helper + marker)

          if crlf
            source = source.gsub("\n", "\r\n")
          end

          RubyVM::InstructionSequence.compile(
            source, 'V214 Native Game_Player'
          )

          player.first[2] = Zlib::Deflate.deflate(source)

          # Completely disable the old synthetic combat engine.
          addon.first[1] = 'SL214 Native Combat Restored'
          addon.first[2] = Zlib::Deflate.deflate(
            "# Original combat events only.\n"
          )

          File.binwrite(path, Marshal.dump(scripts))
          puts 'SL214_NATIVE_EVENTS_RESTORED'
          RUBY_PATCH

          ruby /tmp/v214_patch.rb \
            site/elf/gameasync/Data/Scripts.rxdata

      - name: Remove unused fake attack atlas and refresh Fairy cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CLEAN'
          from pathlib import Path
          import hashlib, re

          elf = Path('site/elf')
          data = elf/'gameasync/Data/Scripts.rxdata'
          mapping = elf/'gameasync/mapping.js'
          html = elf/'index.html'

          m = mapping.read_text(encoding='utf-8')
          atlas = elf/'gameasync/Graphics/Pictures/SL_V205_Attack.png'

          marker = (
            r'^\["graphics/pictures/sl_v205_attack",\s*'
            r'"Graphics/Pictures/SL_V205_Attack\.png'
            r'\?h=[a-f0-9]{32}"\],\s*\n'
          )

          m, count = re.subn(
              marker, '', m, count=1, flags=re.M
          )

          if count != 1 or not atlas.is_file():
              raise SystemExit('Fake attack atlas mismatch')

          atlas.unlink()

          rx = (
            r'(\["data/scripts",\s*'
            r'"Data/Scripts\.rxdata\?h=)'
            r'[a-f0-9]{32}("\],)'
          )

          digest = hashlib.md5(data.read_bytes()).hexdigest()

          m, count = re.subn(
              rx,
              lambda match: (
                  match.group(1) +
                  digest +
                  match.group(2)
              ),
              m
          )

          if count != 1:
              raise SystemExit('Scripts mapping mismatch')

          mapping.write_text(m, encoding='utf-8')

          text = html.read_text(encoding='utf-8')
          replacements = (
              (
                'gameasync/mapping.js?v=fairy212',
                'gameasync/mapping.js?v=fairy214'
              ),
              (
                "box.textContent='V212 '+state",
                "box.textContent='V214 '+state"
              )
          )

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit('HTML marker mismatch: ' + old)
              text = text.replace(old, new, 1)

          # The old diagnostic depended on the removed SLBEAT hook.
          # Hide its stale STALL display, retain spinner handling.
          old = 'document.body.appendChild(box);'
          if text.count(old) != 1:
              raise SystemExit('Spinner diagnostic mismatch')

          text = text.replace(
              old,
              old + 'box.style.display="none";',
              1
          )

          html.write_text(text, encoding='utf-8')
          print('V214_FAKE_ATLAS_REMOVED_AND_CACHE_UPDATED')
          PY_CLEAN

      - name: Verify original combat scripts, saves, and file scope
        shell: bash
        run: |
          set -euo pipefail

          ruby -rzlib - \
            /tmp/v214_original_scripts.rxdata \
            site/elf/gameasync/Data/Scripts.rxdata <<'RUBY_VERIFY'
          before = Marshal.load(File.binread(ARGV[0]))
          after = Marshal.load(File.binread(ARGV[1]))

          abort 'Script count changed' unless
            before.size == after.size

          changed = before.each_index.select do |i|
            before[i] != after[i]
          end

          original_player = before.find do |e|
            e.is_a?(Array) && e[1] == 'Game_Player'
          end

          current_player = after.find do |e|
            e.is_a?(Array) && e[1] == 'Game_Player'
          end

          original_hook = before.find do |e|
            e.is_a?(Array) &&
              e[1] == 'SLFairy Native Monster AI and Hit V212'
          end

          clean_hook = after.find do |e|
            e.is_a?(Array) &&
              e[1] == 'SL214 Native Combat Restored'
          end

          unless original_player &&
                 current_player &&
                 original_hook &&
                 clean_hook
            abort 'Expected scripts missing'
          end

          allowed = [
            before.index(original_player),
            before.index(original_hook)
          ].sort

          abort 'Unexpected Ruby script modification' unless
            changed.sort == allowed

          source = Zlib::Inflate.inflate(
            current_player[2]
          ).force_encoding('UTF-8')

          old_source = Zlib::Inflate.inflate(
            original_player[2]
          ).force_encoding('UTF-8')

          # Player update and original attack key path unchanged.
          unless source.split('  def update', 2).last ==
                 old_source.split('  def update', 2).last
            abort 'Original player update changed'
          end

          unless source.include?('enemy.start') &&
                 source.include?('sl214_terrain_open?')
            abort 'Native target bridge missing'
          end

          addon = Zlib::Inflate.inflate(clean_hook[2])

          if addon.include?('def update') ||
             addon.include?('damage_spec')
            abort 'Synthetic combat logic still active'
          end

          [
            'Scene_Title',
            'Scene_Map',
            'Scene_Menu',
            'Scene_Save',
            'Scene_Load',
            'MOG - S HUD',
            'Web Compatibility'
          ].each do |name|
            old_entry = before.find do |e|
              e.is_a?(Array) && e[1] == name
            end
            new_entry = after.find do |e|
              e.is_a?(Array) && e[1] == name
            end
            abort "Protected script changed: #{name}" unless
              old_entry && new_entry && old_entry == new_entry
          end

          RubyVM::InstructionSequence.compile(
            source, 'V214 verification'
          )

          puts 'V214_NATIVE_COMBAT_AND_SAVES_PRESERVED'
          RUBY_VERIFY

          python3 - <<'PY_VERIFY'
          from pathlib import Path
          import hashlib, json

          root = Path('site')
          original = json.loads(
              Path('/tmp/v214_original.json').read_text(
                  encoding='utf-8'
              )
          )

          current = {
              str(p.relative_to(root)):
                  hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          removed = {
              'elf/gameasync/Graphics/Pictures/SL_V205_Attack.png'
          }

          allowed = {
              'elf/index.html',
              'elf/gameasync/mapping.js',
              'elf/gameasync/Data/Scripts.rxdata'
          }

          if set(original) - set(current) != removed:
              raise SystemExit('Unexpected removed files')

          if set(current) - set(original):
              raise SystemExit('Unexpected added files')

          changed = {
              p for p in current
              if current[p] != original[p]
          }

          if changed != allowed:
              raise SystemExit(
                  'Other files changed: ' + repr(changed)
              )

          elf = root/'elf'
          scripts = (
              elf/'gameasync/Data/Scripts.rxdata'
          ).read_bytes()

          mapping = (
              elf/'gameasync/mapping.js'
          ).read_text(encoding='utf-8')

          digest = hashlib.md5(scripts).hexdigest()

          if 'Data/Scripts.rxdata?h=' + digest not in mapping:
              raise SystemExit('Scripts mapping stale')

          if 'SL_V205_Attack' in mapping:
              raise SystemExit('Fake attack atlas still mapped')

          html = (
              elf/'index.html'
          ).read_text(encoding='utf-8')

          knight_html = (
              root/'knight/index.html'
          ).read_text(encoding='utf-8')

          assert 'slfairy_v105_engine' in html
          assert 'slknight_v14_engine' in knight_html
          assert 'gameasync/mapping.js?v=fairy214' in html

          print('V214_EXACT_MODIFICATION_SCOPE_VERIFIED')
          PY_VERIFY

          node --check site/elf/js/dpad.js
          node --check site/knight/js/dpad.js

      - name: Native targeting and NPC interaction regression checks
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v214_smoke.rb <<'RB_SMOKE'
          # encoding: utf-8
          require 'zlib'

          scripts = Marshal.load(File.binread(ARGV.fetch(0)))
          entry = scripts.find do |x|
            x.is_a?(Array) && x[1] == 'Game_Player'
          end

          player = Zlib::Inflate.inflate(
            entry[2]
          ).force_encoding('UTF-8').gsub("\r\n", "\n")

          start = player.index('  def sl214_terrain_open?(')
          finish = player.index(
            '  def check_event_trigger_touch', start
          )
          raise 'Native method missing' unless start && finish

          section = player[start...finish]

          module Input
            C = 13

            def self.press?(key)
              @pressed
            end

            def self.pressed=(value)
              @pressed = value
            end
          end

          class FakeEvent
            attr_accessor :x, :y, :trigger, :through
            attr_accessor :character_name, :id, :starts, :turns
            attr_accessor :list

            def initialize(x, y, name, trigger=2)
              @x, @y = x, y
              @id = 1
              @trigger = trigger
              @through = false
              @character_name = name
              @event = Struct.new(:name).new(name)
              @page = Object.new
              @erased = false
              @starting = false
              @starts = 0
              @turns = 0
              @list = [1, 2]
            end

            def jumping?
              false
            end

            def over_trigger?
              false
            end

            def start
              @starts += 1
            end

            def turn_toward_player
              @turns += 1
            end
          end

          class FakeMap
            attr_accessor :events, :blocked
            attr_reader :passages, :priorities, :data

            def initialize(events={})
              @events = events
              @blocked = []
              @passages = [0, 0, 15]
              @priorities = [0, 0, 0]
              @data = self
            end

            def valid?(x, y)
              x >= 0 && y >= 0 && x < 30 && y < 30
            end

            def counter?(*args)
              false
            end

            def [](x, y, z)
              @blocked.include?([x, y]) && z == 2 ? 2 : 1
            end
          end

          class Game_Player
            def initialize
              @x = 1
              @y = 1
              @direction = 6
              @character_name = '여요정'
            end
          end

          Game_Player.class_eval(
            section, 'V214 Native Player Test', 1
          )

          $game_system = Struct.new(:map_interpreter).new(
            Struct.new(:running?).new(false)
          )
          $game_temp = Struct.new(
            :message_window_showing
          ).new(false)
          $game_switches = Array.new(1500, false)

          actor = Struct.new(:weapon_id).new(1)
          $game_party = Struct.new(:actors).new([actor])
          $data_weapons = Array.new(100)
          $data_weapons[1] = Struct.new(:name).new('활(2handed)')
          $data_weapons[40] = Struct.new(:name).new('대검(2handed)')

          Input.pressed = true
          player_obj = Game_Player.new

          monster = FakeEvent.new(3, 1, '[ID에틴]')
          $game_map = FakeMap.new({1 => monster})

          raise 'Two tile attack failed' unless
            player_obj.check_event_trigger_there([0,1,2]) &&
            monster.starts == 1 &&
            monster.turns == 1

          monster = FakeEvent.new(9, 1, '[ID에틴]')
          $game_map = FakeMap.new({1 => monster})

          raise 'Eight tile attack failed' unless
            player_obj.check_event_trigger_there([0,1,2]) &&
            monster.starts == 1

          monster = FakeEvent.new(10, 1, '[ID에틴]')
          $game_map = FakeMap.new({1 => monster})

          raise 'Range exceeds eight tiles' if
            player_obj.check_event_trigger_there([0,1,2])

          monster = FakeEvent.new(3, 1, '[ID에틴]')
          $game_map = FakeMap.new({1 => monster})
          $game_map.blocked = [[2,1]]

          raise 'Wall penetration' if
            player_obj.check_event_trigger_there([0,1,2])

          monster = FakeEvent.new(3, 1, '[ID에틴]')
          npc = FakeEvent.new(2, 1, '상인', 4)
          $game_map = FakeMap.new({
            1 => monster,
            2 => npc
          })

          raise 'NPC penetration' if
            player_obj.check_event_trigger_there([0,1,2])

          npc.trigger = 0

          raise 'Native NPC interaction failed' unless
            player_obj.check_event_trigger_there([0,1,2]) &&
            npc.starts == 1 &&
            monster.starts == 0

          monster = FakeEvent.new(2, 1, '[ID에틴]')
          $game_map = FakeMap.new({1 => monster})

          raise 'Native adjacent attack failed' unless
            player_obj.check_event_trigger_there([0,1,2]) &&
            monster.starts == 1 &&
            monster.turns == 0

          monster = FakeEvent.new(3, 1, '[ID에틴]')
          $game_map = FakeMap.new({1 => monster})
          actor.weapon_id = 40

          raise 'Melee range regression' if
            player_obj.check_event_trigger_there([0,1,2])

          actor.weapon_id = 0

          raise 'Starter Fairy range regression' unless
            player_obj.check_event_trigger_there([0,1,2]) &&
            monster.starts == 1

          Input.pressed = false
          monster = FakeEvent.new(3, 1, '[ID에틴]')
          $game_map = FakeMap.new({1 => monster})

          raise 'Attack without input' if
            player_obj.check_event_trigger_there([0,1,2])

          puts 'V214_NATIVE_TARGET_TESTS_PASSED'
          RB_SMOKE

          ruby /tmp/v214_smoke.rb \
            site/elf/gameasync/Data/Scripts.rxdata

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
