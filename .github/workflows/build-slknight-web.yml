
name: build-slknight-web.yml | V2.1 | Healer Aggro, Teleport Reset, Holy Walk Buff Icon

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Restore V1.36 game without modifying other game features
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 43703021854
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify original game and retain exact file hashes
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build/v21 source
          tar -xf baseline/artifact.tar -C site
          python3 <<'PY'
          from pathlib import Path
          import hashlib,json,struct
          root=Path('site');output=Path('build/v21')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          assert len(before)==5619,('Wrong last deployed game',len(before))
          assert 'SLKnight V1.36' in (root/'knight/index.html').read_text('utf-8')
          assert "var version='V1.36';" in (root/'knight/js/sl-assets-v229r115.js').read_text('utf-8')
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          base=root/'knight/gameasync/Data'
          for name,dest in [('Scripts.rxdata','Scripts.v136.original.rxdata'),
                            (prefix+'Map047.rxdata','Map047.v136.original.rxdata'),
                            (prefix+'Map029.rxdata','Map029.v136.original.rxdata')]:
              p=base/name
              assert p.is_file(),('Original game source missing',name)
              (output/dest).write_bytes(p.read_bytes())
          pack=root/'knight/assets/map-047-v241.pack'
          h=pack.read_bytes()
          n=struct.unpack_from('<I',h)[0]
          manifest=json.loads(h[4:4+n]);assert manifest['map_id']==47 and len(manifest['files'])==194
          (output/'map-047-v241.original.pack').write_bytes(h)
          (output/'before.json').write_text(json.dumps(before,sort_keys=True),'utf-8')
          print('PASS last deployed V1.36 original: 5619 files and original 194 map assets')
          PY

      - name: Retrieve exact Sanctuary Map0 native source files
        shell: bash
        run: |
          set -euo pipefail
          gh release download v1.0.0 -R gowellsik-hue/Game \
            -p 'Sanctuary.of.Aden.-.Copy.z32' \
            -p 'Sanctuary.of.Aden.-.Copy.z33' \
            -p 'Sanctuary.of.Aden.-.Copy.z34' \
            -p 'Sanctuary.of.Aden.-.Copy.z35' \
            -p 'Sanctuary.of.Aden.-.Copy.z36' \
            -p 'Sanctuary.of.Aden.-.Copy.zip' \
            -D source --clobber
          for n in 32 33 34 35 36; do test -s "source/Sanctuary.of.Aden.-.Copy.z${n}"; done
          test -s source/Sanctuary.of.Aden.-.Copy.zip
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet --disable-pip-version-check 'Pillow>=11,<13'

      - name: Reconstruct complete native Map0 artwork and full walkability
        shell: bash
        run: |
          set -euo pipefail
          cat > build/v21/build_map047_original.py <<'V21_SOURCE_EOF'
          from pathlib import Path
          from collections import Counter
          from functools import lru_cache
          import hashlib, json, os, re, struct, sys, time, zlib
          from PIL import Image, ImageChops, ImageStat
          from io import BytesIO

          SITE=Path('site'); ROOT=Path('source'); OUT=Path('build/v21')
          OUT.mkdir(parents=True,exist_ok=True)
          W,H=768,384
          PX,PY=W*16,H*16
          SHIFT_X,SHIFT_Y=175*16,10*16
          STEM='Sanctuary.of.Aden.-.Copy'
          raw=(ROOT/(STEM+'.zip')).read_bytes()
          records=[]; pos=0
          while True:
              pos=raw.find(b'PK\x01\x02',pos)
              if pos<0 or pos+46>len(raw):break
              fields=struct.unpack_from('<IHHHHHHIIIHHHHHII',raw,pos)
              name_len,ex,comment=fields[10:13]
              end=pos+46+name_len+ex+comment
              if not 0<name_len<=1024 or end>len(raw):pos+=4;continue
              name=raw[pos+46:pos+46+name_len].decode('utf-8' if fields[3]&0x800 else 'cp949','replace').replace('\\','/')
              if re.search(r'/map/0/[0-9a-f]{8}\.s32$',name,re.I) or name.lower().endswith(('/tile.idx','/tile.pak')):
                  records.append({'name':name,'method':fields[4],'crc':fields[7], 'packed':fields[8], 'size':fields[9], 'disk':fields[13], 'offset':fields[16]})
              pos=end
          maps=[x for x in records if re.search(r'/map/0/[0-9a-f]{8}\.s32$',x['name'],re.I)]
          assert len(maps)==64,('Original Map0 source must have all 64 S32 blocks',len(maps))
          assert len({r['name'].lower() for r in records})==66,('Duplicate/missing original data',len(records))
          @lru_cache(maxsize=3)
          def volume(disk):
              assert 0<=disk<=45,('Invalid archive disk',disk)
              n=STEM+(f'.z{disk+1:02d}' if disk<45 else '.zip')
              return (ROOT/n).read_bytes()
          def read_span(d,o,n):
              out=bytearray()
              while len(out)<n:
                  data=volume(d); k=min(n-len(out),len(data)-o)
                  assert k>=0,('Archive offset beyond EOF',d,o)
                  if k==0:d+=1;o=0;continue
                  out.extend(data[o:o+k]);o+=k
                  if o==len(data):d+=1;o=0
              return bytes(out)
          def advance(d,o,n):
              while n:
                  data=volume(d);k=min(n,len(data)-o)
                  assert k>=0
                  if k==0:d+=1;o=0;continue
                  o+=k;n-=k
                  if o==len(data):d+=1;o=0
              return d,o
          def extract(rec):
              d,o=rec['disk'],rec['offset'];head=read_span(d,o,30)
              assert head[:4]==b'PK\x03\x04',('Missing original file header',rec['name'])
              n,ex=struct.unpack_from('<HH',head,26)
              d,o=advance(d,o,30+n+ex)
              packed=read_span(d,o,rec['packed'])
              data=zlib.decompress(packed,-15) if rec['method']==8 else packed
              assert len(data)==rec['size'] and (zlib.crc32(data)&0xffffffff)==rec['crc'],('Original CRC error',rec['name'])
              return data
          idx=extract(next(r for r in records if r['name'].lower().endswith('/tile.idx')))
          pak=extract(next(r for r in records if r['name'].lower().endswith('/tile.pak')))
          n=struct.unpack_from('<I',idx)[0]
          assert n>4000 and len(idx)==4+28*n,('Original Tile.idx invalid',n)
          files={}
          for i in range(n):
              p=4+i*28
              off=struct.unpack_from('<I',idx,p)[0]
              name=idx[p+4:p+24].split(b'\0')[0].decode('ascii','replace').lower()
              size=struct.unpack_from('<I',idx,p+24)[0]
              assert name not in files and off+size<=len(pak),('Bad Tile.pak file',name)
              files[name]=(off,size)
          print('PASS original source',len(maps),'blocks',n,'tile files',flush=True)
          blocks=[]
          for rec in maps:
              data=extract(rec)
              name=Path(rec['name']).stem.lower()
              bx,by=int(name[:4],16),int(name[4:],16)
              blocks.append((bx,by,name,data))
          xs=sorted({x for x,y,s,d in blocks});ys=sorted({y for x,y,s,d in blocks})
          assert len(xs)==8 and len(ys)==8 and len(blocks)==64,('Incomplete 512x512 native Map0',xs,ys)
          assert xs==list(range(xs[0],xs[0]+8)) and ys==list(range(ys[0],ys[0]+8))
          attr=bytearray(512*512*2)
          coverage=bytearray(512*512)
          for bx,by,stem,data in blocks:
              count=struct.unpack_from('<H',data,128*64*4)[0]
              layer3=128*64*4+2+count*6
              assert layer3+4096*4<=len(data),('Missing original attributes',stem)
              for y in range(64):
                  for x in range(64):
                      i=(by-ys[0])*64*512+(bx-xs[0])*64+y*512+x
                      assert not coverage[i]
                      a,b=struct.unpack_from('<HH',data,layer3+(y*64+x)*4)
                      struct.pack_into('<H',attr,i*2,a)
                      coverage[i]=1
          assert sum(coverage)==512*512
          (OUT/'attr1_512x512_le.bin').write_bytes(attr)
          (OUT/'map0-coverage.json').write_text(json.dumps({'width':512,'height':512,'blocks':64,'covered':sum(coverage),'xs':[xs[0],xs[-1]],'ys':[ys[0],ys[-1]]},indent=2))
          walk=bytearray(2*W*H); attrs=memoryview(attr).cast('H')
          # The verified Map047 whole-island projection is in native 32-pixel coordinates.
          for y in range(H):
              py=y*32+48
              for x in range(W):
                  px=x*32+16
                  sx=round(256+px/48-py/24)
                  sy=round(-256+px/48+py/24)
                  sx=min(511,max(0,sx));sy=min(511,max(0,sy))
                  tile=384 if attrs[sy*512+sx]&1==0 else 385
                  struct.pack_into('<H',walk,2*(y*W+x),tile)
          (OUT/'map47-full-walk.bin').write_bytes(walk)
          print('PASS 768x384 original full-map collision attributes',flush=True)

          @lru_cache(maxsize=14000)
          def tile_bitmap(tile,index):
              info=files.get(f'{tile}.til')
              if not info:return None
              off,size=info
              blob=memoryview(pak)[off:off+size]
              if len(blob)<12:return None
              frames=struct.unpack_from('<I',blob,0)[0]
              if not (0<=index<frames<=2048):return None
              base=4+4*(frames+1)
              a,b=struct.unpack_from('<II',blob,4+index*4)
              if a>=b or base+b>len(blob):return None
              frame=blob[base+a:base+b]
              typ=frame[0]
              if typ not in (0,1,2,3,6,7,8,9,16,17,18,19,22,23,34,35):return None
              rgba=bytearray(24*24*4)
              def dot(x,y,val):
                  if 0<=x<24 and 0<=y<24:
                      j=4*(y*24+x)
                      rgba[j]=(val>>10&31)*255//31
                      rgba[j+1]=(val>>5&31)*255//31
                      rgba[j+2]=(val&31)*255//31
                      rgba[j+3]=255
              p=1
              try:
                  if not typ&2:
                      for y in range(24):
                          q=(y+1)*2 if y<12 else (23-y)*2
                          x0=0 if typ&1 else 24-q
                          for x in range(q):
                              val=struct.unpack_from('<H',frame,p)[0];p+=2;dot(x0+x,y,val)
                  else:
                      xo,yo,_,rows=struct.unpack_from('<BBBB',frame,p);p+=4
                      for y in range(rows):
                          x=xo;segments=frame[p];p+=1
                          for seg in range(segments):
                              x+=frame[p]//2;p+=1
                              span=frame[p];p+=1
                              for j in range(span):
                                  val=struct.unpack_from('<H',frame,p)[0];p+=2;dot(x+j,yo+y,val)
                              x+=span
              except (struct.error,IndexError):return None
              return Image.frombytes('RGBA',(24,24),bytes(rgba)).resize((12,12),Image.Resampling.NEAREST)

          # Existing V241 native projection plus the fixed full-map coordinate offset.
          floor=[];layer2=[];objects=[];layer5=[];bounds={};sizes={}
          for bx,by,stem,data in blocks:
              ox=(bx-0x7fff)*64+0x7fff-63
              oy=(by-0x7fff)*64+0x7fff-63
              for yy in range(64):
                  for xx in range(128):
                      index,tile,_=struct.unpack_from('<BHB',data,4*(yy*128+xx))
                      nx=ox+xx//2;ny=oy+yy
                      x=12*(nx+ny-65024)-2800+12*(xx&1)+SHIFT_X
                      y=6*(ny-nx)-166+SHIFT_Y
                      if x>-12 and y>-12 and x<PX and y<PY:
                          floor.append((x,y,tile,index))
              p=128*64*4
              count=struct.unpack_from('<H',data,p)[0];p+=2
              for j in range(count):
                  xx,yy,index,tile,_=struct.unpack_from('<BBBHB',data,p);p+=6
                  nx=ox+xx//2;ny=oy+yy
                  x=12*(nx+ny-65024)-2800+12*(xx&1)+SHIFT_X
                  y=6*(ny-nx)-166+SHIFT_Y
                  if x>-12 and y>-12 and x<PX and y<PY:
                      layer2.append((x,y,tile,index))
              p+=64*64*4
              ngroups=struct.unpack_from('<i',data,p)[0];p+=4
              assert 0<=ngroups<100000,('Bad Layer4 group count',stem)
              for i in range(ngroups):
                  gid,num=struct.unpack_from('<hH',data,p);p+=4
                  key=(stem,gid)
                  assert key not in sizes
                  sizes[key]=num
                  box=[PX,PY,-1,-1]
                  for k in range(num):
                      xx,yy,layer,index,tile,_=struct.unpack_from('<BBBBhB',data,p);p+=7
                      if tile<0:continue
                      nx=ox+xx//2;ny=oy+yy
                      x=12*(nx+ny-65024)-2800+12*(xx&1)+SHIFT_X
                      y=6*(ny-nx)-166+SHIFT_Y
                      if x<PX and y<PY and x+12>0 and y+12>0:
                          box[0]=min(x,box[0]);box[1]=min(y,box[1])
                          box[2]=max(x+12,box[2]);box[3]=max(y+12,box[3])
                          objects.append((layer,x,y,tile,index))
                  if box[2]>box[0] and box[3]>box[1]:
                      bounds[key]=[max(0,box[0]),max(0,box[1]),min(PX,box[2]),min(PY,box[3])]
              n5=struct.unpack_from('<i',data,p)[0];p+=4
              assert 0<=n5<200000,('Bad Layer5 count',stem)
              for i in range(n5):
                  xx,yy,gid,typ=struct.unpack_from('<BBHB',data,p+i*5)
                  nx=ox+xx//2;ny=oy+yy
                  x=12*(nx+ny-65024)-2800+6*(xx&1)+SHIFT_X
                  y=6*(ny-nx)-166+SHIFT_Y
                  cx=(x+8)//16;cy=(y+8)//16
                  if 0<=cx<W and 0<=cy<H:layer5.append((cx,cy,stem,gid,typ))
          print('PASS full source traversal floor=%d layer2=%d objects=%d layer5=%d'%(len(floor),len(layer2),len(objects),len(layer5)),flush=True)

          # Pixel-perfect source renderer; no interpolation or invented scenery.
          panos=SITE/'knight/gameasync/Graphics/Panoramas';panos.mkdir(parents=True,exist_ok=True)
          ground_image=Image.new('RGBA',(PX,PY),(0,0,0,255))
          for dataset in (floor,layer2):
              for x,y,tile,index in dataset:
                  pic=tile_bitmap(tile,index)
                  if pic is not None:
                      ground_image.alpha_composite(pic,(x,y))
          # Verify all original 96 tile regions against the deployed V1.36 original.
          # Fixed offset restores exactly the old village alignment.
          original_pack=(OUT/'map-047-v241.original.pack').read_bytes()
          header_size=struct.unpack_from('<I',original_pack,0)[0]
          original_head=json.loads(original_pack[4:4+header_size])
          assert original_head['kind']=='map' and original_head['map_id']==47
          assert len(original_head['files'])==194,('Original installed map pack changed',len(original_head['files']))
          original_body=memoryview(original_pack)[4+header_size:]
          ground_in_pack={row[0]:(row[1],row[2]) for row in original_head['files']
                          if re.fullmatch(r'graphics/panoramas/slti_47_c\d+_\d+',row[0])}
          assert len(ground_in_pack)==96,('Original preloaded ground image count changed',len(ground_in_pack))
          comparisons=[]
          for gx in range(12):
              for gy in range(8):
                  key=f'graphics/panoramas/slti_47_c{gx}_{gy}'
                  offset,length=ground_in_pack[key]
                  assert 0<=offset and length>8 and offset+length<=len(original_body)
                  with Image.open(BytesIO(original_body[offset:offset+length])) as loaded:
                      old=loaded.convert('RGB')
                  assert old.size==(512,512),('Original preloaded ground size changed',key)
                  candidate=ground_image.crop((gx*512+SHIFT_X,gy*512+SHIFT_Y,(gx+1)*512+SHIFT_X,(gy+1)*512+SHIFT_Y)).convert('RGB')
                  diff=ImageChops.difference(old,candidate)
                  mae=sum(ImageStat.Stat(diff).mean)/3
                  comparisons.append(mae)
          assert max(comparisons)<25,('Reconstructed original ground differs from displayed V1.36 ground',max(comparisons))
          print('PASS all 96 actually displayed preloaded ground chunks align, worst MAE=',round(max(comparisons),3),flush=True)

          objects.sort(key=lambda row:row[0])
          upper_image=Image.new('RGBA',(PX,PY))
          for _,x,y,tile,index in objects:
              pic=tile_bitmap(tile,index)
              if pic is not None:upper_image.alpha_composite(pic,(x,y))
          fg=[];images=[]
          for gx in range(24):
              for gy in range(12):
                  a=gx*512;b=gy*512
                  floor_name=f'SLTI_47_C{gx}_{gy}.png'
                  upper_name=f'SLTI_47_L4_C{gx}_{gy}.png'
                  crop=ground_image.crop((a,b,a+512,b+512)).convert('RGB')
                  crop.save(panos/floor_name,optimize=True)
                  images.append(floor_name)
                  crop=upper_image.crop((a,b,a+512,b+512))
                  crop.save(panos/upper_name,optimize=True)
                  if crop.getbbox():fg.append([gx,gy]);images.append(upper_name)
          assert len(images)==288+len(fg),('Wrong source image inventory',len(images))
          assert len(fg)>73,('Expanded map must have original native structures',len(fg))

          referenced={ (stem,gid) for cx,cy,stem,gid,typ in layer5 if (stem,gid) in bounds }
          ordered=sorted(referenced)
          assert 0<len(ordered)<65535
          serial={key:i+1 for i,key in enumerate(ordered)}
          boxes=[[0,0,0,0]]+[bounds[key] for key in ordered]
          groups=[0]*(W*H);weights=[-1]*(W*H)
          for cx,cy,stem,gid,typ in layer5:
              key=(stem,gid)
              if key not in serial:continue
              cell=cy*W+cx
              score=sizes[key]
              if score>weights[cell]:groups[cell]=serial[key];weights[cell]=score
          assert any(groups),('Original Layer5 group projection missing')
          atlas=Image.new('RGB',(W,H),(0,0,0));atlas.putdata([(v&255,(v>>8)&255,0) for v in groups]);atlas.save(panos/'SLTI_47_GID.png',optimize=True)
          images.append('SLTI_47_GID.png')
          hex_bounds=''.join(''.join(f'{p:04x}' for p in box) for box in boxes)
          assert len(hex_bounds)==16*len(boxes)
          (OUT/'map47-group-bounds.hex').write_text(hex_bounds,'ascii')
          (OUT/'map47-foreground-keys.json').write_text(json.dumps(fg,separators=(',',':')),'utf-8')
          (OUT/'map47-generated-files.json').write_text(json.dumps(images,separators=(',',':')),'utf-8')
          (OUT/'source-metrics.json').write_text(json.dumps(dict(map_w=W,map_h=H,raw_block_count=len(blocks),floor_tiles=len(floor),layer2_tiles=len(layer2),layer4_tiles=len(objects),layer5_records=len(layer5),original_ground_compared=len(comparisons),max_ground_mae=max(comparisons),generated_images=len(images),foreground_images=len(fg),group_count=len(ordered)),indent=2),'utf-8')
          print('PASS full Map047 ground, original Layer4 and Layer5 lookup',len(images),'PNGs',len(ordered),'groups',flush=True)
          V21_SOURCE_EOF
          .venv/bin/python build/v21/build_map047_original.py

      - name: Expand only Map047 map data and Map029 confirmed entrance
        shell: bash
        run: |
          set -euo pipefail
          cat > build/v21/expand-map047.rb <<'V21_SOURCE_EOF'
          # encoding: UTF-8
          require 'digest'
          module RPG
            class Map; end
            class Event; end
            class Event::Page; end
            class Event::Page::Condition; end
            class Event::Page::Graphic; end
            class EventCommand; end
            class MoveCommand; end
            class MoveRoute; end
            class AudioFile; end
          end
          class Table
            def self._load(raw)
              obj = allocate
              obj.instance_variable_set(:@raw, raw)
              obj
            end
            def _dump(_depth)
              @raw
            end
          end
          class Tone
            def self._load(raw)
              obj = allocate
              obj.instance_variable_set(:@raw, raw)
              obj
            end
            def _dump(_depth)
              @raw
            end
          end
          class Color
            def self._load(raw)
              obj = allocate
              obj.instance_variable_set(:@raw, raw)
              obj
            end
            def _dump(_depth)
              @raw
            end
          end

          base=ENV.fetch('MAP47_DATA_ROOT')
          walk=ENV.fetch('MAP47_WALK_FILE')
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          f47=File.join(base, prefix+'Map047.rxdata')
          f29=File.join(base, prefix+'Map029.rxdata')
          source47=File.binread(f47)
          source29=File.binread(f29)
          map47=Marshal.load(source47)
          map29=Marshal.load(source29)
          raise 'Map047 original dimensions mismatch' unless [map47.instance_variable_get(:@width),map47.instance_variable_get(:@height)] == [363,238]
          raise 'Map047 original event count mismatch' unless map47.instance_variable_get(:@events).size == 7
          old_table=map47.instance_variable_get(:@data).instance_variable_get(:@raw)
          raise 'Map047 original Table mismatch' unless old_table.unpack('V5') == [3,363,238,3,3*363*238]
          old=old_table.byteslice(20,363*238*2).unpack('v*')
          raise 'Map047 original terrain values mismatch' unless old.all?{|v|v==384 || v==385}
          raise 'Map047 original upper layers mismatch' unless old_table.byteslice(20+363*238*2,363*238*4).unpack('v*').all?(&:zero?)
          new_ground=File.binread(walk)
          raise 'Original full-map collision bytes missing' unless new_ground.bytesize == 768*384*2
          new_ground=new_ground.unpack('v*')
          raise 'Unexpected full-map terrain palette' unless new_ground.all?{|v| v==384 || v==385}
          old_events=map47.instance_variable_get(:@events)
          old_events.each do |id,event|
            x=event.instance_variable_get(:@x)
            y=event.instance_variable_get(:@y)
            raise "Event #{id} outside old map" unless x.between?(0,362) && y.between?(0,237)
          end
          # Preserve all 86,394 tested in-game terrain cells; source supplies only expanded cells.
          (0...238).each do |y|
            old_row=y*363
            new_row=(y+10)*768+175
            (0...363).each {|x| new_ground[new_row+x]=old[old_row+x] }
          end
          new_raw=[3,768,384,3,3*768*384].pack('V5') + new_ground.pack('v*') + ("\0"*(2*768*384*2))
          map47.instance_variable_set(:@width,768)
          map47.instance_variable_set(:@height,384)
          map47.instance_variable_get(:@data).instance_variable_set(:@raw,new_raw)
          old_event_info=old_events.transform_values{|ev| [ev.instance_variable_get(:@name),ev.instance_variable_get(:@x),ev.instance_variable_get(:@y),Marshal.dump(ev.instance_variable_get(:@pages))]}
          old_events.each_value do |ev|
            ev.instance_variable_set(:@x,ev.instance_variable_get(:@x)+175)
            ev.instance_variable_set(:@y,ev.instance_variable_get(:@y)+10)
          end
          transfers=[]
          map29.instance_variable_get(:@events).each do |event_id,event|
            event.instance_variable_get(:@pages).each_with_index do |page,pageno|
              page.instance_variable_get(:@list).each_with_index do |cmd,index|
                next unless cmd.instance_variable_get(:@code)==201
                params=cmd.instance_variable_get(:@parameters)
                next unless params.is_a?(Array) && params[0]==0 && params[1]==47
                raise 'Map047 unexpected transfer target' unless params[2..3]==[197,128]
                transfers << [event_id,pageno,index]
                params[2]=372;params[3]=138
              end
            end
          end
          raise "Expected one original Map047 entrance, got #{transfers.inspect}" unless transfers==[[11,0,86]]
          updated47=Marshal.dump(map47)
          updated29=Marshal.dump(map29)
          raise 'Original maps unexpectedly unchanged' if updated47==source47 || updated29==source29
          File.binwrite(f47,updated47)
          File.binwrite(f29,updated29)
          # Read back to confirm the full Table and each original event page.
          verify47=Marshal.load(File.binread(f47))
          verify29=Marshal.load(File.binread(f29))
          raise 'Map047 expansion failed' unless [verify47.instance_variable_get(:@width),verify47.instance_variable_get(:@height)] == [768,384]
          actual=verify47.instance_variable_get(:@data).instance_variable_get(:@raw)
          raise 'Expanded Table mismatch' unless actual.unpack('V5') == [3,768,384,3,3*768*384]
          expanded=actual.byteslice(20,768*384*2).unpack('v*')
          raise 'Table data mismatch' unless expanded==new_ground
          verify47.instance_variable_get(:@events).each do |id,ev|
            name,x,y,pages=old_event_info.fetch(id)
            raise "Event #{id} changed beyond location" unless ev.instance_variable_get(:@name)==name && ev.instance_variable_get(:@x)==x+175 && ev.instance_variable_get(:@y)==y+10 && Marshal.dump(ev.instance_variable_get(:@pages))==pages
          end
          cmd=verify29.instance_variable_get(:@events)[11].instance_variable_get(:@pages)[0].instance_variable_get(:@list)[86]
          raise 'Map029 transfer failed' unless cmd.instance_variable_get(:@parameters)[0,4]==[0,47,372,138]
          puts "PASS Map047 363x238 -> 768x384"
          puts "PASS old 86394 collision cells preserved (+175,+10); #{expanded.size-86394} source cells retained"
          puts 'PASS 7 original events preserved and relocated'
          puts 'PASS Map029 transfer event 11 (197,128) -> (372,138)'
          V21_SOURCE_EOF
          MAP47_DATA_ROOT=site/knight/gameasync/Data MAP47_WALK_FILE=build/v21/map47-full-walk.bin ruby build/v21/expand-map047.rb

      - name: Directly adapt existing V241 renderer and 12-image viewport cache
        shell: bash
        run: |
          set -euo pipefail
          cat > build/v21/patch_map047_renderer.rb <<'V21_SOURCE_EOF'
          # encoding: UTF-8
          require 'json'
          require 'zlib'
          require 'digest'
          base = 'site/knight/gameasync/Data/'
          file = base + 'Scripts.rxdata'
          scripts = Marshal.load(File.binread(file))
          raise 'Original RGSS script count changed' unless scripts.length == 137
          find = lambda do |name|
            rows = scripts.select { |row| row.is_a?(Array) && row[1].to_s.dup.force_encoding('UTF-8') == name }
            raise "Missing/duplicate original section #{name}: #{rows.length}" unless rows.size == 1
            rows.first
          end
          terrain = find.call('해상도')
          source = Zlib::Inflate.inflate(terrain[2]).force_encoding('UTF-8')
          raise 'Original terrain Ruby invalid UTF-8' unless source.valid_encoding?
          newline = source.include?("\r\n") ? "\r\n" : "\n"
          t = source.gsub("\r\n", "\n")
          oldcols = '@slti_floor == 47 ? 12 : 0'
          oldrows = '@slti_floor == 47 ? 8 : 0'
          raise 'Map047 terrain dimensions not unique' unless t.scan(oldcols).size == 1 && t.scan(oldrows).size == 1
          t = t.sub(oldcols,'@slti_floor == 47 ? 24 : 0').sub(oldrows,'@slti_floor == 47 ? 12 : 0')
          RubyVM::InstructionSequence.compile(t)
          terrain[2] = Zlib::Deflate.deflate(t.gsub("\n",newline).b)

          layer = find.call('SLNativeLayerV241')
          layer_source = Zlib::Inflate.inflate(layer[2]).force_encoding('UTF-8')
          raise 'Original Layer4 source invalid' unless layer_source.valid_encoding?
          layer_nl = layer_source.include?("\r\n") ? "\r\n" : "\n"
          s = layer_source.gsub("\r\n", "\n")
          raise 'V241 renderer origin changed' unless s.include?('WIDTH=363') && s.include?('HEIGHT=238')
          raise 'Unexpected V241 source changes' unless s.scan('module SLNativeLayerV241').size == 1
          s = s.sub('WIDTH=363', 'WIDTH=768').sub('HEIGHT=238','HEIGHT=384')
          hex = File.read('build/v21/map47-group-bounds.hex').strip
          keys = JSON.parse(File.read('build/v21/map47-foreground-keys.json'))
          raise 'Invalid original Layer5 bounds' unless hex.match?(/\A[0-9a-f]+\z/) && hex.length % 16 == 0
          raise 'Invalid original Layer4 image index' unless keys.is_a?(Array) && keys.length > 73 && keys.all? { |xy| xy.length == 2 && xy[0].between?(0,23) && xy[1].between?(0,11) }
          num = hex.length / 16
          pattern = /GROUP_BOUNDS='[0-9a-f]+'/m
          raise 'V241 group table no longer unique' unless s.scan(pattern).size == 1
          s = s.sub(pattern,"GROUP_BOUNDS='#{hex}'")
          pattern = /FOREGROUND_KEYS=\[[^\n]*\]/
          raise 'V241 Layer4 keys no longer unique' unless s.scan(pattern).size == 1
          s = s.sub(pattern,'FOREGROUND_KEYS='+JSON.generate(keys))
          raise 'V241 original group size changed' unless s.scan('id>=2949').size == 1
          s = s.sub('id>=2949',"id>=#{num}")

          replace_method = lambda do |source,name,next_name,new_block|
            pattern = /^  def #{Regexp.escape(name)}\b[^\n]*\n.*?(?=^  def #{Regexp.escape(next_name)}\b)/m
            raise "Original method #{name} missing or repeated" unless source.scan(pattern).size == 1
            source.sub(pattern,new_block.lines.map{|line|line.start_with?("  ") ? line[2..-1] : line}.join.rstrip + "\n\n")
          end

          prepare = <<'PREPARE'
              def sl_v241_prepare
                raise 'V2.1 incompatible original Map047 renderer' unless
                  @slti_floor==47 && @slti_cols==24 && @slti_rows==12 &&
                  @slti_chunks.is_a?(Hash)
                @sl_v241_gid_bitmap=Bitmap.new('Graphics/Panoramas/SLTI_47_GID')
                @sl_v241_upper={}
                @sl_v241_upper_lru=[]
                @sl_v241_fg_lookup={}
                SLNativeLayerV241::FOREGROUND_KEYS.each{|key|@sl_v241_fg_lookup[key]=true}
                @sl_v241_pieces=[]
                40.times do
                  sp=Sprite.new(@viewport2)
                  sp.zoom_x=2.0
                  sp.zoom_y=2.0
                  sp.visible=false
                  @sl_v241_pieces << sp
                end
                @sl_v241_active={}
                @sl_v241_last_group=nil
              end
          PREPARE
          s = replace_method.call(s,'sl_v241_prepare','slti_update_terrain',prepare)

          terrain_update = <<'TERRAIN'
              def slti_update_terrain
                if $game_map && $game_map.map_id==47
                  sl_v241_original_slti_update_terrain if @sl_v241_ready
                else
                  sl_v241_original_slti_update_terrain
                end
              end
          TERRAIN
          s = replace_method.call(s,'slti_update_terrain','sl_v241_show_piece',terrain_update)

          refresh = <<'REFRESH'
              def sl_v241_refresh
                camx=[$game_map.display_x.to_i/4,0].max
                camy=[$game_map.display_y.to_i/4,0].max
                vw=@viewport2.rect.width
                vh=@viewport2.rect.height
                return if vw<=0 || vh<=0 || !$game_player
                player_tile=[$game_player.x,$game_player.y]
                if @sl_v241_last_player_tile!=player_tile
                  @sl_v241_last_player_tile=player_tile
                  @sl_v241_last_group=SLNativeLayerV241.group_at(
                    @sl_v241_gid_bitmap,$game_player.x,$game_player.y)
                end
                gid=@sl_v241_last_group||0
                box=gid>0 ? SLNativeLayerV241.box_for(gid) : nil
                left=[camx/1024,0].max
                top=[camy/1024,0].max
                right=[(camx+vw-1)/1024,23].min
                bottom=[(camy+vh-1)/1024,11].min
                active={}
                if left<=right && top<=bottom
                  (top..bottom).each do |y|
                    (left..right).each{|x|active[[x,y]]=true}
                  end
                end
                @sl_v241_upper.each do |key,sp|
                  sp.visible=false unless active[key]
                end
                # The original slti_update_terrain maintains the 12-decoded-ground limit.
                # Load at most one additional visible Layer4 bitmap per map update.
                target=active.keys.find{|key|@sl_v241_fg_lookup[key] && !@sl_v241_upper[key]}
                if target
                  x,y=target
                  name='Graphics/Panoramas/SLTI_47_L4_C'+x.to_s+'_'+y.to_s
                  sp=Sprite.new(@viewport2)
                  begin
                    sp.bitmap=Bitmap.new(name)
                  rescue StandardError=>error
                    sp.dispose
                    raise 'V2.1 original upper image failed: '+name+' '+error.message.to_s
                  end
                  sp.zoom_x=2.0
                  sp.zoom_y=2.0
                  sp.z=0
                  sp.visible=false
                  @sl_v241_upper[target]=sp
                  @sl_v241_upper_lru << target
                end
                piece_index=0
                active.each_key do |key|
                  x,y=key
                  upper=@sl_v241_upper[key]
                  next unless upper
                  upper.x=x*1024-camx
                  upper.y=y*1024-camy
                  @sl_v241_upper_lru.delete(key)
                  @sl_v241_upper_lru << key
                  l=box ? [box[0]-x*512,0].max : 0
                  t=box ? [box[1]-y*512,0].max : 0
                  r=box ? [box[2]-x*512,512].min : 0
                  b=box ? [box[3]-y*512,512].min : 0
                  if box && r>l && b>t
                    upper.visible=false
                    bitmap=upper.bitmap
                    piece_index=sl_v241_show_piece(bitmap,x,y,[0,0,512,t],0,255,camx,camy,piece_index)
                    piece_index=sl_v241_show_piece(bitmap,x,y,[0,b,512,512],0,255,camx,camy,piece_index)
                    piece_index=sl_v241_show_piece(bitmap,x,y,[0,t,l,b],0,255,camx,camy,piece_index)
                    piece_index=sl_v241_show_piece(bitmap,x,y,[r,t,512,b],0,255,camx,camy,piece_index)
                    piece_index=sl_v241_show_piece(bitmap,x,y,[l,t,r,b],9999,SLNativeLayerV241::FADE_ALPHA,camx,camy,piece_index)
                  else
                    upper.visible=true
                    upper.opacity=255
                    upper.z=0
                  end
                end
                while piece_index<@sl_v241_pieces.length
                  sp=@sl_v241_pieces[piece_index]
                  sp.visible=false
                  sp.bitmap=nil
                  piece_index+=1
                end
                while @sl_v241_upper.length>12
                  victim=@sl_v241_upper_lru.find{|key|!active[key]}
                  break unless victim
                  @sl_v241_upper_lru.delete(victim)
                  sp=@sl_v241_upper.delete(victim)
                  bmp=sp.bitmap
                  sp.bitmap=nil
                  sp.dispose
                  bmp.dispose if bmp && !bmp.disposed?
                end
                @sl_v241_active=active
              end
          REFRESH
          s = replace_method.call(s,'sl_v241_refresh','update',refresh)
          RubyVM::InstructionSequence.compile(s)
          layer[2] = Zlib::Deflate.deflate(s.gsub("\n",layer_nl).b)
          File.binwrite(file,Marshal.dump(scripts))
          check = Marshal.load(File.binread(file))
          raise 'RGSS metadata changed' unless check.size==scripts.size && check.map{|r|r[0..1]}==scripts.map{|r|r[0..1]}
          puts 'PASS original terrain window loader updated to 24x12; max 12 ground PNGs'
          puts 'PASS original V241 Layer4/Layer5 renderer retains fixed piece pool, max 12 upper PNGs'
          puts "PASS regenerated native Layer5 #{num-1} groups and #{keys.size} upper chunks"
          V21_SOURCE_EOF
          ruby build/v21/patch_map047_renderer.rb

      - name: Repack original Map047 image assets and update only map cache keys
        shell: bash
        run: |
          set -euo pipefail
          cat > build/v21/pack_map047.py <<'V21_SOURCE_EOF'
          from pathlib import Path
          import hashlib, json, re, struct
          root=Path('site')
          build=Path('build/v21')
          pano=root/'knight/gameasync/Graphics/Panoramas'
          images=json.loads((build/'map47-generated-files.json').read_text('utf-8'))
          keys=json.loads((build/'map47-foreground-keys.json').read_text('utf-8'))
          expected={f'SLTI_47_C{x}_{y}.png' for x in range(24) for y in range(12)}
          expected|={f'SLTI_47_L4_C{x}_{y}.png' for x,y in keys}
          expected.add('SLTI_47_GID.png')
          assert len(images)==len(expected) and set(images)==expected,('Incomplete original Map047 source pack',len(images),len(expected))
          old_pack=root/'knight/assets/map-047-v241.pack'
          assert old_pack.is_file(), 'Original V241 pack is missing'
          with old_pack.open('rb') as f:
              old_len=struct.unpack('<I',f.read(4))[0]
              old_head=json.loads(f.read(old_len))
              old_body=f.read()
          assert (old_head['kind'],old_head['map_id'],len(old_head['files']))==('map',47,194),'Wrong original Map047 pack'
          old_mapping=root/'knight/gameasync/mapping.js'
          data=old_mapping.read_text('utf-8')
          pattern=re.compile(r'^\["graphics/panoramas/slti_47_(?:c\d+_\d+|l4_c\d+_\d+|gid)",\s*"Graphics/Panoramas/SLTI_47_(?:C\d+_\d+|L4_C\d+_\d+|GID)\.png\?h=[0-9a-f]{32}"\],?\n',re.M)
          old_lines=pattern.findall(data)
          assert len(old_lines)==193,('Original Map047 mapping entry count changed',len(old_lines))
          first=pattern.search(data)
          assert first, 'Original Map047 mapping placement missing'
          data=pattern.sub('',data)
          # Update only these previously existing original Map047 resource keys.
          rows=[]
          for tag in ('C','L4_C'):
              for x in range(24):
                  for y in range(12):
                      file=f'SLTI_47_{tag}{x}_{y}.png'
                      p=pano/file
                      assert p.is_file(),('Missing fully generated image',file)
                      key=f'graphics/panoramas/{file[:-4].lower()}'
                      rows.append(f'["{key}", "Graphics/Panoramas/{file}?h={hashlib.md5(p.read_bytes()).hexdigest()}"],\n')
          gid=pano/'SLTI_47_GID.png'
          rows.append(f'["graphics/panoramas/slti_47_gid", "Graphics/Panoramas/SLTI_47_GID.png?h={hashlib.md5(gid.read_bytes()).hexdigest()}"],\n')
          data=data[:first.start()]+''.join(rows)+data[first.start():]
          for name in ['Scripts.rxdata','MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap047.rxdata','MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap029.rxdata']:
              path=root/'knight/gameasync/Data'/name
              marker='Data/'+name+'?h='
              pattern=re.compile(re.escape(marker)+r'[0-9a-f]{32}')
              assert len(pattern.findall(data))==1,('Expected one original data mapping',name)
              data=pattern.sub(marker+hashlib.md5(path.read_bytes()).hexdigest(),data)
          old_mapping.write_text(data,'utf-8')
          # Preserve the original pack name: all image downloads still happen before Map047 loads.
          manifest=[];payload=bytearray()
          for file in images:
              raw=(pano/file).read_bytes()
              assert raw[:8]==b'\x89PNG\r\n\x1a\n'
              key='graphics/panoramas/'+file[:-4].lower()
              manifest.append([key,len(payload),len(raw)])
              payload.extend(raw)
          extra=[row for row in old_head['files'] if row[0]=='graphics/tilesets/slti_collision_transparent']
          assert len(extra)==1,('Original Map047 transparent collision tileset missing',extra)
          key,off,length=extra[0]
          raw=old_body[off:off+length]
          assert len(raw)==length and raw[:8]==b'\x89PNG\r\n\x1a\n'
          manifest.append([key,len(payload),length]);payload.extend(raw)
          header=json.dumps({'kind':'map','map_id':47,'files':manifest},ensure_ascii=False,separators=(',',':')).encode('utf-8')
          old_pack.write_bytes(struct.pack('<I',len(header))+header+payload)
          load=root/'knight/js/sl-assets-v229r115.js'
          s=load.read_text('utf-8')
          substitutions={
              "if(head.files.length!==194)throw new Error('Expected 194 Map047 source images');":"if(head.files.length<290)throw new Error('Incomplete original Map047 map images');",
              "if(!map47Keys||map47Keys.length!==194)throw new Error('Map047 manifest missing');":"if(!map47Keys||map47Keys.length<290)throw new Error('Map047 manifest missing');",
              "if(done!==194)throw new Error('Map047 was not fully installed');":"if(done!==map47Keys.length)throw new Error('Map047 was not fully installed');",
              "label('Map 47 graphics installed 194/194');":"label('Map 47 graphics installed '+done+'/'+map47Keys.length);",
              "var version='V1.36';":"var version='V2.1';"
          }
          for old,new in substitutions.items():
              assert s.count(old)==1,('Original loader changed',old)
              s=s.replace(old,new)
          load.write_text(s,'utf-8')
          for name in ['index.html','knight/index.html']:
              p=root/name
              old=p.read_text('utf-8')
              assert 'V1.36' in old,('Wrong source HTML version',name)
              p.write_text(old.replace('V1.36','V2.1').replace('v1.36','v2.1'),'utf-8')
          (build/'pack-report.json').write_text(json.dumps({'map_images':len(images)+1,'ground':288,'upper':len(keys),'gid':1,'full_mapping':len(rows),'pack_bytes':old_pack.stat().st_size},indent=2),'utf-8')
          print('PASS Map047 existing pre-entry loader; map image count',len(images)+1,'and existing pack filename preserved')
          print('PASS all 288 original ground,',len(keys),'native Layer4 image keys, one GID lookup mapped')
          V21_SOURCE_EOF
          .venv/bin/python build/v21/pack_map047.py
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Verify exact original Map047 events and unchanged scripts
        shell: bash
        run: |
          set -euo pipefail
          cat > build/v21/verify_map047.rb <<'V21_SOURCE_EOF'
          # encoding: UTF-8
          require 'zlib'
          module RPG
            class Map; end
            class Event; end
            class Event::Page; end
            class Event::Page::Condition; end
            class Event::Page::Graphic; end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
            class AudioFile; end
          end
          class Table
            def self._load(raw)
              obj=allocate;obj.instance_variable_set(:@raw,raw);obj
            end
            def _dump(_depth);@raw;end
          end
          class Color
            def self._load(raw);obj=allocate;obj.instance_variable_set(:@raw,raw);obj;end
            def _dump(_depth);@raw;end
          end
          class Tone
            def self._load(raw);obj=allocate;obj.instance_variable_set(:@raw,raw);obj;end
            def _dump(_depth);@raw;end
          end
          base='site/knight/gameasync/Data/'
          build='build/v21/'
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          old=Marshal.load(File.binread(build+'Scripts.v136.original.rxdata'))
          now=Marshal.load(File.binread(base+'Scripts.rxdata'))
          raise 'Original 137 section count changed' unless old.size==now.size && now.size==137
          changes=old.zip(now).filter_map do |a,b|
            raise 'Script metadata changed' unless a[0]==b[0] && a[1]==b[1]
            a[1].to_s.dup.force_encoding('UTF-8') if a[2]!=b[2]
          end
          raise "Unapproved script changes #{changes.inspect}" unless changes.sort==['SLNativeLayerV241','해상도'].sort
          now.each do |row|
            name=row[1].to_s.dup.force_encoding('UTF-8')
            next unless changes.include?(name)
            source=Zlib::Inflate.inflate(row[2]).force_encoding('UTF-8')
            RubyVM::InstructionSequence.compile(source)
            if name=='해상도'
              raise 'Original 12 decoded tile limit removed' unless source.include?('while @slti_chunks.length>12')
              raise 'Original terrain limited to new extent' unless source.include?('@slti_floor == 47 ? 24 : 0') && source.include?('@slti_floor == 47 ? 12 : 0')
            else
              raise 'Original Layer4 fade disabled' unless source.include?('FADE_ALPHA=135')
              raise 'New native group lookup missing' unless source.include?('WIDTH=768') && source.include?('HEIGHT=384')
              raise 'New upper 12 decode limit absent' unless source.include?('while @sl_v241_upper.length>12')
              raise 'Group mask missing' unless source.include?("Bitmap.new('Graphics/Panoramas/SLTI_47_GID')")
              raise 'Additional engine loop detected' unless source.scan('def sl_v241_refresh').size==1
            end
          end
          old_map=Marshal.load(File.binread(build+'Map047.v136.original.rxdata'))
          new_map=Marshal.load(File.binread(base+prefix+'Map047.rxdata'))
          raise 'Wrong Map047 dimensions' unless [new_map.instance_variable_get(:@width),new_map.instance_variable_get(:@height)]==[768,384]
          old_events=old_map.instance_variable_get(:@events)
          new_events=new_map.instance_variable_get(:@events)
          raise 'Original Map047 event count mismatch' unless old_events.size==new_events.size && old_events.size==7
          old_events.each do |id,ev|
            ne=new_events.fetch(id)
            raise "Event #{id} original location/name changed" unless ne.instance_variable_get(:@name)==ev.instance_variable_get(:@name) && ne.instance_variable_get(:@x)==ev.instance_variable_get(:@x)+175 && ne.instance_variable_get(:@y)==ev.instance_variable_get(:@y)+10
            raise "Event #{id} original pages changed" unless Marshal.dump(ne.instance_variable_get(:@pages))==Marshal.dump(ev.instance_variable_get(:@pages))
          end
          ob=old_map.instance_variable_get(:@data).instance_variable_get(:@raw)
          nb=new_map.instance_variable_get(:@data).instance_variable_get(:@raw)
          raise 'Wrong original map table' unless ob.byteslice(0,20).unpack('V5')==[3,363,238,3,363*238*3]
          raise 'Wrong expanded map table' unless nb.byteslice(0,20).unpack('V5')==[3,768,384,3,768*384*3]
          old_vals=ob.byteslice(20,363*238*2).unpack('v*')
          new_vals=nb.byteslice(20,768*384*2).unpack('v*')
          raise 'Original passability values changed' unless old_vals.all?{|x|[384,385].include?(x)} && new_vals.all?{|x|[384,385].include?(x)}
          (0...238).each do |y|
           (0...363).each do |x|
            raise 'Old Map047 collision region changed' unless new_vals[(y+10)*768+x+175]==old_vals[y*363+x]
           end
          end
          old29=Marshal.load(File.binread(build+'Map029.v136.original.rxdata'))
          new29=Marshal.load(File.binread(base+prefix+'Map029.rxdata'))
          e=old29.instance_variable_get(:@events)
          ne=new29.instance_variable_get(:@events)
          raise 'Map029 original event set changed' unless e.keys==ne.keys
          changes=[]
          e.each do |id,event|
            a=Marshal.load(Marshal.dump(event))
            a.instance_variable_get(:@pages).each_with_index do |page,pno|
              page.instance_variable_get(:@list).each_with_index do |cmd,i|
                next unless cmd.instance_variable_get(:@code)==201
                params=cmd.instance_variable_get(:@parameters)
                next unless params[0,2]==[0,47]
                raise 'Original transfer unexpected position' unless params[2,2]==[197,128]
                params[2]=372;params[3]=138
                changes << [id,pno,i]
              end
            end
            raise "Map029 unapproved event edit #{id}" unless Marshal.dump(a)==Marshal.dump(ne.fetch(id))
          end
          raise "Wrong transfer count #{changes.inspect}" unless changes==[[11,0,86]]
          puts 'PASS V2.1 original 135 unchanged RGSS scripts, exactly 2 native terrain sections updated'
          puts 'PASS original 86,394 Map047 terrain cells and all 7 events relocated'
          puts 'PASS Map029 exactly one original entrance coordinate changed'
          V21_SOURCE_EOF
          ruby build/v21/verify_map047.rb

      - name: Verify all original map images, pack and unrelated files
        shell: bash
        run: |
          set -euo pipefail
          cat > build/v21/verify_map047.py <<'V21_SOURCE_EOF'
          from pathlib import Path
          from PIL import Image
          import hashlib,json,re,struct
          root=Path('site');built=Path('build/v21')
          before=json.loads((built/'before.json').read_text('utf-8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          mapfiles=[f'SLTI_47_{tag}{x}_{y}.png' for tag in ('C','L4_C') for x in range(24) for y in range(12)]
          img_names=set(mapfiles+['SLTI_47_GID.png'])
          images={'knight/gameasync/Graphics/Panoramas/'+name for name in img_names}
          base='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          core={base+'Map047.rxdata',base+'Map029.rxdata', 'knight/gameasync/Data/Scripts.rxdata',
                'knight/gameasync/mapping.js','knight/js/sl-assets-v229r115.js',
                'index.html','knight/index.html','knight/assets/map-047-v241.pack'}
          assert set(before)-set(after)==set(),'Original game files removed'
          added=set(after)-set(before)
          assert added==images-set(before),('Unapproved generated files or missing images',sorted(added^(images-set(before)))[:15])
          changed={p for p in before if before[p]!=after[p]}
          assert core<=changed,('Required Map047 change not written',sorted(core-changed))
          assert not changed-(core|images),('Non-map game file modified',sorted(changed-(core|images)))
          assert len(before)==5619,('Wrong source inventory',len(before))
          assert len(after)==5619+len(added),('Wrong result inventory',len(after),len(added))
          assert len(added)==384,('Wrong full map expansion image count',len(added))
          assert len(images)==577
          for x in range(24):
              for y in range(12):
                  for tag,mode in (('C','RGB'),('L4_C','RGBA')):
                      p=root/'knight/gameasync/Graphics/Panoramas'/f'SLTI_47_{tag}{x}_{y}.png'
                      with Image.open(p) as im:
                          assert im.size==(512,512) and im.mode==mode,('Original source image invalid',p,im.size,im.mode)
          with Image.open(root/'knight/gameasync/Graphics/Panoramas/SLTI_47_GID.png') as im:
              assert im.size==(768,384) and im.mode=='RGB'
          assert (built/'attr1_512x512_le.bin').stat().st_size==512*512*2
          assert (built/'map47-full-walk.bin').stat().st_size==768*384*2
          report=json.loads((built/'source-metrics.json').read_text('utf-8'))
          assert report['raw_block_count']==64 and report['original_ground_compared']==96 and report['max_ground_mae']<25
          pack=root/'knight/assets/map-047-v241.pack'
          orig=built/'map-047-v241.original.pack'
          with orig.open('rb') as f:
              l=struct.unpack('<I',f.read(4))[0];old=json.loads(f.read(l)); oldbody=f.read()
          with pack.open('rb') as f:
              l=struct.unpack('<I',f.read(4))[0];head=json.loads(f.read(l));body=f.read()
          assert old['map_id']==head['map_id']==47 and old['kind']==head['kind']=='map'
          assert len(old['files'])==194
          extra=[row for row in old['files'] if row[0]=='graphics/tilesets/slti_collision_transparent']
          assert len(extra)==1
          key,off,size=extra[0]
          original=oldbody[off:off+size]
          current=[row for row in head['files'] if row[0]==key]
          assert len(current)==1
          assert original==body[current[0][1]:current[0][1]+current[0][2]],'Native collision transparent tileset modified'
          expected=set(json.loads((built/'map47-generated-files.json').read_text('utf-8')))
          pack_images=set()
          for key,offset,length in head['files']:
              assert 0<=offset and length>8 and offset+length<=len(body)
              chunk=body[offset:offset+length]
              assert chunk[:8]==b'\x89PNG\r\n\x1a\n'
              if key.startswith('graphics/panoramas/slti_47_'):
                  name='SLTI_47_'+key.split('slti_47_',1)[1]+'.png'
                  # The source names are case sensitive only for the local disk.
                  matches=[f for f in expected if f.lower()==name.lower()]
                  assert len(matches)==1,('Manifest key does not point to an original image',key)
                  assert chunk==(root/'knight/gameasync/Graphics/Panoramas'/matches[0]).read_bytes(),('Image bytes mismatch',key)
                  pack_images.add(matches[0])
          assert pack_images==expected,('Incomplete full original image pack',len(pack_images),len(expected))
          assert len(head['files'])==len(expected)+1
          mapping=(root/'knight/gameasync/mapping.js').read_text('utf-8')
          for filename in img_names:
              data=(root/'knight/gameasync/Graphics/Panoramas'/filename).read_bytes()
              entry='Graphics/Panoramas/'+filename+'?h='+hashlib.md5(data).hexdigest()
              assert mapping.count(entry)==1,('Incorrect mapping checksum',filename)
          for filename in ['Scripts.rxdata','MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap047.rxdata','MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap029.rxdata']:
              data=(root/'knight/gameasync/Data'/filename).read_bytes()
              assert ('Data/'+filename+'?h='+hashlib.md5(data).hexdigest()) in mapping
          loader=(root/'knight/js/sl-assets-v229r115.js').read_text('utf-8')
          assert loader.count("var version='V2.1';")==1
          assert 'done!==map47Keys.length' in loader and 'map-047-v241.pack' in loader
          for name in ('index.html','knight/index.html'):
              assert 'V2.1' in (root/name).read_text('utf-8')
          print('PASS V2.1 768x384, 24x12 original native images and Layer5 source')
          print('PASS 86,394 original collision cells and seven NPC/event positions are preserved (Ruby test)')
          print('PASS Map029 single transfer and 1,072 common events preserved (Ruby test)')
          print('PASS no original non-map script/data/game feature changed')
          print('PASS original transparent collision tileset retained byte-for-byte')
          print('PASS original Map047 pack name and every PNG checksum updated')
          print('PASS',len(after),'game files,',len(added),'new map image files')
          V21_SOURCE_EOF
          .venv/bin/python build/v21/verify_map047.py

      - name: Verify complete Map047 pre-entry image installation
        shell: bash
        run: |
          set -euo pipefail
          cat > build/v21/verify_browser_loader.js <<'V21_SOURCE_EOF'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const path=require('node:path');
          const root=path.resolve('site/knight');
          const installs=new Set();
          let nativeMapCallbacks=0;
          let originalDownloadCalled=0;
          const stat={created:0,unlinked:0};
          const overlayObjects=[];
          const context={
            console,TextDecoder,DataView,Uint8Array,ArrayBuffer,AbortController,
            setTimeout,clearTimeout,Promise,Error,Number,String,Object,
            document:{body:{appendChild(x){overlayObjects.push(x)}},
              createElement(tag){return {tag,style:{},append(x){},remove(){},onclick:null,textContent:''}},
              getElementById(id){return null}},
            window:{fileAsyncCache:{},loadFileAsync(fullPath,bitmap,callback){
              nativeMapCallbacks++;
              if(installs.size<300)throw new Error('Map047 native game opened before graphics installation');
              if(typeof callback==='function')callback();
            }, getLazyAsset(){originalDownloadCalled++}},
            FS:{createPreloadedFile(folder,name,bytes,canRead,canWrite,ok,fail,dontCreate,canOwn,preFinish){
               if(!(bytes instanceof Uint8Array) || bytes.length<8)throw new Error('Invalid asset installation');
               stat.created++;
               installs.add(folder+'/'+name);
               if(typeof preFinish==='function')preFinish();
               ok();
            },unlink(name){stat.unlinked++}},
            fetch(url){
              const rel=String(url);
              const f=path.join(root,rel);
              if(!fs.existsSync(f))return Promise.resolve({ok:false,status:404,headers:new Map(),body:null});
              return Promise.resolve({ok:true,status:200,body:null,headers:new Map(),arrayBuffer(){
                const b=fs.readFileSync(f);
                return Promise.resolve(b.buffer.slice(b.byteOffset,b.byteOffset+b.byteLength));
              }});
            }
          };
          vm.createContext(context);
          vm.runInContext(fs.readFileSync(path.join(root,'gameasync/mapping.js'),'utf8'),context,{filename:'mapping.js'});
          vm.runInContext(fs.readFileSync(path.join(root,'js/sl-assets-v229r115.js'),'utf8'),context,{filename:'sl-assets-v229r115.js'});
          let timeoutId;
          const timeout=new Promise((_,reject)=>{timeoutId=setTimeout(()=>reject(new Error('Map047 install did not finish')),30000)});
          Promise.race([new Promise((resolve,reject)=>{
              try{context.window.loadFileAsync('gameasync/Data/Map047.rxdata',false,resolve)}catch(e){reject(e)}
            }),timeout]).then(()=>{
              clearTimeout(timeoutId);
              const headPath=path.join(root,'assets/map-047-v241.pack');
              const data=fs.readFileSync(headPath);
              const len=data.readUInt32LE(0);
              const head=JSON.parse(data.subarray(4,4+len));
              if(nativeMapCallbacks!==1)throw new Error('Map callback invoked wrong number of times');
              if(head.files.length<290)throw new Error('Full Map047 images missing');
              const missing=head.files.filter(x=>!context.window.fileAsyncCache[x[0]]);
              if(missing.length)throw new Error('Native loader skipped '+missing.length+' Map047 files');
              if(stat.created<head.files.length)throw new Error('Map047 assets not fully installed');
              if(!installs.has('/game/Graphics/Tilesets/SLTI_Collision_Transparent.png')) {
                throw new Error('Original transparent collision tileset not installed');
              }
              console.log('PASS browser source pack staged, '+head.files.length+' graphics preinstalled, exactly one Map047 callback');
              console.log('PASS original collision tileset and all map files ready before gameplay');
            }).catch(err=>{clearTimeout(timeoutId);console.error(err);process.exitCode=1});
          V21_SOURCE_EOF
          node build/v21/verify_browser_loader.js

      - name: Publish V2.1 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
