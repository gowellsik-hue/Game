# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V276.4
# BASE: V276.2 successful run 41572739702 (do not use V276.3 runtime)
# IMAGE SOURCE: V247 verified SPR2807, successful run 41382471524
# TARGET: Map025 EV29, temporary test HP 52; restore to 5200 after testing
# CHANGE: replace existing SLDK2F01/02/03 images with 4x4 native sprite sheets
# KEEP: all original RGSS scripts, common events, attack branches, movement
# KEEP: original reward and all 20 item links, no new scripts or sprite hooks
# VERIFY: serialized native rewards, fixed 20 item DB IDs, original file hashes
# LIMITATION: native 4-frame engine; full 13/14-frame actions require later work

name: build-slknight-web.yml | V276.4 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: V276.4 Restore successful V276.2 native game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41572739702
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V276.4 Verify and inventory original V276.2 data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s baseline/artifact.tar
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          assert len(before)==5606,('Wrong baseline inventory',len(before))
          assert 'V276.2' in (root/'knight/index.html').read_text('utf-8')
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          for name in ('Map025.rxdata','CommonEvents.rxdata'):
              assert (root/'knight/gameasync/Data'/(pre+name)).is_file()
          assert (root/'knight/gameasync/Data/Scripts.rxdata').is_file()
          for n in (1,2,3):
              name=f'SLDK2F{n:02d}.png'
              assert (root/'knight/gameasync/Graphics/Characters'/name).is_file(),name
          Path('build/before.json').write_text(json.dumps(before),encoding='utf-8')
          print('PASS V276.2 5606 native game files')
          PY

      - name: V276.4 Download original SPR2807 source images
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41382471524
          name: github-pages
          github-token: ${{ github.token }}
          path: original-v247

      - name: V276.4 Replace three original clone PNGs with four-frame Zenith sprites
        shell: bash
        run: |
          set -euo pipefail
          test -s original-v247/artifact.tar
          mkdir -p sprite-source/knight/gameasync/Graphics/Characters
          tar -xf original-v247/artifact.tar -C sprite-source \
            ./knight/gameasync/Graphics/Characters/SLZenithWalk.png \
            ./knight/gameasync/Graphics/Characters/SLZenithDeath.png
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil
          cat > build/make_sprites.py <<'PY'
          # V276.4: Repack verified V247 original Zenith frames into existing RPG XP 4x4 files.
          # No new filenames, no changes to engine or per-frame scripts.
          from pathlib import Path
          from PIL import Image
          import hashlib,struct
          source=Path('sprite-source/knight/gameasync/Graphics/Characters')
          out=Path('site/knight/gameasync/Graphics/Characters')
          assert out.is_dir()

          # Original V247 sprite layouts verified in V247 CI: all four native rows,
          # row order: down, left, right, up. All cells were already source-verified.
          sheets={
              'SLDK2F01':('SLZenithWalk',12,[0,3,6,9]),
              'SLDK2F02':('SLZenithDeath',17,[0,5,10,16]),
              'SLDK2F03':('SLZenithDeath',17,[16,16,16,16]),
          }
          original_sizes={
              'SLZenithWalk':(1728,480),
              'SLZenithDeath':(2856,576),
          }
          source_hashes={
              'SLZenithWalk':'2a2ba621711dd02d754a7e5cd56954e4045c8609e9781e72a914bf5cec231cb4',
              'SLZenithDeath':'e5e59ced0d42ccf0f1e99ffa7bb8b3f7f4e1c80f3d880c0875d122c039ec009c'
          }
          for target,(source_name,total,frames) in sheets.items():
              path=source/(source_name+'.png')
              raw=path.read_bytes()
              assert hashlib.sha256(raw).hexdigest()==source_hashes[source_name],source_name
              with Image.open(path) as image:
                  image=image.convert('RGBA')
                  assert image.size==original_sizes[source_name],image.size
                  assert image.width%total==0 and image.height%4==0
                  cw=image.width//total
                  ch=image.height//4
                  packed=Image.new('RGBA',(cw*4,ch*4),(0,0,0,0))
                  for row in range(4):
                      for col,frame in enumerate(frames):
                          cut=image.crop((frame*cw,row*ch,(frame+1)*cw,(row+1)*ch))
                          packed.alpha_composite(cut,(col*cw,row*ch))
                  destination=out/(target+'.png')
                  assert destination.is_file(),('Missing existing clone file',destination)
                  packed.save(destination,optimize=True)
              with Image.open(destination) as check:
                  check.verify()
              with Image.open(destination) as check:
                  assert check.size==(cw*4,ch*4)
                  assert check.getbbox() is not None
              print('PASS native image replacement',target,source_name,frames,
                    '4x4 pixel sheet',cw*4,ch*4)
          print('PASS three existing clone sprites replaced; no new sprites or script hooks')
          PY
          python3 build/make_sprites.py

      - name: V276.4 Patch only native Map025 test HP 52
        shell: bash
        run: |
          set -euo pipefail
          cat > build/patch.rb <<'RUBY'
          # encoding: UTF-8
          # V276.4: minimal native-only HP test. No new game runtime or CE change.
          require 'json'
          module RPG
            class Map;end
            class CommonEvent;end
            class AudioFile;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end
          class Table
            def self._load(raw)
              o=allocate
              o.instance_variable_set(:@raw,raw)
              o
            end
            def _dump(level=0);@raw;end
          end
          class Tone
            def self._load(raw)
              o=allocate
              o.instance_variable_set(:@raw,raw)
              o
            end
            def _dump(level=0);@raw;end
          end
          class Color<Tone;end

          def iv(o,k);o.instance_variable_get('@'+k.to_s);end
          def put(o,k,v);o.instance_variable_set('@'+k.to_s,v);end

          def readable(v)
            v.to_s.dup.force_encoding('UTF-8').scrub
          end

          root='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          mapfile=root+pre+'Map025.rxdata'
          map=Marshal.load(File.binread(mapfile))
          events=iv(map,:events)
          boss=events.fetch(29)
          raise 'Wrong target: not Zenith Queen' unless readable(iv(boss,:name))=='제니스 퀸'
          pages=iv(boss,:pages)
          raise 'Original native five pages missing' unless pages.length==5
          raise 'Original active graphic changed' unless [0,1].all?{|i|
            iv(iv(pages[i],:graphic),:character_name)=='SLDK2F01'}
          raise 'Original death graphic changed' unless iv(iv(pages[2],:graphic),:character_name)=='SLDK2F02'
          raise 'Original corpse graphic changed' unless iv(iv(pages[3],:graphic),:character_name)=='SLDK2F03'

          cond=iv(pages[2],:condition)
          raise 'Wrong HP variable or original threshold' unless
            iv(cond,:variable_valid)==true && iv(cond,:variable_id)==4988 &&
            iv(cond,:variable_value)==5200
          put(cond,:variable_value,52)

          # The native renderer already handles 4-frame/4-direction sheets.
          # Allow native step animation during the 45-frame death event.
          put(pages[2],:step_anime,true)

          # Only adjust the visible HP maximum, not other script or attack values.
          bar=0
          iv(pages[1],:list).each do |cmd|
            next unless [355,655].include?(iv(cmd,:code))
            p=iv(cmd,:parameters)
            next unless p.is_a?(Array) && p[0].is_a?(String)
            next unless p[0].b.include?('drawMHP'.b)
            source=p[0].dup.b
            raise 'Unexpected original HUD HP' unless source.include?(',5200,'.b)
            p[0]=source.sub(',5200,'.b,',52,'.b)
            bar+=1
          end
          raise 'Native HP display not found exactly once' unless bar==1

          # Preserve the native death reward script verbatim.
          commands=iv(pages[2],:list)
          raise 'Original death/erase sequence modified' unless
            commands.map{|c|iv(c,:code)}==[355,230,116,0] &&
            iv(commands[1],:parameters)==[45]
          reward=iv(commands[0],:parameters)[0]
          raise 'Missing original 20 item reward rolls' unless
            reward.is_a?(String) &&
            reward.scan(/\[:(?:item|weapon|armor),\s*\d+,\s*\d+\]/).length==20
          raise 'Original amounts changed' unless reward.include?('gold=64800+rand(86401)') &&
            reward.include?('$game_variables[1926]=43212') &&
            reward.include?('[:weapon, 41, 50]') && reward.include?('[:armor, 492, 3]')

          File.binwrite(mapfile,Marshal.dump(map))
          File.binwrite('build/zenith-native-reward.rb',reward)
          File.write('build/zenith-report.json',JSON.pretty_generate({
            version:'V276.4',source:'V276.2',map:25,event:29,
            hp:52,restore_hp:5200,level:60,exp:43212,
            adena:[64800,151200],drops:20,
            scripts_changed:false,common_events_changed:false,
            graphics:['SLDK2F01','SLDK2F02','SLDK2F03'],
            native_sprite:'4 columns x 4 cardinal directions',
            status:'Static/CI verification only; real play remains required'
          }),encoding:'UTF-8')
          puts 'PASS Map025 EV29 test HP52 and HP display 52'
          puts 'PASS native event pages, 20 item reward entries and one death/erase command'
          puts 'PASS no change to common events or original game scripts'
          RUBY
          ruby -c build/patch.rb
          ruby build/patch.rb

      - name: V276.4 Test all 20 original reward item IDs and native combat
        shell: bash
        run: |
          set -euo pipefail
          cat > build/test_rewards.rb <<'RUBY'
          # encoding: UTF-8
          # Execute the exact original Death Knight-clone reward code with deterministic RNG.
          require 'json'
          module RPG
            class Map;end;class CommonEvent;end;class AudioFile;end
            class Item;end;class Weapon;end;class Armor;end
            class Event
              class Page
                class Condition;end;class Graphic;end
              end
            end
            class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          class Table
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(level=0);@raw;end
          end
          class Tone
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(level=0);@raw;end
          end
          class Color<Tone;end

          def iv(o,k);o.instance_variable_get('@'+k.to_s);end
          def assert(cond,msg);raise(msg) unless cond;end

          root='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          map=Marshal.load(File.binread(root+pre+'Map025.rxdata'))
          boss=iv(map,:events).fetch(29)
          pages=iv(boss,:pages)
          assert(pages.length==5,'Missing native event pages')
          assert(iv(iv(pages[2],:condition),:variable_value)==52,'HP52 missing')
          assert(iv(pages[2],:step_anime)==true,'Native death animation disabled')
          assert([0,1].all?{|i|iv(iv(pages[i],:graphic),:character_name)=='SLDK2F01'},'Wrong main image link')
          assert(iv(iv(pages[2],:graphic),:character_name)=='SLDK2F02','Wrong death image link')
          assert(iv(iv(pages[3],:graphic),:character_name)=='SLDK2F03','Wrong corpse image link')

          ce=Marshal.load(File.binread(root+pre+'CommonEvents.rxdata'))
          source=ce[901]
          expected='[DK2F] '+iv(source,:name).to_s.dup.force_encoding('UTF-8').scrub
          private=ce.each_index.find{|i|i!=901 && ce[i] && iv(ce[i],:name).to_s.dup.force_encoding('UTF-8').scrub==expected}
          assert(!private.nil?,'Missing native CE901 clone')
          p=iv(ce[private],:list)
          assert(p.any?{|c|iv(c,:code)==122 && iv(c,:parameters)==[26,26,0,2,0,6]},'Native 6:1 selector missing')
          assert([50,100,150,300].all?{|n|p.any?{|c|iv(c,:code)==122 && iv(c,:parameters)==[26,26,0,0,n]}},'Damage endpoints changed')

          script=iv(iv(pages[2],:list)[0],:parameters)[0]
          assert(script==File.binread('build/zenith-native-reward.rb'),'Source reward bytes changed')
          assert(script.scan(/\[:(?:item|weapon|armor),\s*\d+,\s*\d+\]/).length==20,'Wrong item count')
          File.binwrite('build/native-reward-syntax.rb',script)
          assert(system('ruby','-c','build/native-reward-syntax.rb'),'Invalid original reward Ruby')

          class Party
            attr_reader :gold,:items
            def initialize;@gold=0;@items=[];end
            def gain_gold(n);@gold+=n;end
            def gain_item(id,n);@items<<[:item,id,n];end
            def gain_weapon(id,n);@items<<[:weapon,id,n];end
            def gain_armor(id,n);@items<<[:armor,id,n];end
            def actors;[];end
          end
          class Actor
            attr_accessor :exp
            def initialize;@exp=0;end
          end
          $game_party=Party.new
          $game_variables=Hash.new(0)
          $game_actors={1=>Actor.new}
          module Kernel
            alias zenith_test_original_rand rand
            def rand(n=nil);0;end
          end

          eval(script,TOPLEVEL_BINDING,'NativeReward',1)
          expected=[
            [:item,35,1],[:item,34,1],[:item,33,1],[:item,37,1],
            [:armor,169,1],[:item,116,1],[:item,32,1],[:item,38,1],
            [:armor,289,1],[:weapon,123,1],[:weapon,41,1],[:item,3,1],
            [:weapon,1,1],[:armor,72,1],[:item,2,1],[:armor,303,1],
            [:item,43,1],[:armor,280,1],[:armor,12,1],[:armor,492,1]
          ]
          assert($game_party.gold==64800,'Gold payout incorrect')
          assert($game_actors[1].exp==43212,'EXP payout incorrect')
          assert($game_party.items==expected,'Actual 20 reward item links differ')
          {:item=>'Items',:weapon=>'Weapons',:armor=>'Armors'}.each do |type,file|
            table=Marshal.load(File.binread(root+pre+file+'.rxdata'))
            expected.select{|x|x[0]==type}.each{|_,id,_|
              assert(!table[id].nil?,"Missing item DB record #{type} #{id}")}
          end
          assert(iv(pages[2],:list).map{|cmd|iv(cmd,:code)}==[355,230,116,0],
            'Native death/erase event missing')
          puts 'PASS original reward event: all 20 actual item calls and database links'
          puts 'PASS EXP 43212, Adena 64800 minimum and native erase command'
          puts 'PASS HP 52, graphics links and independent physical/magic attack data unchanged'
          RUBY
          ruby -c build/test_rewards.rb
          ruby build/test_rewards.rb

      - name: V276.4 Update only three sprite hashes, Map025 and version
        shell: bash
        run: |
          set -euo pipefail
          cat > build/update_mapping.py <<'PY'
          # V276.4: only the existing three DK-clone sprite URLs and Map025 data hash.
          from pathlib import Path
          import hashlib,re
          root=Path('site')
          game=root/'knight/gameasync'
          mapfile=game/'mapping.js'
          s=mapfile.read_text('utf-8')
          for n in (1,2,3):
              name=f'SLDK2F{n:02d}'
              path=game/'Graphics/Characters'/(name+'.png')
              assert path.is_file(),name
              md5=hashlib.md5(path.read_bytes()).hexdigest()
              key='Graphics/Characters/'+name+'.png'
              pattern='('+re.escape(key)+r'\?h=)[0-9a-f]{32}'
              s,nmatch=re.subn(pattern,lambda m:m.group(1)+md5,s)
              assert nmatch==1,(name,nmatch)

          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          path=game/'Data'/(pre+'Map025.rxdata')
          key='Data/'+path.name
          md5=hashlib.md5(path.read_bytes()).hexdigest()
          s,nmatch=re.subn('('+re.escape(key)+r'\?h=)[0-9a-f]{32}',
                           lambda m:m.group(1)+md5,s)
          assert nmatch==1,('Map025 data entry',nmatch)
          mapfile.write_text(s,encoding='utf-8')

          loader=root/'knight/js/sl-assets-v229r115.js'
          s=loader.read_text('utf-8')
          assert s.count("var version='V276.2';")==1
          loader.write_text(s.replace("var version='V276.2';","var version='V276.4';"),encoding='utf-8')

          for name in ('index.html','knight/index.html'):
              html=root/name
              s=html.read_text('utf-8')
              assert 'V276.2' in s,name
              html.write_text(s.replace('V276.2','V276.4').replace('v276.2','v276.4'),encoding='utf-8')
          print('PASS three existing SLDK2F image hashes, Map025 hash, V276.4 labels')
          PY
          python3 build/update_mapping.py
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: V276.4 Protect every unrelated game file
        shell: bash
        run: |
          set -euo pipefail
          cat > build/protect.py <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path('site')
          before=json.loads(Path('build/before.json').read_text('utf-8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          pre='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          allowed={
              pre+'Map025.rxdata',
              'knight/gameasync/Graphics/Characters/SLDK2F01.png',
              'knight/gameasync/Graphics/Characters/SLDK2F02.png',
              'knight/gameasync/Graphics/Characters/SLDK2F03.png',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html','knight/index.html'
          }
          assert set(before)==set(after),('File inventory changed',sorted(set(before)^set(after)))
          changed={name for name in before if before[name]!=after[name]}
          assert changed==allowed,('Unexpected files modified',sorted(changed^allowed))
          for name in before:
              if name.startswith('knight/gameasync/Graphics/') and name not in allowed:
                  assert before[name]==after[name],name
              if name.startswith(pre+'Map') and name not in allowed:
                  assert before[name]==after[name],name
          for path in ('knight/gameasync/Data/Scripts.rxdata',
                       pre+'CommonEvents.rxdata',pre+'Map016.rxdata',
                       'knight/js/drive.js','knight/js/dpad.js',
                       'knight/assets/map-047-v241.pack'):
              assert before[path]==after[path],('protected original modified',path)
          report=json.loads(Path('build/zenith-report.json').read_text('utf-8'))
          assert report['version']=='V276.4' and report['hp']==52 and report['restore_hp']==5200
          assert report['drops']==20 and report['exp']==43212
          assert report['scripts_changed']==False and report['common_events_changed']==False
          assert len(before)==5606,('Unexpected V276.2 source file count',len(before))
          print('PASS exactly eight modified original files; no added/deleted file')
          print('PASS three clone sprites replaced; all other sprites, maps, CEs, Scripts protected')
          print('PASS V276.4 HP52 / original 20 reward entries / native combat unmodified')
          PY
          python3 build/protect.py

      - name: V276.4 Publish game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
