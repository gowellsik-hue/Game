# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V276.3
# BASE: V276.2 successful run 41572739702
# SOURCE GRAPHICS: successful V247 run 41382471524, verified original SPR2807
# TARGET: Zenith Queen Map025 EV29, temporary test HP 52
# RESTORE AFTER TEST: change HP 52 back to 5200 in a later approved revision
# KEEP: V276.2 native combat, original event pages, item IDs and drop rates
# KEEP: Death Knight, other monsters, source images, game engine, Map047
# CHANGE: original 7-bank/4-direction sprite motion and reward test guard
# TEST: 20 actual item payouts, EXP/Adena, once-only, map reentry reset
# STATUS: Built/tested against saved source data; live gameplay needs checking

name: build-slknight-web.yml | V276.3 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: V276.3 Restore successful V276.2 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41572739702
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V276.3 Verify original game and inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s baseline/artifact.tar
          tar -xf baseline/artifact.tar -C site
          test -s site/knight/gameasync/Data/Scripts.rxdata
          test -s site/knight/gameasync/mapping.js
          test -s site/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap025.rxdata
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          assert len(before)==5606,('Unexpected V276.2 site inventory',len(before))
          assert 'V276.2' in (root/'knight/index.html').read_text('utf-8')
          assert 'V276.2' in (root/'index.html').read_text('utf-8')
          assert 'knight/assets/map-047-v241.pack' in before
          assert all('SLZenith'+m+'.png' not in before for m in
                    ('Walk','Idle','Attack','AltAttack','Spell','Hit','Death'))
          Path('build/before.json').write_text(json.dumps(before),encoding='utf-8')
          print('PASS unmodified successful V276.2 source,',len(before),'files')
          PY

      - name: V276.3 Download original SPR2807 sprites from V247
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41382471524
          name: github-pages
          github-token: ${{ github.token }}
          path: original-v247

      - name: V276.3 Verify seven exact original sprite sheets
        shell: bash
        run: |
          set -euo pipefail
          test -s original-v247/artifact.tar
          sprite_dir=site/knight/gameasync/Graphics/Characters
          mkdir -p "$sprite_dir"
          for motion in Walk Idle Attack AltAttack Spell Hit Death; do
            test ! -e "$sprite_dir/SLZenith${motion}.png"
            tar -xf original-v247/artifact.tar -C site     "./knight/gameasync/Graphics/Characters/SLZenith${motion}.png"
          done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,struct
          base=Path('site/knight/gameasync/Graphics/Characters')
          # SHA256s of the seven original-SPR2807 PNG sheets from V247.
          expected={
           'Walk':(12,'2a2ba621711dd02d754a7e5cd56954e4045c8609e9781e72a914bf5cec231cb4'),
           'Idle':(11,'dc5d453681ba72f148bc5341d847c6baa007d448d223162a6fe857feffb1a4d0'),
           'Attack':(13,'34fc818726622d37e5d93d31a805738ef283f87eef3d33ec46cd772fee15a425'),
           'AltAttack':(14,'ee7664745495d2de0fa7ab7e132cbcedc525a3aa7c4537776b51927968a4dd90'),
           'Spell':(14,'ffe2ae5755e7c3ed4a25cd70fa84afdff78069c5052ab6f20939d7c9849b2749'),
           'Hit':(2,'9c2eaa2eb3f22a60266a4a8e0f6793a97592ce35b847d0469e2ee32190fa40e4'),
           'Death':(17,'e5e59ced0d42ccf0f1e99ffa7bb8b3f7f4e1c80f3d880c0875d122c039ec009c')
          }
          for action,(n,hash_) in expected.items():
              data=(base/('SLZenith'+action+'.png')).read_bytes()
              assert hashlib.sha256(data).hexdigest()==hash_,('Unexpected source sprite',action)
              assert data[:8]==b'\x89PNG\r\n\x1a\n'
              w,h=struct.unpack('>II',data[16:24])
              assert w%n==0 and h%4==0,('Sprite dimensions',action,w,h)
              print('PASS original SPR2807',action,n,'frames, 4 directions',w,h)
          assert len(expected)==7
          PY

      - name: V276.3 Apply HP52 native combat sprites and reward safeguards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          cat > build/zenith-runtime.rb <<'ZENITH_RUNTIME'
          # encoding: UTF-8
          # V276.3: original Sanctuary SPR2807 visuals for independent Map025 EV29.
          # Native RPG combat, movement, and reward calculations are preserved.
          module SLZenithSprite
            MAP_ID=25
            EVENT_ID=29
            HP_VAR=4988
            ATTACK_SWITCH=5991
            MAGIC_SWITCH=5992
            TEST_MAX_HP=52
            FRAMES={
              'Walk'=>12,'Idle'=>11,'Attack'=>13,'AltAttack'=>14,
              'Spell'=>14,'Hit'=>2,'Death'=>17
            }
            @strong_attack=false
            @rewarded=false

            def self.boss
              return nil unless $game_map && $game_map.map_id==MAP_ID
              return nil unless $game_map.events
              $game_map.events[EVENT_ID]
            end

            def self.preload
              return unless defined?(RPG::Cache)
              FRAMES.each_key do |action|
                RPG::Cache.character('SLZenith'+action,0)
              end
            end

            def self.reset_on_entry(map_id)
              return unless map_id==MAP_ID
              $game_variables[HP_VAR]=0 if $game_variables
              if $game_switches
                $game_switches[ATTACK_SWITCH]=false
                $game_switches[MAGIC_SWITCH]=false
              end
              @strong_attack=false
              @rewarded=false
            end

            def self.start_motion(action,duration)
              ev=boss
              if ev && ev.respond_to?(:slz_v2763_start)
                ev.slz_v2763_start(action,duration)
              end
            end

            # Existing CE1064 uses a single random integer 0..6:
            # 0=magic, 1=strong physical, 2..6=normal physical.
            # 5 native startup frames have already elapsed; the animation
            # therefore occupies the existing 15-frame recovery window.
            def self.choose_attack(value)
              roll=value.to_i
              @strong_attack=(roll==1)
              if roll==0
                start_motion('Spell',15)
              elsif @strong_attack
                start_motion('AltAttack',15)
              else
                start_motion('Attack',15)
              end
            end

            def self.strong_attack?
              @strong_attack==true
            end

            def self.claim_reward
              return false if @rewarded
              @rewarded=true
              true
            end
          end

          class Game_Event
            alias slz_v2763_native_update update

            def slz_v2763_start(action,duration)
              return if @slz_v2763_action=='Death'
              @slz_v2763_action=action
              @slz_v2763_elapsed=0
              @slz_v2763_duration=duration
              @slz_v2763_visual=0
              @character_name='SLZenith'+action
            end

            def slz_v2763_frame(count)
              tick=@slz_v2763_visual.to_i
              if @slz_v2763_action=='Death'
                [tick/2,count-1].min
              elsif @slz_v2763_action
                dur=[@slz_v2763_duration.to_i,1].max
                [tick*count/dur,count-1].min
              else
                speed=(@character_name=='SLZenithWalk' ? 2 : 4)
                (tick/speed)%count
              end
            end

            def update
              slz_v2763_native_update
              return unless @map_id==SLZenithSprite::MAP_ID &&
                            @id==SLZenithSprite::EVENT_ID
              return unless $game_variables

              @slz_v2763_visual=@slz_v2763_visual.to_i+1
              hp=$game_variables[SLZenithSprite::HP_VAR].to_i

              if hp>=SLZenithSprite::TEST_MAX_HP
                if @slz_v2763_action!='Death'
                  @slz_v2763_action=nil
                  slz_v2763_start('Death',42)
                end
                @slz_v2763_last_hp=hp
                return
              end

              if !@slz_v2763_last_hp.nil? && hp>@slz_v2763_last_hp
                slz_v2763_start('Hit',8)
              end
              @slz_v2763_last_hp=hp

              if @slz_v2763_action
                @slz_v2763_elapsed=@slz_v2763_elapsed.to_i+1
                if @slz_v2763_elapsed>=@slz_v2763_duration.to_i
                  @slz_v2763_action=nil
                  @slz_v2763_visual=0
                end
              end

              unless @slz_v2763_action
                name=moving? ? 'SLZenithWalk' : 'SLZenithIdle'
                if @character_name!=name
                  @character_name=name
                  @slz_v2763_visual=0
                end
              end
            end
          end

          class Sprite_Character
            alias slz_v2763_native_update update
            def update
              slz_v2763_native_update
              return unless @character && $game_map &&
                            $game_map.map_id==SLZenithSprite::MAP_ID
              return unless @character.is_a?(Game_Event) &&
                            @character.instance_variable_get(:@id)==SLZenithSprite::EVENT_ID
              return unless @tile_id==0 && bitmap
              name=@character.character_name.to_s
              return unless name.start_with?('SLZenith')
              motion=name.sub('SLZenith','')
              count=SLZenithSprite::FRAMES[motion]
              return unless count

              raise 'Invalid Zenith sprite sheet width' unless bitmap.width%count==0
              raise 'Invalid Zenith sprite sheet height' unless bitmap.height%4==0
              @cw=bitmap.width/count
              @ch=bitmap.height/4
              row=(@character.direction-2)/2
              return unless row.between?(0,3)
              frame=@character.slz_v2763_frame(count)
              self.src_rect.set(frame*@cw,row*@ch,@cw,@ch)
              self.ox=@cw/2
              self.oy=@ch
              self.z=@character.screen_z(@ch)
            end
          end

          class Game_Map
            alias slz_v2763_native_setup setup
            def setup(map_id)
              SLZenithSprite.reset_on_entry(map_id)
              slz_v2763_native_setup(map_id)
              SLZenithSprite.preload if map_id==SLZenithSprite::MAP_ID
            end
          end
          ZENITH_RUNTIME
          ruby -c build/zenith-runtime.rb
          cat > build/patch.rb <<'ZENITH_PATCH'
          # encoding: UTF-8
          require 'json'
          require 'zlib'

          module RPG
            class Map;end
            class CommonEvent;end
            class AudioFile;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end
          class Table
            def self._load(bytes)
              obj=allocate
              obj.instance_variable_set(:@raw,bytes)
              obj
            end
            def _dump(level=0);@raw;end
          end
          class Tone
            def self._load(bytes)
              obj=allocate
              obj.instance_variable_set(:@raw,bytes)
              obj
            end
            def _dump(level=0);@raw;end
          end
          class Color<Tone;end

          def iv(obj,key);obj.instance_variable_get('@'+key.to_s);end
          def put(obj,key,value);obj.instance_variable_set('@'+key.to_s,value);end
          def event_command(code,parameters,indent=0)
            result=RPG::EventCommand.allocate
            put(result,:code,code)
            put(result,:parameters,parameters)
            put(result,:indent,indent)
            result
          end

          def readable(value)
            value.to_s.dup.force_encoding('UTF-8').scrub
          end

          def isolated_ce(common,source_id)
            source=common.fetch(source_id)
            name='[DK2F] '+readable(iv(source,:name))
            hits=common.each_index.select do |idx|
              next false if idx==source_id || !common[idx]
              readable(iv(common[idx],:name))==name
            end
            raise "Missing or ambiguous CE #{source_id}" unless hits.length==1
            hits.first
          end

          root='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          mapfile=root+pre+'Map025.rxdata'
          cefile=root+pre+'CommonEvents.rxdata'
          scriptsfile=root+'Scripts.rxdata'
          map=Marshal.load(File.binread(mapfile))
          common=Marshal.load(File.binread(cefile))
          scripts=Marshal.load(File.binread(scriptsfile))

          original_events=iv(map,:events).transform_values{|v|Marshal.dump(v)}
          original_common=common.map{|v|v ? Marshal.dump(v) : nil}
          original_scripts=scripts.map{|v|Marshal.dump(v)}

          boss=iv(map,:events).fetch(29)
          raise 'Not Zenith Queen EV29' unless readable(iv(boss,:name))=='제니스 퀸'
          raise 'Incorrect source sprite' unless iv(iv(boss,:pages)[1],:graphic).instance_variable_get('@character_name').to_s=='SLDK2F01'
          raise 'Five native pages changed' unless iv(boss,:pages).length==5
          raise 'Original level not preserved' unless iv(boss,:sl_level)==60
          pages=iv(boss,:pages)

          hp=iv(pages[2],:condition)
          raise 'Incorrect source 5200 HP' unless iv(hp,:variable_valid) &&
            iv(hp,:variable_id)==4988 && iv(hp,:variable_value)==5200
          put(hp,:variable_value,52)

          # Original event graphics are replaced only for Zenith Queen.
          [0,1].each do |n|
            put(iv(pages[n],:graphic),:character_name,'SLZenithIdle')
          end
          put(iv(pages[2],:graphic),:character_name,'SLZenithDeath')

          hp_show=0
          iv(pages[1],:list).each do |entry|
            next unless [355,655].include?(iv(entry,:code))
            params=iv(entry,:parameters)
            next unless params.is_a?(Array) && params[0].is_a?(String)
            next unless params[0].b.include?('drawMHP'.b)
            original=params[0].dup.b
            raise 'Unexpected original HP display' unless
              original.include?('SLDK2F01'.b) && original.include?(',5200,'.b)
            modified=original.sub('SLDK2F01'.b,'제니스 퀸'.b).sub(',5200,'.b,',52,'.b)
            params[0]=modified
            hp_show+=1
          end
          raise 'Zenith HP meter must be patched once' unless hp_show==1

          # Keep all 20 items and original experience/Adena code byte-identical;
          # wrap payout to guarantee one payment per kill/event instance.
          reward_commands=iv(pages[2],:list)
          raise 'Original native death page changed' unless reward_commands.map{|c|iv(c,:code)}==[355,230,116,0]
          original_reward=iv(reward_commands[0],:parameters)[0]
          raise 'Native reward code changed' unless original_reward.is_a?(String) &&
            original_reward.include?('gold=64800+rand(86401)') &&
            original_reward.include?('$game_party.gain_item') &&
            original_reward.include?('$game_party.gain_weapon') &&
            original_reward.include?('$game_party.gain_armor')
          item_entries=original_reward.scan(/\[:(?:item|weapon|armor),\s*\d+,\s*\d+\]/)
          raise 'Twenty native loot rolls changed' unless item_entries.length==20
          wrapped="if SLZenithSprite.claim_reward\n" +
            original_reward.lines.map{|line|'  '+line}.join +
            "end\n"
          put(reward_commands[0],:parameters,[wrapped])

          # Leave the original CE57 MDEF, CE179 attack timer, CE901 source and
          # all unrelated RPG common events untouched. Only edit the private CE1064.
          ce57=isolated_ce(common,57)
          ce179=isolated_ce(common,179)
          ce901=isolated_ce(common,901)
          raise 'Unexpected CE identities' unless [ce57,ce179,ce901]==[1062,1063,1064]
          cycle=iv(common[ce179],:list)
          raise 'Native attack loop changed' unless cycle.map{|x|iv(x,:code)}==[355,106,117,106,121,0] &&
            iv(cycle[1],:parameters)==[5] && iv(cycle[3],:parameters)==[15] &&
            iv(cycle[2],:parameters)==[ce901]

          attack=iv(common[ce901],:list)
          selector=attack.each_index.select do |i|
            iv(attack[i],:code)==122 && iv(attack[i],:parameters)==[26,26,0,2,0,6]
          end
          raise 'Missing exact native selector 0-6' unless selector.length==1
          si=selector.first
          raise 'Magic branch selector changed' unless
            iv(attack[si+1],:code)==111 &&
            iv(attack[si+1],:parameters)==[1,26,0,1,0]
          attack.insert(si+1,event_command(
            355,['SLZenithSprite.choose_attack($game_variables[26])'],0
          ))

          # Physical strong (roll=1): use original upper 100 damage before CE57
          # applies original defenses; normal roll=2..6 keeps 50/100 native switch.
          physical=attack.each_index.select do |i|
            iv(attack[i],:code)==111 && iv(attack[i],:parameters)==[0,386,0] && iv(attack[i],:indent)==3
          end
          raise 'Original physical sub-branch not unique' unless physical.length==1
          pi=physical.first
          segment=attack[pi,8]
          raise 'Native physical low/high changed' unless segment.any?{|x|iv(x,:code)==122 && iv(x,:parameters)==[26,26,0,0,50]} &&
            segment.any?{|x|iv(x,:code)==122 && iv(x,:parameters)==[26,26,0,0,100]}
          end_idx=(pi+1...attack.length).find{|i|
            iv(attack[i],:code)==412 && iv(attack[i],:indent)==3
          }
          raise 'Physical branch end missing' unless end_idx
          raise 'Original physical CE57 connection missing' unless
            iv(attack[end_idx+1],:code)==117 && iv(attack[end_idx+1],:parameters)==[ce57]
          attack.insert(end_idx+1,event_command(
            355,['$game_variables[26]=100 if SLZenithSprite.strong_attack?'],3
          ))

          raise 'Native magic condition removed' unless attack.any?{|x|
            iv(x,:code)==121 && iv(x,:parameters)==[5992,5992,0]
          }
          raise 'Player damage commands removed' unless attack.count{|x|iv(x,:code)==311}>=2
          raise 'Original magic floor changed' unless attack.any?{|x|
            iv(x,:code)==311 && iv(x,:parameters)==[1,1,0,80,false]
          }

          runtime=File.binread('build/zenith-runtime.rb')
          raise 'Wrong test runtime HP' unless runtime.include?('TEST_MAX_HP=52')
          raise 'Visual script already installed' if scripts.any?{|x|
            x.is_a?(Array) && x[1]=='SLZenithSpriteV276.3'
          }
          main=scripts.index{|entry|entry.is_a?(Array) && entry[1]=='Main'}
          raise 'No original RGSS Main script' unless main
          scripts.insert(main,[99827603,'SLZenithSpriteV276.3',Zlib::Deflate.deflate(runtime,9)])

          # Verify that every original script row remains exactly the same.
          removed=scripts.reject{|r|r.is_a?(Array) && r[1]=='SLZenithSpriteV276.3'}
          raise 'Original game script modified' unless
            removed.map{|r|Marshal.dump(r)}==original_scripts

          iv(map,:events).each do |eid,ev|
            next if eid==29
            raise "Unrelated Map025 EV#{eid} altered" unless Marshal.dump(ev)==original_events[eid]
          end
          common.each_with_index do |ce,idx|
            next if idx==ce901
            raw=ce ? Marshal.dump(ce) : nil
            raise "Unrelated CE#{idx} altered" unless raw==original_common[idx]
          end
          raise 'Original death waits or erase removed' unless
            iv(reward_commands[1],:parameters)==[45] && iv(reward_commands[2],:code)==116

          File.binwrite(mapfile,Marshal.dump(map))
          File.binwrite(cefile,Marshal.dump(common))
          File.binwrite(scriptsfile,Marshal.dump(scripts))
          File.write('build/reward-original.rb',original_reward)
          File.write('build/zenith-report.json',JSON.pretty_generate({
            :version=>'V276.3',:map=>25,:event=>29,:level=>60,
            :hp=>52,:normal_physical=>[50,100],:strong_physical=>100,
            :magic=>[150,300],:physical_magic=>[6,1],
            :exp=>43212,:adena=>[64800,151200],:drops=>20,
            :frames=>{'Walk'=>12,'Idle'=>11,'Attack'=>13,'AltAttack'=>14,
                      'Spell'=>14,'Hit'=>2,'Death'=>17},
            :attack_cycle=>20,:source_sprite=>'Sanctuary SPR2807 / V247'
          }))
          puts 'PASS original V276.2 five-page event and native combat retained'
          puts 'PASS test HP52, HUD52, sprite actions 12/11/13/14/14/2/17'
          puts 'PASS native physical:magic=6:1 and 1/7 visual strong hit'
          puts 'PASS original 20 drops preserved; once-only payout guarded'
          puts 'PASS all original RGSS scripts, other monsters and common events preserved'
          ZENITH_PATCH
          ruby -c build/patch.rb
          ruby build/patch.rb

      - name: V276.3 Execute actual rewards and four-direction tests
        shell: bash
        run: |
          set -euo pipefail
          cat > build/test.rb <<'ZENITH_TEST'
          # encoding: UTF-8
          require 'json'
          require 'zlib'

          module RPG
            class Map;end;class CommonEvent;end;class AudioFile;end
            class Item;end;class Weapon;end;class Armor;end
            class Event
              class Page
                class Condition;end;class Graphic;end
              end
            end
            class EventCommand;end;class MoveRoute;end;class MoveCommand;end
            module Cache
              def self.character(name,hue);true;end
            end
          end
          class Table
            def self._load(data);o=allocate;o.instance_variable_set(:@raw,data);o;end
            def _dump(level=0);@raw;end
          end
          class Tone
            def self._load(data);o=allocate;o.instance_variable_set(:@raw,data);o;end
            def _dump(level=0);@raw;end
          end
          class Color<Tone;end

          def iv(o,k);o.instance_variable_get('@'+k.to_s);end
          def assert(ok,label)
            raise "FAILED: #{label}" unless ok
          end

          root='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          map=Marshal.load(File.binread(root+pre+'Map025.rxdata'))
          common=Marshal.load(File.binread(root+pre+'CommonEvents.rxdata'))
          scripts=Marshal.load(File.binread(root+'Scripts.rxdata'))
          boss=iv(map,:events).fetch(29)
          pages=iv(boss,:pages)
          assert(iv(boss,:name).dup.force_encoding('UTF-8').scrub=='제니스 퀸','name')
          assert(pages.length==5,'native pages count')
          assert(iv(iv(pages[2],:condition),:variable_value)==52,'HP52')
          assert([0,1].all?{|i|iv(iv(pages[i],:graphic),:character_name)=='SLZenithIdle'},'idle graphics')
          assert(iv(iv(pages[2],:graphic),:character_name)=='SLZenithDeath','death sprite')
          assert(iv(iv(pages[1],:list)[0],:parameters)[0].include?(',52,'),'HUD HP52')
          assert(iv(pages[2],:list).map{|c|iv(c,:code)}==[355,230,116,0],'native reward wait/erase')
          assert(iv(iv(pages[2],:list)[1],:parameters)==[45],'death animation wait')

          cycle=iv(common[1063],:list)
          assert(cycle.map{|c|iv(c,:code)}==[355,106,117,106,121,0] &&
                 iv(cycle[1],:parameters)==[5] && iv(cycle[3],:parameters)==[15],
                 'native 20 frame attack loop')
          attack=iv(common[1064],:list)
          assert(attack.any?{|c|iv(c,:code)==122 && iv(c,:parameters)==[26,26,0,2,0,6]},'random selector 0-6')
          assert(attack.any?{|c|iv(c,:code)==355 && iv(c,:parameters)==['SLZenithSprite.choose_attack($game_variables[26])']},'visual selector')
          assert(attack.any?{|c|iv(c,:code)==355 && iv(c,:parameters)==['$game_variables[26]=100 if SLZenithSprite.strong_attack?']},'strong damage')
          assert([50,100,150,300].all?{|v|attack.any?{|c|iv(c,:code)==122 && iv(c,:parameters)==[26,26,0,0,v]}},'original physical/magic endpoints')
          assert(attack.any?{|c|iv(c,:code)==117 && iv(c,:parameters)==[1062]},'original CE57')
          assert(attack.any?{|c|iv(c,:code)==311 && iv(c,:parameters)==[1,1,0,80,false]},'native magic minimum')
          assert(attack.count{|c|iv(c,:code)==311}==3,'original damage commands')

          record=scripts.find{|r|r.is_a?(Array) && r[1]=='SLZenithSpriteV276.3'}
          assert(!record.nil?,'installed runtime')
          rt=Zlib::Inflate.inflate(record[2])
          assert(rt.include?('TEST_MAX_HP=52'),'runtime HP52')

          class Game_Event
            attr_accessor :direction,:character_name
            def initialize
              @map_id=25;@id=29;@direction=2;@character_name='SLZenithIdle'
            end
            def update;end
            def moving?;false;end
            def screen_z(ch);ch*2;end
          end
          class Game_Map
            attr_accessor :map_id,:events
            def setup(map_id);@map_id=map_id;end
          end
          class Sprite_Character
            attr_accessor :character,:ox,:oy,:z,:src_rect
            def initialize(actor,bitmap)
              @character=actor;@bitmap=bitmap;@tile_id=0
              @src_rect=Struct.new(:x,:y,:width,:height) do
                def set(x,y,w,h);self.x=x;self.y=y;self.width=w;self.height=h;end
              end.new
            end
            def bitmap;@bitmap;end
            def update;end
          end
          class Party
            attr_reader :gold,:drops
            def initialize;@gold=0;@drops=[];end
            def gain_gold(n);@gold+=n;end
            def gain_item(id,n);@drops<<[:item,id,n];end
            def gain_weapon(id,n);@drops<<[:weapon,id,n];end
            def gain_armor(id,n);@drops<<[:armor,id,n];end
            def actors;[];end
          end
          class Actor
            attr_accessor :exp
            def initialize;@exp=0;end
          end

          $game_map=Game_Map.new
          $game_variables=Hash.new(0)
          $game_switches=Hash.new(false)
          $game_party=Party.new
          $game_actors={1=>Actor.new}
          actor=Game_Event.new
          $game_map.map_id=25
          $game_map.events={29=>actor}

          eval(rt,TOPLEVEL_BINDING,'SLZenithRuntime',1)
          assert(SLZenithSprite::FRAMES=={
            'Walk'=>12,'Idle'=>11,'Attack'=>13,'AltAttack'=>14,
            'Spell'=>14,'Hit'=>2,'Death'=>17
          },'motion frame counts')

          # 0 spell / 1 strong / 2..6 standard. No changes to the 20-frame cycle.
          (0..6).each do |roll|
            SLZenithSprite.choose_attack(roll)
            expected=roll==0 ? 'Spell' : roll==1 ? 'AltAttack' : 'Attack'
            assert(actor.character_name=='SLZenith'+expected,"visual attack #{roll}")
            assert(SLZenithSprite.strong_attack? ==(roll==1),"strength selector #{roll}")
          end

          # Test 4 direction rows, 13/14 original-frame selections.
          [2,4,6,8].each do |direction|
            actor.direction=direction
            ['Walk','Idle','Attack','AltAttack','Spell','Hit','Death'].each do |motion|
              actor.instance_variable_set(:@slz_v2763_action,nil)
              actor.character_name='SLZenith'+motion
              f=SLZenithSprite::FRAMES[motion]
              bmp=Struct.new(:width,:height).new(f*144,480)
              sprite=Sprite_Character.new(actor,bmp)
              sprite.update
              assert(sprite.src_rect.y==((direction-2)/2)*120,"direction row #{direction} #{motion}")
              assert(sprite.src_rect.width==144,"frame width #{motion}")
            end
          end

          # Force every possible drop to land, verifying that the event actually
          # calls all three party gain_* methods with the correct source DB type/ID.
          module Kernel
            alias slz_v2763_real_rand rand
            def rand(limit=nil);0;end
          end

          script=iv(iv(pages[2],:list)[0],:parameters)[0]
          File.binwrite('build/reward-check.rb',script)
          assert(system('ruby','-c','build/reward-check.rb'),'reward syntax')
          $game_variables[4988]=52
          actor.update
          assert(actor.character_name=='SLZenithDeath','death motion at 52')
          eval(script,TOPLEVEL_BINDING,'Reward1',1)
          assert($game_party.gold==64800,'minimum Adena payout')
          assert($game_actors[1].exp==43212,'EXP payout')
          assert($game_party.drops.length==20,'20 actual item rewards')
          expected=[
            [:item,35,1],[:item,34,1],[:item,33,1],[:item,37,1],
            [:armor,169,1],[:item,116,1],[:item,32,1],[:item,38,1],
            [:armor,289,1],[:weapon,123,1],[:weapon,41,1],[:item,3,1],
            [:weapon,1,1],[:armor,72,1],[:item,2,1],[:armor,303,1],
            [:item,43,1],[:armor,280,1],[:armor,12,1],[:armor,492,1]
          ]
          assert($game_party.drops==expected,'20 original drop links and quantity')

          {:item=>'Items',:weapon=>'Weapons',:armor=>'Armors'}.each do |kind,table|
            db=Marshal.load(File.binread(root+pre+table+'.rxdata'))
            expected.select{|e|e[0]==kind}.each do |_,id,qty|
              assert(!db[id].nil? && iv(db[id],:name).to_s!='',"item DB #{kind} #{id}")
            end
          end

          # An extra execution on the same death page must NOT pay a second time.
          eval(script,TOPLEVEL_BINDING,'RewardRepeat',1)
          assert($game_party.gold==64800 && $game_actors[1].exp==43212 &&
                 $game_party.drops.length==20,'duplicate payout guard')

          # Map revisit resets HP/switches and allows precisely one new kill reward.
          $game_switches[5991]=true
          $game_switches[5992]=true
          $game_map.setup(25)
          assert($game_variables[4988]==0,'map reentry resets HP')
          assert(!$game_switches[5991] && !$game_switches[5992],'map reentry resets attack switches')
          $game_variables[4988]=52
          eval(script,TOPLEVEL_BINDING,'RewardNextKill',1)
          assert($game_party.gold==129600 && $game_actors[1].exp==86424 &&
                 $game_party.drops.length==40,'next kill reward')

          puts 'PASS actual 20 drops + DB ID/type + Adena + EXP'
          puts 'PASS once-per-kill guard, reset on map entry, reward after reentry'
          puts 'PASS all 7 original motions and all 4 directions'
          puts 'PASS native 20-frame cycle, original damage/defense, 6:1 with strong 1/7'
          ZENITH_TEST
          ruby -c build/test.rb
          ruby build/test.rb

      - name: V276.3 Refresh sprite mapping data hashes and version
        shell: bash
        run: |
          set -euo pipefail
          cat > build/update_mapping.py <<'PY'
          from pathlib import Path
          import hashlib,re
          root=Path('site')
          game=root/'knight/gameasync'
          mapping=game/'mapping.js'
          s=mapping.read_text('utf-8')
          anchor='];\n\nvar mapping = {}'
          assert s.count(anchor)==1,('Mapping sprite insertion anchor',s.count(anchor))
          # The existing V276.2 original and cloned sprites stay byte-identical.
          entries=[]
          for action in ('Walk','Idle','Attack','AltAttack','Spell','Hit','Death'):
              name='SLZenith'+action
              path=game/'Graphics/Characters'/(name+'.png')
              assert path.is_file(),name
              md5=hashlib.md5(path.read_bytes()).hexdigest()
              entries.append('['+'"graphics/characters/'+name.lower()+'", '
                             +'"Graphics/Characters/'+name+'.png?h='+md5+'"],')
          s=s.replace(anchor,'\n'+'\n'.join(entries)+'\n'+anchor)
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          for path in (game/'Data'/(pre+'Map025.rxdata'),
                       game/'Data'/(pre+'CommonEvents.rxdata'),
                       game/'Data'/'Scripts.rxdata'):
              key='Data/'+path.name
              digest=hashlib.md5(path.read_bytes()).hexdigest()
              pattern='('+re.escape(key)+r'\?h=)[0-9a-f]{32}'
              s,count=re.subn(pattern,lambda m:m.group(1)+digest,s)
              assert count==1,('Data mapping hash missing',key,count)
          mapping.write_text(s,encoding='utf-8')
          loader=root/'knight/js/sl-assets-v229r115.js'
          script=loader.read_text('utf-8')
          assert script.count("var version='V276.2';")==1
          loader.write_text(script.replace("var version='V276.2';",
                                                "var version='V276.3';"),encoding='utf-8')
          for name in ('index.html','knight/index.html'):
              path=root/name
              data=path.read_text('utf-8')
              assert 'V276.2' in data,name
              path.write_text(data.replace('V276.2','V276.3')
                                  .replace('v276.2','v276.3'),encoding='utf-8')
          print('PASS seven SPR2807 sprites registered, data hashes and V276.3 labels')
          PY
          python3 build/update_mapping.py
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: V276.3 Protect all unrelated game data and images
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before=json.loads(Path('build/before.json').read_text('utf-8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          pre='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          added={'knight/gameasync/Graphics/Characters/SLZenith'+m+'.png'
                 for m in ('Walk','Idle','Attack','AltAttack','Spell','Hit','Death')}
          changed={p for p in before if before[p]!=after.get(p)}
          allowed={pre+'Map025.rxdata',pre+'CommonEvents.rxdata',
                   'knight/gameasync/Data/Scripts.rxdata',
                   'knight/gameasync/mapping.js',
                   'knight/js/sl-assets-v229r115.js',
                   'index.html','knight/index.html'}
          assert set(after)-set(before)==added,('Wrong added files',sorted((set(after)-set(before))^added))
          assert not(set(before)-set(after)),('Original game file deleted',sorted(set(before)-set(after)))
          assert changed==allowed,('Unexpected original-file changes',sorted(changed^allowed))
          for path in before:
              if path.startswith('knight/gameasync/Graphics/'):
                  assert before[path]==after[path],('Original image modified',path)
              if path.startswith(pre+'Map') and path!=pre+'Map025.rxdata':
                  assert before[path]==after[path],('Unrelated map modified',path)
          for path in (pre+'Map016.rxdata','knight/js/drive.js',
                       'knight/js/dpad.js','knight/assets/map-047-v241.pack'):
              assert before[path]==after[path],('Protected original changed',path)
          report=json.loads(Path('build/zenith-report.json').read_text('utf-8'))
          assert report['version']=='V276.3'
          assert report['hp']==52 and report['event']==29 and report['map']==25
          assert report['drops']==20 and report['exp']==43212
          assert report['adena']==[64800,151200]
          assert report['normal_physical']==[50,100] and report['magic']==[150,300]
          assert report['attack_cycle']==20
          print('PASS 7 added images, 7 approved modified files, all originals protected')
          print('PASS original Death Knight, all other maps, all original images unchanged')
          print('PASS V276.3 test HP52 and reward regression')
          PY

      - name: V276.3 Publish game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

