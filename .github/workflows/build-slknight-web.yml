
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V276.7.4
# BASE: successful V276.7.4.1, run 41969829452.
# SCOPE: Zenith Queen HP regeneration and visible original death only.
# HP: 520, variable 4988; restore 50 HP every 100 frames.
# DEATH: retain existing native 17-pose, 34-frame animation.
# KEEP: original walk, attacks, poison, magic, slow, drops and all other monsters.
# NO: new motion art, speed hook, damage rules or global interpreter overrides.

name: build-slknight-web.yml | V276.7.4 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Restore successful V276.7.4.1 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41969829452
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify successful game files
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json

          root=Path('site')
          files={
              str(p.relative_to(root)):
                  hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }
          assert len(files)==5623,('Successful file count',len(files))

          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          data=root/'knight/gameasync/Data'
          for name in (
              pre+'Map019.rxdata',
              pre+'Map025.rxdata',
              pre+'CommonEvents.rxdata',
              pre+'Animations.rxdata',
              'Scripts.rxdata'
          ):
              assert (data/name).is_file(),name

          for name in ('index.html','knight/index.html'):
              assert 'V276.7.4.1' in (root/name).read_text('utf-8')

          Path('build/original_sha256.json').write_text(
              json.dumps(files),encoding='utf-8'
          )
          print('PASS complete successful V276.7.4.1 baseline')
          PY

      - name: Fix Queen native HP regeneration and death display
        shell: bash
        run: |
          set -euo pipefail
          cat > build/zq_native_events.rb <<'RUBY'
          module RPG
            class Map;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class CommonEvent;end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
            class AudioFile;end
            class Animation
              class Frame;end
              class Timing;end
            end
          end
          class Table
            def self._load(bytes)
              obj=allocate
              obj.instance_variable_set(:@raw,bytes)
              obj
            end
            def _dump(level=0); @raw;end
          end
          class Tone
            def self._load(bytes)
              obj=allocate
              obj.instance_variable_set(:@raw,bytes)
              obj
            end
            def _dump(level=0); @raw;end
          end
          class Color<Tone;end

          def iv(object,name)
            object.instance_variable_get('@'+name.to_s)
          end
          def put(object,name,value)
            object.instance_variable_set('@'+name.to_s,value)
          end
          def copy(object)
            Marshal.load(Marshal.dump(object))
          end
          def check(condition,message)
            raise message unless condition
          end
          def command(template,code,indent,parameters)
            result=copy(template)
            put(result,:code,code)
            put(result,:indent,indent)
            put(result,:parameters,parameters)
            result
          end

          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          root='site/knight/gameasync/Data/'
          path19=root+pre+'Map019.rxdata'
          path25=root+pre+'Map025.rxdata'
          common_path=root+pre+'CommonEvents.rxdata'
          anims_path=root+pre+'Animations.rxdata'
          script_path=root+'Scripts.rxdata'

          map19=Marshal.load(File.binread(path19))
          map25=Marshal.load(File.binread(path25))
          common=Marshal.load(File.binread(common_path))
          animations=Marshal.load(File.binread(anims_path))
          scripts_before=File.binread(script_path)
          map19_before=File.binread(path19)
          anims_before=File.binread(anims_path)

          check(common.length==1069,'Baseline CE count mismatch')
          check(animations.length==924,'Baseline animation count mismatch')
          check(iv(map25,:events).length==19,'Map025 event count mismatch')
          check(!iv(map25,:events).key?(30),'Queen recovery event occupied')

          queen=iv(map25,:events).fetch(29)
          pages=iv(queen,:pages)
          check(pages.length==5,'Queen page count mismatch')
          death_condition=iv(pages[3],:condition)
          check(iv(death_condition,:variable_id)==4988,'HP variable mismatch')
          check(iv(death_condition,:variable_value)==520,'Queen max HP changed')
          check(iv(pages[2],:list)[0].instance_variable_get(:@parameters)[0].include?('4988'),
                'Original Queen HP display not found')

          # Same native parallel event approach as Death Knight (Map019 EV016).
          source=iv(map19,:events).fetch(16)
          source_page=iv(source,:pages).fetch(0)
          source_list=iv(source_page,:list)
          check(iv(source_page,:trigger)==4,'Death Knight regen not parallel')
          check(iv(source_list[0],:code)==106 && iv(source_list[0],:parameters)==[100],
                'Death Knight 100-frame regen changed')
          check(iv(source_list[29],:parameters)==[1,276,0,4000,4],
                'Death Knight HP guard changed')
          check(iv(source_list[30],:parameters)==[1,276,0,416,1],
                'Death Knight minimum regen guard changed')
          check(iv(source_list[31],:parameters)==[276,276,2,0,416],
                'Death Knight native regen changed')

          regen=copy(source)
          put(regen,:id,30)
          put(regen,:name,'[ZQ] HP 회복')
          put(regen,:x,iv(queen,:x))
          put(regen,:y,iv(queen,:y))

          rp=iv(regen,:pages).fetch(0)
          put(rp,:through,true)
          put(rp,:trigger,4)
          put(rp,:move_type,0)
          put(rp,:walk_anime,false)
          put(rp,:step_anime,false)
          put(rp,:list,[
            command(source_list[0],106,0,[100]),
            command(source_list[1],111,0,[1,4988,0,520,4]),
            command(source_list[2],111,1,[1,4988,0,50,1]),
            command(source_list[3],122,2,[4988,4988,2,0,50]),
            command(source_list[32],355,2,[
              '$m.drawMHP("제니스 퀸",$game_variables[4988],520,2)'
            ]),
            command(source_list[33],0,2,[]),
            command(source_list[34],412,1,[]),
            command(source_list[35],0,1,[]),
            command(source_list[36],412,0,[]),
            command(source_list[37],0,0,[])
          ])
          iv(map25,:events)[30]=regen

          # Use only the verified original death character and native animation.
          death_graphic=iv(pages[3],:graphic)
          check(iv(death_graphic,:character_name)=='SLZQBlank',
                'Original blank death page changed')
          put(death_graphic,:character_name,'SLZQDeath')
          put(death_graphic,:pattern,0)

          death_event=common.fetch(1067)
          dl=iv(death_event,:list)
          ids=dl.select{|c|iv(c,:code)==207}.map{|c|iv(c,:parameters)}
          check(ids==[[29,920],[29,921],[29,922],[29,923]],
                'Existing directional death animation changed')
          check(dl.any?{|c|iv(c,:code)==106 && iv(c,:parameters)==[70]},
                'Existing 70-frame death wait changed')
          check(!dl.any?{|c|iv(c,:code)==355 && iv(c,:parameters).join.include?('sl_attack_begin')},
                'Death visibility hook already present')

          # Reuse the already-working native attack animation visibility lock.
          # It hides the character only while the ORIGINAL death atlas plays.
          death_show=command(dl[1],355,0,[
            'e=$game_map.events[29]; e.sl_attack_begin("SLZQWalk",34) if e && e.respond_to?(:sl_attack_begin)'
          ])
          dl.insert(2,death_show)

          (920..923).each do |id|
            a=animations.fetch(id)
            check(iv(a,:frame_max)==34 && iv(a,:frames).length==34,
                  'Native 17 poses held twice changed')
          end

          File.binwrite(path25,Marshal.dump(map25))
          File.binwrite(common_path,Marshal.dump(common))
          check(File.binread(path19)==map19_before,'Death Knight data modified')
          check(File.binread(anims_path)==anims_before,'Original animations modified')
          check(File.binread(script_path)==scripts_before,'Original scripts modified')

          verify_map=Marshal.load(File.binread(path25))
          verify_ce=Marshal.load(File.binread(common_path))
          vreg=iv(verify_map,:events).fetch(30)
          check(iv(iv(vreg,:pages)[0],:list).length==10,'Regen command count')
          check(iv(iv(vreg,:pages)[0],:trigger)==4,'Regen not parallel')
          check(iv(iv(verify_map,:events)[29],:pages)[3].instance_variable_get(:@graphic).instance_variable_get(:@character_name)=='SLZQDeath',
                'Visible death graphic missing')
          check(iv(verify_ce.fetch(1067),:list).length==17,'Original death script modified unexpectedly')
          puts 'PASS 520 HP, 50 per 100 native frames'
          puts 'PASS native 17-pose death playback and visible death page'
          puts 'PASS unchanged native attacks, magic, movement, poison, slow and drops'
          RUBY

          ruby -c build/zq_native_events.rb
          ruby build/zq_native_events.rb

      - name: Refresh only changed native data and displayed version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re

          root=Path('site')
          game=root/'knight/gameasync'
          data=game/'Data'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          mapping=game/'mapping.js'
          content=mapping.read_text('utf-8')
          for name in (pre+'Map025.rxdata',pre+'CommonEvents.rxdata'):
              digest=hashlib.md5((data/name).read_bytes()).hexdigest()
              token=re.escape('Data/'+name)+r'\?h=[0-9a-f]{32}'
              content,count=re.subn(token,'Data/'+name+'?h='+digest,content)
              assert count==1,('Native mapping missing',name,count)
          mapping.write_text(content,encoding='utf-8')

          loader=root/'knight/js/sl-assets-v229r115.js'
          text=loader.read_text('utf-8')
          before="var version='V276.7.4.1';"
          after="var version='V276.7.4';"
          assert text.count(before)==1,'Display version not unique'
          loader.write_text(text.replace(before,after),encoding='utf-8')

          for name in ('index.html','knight/index.html'):
              path=root/name
              text=path.read_text('utf-8')
              assert 'V276.7.4.1' in text,name
              path.write_text(
                  text.replace('V276.7.4.1','V276.7.4')
                      .replace('?v=v276.7.4.1','?v=v276.7.4'),
                  encoding='utf-8'
              )
          print('PASS two native RXData mappings and requested version')
          PY
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Verify protected V276.7.4.1 originals
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json

          root=Path('site')
          original=json.loads(
              Path('build/original_sha256.json').read_text('utf-8')
          )
          current={
              str(p.relative_to(root)):
                  hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }
          assert len(current)==5623,'Original file count changed'
          assert set(original)==set(current),'Original file inventory changed'
          changed={name for name in original if original[name]!=current[name]}
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          allowed={
              'knight/gameasync/Data/'+pre+'Map025.rxdata',
              'knight/gameasync/Data/'+pre+'CommonEvents.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html',
              'knight/index.html'
          }
          assert changed==allowed,('Unexpected file changes',changed^allowed)
          print('PASS only six permitted files changed')
          print('PASS all existing motion graphics and original scripts retained')
          print('PASS original 4-direction 8-frame walk unchanged')
          print('PASS original attack magic poison and slow untouched')
          print('PASS V276.7.4 final verification')
          PY

      - name: Publish verified draft game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
