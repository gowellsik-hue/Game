name: Deploy SLKnight V14.3m MONSTER ATTACK MOTION
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: slknight-github-pages, cancel-in-progress: true}

env:
  BASELINE_SHA: c6815cd461dba60ec131898e6d5dd8690dd915ae
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout frozen V14.3l baseline
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.BASELINE_SHA }}
          path: baseline

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake cmake curl ffmpeg freepats git imagemagick libtool make mm-common patch pkg-config python3 rake ruby timidity unzip wget xz-utils fonts-nanum

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.MKXP_SRC_REF }}
          path: engine

      - name: Cache engine dependencies
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-${{ runner.os }}-${{ env.EMSDK_VER }}-onig25b

      - name: Extract exact V14.3l run scripts
        run: |
          ruby -ryaml - <<'RB'
          doc=YAML.load_file('baseline/.github/workflows/build-slknight-web.yml')
          steps=doc.fetch('jobs').fetch('build').fetch('steps')
          wanted={
            'Patch engine'=>'/tmp/base_patch_engine.sh',
            'Build engine'=>'/tmp/base_build_engine.sh',
            'Install game'=>'/tmp/base_install_game.sh',
            'Patch game'=>'/tmp/base_patch_game.sh',
            'Convert media'=>'/tmp/base_convert_media.sh',
            'Build mappings'=>'/tmp/base_build_mappings.sh',
            'Patch browser'=>'/tmp/base_patch_browser.sh',
            'Verify package'=>'/tmp/base_verify.sh'
          }
          wanted.each do |name,path|
            step=steps.find{|x|x['name']==name}
            abort "BASELINE STEP MISSING: #{name}" unless step&&step['run']
            File.write(path,step['run'])
          end
          puts 'BASELINE_SCRIPTS_OK'
          RB

      - name: Patch engine
        run: bash /tmp/base_patch_engine.sh

      - name: Build engine
        run: bash /tmp/base_build_engine.sh

      - name: Install game
        run: bash /tmp/base_install_game.sh

      - name: Patch game from V14.3l
        run: bash /tmp/base_patch_game.sh

      - name: Patch common monster attack motions
        run: |
          ruby -EUTF-8:UTF-8 - player/gameasync <<'RB'
          # encoding: UTF-8
          require 'shellwords'
          game=ARGV.fetch(0)

          class RawMarshalObject
            def self._load(data);o=allocate;o.instance_variable_set(:@raw,data);o;end
            def _dump(_depth);@raw;end
          end
          class Tone<RawMarshalObject;end
          class Color<RawMarshalObject;end
          class Rect<RawMarshalObject;end
          class Table<RawMarshalObject;end
          module RPG
            class AudioFile;end
            class Animation
              class Frame;end
              class Timing;end
            end
            class Map;end
            class CommonEvent;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end

          def iv(o,n);o.instance_variable_get("@#{n}");end
          def setiv(o,n,v);o.instance_variable_set("@#{n}",v);end

          def sl_norm_name(s)
            s.to_s.dup.force_encoding(Encoding::UTF_8)
              .gsub(/\[공격\]/,'')
              .gsub(/[\s\-·ㆍ]/,'')
              .gsub(/[()]/,'')
          end

          def sl_runs(a)
            runs=[];cur=[];prev=nil
            a.each do |n|
              if !prev.nil? && n!=prev+1
                runs<<cur unless cur.empty?
                cur=[]
              end
              cur<<n
              prev=n
            end
            runs<<cur unless cur.empty?
            runs
          end

          def sl_split_balanced(a,count=4)
            n=a.length
            out=[]
            count.times do |i|
              s=(i*n.to_f/count).round
              e=((i+1)*n.to_f/count).round
              out<<a[s...e].to_a
            end
            out
          end

          def sl_direction_groups(path,sheet)
            cmd="convert #{Shellwords.escape(path)} -crop 192x192 +repage -channel A -format '%[fx:mean]\\n' info: 2>/dev/null"
            means=`#{cmd}`.lines.map{|x|x.to_f}
            used=[]
            means.each_with_index{|v,i|used<<i if v>0.00001}
            return nil if used.length<8

            runs=sl_runs(used)
            groups=nil
            if runs.length>=4
              groups=runs[0,4]
            elsif runs.length==2 && runs.all?{|r|r.length>=4}
              groups=sl_split_balanced(runs[0],2)+sl_split_balanced(runs[1],2)
            else
              groups=sl_split_balanced(used,4)
            end

            # Direction order:
            # down / left / right / up
            # Black knight is an irregular 5/5/7/6 sheet.
            if sheet=='흑기사모션'
              groups=[
                (0..4).to_a,
                (5..9).to_a,
                (10..16).to_a,
                (17..22).to_a
              ]
            end

            return nil unless groups&&groups.length==4&&groups.all?{|g|!g.empty?}

            {
              2=>groups[0],
              4=>groups[1],
              6=>groups[2],
              8=>groups[3]
            }
          end

          def sl_stretch(seq,target)
            return seq.dup if target<=seq.length

            n=seq.length
            impact=[[((n-1)*0.55).round,0].max,n-1].min
            counts=Array.new(n,1)
            extra=target-n

            priority=[
              impact,
              impact,
              impact-1,
              impact+1,
              impact,
              impact-2,
              impact+2
            ].select{|i|i>=0&&i<n}

            extra.times do |i|
              counts[priority[i%priority.length]]+=1
            end

            out=[]
            seq.each_with_index do |p,i|
              counts[i].times{out<<p}
            end
            out
          end

          ce_path=Dir.glob(
            File.join(game,'Data','*CommonEvents.rxdata')
          ).max_by{|p|File.size(p)}

          anim_path=Dir.glob(
            File.join(game,'Data','*Animations.rxdata')
          ).max_by{|p|File.size(p)}

          abort 'CommonEvents missing' unless ce_path&&File.size(ce_path)>1000
          abort 'Animations missing' unless anim_path&&File.size(anim_path)>1000

          common_events=Marshal.load(File.binread(ce_path))
          animations=Marshal.load(File.binread(anim_path))

          anim_dir=File.join(game,'Graphics','Animations')
          motion_assets={}

          Dir.glob(File.join(anim_dir,'*.png')).sort.each do |p|
            sheet=File.basename(p,'.png').dup.force_encoding(Encoding::UTF_8)

            next unless sheet.include?('모션')
            next if sheet.include?('죽음')
            next if sheet.include?('맞음')
            next if sheet.start_with?('물약')
            next if sheet.match?(/모션\d+\z/)

            stem=sheet.sub(/[\s\-]*모션\z/,'')
            key=sl_norm_name(stem)

            motion_assets[key]||=[sheet,p] unless key.empty?
          end

          attack_ids={}

          common_events.each_with_index do |ce,id|
            next unless ce

            name=(
              iv(ce,:name).to_s.dup.force_encoding(Encoding::UTF_8)
              rescue ''
            )

            next unless name.start_with?('[공격]')

            monster=sl_norm_name(name)
            candidates=motion_assets.keys.select do |k|
              monster.include?(k)
            end

            next if candidates.empty?

            key=candidates.max_by{|k|k.length}

            attack_ids[id]={
              name:name,
              sheet:motion_assets[key][0],
              path:motion_assets[key][1]
            }
          end

          # Remove old V14.3l black-knight-only call.
          removed_old=0

          common_events.compact.each do |ce|
            list=iv(ce,:list)||[]
            before=list.length

            list.delete_if do |cmd|
              next false unless iv(cmd,:code)==355

              p=(iv(cmd,:parameters)||[])[0].to_s

              p.include?(
                'aid={2=>500,4=>501,6=>502,8=>503}'
              )
            end

            removed_old+=before-list.length
          end

          base_attack=animations.compact.find do |a|
            frames=(iv(a,:frames) rescue nil)

            frames.is_a?(Array) &&
              frames[0] &&
              (iv(frames[0],:cell_data) rescue nil)
          end

          abort 'animation frame template missing' unless base_attack

          next_anim=[animations.length,600].max
          generated={}
          used_sheets={}
          patched=0

          make_anim=lambda do |id,sheet,patterns,wait,dir|
            target=[
              patterns.length,
              ((wait-2)/2.0).round
            ].max

            target=[target,18].min

            timeline=sl_stretch(patterns,target)

            anim=Marshal.load(
              Marshal.dump(base_attack)
            )

            setiv(anim,:id,id)
            setiv(anim,:name,"SLM #{sheet} #{dir} W#{wait}")
            setiv(anim,:animation_name,sheet)
            setiv(anim,:animation_hue,0)
            setiv(anim,:position,1)
            setiv(anim,:frame_max,timeline.length)
            setiv(anim,:timings,[])

            frames=[]

            timeline.each do |pattern|
              frame=Marshal.load(
                Marshal.dump(iv(base_attack,:frames)[0])
              )

              setiv(frame,:cell_max,1)

              table=Table.allocate

              setiv(
                table,
                :raw,
                [2,1,8,1,8].pack('L<5')+
                [
                  pattern,
                  0,
                  0,
                  100,
                  0,
                  0,
                  255,
                  0
                ].pack('s<8')
              )

              setiv(frame,:cell_data,table)
              frames<<frame
            end

            setiv(anim,:frames,frames)
            animations[id]=anim
          end

          # Use the real Wait already present in each monster caller.
          #
          # visual starts
          # -> 45% wind-up
          # -> original damage common event
          # -> remaining recovery
          #
          # Total original Wait is preserved.
          common_events.each_with_index do |ce,cid|
            next unless ce

            list=iv(ce,:list)||[]
            i=0

            while i<list.length
              call=list[i]

              unless iv(call,:code)==117
                i+=1
                next
              end

              pars=iv(call,:parameters)||[]
              attack_id=pars[0].to_i
              meta=attack_ids[attack_id]

              unless meta
                i+=1
                next
              end

              indent=iv(call,:indent).to_i
              wait_cmd=nil

              ((i+1)...[i+10,list.length].min).each do |j|
                c=list[j]
                ci=iv(c,:indent).to_i

                break if ci<indent

                if iv(c,:code)==106&&ci==indent
                  wait_cmd=c
                  break
                end
              end

              unless wait_cmd
                i+=1
                next
              end

              wait=(iv(wait_cmd,:parameters)||[])[0].to_i

              unless wait>=8
                i+=1
                next
              end

              groups=sl_direction_groups(
                meta[:path],
                meta[:sheet]
              )

              unless groups
                i+=1
                next
              end

              key=[
                meta[:sheet],
                wait
              ]

              ids=generated[key]

              unless ids
                ids={}

                [2,4,6,8].each do |dir|
                  id=next_anim
                  next_anim+=1

                  make_anim.call(
                    id,
                    meta[:sheet],
                    groups[dir],
                    wait,
                    dir
                  )

                  ids[dir]=id
                end

                generated[key]=ids
                used_sheets[meta[:sheet]]=true
              end

              windup=(wait*0.45).round
              windup=3 if windup<3
              windup=wait-4 if windup>wait-4

              recovery=wait-windup
              recovery=1 if recovery<1

              anim_cmd=RPG::EventCommand.new

              setiv(
                anim_cmd,
                :code,
                355
              )

              setiv(
                anim_cmd,
                :indent,
                indent
              )

              setiv(
                anim_cmd,
                :parameters,
                [
                  "e=$game_map.events[@event_id];if e;aid={2=>#{ids[2]},4=>#{ids[4]},6=>#{ids[6]},8=>#{ids[8]}}[e.direction];e.animation_id=aid if aid;end"
                ]
              )

              windup_cmd=RPG::EventCommand.new

              setiv(
                windup_cmd,
                :code,
                106
              )

              setiv(
                windup_cmd,
                :indent,
                indent
              )

              setiv(
                windup_cmd,
                :parameters,
                [windup]
              )

              setiv(
                wait_cmd,
                :parameters,
                [recovery]
              )

              list.insert(
                i,
                anim_cmd,
                windup_cmd
              )

              patched+=1
              i+=3
            end
          end

          abort 'no monster attack callers patched' if patched==0

          File.binwrite(
            ce_path,
            Marshal.dump(common_events)
          )

          File.binwrite(
            anim_path,
            Marshal.dump(animations)
          )

          File.write(
            File.join(game,'sl_attack_sheets.txt'),
            used_sheets.keys.sort.join("\n")+"\n"
          )

          puts(
            "MONSTER_ATTACK_MOTION_OK " \
            "callers=#{patched} " \
            "sheets=#{used_sheets.length} " \
            "generated=#{generated.length*4} " \
            "removed_old=#{removed_old}"
          )

          puts used_sheets.keys.sort.join('|')
          RB

      - name: Convert media
        run: bash /tmp/base_convert_media.sh

      - name: Build mappings
        run: bash /tmp/base_build_mappings.sh

      - name: Patch browser from V14.3l
        run: bash /tmp/base_patch_browser.sh

      - name: Verify frozen V14.3l baseline
        run: bash /tmp/base_verify.sh

      - name: Patch monster motion preload and V14.3m cache
        run: |
          ruby -EUTF-8:UTF-8 - player/index.html player/gameasync/sl_attack_sheets.txt <<'RB'
          path=ARGV.fetch(0)
          list_path=ARGV.fetch(1)

          html=File.read(path)

          sheets=File.readlines(
            list_path,
            chomp:true
          ).reject{|x|x.empty?}

          abort 'attack sheet list too small' if sheets.length<20

          old=<<'JS'.strip
          var ka='/game/Graphics/Animations/흑기사모션.png';
            try{if(FS.analyzePath(ka).exists)FS.unlink(ka);}catch(e){}
            FS.createPreloadedFile('/game/Graphics/Animations','흑기사모션.png',encodeURI('gameasync/Graphics/Animations/흑기사모션.png?v=v143l'),true,true,function(){},function(){console.error('SLANIMERR|흑기사모션');});
          JS

          replacement=<<JS.strip
          var slAttackSheets=#{sheets.inspect};
            slAttackSheets.forEach(function(name){
              var file=name+'.png';
              var p='/game/Graphics/Animations/'+file;
              try{if(FS.analyzePath(p).exists)FS.unlink(p);}catch(e){}
              FS.createPreloadedFile('/game/Graphics/Animations',file,encodeURI('gameasync/Graphics/Animations/'+file+'?v=v143m'),true,true,function(){},function(){console.error('SLANIMERR|'+file);});
            });
          JS

          count=html.scan(
            Regexp.new(
              Regexp.escape(old)
            )
          ).size

          abort(
            "black knight preload block count=#{count}"
          ) unless count==1

          html.sub!(
            old,
            replacement
          )

          html.gsub!(
            'V14.3l',
            'V14.3m'
          )

          html.gsub!(
            'v143l',
            'v143m'
          )

          File.write(
            path,
            html
          )

          puts(
            "MONSTER_PRELOAD_OK sheets=#{sheets.length}"
          )
          RB

      - name: Verify V14.3m monster attack package
        run: |
          set -e

          test -s player/index.html
          test -s player/gameasync/sl_attack_sheets.txt

          test "$(wc -l < player/gameasync/sl_attack_sheets.txt)" -ge 20

          grep -Fq 'slAttackSheets' player/index.html
          grep -Fq 'v143m' player/index.html

          ! grep -Fq \
            "var ka='/game/Graphics/Animations/흑기사모션.png'" \
            player/index.html

          ruby -EUTF-8:UTF-8 - player/gameasync <<'RB'
          game=ARGV.fetch(0)

          class RawMarshalObject
            def self._load(data)
              o=allocate
              o.instance_variable_set(:@raw,data)
              o
            end

            def _dump(_depth)
              @raw
            end
          end

          class Tone<RawMarshalObject;end
          class Color<RawMarshalObject;end
          class Rect<RawMarshalObject;end
          class Table<RawMarshalObject;end

          module RPG
            class AudioFile;end

            class Animation
              class Frame;end
              class Timing;end
            end

            class CommonEvent;end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end

          def iv(o,n)
            o.instance_variable_get("@#{n}")
          end

          cp=Dir.glob(
            File.join(
              game,
              'Data',
              '*CommonEvents.rxdata'
            )
          ).max_by{|p|File.size(p)}

          ap=Dir.glob(
            File.join(
              game,
              'Data',
              '*Animations.rxdata'
            )
          ).max_by{|p|File.size(p)}

          ce=Marshal.load(
            File.binread(cp)
          )

          an=Marshal.load(
            File.binread(ap)
          )

          old=0
          general=0

          ce.compact.each do |x|
            (iv(x,:list)||[]).each do |cmd|
              next unless iv(cmd,:code)==355

              txt=(
                iv(cmd,:parameters)||[]
              )[0].to_s

              old+=1 if txt.include?(
                'aid={2=>500,4=>501,6=>502,8=>503}'
              )

              if txt.include?(
                'e=$game_map.events[@event_id]'
              ) && txt.include?(
                'e.animation_id=aid'
              )
                general+=1
              end
            end
          end

          slm=an.compact.count do |x|
            iv(x,:name).to_s.start_with?('SLM ')
          end

          abort(
            "old black knight injection remains=#{old}"
          ) unless old==0

          abort(
            "general attack injection too small=#{general}"
          ) unless general>=80

          abort(
            "generated attack animations too small=#{slm}"
          ) unless slm>=80

          puts(
            "MONSTER_VERIFY_OK " \
            "callers=#{general} " \
            "animations=#{slm}"
          )
          RB

          du -sh player

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
