
name: V202 | Restore Missing Fairy Combat Sounds Only

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Restore exact deployed V201 site
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 38125379547
          github-token: ${{ github.token }}
          path: previous

      - name: Extract and protect game scripts and controls
        shell: bash
        run: |
          set -euo pipefail
          test -s previous/artifact.tar
          mkdir -p site
          tar -xf previous/artifact.tar -C site
          for f in \
            site/knight/index.html \
            site/knight/js/dpad.js \
            site/knight/gameasync/Data/Scripts.rxdata \
            site/elf/index.html \
            site/elf/js/dpad.js \
            site/elf/gameasync/Data/Scripts.rxdata \
            site/elf/gameasync/mapping.js \
            site/elf/gameasync/Audio/SE/attack1.ogg \
            site/elf/gameasync/Audio/SE/attack2.ogg \
            site/elf/gameasync/Audio/SE/missile1.ogg \
            site/elf/mkxp.wasm; do
            test -s "$f"
          done
          sha256sum \
            site/knight/index.html \
            site/knight/js/dpad.js \
            site/knight/gameasync/Data/Scripts.rxdata \
            site/elf/js/dpad.js \
            site/elf/gameasync/Data/Scripts.rxdata \
            site/elf/mkxp.js \
            site/elf/mkxp.wasm > /tmp/v202_untouched.sha
          echo V202_EXACT_V201_GAME_RESTORED

      - name: Repair nine missing Fairy event sound resources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re
          import shutil

          root = Path('site/elf/gameasync')
          effects = root / 'Audio' / 'SE'
          mapping_file = root / 'mapping.js'
          mapping = mapping_file.read_text(encoding='utf-8')

          # Every name below is referenced by an existing Fairy map event.
          # Existing, decodable sounds are temporary replacements; no combat
          # calculation, event script or key binding is changed.
          missing = {
              '여요정주먹': 'attack1',
              '펑거스 맞음': 'attack2',
              '펑거스 죽음': 'attack2',
              '엔트 맞음': 'attack2',
              '판 맞음': 'attack2',
              '아라크네 맞음': 'attack2',
              '활': 'missile1',
              '다크레인저 활': 'missile1',
              '다크엘프 활': 'missile1',
          }
          lines = []
          for target, replacement in missing.items():
              src = effects / (replacement + '.ogg')
              dst = effects / (target + '.ogg')
              key = 'audio/se/' + target.lower()
              if not src.is_file() or src.read_bytes()[:4] != b'OggS':
                  raise SystemExit('Missing or invalid fallback OGG: ' + str(src))
              if dst.exists() or ('["' + key + '",') in mapping:
                  raise SystemExit('Existing asset would be overwritten: ' + target)
              shutil.copyfile(src, dst)
              digest = hashlib.md5(dst.read_bytes()).hexdigest()
              address = 'Audio/SE/' + target + '.ogg?h=' + digest
              lines.append('[' + json.dumps(key, ensure_ascii=False) + ', ' +
                           json.dumps(address, ensure_ascii=False) + '],')

          updated, count = re.subn(r'^\];\s*$',
                                   lambda m: '\n'.join(lines) + '\n];',
                                   mapping, count=1, flags=re.M)
          if count != 1:
              raise SystemExit('Fairy mapping array closing marker mismatch')
          mapping_file.write_text(updated, encoding='utf-8')

          html_file = Path('site/elf/index.html')
          html = html_file.read_text(encoding='utf-8')
          changes = {
              'gameasync/mapping.js?v=fairy201':
                  'gameasync/mapping.js?v=fairy202',
              "box.textContent='V201 '+state":
                  "box.textContent='V202 '+state",
          }
          for old, new in changes.items():
              if html.count(old) != 1:
                  raise SystemExit('Unexpected Fairy HTML marker: ' + old)
              html = html.replace(old, new, 1)
          html_file.write_text(html, encoding='utf-8')
          print('V202_NINE_MISSING_SFX_MAPPED')
          PY

      - name: Verify resources and unchanged game behavior code
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c /tmp/v202_untouched.sha
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          root = Path('site/elf/gameasync')
          mapping = (root / 'mapping.js').read_text(encoding='utf-8')
          names = ('여요정주먹', '펑거스 맞음', '펑거스 죽음',
                   '엔트 맞음', '판 맞음', '아라크네 맞음',
                   '활', '다크레인저 활', '다크엘프 활')
          for name in names:
              f = root / 'Audio' / 'SE' / (name + '.ogg')
              assert f.is_file() and f.read_bytes()[:4] == b'OggS', name
              tag = 'Audio/SE/' + name + '.ogg?h=' + hashlib.md5(f.read_bytes()).hexdigest()
              assert tag in mapping, 'Mapping missing: ' + name
              assert len(re.findall(r'\["audio/se/' + re.escape(name.lower()) + r'",', mapping)) == 1
          html = Path('site/elf/index.html').read_text(encoding='utf-8')
          assert 'gameasync/mapping.js?v=fairy202' in html
          assert "box.textContent='V202 '+state" in html
          assert 'js/dpad.js?v=fairy198' in html
          print('V202_NINE_SFX_VALIDATED; CODE_UNCHANGED')
          PY

      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
