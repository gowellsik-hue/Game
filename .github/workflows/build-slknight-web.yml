name: V219 | Restore Fairy Entry and Connect Native C Attack
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: slknight-github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Restore known V216 game if artifact remains
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: github-pages
          run-id: 38522314631
          github-token: ${{ github.token }}
          path: previous

      - name: Recover complete site and lock unchanged files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          if test -s previous/artifact.tar; then
            tar -xf previous/artifact.tar -C site
            echo RESTORED_V216_ARTIFACT
          else
            python3 - <<'PY_RECOVER'
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request,urlopen
          from concurrent.futures import ThreadPoolExecutor,as_completed
          import hashlib,json,re,time
          root=Path('site')
          base='https://gowellsik-hue.github.io/Game/'
          fixed=('index.html','COPYING-mkxp-web.txt','manifest.webmanifest',
                 'mkxp.js','mkxp.wasm','js/drive.js','js/dpad.js',
                 'js/localforage.min.js')
          def get(url):
              for i in range(6):
                  try:
                      with urlopen(Request(url,headers={'Accept-Encoding':'identity'}),timeout=60) as r:
                          return r.read()
                  except Exception:
                      if i==5:raise
                      time.sleep(2*i+1)
          files={'index.html':(base+'index.html?recover='+str(int(time.time())),None)}
          for game in ('knight','elf'):
              for rel in fixed:
                  files[game+'/'+rel]=(base+game+'/'+quote(rel,safe='/'),None)
              key=game+'/gameasync/mapping.js'
              blob=get(base+key+'?recover='+str(int(time.time())))
              target=root/key
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(blob)
              body=blob.decode().split('var mappingArray = ',1)[1].split('];',1)[0]+']'
              for _,mapped in json.loads(re.sub(r',\s*\]$',']',body)):
                  rel,sep,digest=mapped.partition('?h=')
                  if '.' not in Path(rel).name:continue
                  if rel.startswith('/') or '..' in Path(rel).parts:
                      raise RuntimeError('Unsafe asset')
                  name=game+'/gameasync/'+rel
                  files[name]=(base+game+'/gameasync/'+quote(rel,safe='/')+
                               ('?h='+digest if sep else ''),
                               digest if sep else None)
          if len(files)!=5354:
              raise RuntimeError('Incomplete published asset manifest')
          def job(item):
              name,(url,digest)=item
              blob=get(url)
              if digest and hashlib.md5(blob).hexdigest()!=digest:
                  raise RuntimeError('Asset MD5 mismatch '+name)
              target=root/name
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(blob)
          with ThreadPoolExecutor(max_workers=16) as pool:
              for future in as_completed([
                  pool.submit(job,item)
                  for item in files.items()
                  if not (root/item[0]).is_file()
              ]):
                  future.result()
          print('RECOVERED_PUBLISHED_SITE',len(files))
          PY_RECOVER
          fi
          python3 - <<'PY_LOCK'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before={
              str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }
          if len(before)!=5354:
              raise SystemExit('Incomplete game; refusing to deploy')
          locked={
              'index.html':'cb972e363a37790bef24aafceae5bd12aaa686934acc4a4c052402006341a3ba',
              'knight/index.html':'38b008e7e31b5a7f8eee1aac255641adf1c38a6927ecd8a2b4a29e71e7f1b8a4',
              'knight/gameasync/Data/Scripts.rxdata':'8966a677a9789f3e9c95a058659dcf22b51d98fb1c68dd946a4e6879cf2bbaec'
          }
          for path,digest in locked.items():
              if before.get(path)!=digest:
                  raise SystemExit('Baseline mismatch '+path)
          Path('/tmp/v219_before.json').write_text(json.dumps(before))
          PY_LOCK

      - name: Keep old title input and patch only Fairy map attack
        shell: bash
        run: |
          set -euo pipefail
          ruby - site/elf/gameasync/Data/Scripts.rxdata <<'RB_PATCH'
          require 'zlib'
          p=ARGV[0]
          a=Marshal.load(File.binread(p))
          abort 'Unexpected scripts' unless a.size==124
          shim=a.find{|x|x[1]=='Web Compatibility'}
          scene=a.find{|x|x[1]=='Scene_Map'}
          title=a.find{|x|x[1]=='Scene_Title'}
          abort 'Missing original classes' unless shim&&scene&&title
          title_before=title[2].dup
          decode=lambda{|x|Zlib::Inflate.inflate(x[2]).force_encoding('UTF-8')}
          sh=decode.call(shim)
          sh_before=sh.dup
          abort 'Unexpected F-key adapter' unless
            sh.include?('    when 70 then Input::F5') ||
            sh.include?('    when 70 then Input::F7')
          sh=sh.sub('    when 70 then Input::F7',
                    '    when 70 then Input::F5')
          sc=decode.call(scene)
          sc_before=sc.dup
          old="      if Keyboard.testkey(70) \n"
          new="      if Keyboard.testkey(70) || Input.trigger?(Input::C) \n"
          if sc.include?(old)
            abort 'Duplicate original F attack' unless sc.scan(old).size==1
            sc=sc.sub(old,new)
          else
            abort 'Unknown original combat method' unless sc.scan(new).size==1
          end
          RubyVM::InstructionSequence.compile(sh)
          RubyVM::InstructionSequence.compile(sc)
          shim[2]=Zlib::Deflate.deflate(sh) if sh!=sh_before
          scene[2]=Zlib::Deflate.deflate(sc) if sc!=sc_before
          abort 'Title accidentally modified' unless title[2]==title_before
          File.binwrite(p,Marshal.dump(a)) if sh!=sh_before || sc!=sc_before
          puts 'NATIVE_C_ATTACK_LINKED_ONLY_IN_SCENE_MAP_TITLE_UNCHANGED'
          RB_PATCH

          python3 - <<'PY_JS'
          from pathlib import Path
          import hashlib,re
          elf=Path('site/elf')
          p=elf/'js/dpad.js'
          s=p.read_text()
          i=s.index('function attackButton(parent){')
          j=s.index('\nfunction button(',i)
          attack=s[i:j]
          if attack.count('118')==5:
              attack=attack.replace('118','67')
          elif attack.count('67')!=5:
              raise SystemExit('Unknown ATK buttons')
          s=s[:i]+attack+s[j:]
          p.write_text(s)
          if hashlib.sha256(p.read_bytes()).hexdigest()!='52e1b860e2ad9c3f6194d7cf983bcf6fa1a43354650d71fd9fd11984761cde69':
              raise SystemExit('ATK not identical to original V216 controls')
          scripts=elf/'gameasync/Data/Scripts.rxdata'
          mapping=elf/'gameasync/mapping.js'
          md5=hashlib.md5(scripts.read_bytes()).hexdigest()
          content=mapping.read_text()
          pat=r'(\["data/scripts",\s*"Data/Scripts\.rxdata\?h=)[0-9a-f]{32}("\],)'
          content,n=re.subn(pat,
              lambda m:m.group(1)+md5+m.group(2),content)
          if n!=1:
              raise SystemExit('Missing scripts cache entry')
          mapping.write_text(content)
          page=elf/'index.html'
          html=page.read_text()
          replacements=[
              (r'js/dpad\.js\?v=fairy\d+',
               'js/dpad.js?v=fairy219'),
              (r'gameasync/mapping\.js\?v=fairy\d+',
               'gameasync/mapping.js?v=fairy219'),
              (r"box\.textContent='V\d+ '\+state",
               "box.textContent='V219 '+state")
          ]
          for pat,repl in replacements:
              html,n=re.subn(pat,lambda m:repl,html)
              if n!=1:
                  raise SystemExit('HTML version anchor mismatch '+pat)
          page.write_text(html)
          PY_JS
          node --check site/elf/js/dpad.js

      - name: Test title preservation and map-only C attack
        shell: bash
        run: |
          set -euo pipefail
          ruby - site/elf/gameasync/Data/Scripts.rxdata <<'RB_TEST'
          require 'zlib'
          a=Marshal.load(File.binread(ARGV[0]))
          read=lambda{|name|
            Zlib::Inflate.inflate(a.find{|x|x[1]==name}[2]).force_encoding('UTF-8')
          }
          abort 'Changed keyboard adapter' unless
            read.call('Web Compatibility').include?('    when 70 then Input::F5')
          s=read.call('Scene_Map')
          start=s.index('  def sl_v198_inputs')
          finish=s.index('  def dispose',start)
          abort 'Missing original input routine' unless start && finish
          module Keyboard
            def self.getstate(x);false;end
            def self.testkey(x);false;end
          end
          module Input
            C=13
            R=18
            def self.trigger?(x);$test_c && x==C;end
          end
          class Scene_Map;end
          Scene_Map.class_eval(s[start...finish])
          $game_switches=Hash.new(false)
          $game_variables=Hash.new(0)
          $test_c=false
          Scene_Map.new.sl_v198_inputs
          abort 'Attack without C' if $game_switches[763]
          $test_c=true
          Scene_Map.new.sl_v198_inputs
          abort 'Native attack not activated by C' unless $game_switches[763]
          t=read.call('Scene_Title')
          abort 'Original title C input missing' unless
            t.include?('Input.trigger?(Input::C)') &&
            t.include?('command_new_game')
          puts 'TITLE_C_PRESERVED_MAP_C_ACTIVATES_ORIGINAL_ATTACK_763'
          RB_TEST

          python3 - <<'PY_CHECK'
          from pathlib import Path
          import json,hashlib
          root=Path('site')
          before=json.loads(Path('/tmp/v219_before.json').read_text())
          after={
              str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }
          if before.keys()!=after.keys():
              raise SystemExit('Site files unexpectedly added or lost')
          changed={k for k in before if before[k]!=after[k]}
          allowed={
              'elf/index.html',
              'elf/gameasync/mapping.js',
              'elf/gameasync/Data/Scripts.rxdata',
              'elf/js/dpad.js'
          }
          if not changed<=allowed:
              raise SystemExit('Unexpected game changes '+str(changed))
          print('V219_PASS',len(after),'only',sorted(changed))
          PY_CHECK

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
