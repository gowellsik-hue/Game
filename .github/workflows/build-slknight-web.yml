
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V272
# BASE: V267 successful run 41441629897
# FIX: Remove duplicate Zenith sprite update wrapper.
# FIX: Modify native source rectangle directly, without replacing sx/sy formulas.
# FIX: Cache the original attack command list, retaining native Interpreter behavior.
# FIX: Avoid processing the same monster state twice in one Graphics frame.
# FIX: Activate pursuit only within recognition distance.
# KEEP: Original browser loader, all other monsters, original damage and drops.
# STATUS: Build and actual game execution not yet verified.

name: build-slknight-web.yml | V272 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: V272 Restore V267 game without broken V268 loader
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41441629897
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V272 Verify original inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s baseline/artifact.tar
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json

          root=Path('site')
          before={
              str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }
          assert len(before)==5610,('Unexpected inventory',len(before))

          data=root/'knight/gameasync/Data'
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          for name in (
              'Scripts.rxdata',
              prefix+'Map025.rxdata',
              prefix+'Map016.rxdata',
              prefix+'Map021.rxdata',
              prefix+'CommonEvents.rxdata'
          ):
              assert (data/name).is_file(),name

          for action in ('Idle','Walk','Attack','AltAttack','Spell','Hit','Death'):
              name='SLZenith'+action+'.png'
              assert (root/'knight/gameasync/Graphics/Characters'/name).is_file(),name

          drive=(root/'knight/js/drive.js').read_text('utf-8')
          loader=(root/'knight/js/sl-assets-v229r115.js').read_text('utf-8')
          assert 'slV268NetPending' not in drive
          assert 'slV268ZenithReady' not in loader
          assert "var version='V267';" in loader

          Path('build/before.json').write_text(
              json.dumps(before,sort_keys=True),encoding='utf-8'
          )
          print('PASS original V267 game and browser loader')
          PY

      - name: V272 Remove duplicated Zenith processing
        shell: bash
        run: |
          set -euo pipefail

          cat > build/patch.rb <<'RUBY'
          # encoding: UTF-8
          require 'zlib'

          module RPG
            class Map;end
            class MapInfo;end
            class CommonEvent;end
            class AudioFile;end
            class Item;end
            class Weapon;end
            class Armor;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end

          class Table
            def self._load(raw)
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end
            def _dump(level=0);@raw;end
          end

          class Tone
            def self._load(raw)
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end
            def _dump(level=0);@raw;end
          end
          class Color<Tone;end

          def iv(obj,name)
            obj.instance_variable_get('@'+name.to_s)
          end

          def put(obj,name,value)
            obj.instance_variable_set('@'+name.to_s,value)
          end

          def replace_once(source,old,replacement,label)
            count=source.scan(old).length
            raise "#{label}: expected one match, found #{count}" unless count==1
            source.sub(old,replacement)
          end

          root='site/knight/gameasync/Data/'
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          map_path=root+prefix+'Map025.rxdata'
          scripts_path=root+'Scripts.rxdata'

          map=Marshal.load(File.binread(map_path))
          events=iv(map,:events)
          boss=events.fetch(29)
          pages=iv(boss,:pages)

          raise 'Unexpected Zenith page count' unless pages.length==1
          page=pages.first
          route=iv(page,:move_route)

          raise 'Original pursuit route changed' unless
            iv(page,:move_type)==3 &&
            iv(page,:move_frequency)==6 &&
            iv(page,:trigger)==0 &&
            iv(route,:list).map{|cmd|iv(cmd,:code)}==[10,0]

          raise 'Unexpected boss event commands' unless
            iv(page,:list).length==1 &&
            iv(iv(page,:list).first,:code)==0

          other_events={}
          events.each do |id,event|
            other_events[id]=Marshal.dump(event) unless id==29
          end

          # Keep the original native route, but disable pursuit at map entry.
          # Activation is controlled by the existing monster state update.
          put(page,:move_type,0)

          other_events.each do |id,raw|
            raise "Unrelated event changed #{id}" unless
              Marshal.dump(events[id])==raw
          end

          scripts=Marshal.load(File.binread(scripts_path))

          raise 'Invalid script archive' unless
            scripts.is_a?(Array) && scripts.length>=136

          raise 'Native sprite script missing' unless
            scripts[28].is_a?(Array) &&
            scripts[28][1]=='Sprite_Character'

          indexes=scripts.each_index.select do |i|
            scripts[i].is_a?(Array) &&
            scripts[i][1]=='SLMonsterV267'
          end

          raise 'Monster runtime missing or duplicated' unless indexes.length==1
          index=indexes.first

          original_other={}
          scripts.each_with_index do |entry,i|
            original_other[i]=Marshal.dump(entry) unless
              i==28 || i==index
          end

          runtime=Zlib::Inflate.inflate(scripts[index][2]).force_encoding('UTF-8')
          native=Zlib::Inflate.inflate(scripts[28][2])

          raise 'Monster runtime invalid encoding' unless runtime.valid_encoding?

          approved=[
            ':level=>60',
            ':max_hp=>5200',
            ':physical=>[50,100]',
            ':magic=>[150,300]',
            ':attack_wait=>20',
            ':attack_range=>3',
            ':accuracy=>9999',
            ':exp=>43212',
            ':adena=>[64800,151200]',
            'floor=80',
            '[26,26,0,2,0,6]',
            '[:weapon,41,50]'
          ]
          approved.each do |marker|
            raise "Approved parameter missing #{marker}" unless runtime.include?(marker)
          end

          drops=runtime.scan(/\[:(item|weapon|armor),(\d+),(\d+)\]/)
          raise 'Drop table mismatch' unless drops.length==20

          # DELETE the complete extra sprite update wrapper.
          # No additional Sprite_Character class will be introduced.
          start=runtime.index("\nclass Sprite_Character\n")
          finish=start && runtime.index("\nmodule SLMonster\n",start+1)

          raise 'Zenith sprite wrapper boundaries changed' unless
            start && finish && start<finish

          removed=runtime[start...finish]
          raise 'Unexpected sprite wrapper' unless
            removed.include?('alias slm_v267_original_update update') &&
            removed.include?('SLMonster.frame_info') &&
            removed.include?('rect.set(frame*cw,row*ch,cw,ch)')

          runtime=runtime[0...start]+runtime[finish..-1]
          raise 'Extra Sprite_Character remains' if
            runtime.include?('class Sprite_Character')

          # Edit the ORIGINAL renderer in script 28 instead.
          # All ordinary monsters continue using four frame columns.
          width=<<'WIDTH'.rstrip
                  @slm_v272_cfg=nil
                  if @character.is_a?(Game_Event)
                    @slm_v272_cfg=SLMonster.config(
                      @character.instance_variable_get(:@map_id),
                      @character.instance_variable_get(:@id))
                  end
                  if @slm_v272_cfg
                    name=@character.character_name.to_s
                    suffix=name.sub(@slm_v272_cfg[:sprite],'')
                    columns=@slm_v272_cfg[:frames][suffix] || 4
                    @cw=bitmap.width/columns
                  else
                    @cw=bitmap.width/4
                  end
          WIDTH

          native=replace_once(
            native,
            '@cw = bitmap.width / 4',
            width,
            'native sprite frame width'
          )

          # The V271 failure came from trying to match sx/sy formulas
          # with an incorrect whitespace-ignoring regular expression.
          # Leave those native formulas unchanged.
          # Replace ONLY the source-rectangle assignment.
          rect_pattern=/self\.src_rect\.set\([ \t]*sx[ \t]*,[ \t]*sy[ \t]*,[ \t]*@cw[ \t]*,[ \t]*@ch[ \t]*\)/

          rectangle=<<'RECT'.rstrip
                  if @slm_v272_cfg
                    slm_info=SLMonster.frame_info(@character)
                    if slm_info &&
                       @character.character_name.to_s==@slm_v272_cfg[:sprite]+slm_info[0]
                      sx=slm_info[1]*@cw
                      sy=slm_info[2]*@ch
                    end
                  end
                  self.src_rect.set(sx, sy, @cw, @ch)
          RECT

          native=replace_once(
            native,
            rect_pattern,
            rectangle,
            'native sprite source rectangle'
          )

          # Cache only the command graph.
          # Preserve the original Interpreter lifecycle to avoid
          # carrying interpreter state into the next attack.
          runtime=replace_once(
            runtime,
            'attack_commands(c),',
            '(s[:native_commands] ||= attack_commands(c)),',
            'native attack command allocation'
          )

          # Update the boss state at most once per Graphics frame.
          tick_pattern=/s=state\(map_id,event_id\)\r?\n[ \t]*s\[:tick\]\+=1/

          tick=<<'TICK'.rstrip
              s=state(map_id,event_id)
              if defined?(Graphics) && Graphics.respond_to?(:frame_count)
                frame=Graphics.frame_count
                return if s[:last_update_frame]==frame
                s[:last_update_frame]=frame
              end
              s[:tick]+=1

              d=distance(ev)
              if d
                range=d[0]+d[1]
                if s[:engaged]
                  if range>=14
                    s[:engaged]=false
                    ev.instance_variable_set(:@move_type,0)
                  end
                elsif range<=10
                  s[:engaged]=true
                  ev.instance_variable_set(:@move_type,3)
                end
              end
          TICK

          runtime=replace_once(
            runtime,
            tick_pattern,
            tick,
            'single frame monster update'
          )

          # Replace, rather than wrap, the existing walking-state method.
          # Preserve its original 24-frame threshold.
          old_walk=<<'OLDWALK'
            def self.walking?(ev,s)
              moving=ev.respond_to?(:moving?) && ev.moving?
              s[:last_move_tick]=s[:tick] if moving
              moving || (s[:tick]-s[:last_move_tick]<=24)
            end
          OLDWALK

          new_walk=<<'NEWWALK'
            def self.walking?(ev,s)
              return s[:walk_cached] if s[:walk_cached_tick]==s[:tick]
              moving=ev.respond_to?(:moving?) && ev.moving?
              s[:last_move_tick]=s[:tick] if moving
              s[:walk_cached]=moving || (s[:tick]-s[:last_move_tick]<=24)
              s[:walk_cached_tick]=s[:tick]
              s[:walk_cached]
            end
          NEWWALK

          runtime=replace_once(
            runtime,
            old_walk.rstrip,
            new_walk.rstrip,
            'existing walking method'
          )

          raise 'Player attack input missing' unless
            runtime.include?('player_strike(map_id,event_id)')

          raise 'Native event update missing' unless
            runtime.include?('SLMonster.update_event(self) if c')

          raise 'Original native monster flag missing' unless
            runtime.include?('@monster=true if c')

          raise 'Native common event missing' unless
            runtime.include?('f.call(117,[57],1)')

          raise 'Physical/magic selection changed' unless
            runtime.include?('[26,26,0,2,0,6]')

          raise 'Drop inventory changed' unless
            runtime.scan(/\[:(item|weapon|armor),(\d+),(\d+)\]/)==drops

          raise 'Old passive damage restored' if
            runtime.include?('def self.player_attack(')

          runtime=runtime.gsub('slm_v267','slm_v272')

          File.write('build/monster-runtime.rb',runtime,encoding:'UTF-8')
          File.binwrite('build/native-sprite.rb',native)

          raise 'Monster runtime syntax invalid' unless
            system('ruby','-c','build/monster-runtime.rb')

          raise 'Original sprite syntax invalid' unless
            system('ruby','-c','build/native-sprite.rb')

          scripts[28][2]=Zlib::Deflate.deflate(native,9)
          scripts[index][0]=99827201
          scripts[index][1]='SLMonsterV272'
          scripts[index][2]=Zlib::Deflate.deflate(runtime,9)

          original_other.each do |i,raw|
            raise "Unrelated script changed #{i}" unless
              Marshal.dump(scripts[i])==raw
          end

          File.binwrite(map_path,Marshal.dump(map))
          File.binwrite(scripts_path,Marshal.dump(scripts))

          restored=Marshal.load(File.binread(scripts_path))

          raise 'Script inventory changed' unless
            restored.length==scripts.length

          raise 'Runtime serialization mismatch' unless
            restored[index][1]=='SLMonsterV272' &&
            Zlib::Inflate.inflate(restored[index][2]).b==runtime.b

          raise 'Native renderer serialization mismatch' unless
            Zlib::Inflate.inflate(restored[28][2]).b==native.b

          puts "PASS original script count #{scripts.length}"
          puts 'PASS extra Zenith sprite update wrapper removed'
          puts 'PASS original sprite renderer retained'
          puts 'PASS approved monster parameters and 20 drops preserved'
          puts 'PASS native Interpreter retained, commands cached'
          puts 'PASS one monster state update per Graphics frame'
          RUBY

          ruby -c build/patch.rb
          ruby build/patch.rb

      - name: V272 Verify removed duplication
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          monster=Path('build/monster-runtime.rb').read_text('utf-8')
          sprite=Path('build/native-sprite.rb').read_bytes()

          assert 'class Sprite_Character' not in monster
          assert monster.count('class Game_Event')==1
          assert monster.count('SLMonster.update_event(self) if c')==1
          assert monster.count('Interpreter.new(0)')==1
          assert monster.count('s[:native_commands] ||= attack_commands(c)')==1
          assert 'last_update_frame' in monster
          assert 'walk_cached_tick' in monster

          assert sprite.count(b'class Sprite_Character')==1
          assert sprite.count(b'SLMonster.frame_info(@character)')==1
          assert sprite.count(b'@slm_v272_cfg')>=2

          print('PASS no extra sprite update layer')
          print('PASS one native renderer')
          print('PASS one native attack Interpreter allocation site')
          print('PASS original monster flag preserved')
          PY

          ruby -c build/native-sprite.rb
          ruby -c build/monster-runtime.rb
          node --check site/knight/js/drive.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: V272 Refresh game resource hashes
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re

          root=Path('site')
          game=root/'knight/gameasync'
          mapping=game/'mapping.js'
          text=mapping.read_text('utf-8')

          targets=[
              game/'Data/Scripts.rxdata',
              game/'Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap025.rxdata'
          ]

          for path in targets:
              key='Data/'+path.name
              digest=hashlib.md5(path.read_bytes()).hexdigest()
              pattern='('+re.escape(key)+r'\?h=)[0-9a-f]{32}'
              text,count=re.subn(
                  pattern,
                  lambda match:match.group(1)+digest,
                  text
              )
              assert count==1,('Mapping hash mismatch',key,count)

          mapping.write_text(text,encoding='utf-8')

          loader=root/'knight/js/sl-assets-v229r115.js'
          js=loader.read_text('utf-8')
          assert js.count("var version='V267';")==1
          loader.write_text(
              js.replace("var version='V267';","var version='V272';"),
              encoding='utf-8'
          )

          for name in ('index.html','knight/index.html'):
              path=root/name
              html=path.read_text('utf-8')
              assert 'V267' in html,name
              html=html.replace('V267','V272').replace('v267','v272')
              path.write_text(html,encoding='utf-8')

          print('PASS V272 mapping hashes and cache identifiers')
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/dpad.js

      - name: V272 Verify all unrelated game data
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json

          root=Path('site')
          before=json.loads(Path('build/before.json').read_text('utf-8'))
          after={
              str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          pre='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          allowed={
              pre+'Map025.rxdata',
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html',
              'knight/index.html'
          }

          assert len(after)==5610
          assert set(before)==set(after)

          changed={key for key in before if before[key]!=after[key]}
          assert changed==allowed,(
              'Unexpected modifications',
              sorted(changed^allowed)
          )

          protected=(
              'knight/js/drive.js',
              'knight/js/dpad.js',
              pre+'Map016.rxdata',
              pre+'Map021.rxdata',
              pre+'CommonEvents.rxdata',
              'knight/assets/map-047-v241.pack'
          )

          for name in protected:
              assert before[name]==after[name],name

          for name in before:
              if name.startswith('knight/gameasync/Graphics/'):
                  assert before[name]==after[name],name

          print('PASS only Zenith event and the existing script archive changed')
          print('PASS original browser loading code unchanged')
          print('PASS Kurtz, Death Knight, original graphics and drops unchanged')
          PY

      - name: V272 Publish game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
