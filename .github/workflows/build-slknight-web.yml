          puts "BUFF_GRAPH_REBUILT ce3=#{iv(current[3],:list).length} ce4=#{iv(current[4],:list).length} ce8=#{iv(current[8],:list).length} ce10=#{iv(current[10],:list).length} ce33=#{iv(current[33],:list).length} ce68=#{iv(current[68],:list).length} ce107=#{iv(current[107],:list).length}"
