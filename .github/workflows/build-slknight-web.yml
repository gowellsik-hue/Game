          raise 'Hero must remain fully opaque' unless hero.opacity==255
          raise 'Wall mask source bitmap absent' unless front.bitmap.path.include?('SLTIW_45_C4_2')
          hero.x=100000;hero.y=100000
          instance.slti_update_wall_faces
