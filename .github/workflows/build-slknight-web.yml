
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V276.7.3
# BASE: successful V276.7.1, run 41790334490.
# BASE FILES: 5622 verified game files.
# CHANGE: native Sprite_Character 4/8-frame selection.
# WALK FIX: 32-frame torso tracking and common four-way pivot.
# LEGACY: original 4-frame monsters unchanged.
# NEW: SLZQWalk and SL8_ graphics use 8 frames.
# DIRECTIONS: original four directions only.
# RUNTIME: one native Sprite_Character.update.
# REMOVE: queen-only duplicate update registration.
# KEEP: combat, animations, drops and respawn.
# ROLLBACK: remove frame-alignment step to restore prior PNG.
# VERSION: V276.7.3; failed-build fixes do not bump version.

name: build-slknight-web.yml | V276.7.3 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Restore verified V276.7.1 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41790334490
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify original V276.7.1 baseline
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p site build
          test -s baseline/artifact.tar
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          root=Path('site')

          files={
            str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
            for p in root.rglob('*') if p.is_file()
          }

          assert len(files)==5622,(
            'V276.7.1 baseline inventory mismatch',
            len(files)
          )

          data=root/'knight/gameasync/Data'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          for name in (
            'Scripts.rxdata',
            pre+'Map025.rxdata',
            pre+'Map019.rxdata',
            pre+'CommonEvents.rxdata',
            pre+'Animations.rxdata'
          ):
            assert (data/name).is_file(),name

          assert (
            root/'knight/gameasync/Graphics/Characters/'
            'SLZQWalk.png'
          ).is_file()

          for name in ('index.html','knight/index.html'):
            assert 'V276.7.1' in (
              root/name
            ).read_text('utf-8')

          Path('build/original_sha256.json').write_text(
            json.dumps(files),encoding='utf-8'
          )

          print('PASS V276.7.1 baseline restored')
          print('PASS 5622 original files')
          PY

      - name: Align queen walk 32 frames to one four-way pivot
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install \
            --disable-pip-version-check pillow numpy

          cat > build/align_slzq_walk.py <<'SLZQ_ALIGN'
          from pathlib import Path
          from statistics import median
          from PIL import Image
          import numpy as np
          import json

          path=Path('site/knight/gameasync/Graphics/Characters/SLZQWalk.png')
          out_path=path
          report_path=Path('build/slzq_walk_alignment.json')
          original=Image.open(path).convert('RGBA')
          COLS=8
          ROWS=4
          assert original.size==(1344,576),('Unexpected original image',original.size)
          CW=original.width//COLS
          CH=original.height//ROWS
          assert (CW,CH)==(168,144)

          # Stable, textured abdomen regions examined on the original sheet.
          # These are used for relative frame tracking, never as separate
          # direction-specific output centers.
          CORE_ROIS=(
              (64,65,95,114),  # south-facing
              (90,80,129,120), # west-facing
              (39,81,77,123),  # east-facing
              (62,94,94,130),  # north-facing
          )
          TARGET_CENTER_X=84.0
          TARGET_BASELINE_Y=133.0
          SEARCH_RADIUS=20


          def luminance(frame):
              rgb=np.asarray(frame,dtype=np.uint8)[:,:,:3].astype(np.float32)
              return rgb[:,:,0]*0.299+rgb[:,:,1]*0.587+rgb[:,:,2]*0.114


          def registration(ref_frame,frame,roi):
              x1,y1,x2,y2=roi
              ref=luminance(ref_frame)[y1:y2,x1:x2]
              mask=(np.asarray(ref_frame)[y1:y2,x1:x2,3]>=100).astype(np.float32)
              assert mask.sum()>300,('Empty stable torso ROI',roi)
              pattern=ref*mask
              pattern_norm=float((ref*pattern).sum())
              target=luminance(frame)
              best=(-1.0,None,None)
              hh,ww=ref.shape
              for dy in range(-SEARCH_RADIUS,SEARCH_RADIUS+1):
                  yy=y1+dy
                  if yy<0 or yy+hh>CH:continue
                  for dx in range(-SEARCH_RADIUS,SEARCH_RADIUS+1):
                      xx=x1+dx
                      if xx<0 or xx+ww>CW:continue
                      candidate=target[yy:yy+hh,xx:xx+ww]
                      den=pattern_norm*float((candidate*candidate*mask).sum())
                      if den<=0:continue
                      similarity=float((pattern*candidate).sum())/(den**0.5)
                      if similarity>best[0]: best=(similarity,dx,dy)
              score,dx,dy=best
              assert score>=0.83,('Unable to register stable body',round(score,4))
              return dx,dy,score


          def bbox(frame):
              mask=frame.getchannel('A').point(lambda alpha:255 if alpha>=24 else 0)
              rect=mask.getbbox()
              assert rect is not None,'Empty frame'
              return rect


          def shift(frame,dx,dy):
              canvas=Image.new('RGBA',(CW,CH),(0,0,0,0))
              canvas.paste(frame,(int(dx),int(dy)))
              assert np.asarray(canvas.getchannel('A'),dtype=np.uint64).sum() == np.asarray(frame.getchannel('A'),dtype=np.uint64).sum(),('Clipped frame',dx,dy)
              return canvas


          def round_half_away(number):
              return int(np.sign(number)*np.floor(abs(number)+0.5))

          output=Image.new('RGBA',original.size,(0,0,0,0))
          report=[]
          changed=0
          for row in range(ROWS):
              frames=[original.crop((j*CW,row*CH,(j+1)*CW,(row+1)*CH)) for j in range(COLS)]
              moves=[registration(frames[0],frames[j],CORE_ROIS[row]) for j in range(COLS)]
              tracked=[]
              rects=[]
              for frame,(dx,dy,score) in zip(frames,moves):
                  corrected=shift(frame,-dx,-dy)
                  tracked.append(corrected)
                  rects.append(bbox(corrected))
              # Turn uses frame 1 while stationary. Anchor ALL four directions
              # to exactly the SAME frame-1 silhouette midpoint and foot baseline.
              # Other 7 poses retain the frame-1 body landmark, not limb centroid.
              visual_center_x=(rects[0][0]+rects[0][2]-1)/2
              foot_baseline_y=rects[0][3]-1
              global_dx=round_half_away(TARGET_CENTER_X-visual_center_x)
              global_dy=round_half_away(TARGET_BASELINE_Y-foot_baseline_y)
              aligned=[]
              rows=[]
              for j,(frame,(dx,dy,score)) in enumerate(zip(tracked,moves)):
                  corrected=shift(frame,global_dx,global_dy)
                  aligned.append(corrected)
                  output.paste(corrected,(j*CW,row*CH))
                  total_dx=-dx+global_dx
                  total_dy=-dy+global_dy
                  changed+=int(total_dx!=0 or total_dy!=0)
                  rows.append({'frame':j+1,'dx':total_dx,'dy':total_dy,'core_similarity':round(score,4)})
              final_rects=[bbox(f) for f in aligned]
              final_centers=[(r[0]+r[2]-1)/2 for r in final_rects]
              final_feet=[r[3]-1 for r in final_rects]
              pivot_x=final_centers[0]
              pivot_y=final_feet[0]
              assert abs(pivot_x-TARGET_CENTER_X)<=0.5,(row,pivot_x)
              assert abs(pivot_y-TARGET_BASELINE_Y)<=0.5,(row,pivot_y)
              # Validate that the tracked torso core has zero horizontal/vertical
              # offset from the first frame after alignment, including frame 8->1.
              tracker=[]
              shifted_roi=tuple((x+global_dx if i%2==0 else x+global_dy) for i,x in enumerate(CORE_ROIS[row]))
              for j in range(COLS):
                  ddx,ddy,score=registration(aligned[0],aligned[j],shifted_roi)
                  assert abs(ddx)<=1 and abs(ddy)<=1,('Torso drift after correction',row,j,ddx,ddy)
                  tracker.append((ddx,ddy))
              report.append({'direction':(2,4,6,8)[row],
                             'idle_center_before':round(visual_center_x,2),
                             'idle_center_after':round(pivot_x,2),
                             'idle_feet_before':round(foot_baseline_y,2),
                             'idle_feet_after':round(pivot_y,2),
                             'global_shift':[global_dx,global_dy],
                             'body_residual':tracker,
                             'frames':rows})
              print('Dir',(2,4,6,8)[row],'pivotX',visual_center_x,'->',pivot_x,
                    'floor',foot_baseline_y,'->',pivot_y,'global',(global_dx,global_dy),
                    'body residual',tracker)

          assert len(report)==4
          assert changed>0
          assert max(r['idle_center_after'] for r in report)-min(r['idle_center_after'] for r in report)<=0.5
          assert max(r['idle_feet_after'] for r in report)-min(r['idle_feet_after'] for r in report)==0.0
          output.save(out_path,optimize=True)
          json.dump({'version':'V276.7.3','corrected_frames':changed,'center_target':TARGET_CENTER_X,
                     'baseline_target':TARGET_BASELINE_Y,'directions':report},open(report_path,'w'),ensure_ascii=False,indent=2)
          print('PASS four-direction turn anchors and eight-frame torso registration')
          print('PASS 8-to-1 torso loop returns to the same origin')
          print('PASS RGBA pixel values retained; no alpha clipped')
          print('PASS V276.7.3 frame alignment completed')
          SLZQ_ALIGN

          python3 build/align_slzq_walk.py

      - name: V276.7.3 Native 4 and 8 frame branch
        shell: bash
        run: |
          set -euo pipefail

          cat > build/slwalk8.rb <<'SLWALK8_RUBY'
          require 'zlib'
          require 'fileutils'

          module RPG
            class Map;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class AudioFile;end
            class MoveRoute;end
            class MoveCommand;end
          end

          class Table
            def self._load(bytes)
              obj=allocate
              obj.instance_variable_set(:@raw,bytes)
              obj
            end

            def _dump(level=0)
              @raw
            end
          end

          class Tone
            def self._load(bytes)
              obj=allocate
              obj.instance_variable_set(:@raw,bytes)
              obj
            end

            def _dump(level=0)
              @raw
            end
          end

          class Color<Tone;end

          def check(value,message)
            raise message unless value
          end

          root='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          scripts_path=root+'Scripts.rxdata'
          map_path=root+pre+'Map025.rxdata'

          # ------------------------------------------
          # Native Sprite_Character.
          # No alias, no extra update, no timer.
          # ------------------------------------------

          script_before=File.binread(scripts_path)
          scripts=Marshal.load(script_before)

          check(
            scripts.length==137,
            'Original RGSS script count mismatch'
          )

          matches=scripts.each_index.select do |i|
            scripts[i][1]=='Sprite_Character'
          end

          check(
            matches.length==1,
            'Sprite_Character must occur once'
          )

          script_id=matches.first

          original=Zlib::Inflate.inflate(
            scripts[script_id][2]
          )

          code=original.dup

          # Find the existing native assignments.
          # Accept bitmap or charbitmap and CRLF.
          # Preserve the original expression.

          width_lines=code.lines.select do |line|
            line.match?(/^[ \t]*@cw[ \t]*=/) &&
            line.match?(/\bwidth[ \t]*\/[ \t]*4\b/)
          end

          frame_lines=code.lines.select do |line|
            line.match?(/^[ \t]*sx[ \t]*=/) &&
            line.include?('@character.pattern')
          end

          check(
            width_lines.length==1,
            'Native width lines: '+
            code.lines.grep(/@cw[ \t]*=/).
              map(&:strip).inspect
          )

          check(
            frame_lines.length==1,
            'Native frame lines: '+
            code.lines.grep(/sx[ \t]*=/).
              map(&:strip).inspect
          )

          eol=code.include?("\r\n") ? "\r\n" : "\n"

          width_line=width_lines.first
          frame_line=frame_lines.first

          indent=width_line[/\A[ \t]*/]
          frame_indent=frame_line[/\A[ \t]*/]

          # Replace only the original divisor 4.
          # The original bitmap source is retained.

          width_new=width_line.chomp.sub(
            /(\bwidth[ \t]*\/[ \t]*)4\b/,
            '\1(@sl_walk8 ? 8 : 4)'
          )

          check(
            width_new!=width_line.chomp,
            'Native width divisor not patched'
          )

          width_replacement=[
            indent+'@sl_walk8 = (',
            indent+'  @character.character_name == "SLZQWalk" ||',
            indent+'  @character.character_name[0,4] == "SL8_"',
            indent+')',
            width_new
          ].join(eol)+eol

          check(
            code.sub!(width_line,width_replacement),
            'Native width replacement failed'
          )

          # Replace only native frame selection.
          # Legacy pattern expression is preserved.

          original_frame=frame_line.strip.sub(
            /\Asx[ \t]*=[ \t]*/,
            ''
          )

          frame_replacement=[
            'sx = if @sl_walk8',
            '  attacking = (',
            '    @character.respond_to?(:sl_attack_active?) &&',
            '    @character.sl_attack_active?',
            '  )',
            '  if @character.moving? && !attacking',
            '    rx = @character.instance_variable_get(:@real_x)',
            '    ry = @character.instance_variable_get(:@real_y)',
            '    if rx && ry',
            '      remaining = (',
            '        (@character.x * 128 - rx).abs +',
            '        (@character.y * 128 - ry).abs',
            '      )',
            '      progress = 128 - remaining',
            '      progress = 0 if progress < 0',
            '      progress = 127 if progress > 127',
            '      (progress / 16) * @cw',
            '    else',
            '      0',
            '    end',
            '  else',
            '    0',
            '  end',
            'else',
            '  '+original_frame,
            'end'
          ].map{|line|frame_indent+line}.join(eol)+eol

          check(
            code.sub!(frame_line,frame_replacement),
            'Native frame replacement failed'
          )

          check(
            code!=original,
            'Native source was not changed'
          )

          check(
            code.include?('@sl_walk8') &&
            code.include?('@character.pattern'),
            'Original and new selectors missing'
          )

          # Only the existing Sprite_Character
          # script contents are replaced.
          # No extra script entry is added.

          scripts[script_id][2]=Zlib::Deflate.deflate(code)

          File.binwrite(
            scripts_path,
            Marshal.dump(scripts)
          )

          saved=Marshal.load(File.binread(scripts_path))
          original_scripts=Marshal.load(script_before)

          check(
            saved.length==137,
            'Patched RGSS count mismatch'
          )

          saved.each_with_index do |row,i|
            next if i==script_id

            check(
              row==original_scripts[i],
              'Unrelated RGSS script changed'
            )
          end

          check(
            Zlib::Inflate.inflate(
              saved[script_id][2]
            )==code,
            'Patched native source mismatch'
          )

          # ------------------------------------------
          # Remove queen-only runtime installer.
          # Keep all original 22 spawn commands.
          # ------------------------------------------

          map_before=File.binread(map_path)
          map=Marshal.load(map_before)

          events=map.instance_variable_get(:@events)
          queen=events.fetch(29)
          pages=queen.instance_variable_get(:@pages)

          check(
            pages.length==5,
            'Queen functional pages changed'
          )

          page0=pages[0]
          commands=page0.instance_variable_get(:@list)

          check(
            commands.length==23,
            'Original queen spawn count mismatch'
          )

          old_hook=commands.first

          check(
            old_hook.instance_variable_get(:@code)==355,
            'Queen runtime installer not found'
          )

          old_text=old_hook.instance_variable_get(
            :@parameters
          )[0].to_s

          check(
            old_text.include?('class Sprite_Character') &&
            old_text.include?('slzq_v2767_original_update'),
            'Unexpected queen runtime installer'
          )

          commands.shift

          check(
            commands.length==22,
            'Original 22 spawn commands missing'
          )

          page0.instance_variable_set(:@list,commands)

          File.binwrite(
            map_path,
            Marshal.dump(map)
          )

          verify=Marshal.load(File.binread(map_path))

          saved_pages=verify.instance_variable_get(
            :@events
          ).fetch(29).instance_variable_get(:@pages)

          check(
            saved_pages[0].instance_variable_get(
              :@list
            ).length==22,
            'Duplicate queen runtime remains'
          )

          check(
            saved_pages.map{|p|
              p.instance_variable_get(:@list).length
            }==[22,1,217,2,20],
            'Original queen event pages damaged'
          )

          puts 'PASS native 4/8-frame branch'
          puts 'PASS original width expression preserved'
          puts 'PASS original Sprite_Character.update retained'
          puts 'PASS no additional update method'
          puts 'PASS legacy 4-frame pattern preserved'
          puts 'PASS queen-only duplicate renderer removed'
          puts 'PASS original queen combat pages preserved'

          SLWALK8_RUBY

          ruby -c build/slwalk8.rb
          ruby build/slwalk8.rb

          # ------------------------------------------
          # Update changed hashes and display version.
          # ------------------------------------------

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,json

          root=Path('site')
          game=root/'knight/gameasync'
          data=game/'Data'

          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          mapping=game/'mapping.js'
          content=mapping.read_text('utf-8')

          for name in (
            'Scripts.rxdata',
            pre+'Map025.rxdata'
          ):
            path=data/name
            digest=hashlib.md5(path.read_bytes()).hexdigest()

            token=(
              re.escape('Data/'+name)+
              r'\?h=[0-9a-f]{32}'
            )

            content,count=re.subn(
              token,
              'Data/'+name+'?h='+digest,
              content
            )

            assert count==1,(
              'Expected one original mapping',
              name,count
            )

          # Refresh the corrected walk PNG cache hash.
          walk=(
            game/'Graphics/Characters/SLZQWalk.png'
          )

          walk_digest=hashlib.md5(
            walk.read_bytes()
          ).hexdigest()

          walk_token=(
            re.escape(
              'Graphics/Characters/SLZQWalk.png'
            )+r'\?h=[0-9a-f]{32}'
          )

          content,count=re.subn(
            walk_token,
            'Graphics/Characters/SLZQWalk.png'
            '?h='+walk_digest,
            content
          )

          assert count==1,(
            'Queen walk image mapping not unique',
            count
          )

          mapping.write_text(
            content,encoding='utf-8'
          )

          loader=root/'knight/js/sl-assets-v229r115.js'
          text=loader.read_text('utf-8')

          old="var version='V276.7.1';"
          new="var version='V276.7.3';"

          assert text.count(old)==1

          loader.write_text(
            text.replace(old,new),
            encoding='utf-8'
          )

          for name in (
            'index.html',
            'knight/index.html'
          ):
            path=root/name
            text=path.read_text('utf-8')

            assert 'V276.7.1' in text,name

            text=(
              text.replace('V276.7.1','V276.7.3').
                   replace('?v=v276.7.1','?v=v276.7.3')
            )

            path.write_text(
              text,encoding='utf-8'
            )

          original_hashes=json.loads(
            Path('build/original_sha256.json').
              read_text('utf-8')
          )

          current={
            str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
            for p in root.rglob('*') if p.is_file()
          }

          assert len(current)==5622

          assert set(current)==set(original_hashes),(
            'Unexpected files added or removed'
          )

          changed={
            name for name in original_hashes
            if current[name]!=original_hashes[name]
          }

          expected={
            'knight/gameasync/Data/Scripts.rxdata',
            'knight/gameasync/Data/'+pre+'Map025.rxdata',
            'knight/gameasync/Graphics/Characters/SLZQWalk.png',
            'knight/gameasync/mapping.js',
            'knight/js/sl-assets-v229r115.js',
            'index.html',
            'knight/index.html'
          }

          assert changed==expected,(
            'Unexpected original modification',
            changed^expected
          )

          print('PASS seven expected generated files changed')
          print('PASS 5615 remaining files unchanged')
          print('PASS corrected queen walk PNG mapping')
          print('PASS V276.7.3 version retained')
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Publish verified draft game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
