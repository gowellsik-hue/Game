
name: V229 | Reviewed Unified Knight Speed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-slknight-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Restore V229R3 artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          repository: gowellsik-hue/Game
          run-id: 38865231880
          name: github-pages
          github-token: ${{ github.token }}
          path: previous

      - name: Restore complete game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          if test -s previous/artifact.tar; then
            tar -xf previous/artifact.tar -C site
          else
            python3 - <<'PY_FETCH'
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request,urlopen
          from concurrent.futures import ThreadPoolExecutor,as_completed
          import json,re,hashlib,time
          base='https://gowellsik-hue.github.io/Game/'
          root=Path('site')
          fixed=('index.html','COPYING-mkxp-web.txt','manifest.webmanifest','mkxp.js','mkxp.wasm','js/drive.js','js/dpad.js','js/localforage.min.js')
          def get(url):
            for attempt in range(5):
              try:
                with urlopen(Request(url,headers={'User-Agent':'SLKnight-Spirit-Pursuit','Accept-Encoding':'identity'}),timeout=60) as response:
                  return response.read()
              except Exception:
                if attempt==4:raise
                time.sleep(attempt+1)
          files={'index.html':(base+'index.html',None)}
          for game in ('knight','elf'):
            for rel in fixed:
              files[game+'/'+rel]=(base+game+'/'+quote(rel,safe='/'),None)
            name=game+'/gameasync/mapping.js'
            blob=get(base+name+'?recover=spirit-r4')
            p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(blob)
            body=blob.decode('utf-8').split('var mappingArray = ',1)[1].split('];',1)[0]+']'
            for _,asset in json.loads(re.sub(r',\s*\]$',']',body)):
              rel,sep,md5=asset.partition('?h=')
              if '.' not in Path(rel).name:continue
              if rel.startswith('/') or '..' in Path(rel).parts:raise RuntimeError('Unsafe path '+rel)
              name=game+'/gameasync/'+rel
              if name in files:raise RuntimeError('Duplicate '+name)
              files[name]=(base+game+'/gameasync/'+quote(rel,safe='/')+('?h='+md5 if sep else ''),md5 if sep else None)
          if len(files)!=5354:raise RuntimeError('Unexpected file count '+str(len(files)))
          def fetch(item):
            name,(url,md5)=item
            data=get(url)
            if md5 and Path(name).name not in ('mapping.js','bitmap-map.js') and hashlib.md5(data).hexdigest()!=md5:
              raise RuntimeError('Wrong MD5 '+name)
            path=root/name;path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data)
          with ThreadPoolExecutor(max_workers=12) as pool:
            for task in as_completed([pool.submit(fetch,item) for item in files.items() if not (root/item[0]).is_file()]):task.result()
          actual={str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}
          if actual!=set(files):raise RuntimeError('Incomplete recovery')
          print('SPIRIT_RESTORED_5354_FILES')
          PY_FETCH
          fi

      - name: Validate exact V229R3 or V229R4 base
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_SOURCE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if len(files)!=5354:raise SystemExit('Unexpected file inventory')
          target='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap035.rxdata'
          baseline={
            'knight/index.html':'93e8fef889d16bd376dc5b4adb730d73f732eeaa38de6d34d67d186eb86d4ba4',
            'knight/gameasync/mapping.js':'0717f281157314632455974b0ccf8105046e764c8212081cca01cf1744d029ff',
            target:'ee13af3b9981ab9bde19cc938d288869b4a34b0d12365b69c3a5121c83107356'
          }
          final={
            'knight/index.html':'53822d033c0a50747393a5ef0b6ebd36c9227ac15c7f130c476ad0da07fe422b',
            'knight/gameasync/mapping.js':'9d0d03d377657c064d7f2544caaf92a6f985ae94cd6d56e3f1de1539804bc32b',
            target:'35f5fe74ec30d71614d1fc276d4044c816acf666758355b89a56cf8e71b6c27c'
          }
          keep={
            'knight/gameasync/Data/Scripts.rxdata':'9e3eaae707471a9ee395e5ede40b43bc8462f2be137bc9f3ffca484598062630',
            'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata':'bbf5ec438a88f032780f9464a862ca4728f1f34afa1b74053ca7c6a9243ca3ed'
          }
          if any(files.get(k)!=v for k,v in keep.items()):raise SystemExit('Unexpected script or common event version')
          version='V229R3' if all(files.get(k)==v for k,v in baseline.items()) else 'V229R4' if all(files.get(k)==v for k,v in final.items()) else None
          if version is None:raise SystemExit('Wrong V229 source; no modification performed')
          Path('/tmp/spirit_source_version').write_text(version)
          Path('/tmp/spirit_source_hashes.json').write_text(json.dumps(files))
          print('SPIRIT_VERIFIED_SOURCE',version)
          PY_SOURCE

      - name: Preserve chase after first local detection
        shell: bash
        run: |
          set -euo pipefail
          if test "$(cat /tmp/spirit_source_version)" = V229R3; then
            ruby - site/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap035.rxdata <<'RUBY_PATCH'
          require 'digest'
          class Table
            def self._load(data);new(data);end
            def initialize(data);@data=data;end
            def _dump(depth);@data;end
          end
          module RPG
            class Map;end
            class Event;end
            class MoveRoute;end
            class MoveCommand;end
            class EventCommand;end
            class AudioFile;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
          end
          path=ARGV.fetch(0)
          original=File.binread(path)
          expected='ee13af3b9981ab9bde19cc938d288869b4a34b0d12365b69c3a5121c83107356'
          raise 'Unexpected Map035' unless Digest::SHA256.hexdigest(original)==expected
          map=Marshal.load(original)
          events=map.instance_variable_get(:@events)
          ids=[2]+(4..10).to_a+(12..17).to_a
          raise 'Wrong monster inventory' unless events.size==18 && ids.size==14
          ids.each do |id|
            pages=events.fetch(id).instance_variable_get(:@pages)
            raise "Wrong event pages #{id}" unless pages.size==4
            page=pages[0]
            route=page.instance_variable_get(:@move_route).instance_variable_get(:@list)
            command=route[0]
            radius=id==16 ? 5 : 7
            old="d=(self.x-$game_player.x).abs+(self.y-$game_player.y).abs; d<#{radius} ? move_toward_player : move_random"
            raise "Wrong current AI #{id}" unless page.instance_variable_get(:@move_type)==3 && command.instance_variable_get(:@code)==45 && command.instance_variable_get(:@parameters)==[old]
            replacement="d=(self.x-$game_player.x).abs+(self.y-$game_player.y).abs; @sl_spirit_aggro=true if d<#{radius}; @sl_spirit_aggro ? move_toward_player : move_random"
            command.instance_variable_set(:@parameters,[replacement])
            death=pages[3]
            cond=death.instance_variable_get(:@condition)
            raise "Wrong death page #{id}" unless cond.instance_variable_get(:@self_switch_valid)==true && death.instance_variable_get(:@trigger)==4
            list=death.instance_variable_get(:@list)
            raise "Wrong death commands #{id}" unless list.size>5 && list[0].instance_variable_get(:@code)!=355
            reset=RPG::EventCommand.allocate
            reset.instance_variable_set(:@code,355)
            reset.instance_variable_set(:@indent,0)
            reset.instance_variable_set(:@parameters,["$game_map.events[#{id}].instance_variable_set(:@sl_spirit_aggro,nil); true"])
            list.unshift(reset)
          end
          File.binwrite(path,Marshal.dump(map))
          print 'SPIRIT_14_STICKY_AGGRO_PATCHED_SHA256='+Digest::SHA256.file(path).hexdigest+"\n"
          RUBY_PATCH
            python3 - <<'PY_CACHE'
          from pathlib import Path
          import hashlib,re
          root=Path('site/knight')
          rel='Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap035.rxdata'
          md5=hashlib.md5((root/'gameasync'/rel).read_bytes()).hexdigest()
          mp=root/'gameasync/mapping.js'
          text=mp.read_text(encoding='utf-8')
          text,n=re.subn(re.escape(rel+'?h=')+r'[0-9a-f]{32}',lambda _:rel+'?h='+md5,text)
          if n!=1:raise SystemExit('Missing or duplicate Map035 mapping')
          mp.write_text(text,encoding='utf-8')
          index=root/'index.html'
          html=index.read_text(encoding='utf-8')
          old='gameasync/mapping.js?v=v229r3'
          if html.count(old)!=1:raise SystemExit('Wrong original cache version')
          index.write_text(html.replace(old,'gameasync/mapping.js?v=v229r4'),encoding='utf-8')
          PY_CACHE
          else
            echo SPIRIT_PURSUIT_ALREADY_PATCHED
          fi

      - name: Validate local detection chase persistence and reset
        shell: bash
        run: |
          set -euo pipefail
          ruby - <<'RUBY_TEST'
          class Table
            def self._load(data);new(data);end
            def initialize(data);@data=data;end
            def _dump(depth);@data;end
          end
          module RPG
            class Map;end
            class Event;end
            class MoveRoute;end
            class MoveCommand;end
            class EventCommand;end
            class AudioFile;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
          end
          $game_player=Struct.new(:x,:y).new(0,0)
          $game_map=Struct.new(:events).new({})
          class AggroProbe
            attr_accessor :x,:y,:moves
            def initialize;@x=40;@y=0;@moves=[];end
            def move_random;@moves << :random;end
            def move_toward_player;@moves << :chase;end
          end
          path='site/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap035.rxdata'
          map=Marshal.load(File.binread(path))
          events=map.instance_variable_get(:@events)
          ids=[2]+(4..10).to_a+(12..17).to_a
          raise 'Wrong monster count' unless events.size==18 && ids.size==14
          ids.each do |id|
            pages=events.fetch(id).instance_variable_get(:@pages)
            radius=id==16 ? 5 : 7
            route=pages[0].instance_variable_get(:@move_route).instance_variable_get(:@list)
            script=route.fetch(0).instance_variable_get(:@parameters).fetch(0)
            mob=AggroProbe.new
            $game_map.events[id]=mob
            mob.instance_eval(script)
            raise "Remote activation #{id}" unless mob.moves[-1]==:random
            mob.x=radius-1
            mob.instance_eval(script)
            raise "No initial detection #{id}" unless mob.moves[-1]==:chase
            mob.x=40
            mob.instance_eval(script)
            raise "Chase stopped #{id}" unless mob.moves[-1]==:chase
            death=pages[3].instance_variable_get(:@list).fetch(0)
            raise "Missing death reset #{id}" unless death.instance_variable_get(:@code)==355
            result=eval(death.instance_variable_get(:@parameters).fetch(0))
            raise "Death command halted #{id}" unless result==true
            mob.instance_eval(script)
            raise "Aggro not reset #{id}" unless mob.moves[-1]==:random
          end
          puts 'PASS_14_MONSTERS_DETECT_CHASE_DEATH_RESET'
          RUBY_TEST
          python3 - <<'PY_FILES'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before=json.loads(Path('/tmp/spirit_source_hashes.json').read_text())
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if len(after)!=5354 or set(after)!=set(before):raise SystemExit('Game inventory changed')
          target='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap035.rxdata'
          expected={
            'knight/index.html':'53822d033c0a50747393a5ef0b6ebd36c9227ac15c7f130c476ad0da07fe422b',
            'knight/gameasync/mapping.js':'9d0d03d377657c064d7f2544caaf92a6f985ae94cd6d56e3f1de1539804bc32b',
            target:'35f5fe74ec30d71614d1fc276d4044c816acf666758355b89a56cf8e71b6c27c'
          }
          if any(after.get(k)!=v for k,v in expected.items()):raise SystemExit('Unexpected V229R4 file hashes')
          changed={k for k in after if after[k]!=before[k]}
          version=Path('/tmp/spirit_source_version').read_text()
          if (version=='V229R3' and changed!=set(expected)) or (version=='V229R4' and changed):
            raise SystemExit('Wrong change scope '+str(changed))
          import re
          rel='Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap035.rxdata'
          mp=(root/'knight/gameasync/mapping.js').read_text(encoding='utf-8')
          md5=hashlib.md5((root/'knight/gameasync'/rel).read_bytes()).hexdigest()
          if mp.count(rel+'?h='+md5)!=1:raise SystemExit('Wrong Map035 MD5 mapping')
          if (root/'knight/index.html').read_text(encoding='utf-8').count('gameasync/mapping.js?v=v229r4')!=1:
            raise SystemExit('Wrong index cache marker')
          print('PASS_SPIRIT_ONLY_3_FILES_CHANGED_OR_REUSED',version)
          PY_FILES

      - name: Upload verified game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
