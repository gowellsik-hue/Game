
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V276.6
# TRUE RESTORE: V241 successful run 41293648580; do NOT use V276.2-V276.5
# DEATH: Copy original Map016 EV8 pages 0-4 and native CE691, CE105 chain
# NO OVERWRITE: Original event page 2 command sequence [122,117,0] preserved
# TEST: Map025 EV29 / HP52 / movement2 / attack 5+20=25
# REWARDS: 20 approved Zenith items, native EXP43212 and Adena64800..151200
# VISUALS: Native DK sprites copied unchanged; no extra runtime or image hooks
# SAFETY: Map016 and original 1061 CEs and Scripts.rxdata byte-identical
# NOTE: Restore HP 5200 only after testing; separate sprite review HTML unchanged

name: build-slknight-web.yml | V276.6 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: V276.6 Restore original successful V241, not any patched V276 build
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41293648580
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V276.6 Verify clean V241 source and inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s baseline/artifact.tar
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          assert len(before)==5603,('Not the original V241 site',len(before))
          assert 'V241' in (root/'knight/index.html').read_text('utf-8')
          assert (root/'knight/gameasync/Data/Scripts.rxdata').is_file()
          assert (root/'knight/assets/map-047-v241.pack').is_file()
          assert not any((root/'knight/gameasync/Graphics/Characters'/f'SLDK2F{i:02d}.png').exists()
                         for i in (1,2,3))
          Path('build/before.json').write_text(json.dumps(before),encoding='utf-8')
          print('PASS true V241 5603 source files; no existing Zenith overlay')
          PY

      - name: V276.6 Independently clone all five original pages and native death flow
        shell: bash
        run: |
          set -euo pipefail
          cat > build/clone_native.rb <<'V2766_NATIVE'
          # encoding: UTF-8
          # V276.6 - TRUE CLEAN REBUILD, source V241 (not any V276.* build).
          # Preserve the complete five-page native Death Knight death event and CE691 flow.
          require 'json'
          require 'zlib'
          require 'digest'
          require 'fileutils'
          module RPG
            class Map;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class CommonEvent;end
            class AudioFile;end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end
          class Table
            def self._load(data);o=allocate;o.instance_variable_set(:@raw,data);o;end
            def _dump(level=0);@raw;end
          end
          class Tone
            def self._load(data);o=allocate;o.instance_variable_set(:@raw,data);o;end
            def _dump(level=0);@raw;end
          end
          class Color<Tone;end

          def iv(obj,k);obj.instance_variable_get('@'+k.to_s);end
          def put(obj,k,v);obj.instance_variable_set('@'+k.to_s,v);end
          def ck(ok,msg);raise msg unless ok;end

          def command(code,params=[],indent=0)
            x=RPG::EventCommand.allocate
            put(x,:code,code);put(x,:parameters,params);put(x,:indent,indent);x
          end

          def clean(s);s.to_s.dup.force_encoding('UTF-8').scrub;end
          DATA='site/knight/gameasync/Data/'
          PRE='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          map16_path=DATA+PRE+'Map016.rxdata'
          map25_path=DATA+PRE+'Map025.rxdata'
          common_path=DATA+PRE+'CommonEvents.rxdata'
          scripts_path=DATA+'Scripts.rxdata'
          original_script_bytes=File.binread(scripts_path)
          original_map16_bytes=File.binread(map16_path)
          map16=Marshal.load(original_map16_bytes)
          map25=Marshal.load(File.binread(map25_path))
          common=Marshal.load(File.binread(common_path))
          old_common=common.map{|c|c.nil? ? nil : Marshal.dump(c)}
          old_events=iv(map25,:events).transform_values{|v|Marshal.dump(v)}
          source=iv(map16,:events).fetch(8)
          ck(clean(iv(source,:name)).include?('데스나이트'),'Map016 EV8 is not the original Death Knight')
          ck(!iv(map25,:events).key?(29),'Map025 EV29 must be absent on clean V241')
          ck(common.length==1061,'V241 native CE inventory changed')
          ck(iv(source,:pages).length==5,'Native source must have five original pages')
          original_death=iv(iv(source,:pages)[2],:list)
          ck(original_death.map{|c|iv(c,:code)}==[122,117,0],'Wrong original death commands')
          ck(iv(original_death[1],:parameters)==[691],'Original death does not call CE691')
          ck(iv(iv(iv(source,:pages)[3],:condition),:self_switch_valid),'Original self-switch A death page missing')
          ck(iv(iv(iv(source,:pages)[3],:condition),:self_switch_ch)=='A','Wrong original death self-switch')

          # The only native source CEs necessary for a faithful isolated boss.
          # 31 is native Hellfire (8 images at 1-frame intervals), 103 pays Adena.
          ids=[31,57,103,179,691,901]
          ce_map={}
          ids.each{|id|ce_map[id]=common.length+ce_map.length}
          cloned={}
          ids.each do |id|
            src=common.fetch(id)
            copy=Marshal.load(Marshal.dump(src))
            put(copy,:id,ce_map[id])
            put(copy,:name,'[ZQ2F] '+clean(iv(src,:name)))
            if iv(copy,:trigger).to_i>0
              sid=iv(copy,:switch_id)
              ck([133,135].include?(sid),'Unexpected original CE trigger switch')
              put(copy,:switch_id,sid==133 ? 5991 : 5992)
            end
            cloned[id]=copy
          end

          # The existing three native sprite sheets are copied, not regenerated.
          # Their names are private; the image contents are still the original DK.
          art={'데스나이트'=>'SLDK2F01',
               '데스나이트-좌표'=>'SLDK2F02',
               '데스나이트-사망'=>'SLDK2F03'}
          asset='site/knight/gameasync/Graphics/Characters/'
          art.each do |old,new_name|
            src=asset+old+'.png';dst=asset+new_name+'.png'
            ck(File.file?(src),'Missing original sprite '+old)
            ck(!File.exist?(dst),'Sprite already installed '+new_name)
            FileUtils.cp(src,dst)
            ck(Digest::SHA256.file(src).hexdigest==Digest::SHA256.file(dst).hexdigest,'Sprite bytes differ')
          end

          def remap_route(route,art)
            return unless route.is_a?(RPG::MoveRoute)
            (iv(route,:list)||[]).each do |m|
              next unless iv(m,:code)==41
              p=iv(m,:parameters);key=clean(p[0]);p[0]=art[key] if art[key]
            end
          end

          def remap_script_text(original,art)
            v=original.dup.b
            v=v.gsub('$game_variables[1980]'.b,'$game_variables[4988]'.b)
            v=v.gsub('$game_switches[133]'.b,'$game_switches[5991]'.b)
            v=v.gsub('$game_switches[135]'.b,'$game_switches[5992]'.b)
            v=v.gsub('$game_map.events[8]'.b,'$game_map.events[29]'.b)
            v=v.gsub('SLMonsterAttackContext.register(133,'.b,'SLMonsterAttackContext.register(5991,'.b)
            v=v.gsub('SLMonsterAttackContext.register(5991,$game_map.map_id,8)'.b,
                     'SLMonsterAttackContext.register(5991,$game_map.map_id,29)'.b)
            v=v.gsub('SLMonsterAttackContext.start(133,'.b,'SLMonsterAttackContext.start(5991,'.b)
            # Important: a boss name must NEVER be replaced by a sprite file name.
            if v.include?('$m.drawMHP'.b)
              ck(v.include?('"데스나이트"'.b),'Original HP bar name not found')
              v=v.gsub('"데스나이트"'.b,'"제니스 퀸"'.b)
              ck(v.include?(',4000,2)'.b),'Original HP bar maximum not found')
              v=v.gsub(',4000,2)'.b,',52,2)'.b)
            else
              art.each do |old,new_name|
                v=v.gsub(('"'+old+'"').b,('"'+new_name+'"').b)
                v=v.gsub(("'"+old+"'").b,("'"+new_name+"'").b)
              end
            end
            v
          end

          def remap_list(list,ce_map,art)
            list.each do |c|
              code=iv(c,:code);p=iv(c,:parameters)
              next unless p.is_a?(Array)
              case code
              when 117
                p[0]=ce_map.fetch(p[0],p[0])
              when 121
                if p[0]==p[1]
                  if p[0]==133;p[0]=5991;p[1]=5991;end
                  if p[0]==135;p[0]=5992;p[1]=5992;end
                end
              when 122
                if p[0]==1980 && p[1]==1980;p[0]=4988;p[1]=4988;end
                if p[0]==1987 && p[1]==1987;p[0]=4989;p[1]=4989;end
                p[4]=4988 if p[3]==1 && p[4]==1980
              when 111
                if p[0]==0
                  p[1]=5991 if p[1]==133
                  p[1]=5992 if p[1]==135
                elsif p[0]==1
                  p[1]=4988 if p[1]==1980
                  p[4]=4988 if p[3]==1 && p[4]==1980
                end
              when 355,655
                p[0]=remap_script_text(p[0],art) if p[0].is_a?(String)
              when 209
                p[0]=29 if p[0]==8
                remap_route(p[1],art)
              when 207
                p[0]=29 if p[0]==8
              end
            end
          end

          # Apply ID/name routing only to the private combat and Hellfire CEs.
          [31,57,179,901].each{|id|remap_list(iv(cloned.fetch(id),:list),ce_map,art)}

          # Deep-copy all five native pages. Do not write a replacement death event.
          boss=Marshal.load(Marshal.dump(source))
          pages=iv(boss,:pages)
          pages.each do |page|
            cond=iv(page,:condition)
            if iv(cond,:variable_valid) && iv(cond,:variable_id)==1980
              put(cond,:variable_id,4988)
            end
            if iv(cond,:switch1_valid)
              sid=iv(cond,:switch1_id)
              put(cond,:switch1_id,5991) if sid==133
              put(cond,:switch1_id,5992) if sid==135
            end
            graphic=iv(page,:graphic)
            old=clean(iv(graphic,:character_name))
            put(graphic,:character_name,art[old]) if art[old]
            remap_route(iv(page,:move_route),art)
            remap_list(iv(page,:list)||[],ce_map,art)
          end

          # Remove only the original colosseum wave requirement from the active page.
          active_cond=iv(pages[1],:condition)
          [:switch1_valid,:switch2_valid,:variable_valid,:self_switch_valid].each do |flag|
            put(active_cond,flag,false)
          end
          # Dedicated test HP; source V241 is 4000. The live death page is NOT overwritten.
          dead_cond=iv(pages[2],:condition)
          ck(iv(dead_cond,:variable_id)==4988 && iv(dead_cond,:variable_value)==4000,'Native death variable changed')
          put(dead_cond,:variable_value,52)
          # Original death post-processing page 3 uses self switch A; do not disable it.
          ck(iv(iv(pages[3],:condition),:self_switch_valid) && iv(iv(pages[3],:condition),:self_switch_ch)=='A', 'Native death page3 was lost')
          # Only the unrelated colosseum wave reset page 4 is gated off on Map025.
          put(iv(pages[4],:condition),:switch1_valid,true)
          put(iv(pages[4],:condition),:switch1_id,5993)

          # Move speed 2, frequency remains native 6. Death page original speed=2.
          [0,1].each{|idx|put(pages[idx],:move_speed,2)}
          ck(iv(pages[2],:move_speed)==2,'Original death movement speed changed')
          ck(iv(pages[1],:move_frequency)==6,'Original movement frequency changed')

          # Normal/strong magic damage are the approved values, with native combat formula.
          attack=iv(cloned.fetch(901),:list)
          ck(attack.any?{|c|iv(c,:code)==122 && iv(c,:parameters)==[26,26,0,2,0,6]},'Native 6:1 attack selector missing')
          count35=count70=0
          attack.each do |c|
            next unless iv(c,:code)==122
            p=iv(c,:parameters)
            next unless p.is_a?(Array) && p[0,4]==[26,26,0,0]
            if p[4]==35;p[4]=50;count35+=1;end
            if p[4]==70;p[4]=100;count70+=1;end
          end
          ck(count35==1 && count70==1,'Native physical damage points absent')
          ck([150,300].all?{|n|attack.any?{|c|iv(c,:code)==122 && iv(c,:parameters)==[26,26,0,0,n]}},'Native magic attack missing')
          ck(attack.any?{|c|iv(c,:code)==311 && iv(c,:parameters)==[1,1,0,80,false]},'Native magic 80 floor lost')

          # Native attack timing 5+20=25, not a custom update hook.
          cycle=iv(cloned.fetch(179),:list)
          ck(cycle.map{|c|iv(c,:code)}==[355,106,117,106,121,0],'Original CE179 graph changed')
          ck(iv(cycle[1],:parameters)==[5] && iv(cycle[3],:parameters)==[7], 'Original timing source changed')
          put(cycle[3],:parameters,[20])
          start=iv(cycle[0],:parameters)[0]
          ck(start.include?('SLMonsterAttackContext.start(5991,'.b),'Private attack switch not isolated')
          ck(start.end_with?(',20)'.b),'Original attack motion start window not found')
          put(cycle[0],:parameters,[start.sub(/,20\)\z/n,',25)'.b)])
          ck(iv(cycle[2],:parameters)==[ce_map[901]],'Native CE901 route missing')

          # Original CE691 still runs $m.End -> source death FX CE105 -> self-switch A.
          # Only reward values are changed INSIDE its independently cloned CE.
          reward=iv(cloned.fetch(691),:list)
          ck(reward.length==245,'Original CE691 command count differs')
          ck(iv(reward[0],:code)==355 && iv(reward[0],:parameters)==['$m.End'],'Native death HP bar cleanup missing')
          ck(iv(reward[4],:code)==117 && iv(reward[4],:parameters)==[103],'Original gold CE103 call missing')
          ck(iv(reward[241],:code)==117 && iv(reward[241],:parameters)==[105],'Original death FX CE105 missing')
          ck(iv(reward[243],:code)==123 && iv(reward[243],:parameters)==['A',0],'Native self-switch A death progression missing')
          # remap the original CE103 gold call to an independent clone; keep all native messages
          put(reward[4],:parameters,[ce_map[103]])
          # Native experience command315 is kept. Substitute only the three var1926 values.
          ck(iv(reward[5],:parameters)==[1926,1926,0,0,3026], 'Original EXP assignment changed')
          put(reward[5],:parameters,[1926,1926,0,0,43212])
          [6,7].each{|idx|ck(iv(reward[idx],:code)==122,'Original EXP adjustment missing');put(reward[idx],:parameters,[1926,1926,1,0,0])}
          ck(iv(reward[8],:code)==315 && iv(reward[8],:parameters)==[1,0,1,1926],'Native actor EXP payout missing')
          # Replace only the old Death Knight reward-table command 242 with Zenith's 20 rolls.
          drops=[[:item,35,30],[:item,34,20],[:item,33,100],[:item,37,100],
                 [:armor,169,50],[:item,116,3],[:item,32,100],[:item,38,100],
                 [:armor,289,30],[:weapon,123,30],[:weapon,41,50],[:item,3,200],
                 [:weapon,1,50],[:armor,72,50],[:item,2,250],[:armor,303,2],
                 [:item,43,100],[:armor,280,30],[:armor,12,50],[:armor,492,3]]
          ck(iv(reward[242],:code)==355 && iv(reward[242],:parameters)[0].include?('slv437_messages='),'Original loot command missing')
          loot="#{drops.inspect}.each do |kind,id,chance|\n" +
           "  next unless rand(1000)<chance\n" +
           "  case kind\n" +
           "  when :item then $game_party.gain_item(id,1)\n" +
           "  when :weapon then $game_party.gain_weapon(id,1)\n" +
           "  when :armor then $game_party.gain_armor(id,1)\n" +
           "  end\nend"
          put(reward[242],:parameters,[loot])
          # The old 'Arka spell acquired' message is for an unrelated loot item.
          # Neutralize this empty legacy reward announcement, preserving the command graph.
          ck(iv(reward[13],:code)==355 && iv(reward[14],:code)==655,'Original legacy reward message commands changed')
          put(reward[13],:parameters,['nil'])
          put(reward[14],:parameters,['nil'])
          # Independent CE103 native 7-command gold calculation and gain_gold via code125.
          gold=iv(cloned.fetch(103),:list)
          ck(gold.length==7 && iv(gold[0],:parameters)==[333,333,0,2,200,400], 'Original gold source changed')
          put(gold[0],:parameters,[333,333,0,2,64800,151200])
          ck(iv(gold[1],:code)==122 && iv(gold[2],:code)==125,'Original native gold commands changed')
          put(gold[1],:parameters,[333,333,1,0,0])

          # A native map event (page3), not new engine code, controls corpse and re-entry.
          # Preserve original death animation/wait 200, original relocate and Erase Event.
          post=iv(pages[3],:list)
          ck(post.map{|c|iv(c,:code)}==[122,135,106,202,116,0],'Original death post-page graph changed')
          ck(iv(post[2],:parameters)==[200],'Original 200-frame death wait lost')

          # Native Map025 spawn is derived from the same nearby Tower 2F event as V276.
          ref=iv(map25,:events).fetch(11)
          sx=iv(ref,:x);sy=iv(ref,:y)
          width=iv(map25,:width);height=iv(map25,:height)
          occupied=iv(map25,:events).values.map{|ev|[iv(ev,:x),iv(ev,:y)]}
          spawn=nil
          (1..10).each do |radius|
            break if spawn
            (-radius..radius).each do |dy|
              break if spawn
              (-radius..radius).each do |dx|
                x=sx+dx;y=sy+dy
                next unless [dx.abs,dy.abs].max==radius && x>=2 && y>=2 && x<width-2 && y<height-2
                next if occupied.include?([x,y])
                spawn=[x,y];break
              end
            end
          end
          ck(spawn!=nil,'Could not locate native Tower 2F spawn')
          ck(iv(post[3],:parameters)==[0,0,39,99,0],'Source DK respawn location changed')
          put(post[3],:parameters,[0,0,spawn[0],spawn[1],0])
          # After the original death animation finishes, clear only private boss state
          # before the original Erase Event. Otherwise HP52 would retrigger on re-entry.
          post.insert(4,command(122,[4988,4988,0,0,0]),command(123,['A',1]))
          ck(post.map{|c|iv(c,:code)}==[122,135,106,202,122,123,116,0],'Death sequence mutated unexpectedly')

          put(boss,:name,'제니스 퀸')
          put(boss,:sl_level,60)
          put(boss,:id,29)
          put(boss,:x,spawn[0]);put(boss,:y,spawn[1])

          # Commit only private CEs + one Map025 event, NEVER original V241 resources.
          ids.each{|id|common<<cloned.fetch(id)}
          iv(map25,:events)[29]=boss
          ck(iv(pages[2],:list).map{|c|iv(c,:code)}==[122,117,0],'Native death page was replaced')
          ck(iv(pages[2],:list)[1].instance_variable_get('@parameters')==[ce_map[691]],'Isolated native death CE link missing')
          ck(iv(iv(pages[3],:condition),:self_switch_valid),'Original corpse self-switch disabled')
          ck(File.binread(map16_path)==original_map16_bytes,'Original Death Knight mutated')
          ck(File.binread(scripts_path)==original_script_bytes,'Native RGSS scripts mutated')
          old_common.each_with_index do |bin,i|
            current=common[i];ck((current.nil? ? nil : Marshal.dump(current))==bin,"Original CE#{i} mutated")
          end
          old_events.each do |eid,bin|
            ck(Marshal.dump(iv(map25,:events).fetch(eid))==bin,"Unrelated Map025 EV#{eid} mutated")
          end
          File.binwrite(map25_path,Marshal.dump(map25))
          File.binwrite(common_path,Marshal.dump(common))
          File.write('build/zenith-report.json',JSON.pretty_generate({
           version:'V276.6',base:'V241',original_pages:5,death_original_commands:[122,117,0],
           death_ce_native:691,death_ce_cloned:ce_map[691],
           death_fx_native:105,post_death_self_switch:'A',
           spawn:spawn,level:60,test_hp:52,restore_hp:5200,move_speed:2,
           move_frequency:6,attack_start:5,attack_recovery:20,attack_cycle:25,
           physical:[50,100],magic:[150,300],magic_floor:80,accuracy:9999,
           experience:43212,adena:[64800,151200],drops:drops,
           cloned_ce_map:ce_map,graphics:art,game_engine_changed:false
          }),encoding:'UTF-8')
          puts "PASS true V241 rebuilt; independent Map025 EV29 at #{spawn.inspect}"
          puts "PASS five original pages; native death 122->CE#{ce_map[691]}->FX105->self A->original page3"
          puts 'PASS name 제니스 퀸; HP52; move2; attack5+20=25; original combat calculations'
          puts 'PASS existing 20 Zenith drops and native EXP/Adena, no generic reward override'
          puts 'PASS Map016, Scripts.rxdata, all 1061 original CEs, other Map025 events unchanged'

          V2766_NATIVE
          ruby -c build/clone_native.rb
          ruby build/clone_native.rb

      - name: V276.6 Verify original death, name, 20 rewards, motion and combat
        shell: bash
        run: |
          set -euo pipefail
          cat > build/test_native.rb <<'V2766_VERIFY'
          # encoding: UTF-8
          require 'json'
          require 'digest'
          module RPG
           class Map;end;class Event
            class Page;class Condition;end;class Graphic;end;end
           end
           class CommonEvent;end;class AudioFile;end;class EventCommand;end;class MoveRoute;end;class MoveCommand;end
           class Item;end;class Weapon;end;class Armor;end
          end
          class Table;def self._load(s);o=allocate;o.instance_variable_set(:@raw,s);o;end;def _dump(l=0);@raw;end;end
          class Tone;def self._load(s);o=allocate;o.instance_variable_set(:@raw,s);o;end;def _dump(l=0);@raw;end;end
          class Color<Tone;end
          def iv(o,k);o.instance_variable_get('@'+k.to_s);end
          def ck(ok,msg);raise msg unless ok;end
          root='site/knight/gameasync/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          data=root+'Data/'
          source=Marshal.load(File.binread(data+pre+'Map016.rxdata'))
          map=Marshal.load(File.binread(data+pre+'Map025.rxdata'))
          common=Marshal.load(File.binread(data+pre+'CommonEvents.rxdata'))
          report=JSON.parse(File.read('build/zenith-report.json'))
          ids={};report.fetch('cloned_ce_map').each{|k,v|ids[k.to_i]=v}
          source_death=iv(iv(source,:events).fetch(8),:pages)[2]
          boss=iv(map,:events).fetch(29)
          pages=iv(boss,:pages)
          ck(iv(boss,:name)=='제니스 퀸','Wrong event name')
          ck(iv(boss,:sl_level)==60,'Wrong metadata level')
          ck(pages.length==5,'Not five native pages')
          ck(pages[0..2].all?{|p|iv(p,:move_speed)==2},'Move speed not set2')
          ck(iv(pages[1],:move_frequency)==6,'Move frequency changed')
          ck(iv(iv(pages[2],:condition),:variable_id)==4988 && iv(iv(pages[2],:condition),:variable_value)==52,'HP condition incorrect')
          ck(iv(pages[2],:list).map{|c|iv(c,:code)}==iv(source_death,:list).map{|c|iv(c,:code)},'Native death command structure overwritten')
          ck(iv(iv(pages[2],:list)[1],:parameters)==[ids[691]],'Native death event does not call isolated CE691')
          ck(iv(iv(pages[3],:condition),:self_switch_valid) && iv(iv(pages[3],:condition),:self_switch_ch)=='A','Original death A page disabled')
          ck(iv(pages[3],:list).map{|c|iv(c,:code)}==[122,135,106,202,122,123,116,0],'Native death cleanup sequence changed')
          ck(iv(iv(pages[3],:list)[2],:parameters)==[200],'Original death post-wait missing')
          ck(iv(iv(pages[3],:list)[4],:parameters)==[4988,4988,0,0,0],'Missing HP reset after death')
          ck(iv(iv(pages[3],:list)[5],:parameters)==['A',1],'Missing A off after death')
          ck(iv(iv(pages[3],:list)[6],:code)==116,'Missing native Erase Event after death')

          hud=iv(pages[1],:list).select{|c|iv(c,:code)==355 && iv(c,:parameters)[0].to_s.b.include?('$m.drawMHP'.b)}
          ck(hud.length==1,'Wrong HP bar count')
          ck(iv(hud[0],:parameters)[0].dup.force_encoding('UTF-8').scrub.include?('"제니스 퀸"'),'Sprite name still shown instead of boss name')
          ck(iv(hud[0],:parameters)[0].include?(',52,2)'), 'HP bar max unchanged')

          atk=iv(common.fetch(ids[901]),:list)
          ck(atk.any?{|c|iv(c,:code)==122&&iv(c,:parameters)==[26,26,0,2,0,6]},'Native 6:1 selector missing')
          ck([50,100,150,300].all?{|n|atk.any?{|c|iv(c,:code)==122&&iv(c,:parameters)==[26,26,0,0,n]}},'Damage endpoints changed')
          ck(atk.any?{|c|iv(c,:code)==311&&iv(c,:parameters)==[1,1,0,80,false]},'Native magic minimum missing')
          ck(atk.any?{|c|iv(c,:code)==117&&iv(c,:parameters)==[ids[57]]},'Native hit CE route missing')
          cycle=iv(common.fetch(ids[179]),:list)
          ck(iv(cycle[1],:parameters)==[5]&&iv(cycle[3],:parameters)==[20],'Attack 5+20 missing')
          ck(iv(cycle[2],:parameters)==[ids[901]],'Attack CE route wrong')
          ck(iv(cycle[0],:parameters)[0].include?('SLMonsterAttackContext.start(5991,'.b),'Attack switch uses Death Knight ID')
          ck(iv(cycle[0],:parameters)[0].end_with?(',25)'.b),'Attack animation frame 25 missing')
          reg=iv(pages[1],:list).select{|c|iv(c,:code)==355 && iv(c,:parameters)[0].to_s.include?('SLMonsterAttackContext.register')}
          ck(reg.length==17, 'Wrong native attack registration count')
          ck(reg.all?{|c|iv(c,:parameters)[0].include?('register(5991,'.b)&&iv(c,:parameters)[0].include?('29)'.b)},'Native attack registration not isolated')

          # CE31 original Hellfire: 8 consecutive pictures, each held one game frame.
          hell=iv(common.fetch(ids[31]),:list)
          ck(hell.count{|c|iv(c,:code)==231}==8 && hell.count{|c|iv(c,:code)==106&&iv(c,:parameters)==[1]}==8,'Hellfire original eight frames missing')
          ck(iv(hell[-2],:parameters)==[5992,5992,1],'Isolated magic switch not reset')

          reward=iv(common.fetch(ids[691]),:list)
          ck(reward.map{|c|iv(c,:code)}==iv(common.fetch(691),:list).map{|c|iv(c,:code)},'CE691 native death command graph changed')
          ck(iv(reward[0],:parameters)==['$m.End'],'Native HUD cleanup lost')
          ck(iv(reward[241],:parameters)==[105],'Native source death FX CE105 lost')
          ck(iv(reward[243],:parameters)==['A',0],'Native A on after death missing')
          ck(iv(reward[4],:parameters)==[ids[103]],'Gold CE clone not called')
          ck(iv(reward[5],:parameters)==[1926,1926,0,0,43212],'Experience 43212 missing')
          ck(iv(reward[6],:parameters)==[1926,1926,1,0,0],'Original EXP add-on still active')
          ck(iv(reward[7],:parameters)==[1926,1926,1,0,0],'Original EXP extra still active')
          ck(iv(reward[8],:parameters)==[1,0,1,1926],'Native EXP actor command missing')
          gold=iv(common.fetch(ids[103]),:list)
          ck(iv(gold[0],:parameters)==[333,333,0,2,64800,151200],'Adena range incorrect')
          ck(iv(gold[2],:code)==125&&iv(gold[2],:parameters)==[0,1,333],'Native gain gold missing')

          loot=iv(reward[242],:parameters)[0]
          ck(loot.is_a?(String)&&loot.include?('gain_item')&&loot.include?('gain_weapon')&&loot.include?('gain_armor'),'Zenith loot script lost')
          File.binwrite('build/zenith-native-loot.rb',loot)
          ck(system('ruby','-c','build/zenith-native-loot.rb'),'Loot Ruby syntax failed')
          class DummyParty
           attr_reader :drops
           def initialize;@drops=[];end
           def gain_item(id,n);@drops<<[:item,id,n];end
           def gain_weapon(id,n);@drops<<[:weapon,id,n];end
           def gain_armor(id,n);@drops<<[:armor,id,n];end
          end
          $game_party=DummyParty.new
          module Kernel
           alias zenith_native_original_rand rand
           def rand(n=nil);0;end
          end
          eval(loot,TOPLEVEL_BINDING,'ZenithTestLoot',1)
          expected=[[:item,35,1],[:item,34,1],[:item,33,1],[:item,37,1],
          [:armor,169,1],[:item,116,1],[:item,32,1],[:item,38,1],
          [:armor,289,1],[:weapon,123,1],[:weapon,41,1],[:item,3,1],
          [:weapon,1,1],[:armor,72,1],[:item,2,1],[:armor,303,1],
          [:item,43,1],[:armor,280,1],[:armor,12,1],[:armor,492,1]]
          ck($game_party.drops==expected,'Actual reward gain_* calls differ')
          {:item=>'Items',:weapon=>'Weapons',:armor=>'Armors'}.each do |kind,table|
           db=Marshal.load(File.binread(data+pre+table+'.rxdata'))
           expected.select{|x|x[0]==kind}.each do |_,id,_|
            ck(db[id]!=nil && iv(db[id],:name).to_s!='',"Missing #{kind} record #{id}")
           end
          end

          # Check original V241 remains intact and original three sprites byte identical.
          source_root=ENV['V241_SOURCE_ROOT']
          if source_root
           native=source_root+'/knight/gameasync/Data/'
           ck(Digest::SHA256.file(native+pre+'Map016.rxdata').hexdigest==Digest::SHA256.file(data+pre+'Map016.rxdata').hexdigest,'Source Death Knight altered')
           ck(Digest::SHA256.file(native+'Scripts.rxdata').hexdigest==Digest::SHA256.file(data+'Scripts.rxdata').hexdigest,'Native engine modified')
           orig_ce=Marshal.load(File.binread(native+pre+'CommonEvents.rxdata'))
           ck(common.length==orig_ce.length+6,'Wrong number of cloned CE')
           orig_ce.each_with_index{|ce,id|ck(Marshal.dump(ce)==Marshal.dump(common[id]),"Original common event #{id} altered")}
           source_map25=Marshal.load(File.binread(native+pre+'Map025.rxdata'))
           iv(source_map25,:events).each{|id,event|ck(Marshal.dump(event)==Marshal.dump(iv(map,:events).fetch(id)),"Unrelated tower monster #{id} altered")}
           {'데스나이트'=>'SLDK2F01','데스나이트-좌표'=>'SLDK2F02','데스나이트-사망'=>'SLDK2F03'}.each do |old,new_name|
            dir=root+'Graphics/Characters/'
            ck(Digest::SHA256.file(dir+old+'.png').hexdigest==Digest::SHA256.file(dir+new_name+'.png').hexdigest,"Cloned sprite #{new_name} differs")
           end
          end
          puts 'PASS true V241 native death page [122,117,0] and full cloned CE691 graph'
          puts 'PASS full original death FX105, self-switch A ON, 200-frame corpse page, HP reset & erase'
          puts 'PASS HP bar boss name 제니스 퀸, native attack registration 17 routes, HP52'
          puts 'PASS 8-frame native Hellfire, 5+20 attack, move2, 6:1 physical/magic, original calculations'
          puts 'PASS native EXP, gold, 20 actual drops and their DB IDs'
          puts 'PASS original V241 engine, maps, original CEs and source sprites preserved'

          V2766_VERIFY
          ruby -c build/test_native.rb
          ruby build/test_native.rb

      - name: V276.6 Register only three native sprite copies and data hashes
        shell: bash
        run: |
          set -euo pipefail
          cat > build/update_mapping.py <<'V2766_MAPPING'
          from pathlib import Path
          import hashlib,re
          root=Path('site');game=root/'knight/gameasync';mapping=game/'mapping.js'
          s=mapping.read_text(encoding='utf-8')
          anchor='];\n\nvar mapping = {}'
          assert s.count(anchor)==1,('Original V241 mapping anchor changed',s.count(anchor))
          entries=[]
          for idx in (1,2,3):
              name=f'SLDK2F{idx:02d}'
              path=game/'Graphics/Characters'/(name+'.png')
              assert path.is_file(),name
              h=hashlib.md5(path.read_bytes()).hexdigest()
              entries.append(f'["graphics/characters/{name.lower()}", "Graphics/Characters/{name}.png?h={h}"],')
          s=s.replace(anchor,'\n'+'\n'.join(entries)+'\n'+anchor)
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          for filename in (pre+'Map025.rxdata',pre+'CommonEvents.rxdata'):
              p=game/'Data'/filename
              h=hashlib.md5(p.read_bytes()).hexdigest()
              pattern='('+re.escape('Data/'+filename)+r'\?h=)[0-9a-f]{32}'
              s,count=re.subn(pattern,lambda m:m.group(1)+h,s)
              assert count==1,(filename,count)
          mapping.write_text(s,encoding='utf-8')
          loader=root/'knight/js/sl-assets-v229r115.js'
          s=loader.read_text(encoding='utf-8')
          assert s.count("var version='V241';")==1,'Original V241 loader label changed'
          loader.write_text(s.replace("var version='V241';","var version='V276.6';"),encoding='utf-8')
          for filename in ('index.html','knight/index.html'):
              p=root/filename;s=p.read_text(encoding='utf-8')
              assert 'V241' in s,filename
              p.write_text(s.replace('V241','V276.6').replace('?v=v241','?v=v276.6'),encoding='utf-8')
          print('PASS three isolated original DK sprite URL hashes, two native RXData hashes, V276.6 version')

          V2766_MAPPING
          python3 build/update_mapping.py
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: V276.6 Verify source rollback and strict protected-file whitelist
        shell: bash
        run: |
          set -euo pipefail
          cat > build/protect.py <<'V2766_PROTECT'
          from pathlib import Path
          import json,hashlib
          root=Path('site')
          before=json.loads(Path('build/before.json').read_text(encoding='utf-8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          pre='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          allowed={pre+'Map025.rxdata',pre+'CommonEvents.rxdata',
                   'knight/gameasync/mapping.js','knight/js/sl-assets-v229r115.js',
                   'index.html','knight/index.html'}
          added={'knight/gameasync/Graphics/Characters/SLDK2F%02d.png'%i for i in (1,2,3)}
          changed={p for p in before if before[p]!=after.get(p)}
          assert len(before)==5603,('Unexpected original V241 site',len(before))
          assert len(after)==5606,('Unexpected final file count',len(after))
          assert set(after)-set(before)==added,('Other files unexpectedly added',sorted((set(after)-set(before))^added))
          assert not (set(before)-set(after)),('An original file was deleted',sorted(set(before)-set(after)))
          assert changed==allowed,('An unapproved native file was changed',sorted(changed^allowed))
          for name in before:
              if name.startswith('knight/gameasync/Graphics/'):
                  assert before[name]==after[name],('Original image modified',name)
              if name.startswith(pre+'Map') and name!=pre+'Map025.rxdata':
                  assert before[name]==after[name],('Other map modified',name)
          for name in ('knight/gameasync/Data/Scripts.rxdata',pre+'Map016.rxdata',
                       'knight/js/drive.js','knight/js/dpad.js','knight/assets/map-047-v241.pack'):
              assert before[name]==after[name],('Original engine or source changed',name)
          for old,new in (('데스나이트','SLDK2F01'),('데스나이트-좌표','SLDK2F02'),('데스나이트-사망','SLDK2F03')):
              source='knight/gameasync/Graphics/Characters/'+old+'.png'
              target='knight/gameasync/Graphics/Characters/'+new+'.png'
              assert before[source]==after[target],('DK sprite clone not identical',new)
          print('PASS 5603 V241 source files preserved, 6 approved modified files, exactly 3 DK sprite copies')
          print('PASS original Death Knight, all original common events and Scripts.rxdata protected')

          V2766_PROTECT
          python3 build/protect.py

      - name: V276.6 Publish restored native Zenith game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
