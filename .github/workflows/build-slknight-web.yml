name: build-slknight-web.yml | V4.5 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Restore V4.4 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45778773928
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify V4.4 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          game=root/'knight/gameasync'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(before)==6019,len(before)
          assert (root/'knight/js/sl-assets-v229r115.js').read_bytes().count(b"var version='V4.4';")==1
          assert (game/'Data'/(pre+'MonsterStats.rxdata')).is_file()
          maps=sorted(p.name for p in (game/'Data').glob(pre+'Map[0-9][0-9][0-9].rxdata'))
          assert len(maps)==46,len(maps)
          names=['Scripts.rxdata',pre+'CommonEvents.rxdata']+maps
          Path('/tmp/sl45-before.json').write_text(json.dumps(before,sort_keys=True),'utf8')
          Path('/tmp/sl45-md5.json').write_text(json.dumps({n:hashlib.md5((game/'Data'/n).read_bytes()).hexdigest() for n in names}),'utf8')
          print('PASS V4.4 baseline',len(before))
          PYTHON

      - name: Retire legacy healer and connect three native companion HUDs
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/sl45-patch.rb <<'RUBY'
          # encoding: UTF-8
          require 'zlib'
          require 'json'
          module RPG
            %w[Map MapInfo Event EventCommand MoveRoute MoveCommand AudioFile CommonEvent Actor System].each{|n|const_set(n,::Class.new)}
            Event.const_set(:Page,::Class.new)
            Event::Page.const_set(:Condition,::Class.new)
            Event::Page.const_set(:Graphic,::Class.new)
            System.const_set(:Words,::Class.new)
            System.const_set(:TestBattler,::Class.new)
          end
          %w[Table Tone Color].each do |n|
            Object.const_set(n,Class.new do
              def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
              def _dump(depth);@raw;end
            end)
          end
          def iv(o,k);o.instance_variable_get(k);end
          def utf(s);s.to_s.dup.force_encoding('UTF-8').scrub;end
          def check(ok,msg);raise msg unless ok;end
          def once(s,a,b,label)
            check(s.scan(a).size==1,"#{label}: #{s.scan(a).size} anchors")
            s.sub(a){b}
          end
          def edit(rows,name)
            matches=rows.select{|r|r && utf(r[1])==name}
            check(matches.size==1,name)
            r=matches.first
            src=Zlib::Inflate.inflate(r[2]).force_encoding('UTF-8')
            check(src.valid_encoding?,name)
            crlf=src.include?("\r\n")
            out=yield(src.gsub("\r\n","\n"))
            RubyVM::InstructionSequence.compile(out)
            out=out.gsub("\n","\r\n") if crlf
            check(src!=out,name)
            r[2]=Zlib::Deflate.deflate(out)
          end
          def event_code(c);iv(c,:@code);end
          def params(c);iv(c,:@parameters);end
          def blank_command(c)
            x=Marshal.load(Marshal.dump(c))
            x.instance_variable_set(:@code,0)
            x.instance_variable_set(:@indent,0)
            x.instance_variable_set(:@parameters,[])
            x
          end
          root=ENV.fetch('SL45_DATA','site/knight/gameasync/Data')
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          path=lambda{|n|File.join(root,pre+n+'.rxdata')}
          sp=File.join(root,'Scripts.rxdata')
          rows=Marshal.load(File.binread(sp))
          old_rows=rows.map{|r|Marshal.dump(r)}
          edit(rows,'MOG - S HUD') do |s|
            a='@actor = (@sl_actor_id == 3 ? $game_actors[3] : $game_party.actors[0])'
            b='@actor = (@sl_actor_id == 1 ? $game_party.actors[0] : $game_actors[@sl_actor_id])'
            check(s.scan(a).size==3,'Native HUD actor routes')
            s=s.gsub(a,b)
            a=s.index('    if @sl_actor_id == 3 && $game_switches[185]')
            b=a && s.index('    #HP Border',a)
            check(a && b,'Old healer HUD migration block')
            old=s[a...b]
            check(old.include?('@sl_healer_v117_table_fixed') && !old.include?('def '),'Old migration scope')
            s[a...b]=''
            old='(@sl_actor_id == 3 && (!$game_switches[185] || @sl_healer_event == nil || @sl_healer_event.transparent))'
            new='(@sl_actor_id != 1 && (!$game_switches[1997+@sl_actor_id] || @sl_healer_event == nil || @sl_healer_event.transparent || @sl_healer_event.character_name == ""))'
            s=once(s,old,new,'HUD visibility')
            a=s.index("  def hud_pos_update\n")
            b=a && s.index('    @hp_sprite.x = ',a)
            check(a && b,'Native HUD position')
            old=s[a...b]
            check(old.include?("obj.name == '[ID힐러 마법사]'") && old.include?('@sl_healer_map_id'),'Old event lookup')
            s[a...b]=<<'SRC'
            def hud_pos_update
              target = $game_player
              if @sl_actor_id != 1
                if !@sl_healer_events.equal?($game_map.events)
                  @sl_healer_events = $game_map.events
                  @sl_healer_event = @sl_healer_events.values.find do |e|
                    obj=e.instance_variable_get(:@event)
                    page=obj && obj.pages[0]
                    page && obj.name.to_s.start_with?('동료 ') && page.condition.switch1_valid && page.condition.switch1_id==1997+@sl_actor_id
                  end
                end
                return unless @sl_healer_event
                target = @sl_healer_event
              end
          SRC
            old='(@sl_actor_id == 3 ? target.screen_y : target.screen_z)'
            check(s.scan(old).size==4,'Native HUD vertical position count')
            s=s.gsub(old,'(@sl_actor_id != 1 ? target.screen_y : target.screen_z)')
            old='      @healer_shud = S_Hud.new(@s_viewport,3)'
            s=once(s,old,'      @companion_shuds = {}','HUD creation')
            s=once(s,"      @healer_shud.dispose\n      @healer_shud = nil", "      @companion_shuds.each_value{|hud|hud.dispose}\n      @companion_shuds.clear",'HUD disposal')
            s=once(s,'    @healer_shud.update',<<'SRC'.chomp,'HUD update')
              for id in 4..6
                actor=$game_actors[id]
                if actor.instance_variable_get(:@sl43_hired) && $game_party.actors.include?(actor)
                  @companion_shuds[id] ||= S_Hud.new(@s_viewport,id)
                  @companion_shuds[id].update
                elsif @companion_shuds[id]
                  @companion_shuds.delete(id).dispose
                end
              end
          SRC
            # S_Hud already guards gameover with actor_id == 1. Preserve all drawing routines.
            check(s.include?('if @sl_actor_id == 1 && @actor.hp == 0'),'Player-only gameover guard')
            check(!s.include?('@healer_shud') && !s.include?('$game_actors[3]') && !s.include?("'[ID힐러 마법사]'"),'Old healer HUD references')
            s
          end
          edit(rows,'Game_Party') do |s|
            s=once(s,'    for i in $data_system.party_members',"    for i in $data_system.party_members\n      next if i == 3",'Initial party')
            old='    @actors = new_actors.reject{|a| (4..9).include?(a.id) && !(a.id <= 6 && a.instance_variable_get(:@sl43_hired))}'
            new='    @actors = new_actors.reject{|a| a.id == 3 || ((4..9).include?(a.id) && !(a.id <= 6 && a.instance_variable_get(:@sl43_hired)))}'
            cleanup="    if new_actors.any?{|a|a.id==3}\n      [94,95,185,188,382,386,778,781,811].each{|id|$game_switches[id]=false}\n    end\n"
            s=once(s,old,cleanup+new+"\n    @items.delete(117)\n    $game_switches[185]=false\n    $game_switches[781]=false",'Saved party')
            s=once(s,'  def add_actor(actor_id)',"  def add_actor(actor_id)\n    return if actor_id == 3",'Retired actor recruitment')
            s=once(s,'  def item_number(item_id)',"  def item_number(item_id)\n    return 0 if item_id == 117",'Retired command item')
            once(s,'  def gain_item(item_id, n)',"  def gain_item(item_id, n)\n    return if item_id == 117",'Retired command item gain')
          end
          edit(rows,'Game_Switches') do |s|
            s=once(s,'  def [](switch_id)',"  def [](switch_id)\n    return false if switch_id == 185 || switch_id == 781",'Retired healer activation')
            once(s,'  def []=(switch_id, value)',"  def []=(switch_id, value)\n    value = false if switch_id == 185 || switch_id == 781",'Retired healer activation writes')
          end
          changed=rows.each_index.select{|i|Marshal.dump(rows[i])!=old_rows[i]}.map{|i|utf(rows[i][1])}.sort
          check(changed==['Game_Party','Game_Switches','MOG - S HUD'].sort,"Unexpected scripts #{changed.inspect}")

          maps=Dir.glob(path.call('Map[0-9][0-9][0-9]')).sort
          check(maps.size==46,'Map count')
          slots=0;legacy=0;old_pages=0;m29=nil
          map_updates={}
          new_gates=0
          map_audit=[]
          maps.each do |f|
            m=Marshal.load(File.binread(f));mid=f[/Map(\d{3})\.rxdata$/,1].to_i
            events=iv(m,:@events)
            original_events=events.transform_values{|e|Marshal.dump(e)}
            original_fields=m.instance_variables.reject{|k|k==:@events}.to_h{|k|[k,Marshal.dump(iv(m,k))]}
            retired_ids=[]
            changed_ids=[]
            followers=events.values.select{|e|utf(iv(e,:@name)).start_with?('동료 ')}
            switches=followers.map do |e|
              pgs=iv(e,:@pages);check(pgs.size==1,"Map #{mid} companion page count")
              c=iv(pgs[0],:@condition);check(iv(c,:@switch1_valid),"Map #{mid} companion switch")
              iv(c,:@switch1_id)
            end
            check(switches.sort==(2001..2006).to_a,"Map #{mid} slot mapping")
            slots+=switches.count{|i|(2001..2003).include?(i)}
            events.each_value do |e|
              next unless utf(iv(e,:@name))=='[ID힐러 마법사]'
              legacy+=1
              eid=iv(e,:@id)
              check(events[eid].equal?(e),"Map #{mid} legacy event ID")
              retired_ids<<eid
              iv(e,:@pages).each_with_index do |pg,pi|
                c=iv(pg,:@condition)
                old_pages+=1
                gated=(iv(c,:@switch1_valid)&&[185,781].include?(iv(c,:@switch1_id))) || (iv(c,:@switch2_valid)&&[185,781].include?(iv(c,:@switch2_id)))
                next if gated
                old_page=Marshal.load(Marshal.dump(pg))
                old_c=iv(old_page,:@condition)
                if !iv(c,:@switch1_valid) || iv(c,:@switch2_valid)
                  c.instance_variable_set(:@switch1_valid,true)
                  c.instance_variable_set(:@switch1_id,185)
                  old_c.instance_variable_set(:@switch1_valid,true)
                  old_c.instance_variable_set(:@switch1_id,185)
                else
                  c.instance_variable_set(:@switch2_valid,true)
                  c.instance_variable_set(:@switch2_id,185)
                  old_c.instance_variable_set(:@switch2_valid,true)
                  old_c.instance_variable_set(:@switch2_id,185)
                end
                check(Marshal.dump(old_page)==Marshal.dump(pg),"Map #{mid} EV#{eid} page #{pi}: unrelated field changed")
                changed_ids<<eid
                new_gates+=1
                map_audit<<[mid,eid,pi]
              end
              check(iv(e,:@pages).all?{|pg|c=iv(pg,:@condition);(iv(c,:@switch1_valid)&&[185,781].include?(iv(c,:@switch1_id))) || (iv(c,:@switch2_valid)&&[185,781].include?(iv(c,:@switch2_id)))},"Map #{mid} retirement incomplete")
            end
            changed_ids.uniq!
            actual=events.keys.select{|id|Marshal.dump(events[id])!=original_events.fetch(id)}.sort
            check(actual==changed_ids.sort && (actual-retired_ids).empty?,"Map #{mid} unrelated event change")
            check(m.instance_variables.reject{|k|k==:@events}.to_h{|k|[k,Marshal.dump(iv(m,k))]}==original_fields,"Map #{mid} unrelated map data")
            map_updates[f]=m unless changed_ids.empty?
            m29=m if mid==29
          end
          check(slots==138 && legacy>0,'Map slot audit')
          check(m29,'Recruiter map missing')
          events=iv(m29,:@events);recruit=events.fetch(49)
          check(utf(iv(recruit,:@name))=='[ID고용사]' && [iv(recruit,:@x),iv(recruit,:@y)]==[72,48],'Recruiter identity')
          map_before=events.transform_values{|e|Marshal.dump(e)}
          pgs=iv(recruit,:@pages);check(pgs.size==2,'Recruiter pages')
          pgs.each do |pg|
            list=iv(pg,:@list)
            old=' + ($game_party.actors.include?($game_actors[3]) ? 1 : 0)'
            hits=0;manage=0
            list.each do |c|
              next unless [111,355].include?(event_code(c))
              p=params(c)
              ix=event_code(c)==111 ? 1 : 0
              next unless p[ix].is_a?(String)
              s=utf(p[ix])
              if s.include?(old)
                check(s.scan(old).size==1,'Legacy limit reference')
                s=s.sub(old,'');hits+=1
                RubyVM::InstructionSequence.compile(s);p[ix]=s
              end
              if s.include?('[3,4,5,6].select{|id|')
                a='[3,4,5,6].select{|id| a=$game_actors[id]; $game_party.actors.include?(a) && a.hp>0 && (id==3 || a.instance_variable_get(:@sl43_hired))}'
                b='[4,5,6].select{|id| a=$game_actors[id]; $game_party.actors.include?(a) && a.hp>0 && a.instance_variable_get(:@sl43_hired)}'
                s=once(s,a,b,'Dismissal list')
                RubyVM::InstructionSequence.compile(s);p[ix]=s;manage+=1
              end
            end
            check(hits==16 && manage==1,"Legacy recruiter conditions #{hits}/#{manage}")
            starts=list.each_index.select{|i|event_code(list[i])==111 && params(list[i])==[12,'@sl43_slot == 3']}
            check(starts.size==1,'Legacy dismissal branch')
            a=starts[0];d=iv(list[a],:@indent)
            b=(a+1...list.size).find{|i|event_code(list[i])==412 && iv(list[i],:@indent)==d}
            check(b && list[a..b].any?{|c|event_code(c)==129 && params(c)[0]==3},'Legacy dismissal branch body')
            list.slice!(a..b)
            check(list.none?{|c|event_code(c)==129 && params(c)[0]==3},'Legacy actor event command')
          end
          check(events.all?{|id,e|id==49 || Marshal.dump(e)==map_before[id]},'Unrelated Map029 event')

          ce=Marshal.load(File.binread(path.call('CommonEvents')))
          ce_before=ce.map{|e|Marshal.dump(e)}
          legacy_ids=[9,603,604,605,625,800]
          legacy_ids.each do |id|
            e=ce.fetch(id)
            check(utf(iv(e,:@name)).include?('힐러'),"CE#{id}: non-healer")
            if [605,800].include?(id)
              e.instance_variable_set(:@list,[blank_command(iv(e,:@list).last)])
            else
              check(iv(e,:@trigger)==2,"CE#{id}: unexpected trigger")
              # Retire only the dedicated parallel process, keep its reusable source commands.
              e.instance_variable_set(:@trigger,0)
            end
          end
          check(ce.each_index.select{|i|Marshal.dump(ce[i])!=ce_before[i]}==legacy_ids,'Unexpected common event changes')

          map_updates[path.call('Map029')]=m29
          updates={sp=>rows,path.call('CommonEvents')=>ce}.merge(map_updates)
          check(map_updates.keys.all?{|f|maps.include?(f)},'Unexpected map update')
          updates.each do |f,data|
            raw=Marshal.dump(data);File.binwrite(f,raw)
            check(Marshal.dump(Marshal.load(File.binread(f)))==raw,"Roundtrip #{f}")
          end
          File.write('/tmp/sl45-changed-data.json',JSON.generate(updates.keys.map{|f|File.basename(f)}.sort))
          puts "PASS maps=#{maps.size} new_slots=#{slots} disabled_old_healer_events=#{legacy} pages=#{old_pages} repaired_conditions=#{new_gates}"
          puts "PASS newly gated pages #{map_audit.inspect}"
          puts "PASS scripts=#{changed.inspect}; dedicated common events=#{legacy_ids.inspect}"
          RUBY
          ruby -c /tmp/sl45-patch.rb
          ruby /tmp/sl45-patch.rb

      - name: Update mappings and verify exact changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib,json,re
          root=Path('site')
          game=root/'knight/gameasync'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          names=json.loads(Path('/tmp/sl45-changed-data.json').read_text('utf8'))
          assert len(names)==len(set(names))
          assert {'Scripts.rxdata',pre+'CommonEvents.rxdata',pre+'Map029.rxdata'}<=set(names)
          assert all(n in ('Scripts.rxdata',pre+'CommonEvents.rxdata') or re.fullmatch(re.escape(pre)+r'Map[0-9]{3}\.rxdata',n) for n in names),names
          before=json.loads(Path('/tmp/sl45-before.json').read_text('utf8'))
          old=json.loads(Path('/tmp/sl45-md5.json').read_text('utf8'))
          assert set(names)<=set(old)
          mapper=game/'mapping.js'
          s=mapper.read_bytes()
          for n in names:
              marker=('Data/'+n+'?h=').encode('ascii')
              pattern=re.escape(marker)+rb'[0-9a-f]{32}'
              assert re.findall(pattern,s)==[marker+old[n].encode('ascii')],n
              digest=hashlib.md5((game/'Data'/n).read_bytes()).hexdigest().encode('ascii')
              s=re.sub(pattern,lambda _:marker+digest,s)
          mapper.write_bytes(s)
          loader=root/'knight/js/sl-assets-v229r115.js'
          s=loader.read_bytes()
          assert s.count(b"var version='V4.4';")==1
          loader.write_bytes(s.replace(b"var version='V4.4';",b"var version='V4.5';"))
          for name in ('index.html','knight/index.html'):
              p=root/name
              s=p.read_bytes()
              assert b'V4.4' in s
              p.write_bytes(s.replace(b'V4.4',b'V4.5').replace(b'v4.4',b'v4.5'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert set(before)==set(after)
          allowed={'knight/gameasync/Data/'+n for n in names}|{'knight/gameasync/mapping.js','knight/js/sl-assets-v229r115.js','index.html','knight/index.html'}
          changed={p for p in before if before[p]!=after[p]}
          assert changed==allowed,sorted(changed^allowed)
          assert len(after)==6019
          print('PASS approved files',len(changed))
          print('PASS unchanged files',len(before)-len(changed))
          print('PASS V4.5')
          PYTHON
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Upload V4.5 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
