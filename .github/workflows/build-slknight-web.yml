
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R39
# BASE: deployed V229R38 GitHub Actions run 39366339881
# AUDIO: BGM 60% of original, BGS unchanged, blacksmith OGG silent.
# WALL EXPERIMENT: original Sanctuary front-facing wall-edge mask.
# The WALL (not the character) becomes 50% opaque over sprites.
# Maintain original movement, collision, maps, Baphomet and all-stair test.
# This is a visual-only foreground occlusion prototype; base-footprint
# collision must be separately verified against navigable corridors.
name: build-slknight-web.yml | V229R39 | Clean Native Events and 2x Terrain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R39 Restore successful R38 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39366339881
          name: github-pages
          github-token: ${{ github.token }}
          path: r38

      - name: V229R39 Restore original Sanctuary V4.1 collision/terrain metadata
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39100619927
          name: Sanctuary-TI-Dungeon-V4.1-Original-Terrain-Walk
          github-token: ${{ github.token }}
          path: original-ti

      - name: V229R39 Verify exact R38 before patching
        shell: bash
        run: |
          set -euo pipefail
          test -s r38/artifact.tar
          test -s original-ti/preview/terrain-walk-v4.1.html
          mkdir -p site build
          tar -xf r38/artifact.tar -C site
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json
          p=Path('site');g=p/'knight/gameasync'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          expected={'Data/Scripts.rxdata':'f249b698ae6d1c72535ae2b12559e8bb10494657febc67ba0b23195944f4f7d0',
                    f'Data/{pre}Map045.rxdata':'d9dc66271e48f051b0d35a2dce109777a14fd396f87fcd7d0e76b044b482e3ba',
                    f'Data/{pre}Map046.rxdata':'c3f4cee70c9aff3459245727ccd49403079caa959aeebf00cf9eed99fb852059'}
          sha=lambda f:hashlib.sha256(f.read_bytes()).hexdigest()
          for name,digest in expected.items():assert sha(g/name)==digest,name
          for name in ('대장간 소리.ogg','대장간 소리2.ogg'):
            assert sha(g/'Audio/SE'/name)=='0293a2a069d6133ab53dc4c637cdd9ad5a45ae34d2aafb4b6a75dedb92454899'
          assert "var gain=k==='BGS'?0.20:(k==='BGM'?0.40:1);" in (p/'knight/index.html').read_text(encoding='utf-8')
          originals={str(f.relative_to(p)):sha(f) for f in p.rglob("*") if f.is_file()}
          assert len(originals)==5472,len(originals)
          Path('build/r38-baseline-sha256.json').write_text(json.dumps(originals,sort_keys=True))
          print('PASS exact R38 baseline: 5472 files, original map and boss unchanged')
          PY_BASE
          if ! python3 -c 'from PIL import Image' >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3-pil
          fi

      - name: V229R39 Extract only original foreground wall fronts
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r39_wall.py <<'R39_PY_R39_WALL'
          from pathlib import Path
          import base64, json, math, re, sys
          import hashlib
          from PIL import Image, ImageDraw, ImageFilter, ImageChops

          source_dir=Path(sys.argv[1])
          game=Path(sys.argv[2])
          report=Path(sys.argv[3]);report.mkdir(parents=True,exist_ok=True)
          html=(source_dir/'preview/terrain-walk-v4.1.html').read_text(encoding='utf-8')
          match=re.search(r'<script id="data" type="application/json">(.*?)</script>',html,re.S)
          assert match, 'Original V4.1 collision records absent'
          maps=json.loads(match.group(1))
          output={}
          for fl,mid,cols,rows,expect_b in (('1',45,9,5,762),('2',46,11,6,1146)):
              s=maps[fl]
              first=s['tiles'][0]
              name=Path(first['src']).stem
              bx=int(name[:4],16);by=int(name[4:8],16)
              worldx=32704+(bx-32767)*64;worldy=32704+(by-32767)*64
              a=first['x']-12*(worldx+worldy)
              b=first['y']+378-6*(worldy-worldx)
              ox=min(t['x'] for t in s['tiles']);oy=min(t['y'] for t in s['tiles'])
              sw=max(t['x']+1536 for t in s['tiles'])-ox
              sh=max(t['y']+768 for t in s['tiles'])-oy
              assert (a,b,ox,oy)==(-783360,expect_b,768,384),(mid,a,b,ox,oy)
              assert (math.ceil(sw/512),math.ceil(sh/512))==(cols,rows),(mid,sw,sh,cols,rows)
              cw,ch=s['width'],s['height']
              world_ox,world_oy=s['originX'],s['originY']
              collision=base64.b64decode(s['collisionBase64'])
              assert len(collision)==cw*ch
              def walk(x,y):return collision[y*cw+x]==0
              # Foreground wall faces are the SOUTH-FACING boundaries of the original
              # walkable-vs-solid world tiles (not every solid tile and not all floor).
              # These are 1F/2F source coordinates, independent of RGSS movement raster.
              mask=Image.new('L',(sw,sh),0);d=ImageDraw.Draw(mask)
              count=0
              for wy in range(1,ch-1):
                  for wx in range(1,cw-1):
                      if not walk(wx,wy):continue
                      mx=a+12*(wx+world_ox+wy+world_oy)-ox
                      my=b+6*((wy+world_oy)-(wx+world_ox))-oy
                      if mx<-45 or my<-60 or mx>sw+45 or my>sh+40:continue
                      for dx,dy in ((-1,0),(0,1)):
                          if walk(wx+dx,wy+dy):continue
                          # Isometric wall cap on its front-facing edge.  The bottom
                          # extends 27 original pixels; this is an OCCLUSION mask,
                          # NEVER a new collision mask.
                          if dx==-1: p1=(mx-12,my);p2=(mx,my+6)
                          else: p1=(mx,my+6);p2=(mx+12,my)
                          d.polygon([(p1[0],p1[1]-3),(p2[0],p2[1]-3),
                                     (p2[0],p2[1]+27),(p1[0],p1[1]+27)],fill=255)
                          count+=1
              mask=mask.filter(ImageFilter.GaussianBlur(radius=1.1))
              active=[];stats=[]
              for cy in range(rows):
                  for cx in range(cols):
                      bx0=cx*512;by0=cy*512
                      cut=mask.crop((bx0,by0,bx0+512,by0+512))
                      nonzero=sum(cut.histogram()[17:])
                      if nonzero<200: continue
                      original=game/'Graphics/Panoramas'/f'SLTI_{mid}_C{cx}_{cy}.png'
                      with Image.open(original) as p:
                          rgb=p.convert('RGBA')
                      rgb.putalpha(ImageChops.darker(rgb.getchannel('A'),cut))
                      dest=game/'Graphics/Panoramas'/f'SLTIW_{mid}_C{cx}_{cy}.png'
                      rgb.save(dest,optimize=True)
                      assert Image.open(dest).size==(512,512)
                      active.append([cx,cy])
                      stats.append({'coord':[cx,cy],'nonempty':nonzero,'bytes':dest.stat().st_size})
              assert len(active)>=8,(mid,len(active))
              output[str(mid)]={'active':active,'candidates':count,'wallChunks':len(active),
                                'sourceDimensions':[sw,sh],'registered':stats,
                                'nonzeroSourcePixels':sum(mask.histogram()[17:])}
              print('WALL',mid,'boundaries',count,'active chunks',len(active),
                    'on source',sw,sh,'png_bytes',sum(x['bytes'] for x in stats),flush=True)
          (report/'r39-wall-report.json').write_text(json.dumps(output,ensure_ascii=False,indent=2))
          R39_PY_R39_WALL
          python3 /tmp/r39_wall.py original-ti site/knight/gameasync build

      - name: V229R39 Add actor-scoped 50-percent wall overlay to active renderer 97
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r39_renderer.rb <<'R39_RUBY_R39_RENDERER'
          require 'json'
          require 'zlib'
          require 'digest'
          root=ARGV.fetch(0)
          report=JSON.parse(File.read(ARGV.fetch(1)))
          script_path=root+'/knight/gameasync/Data/Scripts.rxdata'
          orig=File.binread(script_path)
          raise 'Wrong deployed R38 game' unless Digest::SHA256.hexdigest(orig)=='f249b698ae6d1c72535ae2b12559e8bb10494657febc67ba0b23195944f4f7d0'
          scripts=Marshal.load(orig)
          source=Zlib::Inflate.inflate(scripts[97][2])
          raise 'Expected active renderer missing' unless scripts[97][1].dup.force_encoding('UTF-8')=='해상도'
          raise 'Unexpected multiple renderer classes' unless source.scan('class Spriteset_Map').size==1
          raise 'R38 mapped terrain missing' unless source.include?('slti_update_terrain if @slti_floor')
          raise 'R38 character update missing' unless source.include?("    for sprite in @character_sprites\n      sprite.update\n    end")
          raise 'R38 wall system already patched' if source.include?('slti_update_occlusion')

          coords=report.map{|k,v|k.to_i.to_s+' => ['+v.fetch('active').map{|x,y|"[#{x},#{y}]"}.join(',')+']'}.join(',')
          setup = %Q{
              # V229R39: original Sanctuary SOUTH-FACING wall fronts only.
              # Geometry remains on R38 map; original native collision is unchanged.
              @slti_wall_active = {}
              @slti_wall_overlays = {}
              @slti_wall_bitmaps = {}
              @slti_wall_failed = false
              if @slti_floor
                all_masks = {#{coords}}
                all_masks.fetch(@slti_floor).each { |xy| @slti_wall_active[xy] = true }
              end
          }
          anchor='    @slti_rows = @slti_floor == 45 ? 5 : (@slti_floor == 46 ? 6 : 0)'
          raise 'Missing renderer setup anchor' unless source.scan(anchor).length==1
          source=source.sub(anchor,anchor+setup)
          loop_anchor="    for sprite in @character_sprites\n      sprite.update\n    end"
          source=source.sub(loop_anchor,loop_anchor+"\n    slti_update_occlusion if @slti_floor")
          dispose_anchor='    @panorama.dispose'
          cleanup=%q{
              # Release foreground sprites BEFORE freeing the shared cached Bitmap.
              if @slti_wall_overlays
                @slti_wall_overlays.each_value do |sprite|
                  sprite.bitmap = nil
                  sprite.dispose
                end
                @slti_wall_overlays.clear
              end
              if @slti_wall_bitmaps
                @slti_wall_bitmaps.each_value do |bitmap|
                  bitmap.dispose if bitmap != nil && !bitmap.disposed?
                end
                @slti_wall_bitmaps.clear
              end
          }
          raise 'Bad disposal anchor' unless source.scan(dispose_anchor).size==1
          source=source.sub(dispose_anchor,cleanup+dispose_anchor)
          method=%q{
            # V229R39: actor-scoped wall foreground. The ORIGINAL wall remains fully
            # opaque in the background. Its exact pixels are redrawn at 50% opacity
            # ONLY where a character's bitmap overlaps the true wall-face mask.
            # No actor opacity changes; no collision, pathfinding or camera overrides.
            def slti_update_occlusion
              return if @slti_wall_failed
              camera_x = ($game_map.display_x / 4).to_i
              camera_y = ($game_map.display_y / 4).to_i
              vw = @viewport2.rect.width
              vh = @viewport2.rect.height
              needed = {}
              used_bitmaps = {}
              @character_sprites.each_with_index do |actor, i|
                next if actor == nil || actor.disposed? || actor.bitmap == nil
                next if !actor.visible || actor.opacity <= 0
                rect = actor.src_rect
                next if rect == nil || rect.width <= 0 || rect.height <= 0
                zx = actor.zoom_x
                zy = actor.zoom_y
                next if zx <= 0 || zy <= 0
                left = actor.x - actor.ox * zx
                top = actor.y - actor.oy * zy
                right = left + rect.width * zx
                bottom = top + rect.height * zy
                next if right <= 0 || bottom <= 0 || left >= vw || top >= vh
                # R38 source PNGs are 512 physical pixels, displayed at exactly 2x.
                xl = ((left + camera_x) / 2.0).floor
                yt = ((top + camera_y) / 2.0).floor
                xr = ((right + camera_x) / 2.0).ceil
                yb = ((bottom + camera_y) / 2.0).ceil
                next if xr <= xl || yb <= yt
                cx0 = xl.div(512); cx1 = (xr-1).div(512)
                cy0 = yt.div(512); cy1 = (yb-1).div(512)
                for cy in cy0..cy1
                  for cx in cx0..cx1
                    key = [cx, cy]
                    next unless @slti_wall_active[key]
                    l = [xl, cx*512].max; t = [yt, cy*512].max
                    r = [xr, (cx+1)*512].min; b = [yb, (cy+1)*512].min
                    next if r <= l || b <= t
                    begin
                      bitmap = @slti_wall_bitmaps[key]
                      if bitmap == nil
                        filename = "Graphics/Panoramas/SLTIW_#{@slti_floor}_C#{cx}_#{cy}"
                        bitmap = Bitmap.new(filename)
                        @slti_wall_bitmaps[key] = bitmap
                      end
                      overlay_key = [i, cx, cy]
                      overlay = @slti_wall_overlays[overlay_key]
                      if overlay == nil
                        overlay = Sprite.new(@viewport2)
                        overlay.bitmap = bitmap
                        overlay.zoom_x = 2.0
                        overlay.zoom_y = 2.0
                        overlay.opacity = 128
                        @slti_wall_overlays[overlay_key] = overlay
                      end
                      overlay.src_rect.set(l-cx*512,t-cy*512,r-l,b-t)
                      overlay.x = l*2 - camera_x
                      overlay.y = t*2 - camera_y
                      overlay.z = actor.z + 1
                      needed[overlay_key] = true
                      used_bitmaps[key] = true
                    rescue StandardError => error
                      p "SLTI WALL OVERLAY ERROR: #{error}"
                      @slti_wall_failed = true
                      return
                    end
                  end
                end
              end
              @slti_wall_overlays.keys.each do |key|
                next if needed[key]
                overlay = @slti_wall_overlays.delete(key)
                overlay.bitmap = nil
                overlay.dispose
              end
              @slti_wall_bitmaps.keys.each do |key|
                next if used_bitmaps[key]
                bitmap = @slti_wall_bitmaps.delete(key)
                bitmap.dispose if bitmap != nil && !bitmap.disposed?
              end
            end
          }
          raise 'Unexpected script 97 ending' unless source.rstrip.end_with?('end')
          source=source.rstrip.sub(/end\z/,method+"\nend\n")
          scripts[97][2]=Zlib::Deflate.deflate(source)
          File.binwrite(script_path,Marshal.dump(scripts))
          a=Marshal.load(orig);b=Marshal.load(File.binread(script_path))
          raise 'Non-renderer script changed' unless a.each_index.all?{|i|i==97 || a[i]==b[i]}
          raise 'Active renderer unchanged' if a[97]==b[97]
          File.write(ARGV.fetch(2),source)
          puts "PASS: only script97 patched; actor-opacity untouched, foreground wall alpha=128, original terrain retained"
          R39_RUBY_R39_RENDERER
          ruby -c /tmp/r39_renderer.rb && ruby /tmp/r39_renderer.rb site build/r39-wall-report.json build/Spriteset_Map_V229R39.rb && ruby -c build/Spriteset_Map_V229R39.rb

      - name: V229R39 Raise BGM to 60 percent and register only wall PNGs
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r39_register.py <<'R39_PY_R39_REGISTER'
          from pathlib import Path
          import hashlib,json,re,sys
          root=Path(sys.argv[1]); report_dir=Path(sys.argv[2])
          game=root/'knight/gameasync'
          report=json.loads((report_dir/'r39-wall-report.json').read_text(encoding='utf-8'))
          bridge=root/'knight/index.html'
          html=bridge.read_text(encoding='utf-8')
          audio_before="var gain=k==='BGS'?0.20:(k==='BGM'?0.40:1);"
          audio_after="var gain=k==='BGS'?0.20:(k==='BGM'?0.60:1);"
          assert html.count(audio_before)==1, 'Original 40% BGM bridge not found'
          html=html.replace(audio_before,audio_after,1)
          assert 'V229R38' in html
          html=html.replace('V229R38','V229R39').replace('v229r38','v229r39')
          bridge.write_text(html,encoding='utf-8')
          page=root/'index.html'
          s=page.read_text(encoding='utf-8')
          assert 'V229R38' in s
          page.write_text(s.replace('V229R38','V229R39').replace('v229r38','v229r39'),encoding='utf-8')
          path=game/'mapping.js'; s=path.read_text(encoding='utf-8')
          relative='Data/Scripts.rxdata'
          md5=hashlib.md5((game/relative).read_bytes()).hexdigest()
          s,num=re.subn(re.escape(relative+'?h=')+r'[0-9a-f]{32}',lambda m:relative+'?h='+md5,s)
          assert num==1, ('Script mapping update count',num)
          add=[]
          for mid in ('45','46'):
              names=[]
              for cx,cy in report[mid]['active']:
                  rel=f'Graphics/Panoramas/SLTIW_{mid}_C{cx}_{cy}.png'
                  blob=(game/rel).read_bytes();assert blob[:8]==b'\x89PNG\r\n\x1a\n'
                  key=rel.rsplit('.',1)[0].lower();digest=hashlib.md5(blob).hexdigest()
                  assert '["'+key+'",' not in s
                  add.append('['+json.dumps(key)+', '+json.dumps(rel+'?h='+digest)+'],\n')
                  names.append(rel)
              pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
              manifest=root/'knight/preload/Data'/f'{pre}Map{int(mid):03}.rxdata.json'
              old=json.loads(manifest.read_text(encoding='utf-8'))
              assert len(old)==(45 if mid=='45' else 66)
              assert all(name.startswith('Graphics/Panoramas/SLTI_') for name in old)
              new=old+names
              assert len(new)==len(set(new))
              manifest.write_text(json.dumps(new,separators=(',',':'))+'\n',encoding='utf-8')
          assert s.count('\n];\n\nvar mapping')==1
          s=s.replace('\n];\n\nvar mapping','\n'+''.join(add)+'];\n\nvar mapping',1)
          path.write_text(s,encoding='utf-8')
          (report_dir/'r39-file-report.json').write_text(json.dumps({'version':'V229R39','audio':'BGM gain 0.60; BGS unchanged','addedMasks':len(add),'mapMasks':{mid:len(info['active']) for mid,info in report.items()},'changedExisting':['index.html','knight/index.html','knight/gameasync/Data/Scripts.rxdata','knight/gameasync/mapping.js','knight/preload/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap045.rxdata.json','knight/preload/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap046.rxdata.json'],'collisionModified':False},indent=2))
          print('PASS BGM 0.60 and exact',len(add),'occluder masks mapped; 2 manifests extended')
          R39_PY_R39_REGISTER
          python3 /tmp/r39_register.py site build && node --check site/knight/gameasync/mapping.js

      - name: V229R39 Check changes against all 5472 R38 originals
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r39_integrity.py <<'R39_PY_R39_INTEGRITY'
          from pathlib import Path
          import json,hashlib,re,sys
          from PIL import Image
          base=Path(sys.argv[1]); site=Path(sys.argv[2]); audit=Path(sys.argv[3])
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          original=json.loads(base.read_text(encoding='utf-8')) if base.is_file() else {str(p.relative_to(base)):sha(p) for p in base.rglob('*') if p.is_file() and not p.name.startswith('SLTIW_')}
          output={str(p.relative_to(site)):sha(p) for p in site.rglob('*') if p.is_file()}
          assert len(original)==5472, len(original)
          assert len(output)==5472+29,len(output)
          changed={k for k in original if original[k]!=output[k]}
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          expected={'index.html','knight/index.html','knight/gameasync/mapping.js',
                    'knight/gameasync/Data/Scripts.rxdata',
                    f'knight/preload/Data/{pre}Map045.rxdata.json',
                    f'knight/preload/Data/{pre}Map046.rxdata.json'}
          assert changed==expected,('Unintended original changes',changed^expected)
          new=set(output)-set(original)
          assert len(new)==29 and all(n.startswith('knight/gameasync/Graphics/Panoramas/SLTIW_') and n.endswith('.png') for n in new)
          for n in new:
           with Image.open(site/n) as im:
            assert im.size==(512,512) and im.mode=='RGBA'
            a=im.getchannel('A');counts=a.histogram();assert sum(counts[17:])>200
            assert sum(counts[17:])<250000
          for n in ['Audio/SE/대장간 소리.ogg','Audio/SE/대장간 소리2.ogg']:
           assert sha(site/'knight/gameasync'/n)=='0293a2a069d6133ab53dc4c637cdd9ad5a45ae34d2aafb4b6a75dedb92454899'
          for mid in (45,46):
           assert original[f'knight/gameasync/Data/{pre}Map{mid:03}.rxdata']==sha(site/'knight/gameasync/Data'/f'{pre}Map{mid:03}.rxdata')
          assert original['knight/js/dpad.js']==sha(site/'knight/js/dpad.js')
          assert original['knight/js/drive.js']==sha(site/'knight/js/drive.js')
          bridge=(site/'knight/index.html').read_text(encoding='utf-8')
          assert bridge.count("var gain=k==='BGS'?0.20:(k==='BGM'?0.60:1);")==1
          assert 'V229R39' in bridge and 'V229R39' in (site/'index.html').read_text(encoding='utf-8')
          manifest=json.loads((audit/'r39-wall-report.json').read_text(encoding='utf-8'))
          assert [len(manifest[mid]['active']) for mid in ('45','46')]==[12,17]
          for mid,original_count in [('45',45),('46',66)]:
           p=site/'knight/preload/Data'/f'{pre}Map{int(mid):03}.rxdata.json'
           v=json.loads(p.read_text(encoding='utf-8'))
           assert len(v)==original_count+len(manifest[mid]['active'])
           assert len(v)==len(set(v))
          mapper=(site/'knight/gameasync/mapping.js').read_text(encoding='utf-8')
          for name in new:
           rel=name.removeprefix('knight/gameasync/')
           assert mapper.count(rel+'?h='+hashlib.md5((site/name).read_bytes()).hexdigest())==1
          print('PASS V229R39 integrity: 5472 originals, 6 changed, 29 new masks, collision/events/boss unchanged, BGM 60, smith silent')
          R39_PY_R39_INTEGRITY
          python3 /tmp/r39_integrity.py build/r38-baseline-sha256.json site build

      - name: V229R39 Simulate real wall sprite clipping and cache lifecycle
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r39_sprite_test.rb <<'R39_RUBY_R39_SPRITE_TEST'
          require 'json'
          src=File.read(ARGV.fetch(0))
          pos=src.index('  def slti_update_occlusion')
          raise 'No occlusion method' unless pos
          text=src[pos..-1].sub(/\nend\s*\z/, "\n")
          class Bitmap
            attr_reader :path
            def initialize(path); @path=path; @disposed=false; end
            def disposed?;@disposed;end
            def dispose;@disposed=true;end
          end
          class Rect
            attr_accessor :width,:height,:x,:y
            def initialize(width=0,height=0);@width=width;@height=height;end
            def set(x,y,w,h);@x=x;@y=y;@width=w;@height=h;end
          end
          class Sprite
            attr_accessor :bitmap,:zoom_x,:zoom_y,:opacity,:x,:y,:z,:ox,:oy,:visible,:src_rect
            def initialize(viewport)
              @bitmap=nil;@zoom_x=1;@zoom_y=1;@opacity=255;@visible=true;@src_rect=Rect.new
              @ox=0;@oy=0;@x=0;@y=0;@z=0;@disposed=false
            end
            def dispose;@disposed=true;end
            def disposed?;@disposed;end
          end
          class Map
            attr_accessor :display_x,:display_y
          end
          class Spriteset_Map;end
          # Attach exactly the game method to a minimal Spriteset_Map test double.
          Spriteset_Map.class_eval(text)
          report=JSON.parse(File.read(ARGV.fetch(1)))
          site=ARGV.fetch(2)
          $game_map=Map.new
          $game_map.display_x=4208*4
          $game_map.display_y=2260*4
          actor=Sprite.new(nil);actor.bitmap=Bitmap.new('hero');actor.src_rect=Rect.new(60,75)
          actor.x=400;actor.y=300;actor.ox=30;actor.oy=75;actor.z=300;actor.opacity=255
          ui=Spriteset_Map.allocate
          ui.instance_variable_set(:@slti_floor,45)
          ui.instance_variable_set(:@slti_wall_failed,false)
          ui.instance_variable_set(:@slti_wall_active,report['45']['active'].to_h{|xy|[xy,true]})
          ui.instance_variable_set(:@slti_wall_overlays,{})
          ui.instance_variable_set(:@slti_wall_bitmaps,{})
          ui.instance_variable_set(:@character_sprites,[actor])
          vp=Object.new;vp.define_singleton_method(:rect){Rect.new(800,600)}
          ui.instance_variable_set(:@viewport2,vp)
          ui.slti_update_occlusion
          sprites=ui.instance_variable_get(:@slti_wall_overlays)
          raise 'Missing foreground on actor' unless sprites.size==1
          s=sprites.values.first
          raise 'Wrong wall alpha' unless s.opacity==128
          raise 'Actor opacity was altered' unless actor.opacity==255
          raise 'Overlay must be just above its actor' unless s.z==actor.z+1
          raise 'No clipping to actor bounds' unless s.src_rect.width<=31 && s.src_rect.height<=38
          raise 'Wrong wall mask' unless s.bitmap.path.include?('SLTIW_45_C4_2')
          raise 'Output position drifted' unless s.x.between?(367,370) && s.y.between?(222,226)
          actor.x=2000
          ui.slti_update_occlusion
          raise 'Offscreen overlay not disposed' unless ui.instance_variable_get(:@slti_wall_overlays).empty?
          raise 'Wall texture not freed' unless ui.instance_variable_get(:@slti_wall_bitmaps).empty?
          puts 'PASS native wall overlay method: source crop, wall alpha 128, character alpha 255, bounds and bitmap cleanup'
          R39_RUBY_R39_SPRITE_TEST
          ruby /tmp/r39_sprite_test.rb build/Spriteset_Map_V229R39.rb build/r39-wall-report.json site

      - name: V229R39 Verify browser BGM 60 and BGS unchanged
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r39_audio_test.js <<'R39_JS_R39_AUDIO_TEST'
          const fs = require('fs'), vm = require('vm');
          const html = fs.readFileSync(process.argv[2], 'utf8');
          const js = html.split('<script>', 2)[1].split('</script>', 1)[0];
          class FakeAudio {
           constructor(){this.volume=0;this.src='';this.attrs={};}
           getAttribute(k){return this.attrs[k];} setAttribute(k,v){this.attrs[k]=v;}
           pause(){} load(){} play(){return undefined;}
          }
          const testConsole={log(){}};
          const window={addEventListener(){}};
          vm.runInNewContext(js, {Audio:FakeAudio,console:testConsole,window,document:{},encodeURI,setTimeout(){},Math,Number,String});
          testConsole.log('SLAUDIO|BGM_PLAY|Audio/BGM/TEST|80|100');
          testConsole.log('SLAUDIO|BGS_PLAY|Audio/BGS/TEST|80|100');
          if(Math.abs(window.slAudioBridge.BGM.volume-0.48)>1e-8)throw Error('BGM not original 60%');
          if(Math.abs(window.slAudioBridge.BGS.volume-0.16)>1e-8)throw Error('BGS changed');
          console.log('PASS audio: BGM 80 x0.60 =>48%, BGS 80 x0.20 =>16%; SE unchanged');
          R39_JS_R39_AUDIO_TEST
          node /tmp/r39_audio_test.js site/knight/index.html

      - name: V229R39 Upload precise source-wall and memory audit
        uses: actions/upload-artifact@v4
        with:
          name: SLKnight-V229R39-Wall-Occlusion-and-BGM-Audit
          path: |
            build/r39-wall-report.json
            build/r39-file-report.json
            build/Spriteset_Map_V229R39.rb
          if-no-files-found: error
          retention-days: 30

      - name: V229R39 Upload existing game to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
