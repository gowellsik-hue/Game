              i.command_125;i.command_315
              i.instance_variable_set(:@parameters,[333,333,0,2,200,400]);i.command_122
              i.instance_variable_set(:@parameters,[1926,1926,0,0,2501]);i.command_122
              raise "Old message shows wrong gold #{mid}:#{id}" unless $game_variables[333]==deltaM && $game_variables[1926]==xp
              raise "Duplicate payment #{mid}:#{id}" unless $game_party.gold==beforeMoney+deltaM && $game_actors[1].exp==beforeXP+xp
              cases+=1
