name: Deploy SLKnight STABLE FEATURES + SLFairy 800

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  FEATURE_SHA: 1ac0f212df7b5ec1f0d515f34950242a58b13dbf
  BASELINE_SHA: c6815cd461dba60ec131898e6d5dd8690dd915ae
  DUAL_BASE_SHA: 04ce66ec99abc10f77143de53650685db8949532
  FAIRY_BOOT_SHA: 48e9f88
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  FAIRY_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLFairy_Source_v1.zip
  FAIRY_SHA256: 67b88b5fe0cde3c9f2fada889815f9aa7d0fc94b378025529e9950d55151c70e
  FAIRY_7Z_PASSWORD: http://nemo838.tistory.com/
  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout successful feature source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.FEATURE_SHA }}
          path: feature

      - name: Checkout V14.3l baseline
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.BASELINE_SHA }}
          path: baseline

      - name: Checkout Fairy source workflow
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.DUAL_BASE_SHA }}
          path: dualbase

      - name: Checkout Fairy boot fix source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.FAIRY_BOOT_SHA }}
          path: fairyboot

      - name: Install tools
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            autoconf \
            automake \
            cmake \
            curl \
            ffmpeg \
            freepats \
            git \
            imagemagick \
            libtool \
            make \
            mm-common \
            patch \
            pkg-config \
            python3 \
            rake \
            ruby \
            timidity \
            unzip \
            wget \
            xz-utils \
            fonts-nanum \
            p7zip-full \
            nodejs

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.MKXP_SRC_REF }}
          path: engine

      - name: Cache engine dependencies
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-${{ runner.os }}-${{ env.EMSDK_VER }}-stable-features

      - name: Extract existing successful scripts
        run: |
          set -euo pipefail

          ruby -ryaml - <<'RB'
          def steps(path)
            YAML.load_file(path)
              .fetch('jobs')
              .fetch('build')
              .fetch('steps')
          end

          def save_step(list,name,path)
            step=list.find{|x|x['name']==name}

            abort(
              "STEP MISSING: #{name}"
            ) unless step && step['run']

            File.write(
              path,
              step['run']
            )
          end

          feature=steps(
            'feature/.github/workflows/build-slknight-web.yml'
          )

          dual=steps(
            'dualbase/.github/workflows/build-slknight-web.yml'
          )

          fairyboot=steps(
            'fairyboot/.github/workflows/build-slknight-web.yml'
          )

          save_step(
            feature,
            'Extract frozen run scripts',
            '/tmp/feature_extract.sh'
          )

          save_step(
            feature,
            'Remove unsupported Orc alias mappings from z1 patch',
            '/tmp/feature_00.sh'
          )

          save_step(
            feature,
            'Add user-verified remaining 5 monster mappings',
            '/tmp/feature_01.sh'
          )

          save_step(
            feature,
            'Retarget inherited z3 scripts to z9 counts',
            '/tmp/feature_02.sh'
          )

          save_step(
            feature,
            'Patch verified monster attacks including remaining 5',
            '/tmp/feature_monsters.sh'
          )

          save_step(
            feature,
            'Patch Gnoll Neruga Drake Kelberos',
            '/tmp/feature_delta.sh'
          )

          save_step(
            feature,
            'Patch native Lineage auto attack at full input rate',
            '/tmp/feature_auto.sh'
          )

          save_step(
            feature,
            'Preload z9 verified attack and breath assets',
            '/tmp/feature_preload.sh'
          )

          [
            'Download SLFairy source',
            'Prepare SLFairy source and decrypt RGSSAD',
            'Patch SLFairy scripts for web and mobile',
            'Convert SLFairy media',
            'Build SLFairy mappings'
          ].each_with_index do |name,i|

            save_step(
              dual,
              name,
              format(
                '/tmp/fairy_%02d.sh',
                i
              )
            )
          end

          save_step(
            fairyboot,
            'Patch Fairy boot once',
            '/tmp/fairy_boot.sh'
          )

          puts \
            'SUCCESSFUL_SCRIPT_SOURCES_EXTRACTED'
          RB

          bash -e \
            /tmp/feature_extract.sh

      - name: Prepare existing monster patches
        run: |
          set -euo pipefail

          bash -e \
            /tmp/feature_00.sh

          bash -e \
            /tmp/feature_01.sh

          bash -e \
            /tmp/feature_02.sh

          echo \
            MONSTER_PATCH_SOURCE_READY

      - name: Patch engine
        run: |
          set -euo pipefail
          bash -e /tmp/base_patch_engine.sh

      - name: Build engine
        run: |
          set -euo pipefail
          bash -e /tmp/base_build_engine.sh

      - name: Install game
        run: |
          set -euo pipefail
          bash -e /tmp/base_install_game.sh

      - name: Apply V14.3l game state
        run: |
          set -euo pipefail

          # V14.3l already contains the earlier working
          # pad / equipment / quickslot / potion handling.
          #
          # Do NOT add:
          # - green bank
          # - potion stacking
          # - timed buff state machine
          # - transform recognition rewrite
          # - save migration

          bash -e \
            /tmp/base_patch_game.sh

          echo \
            BASE_GAME_PATCH_DONE

      - name: Apply existing monster work
        run: |
          set -euo pipefail

          bash -e \
            /tmp/feature_monsters.sh

          bash -e \
            /tmp/feature_delta.sh

          echo \
            EXISTING_MONSTER_FEATURES_APPLIED

      - name: Convert Knight media
        run: |
          set -euo pipefail
          bash -e /tmp/base_convert_media.sh

      - name: Build Knight mappings
        run: |
          set -euo pipefail
          bash -e /tmp/base_build_mappings.sh

      - name: Apply existing Knight browser
        run: |
          set -euo pipefail
          bash -e /tmp/base_patch_browser.sh

      - name: Apply existing full-rate auto attack
        run: |
          set -euo pipefail
          bash -e /tmp/feature_auto.sh

      - name: Apply existing monster preload
        run: |
          set -euo pipefail
          bash -e /tmp/feature_preload.sh

      - name: Verify Knight without rewriting gameplay
        run: |
          set -euo pipefail

          test -s \
            player/index.html

          test -s \
            player/mkxp.js

          test -s \
            player/mkxp.wasm

          test -s \
            player/gameasync/Game.ini

          test -s \
            player/gameasync/Data/Scripts.rxdata

          test -s \
            player/gameasync/mapping.js

          test -s \
            player/gameasync/bitmap-map.js

          test -s \
            player/js/drive.js

          test -s \
            player/js/dpad.js

          grep -Fq \
            'slknight_v14_engine' \
            player/index.html

          grep -Fq \
            'restoreLocalFilesBeforeRun' \
            player/js/drive.js

          grep -Fq \
            'function attackButton(parent)' \
            player/js/dpad.js

          node --check \
            player/js/drive.js

          node --check \
            player/js/dpad.js

          # These later failed experiments must not exist.
          ! grep -R -Fq \
            'SL_GREEN_STACK' \
            player/gameasync

          ! grep -R -Fq \
            'SL_GREEN_BANK' \
            player/gameasync

          ! grep -R -Fq \
            'SL_BRAVERY_STACK' \
            player/gameasync

          ! grep -R -Fq \
            'SL_TIMED_BUFF_STATE' \
            player/gameasync

          ! grep -R -Fq \
            'SL_TRANSFORM_ATTACK_REDIRECT' \
            player/gameasync

          ! grep -R -Fq \
            'SL_SAVE_NAMESPACE_MIGRATION' \
            player

          ! grep -R -Fq \
            'sltransform-v106g' \
            player

          echo \
            KNIGHT_EXISTING_FEATURE_SET_OK

      - name: Download Fairy source
        run: |
          set -euo pipefail
          bash -e /tmp/fairy_00.sh

      - name: Prepare Fairy source
        run: |
          set -euo pipefail
          bash -e /tmp/fairy_01.sh

      - name: Patch Fairy web compatibility
        run: |
          set -euo pipefail

          # This source creates Fairy Web Resolution 800x600.
          # Do not later replace it with 640x480.
          bash -e \
            /tmp/fairy_02.sh

      - name: Convert Fairy media
        run: |
          set -euo pipefail
          bash -e /tmp/fairy_03.sh

      - name: Build Fairy mappings
        run: |
          set -euo pipefail
          bash -e /tmp/fairy_04.sh

      - name: Apply existing Fairy boot fixes only
        run: |
          set -euo pipefail

          # Uses the successful CLEAN BOOT FIX version.
          # This fixes the existing Scene_Equip / ID script boot problems.
          # Unlike the later 640 patch, this version leaves 800x600 alone.
          bash -e \
            /tmp/fairy_boot.sh

          (
            cd \
              fairy_player/gameasync

            bash \
              "$GITHUB_WORKSPACE/engine/extra/make_mapping.sh"
          )

          echo \
            FAIRY_BOOT_FIX_APPLIED

      - name: Finalize Knight and Fairy browser shells
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          # ------------------------------------------------------------
          # Remove the old duplicate inline touch bridge.
          # Keep the already-working js/dpad.js implementation.
          # ------------------------------------------------------------

          for name in (
              'player/index.html',
              'fairy_player/index.html'
          ):

              p=Path(name)

              s=p.read_text(
                  encoding='utf-8'
              )

              start="        if (!is_touch_device()) {"
              end="        resize();"

              if start in s:

                  if s.count(start)!=1:
                      raise SystemExit(
                          f'LEGACY TOUCH BLOCK COUNT '
                          f'{name}={s.count(start)}'
                      )

                  a=s.index(start)

                  b=s.index(
                      end,
                      a
                  )+len(end)

                  s=s[:a]+s[b:]

              s=s.replace(
                  'position:fixed;left:8px;top:8px;',
                  'position:fixed;left:8px;bottom:8px;'
              )

              p.write_text(
                  s,
                  encoding='utf-8'
              )

          # ------------------------------------------------------------
          # Fairy browser identity only.
          # Keep drive.js itself unchanged.
          # ------------------------------------------------------------

          p=Path(
              'fairy_player/index.html'
          )

          s=p.read_text(
              encoding='utf-8'
          )

          s,n=re.subn(
              r"var namespace = '[^']*';",
              "var namespace = 'slfairy_v105_engine';",
              s,
              count=1
          )

          if n!=1:
              raise SystemExit(
                  f'FAIRY NAMESPACE COUNT={n}'
              )

          s,n=re.subn(
              r"var wTitle = '[^']*'",
              "var wTitle = 'SLFairy'",
              s,
              count=1
          )

          if n!=1:
              raise SystemExit(
                  f'FAIRY TITLE VARIABLE COUNT={n}'
              )

          s=re.sub(
              r'<title>.*?</title>',
              '<title>SLFairy</title>',
              s,
              count=1,
              flags=re.I|re.S
          )

          # ------------------------------------------------------------
          # Fairy must not load Knight-only monster attack preloads.
          # ------------------------------------------------------------

          pat=re.compile(
              r"\n\s*var slAttackSheets=.*?"
              r"\n\s*slAttackCoords\.forEach"
              r"\(function\(name\)\{.*?"
              r"\n\s*\}\);",
              re.S
          )

          s,n=pat.subn(
              '',
              s,
              count=1
          )

          if n!=1:
              raise SystemExit(
                  f'KNIGHT PRELOAD BLOCK COUNT={n}'
              )

          # Cache-bust Fairy's normal files only.
          s=s.replace(
              'v143z9',
              'v143z9elf'
          )

          p.write_text(
              s,
              encoding='utf-8'
          )

          # ------------------------------------------------------------
          # Fairy hotbar.
          # Use the existing F5-F9 bridge from Mobile Diablo Assist.
          # ------------------------------------------------------------

          d=Path(
              'fairy_player/js/dpad.js'
          )

          t=d.read_text(
              encoding='utf-8'
          )

          old=(
              "hotButton(hot,0,'A',65);"
              "hotButton(hot,1,'S',83);"
              "hotButton(hot,2,'D',68);"
              "hotButton(hot,3,'Q',81);"
              "hotButton(hot,4,'Z',90);"
              "hotButton(hot,5,'F',116);"
          )

          new=(
              "hotButton(hot,0,'A',117);"
              "hotButton(hot,1,'S',118);"
              "hotButton(hot,2,'D',119);"
              "hotButton(hot,3,'Q',120);"
              "hotButton(hot,4,'F',116);"
          )

          if t.count(old)!=1:
              raise SystemExit(
                  f'FAIRY HOTBAR SOURCE COUNT={t.count(old)}'
              )

          t=t.replace(
              old,
              new,
              1
          )

          d.write_text(
              t,
              encoding='utf-8'
          )

          print(
              'DUAL_BROWSER_FINALIZE_OK'
          )
          PY

      - name: Verify Fairy 800x600 and clean boot
        run: |
          set -euo pipefail

          test -s \
            fairy_player/index.html

          test -s \
            fairy_player/mkxp.js

          test -s \
            fairy_player/mkxp.wasm

          test -s \
            fairy_player/gameasync/Game.ini

          test -s \
            fairy_player/gameasync/Data/Scripts.rxdata

          test -s \
            fairy_player/gameasync/mapping.js

          test -s \
            fairy_player/gameasync/bitmap-map.js

          test -s \
            fairy_player/js/drive.js

          test -s \
            fairy_player/js/dpad.js

          grep -Fq \
            'slfairy_v105_engine' \
            fairy_player/index.html

          grep -Fq \
            'function isTouch()' \
            fairy_player/js/dpad.js

          grep -Fq \
            'function resizeCanvas()' \
            fairy_player/js/dpad.js

          grep -Fq \
            'function initSLTouchControls()' \
            fairy_player/js/dpad.js

          ! grep -Fq \
            'is_touch_device()' \
            fairy_player/index.html

          ! grep -Fq \
            "bindKey('d-up'" \
            fairy_player/index.html

          ! grep -Fq \
            'slAttackSheets' \
            fairy_player/index.html

          ! grep -Fq \
            'slAttackCoords' \
            fairy_player/index.html

          ! grep -R -Fq \
            'SL_SAVE_NAMESPACE_MIGRATION' \
            fairy_player

          ! grep -R -Fq \
            'sltransform-v106g' \
            fairy_player

          node --check \
            fairy_player/js/drive.js

          node --check \
            fairy_player/js/dpad.js

          ruby \
            -EUTF-8:UTF-8 \
            -rzlib \
            - \
            fairy_player/gameasync/Data/Scripts.rxdata \
            <<'RB'

          path=ARGV.fetch(0)

          scripts=Marshal.load(
            File.binread(path)
          )

          entries=scripts.select do |e|
            e.is_a?(Array) &&
              e.length>=3
          end

          resolution=entries.select do |e|
            e[1].to_s.start_with?(
              'Web Resolution'
            )
          end

          abort(
            "FAIRY RESOLUTION COUNT=#{resolution.size}"
          ) unless resolution.size==1

          entry=resolution.first

          code=Zlib::Inflate.inflate(
            entry[2]
          ).force_encoding(
            Encoding::UTF_8
          )

          abort(
            "FAIRY RESOLUTION NAME=#{entry[1]}"
          ) unless
            entry[1].to_s==
            'Web Resolution 800x600'

          abort(
            'FAIRY WIDTH 800 MISSING'
          ) unless code.include?(
            '$WINDOW_WIDTH = 800'
          )

          abort(
            'FAIRY HEIGHT 600 MISSING'
          ) unless code.include?(
            '$WINDOW_HEIGHT = 600'
          )

          abort(
            'FAIRY RESIZE 800x600 MISSING'
          ) unless code.include?(
            'Graphics.resize_screen(800,600)'
          )

          puts \
            'FAIRY_800x600_OK'
          RB

      - name: Build dual site
        run: |
          set -euo pipefail

          rm -rf \
            site

          mkdir -p \
            site/knight \
            site/elf

          cp -a \
            player/. \
            site/knight/

          cp -a \
            fairy_player/. \
            site/elf/

          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="ko">
          <head>
            <meta charset="utf-8">
            <meta
              name="viewport"
              content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
            >
            <meta
              http-equiv="Cache-Control"
              content="no-cache, no-store, must-revalidate"
            >
            <meta
              http-equiv="Pragma"
              content="no-cache"
            >
            <meta
              http-equiv="Expires"
              content="0"
            >

            <title>SLKnight + SLFairy</title>

            <style>
              html,
              body{
                margin:0;
                width:100%;
                height:100%;
                background:#080808;
                color:#fff;
                font-family:system-ui,sans-serif;
              }

              .wrap{
                height:100%;
                display:flex;
                align-items:center;
                justify-content:center;
                flex-direction:column;
                gap:20px;
              }

              .choices{
                display:flex;
                gap:16px;
              }

              button{
                width:150px;
                height:160px;
                border:1px solid #777;
                border-radius:14px;
                background:#171717;
                color:#fff;
                font-size:25px;
              }
            </style>
          </head>

          <body>
            <div class="wrap">

              <h1>
                캐릭터 선택
              </h1>

              <div class="choices">

                <button
                  onclick="location.href='knight/?v='+Date.now()"
                >
                  기사
                </button>

                <button
                  onclick="location.href='elf/?v='+Date.now()"
                >
                  요정
                </button>

              </div>

            </div>
          </body>
          </html>
          HTML

          touch \
            site/.nojekyll

          rm -rf \
            player \
            fairy_player

          mv \
            site \
            player

      - name: Final package check
        run: |
          set -euo pipefail

          for side in knight elf
          do
            test -s \
              player/$side/index.html

            test -s \
              player/$side/mkxp.js

            test -s \
              player/$side/mkxp.wasm

            test -s \
              player/$side/gameasync/Data/Scripts.rxdata

            test -s \
              player/$side/gameasync/mapping.js

            test -s \
              player/$side/gameasync/bitmap-map.js

            test -s \
              player/$side/js/drive.js

            test -s \
              player/$side/js/dpad.js
          done

          grep -Fq \
            'slknight_v14_engine' \
            player/knight/index.html

          grep -Fq \
            'slfairy_v105_engine' \
            player/elf/index.html

          ! grep -R -Fq \
            'SL_SAVE_NAMESPACE_MIGRATION' \
            player

          ! grep -R -Fq \
            'sltransform-v106g' \
            player

          echo \
            STABLE_FEATURE_DUAL_PACKAGE_OK

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player

  deploy:
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
