          )

          check(
            $hits.all?{|h|h[0,3]==[3,5,105]},
            'all strikes use selected monster native HP variable'
          )

          check(
            [a,b,c].all?{|e|SL411.in_range?(e,m,false)},
            'three distinct adjacent melee positions'
          )

          $game_map.data.blocked[[m.x,m.y]]=true

          check(
            SL411.in_range?(a,m,false),
            'melee contact is not walkability of target tile'
          )

          $game_map.data.blocked.clear

          SL411.mark_target(3,6)

          check(
            [a,b,c].all?{|e|SL411.target_for(e)==n},
