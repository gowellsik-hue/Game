name: build-slknight-web.yml | V1.34 | Healer Aggro, Teleport Reset, Holy Walk Buff Icon

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Restore V1.31 deployed game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 43376056564
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify V1.31 original
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build/v134
          tar -xf baseline/artifact.tar -C site
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path('site')
          before = {
              str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          assert len(before) == 5619, len(before)
          assert 'SLKnight V1.31' in (
              root/'knight/index.html'
          ).read_text('utf-8')
          assert "var version='V1.31';" in (
              root/'knight/js/sl-assets-v229r115.js'
          ).read_text('utf-8')
          assert (
              root/'knight/gameasync/Data/Scripts.rxdata'
          ).is_file()

          Path('build/v134/before.json').write_text(
              json.dumps(before, ensure_ascii=False),
              encoding='utf-8'
          )
          print('PASS V1.31 original, 5619 files')
          PY

          cp site/knight/gameasync/Data/Scripts.rxdata build/v134/Scripts.v131.rxdata
          cp site/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata build/v134/CommonEvents.v131.rxdata

      - name: Correct existing healer event branches
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          # encoding: UTF-8
          require 'zlib'

          path = 'site/knight/gameasync/Data/Scripts.rxdata'
          scripts = Marshal.load(File.binread(path))
          raise 'Wrong script count' unless scripts.size == 137

          changed = []

          patch = lambda do |name, edits|
            rows = scripts.select do |row|
              row.is_a?(Array) &&
                row[1].to_s.dup.force_encoding('UTF-8') == name
            end
            raise "Missing or duplicated #{name}" unless rows.size == 1

            row = rows.first
            source = Zlib::Inflate.inflate(row[2]).force_encoding('UTF-8')
            raise "Invalid encoding #{name}" unless source.valid_encoding?

            newline = source.include?("\r\n") ? "\r\n" : "\n"

            edits.each do |old_text, new_text|
              old_text = old_text.gsub("\n", newline)
              new_text = new_text.gsub("\n", newline)
              count = source.scan(old_text).size
              raise "#{name}: branch matches #{count}" unless count == 1
              source = source.sub(old_text, new_text)
            end

            RubyVM::InstructionSequence.compile(source)
            row[2] = Zlib::Deflate.deflate(source.b)
            changed << name
            puts "PASS #{name}"
          end

          refresh_old = '        c = page.condition'

          refresh_new = [
            '        c = page.condition',
            "        if @event.name == '[ID힐러 마법사]' &&",
            '           (!$game_switches[185] || !$game_actors[3] ||',
            '            $game_actors[3].hp <= 0) &&',
            "           !(c.self_switch_valid && c.self_switch_ch == 'A')",
            '          next',
            '        end'
          ].join("\n")

          erase_old = [
            '  def erase',
            '    @erased = true'
          ].join("\n")

          erase_new = [
            '  def erase',
            "    if @event.name == '[ID힐러 마법사]' &&",
            '       $game_actors[3] && $game_actors[3].hp <= 0 &&',
            "       $game_self_switches[[@map_id, @id, 'A']]",
            "      $game_self_switches[[@map_id, @id, 'A']] = false",
            '      $game_switches[188] = false',
            '    end',
            '    @erased = true'
          ].join("\n")

          aggro_row = scripts.find do |row|
            row.is_a?(Array) &&
              row[1].to_s.dup.force_encoding('UTF-8') == 'Game_Event'
          end
          raise 'Game_Event missing' unless aggro_row

          aggro_source = Zlib::Inflate.inflate(
            aggro_row[2]
          ).force_encoding('UTF-8')

          aggro_old = aggro_source[
            /^  def sl_combat_target.*?(?=^  def check_event_trigger_touch)/m
          ]
          raise 'Existing aggro method missing' unless aggro_old

          aggro_old = aggro_old.gsub("\r\n", "\n")
          aggro_lines = aggro_old.lines

          guard = 'return $game_player unless (@sl_target_actor_id && @sl_target_actor_id[0] == 3)'
          guards = aggro_lines.each_index.select do |i|
            aggro_lines[i].include?(guard)
          end
          raise 'Aggro guard ambiguous' unless guards.size == 1

          index = guards.first
          indent = aggro_lines[index][/^[ \t]*/]
          aggro_lines.insert(
            index,
            indent + 'return nil if @sl_target_actor_id && @sl_target_actor_id[0] == 0' + "\n"
          )

          tails = aggro_lines.each_index.select do |i|
            aggro_lines[i].strip == 'nil'
          end
          raise 'Aggro fallback ambiguous' unless tails.size == 1

          index = tails.first
          indent = aggro_lines[index][/^[ \t]*/]
          aggro_lines.insert(
            index,
            indent + '@sl_target_actor_id[0] = 0' + "\n"
          )

          aggro_new = aggro_lines.join

          update_old = "  def update\n"
          update_new = [
            '  def update',
            '    sl_combat_target if @sl_combat_event &&',
            '      @sl_target_actor_id && @sl_target_actor_id[0] == 3',
            ''
          ].join("\n")

          patch.call('Game_Event', [
            [refresh_old, refresh_new],
            [erase_old, erase_new],
            [aggro_old, aggro_new],
            [update_old, update_new]
          ])

          map_old = "    @sl_healer_event = @events.values.find { |e| e.instance_variable_get(:@event).name == '[ID힐러 마법사]' }"

          map_new = [
            '    if @sl_healer_event && $game_actors[3] &&',
            '       $game_actors[3].hp <= 0 &&',
            "       $game_self_switches[[@sl_healer_event.instance_variable_get(:@map_id), @sl_healer_event.id, 'A']]",
            '      @sl_healer_event.erase',
            '    end',
            map_old
          ].join("\n")

          patch.call('Game_Map', [
            [map_old, map_new]
          ])

          patch.call('Interpreter 5', [
            [
              [
                '  def command_231',
                '    # 픽쳐 번호를 취득',
                '    number = @parameters[0] + ($game_temp.in_battle ? 50 : 0)',
                '    # 지정 방법이 [직접 지정] 의 경우',
                '    if @parameters[3] == 0',
                '      x = @parameters[4]',
                '      y = @parameters[5]'
              ].join("\n"),
              [
                '  def command_231',
                '    # 픽쳐 번호를 취득',
                '    number = @parameters[0] + ($game_temp.in_battle ? 50 : 0)',
                '    # 지정 방법이 [직접 지정] 의 경우',
                '    if @parameters[3] == 0',
                '      x = @parameters[4]',
                '      y = @parameters[5]',
                '      if @parameters[0] == 30 &&',
                "         @parameters[1].start_with?('바포메트') &&",
                "         @parameters[1].end_with?('맞음') &&",
                '         @sl_attack_target && @sl_attack_target[0] == 3 &&',
                '         get_character(-1)',
                '        x += $game_map.sl_healer_event.screen_x - $game_player.screen_x',
                '        y += $game_map.sl_healer_event.screen_y - $game_player.screen_y',
                '      end'
              ].join("\n")
            ]
          ])

          raise "Wrong script changes #{changed.inspect}" unless
            changed.sort == ['Game_Event', 'Game_Map', 'Interpreter 5']

          File.binwrite(path, Marshal.dump(scripts))
          puts 'PASS existing healer page, erase and map-transition branches'
          RUBY

      - name: Correct existing healer hit-motion branch
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          # encoding: UTF-8
          require 'zlib'
          require 'digest'

          module RPG
            class CommonEvent; end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
            class AudioFile; end
            class State; end
          end

          [Color=Class.new, Tone=Class.new, Table=Class.new].each do |klass|
            klass.define_singleton_method(:_load) do |raw|
              object = allocate
              object.instance_variable_set(:@raw, raw)
              object
            end
            klass.define_method(:_dump) { |_limit| @raw }
          end

          prefix = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          path = 'site/knight/gameasync/Data/' + prefix + 'CommonEvents.rxdata'

          commons = Marshal.load(File.binread(path))
          raise 'Common event list missing' unless commons.size > 137

          ce57 = commons.fetch(57)
          ce137 = commons.fetch(137)

          raise 'CE57 missing' unless ce57
          raise 'CE137 missing' unless ce137

          original = commons.map do |event|
            event && Digest::SHA256.hexdigest(Marshal.dump(event))
          end

          original_list = ce57.instance_variable_get(:@list)
          hit_list = ce137.instance_variable_get(:@list)

          raise 'CE57 list missing' unless
            original_list.is_a?(Array) && !original_list.empty?

          raise 'CE137 list missing' unless
            hit_list.is_a?(Array) && !hit_list.empty?

          hit_routes = hit_list.select do |command|
            command.instance_variable_get(:@code) == 209 &&
              command.instance_variable_get(:@parameters)[0] == -1
          end

          raise 'Existing CE137 hit route missing' if hit_routes.empty?

          scripts = Marshal.load(
            File.binread('site/knight/gameasync/Data/Scripts.rxdata')
          )

          interpreter3 = scripts.find do |row|
            row[1].to_s.dup.force_encoding('UTF-8') == 'Interpreter 3'
          end

          interpreter2 = scripts.find do |row|
            row[1].to_s.dup.force_encoding('UTF-8') == 'Interpreter 2'
          end

          raise 'Interpreter 3 missing' unless interpreter3
          raise 'Interpreter 2 missing' unless interpreter2

          child_source = Zlib::Inflate.inflate(
            interpreter3[2]
          ).force_encoding('UTF-8')

          character_source = Zlib::Inflate.inflate(
            interpreter2[2]
          ).force_encoding('UTF-8')

          raise 'Original common-event target inheritance missing' unless
            child_source.include?(
              '@child_interpreter.instance_variable_set(:@sl_attack_target, @sl_attack_target)'
            )

          raise 'Original hit-character branch missing' unless
            character_source.include?('@sl_attack_target') &&
            character_source.include?('sl_healer_event')

          def event_command(code, indent, parameters=[])
            command = RPG::EventCommand.allocate
            command.instance_variable_set(:@code, code)
            command.instance_variable_set(:@indent, indent)
            command.instance_variable_set(:@parameters, parameters)
            command
          end

          branch = [
            event_command(
              111, 0,
              [12, '@sl_attack_target && @sl_attack_target[0] == 3']
            ),
            event_command(117, 1, [137]),
            event_command(115, 1),
            event_command(0, 1),
            event_command(412, 0)
          ]

          ce57.instance_variable_set(
            :@list,
            branch + original_list
          )

          differences = commons.each_with_index.filter_map do |event, index|
            current = event && Digest::SHA256.hexdigest(Marshal.dump(event))
            index if original[index] != current
          end

          raise "Unexpected CE changes #{differences.inspect}" unless
            differences == [57]

          File.binwrite(path, Marshal.dump(commons))
          puts 'PASS CE57 healer branch to existing CE137'
          puts 'PASS original knight branch and CE137 unchanged'
          RUBY

      - name: Update cache hashes and V1.34 version
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import re

          root = Path('site')
          data_dir = root/'knight/gameasync/Data'
          mapping = root/'knight/gameasync/mapping.js'
          content = mapping.read_text('utf-8')

          prefix = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          for name in [
              'Scripts.rxdata',
              prefix + 'CommonEvents.rxdata'
          ]:
              path = data_dir/name
              pattern = re.compile(
                  re.escape('Data/' + name + '?h=') +
                  r'[0-9a-f]{32}'
              )

              assert len(pattern.findall(content)) == 1, name

              content = pattern.sub(
                  'Data/' + name + '?h=' +
                  hashlib.md5(path.read_bytes()).hexdigest(),
                  content
              )

          mapping.write_text(content, 'utf-8')

          for name in ['index.html', 'knight/index.html']:
              path = root/name
              text = path.read_text('utf-8')
              assert 'V1.31' in text, name
              path.write_text(
                  text.replace('V1.31', 'V1.34').replace('v1.31', 'v1.34'),
                  'utf-8'
              )

          loader = root/'knight/js/sl-assets-v229r115.js'
          text = loader.read_text('utf-8')

          assert text.count("var version='V1.31';") == 1

          loader.write_text(
              text.replace(
                  "var version='V1.31';",
                  "var version='V1.34';"
              ),
              'utf-8'
          )
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Verify exact V1.34 changes
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          # encoding: UTF-8
          require 'zlib'
          require 'digest'

          original = Marshal.load(
            File.binread('build/v134/Scripts.v131.rxdata')
          )

          current = Marshal.load(
            File.binread('site/knight/gameasync/Data/Scripts.rxdata')
          )

          raise 'Script count changed' unless
            original.size == 137 && current.size == 137

          changed = original.zip(current).filter_map do |before, after|
            next if before == after
            raise 'Script metadata changed' unless
              before[0] == after[0] && before[1] == after[1]
            after[1].to_s.dup.force_encoding('UTF-8')
          end

          raise "Unexpected scripts #{changed.inspect}" unless
            changed.sort == ['Game_Event', 'Game_Map', 'Interpreter 5']

          current.each do |row|
            next unless row.is_a?(Array) && row[2].is_a?(String)
            name = row[1].to_s.dup.force_encoding('UTF-8')
            next unless changed.include?(name)
            RubyVM::InstructionSequence.compile(
              Zlib::Inflate.inflate(row[2]).force_encoding('UTF-8')
            )
          end

          puts 'PASS Game_Event, Game_Map and Interpreter 5 only'
          puts 'PASS Game_Character 3, existing aggro, teleport and all other scripts unchanged'

          module RPG
            class CommonEvent; end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
            class AudioFile; end
            class State; end
          end

          [Color=Class.new, Tone=Class.new, Table=Class.new].each do |klass|
            klass.define_singleton_method(:_load) do |raw|
              object = allocate
              object.instance_variable_set(:@raw, raw)
              object
            end
            klass.define_method(:_dump) { |_limit| @raw }
          end

          prefix = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          old_ce = Marshal.load(
            File.binread('build/v134/CommonEvents.v131.rxdata')
          )
          new_ce = Marshal.load(
            File.binread(
              'site/knight/gameasync/Data/' + prefix + 'CommonEvents.rxdata'
            )
          )

          raise 'Common event count changed' unless
            old_ce.size == new_ce.size

          differences = old_ce.zip(new_ce).each_with_index.filter_map do |pair, index|
            before, after = pair
            next if Marshal.dump(before) == Marshal.dump(after)
            index
          end

          raise "Unexpected common events #{differences.inspect}" unless
            differences == [57]

          old_list = old_ce[57].instance_variable_get(:@list)
          new_list = new_ce[57].instance_variable_get(:@list)

          raise 'Original CE57 commands changed' unless
            Marshal.dump(new_list[5..-1]) == Marshal.dump(old_list)

          raise 'CE137 changed' unless
            Marshal.dump(new_ce[137]) == Marshal.dump(old_ce[137])

          puts 'PASS CE57 branch only, original commands unchanged'
          puts 'PASS original CE137 and all other common events unchanged'
          RUBY

          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path('site')
          before = json.loads(
              Path('build/v134/before.json').read_text('utf-8')
          )

          after = {
              str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          prefix = 'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          expected = {
              'knight/gameasync/Data/Scripts.rxdata',
              prefix + 'CommonEvents.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'knight/index.html',
              'index.html'
          }

          changed = {
              path for path in before
              if before[path] != after.get(path)
          }

          assert len(after) == 5619
          assert set(after) == set(before)
          assert changed == expected, sorted(changed ^ expected)

          mapping = (
              root/'knight/gameasync/mapping.js'
          ).read_text('utf-8')

          for name in [
              'Scripts.rxdata',
              'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata'
          ]:
              data = (
                  root/'knight/gameasync/Data'/name
              ).read_bytes()

              assert (
                  'Data/' + name + '?h=' +
                  hashlib.md5(data).hexdigest()
              ) in mapping

          assert 'SLKnight V1.34' in (
              root/'knight/index.html'
          ).read_text('utf-8')

          assert "var version='V1.34';" in (
              root/'knight/js/sl-assets-v229r115.js'
          ).read_text('utf-8')

          print('PASS 5619 original files retained')
          print('PASS six approved files changed')
          print('PASS all original map data unchanged')
          print('PASS V1.34 version and cache hashes')
          PY

      - name: Publish V1.34 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
