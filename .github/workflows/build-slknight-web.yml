name: Deploy SLKnight mkxp-web V13.1 COMPACT

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  MKXP_REF: 07e1519f9a2b9100512c567e97455fa3c77a3221

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip ruby python3 ffmpeg imagemagick timidity freepats fonts-nanum

      - name: Checkout mkxp-web
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.MKXP_REF }}
          path: player
          sparse-checkout: |
            index.html
            js
            manifest.webmanifest
            mkxp.js
            mkxp.wasm
          sparse-checkout-cone-mode: false

      - name: Checkout tools
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: master
          path: tools
          sparse-checkout: |
            COPYING
            extra/rgss.rb
            extra/make_mapping.sh
          sparse-checkout-cone-mode: false

      - name: Install game
        run: |
          set -e
          curl -L --fail --retry 3 -o game.zip "$GAME_URL"
          echo "$GAME_SHA256  game.zip" | sha256sum -c -
          unzip -q game.zip -d src
          mkdir -p player/gameasync/Fonts player/preload
          cp -a src/SLKnight_Android_JoiPlay/. player/gameasync/
          cp tools/extra/rgss.rb player/gameasync/rgss.rb
          cp tools/COPYING player/COPYING-mkxp-web.txt
          cp /usr/share/fonts/truetype/nanum/NanumGothic.ttf player/gameasync/Fonts/NanumGothic.ttf
          cp /usr/share/fonts/truetype/nanum/NanumGothicBold.ttf player/gameasync/Fonts/NanumGothicBold.ttf
          rm -f player/gameasync/Save*.rxdata player/gameasync/README_Android.txt
          test "$(stat -c '%s' player/mkxp.js)" = 290574
          test "$(stat -c '%s' player/mkxp.wasm)" = 5217852

      - name: Fix mobile touch
        run: |
          cat > player/js/dpad.js <<'JS'
          function simulateKeyEvent(type,key,charCode){var e=document.createEventObject?document.createEventObject():document.createEvent("Events");if(e.initEvent)e.initEvent(type,true,true);e.keyCode=key;e.which=key;e.charCode=charCode||0;if(typeof JSEvents!=='undefined'&&JSEvents.eventHandlers&&JSEvents.eventHandlers.length){for(var i=0;i<JSEvents.eventHandlers.length;i++){var h=JSEvents.eventHandlers[i];if((h.target==Module['canvas']||h.target==window)&&h.eventTypeString==type)h.handlerFunc(e);}}else if(Module['canvas']){Module['canvas'].dispatchEvent?Module['canvas'].dispatchEvent(e):Module['canvas'].fireEvent("on"+type,e);}}
          const keyMap={},keysDown={};
          function releaseTouchKey(id){var elem=keysDown[id];if(elem&&keyMap[elem])simulateKeyEvent('keyup',keyMap[elem]);delete keysDown[id];}
          function releaseAllVirtualKeys(){Object.keys(keysDown).forEach(releaseTouchKey);Object.keys(keyMap).forEach(function(e){simulateKeyEvent('keyup',keyMap[e]);});}
          function bindKey(elem,key){keyMap[elem]=key;const ne=document.getElementById(elem);if(!ne)return;
            ne.addEventListener('touchstart',function(e){e.preventDefault();for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];releaseTouchKey(t.identifier);simulateKeyEvent('keydown',key);keysDown[t.identifier]=elem;}},{passive:false});
            ne.addEventListener('touchend',function(e){e.preventDefault();for(var i=0;i<e.changedTouches.length;i++)releaseTouchKey(e.changedTouches[i].identifier);},{passive:false});
            ne.addEventListener('touchcancel',function(e){e.preventDefault();for(var i=0;i<e.changedTouches.length;i++)releaseTouchKey(e.changedTouches[i].identifier);},{passive:false});
            ne.addEventListener('touchmove',function(e){e.preventDefault();for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i],hit=document.elementFromPoint(t.clientX,t.clientY),next=hit?hit.id:'',old=keysDown[t.identifier];if(old===next)continue;if(old&&keyMap[old])simulateKeyEvent('keyup',keyMap[old]);delete keysDown[t.identifier];if(next&&keyMap[next]){simulateKeyEvent('keydown',keyMap[next]);keysDown[t.identifier]=next;}}},{passive:false});}
          window.addEventListener('blur',releaseAllVirtualKeys);window.addEventListener('pagehide',releaseAllVirtualKeys);window.addEventListener('orientationchange',releaseAllVirtualKeys);document.addEventListener('visibilitychange',function(){if(document.hidden)releaseAllVirtualKeys();});
          function is_touch_device(){return'ontouchstart'in window||navigator.maxTouchPoints>0;}
          const resize=function(){const el=document.getElementById('canvas');if(!el)return;if(window.innerHeight>window.innerWidth){el.style.height='unset';el.style.width='100%';}else{el.style.width='unset';el.style.height='100%';}};window.addEventListener('resize',resize);window.addEventListener('load',resize);
          JS

      - name: Patch game scripts
        run: |
          ruby -EUTF-8:UTF-8 -rzlib - player/gameasync player/gameasync/Data <<'RB'
          game,data_dir=ARGV
          ini_path=File.join(game,'Game.ini'); ini=File.binread(ini_path)
          rel=ini[/^Scripts=(.+)$/i,1].to_s.strip.tr('\\','/'); abort 'Scripts entry missing' if rel.empty?
          source_path=File.join(game,rel); scripts=Marshal.load(File.binread(source_path))

          compat=<<'RUBY'
          class Win32API
            def initialize(*args); end
            def call(*args); 0; end
            def Call(*args); call(*args); end
          end

          Font.default_name="NanumGothic"

          module Audio
            def self.sl_stream(kind,*parts); puts((["SLAUDIO",kind]+parts.collect{|v|v.to_s}).join("|")); end
            def self.bgm_play(filename,volume=100,pitch=100); sl_stream("BGM_PLAY",filename,volume,pitch); end
            def self.bgm_stop; sl_stream("BGM_STOP"); end
            def self.bgm_fade(time); sl_stream("BGM_FADE",time); end
            def self.bgs_play(filename,volume=100,pitch=100); sl_stream("BGS_PLAY",filename,volume,pitch); end
            def self.bgs_stop; sl_stream("BGS_STOP"); end
            def self.bgs_fade(time); sl_stream("BGS_FADE",time); end
          end
          RUBY

          scripts.insert(0,[0,'Web Compatibility',Zlib::Deflate.deflate(compat)])

          def patch_begin_until(src)
            lines=src.lines
            lines.each_index do |i|
              m=lines[i].match(/^(\s*)end\s+until\s+(.+?)\s*$/); next unless m
              indent,cond=m[1],m[2]; j=i-1
              while j>=0
                if lines[j][/^\s*/]==indent && lines[j].strip=='begin'
                  lines[j]=indent+"loop do\n"
                  lines[i]=indent+"  break if #{cond}\n#{indent}end\n"
                  break
                end
                j-=1
              end
            end
            lines.join
          end

          def patch_scene_loop(src)
            lines=src.lines; i=0
            while i<lines.length
              unless lines[i].strip=='loop do'
                i+=1
                next
              end
              indent=lines[i][/^\s*/]; sig=[]; k=i+1
              while k<lines.length && sig.length<8
                s=lines[k].strip
                sig<<[k,s,lines[k][/^\s*/]] unless s.empty?||s.start_with?('#')
                k+=1
              end
              finish=nil
              finish=sig[6][0] if sig.length>=7 && sig[0][1]=='Graphics.update' && sig[1][1]=='Input.update' && sig[2][1]=='update' && sig[3][1]=='if $scene != self' && sig[4][1]=='break' && sig[5][1]=='end' && sig[6][1]=='end' && sig[6][2]==indent
              finish=sig[4][0] if finish.nil? && sig.length>=5 && sig[0][1]=='Graphics.update' && sig[1][1]=='Input.update' && sig[2][1]=='update' && sig[3][1]=='break if $scene != self' && sig[4][1]=='end' && sig[4][2]==indent
              lines[i..finish]=[indent+"end\n\n"+indent+"def dispose\n"] if finish
              i+=1
            end
            lines.join
          end

          id_sprite=<<'RUBY'
          class Game_Character
            attr_accessor :sprite_id
          end

          class Sprite_Character
            alias sl_id_original_update update

            def create_id_sprite(text)
              bitmap=Bitmap.new(160,16)
              bitmap.font.name="NanumGothic"
              bitmap.font.size=12
              bitmap.font.bold=false
              bitmap.font.color.set(0,0,0)
              bitmap.draw_text(0,-1,160,16,text,1)
              bitmap.draw_text(0,1,160,16,text,1)
              bitmap.draw_text(-1,0,160,16,text,1)
              bitmap.draw_text(1,0,160,16,text,1)
              bitmap.font.color.set(255,255,255)
              bitmap.draw_text(0,0,160,16,text,1)
              @_id_sprite=Sprite.new(self.viewport)
              @_id_sprite.bitmap=bitmap
              @_id_sprite.opacity=255
              @_id_sprite.ox=80
              @_id_sprite.oy=14
              @_id_sprite.x=self.x
              @_id_sprite.y=self.y-self.oy/2
              @_id_sprite.z=9999
              @_id_sprite_visible=true
            end

            def dispose_id_sprite
              if @_id_sprite!=nil
                @_id_sprite.bitmap.dispose if @_id_sprite.bitmap!=nil && !@_id_sprite.bitmap.disposed?
                @_id_sprite.dispose
                @_id_sprite=nil
              end
              @_id_sprite_visible=false
            end

            def update_id_sprite
              if @character.sprite_id!=nil && @character.sprite_id.to_s!=""
                create_id_sprite(@character.sprite_id) unless @_id_sprite_visible
                @_id_sprite.x=self.x
                @_id_sprite.y=self.y-self.oy
              elsif @_id_sprite_visible
                dispose_id_sprite
              end
            end

            def update
              sl_id_original_update
              update_id_sprite
            end
          end
          RUBY

          id_output=<<'RUBY'
          class Game_Event
            alias sl_id_original_event_refresh refresh

            def refresh
              sl_id_original_event_refresh
              text=@event.name.dup
              text.gsub!(/\[[Ii][Dd](.+?)\]/){@sprite_id=$1}
              @sprite_id=nil if @erased || @character_name==""
            end
          end

          class Game_Player
            alias sl_id_original_player_refresh refresh

            def refresh
              sl_id_original_player_refresh
              @sprite_id=nil if $game_party.actors.size>0
            end
          end
          RUBY

          browser_loop=<<'RUBY'
          $prev_scene=nil
          $sl_last_scene_name=nil

          def main_update_loop
            begin
              if $scene!=nil
                active_scene=$scene
                name=active_scene.class.to_s
                puts("SLFRAME|"+name) if $sl_last_scene_name!=name
                $sl_last_scene_name=name

                if active_scene!=$prev_scene
                  $prev_scene.dispose if $prev_scene!=nil && $prev_scene.respond_to?(:dispose)
                  active_scene.main
                  $prev_scene=active_scene
                  return if $scene!=active_scene
                end

                Graphics.update
                Input.update
                active_scene.update if $scene==active_scene
              end
            rescue Exception=>e
              puts("SLRUNTIMEERR|"+e.class.to_s+"|"+e.message.to_s)
              e.backtrace[0,12].each{|line|puts("SLRUNTIMEBT|"+line.to_s)} if e.respond_to?(:backtrace) && e.backtrace
            end
          end
          RUBY

          plane=resolution=ids=fonts=0
          font_rules=[
            [/(Font\.default_name\s*=\s*)\[\s*["'][^"']*["']\s*\]/n,'\1"NanumGothic"'],
            [/(Font\.default_name\s*=\s*)["'][^"']*["']/n,'\1"NanumGothic"'],
            [/(\.font\.name\s*=\s*)["'][^"']*["']/n,'\1"NanumGothic"'],
            [/(\bFONT_NAME\s*=\s*)["'][^"']*["']/n,'\1"NanumGothic"']
          ]

          scripts.each_with_index do |entry,index|
            next unless entry.is_a?(Array)&&entry.length>=3
            name=entry[1].to_s
            begin
              text=Zlib::Inflate.inflate(entry[2])
            rescue
              next
            end

            font_rules.each{|rx,rep|fonts+=text.scan(rx).length;text.gsub!(rx,rep)}

            if index==97
              text="# web resolution disabled\n"
              resolution+=1
            elsif index==111
              text=id_sprite
              ids+=1
            elsif index==112
              text=id_output
              ids+=1
            elsif text.match?(/^\s*class\s+Plane\s*<\s*Sprite\b/n)
              text="# native Plane used on web\n"
              plane+=1
            end

            text=patch_begin_until(text)
            text=patch_scene_loop(text) unless name=='Main'

            if name=='Main'
              text=browser_loop+text unless text.include?('def main_update_loop')
              text.sub!(/\n\s*while\s+\$scene\s*!=\s*nil\s*\r?\n\s*\$scene\.main\s*\r?\n\s*end\s*/m,"\n")
            end

            entry[2]=Zlib::Deflate.deflate(text)
          end

          abort "Plane patch=#{plane}" unless plane==1
          abort "resolution patch=#{resolution}" unless resolution==1
          abort "ID patch=#{ids}" unless ids==2
          abort "font patch=#{fonts}" unless fonts>=10

          def entry_for(scripts,suffix)
            hit=scripts.find{|e|e.is_a?(Array)&&e.length>=3&&(n=e[1].to_s.dup.force_encoding(Encoding::UTF_8))&&(n==suffix||n.end_with?("|#{suffix}"))}
            abort "missing #{suffix}" unless hit
            hit
          end

          def inflate(e)
            Zlib::Inflate.inflate(e[2]).force_encoding(Encoding::UTF_8)
          end

          def deflate(e,s)
            e[2]=Zlib::Deflate.deflate(s)
          end

          equip=entry_for(scripts,'Scene_Equip')
          text=inflate(equip)

          equip_rx=/\n    # 메인 루프\r?\n    loop do\r?\n.*?      if \$scene != self\r?\n\s*\$game_switches\[49\] = true\r?\n        break\r?\n      end\r?\n    end\r?\n    # 트란지션 준비/m
          equip_rep="\n    # Web: browser loop drives update.\n  end\n  def dispose\n    $game_switches[49] = true\n    # 트란지션 준비"

          count=0
          text=text.sub(equip_rx){count+=1;equip_rep}
          abort "Scene_Equip patch=#{count}" unless count==1
          deflate(equip,text)

          main=entry_for(scripts,'Main')
          abort 'defined? regression' if inflate(main).include?('defined?(')

          target=File.join(game,'Data','Scripts.rxdata')
          File.binwrite(target,Marshal.dump(scripts))
          File.delete(source_path) if File.expand_path(source_path)!=File.expand_path(target)

          lines=ini.split(/\r?\n/).map{|line|line=~/^Scripts=/i ? 'Scripts=Data\\Scripts.rxdata' : line=~/^Title=/i ? 'Title=SLKnight' : line}
          File.binwrite(ini_path,lines.join("\r\n")+"\r\n")

          class RawMarshalObject
            def self._load(data)
              o=allocate
              o.instance_variable_set(:@raw,data)
              o
            end

            def _dump(_depth)
              @raw
            end
          end

          class Tone < RawMarshalObject; end
          class Color < RawMarshalObject; end
          class Rect < RawMarshalObject; end
          class Table < RawMarshalObject; end

          module RPG
            class AudioFile; end
            class Map; end
            class Event
              class Page
                class Condition; end
                class Graphic; end
              end
            end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
          end

          def iv(o,n)
            o.instance_variable_get("@#{n}")
          end

          def setiv(o,n,v)
            o.instance_variable_set("@#{n}",v)
          end

          map_path=Dir.glob(File.join(data_dir,'*Map029.rxdata')).max_by{|p|File.size(p)}
          abort 'Map029 missing' unless map_path&&File.size(map_path)>1000

          map=Marshal.load(File.binread(map_path))
          smith=(iv(map,:events)||{})[30]
          abort 'blacksmith missing' unless smith
          patched=0

          (iv(smith,:pages)||[]).each do |page|
            route=iv(page,:move_route)
            next unless route

            (iv(route,:list)||[]).each do |cmd|
              next unless iv(cmd,:code)==44

              audio=(iv(cmd,:parameters)||[])[0]
              next unless audio

              n=iv(audio,:name).to_s.dup.force_encoding(Encoding::UTF_8)
              next unless n=='대장간 소리'||n=='대장간 소리2'

              vol=iv(audio,:volume).to_i
              pitch=iv(audio,:pitch).to_i
              code="dx=($game_player.x-@x).abs;dy=($game_player.y-@y).abs;d=[dx,dy].max;if d<=8;v=[#{vol}-d*3,6].max;$game_system.se_play(RPG::AudioFile.new(#{n.dump},v,#{pitch}));end"

              setiv(cmd,:code,45)
              setiv(cmd,:parameters,[code])
              patched+=1
            end
          end

          abort "blacksmith patch=#{patched}" unless patched==4
          File.binwrite(map_path,Marshal.dump(map))
          puts 'GAME_PATCH_OK'
          RB

      - name: Convert media and build mappings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,sys

          root=Path('player/gameasync/Audio')
          exts={'.mp3','.wav','.wma','.aac','.m4a','.flac','.mid','.midi'}
          failures=[]
          converted=0

          for src in [p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in exts]:
              out=src.with_suffix('.ogg')
              temp=None

              try:
                  inp=src

                  if src.suffix.lower() in {'.mid','.midi'}:
                      temp=src.with_name(src.name+'.wav')
                      subprocess.run(['timidity',str(src),'-Ow','-o',str(temp)],check=True)
                      inp=temp

                  subprocess.run(['ffmpeg','-nostdin','-v','error','-y','-i',str(inp),'-c:a','libvorbis','-q:a','4',str(out)],check=True)

                  if not out.exists() or out.stat().st_size==0:
                      raise RuntimeError('empty output')

                  if temp and temp.exists():
                      temp.unlink()

                  if src!=out and src.exists():
                      src.unlink()

                  converted+=1

              except Exception as e:
                  failures.append((str(src),str(e)))

                  if temp and temp.exists():
                      temp.unlink()

          if failures:
              for f,e in failures:
                  print(f+' -> '+e,file=sys.stderr)
              raise SystemExit(1)

          print('AUDIO_CONVERTED='+str(converted))

          gfx=Path('player/gameasync/Graphics')

          for src in [p for p in gfx.rglob('*') if p.is_file() and p.suffix.lower() in {'.bmp','.gif','.webp','.tif','.tiff'}]:
              out=src.with_suffix('.png')
              subprocess.run(['convert',str(src)+'[0]',str(out)],check=True)

              if not out.exists() or out.stat().st_size==0:
                  raise SystemExit('image conversion failed: '+str(src))

              src.unlink()
          PY

          cd player/gameasync
          bash ../../tools/extra/make_mapping.sh
          test -s mapping.js
          test -s bitmap-map.js
          grep -Fq 'Fonts/NanumGothic.ttf' mapping.js
          grep -Fq 'Fonts/NanumGothicBold.ttf' mapping.js
          cd ../..

          python3 - <<'PY'
          from pathlib import Path

          out=Path('player/preload/Data')
          out.mkdir(parents=True,exist_ok=True)

          for p in Path('player/gameasync/Data').glob('Map*.rxdata'):
              (out/(p.name+'.json')).write_text('[]\n')
          PY

      - name: Patch browser
        run: |
          ruby - player/index.html <<'RB'
          path=ARGV[0]
          html=File.read(path)

          bridge=<<'JS'
          <script>
          (function(){
            window.skfTargetFrameRate=50;
            var ch={BGM:new Audio(),BGS:new Audio()},pending=[];
            ch.BGM.loop=true;
            ch.BGS.loop=true;

            function urlFor(n){
              var p=String(n||'').replace(/\\\\/g,'/').replace(/\.(ogg|mp3|wav|wma|aac|m4a|flac|mid|midi)$/i,'');
              return encodeURI('gameasync/'+p+'.ogg?v=v131');
            }

            function safe(a){
              if(!a||!a.src)return;

              try{
                var p=a.play();

                if(p&&p.catch){
                  p.catch(function(){
                    if(pending.indexOf(a)<0)pending.push(a);
                  });
                }
              }catch(e){
                if(pending.indexOf(a)<0)pending.push(a);
              }
            }

            function retry(){
              var x=pending.slice();
              pending.length=0;
              x.forEach(safe);
            }

            ['touchstart','pointerdown','keydown','mousedown'].forEach(function(n){
              window.addEventListener(n,retry,{passive:true});
            });

            function stop(k){
              var a=ch[k];
              if(!a)return;

              a.pause();

              try{
                a.currentTime=0;
              }catch(e){}
            }

            function play(k,n,v,p){
              var a=ch[k];
              if(!a||!n)return;

              var u=urlFor(n);

              if(a.getAttribute('data-sl-src')!==u){
                a.pause();
                a.src=u;
                a.setAttribute('data-sl-src',u);
                a.load();
              }

              a.volume=Math.max(0,Math.min(1,Number(v||100)/100));
              a.playbackRate=Math.max(.5,Math.min(1.5,Number(p||100)/100));
              safe(a);
            }

            function marker(t){
              var i=t.indexOf('SLAUDIO|');
              if(i<0)return;

              var p=t.slice(i).split('|');
              var cmd=p[1]||'';
              var k=cmd.split('_')[0];

              if(/_PLAY$/.test(cmd)){
                play(k,p.slice(2,-2).join('|'),p[p.length-2],p[p.length-1]);
              }else if(/_STOP$/.test(cmd)){
                stop(k);
              }else if(/_FADE$/.test(cmd)){
                setTimeout(function(){stop(k);},Number(p[2])||0);
              }
            }

            function err(t){
              var p=document.getElementById('slerr');

              if(!p){
                p=document.createElement('pre');
                p.id='slerr';
                p.style='position:fixed;left:8px;top:8px;right:8px;max-height:70vh;overflow:auto;z-index:999999;background:#000;color:#fff;border:2px solid #d33;padding:10px;font:14px monospace;white-space:pre-wrap';
                document.body.appendChild(p);
              }

              p.textContent=String(t);
            }

            var log=console.log.bind(console);

            console.log=function(){
              var a=[].slice.call(arguments);
              var t=a.join(' ');

              try{
                marker(t);
              }catch(e){
                log('SLAUDIOJSERR|'+e);
              }

              if(/SLRUNTIMEERR|SLSCRIPTERR/.test(t))err(t);
              log.apply(console,a);
            };

            window.addEventListener('error',function(e){
              err('JS ERROR | '+e.message);
            });

            window.slAudioBridge=ch;
          })();
          </script>
          JS

          html.sub!('<head>',"<head>\n#{bridge}") or abort 'head target missing'

          pre=<<'JS'.strip
          preRun: [function(){createDummies();[['NanumGothic.ttf','gameasync/Fonts/NanumGothic.ttf?v=v131'],['NanumGothicBold.ttf','gameasync/Fonts/NanumGothicBold.ttf?v=v131']].forEach(function(x){var p='/game/Fonts/'+x[0];try{if(FS.analyzePath(p).exists)FS.unlink(p);}catch(e){}FS.createPreloadedFile('/game/Fonts',x[0],x[1],true,true,function(){console.log('SLFONTREADY|'+x[0]);},function(){console.error('SLFONTERR|'+x[0]);});});}],
          JS

          html.sub!('preRun: [createDummies],',pre) or abort 'preRun target missing'
          html.sub!(/var namespace = '[^']*';/,"var namespace = 'slknight_v131_compact';") or abort 'namespace missing'
          html.sub!(/var wTitle = '[^']*'/,"var wTitle = 'SLKnight V13.1 Compact'") or abort 'title missing'
          html.sub!('<script src="js/dpad.js"></script>','<script src="js/dpad.js?v=v131"></script>') or abort 'dpad missing'

          if html.include?('<title>MKXP</title>')
            html.sub!('<title>MKXP</title>','<title>SLKnight V13.1 Compact</title>')
          end

          File.write(path,html)
          puts 'BROWSER_OK'
          RB

          touch player/.nojekyll

      - name: Verify package
        run: |
          set -e
          test -s player/gameasync/Data/Scripts.rxdata
          test -s player/gameasync/mapping.js
          grep -Fq 'slknight_v131_compact' player/index.html
          grep -Fq 'window.skfTargetFrameRate=50' player/index.html
          grep -Fq 'window.slAudioBridge=ch' player/index.html
          grep -Fq 'SLFONTREADY' player/index.html

          ruby -EUTF-8:UTF-8 -rzlib - player/gameasync/Data/Scripts.rxdata <<'RB'
          a=Marshal.load(File.binread(ARGV[0]))

          def s(a,n)
            e=a.find{|x|x.is_a?(Array)&&x.length>=3&&(v=x[1].to_s.dup.force_encoding(Encoding::UTF_8))&&(v==n||v.end_with?("|#{n}"))}
            abort("missing #{n}") unless e
            Zlib::Inflate.inflate(e[2]).force_encoding(Encoding::UTF_8)
          end

          abort 'equip loop remains' if s(a,'Scene_Equip').match?(/loop do\s+Graphics\.update\s+Input\.update\s+update/m)
          abort 'defined regression' if s(a,'Main').include?('defined?(')
          abort 'ID layout wrong' unless s(a,'아이디 설정').include?('Bitmap.new(160,16)')

          compat=s(a,'Web Compatibility')
          abort 'audio marker missing' unless compat.include?('SLAUDIO') && compat.include?('BGM_PLAY') && compat.include?('BGS_PLAY')

          puts 'SCRIPT_VERIFY_OK'
          RB

          rm -rf player/.git
          du -sh player

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
