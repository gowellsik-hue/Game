          setiv(ce10,:list,ce10_list)
          setiv(ce10,:trigger,2)
          setiv(ce10,:switch_id,171)
          current[10]=ce10

          # CE107: enhanced green timer, isolated exactly like normal green.
          ce107=deep(pristine[107])
          warn107=[
            cmd(355,2,['$BufTime = 1']),
