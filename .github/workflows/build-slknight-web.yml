
name: V196 | SLFairy Safe Auto Attack + Native 640x480 Portrait

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  V194_SHA: 9492ce1d84fcbc288503309f88732ef6554ee634
  BASE178_SHA: 49e7f27f099c792ecb1cb379ac3c087f8bc91cf0
  Z105_SHA: e19659507b466b87a671949532b02484bc1faaef
  Z104_SHA: e044e1b6c53646b4c4f21f2dfee4967a68fabbc4
  DUAL_BASE_SHA: 04ce66ec99abc10f77143de53650685db8949532
  CURRENT_Z10_SHA: f545634bafbe1e1e55aaf6489126ad17b07da382
  BASELINE_SHA: c6815cd461dba60ec131898e6d5dd8690dd915ae
  X2_SHA: 6d941bd643dda87b8267ba466e108d1904c22331
  Z1_SHA: 008b6abe81074b7af877806b45f2314004a74f66
  Z3_SHA: 5a46988b048764e8a99700998c1f4ab96a3ec5c1
  CE_FIX_SHA: e30b0c41dc7fe7ec49fa17501d198339f7006cf6
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  FAIRY_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLFairy_Source_v1.zip
  FAIRY_SHA256: 67b88b5fe0cde3c9f2fada889815f9aa7d0fc94b378025529e9950d55151c70e
  FAIRY_7Z_PASSWORD: http://nemo838.tistory.com/
  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout V194 frozen source
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.V194_SHA }}', path: v194}
      - name: Checkout V178 frozen source
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.BASE178_SHA }}', path: base178}
      - name: Checkout z10.5 source
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.Z105_SHA }}', path: z105src}
      - name: Checkout z10.4 source
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.Z104_SHA }}', path: z104src}
      - name: Checkout dual base
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.DUAL_BASE_SHA }}', path: dualbase}
      - name: Checkout z10 source
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.CURRENT_Z10_SHA }}', path: z10src}
      - name: Checkout baseline
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.BASELINE_SHA }}', path: baseline}
      - name: Checkout auto base
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.X2_SHA }}', path: x2}
      - name: Checkout monster base z1
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.Z1_SHA }}', path: z1}
      - name: Checkout monster base z3
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.Z3_SHA }}', path: z3}
      - name: Checkout CE fix source
        uses: actions/checkout@v4
        with: {repository: gowellsik-hue/Game, ref: '${{ env.CE_FIX_SHA }}', path: cefix}
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake cmake curl ffmpeg freepats git imagemagick libtool make mm-common patch pkg-config python3 rake ruby timidity unzip wget xz-utils fonts-nanum p7zip-full nodejs
      - name: Checkout engine
        uses: actions/checkout@v4
        with: {repository: pulsejet/mkxp-web, ref: '${{ env.MKXP_SRC_REF }}', path: engine}
      - name: Cache engine dependencies
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-${{ runner.os }}-${{ env.EMSDK_VER }}-186

      - name: Extract frozen successful V194 stages
        run: |
          set -euo pipefail
          ruby -ryaml - <<'RB'
          steps = YAML.load_file('v194/.github/workflows/build-slknight-web.yml').fetch('jobs').fetch('build').fetch('steps')
          names = {
            'extract' => 'Extract 178 runtime steps',
            'rebuild' => 'Rebuild exact 178 runtime base',
            'freeze' => 'Freeze 178 dpad hashes',
            'knight' => 'Fix Knight potions transform and Assassin',
            'fairy' => 'Fix Fairy compatibility title and new game flow',
            'shell' => 'Fix browser shell without touching dpad',
            'package' => 'Build dual site',
            'verify' => 'Minimal package check'
          }
          names.each do |key, name|
            matches = steps.select { |s| s['name'] == name && s['run'] }
            abort "V194 stage mismatch: #{name}" unless matches.length == 1
            File.write("/tmp/v194_#{key}.sh", matches[0]['run'])
          end
          puts 'FROZEN_V194_STEPS_READY'
          RB

      - name: Rebuild working V194 without unsafe target hook
        run: |
          set -euo pipefail
          for step in extract rebuild freeze knight fairy shell; do
            bash -e "/tmp/v194_${step}.sh"
          done
          echo V194_BASE_READY_WITHOUT_LINE_HOOK

      - name: V196 restore native Fairy resolution and safe held-ATK targeting
        run: |
          set -euo pipefail
          ruby -EUTF-8:UTF-8 -rzlib - fairy_player/gameasync/Data/Scripts.rxdata <<'RB'
          path = ARGV.fetch(0)
          scripts = Marshal.load(File.binread(path))
          title = 'SLFairy Auto Target V196'
          abort 'V194 target unexpectedly present' if scripts.any? { |e| e.is_a?(Array) && e[1].to_s == 'SLFairy Line Target V194' }
          abort 'Duplicate target' if scripts.any? { |e| e.is_a?(Array) && e[1].to_s == title }
          resolution_name = '해상도'
          fixed_resolution = 0
          scripts.each do |entry|
            next unless entry.is_a?(Array) && entry.length >= 3
            next unless [resolution_name, 'Web Resolution 800x600'].include?(entry[1].to_s)
            source = Zlib::Inflate.inflate(entry[2]).force_encoding('UTF-8')
            source.gsub!('$WINDOW_WIDTH = 800', '$WINDOW_WIDTH = 640')
            source.gsub!('$WINDOW_HEIGHT = 600', '$WINDOW_HEIGHT = 480')
            source.gsub!(/Graphics\.resize_screen\(\s*800\s*,\s*600\s*\)/m, 'Graphics.resize_screen(640, 480)')
            source.gsub!(/\b800\s*,\s*600\b/, '640, 480')
            abort 'Unconverted resolution' if source.include?('$WINDOW_WIDTH = 800') || source.include?('$WINDOW_HEIGHT = 600')
            entry[2] = Zlib::Deflate.deflate(source)
            fixed_resolution += 1
          end
          # V194 reconstructs a single active resolution shim; the legacy named entry is optional.
          abort 'No Fairy resolution script found' unless fixed_resolution >= 1
          shim = scripts.find { |e| e.is_a?(Array) && e[1].to_s == 'Web Resolution 800x600' }
          abort 'Active Fairy resolution shim missing' unless shim
          shim_code = Zlib::Inflate.inflate(shim[2])
          abort 'Fairy resolution conversion missing' unless shim_code.include?('Graphics.resize_screen(640, 480)')
          code = <<'SRC'
          # SL_FAIRY_HELD_AUTO_V196
          # Keep native monster event combat and native attack animation.
          module SLFairyAutoV196
            BOW_RANGE = 8
            @last_frame = -1000

            def self.weapon_range
              party = $game_party
              actor = party && party.actors && party.actors[0]
              return 1 unless actor && $data_weapons
              ids = actor.respond_to?(:weapon_ids) ? actor.weapon_ids : [actor.weapon_id]
              ids = [ids] unless ids.is_a?(Array)
              ids.compact.each do |id|
                weapon = $data_weapons[id.to_i]
                return BOW_RANGE if weapon && weapon.name.to_s =~ /(활|궁|보우|bow|crossbow)/i
              end
              1
            end

            def self.enemy?(event)
              data = event.instance_variable_get(:@event)
              page = event.instance_variable_get(:@page)
              return false unless data && page && data.name.to_s.start_with?('[ID')
              return false if event.instance_variable_get(:@erased)
              return false if event.through || event.trigger != 2 || event.jumping?
              return false unless event.list && event.list.size > 1
              true
            end

            def self.target(player)
              map = $game_map
              return nil unless map && map.events
              dir = player.direction
              dx = (dir == 6 ? 1 : dir == 4 ? -1 : 0)
              dy = (dir == 2 ? 1 : dir == 8 ? -1 : 0)
              return nil if dx == 0 && dy == 0
              x = player.x
              y = player.y
              distance = 0
              limit = weapon_range
              events = map.events.values
              while distance < limit
                nx = x + dx
                ny = y + dy
                break unless map.valid?(nx, ny)
                blocked = false
                found = nil
                events.each do |event|
                  next unless event.x == nx && event.y == ny
                  if enemy?(event)
                    found = event
                    break
                  elsif !event.through && event.character_name.to_s != ''
                    blocked = true
                  end
                end
                return found if found
                break if blocked
                break unless map.passable?(x, y, dir)
                x = nx
                y = ny
                distance += 1
              end
              nil
            end

            def self.fire(player)
              return unless Input.press?(Input::C)
              return unless $game_system && $game_temp && $game_switches
              return if $game_switches[743]
              return if player.moving? || player.instance_variable_get(:@move_route_forcing)
              return if $game_temp.message_window_showing
              interpreter = $game_system.map_interpreter
              return if interpreter && interpreter.running?
              frame = Graphics.frame_count
              return if frame >= @last_frame && frame - @last_frame < 2
              enemy = target(player)
              return unless enemy
              return if enemy.instance_variable_get(:@starting)
              @last_frame = frame
              puts('SLAUTO|START|'+enemy.id.to_s+'|'+enemy.x.to_s+'|'+enemy.y.to_s+'|'+frame.to_s)
              enemy.start
              puts('SLAUTO|QUEUED|'+enemy.id.to_s+'|'+frame.to_s)
            end
          end

          class Game_Player
            alias sl_fairy_v196_original_update update
            def update
              sl_fairy_v196_original_update
              SLFairyAutoV196.fire(self)
            end
          end
          SRC
          RubyVM::InstructionSequence.compile(code, title)
          main_index = scripts.index { |e| e.is_a?(Array) && e[1].to_s == 'Main' }
          abort 'Fairy Main missing' unless main_index
          scripts.insert(main_index, [99999989, title, Zlib::Deflate.deflate(code)])
          File.binwrite(path, Marshal.dump(scripts))
          puts 'V196_FAIRY_NATIVE_640_SAFE_AUTO_OK'
          RB

      - name: V196 repair Fairy canvas and portrait controls
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          html_path = Path('fairy_player/index.html')
          html = html_path.read_text(encoding='utf-8')
          old_canvas = 'width="800" height="600"'
          if html.count(old_canvas) != 1:
              raise SystemExit('Fairy 800x600 canvas anchor missing')
          html = html.replace(old_canvas, 'width="640" height="480"', 1)
          html = html.replace('SLFairy 800', 'SLFairy 640')

          diagnostic = '''<script id="sl-v196-diagnostic">
          (function(){
            window.slV196LastAttack='none';
            var previous=console.log.bind(console);
            console.log=function(){
              var s=Array.prototype.join.call(arguments,' ');
              var i=s.indexOf('SLAUTO|');
              if(i>=0)window.slV196LastAttack=s.slice(i,i+120);
              if(s.indexOf('SLFRAME|Scene_Map')>=0){
                var spinner=document.getElementById('spinner');
                var progress=document.getElementById('progress');
                if(spinner)spinner.style.display='none';
                if(progress)progress.style.display='none';
              }
              previous.apply(console,arguments);
            };
            function report(message){
              var p=document.getElementById('slerr');
              if(!p)return;
              p.style.top='6px';p.style.bottom='auto';p.style.height='auto';
              p.style.maxHeight='75px';p.style.whiteSpace='normal';
              p.style.fontSize='11px';
              p.textContent=String(message)+' | '+window.slV196LastAttack;
            }
            window.addEventListener('error',function(e){
              var m=String(e && e.message || '');
              if(/memory access out of bounds|RuntimeError|unreachable/i.test(m))report('WASM ERROR | '+m);
            });
            window.addEventListener('unhandledrejection',function(e){
              var r=e && e.reason;
              var m=String(r && r.message || r || 'unknown');
              report('PROMISE ERROR | '+m);
            });
          })();
          </script>'''
          if html.count('</head>') != 1 or 'sl-v196-diagnostic' in html:
              raise SystemExit('Fairy diagnostic head anchor mismatch')
          html = html.replace('</head>', diagnostic + '</head>', 1)
          html_path.write_text(html, encoding='utf-8')

          pad_path = Path('fairy_player/js/dpad.js')
          pad = pad_path.read_text(encoding='utf-8')
          old_zone = 'box(zone,0,top+8,leftW-8,Math.max(1,h-16));'
          old_attack = 'centerBox(atk,rightLeft+rightW*0.70,top+Math.min(h*0.23,100),94,94);'
          old_cancel = 'centerBox(cancel,rightLeft+rightW*0.43,top+Math.min(h*0.46,190),62,62);'
          old_slots = "hot.style.top=Math.round(Math.max(top+12,top+h-hotH-18))+'px';"
          for old in (old_zone,old_attack,old_cancel,old_slots):
              if pad.count(old) != 1:
                  raise SystemExit('Fairy portrait control anchor missing: ' + old)
          pad = pad.replace(old_zone, 'const panelH=Math.max(110,Math.min(390,h-12));box(zone,0,top+10,leftW-8,panelH);', 1)
          pad = pad.replace(old_attack, 'centerBox(atk,rightLeft+rightW*0.66,top+Math.min(100,panelH*0.30),94,94);', 1)
          pad = pad.replace(old_cancel, 'centerBox(cancel,rightLeft+rightW*0.43,top+Math.min(200,panelH*0.58),62,62);', 1)
          pad = pad.replace(old_slots, "hot.style.top=Math.round(top+Math.min(Math.max(110,panelH-hotH-8),Math.max(0,h-hotH-8)))+'px';", 1)
          target_css = '#sl-pad[data-mode="side"] #sl-dpad{width:126px;height:126px}'
          if pad.count(target_css) != 1:
              raise SystemExit('Fairy landscape pad anchor missing')
          pad = pad.replace(target_css, target_css + '\n#sl-pad[data-mode="side"] #sl-joy-zone{display:none!important}', 1)
          pad_path.write_text(pad,encoding='utf-8')
          PY
          node --check fairy_player/js/dpad.js
          sha256sum -c /tmp/knight_dpad_178.sha
          echo FAIRY_CANVAS_AND_PAD_V196_OK

      - name: Assemble unchanged Knight and repaired Fairy
        run: |
          set -euo pipefail
          bash -e /tmp/v194_package.sh
          bash -e /tmp/v194_verify.sh

      - name: Validate Fairy runtime changes
        run: |
          set -euo pipefail
          test -s player/knight/gameasync/Data/Scripts.rxdata
          test -s player/elf/gameasync/Data/Scripts.rxdata
          grep -Fq 'width="640" height="480"' player/elf/index.html
          grep -Fq 'sl-v196-diagnostic' player/elf/index.html
          grep -Fq 'panelH=' player/elf/js/dpad.js
          ! grep -Fq 'SLFairy Line Target V194' player/elf/index.html
          node --check player/elf/js/dpad.js
          expected=$(cut -d' ' -f1 /tmp/knight_dpad_178.sha)
          actual=$(sha256sum player/knight/js/dpad.js | cut -d' ' -f1)
          test "$actual" = "$expected" || {
            echo 'Knight dpad was altered'; exit 1;
          }
          ruby -rzlib - player/elf/gameasync/Data/Scripts.rxdata <<'RB'
          scripts = Marshal.load(File.binread(ARGV.fetch(0)))
          titles = scripts.map { |entry| entry.is_a?(Array) ? entry[1].to_s : '' }
          abort 'V196 auto missing' unless titles.count('SLFairy Auto Target V196') == 1
          abort 'V194 auto remains' if titles.include?('SLFairy Line Target V194')
          shim = scripts.find { |entry| entry.is_a?(Array) && entry[1].to_s == 'Web Resolution 800x600' }
          abort 'Fairy resolution shim missing' unless shim
          body = Zlib::Inflate.inflate(shim[2])
          abort 'Fairy still 800x600' unless body.include?('Graphics.resize_screen(640, 480)')
          puts 'V196_RUNTIME_VALIDATED'
          RB

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with: {path: player}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
