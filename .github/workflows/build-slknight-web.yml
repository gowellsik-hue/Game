name: Deploy SLKnight mkxp-web V11 FULL FIX

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-slknight-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  LIVE_MKXP_REF: 07e1519f9a2b9100512c567e97455fa3c77a3221

jobs:
  build:
    name: Build SLKnight V11
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Install tools and Korean fonts
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            unzip \
            ruby \
            python3 \
            ffmpeg \
            imagemagick \
            file \
            timidity \
            freepats \
            fonts-nanum

          test -s /usr/share/fonts/truetype/nanum/NanumGothic.ttf
          test -s /usr/share/fonts/truetype/nanum/NanumGothicBold.ttf
          echo KOREAN_FONT_PACKAGE_OK

      - name: Checkout exact working mkxp-web
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.LIVE_MKXP_REF }}
          path: player
          sparse-checkout: |
            index.html
            js
            manifest.webmanifest
            mkxp.js
            mkxp.wasm
          sparse-checkout-cone-mode: false

      - name: Checkout mkxp-web tools
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: master
          path: mkxp-tools
          sparse-checkout: |
            COPYING
            extra/rgss.rb
            extra/make_mapping.sh
          sparse-checkout-cone-mode: false

      - name: Verify engine
        run: |
          set -e
          test "$(git -C player rev-parse HEAD)" = "$LIVE_MKXP_REF"
          test "$(stat -c '%s' player/mkxp.js)" = "290574"
          test "$(stat -c '%s' player/mkxp.wasm)" = "5217852"
          test -s player/index.html
          test -s player/js/drive.js
          test -s player/js/dpad.js
          test -s player/js/localforage.min.js
          echo LIVE_ENGINE_OK

      - name: Fix mobile touch stuck keys
        run: |
          set -e
          cat > player/js/dpad.js <<'EOF'
          function simulateKeyEvent(eventType, keyCode, charCode) {
              var e = document.createEventObject
                  ? document.createEventObject()
                  : document.createEvent("Events");

              if (e.initEvent) e.initEvent(eventType, true, true);
              e.keyCode = keyCode;
              e.which = keyCode;
              e.charCode = charCode || 0;

              if (
                  typeof JSEvents !== 'undefined' &&
                  JSEvents.eventHandlers &&
                  JSEvents.eventHandlers.length > 0
              ) {
                  for (var i = 0; i < JSEvents.eventHandlers.length; ++i) {
                      var h = JSEvents.eventHandlers[i];
                      if (
                          (h.target == Module['canvas'] || h.target == window) &&
                          h.eventTypeString == eventType
                      ) {
                          h.handlerFunc(e);
                      }
                  }
              } else if (Module['canvas']) {
                  if (Module['canvas'].dispatchEvent) {
                      Module['canvas'].dispatchEvent(e);
                  } else {
                      Module['canvas'].fireEvent("on" + eventType, e);
                  }
              }
          }

          const keyMap = {};
          const keysDown = {};

          function releaseTouchKey(id) {
              var elem = keysDown[id];
              if (elem && keyMap[elem]) {
                  simulateKeyEvent('keyup', keyMap[elem]);
              }
              delete keysDown[id];
          }

          function releaseAllVirtualKeys() {
              Object.keys(keysDown).forEach(function(id) {
                  releaseTouchKey(id);
              });

              Object.keys(keyMap).forEach(function(elem) {
                  simulateKeyEvent('keyup', keyMap[elem]);
              });
          }

          function bindKey(elem, key) {
              keyMap[elem] = key;
              const ne = document.getElementById(elem);
              if (!ne) return;

              ne.addEventListener('touchstart', function(e) {
                  e.preventDefault();
                  for (var i = 0; i < e.changedTouches.length; i++) {
                      var t = e.changedTouches[i];
                      releaseTouchKey(t.identifier);
                      simulateKeyEvent('keydown', key);
                      keysDown[t.identifier] = elem;
                  }
              }, { passive: false });

              ne.addEventListener('touchend', function(e) {
                  e.preventDefault();
                  for (var i = 0; i < e.changedTouches.length; i++) {
                      releaseTouchKey(e.changedTouches[i].identifier);
                  }
              }, { passive: false });

              ne.addEventListener('touchcancel', function(e) {
                  e.preventDefault();
                  for (var i = 0; i < e.changedTouches.length; i++) {
                      releaseTouchKey(e.changedTouches[i].identifier);
                  }
              }, { passive: false });

              ne.addEventListener('touchmove', function(e) {
                  e.preventDefault();

                  for (var i = 0; i < e.changedTouches.length; i++) {
                      var t = e.changedTouches[i];
                      var hit = document.elementFromPoint(t.clientX, t.clientY);
                      var newElem = hit ? hit.id : '';
                      var oldElem = keysDown[t.identifier];

                      if (oldElem === newElem) continue;

                      if (oldElem && keyMap[oldElem]) {
                          simulateKeyEvent('keyup', keyMap[oldElem]);
                      }

                      delete keysDown[t.identifier];

                      if (newElem && keyMap[newElem]) {
                          simulateKeyEvent('keydown', keyMap[newElem]);
                          keysDown[t.identifier] = newElem;
                      }
                  }
              }, { passive: false });
          }

          window.addEventListener('blur', releaseAllVirtualKeys);
          window.addEventListener('pagehide', releaseAllVirtualKeys);
          window.addEventListener('orientationchange', releaseAllVirtualKeys);

          document.addEventListener('visibilitychange', function() {
              if (document.hidden) releaseAllVirtualKeys();
          });

          function is_touch_device() {
              return ('ontouchstart' in window || navigator.maxTouchPoints > 0);
          }

          const resize = function() {
              const el = document.getElementById('canvas');
              if (!el) return;

              if (window.innerHeight > window.innerWidth) {
                  el.style.height = 'unset';
                  el.style.width = '100%';
              } else {
                  el.style.width = 'unset';
                  el.style.height = '100%';
              }
          };

          window.addEventListener('resize', resize);
          window.addEventListener('load', resize);
          EOF

          grep -Fq "touchcancel" player/js/dpad.js
          grep -Fq "releaseAllVirtualKeys" player/js/dpad.js
          echo MOBILE_STUCK_KEY_FIX_OK

      - name: Download clean SLKnight
        run: |
          set -e
          curl -L --fail --retry 3 -o slknight.zip "$GAME_URL"
          echo "$GAME_SHA256  slknight.zip" | sha256sum -c -
          rm -rf game
          mkdir -p game
          unzip -q slknight.zip -d game
          test -f game/SLKnight_Android_JoiPlay/Game.ini
          echo SLKNIGHT_DOWNLOAD_OK

      - name: Install SLKnight data and Korean fonts
        run: |
          set -e
          rm -rf player/gameasync player/preload
          mkdir -p player/gameasync player/preload
          cp -a game/SLKnight_Android_JoiPlay/. player/gameasync/
          cp mkxp-tools/extra/rgss.rb player/gameasync/rgss.rb
          cp mkxp-tools/COPYING player/COPYING-mkxp-web.txt
          rm -f player/gameasync/README_Android.txt
          rm -f player/gameasync/Save*.rxdata

          mkdir -p player/gameasync/Fonts
          cp /usr/share/fonts/truetype/nanum/NanumGothic.ttf \
             player/gameasync/Fonts/NanumGothic.ttf
          cp /usr/share/fonts/truetype/nanum/NanumGothicBold.ttf \
             player/gameasync/Fonts/NanumGothicBold.ttf

          test -s player/gameasync/Fonts/NanumGothic.ttf
          test -s player/gameasync/Fonts/NanumGothicBold.ttf
          echo KOREAN_FONT_FILES_INSTALLED
          echo SLKNIGHT_DATA_OK

      - name: Convert RGSS and patch web conflicts
        run: |
          set -e
          ruby -rzlib - <<'RB'
          game_dir = 'player/gameasync'
          ini_path = File.join(game_dir, 'Game.ini')
          ini = File.binread(ini_path)

          scripts_rel = ini[/^Scripts=(.+)$/i, 1]
          abort 'Scripts entry missing' if scripts_rel.nil?

          scripts_rel = scripts_rel.strip.tr('\\', '/')
          scripts_path = File.join(game_dir, scripts_rel)
          abort "Scripts missing: #{scripts_path}" unless File.file?(scripts_path)

          scripts = Marshal.load(File.binread(scripts_path))

          web_compat = <<'RUBY'
          puts("SLLOAD|000|WEB_COMPAT")

          class Win32API
            def initialize(*args)
            end

            def call(*args)
              0
            end

            def Call(*args)
              call(*args)
            end
          end

          Font.default_name = "NanumGothic"
          puts("SLFONTNAME|" + Font.default_name.to_s)
          RUBY

          scripts.insert(
            0,
            [0, 'Web Compatibility', Zlib::Deflate.deflate(web_compat)]
          )

          def patch_begin_until(source)
            lines = source.lines
            changed = 0
            i = 0

            while i < lines.length
              match = lines[i].match(/^(\s*)end\s+until\s+(.+?)\s*$/)

              if match
                indent = match[1]
                condition = match[2]
                j = i - 1

                while j >= 0
                  if lines[j][/^\s*/] == indent && lines[j].strip == 'begin'
                    lines[j] = indent + "loop do\n"
                    lines[i] = indent + "  break if " + condition + "\n" + indent + "end\n"
                    changed += 1
                    break
                  end
                  j -= 1
                end
              end

              i += 1
            end

            [lines.join, changed]
          end

          def patch_scene_loops(source)
            lines = source.lines
            changed = 0
            i = 0

            while i < lines.length
              unless lines[i].strip == 'loop do'
                i += 1
                next
              end

              indent = lines[i][/^\s*/]
              significant = []
              k = i + 1

              while k < lines.length && significant.length < 8
                stripped = lines[k].strip
                unless stripped.empty? || stripped.start_with?('#')
                  significant << [k, stripped, lines[k][/^\s*/]]
                end
                k += 1
              end

              end_index = nil

              if (
                significant.length >= 7 &&
                significant[0][1] == 'Graphics.update' &&
                significant[1][1] == 'Input.update' &&
                significant[2][1] == 'update' &&
                significant[3][1] == 'if $scene != self' &&
                significant[4][1] == 'break' &&
                significant[5][1] == 'end' &&
                significant[6][1] == 'end' &&
                significant[6][2] == indent
              )
                end_index = significant[6][0]
              elsif (
                significant.length >= 5 &&
                significant[0][1] == 'Graphics.update' &&
                significant[1][1] == 'Input.update' &&
                significant[2][1] == 'update' &&
                significant[3][1] == 'break if $scene != self' &&
                significant[4][1] == 'end' &&
                significant[4][2] == indent
              )
                end_index = significant[4][0]
              end

              if end_index
                lines[i..end_index] = [indent + "end\n\n" + indent + "def dispose\n"]
                changed += 1
                i += 1
                next
              end

              i += 1
            end

            [lines.join, changed]
          end

          scene_loop_count = 0
          begin_until_count = 0
          plane_patch_count = 0
          resolution_patch_count = 0
          id_patch_count = 0
          font_patch_count = 0

          scripts.each_with_index do |entry, index|
            next unless entry.is_a?(Array) && entry.length >= 3

            name = entry[1].to_s

            begin
              source = Zlib::Inflate.inflate(entry[2])
            rescue
              next
            end

            font_rules = [
              [/(Font\.default_name\s*=\s*)\[\s*["'][^"']*["']\s*\]/n, '\\1"NanumGothic"'],
              [/(Font\.default_name\s*=\s*)["'][^"']*["']/n, '\\1"NanumGothic"'],
              [/(\.font\.name\s*=\s*)["'][^"']*["']/n, '\\1"NanumGothic"'],
              [/(\bFONT_NAME\s*=\s*)["'][^"']*["']/n, '\\1"NanumGothic"']
            ]

            font_rules.each do |regex, replacement|
              matches = source.scan(regex).length
              if matches > 0
                puts("PATCH_WEB_FONT_INDEX=#{index}|COUNT=#{matches}")
                source.gsub!(regex, replacement)
                font_patch_count += matches
              end
            end

            if index == 97
              puts("PATCH_WEB_RESOLUTION_INDEX=#{index}")
              source = <<'RUBY'
          puts("SLPATCH|WEB_RESOLUTION_SCRIPT_DISABLED")
          RUBY
              resolution_patch_count += 1
            end

            if index == 111
              puts("PATCH_WEB_ID_SPRITE_INDEX=#{index}")
              source = <<'RUBY'
          puts("SLPATCH|WEB_ID_SPRITE_FIXED")

          class Game_Character
            attr_accessor :sprite_id
          end

          class Sprite_Character
            alias sl_id_original_update update

            def create_id_sprite(text)
              bitmap = Bitmap.new(240, 24)
              bitmap.font.name = "NanumGothic"
              bitmap.font.size = 14
              bitmap.font.bold = false
              bitmap.font.color.set(0, 0, 0)
              bitmap.draw_text(0, -1, 240, 22, text, 1)
              bitmap.draw_text(0, 1, 240, 22, text, 1)
              bitmap.draw_text(-1, 0, 240, 22, text, 1)
              bitmap.draw_text(1, 0, 240, 22, text, 1)
              bitmap.font.color.set(255, 255, 255)
              bitmap.draw_text(0, 0, 240, 22, text, 1)

              @_id_sprite = Sprite.new(self.viewport)
              @_id_sprite.bitmap = bitmap
              @_id_sprite.opacity = 255
              @_id_sprite.ox = 120
              @_id_sprite.oy = 18
              @_id_sprite.x = self.x
              @_id_sprite.y = self.y - self.oy / 2
              @_id_sprite.z = 9999
              @_id_sprite_visible = true
            end

            def dispose_id_sprite
              if @_id_sprite != nil
                if @_id_sprite.bitmap != nil && !@_id_sprite.bitmap.disposed?
                  @_id_sprite.bitmap.dispose
                end
                @_id_sprite.dispose
                @_id_sprite = nil
              end
              @_id_sprite_visible = false
            end

            def update_id_sprite
              if @character.sprite_id != nil && @character.sprite_id.to_s != ""
                unless @_id_sprite_visible
                  create_id_sprite(@character.sprite_id)
                end
                @_id_sprite.x = self.x
                @_id_sprite.y = self.y - self.oy
              elsif @_id_sprite_visible
                dispose_id_sprite
              end
            end

            def update
              sl_id_original_update
              update_id_sprite
            end
          end
          RUBY
              id_patch_count += 1
            end

            if index == 112
              puts("PATCH_WEB_ID_OUTPUT_INDEX=#{index}")
              source = <<'RUBY'
          puts("SLPATCH|WEB_ID_OUTPUT_FIXED")

          class Game_Event
            alias sl_id_original_event_refresh refresh

            def refresh
              sl_id_original_event_refresh
              text = @event.name.dup
              text.gsub!(/\[[Ii][Dd](.+?)\]/) do
                @sprite_id = $1
              end
              @sprite_id = nil if @erased
              @sprite_id = nil if @character_name == ""
            end
          end

          class Game_Player
            alias sl_id_original_player_refresh refresh

            def refresh
              sl_id_original_player_refresh
              @sprite_id = nil if $game_party.actors.size > 0
            end
          end
          RUBY
              id_patch_count += 1
            end

            if source.match?(/^\s*class\s+Plane\s*<\s*Sprite\b/n)
              puts("PATCH_NATIVE_PLANE_INDEX=#{index}")
              source = <<'RUBY'
          puts("SLPATCH|NATIVE_PLANE_ACTIVE")
          RUBY
              plane_patch_count += 1
            end

            patched = source.dup
            patched, count = patch_begin_until(patched)
            begin_until_count += count

            unless name == 'Main'
              patched, count = patch_scene_loops(patched)
              scene_loop_count += count
            end

            if name == 'Main'
              browser_loop = <<'RUBY'
          $prev_scene = nil
          $sl_last_scene_name = nil

          def main_update_loop
            begin
              if $scene != nil
                active_scene = $scene
                current_scene_name = active_scene.class.to_s

                if $sl_last_scene_name != current_scene_name
                  puts("SLFRAME|" + current_scene_name)
                  $sl_last_scene_name = current_scene_name
                end

                if active_scene != $prev_scene
                  if $prev_scene != nil && $prev_scene.respond_to?(:dispose)
                    $prev_scene.dispose
                  end

                  puts("SLMAINCALL|" + current_scene_name)
                  active_scene.main
                  puts("SLMAINREADY|" + current_scene_name)
                  $prev_scene = active_scene

                  if $scene != active_scene
                    next_name = $scene == nil ? "nil" : $scene.class.to_s
                    puts("SLSCENECHANGE|" + current_scene_name + "->" + next_name)
                    return
                  end
                end

                Graphics.update
                Input.update
                active_scene.update if $scene == active_scene
              else
                puts("SLRUNTIMEERR|SCENE_NIL")
                raise "END"
              end
            rescue Exception => e
              puts("SLRUNTIMEERR|" + e.class.to_s + "|" + e.message.to_s)
              if e.respond_to?(:backtrace) && e.backtrace
                e.backtrace[0, 16].each do |line|
                  puts("SLRUNTIMEBT|" + line.to_s)
                end
              end
            end
          end
          RUBY

              patched = browser_loop + patched unless patched.include?('def main_update_loop')
              patched.sub!(
                /\n\s*while\s+\$scene\s*!=\s*nil\s*\r?\n\s*\$scene\.main\s*\r?\n\s*end\s*/m,
                "\n"
              )
              patched.gsub!(
                '$scene = Scene_Title.new',
                "$scene = Scene_Title.new\nputs(\"SLMAIN|SCENE_TITLE_CREATED\")"
              )
            end

            trace_index = format('%03d', index)
            trace_name = name.gsub(/[\r\n|]/, ' ')
            puts("SLSCRIPTMAP|" + trace_index + "|" + trace_name)

            load_marker = ("SLLOAD|" + trace_index + "|" + trace_name).dump
            patched = "puts(" + load_marker + ")\n" + patched

            if index >= 95 && index <= 130
              error_prefix = ("SLSCRIPTERR|" + trace_index + "|" + trace_name + "|").dump
              backtrace_prefix = ("SLBACKTRACE|" + trace_index + "|").dump

              patched =
                "begin\n" +
                patched +
                "\nrescue Exception => e\n" +
                "  puts(" + error_prefix + " + e.class.to_s + '|' + e.message.to_s)\n" +
                "  if e.respond_to?(:backtrace) && e.backtrace\n" +
                "    e.backtrace[0,16].each do |line|\n" +
                "      puts(" + backtrace_prefix + " + line.to_s)\n" +
                "    end\n" +
                "  end\n" +
                "  raise\n" +
                "end\n"
            end

            entry[1] = trace_index + '|' + name
            entry[2] = Zlib::Deflate.deflate(patched)
          end

          abort 'Native Plane patch not applied exactly once' unless plane_patch_count == 1
          abort 'Web resolution patch not applied exactly once' unless resolution_patch_count == 1
          abort 'Web ID patches not applied exactly twice' unless id_patch_count == 2
          abort 'Font patches unexpectedly missing' unless font_patch_count >= 10

          main = scripts.find { |entry| entry[1].to_s.end_with?('|Main') }
          abort 'Main script missing' if main.nil?

          main_source = Zlib::Inflate.inflate(main[2])
          abort 'main_update_loop missing' unless main_source.b.include?('def main_update_loop'.b)

          target_scripts = File.join(game_dir, 'Data', 'Scripts.rxdata')
          File.binwrite(target_scripts, Marshal.dump(scripts))

          if File.expand_path(scripts_path) != File.expand_path(target_scripts)
            File.delete(scripts_path)
          end

          ini_lines = ini.split(/\r?\n/)
          ini_lines.map! do |line|
            if line =~ /^Scripts=/i
              'Scripts=Data\Scripts.rxdata'
            elsif line =~ /^Title=/i
              'Title=SLKnight'
            else
              line
            end
          end

          File.binwrite(ini_path, ini_lines.join("\r\n") + "\r\n")

          puts("SCRIPT_COUNT=#{scripts.length}")
          puts("NATIVE_PLANE_PATCHED=#{plane_patch_count}")
          puts("WEB_RESOLUTION_PATCHED=#{resolution_patch_count}")
          puts("WEB_ID_PATCHED=#{id_patch_count}")
          puts("WEB_FONT_PATCHED=#{font_patch_count}")
          puts("SCENE_LOOPS_PATCHED=#{scene_loop_count}")
          puts("BEGIN_UNTIL_PATCHED=#{begin_until_count}")
          puts('SLKNIGHT_V10_BASE_SCRIPT_PATCH_OK')
          RB

      - name: Verify V10 base script archive
        run: |
          set -e
          test -s player/gameasync/Data/Scripts.rxdata
          test -s player/gameasync/Fonts/NanumGothic.ttf
          test -s player/gameasync/Fonts/NanumGothicBold.ttf
          grep -Fq 'Scripts=Data\Scripts.rxdata' player/gameasync/Game.ini

          ruby -rzlib - <<'RB'
          scripts = Marshal.load(File.binread('player/gameasync/Data/Scripts.rxdata'))
          abort 'Too few scripts' if scripts.length < 100

          markers = {
            native_plane: false,
            resolution: false,
            id_sprite: false,
            id_output: false,
            main_loop: false,
            scene_switch: false,
            nanum: false,
            old_plane: false
          }

          scripts.each do |entry|
            next unless entry.is_a?(Array) && entry.length >= 3

            begin
              source = Zlib::Inflate.inflate(entry[2]).b
            rescue
              next
            end

            markers[:native_plane] = true if source.include?('NATIVE_PLANE_ACTIVE'.b)
            markers[:resolution] = true if source.include?('WEB_RESOLUTION_SCRIPT_DISABLED'.b)
            markers[:id_sprite] = true if source.include?('WEB_ID_SPRITE_FIXED'.b)
            markers[:id_output] = true if source.include?('WEB_ID_OUTPUT_FIXED'.b)
            markers[:main_loop] = true if source.include?('def main_update_loop'.b)
            markers[:scene_switch] = true if source.include?('SLSCENECHANGE|'.b)
            markers[:nanum] = true if source.include?('NanumGothic'.b)
            markers[:old_plane] = true if source.match?(/class\s+Plane\s*<\s*Sprite/n)
          end

          abort 'Native Plane marker missing' unless markers[:native_plane]
          abort 'Resolution patch missing' unless markers[:resolution]
          abort 'ID sprite patch missing' unless markers[:id_sprite]
          abort 'ID output patch missing' unless markers[:id_output]
          abort 'Browser loop missing' unless markers[:main_loop]
          abort 'Safe scene switch missing' unless markers[:scene_switch]
          abort 'NanumGothic reference missing' unless markers[:nanum]
          abort 'Old Plane subclass still present' if markers[:old_plane]

          puts('V10_BASE_SCRIPT_ARCHIVE_VERIFY_OK')
          RB

      - name: Apply V11 full game fixes
        run: |
          set -e

          cat > /tmp/v11_postpatch.rb <<'RB'
          # frozen_string_literal: true
          require 'zlib'

          scripts_path = ARGV[0]
          map_path = ARGV[1]
          abort 'usage: ruby v11_postpatch.rb Scripts.rxdata Map029.rxdata' unless scripts_path && map_path

          scripts = Marshal.load(File.binread(scripts_path))

          def source_for(entry)
            Zlib::Inflate.inflate(entry[2]).force_encoding(Encoding::UTF_8)
          end

          def set_source(entry, source)
            entry[2] = Zlib::Deflate.deflate(source)
          end

          def find_script!(scripts, suffix)
