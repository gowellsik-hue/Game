          # encoding: UTF-8
          require 'zlib'

          root = ARGV.fetch(0)
          mode = ARGV.fetch(1)
          path = File.join(root, 'gameasync', 'Data', 'Scripts.rxdata')
          scripts = Marshal.load(File.binread(path))

          def entry_for(scripts, name)
            scripts.find { |entry| entry.is_a?(Array) && entry.length >= 3 && entry[1].to_s == name }
          end

          def inflate(entry)
            Zlib::Inflate.inflate(entry[2]).force_encoding(Encoding::UTF_8)
          end

          def deflate(entry, source)
            entry[2] = Zlib::Deflate.deflate(source)
          end

          scripts.reject! { |entry| entry.is_a?(Array) && entry.length >= 3 && entry[1].to_s == 'Mobile Diablo Assist' }

          map = entry_for(scripts, 'Scene_Map')

          if map
            source = inflate(map)

            unless source.include?('SL_MOBILE_MAP_UNLOCK')
              source.sub!(/  def main\r?\n/, "  def main\n    $game_switches[49] = false if $game_switches\n    puts('SL_MOBILE_MAP_UNLOCK')\n")
            end

            source.gsub!(/\s*if \$game_switches\[49\] == false\r?\n\s*Input\.update\s*\r?\n\s*end\r?\n/, "\n     Input.update\n")
            deflate(map, source)
          end

          equip = entry_for(scripts, 'Scene_Equip')

          if equip
            source = inflate(equip)
            source.gsub!('$game_switches[49] = true', '$game_switches[49] = false')
            deflate(equip, source)
          end

          save = entry_for(scripts, 'Scene_Save')

          if save
            source = inflate(save)

            unless source.include?('save_file_async(filename)')
              source.sub!(/    write_save_data\(file\)\r?\n    exit/, "    write_save_data(file)\n    file.close\n    save_file_async(filename)")
            end

            unless source.include?('SL_MOBILE_SAVE_UNLOCK')
              source.sub!('    save_file_async(filename)', "    save_file_async(filename)\n    $game_switches[49] = false if $game_switches\n    puts('SL_MOBILE_SAVE_UNLOCK')")
            end

            source.gsub!('$scene = Scene_Menu.new(4)', '$scene = Scene_Map.new')
            deflate(save, source)
          end

          defaults = mode == 'knight' ? [114, 3, 17, 2] : [0, 0, 0, 0]

