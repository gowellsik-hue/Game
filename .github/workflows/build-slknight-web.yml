
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V1.3
# BASE: verified successful V1.2 run 42194617019
# Scope: healer movement only. Other maps, monsters, NPCs,
# spells, hires, buffs, speed rules, and animations remain unchanged.
# The existing workflow title below is intentionally unchanged.

name: build-slknight-web.yml | V1.2 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Restore successful V1.2
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 42194617019
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify inherited V1.2
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('site')
          files = {
              str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }
          assert len(files) == 5623, len(files)
          pre = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          for rel in (
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/Data/' + pre + 'Map029.rxdata',
              'knight/gameasync/Data/' + pre + 'CommonEvents.rxdata',
              'knight/gameasync/Data/' + pre + 'Animations.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html',
              'knight/index.html',
          ):
              assert rel in files, rel
          assert "var version='V1.2';" in (
              root / 'knight/js/sl-assets-v229r115.js'
          ).read_text('utf-8')
          (Path('build') / 'original.json').write_text(
              json.dumps(files), encoding='utf-8'
          )
          print('PASS 5623 V1.2 files verified')
          PY

      - name: Apply V1.3 healer-only movement
        shell: bash
        run: |
          set -euo pipefail
          cat > build/patch_v13.rb <<'RUBY'
          # encoding: utf-8
          require 'zlib'
          require 'digest'

          sp = 'site/knight/gameasync/Data/Scripts.rxdata'
          scripts = Marshal.load(File.binread(sp))
          original = Marshal.load(File.binread(sp))

          find_script = lambda do |name, expected_sha|
            ids = scripts.each_index.select do |i|
              scripts[i].is_a?(Array) && scripts[i][1].to_s == name
            end
            raise "Expected one #{name}" unless ids.size == 1
            i = ids.first
            source = Zlib::Inflate.inflate(scripts[i][2])
            raise "Unexpected #{name} source" unless
              Digest::SHA256.hexdigest(source) == expected_sha
            [i, source]
          end

          ci, cs = find_script.call(
            'Game_Character 3',
            '89c2bcfda38725fb2ca702c51599c160e094c2044544069b619a5dbfe2ab63ad'
          )
          ei, es = find_script.call(
            'Game_Event',
            '9cb9f02120e07c888cff5f3d9ecdbebdd431062d9230385b4f4da557940b878b'
          )

          anchor = "  def move_toward_player\r\n"
          raise 'Original follow method changed' unless cs.scan(anchor).size == 1
          healer = <<'HEALER'
              if @event && @event.name == '[ID힐러 마법사]' && $game_switches[185]
                d = (@x - $game_player.x).abs + (@y - $game_player.y).abs
                if d <= 2
                  if d == 0
                    case $game_player.direction
                    when 2 then move_up
                    when 4 then move_right
                    when 6 then move_left
                    when 8 then move_down
                    end
                  else
                    move_away_from_player
                  end
                  return
                end
                return if d <= 5
                if d >= 9
                  dx, dy = case $game_player.direction
                           when 2 then [0, -1]
                           when 4 then [1, 0]
                           when 6 then [-1, 0]
                           when 8 then [0, 1]
                           end
                  if dx && dy
                    [4, 3, 5].each do |n|
                      tx = $game_player.x + dx * n
                      ty = $game_player.y + dy * n
                      next unless $game_map.valid?(tx, ty)
                      next unless $game_map.passable?(tx, ty, 0, self)
                      occupied = $game_map.events.values.any? do |e|
                        e != self && e.x == tx && e.y == ty && e.character_name != ''
                      end
                      next if occupied
                      moveto(tx, ty)
                      break
                    end
                  end
                  return
                end
              end
          HEALER
          cs2 = cs.sub(anchor, anchor + healer.gsub("\n", "\r\n").b)

          through = "    @through = @page.through\r\n"
          raise 'Event page collision anchor changed' unless es.scan(through).size == 1
          es2 = es.sub(
            through,
            through + "    @through = false if @event.name == '[ID힐러 마법사]' && $game_switches[185]\r\n".b
          )

          File.binwrite('build/v13_character.rb', cs2)
          File.binwrite('build/v13_event.rb', es2)
          raise 'Character Ruby syntax error' unless system('ruby', '-c', 'build/v13_character.rb')
          raise 'Event Ruby syntax error' unless system('ruby', '-c', 'build/v13_event.rb')

          scripts[ci][2] = Zlib::Deflate.deflate(cs2)
          scripts[ei][2] = Zlib::Deflate.deflate(es2)
          changed = scripts.each_index.select do |i|
            scripts[i] != original[i]
          end
          raise "Unrelated scripts changed #{changed.inspect}" unless changed.sort == [ci, ei].sort

          File.binwrite(sp, Marshal.dump(scripts))
          saved = Marshal.load(File.binread(sp))
          raise 'Saved follow missing' unless Zlib::Inflate.inflate(saved[ci][2]) == cs2
          raise 'Saved collision missing' unless Zlib::Inflate.inflate(saved[ei][2]) == es2
          puts 'PASS V1.3: healer-only movement and collision, no new timer or AI'
          RUBY
          ruby -c build/patch_v13.rb
          ruby build/patch_v13.rb

      - name: Test V1.3 healer distance and teleport
        shell: bash
        run: |
          set -euo pipefail
          cat > build/test_v13.rb <<'RUBY'
          # encoding: utf-8
          class Game_Character
            attr_accessor :x, :y, :direction, :character_name
            def initialize(x=0,y=0,d=2,name='')
              @x,@y,@direction,@character_name=x,y,d,name
            end
            def moveto(x,y); @x,@y=x,y; end
            def moving?; false; end
          end
          class Game_Event < Game_Character
            def initialize(x,y,d=2,name='[ID힐러 마법사]')
              super(x,y,d,name)
              @event=Struct.new(:name).new(name)
            end
          end
          load 'build/v13_character.rb'
          class Game_Character
            def move_up(*); @y-=1; end
            def move_down(*); @y+=1; end
            def move_left(*); @x-=1; end
            def move_right(*); @x+=1; end
          end
          class FakeMap
            attr_accessor :events, :blocked
            def initialize; @events={}; @blocked=[]; end
            def valid?(x,y); x>=0 && y>=0 && x<100 && y<100; end
            def passable?(x,y,d,event=nil); !@blocked.include?([x,y]); end
          end
          def check(ok,msg); raise msg unless ok; end
          $game_switches=Hash.new(false)
          $game_switches[185]=true
          $game_map=FakeMap.new
          $game_player=Game_Character.new(20,20,2)
          healer=Game_Event.new(20,29)
          $game_map.events={1=>healer}
          healer.move_toward_player
          check([healer.x,healer.y]==[20,16], 'Teleporter must land 4 behind')
          healer.move_toward_player
          check([healer.x,healer.y]==[20,16], 'Teleporter cannot repeat immediately')
          (3..5).each do |d|
            healer.moveto(20,20+d)
            healer.move_toward_player
            check([healer.x,healer.y]==[20,20+d], 'Hold distance')
          end
          (6..8).each do |d|
            healer.moveto(20,20+d)
            healer.move_toward_player
            check([healer.x,healer.y]==[20,19+d], 'Native chase')
          end
          (1..2).each do |d|
            healer.moveto(20,20+d)
            healer.move_toward_player
            check([healer.x,healer.y]==[20,21+d], 'Retreat')
          end
          $game_map.blocked=[[20,16]]
          healer.moveto(20,29)
          healer.move_toward_player
          check([healer.x,healer.y]==[20,17], 'Blocked tile fallback')
          $game_map.blocked=[[20,16],[20,17],[20,15]]
          healer.moveto(20,29)
          healer.move_toward_player
          check([healer.x,healer.y]==[20,29], 'Unsafe tile teleport')
          $game_map.blocked=[]
          [2,4,6,8].each do |dir|
            $game_player.direction=dir
            dx,dy={2=>[0,-1],4=>[1,0],6=>[-1,0],8=>[0,1]}[dir]
            healer.moveto(40,40)
            healer.move_toward_player
            check([healer.x,healer.y]==[20+4*dx,20+4*dy], 'Direction')
          end
          other=Game_Event.new(20,29,2,'[ID오우거]')
          other.move_toward_player
          check([other.x,other.y]==[20,28], 'Other NPC changed')
          $game_switches[185]=false
          healer.moveto(20,29)
          healer.move_toward_player
          check([healer.x,healer.y]==[20,28], 'Unhired event changed')
          puts 'PASS V1.3 0..2 retreat, 3..5 hold, 6..8 chase'
          puts 'PASS 9+ teleport behind 4, 3/5 fallback, all four directions'
          puts 'PASS other NPC and unhired healer unaffected'
          RUBY
          ruby build/test_v13.rb

      - name: Refresh V1.3 game cache and version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re
          root=Path('site')
          mapping=root/'knight/gameasync/mapping.js'
          source=mapping.read_text('utf-8')
          rel='Data/Scripts.rxdata'
          digest=hashlib.md5((root/'knight/gameasync'/rel).read_bytes()).hexdigest()
          source,count=re.subn(re.escape(rel)+r'\?h=[0-9a-f]{32}',
                               lambda _: rel+'?h='+digest,source)
          assert count == 1, count
          mapping.write_text(source,encoding='utf-8')

          loader=root/'knight/js/sl-assets-v229r115.js'
          source=loader.read_text('utf-8')
          assert source.count("var version='V1.2';") == 1
          loader.write_text(source.replace("var version='V1.2';",
                                           "var version='V1.3';"),encoding='utf-8')

          for rel in ('index.html','knight/index.html'):
              path=root/rel
              source=path.read_text('utf-8')
              assert 'V1.2' in source,rel
              source=source.replace('V1.2','V1.3').replace('?v=v1.2','?v=v1.3')
              path.write_text(source,encoding='utf-8')
          print('PASS V1.3 caches and labels')
          PY
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Verify no unrelated game changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          orig=json.loads(Path('build/original.json').read_text('utf-8'))
          now={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
               for p in root.rglob('*') if p.is_file()}
          assert len(now)==5623 and set(now)==set(orig)
          changed={p for p in orig if now[p]!=orig[p]}
          allowed={
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html',
              'knight/index.html',
          }
          assert changed==allowed,sorted(changed ^ allowed)
          assert 'V1.3' in (root/'knight/index.html').read_text('utf-8')
          print('PASS only five approved files changed')
          print('PASS all 41 healer map files preserved')
          print('PASS original monsters, magic, drops, animations unchanged')
          PY

      - name: Publish V1.3 game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
