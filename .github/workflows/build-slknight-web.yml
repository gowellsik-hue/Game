          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          changed_data=['Scripts.rxdata',prefix+'CommonEvents.rxdata']
          changed_data += [prefix+f'Map{i:03d}.rxdata' for i in (37,41,42)]
          for filename in changed_data:
            f=root/'knight/gameasync/Data'/filename
            pattern=r'(Data/'+re.escape(filename)+r'\?h=)[0-9a-f]{32}'
            text,count=re.subn(pattern,lambda m:m.group(1)+hashlib.md5(f.read_bytes()).hexdigest(),text)
            assert count==1,('Missing game data cache mapping',filename,count)
          mapping.write_text(text,encoding='utf8')
          for filename in ('index.html','knight/index.html'):
            p=root/filename
            s=p.read_text('utf8')
            assert 'V229R121' in s
            p.write_text(s.replace('V229R121','V229R131').replace('v229r121','v229r131'),encoding='utf8')
          runtime=root/'knight/js/sl-assets-v229r115.js'
          data=runtime.read_text('utf8')
          assert data.count("var version='V229R121';")==1
          runtime.write_text(data.replace("var version='V229R121';","var version='V229R131';"),encoding='utf8')
          before=json.loads(Path('build/before.json').read_text('utf8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert before.keys()==after.keys() and len(after)==5566
          changed={k for k in before if before[k]!=after[k]}
          expected={'index.html','knight/index.html','knight/gameasync/mapping.js',
            'knight/gameasync/Data/Scripts.rxdata','knight/js/sl-assets-v229r115.js'}
          expected.update('knight/gameasync/Data/'+name for name in changed_data[1:])
          assert changed==expected,('Unexpected changed assets',changed^expected)
          for name in before:
            if (name.startswith('knight/assets/') or
                name.startswith('knight/gameasync/Graphics/') or
                (name.startswith('knight/gameasync/Data/') and name not in expected) or
                name in ('knight/js/dpad.js','knight/js/drive.js')):
              assert before[name]==after[name],('Protected game content modified',name)
          assert 'js/sl-assets-v229r115.js?v=v229r131' in (root/'knight/index.html').read_text('utf8')
          print('PASS original map045/046, tilesets, sprites, walls, cleaned 2F artwork byte-identical')
          print('PASS exactly 9 files changed: scripts, common events, 3 loot maps, caches and version')
          AUDIT
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/dpad.js
          node --check site/knight/js/drive.js

      - name: V229R131 Publish no added runtime movement code
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

