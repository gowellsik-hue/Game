          RubyVM::InstructionSequence.compile(move_code)
          move_entry[2]=Zlib::Deflate.deflate(move_code.gsub("\n","\r\n").b)

          speed_entry=scripts.find{|a|a.is_a?(Array)&&a[1]=='V229 Unified Speed Rules'.b}
          check(!speed_entry.nil?,'existing speed-buff controller')
          speed_code=Zlib::Inflate.inflate(speed_entry[2]).force_encoding('UTF-8')
          old_speed=<<'V113_SPEED_OLD'
                # Game_Character#update_move uses 2 ** @move_speed map units/frame.
                # Non-integer speed is required to preserve baphomet's 1.5x exactly.
                step = BASE_MOVE_STEP + Math.log(move_rate) / Math.log(2.0)
                player.instance_variable_set(:@move_speed, step)
          V113_SPEED_OLD
          new_speed=<<'V113_SPEED_NEW'
                player.instance_variable_set(:@sl_move_rate, move_rate)
          V113_SPEED_NEW
          speed_code=exact_source_replace(speed_code,old_speed,new_speed,'old logarithmic rate conversion')
          RubyVM::InstructionSequence.compile(speed_code)
          speed_entry[2]=Zlib::Deflate.deflate(speed_code.b)
          puts 'PASS V1.13 shared movement and existing speed buffs'

          # Extend the original hotbar selector; inventory/use paths stay intact.
          # Native MouseMiddle/MouseRight are already bound in the shipped engine.
          # Do not use MouseLeft: ordinary touch can emulate a left click.
          hot=scripts.find{|it|it.is_a?(Array)&&it[1]=='Mobile Hotbar'}
          check(!hot.nil?,"original item hotbar")
          hot_code=Zlib::Inflate.inflate(hot[2]).force_encoding('UTF-8')
          check(hot_code.include?('KEYS=[Input::X,Input::Y,Input::Z,Input::L,Input::F6]'),"original 1-5 native inputs")
          selector_before="    return 6 if Keyboard.testkey(74)\n    return 7 if Keyboard.testkey(75)\n    return 8 if Keyboard.testkey(76)\n"
          selector_after="    return 8 if Input.trigger?(Input::MOUSEMIDDLE) && Input.trigger?(Input::MOUSERIGHT)\n" +
                         "    return 6 if Input.trigger?(Input::MOUSEMIDDLE)\n" +
                         "    return 7 if Input.trigger?(Input::MOUSERIGHT)\n"
          check(hot_code.scan(selector_before).size==1,"original 7-9 selector missing")
          hot_code=hot_code.sub(selector_before,selector_after)
          check(hot_code.include?('def self.assign_from_window(window)'),"original inventory assignment")
          check(hot_code.include?('def self.use_triggered'),"original item use")
          check(hot_code.include?('for i in 0...9'),"original 9-slot display")
          hot[2]=Zlib::Deflate.deflate(hot_code.b)

          # The existing touch tap handler remains; only 7-9 deliver native
          # mouse middle/right events rather than unavailable J/K/L key codes.
          dpad_path=File.join(SITE,'knight/js/dpad.js')
          dpad=File.binread(dpad_path)
          key_start="function simulateKeyEvent(type,keyCode,charCode){\n  var e=document.createEventObject?document.createEventObject():document.createEvent('Events');\n  if(e.initEvent)e.initEvent(type,true,true);\n  e.keyCode=keyCode;e.which=keyCode;e.charCode=charCode||0;\n"
          key_new="function simulateKeyEvent(type,keyCode,charCode){\n" +
                  "  if(keyCode===-2||keyCode===-3){\n" +
                  "    const button=-keyCode-1;\n" +
                  "    type=type==='keydown'?'mousedown':'mouseup';\n" +
                  "    var e=new MouseEvent(type,{bubbles:true,cancelable:true,button:button,buttons:type==='mousedown'?(button===1?4:2):0});\n" +
                  "  }else{\n" +
                  "    var e=document.createEventObject?document.createEventObject():document.createEvent('Events');\n" +
                  "    if(e.initEvent)e.initEvent(type,true,true);\n" +
                  "    e.keyCode=keyCode;e.which=keyCode;e.charCode=charCode||0;\n" +
                  "  }\n"
          check(dpad.scan(key_start).size==1,'original native event bridge missing')
          dpad=dpad.sub(key_start,key_new)
          # SDL2 routes mouseup through the document target; release must reach it.
          release_before="if((h.target==Module['canvas']||h.target==window)&&h.eventTypeString==type)h.handlerFunc(e);"
          release_after="if((h.target==Module['canvas']||h.target==window||(type==='mouseup'&&h.target==document))&&h.eventTypeString==type)h.handlerFunc(e);"
          check(dpad.scan(release_before).size==1,'original SDL2 mouse release handler')
          dpad=dpad.sub(release_before,release_after)
          tap_before="b.classList.add('pressed');pulseKey(key,120);"
          tap_after="b.classList.add('pressed');if(Array.isArray(key)){key.forEach(k=>pulseKey(k,120));}else{pulseKey(key,120);}"
          check(dpad.scan(tap_before).size==1,'original touch tap handler missing')
          dpad=dpad.sub(tap_before,tap_after)
          slot_before="hotButton(hot,6,'J',74);hotButton(hot,7,'K',75);hotButton(hot,8,'L',76);"
          slot_after="hotButton(hot,6,'J',-2);hotButton(hot,7,'K',-3);hotButton(hot,8,'L',[-2,-3]);"
          check(dpad.scan(slot_before).size==1,'original touch 7-9 buttons missing')
          dpad=dpad.sub(slot_before,slot_after)
          File.binwrite(dpad_path,dpad)
          File.binwrite(sp,Marshal.dump(scripts))
          File.binwrite(cp_path,Marshal.dump(ces))
          MAP_IDS.each{|mid|File.binwrite(file(mid),Marshal.dump(maps.fetch(mid)))}

          # Refresh only actual edited data assets' cache references.
          mapping_path=File.join(SITE,'knight/gameasync/mapping.js')
          mapping=File.binread(mapping_path).force_encoding('UTF-8')
          ([sp,cp_path]+MAP_IDS.map{|id|file(id)}).each do |path|
            rel='Data/'+File.basename(path)
            digest=Digest::MD5.file(path).hexdigest
            regex=Regexp.new(Regexp.escape(rel)+'\?h=[a-f0-9]{32}')
            check(mapping.scan(regex).size==1,"cache #{rel}")
            mapping.gsub!(regex,"#{rel}?h=#{digest}")
          end
          File.binwrite(mapping_path,mapping)

          # V1.14 label updates ONLY when every data validation has passed.
          loader=File.join(SITE,'knight/js/sl-assets-v229r115.js')
          t=File.binread(loader)
          check(t.include?("var version='V1.4';"),'V1.4 loader marker')
          File.binwrite(loader,t.sub("var version='V1.4';","var version='V1.14';"))
          ['index.html','knight/index.html'].each do |name|
            path=File.join(SITE,name);t=File.binread(path)
            check(t.include?('V1.4'),"V1.4 title #{name}")
            File.binwrite(path,t.gsub('V1.4','V1.14').gsub('v1.4','v1.14'))
          end
          puts "PASS V1.14 native patch: #{MAP_IDS.length} maps, #{GROUPS.length} existing shared drop CEs, #{LOCAL.length} local death events, #{added} additional item rolls"
          puts 'PASS Fire Ghost V1.4 native slv437 drops restored without duplication'
          puts 'PASS inventory, map collision and Queen preserved; healer follow updated'
          RUBY_V111
          ruby -c build/patch_v111.rb
          ruby build/patch_v111.rb site
          node --check site/knight/js/dpad.js

      - name: Verify all non-target game files unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_V111_VERIFY'
          from pathlib import Path
          import hashlib, json
          root=Path('site')
          before=json.loads(Path('build/v14_manifest.json').read_text('utf8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert len(after)==5623 and set(after)==set(before)
          pre='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          mods={'knight/gameasync/Data/Scripts.rxdata',
                pre+'CommonEvents.rxdata',
                'knight/gameasync/mapping.js',
                'knight/js/sl-assets-v229r115.js',
                'index.html','knight/index.html'}
          mods|={pre+f'Map{mid:03d}.rxdata' for mid in (3,4,31,35,37,41,42)}
          mods|={'knight/js/dpad.js'}
          changed={k for k in after if before[k]!=after[k]}
          assert changed==mods, {'missing':sorted(mods-changed),'unexpected':sorted(changed-mods)}
          for i in range(7):
            p=f'knight/gameasync/Graphics/Pictures/169-0-{i:03d}.png'
            assert p in before and before[p]==after[p],p
          snd='knight/gameasync/Audio/SE/\uD154\uB9AC\uD3EC\uD2B8.ogg'
          assert snd in before and before[snd]==after[snd],snd
          assert before[pre+'Map025.rxdata']==after[pre+'Map025.rxdata']
          assert before['knight/mkxp.js']==after['knight/mkxp.js']
          assert before['knight/mkxp.wasm']==after['knight/mkxp.wasm']
          mapping=(root/'knight/gameasync/mapping.js').read_text('utf8')
          for rel in sorted(mods):
            if '/Data/' not in rel:continue
            file=root/rel
            digest=hashlib.md5(file.read_bytes()).hexdigest()
            assert mapping.count('Data/'+file.name+'?h='+digest)==1,rel
          assert "var version='V1.14';" in (root/'knight/js/sl-assets-v229r115.js').read_text('utf8')
          print('PASS V1.14 changed exactly',len(changed),'files')
          print('PASS Queen, all unrelated monsters and original 1-6 hotbar unchanged')
          PY_V111_VERIFY

      - name: Publish V1.14
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
