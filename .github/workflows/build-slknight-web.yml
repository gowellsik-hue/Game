          end
          class Sprite
           attr_accessor :bitmap,:x,:y,:z,:opacity,:zoom_x,:zoom_y,:ox,:oy
           attr_reader :src_rect
           def initialize(*a);@src_rect=Rect.new;@disposed=false;@opacity=255;@ox=0;@oy=0;end
           def dispose;@disposed=true;end
           def disposed?;@disposed;end
          end
          class Bitmap
           def initialize(path)
            if path.is_a?(String) && path.start_with?('Graphics/Panoramas/SLTI_')
             raise "Missing original texture: #{path}" unless File.exist?(File.join(ENV.fetch('R49_SITE'), 'knight/gameasync',path+'.png'))
            end
