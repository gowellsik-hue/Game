name: Deploy SLKnight Asset Path Fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-slknight-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  SITE_URL: https://gowellsik-hue.github.io/Game

jobs:
  build:
    name: Fix Pages asset path and add boot diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Install tools
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y curl python3

      - name: Download current successful deployment
        run: |
          set -e
          mkdir -p dist/assets

          curl -L --fail --retry 3 \
            -H 'Cache-Control: no-cache' \
            "${SITE_URL}/?run=${GITHUB_RUN_ID}" \
            -o dist/index.html

          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          import os
          import re

          base = os.environ["SITE_URL"].rstrip("/") + "/"
          html = Path("dist/index.html").read_text(encoding="utf-8")

          refs = re.findall(
              r'(?:src|href)=["\']([^"\']+)["\']',
              html
          )

          asset_names = []

          for ref in refs:
              match = re.search(
                  r'(?:^|/)assets/([^?#]+)',
                  ref
              )

              if match:
                  name = match.group(1)

                  if name not in asset_names:
                      asset_names.append(name)

          if not asset_names:
              raise SystemExit(
                  "No assets found in deployed index.html"
              )

          for name in asset_names:
              out = Path("dist/assets") / name
              out.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              req = Request(
                  base + "assets/" + name,
                  headers={
                      "Cache-Control": "no-cache"
                  },
              )

              with urlopen(req) as response:
                  out.write_bytes(
                      response.read()
                  )

              print(
                  "downloaded asset",
                  name
              )
          PY

          for file in \
            coi-serviceworker.min.js \
            mkxp-z_libretro.js \
            mkxp-z_libretro.wasm \
            slknight.mkxpz
          do
            curl -L --fail --retry 3 \
              -H 'Cache-Control: no-cache' \
              "${SITE_URL}/${file}?run=${GITHUB_RUN_ID}" \
              -o "dist/${file}"
          done

          touch dist/.nojekyll

          test -s dist/index.html
          test -s dist/mkxp-z_libretro.js
          test -s dist/mkxp-z_libretro.wasm
          test -s dist/slknight.mkxpz

      - name: Fix module path and add visible boot status
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          index_path = Path(
              "dist/index.html"
          )

          html = index_path.read_text(
              encoding="utf-8"
          )

          # GitHub project Pages에서는
          # ../assets 가 /Game 밖으로 빠져버림.
          # 전부 ./assets 로 강제 수정.
          html = re.sub(
              r'((?:src|href)=["\'])'
              r'(?:\.\./|\./|/)?assets/',
              r'\1./assets/',
              html,
          )

          module_match = re.search(
              r'<script\s+'
              r'type=["\']module["\']'
              r'[^>]*'
              r'\bsrc=["\']'
              r'\.\/assets\/([^"\']+)'
              r'["\']'
              r'[^>]*>'
              r'</script>',
              html,
          )

          if module_match is None:
              raise SystemExit(
                  "Fixed module script reference not found"
              )

          old_name = module_match.group(1)

          old_path = (
              Path("dist/assets")
              / old_name
          )

          if not old_path.is_file():
              raise SystemExit(
                  "Frontend module file missing: "
                  + str(old_path)
              )

          run_id = os.environ.get(
              "GITHUB_RUN_ID",
              "manual"
          )

          stem = old_path.stem
          suffix = old_path.suffix

          new_name = (
              f"{stem}"
              f"-bootfix-"
              f"{run_id}"
              f"{suffix}"
          )

          new_path = old_path.with_name(
              new_name
          )

          js = old_path.read_text(
              encoding="utf-8"
          )

          js = (
              'window.__slBoot&&'
              'window.__slBoot('
              '"FRONTEND JS OK"'
              ');\n'
              + js
          )

          new_path.write_text(
              js,
              encoding="utf-8"
          )

          old_path.unlink()

          html = html.replace(
              "./assets/" + old_name,
              "./assets/" + new_name,
              1,
          )

          boot_ui = r'''
          <div
            id="sl-boot-diagnostic"
            style="
              position:fixed;
              z-index:2147483647;
              left:8px;
              top:8px;
              max-width:calc(100vw - 16px);
              padding:8px 10px;
              border:1px solid rgba(255,255,255,.55);
              border-radius:8px;
              background:rgba(0,0,0,.86);
              color:#fff;
              font:12px/1.4 monospace;
              white-space:pre-wrap;
              word-break:break-word;
              pointer-events:none;
            "
          >
            BOOT: HTML OK
          </div>

          <script>
            (function () {
              var box =
                document.getElementById(
                  'sl-boot-diagnostic'
                );

              window.__slBoot =
                function (message) {
                  if (box) {
                    box.textContent =
                      'BOOT: ' +
                      String(message);
                  }
                };

              window.addEventListener(
                'error',
                function (event) {
                  window.__slBoot(
                    'JS ERROR\n' +
                    (
                      event.message ||
                      'unknown error'
                    ) +
                    (
                      event.filename
                        ? '\n' +
                          event.filename
                        : ''
                    ) +
                    (
                      event.lineno
                        ? ':' +
                          event.lineno
                        : ''
                    )
                  );
                }
              );

              window.addEventListener(
                'unhandledrejection',
                function (event) {
                  window.__slBoot(
                    'PROMISE ERROR\n' +
                    String(
                      event.reason
                    )
                  );
                }
              );

              window.setTimeout(
                function () {
                  if (
                    box &&
                    box.textContent ===
                      'BOOT: HTML OK'
                  ) {
                    box.textContent =
                      'BOOT: FRONTEND MODULE DID NOT RUN\n' +
                      'crossOriginIsolated=' +
                      String(
                        window.crossOriginIsolated
                      ) +
                      '\n' +
                      'SharedArrayBuffer=' +
                      String(
                        typeof SharedArrayBuffer
                          !== 'undefined'
                      );
                  }
                },
                5000
              );
            })();
          </script>
          '''

          if "</body>" not in html:
              raise SystemExit(
                  "index.html has no closing body tag"
              )

          html = html.replace(
              "</body>",
              boot_ui + "\n</body>",
              1,
          )

          index_path.write_text(
              html,
              encoding="utf-8"
          )

          print(
              "module path fixed to",
              "./assets/" + new_name
          )
          PY

      - name: Verify fixed Pages package
        run: |
          set -e

          test -s dist/index.html
          test -s dist/slknight.mkxpz

          if grep -q \
            'src="../assets/' \
            dist/index.html
          then
            echo \
              'ERROR: ../assets module path still exists'
            exit 1
          fi

          if grep -q \
            "src='../assets/" \
            dist/index.html
          then
            echo \
              'ERROR: ../assets module path still exists'
            exit 1
          fi

          grep -q \
            'src="./assets/' \
            dist/index.html

          grep -q \
            'bootfix-' \
            dist/index.html

          grep -q \
            'BOOT: HTML OK' \
            dist/index.html

          echo \
            'SLKNIGHT_ASSET_PATH_FIX_OK'

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages

    needs:
      - build

    runs-on:
      ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
