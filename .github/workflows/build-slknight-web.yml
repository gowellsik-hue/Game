
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V262
# BASE: V257 successful run 41404902934
# SCOPE: Map025 EV29 / Tower of Insolence 2F
#
# FIX:
# - Remove proximity-based automatic player damage
# - Accept player hits through the native event start path
# - Reuse CE901 attack calculations without altering CE901
# - Physical 6/7, magic 1/7
# - Magic final damage minimum 80
# - Correct Items ID18 drop category
# - Preserve other maps, monsters, scripts and graphics
#
# No cloned Death Knight map events.
# No additional common events.
# No changes to original monster balance.

name: build-slknight-web.yml | V262 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: V262 Restore successful V257 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41404902934
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V262 Verify and unpack original game
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p site build
          test -s baseline/artifact.tar
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root=Path('site')
          before={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          assert len(before)==5610,len(before)

          data=root/'knight/gameasync/Data'
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          for name in (
              'Map025',
              'Map016',
              'CommonEvents',
              'Items',
              'Weapons',
              'Armors'
          ):
              path=data/(prefix+name+'.rxdata')
              assert path.is_file(),str(path)

          assert (data/'Scripts.rxdata').is_file()

          for action in (
              'Walk','Idle','Attack','AltAttack',
              'Spell','Hit','Death'
          ):
              path=(
                  root/'knight/gameasync/Graphics/Characters'/
                  ('SLZenith'+action+'.png')
              )
              assert path.is_file(),str(path)

          (Path('build')/'before.json').write_text(
              json.dumps(before,sort_keys=True),
              encoding='utf-8'
          )

          print('PASS V257 baseline')
          print('PASS original Map025 and combat data')
          print('PASS existing item databases')
          print('PASS seven original Zenith graphics')
          PY

      - name: V262 Repair Zenith combat and item links
        shell: bash
        run: |
          set -euo pipefail

          cat > build/patch.rb <<'RUBY'
          # encoding: UTF-8
          require 'zlib'

          module RPG
            class Map;end
            class MapInfo;end
            class CommonEvent;end
            class AudioFile;end
            class Item;end
            class Weapon;end
            class Armor;end

            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end

            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end

          class Table
            def self._load(raw)
              o=allocate
              o.instance_variable_set(:@raw,raw)
              o
            end
            def _dump(level=0);@raw;end
          end

          class Tone
            def self._load(raw)
              o=allocate
              o.instance_variable_set(:@raw,raw)
              o
            end
            def _dump(level=0);@raw;end
          end

          class Color<Tone;end

          def iv(obj,key)
            obj.instance_variable_get('@'+key.to_s)
          end

          def put(obj,key,value)
            obj.instance_variable_set('@'+key.to_s,value)
          end

          def replace_between(source,first,last,replacement)
            a=source.index(first)
            raise "Missing start: #{first}" unless a

            b=source.index(last,a+first.length)
            raise "Missing end: #{last}" unless b

            source[0...a]+replacement+"\n"+source[b..-1]
          end

          root='site/knight/gameasync/Data/'
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          map_path=root+prefix+'Map025.rxdata'
          common_path=root+prefix+'CommonEvents.rxdata'
          scripts_path=root+'Scripts.rxdata'

          map=Marshal.load(File.binread(map_path))
          common=Marshal.load(File.binread(common_path))
          scripts=Marshal.load(File.binread(scripts_path))

          # Verify the native source attack graph.
          source_ce=common.fetch(901)
          source_commands=iv(source_ce,:list)

          raise 'Native CE901 missing' unless
            source_commands.is_a?(Array)

          original_ce=Marshal.dump(source_ce)

          params=source_commands.map do |cmd|
            [iv(cmd,:code),iv(cmd,:parameters)]
          end

          raise 'Native 6:1 selector missing' unless
            params.include?(
              [122,[26,26,0,2,0,6]]
            ) &&
            params.include?(
              [111,[1,26,0,1,0]]
            )

          raise 'Native MDEF deduction missing' unless
            params.include?(
              [122,[4,4,0,4,1,12]]
            )

          raise 'Native magic minimum 80 missing' unless
            params.include?(
              [311,[1,1,0,80,false]]
            )

          raise 'Native physical attacks missing' unless
            params.include?(
              [122,[26,26,0,0,35]]
            ) &&
            params.include?(
              [122,[26,26,0,0,70]]
            )

          # Verify standalone V257 runtime.
          matches=scripts.each_index.select do |i|
            row=scripts[i]
            row.is_a?(Array) &&
              row[1]=='SLMonsterV257'
          end

          raise 'V257 runtime not unique' unless
            matches.length==1

          index=matches.first
          entry=scripts[index]

          runtime=Zlib::Inflate.inflate(entry[2])
          runtime=runtime.force_encoding('UTF-8')

          raise 'Runtime encoding invalid' unless
            runtime.valid_encoding?

          required=[
            ':max_hp=>5200',
            ':level=>60',
            ':physical=>[50,100]',
            ':magic=>[150,300]',
            ':accuracy=>9999',
            ':hit_random=>[15,35]',
            ':attack_wait=>20',
            ':exp=>43212',
            ':adena=>[64800,151200]'
          ]

          required.each do |value|
            raise "Original stat changed: #{value}" unless
              runtime.include?(value)
          end

          # Original V257 drop list:
          # Only the incorrectly typed item 18 changes.
          old='[:weapon,18,50]'
          new='[:item,18,50]'

          raise 'Two-handed sword drop mismatch' unless
            runtime.scan(Regexp.new(Regexp.escape(old))).length==1

          runtime=runtime.sub(old,new)

          # Stop automatic damage merely from proximity.
          # Player damage occurs through Game_Event#start.
          player_method=<<'PLAYER'
            def self.player_strike(ev)
              map_id=ev.instance_variable_get(:@map_id)
              event_id=ev.instance_variable_get(:@id)

              c=config(map_id,event_id)
              return false unless c

              return false unless $game_variables

              s=state(map_id,event_id)
              return false if s[:paid]

              d=distance(ev)
              return false unless d

              # Native four-direction melee adjacency.
              return false unless d[0]+d[1]==1

              # One hit for one native event activation.
              return false if
                s[:last_player_action_tick]==s[:tick]

              s[:last_player_action_tick]=s[:tick]

              a=actor
              return false unless a
              return false unless a.respond_to?(:atk)
              return false unless a.respond_to?(:agi)

              # Preserve the existing 15..35 hit input.
              hit=roll(c[:hit_random])
              $game_variables[335]=hit

              return false if a.agi.to_i<hit

              damage=a.atk.to_i
              return false unless damage>0

              apply_hit(map_id,event_id,damage)
            end

          PLAYER

          runtime=replace_between(
            runtime,
            "            def self.player_attack(ev,c,s)\n",
            "            def self.magic_effect(c,s)\n",
            player_method
          )

          # Reuse the original CE901 calculations:
          #   random 0..6 -> magic 1/7, physical 6/7
          #   magic MDEF -> CE57 -> variable 1031 -> min 80
          #   physical original hit/damage checks
          #
          # Only a temporary command list is made at runtime.
          # No new common event is stored in CommonEvents.

          combat_method=<<'COMBAT'
            def self.cast_magic(map_id,event_id)
              c=config(map_id,event_id)
              return unless c

              s=state(map_id,event_id)

              motion(
                map_id,event_id,
                'Spell',c[:attack_wait]
              )

              magic_effect(c,s)
            end

            def self.native_attack_commands
              return @native_attack_template if
                @native_attack_template

              raise 'Native common events unavailable' unless
                defined?($data_common_events) &&
                $data_common_events

              original=$data_common_events[901]

              raise 'Native CE901 unavailable' unless
                original

              original_list=original.instance_variable_get(
                :@list
              )

              raise 'Native CE901 commands missing' unless
                original_list.is_a?(Array)

              list=Marshal.load(
                Marshal.dump(original_list)
              )

              physical_low=0
              physical_high=0
              magic_hook=0
              magic_floor=0
              selector=0

              list.each do |cmd|
                code=cmd.instance_variable_get(:@code)
                p=cmd.instance_variable_get(:@parameters)

                next unless p.is_a?(Array)

                if code==122 && p==[26,26,0,0,35]
                  p[4]=50
                  physical_low+=1

                elsif code==122 && p==[26,26,0,0,70]
                  p[4]=100
                  physical_high+=1

                elsif code==121 &&
                      p==[135,135,0]

                  cmd.instance_variable_set(:@code,355)
                  cmd.instance_variable_set(
                    :@parameters,
                    ['SLMonster.cast_magic(25,29)']
                  )
                  magic_hook+=1

                elsif code==250
                  # Do not play Death Knight sounds.
                  cmd.instance_variable_set(:@code,355)
                  cmd.instance_variable_set(
                    :@parameters,['nil']
                  )
                end

                if code==122 &&
                   p==[26,26,0,2,0,6]
                  selector+=1
                end

                if code==311 &&
                   p==[1,1,0,80,false]
                  magic_floor+=1
                end
              end

              raise 'Physical input mapping failed' unless
                physical_low==1 && physical_high==1

              raise '6:1 native branch missing' unless
                selector==1

              raise 'Magic action hook missing' unless
                magic_hook==1

              raise 'Magic minimum 80 missing' unless
                magic_floor==1

              @native_attack_template=list
            end

            def self.monster_attack(ev,c,s)
              # Finish an attack before starting another.
              active=s[:native_interpreter]

              if active
                active.update

                return if active.running?

                s[:native_interpreter]=nil
              end

              target=actor
              return unless target
              return unless target.respond_to?(:hp)
              return if target.hp.to_i<=0

              d=distance(ev)
              return unless d

              unless d[0]<=c[:attack_range] &&
                     d[1]<=c[:attack_range]

                s[:attack_tick]=0
                return
              end

              s[:attack_tick]+=1

              return if s[:attack_tick]<c[:attack_wait]

              s[:attack_tick]=0

              # RPG Maker XP uses Interpreter, not
              # Game_Interpreter.
              interpreter=Interpreter.new(0)

              interpreter.setup(
                native_attack_commands,
                ev.instance_variable_get(:@id)
              )

              s[:native_interpreter]=interpreter
              s[:attack_count]+=1

              action=(
                s[:attack_count].even? ?
                'AltAttack' : 'Attack'
              )

              motion(
                ev.instance_variable_get(:@map_id),
                ev.instance_variable_get(:@id),
                action,
                c[:attack_wait]
              )
            end

          COMBAT

          runtime=replace_between(
            runtime,
            "            def self.monster_attack(ev,c,s)\n",
            "            def self.reward(map_id,event_id)\n",
            combat_method
          )

          # Remove the passive proximity attack call.
          old_call="            player_attack(ev,c,s)\n"

          raise 'Old player attack call missing' unless
            runtime.scan(old_call).length==1

          runtime=runtime.sub(
            old_call,
            "            # Player hits are event-driven.\n"
          )

          # Hook the existing native event activation.
          event_marker=(
            "          class Game_Event\n"+
            "            alias slm_v257_original_update update"
          )

          event_hook=<<'EVENT'
          class Game_Event
            alias slm_v262_original_start start

            def start
              if SLMonster.config(@map_id,@id)
                SLMonster.player_strike(self)
                return
              end

              slm_v262_original_start
            end

            alias slm_v262_original_update update
          EVENT

          raise 'Event hook location changed' unless
            runtime.scan(event_marker).length==1

          runtime=runtime.sub(
            event_marker,
            event_hook.rstrip
          )

          # Only version identifier references change.
          runtime=runtime.gsub('slm_v257','slm_v262')
          runtime=runtime.gsub('V257','V262')
          runtime=runtime.gsub('v257','v262')

          raise 'Old passive attack remains' if
            runtime.include?(
              'player_attack(ev,c,s)'
            )

          raise 'Direct player HP modification remains' if
            runtime.include?(
              'target.hp=[current-damage,0].max'
            )

          raise 'Incorrect item type remains' if
            runtime.include?('[:weapon,18,50]')

          # Verify all twenty drop references.
          found=runtime.scan(
            /\[:(item|weapon|armor),(\d+),(\d+)\]/
          ).map do |kind,id,rate|
            [kind.to_sym,id.to_i,rate.to_i]
          end

          expected=[
            [:item,35,30],
            [:item,34,20],
            [:item,33,100],
            [:item,37,100],
            [:armor,169,50],
            [:item,116,3],
            [:item,32,100],
            [:item,38,100],
            [:armor,289,30],
            [:weapon,123,30],
            [:item,18,50],
            [:item,3,200],
            [:weapon,1,50],
            [:armor,72,50],
            [:item,2,250],
            [:armor,303,2],
            [:item,43,100],
            [:armor,280,30],
            [:armor,12,50],
            [:armor,492,3]
          ]

          raise 'Drop list differs' unless found==expected

          # Validate only the actual active Knight DB.
          db={
            :item=>'Items',
            :weapon=>'Weapons',
            :armor=>'Armors'
          }.transform_values do |name|
            path=root+prefix+name+'.rxdata'

            raise "Missing database: #{name}" unless
              File.file?(path)

            Marshal.load(File.binread(path))
          end

          expected.each do |kind,id,rate|
            raise "Missing #{kind} ID #{id}" unless
              db[kind] && db[kind][id]
          end

          important={
            [:item,18]=>'양손검',
            [:weapon,123]=>'싸울아비',
            [:armor,303]=>'투명 망토',
            [:armor,492]=>'제니스의 반지'
          }

          important.each do |key,name|
            record=db[key[0]][key[1]]
            actual=iv(record,:name).to_s.dup
              .force_encoding('UTF-8').scrub

            raise "Incorrect item #{key}: #{actual}" unless
              actual.gsub(/\s+/,'').include?(
                name.gsub(/\s+/,'')
              )
          end

          # Modify Map025 EV29 only.
          events=iv(map,:events)
          boss=events.fetch(29)

          name=iv(boss,:name).to_s.dup
            .force_encoding('UTF-8').scrub

          raise 'Wrong boss event' unless
            name=='제니스 퀸'

          pages=iv(boss,:pages)

          raise 'Unexpected boss page count' unless
            pages.length==1

          page=pages.first
          list=iv(page,:list)

          raise 'Unexpected boss event commands' unless
            list.length==1 &&
            iv(list[0],:code)==0

          raise 'Unexpected event trigger' unless
            iv(page,:trigger)==0

          other_events=events.each_with_object({}) do |(id,ev),out|
            out[id]=Marshal.dump(ev) unless id==29
          end

          # Original native monster recognition uses
          # the [ID] prefix and parallel trigger.
          # Display name remains SLMonster's name.
          put(boss,:name,'[ID제니스 퀸]')
          put(page,:trigger,2)

          other_events.each do |id,raw|
            raise "Unrelated event changed #{id}" unless
              Marshal.dump(events[id])==raw
          end

          # No common event is added or modified.
          raise 'Original CE901 changed' unless
            Marshal.dump(common[901])==original_ce

          entry[0]=99826201
          entry[1]='SLMonsterV262'
          entry[2]=Zlib::Deflate.deflate(runtime,9)

          File.binwrite(
            map_path,Marshal.dump(map)
          )

          File.binwrite(
            scripts_path,Marshal.dump(scripts)
          )

          File.write(
            'build/monster-runtime.rb',
            runtime,
            encoding:'UTF-8'
          )

          verify=Marshal.load(
            File.binread(scripts_path)
          )

          restored=Zlib::Inflate.inflate(
            verify[index][2]
          )

          raise 'Runtime serialization failed' unless
            verify[index][1]=='SLMonsterV262' &&
            restored.b==runtime.b

          puts 'PASS Map025 EV29 only'
          puts 'PASS native attack source CE901 unchanged'
          puts 'PASS monster attacks use native Interpreter'
          puts 'PASS no proximity-based player attack'
          puts 'PASS original 6:1 and magic floor 80'
          puts 'PASS all 20 original drop rates preserved'
          puts 'PASS item IDs and categories validated'
          puts 'PASS no cloned Death Knight events'
          RUBY

          ruby -c build/patch.rb
          ruby build/patch.rb
          ruby -c build/monster-runtime.rb

      - name: V262 Verify native attack commands
        shell: bash
        run: |
          set -euo pipefail

          cat > build/test.rb <<'RUBY'
          require 'zlib'

          module RPG
            class CommonEvent;end
            class AudioFile;end
            class EventCommand;end
          end

          class Game_Map
            attr_accessor :map_id,:events
            def setup(id);@map_id=id;end
          end

          class Game_Event
            attr_accessor :x,:y,:direction,:character_name
            def start;end
            def update;end
            def moving?;false;end
            def erase;@erased=true;end
            def screen_z(_);500;end
          end

          class Sprite_Character
            def update;end
          end

          class DummyActor
            attr_accessor :hp,:exp,:atk,:agi
            def initialize
              @hp=10000
              @exp=0
              @atk=100
              @agi=35
            end
          end

          class DummyParty
            attr_reader :actors,:gold

            def initialize(actor)
              @actors=[actor]
              @gold=0
            end

            def gain_gold(n);@gold+=n;end
            def gain_item(*);end
            def gain_weapon(*);end
            def gain_armor(*);end
          end

          class DummyPlayer
            attr_accessor :x,:y,:animation_id
          end

          class Interpreter
            def initialize(*);@running=false;end
            def setup(*);@running=true;end
            def update;@running=false;end
            def running?;@running;end
          end

          $game_variables=Hash.new(0)
          $game_switches=Hash.new(false)
          $game_actors={}
          $game_map=Game_Map.new
          $game_player=DummyPlayer.new

          actor=DummyActor.new
          $game_party=DummyParty.new(actor)

          $game_player.x=101
          $game_player.y=100

          $data_animations=Array.new(26)
          [25,14,15,16].each do |id|
            $data_animations[id]=Object.new
          end

          $m=nil

          root='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          $data_common_events=Marshal.load(
            File.binread(root+pre+'CommonEvents.rxdata')
          )

          load 'build/monster-runtime.rb'

          config=SLMonster.config(25,29)

          raise 'Wrong monster level' unless
            config[:level]==60

          raise 'Wrong HP' unless
            config[:max_hp]==5200

          raise 'Wrong hit random' unless
            config[:hit_random]==[15,35]

          raise 'Wrong drop count' unless
            config[:drops].length==20

          boss=Game_Event.new
          boss.instance_variable_set(:@map_id,25)
          boss.instance_variable_set(:@id,29)

          boss.x=100
          boss.y=100
          boss.direction=2
          boss.character_name='SLZenithIdle'

          $game_map.events={29=>boss}
          $game_map.setup(25)

          # The player must not hit the boss
          # merely by standing nearby.
          10.times{boss.update}

          raise 'Proximity damage remains' unless
            $game_variables[7001]==0

          # Native event activation is a distinct hit.
          boss.start

          raise 'Event attack did not connect' unless
            $game_variables[7001]==100

          5.times{boss.update}

          raise 'Passive damage after hit' unless
            $game_variables[7001]==100

          # Verify original native CE901 calculation.
          commands=SLMonster.native_attack_commands

          pairs=commands.map do |cmd|
            [
              cmd.instance_variable_get(:@code),
              cmd.instance_variable_get(:@parameters)
            ]
          end

          raise 'Wrong low physical damage' unless
            pairs.include?(
              [122,[26,26,0,0,50]]
            )

          raise 'Wrong high physical damage' unless
            pairs.include?(
              [122,[26,26,0,0,100]]
            )

          raise '6:1 selection missing' unless
            pairs.include?(
              [122,[26,26,0,2,0,6]]
            )

          raise 'Magic MDEF path missing' unless
            pairs.include?(
              [122,[4,4,0,4,1,12]]
            )

          raise 'Magic floor 80 missing' unless
            pairs.include?(
              [311,[1,1,0,80,false]]
            )

          raise 'Old physical damage remains' if
            pairs.include?(
              [122,[26,26,0,0,35]]
            ) ||
            pairs.include?(
              [122,[26,26,0,0,70]]
            )

          raise 'Magic cast hook missing' unless
            pairs.any? do |code,p|
              code==355 &&
              p==['SLMonster.cast_magic(25,29)']
            end

          # Force boss death to test single reward.
          $game_variables[7001]=5200

          boss.update

          gold=$game_party.gold
          exp=actor.exp

          raise 'Gold reward failed' unless
            gold.between?(64800,151200)

          raise 'EXP reward failed' unless
            exp==43212

          50.times{boss.update}

          raise 'Duplicate gold reward' unless
            $game_party.gold==gold

          raise 'Duplicate EXP reward' unless
            actor.exp==exp

          raise 'Death erase failed' unless
            boss.instance_variable_get(:@erased)

          puts 'PASS event-driven player hit simulation'
          puts 'PASS no proximity damage'
          puts 'PASS native physical damage input'
          puts 'PASS native 6:1 branch'
          puts 'PASS native MDEF and magic floor 80'
          puts 'PASS single death and reward'
          RUBY

          ruby -c build/test.rb
          ruby build/test.rb

      - name: V262 Update resource hashes and version
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          root=Path('site')
          data=root/'knight/gameasync/Data'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          mapping=root/'knight/gameasync/mapping.js'
          text=mapping.read_text('utf-8')

          changed=[
              data/(pre+'Map025.rxdata'),
              data/'Scripts.rxdata'
          ]

          for path in changed:
              key='Data/'+path.name
              digest=hashlib.md5(path.read_bytes()).hexdigest()

              pattern=(
                  '('+re.escape(key)+
                  r'\?h=)[0-9a-f]{32}'
              )

              text,count=re.subn(
                  pattern,
                  lambda match:match.group(1)+digest,
                  text
              )

              assert count==1,(key,count)

          mapping.write_text(text,'utf-8')

          loader=root/'knight/js/sl-assets-v229r115.js'
          js=loader.read_text('utf-8')

          old="var version='V257';"
          new="var version='V262';"

          assert js.count(old)==1

          loader.write_text(
              js.replace(old,new),
              encoding='utf-8'
          )

          for rel in ('index.html','knight/index.html'):
              path=root/rel
              html=path.read_text('utf-8')

              assert 'V257' in html

              html=html.replace('V257','V262')
              html=html.replace('?v=v257','?v=v262')

              path.write_text(
                  html,
                  encoding='utf-8'
              )

          print('PASS Map025 resource hash')
          print('PASS Scripts resource hash')
          print('PASS V262 game cache version')
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: V262 Verify unchanged game assets
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root=Path('site')

          before=json.loads(
              Path('build/before.json').read_text()
          )

          after={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          pre=(
              'knight/gameasync/Data/'
              'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          )

          allowed={
              pre+'Map025.rxdata',
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html',
              'knight/index.html'
          }

          changed={
              key for key in before
              if before[key]!=after.get(key)
          }

          assert changed==allowed,(
              'Unexpected changes',
              sorted(changed^allowed)
          )

          assert set(before)==set(after)
          assert len(after)==5610

          protected=[
              pre+'Map016.rxdata',
              pre+'CommonEvents.rxdata',
              pre+'Items.rxdata',
              pre+'Weapons.rxdata',
              pre+'Armors.rxdata',
              'knight/assets/map-047-v241.pack'
          ]

          for path in protected:
              assert before[path]==after[path],path

          for action in (
              'Walk','Idle','Attack','AltAttack',
              'Spell','Hit','Death'
          ):
              path=(
                  'knight/gameasync/Graphics/'
                  'Characters/SLZenith'+action+'.png'
              )
              assert before[path]==after[path],path

          print('PASS no changes to other monster events')
          print('PASS original common events unchanged')
          print('PASS original item databases unchanged')
          print('PASS original seven motion sheets unchanged')
          print('PASS 5610 original assets preserved')
          PY

      - name: V262 Publish game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

