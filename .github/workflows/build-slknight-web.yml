          check(sha=='a2b0373ae6c0fe16364529e761a19ed0a4fdff6726d1d1e5149b83bac7a943b6','R50 script SHA mismatch: '+sha)
          name_mismatch=[]
          updatedHP=[];updatedDodge=[];updatedSpeed=[];deathcount=0;amounts=[];native_money=[];normal_native=0;normal_fixed=0
