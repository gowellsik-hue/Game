name: build-slknight-web.yml | V4.15 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Restore V4.14 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 46015932760
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Restore original runtime sources
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 46002274527
          name: sl414-original-runtime-audit
          github-token: ${{ github.token }}
          path: audit

      - name: Verify V4.14 baseline
        shell: bash
        run: |
          set -euo pipefail

          test -s baseline/artifact.tar

          mkdir -p site
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib, json

          root=Path('site')

          before={
              p.relative_to(root).as_posix():
                  hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          assert len(before)==6085

          assert before[
              'knight/gameasync/Data/Scripts.rxdata'
          ]=='e651e2d63092dd3eebf1a185f2482cf80eb478008dc0b540735972e97bfaa8b9'

          image=root/'knight/gameasync/Graphics/Pictures/게이지(저사양)-상.png'

          assert hashlib.md5(
              image.read_bytes()
          ).hexdigest()=='ed37440f448cd7ff710b00aeefd4915e'

          assert before[
              'knight/assets/shared-v229r115.pack'
          ].startswith('848a3d863d953bdc')

          assert before[
              'knight/gameasync/bitmap-map.js'
          ].startswith('30b5b4a619a81d4c')

          Path('/tmp/sl415-before.json').write_text(
              json.dumps(before),
              'utf8'
          )

          print('PASS exact V4.14 game')
          PYTHON

      - name: Restore original gauge drawing path
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl415-native-gauge.rb <<'RUBY'
          # encoding: UTF-8
          require 'zlib'
          require 'digest'

          base,original,previous,out=ARGV

          raise 'Arguments' unless out

          raw=File.binread(base)
          old=File.binread(original)
          item_raw=File.binread(previous)

          raise 'Baseline mismatch' unless
            Digest::SHA256.hexdigest(raw)==
            'e651e2d63092dd3eebf1a185f2482cf80eb478008dc0b540735972e97bfaa8b9'

          raise 'Original gauge mismatch' unless
            Digest::SHA256.hexdigest(old)==
            'aee568a7fe7f1930048b8baa163dd5995d28947dcb66866691cc08522dca56d1'

          raise 'Item source mismatch' unless
            Digest::SHA256.hexdigest(item_raw)==
            'a51670a58ab4d35567a5a40a955b83c7552f6163c93f9223874192922a68272d'

          rows=Marshal.load(raw)
          original_rows=Marshal.load(old)
          item_rows=Marshal.load(item_raw)

          raise 'Script count' unless
            [rows,original_rows,item_rows].all?{
              |r|r.size==137
            }

          before=rows.map{|r|Marshal.dump(r)}

          source=->(a,i){
            Zlib::Inflate.inflate(
              a[i][2]
            ).force_encoding('UTF-8')
          }

          edit=->(i,s){
            RubyVM::InstructionSequence.compile(s)
            rows[i][2]=Zlib::Deflate.deflate(s.b)
          }

          replace=lambda do |s,a,b|

            raise "Anchor #{a.inspect[0,120]}" unless
              s.scan(a).size==1

            s.sub(a){b}

          end

          [26,42,43,71,80,81,93].each do |i|

            raise "Identity #{i}" unless
              rows[i][0,2]==item_rows[i][0,2]

            RubyVM::InstructionSequence.compile(
              source.call(item_rows,i)
            )

            rows[i][2]=item_rows[i][2]

          end

          s=source.call(item_rows,130)

          a=s.index("  def self.draw(w)\n")

          b=s.index("  class Menu\n",a)

          raise 'Failed renderer bounds' unless
            a && b && b>a

          s=s[0...a]+s[b..-1]

          s=replace.call(
            s,
            "    (store[id]||={})[item] ||=\n      [0,HEAL.key?(item)]\n",
            "    return false if !entry(id,item) && (store[id]||{}).size>=4\n\n    (store[id]||={})[item] ||=\n      [0,HEAL.key?(item)]\n"
          )

          raise 'Failed renderer retained' if
            s.include?('SL414.draw') ||
            s.include?('clear_rect') ||
            s.include?('def self.draw(w)')

          edit.call(130,s)

          s=source.call(rows,127)

          orig=source.call(original_rows,127)

          raise 'Gauge class' unless
            s.include?('class Guage < Window_Base2') &&
            s.include?('super(0, 120, 800, 600)')

          raise 'Native level' unless
            orig.include?(
              'draw_actor_level($game_party.actors[0], 2, 354)'
            )

          raise 'Native AC' unless
            orig.include?(
              'draw_actor_parameter($game_party.actors[0], 8, 395, 1)'
            )

          raise 'Native MR' unless
            orig.include?(
              'draw_actor_parameter($game_party.actors[0], 70, 395, 2)'
            )

          raise 'Native inventory' unless
            source.call(original_rows,115).include?(
              'bitmap = RPG::Cache.icon(item.icon_name)'
            )

          raise 'Native experience' unless
            source.call(original_rows,105).include?(
              'actor.exp_rate * 100'
            )

          raise 'Native DPS' unless
            orig.lines.count{
              |line|
              line.include?('"DPS "+dps1.to_s+" / "+dps2.to_s') &&
              line.include?('draw_text')
            }==5

          raise 'DPS still present' if
            s.include?('"DPS "+dps1.to_s+" / "+dps2.to_s')

          raise 'Native DPS values absent' unless
            s.include?('dps1 = sprintf("%.1f",$DPS1.to_f)') &&
            s.include?('dps2 = sprintf("%.1f",$DPS2.to_f)')

          block=<<'HUD'
              self.contents.font.name = "NanumGothic"
              self.contents.font.size = 12
              self.contents.font.bold = false

              [$game_actors[1], SL414.member(4), SL414.member(5), SL414.member(6)].each_with_index do |actor, i|

                next unless actor

                x = i * 192

                [
                  [x+4, 328, 130, actor.name, 0, Color.new(192, 224, 255)],
                  [x+134, 328, 54, "Lv."+actor.level.to_s, 2, Color.new(255, 255, 255)],
                  [x+4, 349, 94, "HP "+actor.hp.to_s+"/"+actor.maxhp.to_s, 0, Color.new(255, 128, 128)],
                  [x+98, 349, 90, "MP "+actor.sp.to_s+"/"+actor.maxsp.to_s, 2, Color.new(128, 128, 255)],
                  [x+4, 369, 184, "EXP "+sprintf("%.4f%%",actor.exp_rate*100), 0, Color.new(255, 255, 128)],
                  [x+4, 389, 94, "AC "+(10-actor.pdef).to_s, 0, Color.new(255, 255, 255)],
                  [x+98, 389, 90, "MR "+actor.mdef.to_s+"%", 2, Color.new(255, 255, 255)]
                ].each do |tx,ty,tw,value,align,color|

                  self.contents.font.color = Color.new(0, 0, 0)

                  self.contents.draw_text(tx-1, ty, tw, 32, value, align)
                  self.contents.draw_text(tx, ty-1, tw, 32, value, align)
                  self.contents.draw_text(tx+1, ty, tw, 32, value, align)
                  self.contents.draw_text(tx, ty+1, tw, 32, value, align)

                  self.contents.font.color = color

                  self.contents.draw_text(tx, ty, tw, 32, value, align)

                end

                if i == 0

                  self.contents.font.color = Color.new(0, 0, 0)

                  self.contents.draw_text(x+3, 421, 184, 32, "DPS "+dps1.to_s+" / "+dps2.to_s, 0)
                  self.contents.draw_text(x+4, 420, 184, 32, "DPS "+dps1.to_s+" / "+dps2.to_s, 0)
                  self.contents.draw_text(x+5, 421, 184, 32, "DPS "+dps1.to_s+" / "+dps2.to_s, 0)
                  self.contents.draw_text(x+4, 422, 184, 32, "DPS "+dps1.to_s+" / "+dps2.to_s, 0)

                  self.contents.font.color = Color.new(255, 0, 150)

                  self.contents.draw_text(x+4, 421, 184, 32, "DPS "+dps1.to_s+" / "+dps2.to_s, 0)

                else

                  SL414::IDS.select{
                    |id|SL414.entry(actor.id,id)
                  }[0,4].each_with_index do |id,j|

                    item = $data_items[id]

                    next unless item

                    ix = x+4+j*46

                    bitmap = RPG::Cache.icon(item.icon_name)

                    self.contents.blt(
                      ix,
                      421,
                      bitmap,
                      Rect.new(0, 0, 32, 32)
                    )

                    number = SL414.count(actor.id,id)

                    self.contents.font.color = Color.new(0, 0, 0)

                    self.contents.draw_text(
                      ix+1, 429, 43, 32,
                      number.to_s, 2
                    )

                    self.contents.font.color = Color.new(255, 255, 0)

                    self.contents.draw_text(
                      ix, 428, 43, 32,
                      number.to_s, 2
                    )

                  end

                end

              end
          HUD

          methods=[]

          walk=lambda do |n|

            if n.is_a?(RubyVM::AbstractSyntaxTree::Node)

              methods<<n if
                n.type==:DEFN &&
                n.children[0]==:refresh

              n.children.each{
                |c|walk.call(c)
              }

            end

          end

          walk.call(
            RubyVM::AbstractSyntaxTree.parse(s)
          )

          raise 'Refresh method count' unless
            methods.size==1

          lines=s.lines

          at=methods[0].last_lineno-1

          raise 'Refresh end' unless
            lines[at].strip=='end'

          block=block.gsub("\n","\r\n") if
            s.include?("\r\n")

          lines.insert(at,block)

          t=lines.join

          raise 'Non-HUD change' unless
            t.sub(block,'')==s

          edit.call(127,t)

          changed=rows.each_index.select{
            |i|Marshal.dump(rows[i])!=before[i]
          }

          raise "Scope #{changed}" unless
            changed==[26,42,43,71,80,81,93,127,130]

          raise 'Original experience window changed' unless
            Marshal.dump(rows[105])==before[105]

          rows.each_index do |i|

            raise "Identity #{i}" unless
              rows[i][0,2]==original_rows[i][0,2]

            raise "Encoding #{i}" unless
              source.call(rows,i).valid_encoding?

          end

          File.binwrite(
            out,
            Marshal.dump(rows)
          )

          raise 'Round trip' unless
            Marshal.load(File.binread(out))==rows

          puts 'PASS original Guage.refresh reused'
          puts 'PASS all previous gauge lines preserved'
          puts 'PASS original Scene_Map unchanged'
          puts 'PASS original experience window unchanged'
          puts 'PASS original gauge window bounds unchanged'
          puts 'PASS original gauge show and hide unchanged'
          puts 'PASS original DPS drawing restored'
          puts 'PASS original inventory icons reused'
          puts 'PASS 9 modified scripts'
          puts 'PASS 128 unchanged scripts'
          puts "MD5 #{Digest::MD5.file(out).hexdigest}"
          RUBY

          ruby -c /tmp/sl415-native-gauge.rb

          ruby /tmp/sl415-native-gauge.rb \
            site/knight/gameasync/Data/Scripts.rxdata \
            audit/V4.13/knight/gameasync/Data/Scripts.rxdata \
            audit/V4.14/knight/gameasync/Data/Scripts.rxdata \
            /tmp/sl415.rxdata

          cp /tmp/sl415.rxdata \
            site/knight/gameasync/Data/Scripts.rxdata

      - name: Update V4.15 cache references
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib

          root=Path('site')
          game=root/'knight/gameasync'

          mapper=game/'mapping.js'

          old_mapping_digest=hashlib.sha256(
              mapper.read_bytes()
          ).hexdigest()[:16]

          script_digest=hashlib.md5(
              (game/'Data/Scripts.rxdata').read_bytes()
          ).hexdigest()

          old_script_digest='07e7a62cb188150271de853d2d38facf'

          assert script_digest!=old_script_digest

          s=mapper.read_text('utf8')

          old='Data/Scripts.rxdata?h='+old_script_digest

          new='Data/Scripts.rxdata?h='+script_digest

          assert s.count(old)==1

          s=s.replace(old,new)

          assert s.count(new)==1

          mapper.write_text(s,'utf8')

          mapping_digest=hashlib.sha256(
              mapper.read_bytes()
          ).hexdigest()[:16]

          bitmap_digest=hashlib.sha256(
              (game/'bitmap-map.js').read_bytes()
          ).hexdigest()[:16]

          assert bitmap_digest=='30b5b4a619a81d4c'

          loader=root/'knight/js/sl-assets-v229r115.js'

          old_loader_digest=hashlib.sha256(
              loader.read_bytes()
          ).hexdigest()[:16]

          s=loader.read_text('utf8')

          assert s.count(
              "var version='V4.14';"
          )==1

          assert s.count(
              'shared-v229r115.pack?v=V4.14&h=848a3d863d953bdc'
          )==1

          s=s.replace(
              "var version='V4.14';",
              "var version='V4.15';"
          )

          loader.write_text(s,'utf8')

          loader_digest=hashlib.sha256(
              loader.read_bytes()
          ).hexdigest()[:16]

          page=root/'knight/index.html'

          s=page.read_text('utf8')

          references=[
              (
                  'gameasync/mapping.js?v=v4.14&h='+old_mapping_digest,
                  'gameasync/mapping.js?v=v4.15&h='+mapping_digest,
                  1
              ),
              (
                  'gameasync/bitmap-map.js?v=v4.14&h='+bitmap_digest,
                  'gameasync/bitmap-map.js?v=v4.15&h='+bitmap_digest,
                  2
              ),
              (
                  'js/sl-assets-v229r115.js?v=v4.14&h='+old_loader_digest,
                  'js/sl-assets-v229r115.js?v=v4.15&h='+loader_digest,
                  1
              )
          ]

          for old,new,count in references:

              assert s.count(old)==count,(
                  old,s.count(old)
              )

              s=s.replace(old,new)

              assert s.count(new)==count

          assert 'V4.14' in s

          page.write_text(
              s.replace('V4.14','V4.15'),
              'utf8'
          )

          index_page=root/'index.html'

          s=index_page.read_text('utf8')

          assert 'V4.14' in s

          index_page.write_text(
              s.replace(
                  'V4.14','V4.15'
              ).replace(
                  'v4.14','v4.15'
              ),
              'utf8'
          )

          print('PASS script cache',script_digest)
          print('PASS mapping cache',mapping_digest)
          PYTHON

      - name: Verify exact modification scope
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib, json

          root=Path('site')

          before=json.loads(
              Path('/tmp/sl415-before.json').read_text('utf8')
          )

          after={
              p.relative_to(root).as_posix():
                  hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          assert set(before)==set(after)

          assert len(after)==6085

          changed={
              k for k in before
              if before[k]!=after[k]
          }

          expected={
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'knight/index.html',
              'index.html'
          }

          assert changed==expected,changed^expected

          assert all(
              before[k]==after[k]
              for k in before
              if k not in expected
          )

          print('PASS 5 modified files')
          print('PASS 6080 unchanged files')
          print('PASS original engine preserved')
          print('PASS original graphics preserved')
          print('PASS original maps preserved')
          print('PASS original mobile controls preserved')
          PYTHON

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/gameasync/bitmap-map.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: Upload V4.15
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
