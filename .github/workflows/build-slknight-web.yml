              SLMobileQuick.use(1) if Input.trigger?(Input::F7)
              SLMobileQuick.use(2) if Input.trigger?(Input::F8)
              SLMobileQuick.use(3) if Input.trigger?(Input::F9)

              \$game_player.sl_mobile_attack_tick
              sl_mobile_runtime_update
            end
          end
          RUBY

          main_index=scripts.index { |entry| entry.is_a?(Array)&&entry.length>=3&&entry[1].to_s=='Main' }
          abort 'Main missing' unless main_index

          scripts.insert(main_index,[99999991,'Mobile Diablo Assist',Zlib::Deflate.deflate(assist)])

