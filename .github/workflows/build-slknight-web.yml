name: build-slknight-web.yml | V4.14 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Restore V4.13 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45953980268
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Restore extracted original runtime
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 46002274527
          name: sl414-original-runtime-audit
          github-token: ${{ github.token }}
          path: audit

      - name: Verify exact V4.13 baseline
        shell: bash
        run: |
          set -euo pipefail

          test -s baseline/artifact.tar

          mkdir -p site
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          import json

          root=Path('site')
          audit=Path('audit')
          original=audit/'V4.13'

          manifest=json.loads(
              (original/'manifest.json').read_text('utf8')
          )

          files={
              p.relative_to(root).as_posix():p
              for p in root.rglob('*')
              if p.is_file()
          }

          assert len(files)==6085
          assert set(files)==set(manifest)

          assert all(
              p.stat().st_size==manifest[k]
              for k,p in files.items()
          ),'V4.13 file sizes'

          for name in (
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/mapping.js',
              'knight/index.html',
              'knight/js/sl-assets-v229r115.js'
          ):
              assert (
                  files[name].read_bytes()
                  ==(original/name).read_bytes()
              ),name

          before={
              k:hashlib.sha256(p.read_bytes()).hexdigest()
              for k,p in files.items()
          }

          Path('/tmp/sl414-before.json').write_text(
              json.dumps(before),
              'utf8'
          )

          print(
              'PASS exact V4.13 baseline',
              len(files)
          )
          PYTHON

      - name: Apply corrected V4.14 native HUD
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl414-fix.rb <<'RUBY'
          # encoding: UTF-8
          require 'zlib'
          require 'digest'

          original,candidate,output=ARGV

          abort 'Arguments' unless output

          check=->(ok,msg){
            raise msg unless ok
          }

          raw0=File.binread(original)
          raw1=File.binread(candidate)

          check.call(
            Digest::SHA256.hexdigest(raw0)==
            'aee568a7fe7f1930048b8baa163dd5995d28947dcb66866691cc08522dca56d1',
            'V4.13 archive'
          )

          check.call(
            Digest::SHA256.hexdigest(raw1)==
            'a51670a58ab4d35567a5a40a955b83c7552f6163c93f9223874192922a68272d',
            'V4.14 archive'
          )

          base=Marshal.load(raw0)
          old=Marshal.load(raw1)
          rows=Marshal.load(raw1)

          check.call(
            [base.size,old.size,rows.size]==
            [137,137,137],
            'Script count'
          )

          changed=->(a,b){
            a.each_index.select{
              |i|a[i]!=b[i]
            }
          }

          check.call(
            changed.call(base,old)==
            [26,42,43,71,78,80,81,93,100,127,130],
            'Previous edit scope'
          )

          source=->(a,i){
            Zlib::Inflate.inflate(a[i][2]).
              force_encoding('UTF-8').
              gsub("\r\n","\n")
          }

          replace=->(s,a,b){
            check.call(
              s.scan(a).size==1,
              "Anchor #{a.inspect[0,120]}"
            )

            s.sub(a){b}
          }

          edit=->(i,s) do
            RubyVM::InstructionSequence.compile(s)

            raw=Zlib::Inflate.inflate(
              old[i][2]
            )

            s=s.gsub("\n","\r\n") if
              raw.include?("\r\n")

            rows[i][2]=Zlib::Deflate.deflate(
              s.b
            )
          end

          scene=source.call(base,78)

          scene=replace.call(
            scene,
            "    @message_window.update\n",
            "    @message_window.update\n"+
            "    SL414.draw($my_wnd_gauge)\n"
          )

          edit.call(78,scene)

          gauge=source.call(old,127)

          check.call(
            gauge.include?(
              "    super(0, 120, 800, 600)\n"
            ),
            'Native gauge bounds'
          )

          check.call(
            gauge.include?(
              "    $my_wnd_gauge.z=1000\n"
            ),
            'Native gauge layer'
          )

          gauge=replace.call(
            gauge,
            "    self.opacity = 0\n"+
            "    self.contents.clear\n",
            "    self.opacity = 0\n"+
            "    self.contents.clear\n"+
            "    @sl414_info = nil\n"
          )

          gauge=replace.call(
            gauge,
            " def clear\n"+
            "   self.opacity = 0\n"+
            "   self.contents.clear\n",
            " def clear\n"+
            "   self.opacity = 0\n"+
            "   self.contents.clear\n"+
            "   @sl414_info = nil\n"
          )

          methods=[]

          walk=lambda do |n|
            if n.is_a?(
              RubyVM::AbstractSyntaxTree::Node
            )

              methods<<n if
                n.type==:DEFN &&
                n.children[0]==:refresh

              n.children.each{
                |c|walk.call(c)
              }
            end
          end

          walk.call(
            RubyVM::AbstractSyntaxTree.parse(gauge)
          )

          check.call(
            methods.size==1,
            'Original refresh'
          )

          lines=gauge.lines

          last=methods[0].last_lineno-1

          check.call(
            lines[last].strip=='end',
            'Refresh end'
          )

          lines.insert(
            last,
            "    SL414.draw(self)\n"
          )

          gauge=lines.join

          edit.call(127,gauge)

          runtime=source.call(old,130)

          start=runtime.index(
            "  def self.draw(w)\n"
          )

          check.call(
            start,
            'HUD method start'
          )

          finish=runtime.index(
            "  class Menu\n",
            start
          )

          check.call(
            finish,
            'HUD method end'
          )

          draw=runtime[start...finish]

          draw=replace.call(
            draw,
            "    w.visible=!$game_temp.message_window_showing\n"+
            "\n"+
            "    return unless w.visible\n",
            "    return unless $scene.is_a?(Scene_Map) && w.visible\n"
          )

          draw=replace.call(
            draw,
            "    b=w.contents\n"+
            "    b.clear\n",
            "    b=w.contents\n"+
            "    font=b.font\n"+
            "    color=font.color\n"+
            "    original_font=[font.name,font.size,font.bold,Color.new(color.red,color.green,color.blue,color.alpha)]\n"
          )

          draw=replace.call(
            draw,
            "      x=i*86\n"+
            "      y=0\n",
            "      x=122+i*86\n"+
            "      y=355\n"
          )

          draw=replace.call(
            draw,
            "    w.instance_variable_set(:@sl414_info,info)\n",
            "    font.name,font.size,font.bold,font.color=original_font\n"+
            "    w.instance_variable_set(:@sl414_info,info)\n"
          )

          edit.call(
            130,
            runtime[0...start]+
            draw+
            runtime[finish..-1]
          )

          check.call(
            changed.call(old,rows)==
            [78,127,130],
            'Correction scope'
          )

          check.call(
            changed.call(base,rows)==
            [26,42,43,71,78,80,81,93,100,127,130],
            'V4.13 scope'
          )

          check.call(
            source.call(rows,100).include?(
              'return if self.equal?($메세지)'
            ),
            'Native legacy message guard'
          )

          rows.each_index do |i|

            check.call(
              base[i][0,2]==rows[i][0,2],
              "Script identity #{i}"
            )

            s=source.call(rows,i)

            check.call(
              s.valid_encoding?,
              "Encoding #{i}"
            )
          end

          File.binwrite(
            output,
            Marshal.dump(rows)
          )

          check.call(
            Marshal.load(
              File.binread(output)
            )==rows,
            'Archive roundtrip'
          )

          puts 'PASS 137 original script identities'
          puts 'PASS 11 approved script changes'
          puts 'PASS exactly 3 corrected scripts'
          puts 'PASS original message window restored'
          puts 'PASS native gauge rendering connected'
          puts 'PASS original inventory and combat preserved'

          puts(
            "Scripts MD5: "+
            Digest::MD5.file(output).hexdigest
          )
          RUBY

          ruby -c /tmp/sl414-fix.rb

          ruby /tmp/sl414-fix.rb \
            site/knight/gameasync/Data/Scripts.rxdata \
            audit/V4.14/knight/gameasync/Data/Scripts.rxdata \
            site/knight/gameasync/Data/Scripts.rxdata

      - name: Refresh exact script mapping and verify original files
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          import json
          import re

          root=Path('site')
          audit=Path('audit')

          original=audit/'V4.13'
          candidate=audit/'V4.14'

          script=root/'knight/gameasync/Data/Scripts.rxdata'
          mapper=root/'knight/gameasync/mapping.js'

          old=hashlib.md5(
              (
                  original/
                  'knight/gameasync/Data/Scripts.rxdata'
              ).read_bytes()
          ).hexdigest()

          prior=hashlib.md5(
              (
                  candidate/
                  'knight/gameasync/Data/Scripts.rxdata'
              ).read_bytes()
          ).hexdigest()

          new=hashlib.md5(
              script.read_bytes()
          ).hexdigest()

          assert new not in (old,prior)

          marker='Data/Scripts.rxdata?h='

          s=mapper.read_text('utf8')

          assert s.count(marker+old)==1

          assert (
              (
                  candidate/
                  'knight/gameasync/mapping.js'
              ).read_text('utf8')
              ==s.replace(
                  marker+old,
                  marker+prior
              )
          )

          mapper.write_text(
              s.replace(
                  marker+old,
                  marker+new
              ),
              'utf8'
          )

          digest=hashlib.sha256(
              mapper.read_bytes()
          ).hexdigest()[:16]

          page=root/'knight/index.html'

          html=(
              candidate/'knight/index.html'
          ).read_text('utf8')

          html,n=re.subn(
              r'gameasync/mapping\.js\?v=V4\.14&h=[0-9a-f]{16}',
              'gameasync/mapping.js?v=V4.14&h='+digest,
              html
          )

          assert n==1,'Original mapping reference'

          page.write_text(
              html,
              'utf8'
          )

          loader=(
              root/
              'knight/js/sl-assets-v229r115.js'
          )

          s=loader.read_text('utf8')

          assert s.count(
              "var version='V4.13';"
          )==1

          s=s.replace(
              "var version='V4.13';",
              "var version='V4.14';"
          )

          assert s==(
              candidate/
              'knight/js/sl-assets-v229r115.js'
          ).read_text('utf8')

          loader.write_text(
              s,
              'utf8'
          )

          p=root/'index.html'

          s=p.read_text('utf8')

          assert 'V4.13' in s

          p.write_text(
              s.replace(
                  'V4.13',
                  'V4.14'
              ).replace(
                  'v4.13',
                  'v4.14'
              ),
              'utf8'
          )

          before=json.loads(
              Path(
                  '/tmp/sl414-before.json'
              ).read_text('utf8')
          )

          after={
              p.relative_to(root).as_posix():
                  hashlib.sha256(
                      p.read_bytes()
                  ).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          assert set(after)==set(before)

          assert len(after)==6085

          changed={
              k for k in before
              if before[k]!=after[k]
          }

          assert changed=={
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/mapping.js',
              'knight/index.html',
              'knight/js/sl-assets-v229r115.js',
              'index.html'
          },changed

          assert (
              marker+new
              in mapper.read_text('utf8')
          )

          assert (
              'gameasync/mapping.js?v=V4.14&h='
              +digest
              in page.read_text('utf8')
          )

          assert all(
              before[k]==after[k]
              for k in before
              if k not in changed
          )

          print('PASS 6080 original files unchanged')
          print('PASS exact five changed files')
          print('PASS current script mapping',new)
          print('PASS current mapping cache',digest)
          print('PASS V4.14 candidate')
          PYTHON

          node --check site/knight/gameasync/mapping.js

          node --check site/knight/js/sl-assets-v229r115.js

          node --check site/knight/js/drive.js

          node --check site/knight/js/dpad.js

      - name: Upload V4.14 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
