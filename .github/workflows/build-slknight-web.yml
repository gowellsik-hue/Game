            'knight/gameasync/Data/Scripts.rxdata':'8966a677a9789f3e9c95a058659dcf22b51d98fb1c68dd946a4e6879cf2bbaec',
            'elf/index.html':'a1a2c4dd3c49b2ce9dcef3b22c6434ccadb1e359731ac898a3b493b429fc072b',
            'elf/js/dpad.js':'52e1b860e2ad9c3f6194d7cf983bcf6fa1a43354650d71fd9fd11984761cde69',
            'elf/gameasync/mapping.js':'f197e345e9a6a273ad11f5301dbf04d9c2b2b60bd6802295cda8c4c1791f823c',
            'elf/gameasync/Data/Scripts.rxdata':'5c614524e2297770e476fef2a1d5fb5ce78242e84a12e6d613dae53eca86cf7c'
