          def iv(o,k);o.instance_variable_get('@'+k.to_s);end
          def set(o,k,v);o.instance_variable_set('@'+k.to_s,v);end
          def check(x,s);raise s unless x;end
          ROOT=ARGV.fetch(0);REPORT=ARGV.fetch(1);PACKED=ARGV.fetch(2)
          PRE='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          PREFIX=File.join(ROOT,'knight/gameasync/Data/')
          packed=Zlib::Inflate.inflate(Base64.decode64(File.read(PACKED)))
          check(Digest::SHA256.hexdigest(packed)=='ad718b81c55e77424226395674e94a6cf70b4a82e8938d4f2dc1b4c3e37ca5f0','Wrong V5.41 data SHA')
          rows=JSON.parse(packed)
          check(rows.length==491,'Wrong monster EV count')
          check(rows.map{|r|r[0,2]}.uniq.length==491,'Duplicate EV key')
          check(rows.map{|r|r[0]}.uniq.length==36,'Wrong map coverage')
          by_map=rows.group_by{|r|r[0]}
