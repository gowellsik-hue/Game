name: Deploy SLKnight V14.3o MONSTER ATTACK BODY HIDE
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: slknight-github-pages, cancel-in-progress: true}
env:
  BASELINE_SHA: c6815cd461dba60ec131898e6d5dd8690dd915ae
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout frozen V14.3l baseline
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.BASELINE_SHA }}
          path: baseline
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake cmake curl ffmpeg freepats git imagemagick libtool make mm-common patch pkg-config python3 rake ruby timidity unzip wget xz-utils fonts-nanum
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.MKXP_SRC_REF }}
          path: engine
      - name: Cache engine dependencies
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-${{ runner.os }}-${{ env.EMSDK_VER }}-onig25b
      - name: Extract exact V14.3l run scripts
        run: |
          ruby -ryaml - <<'RB'
          doc=YAML.load_file('baseline/.github/workflows/build-slknight-web.yml')
          steps=doc.fetch('jobs').fetch('build').fetch('steps')
          wanted={
            'Patch engine'=>'/tmp/base_patch_engine.sh',
            'Build engine'=>'/tmp/base_build_engine.sh',
            'Install game'=>'/tmp/base_install_game.sh',
            'Patch game'=>'/tmp/base_patch_game.sh',
            'Convert media'=>'/tmp/base_convert_media.sh',
            'Build mappings'=>'/tmp/base_build_mappings.sh',
            'Patch browser'=>'/tmp/base_patch_browser.sh',
            'Verify package'=>'/tmp/base_verify.sh'
          }
          wanted.each do |name,path|
            step=steps.find{|x|x['name']==name}
            abort "BASELINE STEP MISSING: #{name}" unless step&&step['run']
            File.write(path,step['run'])
          end
          puts 'BASELINE_SCRIPTS_OK'
          RB
      - name: Patch engine
        run: bash /tmp/base_patch_engine.sh
      - name: Build engine
        run: bash /tmp/base_build_engine.sh
      - name: Install game
        run: bash /tmp/base_install_game.sh
      - name: Patch game from V14.3l
        run: bash /tmp/base_patch_game.sh
      - name: Patch monster attack motion
        run: |
          cat > /tmp/monster_patch.rb <<'RB'
          # encoding: UTF-8
          require 'shellwords'
          require 'zlib'
          game=ARGV.fetch(0)
          class RawMarshalObject
            def self._load(data);o=allocate;o.instance_variable_set(:@raw,data);o;end
            def _dump(_depth);@raw;end
          end
          class Tone < RawMarshalObject;end
          class Color < RawMarshalObject;end
          class Rect < RawMarshalObject;end
          class Table < RawMarshalObject;end
          module RPG
            class AudioFile;end
            class Animation
              class Frame;end
              class Timing;end
            end
            class Map;end
            class CommonEvent;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end
          def iv(o,n);o.instance_variable_get("@#{n}");end
          def setiv(o,n,v);o.instance_variable_set("@#{n}",v);end
          def sl_norm_name(s)
            s.to_s.dup.force_encoding(Encoding::UTF_8).gsub(/\[공격\]/,'').gsub(/[\s\-·ㆍ]/,'').gsub(/[()]/,'')
          end
          def sl_runs(a)
            runs=[];cur=[];prev=nil
            a.each do |n|
              if !prev.nil?&&n!=prev+1
                runs<<cur unless cur.empty?
                cur=[]
              end
              cur<<n;prev=n
            end
            runs<<cur unless cur.empty?
            runs
          end
          def sl_split_balanced(a,count=4)
            n=a.length;out=[]
            count.times do |i|
              s=(i*n.to_f/count).round;e=((i+1)*n.to_f/count).round
              out<<a[s...e].to_a
            end
            out
          end
          def sl_direction_groups(path,sheet)
            if sheet=='흑기사모션'
              return {2=>[10,11,12,13,14,15,16],4=>[17,18,19,20],6=>[5,6,7,8,9],8=>[21,22,0,1,2,3,4]}
            end
            cmd="convert #{Shellwords.escape(path)} -crop 192x192 +repage -channel A -format '%[fx:mean]\\n' info: 2>/dev/null"
            means=`#{cmd}`.lines.map{|x|x.to_f};used=[]
            means.each_with_index{|v,i|used<<i if v>0.00001}
            return nil if used.length<8
            runs=sl_runs(used)
            groups=if runs.length>=4
              runs[0,4]
            elsif runs.length==2&&runs.all?{|r|r.length>=4}
              sl_split_balanced(runs[0],2)+sl_split_balanced(runs[1],2)
            else
              sl_split_balanced(used,4)
            end
            return nil unless groups&&groups.length==4&&groups.all?{|g|!g.empty?}
            {2=>groups[0],4=>groups[1],6=>groups[2],8=>groups[3]}
          end
          def sl_fit(seq,target)
            return [] if seq.empty?||target<=0
            return Array.new(target,seq[0]) if seq.length==1
            return [seq[0]] if target==1
            out=[]
            target.times do |i|
              src=((i*(seq.length-1).to_f)/(target-1)).round
              out<<seq[src]
            end
            out
          end
          def sl_target_frames(wait)
            hard_max=[wait/2,1].max
            desired=[((wait*0.80)/2.0).round,1].max
            [desired,hard_max].min
          end
          ce_path=Dir.glob(File.join(game,'Data','*CommonEvents.rxdata')).max_by{|p|File.size(p)}
          anim_path=Dir.glob(File.join(game,'Data','*Animations.rxdata')).max_by{|p|File.size(p)}
          scripts_path=File.join(game,'Data','Scripts.rxdata')
          abort 'CommonEvents missing' unless ce_path&&File.size(ce_path)>1000
          abort 'Animations missing' unless anim_path&&File.size(anim_path)>1000
          abort 'Scripts missing' unless File.size?(scripts_path)
          common_events=Marshal.load(File.binread(ce_path))
          animations=Marshal.load(File.binread(anim_path))
          scripts=Marshal.load(File.binread(scripts_path))
          runtime=<<'RUBY'
          class Game_Character
            attr_accessor :sl_attack_hide_frames
          end
          class Sprite_Character
            alias sl_attack_body_hide_original_update update
            def update
              sl_attack_body_hide_original_update
              return if @character==nil
              frames=@character.sl_attack_hide_frames.to_i
              return if frames<=0
              self.src_rect.set(0,0,0,0) if self.bitmap!=nil
              @character.sl_attack_hide_frames=frames-1
            end
          end
          RUBY
          scripts.delete_if{|e|e.is_a?(Array)&&e.length>=3&&e[1].to_s=='Monster Attack Body Hide'}
          main_pos=scripts.index{|e|e.is_a?(Array)&&e.length>=3&&e[1].to_s=='Main'}
          abort 'Main insertion point missing' unless main_pos
          scripts.insert(main_pos,[999997,'Monster Attack Body Hide',Zlib::Deflate.deflate(runtime)])
          anim_dir=File.join(game,'Graphics','Animations');motion_assets={}
          Dir.glob(File.join(anim_dir,'*.png')).sort.each do |p|
            sheet=File.basename(p,'.png').dup.force_encoding(Encoding::UTF_8)
            next unless sheet.include?('모션')
            next if sheet.include?('죽음')||sheet.include?('맞음')||sheet.start_with?('물약')||sheet.match?(/모션\d+\z/)
            key=sl_norm_name(sheet.sub(/[\s\-]*모션\z/,''))
            motion_assets[key]||=[sheet,p] unless key.empty?
          end
          attack_ids={}
          common_events.each_with_index do |ce,id|
            next unless ce
            name=iv(ce,:name).to_s.dup.force_encoding(Encoding::UTF_8)
            next unless name.start_with?('[공격]')
            monster=sl_norm_name(name);candidates=motion_assets.keys.select{|k|monster.include?(k)}
            next if candidates.empty?
            key=candidates.max_by{|k|k.length}
            attack_ids[id]={name:name,sheet:motion_assets[key][0],path:motion_assets[key][1]}
          end
          removed_old=0
          common_events.compact.each do |ce|
            list=iv(ce,:list)||[];before=list.length
            list.delete_if do |cmd|
              next false unless iv(cmd,:code)==355
              (iv(cmd,:parameters)||[])[0].to_s.include?('aid={2=>500,4=>501,6=>502,8=>503}')
            end
            removed_old+=before-list.length
          end
          base_attack=animations.compact.find do |a|
            frames=iv(a,:frames)
            frames.is_a?(Array)&&frames[0]&&iv(frames[0],:cell_data)
          end
          abort 'animation frame template missing' unless base_attack
          next_anim=[animations.length,600].max
          generated={};used_sheets={};switch_anim={};caller_patched=0
          make_anim=lambda do |id,sheet,patterns,wait,dir,target|
            timeline=sl_fit(patterns,target)
            anim=Marshal.load(Marshal.dump(base_attack))
            setiv(anim,:id,id);setiv(anim,:name,"SLM #{sheet} #{dir} W#{wait} F#{target}")
            setiv(anim,:animation_name,sheet);setiv(anim,:animation_hue,0);setiv(anim,:position,1)
            setiv(anim,:frame_max,timeline.length);setiv(anim,:timings,[])
            frames=[]
            timeline.each do |pattern|
              frame=Marshal.load(Marshal.dump(iv(base_attack,:frames)[0]));setiv(frame,:cell_max,1)
              table=Table.allocate
              setiv(table,:raw,[2,1,8,1,8].pack('L<5')+[pattern,0,0,100,0,0,255,0].pack('s<8'))
              setiv(frame,:cell_data,table);frames<<frame
            end
            setiv(anim,:frames,frames);animations[id]=anim
          end
          common_events.each_with_index do |ce,cid|
            next unless ce
            switch_id=iv(ce,:switch_id).to_i
            next if switch_id<=0
            list=iv(ce,:list)||[];i=0
            while i<list.length
              call=list[i]
              unless iv(call,:code)==117
                i+=1;next
              end
              attack_id=(iv(call,:parameters)||[])[0].to_i;meta=attack_ids[attack_id]
              unless meta
                i+=1;next
              end
              indent=iv(call,:indent).to_i;wait_cmd=nil
              ((i+1)...[i+10,list.length].min).each do |j|
                c=list[j];ci=iv(c,:indent).to_i
                break if ci<indent
                if iv(c,:code)==106&&ci==indent
                  wait_cmd=c;break
                end
              end
              unless wait_cmd
                i+=1;next
              end
              wait=(iv(wait_cmd,:parameters)||[])[0].to_i
              unless wait>=8
                i+=1;next
              end
              groups=sl_direction_groups(meta[:path],meta[:sheet])
              unless groups
                i+=1;next
              end
              target=sl_target_frames(wait);hide_frames=target*2
              abort "animation exceeds wait #{meta[:sheet]} wait=#{wait} duration=#{hide_frames}" if hide_frames>wait
              key=[meta[:sheet],wait,target];data=generated[key]
              unless data
                ids={}
                [2,4,6,8].each do |dir|
                  id=next_anim;next_anim+=1
                  make_anim.call(id,meta[:sheet],groups[dir],wait,dir,target);ids[dir]=id
                end
                data={ids:ids,hide_frames:hide_frames,target:target};generated[key]=data;used_sheets[meta[:sheet]]=true
              end
              if switch_anim[switch_id]&&switch_anim[switch_id][:ids]!=data[:ids]
                abort "switch collision #{switch_id}"
              end
              switch_anim[switch_id]={ids:data[:ids],hide_frames:data[:hide_frames],target:data[:target],sheet:meta[:sheet],wait:wait,caller:cid}
              windup=(data[:hide_frames]*0.55).round
              windup=2 if windup<2;windup=wait-2 if windup>wait-2
              recovery=wait-windup
              abort "wait split mismatch caller=#{cid}" unless windup+recovery==wait
              windup_cmd=RPG::EventCommand.new
              setiv(windup_cmd,:code,106);setiv(windup_cmd,:indent,indent);setiv(windup_cmd,:parameters,[windup])
              setiv(wait_cmd,:parameters,[recovery]);list.insert(i,windup_cmd)
              caller_patched+=1;i+=2
            end
          end
          abort 'no monster attack callers patched' if caller_patched==0
          map_patched=0;maps_touched={};switches_seen={}
          map_groups=Dir.glob(File.join(game,'Data','*Map[0-9][0-9][0-9].rxdata')).group_by{|p|File.basename(p)[/Map\d{3}/]}
          map_groups.each do |map_key,paths|
            map_path=paths.max_by{|p|File.size(p)}
            next unless map_path&&File.size(map_path)>100
            map=Marshal.load(File.binread(map_path));changed=false
            (iv(map,:events)||{}).each do |eid,event|
              (iv(event,:pages)||[]).each do |page|
                list=iv(page,:list)||[];i=0
                while i<list.length
                  cmd=list[i]
                  unless iv(cmd,:code)==121
                    i+=1;next
                  end
                  p=iv(cmd,:parameters)||[];first=p[0].to_i;last=p[1].to_i;state=p[2].to_i
                  unless state==0&&first==last
                    i+=1;next
                  end
                  info=switch_anim[first]
                  unless info
                    i+=1;next
                  end
                  ids=info[:ids];hide_frames=info[:hide_frames]
                  anim_cmd=RPG::EventCommand.new
                  setiv(anim_cmd,:code,355);setiv(anim_cmd,:indent,iv(cmd,:indent).to_i)
                  setiv(anim_cmd,:parameters,["e=$game_map.events[#{eid}];if e;aid={2=>#{ids[2]},4=>#{ids[4]},6=>#{ids[6]},8=>#{ids[8]}}[e.direction];if aid;e.sl_attack_hide_frames=#{hide_frames};e.animation_id=aid;end;end"])
                  list.insert(i,anim_cmd);map_patched+=1;switches_seen[first]=true;changed=true;i+=2
                end
              end
            end
            if changed
              File.binwrite(map_path,Marshal.dump(map));maps_touched[map_key]=true
            end
          end
          missing=switch_anim.keys.reject{|sid|switches_seen[sid]}
          puts "UNSEEN_SWITCHES=#{missing.sort.join(',')}" unless missing.empty?
          abort 'no map attack triggers patched' if map_patched==0
          File.binwrite(ce_path,Marshal.dump(common_events))
          File.binwrite(anim_path,Marshal.dump(animations))
          File.binwrite(scripts_path,Marshal.dump(scripts))
          File.write(File.join(game,'sl_attack_sheets.txt'),used_sheets.keys.sort.join("\n")+"\n")
          puts "MONSTER_ATTACK_MOTION_V143O callers=#{caller_patched} map_triggers=#{map_patched} maps=#{maps_touched.length} switches=#{switches_seen.length}/#{switch_anim.length} sheets=#{used_sheets.length} generated=#{generated.length*4} removed_old=#{removed_old}"
          RB
          ruby -c /tmp/monster_patch.rb
          ruby -EUTF-8:UTF-8 /tmp/monster_patch.rb player/gameasync
      - name: Convert media
        run: bash /tmp/base_convert_media.sh
      - name: Build mappings
        run: bash /tmp/base_build_mappings.sh
      - name: Patch browser from V14.3l
        run: bash /tmp/base_patch_browser.sh
      - name: Verify frozen V14.3l baseline
        run: bash /tmp/base_verify.sh
      - name: Preload monster attack sheets
        run: |
          cat > /tmp/preload_patch.rb <<'RB'
          # encoding: UTF-8
          path=ARGV.fetch(0);list_path=ARGV.fetch(1);html=File.read(path)
          sheets=File.readlines(list_path,chomp:true).reject{|x|x.empty?}
          abort 'attack sheet list too small' if sheets.length<20
          start_marker="  var ka='/game/Graphics/Animations/흑기사모션.png';"
          load_marker="FS.createPreloadedFile('/game/Graphics/Animations','흑기사모션.png'"
          start=html.index(start_marker);abort 'black knight preload start missing' unless start
          load_pos=html.index(load_marker,start);abort 'black knight preload loader missing' unless load_pos
          finish=html.index("\n",load_pos);abort 'black knight preload end missing' unless finish
          replacement=<<JS.chomp
            var slAttackSheets=#{sheets.inspect};
            slAttackSheets.forEach(function(name){
              var file=name+'.png';
              var p='/game/Graphics/Animations/'+file;
              try{if(FS.analyzePath(p).exists)FS.unlink(p);}catch(e){}
              FS.createPreloadedFile('/game/Graphics/Animations',file,encodeURI('gameasync/Graphics/Animations/'+file+'?v=v143o'),true,true,function(){},function(){console.error('SLANIMERR|'+file);});
            });
          JS
          html[start...finish]=replacement
          html.gsub!('V14.3l','V14.3o');html.gsub!('v143l','v143o')
          File.write(path,html)
          puts "MONSTER_PRELOAD_OK sheets=#{sheets.length}"
          RB
          ruby -c /tmp/preload_patch.rb
          ruby -EUTF-8:UTF-8 /tmp/preload_patch.rb player/index.html player/gameasync/sl_attack_sheets.txt
      - name: Verify V14.3o monster attack package
        run: |
          set -e
          test -s player/index.html
          test -s player/gameasync/sl_attack_sheets.txt
          test "$(wc -l < player/gameasync/sl_attack_sheets.txt)" -ge 20
          grep -Fq 'slAttackSheets' player/index.html
          grep -Fq 'v143o' player/index.html
          ! grep -Fq "var ka='/game/Graphics/Animations/흑기사모션.png'" player/index.html
          cat > /tmp/monster_verify.rb <<'RB'
          # encoding: UTF-8
          require 'zlib'
          game=ARGV.fetch(0)
          class RawMarshalObject
            def self._load(data);o=allocate;o.instance_variable_set(:@raw,data);o;end
            def _dump(_depth);@raw;end
          end
          class Tone < RawMarshalObject;end
          class Color < RawMarshalObject;end
          class Rect < RawMarshalObject;end
          class Table < RawMarshalObject;end
          module RPG
            class AudioFile;end
            class Animation
              class Frame;end
              class Timing;end
            end
            class CommonEvent;end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
            class Map;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
          end
          def iv(o,n);o.instance_variable_get("@#{n}");end
          cp=Dir.glob(File.join(game,'Data','*CommonEvents.rxdata')).max_by{|p|File.size(p)}
          ap=Dir.glob(File.join(game,'Data','*Animations.rxdata')).max_by{|p|File.size(p)}
          ce=Marshal.load(File.binread(cp));an=Marshal.load(File.binread(ap))
          scripts=Marshal.load(File.binread(File.join(game,'Data','Scripts.rxdata')))
          body=scripts.select{|e|e.is_a?(Array)&&e.length>=3&&e[1].to_s=='Monster Attack Body Hide'}
          abort "body hide script count=#{body.length}" unless body.length==1
          body_src=Zlib::Inflate.inflate(body[0][2])
          abort 'src_rect hide missing' unless body_src.include?('self.src_rect.set(0,0,0,0)')
          bad=[];slm=0
          an.compact.each do |a|
            name=iv(a,:name).to_s.dup.force_encoding(Encoding::UTF_8)
            next unless name.start_with?('SLM ')
            slm+=1
            m=name.match(/ W(\d+) F(\d+)$/)
            next unless m
            wait=m[1].to_i;duration=m[2].to_i*2
            bad<<[iv(a,:id),duration,wait] if duration>wait
          end
          abort "animation exceeds wait #{bad.inspect}" unless bad.empty?
          abort "generated attack animations too small=#{slm}" unless slm>=80
          [
            [24,110,851,25],
            [25,112,850,20],
            [27,113,853,30],
            [424,407,853,30]
          ].each do |cid,sid,aid,total|
            x=ce[cid];abort "caller #{cid} missing" unless x
            abort "caller #{cid} switch mismatch" unless iv(x,:switch_id).to_i==sid
            list=iv(x,:list)||[]
            waits=list.select{|c|iv(c,:code)==106}.map{|c|(iv(c,:parameters)||[])[0].to_i}
            abort "caller #{cid} wait sum #{waits.inspect}" unless waits.sum==total
            call=list.find{|c|iv(c,:code)==117}
            abort "caller #{cid} attack mismatch" unless call&&(iv(call,:parameters)||[])[0].to_i==aid
          end
          map_triggers=0;hide_triggers=0
          map_groups=Dir.glob(File.join(game,'Data','*Map[0-9][0-9][0-9].rxdata')).group_by{|p|File.basename(p)[/Map\d{3}/]}
          map_groups.each_value do |paths|
            pth=paths.max_by{|p|File.size(p)};next unless pth&&File.size(pth)>100
            map=Marshal.load(File.binread(pth))
            (iv(map,:events)||{}).each_value do |event|
              (iv(event,:pages)||[]).each do |page|
                (iv(page,:list)||[]).each do |cmd|
                  next unless iv(cmd,:code)==355
                  txt=(iv(cmd,:parameters)||[])[0].to_s
                  next unless txt.include?('e.animation_id=aid')
                  map_triggers+=1
                  hide_triggers+=1 if txt.include?('sl_attack_hide_frames=')
                end
              end
            end
          end
          abort "map animation triggers too small=#{map_triggers}" unless map_triggers>=100
          abort "body hide trigger mismatch #{hide_triggers}/#{map_triggers}" unless hide_triggers==map_triggers
          puts "MONSTER_VERIFY_OK map_triggers=#{map_triggers} animations=#{slm} wait_overrun=#{bad.length}"
          RB
          ruby -c /tmp/monster_verify.rb
          ruby -EUTF-8:UTF-8 /tmp/monster_verify.rb player/gameasync
          du -sh player
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
