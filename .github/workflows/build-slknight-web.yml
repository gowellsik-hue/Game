      - name: Convert audio to OGG
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          root = Path("player/gameasync/Audio")

          if not root.exists():
              print("AUDIO_DIRECTORY_NOT_PRESENT")
              raise SystemExit(0)

          convertible = {
              ".mp3",
              ".wav",
              ".wma",
              ".aac",
              ".m4a",
              ".flac",
              ".mid",
              ".midi",
          }

          midi_exts = {
              ".mid",
              ".midi",
          }

          files = [
              p
              for p in root.rglob("*")
              if p.is_file() and p.suffix.lower() in convertible
          ]

          failures = []
          converted = 0

          for src in files:
              ext = src.suffix.lower()
              out = src.with_suffix(".ogg")
              temp_wav = None

              try:
                  source_for_ffmpeg = src

                  if ext in midi_exts:
                      temp_wav = src.with_name(src.name + ".mkxpweb.wav")

                      subprocess.run(
                          [
                              "timidity",
                              str(src),
                              "-Ow",
                              "-o",
                              str(temp_wav),
                          ],
                          check=True,
                      )

                      source_for_ffmpeg = temp_wav

                  subprocess.run(
                      [
                          "ffmpeg",
                          "-nostdin",
                          "-v",
                          "error",
                          "-y",
                          "-i",
                          str(source_for_ffmpeg),
                          "-c:a",
                          "libvorbis",
                          "-q:a",
                          "4",
                          str(out),
                      ],
                      check=True,
                  )

                  if not out.exists() or out.stat().st_size == 0:
                      raise RuntimeError("OGG output missing: " + str(out))

                  if temp_wav is not None and temp_wav.exists():
                      temp_wav.unlink()

                  if src.exists() and src != out:
                      src.unlink()

                  converted += 1

              except Exception as exc:
                  failures.append((str(src), str(exc)))

                  if temp_wav is not None and temp_wav.exists():
                      temp_wav.unlink()

          if failures:
              for name, error in failures:
                  print(name + " -> " + error, file=sys.stderr)

              raise SystemExit(1)

          print("AUDIO_CONVERTED=" + str(converted))
          print("AUDIO_CONVERSION_OK")
          PY

      - name: Convert unsupported images to PNG
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          root = Path("player/gameasync/Graphics")

          if not root.exists():
              print("GRAPHICS_DIRECTORY_NOT_PRESENT")
              raise SystemExit(0)

          convertible = {
              ".bmp",
              ".gif",
              ".webp",
              ".tif",
              ".tiff",
          }

          files = [
              p
              for p in root.rglob("*")
              if p.is_file() and p.suffix.lower() in convertible
          ]

          failures = []
          converted = 0

          for src in files:
              out = src.with_suffix(".png")

              try:
                  subprocess.run(
                      [
                          "convert",
                          str(src) + "[0]",
                          str(out),
                      ],
                      check=True,
                  )

                  if not out.exists() or out.stat().st_size == 0:
                      raise RuntimeError("PNG output missing: " + str(out))

                  src.unlink()
                  converted += 1

              except Exception as exc:
                  failures.append((str(src), str(exc)))

          if failures:
              for name, error in failures:
                  print(name + " -> " + error, file=sys.stderr)

              raise SystemExit(1)

          print("IMAGES_CONVERTED=" + str(converted))
          print("IMAGE_CONVERSION_OK")
          PY

