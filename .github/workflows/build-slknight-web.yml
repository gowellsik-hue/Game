name: Deploy SLKnight TRANSFORM FIX + SLFairy KNIGHT BOOT
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: slknight-github-pages
  cancel-in-progress: true
env:
  Z105_SHA: e19659507b466b87a671949532b02484bc1faaef
  Z104_SHA: e044e1b6c53646b4c4f21f2dfee4967a68fabbc4
  DUAL_BASE_SHA: 04ce66ec99abc10f77143de53650685db8949532
  CURRENT_Z10_SHA: f545634bafbe1e1e55aaf6489126ad17b07da382
  BASELINE_SHA: c6815cd461dba60ec131898e6d5dd8690dd915ae
  X2_SHA: 6d941bd643dda87b8267ba466e108d1904c22331
  Z1_SHA: 008b6abe81074b7af877806b45f2314004a74f66
  Z3_SHA: 5a46988b048764e8a99700998c1f4ab96a3ec5c1
  CE_FIX_SHA: e30b0c41dc7fe7ec49fa17501d198339f7006cf6
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  FAIRY_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLFairy_Source_v1.zip
  FAIRY_SHA256: 67b88b5fe0cde3c9f2fada889815f9aa7d0fc94b378025529e9950d55151c70e
  FAIRY_7Z_PASSWORD: http://nemo838.tistory.com/
  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout z10.5 source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z105_SHA }}
          path: z105src
      - name: Checkout z10.4 source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z104_SHA }}
          path: z104src
      - name: Checkout dual base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.DUAL_BASE_SHA }}
          path: dualbase
      - name: Checkout z10 source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.CURRENT_Z10_SHA }}
          path: z10src
      - name: Checkout V14.3l baseline
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.BASELINE_SHA }}
          path: baseline
      - name: Checkout V14.3x2 auto base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.X2_SHA }}
          path: x2
      - name: Checkout V14.3z1 monster base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z1_SHA }}
          path: z1
      - name: Checkout V14.3z3 monster base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z3_SHA }}
          path: z3
      - name: Checkout targeted CE fix source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.CE_FIX_SHA }}
          path: cefix
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake cmake curl ffmpeg freepats git imagemagick libtool make mm-common patch pkg-config python3 rake ruby timidity unzip wget xz-utils fonts-nanum p7zip-full nodejs
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.MKXP_SRC_REF }}
          path: engine
      - name: Cache engine dependencies
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-${{ runner.os }}-${{ env.EMSDK_VER }}-knight-fairy-clean
      - name: Extract frozen working steps
        run: |
          set -euo pipefail
          ruby -ryaml - <<'RB'
          def steps(path);YAML.load_file(path).fetch('jobs').fetch('build').fetch('steps');end
          def save_step(list,name,path)
            step=list.find{|s|s['name']==name}
            abort "MISSING STEP: #{name}" unless step&&step['run']
            File.write(path,step['run'])
          end
          z105=steps('z105src/.github/workflows/build-slknight-web.yml')
          [['Extract already-passed z10.4 build steps','/tmp/prep_00.sh'],['Run frozen successful build through repaired Fairy mappings','/tmp/prep_01.sh'],['Canonicalize SLFairy protected data paths and title','/tmp/prep_02.sh'],['Rebuild SLFairy mappings after canonicalization','/tmp/prep_03.sh'],['Finalize browser boot bridge and cache isolation','/tmp/prep_04.sh']].each{|n,p|save_step(z105,n,p)}
          save_step(steps('cefix/.github/workflows/build-slknight-web.yml'),'Fix Knight CE4 CE10 CE68 CE107 only','/tmp/fix_knight_ce.sh')
          dual=steps('dualbase/.github/workflows/build-slknight-web.yml')
          save_step(dual,'Download SLFairy source','/tmp/fairy_download.sh')
          save_step(dual,'Prepare SLFairy source and decrypt RGSSAD','/tmp/fairy_prepare.sh')
          save_step(dual,'Convert SLFairy media','/tmp/fairy_media.sh')
          puts 'FROZEN_STEPS_EXTRACTED'
          RB
      - name: Build current Knight base
        run: |
          set -euo pipefail
          for i in 0 1 2 3 4; do bash -e "$(printf '/tmp/prep_%02d.sh' "$i")"; done
          bash -e /tmp/fix_knight_ce.sh
          echo KNIGHT_BASE_OK
      - name: Fix Knight transform only
        run: |
          set -euo pipefail
          ruby -EUTF-8:UTF-8 -rjson - player/gameasync <<'RB'
          class RawMarshalObject
            def self._load(data);o=allocate;o.instance_variable_set(:@raw,data);o;end
            def _dump(_depth);@raw;end
          end
          class Tone<RawMarshalObject;end;class Color<RawMarshalObject;end;class Rect<RawMarshalObject;end;class Table<RawMarshalObject;end
          module RPG
            class AudioFile;end
            class Animation;class Frame;end;class Timing;end;end
            class Map;end;class CommonEvent;end
            class Event;class Page;class Condition;end;class Graphic;end;end;end
            class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          def iv(o,n);o.instance_variable_get("@#{n}");end
          def setiv(o,n,v);o.instance_variable_set("@#{n}",v);end
          game=ARGV.fetch(0)
          cp=Dir.glob(File.join(game,'Data','*CommonEvents.rxdata')).max_by{|p|File.size(p)}
          abort 'CommonEvents missing' unless cp&&File.size(cp)>1000
          ce=Marshal.load(File.binread(cp));event=ce[59] or abort 'CE59 missing';target=nil
          (iv(event,:list)||[]).each do |c|
            next unless iv(c,:code)==355
            src=(iv(c,:parameters)||[])[0].to_s
            target=c if src.include?('SL_TRANSFORM_DEAGGRO_V2_SAFE')
          end
          abort 'CE59 transform deaggro script missing' unless target
          src=<<'SRC'
          # SL_TRANSFORM_DEAGGRO_V3_MRUBY
          begin
            if $game_map
              $game_map.need_refresh = true
              $game_map.events.each_value do |ev|
                ev.sl_attack_finish if ev.respond_to?(:sl_attack_finish)
                ev.sl_breath_finish if ev.respond_to?(:sl_breath_finish)
                ev.animation_id = 0 if ev.respond_to?(:animation_id=)
              end
            end
          rescue
          end
          begin
            SLMonsterAttackContext.instance_variable_set(:@pending,{})
          rescue
          end
          begin
            SLBreathContext.instance_variable_set(:@pending,{})
          rescue
          end
          SRC
          src.gsub!(/^          /,'');setiv(target,:parameters,[src]);File.binwrite(cp,Marshal.dump(ce))
          names=[]
          [6,17,34].each do |id|
            e=ce[id];next unless e
            (iv(e,:list)||[]).each do |cmd|
              next unless iv(cmd,:code)==209
              route=(iv(cmd,:parameters)||[])[1];next unless route
              (iv(route,:list)||[]).each do |move|
                next unless iv(move,:code)==41
                name=(iv(move,:parameters)||[])[0].to_s.dup.force_encoding(Encoding::UTF_8)
                names<<name unless name.empty?
              end
            end
          end
          names=names.uniq.sort
          names.each{|name|abort "Missing transform graphic: #{name}" unless File.size?(File.join(game,'Graphics','Characters',"#{name}.png"))}
          File.write('/tmp/knight_transform.json',JSON.generate(names),mode:'w:UTF-8')
          puts 'KNIGHT_TRANSFORM_EVENT_FIXED'
          RB
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('player/index.html');s=p.read_text(encoding='utf-8')
          s=re.sub(r'\n\s*var slTransformSheets=.*?\n\s*\}\);','',s,count=1,flags=re.S)
          marker="}],\n            postRun:"
          if marker not in s: raise SystemExit('Knight preRun marker missing')
          names=json.loads(Path('/tmp/knight_transform.json').read_text(encoding='utf-8'))
          js=json.dumps(names,ensure_ascii=False,separators=(',',':'))
          block=f"""
            var slTransformSheets={js};
            slTransformSheets.forEach(function(name){{
              var file=name+'.png';var p='/game/Graphics/Characters/'+file;
              try{{if(FS.analyzePath(p).exists)FS.unlink(p);}}catch(e){{}}
              FS.createPreloadedFile('/game/Graphics/Characters',file,encodeURI('gameasync/Graphics/Characters/'+file+'?v=knighttf3'),true,true,function(){{}},function(){{console.error('SLTRANSFORMERR|'+file);}});
            }});
          """
          p.write_text(s.replace(marker,block+marker,1),encoding='utf-8')
          PY
          node --check player/js/drive.js
          node --check player/js/dpad.js
      - name: Rebuild Fairy from Knight shell
        run: |
          set -euo pipefail
          bash -e /tmp/fairy_download.sh
          bash -e /tmp/fairy_prepare.sh
          echo FAIRY_KNIGHT_SHELL_READY
      - name: Patch Fairy with Knight boot logic
        run: |
          set -euo pipefail
          cat > /tmp/patch_fairy_knight_boot.rb <<'RB'
          # encoding: UTF-8
          require 'zlib'
          game=ARGV.fetch(0);ini_path=File.join(game,'Game.ini');ini=File.binread(ini_path)
          rel=ini[/^Scripts=(.+)$/i,1].to_s.strip.tr('\\','/');abort 'Fairy Scripts entry missing' if rel.empty?
          source_path=File.join(game,rel);abort "Fairy scripts missing: #{source_path}" unless File.file?(source_path)
          scripts=Marshal.load(File.binread(source_path))
          def inflate(e);Zlib::Inflate.inflate(e[2]).force_encoding(Encoding::UTF_8);end
          def store(e,s);e[2]=Zlib::Deflate.deflate(s);end
          def patch_begin_until(src)
            lines=src.lines
            lines.each_index do |i|
              m=lines[i].match(/^(\s*)end\s+until\s+(.+?)\s*$/);next unless m
              indent=m[1];cond=m[2];j=i-1
              while j>=0
                if lines[j][/^\s*/]==indent&&lines[j].strip=='begin';lines[j]=indent+"loop do\n";lines[i]=indent+"  break if #{cond}\n#{indent}end\n";break;end
                j-=1
              end
            end
            lines.join
          end
          def patch_scene_loop(src)
            lines=src.lines;i=0
            while i<lines.length
              unless lines[i].strip=='loop do';i+=1;next;end
              indent=lines[i][/^\s*/];sig=[];k=i+1
              while k<lines.length&&sig.length<8
                v=lines[k].strip;sig<<[k,v,lines[k][/^\s*/]] unless v.empty?||v.start_with?('#');k+=1
              end
              finish=nil
              if sig.length>=7&&sig[0][1]=='Graphics.update'&&sig[1][1]=='Input.update'&&sig[2][1]=='update'&&sig[3][1]=='if $scene != self'&&sig[4][1]=='break'&&sig[5][1]=='end'&&sig[6][1]=='end'&&sig[6][2]==indent;finish=sig[6][0]
              elsif sig.length>=5&&sig[0][1]=='Graphics.update'&&sig[1][1]=='Input.update'&&sig[2][1]=='update'&&sig[3][1]=='break if $scene != self'&&sig[4][1]=='end'&&sig[4][2]==indent;finish=sig[4][0];end
              lines[i..finish]=[indent+"end\n\n"+indent+"def dispose\n"] if finish;i+=1
            end
            lines.join
          end
          compat=<<'RUBY'
          $joiplay=true
          module Kernel
            def exit(*args);nil;end
          end
          class Win32API
            def initialize(*args);@func=args[1].to_s;end
            def web_input(key)
              case key.to_i
              when 9,90 then Input::A
              when 13,32,67 then Input::C
              when 27,88 then Input::B
              when 65 then Input::X
              when 83 then Input::Y
              when 68 then Input::Z
              when 70 then Input::F5
              when 81 then Input::L
              when 87 then Input::R
              when 16 then Input::SHIFT
              when 17 then Input::CTRL
              when 18 then Input::ALT
              else nil
              end
            end
            def call(*args)
              code=web_input(args[0])
              return(code && Input.trigger?(code) ? 1 : 0) if @func=='GetAsyncKeyState'
              return(code && Input.press?(code) ? -1 : 0) if @func=='GetKeyState'
              0
            end
            def Call(*args);call(*args);end
          end
          Font.default_name='NanumGothic'
          module Audio
            def self.sl_stream(kind,*parts);puts((['SLAUDIO',kind]+parts.collect{|v|v.to_s}).join('|'));end
            def self.bgm_play(filename,volume=100,pitch=100);sl_stream('BGM_PLAY',filename,volume,pitch);end
            def self.bgm_stop;sl_stream('BGM_STOP');end
            def self.bgm_fade(time);sl_stream('BGM_FADE',time);end
            def self.bgs_play(filename,volume=100,pitch=100);sl_stream('BGS_PLAY',filename,volume,pitch);end
            def self.bgs_stop;sl_stream('BGS_STOP');end
            def self.bgs_fade(time);sl_stream('BGS_FADE',time);end
          end
          RUBY
          browser_loop=<<'RUBY'
          $prev_scene=nil
          $sl_last_scene_name=nil
          def main_update_loop
            begin
              if $scene!=nil
                active_scene=$scene;name=active_scene.class.to_s
                if $sl_last_scene_name!=name;puts('SLFRAME|'+name);$sl_last_scene_name=name;end
                if active_scene!=$prev_scene
                  $prev_scene.dispose if $prev_scene!=nil&&$prev_scene.respond_to?(:dispose)
                  active_scene.main;$prev_scene=active_scene
                  return if $scene!=active_scene
                end
                Graphics.update;Input.update;active_scene.update if $scene==active_scene
              end
            rescue Exception=>e
              puts('SLRUNTIMEERR|'+e.class.to_s+'|'+e.message.to_s)
              e.backtrace[0,12].each{|line|puts('SLRUNTIMEBT|'+line.to_s)} if e.respond_to?(:backtrace)&&e.backtrace
            end
          end
          RUBY
          id_sprite=<<'RUBY'
          class Game_Character
            attr_accessor :sprite_id
          end
          class Sprite_Character
            alias sl_id_original_update update
            def create_id_sprite(text)
              bitmap=Bitmap.new(160,16);bitmap.font.name='NanumGothic';bitmap.font.size=12;bitmap.font.bold=false
              bitmap.font.color.set(0,0,0);bitmap.draw_text(0,-1,160,16,text,1);bitmap.draw_text(0,1,160,16,text,1);bitmap.draw_text(-1,0,160,16,text,1);bitmap.draw_text(1,0,160,16,text,1)
              bitmap.font.color.set(255,255,255);bitmap.draw_text(0,0,160,16,text,1)
              @_id_sprite=Sprite.new(self.viewport);@_id_sprite.bitmap=bitmap;@_id_sprite.opacity=255;@_id_sprite.ox=80;@_id_sprite.oy=14;@_id_sprite.x=self.x;@_id_sprite.y=self.y-self.oy/2;@_id_sprite.z=9999;@_id_sprite_visible=true
            end
            def dispose_id_sprite
              if @_id_sprite!=nil;@_id_sprite.bitmap.dispose if @_id_sprite.bitmap!=nil&&!@_id_sprite.bitmap.disposed?;@_id_sprite.dispose;@_id_sprite=nil;end
              @_id_sprite_visible=false
            end
            def update_id_sprite
              if @character.sprite_id!=nil&&@character.sprite_id.to_s!='';create_id_sprite(@character.sprite_id) unless @_id_sprite_visible;@_id_sprite.x=self.x;@_id_sprite.y=self.y-self.oy
              elsif @_id_sprite_visible;dispose_id_sprite;end
            end
            def update;sl_id_original_update;update_id_sprite;end
          end
          RUBY
          id_output=<<'RUBY'
          class Game_Event
            alias sl_id_original_event_refresh refresh
            def refresh
              sl_id_original_event_refresh;text=@event.name.dup;text.gsub!(/\x5b[Ii][Dd](.+?)\x5d/){@sprite_id=$1};@sprite_id=nil if @erased||@character_name==''
            end
          end
          class Game_Player
            alias sl_id_original_player_refresh refresh
            def refresh;sl_id_original_player_refresh;@sprite_id=nil if $game_party.actors.size>0;end
          end
          RUBY
          scripts.reject!{|e|e.is_a?(Array)&&e.length>=3&&['Web Compatibility','Web Resolution 800x600','Mobile Diablo Assist'].include?(e[1].to_s)}
          scripts.insert(0,[0,'Web Compatibility',Zlib::Deflate.deflate(compat)])
          font_rules=[[/((?:Font\.default_name)\s*=\s*)\[\s*["'][^"']*["']\s*\]/n,'\1"NanumGothic"'],[/(Font\.default_name\s*=\s*)["'][^"']*["']/n,'\1"NanumGothic"'],[/(\.font\.name\s*=\s*)["'][^"']*["']/n,'\1"NanumGothic"'],[/(\bFONT_NAME\s*=\s*)["'][^"']*["']/n,'\1"NanumGothic"']]
          scripts.each do |entry|
            next unless entry.is_a?(Array)&&entry.length>=3
            name=entry[1].to_s
            begin;text=inflate(entry);rescue;next;end
            font_rules.each{|rx,rep|text.gsub!(rx,rep)}
            text.gsub!('defined?($joiplay) && $joiplay','$joiplay == true')
            if text.include?('class Sprite_Character < Sprite_Character');text=id_sprite
            elsif text.include?('class Game_Event < Game_Event')&&text.include?('class Game_Player < Game_Player');text=id_output
            elsif text.match?(/^\s*class\s+Plane\s*<\s*Sprite\b/n);text="# native Plane used on web\n";end
            text=patch_begin_until(text)
            text=patch_scene_loop(text) unless name=='Main'||name=='Scene_Map'||name=='Scene_Equip'
            if name=='Main'
              text=browser_loop+text unless text.include?('def main_update_loop')
              text.sub!(/\n\s*while\s+\$scene\s*!=\s*nil\s*\r?\n\s*\$scene\.main\s*\r?\n\s*end\s*/m,"\n")
            end
            text.gsub!('Viewport.new(0, 0, 640, 480)','Viewport.new(0, 0, $WINDOW_WIDTH, $WINDOW_HEIGHT)')
            store(entry,text)
          end
          res=scripts.find{|e|e.is_a?(Array)&&e.length>=3&&e[1].to_s=='해상도'}
          if res
            t=inflate(res);t.gsub!('$WINDOW_WIDTH = 640','$WINDOW_WIDTH = 800');t.gsub!('$WINDOW_HEIGHT = 480','$WINDOW_HEIGHT = 600');t.gsub!('640, 480','800, 600');store(res,t)
          end
          save=scripts.find{|e|e.is_a?(Array)&&e.length>=3&&e[1].to_s=='Scene_Save'}
          if save
            t=inflate(save)
            unless t.include?('save_file_async(filename)')
              t.sub!(/    write_save_data\(file\)\r?\n    exit/,"    write_save_data(file)\n    file.close\n    save_file_async(filename)")
            end
            store(save,t)
          end
          main_index=scripts.index{|e|e.is_a?(Array)&&e.length>=3&&e[1].to_s=='Main'} or abort 'Fairy Main missing'
          shim="$WINDOW_WIDTH = 800\n$WINDOW_HEIGHT = 600\nbegin\n  Graphics.resize_screen(800, 600)\nrescue\nend\n"
          scripts.insert(main_index,[99999990,'Web Resolution 800x600',Zlib::Deflate.deflate(shim)])
          out=File.join(game,'Data','Scripts.rxdata');File.binwrite(out,Marshal.dump(scripts))
          File.delete(source_path) if File.expand_path(source_path)!=File.expand_path(out)&&File.exist?(source_path)
          lines=ini.split(/\r?\n/).map{|line|line=~/^Scripts=/i ? 'Scripts=Data\\Scripts.rxdata' : line=~/^Title=/i ? 'Title=SLFairy' : line}
          File.binwrite(ini_path,lines.join("\r\n")+"\r\n")
          puts 'FAIRY_KNIGHT_BOOT_PATCH_OK'
          RB
          ruby -c /tmp/patch_fairy_knight_boot.rb
          ruby -EUTF-8:UTF-8 /tmp/patch_fairy_knight_boot.rb fairy_player/gameasync
          bash -e /tmp/fairy_media.sh
          (cd fairy_player/gameasync && bash "$GITHUB_WORKSPACE/engine/extra/make_mapping.sh")
      - name: Clean Fairy browser identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('fairy_player/index.html');s=p.read_text(encoding='utf-8')
          for var in ('slAttackSheets','slAttackCoords','slTransformSheets'):
              s=re.sub(r'\n\s*var '+re.escape(var)+r'=.*?\n\s*\}\);','',s,count=1,flags=re.S)
          s=re.sub(r"var namespace = '[^']*';","var namespace = 'slfairy_v105_engine';",s,count=1)
          s=re.sub(r"var wTitle = '[^']*'","var wTitle = 'SLFairy 800';",s,count=1)
          s=s.replace('<title>SLKnight V14.3l</title>','<title>SLFairy 800</title>')
          s=s.replace('gameasync/mapping.js?v=v143z100','gameasync/mapping.js?v=fairy800')
          s=s.replace('js/drive.js?v=v143z100','js/drive.js?v=fairy800')
          s=s.replace('js/dpad.js?v=v143z100','js/dpad.js?v=fairy800')
          old="""var log=console.log.bind(console);
            console.log=function(){
              var a=[].slice.call(arguments),t=a.join(' ');
              try{marker(t);}catch(e){log('SLAUDIOJSERR|'+e);}
              if(/SLRUNTIMEERR|SLSCRIPTERR/.test(t))err(t);
              log.apply(console,a);
            };
            window.addEventListener('error',function(e){err('JS ERROR | '+e.message);});""".replace('            ','')
          new="""var log=console.log.bind(console),elog=console.error.bind(console);
          console.log=function(){var a=[].slice.call(arguments),t=a.join(' ');try{marker(t);}catch(e){log('SLAUDIOJSERR|'+e);}if(/SLRUNTIMEERR|SLSCRIPTERR| - err/.test(t))err(t);log.apply(console,a);};
          console.error=function(){var a=[].slice.call(arguments),t=a.join(' ');if(/SLRUNTIMEERR|SLSCRIPTERR| - err|NO SUCH FILE|PHYSFS/i.test(t))err(t);elog.apply(console,a);};
          window.addEventListener('error',function(e){err('JS ERROR | '+e.message);});""".replace('          ','')
          if old in s:s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check fairy_player/js/drive.js
          node --check fairy_player/js/dpad.js
      - name: Build dual site
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/knight site/elf
          cp -a player/. site/knight/
          cp -a fairy_player/. site/elf/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>SLKnight + SLFairy</title><style>html,body{margin:0;width:100%;height:100%;background:#080808;color:#fff;font-family:system-ui,sans-serif}.wrap{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px}.choices{display:flex;gap:16px}button{width:150px;height:160px;border:1px solid #777;border-radius:14px;background:#171717;color:#fff;font-size:25px}</style></head><body><div class="wrap"><h1>캐릭터 선택</h1><div class="choices"><button onclick="location.href='knight/?v='+Date.now()">기사</button><button onclick="location.href='elf/?v='+Date.now()">요정</button></div></div></body></html>
          HTML
          touch site/.nojekyll
          rm -rf player fairy_player
          mv site player
      - name: Minimal package check
        run: |
          set -euo pipefail
          test -s player/index.html
          for side in knight elf; do
            test -s player/$side/index.html
            test -s player/$side/mkxp.js
            test -s player/$side/mkxp.wasm
            test -s player/$side/gameasync/Data/Scripts.rxdata
            test -s player/$side/gameasync/mapping.js
          done
          echo PACKAGE_FILES_OK
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
