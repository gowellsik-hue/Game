
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V250
# BASE: V247 successful run 41382471524
# FIX: V249 invalid YAML indentation.
# FIX: Remove fatal runtime graphics preload from Map025.
# FIX: Guard Zenith-specific sprite operations.
# DISPLAY: Permanent V250 badge in the game.
# PRELOAD: Browser preload of original motion and FX assets.
# KEEP: Original combat, rewards, maps, NPCs and Map047.
# STATUS: Awaiting GitHub Actions and mobile verification.

name: build-slknight-web.yml | V250 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: V250 Restore verified V247 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41382471524
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V250 Verify original game inventory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p site build
          test -s baseline/artifact.tar
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          root=Path("site")
          before={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob("*") if p.is_file()
          }

          assert len(before)==5610, (
              "Wrong V247 inventory",len(before)
          )

          pre=(
              "knight/gameasync/Data/"
              "MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"
          )

          for mid in (16,25,47):
              assert pre+f"Map{mid:03d}.rxdata" in before

          for mid in (45,46):
              assert pre+f"Map{mid:03d}.rxdata" not in before

          assert "knight/assets/map-047-v241.pack" in before

          for motion in (
              "Walk","Idle","Attack","AltAttack",
              "Spell","Hit","Death"
          ):
              name=(
                  "knight/gameasync/Graphics/"
                  "Characters/SLZenith"+motion+".png"
              )
              assert name in before

          Path("build/before.json").write_text(
              json.dumps(before,sort_keys=True)
          )
          print("PASS original V247 inventory")
          PY

      - name: V250 Repair isolated runtime
        shell: bash
        run: |
          set -euo pipefail

          cat > build/fix.rb <<'RUBY'
          require 'zlib'

          path='site/knight/gameasync/Data/Scripts.rxdata'
          scripts=Marshal.load(File.binread(path))

          raise 'Invalid RGSS scripts' unless
            scripts.is_a?(Array)

          indices=scripts.each_index.select do |i|
            scripts[i].is_a?(Array) &&
              scripts[i][1]=='SLZenithV247'
          end

          raise 'Original runtime not unique' unless
            indices.length==1

          index=indices.first
          entry=scripts[index]
          source=Zlib::Inflate.inflate(entry[2])
          source.force_encoding('UTF-8')
          raise 'Invalid runtime encoding' unless
            source.valid_encoding?

          original=source.dup

          def replace_once!(code,old,new_text,label)
            count=code.scan(old).length
            raise "Wrong anchor #{label}: #{count}" unless
              count==1
            code.sub!(old){new_text}
          end

          required=[
            'MAX_HP=5200',
            'PHYSICAL=[50,100]',
            'MAGIC=[150,300]',
            'ACCURACY=9999',
            'ATTACK_WAIT=20',
            'EXP=43212',
            'ADENA=[64800,151200]',
            'MAGIC_FX_IDS=[25,14,15,16]'
          ]

          required.each do |value|
            raise "Wrong combat source: #{value}" unless
              source.include?(value)
          end

          # The browser loads the assets through the
          # exact native mapping URLs before gameplay.
          # Do not invoke unsupported RPG::Cache calls
          # during Game_Map.setup.
          replace_once!(
            source,
            /^  def self\.preload\n.*?^  end(?=\n\n  def self\.show_hp)/m,
            "  def self.preload\n    true\n  end",
            'preload method'
          )

          # Prevent a missing movement-state method
          # from interrupting the entire map update.
          replace_once!(
            source,
            "name=moving? ? 'SLZenithWalk' : 'SLZenithIdle'",
            "name=(respond_to?(:moving?) && moving?) ? 'SLZenithWalk' : 'SLZenithIdle'",
            'movement state'
          )

          # Apply guards only to the new boss sprite.
          replace_once!(
            source,
            'return unless @tile_id==0 && bitmap',
            'return unless @tile_id==0 && respond_to?(:bitmap) && bitmap && bitmap.respond_to?(:width) && bitmap.respond_to?(:height)',
            'sprite bitmap'
          )

          replace_once!(
            source,
            "raise 'Zenith sprite width mismatch' unless bitmap.width%total==0",
            'return unless bitmap.width%total==0',
            'sprite width'
          )

          replace_once!(
            source,
            "raise 'Zenith sprite height mismatch' unless bitmap.height%4==0",
            'return unless bitmap.height%4==0',
            'sprite height'
          )

          replace_once!(
            source,
            'row=(@character.direction-2)/2',
            "return unless @character.respond_to?(:direction)\n    row=(@character.direction.to_i-2)/2",
            'sprite direction'
          )

          replace_once!(
            source,
            'self.src_rect.set(frame*@cw,row*@ch,@cw,@ch)',
            "return unless respond_to?(:src_rect) && src_rect && src_rect.respond_to?(:set)\n    self.src_rect.set(frame*@cw,row*@ch,@cw,@ch)",
            'sprite rectangle'
          )

          replace_once!(
            source,
            'self.z=@character.screen_z(@ch)',
            'self.z=@character.screen_z(@ch) if respond_to?(:z=) && @character.respond_to?(:screen_z)',
            'sprite depth'
          )

          # There is no native-cache call on entering
          # Map025. Browser preloading is installed
          # separately in knight/index.html.
          replace_once!(
            source,
            'SLZenith.preload if map_id==SLZenith::MAP_ID',
            'nil # V250 browser preloads original assets',
            'map setup preload'
          )

          source.sub!(
            'SLZenith V247:',
            'SLZenith V250:'
          )

          # Preserve original event aliases and
          # all combat and reward calculations.
          raise 'Native Game_Event alias changed' unless
            source.include?(
              'alias slz_v247_native_update update'
            )

          raise 'Native Sprite alias changed' unless
            source.include?(
              'alias slz_v247_native_update update'
            )

          required.each do |value|
            raise "Combat modified: #{value}" unless
              source.include?(value)
          end

          drop_pattern=/DROPS=\[\n.*?\n  \]/m
          raise 'Drop table modified' unless
            original[drop_pattern] &&
            source[drop_pattern]==original[drop_pattern]

          motion_pattern=/FRAMES=\{.*?\}/m
          raise 'Original motions modified' unless
            source[motion_pattern]==original[motion_pattern]

          File.write('build/zenith-runtime.rb',source)

          entry[0]=99825001
          entry[1]='SLZenithV250'
          entry[2]=Zlib::Deflate.deflate(source,9)

          File.binwrite(path,Marshal.dump(scripts))

          verify=Marshal.load(File.binread(path))
          raise 'Runtime serialization failed' unless
            verify[index][1]=='SLZenithV250' &&
            Zlib::Inflate.inflate(verify[index][2])==
            source

          puts 'PASS original runtime retained'
          puts 'PASS fatal Map025 cache preload disabled'
          puts 'PASS sprite method guards installed'
          puts 'PASS combat, drops and graphics unchanged'
          RUBY

          ruby -c build/fix.rb
          ruby build/fix.rb
          ruby -c build/zenith-runtime.rb

      - name: V250 Verify runtime entry protection
        shell: bash
        run: |
          set -euo pipefail

          cat > build/test.rb <<'RUBY'
          class Game_Event
            attr_accessor :character_name,:direction
            def update;end
          end

          class Game_Map
            attr_accessor :map_id,:events
            def setup(id)
              @map_id=id
              :native_ready
            end
          end

          class Sprite_Character
            def update;end
            def bitmap;nil;end
          end

          $game_map=Game_Map.new
          $game_map.events={}
          $game_variables=Hash.new(0)
          $game_switches=Hash.new(false)
          $m=nil

          load 'build/zenith-runtime.rb'

          raise 'Wrong boss ID' unless
            SLZenith::EVENT_ID==29

          raise 'Wrong physical attack' unless
            SLZenith::PHYSICAL==[50,100]

          raise 'Wrong magic attack' unless
            SLZenith::MAGIC==[150,300]

          raise 'Wrong boss HP' unless
            SLZenith::MAX_HP==5200

          raise 'Original drops changed' unless
            SLZenith::DROPS.length==20 &&
            SLZenith::DROPS.include?([:armor,492,3])

          result=$game_map.setup(25)

          raise 'Map025 startup failed' unless
            result==:native_ready

          boss=Game_Event.new
          boss.instance_variable_set(:@map_id,25)
          boss.instance_variable_set(:@id,29)
          boss.character_name='SLZenithIdle'
          boss.direction=2
          $game_map.events[29]=boss

          # Missing moving? must not crash the map.
          boss.update

          sprite=Sprite_Character.new
          sprite.instance_variable_set(:@character,boss)
          sprite.instance_variable_set(:@tile_id,0)
          sprite.update

          result=$game_map.setup(47)
          raise 'Other map setup changed' unless
            result==:native_ready

          puts 'PASS Map025 setup without RPG::Cache'
          puts 'PASS missing moving? handled'
          puts 'PASS missing sprite bitmap handled'
          puts 'PASS original reward and combat constants'
          puts 'PASS Map047 native setup'
          RUBY

          ruby -c build/test.rb
          ruby build/test.rb

      - name: V250 Install permanent version display
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib,re
          from pathlib import Path

          root=Path('site')
          mapping=root/'knight/gameasync/mapping.js'
          script=root/'knight/gameasync/Data/Scripts.rxdata'

          content=mapping.read_text('utf-8')
          digest=hashlib.md5(script.read_bytes()).hexdigest()

          pattern=(
              r'(Data/Scripts\.rxdata\?h=)'
              r'[0-9a-f]{32}'
          )

          content,count=re.subn(
              pattern,
              lambda m:m.group(1)+digest,
              content
          )
          assert count==1,('Script mapping mismatch',count)
          mapping.write_text(content,'utf-8')

          loader=root/'knight/js/sl-assets-v229r115.js'
          loader_text=loader.read_text('utf-8')

          assert loader_text.count("var version='V247';")==1
          loader.write_text(
              loader_text.replace(
                  "var version='V247';",
                  "var version='V250';"
              ),
              'utf-8'
          )

          motions=[
              'Walk','Idle','Attack','AltAttack',
              'Spell','Hit','Death'
          ]

          # Reuse exact hashed URLs from the original
          # game mapping to avoid duplicate downloads.
          resources=[
              'Graphics/Characters/SLZenith'+
              motion+'.png'
              for motion in motions
          ]

          resources.extend(
              'Graphics/Animations/'+name+'.png'
              for name in (
                  '이펙트마법',
                  '물의 대정령 마법',
                  '불의 대정령 마법',
                  '땅의 대정령 마법'
              )
          )

          preload=[]
          for resource in resources:
              match=re.search(
                  re.escape(resource)+
                  r'\?h=[0-9a-f]{32}',
                  content
              )
              assert match,(
                  'Missing original graphic mapping',
                  resource
              )
              preload.append(
                  '<link rel="preload" as="image" href="gameasync/'+
                  match.group(0)+'">'
              )

          banner=(
              '<div id="sl-build-version-v250" '
              'style="position:fixed;top:6px;left:50%;'
              'transform:translateX(-50%);z-index:2147483000;'
              'padding:4px 11px;background:rgba(0,0,0,.8);'
              'border:1px solid #999;border-radius:6px;'
              'color:#fff;font:700 14px sans-serif;'
              'pointer-events:none;white-space:nowrap">'
              'SLKnight V250</div>'
          )

          for relative in ('index.html','knight/index.html'):
              path=root/relative
              html=path.read_text('utf-8')
              assert 'V247' in html,relative

              html=html.replace('V247','V250')
              html=html.replace('?v=v247','?v=v250')

              assert '</body>' in html,(
                  'HTML body ending missing',relative
              )
              assert 'sl-build-version-v250' not in html

              html=html.replace(
                  '</body>',banner+'\n</body>',1
              )

              if relative=='knight/index.html':
                  assert '</head>' in html
                  html=html.replace(
                      '</head>',
                      '\n'.join(preload)+'\n</head>',1
                  )

              path.write_text(html,'utf-8')
              assert 'SLKnight V250' in html

          print('PASS V250 visible on game screen')
          print('PASS 7 original full-motion assets preloaded')
          print('PASS 4 original magic effect assets preloaded')
          print('PASS V250 loader and RXData cache hashes')
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: V250 Verify all original data preserved
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          root=Path('site')
          before=json.loads(
              Path('build/before.json').read_text('utf-8')
          )
          after={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          allowed={
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html',
              'knight/index.html'
          }

          changed={
              key for key in before
              if before[key]!=after.get(key)
          }

          assert changed==allowed,(
              'Unexpected file modifications',
              sorted(changed^allowed)
          )

          assert set(before)==set(after)
          assert len(after)==5610

          pre=(
              'knight/gameasync/Data/'
              'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          )

          protected=[
              pre+'Map016.rxdata',
              pre+'Map025.rxdata',
              pre+'Map047.rxdata',
              pre+'CommonEvents.rxdata',
              'knight/assets/map-047-v241.pack'
          ]

          for name in protected:
              assert before[name]==after[name],(
                  'Original data modified',name
              )

          for motion in (
              'Walk','Idle','Attack','AltAttack',
              'Spell','Hit','Death'
          ):
              name=(
                  'knight/gameasync/Graphics/'
                  'Characters/SLZenith'+motion+'.png'
              )
              assert before[name]==after[name]

          for name in (
              '이펙트마법',
              '물의 대정령 마법',
              '불의 대정령 마법',
              '땅의 대정령 마법'
          ):
              path=(
                  'knight/gameasync/Graphics/'
                  'Animations/'+name+'.png'
              )
              assert before[path]==after[path]

          html=(
              root/'knight/index.html'
          ).read_text('utf-8')

          assert 'SLKnight V250' in html
          assert 'sl-build-version-v250' in html
          assert html.count('rel="preload"')>=11

          print('PASS Map016 and Map025 unchanged')
          print('PASS Map047 and all NPCs unchanged')
          print('PASS native CommonEvents unchanged')
          print('PASS original graphics unchanged')
          print('PASS permanent V250 version display')
          print('PASS total inventory remains 5610')
          PY

      - name: V250 Publish game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
