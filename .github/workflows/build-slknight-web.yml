name: build-slknight-web.yml | V4.15 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Restore V4.14 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 46015932760
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Restore original item implementation
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 46002274527
          name: sl414-original-runtime-audit
          github-token: ${{ github.token }}
          path: audit

      - name: Verify original game
        shell: bash
        run: |
          set -euo pipefail

          test -s baseline/artifact.tar

          mkdir -p site
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          import json

          root=Path('site')

          before={
              p.relative_to(root).as_posix():
                  hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          assert len(before)==6085

          script=root/'knight/gameasync/Data/Scripts.rxdata'

          assert hashlib.md5(
              script.read_bytes()
          ).hexdigest()=='07e7a62cb188150271de853d2d38facf'

          assert before[
              'knight/gameasync/Data/Scripts.rxdata'
          ]=='e651e2d63092dd3eebf1a185f2482cf80eb478008dc0b540735972e97bfaa8b9'

          image=root/'knight/gameasync/Graphics/Pictures/게이지(저사양)-상.png'

          assert hashlib.md5(
              image.read_bytes()
          ).hexdigest()=='ed37440f448cd7ff710b00aeefd4915e'

          assert before[
              'knight/assets/shared-v229r115.pack'
          ].startswith('848a3d863d953bdc')

          assert before[
              'knight/gameasync/bitmap-map.js'
          ].startswith('30b5b4a619a81d4c')

          previous=Path(
              'audit/V4.14/knight/gameasync/Data/Scripts.rxdata'
          )

          assert hashlib.sha256(
              previous.read_bytes()
          ).hexdigest()=='a51670a58ab4d35567a5a40a955b83c7552f6163c93f9223874192922a68272d'

          Path('/tmp/sl415-before.json').write_text(
              json.dumps(before),
              'utf8'
          )

          print('PASS exact V4.14 baseline')
          print('PASS original item implementation')
          PYTHON

      - name: Build companion HUD
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl415-build.rb <<'RUBY'
          # encoding: UTF-8
          require 'zlib'
          require 'digest'

          base,previous,out=ARGV

          raise 'Arguments' unless out

          raw=File.binread(base)
          old=File.binread(previous)

          raise 'Baseline mismatch' unless
            Digest::MD5.hexdigest(raw)==
            '07e7a62cb188150271de853d2d38facf'

          raise 'Previous item source mismatch' unless
            Digest::SHA256.hexdigest(old)==
            'a51670a58ab4d35567a5a40a955b83c7552f6163c93f9223874192922a68272d'

          rows=Marshal.load(raw)
          item_rows=Marshal.load(old)

          raise 'Count' unless
            rows.size==137 &&
            item_rows.size==137

          before=rows.map{|r|Marshal.dump(r)}

          source=lambda do |a,i|
            Zlib::Inflate.inflate(
              a[i][2]
            ).force_encoding('UTF-8')
          end

          replace=lambda do |s,a,b|

            raise "Anchor #{a.inspect[0,100]}" unless
              s.scan(a).size==1

            s.sub(a){b}

          end

          edit=lambda do |i,s|

            RubyVM::InstructionSequence.compile(s)

            rows[i][2]=Zlib::Deflate.deflate(s.b)

          end

          [26,42,43,71,80,81,93].each do |i|

            raise "Identity #{i}" unless
              rows[i][0,2]==item_rows[i][0,2]

            RubyVM::InstructionSequence.compile(
              source.call(item_rows,i)
            )

            rows[i][2]=item_rows[i][2]

          end

          s=source.call(item_rows,130)

          a=s.index("  def self.draw(w)\n")

          b=s.index("  class Menu\n",a)

          raise 'Legacy renderer bounds' unless
            a && b && b>a

          s=s[0...a]+s[b..-1]

          s=replace.call(
            s,
            "    (store[id]||={})[item] ||=\n      [0,HEAL.key?(item)]\n",
            "    return false if !entry(id,item) && (store[id]||{}).size>=4\n\n    (store[id]||={})[item] ||=\n      [0,HEAL.key?(item)]\n"
          )

          raise 'Old renderer' if
            s.include?('def self.draw(w)') ||
            s.include?('SL414.draw') ||
            s.include?('clear_rect')

          edit.call(130,s)

          s=source.call(rows,105)

          crlf=s.include?("\r\n")

          s=s.gsub("\r\n","\n")

          s=replace.call(
            s,
            /class Window_ExpRate < Window_Base\n.*?(?=class Scene_Map\n)/m,
            <<'NEW'
          class Window_ExpRate < Window_Base
            def initialize
              super(0,464,800,136)

              self.contents=Bitmap.new(
                width-32,
                height-32
              )

              self.contents.font=Font.new(
                "NanumGothic",12
              )

              self.opacity=0
              self.back_opacity=0
            end

            def refresh
              self.contents.clear
              self.contents.font.bold=false

              @show_text[0].each_with_index do |v,i|

                x=i*192

                self.contents.fill_rect(
                  Rect.new(x,0,190,104),
                  Color.new(0,0,0)
                )

                next unless v

                name,lv,hp,mhp,mp,mmp,xp,ac,mr,items=v

                self.contents.font.color=
                  Color.new(192,224,255,255)

                self.contents.draw_text(
                  x+4,0,136,18,
                  name,0
                )

                self.contents.draw_text(
                  x+140,0,46,18,
                  "Lv.#{lv}",2
                )

                self.contents.font.color=
                  Color.new(255,128,128,255)

                self.contents.draw_text(
                  x+4,19,92,16,
                  "HP #{hp}/#{mhp}",0
                )

                self.contents.font.color=
                  Color.new(128,128,255,255)

                self.contents.draw_text(
                  x+98,19,88,16,
                  "MP #{mp}/#{mmp}",0
                )

                self.contents.font.color=
                  Color.new(255,255,128,255)

                self.contents.draw_text(
                  x+4,36,182,16,
                  "EXP #{xp}%",0
                )

                self.contents.font.color=
                  Color.new(255,255,255)

                self.contents.draw_text(
                  x+4,53,92,16,
                  "AC #{ac}",0
                )

                self.contents.draw_text(
                  x+98,53,88,16,
                  "MR #{mr}",0
                )

                if i==0

                  self.contents.font.color=
                    Color.new(255,0,150)

                  self.contents.draw_text(
                    x+4,73,182,24,
                    "DPS #{@show_text[1]} / #{@show_text[2]}",0
                  )

                else

                  items.each_with_index do |q,j|

                    id,n=q

                    item=$data_items[id]

                    next unless item

                    ix=x+4+j*46

                    bitmap=RPG::Cache.icon(
                      item.icon_name
                    )

                    self.contents.blt(
                      ix,70,
                      bitmap,
                      Rect.new(0,0,32,32)
                    )

                    self.contents.font.color=
                      Color.new(0,0,0)

                    self.contents.draw_text(
                      ix+1,85,43,16,
                      n.to_s,2
                    )

                    self.contents.font.color=
                      Color.new(255,255,255)

                    self.contents.draw_text(
                      ix,84,43,16,
                      n.to_s,2
                    )

                  end

                end

              end

            end

            def actor
              $game_party.actors[0]
            end

            def update
              super

              $ne=actor.exp_rate*115

              self.z=999999

              self.visible=
                !$game_temp.message_window_showing

              text=[
                [
                  $game_actors[1],
                  SL414.member(4),
                  SL414.member(5),
                  SL414.member(6)
                ].map do |a|

                  next nil unless a

                  items=a.id==1 ? [] :
                    SL414::IDS.select{
                      |id|SL414.entry(a.id,id)
                    }[0,4].map{
                      |id|[id,SL414.count(a.id,id)]
                    }

                  [
                    a.name.to_s.dup,
                    a.level,
                    a.hp,
                    a.maxhp,
                    a.sp,
                    a.maxsp,
                    sprintf('%.4f',a.exp_rate*100),
                    10-a.pdef,
                    a.mdef,
                    items
                  ]

                end,
                sprintf('%.1f',$DPS1.to_f),
                sprintf('%.1f',$DPS2.to_f)
              ]

              if @show_text!=text

                @show_text=text

                refresh

              end

            end

          end
          NEW
          )

          s=s.gsub("\n","\r\n") if crlf

          edit.call(105,s)

          changed=rows.each_index.select{
            |i|Marshal.dump(rows[i])!=before[i]
          }

          raise "Scope #{changed}" unless
            changed==[26,42,43,71,80,81,93,105,130]

          rows.each_index do |i|

            raise "Identity #{i}" unless
              rows[i][0,2]==item_rows[i][0,2]

            raise "Invalid encoding #{i}" unless
              source.call(rows,i).valid_encoding?

          end

          File.binwrite(
            out,
            Marshal.dump(rows)
          )

          raise 'Round trip' unless
            Marshal.load(
              File.binread(out)
            )==rows

          puts 'PASS 137 script identities'
          puts 'PASS 9 modified scripts'
          puts 'PASS 128 original scripts preserved'
          puts 'PASS existing experience window reused'
          puts 'PASS native inventory icons reused'
          puts 'PASS original four character data'
          puts 'PASS original DPS values reused'
          puts 'PASS four item types per companion'
          puts 'PASS original gauge deletion preserved'
          puts "MD5 #{Digest::MD5.file(out).hexdigest}"
          RUBY

          ruby -c /tmp/sl415-build.rb

          ruby /tmp/sl415-build.rb \
            site/knight/gameasync/Data/Scripts.rxdata \
            audit/V4.14/knight/gameasync/Data/Scripts.rxdata \
            /tmp/sl415.rxdata

          cp /tmp/sl415.rxdata \
            site/knight/gameasync/Data/Scripts.rxdata

      - name: Verify companion HUD and items
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl415-test.rb <<'RUBY'
          # encoding: UTF-8
          require 'zlib'

          rows=Marshal.load(
            File.binread('/tmp/sl415.rxdata')
          )

          read=lambda do |i|
            Zlib::Inflate.inflate(
              rows[i][2]
            ).force_encoding('UTF-8')
          end

          class Color
            def initialize(*a)
              raise unless [3,4].include?(a.size)
            end
          end

          Rect=Struct.new(
            :x,:y,:width,:height
          )

          class Font
            attr_accessor :bold,:color

            def initialize(name,size)
            end
          end

          class Bitmap
            attr_accessor :font

            attr_reader :width,:height,:calls,:clears

            def initialize(w,h)
              @width=w
              @height=h
              @calls=[]
              @clears=0
            end

            def clear
              @calls=[]
              @clears+=1
            end

            def fill_rect(rect,color)
              bounds(
                rect.x,
                rect.y,
                rect.width,
                rect.height
              )
            end

            def draw_text(x,y,w,h,t,a)
              bounds(x,y,w,h)
              @calls<<[x,y,t]
            end

            def blt(x,y,bitmap,rect)
              bounds(
                x,y,
                rect.width,
                rect.height
              )

              @calls<<[x,y,:icon]
            end

            def bounds(x,y,w,h)

              raise "Out of bounds: #{[x,y,w,h]}" unless
                x>=0 &&
                y>=0 &&
                x+w<=@width &&
                y+h<=@height

            end
          end

          class Window_Base

            attr_accessor :width,
              :height,
              :contents,
              :visible,
              :opacity,
              :back_opacity,
              :z

            def initialize(x,y,w,h)
              @width=w
              @height=h
              @visible=true
            end

            def update
            end

          end

          module RPG

            Item=Struct.new(:id,:icon_name)

            module Cache
              def self.icon(name)
                Bitmap.new(32,32)
              end
            end

          end

          module Graphics
            def self.frame_count
              100
            end
          end

          class Game_Battler
          end

          class Game_Actor < Game_Battler

            attr_accessor :id,
              :name,
              :level,
              :hp,
              :maxhp,
              :sp,
              :maxsp,
              :pdef,
              :mdef,
              :armor_ids

            def initialize(id)

              @id=id
              @name="Actor #{id}"
              @level=30
              @hp=300
              @maxhp=350
              @sp=40
              @maxsp=50
              @pdef=35
              @mdef=30
              @sl43_hired=id!=1
              @armor_ids=[]
              @exp=40
              @exp_list=Array.new(101,0)
              @exp_list[30]=0
              @exp_list[31]=100

            end

          end

          class Party

            attr_accessor :actors

            def initialize(actors)
              @actors=actors
              @items=Hash.new(0)
            end

            def item_number(i)
              @items[i]
            end

            def gain_item(i,n)

              @items[i]=[
                [item_number(i)+n,0].max,
                $item_maximum
              ].min

            end

            def lose_item(i,n)
              gain_item(i,-n)
            end

          end

          class Scene_Map
            def update
            end
          end

          $item_maximum=9999

          $game_actors={}

          [1,4,5,6].each do |id|
            $game_actors[id]=Game_Actor.new(id)
          end

          $game_party=Party.new(
            $game_actors.values
          )

          $game_temp=Struct.new(
            :message_window_showing
          ).new(false)

          $data_items={}

          [1,16,70,71,86,1006].each do |i|
            $data_items[i]=RPG::Item.new(
              i,"icon#{i}"
            )
          end

          $DPS1=110.1
          $DPS2=112.8

          src=read.call(130)

          eval(
            src[0...src.index("module SLHotbar\n")],
            TOPLEVEL_BINDING,
            'actual_item_code'
          )

          eval(
            read.call(105),
            TOPLEVEL_BINDING,
            'actual_hud_code'
          )

          def check(c,label)

            raise label unless c

            puts "PASS #{label}"

          end

          $game_party.gain_item(1,100)

          check(
            SL414.give(4,1,30),
            'give 30'
          )

          check(
            SL414.owner(1)==70 &&
            SL414.count(4,1)==30,
            'give quantity conserved'
          )

          check(
            SL414.recall(4,1,10),
            'recall 10'
          )

          check(
            SL414.owner(1)==80 &&
            SL414.count(4,1)==20,
            'recall quantity conserved'
          )

          check(
            SL414.designate(5,1),
            'second member designation'
          )

          SL414.buy(1,12)

          check(
            SL414.owner(1)==84 &&
            SL414.count(4,1)==24 &&
            SL414.count(5,1)==4,
            'purchase distribution'
          )

          check(
            SL414.equalize(1),
            'equalize'
          )

          check(
            [
              SL414.owner(1),
              SL414.count(4,1),
              SL414.count(5,1)
            ]==[38,37,37],
            'equalize conserved'
          )

          [16,70,1006].each do |id|

            check(
              SL414.designate(4,id),
              "designate #{id}"
            )

          end

          check(
            !SL414.designate(4,71),
            'reject fifth designation'
          )

          check(
            SL414.designate(4,1),
            'retain existing designation'
          )

          $game_party.gain_item(1006,20)

          check(
            SL414.give(4,1006,10),
            'give arrows'
          )

          SL414.spend_arrow($game_actors[4])

          check(
            SL414.ammo($game_actors[4])==9 &&
            SL414.owner(1006)==10,
            'companion arrows independent'
          )

          w=Window_ExpRate.new

          w.update

          check(
            w.contents.clears==1,
            'initial refresh'
          )

          check(
            w.contents.calls.count{
              |x|x[2]==:icon
            }==5,
            'designated item icons only'
          )

          check(
            w.contents.calls.count{
              |x|x[2].is_a?(String) &&
                x[2].start_with?('EXP ')
            }==4,
            'four experience values'
          )

          check(
            w.contents.calls.count{
              |x|x[2].is_a?(String) &&
                x[2].start_with?('MR ')
            }==4,
            'four MR values'
          )

          check(
            w.contents.calls.any?{
              |x|x[2]=='DPS 110.1 / 112.8'
            },
            'original DPS values'
          )

          w.update

          check(
            w.contents.clears==1,
            'unchanged snapshot no redraw'
          )

          $game_actors[5].hp-=1

          w.update

          check(
            w.contents.clears==2,
            'HP change redraw'
          )

          SL414.spend_arrow(
            $game_actors[4]
          )

          w.update

          check(
            w.contents.clears==3,
            'item count change redraw'
          )

          $game_party.actors.delete(
            $game_actors[6]
          )

          w.update

          check(
            w.contents.calls.count{
              |x|x[2].is_a?(String) &&
                x[2].start_with?('EXP ')
            }==3,
            'empty member panel'
          )

          $game_temp.message_window_showing=true

          w.update

          check(
            !w.visible,
            'native dialogue not covered'
          )

          $game_temp.message_window_showing=false

          w.update

          check(
            w.visible,
            'HUD restored after dialogue'
          )

          $game_actors[4].hp=100

          before=SL414.count(4,1)

          e=Struct.new(:animation_id).new

          SL414.drink(
            $game_actors[4],e
          )

          check(
            $game_actors[4].hp==125 &&
            SL414.count(4,1)==before-1,
            'automatic potion'
          )

          SL414.drink(
            $game_actors[4],e
          )

          check(
            $game_actors[4].hp==125 &&
            SL414.count(4,1)==before-1,
            'automatic potion cooldown'
          )
          RUBY

          ruby /tmp/sl415-test.rb

      - name: Update V4.15 script mapping
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          import json

          root=Path('site')
          game=root/'knight/gameasync'

          mapper=game/'mapping.js'

          old_mapping_digest=hashlib.sha256(
              mapper.read_bytes()
          ).hexdigest()[:16]

          script=game/'Data/Scripts.rxdata'

          script_digest=hashlib.md5(
              script.read_bytes()
          ).hexdigest()

          old_script_digest='07e7a62cb188150271de853d2d38facf'

          assert script_digest!=old_script_digest

          s=mapper.read_text('utf8')

          old_marker=(
              'Data/Scripts.rxdata?h='+
              old_script_digest
          )

          new_marker=(
              'Data/Scripts.rxdata?h='+
              script_digest
          )

          assert s.count(old_marker)==1

          s=s.replace(
              old_marker,new_marker
          )

          assert s.count(new_marker)==1

          mapper.write_text(s,'utf8')

          mapping_digest=hashlib.sha256(
              mapper.read_bytes()
          ).hexdigest()[:16]

          bitmap_map=game/'bitmap-map.js'

          bitmap_digest=hashlib.sha256(
              bitmap_map.read_bytes()
          ).hexdigest()[:16]

          assert bitmap_digest=='30b5b4a619a81d4c'

          loader=root/'knight/js/sl-assets-v229r115.js'

          old_loader_digest=hashlib.sha256(
              loader.read_bytes()
          ).hexdigest()[:16]

          s=loader.read_text('utf8')

          assert s.count(
              "var version='V4.14';"
          )==1

          assert s.count(
              'shared-v229r115.pack?v=V4.14&h=848a3d863d953bdc'
          )==1

          s=s.replace(
              "var version='V4.14';",
              "var version='V4.15';"
          )

          loader.write_text(s,'utf8')

          loader_digest=hashlib.sha256(
              loader.read_bytes()
          ).hexdigest()[:16]

          page=root/'knight/index.html'

          s=page.read_text('utf8')

          references=[
              (
                  'gameasync/mapping.js?v=v4.14&h='+old_mapping_digest,
                  'gameasync/mapping.js?v=v4.15&h='+mapping_digest,
                  1
              ),
              (
                  'gameasync/bitmap-map.js?v=v4.14&h='+bitmap_digest,
                  'gameasync/bitmap-map.js?v=v4.15&h='+bitmap_digest,
                  2
              ),
              (
                  'js/sl-assets-v229r115.js?v=v4.14&h='+old_loader_digest,
                  'js/sl-assets-v229r115.js?v=v4.15&h='+loader_digest,
                  1
              )
          ]

          for old,new,count in references:

              assert s.count(old)==count,(
                  old,s.count(old)
              )

              s=s.replace(old,new)

              assert s.count(new)==count

          assert 'V4.14' in s

          s=s.replace(
              'V4.14','V4.15'
          )

          page.write_text(
              s,'utf8'
          )

          index_page=root/'index.html'

          s=index_page.read_text('utf8')

          assert 'V4.14' in s

          index_page.write_text(
              s.replace(
                  'V4.14','V4.15'
              ).replace(
                  'v4.14','v4.15'
              ),
              'utf8'
          )

          print('PASS V4.15 script mapping')
          print('PASS original resource pack retained')
          print('PASS original HUD deletion retained')
          print('PASS current script cache',script_digest)
          print('PASS current mapping cache',mapping_digest)
          PYTHON

      - name: Verify exact modification scope
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          import json

          root=Path('site')

          before=json.loads(
              Path('/tmp/sl415-before.json').read_text('utf8')
          )

          after={
              p.relative_to(root).as_posix():
                  hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

