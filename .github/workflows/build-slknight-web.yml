
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V242
# BASE: Successful V241, run 41293648580.
# CHANGE: Add Zenith Queen to existing Map025 (Tower of Insolence 2F).
# KEEP: All existing maps, NPCs, monsters, player systems, Map047 assets.
# NO NEW ITEM: Reuse existing Zenith Ring, Armor ID 492.
# NOTE: Original SPR banks are read from Sanctuary V34 archives.
# TEST STATUS: Implementation prepared; GitHub execution not yet verified.

name: build-slknight-web.yml | V242 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: V242 Restore successful V241 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41293648580
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V242 Verify baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s baseline/artifact.tar
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json

          root=Path("site")
          files={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob("*") if p.is_file()
          }

          if len(files)!=5603:
              raise RuntimeError("Expected V241 inventory: 5603 files")

          scripts="knight/gameasync/Data/Scripts.rxdata"
          expected=(
              "f43507920c57e81ec1d219bae492f5e"
              "6191f6471f733d8d471f81e8515f7d167"
          )
          if files[scripts]!=expected:
              raise RuntimeError("V241 Scripts.rxdata mismatch")

          prefix=(
              "knight/gameasync/Data/"
              "MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"
          )

          if prefix+"Map025.rxdata" not in files:
              raise RuntimeError("Tower of Insolence 2F missing")

          for mid in (45,46):
              if prefix+f"Map{mid:03d}.rxdata" in files:
                  raise RuntimeError("Deleted dungeon restored")

          Path("build/before.json").write_text(
              json.dumps(files,sort_keys=True)
          )
          print("PASS verified V241 baseline")
          PY

      - name: V242 Download original Sanctuary motion source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p original packages

          gh run download 39386289505 \
            -R "$GITHUB_REPOSITORY" \
            -n audit-sanctuary-monsters-v34-all-source-database \
            -D original

          gh run download 39386289505 \
            -R "$GITHUB_REPOSITORY" \
            -n audit-sanctuary-monsters-v34-all-original-cardinal-gifs \
            -D packages

          test -s original/V34-all-cardinal-gif-manifest.csv

          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil

      - name: V242 Build original Zenith Queen character sheets
        shell: bash
        run: |
          set -euo pipefail

          cat > build/graphics.py <<'PY'
          import csv,io,hashlib,zipfile
          from pathlib import Path
          from PIL import Image

          root=Path("site/knight/gameasync/Graphics/Characters")
          root.mkdir(parents=True,exist_ok=True)

          manifest=Path(
              "original/V34-all-cardinal-gif-manifest.csv"
          )

          with manifest.open(encoding="utf-8-sig",newline="") as f:
              rows=[
                  r for r in csv.DictReader(f)
                  if int(r["actor"])==2807
                  and int(r["direction"]) in (1,3,5,7)
                  and r["byte_verified"]=="True"
              ]

          if not rows:
              raise RuntimeError("Original SPR 2807 not found")

          required={
              r["gif"].removeprefix("gifs/"):r
              for r in rows
          }
          loaded={}

          archives=sorted(Path("packages").rglob(
              "V34-*-cardinal-gifs.zip"
          ))
          if len(archives)!=17:
              raise RuntimeError("Expected 17 original GIF archives")

          for archive in archives:
              with zipfile.ZipFile(archive) as z:
                  for name in z.namelist():
                      if name not in required:
                          continue
                      data=z.read(name)
                      digest=hashlib.sha256(data).hexdigest()
                      if digest!=required[name]["gif_sha256"]:
                          raise RuntimeError("Original GIF hash mismatch")
                      loaded[name]=data

          if set(loaded)!=set(required):
              missing=set(required)-set(loaded)
              raise RuntimeError(
                  f"Missing original Zenith GIFs: {len(missing)}"
              )

          groups={}
          for name,record in required.items():
              bank=int(record["bank"])
              direction=int(record["direction"])
              groups.setdefault(bank,{})[direction]=loaded[name]

          banks=[
              bank for bank in sorted(groups)
              if all(d in groups[bank] for d in (1,3,5,7))
          ]

          if len(banks)<5:
              raise RuntimeError(
                  "Insufficient 4-direction Zenith motion banks"
              )

          # Preserve the original source bank ordering.
          # Action classification must be checked in gameplay QA.
          motions=[
              ("SLZenithWalk",banks[0]),
              ("SLZenithAttack",banks[1]),
              ("SLZenithHit",banks[2]),
              ("SLZenithDeath",banks[3]),
              ("SLZenithMagic",banks[4]),
          ]

          directions=(1,3,5,7)

          for output,bank in motions:
              frames={}
              for row,direction in enumerate(directions):
                  raw=groups[bank][direction]
                  with Image.open(io.BytesIO(raw)) as gif:
                      seq=[]
                      count=max(1,gif.n_frames)
                      indexes=[
                          min(count-1,(i*count)//4)
                          for i in range(4)
                      ]
                      for index in indexes:
                          gif.seek(index)
                          seq.append(gif.convert("RGBA").copy())
                      frames[row]=seq

              width=max(
                  image.width for seq in frames.values()
                  for image in seq
              )
              height=max(
                  image.height for seq in frames.values()
                  for image in seq
              )

              canvas=Image.new(
                  "RGBA",(width*4,height*4),(0,0,0,0)
              )

              for row,seq in frames.items():
                  for col,image in enumerate(seq):
                      x=col*width+(width-image.width)//2
                      y=row*height+(height-image.height)
                      canvas.alpha_composite(image,(x,y))

              target=root/(output+".png")
              canvas.save(target,optimize=True)
              if target.stat().st_size<100:
                  raise RuntimeError("Invalid output "+str(target))
              print("PASS",target,canvas.size,"bank",bank)

          print("PASS five original-source motion sheets generated")
          PY

          python3 build/graphics.py

      - name: V242 Create Zenith Queen event and combat runtime
        shell: bash
        run: |
          set -euo pipefail

          cat > build/zenith.rb <<'RUBY'
          require 'zlib'
          require 'digest'

          module RPG
            class Map;end
            class MapInfo;end
            class AudioFile;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end

          class Table
            def self._load(raw)
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end
            def _dump(level=0);@raw;end
          end

          class Tone
            def self._load(raw)
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end
            def _dump(level=0);@raw;end
          end

          class Color<Tone;end

          def iv(obj,name)
            obj.instance_variable_get("@"+name.to_s)
          end

          def put(obj,name,value)
            obj.instance_variable_set("@"+name.to_s,value)
          end

          def command(code,params=[])
            obj=RPG::EventCommand.allocate
            put(obj,:code,code)
            put(obj,:indent,0)
            put(obj,:parameters,params)
            obj
          end

          ROOT='site/knight/gameasync/Data/'
          PRE='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          MAP=ROOT+PRE+'Map025.rxdata'
          SCRIPTS=ROOT+'Scripts.rxdata'
          HPVAR=2991

          map=Marshal.load(File.binread(MAP))
          events=iv(map,:events)

          raise 'Map025 missing events' unless events.is_a?(Hash)
          template=events[11]
          raise 'Map025 EV11 missing' unless template

          template_name=iv(template,:name).to_s
          unless template_name.include?('메두사')
            raise 'Wrong Map025 monster template'
          end

          boss=Marshal.load(Marshal.dump(template))
          boss_id=events.keys.max+1

          put(boss,:id,boss_id)
          put(boss,:name,'제니스 퀸')

          occupied=events.values.map{|e|[iv(e,:x),iv(e,:y)]}
          .compact

          sx=iv(template,:x)
          sy=iv(template,:y)
          width=iv(map,:width)
          height=iv(map,:height)

          candidates=[]
          (1..8).each do |radius|
            (-radius..radius).each do |dx|
              (-radius..radius).each do |dy|
                next unless [dx.abs,dy.abs].max==radius
                x=sx+dx
                y=sy+dy
                next unless x>1 && y>1
                next unless x<width-2 && y<height-2
                next if occupied.include?([x,y])
                candidates<<[x,y]
              end
            end
          end

          raise 'No unoccupied spawn tile' if candidates.empty?
          spawn=candidates.first

          put(boss,:x,spawn[0])
          put(boss,:y,spawn[1])

          pages=iv(boss,:pages)
          raise 'Monster pages missing' unless pages.size>=2

          keyed=pages.each_with_index.select do |page,index|
            iv(iv(page,:condition),:variable_valid)
          end

          raise 'No monster death page' if keyed.empty?

          death,deathindex=keyed.max_by do |page,index|
            iv(iv(page,:condition),:variable_value)
          end

          oldhp=iv(iv(death,:condition),:variable_id)
          raise 'Original monster HP variable missing' unless oldhp

          rewritten_attack=0

          pages.each_with_index do |page,index|
            cond=iv(page,:condition)
            if iv(cond,:variable_valid) &&
               iv(cond,:variable_id)==oldhp
              put(cond,:variable_id,HPVAR)
              if page.equal?(death)
                put(cond,:variable_value,5200)
              end
            end

            graphic=iv(page,:graphic)
            put(graphic,:character_name,'SLZenithWalk')
            put(page,:move_speed,3)
            put(page,:move_frequency,6)

            iv(page,:list).each do |cmd|
              code=iv(cmd,:code)
              params=iv(cmd,:parameters)
              next unless params.is_a?(Array)

              if code==122
                if params[0]==oldhp && params[1]==oldhp
                  params[0]=HPVAR
                  params[1]=HPVAR
                end

                if params[0]==335 &&
                   params[1]==335 &&
                   params[2]==0
                  params.replace([335,335,0,2,15,35])
                end

              elsif code==111 && params[0]==1
                params[1]=HPVAR if params[1]==oldhp

              elsif code==117 && params[0]==922
                # Leave the actual attack CE identifier intact.
                # Only this newly created event is intercepted.
                rewritten_attack+=1

              elsif code==230
                params[0]=20 if params[0]==30

              elsif (code==355 || code==655) &&
                    params[0].is_a?(String)
                params[0]=params[0].gsub(
                  "$game_variables[#{oldhp}]",
                  "$game_variables[#{HPVAR}]"
                )
              end
            end
          end

          raise 'Attack CE922 not found' if rewritten_attack==0

          put(death,:list,[
            command(355,['SLZenith.reward']),
            command(230,[45]),
            command(116,[]),
            command(0,[])
          ])

          events[boss_id]=boss
          File.binwrite(MAP,Marshal.dump(map))

          runtime=<<'SOURCE'
          module SLZenith
            MAP_ID=25
            EVENT_ID=__BOSS_ID__
            HP_VAR=2991
            LEVEL=60
            MAX_HP=5200
            PHYSICAL=[50,100]
            MAGIC=[150,300]
            HIT=9999
            ATTACK_WAIT=20
            EXP=43212
            GOLD_MIN=64800
            GOLD_MAX=151200

            # Item identifiers and original proposed rates.
            # Each record is [kind, ID, probability in per-mille].
            DROPS=[
              [:item,35,30],
              [:item,34,20],
              [:item,33,100],
              [:item,37,100],
              [:armor,169,50],
              [:item,116,3],
              [:item,32,100],
              [:item,38,100],
              [:armor,289,30],
              [:weapon,123,30],
              [:weapon,18,50],
              [:item,3,200],
              [:weapon,1,50],
              [:armor,72,50],
              [:item,2,250],
              [:armor,303,2],
              [:item,43,100],
              [:armor,280,30],
              [:armor,12,50],
              [:armor,492,3]
            ]

            @paid={}
            @poison_frames=0
            @poison_tick=0
            @slow_frames=0
            @old_speed=nil

            def self.actor
              return nil unless $game_actors
              $game_actors[1]
            end

            def self.event
              return nil unless $game_map &&
                $game_map.map_id==MAP_ID
              $game_map.events[EVENT_ID]
            end

            def self.animation(name)
              ev=event
              return unless ev
              ev.instance_variable_set(
                :@character_name,'SLZenith'+name
              )
              ev.instance_variable_set(:@pattern,0)
              ev.instance_variable_set(:@slz_anim_frames,24)
            end

            def self.attack
              target=actor
              return unless target && target.hp>0

              if rand(7)==0
                base=MAGIC[rand(2)]
                defence=target.respond_to?(:mdef) ?
                  target.mdef.to_i : 0
                damage=[base-defence,80].max
                animation('Magic')
              else
                base=PHYSICAL[rand(2)]
                defence=target.respond_to?(:pdef) ?
                  target.pdef.to_i : 0
                damage=[base-defence,1].max
                animation('Attack')
              end

              target.hp=[target.hp-damage,0].max

              # Source attack types: poison cloud and slowing web.
              roll=rand(100)
              if roll<20
                @poison_frames=360
                @poison_tick=0
              elsif roll<30
                @slow_frames=180
                if $game_player
                  @old_speed||=$game_player.instance_variable_get(
                    :@move_speed
                  )
                  current=@old_speed.to_i
                  $game_player.instance_variable_set(
                    :@move_speed,[current-1,1].max
                  )
                end
              end
            end

            def self.update_effects
              if @poison_frames>0
                @poison_frames-=1
                @poison_tick+=1
                if @poison_tick>=180
                  @poison_tick=0
                  target=actor
                  if target && target.hp>0
                    target.hp=[target.hp-5,0].max
                  end
                end
              end

              if @slow_frames>0
                @slow_frames-=1
                if @slow_frames==0 && @old_speed &&
                   $game_player
                  $game_player.instance_variable_set(
                    :@move_speed,@old_speed
                  )
                  @old_speed=nil
                end
              end
            end

            def self.reward
              return unless $game_map &&
                $game_map.map_id==MAP_ID
              return if @paid[EVENT_ID]

              @paid[EVENT_ID]=true

              money=GOLD_MIN+rand(GOLD_MAX-GOLD_MIN+1)
              $game_party.gain_gold(money)

              if actor
                actor.exp=actor.exp+EXP
              end

              $game_variables[333]=money
              $game_variables[1926]=EXP

              DROPS.each do |kind,id,permille|
                next unless rand(1000)<permille

                case kind
                when :item
                  $game_party.gain_item(id,1)
                when :weapon
                  $game_party.gain_weapon(id,1)
                when :armor
                  $game_party.gain_armor(id,1)
                end
              end

              animation('Death')
            end

            def self.reset_map
              @paid.clear
              @poison_frames=0
              @poison_tick=0
              @slow_frames=0
              @old_speed=nil
            end
          end

          class Interpreter
            alias slz_original_common_event command_117

            def command_117
              if @map_id==SLZenith::MAP_ID &&
                 @event_id==SLZenith::EVENT_ID &&
                 @parameters[0]==922
                SLZenith.attack
                return true
              end
              slz_original_common_event
            end
          end

          class Game_Event
            alias slz_original_update update

            def update
              slz_original_update
              return unless @map_id==SLZenith::MAP_ID &&
                @id==SLZenith::EVENT_ID

              count=@slz_anim_frames.to_i
              if count>0
                @slz_anim_frames=count-1
                if @slz_anim_frames==0
                  @character_name='SLZenithWalk'
                end
              end
            end
          end

          class Game_Player
            alias slz_original_update update

            def update
              slz_original_update
              SLZenith.update_effects
            end
          end

          class Game_Map
            alias slz_original_setup setup

            def setup(map_id)
              SLZenith.reset_map
              slz_original_setup(map_id)
            end
          end
          SOURCE

          runtime=runtime.sub('__BOSS_ID__',boss_id.to_s)

          scripts=Marshal.load(File.binread(SCRIPTS))
          raise 'Invalid original script registry' unless
            scripts.is_a?(Array) &&
            scripts[-1][1]=='Main'

          raise 'Zenith module already installed' if
            scripts.any?{|row|row[1]=='SLZenithV242'}

          entry=[
            99824201,
            'SLZenithV242',
            Zlib::Deflate.deflate(runtime,9)
          ]

          scripts.insert(scripts.length-1,entry)
          File.binwrite(SCRIPTS,Marshal.dump(scripts))

          File.write('build/zenith-runtime.rb',runtime)
          File.write('build/zenith-event.txt',
            "Map025 EV#{boss_id} / HP variable #{HPVAR}\n"+
            "Source Map025 EV11 / original HP variable #{oldhp}\n"+
            "Spawn #{spawn.inspect}\n"+
            "Attack CE922 calls #{rewritten_attack}\n"
          )

          raise 'No boss event saved' unless
            iv(Marshal.load(File.binread(MAP)),:events).key?(boss_id)

          puts "PASS Map025 Zenith Queen EV#{boss_id}"
          puts "PASS HP 5200 / physical 50-100 / magic 150-300"
          puts "PASS 20 existing item IDs / status effects / EXP / Adena"
          RUBY

          ruby -c build/zenith.rb
          ruby build/zenith.rb
          ruby -c build/zenith-runtime.rb
          cat build/zenith-event.txt

      - name: V242 Register sprites and update cache hashes
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re

          root=Path("site")
          mapping=root/"knight/gameasync/mapping.js"
          old=mapping.read_text("utf-8")

          anchor="];\n\nvar mapping = {}"
          if old.count(anchor)!=1:
              raise RuntimeError("Original mapping anchor changed")

          entries=[]
          for motion in ("Walk","Attack","Hit","Death","Magic"):
              name="SLZenith"+motion
              path=root/(
                  "knight/gameasync/Graphics/Characters/"
                  +name+".png"
              )
              digest=hashlib.md5(path.read_bytes()).hexdigest()
              entries.append(
                  '["graphics/characters/'+name.lower()+
                  '", "Graphics/Characters/'+name+
                  '.png?h='+digest+'"],'
              )

          new=old.replace(
              anchor,"\n"+"\n".join(entries)+"\n"+anchor
          )

          for relative in (
              "Map025.rxdata",
              "Scripts.rxdata"
          ):
              if relative.startswith("Map"):
                  key="Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"+relative
                  path=root/(
                      "knight/gameasync/Data/"
                      "MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"
                      +relative
                  )
              else:
                  key="Data/Scripts.rxdata"
                  path=root/"knight/gameasync/Data/Scripts.rxdata"

              digest=hashlib.md5(path.read_bytes()).hexdigest()
              pattern="("+re.escape(key)+r"\?h=)[0-9a-f]{32}"
              new,count=re.subn(
                  pattern,
                  lambda m:m.group(1)+digest,
                  new
              )
              if count!=1:
                  raise RuntimeError(
                      "Expected one mapping hash for "+relative
                  )

          mapping.write_text(new,"utf-8")

          loader=root/"knight/js/sl-assets-v229r115.js"
          text=loader.read_text("utf-8")
          old_version="var version='V241';"
          if text.count(old_version)!=1:
              raise RuntimeError("Original V241 loader mismatch")
          loader.write_text(
              text.replace(
                  old_version,"var version='V242';"
              ),"utf-8"
          )

          for rel in ("index.html","knight/index.html"):
              path=root/rel
              html=path.read_text("utf-8")
              if "V241" not in html:
                  raise RuntimeError("Wrong HTML baseline")
              html=html.replace("V241","V242")
              html=html.replace(
                  "js/sl-assets-v229r115.js?v=v241",
                  "js/sl-assets-v229r115.js?v=v242"
              )
              path.write_text(html,"utf-8")

          print("PASS sprites, RPG map, script hashes and version")
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: V242 Protect all unrelated game files
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json

          root=Path("site")
          before=json.loads(
              Path("build/before.json").read_text("utf-8")
          )
          after={
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob("*") if p.is_file()
          }

          pre=(
              "knight/gameasync/Data/"
              "MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"
          )

          allowed={
              pre+"Map025.rxdata",
              "knight/gameasync/Data/Scripts.rxdata",
              "knight/gameasync/mapping.js",
              "knight/js/sl-assets-v229r115.js",
              "index.html",
              "knight/index.html",
          }

          motions=("Walk","Attack","Hit","Death","Magic")
          expected_new={
              "knight/gameasync/Graphics/Characters/"
              "SLZenith"+m+".png"
              for m in motions
          }

          changed={
              name for name in before
              if after.get(name)!=before[name]
          }
          added=set(after)-set(before)
          removed=set(before)-set(after)

          if changed!=allowed:
              raise RuntimeError(
                  "Unexpected modified files: "+
                  repr(sorted(changed^allowed))
              )

          if added!=expected_new:
              raise RuntimeError(
                  "Unexpected added files: "+
                  repr(sorted(added^expected_new))
              )

          if removed:
              raise RuntimeError(
                  "Original files removed: "+repr(sorted(removed))
              )

          for mid in (45,46):
              if pre+f"Map{mid:03d}.rxdata" in after:
                  raise RuntimeError("Deleted dungeon restored")

          if after["knight/assets/map-047-v241.pack"]!=before[
              "knight/assets/map-047-v241.pack"
          ]:
              raise RuntimeError("Map047 pack changed")

          print("PASS only Map025, Scripts, cache and 5 new sprites changed")
          print("PASS existing maps, items, NPCs and native terrain protected")
          PY

      - name: V242 Publish Zenith Queen game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
