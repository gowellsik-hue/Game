          def patch_script!(scripts,name)
            e=scripts.find do |x|
              x.is_a?(Array) &&
                x.length>=3 &&
                x[1].to_s==name
            end

            abort "script missing #{name}" unless e

            src=Zlib::Inflate
              .inflate(e[2])
              .force_encoding(Encoding::UTF_8)

            yield src

            e[2]=Zlib::Deflate.deflate(src)
          end

          patch_script!(
            scripts,
            'Web Compatibility'
          ) do |src|

            old='when 9,90 then Input::A'

            if src.include?(old)
              src.sub!(
                old,
                "when 9 then Input::A\n" \
                "    when 90 then Input::F6"
              )
            else
              abort 'web Z/Tab mapping missing' unless
                src.include?('when 9 then Input::A') &&
                src.include?('when 90 then Input::F6')
            end
          end

          patch_script!(
            scripts,
            'Mobile Hotbar'
          ) do |src|

            old=
              'KEYS=[Input::X,Input::Y,Input::Z,Input::L,Input::A]'

            if src.include?(old)
              src.sub!(
                old,
                'KEYS=[Input::X,Input::Y,Input::Z,Input::L,Input::F6]'
              )
            else
              abort 'mobile hotbar KEYS missing' unless
                src.include?(
                  'KEYS=[Input::X,Input::Y,Input::Z,Input::L,Input::F6]'
                )
            end
          end

          File.binwrite(
            sp,
            Marshal.dump(scripts)
