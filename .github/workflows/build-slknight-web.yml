      - name: Connect keyboard input to creation scene
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl417-name.js <<'JAVASCRIPT'
          (function(){
            'use strict';

            const ui=SL417_UI;

            let form=null;
            let field=null;
            let status=null;
            let file=null;
            let rect=null;

            let composing=false;
            let submitted=false;

            const arrows={
              ArrowLeft:37,
              ArrowUp:38,
              ArrowRight:39,
              ArrowDown:40
            };

            function layout(){

              if(!form)return;

              const c=document.getElementById('canvas').getBoundingClientRect();

              const [x,y,w,h]=rect;

              const sx=c.width/800;
              const sy=c.height/600;

              Object.assign(form.style,{
                left:(c.left+x*sx)+'px',
                top:(c.top+y*sy)+'px',
                width:(w*sx)+'px',
                height:(h*sy)+'px',
                fontSize:Math.max(11,12*sy)+'px'
              });

              field.style.fontSize=
                Math.max(16,12*sy)+'px';
            }

            function write(flag){

              if(!field||submitted||!file)return false;

              if(composing&&flag!=='2')return false;

              try{

                const raw=flag+'\n'+field.value;

                FS.writeFile(
                  file,
                  new TextEncoder().encode(raw)
                );

                if(
                  FS.readFile(
                    file,
                    {encoding:'utf8'}
                  )!==raw
                ){
                  throw Error('Name write mismatch');
                }

                submitted=flag==='1';

                status.textContent='';

                return true;

              }catch(e){

                status.textContent=String(e.message);

                return false;
              }
            }

            function close(){

              if(form)form.remove();

              try{

                if(file&&FS.analyzePath(file).exists){
                  FS.unlink(file);
                }

              }catch(e){

                console.error(e);
              }

              form=field=status=file=rect=null;

              composing=submitted=false;

              const canvas=
                document.getElementById('canvas');

              if(canvas){
                canvas.focus({
                  preventScroll:true
                });
              }
            }

            function open(p){

              if(form)return;

              rect=p.slice(2,6).map(Number);

              file=p.slice(7).join('|');

              if(
                rect.some(v=>!Number.isFinite(v)) ||
                !file
              ){
                throw Error('Name field geometry');
              }

              form=document.createElement('form');

              form.id='sl417-name-form';

              const label=document.createElement('label');

              label.htmlFor='sl417-name';

              label.textContent=ui.prompt;

              field=document.createElement('input');

              field.id='sl417-name';
              field.type='text';
              field.inputMode='text';
              field.enterKeyHint='done';
              field.autocomplete='off';
              field.maxLength=Number(p[6]);
              field.spellcheck=false;

              field.setAttribute(
                'autocapitalize',
                'off'
              );

              field.setAttribute(
                'aria-label',
                ui.prompt
              );

              const hint=document.createElement('div');

              hint.textContent='선택 : Enter / C';

              status=document.createElement('div');

              status.setAttribute(
                'role',
                'status'
              );

              form.style.cssText=
                'position:fixed;'+
                'z-index:2147483647;'+
                'margin:0;padding:0;border:0;'+
                'background:transparent;'+
                'color:#fff;'+
                'font-family:SL417Nanum,sans-serif;'+
                'display:flex;'+
                'flex-direction:column;'+
                'justify-content:center;'+
                'gap:2px;'+
                'pointer-events:none;'+
                'box-sizing:border-box;'+
                'text-align:center;'+
                'line-height:1.2;';

              field.style.cssText=
                'display:block;'+
                'width:100%;height:32px;'+
                'min-height:24px;'+
                'box-sizing:border-box;'+
                'border:0;'+
                'border-bottom:1px solid #aaa;'+
                'border-radius:0;'+
                'background:#000;'+
                'color:#fff;'+
                'caret-color:#fff;'+
                'outline:0;'+
                'text-align:center;'+
                'font-family:inherit;'+
                'padding:0 4px;'+
                'pointer-events:auto;'+
                'user-select:text;'+
                '-webkit-user-select:text;'+
                'touch-action:manipulation;';

              status.style.cssText='color:#ffff80;';

              form.append(
                label,
                field,
                hint,
                status
              );

              document.getElementById('main').append(form);

              layout();

              field.addEventListener(
                'input',
                ()=>{
                  if(!composing)write('0');
                }
              );

              field.addEventListener(
                'compositionstart',
                ()=>{
                  composing=true;

                  write('2');
                }
              );

              field.addEventListener(
                'compositionend',
                ()=>{
                  composing=false;

                  write('0');
                }
              );

              form.addEventListener(
                'submit',
                e=>{
                  e.preventDefault();

                  write('1');
                }
              );

              [
                'pointerdown',
                'pointerup',
                'mousedown',
                'mouseup',
                'click',
                'touchstart',
                'touchend'
              ].forEach(t=>{

                field.addEventListener(
                  t,
                  e=>e.stopPropagation()
                );
              });

              if(
                FS.readFile(
                  file,
                  {encoding:'utf8'}
                )!=='0\n'
              ){
                throw Error('Name input initialization');
              }

              field.focus({
                preventScroll:true
              });
            }

            [
              'keydown',
              'keyup',
              'keypress'
            ].forEach(t=>{

              window.addEventListener(t,e=>{

                if(!field||e.target!==field)return;

                if(
                  !composing &&
                  !e.isComposing &&
                  arrows[e.key] &&
                  t!=='keypress'
                ){

                  e.preventDefault();

                  e.stopImmediatePropagation();

                  if(typeof simulateKeyEvent==='function'){

                    simulateKeyEvent(
                      t,
                      arrows[e.key],
                      0
                    );
                  }

                  return;
                }

                if(
                  t==='keydown' &&
                  e.key==='Enter' &&
                  !composing &&
                  !e.isComposing &&
                  e.keyCode!==229
                ){

                  e.preventDefault();

                  write('1');
                }

                e.stopImmediatePropagation();

              },true);
            });

            const resize=
              ()=>requestAnimationFrame(layout);

            window.addEventListener(
              'resize',
              resize
            );

            document.addEventListener(
              'fullscreenchange',
              resize
            );

            if(window.visualViewport){

              visualViewport.addEventListener(
                'resize',
                resize
              );

              visualViewport.addEventListener(
                'scroll',
                resize
              );
            }

            window.sl417NameMessage=function(text){

              const s=String(text).trim();

              try{

                if(s.startsWith('SL417|NAME|')){

                  open(s.split('|'));

                }else if(s==='SL417|NAME_CLOSE'){

                  close();

                }else if(
                  s==='SL417|NAME_RETRY' &&
                  field
                ){

                  submitted=false;

                  status.textContent=ui.error;

                  field.focus({
                    preventScroll:true
                  });

                }else if(s.startsWith('SL417|FAIL|')){

                  const m=s.split('|').slice(2).join(' | ');

                  if(status){

                    status.textContent=m;

                  }else{

                    console.error(m);
                  }
                }

              }catch(e){

                if(status){

                  status.textContent=String(e.message);
                }

                console.error('SL417_NAME',e);
              }
            };
          })();
          JAVASCRIPT

