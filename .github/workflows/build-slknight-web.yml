           def command_122; $original_varchanges=($original_varchanges || 0)+1;true;end
           def command_125; $original_gold=($original_gold || 0)+1;true;end
           def command_315; $original_exp=($original_exp || 0)+1;true;end
          end
          class MockParty
           attr_accessor :gold
