
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R78
# BASE: exact original V229R66, 5517 files.
# R49: wall_depth +32 -> +56 (one 2x isometric row deeper).
# R66: remove blocked-direction axis fallback (wall sliding).
# No change to native S32 passage, monsters, events, spawns, floor or images.
# SOURCE: upload the verified SLKnight_V229R78_R66_GameSite.zip asset
#         to EXISTING release v1.0.0 in gowellsik-hue/Game once.
#         No new release/tag is created by this workflow.
# Does not depend on expired R65/R66 workflow run artifacts.
name: build-slknight-web.yml | V229R78 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: V229R78 Download verified R66-based game from existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package site
          gh release download v1.0.0 \
            -R gowellsik-hue/Game \
            -p SLKnight_V229R78_R66_GameSite.zip \
            -D package --clobber

      - name: V229R78 Verify package and only approved wall edits
        shell: bash
        run: |
          set -euo pipefail
          echo 'cc12fff23537cbb9b8cc35873867488d6dfd02dc15ad0b5800c5e5d756a45edf  package/SLKnight_V229R78_R66_GameSite.zip' | sha256sum -c -
          unzip -q package/SLKnight_V229R78_R66_GameSite.zip -d site
          python3 - <<'PY_SITE'
          from pathlib import Path
          import hashlib,re
          root=Path('site')
          files=[p for p in root.rglob('*') if p.is_file()]
          assert len(files)==5517,('Unexpected file count',len(files))
          for name in ('index.html','knight/index.html'):
              assert 'V229R78' in (root/name).read_text('utf-8'),name
          base=root/'knight/gameasync'
          script=base/'Data/Scripts.rxdata'
          assert hashlib.sha256(script.read_bytes()).hexdigest()==\
              '6b008c3ba9dfb08365ec65fdf467f8e04972c6947e069594d4cc323b351b1dfe'
          mapping=(base/'mapping.js').read_text('utf-8')
          assert 'Data/Scripts.rxdata?h='+hashlib.md5(script.read_bytes()).hexdigest() in mapping
          print('PASS 5517 R66-derived files and exact patched engine archive')
          PY_SITE
          ruby -rzlib -rdigest - <<'RB_VERIFY'
          archive='site/knight/gameasync/Data/Scripts.rxdata'
          scripts=Marshal.load(File.binread(archive))
          raise 'Wrong 136-script engine' unless scripts.size==136
          code=Zlib::Inflate.inflate(scripts[134][2])
          raise 'Wrong approved engine' unless Digest::SHA256.hexdigest(code)==
            '286b4ade4f9da5e0fe753cdabedfcf83b65d23d902c56325d2b57409c116791a'
          raise 'Wall depth not increased' unless code.include?('wall_depth=wall_y+by1*2+56')
          raise 'Old depth remains' if code.include?('wall_depth=wall_y+by1*2+32')
          native=code.split('  def self.native_target(mid,x,y,dir)',2)[1]
          raise 'Native target missing' if native==nil
          native=native.split('  def self.native_line?',2)[0]
          raise 'Sliding axis fallback remains' if native.include?('return [x+dx,y]') || native.include?('return [x,y+dy]')
          raise 'R49 painter absent' unless code.include?('def slti_r49_update_walls')
          puts 'PASS rear wall depth +56, no sliding; source S32 and game scripts preserved'
          RB_VERIFY
          node --check site/knight/gameasync/mapping.js

      - name: V229R78 Publish verified original game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
