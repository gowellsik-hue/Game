          test -s /tmp/fairy_raw/Game.rgssad
          test -s /tmp/fairy_raw/Game.ini

          cat > /tmp/rgssad_extract.py <<'PYRGSS'
          from pathlib import Path
          import struct,sys
          MASK=0xffffffff; KEY0=0xDEADCAFE
          def rot(k): return ((k*7)+3)&MASK
          src=Path(sys.argv[1]); out=Path(sys.argv[2]); out.mkdir(parents=True,exist_ok=True)
          with src.open('rb') as f:
              hdr=f.read(8)
              if hdr[:7]!=b'RGSSAD\0' or len(hdr)!=8 or hdr[7]!=1: raise SystemExit(f'unsupported RGSSAD header: {hdr!r}')
              key=KEY0; count=0
              while True:
                  raw=f.read(4)
                  if not raw: break
                  if len(raw)!=4: raise SystemExit('truncated filename length')
                  n=struct.unpack('<I',raw)[0]^key; key=rot(key)
                  if n>4096: raise SystemExit(f'bad filename length {n}')
                  name_b=bytearray(f.read(n))
                  if len(name_b)!=n: raise SystemExit('truncated filename')
                  for i in range(n): name_b[i]^=key&0xff; key=rot(key)
                  raw=f.read(4)
                  if len(raw)!=4: raise SystemExit('truncated file length')
                  size=struct.unpack('<I',raw)[0]^key; key=rot(key)
                  try: name=bytes(name_b).decode('cp949')
                  except UnicodeDecodeError: name=bytes(name_b).decode('utf-8','replace')
                  parts=[x for x in name.replace('\\','/').split('/') if x not in ('','.','..')]
                  if not parts: raise SystemExit('unsafe path')
                  target=out.joinpath(*parts); target.parent.mkdir(parents=True,exist_ok=True)
                  dk=key; ctr=0; remain=size
                  with target.open('wb') as w:
                      while remain:
                          chunk=bytearray(f.read(min(1<<20,remain)))
                          if not chunk: raise SystemExit(f'truncated data: {name}')
                          kb=dk.to_bytes(4,'little')
                          for i in range(len(chunk)):
                              chunk[i]^=kb[ctr]; ctr=(ctr+1)&3
                              if ctr==0: dk=rot(dk); kb=dk.to_bytes(4,'little')
                          w.write(chunk); remain-=len(chunk)
                  count+=1
          print('FAIRY_RGSSAD_EXTRACT_OK',count)
          PYRGSS
          python3 /tmp/rgssad_extract.py /tmp/fairy_raw/Game.rgssad /tmp/fairy_game
          cp /tmp/fairy_raw/Game.ini /tmp/fairy_game/Game.ini
          if [ -d /tmp/fairy_raw/Audio ]; then mkdir -p /tmp/fairy_game/Audio; cp -a /tmp/fairy_raw/Audio/. /tmp/fairy_game/Audio/; fi
