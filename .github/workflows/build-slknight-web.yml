name: Deploy SLKnight mkxp-web LIVE Engine V5

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-slknight-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a

  # Exact commit behind the working mkxp-web "built" branch.
  LIVE_MKXP_REF: 07e1519f9a2b9100512c567e97455fa3c77a3221

jobs:
  build:
    name: Build SLKnight with LIVE mkxp-web engine
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Install conversion tools
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            unzip \
            ruby \
            python3 \
            ffmpeg \
            imagemagick \
            file \
            timidity \
            freepats

      # ------------------------------------------------------------
      # IMPORTANT
      #
      # This is NOT knight-blade-web-async.
      #
      # This is the exact mkxp-web built commit corresponding to
      # the player that worked on the phone.
      # ------------------------------------------------------------

      - name: Checkout exact working LIVE mkxp-web player
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.LIVE_MKXP_REF }}
          path: player
          sparse-checkout: |
            index.html
            js
            manifest.webmanifest
            mkxp.js
            mkxp.wasm
          sparse-checkout-cone-mode: false

      - name: Checkout mkxp-web conversion tools
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: master
          path: mkxp-tools
          sparse-checkout: |
            COPYING
            extra/rgss.rb
            extra/make_mapping.sh
          sparse-checkout-cone-mode: false

      - name: Verify exact LIVE engine
        run: |
          set -e

          echo "LIVE ENGINE COMMIT:"
          git -C player rev-parse HEAD

          test "$(
            git -C player rev-parse HEAD
          )" = "$LIVE_MKXP_REF"

          JS_SIZE="$(
            stat -c '%s' player/mkxp.js
          )"

          WASM_SIZE="$(
            stat -c '%s' player/mkxp.wasm
          )"

          echo "mkxp.js=${JS_SIZE}"
          echo "mkxp.wasm=${WASM_SIZE}"

          test "${JS_SIZE}" = "290574"
          test "${WASM_SIZE}" = "5217852"

          test -s player/js/drive.js
          test -s player/js/dpad.js
          test -s player/js/localforage.min.js

          echo "EXACT_LIVE_ENGINE_OK"

      - name: Download clean SLKnight release
        run: |
          set -e

          curl -L \
            --fail \
            --retry 3 \
            -o slknight.zip \
            "${GAME_URL}"

          echo "${GAME_SHA256}  slknight.zip" \
            | sha256sum -c -

          rm -rf game
          mkdir -p game

          unzip -q \
            slknight.zip \
            -d game

          test -f \
            game/SLKnight_Android_JoiPlay/Game.ini

          echo "SLKNIGHT_RELEASE_OK"

      - name: Replace LIVE demo game with SLKnight
        run: |
          set -e

          rm -rf \
            player/gameasync \
            player/preload

          mkdir -p \
            player/gameasync \
            player/preload

          cp -a \
            game/SLKnight_Android_JoiPlay/. \
            player/gameasync/

          cp \
            mkxp-tools/extra/rgss.rb \
            player/gameasync/rgss.rb

          cp \
            mkxp-tools/COPYING \
            player/COPYING-mkxp-web.txt

          rm -f \
            player/gameasync/README_Android.txt

          echo "SLKNIGHT_DATA_INSTALLED"

      - name: Convert SLKnight RGSS for mkxp-web
        run: |
          set -e

          ruby -rzlib - <<'RB'
          game_dir = 'player/gameasync'
          ini_path = File.join(game_dir, 'Game.ini')

          ini = File.binread(ini_path)

          scripts_rel =
            ini[/^Scripts=(.+)$/i, 1]

          abort 'Scripts entry missing from Game.ini' \
            if scripts_rel == nil

          scripts_rel =
            scripts_rel
              .strip
              .tr('\\', '/')

          scripts_path =
            File.join(
              game_dir,
              scripts_rel
            )

          abort "Scripts file missing: #{scripts_path}" \
            unless File.file?(scripts_path)

          scripts =
            Marshal.load(
              File.binread(scripts_path)
            )

          # ==========================================================
          # Browser / Windows API compatibility
          # ==========================================================

          web_compat = <<'RUBY'
          class Win32API
            def initialize(*args)
            end

            def call(*args)
              0
            end

            def Call(*args)
              call(*args)
            end
          end
          RUBY

          scripts.insert(
            0,
            [
              0,
              'Web Compatibility',
              Zlib::Deflate.deflate(
                web_compat
              )
            ]
          )

          # ==========================================================
          # mruby:
          #
          # begin
          #   ...
          # end until x
          #
          # ->
          #
          # loop do
          #   ...
          #   break if x
          # end
          # ==========================================================

          def patch_begin_until(source)
            lines = source.lines
            changed = 0
            i = 0

            while i < lines.length
              match =
                lines[i].match(
                  /^(\s*)end\s+until\s+(.+?)\s*$/
                )

              if match
                indent = match[1]
                condition = match[2]

                j = i - 1

                while j >= 0
                  if (
                    lines[j][/^\s*/] == indent &&
                    lines[j].strip == 'begin'
                  )
                    lines[j] =
                      indent +
                      "loop do\n"

                    lines[i] =
                      indent +
                      "  break if " +
                      condition +
                      "\n" +
                      indent +
                      "end\n"

                    changed += 1
                    break
                  end

                  j -= 1
                end
              end

              i += 1
            end

            [
              lines.join,
              changed
            ]
          end

          # ==========================================================
          # Move standard RPG Maker scene loops under browser control.
          # ==========================================================

          def patch_scene_loops(source)
            lines = source.lines
            changed = 0
            i = 0

            while i < lines.length
              unless lines[i].strip == 'loop do'
                i += 1
                next
              end

              indent =
                lines[i][/^\s*/]

              significant = []
              k = i + 1

              while (
                k < lines.length &&
                significant.length < 8
              )
                stripped =
                  lines[k].strip

                unless (
                  stripped.empty? ||
                  stripped.start_with?('#')
                )
                  significant << [
                    k,
                    stripped,
                    lines[k][/^\s*/]
                  ]
                end

                k += 1
              end

              end_index = nil

              if (
                significant.length >= 7 &&
                significant[0][1] == 'Graphics.update' &&
                significant[1][1] == 'Input.update' &&
                significant[2][1] == 'update' &&
                significant[3][1] == 'if $scene != self' &&
                significant[4][1] == 'break' &&
                significant[5][1] == 'end' &&
                significant[6][1] == 'end' &&
                significant[6][2] == indent
              )
                end_index =
                  significant[6][0]

              elsif (
                significant.length >= 5 &&
                significant[0][1] == 'Graphics.update' &&
                significant[1][1] == 'Input.update' &&
                significant[2][1] == 'update' &&
                significant[3][1] == 'break if $scene != self' &&
                significant[4][1] == 'end' &&
                significant[4][2] == indent
              )
                end_index =
                  significant[4][0]
              end

              if end_index != nil
                lines[i..end_index] = [
                  indent +
                  "end\n\n" +
                  indent +
                  "def dispose\n"
                ]

                changed += 1

                i += 1
                next
              end

              i += 1
            end

            [
              lines.join,
              changed
            ]
          end

          scene_loop_count = 0
          begin_until_count = 0

          scripts.each do |entry|
            next unless (
              entry.is_a?(Array) &&
              entry.length >= 3
            )

            name =
              entry[1].to_s

            begin
              source =
                Zlib::Inflate.inflate(
                  entry[2]
                )
            rescue
              next
            end

            patched =
              source.dup

            patched, count =
              patch_begin_until(
                patched
              )

            begin_until_count +=
              count

            unless name == 'Main'
              patched, count =
                patch_scene_loops(
                  patched
                )

              scene_loop_count +=
                count
            end

            # ========================================================
            # Browser animation-frame dispatcher
            # ========================================================

            if name == 'Main'
              unless patched.include?(
                'def main_update_loop'
              )
                browser_loop = <<'RUBY'
          $prev_scene = nil

          def main_update_loop
            if $scene != nil

              if $scene != $prev_scene

                if (
                  $prev_scene != nil &&
                  $prev_scene.respond_to?(:dispose)
                )
                  $prev_scene.dispose
                end

                $scene.main
                $prev_scene = $scene
              end

              Graphics.update
              Input.update
              $scene.update

            else
              raise "END"
            end
          end

          RUBY

                patched =
                  browser_loop +
                  patched
              end

              patched.sub!(
                /\n\s*while\s+\$scene\s*!=\s*nil\s*\r?\n\s*\$scene\.main\s*\r?\n\s*end\s*/m,
                "\n"
              )
            end

            next if patched == source

            entry[2] =
              Zlib::Deflate.deflate(
                patched
              )
          end

          # ==========================================================
          # Verify Main
          # ==========================================================

          main =
            scripts.find do |entry|
              entry[1].to_s == 'Main'
            end

          abort 'Main script missing' \
            if main == nil

          main_source =
            Zlib::Inflate.inflate(
              main[2]
            )

          abort 'main_update_loop injection failed' \
            unless main_source.include?(
              'def main_update_loop'
            )

          # ==========================================================
          # mkxp-web LIVE preload list expects Data/Scripts.rxdata.
          # ==========================================================

          target_scripts =
            File.join(
              game_dir,
              'Data',
              'Scripts.rxdata'
            )

          File.binwrite(
            target_scripts,
            Marshal.dump(scripts)
          )

          unless (
            File.expand_path(scripts_path) ==
            File.expand_path(target_scripts)
          )
            File.delete(
              scripts_path
            )
          end

          # ==========================================================
          # Rewrite Game.ini
          # ==========================================================

          ini_lines =
            ini.split(/\r?\n/)

          ini_lines.map! do |line|
            if line =~ /^Scripts=/i
              'Scripts=Data\Scripts.rxdata'

            elsif line =~ /^Title=/i
              'Title=SLKnight'

            else
              line
            end
          end

          File.binwrite(
            ini_path,
            ini_lines.join("\r\n") +
            "\r\n"
          )

          puts(
            "SCENE_LOOPS_PATCHED=" +
            scene_loop_count.to_s
          )

          puts(
            "BEGIN_UNTIL_PATCHED=" +
            begin_until_count.to_s
          )

          puts(
            "SLKNIGHT_RGSS_LIVE_ENGINE_PATCH_OK"
          )
          RB

          test -s \
            player/gameasync/Data/Scripts.rxdata

          grep -Fq \
            'Scripts=Data\Scripts.rxdata' \
            player/gameasync/Game.ini

          echo \
            'SCRIPT_ARCHIVE_VERIFY_OK'

      - name: Convert audio to OGG
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          root = Path(
              "player/gameasync/Audio"
          )

          if not root.exists():
              print(
                  "AUDIO_DIRECTORY_NOT_PRESENT"
              )
              raise SystemExit(0)

          convertible = {
              ".mp3",
              ".wav",
              ".wma",
              ".aac",
              ".m4a",
              ".flac",
              ".mid",
              ".midi",
          }

          midi_exts = {
              ".mid",
              ".midi",
          }

          files = [
              path
              for path in root.rglob("*")
              if (
                  path.is_file()
                  and
                  path.suffix.lower()
                  in convertible
              )
          ]

          print(
              "AUDIO_FILES_TO_CONVERT=" +
              str(len(files))
          )

          converted = 0
          failures = []

          for src in files:
              ext =
                  src.suffix.lower()

              out =
                  src.with_suffix(
                      ".ogg"
                  )

              temp_wav = None

              try:
                  source_for_ffmpeg = src

                  if ext in midi_exts:
                      temp_wav =
                          src.with_name(
                              src.name +
                              ".mkxpweb.wav"
                          )

                      subprocess.run(
                          [
                              "timidity",
                              str(src),
                              "-Ow",
                              "-o",
                              str(temp_wav),
                          ],
                          check=True,
                      )

                      source_for_ffmpeg = \
                          temp_wav

                  subprocess.run(
                      [
                          "ffmpeg",
                          "-nostdin",
                          "-v",
                          "error",
                          "-y",
                          "-i",
                          str(
                              source_for_ffmpeg
                          ),
                          "-c:a",
                          "libvorbis",
                          "-q:a",
                          "4",
                          str(out),
                      ],
                      check=True,
                  )

                  if (
                      not out.exists()
                      or
                      out.stat().st_size == 0
                  ):
                      raise RuntimeError(
                          "OGG output missing: " +
                          str(out)
                      )

                  if (
                      temp_wav is not None
                      and
                      temp_wav.exists()
                  ):
                      temp_wav.unlink()

                  if (
                      src.exists()
                      and
                      src != out
                  ):
                      src.unlink()

                  converted += 1

              except Exception as exc:
                  failures.append(
                      (
                          str(src),
                          str(exc),
                      )
                  )

                  if (
                      temp_wav is not None
                      and
                      temp_wav.exists()
                  ):
                      temp_wav.unlink()

          if failures:
              print(
                  "AUDIO CONVERSION FAILURES:",
                  file=sys.stderr,
              )

              for name, error in failures:
                  print(
                      name +
                      " -> " +
                      error,
                      file=sys.stderr,
                  )

              raise SystemExit(1)

          print(
              "AUDIO_CONVERTED=" +
              str(converted)
          )

          print(
              "AUDIO_CONVERSION_OK"
          )
          PY

      - name: Convert unsupported images to PNG
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          root = Path(
              "player/gameasync/Graphics"
          )

          if not root.exists():
              print(
                  "GRAPHICS_DIRECTORY_NOT_PRESENT"
              )
              raise SystemExit(0)

          convertible = {
              ".bmp",
              ".gif",
              ".webp",
              ".tif",
              ".tiff",
          }

          files = [
              path
              for path in root.rglob("*")
              if (
                  path.is_file()
                  and
                  path.suffix.lower()
                  in convertible
              )
          ]

          print(
              "IMAGE_FILES_TO_CONVERT=" +
              str(len(files))
          )

          converted = 0
          failures = []

          for src in files:
              out =
                  src.with_suffix(
                      ".png"
                  )

              try:
                  subprocess.run(
                      [
                          "convert",
                          str(src) + "[0]",
                          str(out),
                      ],
                      check=True,
                  )

                  if (
                      not out.exists()
                      or
                      out.stat().st_size == 0
                  ):
                      raise RuntimeError(
                          "PNG output missing: " +
                          str(out)
                      )

                  src.unlink()
                  converted += 1

              except Exception as exc:
                  failures.append(
                      (
                          str(src),
                          str(exc),
                      )
                  )

          if failures:
              print(
                  "IMAGE CONVERSION FAILURES:",
                  file=sys.stderr,
              )

              for name, error in failures:
                  print(
                      name +
                      " -> " +
                      error,
                      file=sys.stderr,
                  )

              raise SystemExit(1)

          print(
              "IMAGES_CONVERTED=" +
              str(converted)
          )

          print(
              "IMAGE_CONVERSION_OK"
          )
          PY

      - name: Generate LIVE async filesystem mapping
        run: |
          set -e

          cd player/gameasync

          bash \
            ../../mkxp-tools/extra/make_mapping.sh

          test -s \
            mapping.js

          test -s \
            bitmap-map.js

          echo \
            'LIVE_MAPPING_GENERATION_OK'

      - name: Create SLKnight map preload files
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          data_root = Path(
              "player/gameasync/Data"
          )

          preload_root = Path(
              "player/preload/Data"
          )

          preload_root.mkdir(
              parents=True,
              exist_ok=True,
          )

          count = 0

          for source in sorted(
              data_root.glob(
                  "Map*.rxdata"
              )
          ):
              target = (
                  preload_root /
                  (
                      source.name +
                      ".json"
                  )
              )

              target.write_text(
                  "[]\n",
                  encoding="utf-8",
              )

              count += 1

          print(
              "MAP_PRELOAD_FILES=" +
              str(count)
          )
          PY

      - name: Configure LIVE player for SLKnight
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          path =
              Path(
                  "player/index.html"
              )

          html =
              path.read_text(
                  encoding="utf-8"
              )

          # Only change game identity.
          # Keep the actual working LIVE player intact.

          html, namespace_count = \
              re.subn(
                  r"var namespace = '[^']*';",
                  "var namespace = 'slknight_live_v5';",
                  html,
                  count=1,
              )

          html, title_count = \
              re.subn(
                  r"var wTitle = '[^']*'\s*;?",
                  "var wTitle = 'SLKnight';",
                  html,
                  count=1,
              )

          html = html.replace(
              "<title>MKXP</title>",
              "<title>SLKnight</title>",
              1,
          )

          if namespace_count != 1:
              raise SystemExit(
                  "namespace patch failed"
              )

          if title_count != 1:
              raise SystemExit(
                  "title patch failed"
              )

          path.write_text(
              html,
              encoding="utf-8",
          )

          print(
              "LIVE_PLAYER_CONFIG_OK"
          )
          PY

          touch \
            player/.nojekyll

      - name: Verify final LIVE-engine package
        run: |
          set -e

          test -s player/index.html
          test -s player/mkxp.js
          test -s player/mkxp.wasm

          test -s player/js/drive.js
          test -s player/js/dpad.js
          test -s player/js/localforage.min.js

          test -s player/gameasync/Game.ini
          test -s player/gameasync/rgss.rb

          test -s player/gameasync/mapping.js
          test -s player/gameasync/bitmap-map.js

          test -s \
            player/gameasync/Data/Scripts.rxdata

          grep -Fq \
            "var namespace = 'slknight_live_v5';" \
            player/index.html

          grep -Fq \
            "var wTitle = 'SLKnight';" \
            player/index.html

          # Re-check that the actual engine binaries were never changed.
          test "$(
            stat -c '%s' player/mkxp.js
          )" = "290574"

          test "$(
            stat -c '%s' player/mkxp.wasm
          )" = "5217852"

          rm -rf \
            player/.git

          echo
          echo "======================================="
          echo " SLKNIGHT LIVE MKXP-WEB V5 READY"
          echo "======================================="
          echo

          du -sh \
            player

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player

  deploy:
    name: Deploy GitHub Pages

    needs:
      - build

    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
