name: build-slknight-web.yml | V4.6 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Restore V4.5 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45784031614
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify V4.5 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          game=root/'knight/gameasync'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(before)==6019,len(before)
          assert (root/'knight/js/sl-assets-v229r115.js').read_bytes().count(b"var version='V4.5';")==1
          assert (game/'Data'/(pre+'MonsterStats.rxdata')).is_file()
          names=['Scripts.rxdata']
          Path('/tmp/sl46-before.json').write_text(json.dumps(before,sort_keys=True),'utf8')
          Path('/tmp/sl46-md5.json').write_text(json.dumps({n:hashlib.md5((game/'Data'/n).read_bytes()).hexdigest() for n in names}),'utf8')
          print('PASS V4.5 baseline',len(before))
          PYTHON

      - name: Fix companion defense and movement collision
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/sl46-patch.rb <<'RUBY'
          # encoding: UTF-8
          require 'zlib'
          module RPG
            %w[Map Event EventCommand MoveRoute MoveCommand AudioFile].each{|n|const_set(n,Class.new)}
            Event.const_set(:Page,::Class.new)
            Event::Page.const_set(:Condition,::Class.new)
            Event::Page.const_set(:Graphic,::Class.new)
          end
          %w[Table Tone Color].each do |n|
            Object.const_set(n,Class.new do
              def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
              def _dump(depth);@raw;end
            end)
          end
          def iv(o,k);o.instance_variable_get(k);end
          def utf(s);s.to_s.dup.force_encoding('UTF-8');end
          def check(ok,msg);raise msg unless ok;end
          def once(s,a,b,label)
            check(s.scan(a).size==1,"#{label}: #{s.scan(a).size} anchors")
            s.sub(a){b}
          end
          def method_edit(s,name)
            heads=s.to_enum(:scan,/^([ \t]*)def #{Regexp.escape(name)}(?:\(|\s*$)/).map{Regexp.last_match}
            check(heads.size==1,"Method #{name}: #{heads.size}")
            h=heads.first; start=h.begin(0)
            tail=s.index(/^#{Regexp.escape(h[1])}end[ \t]*$/,h.end(0))
            check(tail,"Method end #{name}")
            finish=s.index("\n",tail)||s.size
            original=s[start...finish]
            updated=yield(original)
            check(original!=updated,"No change #{name}")
            s[0...start]+updated+s[finish..-1]
          end
          def edit(rows,name)
            a=rows.select{|r|r && utf(r[1])==name};check(a.size==1,name)
            r=a[0];src=utf(Zlib::Inflate.inflate(r[2]));check(src.valid_encoding?,name)
            t=yield(src.gsub("\r\n","\n"))
            RubyVM::InstructionSequence.compile(t)
            t=t.gsub("\n","\r\n") if src.include?("\r\n")
            check(src!=t,name);r[2]=Zlib::Deflate.deflate(t)
          end
          root=ENV.fetch('SL46_DATA','site/knight/gameasync/Data')
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          sp=File.join(root,'Scripts.rxdata')
          rows=Marshal.load(File.binread(sp));before=rows.map{|r|Marshal.dump(r)}
          # Independent base statistics, retaining equipment summation in original methods.
          edit(rows,'Game_Actor') do |s|
            {2=>['base_str',0],3=>['base_dex',1],5=>['base_int',2]}.each do |col,(name,i)|
              s=method_edit(s,name) do |m|
                a="n = $data_actors[@actor_id].parameters[#{col}, @level]"
                once(m,a,"n = @sl46_stats_ready ? @sl43_stats[#{i}] : $data_actors[@actor_id].parameters[#{col}, @level]",name)
              end
            end
            s=once(s,'    return unless @sl43_stats && @sl43_form',<<'SRC'.chomp,'Existing hire/load stat initialization')
              return unless @sl43_stats && @sl43_form
              unless @sl46_stats_ready
                @str_plus = @dex_plus = @int_plus = 0
                @sl46_stats_ready = true
              end
          SRC
            s=method_edit(s,'base_pdef') do |m|
              a=m.index('    if $game_variables[469] >= 18');check(a,'Original player AC formula')
              m[0...a]+<<'SRC'+m[a..-1]
              if @sl46_stats_ready
                dex=@sl43_stats[1]+@dex_plus
                od=@sl43_stats[1]
                div=dex>=18 ? 4 : (dex>=16 ? 5 : (dex>=13 ? 6 : (dex>=10 ? 7 : 8)))
                bonus=if @sl43_form.end_with?('기사'); od>=15 ? 3 : (od>=13 ? 1 : 0)
                elsif @sl43_form.end_with?('요정'); od>=18 ? 2 : (od>=15 ? 1 : 0)
                elsif @sl43_form.end_with?('법사'); od>=10 ? 2 : (od>=8 ? 1 : 0)
                elsif @sl43_form.end_with?('다엘'); od>=17 ? 1 : 0
                else; raise 'Unknown recruited class'; end
                return pdef1+pdef2+pdef3+pdef4+pdef5+@level/div+bonus
              end
          SRC
            end
            method_edit(s,'base_mdef') do |m|
              a=m.index('    $MDEF =');check(a,'Original player MR formula')
              m[0...a]+<<'SRC'+m[a..-1]
              if @sl46_stats_ready
                w=@sl43_stats[4]
                b=if w<=14; 0
                elsif w<=23; [3,3,6,10,15,21,28,37,47][w-15]
                elsif w<=29; 50
                elsif w<=34; 52
                elsif w<=39; 55
                elsif w<=43; 59
                elsif w<=46; 62
                elsif w<=49; 64
                else; 65; end
                mr=if @sl43_form.end_with?('기사'); w>=12 ? 2 : (w>=10 ? 1 : 0)
                elsif @sl43_form.end_with?('요정'); 25+(w>=16 ? 2 : (w>=13 ? 1 : 0))
                elsif @sl43_form.end_with?('법사'); 15+(w>=15 ? 1 : 0)
                elsif @sl43_form.end_with?('다엘'); 10+(w>=16 ? 4 : (w==15 ? 3 : (w==14 ? 2 : (w>=11 ? 1 : 0))))
                else; raise 'Unknown recruited class'; end
                return mdef1+mdef2+mdef3+mdef4+mdef5+@level/2+mr+b
              end
          SRC
            end
          end
          edit(rows,'Game_Battler 1') do |s|
            once(s,'n = base_pdef + $game_variables[169] + $game_variables[170] + $game_variables[171]','n = base_pdef + (@sl46_stats_ready ? 0 : $game_variables[169] + $game_variables[170] + $game_variables[171])','Independent defense')
          end
          edit(rows,'Multi-slot script : Actor') do |s|
            method_edit(s,'base_mdef') do |m|
              check(m.scan('$n').size==4 && m.include?('g7_ms_game_actor_base_mdef'),'Multi-slot MR accumulator')
              m.gsub('$n','n').sub('return n',"$n = n unless @sl46_stats_ready\n  return n")
            end
          end
          %w[Window_Base Window_Base2].each do |name|
            edit(rows,name) do |s|
              method_edit(s,'draw_actor_parameter') do |m|
                a=m.lines.select{|l|l.match?(/^\s*\$agi = actor\.pdef(?: \* 0\.8)?\s*$/)}
                check(a.size==1,"#{name} AC side effect")
                m=once(m,a[0],a[0].rstrip+' unless actor.instance_variable_get(:@sl46_stats_ready)' + "\n",name)
                m=once(m,'totalDex = $game_variables[469] + $game_variables[961]','totalDex = actor.instance_variable_get(:@sl46_stats_ready) ? actor.dex : $game_variables[469] + $game_variables[961]',name+' DEX')
                if name=='Window_Base2'
                  {962=>3,966=>4,968=>5}.each do |v,i|
                    m=once(m,"$game_variables[#{v}].to_s","(actor.instance_variable_get(:@sl46_stats_ready) ? actor.instance_variable_get(:@sl43_stats)[#{i}] : $game_variables[#{v}]).to_s",name+v.to_s)
                  end
                end
                m
              end
            end
          end
          edit(rows,'Scene_Equip') do |s|
            once(s,'$MDEF = new_mdef','$MDEF = new_mdef unless @actor.instance_variable_get(:@sl46_stats_ready)','Equipment preview MR ownership')
          end
          # Collision remains a pure query; yielding occurs only on actual movement.
          helpers=<<'SRC'
            def sl46_slot
              return nil unless self.is_a?(Game_Event) && @event && @event.name.to_s.start_with?('동료 ') && @character_name != ''
              c=@event.pages[0].condition
              sw=c.switch1_id
              return c.switch1_valid && (2001..2003).include?(sw) && $game_switches[sw] ? sw-1997 : nil
            end

            def sl46_step_coords(d)
              return [@x+(d==6 ? 1 : d==4 ? -1 : 0),@y+(d==2 ? 1 : d==8 ? -1 : 0)]
            end

            def sl46_occupied?(nx,ny)
              return true if self!=$game_player && $game_player.x==nx && $game_player.y==ny
              $game_map.events.values.any? do |e|
                next false if e==self || e.character_name==''
                pending=e.instance_variable_get(:@sl_healer_teleport)
                (e.x==nx && e.y==ny && (!e.through || e.sl46_slot)) || (pending && pending[0,2]==[nx,ny])
              end
            end

            def sl46_yield_at(nx,ny,d,priority=nil,seen=[])
              priority ||= (self==$game_player ? 0 : sl46_slot)
              return true unless priority
              events=$game_map.events.values
              b=events.find{|e|e!=self && e.sl46_slot && e.x==nx && e.y==ny}
              unless b
                return !events.any?{|e| e!=self && e.sl46_slot && e.moving? && (e.real_x-nx*128).abs<64 && (e.real_y-ny*128).abs<64}
              end
              return false unless [2,4,6,8].include?(d)
              return false if seen.include?(b) || (priority!=0 && priority>=b.sl46_slot)
              return false if b.moving? || b.jumping? || b.move_route_forcing || b.lock? || b.instance_variable_get(:@sl_healer_teleport)
              dirs=([4,6].include?(d) ? [2,8] : [4,6])+[d,10-d]
              dirs.each do |side|
                tx,ty=b.sl46_step_coords(side)
                next if tx==@x && ty==@y
                next unless $game_map.valid?(tx,ty) && $game_map.passable?(b.x,b.y,side,b) && $game_map.passable?(tx,ty,10-side)
                if b.sl46_occupied?(tx,ty)
                  if priority==0 && side==d && seen.size<2
                    other=events.find{|e|e!=b && e.sl46_slot && e.x==tx && e.y==ty}
                    if other && !seen.include?(other)
                      b.sl46_yield_at(tx,ty,side,priority,seen+[b])
                      return false
                    end
                  end
                  next
                end
                next unless b.passable?(b.x,b.y,side)
                old=[b.x,b.y]
                case side
                when 2; b.move_down
                when 4; b.move_left
                when 6; b.move_right
                when 8; b.move_up
                end
                return false if [b.x,b.y]!=old
              end
              false
            end

            def sl46_before_step(d)
              return true unless self==$game_player || sl46_slot
              nx,ny=sl46_step_coords(d)
              return true unless $game_map.valid?(nx,ny)
              if $game_map.events.values.any?{|e|e!=self && e.sl46_slot && e.x==nx && e.y==ny}
                return true unless $game_map.passable?(@x,@y,d,self) && $game_map.passable?(nx,ny,10-d)
              end
              sl46_yield_at(nx,ny,d)
            end

          SRC
          edit(rows,'Game_Character 1') do |s|
            s=method_edit(s,'passable?') do |m|
              a=m.lines.select{|l|l.include?('return false if self.is_a?(Game_Event)') && l.include?('e.x-new_x') && l.include?('@sl_healer_teleport')}
              check(a.size==1,'V3.14 adjacency collision guard')
              m=once(m,a[0],"    return false if (self==$game_player || sl46_slot) && $game_map.events.values.any?{|e|e!=self && e.sl46_slot && ((e.x==new_x && e.y==new_y) || (e.instance_variable_get(:@sl_healer_teleport) && e.instance_variable_get(:@sl_healer_teleport)[0,2]==[new_x,new_y]))}\n",'Exact-tile collision')
              through=m.lines.select{|l|l.match?(/^[ \t]*(?:if|return true if)[ \t]+@through(?:[ \t]*==[ \t]*true)?[ \t]*(?:#.*)?\n?$/)}
              check(through.size==1,'Original through guard')
              once(m,through[0],through[0].sub(/@through(?:[ \t]*==[ \t]*true)?/,'@through && !sl46_slot'),'Companion terrain and ordinary collision')
            end
            once(s,'  def passable?(x, y, d)',helpers+'  def passable?(x, y, d)','Actual movement yield helpers')
          end
          edit(rows,'Game_Character 3') do |s|
            {2=>'move_down',4=>'move_left',6=>'move_right',8=>'move_up'}.each do |d,n|
              s=method_edit(s,n){|m|once(m,"if passable?(@x, @y, #{d})","return unless sl46_before_step(#{d})\n    if passable?(@x, @y, #{d})",n)}
            end
            method_edit(s,'move_toward_player') do |m|
              a=m.lines.select{|l|l.include?('if d <= 1 || outside') && l.include?('동료 ') && l.include?('e.x-@x')}
              check(a.size==1,'V3.14 near teleport condition')
              m=once(m,a[0],a[0][/^[ \t]*/]+'if d >= 12'+"\n",'Distance-only teleport')
              screen=m[/^[ \t]*sx = screen_x\n[ \t]*sy = screen_y\n[ \t]*outside = sx < -45 \|\| sx >= 640 \+ 45 \|\|\n[ \t]*sy <= 0 \|\| sy >= 480 \+ 85\n/]
              m=once(m,screen,'','Unused off-screen test') if screen
              a=m.lines.select{|l|l.include?('e != self') && l.include?('e.x-tx') && l.include?('@sl_healer_teleport')}
              check(a.size==1,'Teleport reservation')
              m=once(m,a[0],a[0][/^[ \t]*/]+"(e != self && e.character_name != '' && ((e.x == tx && e.y == ty) || (e.instance_variable_get(:@sl_healer_teleport) && e.instance_variable_get(:@sl_healer_teleport)[0,2] == [tx,ty])))\n",'Exact destination reservation')
              first=m.index('      if d <= 2');last=first && m.index('      return if d <= 5',first)
              check(first && last && m[first...last].include?('move_away_from_player'),'Original close separation')
              m[first...last]=<<'SRC'
                if d == 0 || $game_map.events.values.any?{|e|e!=self && e.sl46_slot && sl46_slot && e.sl46_slot<sl46_slot && e.x==@x && e.y==@y}
                  dirs=[10-$game_player.direction,2,4,6,8].uniq
                  dirs.each do |side|
                    nx,ny=sl46_step_coords(side)
                    next if sl46_occupied?(nx,ny) || !passable?(@x,@y,side)
                    case side
                    when 2; move_down
                    when 4; move_left
                    when 6; move_right
                    when 8; move_up
                    end
                    break if moving?
                  end
                  return
                end
          SRC
              check(m.scan('@sl_healer_teleport = [tx, ty, Graphics.frame_count]').size==1,'Original teleport effect route')
              m
            end
          end
          expected=['Game_Actor','Game_Battler 1','Multi-slot script : Actor','Window_Base','Window_Base2','Scene_Equip','Game_Character 1','Game_Character 3'].sort
          changed=rows.each_index.select{|i|Marshal.dump(rows[i])!=before[i]}.map{|i|utf(rows[i][1])}.sort
          check(changed==expected,"Unexpected script changes #{changed.inspect}")
          # Inspect every map and active companion slot before writing scripts.
          maps=Dir.glob(File.join(root,pre+'Map[0-9][0-9][0-9].rxdata')).sort
          check(maps.size==46,'Map count')
          slots=0
          maps.each do |p|
            m=Marshal.load(File.binread(p));events=iv(m,:@events)
            ids=events.values.filter_map do |e|
              next unless utf(iv(e,:@name)).start_with?('동료 ')
              pg=iv(e,:@pages);check(pg.size==1,p);c=iv(pg[0],:@condition);check(iv(c,:@switch1_valid),p);iv(c,:@switch1_id)
            end
            check(ids.sort==(2001..2006).to_a,p);slots+=ids.count{|i|(2001..2003).include?(i)}
          end
          check(slots==138,'Companion coverage')
          raw=Marshal.dump(rows);File.binwrite(sp,raw);check(Marshal.dump(Marshal.load(File.binread(sp)))==raw,'Script roundtrip')
          puts "PASS #{maps.size} maps, #{slots} active slots; scripts #{changed.inspect}"
          RUBY
          ruby -c /tmp/sl46-patch.rb
          ruby /tmp/sl46-patch.rb

      - name: Update mappings and verify exact changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib,json,re
          root=Path('site')
          game=root/'knight/gameasync'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          names=['Scripts.rxdata']
          before=json.loads(Path('/tmp/sl46-before.json').read_text('utf8'))
          old=json.loads(Path('/tmp/sl46-md5.json').read_text('utf8'))
          mapper=game/'mapping.js'
          s=mapper.read_bytes()
          for n in names:
              marker=('Data/'+n+'?h=').encode('ascii')
              pattern=re.escape(marker)+rb'[0-9a-f]{32}'
              assert re.findall(pattern,s)==[marker+old[n].encode('ascii')],n
              digest=hashlib.md5((game/'Data'/n).read_bytes()).hexdigest().encode('ascii')
              s=re.sub(pattern,lambda _:marker+digest,s)
          mapper.write_bytes(s)
          loader=root/'knight/js/sl-assets-v229r115.js'
          s=loader.read_bytes()
          assert s.count(b"var version='V4.5';")==1
          loader.write_bytes(s.replace(b"var version='V4.5';",b"var version='V4.6';"))
          for name in ('index.html','knight/index.html'):
              p=root/name
              s=p.read_bytes()
              assert b'V4.5' in s
              p.write_bytes(s.replace(b'V4.5',b'V4.6').replace(b'v4.5',b'v4.6'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert set(before)==set(after)
          allowed={'knight/gameasync/Data/'+n for n in names}|{'knight/gameasync/mapping.js','knight/js/sl-assets-v229r115.js','index.html','knight/index.html'}
          changed={p for p in before if before[p]!=after[p]}
          assert changed==allowed,sorted(changed^allowed)
          assert len(after)==6019
          print('PASS approved files',len(changed))
          print('PASS unchanged files',len(before)-len(changed))
          print('PASS V4.6')
          PYTHON
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Upload V4.6 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
