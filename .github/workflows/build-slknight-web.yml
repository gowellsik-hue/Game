
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R44
# BASE: successful V229R43 with 106 approved TI dungeon monster events.
# FIX: block R42 native projected shortcuts through existing RGSS wall tiles.
# FIX: player becomes translucent when the visible front wall overlaps the sprite.
# Preserve both maps, every monster species/count, 1 Baphomet ID13 at 156,100,
# 3-way local respawn, all event scripts, audio, art and existing mobile engine.
# No game2 connection. No change to other maps or other workflows.
name: build-slknight-web.yml | V229R44 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R44 Restore approved V229R43 with all 106 original monster events
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39554867440
          name: github-pages
          github-token: ${{ github.token }}
          path: r43

      - name: V229R44 Restore native R42 symmetric passage edges
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39389927826
          name: SLKnight-V229R42-Native-Directional-Collision-and-Route-Audit
          github-token: ${{ github.token }}
          path: r42-edges

      - name: V229R44 Verify exact R43 assets and extract old native wall tiles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s r43/artifact.tar
          tar -xf r43/artifact.tar -C site
          cat > /tmp/r44-source.rb <<'R44_SOURCE'
          require 'json'
          require 'base64'
          module RPG
            class Map;end;class AudioFile;end;class MapInfo;end;class Tileset;end
            class Event;class Page;class Condition;end;class Graphic;end;end;end
            class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          class Table
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(d=0);@raw;end
            def [](x,y=0,z=0)
              _,w,h,depth,_=@raw.unpack('V5')
              return nil if x<0 || y<0 || x>=w || y>=h || z<0 || z>=depth
              @raw.byteslice(20+2*(x+y*w+z*w*h),2).unpack('v')[0]
            end
          end
          class Tone
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(d=0);@raw;end
          end
          class Color < Tone;end
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          root='site/knight/gameasync/Data/'
          require 'digest'
          expected={
            45=>'d0fcbaaf1e49807cc55b967e1016b2f833b1bd7c42af9ba52c8d7ac0f5cd105d',
            46=>'91d5d427cfb5e326f962a236355fc67bfa2decf961ff893bf00825d6d2ed46b5'
          }
          output={}
          [45,46].each do |mid|
            path=root+prefix+('Map%03d.rxdata'%mid)
            raise 'Wrong approved R43 map' unless Digest::SHA256.file(path).hexdigest==expected[mid]
            map=Marshal.load(File.binread(path))
            w=map.instance_variable_get(:@width);h=map.instance_variable_get(:@height)
            raise 'Wrong map dimensions' unless [w,h]==(mid==45 ? [288,144] : [336,168])
            data=map.instance_variable_get(:@data)
            tiles=[]
            h.times{|y|w.times{|x|
              v=data[x,y,0]
              raise "Unknown terrain tile #{v}" unless v==384 || v==385
              tiles << (v==384 ? 1 : 0)
            }}
            events=map.instance_variable_get(:@events).map{|id,e|
              name=e.instance_variable_get(:@name).to_s.dup.force_encoding('UTF-8').scrub
              {'id'=>id,'x'=>e.instance_variable_get(:@x),'y'=>e.instance_variable_get(:@y),'name'=>name}
            }
            output[mid.to_s]={'w'=>w,'h'=>h,'walk'=>Base64.strict_encode64(tiles.pack('C*')),'events'=>events}
            puts "R43 SOURCE Map#{mid}: #{tiles.sum} old open tiles, #{events.size} events"
          end
          File.write('build/r44-source.json',JSON.generate(output))
          R44_SOURCE
          ruby -c /tmp/r44-source.rb
          ruby /tmp/r44-source.rb
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          baseline={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(baseline)==5472,len(baseline)
          assert hashlib.sha256((root/'knight/gameasync/Data/Scripts.rxdata').read_bytes()).hexdigest()=='83811b932c795aa959f6586f96542c701cb388a365df0a5f4e41a2d9f8f68e75'
          assert 'V229R43' in (root/'index.html').read_text('utf-8')
          assert 'V229R43' in (root/'knight/index.html').read_text('utf-8')
          Path('build/r44-baseline.json').write_text(json.dumps(baseline,sort_keys=True))
          PY_BASE

      - name: V229R44 Fix wall collision while retaining all 115 existing map events
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r44-collision.py <<'R44_COLLISION'
          from pathlib import Path
          from collections import deque
          import base64,hashlib,json

          source=json.loads(Path('build/r44-source.json').read_text('utf-8'))
          base=Path('r42-edges');out=Path('build');report={}
          # Minimal native-edge bridges: 1F old RGSS wall classification contains
          # disconnected foot samples. These 12 are in the original S32 graph.
          BRIDGES={45:[(90,79),(114,59),(111,62),(110,62),(139,41),(138,41),
                       (136,45),(137,45),(139,43),(174,75),(189,73),(195,77)],46:[]}
          # Only previous R43 monsters on tiles explicitly marked blocked are moved.
          MOVES={45:{38:((101,82),(101,81)),39:((105,68),(106,68)),
                     43:((156,99),(155,99)),46:((146,74),(145,74))},
                 46:{25:((156,92),(155,92)),34:((141,102),(142,102)),
                     39:((138,96),(140,96)),61:((82,100),(82,99))}}
          DIR=((1,0,8,4),(-1,0,4,8),(0,1,2,1),(0,-1,1,2))

          for mid in (45,46):
              src=source[str(mid)];w,h=src['w'],src['h']
              raw=(base/f'r42-map-{mid}-edges.bin').read_bytes()
              old=bytearray(base64.b64decode(src['walk']))
              assert len(raw)==len(old)==w*h
              assert sum(old)==(3724 if mid==45 else 7100)
              events=src['events'];assert len(events)==(53 if mid==45 else 62)
              assert sum(bool(x) for x in raw)==(4602 if mid==45 else 8106)
              def index(x,y):return y*w+x
              for x,y in BRIDGES[mid]:
                  k=index(x,y)
                  assert old[k]==0 and raw[k]!=0,('Unverified native bridge',mid,x,y)
              allowed=bytearray(old)
              for x,y in BRIDGES[mid]:allowed[index(x,y)]=1
              byid={e['id']:e for e in events}
              before={(e['x'],e['y']) for e in events}
              for eid,(original,corrected) in MOVES[mid].items():
                  e=byid[eid]
                  assert (e['x'],e['y'])==original and e['name'].startswith('[ID')
                  assert not old[index(*original)] and old[index(*corrected)]
                  assert corrected not in before and raw[index(*corrected)]
                  before.remove(original);before.add(corrected)
                  e['x'],e['y']=corrected
              start=(95,73) if mid==45 else (81,94)
              assert allowed[index(*start)]
              visited={index(*start)};queue=deque(visited)
              while queue:
                  k=queue.popleft();x,y=k%w,k//w
                  for dx,dy,bit,reverse in DIR:
                      nx,ny=x+dx,y+dy
                      if not(0<=nx<w and 0<=ny<h):continue
                      j=index(nx,ny)
                      if allowed[j] and j not in visited and (raw[k]&bit) and (raw[j]&reverse):
                          visited.add(j);queue.append(j)
              for e in events:
                  assert index(e['x'],e['y']) in visited,('Cannot reach existing event',mid,e)
              destination=(201,76) if mid==45 else (156,100)
              assert index(*destination) in visited
              if mid==46:
                  boss=byid[13]
                  assert (boss['x'],boss['y'])==(156,100) and '바포메트' in boss['name']
              edges=bytearray(w*h);shadow=bytearray(w*h)
              for k in visited:
                  x,y=k%w,k//w
                  for dx,dy,bit,reverse in DIR:
                      nx,ny=x+dx,y+dy
                      if 0<=nx<w and 0<=ny<h:
                          j=index(nx,ny)
                          if j in visited and (raw[k]&bit) and (raw[j]&reverse):
                              edges[k]|=bit
                  # A wall directly in front rises over the character's body.
                  if y+1<h and old[k+w]==0:
                      shadow[k]=1
              assert all((edges[k]&bit)==0 or
                         (0<=x+dx<w and 0<=y+dy<h and
                          edges[index(x+dx,y+dy)]&reverse)
                         for k in visited for x,y in [(k%w,k//w)]
                         for dx,dy,bit,reverse in DIR)
              assert sum(bool(v) for v in edges)==len(visited)
              assert sum(1 for k in visited if not old[k])==len(BRIDGES[mid])
              assert len(visited)==(3566 if mid==45 else 6807)
              (out/f'r44-map-{mid}-edges.bin').write_bytes(edges)
              (out/f'r44-map-{mid}-wall-overlap.bin').write_bytes(shadow)
              report[str(mid)]={'originalR43WalkableTiles':sum(old),
                  'R42OverpermissiveOldBlockedTiles':sum(bool(raw[k]) and not old[k] for k in range(w*h)),
                  'R44NativeBridgeTiles':BRIDGES[mid],
                  'R44ReachableOpenTiles':len(visited),
                  'R44PlayerWallOverlapCells':sum(shadow),
                  'movedMonsters':{str(k):{'from':v[0],'to':v[1]} for k,v in MOVES[mid].items()},
                  'edgesSHA256':hashlib.sha256(edges).hexdigest(),
                  'preservedEventCount':len(events)}
              print('R44 Map',mid,'reachable',len(visited),'wall bridges',len(BRIDGES[mid]),
                    'translucency cells',sum(shadow),'events',len(events))
          (out/'r44-collision-audit.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          R44_COLLISION
          python3 -m py_compile /tmp/r44-collision.py
          python3 /tmp/r44-collision.py

      - name: V229R44 Patch eight blocked spawns and validate all 3-way respawns
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r44-events.rb <<'R44_EVENTS'
          require 'json';require 'set';require 'digest'
          module RPG
            class Map;end;class AudioFile;end;class MapInfo;end;class Tileset;end
            class Event;class Page;class Condition;end;class Graphic;end;end;end
            class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          class Table
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(d=0);@raw;end
          end
          class Tone
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
            def _dump(d=0);@raw;end
          end
          class Color < Tone;end
          def iv(o,key);o.instance_variable_get('@'+key.to_s);end
          def sv(o,key,value);o.instance_variable_set('@'+key.to_s,value);end
          def verify(c,msg);raise msg unless c;end
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          root='site/knight/gameasync/Data/'
          collision=JSON.parse(File.read('build/r44-collision-audit.json'))
          totals={};new_respawns=0
          [45,46].each do |mid|
            w,h=mid==45 ? [288,144] : [336,168]
            original_file=root+prefix+('Map%03d.rxdata'%mid)
            old=Marshal.load(File.binread(original_file))
            map=Marshal.load(File.binread(original_file))
            events=iv(map,'events');before=iv(old,'events')
            edge=File.binread("build/r44-map-#{mid}-edges.bin")
            verify(edge.bytesize==w*h,'Unexpected native edge mask size')
            move=collision[mid.to_s]['movedMonsters']
            moved=0;counts=Hash.new(0)
            monster=->(name){name.start_with?('[ID') &&
              (name.include?('해골')||name.include?('좀비')||name.include?('스파토이')||
               name.include?('버그베어')||name.include?('켈베로스'))}
            directions=[[0,-1,1,2],[0,1,2,1],[-1,0,4,8],[1,0,8,4]]
            accessible=->(x,y){x>=0 && y>=0 && x<w && y<h && edge.getbyte(y*w+x)>0}
            events.each do |id,event|
              name=iv(event,'name').to_s.dup.force_encoding('UTF-8').scrub
              next unless monster.call(name)
              counts[name]+=1
              if move.key?(id.to_s)
                info=move[id.to_s]
                verify([iv(event,'x'),iv(event,'y')]==info['from'],'R43 monster moved unexpectedly')
                sv(event,'x',info['to'][0]);sv(event,'y',info['to'][1]);moved+=1
              end
              x,y=iv(event,'x'),iv(event,'y')
              verify(accessible.call(x,y),"Blocked monster spawn #{mid}/#{id}")
              death=iv(event,'pages')[3]
              verify(!death.nil?,"Missing original death/respawn page #{mid}/#{id}")
              commands=iv(death,'list')
              random_moves=commands.select{|c|iv(c,'code')==202 &&
                (p=iv(c,'parameters'))[0]==0 && p[1]==0}
              verify(random_moves.length==3,"Not the original 3-way respawn #{mid}/#{id}")
              q=[[x,y,0]];seen=Set[[x,y]];reachable=[[x,y]]
              head=0
              while head<q.length
                cx,cy,d=q[head];head+=1
                next if d>=10
                bits=edge.getbyte(cy*w+cx)
                directions.each do |dx,dy,bit,rev|
                  nx=cx+dx;ny=cy+dy
                  next unless accessible.call(nx,ny) && (bits&bit)!=0
                  next if seen.include?([nx,ny])
                  seen.add([nx,ny]);reachable << [nx,ny];q << [nx,ny,d+1]
                end
              end
              # Keep the original random three-way event commands and only replace
              # destinations that are blocked or no longer connected to this spawn.
              choices=random_moves.map{|c|p=iv(c,'parameters');[p[2],p[3]]}
              invalid=choices.any?{|xy|!seen.include?(xy)}
              if invalid
                pool=reachable.shuffle(random:Random.new(mid*100000+id))
                unique=[]
                choices.each do |xy|
                  next unless seen.include?(xy) && !unique.include?(xy)
                  unique<<xy
                end
                pool.each do |xy|
                  break if unique.length==3
                  unique<<xy unless unique.include?(xy)
                end
                verify(unique.length==3,'No three connected local respawn choices')
                random_moves.each_with_index do |c,i|
                  p=iv(c,'parameters');p[2],p[3]=unique[i]
                end
                new_respawns+=1
              end
            end
            if mid==46
              verify(Marshal.dump(before.fetch(13))==Marshal.dump(events.fetch(13)),
                'Original Baphomet ID13 was changed')
            end
            before.each do |eid,e|
              name=iv(e,'name').to_s.dup.force_encoding('UTF-8').scrub
              next if monster.call(name)
              verify(Marshal.dump(e)==Marshal.dump(events.fetch(eid)),
                "A non-monster event changed: #{mid}/#{eid}")
            end
            expected=mid==45 ? {'[ID해골]'=>18,'[ID좀비]'=>16,'[ID스파토이]'=>14} :
              {'[ID버그베어]'=>27,'[ID켈베로스]'=>25,'[ID킹 버그베어]'=>5}
            verify(counts==expected,"Species or monster count changed: #{mid} #{counts}")
            verify(moved==4,"Expected exactly four corrected wall spawns: #{mid}")
            File.binwrite(original_file,Marshal.dump(map))
            verify(iv(Marshal.load(File.binread(original_file)),'events').size==before.size,
              'R43 event count changed')
            totals[mid]={'regularMonsters'=>counts.values.sum,'originalEvents'=>before.size,
                          'correctedBlockedSpawns'=>moved}
          end
          File.write('build/r44-event-audit.json',JSON.pretty_generate(
            {'version'=>'V229R44','maps'=>totals,'regularMonsters'=>105,
             'unchangedBaphometID'=>13,'unchangedBaphometXY'=>[156,100],
             'respawnGroupsCorrected'=>new_respawns}))
          puts "PASS: 105 original regular monsters, unchanged 1 Baphomet, 8 corrected positions, #{new_respawns} groups of valid 3-way respawns"
          R44_EVENTS
          ruby -c /tmp/r44-events.rb
          ruby /tmp/r44-events.rb

      - name: V229R44 Patch only original movement and character-opacity scripts
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r44-script.rb <<'R44_SCRIPT'
          require 'zlib';require 'base64';require 'digest';require 'json'
          path='site/knight/gameasync/Data/Scripts.rxdata'
          expected='83811b932c795aa959f6586f96542c701cb388a365df0a5f4e41a2d9f8f68e75'
          raise 'Wrong R43 scripts' unless Digest::SHA256.file(path).hexdigest==expected
          scripts=Marshal.load(File.binread(path));original=Marshal.load(File.binread(path))
          code=Zlib::Inflate.inflate(scripts.fetch(21).fetch(2))
          raise 'R42 native passage module missing' unless code.include?('module SLTI_V229R42')
          old='return false unless SLTI_V229R42.allowed?(@map_id, x, y, d)'
          raise 'Wrong R42 passage site' unless code.scan(old).size==1
          replacement='return false unless SLTI_V229R44.allowed?(@map_id, x, y, d)'
          code=code.sub(old,replacement)
          inject="module SLTI_V229R44\n"
          [45,46].each do |mid|
            edges=File.binread("build/r44-map-#{mid}-edges.bin")
            shadows=File.binread("build/r44-map-#{mid}-wall-overlap.bin")
            expected_size=mid==45 ? 288*144 : 336*168
            raise 'Wrong R44 mask' unless edges.bytesize==shadows.bytesize && edges.bytesize==expected_size
            [['EDGES',edges],['SHADOW',shadows]].each do |key,data|
              inject << "  #{key}_#{mid} = [\n"
              Base64.strict_encode64(data).scan(/.{1,120}/).each{|chunk|inject << "    #{chunk.dump},\n"}
              inject << "  ].join.unpack('m')[0]\n"
            end
          end
          inject << <<'R44_MODULE'
            def self.allowed?(map_id,x,y,direction)
              w=map_id==45 ? 288 : (map_id==46 ? 336 : 0)
              h=map_id==45 ? 144 : (map_id==46 ? 168 : 0)
              return false if x<0 || y<0 || x>=w || y>=h
              raw=map_id==45 ? EDGES_45 : EDGES_46
              value=raw[y*w+x,1]
              return false if value==nil
              bit=direction==8 ? 1 : (direction==2 ? 2 : (direction==4 ? 4 : (direction==6 ? 8 : 0)))
              return bit!=0 && ((value.unpack('C')[0] & bit)!=0)
            end
            def self.wall_overlap?(map_id,x,y)
              w=map_id==45 ? 288 : (map_id==46 ? 336 : 0)
              h=map_id==45 ? 144 : (map_id==46 ? 168 : 0)
              return false if x<0 || y<0 || x>=w || y>=h
              raw=map_id==45 ? SHADOW_45 : SHADOW_46
              one=raw[y*w+x,1]
              return one!=nil && one.unpack('C')[0]!=0
            end
          end
          R44_MODULE
          raise 'Cannot inject R44 before existing Game_Map' unless code.include?("class Game_Map\r\n")
          code=code.sub("class Game_Map\r\n",inject+"\nclass Game_Map\r\n")
          scripts[21][2]=Zlib::Deflate.deflate(code)
          sprite=Zlib::Inflate.inflate(scripts.fetch(28).fetch(2))
          marker='self.opacity = @character.opacity'
          raise 'Original sprite opacity site changed' unless sprite.scan(marker).size==1
          extra=<<'R44_ALPHA'
          self.opacity = @character.opacity
          # Original wall-front behavior: player translucent where a wall face
          # rises in front of the character. Do not change enemies or other maps.
          if @character == $game_player &&
             ($game_map.map_id == 45 || $game_map.map_id == 46) &&
             SLTI_V229R44.wall_overlap?($game_map.map_id,@character.x,@character.y)
            self.opacity = 144 if self.opacity > 144
          end
          R44_ALPHA
          sprite=sprite.sub(marker,extra)
          scripts[28][2]=Zlib::Deflate.deflate(sprite)
          scripts.each_index{|i|raise "Unapproved changed script #{i}" if i!=21 && i!=28 && scripts[i]!=original[i]}
          File.binwrite(path,Marshal.dump(scripts))
          File.binwrite('build/r44-script21.rb',code)
          File.binwrite('build/r44-script28.rb',sprite)
          raise 'No opacity fix' unless sprite.include?('SLTI_V229R44.wall_overlap?')
          puts 'PASS: script21 strict walls, script28 player alpha; all other scripts untouched'
          R44_SCRIPT
          ruby /tmp/r44-script.rb
          ruby -c build/r44-script21.rb
          ruby -c build/r44-script28.rb

      - name: V229R44 Update only touched RGSS asset hashes and displayed version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_MANIFEST'
          from pathlib import Path
          import hashlib,re
          root=Path('site');mapping=root/'knight/gameasync/mapping.js'
          text=mapping.read_text('utf-8')
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          for relative in ['Data/Scripts.rxdata',f'Data/{prefix}Map045.rxdata',f'Data/{prefix}Map046.rxdata']:
              path=root/'knight/gameasync'/relative
              needle=relative+'?h='
              pattern=re.escape(needle)+r'[0-9a-f]{32}'
              new=needle+hashlib.md5(path.read_bytes()).hexdigest()
              text,count=re.subn(pattern,lambda _:new,text)
              assert count==1,(relative,'RGSS file missing or duplicated')
          mapping.write_text(text,encoding='utf-8')
          for path in [root/'index.html',root/'knight/index.html']:
              s=path.read_text('utf-8')
              assert 'V229R43' in s,path
              path.write_text(s.replace('V229R43','V229R44').replace('v229r43','v229r44'),encoding='utf-8')
          PY_MANIFEST
          node --check site/knight/gameasync/mapping.js

      - name: V229R44 Execute actual patched Ruby movement and occlusion checks
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r44-runtime-smoke.rb <<'R44_SMOKE'
          require 'json';require 'base64'
          eval(File.binread('build/r44-script21.rb'),TOPLEVEL_BINDING,'R44_Game_Map')
          source=JSON.parse(File.read('build/r44-source.json'))
          MapStub=Struct.new(:width,:height)
          map=Game_Map.allocate
          checked=0;shadows=0
          [45,46].each do |mid|
            info=source[mid.to_s];w=info['w'];h=info['h']
            edges=File.binread("build/r44-map-#{mid}-edges.bin")
            occlusion=File.binread("build/r44-map-#{mid}-wall-overlap.bin")
            map.instance_variable_set(:@map_id,mid)
            map.instance_variable_set(:@map,MapStub.new(w,h))
            map.instance_variable_set(:@events,{})
            map.instance_variable_set(:@passages,Array.new(1000,0))
            map.instance_variable_set(:@priorities,Array.new(1000,0))
            h.times do |y|
              w.times do |x|
                i=y*w+x
                {8=>1,2=>2,4=>4,6=>8}.each do |direction,bit|
                  expected=(edges.getbyte(i)&bit)!=0
                  actual=map.passable?(x,y,direction)
                  raise "Passage mismatch #{mid}/#{x}/#{y}/#{direction}" unless actual==expected
                  checked+=1
                end
                expected=occlusion.getbyte(i)!=0
                raise "Occlusion mismatch #{mid}/#{x}/#{y}" unless
                  SLTI_V229R44.wall_overlap?(mid,x,y)==expected
                shadows+=1 if expected
              end
            end
            raise 'Off-map walk is allowed' if map.passable?(w,0,2) || map.passable?(0,h,6)
            puts "PASS original Ruby Map#{mid}: #{w*h*4} wall decisions, #{occlusion.bytes.count(1)} overlap cells"
          end
          raise 'Missing checks' unless checked==391680 && shadows==992
          puts 'PASS R44 actual original passable? and player overlap mask'
          R44_SMOKE
          ruby /tmp/r44-runtime-smoke.rb | tee build/r44-runtime-test.txt

      - name: V229R44 Audit all edits and keep existing 106 monsters unchanged in count
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_FINAL'
          import hashlib,json
          from pathlib import Path
          root=Path('site');out=Path('build')
          before=json.loads((out/'r44-baseline.json').read_text())
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(before)==len(after)==5472 and before.keys()==after.keys()
          changed={name for name in before if before[name]!=after[name]}
          prefix='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          allowed={'index.html','knight/index.html','knight/gameasync/mapping.js',
                   'knight/gameasync/Data/Scripts.rxdata',prefix+'Map045.rxdata',prefix+'Map046.rxdata'}
          assert changed==allowed,('Unapproved game files modified',changed^allowed)
          c=json.loads((out/'r44-collision-audit.json').read_text())
          e=json.loads((out/'r44-event-audit.json').read_text())
          assert [c['45']['R44ReachableOpenTiles'],c['46']['R44ReachableOpenTiles']]==[3566,6807]
          assert [len(c['45']['R44NativeBridgeTiles']),len(c['46']['R44NativeBridgeTiles'])]==[12,0]
          assert e['regularMonsters']==105 and e['unchangedBaphometID']==13
          assert e['unchangedBaphometXY']==[156,100]
          assert sum(x['correctedBlockedSpawns'] for x in e['maps'].values())==8
          assert sum(x['regularMonsters'] for x in e['maps'].values())+1==106
          for mid in (45,46):
              assert (out/f'r44-map-{mid}-edges.bin').stat().st_size==(288*144 if mid==45 else 336*168)
          assert 'V229R44' in (root/'index.html').read_text('utf-8')
          assert 'V229R44' in (root/'knight/index.html').read_text('utf-8')
          print('PASS V229R44: strict wall masks, front-wall player translucency, 106 monsters, single preserved Baphomet; only 6 authorized files changed')
          PY_FINAL

      - name: V229R44 Upload movement and wall-overlap proof
        uses: actions/upload-artifact@v4
        with:
          name: SLKnight-V229R44-Wall-Collision-Player-Translucency-106-Monsters
          path: |
            build/r44-collision-audit.json
            build/r44-event-audit.json
            build/r44-runtime-test.txt
            build/r44-map-45-edges.bin
            build/r44-map-46-edges.bin
            build/r44-map-45-wall-overlap.bin
            build/r44-map-46-wall-overlap.bin
          retention-days: 30
          if-no-files-found: error

      - name: V229R44 Upload same SLKnight site to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
