
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R103
# BASE: successfully deployed R102, run 40433113927. Never revert its good C floor.
# WALL: re-render native Sanctuary's OLD partial wall source (V3/V3.2) WITHOUT
#       original S32 layer 161. Preserve other wall pixels; no runtime masks/paint.
# MOBS: keep 30 per floor on connected, movable ground; retain original event
#       pages, monster stats, nonmonster events and Baphomet original location.
# SPEED: skip updating four invisible RPG tilemaps on native 1F/2F; cache
#        unchanged 1F floor scroll as already done for 2F; trim empty wall sprites.
# All other game data and original 4-direction mobile controls are untouched.
name: build-slknight-web.yml | V229R103 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: V229R103 Restore successful R102 with existing clean dungeon floors
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40433113927
          name: github-pages
          github-token: ${{ github.token }}
          path: r102

      - name: V229R103 Restore authentic Sanctuary wall source and map objects
        shell: bash
        run: |
          set -euo pipefail
          test -s r102/artifact.tar
          mkdir -p site build source previous/v2 original-ti
          tar -xf r102/artifact.tar -C site
          gh run download 39045175890 -R "$GITHUB_REPOSITORY" \
            -n Sanctuary-TI-Dungeon-V2-Raw-and-Layer3 -D previous/v2
          gh run download 39100619927 -R "$GITHUB_REPOSITORY" \
            -n Sanctuary-TI-Dungeon-V4.1-Original-Terrain-Walk -D original-ti
          for part in zip z32 z33 z34 z35; do
            gh release download v1.0.0 -R "$GITHUB_REPOSITORY" \
              -p "Sanctuary.of.Aden.-.Copy.$part" -D source --clobber
            test -s "source/Sanctuary.of.Aden.-.Copy.$part"
          done
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/audit-sanctuary-maps.yml?ref=7bc9415741a198fdfd73211c04ca92210e65094b" \
            --jq .content | base64 -d > build/original-v3-renderer.yml
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert len(files)==5517,('R102 files changed',len(files))
          assert files['knight/gameasync/Data/Scripts.rxdata']==\
            '62b575db7e96c954d0076d20642208880b46e9ae481246390031ec0c10015534'
          assert 'V229R102' in (root/'index.html').read_text('utf-8')
          assert 'V229R102' in (root/'knight/index.html').read_text('utf-8')
          assert len(list((root/'knight/gameasync/Graphics/Panoramas').glob('SLTI_46_C*_*.png')))==66
          assert len(list((root/'knight/gameasync/Graphics/Panoramas').glob('SLTI_46_W_C*_*.png')))==28
          Path('build/r102-before.json').write_text(json.dumps(files,sort_keys=True))
          print('PASS R102 restored: engine, original D-pad, full clean C floor and W images')
          PY_BASE

      - name: V229R103 Re-render original V3 partial foreground with and without layer 161
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv build/til-env
          build/til-env/bin/pip --disable-pip-version-check -q install Pillow==11.3.0 numpy
          python3 - <<'PY_SOURCE'
          from pathlib import Path
          import re,textwrap,struct,collections,json
          src=Path('build/original-v3-renderer.yml').read_text('utf-8')
          match=re.search(r"(?m)^ *cat > /tmp/sanctuary-map-v3\.py <<'PY_MAP_V3'\n(.*?)^ *PY_MAP_V3\s*$",src,re.S)
          assert match, 'Pinned ORIGINAL Sanctuary Tile.idx/Tile.pak renderer not found'
          code=textwrap.dedent(match.group(1))
          old='''                              for layer,x,y,tid,index
                              in objects'''
          # Keep source code pinned. Only remove the final V3 threshold assertion
          # that failed AFTER producing the V3.2 reference graphics.
          assert code.count("assert counts['drawn']>counts['floor']*0.8")==1
          code=code.replace("assert counts['drawn']>counts['floor']*0.8", "assert counts['drawn']>=0")
          assert code.count("in objects")==1
          for variant,skip in (('reference',False),('no161',True)):
            dest=f'build/native-{variant}'
            program=code.replace("OUT = Path('reports/preview')",f"OUT = Path('{dest}/preview')")
            program=program.replace("Path('reports/summary.json')",f"Path('{dest}/summary.json')")
            assert f"OUT = Path('{dest}/preview')" in program
            if skip:
              # This is SOURCE S32 object enumeration, not a graphic mask.
              # Preserve every ground tile and every other original object.
              program,n=re.subn(r'(?m)^([ \t]*)in objects[ \t]*$',
                lambda m:m.group(1)+"in objects if not (mid == '2' and layer == 161)",program)
              assert n==1,'S32 object enumeration changed'
            Path(f'build/native-{variant}.py').write_text(program,encoding='utf-8')
          # Verify the unwanted graphic is a distinct native object group.
          source=Path('previous/v2/extracted/map')
          counts={1:collections.Counter(),2:collections.Counter()}
          for mid in (1,2):
            for f in (source/str(mid)).glob('*.s32'):
              b=f.read_bytes();off=32768
              n=struct.unpack_from('<H',b,off)[0]
              off+=2+6*n+4*4096
              groups=struct.unpack_from('<I',b,off)[0];off+=4
              for _ in range(groups):
                _,count=struct.unpack_from('<hH',b,off);off+=4
                for _ in range(count):
                  x,y,layer,frame,tid,flags=struct.unpack_from('<BBBBhB',b,off);off+=7
                  if layer==161 and tid>=0:counts[mid][tid]+=1
          assert sum(counts[1].values())==0
          assert counts[2]==collections.Counter({3189:141,3190:1888,3191:581,3192:570,3193:319})
          Path('build/source161-counts.json').write_text(json.dumps({str(k):dict(v) for k,v in counts.items()}))
          print('PASS S32 identifies exactly 3499 smoke objects on map46 layer 161, none on 1F')
          PY_SOURCE
          python3 -m py_compile build/native-reference.py build/native-no161.py
          build/til-env/bin/python build/native-reference.py
          build/til-env/bin/python build/native-no161.py

      - name: V229R103 Rebuild only original wall W, keep original R102 floor C
        shell: bash
        run: |
          set -euo pipefail
          build/til-env/bin/python - <<'PY_WALL'
          from pathlib import Path
          import hashlib,json,re,io
          import numpy as np
          from PIL import Image
          root=Path('site/knight/gameasync/Graphics/Panoramas')
          v4=Path('original-ti/preview')
          reference=Path('build/native-reference/preview')
          clean=Path('build/native-no161/preview')
          # The earlier R48 wall atlas was built from the V3.2 PARTIAL output.
          # Validate byte-for-byte image content against that very source first.
          tiles=sorted((v4/'baseline/tiles/2').glob('*.png'))
          assert len(tiles)==16
          for path in tiles:
            a=reference/'tiles/2'/path.name
            b=clean/'tiles/2'/path.name
            assert a.is_file() and b.is_file(),path.name
            with Image.open(path) as source, Image.open(a) as rerender:
              assert np.array_equal(np.asarray(source.convert('RGBA')),
                                    np.asarray(rerender.convert('RGBA'))),(
                'Pinned native V3 rerender differs from original R48 wall source',path.name)
          # Stitch on the exact native block coordinates from original map metadata.
          html=(v4/'terrain-walk-v4.1.html').read_text('utf-8')
          data=json.loads(re.search(r'<script id="data" type="application/json">(.*?)</script>',html,re.S).group(1))
          blocks=data['2']['tiles'];x0=min(v['x'] for v in blocks);y0=min(v['y'] for v in blocks)
          W=max(v['x']+1536 for v in blocks)-x0
          H=max(v['y']+768 for v in blocks)-y0
          assert (W,H)==(5376,2688)
          def merge_images(subfolder):
            image=Image.new('RGBA',(W,H))
            for part in blocks:
              with Image.open(subfolder/part['src']) as f:
                image.alpha_composite(f.convert('RGBA'),(part['x']-x0,part['y']-y0))
            return np.asarray(image)
          original_fg=merge_images(reference)
          clean_fg=merge_images(clean)
          assert np.any(original_fg!=clean_fg), 'Original smoke layer had no effect on wall source'
          # The floor C was already corrected in R102. Do not edit it again.
          changed=[];native_pixels=0;wall_pixels=0
          parts={}
          for cy in range(6):
            for cx in range(11):
              key=f'46:{cx}:{cy}'
              path=root/f'SLTI_46_W_C{cx}_{cy}.png'
              if not path.exists():continue
              with Image.open(path) as f:wall=np.asarray(f.convert('RGBA'),dtype=np.uint8).copy()
              yy=cy*512;xx=cx*512
              orig=original_fg[yy:yy+512,xx:xx+512]
              native=clean_fg[yy:yy+512,xx:xx+512]
              assert wall.shape==(512,512,4)
              # Reconstruct the changed W source pixels from the native source
              # without layer 161. Untouched wall pixels remain byte-identical.
              changed_at=np.any(orig!=native,axis=2)
              native_pixels+=int(changed_at.sum())
              if np.any(changed_at):
                floor_path=root/f'SLTI_46_C{cx}_{cy}.png'
                with Image.open(floor_path) as floor:
                  ground=np.asarray(floor.convert('RGBA'))
                wall[changed_at,:3]=ground[changed_at,:3]
                wall[changed_at,3]=native[changed_at,3]
              # Original 128x64 wall sprite geometry, recomputed to avoid
              # allocating blank wall sprites where the smoke was deleted.
              found=[]
              for ty in range(8):
                for tx in range(4):
                  alpha=wall[ty*64:(ty+1)*64,tx*128:(tx+1)*128,3]
                  ys,xs=np.nonzero(alpha>16)
                  if not len(xs):continue
                  found.append([ty*4+tx,int(xs.min()),int(ys.min()),int(xs.max())+1,int(ys.max())+1])
              parts[key]=found
              if not np.any(changed_at):continue
              with Image.open(path) as old:
                same=np.array_equal(np.asarray(old.convert('RGBA')),wall)
              if same:continue
              Image.fromarray(wall,'RGBA').save(path,compress_level=1)
              changed.append(path.name);wall_pixels+=int(changed_at.sum())
          assert 0<len(changed)<=28,('No residual smoke wall pixels found',len(changed))
          assert native_pixels>0 and wall_pixels>0
          Path('build/r103-walls.json').write_text(json.dumps({
            'changed':changed,'pieces':parts,'nativePixelsCompared':native_pixels,
            'affectedWallPixels':wall_pixels},sort_keys=True))
          print('PASS W source-only recovery',len(changed),'W chunks;',wall_pixels,'native-layer affected positions')
          print('PASS R102 C floor untouched; no added textures or overlays')
          PY_WALL

      - name: V229R103 Keep 30 mobile monsters per floor in distributed valid rooms
        shell: bash
        run: |
          set -euo pipefail
          cat > build/r103-spawn.rb <<'R103_SPAWN'
          require 'digest'
          module RPG
            class Map; end; class MapInfo; end; class AudioFile; end
            class Tileset; end
            class Event
              class Page
                class Condition; end; class Graphic; end
              end
            end
            class EventCommand; end; class MoveRoute; end; class MoveCommand; end
          end
          class Table
            def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
          end
          # Audited R102 coordinates: map45 native reachable component and
          # movable RGSS rooms; map46 monster RGSS-connected rooms including
          # main path, branches and side chambers. No runtime random spawn grid.
          SPAWNS={
            45=>{3=>[171,61],5=>[147,72],6=>[155,66],8=>[132,87],9=>[164,70],10=>[153,84],11=>[150,101],12=>[156,54],16=>[120,48],17=>[150,40],18=>[141,51],20=>[107,88],22=>[108,59],23=>[159,94],24=>[146,60],25=>[197,63],26=>[131,50],27=>[143,91],28=>[168,49],29=>[185,60],32=>[132,76],33=>[131,61],34=>[116,82],36=>[170,80],37=>[126,96],38=>[113,71],40=>[134,40],43=>[179,71],45=>[180,85],53=>[191,72]},
            46=>{4=>[165,113],5=>[104,108],6=>[120,91],8=>[123,105],9=>[179,101],10=>[96,107],12=>[157,88],13=>[156,100],15=>[208,98],16=>[252,70],17=>[143,117],18=>[218,59],19=>[91,101],20=>[94,88],21=>[172,90],22=>[114,108],23=>[126,111],24=>[164,93],25=>[147,93],26=>[159,107],27=>[137,99],28=>[146,105],29=>[240,99],30=>[168,101],31=>[120,119],32=>[133,111],33=>[189,38],34=>[175,109],37=>[120,111],39=>[153,113]}
          }.freeze
          QUOTA={
            45=>{'[ID해골]'=>11,'[ID좀비]'=>10,'[ID스파토이]'=>9},
            46=>{'[ID버그베어]'=>13,'[ID켈베로스]'=>13,'[ID킹 버그베어]'=>3,'[ID바포메트]'=>1}
          }.freeze
          ORIGINAL={45=>48,46=>58}.freeze
          base='site/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap'
          [45,46].each do |mid|
            path=sprintf('%s%03d.rxdata',base,mid)
            data=Marshal.load(File.binread(path))
            events=data.instance_variable_get(:@events)
            before=events.transform_values{|event|Marshal.dump(event)}
            # Preserve player portal, healer and special events, and their pages.
            protected=events.reject do |id,event|
              name=event.instance_variable_get(:@name).to_s.dup.force_encoding('UTF-8')
              name.start_with?('[ID') && !(mid==45 && id==13) && !(mid==46 && id==3)
            end
            monsters=events.keys-protected.keys
            raise 'Unexpected source mob count' unless monsters.size==ORIGINAL.fetch(mid)
            selected=SPAWNS.fetch(mid)
            raise 'Wrong target number' unless selected.size==30 && (selected.keys-monsters).empty?
            by_name=Hash.new(0)
            selected.each do |id,xy|
              x,y=xy
              monster=events.fetch(id)
              by_name[monster.instance_variable_get(:@name).to_s.dup.force_encoding('UTF-8')]+=1
              raise 'Bad XY' unless x.between?(0,data.instance_variable_get(:@width)-1) && y.between?(0,data.instance_variable_get(:@height)-1)
              monster.instance_variable_set(:@x,x)
              monster.instance_variable_set(:@y,y)
            end
            raise "Monster type mix changed #{mid}" unless by_name==QUOTA.fetch(mid)
            (monsters-selected.keys).each{|id|events.delete(id)}
            raise 'Nonmonster event changed' unless protected.all?{|id,e|events[id] && Marshal.dump(e)==before[id]}
            raise 'Final monster count changed' unless events.size==protected.size+30
            File.binwrite(path,Marshal.dump(data))
            restored=Marshal.load(File.binread(path)).instance_variable_get(:@events)
            raise 'Mob persistence failed' unless restored.size==events.size && selected.all?{|id,(x,y)|restored[id].instance_variable_get(:@x)==x && restored[id].instance_variable_get(:@y)==y}
            puts "PASS Map#{mid} #{ORIGINAL[mid]} -> 30 monsters; #{protected.size} portal/NPC events preserved"
          end
          R103_SPAWN
          ruby -c build/r103-spawn.rb
          ruby build/r103-spawn.rb

      - name: V229R103 Remove unnecessary graphics work and empty wall sprites
        shell: bash
        run: |
          set -euo pipefail
          ruby -rzlib -rjson - <<'R103_SCRIPT'
          path='site/knight/gameasync/Data/Scripts.rxdata'
          a=Marshal.load(File.binread(path))
          baseline_scripts=Marshal.load(File.binread(path))
          raise 'Wrong engine' unless a.size==136
          old97=Zlib::Inflate.inflate(a[97][2])
          old134=Zlib::Inflate.inflate(a[134][2])
          require 'digest'
          raise 'Unexpected R102 sprite code' unless Digest::SHA256.hexdigest(old97)=='bf4e69bba9a04e6eb16820e09c77bea7597cd2933822d961353dd272155dbb20'
          raise 'Unexpected R102 event code' unless Digest::SHA256.hexdigest(old134)=='3717984b3ee7ec1151d8041b6d9c427812a9a5508d8bdce8967f561ba6afcfa4'
          # Four original large RGSS tilemaps are already HIDDEN on 45/46.
          # They must not re-render every frame beneath the original panoramas.
          from='    @tilemap.ox = $game_map.display_x / 4'
          to='    slti_update_terrain if @slti_floor'
          beg=old97.index(from);fin=old97.index(to,beg)
          raise 'Cannot locate original terrain update region' unless beg && fin && old97.scan(from).size==1
          original=old97[beg...fin]
          newer=<<'R103_FAST'
              if @slti_floor
                # Original S32 panoramas: native RGSS tilemaps are invisible.
                slti_update_terrain
              else
          R103_FAST
          newer+=original.lines.map{|line|'  '+line}.join
          newer+='    end'
          old97=old97[0...beg]+newer+old97[fin+to.size..-1]
          # R60 already caches 2F when the camera is stationary. Same safe
          # condition applies to 1F once all required chunks are present.
          raise 'Missing R60 guard' unless old97.scan('if @slti_floor==46 &&').size==1
          old97=old97.sub('if @slti_floor==46 &&','if @slti_floor &&')
          ready="@slti_floor==46 &&\n      !@slti_chunk_error"
          raise 'R60 ready guard absent' unless old97.include?(ready)
          old97=old97.sub(ready,"@slti_floor!=nil &&\n      !@slti_chunk_error")
          a[97][2]=Zlib::Deflate.deflate(old97)
          # Only map46's original wall chunk sections are rebuilt. The parts
          # are derived from native source alpha, with empty sections omitted.
          data=JSON.parse(File.read('build/r103-walls.json'))
          new_parts=data.fetch('pieces')
          raise 'Wrong rebuilt native wall range' unless new_parts.size==28 && new_parts.keys.all?{|k|k.start_with?('46:')}
          marker='  def self.monster?(e)'
          raise 'Original wall section changed' unless old134.scan(marker).size==1
          addition="  PARTS.delete_if{|key,_|key.start_with?('46:')}\n  PARTS.merge!(#{new_parts.inspect})\n"
          patched134=old134.sub(marker,addition+marker)
          a[134][2]=Zlib::Deflate.deflate(patched134)
          File.binwrite('build/r103-script97.rb',old97)
          File.binwrite('build/r103-script134.rb',patched134)
          File.binwrite(path,Marshal.dump(a))
          raise 'Unexpected script modification' unless a.each_index.all?{|i|i==97 || i==134 || a[i]==baseline_scripts[i]}
          puts 'PASS only scripts97/134 modified: no invisible RGSS redraw; source-derived wall parts'
          R103_SCRIPT
          ruby -c build/r103-script97.rb
          ruby -c build/r103-script134.rb

      - name: V229R103 Refresh only modified asset caches and visible version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CACHE'
          from pathlib import Path
          import hashlib,json,re
          root=Path('site')
          assets=root/'knight/gameasync'
          mapping=assets/'mapping.js';js=mapping.read_text('utf-8')
          chunks=json.loads(Path('build/r103-walls.json').read_text('utf-8'))['changed']
          changed=['Data/Scripts.rxdata']+['Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap%03d.rxdata'%mid for mid in (45,46)]+['Graphics/Panoramas/'+name for name in chunks]
          for name in changed:
            path=assets/name
            md5=hashlib.md5(path.read_bytes()).hexdigest()
            pattern=rf'({re.escape(name)}\?h=)[0-9a-f]{{32}}'
            js,n=re.subn(pattern,lambda m:m.group(1)+md5,js)
            assert n==1,('Missing cache mapping',name,n)
          mapping.write_text(js,encoding='utf-8')
          for name in ('index.html','knight/index.html'):
            p=root/name;html=p.read_text('utf-8')
            assert 'V229R102' in html and 'V229R103' not in html
            p.write_text(html.replace('V229R102','V229R103').replace('v229r102','v229r103'),encoding='utf-8')
          print('PASS cache updated for original 2F W source and performance engine; C unchanged')
          PY_CACHE
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/dpad.js

      - name: V229R103 Audit all protected graphics, code and event counts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_AUDIT'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before=json.loads(Path('build/r102-before.json').read_text('utf-8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert len(before)==len(after)==5517 and before.keys()==after.keys()
          changed={name for name in before if before[name]!=after[name]}
          wall=json.loads(Path('build/r103-walls.json').read_text('utf-8'))['changed']
          allowed={'index.html','knight/index.html','knight/gameasync/mapping.js',
            'knight/gameasync/Data/Scripts.rxdata',
            'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap045.rxdata',
            'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap046.rxdata'}
          allowed|={f'knight/gameasync/Graphics/Panoramas/{s}' for s in wall}
          assert changed==allowed,('Unapproved asset or code modified',changed^allowed)
          assert before['knight/js/dpad.js']==after['knight/js/dpad.js']
          assert all('/SLTI_45_' not in x and '/SLTI_46_C' not in x for x in changed)
          assert len(wall)>=1
          print('PASS changed only 2F original W, two maps, scripts, mapping and two version labels')
          print('PASS original R102 floor, entire 1F graphics, D-pad, all other maps byte-identical')
          PY_AUDIT

      - name: V229R103 Publish source-clean W, 30+30 monsters and lighter renderer
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
