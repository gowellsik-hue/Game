name: Deploy SLKnight Play V6

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-slknight-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  ENGINE_REPO: white-axe/mkxp-z-libretro-emscripten
  ENGINE_REF: f0a1ff80f05dd0d1f8ca711485a5b0a601bc7502
  SITE_URL: https://gowellsik-hue.github.io/Game

jobs:
  build:
    name: Build SLKnight Play V6
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Checkout clean frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          submodules: false
          path: engine

      - name: Reuse existing single-thread engine and game
        run: |
          set -e

          mkdir -p engine/nostalgist/public

          for file in \
            mkxp-z_libretro.js \
            mkxp-z_libretro.wasm \
            slknight.mkxpz
          do
            echo "Downloading ${file}"

            curl -L \
              --fail \
              --retry 3 \
              -H 'Cache-Control: no-cache' \
              "${SITE_URL}/${file}?run=${GITHUB_RUN_ID}" \
              -o "engine/nostalgist/public/${file}"
          done

          test -s engine/nostalgist/public/mkxp-z_libretro.js
          test -s engine/nostalgist/public/mkxp-z_libretro.wasm
          test -s engine/nostalgist/public/slknight.mkxpz

          ls -lh \
            engine/nostalgist/public/mkxp-z_libretro.js \
            engine/nostalgist/public/mkxp-z_libretro.wasm \
            engine/nostalgist/public/slknight.mkxpz

      - name: Configure SLKnight play frontend
        run: |
          set -e

          cat > engine/nostalgist/.env <<'ENVEOF'
          VITE_CORE_JS_PATH=./mkxp-z_libretro.js
          VITE_CORE_WASM_PATH=./mkxp-z_libretro.wasm
          VITE_GAME_NAME=SLKnight
          VITE_GAME_PATH=./slknight.mkxpz
          VITE_XP_CONTROLS=true
          VITE_HAVE_OPFS=false
          VITE_REQUIRE_OPFS=false
          ENVEOF

      - name: Patch frontend for direct play
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          # ==========================================================
          # index.html
          # ==========================================================

          index_path = Path(
              "engine/nostalgist/index.html"
          )

          html = index_path.read_text(
              encoding="utf-8"
          )

          # Mobile viewport
          old_viewport = (
              '<meta name="viewport" '
              'content="width=device-width, initial-scale=1.0" />'
          )

          new_viewport = (
              '<meta name="viewport" '
              'content="width=device-width, initial-scale=1.0, '
              'maximum-scale=1.0, user-scalable=no, '
              'viewport-fit=cover" />'
          )

          if old_viewport not in html:
              raise SystemExit(
                  "PATCH FAILED: viewport"
              )

          html = html.replace(
              old_viewport,
              new_viewport,
              1,
          )

          # Single-thread build does not need COI service worker
          html = html.replace(
              '<script src="./coi-serviceworker.min.js"></script>',
              '',
              1,
          )

          # Remove service-worker heartbeat block
          html = re.sub(
              r'<script>\s*'
              r'// Send a dummy message every 5 seconds'
              r'.*?</script>',
              '',
              html,
              count=1,
              flags=re.S,
          )

          # Give the real game canvas an explicit backing size.
          canvas_id = (
              '      id="nostalgist-canvas"\n'
          )

          if html.count(canvas_id) != 1:
              raise SystemExit(
                  "PATCH FAILED: canvas id"
              )

          html = html.replace(
              canvas_id,
              (
                  '      id="nostalgist-canvas"\n'
                  '      width="640"\n'
                  '      height="480"\n'
              ),
              1,
          )

          old_canvas_style = (
              'style="position: fixed; left: 0; top: 0; '
              'width: 100%; height: 100%"'
          )

          new_canvas_style = (
              'style="position: fixed; left: 0; top: 0; '
              'width: 100vw; height: 100vh; '
              'display: block; background: #000"'
          )

          if old_canvas_style not in html:
              raise SystemExit(
                  "PATCH FAILED: canvas style"
              )

          html = html.replace(
              old_canvas_style,
              new_canvas_style,
              1,
          )

          # Replace giant play symbol with a normal mobile prompt.
          html = re.sub(
              r'<p id="user-activation-prompt"'
              r'[^>]*>\s*▶\s*</p>',
              '''
              <p
                id="user-activation-prompt"
                style="
                  display:none;
                  position:fixed;
                  left:50%;
                  top:50%;
                  transform:translate(-50%,-50%);
                  z-index:100;
                  margin:0;
                  padding:14px 20px;
                  border:1px solid #777;
                  border-radius:10px;
                  background:#111;
                  color:#fff;
                  font-size:18px;
                  font-family:system-ui,sans-serif
                "
              >
                화면을 터치해 시작
              </p>
              ''',
              html,
              count=1,
              flags=re.S,
          )

          index_path.write_text(
              html,
              encoding="utf-8",
          )

          # ==========================================================
          # main.ts
          # ==========================================================

          main_path = Path(
              "engine/nostalgist/src/main.ts"
          )

          text = main_path.read_text(
              encoding="utf-8"
          )

          # ----------------------------------------------------------
          # Remove threaded / COI browser checks.
          # The reused core is the already-successful single-thread core.
          # ----------------------------------------------------------

          secure_marker = (
              "// Multithreaded WebAssembly requires a secure context"
          )

          opfs_marker = (
              "const opfs = !HAVE_OPFS"
          )

          secure_pos = text.find(
              secure_marker
          )

          opfs_pos = text.find(
              opfs_marker,
              secure_pos,
          )

          if (
              secure_pos < 0
              or opfs_pos < 0
          ):
              raise SystemExit(
                  "PATCH FAILED: COI block"
              )

          text = (
              text[:secure_pos]
              + text[opfs_pos:]
          )

          # ----------------------------------------------------------
          # Important:
          # Nostalgist renames the supplied canvas ID to "canvas".
          #
          # Give Nostalgist an explicit internal framebuffer size
          # instead of depending on offsetWidth/offsetHeight.
          # ----------------------------------------------------------

          element_marker = (
              '  element: "#nostalgist-canvas",\n'
          )

          if text.count(element_marker) != 1:
              raise SystemExit(
                  "PATCH FAILED: element marker"
              )

          element_replacement = '''  element: "#nostalgist-canvas",
            size: {
              width: 640,
              height: 480,
            },
            style: {
              position: "fixed",
              left: "0",
              top: "0",
              width: "100vw",
              height: "100vh",
              display: "block",
              backgroundColor: "black",
              imageRendering: "auto",
            },
          '''

          text = text.replace(
              element_marker,
              element_replacement,
              1,
          )

          # ----------------------------------------------------------
          # After prepare(), make sure the actual Nostalgist canvas
          # itself is visible. Use getCanvas(), NOT the old DOM ID.
          # ----------------------------------------------------------

          prepare_end_marker = (
              "\n\nif (opfs !== null) {"
          )

          prepare_start = text.find(
              "const nostalgist = await Nostalgist.prepare({"
          )

          prepare_end = text.find(
              prepare_end_marker,
              prepare_start,
          )

          if (
              prepare_start < 0
              or prepare_end < 0
          ):
              raise SystemExit(
                  "PATCH FAILED: prepare block"
              )

          canvas_fix = r'''

          const slGameCanvas =
            nostalgist.getCanvas();

          slGameCanvas.style.position =
            "fixed";

          slGameCanvas.style.left =
            "0";

          slGameCanvas.style.top =
            "0";

          slGameCanvas.style.width =
            "100vw";

          slGameCanvas.style.height =
            "100vh";

          slGameCanvas.style.display =
            "block";

          slGameCanvas.style.visibility =
            "visible";

          slGameCanvas.style.opacity =
            "1";

          slGameCanvas.style.backgroundColor =
            "#000";

          '''

          text = (
              text[:prepare_end]
              + canvas_fix
              + text[prepare_end:]
          )

          main_path.write_text(
              text,
              encoding="utf-8",
          )

          # ==========================================================
          # Source validation
          # ==========================================================

          final_text = main_path.read_text(
              encoding="utf-8"
          )

          required = [
              'size: {',
              'width: 640',
              'height: 480',
              'nostalgist.getCanvas()',
              'slGameCanvas.style.visibility',
              'const opfs = !HAVE_OPFS',
          ]

          for item in required:
              if item not in final_text:
                  raise SystemExit(
                      "VALIDATION FAILED: "
                      + item
                  )

          if (
              "Multithreaded WebAssembly requires a secure context"
              in final_text
          ):
              raise SystemExit(
                  "VALIDATION FAILED: threaded browser check still present"
              )

          print(
              "SLKNIGHT_PLAY_V6_PATCH_OK"
          )
          PY

      - name: Install frontend packages
        working-directory: engine/nostalgist
        run: |
          set -e
          npm install

      - name: Format patched frontend
        working-directory: engine/nostalgist
        run: |
          set -e
          npx prettier --write src/main.ts index.html

      - name: Type check frontend
        working-directory: engine/nostalgist
        run: |
          set -e
          npm run lint

      - name: Generate asset hashes and sizes
        working-directory: engine/nostalgist
        run: |
          set -e
          node update-env.ts

      - name: Build play version
        working-directory: engine/nostalgist
        run: |
          set -e
          npx vite build --base=./
          touch dist/.nojekyll

      - name: Verify deploy files
        run: |
          set -e

          test -s engine/nostalgist/dist/index.html
          test -s engine/nostalgist/dist/mkxp-z_libretro.js
          test -s engine/nostalgist/dist/mkxp-z_libretro.wasm
          test -s engine/nostalgist/dist/slknight.mkxpz

          echo "SLKNIGHT_PLAY_V6_BUILD_OK"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: engine/nostalgist/dist

  deploy:
    name: Deploy GitHub Pages
    needs:
      - build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
