
name: build-slknight-web.yml | V1.31 | Healer Aggro, Teleport Reset, Holy Walk Buff Icon

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Restore V1.30 deployed game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 43373491899
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify V1.30 original
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build/v131
          tar -xf baseline/artifact.tar -C site
          python3 <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('site')
          before = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in root.rglob('*') if p.is_file()}
          assert len(before) == 5619, len(before)
          assert 'SLKnight V1.30' in (root/'knight/index.html').read_text('utf-8')
          assert "var version='V1.30';" in (root/'knight/js/sl-assets-v229r115.js').read_text('utf-8')
          assert (root/'knight/gameasync/Data/Scripts.rxdata').is_file()
          Path('build/v131/before.json').write_text(json.dumps(before, ensure_ascii=False), 'utf-8')
          print('PASS V1.30 deployed original, 5619 files')
          PY
          cp site/knight/gameasync/Data/Scripts.rxdata build/v131/Scripts.v130.rxdata

      - name: Restore only first healer/player recognition branch
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          # encoding: UTF-8
          require 'zlib'
          path = 'site/knight/gameasync/Data/Scripts.rxdata'
          scripts = Marshal.load(File.binread(path))
          raise 'Unexpected script count' unless scripts.size == 137
          row = scripts.find { |r| r.is_a?(Array) && r[1].to_s.dup.force_encoding('UTF-8') == 'Game_Character 3' }
          raise 'Game_Character 3 not found' unless row
          source = Zlib::Inflate.inflate(row[2]).force_encoding('UTF-8')
          old = "    if self.is_a?(Game_Event) && @sl_combat_event && @trigger == 2\n      target = sl_combat_target\n      return unless target\n    end"
          restored = [
            '    if self.is_a?(Game_Event) && @sl_combat_event && @trigger == 2',
            '      if @sl_target_actor_id.nil?',
            '        healer = $game_map.sl_healer_event',
            '        active = $game_switches[185] && healer && !healer.transparent &&',
            '                 !healer.instance_variable_get(:@sl_healer_teleport) &&',
            '                 $game_actors[3] && $game_actors[3].hp > 0',
            '        pd = (@x - $game_player.x).abs + (@y - $game_player.y).abs',
            '        hd = active ? (@x - healer.x).abs + (@y - healer.y).abs : nil',
            '        @sl_target_actor_id = [hd && hd < pd ? 3 : 1]',
            '      end',
            '      target = sl_combat_target',
            '      return unless target',
            '    end'
          ].join("\n")
          raise "Unexpected V1.30 recognition block #{source.scan(old).size}" unless source.scan(old).size == 1
          updated = source.sub(old, restored)
          RubyVM::InstructionSequence.compile(updated)
          row[2] = Zlib::Deflate.deflate(updated.b)
          File.binwrite(path, Marshal.dump(scripts))
          File.binwrite('build/v131/Game_Character 3.rb', updated)
          puts 'PASS only first recognition restored; teleport and target branches unchanged'
          RUBY

      - name: Update cache hash and V1.31 version
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import hashlib, re
          root = Path('site')
          script = root/'knight/gameasync/Data/Scripts.rxdata'
          mapping = root/'knight/gameasync/mapping.js'
          data = mapping.read_text('utf-8')
          pattern = re.compile(r'Data/Scripts\.rxdata\?h=[0-9a-f]{32}')
          assert len(pattern.findall(data)) == 1
          mapping.write_text(pattern.sub('Data/Scripts.rxdata?h='+hashlib.md5(script.read_bytes()).hexdigest(), data), 'utf-8')
          for name in ['index.html', 'knight/index.html']:
              p = root/name
              text = p.read_text('utf-8')
              assert 'V1.30' in text, name
              p.write_text(text.replace('V1.30', 'V1.31').replace('v1.30', 'v1.31'), 'utf-8')
          p = root/'knight/js/sl-assets-v229r115.js'
          text = p.read_text('utf-8')
          assert text.count("var version='V1.30';") == 1
          p.write_text(text.replace("var version='V1.30';", "var version='V1.31';"), 'utf-8')
          PY
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Verify first target, teleport and untouched scripts
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          # encoding: UTF-8
          require 'zlib'
          old = Marshal.load(File.binread('build/v131/Scripts.v130.rxdata'))
          new = Marshal.load(File.binread('site/knight/gameasync/Data/Scripts.rxdata'))
          raise 'Script count differs' unless old.size == 137 && new.size == 137
          changed = old.zip(new).filter_map { |a,b| a == b ? nil : a[1].to_s.dup.force_encoding('UTF-8') }
          raise "Unexpected scripts: #{changed.inspect}" unless changed == ['Game_Character 3']
          raw = Zlib::Inflate.inflate(new.find { |r| r[1].to_s.dup.force_encoding('UTF-8') == 'Game_Character 3' }[2]).force_encoding('UTF-8')
          raise 'Restoration missing' unless raw.include?('@sl_target_actor_id = [hd && hd < pd ? 3 : 1]')
          raise 'Duplicate first recognition' unless raw.scan('if @sl_target_actor_id.nil?').size == 1
          RubyVM::InstructionSequence.compile(raw)
          puts 'PASS only Game_Character 3 changed, 136 scripts intact'
          RUBY
          ruby <<'RUBY_TEST'
          class Game_Character
            attr_accessor :x, :y, :transparent, :direction
            def initialize; @x=0; @y=0; @transparent=false; @direction=2; end
            def moving?; false; end
          end
          class Interpreter; end
          load 'build/v131/Game_Character 3.rb'
          load 'build/v131/Game_Event.rb' if File.file?('build/v131/Game_Event.rb')
          # Extract unmodified Game_Event directly from the current scripts.
          unless defined?(Game_Event)
            require 'zlib'
            scripts = Marshal.load(File.binread('site/knight/gameasync/Data/Scripts.rxdata'))
            row = scripts.find { |r| r[1].to_s.dup.force_encoding('UTF-8') == 'Game_Event' }
            eval(Zlib::Inflate.inflate(row[2]).force_encoding('UTF-8'), TOPLEVEL_BINDING)
          end
          class Game_Character
            def move_up(*); end
            def move_down(*); end
            def move_left(*); end
            def move_right(*); end
          end
          Actor = Struct.new(:hp)
          MapStub = Struct.new(:sl_healer_event, :events)
          $game_map = MapStub.new(nil,{})
          $game_player = Game_Character.new
          $game_player.x=2; $game_player.y=2
          $game_switches = Hash.new(false); $game_switches[185]=true
          $game_actors = {3 => Actor.new(100)}
          healer = Game_Event.allocate
          healer.x=20; healer.y=19; healer.transparent=false
          $game_map.sl_healer_event = healer
          mob = Game_Event.allocate
          mob.x=21; mob.y=20
          mob.instance_variable_set(:@sl_combat_event,true)
          mob.instance_variable_set(:@trigger,2)
          $game_map.events = {1 => mob, 2 => healer}
          def check(ok, label); raise "FAIL #{label}" unless ok; puts "PASS #{label}"; end
          mob.move_toward_player
          ref = mob.instance_variable_get(:@sl_target_actor_id)
          check(ref == [3], 'first recognition: healer')
          $game_player.x=21; $game_player.y=21
          mob.move_toward_player
          check(mob.instance_variable_get(:@sl_target_actor_id).equal?(ref), 'no reassignment to closer knight')
          healer.instance_variable_set(:@sl_healer_teleport,[2,2,100])
          mob.move_toward_player
          check(mob.sl_combat_target.nil? && mob.instance_variable_get(:@sl_target_actor_id).equal?(ref), 'teleport: healer not targetable, target not replaced')
          healer.instance_variable_set(:@sl_healer_teleport,nil)
          check(mob.sl_combat_target.equal?(healer), 'teleport end: same healer target')
          mob2 = Game_Event.allocate
          mob2.x=21; mob2.y=21
          mob2.instance_variable_set(:@sl_combat_event,true)
          mob2.instance_variable_set(:@trigger,2)
          $game_player.x=21; $game_player.y=20
          mob2.move_toward_player
          check(mob2.instance_variable_get(:@sl_target_actor_id)==[1], 'first recognition: knight')
          healer.x=21; healer.y=22
          mob2.move_toward_player
          check(mob2.instance_variable_get(:@sl_target_actor_id)==[1], 'knight target not replaced by healer')
          RUBY_TEST
          python3 <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('site')
          before = json.loads(Path('build/v131/before.json').read_text('utf-8'))
          after = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                   for p in root.rglob('*') if p.is_file()}
          changed = {k for k in before if before[k] != after.get(k)}
          expected = {'knight/gameasync/Data/Scripts.rxdata', 'knight/gameasync/mapping.js',
                      'knight/js/sl-assets-v229r115.js', 'knight/index.html', 'index.html'}
          assert len(after) == 5619 and set(after) == set(before)
          assert changed == expected, sorted(changed ^ expected)
          print('PASS 5619 original files, only Scripts, mapping and three version files changed')
          PY

      - name: Publish V1.31 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
