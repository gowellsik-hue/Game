
name: build-slknight-web.yml | V3.4 | Wizard and Fairy Native Speed 1x

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Restore the exact successful V3.3 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45113630421
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Patch only existing native movement speed and verify all files
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site
          tar -xf baseline/artifact.tar -C site
          test -s site/knight/gameasync/Data/Scripts.rxdata
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          assert len(before)==6013,('Original V3.3 artifact file count mismatch',len(before))
          Path('before.json').write_text(json.dumps(before,sort_keys=True),'utf8')
          PY
          cat > /tmp/slknight-v34.rb <<'RUBY'
          require 'zlib'
          require 'digest'

          data='site/knight/gameasync/Data/Scripts.rxdata'
          rows=Marshal.load(File.binread(data))
          raise 'V3.3 Scripts count changed' unless rows.size==137
          target=rows.select{|r|r.is_a?(Array)&&r[1].to_s.dup.force_encoding('UTF-8')=='Game_Character 2'}
          raise 'Original movement script not unique' unless target.size==1
          row=target.first
          raw=Zlib::Inflate.inflate(row[2])
          src=raw.dup.force_encoding('UTF-8')
          raise 'Invalid script encoding' unless src.valid_encoding?
          crlf=src.include?("\r\n")
          src=src.gsub("\r\n","\n")
          old="    @sl_move_rate = SLV229::Speed.move_rate if self.is_a?(Game_Event) && @event && (@event.name == '[ID힐러 마법사]' || @event.name.to_s.start_with?('동료 '))"
          newer="    @sl_move_rate = 1.0 if self.is_a?(Game_Event) && @event && (@event.name == '[ID힐러 마법사]' || @event.name.to_s.start_with?('동료 '))"
          raise 'Original speed expression missing or duplicated' unless src.scan(old).size==1
          updated=src.sub(old,newer)
          RubyVM::InstructionSequence.compile(updated)
          row[2]=Zlib::Deflate.deflate(crlf ? updated.gsub("\n","\r\n").b : updated.b)
          File.binwrite(data,Marshal.dump(rows))
          raise 'Script patch failed to persist' unless Zlib::Inflate.inflate(
            Marshal.load(File.binread(data)).find{|r|r[1]==row[1]}[2]).include?('@sl_move_rate = 1.0')

          mapper='site/knight/gameasync/mapping.js'
          js=File.binread(mapper).force_encoding('UTF-8')
          raise 'Invalid resource map' unless js.valid_encoding?
          pattern=/Data\/Scripts\.rxdata\?h=[0-9a-f]{32}/
          raise 'Original script resource reference missing or duplicated' unless js.scan(pattern).size==1
          js=js.sub(pattern,'Data/Scripts.rxdata?h='+Digest::MD5.file(data).hexdigest)
          File.binwrite(mapper,js)
          RUBY
          ruby -c /tmp/slknight-v34.rb
          ruby /tmp/slknight-v34.rb

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          loader=root/'knight/js/sl-assets-v229r115.js'
          src=loader.read_text('utf8')
          assert src.count("var version='V3.3';")==1
          loader.write_text(src.replace("var version='V3.3';","var version='V3.4';"),'utf8')
          for name in ('index.html','knight/index.html'):
              p=root/name
              src=p.read_text('utf8')
              assert 'V3.3' in src,('Missing current version',name)
              p.write_text(src.replace('V3.3','V3.4').replace('v3.3','v3.4'),'utf8')
          before=json.loads(Path('before.json').read_text('utf8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          changed={p for p in before.keys()&after.keys() if before[p]!=after[p]}
          expected={'knight/gameasync/Data/Scripts.rxdata',
                    'knight/gameasync/mapping.js',
                    'knight/js/sl-assets-v229r115.js',
                    'index.html','knight/index.html'}
          assert changed==expected,('Unapproved changed files',sorted(changed^expected))
          assert before.keys()==after.keys(),'Unexpected added or deleted game files'
          print('PASS V3.4 exact V3.3 game and one native movement-rate edit')
          print('PASS no item, transform, attack, monster, map or engine data changed')
          PY
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Upload V3.4 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
