name: build-slknight-web.yml | V3.14 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Restore exact successful V3.11 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45364903497
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Restore original SPR audit
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45347986505
          name: audit-sanctuary-monsters-v46-all-spr-audit
          github-token: ${{ github.token }}
          path: audit

      - name: Restore verified V3.13 source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: 9b584b5ab994e1d48c8f50b376e063f783e71d22
          path: verified-v313

      - name: Restore verified original SPR decoder
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: e2dfa04c9aecac1431aaf48637a138bb5b6c9a62
          path: verified-v37

      - name: Prepare corrected existing V3.13 processing
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          from itertools import combinations
          import textwrap
          import re

          workflow=Path(
              'verified-v313/.github/workflows/build-slknight-web.yml'
          ).read_text('utf8')

          def run_block(name):

              marker='      - name: '+name+'\n'

              assert workflow.count(marker)==1,name

              section=workflow.split(
                  marker,1
              )[1].split(
                  '\n      - name: ',1
              )[0]

              marker='        run: |\n'

              assert section.count(marker)==1,name

              return textwrap.dedent(
                  section.split(marker,1)[1]
              ).rstrip()+'\n'

          def once(source,old,new,label):

              count=source.count(old)

              assert count==1,(
                  label,
                  'Expected one original match',
                  count
              )

              return source.replace(old,new,1)

          def rename(source):

              return source.replace(
                  'SL8_여법사','SL13_여법사'
              ).replace(
                  'SL8_여다엘','SL13_여다엘'
              )

          def save(name,source):

              Path('/tmp/'+name).write_text(
                  source,
                  'utf8'
              )

          verify=run_block(
              'Verify baseline and all eight character sources'
          )

          assert 'len(before)==6013' in verify
          assert "var version='V3.11';" in verify

          verify=rename(verify)

          save(
              'slv314_verify.sh',
              verify
          )

          save(
              'slv314_restore.sh',
              run_block('Restore original SPR archive')
          )

          save(
              'slv314_decoder.sh',
              run_block('Restore existing coordinate decoder')
          )

          graphics=run_block(
              'Composite all eight original character sheets'
          )

          marker="cat > /tmp/slv313_graphics.py <<'PY'\n"

          assert graphics.count(marker)==1

          source=graphics.split(
              marker,1
          )[1].split(
              '\nPY\n',1
          )[0]

          compile(source,'original-v313','exec')

          start_marker='prepared={}\n'
          end_marker='ground=max(\n'

          assert source.count(start_marker)==1
          assert source.count(end_marker)==1

          start=source.index(start_marker)
          end=source.index(end_marker,start)

          original=source[start:end]

          assert 'if y<y0+12' in original
          assert 'ay=y1+1' in original
          assert 'relative_shadow' in original

          replacement=textwrap.dedent('''
          from statistics import median
          from math import floor

          prepared={}
          relative_points=[]

          source_steps={
              5:(0,6),
              7:(-12,0),
              3:(12,0),
              1:(0,-6)
          }

          measured_anchors={
              '남기사':{
                  5:(25,19),7:(25,15),
                  3:(25,15),1:(25,16)
              },
              '여기사':{
                  5:(30,23),7:(31,20),
                  3:(29,20),1:(30,22)
              },
              '남요정':{
                  5:(24,18),7:(24,16),
                  3:(24,16),1:(24,17)
              },
              '여요정':{
                  5:(24,18),7:(24,15),
                  3:(24,15),1:(24,17)
              },
              '남법사':{
                  5:(30,22),7:(32,19),
                  3:(28,20),1:(30,22)
              },
              '여법사':{
                  5:(23,17),7:(26,15),
                  3:(21,15),1:(25,18)
              },
              '남다엘':{
                  5:(25,18),7:(26,16),
                  3:(23,15),1:(24,18)
              },
              '여다엘':{
                  5:(24,15),7:(28,12),
                  3:(22,13),1:(26,16)
              }
          }

          assert len(specs)==8
          assert len(measured_anchors)==8

          selected_layers=0

          for name,graphic,body_id,shadow_id,source_n in specs:

              frames=[]

              assert not graphic.startswith('SL8_')

              assert source_n>=4
              assert source_n%4==0

              for sub in (5,7,3,1):

                  bodies=decoded[body_id,sub]
                  shadows=decoded[shadow_id,sub]

                  assert len(bodies)==len(shadows)==source_n

                  step_x,step_y=source_steps[sub]

                  indices=[
                      col*source_n//4
                      for col in range(4)
                  ]

                  assert len(set(indices))==4

                  samples=[]

                  for col,index in enumerate(indices):

                      body=bodies[index]

                      support=[
                          y
                          for x,y in body
                          if (x+1,y) in body
                      ]

                      assert support,(name,sub,index)

                      foot_y=max(support)+1

                      feet=[
                          x
                          for x,y in body
                          if foot_y-8<=y<foot_y
                      ]

                      assert feet,(name,sub,index)

                      foot_x=(
                          min(feet)+max(feet)+1
                      )//2

                      samples.append((
                          foot_x-step_x*col,
                          foot_y-step_y*col
                      ))

                  base_x=floor(
                      median([x for x,y in samples])+0.5
                  )

                  base_y=floor(
                      median([y for x,y in samples])+0.5
                  )

                  assert (
                      base_x,base_y
                  )==measured_anchors[name][sub],(
                      name,
                      sub,
                      (base_x,base_y),
                      measured_anchors[name][sub]
                  )

                  for col,index in enumerate(indices):

                      body=bodies[index]
                      shadow=shadows[index]

                      ax=base_x+step_x*col
                      ay=base_y+step_y*col

                      relative_body={
                          (x-ax,y-ay):rgba
                          for (x,y),rgba in body.items()
                      }

                      relative_shadow={
                          (x-ax,y-ay):rgba
                          for (x,y),rgba in shadow.items()
                      }

                      assert len(relative_body)==len(body)
                      assert len(relative_shadow)==len(shadow)

                      assert {
                          (x+ax,y+ay):rgba
                          for (x,y),rgba in relative_body.items()
                      }==body

                      assert {
                          (x+ax,y+ay):rgba
                          for (x,y),rgba in relative_shadow.items()
                      }==shadow

                      relative_points.extend(relative_body)
                      relative_points.extend(relative_shadow)

                      frames.append((
                          sub,
                          col,
                          relative_body,
                          relative_shadow
                      ))

                      selected_layers+=2

                      print(
                          'FRAME',
                          name,
                          'direction',sub,
                          'output',col,
                          'source',index,
                          'fixed anchor',base_x,base_y,
                          'motion correction',
                          step_x*col,step_y*col
                      )

              assert len(frames)==16

              prepared[graphic]=frames

          assert len(prepared)==8

          assert sum(
              len(frames)
              for frames in prepared.values()
          )==128

          assert selected_layers==256

          ''').lstrip('\n')

          source=(
              source[:start]
              +replacement
              +source[end:]
          )

          source=once(
              source,
              (
                  'for name,graphic,body_id,shadow_id,n in specs:\n'
                  '\n'
                  '    frames=prepared[graphic]'
              ),
              (
                  'for name,graphic,body_id,shadow_id,source_n in specs:\n'
                  '\n'
                  '    n=4\n'
                  '    frames=prepared[graphic]'
              ),
              'Original sheet generation'
          )

          source=once(
              source,
              "        'height':ch*4\n",
              "        'height':ch*4,\n"
              "        'ground':ground\n",
              'Original graphics manifest'
          )

          source=once(
              source,
              'assert total==160,total',
              'assert total==128,total',
              'Output frame count'
          )

          source=once(
              source,
              "print('PASS 160 merged original walking frames')",
              "print('PASS 128 merged walking frames')",
              'Output frame verification'
          )

          source=once(
              source,
              "print('PASS all 320 source layers retained')",
              "print('PASS 256 selected original source layers retained')",
              'Selected source layer verification'
          )

          compile(
              source,
              'corrected-v314-graphics',
              'exec'
          )

          save(
              'slv314_graphics.py',
              source+'\n'
          )

          companions=rename(
              run_block(
                  'Reuse existing companions and chasing branches'
              )
          )

          old_check=textwrap.dedent('''
            check(
              s.include?('SL8_'),
              'Original eight-frame sprite path missing'
            )

          ''').lstrip('\n')

          companions=once(
              companions,
              textwrap.indent(old_check,'  '),
              '',
              'Remove expanded frame requirement'
          )

          slots=[
              [4,0],
              [2,2],
              [2,-2],
              [0,4],
              [0,-4],
              [-2,2],
              [-2,-2],
              [-4,0]
          ]

          for dx,dy in (
              (0,-1),
              (1,0),
              (-1,0),
              (0,1)
          ):

              positions=[
                  (
                      dx*n-dy*lateral,
                      dy*n+dx*lateral
                  )
                  for n,lateral in slots
              ]

              assert len(set(positions))==8

              assert all(
                  abs(x)+abs(y)==4
                  for x,y in positions
              )

              assert all(
                  max(abs(a-c),abs(b-d))>1
                  for (a,b),(c,d)
                  in combinations(positions,2)
              )

              reserved=[]

              for _ in range(7):

                  pos=next(
                      p for p in positions
                      if all(
                          max(
                              abs(p[0]-q[0]),
                              abs(p[1]-q[1])
                          )>1
                          for q in reserved
                      )
                  )

                  reserved.append(pos)

              assert len(reserved)==7

          fallback=[
              [3,0],
              [5,0],
              [2,3],
              [2,-3],
              [3,2],
              [3,-2],
              [-3,2],
              [-3,-2],
              [-2,3],
              [-2,-3],
              [0,3],
              [0,-3],
              [0,5],
              [0,-5],
              [-3,0],
              [-5,0]
          ]

          candidates=slots+fallback

          assert len({
              tuple(p)
              for p in candidates
          })==len(candidates)

          assert all(
              3<=abs(n)+abs(lateral)<=5
              for n,lateral in candidates
          )

          candidate_text=str(
              candidates
          ).replace(' ','')

          chase_patch=textwrap.dedent('''
            old_overlap="if d <= 1 || outside || (@event.name.to_s.start_with?('동료 ') && $game_map.events.values.any? { |e| e != self && e.character_name != '' && e.x == @x && e.y == @y && e.instance_variable_get(:@event) && (e.instance_variable_get(:@event).name == '[ID힐러 마법사]' || e.instance_variable_get(:@event).name.to_s.start_with?('동료 ')) })"

            new_overlap="if d <= 1 || outside || $game_map.events.values.any? { |e| e != self && e.character_name != '' && e.instance_variable_get(:@event) && (e.instance_variable_get(:@event).name == '[ID힐러 마법사]' || e.instance_variable_get(:@event).name.to_s.start_with?('동료 ')) && e.instance_variable_get(:@id) < @id && (e.x-@x).abs <= 1 && (e.y-@y).abs <= 1 }"

            updated=rep(
              updated,
              old_overlap,
              new_overlap,
              'All seven companions use existing overlap branch'
            )

            updated=rep(
              updated,
              '[4, 3, 5].each do |n|',
              '__CANDIDATES__.each do |n,lateral|',
              'Existing destination candidate list'
            )

            updated=rep(
              updated,
              'tx = $game_player.x + dx * n',
              'tx = $game_player.x + dx * n - dy * lateral',
              'Existing horizontal destination'
            )

            updated=rep(
              updated,
              'ty = $game_player.y + dy * n',
              'ty = $game_player.y + dy * n + dx * lateral',
              'Existing vertical destination'
            )

            old_occupied="e != self && e.character_name != '' && ((e.x == tx && e.y == ty) || (e.instance_variable_get(:@sl_healer_teleport) && e.instance_variable_get(:@sl_healer_teleport)[0,2] == [tx,ty]))"

            new_occupied="e != self && e.character_name != '' && ((e.instance_variable_get(:@event) && (e.instance_variable_get(:@event).name == '[ID힐러 마법사]' || e.instance_variable_get(:@event).name.to_s.start_with?('동료 '))) ? (((e.x-tx).abs <= 1 && (e.y-ty).abs <= 1) || (e.instance_variable_get(:@sl_healer_teleport) && (e.instance_variable_get(:@sl_healer_teleport)[0]-tx).abs <= 1 && (e.instance_variable_get(:@sl_healer_teleport)[1]-ty).abs <= 1)) : ((e.x == tx && e.y == ty) || (e.instance_variable_get(:@sl_healer_teleport) && e.instance_variable_get(:@sl_healer_teleport)[0,2] == [tx,ty])))"

            updated=rep(
              updated,
              old_occupied,
              new_occupied,
              'Existing destination occupancy and reservation'
            )

            check(
              updated.scan('@sl_healer_teleport = [tx, ty, Graphics.frame_count]').size==1,
              'Original teleport assignment changed'
            )

            check(
              updated.include?('return if d <= 5'),
              'Original stopping distance changed'
            )

            check(
              updated.include?('if d <= 2'),
              'Original separation movement changed'
            )

          ''').lstrip('\n').replace(
              '__CANDIDATES__',
              candidate_text
          )

          old=(
              "  updated=method.gsub(old,new)\n"
              "\n"
              "  rep(s,method,updated,'Existing chase and overlap conditions')"
          )

          new=(
              "  updated=method.gsub(old,new)\n\n"
              +textwrap.indent(chase_patch,'  ')
              +"\n"
              +"  rep(s,method,updated,'Existing chase and overlap conditions')"
          )

          companions=once(
              companions,
              old,
              new,
              'Extend original follower branch'
          )

          passable_patch=textwrap.dedent('''
          edit_script(rows,'Game_Character 1') do |s|

            headers=s.to_enum(:scan,/^[ \\t]*def passable\\?\\s*\\(\\s*x\\s*,\\s*y\\s*,\\s*d\\s*\\)[ \\t]*$/).map {
              Regexp.last_match
            }

            check(
              headers.size==1,
              'Original normal passable method is not unique'
            )

            first=headers.first.begin(0)

            last=s.index(
              /^  def /,
              headers.first.end(0)
            )

            check(
              !last.nil?,
              'Original normal passable method boundary missing'
            )

            original=s[first...last]

            check(
              original.match?(/\\bnew_x\\s*=/) &&
              original.match?(/\\bnew_y\\s*=/),
              'Original destination coordinates missing'
            )

            through_lines=original.lines.select do |line|
              line.match?(/\\A[ \\t]*(?:if|return true if)[ \\t]+@through(?:[ \\t]*==[ \\t]*true)?[ \\t]*(?:\\#.*)?\\n?\\z/)
            end

            check(
              through_lines.size==1,
              'Original through condition is not unique'
            )

            anchor=through_lines.first

            indent=anchor[/\\A[ \\t]*/]

            guard="return false if self.is_a?(Game_Event) && @event && (@event.name == '[ID힐러 마법사]' || @event.name.to_s.start_with?('동료 ')) && $game_map.events.values.any? { |e| e != self && e.character_name != '' && e.instance_variable_get(:@event) && (e.instance_variable_get(:@event).name == '[ID힐러 마법사]' || e.instance_variable_get(:@event).name.to_s.start_with?('동료 ')) && (((e.x-new_x).abs <= 1 && (e.y-new_y).abs <= 1 && [(e.x-new_x).abs,(e.y-new_y).abs].max <= [(e.x-x).abs,(e.y-y).abs].max) || (e.instance_variable_get(:@sl_healer_teleport) && (e.instance_variable_get(:@sl_healer_teleport)[0]-new_x).abs <= 1 && (e.instance_variable_get(:@sl_healer_teleport)[1]-new_y).abs <= 1)) }"

            updated=rep(
              original,
              anchor,
              indent+guard+"\\n"+anchor,
              'Existing ordinary movement collision gate'
            )

            check(
              updated.sub(indent+guard+"\\n",'')==original,
              'Unapproved passability changes'
            )

            rep(
              s,
              original,
              updated,
              'Existing ordinary movement method'
            )
          end

          ''').lstrip('\n')

          companions=once(
              companions,
              "edit_script(rows,'Game_Party') do |s|",
              passable_patch+"\n"
              +"edit_script(rows,'Game_Party') do |s|",
              'Existing walking occupancy'
          )

          old='  new="        self.oy = @ch\\n"'

          new=textwrap.dedent('''
            manifest=JSON.parse(
              File.read('/tmp/slv313-graphics.json')
            )

            check(
              manifest.size==8,
              'Character manifest count'
            )

            grounds=manifest.map {
              |r| Integer(r.fetch('ground'))
            }.uniq

            check(
              grounds.size==1,
              'Common ground offset'
            )

            names=manifest.map {
              |r| r.fetch('graphic')
            }

            ground=grounds.first

            new="        self.oy = @ch + (#{names.inspect}.include?(@character_name) ? #{17-ground} : 0)\\n"
          ''').lstrip('\n')

          companions=once(
              companions,
              old,
              textwrap.indent(new.rstrip('\n'),'  '),
              'Original sprite vertical origin'
          )

          companions=once(
              companions,
              (
                  "expected=[\n"
                  "  'Game_Character 3',\n"
              ),
              (
                  "expected=[\n"
                  "  'Game_Character 1',\n"
                  "  'Game_Character 3',\n"
              ),
              'Approved script changes'
          )

          companions=once(
              companions,
              "puts 'PASS original eight-frame rendering path retained'",
              "puts 'PASS original four-frame rendering path retained'",
              'Rendering verification'
          )

          companions=once(
              companions,
              "puts 'PASS only three original scripts changed'",
              "puts 'PASS only four original scripts changed'",
              'Script change verification'
          )

          save(
              'slv314_companions.sh',
              companions
          )

          finalize=run_block(
              'Update resource mapping and verify changed files'
          )

          finalize=finalize.replace(
              'V3.13','V3.14'
          ).replace(
              'v3.13','v3.14'
          )

          finalize=once(
              finalize,
              "print('PASS six four-frame characters')",
              "print('PASS eight four-frame characters')",
              'Character frame verification'
          )

          finalize=once(
              finalize,
              "print('PASS two eight-frame characters')",
              "print('PASS 128 walking frames')",
              'Total output frame verification'
          )

          save(
              'slv314_finalize.sh',
              finalize
          )

          print('PASS verified original source restored')
          print('PASS existing follower destination candidates corrected')
          print('PASS seven separate positions in every direction')
          print('PASS original fixed-direction anchors loaded')
          print('PASS four-frame output prepared for eight characters')
          PY

          bash -n /tmp/slv314_verify.sh
          bash -n /tmp/slv314_restore.sh
          bash -n /tmp/slv314_decoder.sh
          bash -n /tmp/slv314_companions.sh
          bash -n /tmp/slv314_finalize.sh

          python3 -m py_compile /tmp/slv314_graphics.py

      - name: Verify original V3.11 baseline and SPR records
        shell: bash
        run: |
          set -euo pipefail

          bash /tmp/slv314_verify.sh

      - name: Restore original SPR files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          bash /tmp/slv314_restore.sh
          bash /tmp/slv314_decoder.sh

      - name: Generate eight four-frame character sheets
        shell: bash
        run: |
          set -euo pipefail

          /tmp/slv313-venv/bin/python \
            -m py_compile /tmp/slv314_graphics.py

          /tmp/slv313-venv/bin/python \
            /tmp/slv314_graphics.py

          /tmp/slv313-venv/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json

          manifest=json.loads(
              Path('/tmp/slv313-graphics.json').read_text('utf8')
          )

          root=Path('site/knight/gameasync')

          expected={
              'knight_men',
              'SL13_여기사',
              'SL13_남요정',
              '여요정',
              '법사',
              'SL13_여법사',
              'SL13_남다엘',
              'SL13_여다엘'
          }

          assert len(manifest)==8

          assert {
              r['graphic']
              for r in manifest
          }==expected

          assert all(
              r['frames']==4
              for r in manifest
          )

          assert all(
              not r['graphic'].startswith('SL8_')
              for r in manifest
          )

          assert len({
              r['ground']
              for r in manifest
          })==1

          total=0

          for row in manifest:

              path=root/row['relative']

              with Image.open(path) as image:

                  sheet=image.convert('RGBA')

              assert sheet.width==row['width']
              assert sheet.height==row['height']

              assert sheet.width%4==0
              assert sheet.height%4==0

              cw=sheet.width//4
              ch=sheet.height//4

              for direction in range(4):

                  for frame in range(4):

                      cell=sheet.crop((
                          frame*cw,
                          direction*ch,
                          (frame+1)*cw,
                          (direction+1)*ch
                      ))

                      assert cell.getchannel('A').getbbox(),(
                          row['graphic'],
                          direction,
                          frame
                      )

                      total+=1

              print(
                  'VERIFIED',
                  row['graphic'],
                  '4 directions',
                  '4 frames',
                  'cell',cw,ch,
                  'scale',1.0,
                  'ground',row['ground']
              )

          assert total==128

          print('PASS eight character sheets')
          print('PASS 128 nonempty walking frames')
          print('PASS common ground position')
          print('PASS original body and shadow pixels')
          PY

      - name: Reuse existing companions and correct movement conditions
        shell: bash
        run: |
          set -euo pipefail

          bash /tmp/slv314_companions.sh

      - name: Verify all companion references
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/slv314_verify_game.rb <<'RUBY'
          require 'zlib'
          require 'json'

          module RPG
            %w[Actor Item AudioFile CommonEvent EventCommand Event MoveRoute MoveCommand Map].each do |n|
              const_set(n,Class.new) unless const_defined?(n,false)
            end

            Event.const_set(:Page,Class.new) unless Event.const_defined?(:Page,false)

            Event::Page.const_set(:Condition,Class.new) unless Event::Page.const_defined?(:Condition,false)

            Event::Page.const_set(:Graphic,Class.new) unless Event::Page.const_defined?(:Graphic,false)
          end

          %w[Table Tone Color].each do |name|

            Object.const_set(name,Class.new) unless Object.const_defined?(name)

            Object.const_get(name).define_singleton_method(:_load) do |raw|

              obj=allocate

              obj.instance_variable_set(:@raw,raw)

              obj
            end

            Object.const_get(name).class_eval do

              def _dump(_depth)
                @raw
              end
            end
          end

          def check(ok,label)

            raise "FAIL #{label}" unless ok

            puts "PASS #{label}"
          end

          def utf(value)

            value.to_s.dup.force_encoding('UTF-8')
          end

          root='site/knight/gameasync'

          graphics=[
            '여요정',
            'SL13_여기사',
            'SL13_남요정',
            'SL13_여법사',
            'SL13_남다엘',
            'SL13_여다엘'
          ]

          names=[
            '여요정',
            '여기사',
            '남요정',
            '여법사',
            '남다엘',
            '여다엘'
          ]

          actor_files=Dir.glob(
            root+'/Data/*Actors.rxdata'
          ).select{|p|File.size(p)>10}

          check(
            actor_files.size==1,
            'Actor data is unique'
          )

          actors=Marshal.load(
            File.binread(actor_files.first)
          )

          check(
            actors.size==10,
            'Original actor count retained'
          )

          check(
            utf(actors[3].instance_variable_get(:@character_name))=='법사',
            'Existing male wizard retained'
          )

          names.each_with_index do |name,i|

            actor=actors[4+i]

            check(
              utf(actor.instance_variable_get(:@name))==name,
              "Actor #{4+i} name"
            )

            check(
              utf(actor.instance_variable_get(:@character_name))==graphics[i],
              "Actor #{4+i} four-frame graphic"
            )
          end

          maps=Dir.glob(
            root+'/Data/*Map???.rxdata'
          ).select{|p|File.size(p)>10}.sort

          check(
            maps.size==46,
            'All 46 original maps'
          )

          total=0

          maps.each do |path|

            map=Marshal.load(
              File.binread(path)
            )

            events=map.instance_variable_get(:@events)

            companions=events.values.select do |event|

              utf(
                event.instance_variable_get(:@name)
              ).start_with?('동료 ')
            end

            check(
              companions.size==6,
              "#{File.basename(path)} companion count"
            )

            names.each_with_index do |name,i|

              matches=companions.select do |event|

                utf(
                  event.instance_variable_get(:@name)
                )=='동료 '+name
              end

              raise "#{path}: #{name} not unique" unless matches.size==1

              event=matches.first

              pages=event.instance_variable_get(:@pages)

              raise "#{path}: #{name} page count" unless pages.size==1

              page=pages.first

              condition=page.instance_variable_get(:@condition)

              raise "#{path}: #{name} switch" unless
                condition.instance_variable_get(:@switch1_valid) &&
                condition.instance_variable_get(:@switch1_id)==2001+i

              graphic=page.instance_variable_get(:@graphic)

              actual=utf(
                graphic.instance_variable_get(:@character_name)
              )

              raise "#{path}: #{name} graphic mismatch" unless
                actual==graphics[i]

              route=page.instance_variable_get(:@move_route)

              commands=route.instance_variable_get(:@list)

              codes=commands.map{
                |command| command.instance_variable_get(:@code)
              }

              raise "#{path}: #{name} chase route differs" unless codes==[10,0]

              total+=1
            end
          end

          check(
            total==276,
            'All 276 existing companion event references'
          )

          rows=Marshal.load(
            File.binread(
              root+'/Data/Scripts.rxdata'
            )
          )

          check(
            rows.size==137,
            'Original script count retained'
          )

          sources={}

          rows.each do |row|

            next unless row.is_a?(Array)
            next unless row[2].is_a?(String)

            sources[utf(row[1])]=Zlib::Inflate.inflate(
              row[2]
            ).force_encoding('UTF-8')
          end

          source=sources.fetch('Game_Character 3')

          first=source.index(
            '  def move_toward_player'
          )

          last=source.index(
            '  def move_away_from_player',
            first
          )

          check(
            first && last,
            'Original chase method boundaries'
          )

          method=source[first...last]

          check(
            method.include?(
              'e.instance_variable_get(:@id) < @id'
            ),
            'Deterministic companion separation'
          )

          check(
            method.include?(
              'tx = $game_player.x + dx * n - dy * lateral'
            ),
            'Separated horizontal destinations'
          )

          check(
            method.include?(
              'ty = $game_player.y + dy * n + dx * lateral'
            ),
            'Separated vertical destinations'
          )

          check(
            method.include?(
              'return if d <= 5'
            ),
            'Original stopping distance'
          )

          check(
            method.scan(
              '@sl_healer_teleport = [tx, ty, Graphics.frame_count]'
            ).size==1,
            'Original teleport path remains unique'
          )

          normal=sources.fetch('Game_Character 1')

          check(
            normal.scan(
              '[(e.x-new_x).abs,(e.y-new_y).abs].max'
            ).size==1,
            'Ordinary walking separation connected'
          )

          sprite=sources.fetch('Sprite_Character')

          check(
            sprite.include?(
              '@character.moveto(effect[0],effect[1])'
            ),
            'Original teleport completion retained'
          )

          check(
            sprite.include?(
              'self.ox = @cw / 2'
            ),
            'Original horizontal sprite origin'
          )

          sources.each do |name,body|

            next unless [
              'Game_Character 1',
              'Game_Character 3',
              'Game_Party',
              'Sprite_Character'
            ].include?(name)

            RubyVM::InstructionSequence.compile(body)

            puts "PASS compiled #{name}"
          end

          puts 'PASS all eight character references verified'
          puts 'PASS existing companion movement route retained'
          RUBY

          ruby -c /tmp/slv314_verify_game.rb
          ruby /tmp/slv314_verify_game.rb

      - name: Update checksums and verify approved changes
        shell: bash
        run: |
          set -euo pipefail

          bash /tmp/slv314_finalize.sh

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re

          root=Path('site')
          game=root/'knight/gameasync'

          manifest=json.loads(
              Path('/tmp/slv313-graphics.json').read_text('utf8')
          )

          mapping=(game/'mapping.js').read_text('utf8')

          assert len(manifest)==8

          assert sum(
              row['frames']*4
              for row in manifest
          )==128

          for row in manifest:

              graphic=row['graphic']
              relative=row['relative']

              assert row['frames']==4

              assert not graphic.startswith('SL8_')

              path=game/relative

              digest=hashlib.md5(
                  path.read_bytes()
              ).hexdigest()

              pattern=(
                  r'\["graphics/characters/'
                  +re.escape(graphic.lower())
                  +r'",\s*"'
                  +re.escape(relative)
                  +r'\?h='
                  +digest
                  +r'"\]'
              )

              assert len(
                  re.findall(pattern,mapping)
              )==1,graphic

          before=json.loads(
              Path('/tmp/slv313-before.json').read_text('utf8')
          )

          after={
              str(p.relative_to(root)):hashlib.sha256(
                  p.read_bytes()
              ).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          assert len(before)==6013
          assert len(after)==6018

          assert before[
              'knight/js/dpad.js'
          ]==after[
              'knight/js/dpad.js'
          ]

          assert not (
              set(before)-set(after)
          )

          assert "var version='V3.14';" in (
              root/'knight/js/sl-assets-v229r115.js'
          ).read_text('utf8')

          print('PASS V3.14')
          print('PASS eight characters')
          print('PASS 4 directions x 4 frames')
          print('PASS 128 total walking images')
          print('PASS original scale 100 percent')
          print('PASS direction-specific fixed anchors')
          print('PASS original walking motion corrected')
          print('PASS original companion chase reused')
          print('PASS separated teleport destinations')
          print('PASS ordinary walking collision gate')
          print('PASS original input handling unchanged')
          print('PASS original engine files unchanged')
          PY

      - name: Upload V3.14 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
