              try:
                  inp = src

                  if src.suffix.lower() in {
                      '.mid',
                      '.midi'
                  }:
                      temp =
                          src.with_name(
                              src.name +
                              '.wav'
                          )

                      subprocess.run(
                          [
                              'timidity',
                              str(src),
                              '-Ow',
                              '-o',
                              str(temp)
                          ],
                          check=True
                      )

                      inp = temp

                  subprocess.run(
                      [
                          'ffmpeg',
                          '-nostdin',
                          '-v',
                          'error',
                          '-y',
                          '-i',
                          str(inp),
                          '-c:a',
                          'libvorbis',
                          '-q:a',
                          '4',
                          str(out)
                      ],
                      check=True
                  )

                  if not out.exists() or \
                     out.stat().st_size == 0:

                      raise RuntimeError(
                          'empty output'
                      )

                  if temp and temp.exists():
                      temp.unlink()

                  if src != out and \
                     src.exists():

                      src.unlink()

                  converted += 1

              except Exception as e:
                  failures.append(
                      (
                          str(src),
                          str(e)
                      )
                  )

                  if temp and temp.exists():
                      temp.unlink()

          if failures:
              for f, e in failures:
                  print(
                      f + ' -> ' + e,
                      file=sys.stderr
                  )

              raise SystemExit(1)

          print(
              'AUDIO_CONVERTED=' +
              str(converted)
          )

          gfx =
              Path(
                  'player/gameasync/Graphics'
              )

          image_sources = [
              p
              for p in gfx.rglob('*')
              if p.is_file() and
              p.suffix.lower() in {
                  '.bmp',
                  '.gif',
                  '.webp',
                  '.tif',
                  '.tiff'
              }
          ]

          for src in image_sources:
              out =
                  src.with_suffix(
                      '.png'
                  )

              subprocess.run(
                  [
                      'convert',
                      str(src) + '[0]',
                      str(out)
                  ],
                  check=True
              )

              if not out.exists() or \
                 out.stat().st_size == 0:

                  raise SystemExit(
                      'image conversion failed: ' +
                      str(src)
                  )

              src.unlink()
          PY

