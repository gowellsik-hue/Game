name: build-slknight-web.yml | V4.17 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Resolve final V4.16 deployment
        id: baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BASE_SHA=9cab02b37866199fa1236481d1beb380ea3eccfb

          gh api \
            --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/build-slknight-web.yml/runs" \
            -f head_sha="$BASE_SHA" \
            -f status=success \
            -f per_page=100 \
            > /tmp/sl417-runs.json

          RUN_ID=$(jq -er \
            --arg sha "$BASE_SHA" \
            '[.workflow_runs[]
              | select(
                  .head_sha == $sha
                  and .head_branch == "main"
                  and .status == "completed"
                  and .conclusion == "success"
                )]
              | sort_by(.created_at)
              | last
              | .id // empty' \
            /tmp/sl417-runs.json)

          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" \
            > /tmp/sl417-jobs.json

          jq -e \
            '[.jobs[]
              | select(
                  .name == "deploy"
                  and .conclusion == "success"
                )]
              | length == 1' \
            /tmp/sl417-jobs.json

          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            > /tmp/sl417-artifacts.json

          jq -e \
            '[.artifacts[]
              | select(
                  .name == "github-pages"
                  and .expired == false
                  and .size_in_bytes > 0
                )]
              | length == 1' \
            /tmp/sl417-artifacts.json

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

          echo "PASS final V4.16 commit $BASE_SHA"
          echo "PASS successful deployment $RUN_ID"

      - name: Restore final V4.16 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: ${{ steps.baseline.outputs.run_id }}
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify original game
        shell: bash
        run: |
          set -euo pipefail

          test -s baseline/artifact.tar

          mkdir -p site
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          import json

          root = Path('site')
          game = root/'knight/gameasync'

          pre = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          before = {
              p.relative_to(root).as_posix():
                  hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          assert len(before) == 6086, len(before)

          required = [
              'System',
              'Map007',
              'Map029',
              'Map047',
              'Actors',
              'Classes',
              'CommonEvents'
          ]

          for name in required:
              p = game/'Data'/(pre+name+'.rxdata')
              assert p.is_file(), name
              assert p.stat().st_size > 4, name

          scripts = game/'Data/Scripts.rxdata'

          assert scripts.is_file()
          assert scripts.stat().st_size > 100000

          loader = root/'knight/js/sl-assets-v229r115.js'

          assert loader.read_bytes().count(
              b"var version='V4.16';"
          ) == 1

          for name in ('index.html', 'knight/index.html'):
              assert b'V4.16' in (root/name).read_bytes(), name

          names = [
              'Scripts.rxdata',
              pre+'Map007.rxdata'
          ]

          old_md5 = {
              name: hashlib.md5(
                  (game/'Data'/name).read_bytes()
              ).hexdigest()
              for name in names
          }

          Path('/tmp/sl417-before.json').write_text(
              json.dumps(before, sort_keys=True),
              'utf8'
          )

          Path('/tmp/sl417-md5.json').write_text(
              json.dumps(old_md5),
              'utf8'
          )

          print('PASS final V4.16 baseline')
          print('PASS 6086 original files')
          PYTHON

      - name: Rebuild character creation using existing profiles
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl417-patch.rb <<'RUBY'
          # encoding: UTF-8

          require 'zlib'
          require 'json'

          module RPG
            %w[
              Map
              MapInfo
              Tileset
              Event
              EventCommand
              MoveRoute
              MoveCommand
              AudioFile
              CommonEvent
              System
              Item
              Actor
              Class
              Weapon
              Armor
              Skill
              State
            ].each do |n|
              const_set(n,::Class.new)
            end

            Event.const_set(:Page,::Class.new)
            Event::Page.const_set(:Condition,::Class.new)
            Event::Page.const_set(:Graphic,::Class.new)

            System.const_set(:Words,::Class.new)
            System.const_set(:TestBattler,::Class.new)

            self::Class.const_set(:Learning,::Class.new)
          end

          %w[Table Tone Color].each do |n|
            Object.const_set(n,Class.new do
              def self._load(raw)
                o=allocate
                o.instance_variable_set(:@raw,raw)
                o
              end

              def _dump(depth)
                @raw
              end
            end)
          end

          def iv(o,k)
            o.instance_variable_get(k)
          end

          def utf(s)
            s.to_s.dup.force_encoding('UTF-8')
          end

          def ck(ok,msg)
            raise msg unless ok
          end

          def code(c)
            iv(c,:@code)
          end

          def par(c)
            iv(c,:@parameters)
          end

          def one(s,a,b)
            rx=Regexp.new(
              a.split("\n",-1).map{|l|Regexp.escape(l)}.join('\\r?\\n')
            )

            ck(
              s.scan(rx).size==1,
              "Patch anchor count #{a[0,100]}"
            )

            s.sub(rx){b}
          end

          root=ARGV.fetch(0)

          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          path=lambda{|n|File.join(root,pre+n+'.rxdata')}

          map=Marshal.load(File.binread(path.call('Map007')))
          island=Marshal.load(File.binread(path.call('Map047')))
          sys=Marshal.load(File.binread(path.call('System')))

          ck(
            [:@start_map_id,:@start_x,:@start_y].map{
              |k|iv(sys,k)
            }==[7,9,6],
            'V4.16 start required'
          )

          recruit=iv(island,:@events).values.select do |e|
            utf(iv(e,:@name))=='[ID고용사]'
          end

          ck(recruit.size==1,'Recruiter count')

          forms=[]
          pending=[]

          iv(recruit[0],:@pages).each do |page|
            iv(page,:@list).each do |c|
              next unless code(c)==355

              s=utf(par(c)[0])

              if m=s.match(/\A@sl43_type = ("(?:\\.|[^"\\])*"); @sl43_stats = (\[[0-9, ]+\])/)
                pending << [
                  JSON.parse(m[1]),
                  JSON.parse(m[2])
                ]

              elsif s.include?('@sl43_actor = Game_Actor.new(@sl43_slot)')

                m=s.match(/@class_id,\$data_actors\[(\d+)\]\.class_id\).*?\.set_graphic\(("(?:\\.|[^"\\])*"),0,.*?@sl43_form,("(?:\\.|[^"\\])*")\)/)

                ck(
                  m && !pending.empty?,
                  'Hire profile source mismatch'
                )

                forms << [
                  JSON.parse(m[3]),
                  JSON.parse(m[2]),
                  m[1].to_i,
                  pending
                ]

                pending=[]
              end
            end
          end

          ck(
            forms.group_by(&:first).values.all?{
              |v|v.uniq.size==1
            },
            'Recruiter pages disagree'
          )

          forms=forms.uniq

          ck(
            pending.empty? &&
            forms.size==8 &&
            forms.map(&:first).uniq.size==8,
            '8 forms required'
          )

          ck(
            forms.map(&:first)==[
              '남기사',
              '여기사',
              '남요정',
              '여요정',
              '남법사',
              '여법사',
              '남다엘',
              '여다엘'
            ],
            'Original character form order'
          )

          ck(
            forms.map{|f|f[3].size}==[2,2,3,3,3,3,3,3],
            '22 combinations required'
          )

          ck(
            forms.flat_map{|f|f[3]}.uniq.size==11,
            '11 types required'
          )

          ck(
            forms.all?{
              |f|f[3].all?{|_,s|s.size==6&&s.sum==75}
            },
            'Approved stats'
          )

          actors=Marshal.load(File.binread(path.call('Actors')))

          ck(
            actors[1]&&iv(actors[1],:@initial_level)==1,
            'Actor 1 initial level'
          )

          forms.each do |_,_,id,_|
            ck(
              actors[id]&&iv(actors[id],:@class_id).is_a?(Integer),
              'Class template'
            )
          end

          rows=Marshal.load(
            File.binread(File.join(root,'Scripts.rxdata'))
          )

          ck(rows.size==137,'Script count')

          original=rows.map{|r|Marshal.dump(r)}

          src=lambda do |i|
            utf(Zlib::Inflate.inflate(rows.fetch(i)[2]))
          end

          set=lambda do |i,s|
            RubyVM::InstructionSequence.compile(s)
            rows[i][2]=Zlib::Deflate.deflate(s)
          end

          ck(
            rows[17][1]=='Game_Actor' &&
            rows[94][1]=='Scene_Name' &&
            rows[26][1]=='Game_Event' &&
            rows[71][1]=='Interpreter 3',
            'Script identity'
          )

          body=src.call(26)

          weapon=body.match(/w=f\.end_with\?\('기사'\) \? (\d+)\s*:\s*\(\s*f\.end_with\?\('요정'\) \? (\d+)\s*:\s*\(f\.end_with\?\('법사'\) \? (\d+) : (\d+)\)/m)

          ck(weapon,'Existing starter weapon selection')

          weapons=weapon.captures.map(&:to_i)

          ck(
            weapons==[170,1000,1001,1002],
            'Starter weapon ids'
          )

          profiles=forms.each_with_index.map do |f,i|
            f+[weapons[i/2]]
          end

          event=iv(map,:@events).fetch(1)
          page=iv(event,:@pages).fetch(0)
          list=iv(page,:@list)

          ck(
            iv(event,:@name)=='EV001' &&
            iv(page,:@trigger)==4 &&
            list.size==121,
            'Original creation event'
          )

          ck(
            [
              code(list[44]),
              code(list[45]),
              par(list[45]),
              par(list[89]),
              code(list[104]),
              code(list[105]),
              code(list[106]),
              code(list[119]),
              par(list[119])[0,2]
            ]==[
              241,
              303,
              [1,12],
              [170,0,0,1],
              209,
              509,
              509,
              201,
              [0,47]
            ],
            'Creation command structure'
          )

          ck(
            par(list[119])==[0,47,372,138,2,1],
            'V4.16 Talking Island destination'
          )

          ck(
            code(list[80])==317 &&
            code(list[81])==311,
            'Original HP initialization'
          )

          reserved=[46,51,56,61].map do |i|
            ck(
              code(list[i])==111 &&
              par(list[i])[0,3]==[4,1,1],
              'Reserved name condition'
            )

            utf(par(list[i])[3])
          end

          ck(reserved.uniq.size==4,'Reserved names')

          route=Marshal.load(Marshal.dump(list[104,3]))

          route.each do |c|
            c.instance_variable_set(:@indent,0)
          end

          new_list=
            list[0,3]+
            list[44,2]+
            list[76,4]+
            list[82,7]+
            list[90,8]+
            route+
            list[109,12]

          ck(
            new_list.count{|c|code(c)==303}==1 &&
            new_list.none?{|c|code(c)==102} &&
            new_list[-2].equal?(list[119]),
            'Creation event scope'
          )

          other=iv(map,:@events).reject{
            |k,_|k==1
          }.transform_values{
            |e|Marshal.dump(e)
          }

          page.instance_variable_set(:@list,new_list)

          ck(
            iv(map,:@events).reject{
              |k,_|k==1
            }.transform_values{
              |e|Marshal.dump(e)
            }==other,
            'Other Map007 events'
          )

          File.binwrite(
            path.call('Map007'),
            Marshal.dump(map)
          )

          s=src.call(94)

          s=one(
            s,
            'class Scene_Name',
            "class Scene_Name\n  SL417_PROFILES = #{profiles.inspect}\n  SL417_RESERVED = #{reserved.inspect}"
          )

          s=one(
            s,
            '    @actor = $game_actors[$game_temp.name_actor_id]',
            <<~'SRC'.lines.map{|l|'    '+l}.join.chomp
          @actor = $game_actors[$game_temp.name_actor_id]
          @sl417_create = $game_map.map_id == 7 && @actor.id == 1

          if @sl417_create
            Graphics.transition
            puts('SL417|OPEN')
            return
          end
          SRC
          )

          s=one(
            s,
            '    @edit_window.dispose',
            "    return if @sl417_create\n    @edit_window.dispose"
          )

          s=one(
            s,
            '    @edit_window.update',
            <<~'SRC'.lines.map{|l|'    '+l}.join.chomp
          if @sl417_create
            return unless FileTest.exist?('/game/SL417Create.tmp')

            file=File.open('/game/SL417Create.tmp','rb')
            fields=file.read.split("\n",3)
            file.close

            if fields.size!=3 ||
               fields[0] !~ /\A[0-7]\z/ ||
               fields[1] !~ /\A[0-2]\z/

              puts('SL417|RETRY')
              return
            end

            form,graphic,template,presets,weapon=SL417_PROFILES[fields[0].to_i]

            selected=presets[fields[1].to_i]
            name=fields[2].strip

            name=name.force_encoding('UTF-8') if name.respond_to?(:force_encoding)

            if !selected ||
               name.empty? ||
               name.split(//).size>$game_temp.name_max_char ||
               SL417_RESERVED.include?(name)

              puts('SL417|RETRY')
              return
            end

            kind,stats=selected

            @actor.instance_variable_set(:@sl43_form,form)
            @actor.instance_variable_set(:@sl43_type,kind)
            @actor.instance_variable_set(:@sl43_stats,stats.dup)
            @actor.instance_variable_set(:@sl417_base_graphic,graphic)

            @actor.instance_variable_set(
              :@class_id,
              $data_actors[template].class_id
            )

            @actor.set_graphic(
              graphic,
              0,
              @actor.battler_name,
              @actor.battler_hue
            )

            @actor.name=name

            [425,469,426,962,966,968].each_with_index do |id,i|
              $game_variables[id]=stats[i]
            end

            $game_variables[48]=fields[0].to_i%2
            $game_switches[70]=(kind=='힘기사')

            @actor.sl44_record_growth
            @actor.recover_all

            $game_party.gain_weapon(weapon,1)
            $game_party.gain_item(1006,1000) if weapon==1000

            $game_system.se_play($data_system.decision_se)

            puts('SL417|CLOSE')

            $scene=Scene_Map.new

            return
          end

          @edit_window.update
          SRC
          )

          set.call(94,s)

          s=src.call(17)

          s=one(
            s,
            '    if @actor_id == 1'+"\n"+'      kind=0',
            '    if @actor_id == 1 && !@sl417_base_graphic'+"\n"+'      kind=0'
          )

          s=one(
            s,
            '      w=@sl43_stats[4].to_i'+"\n"+'      oc=@sl44_origin_con ||= c',
            <<~'SRC'.lines.map{|l|'      '+l}.join.chomp
          w=@sl43_stats[4].to_i

          if @sl417_base_graphic
            c=$game_variables[426].to_i
            w=$game_variables[966].to_i
          end

          oc=@sl44_origin_con ||= c
          SRC
          )

          s=one(
            s,
            '    @sl44_player_highest ||= @level if @actor_id == 1',
            '    @sl44_player_highest ||= @level if @actor_id == 1 && !@sl417_base_graphic'
          )

          s=one(
            s,
            '      if @actor_id == 1 && @level > @sl44_player_highest',
            '      if @actor_id == 1 && !@sl417_base_graphic && @level > @sl44_player_highest'
          )

          s=one(
            s,
            '    return $data_classes[@class_id].name',
            "    return @sl43_form if @sl417_base_graphic\n    return $data_classes[@class_id].name"
          )

          s=one(
            s,
            '    @character_name = character_name',
            <<~'SRC'.lines.map{|l|'    '+l}.join.chomp
          if @sl417_base_graphic && ['knight_men','여기사'].include?(character_name)
            character_name=@sl417_base_graphic
          end

          @character_name = character_name
          SRC
          )

          s=one(
            s,
            '      dex=@sl43_stats[1]+@dex_plus',
            "      dex=@sl43_stats[1]+@dex_plus\n      dex=$game_variables[469]+$game_variables[961] if @sl417_base_graphic"
          )

          s=one(
            s,
            '      return pdef1+pdef2+pdef3+pdef4+pdef5+@level/div+bonus',
            "      n=pdef1+pdef2+pdef3+pdef4+pdef5+@level/div+bonus\n      n+=$game_variables[1080]+$game_variables[920] if @sl417_base_graphic\n      return n"
          )

          s=one(
            s,
            '      w=@sl43_stats[4]'+"\n"+'      b=if w<=14; 0',
            "      w=@sl43_stats[4]\n      w=$game_variables[966] if @sl417_base_graphic\n      b=if w<=14; 0"
          )

          s=one(
            s,
            "      mr=if @sl43_form.end_with?('기사');",
            "      w=@sl43_stats[4] if @sl417_base_graphic\n      mr=if @sl43_form.end_with?('기사');"
          )

          s=one(
            s,
            '      return mdef1+mdef2+mdef3+mdef4+mdef5+@level/2+mr+b',
            <<~'SRC'.lines.map{|l|'      '+l}.join.chomp
          n=mdef1+mdef2+mdef3+mdef4+mdef5+@level/2+mr+b

          if @sl417_base_graphic
            n+=$game_variables[925]
            $MDEF=n
          end

          return n
          SRC
          )

          set.call(17,s)

          s=src.call(12)

          s=one(
            s,
            '(@sl46_stats_ready ? 0 : $game_variables[169] + $game_variables[170] + $game_variables[171])',
            '(@sl46_stats_ready && !@sl417_base_graphic ? 0 : $game_variables[169] + $game_variables[170] + $game_variables[171])'
          )

          set.call(12,s)

          s=src.call(117)

          s=one(
            s,
            '$n = n unless @sl46_stats_ready',
            '$n = n unless @sl46_stats_ready && !@sl417_base_graphic'
          )

          set.call(117,s)

          [34,98].each do |i|
            s=src.call(i)

            a='actor.instance_variable_get(:@sl46_stats_ready)'

            b=a+' && !actor.instance_variable_get(:@sl417_base_graphic)'

            ck(
              s.scan(a).size==(i==34 ? 2 : 5),
              'Actor parameter anchor count'
            )

            s=s.gsub(a,b)

            set.call(i,s)
          end

          s=one(
            body,
            "    a.id==1 ? 3213 : FORMS[a.instance_variable_get(:@sl43_form).to_s]",
            "    a.id==1 && !a.instance_variable_get(:@sl417_base_graphic) ? 3213 : FORMS[a.instance_variable_get(:@sl43_form).to_s]"
          )

          s=one(
            s,
            "  def self.pc_motion\n    w=SL49.weapon($game_actors[1])",
            "  def self.pc_motion\n    a=$game_actors[1]\n    return motion(a) if a.instance_variable_get(:@sl417_base_graphic)\n    w=SL49.weapon(a)"
          )

          set.call(26,s)

          s=src.call(71)

          s=one(
            s,
            '    a.id==1 ? [$game_switches[70] ? 20 : 16,12] :',
            '    a.id==1 && !a.instance_variable_get(:@sl417_base_graphic) ? [$game_switches[70] ? 20 : 16,12] :'
          )

          set.call(71,s)

          s=src.call(24)

          s=one(
            s,
            '          @character_name = command.parameters[0]',
            <<~'SRC'.lines.map{|l|'          '+l}.join.chomp
          @character_name = command.parameters[0]

          if self.is_a?(Game_Player) && ['knight_men','여기사'].include?(@character_name)
            @character_name=$game_actors[1].instance_variable_get(:@sl417_base_graphic) || @character_name
          end
          SRC
          )

          set.call(24,s)

          s=src.call(28)

          s=one(
            s,
            "      if @character.character_name=='knight_men좌표'",
            <<~'SRC'.lines.map{|l|'      '+l}.join.chomp
          base=$game_actors[1].instance_variable_get(:@sl417_base_graphic)

          if base && @character.character_name==base
            m=SL411.pc_motion
            v=[m[0],nil,14,m[3]] if m

          elsif base && ['knight_men좌표','여기사 좌표'].include?(@character.character_name)
            v=@character.instance_variable_get(:@sl411_pc_frame)

          elsif @character.character_name=='knight_men좌표'
          SRC
          )

          set.call(28,s)

          s=src.call(73)

          s=one(
            s,
            "       @parameters[1].to_s =~ /\\Aknight_men_(down|left|right|up)([1-6])\\z/",
            <<~'SRC'.lines.map{|l|'       '+l}.join.chomp
          (@parameters[1].to_s =~ /\Aknight_men_(down|left|right|up)([1-6])\z/ ||
           ($game_actors[1].instance_variable_get(:@sl417_base_graphic) &&
            @parameters[1].to_s =~ /\A여기사 공격[- ](하|좌|우|상)-?([1-6])\z/))
          SRC
          )

          s=one(
            s,
            "        'up'=>8\n      }[$1]",
            "        'up'=>8,'하'=>2,'좌'=>4,'우'=>6,'상'=>8\n      }[$1]"
          )

          set.call(73,s)

          changed=rows.each_index.select do |i|
            Marshal.dump(rows[i])!=original[i]
          end

          ck(
            changed==[12,17,24,26,28,34,71,73,94,98,117],
            "Unexpected scripts #{changed.inspect}"
          )

          File.binwrite(
            File.join(root,'Scripts.rxdata'),
            Marshal.dump(rows)
          )

          File.write(
            '/tmp/sl417-profiles.json',
            JSON.generate(
              {
                profiles:profiles,
                reserved:reserved
              }
            )
          )

          puts "PASS #{forms.size} forms"
          puts "PASS #{forms.sum{|f|f[3].size}} combinations"
          puts "PASS #{forms.flat_map{|f|f[3]}.uniq.size} types"
          puts "PASS scripts #{changed.inspect}"
          puts "PASS 126 original scripts unchanged"
          puts "PASS new Map007 list #{new_list.size}"
          puts "PASS transfer #{par(list[119]).inspect}"
          RUBY

          ruby -c /tmp/sl417-patch.rb

          ruby /tmp/sl417-patch.rb \
            site/knight/gameasync/Data

      - name: Build unified character creation screen
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl417-create.js <<'JAVASCRIPT'
          (function(){
            'use strict';

            const data=SL417_DATA;
            const file='/game/SL417Create.tmp';

            let panel=null,send=null,status=null;

            function clearFile(){
              if(FS.analyzePath(file).exists) FS.unlink(file);
            }

            function close(){
              clearFile();

              if(panel) panel.remove();

              panel=send=status=null;
            }

            function open(){
              close();

              let selected=-1,composing=false;

              panel=document.createElement('div');
              panel.id='sl417-create';

              const form=document.createElement('form');
              form.className='sl417-card';

              const title=document.createElement('h2');
              title.textContent='캐릭터 생성';

              const grid=document.createElement('div');
              grid.className='sl417-forms';

              const select=document.createElement('select');
              select.required=true;
              select.setAttribute('aria-label','능력치 유형');

              const stats=document.createElement('div');
              stats.className='sl417-stats';

              const name=document.createElement('input');
              name.type='text';
              name.required=true;
              name.maxLength=12;
              name.placeholder='캐릭터 이름';
              name.autocomplete='off';
              name.setAttribute('aria-label','캐릭터 이름');

              name.addEventListener(
                'compositionstart',
                ()=>composing=true
              );

              name.addEventListener(
                'compositionend',
                ()=>composing=false
              );

              send=document.createElement('button');
              send.type='submit';
              send.className='sl417-submit';
              send.textContent='캐릭터 생성';
              send.disabled=true;

              status=document.createElement('div');
              status.className='sl417-status';

              function refresh(){
                stats.replaceChildren();

                if(selected<0 || select.value==='') return;

                const values=
                  data.profiles[selected][3][Number(select.value)][1];

                ['STR','DEX','CON','INT','WIS','CHA'].forEach((key,i)=>{
                  const el=document.createElement('span');

                  el.textContent=key+' '+values[i];

                  stats.append(el);
                });
              }

              data.profiles.forEach((p,i)=>{
                const b=document.createElement('button');

                b.type='button';
                b.className='sl417-option';
                b.setAttribute('aria-pressed','false');

                const c=document.createElement('canvas');

                c.width=60;
                c.height=60;

                const img=new Image();

                img.onload=()=>{
                  const w=Math.floor(img.width/4);
                  const h=Math.floor(img.height/4);

                  const scale=Math.min(60/w,60/h);

                  const ctx=c.getContext('2d');

                  ctx.imageSmoothingEnabled=false;

                  ctx.drawImage(
                    img,
                    0,
                    0,
                    w,
                    h,
                    (60-w*scale)/2,
                    60-h*scale,
                    w*scale,
                    h*scale
                  );
                };

                img.src='data:image/png;base64,'+data.images[i];

                const label=document.createElement('span');

                label.textContent=p[0];

                b.append(c,label);

                b.onclick=()=>{
                  selected=i;

                  grid.querySelectorAll('button').forEach((el,j)=>{
                    el.setAttribute(
                      'aria-pressed',
                      String(j===i)
                    );
                  });

                  select.replaceChildren();

                  p[3].forEach((t,j)=>{
                    const o=document.createElement('option');

                    o.value=String(j);
                    o.textContent=t[0];

                    select.append(o);
                  });

                  send.disabled=false;

                  refresh();

                  status.textContent='';
                };

                grid.append(b);
              });

              const o=document.createElement('option');

              o.value='';
              o.textContent='캐릭터를 먼저 선택하세요';

              select.append(o);

              select.onchange=refresh;

              form.append(
                title,
                grid,
                select,
                stats,
                name,
                send,
                status
              );

              panel.append(form);

              document.body.append(panel);

              form.addEventListener('submit',e=>{
                e.preventDefault();

                if(
                  composing ||
                  send.disabled ||
                  selected<0 ||
                  select.value===''
                ) return;

                const n=name.value.trim();

                if(
                  !n ||
                  n.length>12 ||
                  /[\u0000-\u001f\u007f]/.test(n) ||
                  data.reserved.includes(n)
                ){
                  status.textContent='사용할 수 없는 이름입니다.';

                  name.focus();

                  return;
                }

                try{
                  FS.writeFile(
                    file,
                    selected+'\n'+select.value+'\n'+n
                  );

                  send.disabled=true;

                  status.textContent='생성 중...';

                }catch(err){
                  status.textContent='캐릭터 생성 정보를 전달하지 못했습니다.';

                  console.error(err);
                }
              });
            }

            ['keydown','keyup','keypress'].forEach(type=>{
              window.addEventListener(type,e=>{
                if(panel && panel.contains(e.target)){
                  e.stopImmediatePropagation();
                }
              },true);
            });

            const log=console.log.bind(console);

            console.log=function(...args){
              log(...args);

              const marker=args.join(' ').trim();

              if(marker==='SL417|OPEN'){
                open();

              }else if(marker==='SL417|CLOSE'){
                close();

              }else if(marker==='SL417|RETRY' && panel){
                clearFile();

                send.disabled=false;

                status.textContent='이름 또는 유형을 다시 확인하세요.';
              }
            };
          })();
          JAVASCRIPT

          node --check /tmp/sl417-create.js

          cat > /tmp/sl417-create.css <<'CSS'
