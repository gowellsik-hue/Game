
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V235
# BASE: Successful V234 Pages artifact, run 41253316694.
# FIX: V234 Layer4 Bitmap.new requested a .png suffix absent from the map cache key.
# FIX: A failed image lookup was repeated every frame because the key never settled.
# FIX: Load mapped Layer4 names without the suffix; one new bitmap per frame.
# FIX: Remember failed source chunks; never retry them in the same map session.
# PRESERVE: Actual original 96 Layer4 PNGs and existing 193-file Map047 preload pack.
# PRESERVE: Native Layer5 opacity mask exactly; fade player behind objects to 150.
# PRESERVE: Original Map047 collision, NPCs/Pandora, controls, other maps, saves.
# KEEP DELETED: Talking Island Dungeon Map045 and Map046.
# WORKFLOW FILE/TITLE: Preserved, version incremented to V235 only.
# STATUS: Local Ruby source and simulated render tests passed; live mobile pending.
name: build-slknight-web.yml | V235 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V235 Download complete deployed V234 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41253316694
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V235 Verify original V234 graphics, map and preloading
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY'
          from pathlib import Path
          import json,struct,hashlib
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          if len(before)!=5601:raise ValueError('Wrong V234 file inventory')
          if 'V234' not in (root/'knight/index.html').read_text('utf8'):
              raise ValueError('Wrong game version')
          src='knight/gameasync/Data/Scripts.rxdata'
          if before[src]!='71d1f02dfc12e58148e1c260735409fecf9f51ec2670583caa60f4aa60fc9003':
              raise ValueError('Wrong original V234 RGSS scripts')
          pref='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          if pref+'Map047.rxdata' not in before:raise ValueError('Talking Island missing')
          for mid in (45,46):
              if pref+f'Map{mid:03d}.rxdata' in before:
                  raise ValueError('Previously removed dungeon returned')
          original='knight/gameasync/Graphics/Panoramas/SLTI_47_C7_4.png'
          if before[original]!='d1f321ba3012e9422e909b2ba4865dfcfaf188cb0671c459597f935537a26991':
              raise ValueError('Original Map047 Panorama modified')
          pack=root/'knight/assets/map-047-v234.pack'
          if not pack.is_file():raise ValueError('V234 original foreground preloading missing')
          with pack.open('rb') as f:
              length=struct.unpack('<I',f.read(4))[0]
              manifest=json.loads(f.read(length))
          if manifest['kind']!='map' or manifest['map_id']!=47 or len(manifest['files'])!=193:
              raise ValueError('Expected existing 97+96 preload files')
          for x in range(12):
              for y in range(8):
                  path=f'knight/gameasync/Graphics/Panoramas/SLTI_47_L4_C{x}_{y}.png'
                  if path not in before:raise ValueError('Missing original Layer4 tile: '+path)
          mapping=(root/'knight/gameasync/mapping.js').read_text('utf8').lower()
          if '"graphics/panoramas/slti_47_l4_c5_4"' not in mapping:
              raise ValueError('Original foreground mapped only without .png suffix')
          Path('build/before.json').write_text(json.dumps(before,sort_keys=True),'utf8')
          print('PASS V234 original maps and 96 actual transparent Layer4 images preserved')
          print('PASS original 193-file Map047 staged preload and map asset keys')
          PY

      - name: V235 Fix only foreground RGSS bitmap loader
        shell: bash
        run: |
          set -euo pipefail
          cat > build/fix-layer4.rb <<'RUBY'
          require 'zlib'
          require 'digest'

          file = ENV.fetch('SL_SCRIPTS', 'site/knight/gameasync/Data/Scripts.rxdata')
          original = File.binread(file)
          expected = '71d1f02dfc12e58148e1c260735409fecf9f51ec2670583caa60f4aa60fc9003'
          raise 'Wrong source V234 Scripts.rxdata' unless Digest::SHA256.hexdigest(original) == expected
          scripts = Marshal.load(original)
          raise 'Wrong V234 RGSS section count/layout' unless scripts.length == 137 &&
            scripts[-2][1] == 'SLNativeLayerV234' && scripts[-1][1] == 'Main'
          source = Zlib::Inflate.inflate(scripts[-2][2])
          original_mask = source[/MASK_HEX='([0-9a-f]+)'/, 1]
          raise 'V234 native Layer5 bitmap missing or changed' unless original_mask && original_mask.length == 21600

          def replace_one!(source, from, to)
            count = source.scan(from).length
            raise "Expected exactly one runtime fragment (found #{count}): #{from[0,70]}" unless count == 1
            source.sub!(from, to)
          end

          replace_one!(source,
            "sp.bitmap=Bitmap.new('Graphics/Panoramas/SLTI_47_L4_C'+key[0].to_s+'_'+key[1].to_s+'.png')",
            "sp.bitmap=Bitmap.new('Graphics/Panoramas/SLTI_47_L4_C'+key[0].to_s+'_'+key[1].to_s)")

          replace_one!(source, '    needed.each_with_index do |key,i|',
            "    load_budget=1\n    needed.each_with_index do |key,i|")

          replace_one!(source, '      if @sl_v234_cover_keys[i]!=key',
            "      @sl_v234_cover_failed||={}\n" +
            "      if @sl_v234_cover_failed[key]\n" +
            "        sp.visible=false\n" +
            "        next\n" +
            "      end\n" +
            "      if @sl_v234_cover_keys[i]!=key\n" +
            "        if load_budget<=0\n" +
            "          sp.visible=false\n" +
            "          next\n" +
            "        end\n" +
            "        load_budget-=1")

          replace_one!(source,
            "        rescue StandardError=>error\n          p 'V234 Layer4 load: '+error.message.to_s\n          sp.visible=false\n          next",
            "        rescue StandardError=>error\n          @sl_v234_cover_failed[key]=true\n          @sl_v234_cover_keys[i]=key\n          p 'V234 Layer4 load: '+error.message.to_s\n          sp.visible=false\n          next")

          replace_one!(source,
            "        @sl_v234_cover_keys[i]=key\n      end\n      x0=",
            "        @sl_v234_cover_keys[i]=key\n      end\n      if sp.bitmap==nil\n        sp.visible=false\n        next\n      end\n      x0=")

          source.gsub!('V234', 'V235')
          source.gsub!('v234', 'v235')
          raise 'Native Layer5 bitmap changed' unless source[/MASK_HEX='([0-9a-f]+)'/,1] == original_mask
          raise 'Incorrect foreground loading path' if source.include?("key[1].to_s+'.png'")
          raise 'Missing one-image-per-frame limiter' unless source.include?('load_budget=1')
          raise 'Missing failed-load guard' unless source.include?('@sl_v235_cover_failed[key]=true')
          raise 'Original map renderer not preserved' unless source.include?('class Spriteset_Map')
          raise 'Game runtime decompressor added' if source.include?('Zlib::')
          File.binwrite(ENV.fetch('SL_LAYER_SOURCE', 'build/native-layer-v235.rb'), source)
          scripts[-2][1] = 'SLNativeLayerV235'
          scripts[-2][2] = Zlib::Deflate.deflate(source, Zlib::BEST_COMPRESSION)
          File.binwrite(file, Marshal.dump(scripts))
          verified = Marshal.load(File.binread(file))
          old_scripts = Marshal.load(original)
          raise 'Unrelated RGSS scripts changed' unless verified.length == old_scripts.length &&
            verified[0...-2] == old_scripts[0...-2] && verified[-1] == old_scripts[-1]
          raise 'Wrong new RGSS section' unless verified[-2][1] == 'SLNativeLayerV235'
          puts 'PASS original 136 RGSS sections preserved; only V234 Layer4 script fixed'
          puts 'PASS native Layer5 bitmask unchanged byte-for-byte'
          puts 'PASS extensionless mapped resource, one decode per frame and no infinite retries'
          RUBY
          ruby -c build/fix-layer4.rb
          ruby build/fix-layer4.rb
          ruby -c build/native-layer-v235.rb

      - name: V235 Refresh only Scripts cache and displayed version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          root=Path('site')
          game=root/'knight/gameasync'
          script=game/'Data/Scripts.rxdata'
          digest=hashlib.md5(script.read_bytes()).hexdigest()
          mapping=game/'mapping.js'
          original=mapping.read_text('utf8')
          new,n=re.subn(r'(Data/Scripts\.rxdata\?h=)[0-9a-f]{32}',
                        lambda m:m.group(1)+digest,original)
          if n!=1:raise ValueError('Original RGSS scripts cache key is not unique')
          mapping.write_text(new,'utf8')
          for name in ('index.html','knight/index.html'):
              file=root/name
              text=file.read_text('utf8')
              if 'V234' not in text:raise ValueError('Wrong page version '+name)
              file.write_text(text.replace('V234','V235').replace('v234','v235'),'utf8')
          assets=root/'knight/js/sl-assets-v229r115.js'
          text=assets.read_text('utf8')
          old="var version='V234';"
          if text.count(old)!=1:raise ValueError('Wrong original asset loader version')
          text=text.replace(old,"var version='V235';")
          if "mid===47?'map-047-v234.pack'" not in text:
              raise ValueError('Original Layer4 native preloading changed')
          assets.write_text(text,'utf8')
          if 'js/sl-assets-v229r115.js?v=v235' not in (root/'knight/index.html').read_text('utf8'):
              raise ValueError('New browser cache token not installed')
          print('PASS V235 UI and script cache updated; 193-file original pack unchanged')
          PY
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: V235 Reject any unintended modification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('site')
          before=json.loads(Path('build/before.json').read_text('utf8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          allowed={'knight/gameasync/Data/Scripts.rxdata','knight/gameasync/mapping.js',
                   'knight/js/sl-assets-v229r115.js','index.html','knight/index.html'}
          if before.keys()!=after.keys():raise ValueError('Unexpected game files added/deleted')
          changed={p for p in before if before[p]!=after[p]}
          if changed!=allowed:raise ValueError('Unapproved game changes: '+repr(sorted(changed^allowed)))
          prefix='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          protected=[prefix+'Map047.rxdata','knight/assets/map-047-v234.pack',
                     'knight/gameasync/Graphics/Panoramas/SLTI_47_C7_4.png']
          for x in range(12):
              for y in range(8):
                  protected.append(f'knight/gameasync/Graphics/Panoramas/SLTI_47_L4_C{x}_{y}.png')
          for p in protected:
              if before[p]!=after[p]:raise ValueError('Original map/Layer4/preload changed: '+p)
          for mid in (45,46):
              if prefix+f'Map{mid:03d}.rxdata' in after:
                  raise ValueError('Removed dungeon returned')
          print('PASS 5 intended game script/cache/version files changed only')
          print('PASS all Map047 graphics, original Layer5, NPCs, collision, 193 preload unchanged')
          print('PASS other maps, controls, data and removed dungeons preserved')
          PY

      - name: V235 Publish corrected native Layer4 loader
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
