      - name: Patch save loader before engine build
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('engine/extra/js/drive.js')
          source = path.read_text()

          marker = '    if (window.fileAsyncCache.hasOwnProperty(mappingKey)) return callback();'
          replacement = marker + "\n    try { const mv=mappingValue; if(mv){ const fp='/game/'+mv.split('?')[0]; if(FS.analyzePath(fp).exists && FS.stat(fp).size>1){ window.fileAsyncCache[mappingKey]=1; return callback(); } } } catch(e) {}"

          if source.count(marker) != 1:
              raise SystemExit('loadFileAsync marker mismatch')

          source = source.replace(marker, replacement, 1)

          start = source.index('window.saveFile = function(filename, localOnly) {')
          end = source.index('\n};', start) + 3

          replacement = """window.saveFile = function(filename, localOnly) {
              const fpath='/game/'+filename;
              if(!FS.analyzePath(fpath).exists) return Promise.resolve(false);
              const buf=FS.readFile(fpath);
              return localforage.setItem(namespace+filename,buf)
                .then(()=>localforage.getItem(namespace))
                .then(folder=>{
                  folder=folder||{};
                  folder[filename]={t:Number(FS.stat(fpath).mtime)};
                  return localforage.setItem(namespace,folder);
                })
                .then(()=>{
                  if(!localOnly)(window.saveCloudFile||(()=>{}))(filename,buf);
                  console.log('SLSAVED|'+filename);
                  return true;
                })
                .catch(e=>{
                  console.error('SLSAVEERR',e);
                  return false;
                });
          };
          window.restoreLocalFilesBeforeRun=function(){
              const dep='sl-local-saves';
              addRunDependency(dep);

              try{
                  if(!FS.analyzePath('/game').exists)FS.mkdir('/game');
              }catch(e){}

              localforage.getItem(namespace)
                .then(folder=>Promise.all(Object.keys(folder||{}).map(key=>
                  localforage.getItem(namespace+key).then(res=>{
                    if(!res)return;
                    const f='/game/'+key;

                    try{
                      if(FS.analyzePath(f).exists)FS.unlink(f);
                    }catch(e){}

                    FS.writeFile(f,res);
                    const meta=folder[key];

                    if(meta&&Number.isInteger(meta.t))FS.utime(f,meta.t,meta.t);
                  })
                )))
                .then(()=>{
                  console.log('SLRESTORE|done');
                  removeRunDependency(dep);
                })
                .catch(e=>{
                  console.error('SLRESTOREERR',e);
                  removeRunDependency(dep);
                });
          };"""

          path.write_text(source[:start] + replacement + source[end:])
          PY

