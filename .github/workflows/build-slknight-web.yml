
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R46
# BASE: deployed successful V229R44, GitHub run 39598356143 (not flawed R45).
# FIX: block ONLY FIRST monster recognition through R44 native walls.
# Once aggro is acquired, preserve the original monster chase and switches.
# FIX: original wall art is faded in a small foreground layer OVER the actor;
# the player's opacity is restored and NEVER reduced.
# PRESERVE: R44 collision, 106 spawns and positions, Baphomet ID13 at 156,100,
# stairs, BGMs, mobile controls, original engine and 5,472 game files.
# Keep workflow name/title except sequential version. Never touch game2.
name: build-slknight-web.yml | V229R46 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R46 Restore the original successful R44 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39598356143
          name: github-pages
          github-token: ${{ github.token }}
          path: r44

      - name: V229R46 Restore the exact approved R44 collision graph
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39598356143
          name: SLKnight-V229R44-Wall-Collision-Player-Translucency-106-Monsters
          github-token: ${{ github.token }}
          path: r44-masks

      - name: V229R46 Verify approved R44 inputs before editing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s r44/artifact.tar
          tar -xf r44/artifact.tar -C site
          cp r44-masks/r44-map-45-edges.bin build/
          cp r44-masks/r44-map-46-edges.bin build/
          python3 - <<'R46_VERIFY'
          from pathlib import Path
          import hashlib,json
          root=Path('site');pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          checks={
              'Data/Scripts.rxdata':'82c10608c869bdb25dfd9056fa1e2c9c11d9071a682e45ba4428e5b48c11974f',
              f'Data/{pre}Map045.rxdata':'611b55b73d42d96f6527d3e97d0abd562efdc538391a91b4893f50e9fd117a7c',
              f'Data/{pre}Map046.rxdata':'554ed7c437238f27f33f1073e6e286a83aa1736dcbf4c95229bb30cfdfe03c5a'}
          for name,expected in checks.items():
              p=root/'knight/gameasync'/name
              assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==expected,name
          for mid,n in ((45,288*144),(46,336*168)):
              assert (Path('build')/f'r44-map-{mid}-edges.bin').stat().st_size==n
          original={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in root.rglob('*') if p.is_file()}
          assert len(original)==5472,len(original)
          assert 'V229R44' in (root/'index.html').read_text('utf-8')
          assert 'V229R44' in (root/'knight/index.html').read_text('utf-8')
          Path('build/r46-baseline.json').write_text(json.dumps(original,sort_keys=True))
          print('PASS: exact 106-monster R44 deployment and approved movement data')
          R46_VERIFY

      - name: V229R46 Reenable 88 independent monster detection gates without moving any monster
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r46-map-events.rb <<'R46_SOURCE'
          require 'json'; require 'digest'; require 'set'
          module RPG
           class Map;end;class MapInfo;end;class AudioFile;end;class Tileset;end
           class Event;class Page;class Condition;end;class Graphic;end;end;end
           class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          class Table
           def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
           def _dump(d=0);@raw;end
           def [](x,y=0,z=0);_,w,h,depth,_=@raw.unpack('V5');return nil if x<0 || y<0 || x>=w || y>=h || z<0 || z>=depth; @raw.byteslice(20+2*(x+y*w+z*w*h),2).unpack('v')[0];end
          end
          class Tone
           def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
           def _dump(d=0);@raw;end
          end
          class Color<Tone;end

          def iv(o,k);o.instance_variable_get('@'+k.to_s);end
          def sv(o,k,v);o.instance_variable_set('@'+k.to_s,v);end
          def chk(c,msg);raise msg unless c;end
          site=ARGV.fetch(0); out=ARGV.fetch(1)
          Dir.mkdir(out) unless Dir.exist?(out)
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          root=File.join(site,'knight/gameasync/Data')
          expected_hash={45=>'611b55b73d42d96f6527d3e97d0abd562efdc538391a91b4893f50e9fd117a7c',46=>'554ed7c437238f27f33f1073e6e286a83aa1736dcbf4c95229bb30cfdfe03c5a'}
          expected={45=>{'해골'=>18,'좀비'=>16,'스파토이'=>14},46=>{'버그베어'=>27,'켈베로스'=>25,'킹 버그베어'=>5,'바포메트'=>1}}
          clones=0;details={}
          [45,46].each do |mid|
           path=File.join(root,pre+('Map%03d.rxdata'%mid))
           chk(Digest::SHA256.file(path).hexdigest==expected_hash[mid],"Wrong source R44 map #{mid}")
           before=Marshal.load(File.binread(path));game=Marshal.load(File.binread(path))
           previous=iv(before,'events');events=iv(game,'events')
           chk(events.size==(mid==45 ? 53 : 62),"Map event size changed #{mid}")
           w,h=iv(game,'width'),iv(game,'height')
           edge=File.binread(File.join(out,"r44-map-#{mid}-edges.bin"))
           chk(edge.bytesize==w*h,"Missing original approved collision #{mid}")
           # Explicitly retain all terrain/wall tiles and their original map data.
           data=iv(game,'data')
           wall=Array.new(w*h)
           h.times{|y|w.times{|x|
             t=data[x,y,0]
             chk(t==384 || t==385,"Unexpected original tile #{t} at #{x},#{y}")
             wall[y*w+x]=t==385 ? 1 : 0
           }}
           File.binwrite(File.join(out,"r46-wall-#{mid}.bin"),wall.pack('C*'))
           changed=[]
           events.each do |id,e|
             name=iv(e,'name').to_s.dup.force_encoding('UTF-8').scrub
             next unless name.start_with?('[ID') && !name.include?('힐러') && !name.include?('바포메트')
             next unless id>=16
             pages=iv(e,'pages')
             chk(pages.size==4,"Wrong cloned mob page count: #{mid} / #{id}")
             cond=iv(pages[1],'condition')
             chk(!iv(cond,'switch1_valid'),"Cloned mob already gated unexpectedly: #{mid} / #{id}")
             prior=iv(cond,'switch1_id')
             sid=5000+(mid-45)*100+id
             sv(cond,'switch1_valid',true)
             sv(cond,'switch1_id',sid)
             route=iv(iv(pages[0],'move_route'),'list')
             matches=route.select{|m|iv(m,'code')==45 && iv(m,'parameters').is_a?(Array) && iv(m,'parameters')[0].to_s.dup.force_encoding('UTF-8').scrub.match(/^범위\(10,\d+,1\)$/)}
             chk(matches.size==1,"No unique detection script: #{mid}/#{id}")
             old_script=iv(matches[0],'parameters')[0]
             chk(old_script.include?(prior.to_s),"Wrong old detection ID #{mid}/#{id}")
             iv(matches[0],'parameters')[0]="범위(10,#{sid},1)"
             death=iv(pages[3],'list')
             chk(death.count{|c|iv(c,'code')==202}==3,"Clone respawn changed #{mid}/#{id}")
             reset=death.find{|c|iv(c,'code')==123 && iv(c,'parameters')[0]=='A'}
             chk(!reset.nil?,"Missing original death switch reset #{mid}/#{id}")
             ins=RPG::EventCommand.allocate
             sv(ins,'code',121);sv(ins,'parameters',[sid,sid,1]);sv(ins,'indent',0)
             death.insert(death.index(reset),ins)
             changed<<{'eventID'=>id,'oldDetectionSwitch'=>prior,'newDetectionSwitch'=>sid,'route'=>iv(matches[0],'parameters')[0]}
           end
           chk(changed.length==(mid==45 ? 39 : 49),"Unexpected # cloned mobs #{mid}/#{changed.length}")
           originalIDs=previous.keys.select{|id|id<16}
           originalIDs.each{|id|chk(Marshal.dump(previous.fetch(id))==Marshal.dump(events.fetch(id)),"Existing original event changed #{mid}/#{id}")}
           # Map terrain/walls, existing 106 monster locations, respawn destinations, sprites and other fields unchanged.
           chk(Marshal.dump(iv(before,'data'))==Marshal.dump(iv(game,'data')),"Terrain edited #{mid}")
           events.each{|id,ev|chk([iv(ev,'x'),iv(ev,'y')]==[iv(previous.fetch(id),'x'),iv(previous.fetch(id),'y')],"Spawn moved #{mid}/#{id}")}
           if mid==46
             boss=events.fetch(13)
             chk([iv(boss,'x'),iv(boss,'y')]==[156,100],"Boss moved")
           end
           File.binwrite(path,Marshal.dump(game))
           details[mid]={'clonesGated'=>changed.length,'switches'=>changed,'unchangedEvents'=>events.length}
           clones+=changed.length
           puts "R46 map #{mid}: cloned aggro gates restored #{changed.length}, all existing original events/XY preserved"
          end
          chk(clones==88,"Wrong clone count")
          File.write(File.join(out,'r46-clone-gate-audit.json'),JSON.pretty_generate(details))
          R46_SOURCE
                    ruby -c /tmp/r46-map-events.rb
                    ruby /tmp/r46-map-events.rb site build

      - name: V229R46 Prepare first-acquisition LOS and ORIGINAL foreground-wall drawing
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r46-logic.rb <<'R46_SOURCE'
          # V229R46: initial sight check only, and foreground wall cover on native map art.
          # No perception reset when the actor leaves view. No player-opacity override.
          module SLTI_V229R46
            def self.monster?(character)
              return false unless character.is_a?(Game_Event)
              map_id=character.instance_variable_get(:@map_id)
              event=character.instance_variable_get(:@event)
              return false if event==nil
              event_id=event.id
              if map_id==45
                return [3,4,5,6,8,9,10,11,12].include?(event_id) || event_id>=16
              elsif map_id==46
                return [4,5,6,8,9,10,12,13,15].include?(event_id) || event_id>=16
              end
              return false
            end

            def self.edge?(map_id,x,y,direction)
              return SLTI_V229R44.allowed?(map_id,x,y,direction)
            end

            # Supercover between tile centers; a wall corner blocks diagonal acquisition.
            def self.clear_line?(map_id,ax,ay,bx,by)
              w=map_id==45 ? 288 : (map_id==46 ? 336 : 0)
              h=map_id==45 ? 144 : (map_id==46 ? 168 : 0)
              return false if w==0 || ax<0 || ay<0 || bx<0 || by<0 ||
                              ax>=w || bx>=w || ay>=h || by>=h
              edges=map_id==45 ? SLTI_V229R44::EDGES_45 : SLTI_V229R44::EDGES_46
              return false if edges[ay*w+ax,1].unpack('C')[0]==0 ||
                              edges[by*w+bx,1].unpack('C')[0]==0
              dx=(bx-ax).abs;dy=(by-ay).abs
              return true if dx==0 && dy==0
              sx=bx>ax ? 1 : -1; sy=by>ay ? 1 : -1
              hd=sx>0 ? 6 : 4; vd=sy>0 ? 2 : 8
              x=ax;y=ay;ix=0;iy=0
              while ix<dx || iy<dy
                a=(ix*2+1)*dy
                b=(iy*2+1)*dx
                if a==b
                  return false unless edge?(map_id,x,y,hd) && edge?(map_id,x,y,vd) &&
                                      edge?(map_id,x+sx,y,vd) && edge?(map_id,x,y+sy,hd)
                  x+=sx;y+=sy;ix+=1;iy+=1
                elsif a<b
                  return false unless edge?(map_id,x,y,hd)
                  x+=sx;ix+=1
                else
                  return false unless edge?(map_id,x,y,vd)
                  y+=sy;iy+=1
                end
              end
              return x==bx && y==by
            end
          end

          class Game_Character
            alias slti_r46_original_range 범위
            def 범위(distance,switch_id,mode)
              acquired=$game_switches[switch_id]==true
              activating=(mode==1 || mode=='온' || mode=='on')
              if activating && !acquired && SLTI_V229R46.monster?(self)
                # Only the FIRST detection requires a free line of sight.
                # Once detected, normal original pursuit/AI continues after a corner.
                return unless SLTI_V229R46.clear_line?($game_map.map_id,self.x,self.y,
                                                         $game_player.x,$game_player.y)
              end
              slti_r46_original_range(distance,switch_id,mode)
            end
          end

          class Game_Event
            alias slti_r46_original_initialize initialize
            def initialize(map_id,event)
              if (map_id==45 || map_id==46) && event.id>=16
                gate=event.pages[1].condition
                $game_switches[gate.switch1_id]=false if gate.switch1_valid
              end
              slti_r46_original_initialize(map_id,event)
            end
          end

          # The native Sanctuary panorama is an image beneath actors. Draw its original
          # wall pixels in a SMALL independent foreground Sprite only around the player;
          # fade WALL foreground, never the player. No extra panorama assets allocated.
          class Spriteset_Map
            alias slti_r46_original_initialize initialize
            def initialize
              @slti_wall_cover=nil
              slti_r46_original_initialize
              return unless @slti_floor==45 || @slti_floor==46
              @slti_wall_cover=Sprite.new(@viewport2)
              @slti_wall_cover.bitmap=Bitmap.new(160,192)
              @slti_wall_cover.visible=false
              @slti_wall_cover.z=1200
              @slti_wall_cover.opacity=148
              @slti_wall_key=nil
              @slti_wall_pending=true
            end

            alias slti_r46_original_update update
            def update
              slti_r46_original_update
              slti_r46_update_foreground_wall if @slti_wall_cover!=nil && $game_player!=nil
            end

            def slti_r46_update_foreground_wall
              px=$game_player.x;py=$game_player.y
              world_left=(px-2)*32;world_top=(py-4)*32
              scrollx=[$game_map.display_x.to_i/4,0].max
              scrolly=[$game_map.display_y.to_i/4,0].max
              cover=@slti_wall_cover
              cover.x=world_left-scrollx
              cover.y=world_top-scrolly
              key=[px,py]
              return if key==@slti_wall_key && !@slti_wall_pending
              bitmap=cover.bitmap
              bitmap.clear
              @slti_wall_key=key
              @slti_wall_pending=false
              copied=0
              # Limit to the player's actual sprite footprint (roughly 90x80 pixels).
              actor_left=px*32-42;actor_right=px*32+74
              actor_top=py*32-90;actor_bottom=py*32+32
              (py-4..py+1).each do |ty|
                next if ty<0 || ty>=$game_map.height
                (px-2..px+2).each do |tx|
                  next if tx<0 || tx>=$game_map.width
                  next unless $game_map.data[tx,ty,0]==385
                  x0=[tx*32,actor_left].max
                  y0=[ty*32,actor_top].max
                  x1=[tx*32+32,actor_right].min
                  y1=[ty*32+32,actor_bottom].min
                  next if x1<=x0 || y1<=y0
                  cx=x0/1024;cy=y0/1024
                  native=@slti_chunks[[cx,cy]]
                  if native==nil || native.bitmap==nil
                    @slti_wall_pending=true
                    next
                  end
                  dst=Rect.new(x0-world_left,y0-world_top,x1-x0,y1-y0)
                  # Original chunks render at 2x; 16 source pixels = 32 game pixels.
                  src=Rect.new((x0-cx*1024)/2,(y0-cy*1024)/2,
                               (x1-x0+1)/2,(y1-y0+1)/2)
                  bitmap.stretch_blt(dst,native.bitmap,src)
                  copied+=1
                end
              end
              cover.visible=copied>0
            end

            alias slti_r46_original_dispose dispose
            def dispose
              if @slti_wall_cover!=nil
                wall=@slti_wall_cover
                image=wall.bitmap
                wall.bitmap=nil
                wall.dispose
                image.dispose if image!=nil && !image.disposed?
                @slti_wall_cover=nil
              end
              slti_r46_original_dispose
            end
          end
          R46_SOURCE
                    ruby -c /tmp/r46-logic.rb

      - name: V229R46 Restore opaque player and insert ONLY sight and wall-cover changes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r46-patch-scripts.rb <<'R46_SOURCE'
          require 'digest';require 'zlib'
          source=ARGV.fetch(0); addonfile=ARGV.fetch(1); out=ARGV.fetch(2)
          path=File.join(source,'knight/gameasync/Data/Scripts.rxdata')
          actual=Digest::SHA256.file(path).hexdigest
          expected='82c10608c869bdb25dfd9056fa1e2c9c11d9071a682e45ba4428e5b48c11974f'
          raise "Wrong approved R44 scripts SHA #{actual}" unless actual==expected
          scripts=Marshal.load(File.binread(path));old=Marshal.load(File.binread(path))
          old21=Zlib::Inflate.inflate(scripts.fetch(21)[2]);raise 'R44 collision missing' unless old21.include?('module SLTI_V229R44')
          old28=Zlib::Inflate.inflate(scripts.fetch(28)[2]);old103=Zlib::Inflate.inflate(scripts.fetch(103)[2])
          old97=Zlib::Inflate.inflate(scripts.fetch(97)[2]);raise 'Original Panorama chunk renderer missing' unless old97.include?('def slti_update_terrain')
          # Entire old R44 player alpha block must go. Do not touch original sprite opacity.
          pattern=/# Original wall-front behavior: player translucent where a wall face\n# rises in front of the character\. Do not change enemies or other maps\.\nif @character == \$game_player &&\n   \(\$game_map\.map_id == 45 \|\| \$game_map\.map_id == 46\) &&\n   SLTI_V229R44\.wall_overlap\?\(\$game_map\.map_id,@character\.x,@character\.y\)\n  self\.opacity = 144 if self\.opacity > 144\nend\n/
          raise 'Incorrect old player transparency code' unless old28.scan(pattern).size==1
          fixed28=old28.sub(pattern,'')
          raise 'Player opacity still overridden' if fixed28.include?('SLTI_V229R44.wall_overlap?')
          raise 'Original character opacity missing' unless fixed28.include?('self.opacity = @character.opacity')
          addon=File.binread(addonfile)
          raise 'Unapproved deaggro code' if addon.include?('slti_r45_original_update') || addon.include?('move_toward_player')
          raise 'No native wall z-layer' unless addon.include?('cover.z=1200') && addon.include?('cover.opacity=148')
          raise 'No original sight interception' unless addon.dup.force_encoding('UTF-8').include?('alias slti_r46_original_range 범위')
          raise 'No panorama source' unless addon.include?('@slti_chunks')
          new103=old103+"\n"+addon
          scripts[28][2]=Zlib::Deflate.deflate(fixed28)
          scripts[103][2]=Zlib::Deflate.deflate(new103)
          scripts.each_index do |i|
            raise "Unexpected change to script #{i}" unless ([28,103].include?(i) || old[i]==scripts[i])
          end
          raise 'Collision script changed!' unless old[21]==scripts[21]
          raise 'Terrain renderer changed!' unless old[97]==scripts[97]
          File.binwrite(path,Marshal.dump(scripts))
          Dir.mkdir(out) unless Dir.exist?(out)
          File.binwrite(File.join(out,'r46-sprite28.rb'),fixed28)
          File.binwrite(File.join(out,'r46-script103.rb'),new103)
          File.binwrite(File.join(out,'r46-script21-unchanged.rb'),old21)
          File.binwrite(File.join(out,'r46-script97-unchanged.rb'),old97)
          puts 'PASS: player stays opaque, existing panorama & wall collision untouched; LOS + wall overlay in script103'
          R46_SOURCE
                    ruby -c /tmp/r46-patch-scripts.rb
                    ruby /tmp/r46-patch-scripts.rb site /tmp/r46-logic.rb build
                    ruby -c build/r46-script103.rb
                    ruby -c build/r46-sprite28.rb

      - name: V229R46 Test original walls, first sight, retained chase and wall-foreground sprites
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r46-smoke.rb <<'R46_SOURCE'
          require 'json'
          require 'zlib'
          require 'digest'
          module RPG
           class Map;end;class MapInfo;end;class AudioFile;end;class Tileset;end
           class Event;attr_reader :id,:name,:pages;class Page;attr_reader :condition;class Condition;attr_reader :switch1_valid,:switch1_id;end;class Graphic;end;end;end
           class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          class Table
           def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
           def _dump(d=0);@raw;end
           def [](x,y=0,z=0)
            _,w,h,depth,_=@raw.unpack('V5');return nil if x<0||y<0||x>=w||y>=h||z<0||z>=depth
            @raw.byteslice(20+2*(x+y*w+z*w*h),2).unpack('v')[0]
           end
          end
          class Tone
           def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
           def _dump(d=0);@raw;end
          end
          class Color<Tone;end
          class Game_Character
           attr_accessor :x,:y
           def move_toward_player; @moves=(@moves||0)+1;end
           def moves;@moves||0;end
          end
          class Game_Event<Game_Character
           def initialize(mid,event)
            @map_id=mid;@event=event;@x=event.instance_variable_get(:@x);@y=event.instance_variable_get(:@y)
           end
          end
          class MockMap
           attr_accessor :map_id,:display_x,:display_y,:width,:height,:data
           def initialize(mid,map)
            @map_id=mid;@data=map.instance_variable_get(:@data)
            @width=map.instance_variable_get(:@width);@height=map.instance_variable_get(:@height)
            @display_x=0;@display_y=0
           end
          end
          class Rect
           attr_reader :x,:y,:width,:height
           def initialize(x,y,w,h);@x=x;@y=y;@width=w;@height=h;end
          end
          class Bitmap
           attr_reader :blits
           def initialize(w,h);@w=w;@h=h;@blits=[];@disposed=false;end
           def clear;@blits=[];end
           def stretch_blt(dst,src,srcrect)
            raise 'wrong src' unless src.is_a?(Bitmap)
            raise 'Bad bitmap rect' unless srcrect.width>0 && srcrect.height>0
            @blits << [dst,srcrect]
           end
           def dispose;@disposed=true;end
           def disposed?;@disposed;end
          end
          class Sprite
           attr_accessor :bitmap,:visible,:x,:y,:z,:opacity
           def initialize(vp=nil);@visible=true;@disposed=false;end
           def dispose;@disposed=true;end
           def disposed?;@disposed;end
          end
          class Spriteset_Map
           def initialize
            @viewport2=Object.new
            @slti_floor=[45,46].include?($game_map.map_id) ? $game_map.map_id : nil
            @slti_chunks={}
           end
           def update;end
           def dispose;end
          end
          class Player
           attr_accessor :x,:y
           def initialize;@x=0;@y=0;end
          end
          $game_switches=Hash.new(false);$game_player=Player.new
          module SLTI_V229R44
           EDGES_45=File.binread('build/r44-map-45-edges.bin')
           EDGES_46=File.binread('build/r44-map-46-edges.bin')
           def self.allowed?(mid,x,y,dir)
            w=mid==45 ? 288 : (mid==46 ? 336 : 0)
            h=mid==45 ? 144 : (mid==46 ? 168 : 0)
            return false if x<0||y<0||x>=w||y>=h
            raw=mid==45 ? EDGES_45 : EDGES_46
            bit={8=>1,2=>2,4=>4,6=>8}[dir]
            return bit && (raw.getbyte(y*w+x)&bit)!=0
           end
          end
          raw=File.binread('build/r46-script103.rb').force_encoding('UTF-8')
          eval(raw,TOPLEVEL_BINDING,'OriginalRange+R46')
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO';root='site/knight/gameasync/Data/'
          count=0;gate_total=0;cover_total=0
          [45,46].each do |mid|
           path=root+pre+('Map%03d.rxdata'%mid)
           m=Marshal.load(File.binread(path));$game_map=MockMap.new(mid,m)
           w=$game_map.width;h=$game_map.height
           edges=mid==45 ? SLTI_V229R44::EDGES_45 : SLTI_V229R44::EDGES_46
           # LOS permits open nearest neighbors and denies shut nearest neighbors.
           h.times do |y|
            w.times do |x|
             k=y*w+x;next unless edges.getbyte(k)>0
             [[1,0,6],[-1,0,4],[0,1,2],[0,-1,8]].each do |dx,dy,dir|
              nx=x+dx;ny=y+dy
              next unless nx>=0&&ny>=0&&nx<w&&ny<h&&edges.getbyte(ny*w+nx)>0
              a=SLTI_V229R46.clear_line?(mid,x,y,nx,ny)
              b=SLTI_V229R44.allowed?(mid,x,y,dir)
              raise "Vision pass through wall #{mid}/#{x},#{y}" unless a==b
              count+=1
             end
            end
           end
           events=m.instance_variable_get(:@events)
           monsters=events.values.select{|e| name=e.instance_variable_get(:@name).to_s.dup.force_encoding('UTF-8').scrub;name.start_with?('[ID') && !name.include?('힐러')}
           raise "Wrong total monster events #{mid} #{monsters.size}" unless monsters.size==(mid==45 ? 48 : 58)
           clones=monsters.select{|e| e.instance_variable_get(:@id)>=16}
           raise 'Wrong clone count' unless clones.size==(mid==45 ? 39 : 49)
           clones.each do |e|
            id=e.instance_variable_get(:@id)
            cond=e.instance_variable_get(:@pages)[1].instance_variable_get(:@condition)
            sid=cond.instance_variable_get(:@switch1_id)
            raise 'Missing clone recognition gate' unless cond.instance_variable_get(:@switch1_valid)
            raise 'Gate not unique' unless sid==5000+(mid-45)*100+id
            $game_switches[sid]=true
            Game_Event.new(mid,e)
            raise 'Clone recognition switch not reset at MAP LOAD' if $game_switches[sid]
            gate_total+=1
           end
           # One real mob gets clear and blocked view candidates; original chase never cleared.
           candidate=nil
           for event in clones
            mob=Game_Event.new(mid,event)
            nearby_clear=nil;nearby_blocked=nil
            ((mob.y-8)..(mob.y+8)).each do |y|
             next unless y>=0&&y<h
             ((mob.x-8)..(mob.x+8)).each do |x|
              next unless x>=0&&x<w&& (x-mob.x).abs+(y-mob.y).abs<10 && (x!=mob.x||y!=mob.y)
              next if edges.getbyte(y*w+x)==0
              (SLTI_V229R46.clear_line?(mid,mob.x,mob.y,x,y) ? nearby_clear||=[x,y] : nearby_blocked||=[x,y])
             end
            end
            if nearby_clear&&nearby_blocked
             candidate=[mob,event,nearby_clear,nearby_blocked]
             break
            end
           end
           raise "No real monster LOS fixture #{mid}" if candidate.nil?
           mob,event,clear,blocked=candidate
           sid=event.instance_variable_get(:@pages)[1].instance_variable_get(:@condition).instance_variable_get(:@switch1_id)
           $game_player.x,$game_player.y=blocked
           mob.범위(10,sid,1)
           raise 'Acquired behind wall!' if $game_switches[sid]
           $game_player.x,$game_player.y=clear
           mob.범위(10,sid,1)
           raise 'Failed to acquire with sight' unless $game_switches[sid]
           $game_player.x,$game_player.y=blocked
           mob.범위(10,sid,1)
           raise 'Lost acquired aggro after corner!' unless $game_switches[sid]
           mob.move_toward_player
           raise 'Original pursuit was interrupted!' unless mob.moves==1
           # Native panorama chunk wall cover, not player transparency. Spot an actual wall.
           pxpy=nil
           h.times do |py|
            break unless pxpy.nil?
            w.times do |px|
             next if edges.getbyte(py*w+px)==0
             # Find actual wall in sprite footprint.
             wall=0
             ((py-3)..(py+1)).each do |ty|
              next if ty<0||ty>=h
              ((px-2)..(px+2)).each do |tx|
               next if tx<0||tx>=w
               wall+=1 if $game_map.data[tx,ty,0]==385
              end
             end
             if wall>=3 && px>=2 && py>=4 && px+2<w && py+1<h
              pxpy=[px,py];break
             end
            end
           end
           raise "No wall cover fixture #{mid}" if pxpy.nil?
           $game_player.x,$game_player.y=pxpy
           s=Spriteset_Map.new
           # simulate locally visible original, already loaded slti panorama chunks
           (pxpy[1]-4..pxpy[1]+1).each do |y|
            (pxpy[0]-2..pxpy[0]+2).each do |x|
             chunk=[x*32/1024,y*32/1024]
             s.instance_variable_get(:@slti_chunks)[chunk]=Sprite.new
             s.instance_variable_get(:@slti_chunks)[chunk].bitmap=Bitmap.new(512,512)
            end
           end
           s.update
           cover=s.instance_variable_get(:@slti_wall_cover)
           raise 'Wall cover not visible' unless cover.visible && cover.bitmap.blits.size>0
           raise 'Wall is not transparent!' unless cover.opacity==148
           raise 'Wrong cover z order' unless cover.z==1200
           raise 'No local memory bound' unless cover.bitmap.is_a?(Bitmap)
           raise 'R46 re-rendered after unchanged tile' if begin
            n=cover.bitmap.blits.size;s.update;cover.bitmap.blits.size!=n
           end
           cover_total+=cover.bitmap.blits.size
           s.dispose
           puts "PASS Map#{mid}: original LOS, initial gate only,  #{clones.size} clone switches, wall foreground #{cover_total} tiles"
          end
          raise "Expected 88 cloned events" unless gate_total==88
          raise 'Too few LOS graph checks' unless count>1000
          puts "PASS V229R46: #{count} edge LOS cases, 88 independent detection gates, persistent pursuit after sight loss, wall translucency on foreground not player"
          R46_SOURCE
                    ruby -c /tmp/r46-smoke.rb
                    ruby /tmp/r46-smoke.rb | tee build/r46-native-game-test.txt
                    test "$(grep -c '^PASS Map' build/r46-native-game-test.txt)" -eq 2

      - name: V229R46 Update only the three changed assets and visible version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'R46_MANIFEST'
          from pathlib import Path
          import hashlib,re
          site=Path('site');mapper=site/'knight/gameasync/mapping.js'
          contents=mapper.read_text('utf-8')
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          assets=['Data/Scripts.rxdata',f'Data/{pre}Map045.rxdata',f'Data/{pre}Map046.rxdata']
          for name in assets:
              path=site/'knight/gameasync'/name
              needle=name+'?h='
              pattern=re.escape(needle)+r'[0-9a-f]{32}'
              contents,num=re.subn(pattern,lambda _:needle+hashlib.md5(path.read_bytes()).hexdigest(),contents)
              assert num==1,(name,num)
          mapper.write_text(contents,'utf-8')
          for file in (site/'index.html',site/'knight/index.html'):
              original=file.read_text('utf-8')
              assert 'V229R44' in original,file
              file.write_text(original.replace('V229R44','V229R46').replace('v229r44','v229r46'),'utf-8')
          print('PASS: exact R46 map/script manifest and visible version')
          R46_MANIFEST
          node --check site/knight/gameasync/mapping.js

      - name: V229R46 Verify unchanged R44 collision and all 106 approved spawns
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'R46_FINAL'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before=json.loads(Path('build/r46-baseline.json').read_text('utf-8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert len(before)==len(after)==5472 and before.keys()==after.keys()
          changed={k for k in after if before[k]!=after[k]}
          pre='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          allowed={'index.html','knight/index.html','knight/gameasync/mapping.js',
                   'knight/gameasync/Data/Scripts.rxdata',pre+'Map045.rxdata',pre+'Map046.rxdata'}
          assert changed==allowed,('Unexpected changes',changed ^ allowed)
          assert 'V229R46' in (root/'index.html').read_text('utf-8')
          assert 'V229R46' in (root/'knight/index.html').read_text('utf-8')
          reports=json.loads(Path('build/r46-clone-gate-audit.json').read_text('utf-8'))
          assert sum(v['clonesGated'] for v in reports.values())==88
          test=Path('build/r46-native-game-test.txt').read_text('utf-8')
          assert 'persistent pursuit after sight loss' in test
          assert 'wall translucency on foreground not player' in test
          result={'version':'V229R46','source':'deployed V229R44 run 39598356143',
                  'changedGameFiles':sorted(changed),'monsterCount':106,
                  'isolatedCloneDetectionSwitches':88,
                  'boss':{'map':46,'eventID':13,'xy':[156,100]},
                  'collisionRuleChanged':False,'playerAlphaChanged':False,
                  'wallRenderedAsSmallForeground':True,
                  'firstRecognitionBlockedByWalls':True,
                  'aggroDroppedOnLostSight':False,'runtimeMobileVisualTested':False}
          Path('build/r46-integrity.json').write_text(json.dumps(result,indent=2))
          print('PASS: R46 keeps 106 original spawns, R44 movement, opaque hero, original chase and ONLY 6 approved files changed')
          R46_FINAL

      - name: V229R46 Upload real monster acquisition and wall foreground validation
        uses: actions/upload-artifact@v4
        with:
          name: SLKnight-V229R46-First-Acquisition-LOS-Translucent-Walls-106-Monsters
          path: |
            build/r46-clone-gate-audit.json
            build/r46-native-game-test.txt
            build/r46-integrity.json
          retention-days: 30
          if-no-files-found: error

      - name: V229R46 Upload the same original SLKnight to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
