          cat > player/js/dpad.js <<'JS'
          function simulateKeyEvent(type,keyCode,charCode){
            var e=document.createEventObject?document.createEventObject():document.createEvent('Events');
            if(e.initEvent)e.initEvent(type,true,true);
            e.keyCode=keyCode;e.which=keyCode;e.charCode=charCode||0;
            if(typeof JSEvents!=='undefined'&&JSEvents.eventHandlers&&JSEvents.eventHandlers.length){
              for(var i=0;i<JSEvents.eventHandlers.length;i++){
                var h=JSEvents.eventHandlers[i];
                if((h.target==Module['canvas']||h.target==window)&&h.eventTypeString==type)h.handlerFunc(e);
              }
            }else if(Module&&Module['canvas']){
              if(Module['canvas'].dispatchEvent)Module['canvas'].dispatchEvent(e);
              else Module['canvas'].fireEvent('on'+type,e);
            }
          }
          const held=new Set();
          function sendKey(key,down){
            if(down){
              if(held.has(key))return;
              held.add(key);simulateKeyEvent('keydown',key);
            }else{
              if(!held.has(key))return;
              held.delete(key);simulateKeyEvent('keyup',key);
            }
          }
          function releaseAll(){Array.from(held).forEach(function(k){sendKey(k,false);});}
          function isTouch(){return 'ontouchstart' in window||navigator.maxTouchPoints>0;}
          function resizeCanvas(){
            const c=document.getElementById('canvas');
            if(!c)return;
            if(window.innerHeight>window.innerWidth){c.style.height='unset';c.style.width='100%';}
            else{c.style.width='unset';c.style.height='100%';}
            layoutPadSoon();
          }
          function layoutPad(){
            const main=document.getElementById('main');
            const canvas=document.getElementById('canvas');
            const pad=document.getElementById('sl-pad');
            if(!main||!canvas||!pad)return;
            const mr=main.getBoundingClientRect();
            const cr=canvas.getBoundingClientRect();
            const gap=Math.max(0,mr.bottom-cr.bottom);
            const dock=window.innerHeight>window.innerWidth&&!document.fullscreenElement&&gap>=170;
            if(dock){
              const h=Math.min(280,Math.max(170,gap-16));
              pad.dataset.mode='dock';
              pad.style.left='0px';
              pad.style.top=(cr.bottom-mr.top)+'px';
              pad.style.width=mr.width+'px';
              pad.style.height=h+'px';
            }else{
              pad.dataset.mode='overlay';
              pad.style.left=(cr.left-mr.left)+'px';
              pad.style.top=(cr.top-mr.top)+'px';
              pad.style.width=cr.width+'px';
              pad.style.height=cr.height+'px';
            }
          }
          function layoutPadSoon(){
            requestAnimationFrame(function(){requestAnimationFrame(layoutPad);});
            setTimeout(layoutPad,100);
          }
          function holdButton(parent,id,label,key){
            const b=document.createElement('div');
            b.id=id;b.className='sl-btn';b.textContent=label;parent.appendChild(b);
            b.addEventListener('pointerdown',function(e){
              e.preventDefault();e.stopPropagation();
              try{b.setPointerCapture(e.pointerId);}catch(_){}
              b.classList.add('pressed');sendKey(key,true);
            });
            function up(e){
              if(e){e.preventDefault();e.stopPropagation();}
              b.classList.remove('pressed');sendKey(key,false);
            }
            b.addEventListener('pointerup',up);
            b.addEventListener('pointercancel',up);
            b.addEventListener('lostpointercapture',up);
          }
          function initSLTouchControls(){
            if(!isTouch()||document.getElementById('sl-pad'))return;
            const oldD=document.getElementById('dpad');
            const oldA=document.getElementById('apad');
            if(oldD)oldD.remove();
            if(oldA)oldA.remove();
            const main=document.getElementById('main');
            if(!main)return;
            if(getComputedStyle(main).position==='static')main.style.position='relative';
            const style=document.createElement('style');
            style.textContent=`
          #sl-pad{position:absolute;z-index:5000;pointer-events:none;user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden}
          #sl-joy-zone{position:absolute;pointer-events:auto;touch-action:none}
          #sl-joy-base{display:none;position:absolute;width:116px;height:116px;border-radius:50%;transform:translate(-50%,-50%);background:rgba(55,55,55,.34);border:2px solid rgba(255,255,255,.28);pointer-events:none}
          #sl-joy-knob{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;transform:translate(-50%,-50%);background:rgba(225,225,225,.55);border:2px solid rgba(255,255,255,.30)}
          .sl-btn{position:absolute;display:flex;align-items:center;justify-content:center;box-sizing:border-box;border-radius:50%;background:rgba(55,55,55,.46);border:2px solid rgba(255,255,255,.28);color:#fff;font:700 18px sans-serif;text-shadow:0 1px 2px #000;pointer-events:auto;touch-action:none}
          .sl-btn.pressed{background:rgba(225,225,225,.62);transform:scale(.94)}
          #sl-pad[data-mode="dock"] #sl-joy-zone{left:0;top:0;width:52%;height:100%}
          #sl-pad[data-mode="dock"] #sl-atk{right:7%;top:10%;width:96px;height:96px}
          #sl-pad[data-mode="dock"] #sl-cancel{right:25%;top:46%;width:64px;height:64px}
          #sl-pad[data-mode="overlay"] #sl-joy-zone{left:0;top:8%;width:52%;height:84%}
          #sl-pad[data-mode="overlay"] #sl-atk{right:6%;top:48%;width:96px;height:96px}
          #sl-pad[data-mode="overlay"] #sl-cancel{right:20%;top:67%;width:64px;height:64px}`;
            document.head.appendChild(style);
            const pad=document.createElement('div');pad.id='sl-pad';main.appendChild(pad);
            const zone=document.createElement('div');zone.id='sl-joy-zone';pad.appendChild(zone);
            const base=document.createElement('div');base.id='sl-joy-base';base.innerHTML='<div id="sl-joy-knob"></div>';pad.appendChild(base);
            const knob=base.firstElementChild;
            let pointer=null,ox=0,oy=0;
            const dirs={37:false,38:false,39:false,40:false};
            function setDir(key,on){
              if(dirs[key]===on)return;
              dirs[key]=on;sendKey(key,on);
            }
            function moveJoy(clientX,clientY){
              const rect=pad.getBoundingClientRect();
              let dx=clientX-rect.left-ox;
              let dy=clientY-rect.top-oy;
              const dist=Math.hypot(dx,dy);
              const max=38;
              const dead=12;
              let nx=dx,ny=dy;
              if(dist>max){nx=dx/dist*max;ny=dy/dist*max;}
              knob.style.transform='translate(calc(-50% + '+nx+'px),calc(-50% + '+ny+'px))';
              setDir(37,dx<-dead);setDir(39,dx>dead);setDir(38,dy<-dead);setDir(40,dy>dead);
            }
            function releaseJoy(){
              setDir(37,false);setDir(38,false);setDir(39,false);setDir(40,false);
              pointer=null;base.style.display='none';knob.style.transform='translate(-50%,-50%)';
            }
            zone.addEventListener('pointerdown',function(e){
              if(pointer!==null)return;
              e.preventDefault();e.stopPropagation();
              pointer=e.pointerId;
              const pr=pad.getBoundingClientRect();
              const zr=zone.getBoundingClientRect();
              ox=e.clientX-pr.left;oy=e.clientY-pr.top;
              const half=60;
              const minX=zr.left-pr.left+half;
              const maxX=zr.right-pr.left-half;
              const minY=zr.top-pr.top+half;
              const maxY=zr.bottom-pr.top-half;
              ox=Math.max(minX,Math.min(maxX,ox));
              oy=Math.max(minY,Math.min(maxY,oy));
              base.style.left=ox+'px';base.style.top=oy+'px';base.style.display='block';
              try{zone.setPointerCapture(pointer);}catch(_){}
              moveJoy(e.clientX,e.clientY);
            });
            zone.addEventListener('pointermove',function(e){
              if(e.pointerId!==pointer)return;
              e.preventDefault();e.stopPropagation();moveJoy(e.clientX,e.clientY);
            });
            zone.addEventListener('pointerup',function(e){
              if(e.pointerId!==pointer)return;
              e.preventDefault();e.stopPropagation();releaseJoy();
            });
            zone.addEventListener('pointercancel',releaseJoy);
            holdButton(pad,'sl-atk','ATK',67);
            holdButton(pad,'sl-cancel','X',88);
            layoutPadSoon();
            if(window.ResizeObserver){
              const ro=new ResizeObserver(layoutPadSoon);
              ro.observe(document.getElementById('canvas'));
              ro.observe(main);
              window.slPadResizeObserver=ro;
            }
            window.addEventListener('resize',layoutPadSoon);
            window.addEventListener('orientationchange',function(){setTimeout(function(){resizeCanvas();layoutPadSoon();},100);});
            document.addEventListener('fullscreenchange',function(){setTimeout(function(){resizeCanvas();layoutPadSoon();},100);});
            window.addEventListener('blur',function(){releaseJoy();releaseAll();});
            document.addEventListener('visibilitychange',function(){if(document.hidden){releaseJoy();releaseAll();}});
          }
          window.addEventListener('resize',resizeCanvas);
          window.addEventListener('load',function(){resizeCanvas();initSLTouchControls();});
          JS
          cat > player/js/sl-debug.js <<'JS'
          (function(){var M='sl_equip_debug_mark_v4',E='sl_equip_debug_err_v4';function G(k,d){try{return localStorage.getItem(k)||d}catch(x){return d}}function B(){var b=document.getElementById('sl-debug');if(b)return b;if(!document.body)return null;b=document.createElement('div');b.id='sl-debug';b.style='position:fixed;display:none;z-index:6500;pointer-events:none;box-sizing:border-box;height:28px;padding:5px 7px;border:1px solid rgba(110,255,160,.55);border-radius:4px;background:rgba(0,0,0,.82);color:#dcffe6;font:12px/16px monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;left:8px;max-width:340px';document.body.appendChild(b);return b}function P(){var b=B(),c=document.getElementById('canvas');if(!b||!c)return;var r=c.getBoundingClientRect(),y=Math.ceil(r.bottom)+8;if(document.fullscreenElement||window.innerHeight-y<28){b.style.display='none';return}b.style.top=y+'px';b.style.width=Math.min(340,window.innerWidth-16)+'px';b.style.display='block'}function R(){var b=B(),m=G(M,'NO MARK'),e=G(E,'');if(!b)return;b.textContent=m+(e?' | '+e:'');b.style.borderColor=e?'rgba(255,90,90,.85)':'rgba(110,255,160,.55)';b.style.color=e?'#ffd0d0':'#dcffe6';P()}function A(v){try{localStorage.setItem(M,v);localStorage.removeItem(E)}catch(x){}R()}function X(v){try{localStorage.setItem(E,v)}catch(x){}R()}var L=console.log.bind(console);console.log=function(){var a=[].slice.call(arguments),t=a.join(' '),i=t.indexOf('SLDBG|');if(i>=0){var p=t.slice(i).split('|');A((p[1]||'DBG')+(p.length>2?' | '+p.slice(2).join('|'):''))}if(/SLRUNTIMEERR|SLSCRIPTERR/.test(t))X('RUBY '+t.slice(0,100));L.apply(console,a)};window.addEventListener('error',function(e){X('JS '+(e.message||String(e.error)||'error'))});window.addEventListener('resize',P);window.addEventListener('orientationchange',function(){setTimeout(P,100)});document.addEventListener('fullscreenchange',function(){setTimeout(P,50)});window.addEventListener('load',function(){R()})})();
          JS
          ruby - player/index.html <<'RB'
          path=ARGV[0];html=File.read(path)
          bridge=<<'JS'
          <script>
          (function(){
            var ch={BGM:new Audio(),BGS:new Audio()},pending=[];
            ch.BGM.loop=true;ch.BGS.loop=true;
            function urlFor(n){
              var p=String(n||'').replace(/\\/g,'/').replace(/\.(ogg|mp3|wav|wma|aac|m4a|flac|mid|midi)$/i,'');
              return encodeURI('gameasync/'+p+'.ogg?v=v142i');
            }
            function safe(a){
              if(!a||!a.src)return;
              try{var p=a.play();if(p&&p.catch)p.catch(function(){if(pending.indexOf(a)<0)pending.push(a);});}
              catch(e){if(pending.indexOf(a)<0)pending.push(a);}
            }
            function retry(){var a=pending.slice();pending.length=0;a.forEach(safe);}
            ['touchstart','pointerdown','keydown','mousedown'].forEach(function(n){window.addEventListener(n,retry,{passive:true});});
            function stop(k){var a=ch[k];if(!a)return;a.pause();try{a.currentTime=0;}catch(e){}}
            function play(k,n,v,p){
              var a=ch[k];if(!a||!n)return;
              var u=urlFor(n);
              if(a.getAttribute('data-sl-src')!==u){a.pause();a.src=u;a.setAttribute('data-sl-src',u);a.load();}
              var gain=k==='BGS'?0.20:1;
              a.volume=Math.max(0,Math.min(1,Number(v||100)/100*gain));
              a.playbackRate=Math.max(.5,Math.min(1.5,Number(p||100)/100));
              safe(a);
            }
            function marker(t){
              var i=t.indexOf('SLAUDIO|');if(i<0)return;
              var p=t.slice(i).split('|'),cmd=p[1]||'',k=cmd.split('_')[0];
              if(/_PLAY$/.test(cmd))play(k,p.slice(2,-2).join('|'),p[p.length-2],p[p.length-1]);
              else if(/_STOP$/.test(cmd))stop(k);
              else if(/_FADE$/.test(cmd))setTimeout(function(){stop(k);},Number(p[2])||0);
            }
            function err(t){
              var p=document.getElementById('slerr');
              if(!p){
                p=document.createElement('pre');p.id='slerr';
                p.style='position:fixed;left:8px;top:8px;right:8px;max-height:70vh;overflow:auto;z-index:999999;background:#000;color:#fff;border:2px solid #d33;padding:10px;font:14px monospace;white-space:pre-wrap';
                document.body.appendChild(p);
              }
              p.textContent=String(t);
            }
            var log=console.log.bind(console);
            console.log=function(){
              var a=[].slice.call(arguments),t=a.join(' ');
              try{marker(t);}catch(e){log('SLAUDIOJSERR|'+e);}
              if(/SLRUNTIMEERR|SLSCRIPTERR/.test(t))err(t);
              log.apply(console,a);
            };
            window.addEventListener('error',function(e){err('JS ERROR | '+e.message);});
            window.slAudioBridge=ch;
          })();
          </script>
          JS
          html.sub!('<head>',"<head>\n#{bridge}") or abort 'head patch failed'
          pre=<<'JS'.strip
          preRun: [function(){
            createDummies();
            window.restoreLocalFilesBeforeRun();
            [['NanumGothic.ttf','gameasync/Fonts/NanumGothic.ttf?v=v142i'],['NanumGothicBold.ttf','gameasync/Fonts/NanumGothicBold.ttf?v=v142i']].forEach(function(x){
              var p='/game/Fonts/'+x[0];
