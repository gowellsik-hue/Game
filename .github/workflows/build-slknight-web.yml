name: build-slknight-web.yml | V4.9 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Restore V4.8 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45919348509
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Retrieve frozen original combat source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: e25068012e029a4d3704c8f9cb0afc683c99ce03
          path: frozen-v49
          persist-credentials: false
          fetch-depth: 1

      - name: Retrieve frozen startup correction
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: d66584ceb073a023e63e4b2a7bac0f9093edf594
          path: frozen-boot
          persist-credentials: false
          fetch-depth: 1

      - name: Verify frozen sources
        shell: bash
        run: |
          set -euo pipefail

          test "$(git -C frozen-v49 rev-parse HEAD)" = \
            "e25068012e029a4d3704c8f9cb0afc683c99ce03"

          test "$(git -C frozen-v49 rev-parse HEAD:.github/workflows/build-slknight-web.yml)" = \
            "afabbb2ae261596e670b1509d92c1d245aeca319"

          test "$(git -C frozen-boot rev-parse HEAD)" = \
            "d66584ceb073a023e63e4b2a7bac0f9093edf594"

          test "$(git -C frozen-boot rev-parse HEAD:.github/workflows/build-slknight-web.yml)" = \
            "923ce37bfd980ef9efc27bdf81fe1b6c3772d904"

          ruby -ryaml - <<'RUBY'
          source='frozen-boot/.github/workflows/build-slknight-web.yml'

          workflow=YAML.safe_load(
            File.read(source,encoding:'UTF-8')
          )

          steps=workflow.fetch('jobs').fetch('build').fetch('steps')

          wanted={
            'Verify and extract original patch steps'=>'extract',
            'Verify V4.8 baseline'=>'baseline',
            'Prepare original L1J monster traits'=>'traits',
            'Prepare original physical combat runtime'=>'runtime',
            'Separate monster data from startup compilation'=>'boot',
            'Apply corrected physical combat patch'=>'apply',
            'Merge traits into existing MonsterStats data'=>'merge',
            'Verify startup data access and combat runtime'=>'startup',
            'Update mapping verification for separated data'=>'mapping_prepare',
            'Update data mappings and version'=>'mapping',
            'Verify exact combat changes'=>'verify',
            'Verify final startup script and original engine'=>'final'
          }

          wanted.each do |name,key|
            matches=steps.select{|s|s['name']==name}

            raise "Missing source step #{name}" unless matches.size==1

            run=matches.first.fetch('run')

            raise "Empty source step #{name}" unless
              run.is_a?(String) && !run.empty?

            File.binwrite("/tmp/sl49-source-#{key}.sh",run)
          end

          puts 'PASS frozen source workflows'
          RUBY

          for name in extract baseline traits runtime boot apply merge startup mapping_prepare mapping verify final; do
            bash -n "/tmp/sl49-source-${name}.sh"
          done

      - name: Reconstruct corrected V4.9 from V4.8
        shell: bash
        run: |
          set -euo pipefail

          for name in extract baseline traits runtime boot apply merge startup mapping_prepare; do
            bash "/tmp/sl49-source-${name}.sh"
          done

      - name: Replace repeated combat eval with native interpreter execution
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl49-direct.rb <<'RUBY'
          # encoding: UTF-8
          require 'zlib'
          require 'json'
          require 'digest'

          module RPG
            %w[
              Map MapInfo Event EventCommand MoveRoute
              MoveCommand AudioFile CommonEvent Weapon
            ].each{|n|const_set(n,::Class.new)}

            Event.const_set(:Page,::Class.new)
            Event::Page.const_set(:Condition,::Class.new)
            Event::Page.const_set(:Graphic,::Class.new)
          end

          %w[Table Tone Color].each do |n|
            Object.const_set(n,Class.new do
              def self._load(raw)
                o=allocate
                o.instance_variable_set(:@raw,raw)
                o
              end

              def _dump(d)
                @raw
              end
            end)
          end

          def check(v,msg)
            raise msg unless v
          end

          def iv(o,k)
            o.instance_variable_get(k)
          end

          def utf(s)
            s.to_s.dup.force_encoding('UTF-8')
          end

          def once(s,a,b)
            check(s.scan(a).size==1,"Anchor #{a.inspect}")
            s.sub(a){b}
          end

          root=ARGV.fetch(0)
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          path=->(n){File.join(root,pre+n+'.rxdata')}

          counts=Hash.new(0)
          updates={}

          files=Dir.glob(
            path.call('Map[0-9][0-9][0-9]')
          ).sort+[path.call('CommonEvents')]

          check(files.size==47,'Map and CE count')

          files.each do |f|
            o=Marshal.load(File.binread(f))

            lists=if f.end_with?('CommonEvents.rxdata')
              o.compact.map{|e|iv(e,:@list)}
            else
              iv(o,:@events).values.flat_map do |e|
                iv(e,:@pages).map{|p|iv(p,:@list)}
              end
            end

            n=0

            lists.each do |list|
              list.each do |c|
                p=iv(c,:@parameters)
                code=iv(c,:@code)

                next unless [111,355].include?(code)

                s=code==355 ? p[0] :
                  p[0]==12 ? p[1] : nil

                next unless s.is_a?(String) &&
                  (s.include?('@sl49_') || s.include?('SL49.'))

                s=utf(s)

                out=nil
                new_code=code
                tag=nil

                if code==355
                  case s

                  when /\Aa=\$game_actors\[1\]; w=SL49\.weapon\(a\); @sl49_active=!w\.nil\?; if @sl49_active; @sl49_damage=SL49\.pc_attack\(a,(\d+),(\d+),w\); else; (\$game_variables\[334\]=a\.agi; )?\$game_variables\[335\]=(-?\d+)\+rand\((\d+)\); \$game_map\.need_refresh=true; end; true\z/

                    mid=$1.to_i
                    eid=$2.to_i
                    agi=!$3.nil?
                    lo=$4.to_i
                    span=$5.to_i

                    out=[
                      'SL49_PC_PREP',
                      mid,eid,agi,lo,span
                    ]

                    tag=:pc_prep

                  when /\ASL49\.apply_damage\((\d+),(\d+),(\d+),@sl49_damage\) if @sl49_active; @sl49_active=false; true\z/

                    out=[
                      'SL49_PC_DONE',
                      $1.to_i,$2.to_i,$3.to_i
                    ]

                    tag=:pc_done

                  when /\A@sl49_npc=SL49\.npc_context\(@event_id,@sl_attack_target,(\d+)\); if @sl49_npc; @sl49_nhit=SL49\.npc_hit\(@sl49_npc\); else; \$game_variables\[336\]=(-?\d+)\+rand\((\d+)\); \$game_map\.need_refresh=true; end; true\z/

                    out=[
                      'SL49_NPC_PREP',
                      $1.to_i,$2.to_i,$3.to_i
                    ]

                    tag=:npc_prep

                  when /\Aunless (@sl49_active|@sl49_npc); @parameters=(\[[\d, \-]+\]); command_122; end; true\z/

                    pc=$1=='@sl49_active'
                    legacy=JSON.parse($2)

                    check(
                      legacy.size>=5 &&
                      legacy.size<=6 &&
                      legacy.all?{|v|v.is_a?(Integer)},
                      'Legacy parameters'
                    )

                    out=legacy+[
                      pc ? :sl49_pc_legacy : :sl49_npc_legacy
                    ]

                    new_code=122
                    tag=pc ? :pc_legacy : :npc_legacy
                  end

                else

                  case s

                  when '@sl49_active ? !@sl49_damage.nil? : $game_variables[334] >= $game_variables[335]'

                    out=[49]
                    tag=:pc_hit

                  when '@sl49_npc ? @sl49_nhit : $game_variables[336] >= $game_variables[337]'

                    out=[50]
                    tag=:npc_hit

                  when 'if @sl49_npc; $game_variables[26]=SL49.npc_damage(@sl49_npc); end; $game_variables[26]<=0'

                    out=[51]
                    tag=:npc_zero
                  end

                end

                check(out,"Unrecognized V4.9 command #{s}")

                c.instance_variable_set(:@code,new_code)
                c.instance_variable_set(:@parameters,out)

                counts[tag]+=1
                n+=1
              end
            end

            updates[f]=o if n>0
          end

          expected={
            pc_prep:1696,
            pc_hit:1696,
            pc_done:1696,
            pc_legacy:6291,
            npc_prep:69,
            npc_hit:69,
            npc_zero:69,
            npc_legacy:203
          }

          check(counts==expected,"Coverage #{counts.inspect}")
          check(updates.size==36,'Data routes count')

          sp=File.join(root,'Scripts.rxdata')

          rows=Marshal.load(File.binread(sp))
          oldrows=rows.map{|r|Marshal.dump(r)}

          edit=lambda do |name,&block|
            r=rows.select{|x|x && utf(x[1])==name}

            check(r.size==1,name)

            r=r[0]

            old=utf(Zlib::Inflate.inflate(r[2]))
            s=old.gsub("\r\n","\n")

            t=block.call(s)

            RubyVM::InstructionSequence.compile(t)

            t=t.gsub("\n","\r\n") if old.include?("\r\n")

            check(t!=old,name)

            r[2]=Zlib::Deflate.deflate(t)
          end

          weapons=Marshal.load(
            File.binread(path.call('Weapons'))
          )

          edit.call('Interpreter 3') do |s|

            a=s.index("  WEAPONS={\n")
            b=s.index("\n  STR_HIT=",a||0)

            check(a && b,'Weapon table')

            original=s[a...b]

            specs=eval(original.split('=',2)[1])

            check(
              specs.is_a?(Hash) &&
              specs.size==27,
              'Original weapon definitions'
            )

            values=specs.values.uniq

            ids=[]
            missing=[]
            total=0

            weapons.each_with_index do |w,id|
              next if w.nil?

              total+=1

              name=utf(iv(w,:@name)).strip

              en=name[/^\+(\d+)\s+/,1].to_i

              base=name.sub(/^\+\d+\s+/,'')

              spec=specs[base]

              if spec
                ids<<[id,values.index(spec),en]
              else
                missing<<id
              end
            end

            check(
              ids.size+missing.size==total &&
              ids.map(&:first).uniq.size==ids.size,
              'Weapon ID coverage'
            )

            check(
              [170,1000,1001,1002].all?{
                |id|ids.any?{|r|r[0]==id}
              },
              'Starter weapon IDs'
            )

            direct={0=>[0,0,0,0,0,'','bare',0,0]}

            ids.each do |id,index,en|
              direct[id]=values[index]+[en]
            end

            weapons.each_with_index do |w,id|

              if w.nil?
                expected=direct[0]
                actual=direct[0]
              else
                name=utf(iv(w,:@name)).strip
                en=name[/^\+(\d+)\s+/,1].to_i
                base=name.sub(/^\+\d+\s+/,'')
                spec=specs[base]

                expected=spec && spec+[en]
                actual=direct[id]
              end

              check(
                actual==expected,
                "Weapon lookup #{id}"
              )
            end

            table=
              "  WEAPON_SPECS=#{values.inspect}\n"+
              "  WEAPON_IDS={0=>[0,0,0,0,0,'','bare',0,0]}\n"+
              "  #{ids.inspect}.each{|r| WEAPON_IDS[r[0]]=WEAPON_SPECS[r[1]]+[r[2]]}\n"

            s=s[0...a]+table+s[b..-1]

            old=s[/  def self\.weapon\(a\)\n.*?\n  end\n/m]

            check(
              old && old.include?('WEAPONS[name]'),
              'Weapon lookup source'
            )

            s=once(
              s,
              old,
              <<~'SRC'.gsub(/^/,'  ')
              def self.weapon(a)
                return WEAPON_IDS[0] if $data_weapons[a.weapon_id].nil?
                WEAPON_IDS[a.weapon_id]
              end
            SRC
            )

            old="    when 12  # \uc2a4\ud06c\ub9bd\ud2b8\n      result = eval(@parameters[1])"

            new=<<~'SRC'.chomp.gsub(/^/,'    ')
            when 49
              result = @sl49_active ? !@sl49_damage.nil? : $game_variables[334] >= $game_variables[335]
            when 50
              result = @sl49_npc ? @sl49_nhit : $game_variables[336] >= $game_variables[337]
            when 51
              $game_variables[26]=SL49.npc_damage(@sl49_npc) if @sl49_npc
              result = $game_variables[26]<=0
            SRC

            s=once(s,old,new+"\n"+old)

            check(
              s.bytesize<=32000,
              "Interpreter 3 size #{s.bytesize}"
            )

            puts "PASS weapon IDs #{ids.size}/#{total}"
            puts "PASS original fallback IDs #{missing.size}"
            puts "PASS #{weapons.size} equivalent weapon lookups"
            puts "PASS Interpreter 3 bytes #{s.bytesize}"

            s
          end

          edit.call('Interpreter 4') do |s|

            a="  def command_122\n"

            once(
              s,
              a,
              a+<<~'SRC'.gsub(/^/,'    ')
              return true if @sl49_active && @parameters[-1]==:sl49_pc_legacy
              return true if @sl49_npc && @parameters[-1]==:sl49_npc_legacy
            SRC
            )
          end

          edit.call('Interpreter 7') do |s|

            a="  def command_355\n"

            once(
              s,
              a,
              a+<<~'SRC'.gsub(/^/,'    ')
              case @parameters[0]
              when 'SL49_PC_PREP'
                a=$game_actors[1]
                w=SL49.weapon(a)
                @sl49_active=!w.nil?

                if @sl49_active
                  @sl49_damage=SL49.pc_attack(
                    a,@parameters[1],@parameters[2],w
                  )
                else
                  $game_variables[334]=a.agi if @parameters[3]

                  $game_variables[335]=
                    @parameters[4]+rand(@parameters[5])

                  $game_map.need_refresh=true
                end

                return true

              when 'SL49_PC_DONE'

                SL49.apply_damage(
                  @parameters[1],
                  @parameters[2],
                  @parameters[3],
                  @sl49_damage
                ) if @sl49_active

                @sl49_active=false

                return true

              when 'SL49_NPC_PREP'

                @sl49_npc=SL49.npc_context(
                  @event_id,
                  @sl_attack_target,
                  @parameters[1]
                )

                if @sl49_npc
                  @sl49_nhit=SL49.npc_hit(@sl49_npc)
                else
                  $game_variables[336]=
                    @parameters[2]+rand(@parameters[3])

                  $game_map.need_refresh=true
                end

                return true
              end
            SRC
            )
          end

          check(
            rows.each_index.select{
              |i|Marshal.dump(rows[i])!=oldrows[i]
            }.map{
              |i|utf(rows[i][1])
            }.sort==
            [
              'Interpreter 3',
              'Interpreter 4',
              'Interpreter 7'
            ],
            'Script scope'
          )

          updates[sp]=rows

          check(updates.size==37,'Optimized file count')

          updates.each do |f,o|
            raw=Marshal.dump(o)

            File.binwrite(f,raw)

            check(
              Marshal.dump(
                Marshal.load(File.binread(f))
              )==raw,
              "Roundtrip #{f}"
            )
          end

          puts "PASS direct event routes #{counts.inspect}"
          puts "PASS #{counts.values.sum} combat eval sites removed"
          RUBY

          ruby -c /tmp/sl49-direct.rb

          ruby /tmp/sl49-direct.rb site/knight/gameasync/Data

      - name: Verify all optimized combat command routes
        shell: bash
        run: |
          set -euo pipefail

          ruby -rzlib -rjson - <<'RUBY'
          # encoding: UTF-8

          module RPG
            %w[
              Map MapInfo Event EventCommand MoveRoute
              MoveCommand AudioFile CommonEvent
            ].each{|n|const_set(n,::Class.new)}

            Event.const_set(:Page,::Class.new)
            Event::Page.const_set(:Condition,::Class.new)
            Event::Page.const_set(:Graphic,::Class.new)
          end

          %w[Table Tone Color].each do |n|
            Object.const_set(n,Class.new do
              def self._load(raw)
                o=allocate
                o.instance_variable_set(:@raw,raw)
                o
              end

              def _dump(d)
                @raw
              end
            end)
          end

          def iv(o,k)
            o.instance_variable_get(k)
          end

          root='site/knight/gameasync/Data'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          files=Dir.glob(
            File.join(root,pre+'Map[0-9][0-9][0-9].rxdata')
          ).sort

          files<<File.join(root,pre+'CommonEvents.rxdata')

          raise 'Data count' unless files.size==47

          counts=Hash.new(0)

          files.each do |f|
            o=Marshal.load(File.binread(f))

            lists=if f.end_with?('CommonEvents.rxdata')
              o.compact.map{|e|iv(e,:@list)}
            else
              iv(o,:@events).values.flat_map do |e|
                iv(e,:@pages).map{|p|iv(p,:@list)}
              end
            end

            lists.each do |list|
              list.each do |c|
                p=iv(c,:@parameters)

                case iv(c,:@code)

                when 355

                  case p[0]
                  when 'SL49_PC_PREP'
                    raise 'PC prep parameters' unless p.size==6
                    counts[:pc_prep]+=1

                  when 'SL49_PC_DONE'
                    raise 'PC done parameters' unless p.size==4
                    counts[:pc_done]+=1

                  when 'SL49_NPC_PREP'
                    raise 'NPC prep parameters' unless p.size==4
                    counts[:npc_prep]+=1

                  else
                    if p[0].is_a?(String) &&
                      (
                        p[0].include?('@sl49_') ||
                        p[0].include?('SL49.')
                      )
                      raise 'Repeated combat script remains'
                    end
                  end

                when 111

                  case p[0]

                  when 49
                    counts[:pc_hit]+=1

                  when 50
                    counts[:npc_hit]+=1

                  when 51
                    counts[:npc_zero]+=1

                  when 12
                    if p[1].is_a?(String) &&
                      (
                        p[1].include?('@sl49_') ||
                        p[1].include?('SL49.')
                      )
                      raise 'Repeated combat condition remains'
                    end
                  end

                when 122

                  case p[-1]

                  when :sl49_pc_legacy
                    counts[:pc_legacy]+=1

                  when :sl49_npc_legacy
                    counts[:npc_legacy]+=1
                  end
                end
              end
            end
          end

          expected={
            pc_prep:1696,
            pc_hit:1696,
            pc_done:1696,
            pc_legacy:6291,
            npc_prep:69,
            npc_hit:69,
            npc_zero:69,
            npc_legacy:203
          }

          raise counts.inspect unless counts==expected

          rows=Marshal.load(
            File.binread(File.join(root,'Scripts.rxdata'))
          )

          ['Interpreter 3','Interpreter 4','Interpreter 7'].each do |name|

            selected=rows.select{
              |r|r && r[1].to_s.dup.force_encoding('UTF-8')==name
            }

            raise name unless selected.size==1

            src=Zlib::Inflate.inflate(
              selected.first[2]
            ).force_encoding('UTF-8')

            RubyVM::InstructionSequence.compile(src)

            if name=='Interpreter 3'
              raise 'Startup script size' if src.bytesize>32000

              raise 'Embedded monster tables' if
                src.include?('TRAITS=') ||
                src.include?('STATS=')

              raise 'Weapon ID table missing' unless
                src.include?('WEAPON_IDS[a.weapon_id]')
            end
          end

          puts 'PASS 1696 direct PC attack branches'
          puts 'PASS 69 direct NPC attack routes'
          puts 'PASS 6494 restored numeric commands'
          puts 'PASS no additional combat eval strings'
          puts 'PASS original startup data separation'
          RUBY

      - name: Update final data mappings
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/sl49-source-mapping.sh

      - name: Verify exact approved changes
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/sl49-source-verify.sh
          bash /tmp/sl49-source-final.sh

      - name: Upload V4.9 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
