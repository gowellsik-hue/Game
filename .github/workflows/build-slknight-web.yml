name: build-slknight-web.yml | V4.14 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Restore V4.13 original
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45953980268
          name: github-pages
          github-token: ${{ github.token }}
          path: original

      - name: Restore V4.14 candidate
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45987745324
          name: github-pages
          github-token: ${{ github.token }}
          path: candidate

      - name: Extract complete original runtime and loading paths
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p audit

          python3 - <<'PY'
          from pathlib import Path
          import tarfile
          import hashlib
          import json
          import struct

          root=Path('audit')
          manifests={}

          for version,folder in [
              ('V4.13','original'),
              ('V4.14','candidate')
          ]:
              out=root/version
              out.mkdir()

              manifest={}
              packs={}

              archive=Path(folder)/'artifact.tar'
              assert archive.is_file()

              with tarfile.open(archive,'r:*') as tar:
                  for entry in tar:
                      if not entry.isfile():
                          continue

                      name=entry.name
                      while name.startswith('./'):
                          name=name[2:]

                      path=Path(name)

                      assert not path.is_absolute()
                      assert '..' not in path.parts
                      assert name not in manifest

                      manifest[name]=entry.size

                      if not name.startswith('knight/'):
                          continue

                      suffix=path.suffix.lower()

                      if suffix=='.pack':
                          f=tar.extractfile(entry)
                          header=f.read(4)

                          assert len(header)==4

                          size=struct.unpack('<I',header)[0]
                          assert 0<size<=entry.size-4

                          index=json.loads(
                              f.read(size).decode('utf8')
                          )

                          packs[name]=index

                          continue

                      if (
                          suffix in [
                              '.js','.html','.ini','.rb','.json'
                          ]
                          or path.name=='Scripts.rxdata'
                      ):
                          raw=tar.extractfile(entry).read()

                          target=out/path
                          target.parent.mkdir(
                              parents=True,
                              exist_ok=True
                          )

                          target.write_bytes(raw)

              assert len(manifest)==6085

              script=out/'knight/gameasync/Data/Scripts.rxdata'
              mapper=out/'knight/gameasync/mapping.js'
              loader=out/'knight/js/sl-assets-v229r115.js'
              page=out/'knight/index.html'
              ini=out/'knight/gameasync/Game.ini'

              for p in [script,mapper,loader,page,ini]:
                  assert p.is_file(),str(p)

              digest=hashlib.md5(
                  script.read_bytes()
              ).hexdigest()

              print(version,'Scripts MD5',digest)

              print(
                  version,
                  'Scripts mapping matches:',
                  'Data/Scripts.rxdata?h='+digest
                  in mapper.read_text('utf8')
              )

              (out/'manifest.json').write_text(
                  json.dumps(
                      manifest,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding='utf8'
              )

              (out/'pack-indexes.json').write_text(
                  json.dumps(
                      packs,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding='utf8'
              )

              manifests[version]=manifest

              print(version,'files:',len(manifest))
              print(version,'packs:',len(packs))

              for name,index in packs.items():
                  for row in index.get('files',[]):
                      if 'scripts.rxdata' in str(row).lower():
                          print('SCRIPT PACK REFERENCE',name,row)

              for p in [ini,page,mapper,loader]:
                  text=p.read_text(
                      'utf8',
                      errors='replace'
                  )

                  for i,line in enumerate(text.splitlines(),1):
                      if any(
                          word in line.lower()
                          for word in [
                              'scripts.rxdata',
                              'mapping.js',
                              'fileasynccache',
                              'localforage',
                              'game.ini'
                          ]
                      ):
                          print(
                              version,
                              p.name,
                              i,
                              line[:1000]
                          )

          assert set(manifests['V4.13'])==set(
              manifests['V4.14']
          )

          print('PASS original file inventory')
          PY

      - name: Extract and compare all 137 Ruby scripts
        shell: bash
        run: |
          set -euo pipefail

          ruby -rzlib -rdigest -rjson - <<'RUBY'
          # encoding: UTF-8

          versions=['V4.13','V4.14']
          sources={}

          versions.each do |version|
            root=File.join('audit',version)

            path=File.join(
              root,
              'knight/gameasync/Data/Scripts.rxdata'
            )

            rows=Marshal.load(File.binread(path))

            raise "Script count #{rows.size}" unless rows.size==137

            directory=File.join(root,'ruby')
            Dir.mkdir(directory)

            sources[version]=[]

            rows.each_with_index do |row,i|
              name=row[1].to_s.dup.force_encoding('UTF-8')

              source=Zlib::Inflate.inflate(
                row[2]
              ).force_encoding('UTF-8')

              raise "Encoding #{i}" unless source.valid_encoding?

              filename=format('%03d.rb',i)

              File.write(
                File.join(directory,filename),
                source,
                encoding:'UTF-8'
              )

              sources[version]<<[name,source]

              puts [
                version,
                i,
                name,
                source.bytesize,
                Digest::SHA256.hexdigest(source)
              ].join(' | ')

              source.each_line.with_index(1) do |line,n|
                if line.match?(
                  /메세지|Window_Help2|set_text2|Guage|캐릭터는 또 다른 나|SL414|sl_native_skill_icons|main_update_loop|web_pre_update/
                )
                  puts "#{version} #{i}:#{n} #{line}"
                end
              end
            end

            File.write(
              File.join(root,'script-names.json'),
              JSON.pretty_generate(
                sources[version].map(&:first)
              )
            )

            puts "PASS #{version}: all 137 scripts"
          end

          changed=(0...137).select do |i|
            sources['V4.13'][i]!=sources['V4.14'][i]
          end

          puts "CHANGED SCRIPTS: #{changed.inspect}"

          expected=[26,42,43,71,78,80,81,93,100,127,130]

          raise 'Unexpected changes' unless changed==expected

          versions.each do |version|
            sources[version].each_with_index do |entry,i|
              name,source=entry

              relevant=
                [78,100,127,130].include?(i) ||
                name=='Main' ||
                source.include?('class Window_Help2') ||
                source.include?('$메세지 =') ||
                source.include?('def set_text2')

              next unless relevant

              puts "BEGIN #{version} #{i} #{name}"
              puts source
              puts "END #{version} #{i} #{name}"
            end
          end

          puts 'PASS complete runtime extraction'
          RUBY

      - name: Upload original runtime audit
        uses: actions/upload-artifact@v4
        with:
          name: sl414-original-runtime-audit
          path: audit
          retention-days: 30
