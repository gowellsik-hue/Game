# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R114
# BASE: verified deployed V229R111, run 40523152040 (R112 failed; do not use it).
# MAP ACTIONS: bundle event graphics and their attack/hit/death/motion variants
#              for each of the actual 46 maps; include map-specific floor/walls.
# INVENTORY: stage 395 existing icon bytes at boot without setting decoded flags.
# LOADING: stage bytes in JS transport cache only; native PNG decoder remains in use.
# KEEP: exact R111 Scripts.rxdata, Map045/046, S32 movement, doors, NPCs,
#       monster positions, shifted original art, 4-way pad, other game files.
name: build-slknight-web.yml | V229R114 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R114 Restore exact deployed R111
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40523152040
          name: github-pages
          github-token: ${{ github.token }}
          path: r111

      - name: V229R114 Verify untouched R111 original game
        shell: bash
        run: |
          set -euo pipefail
          test -s r111/artifact.tar
          rm -rf site
          mkdir -p site build
          tar -xf r111/artifact.tar -C site
          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert len(files)==5517,('Wrong R111 baseline count',len(files))
          expected={
            'knight/js/drive.js':'833a13026929d62d24a5ad645a8af764511fe40584ebefcf5d1b3251d9a35573',
            'knight/js/dpad.js':'2bd401adf130339d154ce6a8efd0127cefd9b1bc58bc60d1de68e8b6d8b7a791',
            'knight/gameasync/Data/Scripts.rxdata':'e7cc01b36ad7edc18d8026854f4ae37932ebadb74e54d2b43ab47cc6ae112aee',
            'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap045.rxdata':'f47de87af6b4e607bf632818a711619dc8ca4e747196a123a76ac7db8ffc3ba6',
            'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap046.rxdata':'dc89d908f5247442e08dddc11f5bcf6505a77890bd82ab59b790e00e3e5f024c'}
          for path,sha in expected.items():assert files[path]==sha,('Wrong R111 file',path)
          for path in ('index.html','knight/index.html'):
            assert 'V229R111' in (root/path).read_text('utf8')
          Path('build/before.json').write_text(json.dumps(files,sort_keys=True))
          print('PASS deployed R111: 5517 files, original dpad, map collision and engine')
          PY_BASE

      - name: V229R114 Pack map actions and inventory icons; update loader
        shell: bash
        run: |
          set -euo pipefail
          cat > build/export_maps.rb <<'R114_MAPS'
          require 'json'
          module RPG
            class Map;end; class MapInfo;end; class AudioFile;end; class Tileset;end
            class Event
              class Page
                class Condition;end;class Graphic;end
              end
            end
            class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          class Tone;def self._load(x);nil;end;end
          class Color;def self._load(x);nil;end;end
          class Table;def self._load(x);nil;end;end
          root=ARGV.fetch(0)
          base='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          info=Marshal.load(File.binread("#{root}/#{base}MapInfos.rxdata"))
          tilesets=Marshal.load(File.binread("#{root}/#{base}Tilesets.rxdata"))
          result={}
          def text(x)
           x.is_a?(String) ? x.dup.force_encoding('UTF-8').scrub : nil
          end
          def strings(obj,out)
           case obj
           when String
            out << text(obj)
           when Array
            obj.each{|x|strings(x,out)}
           end
          end
          info.keys.sort.each do |mid|
           file=sprintf('%s/%sMap%03d.rxdata',root,base,mid)
           next unless File.file?(file)
           map=Marshal.load(File.binread(file))
           graphics=[];events=[];scripts=[]
           (map.instance_variable_get(:@events)||{}).each_value do |ev|
            name=text(ev.instance_variable_get(:@name))
            events<<name if name && !name.empty?
            (ev.instance_variable_get(:@pages)||[]).each do |page|
             graphic=page.instance_variable_get(:@graphic)
             if graphic
              cn=text(graphic.instance_variable_get(:@character_name))
              graphics<<cn if cn && !cn.empty?
             end
             (page.instance_variable_get(:@list)||[]).each do |cmd|
              code=cmd.instance_variable_get(:@code)
              params=cmd.instance_variable_get(:@parameters)
              if [41,231,232,207,355,655].include?(code)
                strings(params,scripts)
              end
             end
             route=page.instance_variable_get(:@move_route)
             if route
               (route.instance_variable_get(:@list)||[]).each do |mv|
                 if mv.instance_variable_get(:@code)==41
                   strings(mv.instance_variable_get(:@parameters),graphics)
                 end
               end
             end
            end
           end
           tileset=tilesets[map.instance_variable_get(:@tileset_id)]
           tileset_files=[]
           if tileset
            tileset_files += [text(tileset.instance_variable_get(:@tileset_name)),text(tileset.instance_variable_get(:@fog_name)),text(tileset.instance_variable_get(:@panorama_name))]
            tileset_files += (tileset.instance_variable_get(:@autotile_names)||[]).map{|v|text(v)}
           end
           result[mid]={name:text(info[mid].instance_variable_get(:@name)),graphics:graphics.uniq.sort,events:events.uniq.sort,scripts:scripts.uniq.sort,terrain:tileset_files.compact.reject(&:empty?).uniq}
          end
          STDOUT.write(JSON.generate(result))
          R114_MAPS
          cat > build/pack_assets.py <<'R114_PACKS'
          from pathlib import Path
          import collections, json, re, struct, os, hashlib, sys
          root=Path(sys.argv[1])
          base=root/'knight/gameasync'
          assets=root/'knight/assets'; assets.mkdir(exist_ok=True)
          lines=(base/'mapping.js').read_text(encoding='utf8').splitlines()
          source={}
          for l in lines:
              if l.startswith('["'):
                  try: k,v=json.loads(l.rstrip(','))
                  except ValueError:continue
                  if '?' in v and not v.endswith('h='):source[k]=v.split('?',1)[0]

          def norm(x):return re.sub(r'[\s_\-\.]+','',x.casefold())

          def key_name(k):
              return norm(k.rsplit('/',1)[-1])

          by_cat=collections.defaultdict(dict)
          for k,v in source.items():
              prefix=k.split('/',1)[0]+'/'+k.split('/',2)[1] if k.count('/')>=1 else k
              by_cat[prefix][k]=v

          def kfrom(cat,name):
              k=(cat+'/'+name).casefold()
              return k if k in source else None

          # A page's character graphic is the declared identity; collect all action variants
          # with that full identity, including attack, hit, death and directional images.
          def shorten(name):
              x=norm(name)
              for suffix in ['죽음캐릭터','죽음모션','좌표','죽음','사망','피격','맞음','공격','이동','대기','모션','창']:
                  if x.endswith(suffix) and len(x)>len(suffix):
                      x=x[:-len(suffix)]
                      break
              return x

          info=json.loads(Path(sys.argv[2]).read_text(encoding='utf8'))
          indices={}
          reports=[]
          for mid,rec in info.items():
              names=set(rec['graphics'])
              for e in rec['events']:
                  if e.startswith('[ID'):
                      # Some event names include a trailing bracket, some do not.
                      n=e[3:].split(']')[0].strip()
                      if n:names.add(n)
              stems={shorten(name) for name in names if name}
              stems={s for s in stems if s and not s.isnumeric()}
              keys=set()
              direct_missing=[]
              for name in rec['graphics']:
                  k=kfrom('graphics/characters',name)
                  if k:keys.add(k)
                  else:direct_missing.append(name)
              for cat in ['graphics/characters','graphics/animations','graphics/pictures','audio/se']:
                  for k in by_cat.get(cat,{}):
                      n=key_name(k)
                      if any(n.startswith(s) for s in stems): keys.add(k)
              # Exact asset names passed by event scripts for Change Graphic, Show Picture etc.
              for s in rec['scripts']:
                  for cat in ['graphics/characters','graphics/animations','graphics/pictures']:
                      k=kfrom(cat,s)
                      if k:keys.add(k)
              # The map's actual tileset and fog/autotiles are also map-scoped.
              for n in rec['terrain']:
                  for cat in ['graphics/tilesets','graphics/fogs','graphics/panoramas','graphics/autotiles']:
                      k=kfrom(cat,n)
                      if k:keys.add(k)
              if mid in ['45','46']:
                  keys|={k for k in source if re.match(r'^graphics/panoramas/slti_'+mid+r'_(c\d+_\d+|w_c\d+_\d+)$',k)}
              keys=sorted(keys)
              assert keys,mid
              reports.append((int(mid),rec['name'],len(keys),sum((base/source[k]).stat().st_size for k in keys),len(direct_missing),direct_missing))
              indices[mid]=keys

          def pack(kind,mid,keys,filename):
              rows=[];payload=[];offset=0
              for k in keys:
                  path=base/source[k]
                  assert path.is_file(),(k,path)
                  data=path.read_bytes()
                  assert len(data)>4,(k,len(data))
                  if source[k].lower().endswith('.png'):assert data[:8]==b'\x89PNG\r\n\x1a\n',k
                  rows.append([k,offset,len(data)])
                  payload.append(data);offset+=len(data)
              header=json.dumps({'kind':kind,'map_id':mid,'files':rows},ensure_ascii=False,separators=(',',':')).encode('utf8')
              f=assets/filename
              f.write_bytes(struct.pack('<I',len(header))+header+b''.join(payload))
              return f, len(rows), len(header),sum(map(len,payload))

          for mid,keys in indices.items():
              f,*_ =pack('map',int(mid),keys,f'map-{int(mid):03d}-v229r114.pack')

          icon_keys=sorted(k for k in source if k.startswith('graphics/icons/'))
          assert len(icon_keys)==395,len(icon_keys)
          icons=pack('icons',None,icon_keys,'icons-v229r114.pack')
          Path(sys.argv[3]).write_text(json.dumps({'map_counts':{str(a):[b,c,d,missing] for a,b,c,d,missing,miss in reports},'icons':icons[1],'total_pack_bytes':sum(p.stat().st_size for p in assets.iterdir())},ensure_ascii=False,indent=2))
          print('ICONS',icons[1],icons[0].stat().st_size)
          print('PACKS',len(indices),'TOTAL',sum(p.stat().st_size for p in assets.iterdir()))
          for a,b,c,d,missing,miss in reports:
           if a in (29,45,46):print(f'MAP {a} {b}: assets={c} size={d/1024/1024:.2f}MiB missing_char={missing} {miss[:9]}')
          print('missing events total',sum(x[4] for x in reports))
          R114_PACKS
          cat > build/sl-assets-v229r114.js <<'R114_RUNTIME'
          // V229R114: transport cache only. Never write PNGs to Emscripten FS here.
          // The original drive.js must call createPreloadedFile and complete decode.
          (function(){
            'use strict';
            var staged=Object.create(null), mapStates=Object.create(null);
            var originalGet=window.getLazyAsset;
            if(typeof originalGet!=='function')throw new Error('R114 requires native drive.js');
            window.getLazyAsset=function(url,filename,callback,noretry){
              var clean=String(url).replace(/^gameasync\//,'').split('?')[0].toLowerCase();
              var bytes=staged[clean];
              if(bytes){callback(bytes);return;}
              return originalGet.apply(this,arguments);
            };
            function label(text){
              var el=document.getElementById('sl-build-version');
              if(el)el.textContent='V229R114'+(text?' | '+text:'');
            }
            function retrieve(name,timeout){
              var c=new AbortController(),clock=setTimeout(function(){c.abort();},timeout);
              return fetch('assets/'+name,{cache:'force-cache',signal:c.signal})
                .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.arrayBuffer();})
                .finally(function(){clearTimeout(clock);});
            }
            function stage(buffer,kind,mid){
              var data=new Uint8Array(buffer);
              if(data.length<16)throw new Error('Invalid asset pack');
              var size=new DataView(data.buffer,data.byteOffset,4).getUint32(0,true);
              if(size<10||4+size>data.length)throw new Error('Invalid pack header');
              var manifest=JSON.parse(new TextDecoder('utf-8').decode(data.subarray(4,4+size)));
              if(manifest.kind!==kind||(kind==='map'&&manifest.map_id!==mid))throw new Error('Wrong pack');
              var start=4+size,added=0;
              for(var i=0;i<manifest.files.length;i++){
                var file=manifest.files[i],mappingValue=mapping[file[0]];
                if(!mappingValue)throw new Error('Missing mapping '+file[0]);
                var offset=file[1],len=file[2];
                if(!Number.isInteger(offset)||!Number.isInteger(len)||offset<0||len<8||start+offset+len>data.length)throw new Error('Bad pack bounds');
                var target=mappingValue.split('?')[0].toLowerCase();
                var bytes=data.slice(start+offset,start+offset+len);
                if(/\.png$/i.test(target)&&!(bytes[0]===137&&bytes[1]===80&&bytes[2]===78&&bytes[3]===71))throw new Error('Invalid PNG '+target);
                staged[target]=bytes;
                added++;
              }
              return added;
            }
            window.slR114BootIcons=function(){
              var dep='r114-icons',released=false;
              addRunDependency(dep);
              function release(){if(!released){released=true;removeRunDependency(dep);}}
              var guard=setTimeout(function(){label('Icons fallback');release();},12000);
              retrieve('icons-v229r114.pack',11000).then(function(bytes){
                if(!released){var n=stage(bytes,'icons',null);if(n!==395)throw new Error('Icon count '+n);label('Icons staged');}
              }).catch(function(e){console.error('R114_ICON_PACK',e);}).finally(function(){clearTimeout(guard);release();});
            };
            window.slR114BeginMap=function(mid){
              mid=Number(mid);
              if(!Number.isInteger(mid)||mid<1||mid>46)return Promise.resolve(false);
              if(mapStates[mid])return mapStates[mid];
              label('Map '+mid+' assets downloading');
              var p=retrieve('map-'+String(mid).padStart(3,'0')+'-v229r114.pack',20000)
                .then(function(bytes){var n=stage(bytes,'map',mid);label('Map '+mid+' assets staged '+n);return true;})
                .catch(function(e){console.error('R114_MAP_PACK',mid,e);delete mapStates[mid];return false;});
              mapStates[mid]=p;
              return p;
            };
            // Diagnostic: staged count is NOT renderer readiness.
            window.slR114StagedCount=function(){return Object.keys(staged).length;};
          })();
          R114_RUNTIME
          cat > build/patch_browser.py <<'R114_PATCH'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1]); js_src=Path(sys.argv[2])
          drive=root/'knight/js/drive.js'
          src=drive.read_text('utf8')
          # Restore ordinary preloadList for ALL maps; R111's special PNG queue
          # previously marked placeholders as ready, which bypassed image decode.
          assert src.count('R111_SANCTUARY_QUEUE')==1
          start=src.index('function preloadList(jsonArray) {')
          end=src.index('\nwindow.fileLoadedAsync = function(file)',start)
          generic='''function preloadList(jsonArray) {
              jsonArray.forEach((file) => {
                  const key=getMappingKey(file);
                  const mapped=mapping[key];
                  if(!mapped || window.fileAsyncCache[key])return;
                  const dir='/game/'+mapped.substring(0,mapped.lastIndexOf('/'));
                  const name=mapped.substring(mapped.lastIndexOf('/')+1).split('?')[0];
                  getLazyAsset('gameasync/'+mapped,name,function(data){
                      if(!data)return;
                      FS.createPreloadedFile(dir,name,new Uint8Array(data),true,true,
                          function(){window.fileAsyncCache[key]=1;},console.error,false,false,
                          function(){try{FS.unlink(dir+'/'+name);}catch(e){} });
                  },true);
              });
          }
          '''
          src=src[:start]+generic+src[end:]
          src=src.replace('// R111_SANCTUARY_QUEUE: limit only the special 2x panoramas.\n','')
          # Keep the existing engine callback intact. Merely schedule pack loading.
          head='''window.fileLoadedAsync = function(file) {
              document.title = wTitle;
          '''
          assert src.count(head)==1
          src=src.replace(head,head+'''    var found=/Map(\\d{3})\\.rxdata$/i.exec(String(file||''));
              if(found && window.slR114BeginMap)window.slR114BeginMap(Number(found[1]));
          ''')
          assert src.count('window.loadFileAsync = function(fullPath, bitmap, callback)')==1
          assert src.count('FS.createPreloadedFile(')>=3
          drive.write_text(src,encoding='utf8')
          (root/'knight/js/sl-assets-v229r114.js').write_bytes(js_src.read_bytes())
          for name in ('index.html','knight/index.html'):
              file=root/name
              html=file.read_text('utf8')
              assert 'V229R111' in html and 'V229R114' not in html
              if name=='knight/index.html':
                  assert html.count('createDummies();window.restoreLocalFilesBeforeRun();')==1
                  html=html.replace('createDummies();window.restoreLocalFilesBeforeRun();',
                                    'createDummies();window.slR114BootIcons();window.restoreLocalFilesBeforeRun();')
                  anchor='<script src="gameasync/mapping.js?v=v229r111"></script>'
                  assert html.count(anchor)==1
                  html=html.replace(anchor,anchor+'\n    <script src="js/sl-assets-v229r114.js?v=v229r114"></script>')
              html=html.replace('V229R111','V229R114').replace('v229r111','v229r114')
              file.write_text(html,encoding='utf8')
          print('PASS R114 unchanged native loader callbacks, original image decode, staging-only packs')
          R114_PATCH
          cat > build/test-r114.js <<'R114_TEST'
          const fs=require('fs'),vm=require('vm'),assert=require('assert'),path=require('path');
          const root=process.argv[2]||'site';
          const browser=fs.readFileSync(path.join(root,'knight/js/sl-assets-v229r114.js'),'utf8');
          const mappingSrc=fs.readFileSync(path.join(root,'knight/gameasync/mapping.js'),'utf8');
          const mappingContext={};vm.runInNewContext(mappingSrc,mappingContext);
          const mapping=mappingContext.mapping;
          let dependencies=0, nativeCalls=0, requests=[];
          const nativeLoader=function(url,filename,cb){nativeCalls++;cb(Buffer.from('FALLBACK'));};
          const sandbox={window:{getLazyAsset:nativeLoader,fileAsyncCache:{}},mapping,console,
            TextDecoder,Uint8Array,DataView,AbortController,setTimeout,clearTimeout,Number,String,Array,Object,
            document:{getElementById:()=>null},
            addRunDependency(){dependencies++;},removeRunDependency(){dependencies--;},
            fetch:async url=>{requests.push(url);return {ok:true,arrayBuffer:async()=>{
              const bytes=fs.readFileSync(path.join(root,'knight',url));
              return bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength);
            }}}};
          vm.runInNewContext(browser,sandbox);
          (async()=>{
            sandbox.window.slR114BootIcons();
            while(dependencies>0)await new Promise(resolve=>setTimeout(resolve,1));
            let icons=0;
            for(const k of Object.keys(mapping).filter(k=>k.startsWith('graphics/icons/'))){
              let val;const url='gameasync/'+mapping[k];
              sandbox.window.getLazyAsset(url,'file',b=>val=Buffer.from(b));
              const real=fs.readFileSync(path.join(root,'knight/gameasync',mapping[k].split('?')[0]));
              assert.deepEqual(val,real);icons++;
            }
            assert.equal(icons,395);
            for(const mid of [29,45,46]){
              assert.equal(await sandbox.window.slR114BeginMap(mid),true);
              const pack=fs.readFileSync(path.join(root,'knight/assets','map-'+String(mid).padStart(3,'0')+'-v229r114.pack'));
              const n=pack.readUInt32LE(0),manifest=JSON.parse(pack.subarray(4,4+n).toString('utf8'));
              assert.equal(manifest.files.length,{29:74,45:143,46:161}[mid]);
              for(const [k] of manifest.files){
                let staged;
                sandbox.window.getLazyAsset('gameasync/'+mapping[k],'f',v=>staged=Buffer.from(v));
                assert.deepEqual(staged,fs.readFileSync(path.join(root,'knight/gameasync',mapping[k].split('?')[0])));
              }
              const prev=requests.length;
              assert.equal(await sandbox.window.slR114BeginMap(mid),true);
              assert.equal(requests.length,prev);
              console.log('PASS Map'+mid+' '+manifest.files.length+' staged as original bytes; no repeat');
            }
            assert.deepEqual(Object.keys(sandbox.window.fileAsyncCache),[],'No premature cache completed flags');
            assert.equal(nativeCalls,0);
            console.log('PASS 395 icons staged; NO Emscripten FS writes; original image decode remains authoritative');
          })().catch(e=>{console.error(e);process.exit(1)});
          R114_TEST
          ruby -c build/export_maps.rb
          ruby build/export_maps.rb site/knight/gameasync/Data > build/map-meta.json
          python3 build/pack_assets.py site build/map-meta.json build/asset-report.json
          python3 build/patch_browser.py site build/sl-assets-v229r114.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/sl-assets-v229r114.js
          node --check site/knight/js/dpad.js
          node --check site/knight/gameasync/mapping.js
          node build/test-r114.js site

      - name: V229R114 Verify every pack and untouched S32 maps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_AUDIT'
          from pathlib import Path
          import hashlib,json,struct
          root=Path('site')
          before=json.loads(Path('build/before.json').read_text('utf8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          changed={k for k in before if before[k]!=after.get(k)}
          expected={'index.html','knight/index.html','knight/js/drive.js'}
          assert changed==expected,('Unexpected original game changes',changed^expected)
          added=set(after)-set(before)
          expected_added={'knight/js/sl-assets-v229r114.js','knight/assets/icons-v229r114.pack'}
          expected_added|={f'knight/assets/map-{i:03d}-v229r114.pack' for i in range(1,47)}
          assert added==expected_added,('Unexpected added files',added^expected_added)
          assert len(after)==5565 and len(before)==5517,(len(before),len(after))
          assert not any(k.startswith('knight/gameasync/') for k in changed)
          assert before['knight/js/dpad.js']==after['knight/js/dpad.js']
          # Validate all 46 packs against every original asset, not just 3 samples.
          mapping={}
          for line in (root/'knight/gameasync/mapping.js').read_text('utf8').splitlines():
              if line.startswith('["'):
                  k,v=json.loads(line.rstrip(','));mapping[k]=v.split('?')[0]
          for name in sorted(expected_added):
              if not name.endswith('.pack'):continue
              blob=(root/name).read_bytes()
              index_size=struct.unpack('<I',blob[:4])[0]
              index=json.loads(blob[4:4+index_size]);offset=4+index_size
              assert index['files'] and len(index['files'])==len({r[0] for r in index['files']})
              for k,pos,size in index['files']:
                  target=root/'knight/gameasync'/mapping[k]
                  assert blob[offset+pos:offset+pos+size]==target.read_bytes(),('Bad pack bytes',name,k)
          assert len(after)==len(before)+48
