                margin: 0;
                width: 100%;
                height: 100%;
                background: #080808;
                color: #fff;
                font-family:
                  system-ui,
                  sans-serif;
              }

              .wrap {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
                gap: 22px;
              }

              h1 {
                font-size: 30px;
                margin:
                  0
                  0
                  12px;
              }

              .choices {
                display: flex;
                gap: 18px;
              }

              .card {
                width: 150px;
                height: 170px;
                border:
                  1px solid
                  #777;
                border-radius: 14px;
                background: #171717;
                color: #fff;
                font-size: 25px;
              }

              .card:active {
                transform:
                  scale(.97);
              }

              .card[disabled] {
                opacity: .32;
              }

              .sub {
                font-size: 13px;
                color: #aaa;
                text-align: center;
                max-width: 330px;
                line-height: 1.5;
              }
            </style>
          </head>

          <body>
            <div class="wrap">
              <h1>캐릭터 선택</h1>

              <div class="choices">
                <button
                  class="card"
                  onclick="location.href='knight/'"
                >
                  기사
                </button>

                <button
                  id="elf"
                  class="card"
                  disabled
                >
                  요정
                </button>
              </div>

              <div
                id="msg"
                class="sub"
              >
                현재 Release에 요정 원본이 없어 기사만 활성화되어 있습니다. elf/index.html이 추가되면 자동 활성화됩니다.
              </div>
            </div>

            <script>
              fetch(
                'elf/index.html',
                {
                  method:'HEAD',
                  cache:'no-store'
                }
              )
              .then(
                function(r){
                  if(!r.ok)
                    return;

                  var b=
                    document.getElementById(
                      'elf'
                    );

                  b.disabled=false;

                  b.onclick=function(){
                    location.href='elf/';
                  };

                  document
                    .getElementById('msg')
                    .textContent=
                      '기사/요정은 각각 독립 게임 파일과 독립 저장소로 실행됩니다.';
                }
              )
              .catch(
                function(){}
              );
            </script>
          </body>
          </html>
          HTML

          touch player/.nojekyll

          test -s player/index.html
          test -s player/knight/index.html

          grep -Fq \
            '캐릭터 선택' \
            player/index.html

          grep -Fq \
            'SLKnight V14.5' \
            player/knight/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player

  deploy:
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
