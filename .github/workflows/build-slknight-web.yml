          s=replace_once.call(s,'@slti_floor == 47 ? 24 : 0','(@slti_floor == 47 || @slti_floor == 48) ? 24 : 0')
          s=replace_once.call(s,'@slti_floor == 47 ? 12 : 0','(@slti_floor == 47 || @slti_floor == 48) ? 12 : 0')
          RubyVM::InstructionSequence.compile(s)
          res[2]=Zlib::Deflate.deflate(s.gsub("\n",nl).b)
          # Add a second data table to the ORIGINAL renderer and extend its existing paths.
          res=lookup.call('SLNativeLayerV241')
          s=Zlib::Inflate.inflate(res[2]).force_encoding('UTF-8')
          raise 'Original native renderer invalid UTF-8' unless s.valid_encoding?
          nl=s.include?("\r\n") ? "\r\n" : "\n"
          s=s.gsub("\r\n","\n")
          hex=File.read(File.join(built,'map48-group-bounds.hex')).strip
          keys=JSON.parse(File.read(File.join(built,'map48-foreground-keys.json')))
          raise 'Invalid Map048 bounds' unless hex.match?(/\A[0-9a-f]+\z/) && hex.length%16==0 && hex.length>16
          raise 'Invalid Map048 upper keys' unless keys.length>0 && keys.all?{|k|k.is_a?(Array)&&k.size==2&&k[0].between?(0,23)&&k[1].between?(0,11)}
          s=replace_once.call(s,'  FADE_ALPHA=135',"  GROUP_BOUNDS_48=#{hex.scan(/.{1,30000}/).map{|chunk| "'#{chunk}'"}.join(" \\\n    ")}\n  FOREGROUND_KEYS_48=#{JSON.generate(keys)}\n  FADE_ALPHA=135")
          s=replace_once.call(s,'''  def self.box_for(id)
              return nil if id<=0 || id>=4089
              p=GROUP_BOUNDS[id*16,16]
              return nil unless p && p.length==16
              [p[0,4].to_i(16),p[4,4].to_i(16),p[8,4].to_i(16),p[12,4].to_i(16)]
            end''','''  def self.box_for(id,mapid=47)
              source=mapid==48 ? GROUP_BOUNDS_48 : GROUP_BOUNDS
              return nil if id<=0 || id>=source.length/16
              p=source[id*16,16]
              return nil unless p && p.length==16
              [p[0,4].to_i(16),p[4,4].to_i(16),p[8,4].to_i(16),p[12,4].to_i(16)]
            end''')
          s=replace_once.call(s,'$game_map.map_id==47 && $game_player','($game_map.map_id==47 || $game_map.map_id==48) && $game_player')
          s=replace_once.call(s,'return unless $game_map && $game_map.map_id==47','return unless $game_map && ($game_map.map_id==47 || $game_map.map_id==48)')
          s=replace_once.call(s,'@slti_floor==47 && @slti_cols==24 && @slti_rows==12','(@slti_floor==47 || @slti_floor==48) && @slti_cols==24 && @slti_rows==12')
          s=replace_once.call(s,"Bitmap.new('Graphics/Panoramas/SLTI_47_GID')","Bitmap.new('Graphics/Panoramas/SLTI_'+@slti_floor.to_s+'_GID')")
          s=replace_once.call(s,'SLNativeLayerV241::FOREGROUND_KEYS.each','(@slti_floor==48 ? SLNativeLayerV241::FOREGROUND_KEYS_48 : SLNativeLayerV241::FOREGROUND_KEYS).each')
          s=replace_once.call(s,'if $game_map && $game_map.map_id==47','if $game_map && ($game_map.map_id==47 || $game_map.map_id==48)')
          s=replace_once.call(s,'SLNativeLayerV241.box_for(gid)','SLNativeLayerV241.box_for(gid,@slti_floor)')
          s=replace_once.call(s,"name='Graphics/Panoramas/SLTI_47_L4_C'+x.to_s+'_'+y.to_s","name='Graphics/Panoramas/SLTI_'+@slti_floor.to_s+'_L4_C'+x.to_s+'_'+y.to_s")
          s=replace_once.call(s,'sl_v241_refresh if @sl_v241_ready && $game_map && $game_map.map_id==47','sl_v241_refresh if @sl_v241_ready && $game_map && ($game_map.map_id==47 || $game_map.map_id==48)')
          RubyVM::InstructionSequence.compile(s)
          res[2]=Zlib::Deflate.deflate(s.gsub("\n",nl).b)
          changed=rows.each_index.select{|i|rows[i][2]!=old[i][2]}
          expected=rows.each_index.select{|i|['해상도','SLNativeLayerV241'].include?(rows[i][1].to_s.dup.force_encoding('UTF-8'))}
          raise 'Other game script changed' unless changed.sort==expected.sort && changed.size==2
          File.binwrite(file,Marshal.dump(rows))
          verify=Marshal.load(File.binread(file))
          raise 'RGSS script count changed' unless verify.size==137
          changed.each{|i| raise 'Patched script body differs on load' unless verify[i][2]==rows[i][2]}
          puts "PASS existing 137 RGSS scripts, only two Map047 native renderer sections extended for Map048"
          V22_MAP48_SCRIPTS_EOF
          ruby -c build/v22/apply_map048_scripts.rb
          MAP48_ROOT=site MAP48_BUILD_ROOT=build/v22 ruby build/v22/apply_map048_scripts.rb

