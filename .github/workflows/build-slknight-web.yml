name: Deploy SLKnight mkxp-web Stage 1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-slknight-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a

jobs:
  build:
    name: Build SLKnight with working mkxp-web engine
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Install conversion tools
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            unzip \
            ruby \
            ffmpeg \
            imagemagick \
            file \
            timidity \
            freepats

      - name: Checkout known-working mkxp-web player
        uses: actions/checkout@v4
        with:
          repository: pulsejet/knight-blade-web-async
          ref: gh-pages
          path: player
          sparse-checkout: |
            index.html
            js
            mkxp.js
            mkxp.wasm
          sparse-checkout-cone-mode: false

      - name: Checkout mkxp-web support files
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: master
          path: mkxp-web
          sparse-checkout: |
            COPYING
            extra/rgss.rb
            extra/make_mapping.sh
            extra/manifest.webmanifest
          sparse-checkout-cone-mode: false

      - name: Download clean SLKnight release
        run: |
          set -e

          curl -L \
            --fail \
            --retry 3 \
            -o slknight.zip \
            "${GAME_URL}"

          echo "${GAME_SHA256}  slknight.zip" \
            | sha256sum -c -

          rm -rf game
          mkdir -p game

          unzip -q \
            slknight.zip \
            -d game

          test -f \
            game/SLKnight_Android_JoiPlay/Game.ini

      - name: Replace sample game with SLKnight
        run: |
          set -e

          rm -rf player/gameasync
          mkdir -p player/gameasync

          cp -a \
            game/SLKnight_Android_JoiPlay/. \
            player/gameasync/

          cp \
            mkxp-web/extra/rgss.rb \
            player/gameasync/rgss.rb

          cp \
            mkxp-web/extra/manifest.webmanifest \
            player/manifest.webmanifest

          cp \
            mkxp-web/COPYING \
            player/COPYING-mkxp-web.txt

          rm -f \
            player/gameasync/README_Android.txt

      - name: Convert SLKnight RGSS scripts for mruby web runtime
        run: |
          set -e

          ruby -rzlib - <<'RB'
          game_dir = 'player/gameasync'
          ini_path = File.join(game_dir, 'Game.ini')

          ini = File.binread(ini_path)

          scripts_rel = ini[/^Scripts=(.+)$/i, 1]

          abort 'Scripts entry missing from Game.ini' \
            if scripts_rel == nil

          scripts_rel =
            scripts_rel
              .strip
              .tr('\\', '/')

          scripts_path =
            File.join(
              game_dir,
              scripts_rel
            )

          abort "Scripts file missing: #{scripts_path}" \
            unless File.file?(scripts_path)

          scripts =
            Marshal.load(
              File.binread(scripts_path)
            )

          # ----------------------------------------------------------
          # Win32 API compatibility
          # ----------------------------------------------------------

          web_compat = <<'RUBY'
          # Browser compatibility shim.
          # Windows DLL calls have no browser equivalent.

          class Win32API
            def initialize(*args)
            end

            def call(*args)
              return 0
            end

            def Call(*args)
              return call(*args)
            end
          end
          RUBY

          scripts.insert(
            0,
            [
              0,
              'Web Compatibility',
              Zlib::Deflate.deflate(
                web_compat
              )
            ]
          )

          # ----------------------------------------------------------
          # mruby does not support:
          #
          # begin
          #   ...
          # end until condition
          #
          # Convert to:
          #
          # loop do
          #   ...
          #   break if condition
          # end
          # ----------------------------------------------------------

          def patch_begin_until(source)
            lines = source.lines
            changed = 0

            i = 0

            while i < lines.length
              match =
                lines[i].match(
                  /^(\s*)end\s+until\s+(.+?)\s*$/
                )

              if match
                indent = match[1]
                condition = match[2]

                j = i - 1

                while j >= 0
                  if (
                    lines[j][/^\s*/] == indent &&
                    lines[j].strip == 'begin'
                  )
                    lines[j] =
                      indent +
                      "loop do\n"

                    lines[i] =
                      indent +
                      "  break if " +
                      condition +
                      "\n" +
                      indent +
                      "end\n"

                    changed += 1
                    break
                  end

                  j -= 1
                end
              end

              i += 1
            end

            [
              lines.join,
              changed
            ]
          end

          # ----------------------------------------------------------
          # RPG Maker normally owns its own endless scene loop.
          #
          # mkxp-web instead calls main_update_loop from the browser
          # every frame.
          #
          # Convert the usual:
          #
          # loop do
          #   Graphics.update
          #   Input.update
          #   update
          #   if $scene != self
          #     break
          #   end
          # end
          #
          # into setup main + dispose.
          # ----------------------------------------------------------

          def patch_scene_loops(source)
            lines = source.lines
            changed = 0
            i = 0

            while i < lines.length
              unless lines[i].strip == 'loop do'
                i += 1
                next
              end

              indent =
                lines[i][/^\s*/]

              significant = []
              k = i + 1

              while (
                k < lines.length &&
                significant.length < 8
              )
                stripped =
                  lines[k].strip

                unless (
                  stripped.empty? ||
                  stripped.start_with?('#')
                )
                  significant << [
                    k,
                    stripped,
                    lines[k][/^\s*/]
                  ]
                end

                k += 1
              end

              end_index = nil

              if (
                significant.length >= 7 &&
                significant[0][1] == 'Graphics.update' &&
                significant[1][1] == 'Input.update' &&
                significant[2][1] == 'update' &&
                significant[3][1] == 'if $scene != self' &&
                significant[4][1] == 'break' &&
                significant[5][1] == 'end' &&
                significant[6][1] == 'end' &&
                significant[6][2] == indent
              )
                end_index =
                  significant[6][0]

              elsif (
                significant.length >= 5 &&
                significant[0][1] == 'Graphics.update' &&
                significant[1][1] == 'Input.update' &&
                significant[2][1] == 'update' &&
                significant[3][1] == 'break if $scene != self' &&
                significant[4][1] == 'end' &&
                significant[4][2] == indent
              )
                end_index =
                  significant[4][0]
              end

              if end_index != nil
                lines[i..end_index] = [
                  indent +
                  "end\n\n" +
                  indent +
                  "def dispose\n"
                ]

                changed += 1
                i += 1
                next
              end

              i += 1
            end

            [
              lines.join,
              changed
            ]
          end

          scene_loop_count = 0
          begin_until_count = 0

          # ----------------------------------------------------------
          # Patch scripts
          # ----------------------------------------------------------

          scripts.each do |entry|
            next unless (
              entry.is_a?(Array) &&
              entry.length >= 3
            )

            name =
              entry[1].to_s

            begin
              source =
                Zlib::Inflate.inflate(
                  entry[2]
                )
            rescue
              next
            end

            patched =
              source.dup

            patched, count =
              patch_begin_until(
                patched
              )

            begin_until_count +=
              count

            unless name == 'Main'
              patched, count =
                patch_scene_loops(
                  patched
                )

              scene_loop_count +=
                count
            end

            # --------------------------------------------------------
            # Browser main loop
            # --------------------------------------------------------

            if name == 'Main'
              unless patched.include?(
                'def main_update_loop'
              )
                browser_loop = <<'RUBY'
          $prev_scene = nil

          def main_update_loop
            if $scene != nil

              if $scene != $prev_scene

                if (
                  $prev_scene != nil &&
                  $prev_scene.respond_to?(:dispose)
                )
                  $prev_scene.dispose
                end

                $scene.main
                $prev_scene = $scene
              end

              Graphics.update
              Input.update
              $scene.update

            else
              raise "END"
            end
          end

          RUBY

                patched =
                  browser_loop +
                  patched
              end

              # Original RPG Maker endless scene dispatcher.
              # The browser now owns this loop.
              patched.sub!(
                /\n\s*while\s+\$scene\s*!=\s*nil\s*\r?\n\s*\$scene\.main\s*\r?\n\s*end\s*/m,
                "\n"
              )
            end

            next if patched == source

            entry[2] =
              Zlib::Deflate.deflate(
                patched
              )
          end

          # ----------------------------------------------------------
          # Validate Main
          # ----------------------------------------------------------

          main =
            scripts.find do |entry|
              entry[1].to_s == 'Main'
            end

          abort 'Main script missing' \
            if main == nil

          main_source =
            Zlib::Inflate.inflate(
              main[2]
            )

          abort 'main_update_loop injection failed' \
            unless main_source.include?(
              'def main_update_loop'
            )

          # ----------------------------------------------------------
          # Rename custom script archive to the standard name.
          #
          # The known-working player preloads Data/Scripts.
          # ----------------------------------------------------------

          target_scripts =
            File.join(
              game_dir,
              'Data',
              'Scripts.rxdata'
            )

          File.binwrite(
            target_scripts,
            Marshal.dump(scripts)
          )

          unless (
            File.expand_path(scripts_path) ==
            File.expand_path(target_scripts)
          )
            File.delete(
              scripts_path
            )
          end

          # ----------------------------------------------------------
          # Rewrite Game.ini
          # ----------------------------------------------------------

          ini_lines =
            ini.split(/\r?\n/)

          ini_lines.map! do |line|
            if line =~ /^Scripts=/i
              'Scripts=Data\Scripts.rxdata'

            elsif line =~ /^Title=/i
              'Title=SLKnight'

            else
              line
            end
          end

          File.binwrite(
            ini_path,
            ini_lines.join("\r\n") +
            "\r\n"
          )

          puts(
            "SCENE_LOOPS_PATCHED=" +
            scene_loop_count.to_s
          )

          puts(
            "BEGIN_UNTIL_PATCHED=" +
            begin_until_count.to_s
          )

          puts(
            'SLKNIGHT_MRUBY_STAGE1_PATCH_OK'
          )
          RB

          test -s \
            player/gameasync/Data/Scripts.rxdata

          grep -a -q \
            'Scripts=Data\Scripts.rxdata' \
            player/gameasync/Game.ini

      - name: Convert unsupported audio to OGG
        run: |
          set -e

          if [ -d player/gameasync/Audio ]
          then
            find \
              player/gameasync/Audio \
              -type f \
              -print0 \
              | while IFS= read -r -d '' file
            do
              ext="${file##*.}"

              ext="$(
                printf '%s' "${ext}" \
                  | tr '[:upper:]' '[:lower:]'
              )"

              case "${ext}" in

                ogg)
                  ;;

                mid|midi)
                  out="${file%.*}.ogg"
                  tmp="${file%.*}.mkxpweb.wav"

                  timidity \
                    "${file}" \
                    -Ow \
                    -o "${tmp}"

                  ffmpeg \
                    -v error \
                    -y \
                    -i "${tmp}" \
                    -c:a libvorbis \
                    -q:a 4 \
                    "${out}"

                  rm -f \
                    "${file}" \
                    "${tmp}"
                  ;;

                mp3|wav|wma|aac|m4a|flac)
                  out="${file%.*}.ogg"

                  ffmpeg \
                    -v error \
                    -y \
                    -i "${file}" \
                    -c:a libvorbis \
                    -q:a 4 \
                    "${out}"

                  rm -f \
                    "${file}"
                  ;;

              esac
            done
          fi

          echo \
            'AUDIO_CONVERSION_OK'

      - name: Convert unsupported images to PNG
        run: |
          set -e

          if [ -d player/gameasync/Graphics ]
          then
            find \
              player/gameasync/Graphics \
              -type f \
              -print0 \
              | while IFS= read -r -d '' file
            do
              ext="${file##*.}"

              ext="$(
                printf '%s' "${ext}" \
                  | tr '[:upper:]' '[:lower:]'
              )"

              case "${ext}" in

                bmp|gif|webp|tif|tiff)
                  out="${file%.*}.png"

                  convert \
                    "${file}[0]" \
                    "${out}"

                  rm -f \
                    "${file}"
                  ;;

              esac
            done
          fi

          echo \
            'IMAGE_CONVERSION_OK'

      - name: Generate async file mapping
        run: |
          set -e

          cd player/gameasync

          bash \
            ../../mkxp-web/extra/make_mapping.sh

          test -s \
            mapping.js

          test -s \
            bitmap-map.js

          echo \
            'MAPPING_GENERATION_OK'

      - name: Create empty optional map preload files
        run: |
          set -e

          mkdir -p \
            player/preload/Data

          find \
            player/gameasync/Data \
            -maxdepth 1 \
            -type f \
            -iname 'Map*.rxdata' \
            -print0 \
            | while IFS= read -r -d '' file
          do
            name="$(
              basename "${file}"
            )"

            printf '[]\n' \
              > "player/preload/Data/${name}.json"
          done

      - name: Configure SLKnight player shell
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              'player/index.html'
          )

          html = path.read_text(
              encoding='utf-8'
          )

          html = re.sub(
              r"var namespace = '[^']*';",
              "var namespace = 'slknight_web_v1';",
              html,
              count=1,
          )

          html = re.sub(
              r"var wTitle = '[^']*'\s*;?",
              "var wTitle = 'SLKnight';",
              html,
              count=1,
          )

          html = html.replace(
              '<title>MKXP</title>',
              '<title>SLKnight</title>',
              1,
          )

          path.write_text(
              html,
              encoding='utf-8',
          )
          PY

          touch \
            player/.nojekyll

      - name: Verify deploy package
        run: |
          set -e

          test -s \
            player/index.html

          test -s \
            player/mkxp.js

          test -s \
            player/mkxp.wasm

          test -s \
            player/js/drive.js

          test -s \
            player/gameasync/Game.ini

          test -s \
            player/gameasync/rgss.rb

          test -s \
            player/gameasync/mapping.js

          test -s \
            player/gameasync/bitmap-map.js

          test -s \
            player/gameasync/Data/Scripts.rxdata

          grep -Fq \
            "var namespace = 'slknight_web_v1';" \
            player/index.html

          grep -Fq \
            "var wTitle = 'SLKnight';" \
            player/index.html

          echo \
            'SLKNIGHT_MKXP_WEB_STAGE1_READY'

          du -sh \
            player

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player

  deploy:
    name: Deploy GitHub Pages

    needs:
      - build

    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
