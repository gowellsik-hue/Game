
name: V208 | Knight Ettin Accuracy Fix - Fairy and Saves Untouched

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Restore deployed V206 dual game
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 38210263442
          github-token: ${{ github.token }}
          path: prior

      - name: Extract and protect all original files
        shell: bash
        run: |
          set -euo pipefail
          test -s prior/artifact.tar
          mkdir -p site
          tar -xf prior/artifact.tar -C site
          test -s site/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata
          test -s site/knight/gameasync/mapping.js
          test -s site/knight/gameasync/Data/Scripts.rxdata
          test -s site/elf/gameasync/Data/Scripts.rxdata
          find site -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/v208_before.sha
          cp site/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata /tmp/v208_knight_before.rxdata
          echo V208_V206_BASE_PROTECTED

      - name: Remove only invalid Knight Ettin hit multiplier
        shell: bash
        run: |
          set -euo pipefail
          ruby -EUTF-8:UTF-8 -rdigest - site/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata <<'RB'
          # encoding: utf-8
          module RPG
            class CommonEvent; end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
            class AudioFile; end
          end
          class V208RawRGSS
            def initialize(bytes); @bytes = bytes; end
            def self._load(bytes); new(bytes); end
            def _dump(level); @bytes; end
          end
          class Tone < V208RawRGSS; end
          class Color < V208RawRGSS; end
          class Table < V208RawRGSS; end

          file = ARGV.fetch(0)
          original = File.binread(file)
          data = Marshal.load(original)
          abort 'RGSS Marshal data would not round-trip unchanged' unless Marshal.dump(data) == original
          abort 'Invalid CommonEvents length' unless data.is_a?(Array) && data.length > 919
          event = data.fetch(882)
          name = event.instance_variable_get(:@name).dup.force_encoding('UTF-8')
          abort "Wrong common event: #{name}" unless name == '[공격]에틴'
          list = event.instance_variable_get(:@list)
          invalid = [336, 336, 3, 1, 770]
          indexes = list.each_index.select do |i|
            cmd = list[i]
            cmd.instance_variable_get(:@code) == 122 && cmd.instance_variable_get(:@parameters) == invalid
          end
          abort "Expected one invalid multiplier, found #{indexes.length}" unless indexes.length == 1
          at = indexes.first
          before = list.fetch(at - 1)
          after = list.fetch(at + 1)
          abort 'Ettin random accuracy initializer differs' unless before.instance_variable_get(:@code) == 122 && before.instance_variable_get(:@parameters) == [336, 336, 0, 2, 40, 70]
          abort 'Ettin accuracy conditional differs' unless after.instance_variable_get(:@code) == 111 && after.instance_variable_get(:@parameters) == [1, 336, 1, 337, 1]

          untouched = data.each_with_index.to_h do |item, i|
            [i, item.nil? ? nil : Digest::SHA256.hexdigest(Marshal.dump(item))]
          end
          list.delete_at(at)
          changed = data.each_with_index.filter_map do |item, i|
            digest = item.nil? ? nil : Digest::SHA256.hexdigest(Marshal.dump(item))
            i unless digest == untouched[i]
          end
          abort "Unexpected common events modified: #{changed.inspect}" unless changed == [882]
          File.binwrite(file, Marshal.dump(data))
          puts 'V208_ONLY_KNIGHT_COMMON_EVENT_882_MODIFIED'
          RB

      - name: Refresh Knight CommonEvents mapping and cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re
          root = Path('site/knight')
          filename = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata'
          current = root / 'gameasync/Data' / filename
          old = Path('/tmp/v208_knight_before.rxdata')
          mapping = root / 'gameasync/mapping.js'
          page = root / 'index.html'
          before = mapping.read_text(encoding='utf-8')
          key = 'data/' + filename.removesuffix('.rxdata').lower()
          regex = r'(\["' + re.escape(key) + r'",\s*"Data/' + re.escape(filename) + r'\?h=)([0-9a-f]{32})("\],)'
          found = list(re.finditer(regex, before))
          if len(found) != 1:
              raise SystemExit('Expected exactly one Knight real CommonEvents mapping')
          if found[0].group(2) != hashlib.md5(old.read_bytes()).hexdigest():
              raise SystemExit('Old CommonEvents mapping hash does not match artifact')
          digest = hashlib.md5(current.read_bytes()).hexdigest()
          updated, count = re.subn(regex, lambda m: m.group(1) + digest + m.group(3), before)
          if count != 1:
              raise SystemExit('Cannot refresh Knight CommonEvents hash')
          mapping.write_text(updated, encoding='utf-8')
          html = page.read_text(encoding='utf-8')
          existing = 'gameasync/mapping.js?v=v143z100'
          if html.count(existing) != 1:
              raise SystemExit('Knight mapping cache version marker mismatch')
          page.write_text(html.replace(existing, 'gameasync/mapping.js?v=v208', 1), encoding='utf-8')
          print('V208_KNIGHT_ETTIN_CACHE_REFRESHED')
          PY

      - name: Verify only Knight Ettin event changed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          before = {}
          for line in Path('/tmp/v208_before.sha').read_text().splitlines():
              digest, path = line.split('  ', 1)
              before[path] = digest
          after = {str(p): hashlib.sha256(p.read_bytes()).hexdigest()
                   for p in Path('site').rglob('*') if p.is_file()}
          if after.keys() != before.keys():
              raise SystemExit('Files added or removed during patch')
          allowed = {
              'site/knight/index.html',
              'site/knight/gameasync/mapping.js',
              'site/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata'
          }
          changed = {path for path in before if before[path] != after[path]}
          if changed != allowed:
              raise SystemExit('Unexpected game file changes: ' + repr(changed))
          mapping = Path('site/knight/gameasync/mapping.js').read_text(encoding='utf-8')
          filename = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata'
          data = Path('site/knight/gameasync/Data') / filename
          assert 'Data/' + filename + '?h=' + hashlib.md5(data.read_bytes()).hexdigest() in mapping
          assert 'gameasync/mapping.js?v=v208' in Path('site/knight/index.html').read_text(encoding='utf-8')
          assert 'slknight_v14_engine' in Path('site/knight/index.html').read_text(encoding='utf-8')
          print('V208_ALL_ELF_FILES_AND_BOTH_SAVE_SYSTEMS_UNCHANGED')
          PY
          echo V208_STATIC_VALIDATION_PASSED

      - name: Upload verified GitHub Pages site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
