          cat > player/js/dpad.js <<'JS'
          function simulateKeyEvent(type,keyCode,charCode){
            var e=document.createEventObject?document.createEventObject():document.createEvent('Events');
            if(e.initEvent)e.initEvent(type,true,true);
            e.keyCode=keyCode;e.which=keyCode;e.charCode=charCode||0;
            if(typeof JSEvents!=='undefined'&&JSEvents.eventHandlers&&JSEvents.eventHandlers.length){
              for(var i=0;i<JSEvents.eventHandlers.length;i++){
                var h=JSEvents.eventHandlers[i];
                if((h.target==Module['canvas']||h.target==window)&&h.eventTypeString==type)h.handlerFunc(e);
              }
            }else if(Module&&Module['canvas']){
              if(Module['canvas'].dispatchEvent)Module['canvas'].dispatchEvent(e);else Module['canvas'].fireEvent('on'+type,e);
            }
          }
          const held=new Set();
          function sendKey(key,down){
            if(down){if(held.has(key))return;held.add(key);simulateKeyEvent('keydown',key);}
            else{if(!held.has(key))return;held.delete(key);simulateKeyEvent('keyup',key);}
          }
          function releaseAll(){Array.from(held).forEach(k=>sendKey(k,false));}
          function isTouch(){return 'ontouchstart' in window||navigator.maxTouchPoints>0;}
          function resizeCanvas(){
            const c=document.getElementById('canvas');if(!c)return;
            if(window.innerHeight>window.innerWidth){c.style.height='unset';c.style.width='100%';}
            else{c.style.width='unset';c.style.height='100%';}
            layoutPadSoon();
          }
          function layoutPad(){
            const main=document.getElementById('main'),canvas=document.getElementById('canvas'),pad=document.getElementById('sl-pad');
            if(!main||!canvas||!pad)return;
            const mr=main.getBoundingClientRect(),cr=canvas.getBoundingClientRect(),gap=Math.max(0,mr.bottom-cr.bottom);
            const dock=window.innerHeight>window.innerWidth&&!document.fullscreenElement&&gap>=170;
            if(dock){
              pad.dataset.mode='dock';pad.style.left='0px';pad.style.top=(cr.bottom-mr.top)+'px';pad.style.width=mr.width+'px';pad.style.height=Math.max(280,gap-8)+'px';
            }else{
              pad.dataset.mode='overlay';pad.style.left=(cr.left-mr.left)+'px';pad.style.top=(cr.top-mr.top)+'px';pad.style.width=cr.width+'px';pad.style.height=cr.height+'px';
            }
          }
          function layoutPadSoon(){requestAnimationFrame(()=>requestAnimationFrame(layoutPad));setTimeout(layoutPad,100);}
          function bindHold(b,key){
            b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();try{b.setPointerCapture(e.pointerId);}catch(_){}b.classList.add('pressed');sendKey(key,true);});
            const up=e=>{if(e){e.preventDefault();e.stopPropagation();}b.classList.remove('pressed');sendKey(key,false);};
            b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
          }
          function button(parent,id,label,key,cls){
            const b=document.createElement('div');b.id=id;b.className=cls;b.textContent=label;parent.appendChild(b);bindHold(b,key);return b;
          }
          let slScene='';
          function updateHotbar(){
            const bar=document.getElementById('sl-hotbar');if(!bar)return;
            const active=slScene==='Scene_Map';bar.classList.toggle('inactive',!active);
            bar.querySelectorAll('.sl-hot').forEach(b=>b.style.pointerEvents=active?'auto':'none');
          }
          function parseScene(t){
            const i=t.indexOf('SLFRAME|');if(i<0)return;
            slScene=t.slice(i+8).split(/\s/)[0];updateHotbar();
          }
          const slLog=console.log.bind(console);
          console.log=function(){const a=[].slice.call(arguments);try{parseScene(a.join(' '));}catch(_){}slLog.apply(console,a);};
          function initSLTouchControls(){
            if(!isTouch()||document.getElementById('sl-pad'))return;
            const oldD=document.getElementById('dpad'),oldA=document.getElementById('apad');if(oldD)oldD.remove();if(oldA)oldA.remove();
            const main=document.getElementById('main');if(!main)return;if(getComputedStyle(main).position==='static')main.style.position='relative';
            const style=document.createElement('style');style.textContent=`
          #sl-pad{position:absolute;z-index:5000;pointer-events:none;user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden}
          #sl-joy-zone{position:absolute;pointer-events:auto;touch-action:none}
          #sl-joy-base{display:none;position:absolute;width:116px;height:116px;border-radius:50%;transform:translate(-50%,-50%);background:rgba(55,55,55,.34);border:2px solid rgba(255,255,255,.28);pointer-events:none}
          #sl-joy-knob{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;transform:translate(-50%,-50%);background:rgba(225,225,225,.55);border:2px solid rgba(255,255,255,.30)}
          .sl-btn{position:absolute;display:flex;align-items:center;justify-content:center;box-sizing:border-box;border-radius:50%;background:rgba(55,55,55,.46);border:2px solid rgba(255,255,255,.28);color:#fff;font:700 18px sans-serif;text-shadow:0 1px 2px #000;pointer-events:auto;touch-action:none}
          .sl-btn.pressed{background:rgba(225,225,225,.62);transform:scale(.94)}
          #sl-hotbar{position:absolute;display:flex;gap:8px;z-index:2;pointer-events:none;transition:opacity .15s}
          #sl-hotbar.inactive{opacity:.34}
          .sl-hot{width:54px;height:54px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;border-radius:12px;background:rgba(45,45,45,.72);border:2px solid rgba(255,255,255,.30);box-shadow:0 2px 8px rgba(0,0,0,.40);color:#fff;font:800 18px sans-serif;text-shadow:0 1px 2px #000;pointer-events:auto;touch-action:none}
          .sl-hot.pressed{background:rgba(225,225,225,.58);transform:scale(.92)}
          #sl-pad[data-mode="dock"] #sl-joy-zone{left:0;top:18%;width:52%;height:54%}
          #sl-pad[data-mode="dock"] #sl-atk{right:7%;top:18%;width:96px;height:96px}
          #sl-pad[data-mode="dock"] #sl-cancel{right:25%;top:39%;width:64px;height:64px}
          #sl-pad[data-mode="dock"] #sl-hotbar{left:50%;bottom:18px;transform:translateX(-50%)}
          #sl-pad[data-mode="overlay"] #sl-joy-zone{left:0;top:12%;width:52%;height:66%}
          #sl-pad[data-mode="overlay"] #sl-atk{right:6%;top:52%;width:92px;height:92px}
          #sl-pad[data-mode="overlay"] #sl-cancel{right:20%;top:72%;width:60px;height:60px}
          #sl-pad[data-mode="overlay"] #sl-hotbar{left:50%;bottom:2%;transform:translateX(-50%);gap:5px}
          #sl-pad[data-mode="overlay"] .sl-hot{width:44px;height:44px;border-radius:10px;font-size:15px}`;
            document.head.appendChild(style);
            const pad=document.createElement('div');pad.id='sl-pad';main.appendChild(pad);
            const zone=document.createElement('div');zone.id='sl-joy-zone';pad.appendChild(zone);
            const base=document.createElement('div');base.id='sl-joy-base';base.innerHTML='<div id="sl-joy-knob"></div>';pad.appendChild(base);
            const hot=document.createElement('div');hot.id='sl-hotbar';pad.appendChild(hot);
            button(hot,'sl-hot-a','A',65,'sl-hot');
            button(hot,'sl-hot-s','S',83,'sl-hot');
            button(hot,'sl-hot-d','D',68,'sl-hot');
            button(hot,'sl-hot-q','Q',81,'sl-hot');
            button(hot,'sl-hot-z','Z',16,'sl-hot');
            button(hot,'sl-hot-f','F',116,'sl-hot');
            button(pad,'sl-atk','ATK',67,'sl-btn');button(pad,'sl-cancel','X',88,'sl-btn');
            const knob=base.firstElementChild;let pointer=null,ox=0,oy=0;const dirs={37:false,38:false,39:false,40:false};
            function setDir(key,on){if(dirs[key]===on)return;dirs[key]=on;sendKey(key,on);}
            function moveJoy(clientX,clientY){
              const rect=pad.getBoundingClientRect();let dx=clientX-rect.left-ox,dy=clientY-rect.top-oy,dist=Math.hypot(dx,dy),nx=dx,ny=dy;
              if(dist>38){nx=dx/dist*38;ny=dy/dist*38;}
              knob.style.transform='translate(calc(-50% + '+nx+'px),calc(-50% + '+ny+'px))';
              setDir(37,dx<-12);setDir(39,dx>12);setDir(38,dy<-12);setDir(40,dy>12);
            }
            function releaseJoy(){setDir(37,false);setDir(38,false);setDir(39,false);setDir(40,false);pointer=null;base.style.display='none';knob.style.transform='translate(-50%,-50%)';}
            zone.addEventListener('pointerdown',e=>{
              if(pointer!==null)return;e.preventDefault();e.stopPropagation();pointer=e.pointerId;
              const pr=pad.getBoundingClientRect(),zr=zone.getBoundingClientRect();ox=e.clientX-pr.left;oy=e.clientY-pr.top;
              const half=60,minX=zr.left-pr.left+half,maxX=zr.right-pr.left-half,minY=zr.top-pr.top+half,maxY=zr.bottom-pr.top-half;
              ox=Math.max(minX,Math.min(maxX,ox));oy=Math.max(minY,Math.min(maxY,oy));base.style.left=ox+'px';base.style.top=oy+'px';base.style.display='block';
              try{zone.setPointerCapture(pointer);}catch(_){}moveJoy(e.clientX,e.clientY);
            });
            zone.addEventListener('pointermove',e=>{if(e.pointerId!==pointer)return;e.preventDefault();e.stopPropagation();moveJoy(e.clientX,e.clientY);});
