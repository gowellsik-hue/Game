            [42,3]=>[24,"나이트메어"], [42,6]=>[36,"꿈의 혼령"], [42,7]=>[44,"아이스 골렘"], [42,8]=>[44,"아이스 골렘"], [42,9]=>[44,"아이스 골렘"], [42,10]=>[36,"꿈의 혼령"],
            [42,11]=>[40,"파이어 에그"], [42,12]=>[40,"파이어 에그"], [42,13]=>[36,"꿈의 혼령"], [42,14]=>[36,"꿈의 혼령"], [42,15]=>[36,"꿈의 혼령"], [42,16]=>[36,"꿈의 혼령"],
            [42,17]=>[36,"꿈의 혼령"], [42,18]=>[40,"파이어 에그"], [42,20]=>[36,"물의 대정령"], [42,21]=>[36,"아이스맨"], [42,22]=>[36,"아이스맨"], [42,23]=>[36,"바람의 대정령"],
            [42,24]=>[36,"불의 대정령"], [42,25]=>[36,"땅의 대정령"], [42,26]=>[36,"가디언 아머"], [42,27]=>[36,"가디언 아머"], [42,28]=>[36,"가디언 아머"],
          }
          def check(condition,message)
            raise message unless condition
          end
          def value(obj,member)
            obj.instance_variable_get("@#{member}")
          end
          def save_data(path,object)
            File.binwrite(path,Marshal.dump(object))
          end
          def data_path(name)
            File.join(DATA,"#{PRE}#{name}.rxdata")
          end

          # V1.23 runtime already computes movement with @sl_move_rate.
          script=File.join(DATA,'Scripts.rxdata')
          all_scripts=Marshal.load(File.binread(script))
          src=Zlib::Inflate.inflate(all_scripts.fetch(26).fetch(2))
          anchor='    @move_speed = @page.move_speed'
          check(src.scan(anchor).length==1,'Game_Event original speed assignment not unique')
          insert="#{anchor}\n    @sl_move_rate = @event.instance_variable_get(:@sl_move_rate)"
          all_scripts[26][2]=Zlib::Deflate.deflate(src.sub(anchor,insert))
          save_data(script,all_scripts)

          speed_maps=SPEED_FRAMES.keys.map(&:first).uniq.sort
          changed_maps=speed_maps.dup
          changed_maps << 40 unless changed_maps.include?(40)
          changed_maps.sort.each do |map_id|
            file=data_path('Map%03d' % map_id)
            m=Marshal.load(File.binread(file))
            events=value(m,:events)
            n=0
            SPEED_FRAMES.each do |(id,eid),(frames,name)|
              next unless id==map_id
              event=events.fetch(eid)
              actual=value(event,:name).dup.force_encoding('UTF-8').scrub.delete(' ').delete_prefix('[ID').delete_suffix(']')
              expected=name.delete(' ')
              check(actual==expected,"Unexpected target event Map#{id} EV#{eid}: #{actual}/#{expected}")
              check(!event.instance_variable_defined?(:@sl_move_rate),"Duplicate rate Map#{id} EV#{eid}")
              check([12,16,24,32,36,40,44].include?(frames),"Unexpected frame #{frames}")
              event.instance_variable_set(:@sl_move_rate,32.0/frames)
              n+=1
            end
            if map_id==40
              check(events.key?(5) && value(events.fetch(5),:name).to_s.dup.force_encoding('UTF-8').scrub.include?('기르타스'),'Map040 Girtas missing')
              entry=events.fetch(9)
              list=value(value(entry,:pages).fetch(0),:list)
              transfer=list.select{|cmd|value(cmd,:code)==201}
              check(transfer.length==1 && value(transfer[0],:parameters)[0,2]==[0,43],'Map040 EV9 entry mismatch')
              check(value(entry,:name).to_s=='EV009','Map040 EV9 must be entry only')
              events.delete(9)
            end
            save_data(file,m) if n>0 || map_id==40
          end

          infos_file=data_path('MapInfos')
          infos=Marshal.load(File.binread(infos_file))
          check(infos[43] && infos[44],'Map043/044 info missing')
          check(value(infos[44],:parent_id)==43,'Map044 must be child of Map043')
          check(infos.any?{|id,entry|id==40 && value(entry,:name).dup.force_encoding('UTF-8').scrub=='다크엘프 성지'},'Map040 info must be preserved')
          check(infos.all?{|id,entry| [43,44].include?(id) || ![43,44].include?(value(entry,:parent_id))},'Other map depends on Map043/044')
          infos.delete(43)
          infos.delete(44)
          save_data(infos_file,infos)

          # Keep existing mapping; edit only the changed metadata hashes and deleted map rows.
          map_path=File.join(KNIGHT,'gameasync/mapping.js')
          map_text=File.binread(map_path).force_encoding('UTF-8')
          all_changed=changed_maps.map{|id|data_path('Map%03d' % id)} + [script,infos_file]
          all_changed.each do |path|
            name=File.basename(path)
            token="Data/#{name}?h="
            pattern=Regexp.new(Regexp.escape(token)+'[0-9a-f]{32}')
            check(map_text.scan(pattern).length==1,"Mapping missing #{name}")
            map_text=map_text.sub(pattern,"#{token}#{Digest::MD5.file(path).hexdigest}")
          end
          [43,44].each do |map_id|
            ['Data/Map%03d.rxdata' % map_id,"Data/#{PRE}Map%03d.rxdata" % map_id].each do |rel|
              pattern=Regexp.new('^\\["data/[^\"]+", "'+Regexp.escape(rel)+'\\?h=[^\"]+"\\],?\\n')
              check(map_text.scan(pattern).length==1,"Mapping entry missing #{rel}")
              map_text=map_text.sub(pattern,'')
              path=File.join(KNIGHT,'gameasync',rel)
              check(File.file?(path),"Expected map data missing: #{rel}")
              File.delete(path)
            end
            pack=File.join(KNIGHT,'assets','map-%03d-v229r115.pack' % map_id)
            check(File.file?(pack),"Expected map pack missing: #{pack}")
            File.delete(pack)
          end
          File.binwrite(map_path,map_text)
          puts "PASS: modified #{SPEED_FRAMES.length} existing monster event rates on #{speed_maps.length} maps"
          puts "PASS: removed Map043 and Map044, four map files, two map packs, and Map040 EV9 entry"
          puts "PASS: preserved Girtas Map040 EV5"

          knight_html=File.join(KNIGHT,'index.html')
          html=File.binread(knight_html).force_encoding('UTF-8')
          check(html.include?('V1.23') && html.include?('v1.23'),'V1.23 knight HTML missing')
          File.binwrite(knight_html,html.gsub('V1.23','V1.24').gsub('v1.23','v1.24'))
          root_html=File.join(ROOT,'index.html')
          root_source=File.binread(root_html).force_encoding('UTF-8')
          check(root_source.include?('V1.23'),'V1.23 root HTML missing')
          File.binwrite(root_html,root_source.gsub('V1.23','V1.24'))
          loader=File.join(KNIGHT,'js/sl-assets-v229r115.js')
          loader_source=File.binread(loader).force_encoding('UTF-8')
          check(loader_source.scan("var version='V1.23';").length==1,'V1.23 loader version mismatch')
          File.binwrite(loader,loader_source.sub("var version='V1.23';","var version='V1.24';"))
          File.write('build/v124_speed_maps.json',JSON.generate(speed_maps),mode:'w:UTF-8')
          puts 'PASS V1.24 version markers updated; loader unchanged apart from version.'
          RUBY_V124_PATCH
          ruby -c build/patch_v124.rb
          ruby build/patch_v124.rb site
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Exhaustively verify all maps, events, and unaffected files
        shell: bash
        run: |
          set -euo pipefail
          cat > build/verify_v124.rb <<'RUBY_V124_VERIFY'
          # encoding: utf-8
          require 'json'
          require 'zlib'
          require 'digest'
          module RPG
            class Map;end
            class MapInfo;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class Tileset;end
            class MoveRoute;end
            class MoveCommand;end
            class EventCommand;end
            class AudioFile;end
          end
          [Color = Class.new, Tone = Class.new, Table = Class.new].each do |klass|
            klass.define_singleton_method(:_load) do |raw|
              object=allocate
              object.instance_variable_set(:@sl_raw_payload,raw)
              object
            end
            klass.define_method(:_dump){|_limit|instance_variable_get(:@sl_raw_payload)}
          end
          OLD=File.expand_path(ARGV.fetch(0))
          NEW=File.expand_path(ARGV.fetch(1))
          PRE='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          def check(cond,msg);raise msg unless cond;end
          def file(root,name);File.join(root,'knight/gameasync/Data',name);end
          def original_file(name);file(OLD,name);end
          def modified_file(name);file(NEW,name);end
          def iv(obj,key);obj.instance_variable_get(key);end
          changes=[];sources=[];rate_count=0
          (1..47).each do |mid|
            next if [43,44].include?(mid)
            name=PRE+'Map%03d.rxdata'%mid
            next unless File.file?(original_file(name))
            a=Marshal.load(File.binread(original_file(name)))
            b=Marshal.load(File.binread(modified_file(name)))
            aa=iv(a,:@events);bb=iv(b,:@events)
            missing=mid==40 ? [9] : []
            check((aa.keys-bb.keys)==missing && (bb.keys-aa.keys).empty?,"Map#{mid} event set changed")
            (a.instance_variables|b.instance_variables).each do |field|
              next if field==:@events
              check(Marshal.dump(iv(a,field))==Marshal.dump(iv(b,field)),"Map#{mid} #{field} changed")
            end
            aa.each do |eid,old|
              next if mid==40 && eid==9
              newer=bb[eid]
              check(newer,"Map#{mid} EV#{eid} disappeared")
              if newer.instance_variable_defined?(:@sl_move_rate)
                rate=newer.instance_variable_get(:@sl_move_rate)
                check(rate.is_a?(Float) && rate>0 && (32.0/rate-[12,16,24,32,36,40,44].min_by{|n|(32.0/rate-n).abs}).abs<0.00001,"Map#{mid} EV#{eid} invalid rate")
                check(!old.instance_variable_defined?(:@sl_move_rate),"Map#{mid} EV#{eid} had speed override")
                newer.remove_instance_variable(:@sl_move_rate)
                check(Marshal.dump(old)==Marshal.dump(newer),"Map#{mid} EV#{eid} other event fields changed")
                rate_count+=1
                sources<<mid
              else
                check(Marshal.dump(old)==Marshal.dump(newer),"Map#{mid} EV#{eid} changed unexpectedly")
              end
            end
            changes<<mid unless File.binread(original_file(name))==File.binread(modified_file(name))
          end
          check(rate_count==329 && sources.uniq.length==33,"Rate coverage #{rate_count} / maps #{sources.uniq.length}")
          check(changes.length==34 && changes.include?(40),"Changed maps #{changes.length}, Map040=#{changes.include?(40)}")
          [43,44].each do |mid|
            name=PRE+'Map%03d.rxdata'%mid
            check(File.file?(original_file(name)) && !File.exist?(modified_file(name)),"Map#{mid} removal failed")
          end
          info=PRE+'MapInfos.rxdata'
          old_infos=Marshal.load(File.binread(original_file(info)))
          new_infos=Marshal.load(File.binread(modified_file(info)))
          check((old_infos.keys-new_infos.keys).sort==[43,44] && new_infos.keys-old_infos.keys==[],"MapInfos set changed")
          new_infos.each do |id,value|
            check(Marshal.dump(old_infos[id])==Marshal.dump(value),"MapInfos entry #{id} changed")
          end
          old_scripts=Marshal.load(File.binread(original_file('Scripts.rxdata')))
          new_scripts=Marshal.load(File.binread(modified_file('Scripts.rxdata')))
          check(old_scripts.length==new_scripts.length,'Script list changed')
          old_scripts.zip(new_scripts).each_with_index do |(o,n),idx|
            check(o[0,2]==n[0,2],'Script metadata changed')
            if idx==26
              old_src=Zlib::Inflate.inflate(o[2]);new_src=Zlib::Inflate.inflate(n[2])
              anchor='    @move_speed = @page.move_speed'
              replacement=anchor+"\n    @sl_move_rate = @event.instance_variable_get(:@sl_move_rate)"
              check(old_src.scan(anchor).length==1 && new_src==old_src.sub(anchor,replacement),'Game_Event script mismatch')
            else
              check(o[2]==n[2],"Unrelated Script #{idx} changed")
            end
          end
          # Script and map semantic equality tests also rule out accidental RGSS Table/Tone/Color loss.
          puts "PASS #{rate_count} EV movement rates on #{sources.uniq.length} maps, #{changes.length} changed map data files"
          puts 'PASS map terrain Table, event pages, event commands, other map fields unchanged'
          puts 'PASS only Game_Event speed assignment added, all other scripts unchanged'
          puts 'PASS Map043/044 removed; Map040 EV9 removed; Girtas Map040 EV5 unchanged'
          RUBY_V124_VERIFY
          ruby -c build/verify_v124.rb
          ruby build/verify_v124.rb build/v123_original site
          python3 - <<'PY_V124_AFTER'
          from pathlib import Path
          import hashlib,json,re
          root=Path('site')
          before=json.loads(Path('build/v123_hashes.json').read_text('utf8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert not set(after)-set(before), 'Unexpected added files'
          removed=set(before)-set(after)
          pre='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          expected_removed={pre+f'Map{mid:03d}.rxdata' for mid in (43,44)}
          expected_removed|={f'knight/gameasync/Data/Map{mid:03d}.rxdata' for mid in (43,44)}
          expected_removed|={f'knight/assets/map-{mid:03d}-v229r115.pack' for mid in (43,44)}
          assert removed==expected_removed,('Unexpected removed files',sorted(removed^expected_removed))
          changed={name for name in after if before.get(name)!=after[name]}
          speed_maps=json.loads(Path('build/v124_speed_maps.json').read_text('utf8'))
          assert len(speed_maps)==33 and len(set(speed_maps))==33, 'Unexpected speed target maps'
          allowed={pre+f'Map{mid:03d}.rxdata' for mid in speed_maps+[40]}
          allowed|={pre+'MapInfos.rxdata','knight/gameasync/Data/Scripts.rxdata',
                    'knight/gameasync/mapping.js','knight/index.html',
                    'knight/js/sl-assets-v229r115.js','index.html'}
          assert changed==allowed,('Non-target change',sorted(changed^allowed))
          assert len(before)==5624 and len(after)==5618
          mapping=(root/'knight/gameasync/mapping.js').read_text('utf8')
          original=Path('build/v123_mapping.js').read_text('utf8')
          expected=original
          for rel in sorted(allowed):
              if not rel.endswith('.rxdata'):continue
              file=root/rel
              token='Data/'+file.name+'?h='
              pattern=re.escape(token)+r'[0-9a-f]{32}'
              assert len(re.findall(pattern,expected))==1,('Original mapping',rel)
              expected=re.sub(pattern,token+hashlib.md5(file.read_bytes()).hexdigest(),expected)
          for mid in (43,44):
              for rel in (f'Data/Map{mid:03d}.rxdata',
                          f'Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap{mid:03d}.rxdata'):
                  line=r'^\["data/[^"\n]+", "'+re.escape(rel)+r'\?h=[^"\n]+"\],?\n'
                  assert len(re.findall(line,expected,re.M))==1,rel
                  expected=re.sub(line,'',expected,flags=re.M)
          assert mapping==expected, 'Unrequested mapping content changed'
          original_loader=Path('build/v123_assets.js').read_text('utf8')
          assert (root/'knight/js/sl-assets-v229r115.js').read_text('utf8')==original_loader.replace(
              "var version='V1.23';","var version='V1.24';")
          for file,original_file in (
              ('knight/index.html','build/v123_knight_index.html'),
              ('index.html','build/v123_root_index.html')):
              text=Path(original_file).read_text('utf8')
              assert (root/file).read_text('utf8')==text.replace('V1.23','V1.24').replace('v1.23','v1.24')
          print('PASS exactly 40 changed existing files, 6 deleted files, no other changes')
          print('PASS all map metadata, speed targets, Girtas, mapping, and version labels verified')
          PY_V124_AFTER

      - name: Publish V1.24 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
