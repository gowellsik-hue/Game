
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V271
# BASE: V267 successful run 41441629897
# FIX: Remove incorrect fixed Scripts.rxdata entry count.
# FIX: Remove duplicate Zenith Sprite_Character update wrapper.
# FIX: Reuse native attack interpreter and event commands.
# FIX: Avoid duplicate monster state updates in one Graphics frame.
# KEEP: Existing browser loader, original combat, drops, maps and graphics.
# NOTE: No monster or common event cloning.

name: build-slknight-web.yml | V271 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: V271 Restore original V267 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41441629897
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V271 Verify original game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s baseline/artifact.tar
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json

          root=Path('site')
          files={
              str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }
          assert len(files)==5610,('Wrong original inventory',len(files))

          base='knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          for name in (
              'Scripts.rxdata',
              pre+'Map025.rxdata',
              pre+'Map016.rxdata',
              pre+'Map021.rxdata',
              pre+'CommonEvents.rxdata'
          ):
              assert base+name in files,name

          drive=(root/'knight/js/drive.js').read_text('utf-8')
          loader=(root/'knight/js/sl-assets-v229r115.js').read_text('utf-8')
          assert 'slV268NetPending' not in drive
          assert 'slV268ZenithReady' not in loader
          assert "var version='V267';" in loader

          Path('build/before.json').write_text(
              json.dumps(files,sort_keys=True),encoding='utf-8'
          )
          print('PASS V267 game inventory, original browser loader')
          PY

      - name: V271 Remove duplicate Zenith runtime processing
        shell: bash
        run: |
          set -euo pipefail

          cat > build/patch.rb <<'RUBY'
          # encoding: UTF-8
          require 'zlib'

          module RPG
            class Map;end
            class MapInfo;end
            class CommonEvent;end
            class AudioFile;end
            class Item;end
            class Weapon;end
            class Armor;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class MoveRoute;end
            class MoveCommand;end
          end

          class Table
            def self._load(raw)
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end
            def _dump(level=0);@raw;end
          end

          class Tone
            def self._load(raw)
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end
            def _dump(level=0);@raw;end
          end
          class Color<Tone;end

          def iv(o,key)
            o.instance_variable_get('@'+key.to_s)
          end

          def put(o,key,value)
            o.instance_variable_set('@'+key.to_s,value)
          end

          def replace_once(s,old,new_code,label)
            n=s.scan(old).length
            raise "#{label}: expected 1, found #{n}" unless n==1
            s.sub(old,new_code)
          end

          root='site/knight/gameasync/Data/'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          map_path=root+pre+'Map025.rxdata'
          scripts_path=root+'Scripts.rxdata'

          map=Marshal.load(File.binread(map_path))
          events=iv(map,:events)
          boss=events.fetch(29)
          pages=iv(boss,:pages)

          raise 'Unexpected Zenith pages' unless pages.length==1
          page=pages.first
          route=iv(page,:move_route)

          raise 'V267 event changed' unless
            iv(page,:move_type)==3 &&
            iv(page,:move_frequency)==6 &&
            iv(page,:trigger)==0 &&
            iv(route,:list).map{|cmd|iv(cmd,:code)}==[10,0]

          raise 'Unexpected event commands' unless
            iv(page,:list).length==1 &&
            iv(iv(page,:list)[0],:code)==0

          originals={}
          events.each do |id,event|
            originals[id]=Marshal.dump(event) unless id==29
          end

          # Native pursuit remains available, but is not active
          # continuously when entering the map.
          put(page,:move_type,0)

          originals.each do |id,raw|
            raise "Other event changed #{id}" unless
              Marshal.dump(events[id])==raw
          end

          scripts=Marshal.load(File.binread(scripts_path))

          # V270 incorrectly required exactly 136 scripts.
          # Validate the two actual patch targets instead.
          raise 'Invalid script archive' unless
            scripts.is_a?(Array) && scripts.length>=136

          raise 'Original Sprite_Character missing' unless
            scripts[28].is_a?(Array) &&
            scripts[28][1]=='Sprite_Character'

          indices=scripts.each_index.select do |i|
            scripts[i].is_a?(Array) &&
            scripts[i][1]=='SLMonsterV267'
          end

          raise 'V267 monster runtime missing or duplicated' unless
            indices.length==1

          index=indices.first
          raise 'Runtime overlaps native renderer' if index==28

          original_other={}
          scripts.each_with_index do |entry,i|
            original_other[i]=Marshal.dump(entry) unless
              i==index || i==28
          end

          runtime=Zlib::Inflate.inflate(scripts[index][2])
          runtime.force_encoding('UTF-8')
          raise 'Invalid runtime encoding' unless runtime.valid_encoding?

          native=Zlib::Inflate.inflate(scripts[28][2])

          [
            ':level=>60',
            ':max_hp=>5200',
            ':physical=>[50,100]',
            ':magic=>[150,300]',
            ':attack_wait=>20',
            ':attack_range=>3',
            ':accuracy=>9999',
            ':exp=>43212',
            ':adena=>[64800,151200]',
            'floor=80',
            '[26,26,0,2,0,6]',
            '[:weapon,41,50]'
          ].each do |marker|
            raise "Approved parameter missing #{marker}" unless
              runtime.include?(marker)
          end

          drops=runtime.scan(/\[:(item|weapon|armor),(\d+),(\d+)\]/)
          raise 'Original drop table changed' unless drops.length==20

          # Remove only the additional Zenith Sprite_Character
          # wrapper. Keep the original class in script 28.
          a=runtime.index("\nclass Sprite_Character\n")
          b=a && runtime.index("\nmodule SLMonster\n",a+1)

          raise 'Sprite wrapper boundaries changed' unless
            a && b && a<b

          old_sprite=runtime[a...b]
          raise 'Unexpected Sprite wrapper' unless
            old_sprite.include?('alias slm_v267_original_update update') &&
            old_sprite.include?('SLMonster.frame_info') &&
            old_sprite.include?('rect.set(frame*cw,row*ch,cw,ch)')

          runtime=runtime[0...a]+runtime[b..-1]

          raise 'Additional sprite class remains' if
            runtime.include?('class Sprite_Character')

          # Change only the frame width used by the original
          # Sprite_Character. All other monsters remain 4 columns.
          new_width=<<'WIDTH'.rstrip
                  @slm_v271_cfg=nil
                  if @character.is_a?(Game_Event)
                    @slm_v271_cfg=SLMonster.config(
                      @character.instance_variable_get(:@map_id),
                      @character.instance_variable_get(:@id))
                  end
                  if @slm_v271_cfg
                    suffix=@character.character_name.sub(
                      @slm_v271_cfg[:sprite],'')
                    columns=@slm_v271_cfg[:frames][suffix] || 4
                    @cw=bitmap.width/columns
                  else
                    @cw=bitmap.width/4
                  end
          WIDTH

          native=replace_once(
            native,
            '@cw = bitmap.width / 4',
            new_width,
            'native sprite width'
          )

          rect_pattern=/
            ^[ \t]*sx = @character\.pattern \* @cw\r?\n
            [ \t]*sy = \(@character\.direction - 2\) \/ 2 \* @ch
          /x

          new_rect=<<'RECT'.rstrip
                  info=@slm_v271_cfg && SLMonster.frame_info(@character)
                  if info && @character.character_name==@slm_v271_cfg[:sprite]+info[0]
                    sx=info[1]*@cw
                    sy=info[2]*@ch
                  else
                    sx=@character.pattern*@cw
                    sy=(@character.direction-2)/2*@ch
                  end
          RECT

          native=replace_once(
            native,
            rect_pattern,
            new_rect,
            'native sprite rectangle'
          )

          File.binwrite('build/native-sprite.rb',native)
          raise 'Native sprite syntax error' unless
            system('ruby','-c','build/native-sprite.rb')

          # Reuse the attack interpreter and command list.
          # The original physical/magic branches are unchanged.
          start=runtime.index('  def self.monster_attack(ev,c,s)')
          finish=start && runtime.index('  def self.reward(',start)

          raise 'Monster attack boundaries missing' unless
            start && finish

          old_attack=runtime[start...finish]

          [
            'Interpreter.new(0)',
            'attack_commands(c)',
            's[:native_interpreter]'
          ].each do |marker|
            raise "Native attack marker missing #{marker}" unless
              old_attack.include?(marker)
          end

          new_attack=<<'ATTACK'
            def self.monster_attack(ev,c,s)
              active=s[:native_interpreter]

              if active && active.running?
                active.update
                return
              end

              target=actor
              return unless target && target.respond_to?(:hp)
              return if target.hp.to_i<=0

              d=distance(ev)
              return unless d

              unless d[0]<=c[:attack_range] && d[1]<=c[:attack_range]
                s[:attack_tick]=0
                return
              end

              s[:attack_tick]+=1
              return if s[:attack_tick]<c[:attack_wait]
              s[:attack_tick]=0

              return unless defined?(Interpreter)

              active ||= Interpreter.new(0)
              s[:native_interpreter]=active
              s[:native_commands] ||= attack_commands(c)

              active.setup(
                s[:native_commands],
                ev.instance_variable_get(:@id)
              )

              s[:attack_count]+=1

              action=s[:attack_count].even? ? 'AltAttack' : 'Attack'
              motion(
                ev.instance_variable_get(:@map_id),
                ev.instance_variable_get(:@id),
                action,
                c[:attack_wait]
              )
            end

          ATTACK

          runtime=runtime[0...start]+new_attack+runtime[finish..-1]

          raise 'Attack interpreter still duplicated' unless
            runtime.scan('Interpreter.new(0)').length==1 &&
            runtime.scan('attack_commands(c)').length==2

          # Avoid updating the Zenith state twice in the same frame.
          old_tick=/
            s=state\(map_id,event_id\)\n
            [ \t]*s\[:tick\]\+=1
          /x

          new_tick=<<'TICK'.rstrip
              s=state(map_id,event_id)
              if defined?(Graphics) && Graphics.respond_to?(:frame_count)
                frame=Graphics.frame_count
                return if s[:last_update_frame]==frame
                s[:last_update_frame]=frame
              end
              s[:tick]+=1

              d=distance(ev)
              if d
                near=(d[0]+d[1]<=10)
                far=(d[0]+d[1]>=14)
                engaged=s[:engaged]==true

                if near && !engaged
                  s[:engaged]=true
                  ev.instance_variable_set(:@move_type,3)
                elsif far && engaged
                  s[:engaged]=false
                  ev.instance_variable_set(:@move_type,0)
                end
              end
          TICK

          runtime=replace_once(
            runtime,
            old_tick,
            new_tick,
            'monster update state'
          )

          # Do not assign the extra monster flag every update.
          runtime=replace_once(
            runtime,
            /^[ \t]*@monster=true if c\r?\n/,
            '',
            'redundant monster flag'
          )

          # Share the movement check between event update
          # and sprite frame selection.
          old_walk=/
            def self\.walking\?\(ev,s\)\n
            [ \t]*moving=ev\.respond_to\?\(:moving\?\) && ev\.moving\?\n
            [ \t]*s\[:last_move_tick\]=s\[:tick\] if moving\n
            [ \t]*moving \|\| \(s\[:tick\]-s\[:last_move_tick\]<=24\)
          /x

          new_walk=<<'WALK'.rstrip
              def self.walking?(ev,s)
                return s[:walk_cached] if s[:walk_cached_tick]==s[:tick]
                moving=ev.respond_to?(:moving?) && ev.moving?
                s[:last_move_tick]=s[:tick] if moving
                s[:walk_cached]=moving || (s[:tick]-s[:last_move_tick]<=120)
                s[:walk_cached_tick]=s[:tick]
                s[:walk_cached]
          WALK

          runtime=replace_once(
            runtime,
            old_walk,
            new_walk,
            'walking status cache'
          )

          # Guard all established combat and reward behavior.
          raise 'Player input attack removed' unless
            runtime.include?('player_strike(map_id,event_id)')

          raise 'Native event update removed' unless
            runtime.include?('SLMonster.update_event(self) if c')

          raise 'Native damage commands missing' unless
            runtime.include?('f.call(117,[57],1)')

          raise 'Damage branch changed' unless
            runtime.include?('[26,26,0,2,0,6]')

          raise 'Drop inventory changed' unless
            runtime.scan(/\[:(item|weapon|armor),(\d+),(\d+)\]/)==drops

          raise 'Passive damage restored' if
            runtime.include?('def self.player_attack(')

          runtime=runtime.gsub('slm_v267','slm_v271')

          File.write(
            'build/monster-runtime.rb',
            runtime,
            encoding:'UTF-8'
          )

          raise 'Monster runtime syntax error' unless
            system('ruby','-c','build/monster-runtime.rb')

          scripts[28][2]=Zlib::Deflate.deflate(native,9)
          scripts[index][0]=99827101
          scripts[index][1]='SLMonsterV271'
          scripts[index][2]=Zlib::Deflate.deflate(runtime,9)

          original_other.each do |i,raw|
            raise "Other script changed #{i}" unless
              Marshal.dump(scripts[i])==raw
          end

          File.binwrite(map_path,Marshal.dump(map))
          File.binwrite(scripts_path,Marshal.dump(scripts))

          restored=Marshal.load(File.binread(scripts_path))

          raise 'Script count changed during patch' unless
            restored.length==scripts.length

          raise 'Runtime serialization mismatch' unless
            restored[index][1]=='SLMonsterV271' &&
            Zlib::Inflate.inflate(restored[index][2]).b==runtime.b

          raise 'Native sprite serialization mismatch' unless
            Zlib::Inflate.inflate(restored[28][2]).b==native.b

          puts "PASS actual script count: #{scripts.length}"
          puts 'PASS removed redundant Zenith sprite wrapper'
          puts 'PASS one native renderer'
          puts 'PASS attack interpreter and commands reused'
          puts 'PASS one monster state update per frame'
          puts 'PASS original damage and twenty drops preserved'
          RUBY

          ruby -c build/patch.rb
          ruby build/patch.rb

      - name: V271 Verify runtime and rendering structure
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          monster=Path('build/monster-runtime.rb').read_text('utf-8')
          native=Path('build/native-sprite.rb').read_bytes()

          assert 'class Sprite_Character' not in monster
          assert monster.count('class Game_Event')==1
          assert monster.count('SLMonster.update_event(self) if c')==1
          assert monster.count('Interpreter.new(0)')==1
          assert monster.count('s[:native_commands] ||= attack_commands(c)')==1
          assert 'frame=Graphics.frame_count' in monster
          assert native.count(b'class Sprite_Character')==1
          assert b'SLMonster.frame_info(@character)' in native

          print('PASS only one native sprite renderer')
          print('PASS only one event update wrapper')
          print('PASS interpreter and command list reused')
          PY

          ruby -c build/native-sprite.rb
          ruby -c build/monster-runtime.rb
          node --check site/knight/js/drive.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: V271 Update game cache identifiers
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re

          root=Path('site')
          game=root/'knight/gameasync'

          manifest=game/'mapping.js'
          source=manifest.read_text('utf-8')

          targets=[
              game/'Data/Scripts.rxdata',
              game/'Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap025.rxdata'
          ]

          for path in targets:
              name='Data/'+path.name
              digest=hashlib.md5(path.read_bytes()).hexdigest()
              pattern=r'('+re.escape(name)+r'\?h=)[0-9a-f]{32}'
              source,count=re.subn(
                  pattern,
                  lambda match:match.group(1)+digest,
                  source
              )
              assert count==1,('Mapping hash mismatch',name,count)

          manifest.write_text(source,encoding='utf-8')

          loader=root/'knight/js/sl-assets-v229r115.js'
          text=loader.read_text('utf-8')

          old="var version='V267';"
          assert text.count(old)==1
          loader.write_text(
              text.replace(old,"var version='V271';"),
              encoding='utf-8'
          )

          for name in ('index.html','knight/index.html'):
              path=root/name
              html=path.read_text('utf-8')
              assert 'V267' in html,name
              html=html.replace('V267','V271')
              html=html.replace('v267','v271')
              path.write_text(html,encoding='utf-8')

          print('PASS V271 version and mapping hashes')
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/dpad.js

      - name: V271 Verify no unrelated changes
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json

          root=Path('site')
          before=json.loads(Path('build/before.json').read_text('utf-8'))

          after={
              str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          pre='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          allowed={
              pre+'Map025.rxdata',
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html',
              'knight/index.html'
          }

          assert len(after)==5610
          assert set(before)==set(after)

          changed={
              path for path in before
              if before[path]!=after[path]
          }

          assert changed==allowed,(
              'Unexpected modified files',
              sorted(changed^allowed)
          )

          for path in before:
              if path.startswith('knight/gameasync/Graphics/'):
                  assert before[path]==after[path],path

          for path in (
              'knight/js/drive.js',
              'knight/js/dpad.js',
              pre+'Map016.rxdata',
              pre+'Map021.rxdata',
              pre+'CommonEvents.rxdata',
              'knight/assets/map-047-v241.pack'
          ):
              assert before[path]==after[path],path

          print('PASS original loader unchanged')
          print('PASS Kurtz and Death Knight unchanged')
          print('PASS graphics, items, common events unchanged')
          print('PASS only Map025 and Scripts modified in game data')
          PY

      - name: V271 Publish game
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
