          html.sub!(/var wTitle = '[^']*'/,"var wTitle = 'SLKnight V14'") or abort 'title variable patch failed'
          html.sub!('<script src="js/drive.js"></script>','<script src="js/drive.js?v=v142i"></script>') or abort 'drive script patch failed'
          html.sub!('<script src="js/dpad.js"></script>','<script src="js/dpad.js?v=v142i"></script>') or abort 'dpad script patch failed'
          html.sub!('<script src="js/dpad.js?v=v142i"></script>','<script src="js/dpad.js?v=v142i"></script><script src="js/sl-debug.js?v=v142o"></script>') or abort 'debug script patch failed'
          html.sub!('<script src="gameasync/mapping.js"></script>','<script src="gameasync/mapping.js?v=v142v"></script>') or abort 'mapping script patch failed'
          html.sub!('width="640" height="480"','width="800" height="600"') or abort 'canvas patch failed'
          html.sub!('<title>MKXP</title>','<title>SLKnight V14</title>') if html.include?('<title>MKXP</title>')
          File.write(path,html)
          RB
          touch player/.nojekyll
      - name: Verify package
