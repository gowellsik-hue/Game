          cat > /tmp/rgssad_extract.py <<'PY'
          from pathlib import Path
          import struct
          import sys

          MASK = 0xffffffff
          KEY0 = 0xDEADCAFE

          def rotate(key):
              return ((key * 7) + 3) & MASK

          src = Path(sys.argv[1])
          out = Path(sys.argv[2])
          out.mkdir(parents=True, exist_ok=True)

          with src.open('rb') as handle:
              header = handle.read(8)
              if header[:7] != b'RGSSAD\0' or len(header) != 8 or header[7] != 1:
                  raise SystemExit(f'unsupported RGSSAD header: {header!r}')

              key = KEY0
              count = 0

              while True:
                  raw = handle.read(4)
                  if not raw:
                      break
                  if len(raw) != 4:
                      raise SystemExit('truncated filename length')

                  length = struct.unpack('<I', raw)[0] ^ key
                  key = rotate(key)

                  if length > 4096:
                      raise SystemExit(f'bad filename length: {length}')

                  encoded = bytearray(handle.read(length))
                  if len(encoded) != length:
                      raise SystemExit('truncated filename')

                  for i in range(length):
                      encoded[i] ^= key & 0xff
                      key = rotate(key)

                  raw = handle.read(4)
                  if len(raw) != 4:
                      raise SystemExit('truncated file length')

                  size = struct.unpack('<I', raw)[0] ^ key
                  key = rotate(key)

                  try:
                      name = bytes(encoded).decode('cp949')
                  except UnicodeDecodeError:
                      name = bytes(encoded).decode('utf-8', 'replace')

                  parts = [
                      part for part in name.replace('\\', '/').split('/')
                      if part not in ('', '.', '..')
                  ]

                  if not parts:
                      raise SystemExit('unsafe path')

                  target = out.joinpath(*parts)
                  target.parent.mkdir(parents=True, exist_ok=True)

                  data_key = key
                  counter = 0
                  remaining = size

                  with target.open('wb') as writer:
                      while remaining:
                          chunk = bytearray(handle.read(min(1 << 20, remaining)))
                          if not chunk:
                              raise SystemExit(f'truncated data: {name}')

                          key_bytes = data_key.to_bytes(4, 'little')

                          for i in range(len(chunk)):
                              chunk[i] ^= key_bytes[counter]
                              counter = (counter + 1) & 3

                              if counter == 0:
                                  data_key = rotate(data_key)
                                  key_bytes = data_key.to_bytes(4, 'little')

                          writer.write(chunk)
                          remaining -= len(chunk)

                  count += 1

          print(f'FAIRY_RGSSAD_EXTRACT_OK {count}')
          PY

