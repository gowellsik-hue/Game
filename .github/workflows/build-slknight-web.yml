name: build-slknight-web.yml | V3.7 | Knight and Wizard Render Scale

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Restore the exact successful V3.3 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45113630421
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Patch native movement and knight and wizard sprite scale and verify all files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site
          tar -xf baseline/artifact.tar -C site
          test -s site/knight/gameasync/Data/Scripts.rxdata

          python3 - <<'PY1'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          assert len(before)==6013,('Original V3.3 artifact file count mismatch',len(before))
          Path('before.json').write_text(json.dumps(before,sort_keys=True),'utf8')
          PY1

          python3 -m venv /tmp/slv37-venv
          /tmp/slv37-venv/bin/python -m pip install --quiet pillow==11.3.0

          cat > /tmp/slv37.py <<'PY3'
          from pathlib import Path
          from PIL import Image
          from statistics import median

          path=Path('site/knight/gameasync/Graphics/Characters/법사.png')
          with Image.open(path) as im:
              assert im.size==(192,384),im.size
              original=im.convert('RGBA')

          cw,ch=48,96

          def anchor(cell):
              mask=cell.getchannel('A').point(lambda v:255 if v>32 else 0)
              bounds=mask.getbbox()
              assert bounds,'Empty walking frame'
              head=[(x,y)
                    for y in range(bounds[1],min(bounds[1]+12,bounds[3]))
                    for x in range(bounds[0],bounds[2])
                    if mask.getpixel((x,y))]
              assert head,'Empty head region'
              n=len(head)
              return ((2*sum(x for x,y in head)+n)//(2*n),
                      (2*sum(y for x,y in head)+n)//(2*n))

          frames=[]
          for row in range(4):
              for col in range(4):
                  cell=original.crop((col*cw,row*ch,(col+1)*cw,(row+1)*ch))
                  bounds=cell.getchannel('A').getbbox()
                  assert bounds,(row,col)
                  ax,ay=anchor(cell)
                  frames.append((row,col,cell,bounds,ax,ay))

          assert len(frames)==16

          x=24
          assert all(b[0]+x-ax>=0 and b[2]+x-ax<=cw
                     for _,_,_,b,ax,ay in frames),'Frame width cannot fit common center'

          lo=max(ay-b[1] for _,_,_,b,ax,ay in frames)
          hi=min(ch-b[3]+ay for _,_,_,b,ax,ay in frames)
          assert lo<=hi,'Frame height cannot fit common center'

          y=max(lo,min(hi,int(median([ay for _,_,_,b,ax,ay in frames])+0.5)))

          result=Image.new('RGBA',original.size,(0,0,0,0))

          for row,col,cell,b,ax,ay in frames:
              dx,dy=x-ax,y-ay
              moved=Image.new('RGBA',(cw,ch),(0,0,0,0))
              sprite=cell.crop(b)
              moved.paste(sprite,(b[0]+dx,b[1]+dy))

              assert anchor(moved)==(x,y),(row,col,anchor(moved),(x,y))
              assert moved.getchannel('A').getbbox()==(
                  b[0]+dx,b[1]+dy,b[2]+dx,b[3]+dy)
              assert moved.crop(moved.getchannel('A').getbbox()).tobytes()==sprite.tobytes(),(row,col)

              result.paste(moved,(col*cw,row*ch))
              print('ALIGN',row,col,(ax,ay),'->',(x,y),'shift',(dx,dy))

          result.save(path,optimize=True)

          with Image.open(path) as saved:
              assert saved.size==original.size
              assert saved.convert('RGBA').tobytes()==result.tobytes()
              assert all(
                  anchor(saved.crop((c*cw,r*ch,(c+1)*cw,(r+1)*ch)).convert('RGBA'))==(x,y)
                  for r in range(4) for c in range(4))

          print('PASS 16/16 frames: identical head anchor, original pixels and 48x96 cells retained')
          PY3
          /tmp/slv37-venv/bin/python -m py_compile /tmp/slv37.py
          /tmp/slv37-venv/bin/python /tmp/slv37.py

          cat > /tmp/slknight-v34.rb <<'RUBY'
          require 'zlib'
          require 'digest'
          module RPG
            %w[Actor Item AudioFile].each do |n|
              const_set(n,Class.new) unless const_defined?(n,false)
            end
          end

          %w[Table Tone Color].each do |n|
            Object.const_set(n,Class.new) unless Object.const_defined?(n)
            Object.const_get(n).define_singleton_method(:_load) do |raw|
              obj=allocate
              obj.instance_variable_set(:@raw,raw)
              obj
            end
          end

          def rep(s,old,new,label)
            raise "#{label}: expected one match, got #{s.scan(old).size}" unless s.scan(old).size==1
            s.sub(old,new)
          end

          def edit_script(rows,name)
            matches=rows.select{|r|r.is_a?(Array)&&r[1].to_s.dup.force_encoding('UTF-8')==name}
            raise "#{name}: original script not unique" unless matches.size==1
            row=matches.first
            original=Zlib::Inflate.inflate(row[2]).dup.force_encoding('UTF-8')
            raise "#{name}: invalid script encoding" unless original.valid_encoding?
            crlf=original.include?("\r\n")
            source=original.gsub("\r\n","\n")
            updated=yield(source)
            raise "#{name}: no changes" if updated==source
            RubyVM::InstructionSequence.compile(updated)
            row[2]=Zlib::Deflate.deflate(crlf ? updated.gsub("\n","\r\n").b : updated.b)
          end

          root='site/knight/gameasync'
          data=root+'/Data/Scripts.rxdata'
          rows=Marshal.load(File.binread(data))
          raise 'V3.3 Scripts count changed' unless rows.size==137
          original_rows=rows.map{|r|r.is_a?(Array) ? r.dup : r}
          actor_files=Dir.glob(root+'/Data/*Actors.rxdata').select{|p|File.size(p)>10}
          item_files=Dir.glob(root+'/Data/*Items.rxdata').select{|p|File.size(p)>10}
          raise 'Actor or item data not unique' unless actor_files.size==1 && item_files.size==1
          actors=Marshal.load(File.binread(actor_files.first))
          items=Marshal.load(File.binread(item_files.first))
          raise 'Original Fairy actor differs' unless actors[4].instance_variable_get(:@name).to_s.dup.force_encoding('UTF-8')=='여요정'
          raise 'Original Fairy summon item differs' unless items[1000].instance_variable_get(:@name).to_s.dup.force_encoding('UTF-8').strip=='여요정'

          edit_script(rows,'Game_Character 2') do |s|
            old="    @sl_move_rate = SLV229::Speed.move_rate if self.is_a?(Game_Event) && @event && (@event.name == '[ID힐러 마법사]' || @event.name.to_s.start_with?('동료 '))"
            newer="    @sl_move_rate = 1.0 if self.is_a?(Game_Event) && @event && (@event.name == '[ID힐러 마법사]' || @event.name.to_s.start_with?('동료 '))"
            rep(s,old,newer,'Original speed expression')
          end

          edit_script(rows,'Sprite_Character') do |s|
            anchor="        self.oy = @ch\n      end\n    end\n"
            replacement="        self.oy = @ch\n      end\n      self.zoom_x = (@tile_id == 0 && @character.is_a?(Game_Player) && ['knight_men', 'knight_men_death', 'knight_men좌표', '기사이동모션', 'knight_damage', 'knight_drop'].include?(@character_name) ? 0.90 : (@tile_id == 0 && @character.is_a?(Game_Event) && @character.instance_variable_get(:@event) && @character.instance_variable_get(:@event).name == '[ID힐러 마법사]' ? 1.01 : 1.0))\n      self.zoom_y = self.zoom_x\n    end\n"
            rep(s,anchor,replacement,'Original sprite graphic-change branch')
          end

          edit_script(rows,'Game_Party') do |s|
            raise 'Original lose_item method missing' unless s.match?(/^\s*def lose_item\b/)
            old="    for i in $data_system.party_members\n      @actors.push($game_actors[i])\n    end\n    for id in 1000..1005\n      gain_item(id,1)\n    end\n  end"
            newer="    for i in ($data_system.party_members | [4])\n      @actors.push($game_actors[i])\n    end\n    $game_switches[2001] = @actors.include?($game_actors[4])\n    for id in 1001..1005\n      gain_item(id,1)\n    end\n  end"
            s=rep(s,old,newer,'Original starting members and inventory')
            old="    @actors = new_actors\n    for id in 1000..1005\n      gain_item(id,1) if item_number(id)==0\n    end\n    for id in 4..9\n      $game_switches[2001+id-4] = @actors.include?($game_actors[id])\n    end\n  end"
            newer="    @actors = new_actors | [$game_actors[4]]\n    lose_item(1000,item_number(1000))\n    for id in 1001..1005\n      gain_item(id,1) if item_number(id)==0\n    end\n    for id in 4..9\n      $game_switches[2001+id-4] = @actors.include?($game_actors[id])\n    end\n  end"
            rep(s,old,newer,'Original load inventory and party visibility')
          end

          ['Window_Item','★Window_Item2'].each do |name|
            edit_script(rows,name) do |s|
              old="      if i == 117\n        for id in 1000..1005\n          @data.push($data_items[id]) if $game_party.item_number(id)>0\n        end\n      end"
              newer="      if i == 117\n        for id in 1001..1005\n          @data.push($data_items[id]) if $game_party.item_number(id)>0\n        end\n      end"
              rep(s,old,newer,name+' original companion item display')
            end
          end

          changed=rows.each_index.select{|i|rows[i]!=original_rows[i]}.map{|i|rows[i][1].to_s.dup.force_encoding('UTF-8')}.sort
          expected=['Game_Character 2','Sprite_Character','Game_Party','Window_Item','★Window_Item2'].sort
          raise "Unexpected script changes: #{changed.inspect}" unless changed==expected
          File.binwrite(data,Marshal.dump(rows))
          raise 'Script serialization mismatch' unless Marshal.load(File.binread(data))==rows
          mapper=root+'/mapping.js'
          js=File.binread(mapper).force_encoding('UTF-8')
          raise 'Invalid resource map' unless js.valid_encoding?
          rel='Graphics/Characters/법사.png'
          [['Data/Scripts.rxdata',data],[rel,root+'/'+rel]].each do |name,path|
            pattern=Regexp.new(Regexp.escape(name)+'\\?h=[0-9a-f]{32}')
            raise "Resource reference missing or duplicated: #{name}" unless js.scan(pattern).size==1
            js=js.sub(pattern,name+'?h='+Digest::MD5.file(path).hexdigest)
          end
          File.binwrite(mapper,js)
          puts 'PASS exact approved script changes: '+changed.join(', ')
          RUBY
          ruby -c /tmp/slknight-v34.rb
          ruby /tmp/slknight-v34.rb

          python3 - <<'PY4'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          loader=root/'knight/js/sl-assets-v229r115.js'
          src=loader.read_text('utf8')
          assert src.count("var version='V3.3';")==1
          loader.write_text(src.replace("var version='V3.3';","var version='V3.7';"),'utf8')
          for name in ('index.html','knight/index.html'):
              p=root/name
              src=p.read_text('utf8')
              assert 'V3.3' in src,('Missing current version',name)
              p.write_text(src.replace('V3.3','V3.7').replace('v3.3','v3.7'),'utf8')
          before=json.loads(Path('before.json').read_text('utf8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          changed={p for p in before.keys()&after.keys() if before[p]!=after[p]}
          expected={'knight/gameasync/Data/Scripts.rxdata',
                    'knight/gameasync/Graphics/Characters/법사.png',
                    'knight/gameasync/mapping.js',
                    'knight/js/sl-assets-v229r115.js',
                    'index.html','knight/index.html'}
          assert changed==expected,('Unapproved changed files',sorted(changed^expected))
          assert before.keys()==after.keys(),'Unexpected added or deleted game files'
          print('PASS V3.7: 6 approved changed files; all other files unchanged')
          PY4
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Upload V3.7 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
