name: build-slknight-web.yml | V4.8 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Restore V4.7 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45799624062
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Restore verified equipment source
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 45837615254
          name: SLKnight-V4.8-Equipment-Source
          github-token: ${{ github.token }}
          path: source

      - name: Verify V4.7 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          source=Path('source')
          raw=(source/'manifest.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='b678e0123e40c9d42d693cb16ff4301dc235b158630035ddd347af8f78f533b8'
          manifest=json.loads(raw)
          before={
              str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }
          assert len(before)==6019,len(before)
          loader=root/'knight/js/sl-assets-v229r115.js'
          assert loader.read_bytes().count(b"var version='V4.7';")==1
          for name,info in manifest.items():
              p=source/name
              assert p.is_file(),name
              assert p.stat().st_size==info['bytes'],name
              assert hashlib.sha256(p.read_bytes()).hexdigest()==info['sha256'],name
              if name.startswith('knight/'):
                  assert before[name]==info['sha256'],name
          Path('/tmp/sl48-before.json').write_text(
              json.dumps(before,sort_keys=True),'utf8'
          )
          print('PASS exact V4.7 baseline',len(before))
          print('PASS verified equipment source')
          PYTHON

      - name: Apply original L1J Ivory Tower equipment
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/sl48-patch.rb <<'RUBY'
          # encoding: UTF-8
          require 'zlib'
          require 'json'

          module RPG
            %w[
              Map MapInfo Event EventCommand MoveRoute MoveCommand
              AudioFile CommonEvent Actor Class Weapon Armor Item System
            ].each{|n|const_set(n,::Class.new)}
            Event.const_set(:Page,::Class.new)
            Event::Page.const_set(:Condition,::Class.new)
            Event::Page.const_set(:Graphic,::Class.new)
            Class.const_set(:Learning,::Class.new)
            System.const_set(:Words,::Class.new)
            System.const_set(:TestBattler,::Class.new)
          end

          %w[Table Tone Color].each do |n|
            Object.const_set(n,Class.new do
              def self._load(raw)
                o=allocate
                o.instance_variable_set(:@raw,raw)
                o
              end
              def _dump(depth)
                @raw
              end
            end)
          end

          def iv(o,k)
            o.instance_variable_get(k)
          end

          def utf(s)
            s.to_s.dup.force_encoding('UTF-8')
          end

          def check(ok,msg)
            raise msg unless ok
          end

          def once(s,a,b,label)
            check(s.scan(a).size==1,"#{label}: #{s.scan(a).size} anchors")
            s.sub(a){b}
          end

          def set(o,h)
            h.each do |k,v|
              old=iv(o,"@#{k}".to_sym)
              if v.is_a?(String)&&old.is_a?(String)
                v=v.dup.force_encoding(old.encoding)
              end
              o.instance_variable_set("@#{k}".to_sym,v)
            end
            o
          end

          def fields(o,except=[])
            o.instance_variables.reject{|k|except.include?(k)}.to_h{
              |k|[k,Marshal.dump(iv(o,k))]
            }
          end

          root='site/knight/gameasync/Data'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          path=->(n){File.join(root,pre+n+'.rxdata')}
          read=->(n){Marshal.load(File.binread(path.call(n)))}

          weapons,armors,items,classes=%w[
            Weapons Armors Items Classes
          ].map{|n|read.call(n)}

          check(
            [weapons.size,armors.size,items.size,classes.size]==
            [1000,1000,1006,9],
            'V4.7 database sizes'
          )

          old_w=weapons.map{|o|Marshal.dump(o)}
          old_a=armors.map{|o|Marshal.dump(o)}
          old_i=items.map{|o|Marshal.dump(o)}
          old_c=classes.map{|o|Marshal.dump(o)}

          ws=[
            [170,35,2,'상아탑의 한손검',8,8,5,0,'iron',40000,'sword',1,1,0,0],
            [1000,175,20,'상아탑의 활',2,2,2,1,'wood',40000,'bow',2,-1,0,0],
            [1001,224,83,'상아탑의 지팡이',2,2,0,0,'wood',15000,'staff',1,1,0,7],
            [1002,73,1072,'상아탑의 이도류',11,8,1,0,'iron',20000,'edoryu',2,1,25,0]
          ]

          as=[
            [143,20028,445,'상아탑의 가죽 투구',-1,1,'leather',40000,0,0,0,0],
            [62,20082,110,'상아탑의 티셔츠',-1,4,'cloth',5000,0,0,0,0],
            [57,20126,299,'상아탑의 가죽 갑옷',-3,2,'leather',150000,0,0,0,0],
            [59,20173,710,'상아탑의 가죽 장갑',0,6,'leather',18000,0,0,0,0],
            [61,20206,447,'상아탑의 가죽 샌달',-1,3,'leather',50000,0,0,0,0],
            [144,20232,450,'상아탑의 가죽 방패',-1,0,'leather',50000,0,0,0,0],
            [1000,21138,69,'상아탑의 망토',-2,5,'cloth',10000,10,10,0,0],
            [274,20282,1029,'상아탑의 반지',-1,8,'gemstone',1000,0,0,0,0],
            [1001,21139,2017,'상아탑의 귀걸이',0,11,'gemstone',5000,0,0,1,1]
          ]

          ws.each do |id,lid,gid,name,small,large,hit,dmg,mat,weight,type,hands,range,double,mpr|
            o=if id<weapons.size
              check(
                utf(iv(weapons[id],:@name)).strip==name,
                'Existing weapon identity'
              )
              weapons[id]
            else
              check(id==weapons.size,'Weapon append ID')
              Marshal.load(Marshal.dump(weapons[170]))
            end

            spec={
              item_id:lid,
              invgfx:gid,
              dmg_small:small,
              dmg_large:large,
              hitmodifier:hit,
              dmgmodifier:dmg,
              material:mat,
              weight:weight,
              type:type,
              range:range,
              double_dmg_chance:double,
              add_mpr:mpr,
              add_hp:0,
              add_mp:0,
              add_hpr:0,
              add_sp:0,
              safenchant:6,
              enchant:0
            }

            desc="타격치 #{small}/#{large}. 명중 +#{hit}. 추타 +#{dmg}."
            desc+=" MP 회복 +#{mpr}." if mpr>0
            desc+=" 더블 대미지 #{double}%." if double>0
            tag=hands==2 ? '(2handed)' : ''

            set(o,{
              id:id,
              name:" +0 #{name}#{tag}",
              icon_name:"SL48_#{gid}",
              description:desc,
              atk:small,
              pdef:0,
              mdef:0,
              str_plus:0,
              dex_plus:0,
              agi_plus:0,
              int_plus:0,
              element_set:[],
              plus_state_set:[],
              minus_state_set:[],
              sl_l1j:spec
            })

            weapons[id]=o
          end

          as.each do |id,lid,gid,name,ac,kind,mat,weight,hp,mp,hpr,mpr|
            o=if id<armors.size
              check(
                utf(iv(armors[id],:@name)).strip.sub(/\(\d+\)$/,'')==name,
                "Existing armor identity #{id}"
              )
              armors[id]
            else
              check(id==armors.size,'Armor append ID')
              Marshal.load(Marshal.dump(armors[57]))
            end

            safe=[20282,21139].include?(lid) ? -1 : 4

            spec={
              item_id:lid,
              invgfx:gid,
              ac:ac,
              material:mat,
              weight:weight,
              add_hp:hp,
              add_mp:mp,
              add_hpr:hpr,
              add_mpr:mpr,
              m_def:0,
              safenchant:safe,
              enchant:0
            }

            desc="AC #{ac}."
            desc+=" HP +#{hp}. MP +#{mp}." if hp>0||mp>0
            desc+=" HP 회복 +#{hpr}. MP 회복 +#{mpr}." if hpr>0||mpr>0
            tag=kind>=4 ? "(#{kind+1})" : ''

            set(o,{
              id:id,
              name:" +0 #{name}#{tag}",
              icon_name:"SL48_#{gid}",
              description:desc,
              kind:kind,
              pdef:-ac,
              mdef:0,
              eva:0,
              str_plus:0,
              dex_plus:0,
              agi_plus:0,
              int_plus:0,
              auto_state_id:0,
              guard_element_set:[],
              guard_state_set:[],
              sl_l1j:spec
            })

            armors[id]=o
          end

          o=Marshal.load(Marshal.dump(items[1]))

          set(o,{
            id:1006,
            name:' 상아탑의 화살',
            icon_name:'SL48_7',
            description:'타격치 6/5. 상아탑의 활에 사용하는 화살.',
            scope:0,
            occasion:3,
            common_event_id:0,
            consumable:false,
            price:0,
            sl_l1j:{
              item_id:49310,
              invgfx:7,
              dmg_small:6,
              dmg_large:5,
              material:'wood',
              weight:30,
              stackable:1,
              enchant:0
            }
          })

          items<<o

          {1=>[170,1000,1002],3=>[170,1001]}.each do |cid,ids|
            c=classes.fetch(cid)
            set(c,{
              weapon_set:(iv(c,:@weapon_set)|ids).sort,
              armor_set:(iv(c,:@armor_set)|as.map(&:first)).sort
            })
          end

          check(
            weapons.each_index.select{
              |i|i>=old_w.size||Marshal.dump(weapons[i])!=old_w[i]
            }==ws.map(&:first).sort,
            'Weapon changes'
          )

          check(
            armors.each_index.select{
              |i|i>=old_a.size||Marshal.dump(armors[i])!=old_a[i]
            }==as.map(&:first).sort,
            'Armor changes'
          )

          check(
            items.each_index.select{
              |i|i>=old_i.size||Marshal.dump(items[i])!=old_i[i]
            }==[1006],
            'Item changes'
          )

          check(
            classes.each_index.select{
              |i|Marshal.dump(classes[i])!=old_c[i]
            }==[1,3],
            'Class changes'
          )

          sp=File.join(root,'Scripts.rxdata')
          rows=Marshal.load(File.binread(sp))
          before=rows.map{|r|Marshal.dump(r)}

          edit=lambda do |name,&block|
            a=rows.select{|r|r&&utf(r[1])==name}
            check(a.size==1,name)
            r=a.first
            src=utf(Zlib::Inflate.inflate(r[2]))
            s=block.call(src.gsub("\r\n","\n"))
            RubyVM::InstructionSequence.compile(s)
            s=s.gsub("\n","\r\n") if src.include?("\r\n")
            check(s!=src,name)
            r[2]=Zlib::Deflate.deflate(s)
          end

          edit.call('Game_Actor') do |s|
            %w[hp sp].each_with_index do |n,col|
              a="  def base_max#{n}\n    return @sl44_levels[@level][#{col}] if @sl44_levels && @sl44_levels[@level]\n    return $data_actors[@actor_id].parameters[#{col}, @level]\n  end"
              key=col==0 ? 'add_hp' : 'add_mp'
              b="  def base_max#{n}\n    n = @sl44_levels && @sl44_levels[@level] ? @sl44_levels[@level][#{col}] : $data_actors[@actor_id].parameters[#{col}, @level]\n    return n + equipments.compact.inject(0){|v,i| v + (i.instance_variable_get(:@sl_l1j) || {})[:#{key}].to_i}\n  end"
              s=once(s,a,b,"Equipment max#{n}")
            end

            once(s,'  def equippable?(item)',<<'SRC'.chomp,'Starter class restriction')
            def equippable?(item)
              if item.is_a?(RPG::Weapon) && [1000,1001,1002].include?(item.id)
                form=@sl43_form.to_s
                return false unless (item.id==1000 && form.end_with?('요정')) || (item.id==1001 && (form.end_with?('법사') || (@actor_id==3 && form.empty?))) || (item.id==1002 && form.end_with?('다엘'))
              end
          SRC
          end

          edit.call('Multi-slot script : Actor') do |s|
            once(
              s,
              '    if @equip_type_force != nil then equip_type = @equip_type_force end',
              <<'SRC'.chomp,
              'Native weapon equip restriction'
            )
              if @equip_type_force != nil then equip_type = @equip_type_force end
              if self.equip_mode != 'RESTORE' && equip_type==0 && [1000,1001,1002].include?(id)
                return unless equippable?($data_weapons[id])
              end
          SRC
          end

          edit.call('Window_EquipItem') do |s|
            once(
              s,
              'weapon_set.include?(i)',
              'weapon_set.include?(i) && @actor.equippable?($data_weapons[i])',
              'Weapon list'
            )
          end

          edit.call('Multi-slot script : Windows') do |s|
            once(
              s,
              'weapon_set.include?(i)',
              'weapon_set.include?(i) && @actor.equippable?($data_weapons[i])',
              'Offhand list'
            )
          end

          check(
            rows.each_index.select{
              |i|Marshal.dump(rows[i])!=before[i]
            }.map{|i|utf(rows[i][1])}.sort==
            [
              'Game_Actor',
              'Multi-slot script : Actor',
              'Multi-slot script : Windows',
              'Window_EquipItem'
            ].sort,
            'Script changes'
          )

          map=read.call('Map047')
          events=iv(map,:@events)
          recruit=events.fetch(14)

          check(
            utf(iv(recruit,:@name))=='[ID고용사]'&&
            [iv(recruit,:@x),iv(recruit,:@y)]==[370,138],
            'V4.7 recruiter'
          )

          old_map=fields(map,[:@events])
          old_events=events.transform_values{|e|Marshal.dump(e)}
          old_recruit=fields(recruit,[:@pages])
          pages=iv(recruit,:@pages)

          check(pages.size==2,'Recruiter pages')

          old_pages=pages.map{|p|fields(p,[:@list])}

          needle='a=$game_actors[@sl43_slot]; a.instance_variable_set(:@sl43_hired,true); $game_party.lose_gold(10000); $game_switches[1997+@sl43_slot]=true; $game_map.need_refresh=true; true'

          reset='[:@weapon_id,:@armor1_id,:@armor2_id,:@armor3_id,:@armor4_id].each{|k|a.instance_variable_set(k,0)}; a.instance_variable_set(:@weapon_ids,Array.new(a.weapon_slots.size,0)); a.instance_variable_set(:@armor_ids,Array.new(a.armor_slots.size,0)); '

          new_code=<<'SRC'.strip
          f=a.instance_variable_get(:@sl43_form).to_s; w=f.end_with?('기사') ? 170 : (f.end_with?('요정') ? 1000 : (f.end_with?('법사') ? 1001 : 1002)); a.equip_from_menu=false; a.equip_type_force=nil; $game_party.gain_weapon(w,1); a.equip(0,w); [[1,144],[2,143],[3,57],[4,61],[5,62],[6,1000],[7,59],[9,274],[12,1001]].each{|slot,id| next if slot==1 && [1000,1002].include?(w); $game_party.gain_armor(id,1); a.equip(slot,id)}; $game_party.gain_item(1006,1000) if w==1000; a.recover_all;
          SRC

          pages.each do |pg|
            list=iv(pg,:@list)
            before=list.map{|c|Marshal.dump(c)}
            changed=[]
            hire=0
            rehire=0

            list.each_with_index do |c,i|
              next unless iv(c,:@code)==355
              p=iv(c,:@parameters)
              next unless p[0].is_a?(String)
              s=utf(p[0])
              out=nil

              if s==needle
                out=s.sub(
                  'a.instance_variable_set(:@sl43_hired,true);',
                  new_code+' a.instance_variable_set(:@sl43_hired,true);'
                )
                hire+=1
              elsif s.include?(reset)&&s.include?('$game_party.lose_gold(@sl43_price)')
                out=once(s,reset,'','Rehire gear reset')
                rehire+=1
              end

              next unless out

              RubyVM::InstructionSequence.compile(out)
              p[0]=out.force_encoding(p[0].encoding)
              changed<<i
            end

            check(
              [hire,rehire]==[8,1],
              "Hire and rehire branches #{hire}/#{rehire}"
            )

            check(
              list.each_index.select{
                |i|Marshal.dump(list[i])!=before[i]
              }==changed,
              'Other event commands'
            )
          end

          check(
            fields(map,[:@events])==old_map&&
            fields(recruit,[:@pages])==old_recruit&&
            pages.map{|p|fields(p,[:@list])}==old_pages,
            'Other map/page data'
          )

          check(
            events.keys==old_events.keys&&
            events.all?{|id,e|id==14||Marshal.dump(e)==old_events[id]},
            'Other events'
          )

          updates={
            sp=>rows,
            path.call('Weapons')=>weapons,
            path.call('Armors')=>armors,
            path.call('Items')=>items,
            path.call('Classes')=>classes,
            path.call('Map047')=>map
          }

          updates.each do |p,o|
            raw=Marshal.dump(o)
            File.binwrite(p,raw)
            check(
              Marshal.dump(Marshal.load(File.binread(p)))==raw,
              "Roundtrip #{p}"
            )
          end

          puts 'PASS 4 weapons'
          puts 'PASS 9 armors'
          puts 'PASS 1 arrow'
          puts 'PASS 16 new hires and 2 rehire branches'
          RUBY

          ruby -c /tmp/sl48-patch.rb
          ruby /tmp/sl48-patch.rb

      - name: Connect original Sanctuary equipment icons
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import base64
          import hashlib
          import json
          import re
          import struct

          root=Path('site')
          game=root/'knight/gameasync'
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          manifest=json.loads(
              Path('source/manifest.json').read_text('utf8')
          )

          names=['Scripts.rxdata']+[
              pre+n+'.rxdata'
              for n in ('Weapons','Armors','Items','Classes','Map047')
          ]

          mapper=game/'mapping.js'
          s=mapper.read_text('utf8')

          bitmap=game/'bitmap-map.js'
          b=bitmap.read_text('utf8')

          pack=root/'knight/assets/icons-v229r115.pack'
          raw=pack.read_bytes()

          assert len(raw)==592924,len(raw)

          length=struct.unpack_from('<I',raw)[0]
          head=json.loads(raw[4:4+length])
          body=raw[4+length:]
          rows=head['files']

          assert head['kind']=='icons'
          assert len(rows)==395
          assert len({x[0] for x in rows})==395

          assert all(
              len(x)==3
              and 0<=x[1]<=len(body)-x[2]
              and x[2]>0
              and ('"'+x[0]+'"') in s
              for x in rows
          )

          assert all(
              body[x[1]:x[1]+8]==b'\x89PNG\r\n\x1a\n'
              for x in rows
          )

          old_rows=[list(x) for x in rows]
          old_body=body

          for name in names:
              p=game/'Data'/name
              old=Path('source/knight/gameasync/Data')/name
              pattern=re.escape('Data/'+name+'?h=')+r'[0-9a-f]{32}'

              old_marker=(
                  'Data/'+name+'?h='+
                  hashlib.md5(old.read_bytes()).hexdigest()
              )

              assert re.findall(pattern,s)==[old_marker],name

              marker=(
                  'Data/'+name+'?h='+
                  hashlib.md5(p.read_bytes()).hexdigest()
              )

              assert marker!=old_marker,name
              s=re.sub(pattern,lambda _:marker,s)

          ids=[
              2,20,83,1072,
              445,110,299,710,447,
              450,69,1029,2017,7
          ]

          new_mapping=[]
          new_bitmap=[]
          added=[]

          for gid in ids:
              img=Path('source/ivory-icons')/f'{gid}.png'
              png=img.read_bytes()

              assert hashlib.sha256(png).hexdigest()==(
                  manifest[f'ivory-icons/{gid}.png']['sha256']
              )

              assert png[:8]==b'\x89PNG\r\n\x1a\n'

              w,h=struct.unpack_from('>II',png,16)
              assert 0<w<=32 and 0<h<=32

              name=f'SL48_{gid}'
              key='graphics/icons/'+name.lower()
              rel='Graphics/Icons/'+name+'.png'
              p=game/rel

              assert key not in s
              assert key not in b
              assert not p.exists()

              p.write_bytes(png)
              added.append(str(p.relative_to(root)))

              rows.append([key,len(body),len(png)])
              body+=png

              new_mapping.append(
                  json.dumps([
                      key,
                      rel+'?h='+hashlib.md5(png).hexdigest()
                  ],ensure_ascii=False)+','
              )

              new_bitmap.append(
                  json.dumps(key)+': '+json.dumps([
                      w,h,
                      'data:image/png;base64,'+
                      base64.b64encode(png).decode('ascii')
                  ])+','
              )

          anchor='];\n\nvar mapping = {};'
          assert s.count(anchor)==1

          s=s.replace(
              anchor,
              '\n'.join(new_mapping)+'\n'+anchor
          )

          assert b.rstrip().endswith('};')
          end=b.rfind('};')
          b=b[:end]+'\n'.join(new_bitmap)+'\n'+b[end:]

          assert rows[:395]==old_rows
          assert body[:len(old_body)]==old_body
          assert len(rows)==409

          header=json.dumps(
              head,
              ensure_ascii=False,
              separators=(',',':')
          ).encode('utf8')

          pack.write_bytes(
              struct.pack('<I',len(header))+header+body
          )

          mapper.write_text(s,'utf8')
          bitmap.write_text(b,'utf8')

          loader=root/'knight/js/sl-assets-v229r115.js'
          s=loader.read_text('utf8')

          replacements=[
              (
                  "var version='V4.7';",
                  "var version='V4.8';"
              ),
              (
                  "'icons-v229r115.pack'",
                  "'icons-v229r115.pack?v=V4.8'"
              ),
              (
                  "if(n!==395)throw new Error('Expected 395 icons, received '+n);",
                  "if(n!==409)throw new Error('Expected 409 icons, received '+n);"
              )
          ]

          for a,c in replacements:
              assert s.count(a)==1,a
              s=s.replace(a,c)

          loader.write_text(s,'utf8')

          for name in ('index.html','knight/index.html'):
              p=root/name
              s=p.read_bytes()
              assert b'V4.7' in s,name

              p.write_bytes(
                  s.replace(b'V4.7',b'V4.8')
                   .replace(b'v4.7',b'v4.8')
              )

          Path('/tmp/sl48-added-icons.json').write_text(
              json.dumps(added),
              'utf8'
          )

          print('PASS 395 original icons unchanged')
          print('PASS 14 original Sanctuary icons added')
          print('PASS 409 total inventory icons')
          PYTHON

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/gameasync/bitmap-map.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Verify exact changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          import json
          import struct

          root=Path('site')
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          before=json.loads(
              Path('/tmp/sl48-before.json').read_text('utf8')
          )

          after={
              str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          names=['Scripts.rxdata']+[
              pre+n+'.rxdata'
              for n in (
                  'Weapons','Armors','Items',
                  'Classes','Map047'
              )
          ]

          allowed={
              'knight/gameasync/Data/'+n for n in names
          }|{
              'knight/gameasync/mapping.js',
              'knight/gameasync/bitmap-map.js',
              'knight/js/sl-assets-v229r115.js',
              'knight/assets/icons-v229r115.pack',
              'index.html',
              'knight/index.html'
          }

          added=set(json.loads(
              Path('/tmp/sl48-added-icons.json').read_text('utf8')
          ))

          assert len(added)==14
          assert set(after)-set(before)==added
          assert not set(before)-set(after)

          changed={
              p for p in before
              if before[p]!=after[p]
          }

          assert changed==allowed,sorted(changed^allowed)
          assert len(after)==6033

          pack=root/'knight/assets/icons-v229r115.pack'
          raw=pack.read_bytes()
          length=struct.unpack_from('<I',raw)[0]
          head=json.loads(raw[4:4+length])
          body=raw[4+length:]

          assert head['kind']=='icons'
          assert len(head['files'])==409
          assert len({row[0] for row in head['files']})==409

          for key,offset,size in head['files']:
              assert 0<=offset<=len(body)-size
              assert body[offset:offset+8]==b'\x89PNG\r\n\x1a\n',key

          print('PASS approved modified files',len(changed))
          print('PASS added icon files',len(added))
          print('PASS unchanged files',len(before)-len(changed))
          print('PASS V4.8')
          PYTHON

      - name: Upload V4.8 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
