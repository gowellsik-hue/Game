# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R117
# BASE: successfully deployed V229R115, run 40610543270.
# FIX: restore (+12,+6) visual projection on BOTH Map045 and Map046.
# FIX: restore matching inverse coordinates on BOTH dungeon floors.
# FIX: remove R111 monster-specific native movement, chase, occupancy overrides.
# KEEP: player native movement, wall masks, original maps, doors, spawn data,
#       approved respawn distribution, graphics, 4-way pad, R115 preloading.
name: build-slknight-web.yml | V229R117 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: V229R117 Restore deployed R115
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40610543270
          name: github-pages
          github-token: ${{ github.token }}
          path: r115

      - name: V229R117 Verify exact original game
        shell: bash
        run: |
          set -euo pipefail

          test -s r115/artifact.tar
          mkdir -p site build
          tar -xf r115/artifact.tar -C site

          python3 - <<'PY_BASE'
          from pathlib import Path
          import hashlib
          import json

          root=Path('site')
          files={
              str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          assert len(files)==5566, ('Wrong R115 baseline',len(files))

          expected={
              'knight/gameasync/Data/Scripts.rxdata':
                  'e7cc01b36ad7edc18d8026854f4ae37932ebadb74e54d2b43ab47cc6ae112aee',
              'knight/js/dpad.js':
                  '2bd401adf130339d154ce6a8efd0127cefd9b1bc58bc60d1de68e8b6d8b7a791',
              'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap045.rxdata':
                  'f47de87af6b4e607bf632818a711619dc8ca4e747196a123a76ac7db8ffc3ba6',
              'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap046.rxdata':
                  'dc89d908f5247442e08dddc11f5bcf6505a77890bd82ab59b790e00e3e5f024c'
          }

          for name,sha in expected.items():
              assert files[name]==sha, ('Wrong R115 file',name)

          assert 'V229R115' in (root/'knight/index.html').read_text('utf-8')
          assert (root/'knight/js/sl-assets-v229r115.js').is_file()

          Path('build/before.json').write_text(json.dumps(files,sort_keys=True))
          print('PASS R115 original game baseline')
          PY_BASE

      - name: V229R117 Restore BOTH floor offsets and original monster movement
        shell: bash
        run: |
          set -euo pipefail

          cat > build/r117_patch.rb <<'R117_RUBY'
          require 'zlib'
          require 'digest'

          path='site/knight/gameasync/Data/Scripts.rxdata'
          scripts=Marshal.load(File.binread(path))

          raise 'Wrong scripts count' unless scripts.size==136

          source=Zlib::Inflate.inflate(scripts[134][2])

          raise 'Missing native module' unless
            source.include?('module SLTI_Native66')

          raise 'Missing original direction masks' unless
            source.include?('module SLTI_V229R97Corner')

          def replace_once(source,old_text,new_text,label)
            count=source.scan(Regexp.new(Regexp.escape(old_text))).length
            raise "#{label}: expected 1 match, got #{count}" unless count==1
            source.sub(old_text,new_text)
          end

          # Restore the approved right/down offset on BOTH native floors.
          # Map045 and Map046 must use the same (+12,+6) projection.

          original_project=<<'ORIGINAL_PROJECT'
            def self.project(mid,x,y)
              px=12*(x+y)-784128
              py=6*(y-x)+YOFFSET[mid]
              return [px,py]
            end
          ORIGINAL_PROJECT

          restored_project=<<'RESTORED_PROJECT'
            def self.project(mid,x,y)
              px=12*(x+y)-784128
              py=6*(y-x)+YOFFSET[mid]
              if mid==45 || mid==46
                px+=12
                py+=6
              end
              return [px,py]
            end
          RESTORED_PROJECT

          source=replace_once(
            source,
            original_project,
            restored_project,
            'Restore Map045 and Map046 visual offset'
          )

          # Restore matching inverse coordinates on BOTH floors.
          # Never adjust only one floor.

          original_inverse=<<'ORIGINAL_INVERSE'
            def self.nearest(mid,rx,ry,radius=16)
              return nil unless active_map?(mid)
              u=rx*16+8
              v=ry*16+16
              a=(u+784128).to_f/12
              b=(v-YOFFSET[mid]).to_f/6
          ORIGINAL_INVERSE

          restored_inverse=<<'RESTORED_INVERSE'
            def self.nearest(mid,rx,ry,radius=16)
              return nil unless active_map?(mid)
              u=rx*16+8
              v=ry*16+16
              native_u=u
              native_v=v
              if mid==45 || mid==46
                native_u-=12
                native_v-=6
              end
              a=(native_u+784128).to_f/12
              b=(native_v-YOFFSET[mid]).to_f/6
          RESTORED_INVERSE

          source=replace_once(
            source,
            original_inverse,
            restored_inverse,
            'Restore both floor inverse coordinates'
          )

          # R111 incorrectly forced dungeon monsters onto the player's
          # native S32 movement system. Remove that extension.
          # Keep the player's native movement unchanged.

          source=replace_once(
            source,
            "    return self==$game_player || SLTI_V229R49.monster?(self)\n",
            "    return self==$game_player\n",
            'Remove forced native monster movement on both floors'
          )

          # Revert R111 monster-specific occupancy calculations.
          # Return to the previous RGSS collision occupancy implementation.

          r111_occupancy=<<'R111_OCC'
              unless @through
                $game_map.events.each_value do |other|
                  next if other==self || other.through || other.character_name==''
                  if SLTI_V229R49.monster?(other)
                    # Monster and hero now occupy native S32 cells. Their rounded RGSS
                    # coordinates may coincide even when real S32 cells do not.
                    other.slti_native66_prepare
                    return false if other.instance_variable_get(:@slti_native66_x)==target[0] &&
                                    other.instance_variable_get(:@slti_native66_y)==target[1]
                  else
                    # NPC and scripted events still use their original RGSS coordinates.
                    return false if other.x==nx && other.y==ny
                  end
                end
                if self!=$game_player && $game_player!=nil && !$game_player.through
                  $game_player.slti_native66_prepare
                  return false if $game_player.instance_variable_get(:@slti_native66_x)==target[0] &&
                                  $game_player.instance_variable_get(:@slti_native66_y)==target[1]
                end
              end
          R111_OCC

          original_occupancy=<<'ORIGINAL_OCC'
              unless @through
                $game_map.events.values.each do |other|
                  next if other==self || other.through
                  return false if other.x==nx && other.y==ny && other.character_name!=''
                end
                if self!=$game_player && $game_player!=nil && !$game_player.through
                  return false if $game_player.x==nx && $game_player.y==ny
                end
              end
          ORIGINAL_OCC

          source=replace_once(
            source,
            r111_occupancy,
            original_occupancy,
            'Restore original monster occupancy'
          )

          # Remove the complete R111 custom monster chase implementation.
          # Do not substitute another wall-slide, fallback direction,
          # or position-correction workaround.

          r111_chase=<<'R111_CHASE'

          class Game_Character
            alias slti_r111_original_move_toward_player move_toward_player
            def move_toward_player
              if $game_map==nil || !SLTI_Native66.active_map?($game_map.map_id) ||
                 !SLTI_V229R49.monster?(self)
                return slti_r111_original_move_toward_player
              end
              return if $game_player==nil
              return unless slti_native66_prepare && $game_player.slti_native66_prepare
              dx=@real_x-$game_player.real_x
              dy=@real_y-$game_player.real_y
              return if dx==0 && dy==0
              if dx.abs>=dy.abs
                dx>0 ? move_left : move_right
              else
                dy>0 ? move_up : move_down
              end
            end
          end
          R111_CHASE

          source=replace_once(
            source,
            r111_chase,
            '',
            'Remove R111 monster chase on both floors'
          )

          # Verify exact scope before serializing.

          raise 'Both-floor visual offset missing' unless
            source.include?("if mid==45 || mid==46\n      px+=12\n      py+=6")

          raise 'Both-floor inverse offset missing' unless
            source.include?("if mid==45 || mid==46\n      native_u-=12\n      native_v-=6")

          raise 'Monster native movement remains' if
            source.include?('return self==$game_player || SLTI_V229R49.monster?(self)')

          raise 'Monster chase override remains' if
            source.include?('slti_r111_original_move_toward_player')

          raise 'Original player movement missing' unless
            source.include?('return self==$game_player')

          raise 'Wall direction masks removed' unless
            source.include?('module SLTI_V229R97Corner')

          raise 'Approved respawn logic removed' unless
            source.include?('module SLTI_R111Respawn')

          scripts[134][2]=Zlib::Deflate.deflate(source)

          File.binwrite(path,Marshal.dump(scripts))
          File.binwrite('build/134-r117.rb',source)

          puts 'PASS Map045 (+12,+6) restored'
          puts 'PASS Map046 (+12,+6) restored'
          puts 'PASS Map045/046 inverse offsets restored'
          puts 'PASS monster native movement removed'
          puts 'PASS monster chase override removed'
          puts 'PASS monster occupancy override removed'
          puts 'PASS approved respawn, walls and player movement retained'
          R117_RUBY

          ruby -c build/r117_patch.rb
          ruby build/r117_patch.rb
          ruby -c build/134-r117.rb

      - name: V229R117 Update Scripts cache and versions
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY_CACHE'
          from pathlib import Path
          import hashlib
          import re

          root=Path('site')
          base=root/'knight/gameasync'

          script=(base/'Data/Scripts.rxdata').read_bytes()
          digest=hashlib.md5(script).hexdigest()

          mapping=base/'mapping.js'
          code=mapping.read_text('utf-8')

          pattern=r'(Data/Scripts\.rxdata\?h=)[0-9a-f]{32}'

          code,n=re.subn(
              pattern,
              lambda m:m.group(1)+digest,
              code
          )

          assert n==1,('Scripts mapping update failed',n)
          mapping.write_text(code,encoding='utf-8')

          for name in ('index.html','knight/index.html'):
              path=root/name
              html=path.read_text('utf-8')

              assert 'V229R115' in html
              assert 'V229R117' not in html

              html=html.replace('V229R115','V229R117')
              html=html.replace('?v=v229r115','?v=v229r117')

              path.write_text(html,encoding='utf-8')

          # Keep the entire R115 download system unchanged.
          # Update its displayed version only.

          runtime=root/'knight/js/sl-assets-v229r115.js'
          code=runtime.read_text('utf-8')

          old="var version='V229R115';"
          assert code.count(old)==1

          code=code.replace(
              old,
              "var version='V229R117';"
          )

          runtime.write_text(code,encoding='utf-8')

          print('PASS Scripts cache updated')
          print('PASS R117 version labels updated')
          print('PASS R115 loader and asset pack filenames retained')
          PY_CACHE

          node --check site/knight/js/drive.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/dpad.js
          node --check site/knight/gameasync/mapping.js

      - name: V229R117 Audit BOTH floor projections and monster movement
        shell: bash
        run: |
          set -euo pipefail

          cat > build/r117-audit.rb <<'R117_AUDIT'
          require 'zlib'

          scripts=Marshal.load(
            File.binread('site/knight/gameasync/Data/Scripts.rxdata')
          )

          src=Zlib::Inflate.inflate(scripts[134][2])

          a=src.index("module SLTI_Native66\n")
          b=src.index("\nclass Game_Character",a)

          raise 'Missing S32 coordinate module' unless a && b

          Object.class_eval(src[a...b])

          # The same visual offset is mandatory on both floors.

          [45,46].each do |mid|
            count=0

            x0=SLTI_Native66::ORIGIN_X
            y0=SLTI_Native66::ORIGIN_Y
            width=SLTI_Native66::WIDTH[mid]
            height=SLTI_Native66::HEIGHT[mid]

            (x0...x0+width).step(11) do |x|
              (y0...y0+height).step(7) do |y|
                next if SLTI_Native66.value(mid,x,y)==0

                expected_x=12*(x+y)-784128+12
                expected_y=6*(y-x)+SLTI_Native66::YOFFSET[mid]+6

                projected=SLTI_Native66.project(mid,x,y)

                raise "Wrong floor offset: Map#{mid}, #{x},#{y}" unless
                  projected==[expected_x,expected_y]

                actual_real=SLTI_Native66.real(mid,x,y)
                expected_real=[expected_x*8-64,expected_y*8-128]

                raise "Wrong real coordinates: Map#{mid}" unless
                  actual_real==expected_real

                count+=1
              end
            end

            raise "Insufficient samples for Map#{mid}" unless count>50

            puts "PASS Map#{mid}: #{count} native projection samples"
          end

          raise 'Both-floor inverse adjustment missing' unless
            src.include?('native_u-=12') &&
            src.include?('native_v-=6') &&
            src.include?('if mid==45 || mid==46')

          raise 'R111 monster chase remains' if
            src.include?('slti_r111_original_move_toward_player')

          raise 'R111 monster native movement remains' if
            src.include?('return self==$game_player || SLTI_V229R49.monster?(self)')

          raise 'Original monster occupancy absent' unless
            src.include?('$game_map.events.values.each do |other|')

          raise 'Player S32 movement missing' unless
            src.include?('return self==$game_player')

          raise 'Approved spawn system missing' unless
            src.include?('module SLTI_R111Respawn')

          raise 'Original wall direction masks missing' unless
            src.include?('module SLTI_V229R97Corner')

          puts 'PASS Map045 and Map046 both use restored coordinates'
          puts 'PASS R111 monster movement modifications removed'
          puts 'PASS player movement, wall masks and respawn preserved'
          R117_AUDIT

          ruby build/r117-audit.rb

          python3 - <<'PY_FILES'
          from pathlib import Path
          import hashlib
          import json

          root=Path('site')

          before=json.loads(
              Path('build/before.json').read_text('utf-8')
          )

          after={
              str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }

          assert len(before)==5566
          assert len(after)==len(before)
          assert after.keys()==before.keys()

          changed={
              name for name in before
              if before[name]!=after[name]
          }

          expected={
              'index.html',
              'knight/index.html',
              'knight/gameasync/mapping.js',
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/js/sl-assets-v229r115.js'
          }

          assert changed==expected,(
              'Unapproved source changes',changed^expected
          )

          # Map data, doors and original event coordinates are immutable.

          for mid in (45,46):
              name=(
                  'knight/gameasync/Data/'
                  'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
                  f'Map{mid:03d}.rxdata'
              )

              assert before[name]==after[name],(
                  'Original map modified',mid
              )

          # Entire original image, pad, and preload-pack data remains identical.

          for name in before:
              if (
                  name.startswith('knight/assets/') or
                  '/Graphics/' in name or
                  name=='knight/js/dpad.js' or
                  name=='knight/js/drive.js'
              ):
                  assert before[name]==after[name],(
                      'Protected file changed',name
                  )

          print('PASS both native map files and event positions unchanged')
          print('PASS 4-way pad, graphics and map preload packs unchanged')
          print('PASS only five expected files changed')
          PY_FILES

      - name: V229R117 Publish restored BOTH floors and original monster movement
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
