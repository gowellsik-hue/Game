
name: V229 | Reviewed Unified Knight Speed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-slknight-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Try exact V228 Pages artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          repository: gowellsik-hue/Game
          run-id: 38698498776
          name: github-pages
          github-token: ${{ github.token }}
          path: previous

      - name: Restore and validate exact V228 or published V229 game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site /tmp/v229/source /tmp/v229/tests /tmp/v229/baseline/knight/gameasync/Data
          if test -s previous/artifact.tar; then
            tar -xf previous/artifact.tar -C site
            echo V229_RESTORED_EXACT_V228_ARTIFACT
          else
            python3 - <<'PY_FETCH_SITE'
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import hashlib, json, os, re, time
          root = Path('site')
          base = os.environ.get('V229_PUBLIC_BASE','https://gowellsik-hue.github.io/Game/').rstrip('/')+'/'
          fixed = ('index.html','COPYING-mkxp-web.txt','manifest.webmanifest','mkxp.js','mkxp.wasm','js/drive.js','js/dpad.js','js/localforage.min.js')
          def get(url):
            for attempt in range(5):
              try:
                req = Request(url, headers={'User-Agent':'SLKnight-V229-Recovery','Accept-Encoding':'identity'})
                with urlopen(req, timeout=60) as response:
                  return response.read()
              except Exception:
                if attempt == 4: raise
                time.sleep(attempt+1)
          files = {'index.html':(base+'index.html',None)}
          for game in ('knight','elf'):
            for rel in fixed:
              files[game+'/'+rel] = (base+game+'/'+quote(rel,safe='/'),None)
            manifest_name = game+'/gameasync/mapping.js'
            manifest = get(base+manifest_name+'?recover=v229')
            local = root/manifest_name
            local.parent.mkdir(parents=True,exist_ok=True)
            local.write_bytes(manifest)
            raw = manifest.decode('utf-8').split('var mappingArray = ',1)[1].split('];',1)[0]+']'
            for _,asset in json.loads(re.sub(r',\s*\]$',']',raw)):
              rel,sep,digest = asset.partition('?h=')
              if '.' not in Path(rel).name:continue
              if rel.startswith('/') or '..' in Path(rel).parts:
                raise RuntimeError('Invalid asset path '+rel)
              name = game+'/gameasync/'+rel
              if name in files:raise RuntimeError('Duplicate '+name)
              files[name]=(base+game+'/gameasync/'+quote(rel,safe='/')+('?h='+digest if sep else ''),digest if sep else None)
          if len(files)!=5354:raise RuntimeError('Not the expected 5354-file game: '+str(len(files)))
          def fetch(item):
            name,(url,digest)=item
            data = get(url)
            if digest and Path(name).name not in ('mapping.js','bitmap-map.js'):
              if hashlib.md5(data).hexdigest()!=digest:
                raise RuntimeError('MD5 error: '+name)
            local = root/name
            local.parent.mkdir(parents=True,exist_ok=True)
            local.write_bytes(data)
          with ThreadPoolExecutor(max_workers=12) as pool:
            for result in as_completed([pool.submit(fetch,item) for item in files.items() if not (root/item[0]).is_file()]):
              result.result()
          observed={str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}
          if observed!=set(files):raise RuntimeError('Incomplete public game recovery')
          print('V229_RECOVERED_COMPLETE_PUBLISHED_SITE',len(files))
          PY_FETCH_SITE
          fi
          python3 - <<'PY_VERIFY_SOURCE'
          from pathlib import Path
          import hashlib,json,shutil
          root=Path('site')
          actual={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if len(actual)!=5354:raise SystemExit('Expected 5354 source files')
          name1='knight/index.html'
          name2='knight/gameasync/mapping.js'
          name3='knight/gameasync/Data/Scripts.rxdata'
          name4='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata'
          v228={
            name1:'9ff546a76e8c2265b18ba00ce1fad348ae62a2ae7a463690431580c2be37d556',
            name2:'78c824d1c5b857d917bb2c0d13b1f673541ee6b2d1b1df54a17554c477195091',
            name3:'8966a677a9789f3e9c95a058659dcf22b51d98fb1c68dd946a4e6879cf2bbaec',
            name4:'3756a7e9310f8ec7aa6b9b8aa6ddef208c2ef21d5e2b71e76ccaf5022bd2ecfd'
          }
          v229={
            name1:'d376d842fbbde43c437fdfdb0bbdbf67b2e19bc640caaf1f0abc768ab8b66661',
            name2:'2e08a4c239001bc873b4dc7b45c54368e8dc30e8ce3b0f22fda9a5e4c6cb4ea8',
            name3:'72d8c66be04fb793c2d9363a844740432a2ecf01d5c6cb13a518a4a62dd42eb2',
            name4:'bbf5ec438a88f032780f9464a862ca4728f1f34afa1b74053ca7c6a9243ca3ed'
          }
          if all(actual.get(n)==h for n,h in v228.items()):
            version='V228'
            Path('/tmp/v229/original_hashes.json').write_text(json.dumps(actual))
            for path in (name3,name4):
              shutil.copyfile(root/path,Path('/tmp/v229/baseline/knight/gameasync/Data')/Path(path).name)
          elif all(actual.get(n)==h for n,h in v229.items()):
            version='V229'
            Path('/tmp/v229/original_hashes.json').write_text(json.dumps(actual))
          else:raise SystemExit('Unknown public game version; refusing to overwrite')
          Path('/tmp/v229/source_version').write_text(version)
          print('V229_VERIFIED_EXACT_SOURCE',version,'5354_files')
          PY_VERIFY_SOURCE

