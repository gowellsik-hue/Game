name: Deploy SLKnight V14.3z10.6g + SLFairy SAVE BOOT CE FIX

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  FROZEN_106F_SHA: 0eb5b9776827f25860a37209d1bdb248d01cb7d3
  Z105_SHA: e19659507b466b87a671949532b02484bc1faaef
  Z104_SHA: e044e1b6c53646b4c4f21f2dfee4967a68fabbc4
  DUAL_BASE_SHA: 04ce66ec99abc10f77143de53650685db8949532
  CURRENT_Z10_SHA: f545634bafbe1e1e55aaf6489126ad17b07da382
  BASELINE_SHA: c6815cd461dba60ec131898e6d5dd8690dd915ae
  X2_SHA: 6d941bd643dda87b8267ba466e108d1904c22331
  Z1_SHA: 008b6abe81074b7af877806b45f2314004a74f66
  Z3_SHA: 5a46988b048764e8a99700998c1f4ab96a3ec5c1
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  FAIRY_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLFairy_Source_v1.zip
  FAIRY_SHA256: 67b88b5fe0cde3c9f2fada889815f9aa7d0fc94b378025529e9950d55151c70e
  FAIRY_7Z_PASSWORD: http://nemo838.tistory.com/
  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout 10.6f workflow source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.FROZEN_106F_SHA }}
          path: f106src

      - name: Checkout z10.5 source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z105_SHA }}
          path: z105src

      - name: Checkout z10.4 source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z104_SHA }}
          path: z104src

      - name: Checkout dual base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.DUAL_BASE_SHA }}
          path: dualbase

      - name: Checkout z10 source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.CURRENT_Z10_SHA }}
          path: z10src

      - name: Checkout V14.3l baseline
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.BASELINE_SHA }}
          path: baseline

      - name: Checkout V14.3x2 auto base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.X2_SHA }}
          path: x2

      - name: Checkout V14.3z1 monster base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z1_SHA }}
          path: z1

      - name: Checkout V14.3z3 monster base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z3_SHA }}
          path: z3

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake cmake curl ffmpeg freepats git imagemagick libtool make mm-common patch pkg-config python3 rake ruby timidity unzip wget xz-utils fonts-nanum p7zip-full nodejs

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.MKXP_SRC_REF }}
          path: engine

      - name: Cache engine dependencies
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-${{ runner.os }}-${{ env.EMSDK_VER }}-onig25b

      - name: Extract stable 10.6f preparation only
        run: |
          set -euo pipefail
          ruby -ryaml - <<'RB'
          doc=YAML.load_file('f106src/.github/workflows/build-slknight-web.yml')
          steps=doc.fetch('jobs').fetch('build').fetch('steps')
          wanted=[
            ['Extract stable preparation scripts','/tmp/f106_00.sh'],
            ['Build Knight and prepare Fairy','/tmp/f106_01.sh'],
            ['Patch Fairy boot once','/tmp/f106_02.sh']
          ]
          wanted.each do |name,path|
            step=steps.find{|s|s['name']==name}
            abort "F106 STEP MISSING: #{name}" unless step&&step['run']
            File.write(path,step['run'])
          end
          puts 'F106_STABLE_PREP_EXTRACT_OK'
          RB

      - name: Build stable base through Fairy boot patch
        run: |
          set -euo pipefail
          for i in 0 1 2; do
            bash -e "$(printf '/tmp/f106_%02d.sh' "$i")"
          done
          echo F106_STABLE_BASE_OK

      - name: Fix Knight CE4 CE10 CE68 CE107 only
        run: |
          set -euo pipefail
          ruby -EUTF-8:UTF-8 - player/gameasync <<'RB'
          # encoding: UTF-8
          game=ARGV.fetch(0)

          class RawMarshalObject
            def self._load(data)
              o=allocate
              o.instance_variable_set(:@raw,data)
              o
            end
            def _dump(_depth); @raw; end
          end

          class Tone < RawMarshalObject; end
          class Color < RawMarshalObject; end
          class Rect < RawMarshalObject; end
          class Table < RawMarshalObject; end

          module RPG
            class AudioFile; end
            class Animation
              class Frame; end
              class Timing; end
            end
            class Map; end
            class CommonEvent; end
            class Event
              class Page
                class Condition; end
                class Graphic; end
              end
            end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
          end

          def iv(o,n); o.instance_variable_get("@#{n}"); end
          def setiv(o,n,v); o.instance_variable_set("@#{n}",v); end

          def cmd(code,indent=0,params=[])
            c=RPG::EventCommand.new
            setiv(c,:code,code)
            setiv(c,:indent,indent)
            setiv(c,:parameters,params)
            c
          end

          def switch_cmd(indent,id,on)
            cmd(121,indent,[id,id,on ? 0 : 1])
          end

          def var_set(indent,id,val)
            cmd(122,indent,[id,id,0,0,val])
          end

          def var_add(indent,id,val)
            cmd(122,indent,[id,id,1,0,val])
          end

          def move_route(indent,specs)
            route=RPG::MoveRoute.new
            setiv(route,:repeat,false)
            setiv(route,:skippable,false)

            moves=specs.map do |code,params|
              m=RPG::MoveCommand.new
              setiv(m,:code,code)
              setiv(m,:parameters,params)
              m
            end

            tail=RPG::MoveCommand.new
            setiv(tail,:code,0)
            setiv(tail,:parameters,[])
            setiv(route,:list,moves+[tail])

            [cmd(209,indent,[-1,route])] +
              moves.map{|m|cmd(509,indent,[m])}
          end

          def speed(indent,value)
            move_route(indent,[[29,[value]]])
          end

          def branch_script(indent,expr,yes,no=nil)
            out=[cmd(111,indent,[12,expr])]
            out.concat(yes)
            out<<cmd(0,indent+1,[])

            if no
              out<<cmd(411,indent,[])
              out.concat(no)
              out<<cmd(0,indent+1,[])
            end

            out<<cmd(412,indent,[])
            out
          end

          def ui_refresh(indent)
            [
              cmd(355,indent,['Guage.show']),
              cmd(355,indent,['$KeyIcon.ShowIcon'])
            ]
          end

          def call_common(indent,id)
            [cmd(117,indent,[id])]
          end

          def effective_speed_tree(indent)
            other='[58,138,189,264,265,311,390,627,628,629].any?{|i|$game_variables[i].to_i==1}'

            fallback=branch_script(
              indent+2,
              other,
              speed(indent+3,4),
              branch_script(
                indent+3,
                '$game_switches[172]',
                speed(indent+4,4),
                branch_script(
                  indent+4,
                  '$game_switches[171] || $game_switches[368]',
                  speed(indent+5,3),
                  speed(indent+5,2)
                )
              )
            )

            assassin=branch_script(
              indent+1,
              '$game_variables[309].to_i==1',
              speed(indent+2,3),
              fallback
            )

            branch_script(
              indent,
              '$game_variables[263].to_i==1',
              speed(indent+1,5),
              assassin
            )
          end

          cp=Dir.glob(
            File.join(
              game,
              'Data',
              '*CommonEvents.rxdata'
            )
          ).max_by{|p|File.size(p)}

          abort 'Knight CommonEvents missing' unless
            cp&&File.size(cp)>1000

          ce=Marshal.load(
            File.binread(cp)
          )

          [
            3,
            4,
            6,
            8,
            10,
            17,
            33,
            34,
            59,
            60,
            68,
            107
          ].each do |id|
            abort "CE#{id} missing" unless ce[id]
          end

          untouched=[
            3,
            6,
            8,
            17,
            33,
            34,
            59,
            60
          ]

          before={}

          untouched.each do |id|
            before[id]=Marshal.dump(
              ce[id]
            )
          end

          # CE4: courage timer owns courage only.
          # Expiry: OFF 172/1002 -> message/UI -> CE589 -> CE68.
          ce4=ce[4]

          warn4=[
            cmd(355,1,['$BufTime = 1']),
            cmd(
              355,
              1,
              [
                '$메세지.set_text2("***용기의 물약 해제 : 10초전***")'
              ]
            ),
            cmd(655,1,['Guage.show']),
            cmd(355,1,['$BufTime = 0'])
          ]

          expire4=[
            var_set(1,109,0),
            switch_cmd(1,172,false),
            switch_cmd(1,1002,false),
            cmd(
              355,
              1,
              [
                'a = "***당신의 기분이 보통으로 돌아왔습니다.***"'
              ]
            ),
            cmd(
              655,
              1,
              [
                '$메세지.set_text2(a)'
              ]
            )
          ] +
            ui_refresh(1) +
            call_common(1,589) +
            call_common(1,68)

          ce4_list=[
            cmd(106,0,[20]),
            var_add(0,109,1)
          ]

          ce4_list += branch_script(
            0,
            '$game_variables[109].to_i == 290',
            warn4
          )

          ce4_list += branch_script(
            0,
            '$game_variables[109].to_i >= 300',
            expire4
          )

          ce4_list << cmd(0,0,[])

          setiv(
            ce4,
            :list,
            ce4_list
          )

          setiv(
            ce4,
            :trigger,
            2
          )

          setiv(
            ce4,
            :switch_id,
            1002
          )

          # CE10: normal green timer owns switch 171 only.
          # It never changes courage, transforms, or graphics.
          ce10=ce[10]

          warn10=[
            cmd(355,1,['$BufTime = 1']),
            cmd(
              355,
              1,
              [
                '$메세지.set_text2("***속도 향상 물약 해제 : 10초전***")'
              ]
            ),
            cmd(655,1,['Guage.show']),
            cmd(355,1,['$BufTime = 0'])
          ]

          expire10=[
            var_set(1,110,0),
            switch_cmd(1,171,false),
            cmd(
              355,
              1,
              [
                '$메세지.set_text2("***느려지는 것을 느낍니다.***")'
              ]
            )
          ] +
            ui_refresh(1) +
            call_common(1,68)

          ce10_list=[
            cmd(106,0,[20]),
            var_add(0,110,1)
          ]

          ce10_list += branch_script(
            0,
            '$game_variables[110].to_i == 290',
            warn10
          )

          ce10_list += branch_script(
            0,
            '$game_variables[110].to_i >= 300',
            expire10
          )

          ce10_list << cmd(0,0,[])

          setiv(
            ce10,
            :list,
            ce10_list
          )

          setiv(
            ce10,
            :trigger,
            2
          )

          setiv(
            ce10,
            :switch_id,
            171
          )

          # CE107: enhanced green timer owns switch 368 only.
          # It never changes courage, transforms, or graphics.
          ce107=ce[107]

          warn107=[
            cmd(355,1,['$BufTime = 1']),
            cmd(
              355,
              1,
              [
                '$메세지.set_text2("***강화 속도 향상 물약 해제 : 10초전***")'
              ]
            ),
            cmd(655,1,['Guage.show']),
            cmd(355,1,['$BufTime = 0'])
          ]

          expire107=[
            var_set(1,110,0),
            switch_cmd(1,368,false),
            cmd(
              355,
              1,
              [
                '$메세지.set_text2("***느려지는 것을 느낍니다.***")'
              ]
            )
          ] +
            ui_refresh(1) +
            call_common(1,68)

          ce107_list=[
            cmd(106,0,[20]),
            var_add(0,110,1)
          ]

          ce107_list += branch_script(
            0,
            '$game_variables[110].to_i == 1790',
            warn107
          )

          ce107_list += branch_script(
            0,
            '$game_variables[110].to_i >= 1800',
            expire107
          )

          ce107_list << cmd(0,0,[])

          setiv(
            ce107,
            :list,
            ce107_list
          )

          setiv(
            ce107,
            :trigger,
            2
          )

          setiv(
            ce107,
            :switch_id,
            368
          )

          # CE68: pure derived movement speed.
          # Priority:
          # var263=5
          # var309=3
          # other transform=4
          # courage=4
          # green/enhanced-green=3
          # base=2.
          ce68=ce[68]

          ce68_list=
            effective_speed_tree(
              0
            )

          ce68_list <<
            switch_cmd(
              0,
              998,
              false
            )

          ce68_list <<
            cmd(
              0,
              0,
              []
            )

          setiv(
            ce68,
            :list,
            ce68_list
          )

          setiv(
            ce68,
            :trigger,
            2
          )

          setiv(
            ce68,
            :switch_id,
            998
          )

          untouched.each do |id|
            abort(
              "UNRELATED OWNER CHANGED CE#{id}"
            ) unless (
              before[id]==Marshal.dump(ce[id])
            )
          end

          transform_vars=[
            58,
            138,
            189,
            263,
            264,
            265,
            309,
            311,
            390,
            627,
            628,
            629
          ]

          transform_switches=[
            54,
            60,
            152,
            154,
            253,
            254,
            255,
            845,
            869,
            870
          ]

          [
            4,
            10,
            107
          ].each do |id|

            (
              iv(
                ce[id],
                :list
              )||[]
            ).each do |c|

              code=iv(
                c,
                :code
              )

              par=
                iv(
                  c,
                  :parameters
                )||[]

              if (
                code==122 &&
                transform_vars.include?(
                  par[0].to_i
                )
              )
                abort(
                  "CE#{id} writes transform variable #{par[0]}"
                )
              end

              if (
                code==121 &&
                transform_switches.include?(
                  par[0].to_i
                )
              )
                abort(
                  "CE#{id} writes transform switch #{par[0]}"
                )
              end

              if code==209
                route=par[1]

                (
                  iv(
                    route,
                    :list
                  )||[]
                ).each do |mc|

                  abort(
                    "CE#{id} changes graphic"
                  ) if (
                    iv(
                      mc,
                      :code
                    ).to_i==41
                  )
                end

              elsif code==509
                mc=par[0]

                abort(
                  "CE#{id} changes graphic"
                ) if (
                  mc &&
                  iv(
                    mc,
                    :code
                  ).to_i==41
                )
              end
            end
          end

          abort(
            'CE4 writes green state'
          ) if (
            iv(
              ce4,
              :list
            )||[]
          ).any? do |c|

            iv(
              c,
              :code
            )==121 &&
              [
                171,
                368
              ].include?(
                (
                  iv(
                    c,
                    :parameters
                  )||[]
                )[0].to_i
              )
          end

          [
            10,
            107
          ].each do |id|

            abort(
              "CE#{id} writes courage state"
            ) if (
              iv(
                ce[id],
                :list
              )||[]
            ).any? do |c|

              iv(
                c,
                :code
              )==121 &&
                [
                  172,
                  1002
                ].include?(
                  (
                    iv(
                      c,
                      :parameters
                    )||[]
                  )[0].to_i
                )
            end
          end

          abort(
            'CE4 CE589 call missing'
          ) unless (
            iv(
              ce4,
              :list
            )||[]
          ).any? do |c|

            iv(
              c,
              :code
            )==117 &&
              (
                iv(
                  c,
                  :parameters
                )||[]
              )==[589]
          end

          [
            4,
            10,
            107
          ].each do |id|

            abort(
              "CE#{id} CE68 call missing"
            ) unless (
              iv(
                ce[id],
                :list
              )||[]
            ).any? do |c|

              iv(
                c,
                :code
              )==117 &&
                (
                  iv(
                    c,
                    :parameters
                  )||[]
                )==[68]
            end
          end

          (
            iv(
              ce68,
              :list
            )||[]
          ).each do |c|

            code=iv(
              c,
              :code
            )

            par=
              iv(
                c,
                :parameters
              )||[]

            if code==121
              abort(
                'CE68 writes non-998 switch'
              ) unless (
                par[0].to_i==998
              )

            elsif code==122
              abort(
                'CE68 writes variable'
              )

            elsif code==209
              route=par[1]

              (
                iv(
                  route,
                  :list
                )||[]
              ).each do |mc|

                abort(
                  'CE68 changes graphic'
                ) if (
                  iv(
                    mc,
                    :code
                  ).to_i==41
                )

                abort(
                  'CE68 non-speed movement command'
                ) unless (
                  [
                    0,
                    29
                  ].include?(
                    iv(
                      mc,
                      :code
                    ).to_i
                  )
                )
              end

            elsif code==509
              mc=par[0]

              abort(
                'CE68 non-speed continuation'
              ) if (
                mc &&
                iv(
                  mc,
                  :code
                ).to_i!=29
              )
            end
          end

          def proof(
            v263,
            v309,
            other,
            courage,
            green
          )
            return 5 if v263
            return 3 if v309
            return 4 if other
            return 4 if courage
            return 3 if green
            2
          end

          abort(
            'speed proof base'
          ) unless (
            proof(
              false,
              false,
              false,
              false,
              false
            )==2
          )

          abort(
            'speed proof green'
          ) unless (
            proof(
              false,
              false,
              false,
              false,
              true
            )==3
          )

          abort(
            'speed proof enhanced'
          ) unless (
            proof(
              false,
              false,
              false,
              false,
              true
            )==3
          )

          abort(
            'speed proof courage'
          ) unless (
            proof(
              false,
              false,
              false,
              true,
              false
            )==4
          )

          abort(
            'speed proof courage+green'
          ) unless (
            proof(
              false,
              false,
              false,
              true,
              true
            )==4
          )

          abort(
            'speed proof transform263'
          ) unless (
            proof(
              true,
              false,
              false,
              true,
              true
            )==5
          )

          abort(
            'speed proof transform309'
          ) unless (
            proof(
              false,
              true,
              false,
              true,
              true
            )==3
          )

          abort(
            'speed proof other transform'
          ) unless (
            proof(
              false,
              false,
              true,
              true,
              true
            )==4
          )

          File.binwrite(
            cp,
            Marshal.dump(ce)
          )

          puts \
            'KNIGHT_CE4_10_68_107_ONLY_FIX_OK'
          RB

      - name: Build transform preload packs without inline injection
        run: |
          set -euo pipefail

          ruby -EUTF-8:UTF-8 - player/gameasync fairy_player/gameasync <<'RB'
          class RawMarshalObject
            def self._load(data)
              o=allocate
              o.instance_variable_set(:@raw,data)
              o
            end

            def _dump(_depth)
              @raw
            end
          end

          class Tone < RawMarshalObject; end
          class Color < RawMarshalObject; end
          class Rect < RawMarshalObject; end
          class Table < RawMarshalObject; end

          module RPG
            class AudioFile; end

            class Animation
              class Frame; end
              class Timing; end
            end

            class Map; end
            class CommonEvent; end

            class Event
              class Page
                class Condition; end
                class Graphic; end
              end
            end

            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
          end

          def iv(o,n)
            o.instance_variable_get(
              "@#{n}"
            )
          end

          def transform_names(game)
            cp=Dir.glob(
              File.join(
                game,
                'Data',
                '*CommonEvents.rxdata'
              )
            ).max_by{|p|File.size(p)}

            abort(
              "CommonEvents missing: #{game}"
            ) unless (
              cp &&
              File.size(cp)>1000
            )

            ce=Marshal.load(
              File.binread(cp)
            )

            names=[]

            [
              6,
              17,
              34
            ].each do |id|

              event=ce[id]
              next unless event

              (
                iv(
                  event,
                  :list
                )||[]
              ).each do |cmd|

                next unless (
                  iv(
                    cmd,
                    :code
                  )==209
                )

                params=
                  iv(
                    cmd,
                    :parameters
                  )||[]

                route=params[1]
                next unless route

                (
                  iv(
                    route,
                    :list
                  )||[]
                ).each do |move|

                  next unless (
                    iv(
                      move,
                      :code
                    )==41
                  )

                  p=
                    iv(
                      move,
                      :parameters
                    )||[]

                  name=
                    p[0]
                    .to_s
                    .dup

                  name.force_encoding(
                    Encoding::UTF_8
                  )

                  abort(
                    "INVALID UTF8 TRANSFORM NAME bytes=#{p[0].to_s.bytes.inspect}"
                  ) unless (
                    name.valid_encoding?
                  )

                  names << name unless
                    name.empty?
                end
              end
            end

            names=
              names
              .uniq
              .sort

            abort(
              "No transform graphics found: #{game}"
            ) if names.empty?

            names.each do |name|

              file=File.join(
                game,
                'Graphics',
                'Characters',
                "#{name}.png"
              )

              abort(
                "Missing transform graphic: #{file}"
              ) unless (
                File.size?(file)
              )
            end

            names
          end

          knight=
            transform_names(
              ARGV.fetch(0)
            )

          fairy=
            transform_names(
              ARGV.fetch(1)
            )

          File.write(
            '/tmp/knight_transform.txt',
            knight.join("\n")+"\n",
            mode:'w:UTF-8'
          )

          File.write(
            '/tmp/fairy_transform.txt',
            fairy.join("\n")+"\n",
            mode:'w:UTF-8'
          )

          puts(
            "KNIGHT_TRANSFORM_COUNT=#{knight.length}"
          )

          puts(
            "FAIRY_TRANSFORM_COUNT=#{fairy.length}"
          )
          RB

          (
            cd player/gameasync
            bash \
              "$GITHUB_WORKSPACE/engine/extra/make_mapping.sh"
          )

          (
            cd fairy_player/gameasync
            bash \
              "$GITHUB_WORKSPACE/engine/extra/make_mapping.sh"
          )

          source \
            engine/deps/emsdk/emsdk_env.sh \
            >/dev/null

          build_pack() {
            site="$1"
            manifest="$2"
            stem="$3"
            args=()

            while IFS= read -r name; do
              [ -n "$name" ] || continue

              src="$site/gameasync/Graphics/Characters/$name.png"

              test -s "$src"

              args+=(
                --preload
                "$src@/game/Graphics/Characters/$name.png"
              )
            done < "$manifest"

            [ "${#args[@]}" -gt 0 ]

            python3 \
              engine/deps/emsdk/upstream/emscripten/tools/file_packager.py \
              "$site/$stem.data" \
              "${args[@]}" \
              --js-output="$site/$stem.js" \
              --no-node

            test -s \
              "$site/$stem.data"

            test -s \
              "$site/$stem.js"

            node --check \
              "$site/$stem.js"
          }

          build_pack \
            player \
            /tmp/knight_transform.txt \
            sltransform-v106g

          build_pack \
            fairy_player \
            /tmp/fairy_transform.txt \
            sltransform-v106g

          echo \
            TRANSFORM_EXTERNAL_PACKS_OK

      - name: Preserve save namespaces migrate versioned saves and patch browser
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          configs=[
              {
                  'html':Path(
                      'player/index.html'
                  ),
                  'drive':Path(
                      'player/js/drive.js'
                  ),
                  'permanent':
                      'slknight_v14_engine',
                  'old_title':
                      'SLKnight V14.3z100',
                  'title':
                      'SLKnight V14.3z10.6g',
                  'old_cache':
                      'v143z100',
                  'cache':
                      'v143z106gknight',
                  'legacy':[
                      'slknight_v106_engine',
                      'slknight_v106a_engine',
                      'slknight_v106b_engine',
                      'slknight_v106d_engine',
                      'slknight_v106e_engine',
                      'slknight_v106f_engine'
                  ]
              },
              {
                  'html':Path(
                      'fairy_player/index.html'
                  ),
                  'drive':Path(
                      'fairy_player/js/drive.js'
                  ),
                  'permanent':
                      'slfairy_v105_engine',
                  'old_title':
                      'SLFairy V14.3z10.5',
                  'title':
                      'SLFairy V14.3z10.6g',
                  'old_cache':
                      'v143z105elf',
                  'cache':
                      'v143z106gelf',
                  'legacy':[
                      'slfairy_v143z10_1_engine',
                      'slfairy_v106_engine',
                      'slfairy_v106a_engine',
                      'slfairy_v106b_engine',
                      'slfairy_v106d_engine',
                      'slfairy_v106e_engine',
                      'slfairy_v106f_engine'
                  ]
              }
          ]

          def remove_legacy_touch(
              s,
              name
          ):
              start=(
                  "        if (!is_touch_device()) {"
              )

              end=(
                  "        resize();"
              )

              if s.count(start)!=1:
                  raise SystemExit(
                      f'LEGACY TOUCH START '
                      f'{name} '
                      f'count={s.count(start)}'
                  )

              a=s.index(
                  start
              )

              b=s.index(
                  end,
                  a
              )+len(end)

              s=s[:a]+s[b:]

              if (
                  'is_touch_device()'
                  in s
              ):
                  raise SystemExit(
                      f'is_touch_device remains '
                      f'in {name}'
                  )

              if (
                  "bindKey('d-up'"
                  in s
              ):
                  raise SystemExit(
                      f'legacy bindKey remains '
                      f'in {name}'
                  )

              return s

          def insert_transform_pack(
              s,
              cache,
              name
          ):
              tag=(
                  f'<script '
                  f'src="sltransform-v106g.js'
                  f'?v={cache}"></script>'
              )

              if tag in s:
                  return s

              # Module already exists before this external
              # Emscripten preload-package script executes.
              # mkxp.js itself is dynamically started later.
              pat=re.compile(
                  r'('
                  r'<script[^>]*>'
                  r'.*?'
                  r'var\s+Module\s*=\s*\{'
                  r'.*?'
                  r'</script>'
                  r')',
                  re.S|re.I
              )

              m=pat.search(s)

              if not m:
                  raise SystemExit(
                      f'MODULE SCRIPT BLOCK '
                      f'{name} missing'
                  )

              return (
                  s[:m.end()] +
                  "\n" +
                  tag +
                  s[m.end():]
              )

          def patch_drive(
              path,
              legacy
          ):
              s=path.read_text(
                  encoding='utf-8'
              )

              if (
                  'window.restoreLocalFilesBeforeRun'
                  not in s
              ):
                  raise SystemExit(
                      f'restoreLocalFilesBeforeRun '
                      f'missing: {path}'
                  )

              if (
                  'SL_SAVE_NAMESPACE_MIGRATION_V106G'
                  in s
              ):
                  return

              legacy_json=json.dumps(
                  legacy,
                  ensure_ascii=False,
                  separators=(',',':')
              )

              block=f'''

          // SL_SAVE_NAMESPACE_MIGRATION_V106G
          ;(function(){{
            var slRestoreBase=window.restoreLocalFilesBeforeRun;
            var slLegacyNamespaces={legacy_json};

            function slTime(meta){{
              var t=meta&&Number(meta.t);
              return Number.isFinite(t)?t:0;
            }}

            function slMergeOne(oldNamespace,folder,current){{
              if(!folder||oldNamespace===namespace)return Promise.resolve(current);

              var keys=Object.keys(folder);

              return Promise.all(
                keys.map(function(filename){{
                  var oldMeta=folder[filename]||{{}};
                  var newMeta=current[filename]||null;

                  if(
                    newMeta &&
                    slTime(newMeta)>=slTime(oldMeta)
                  )return Promise.resolve();

                  return localforage
                    .getItem(oldNamespace+filename)
                    .then(function(buf){{
                      if(!buf)return;

                      return localforage
                        .setItem(namespace+filename,buf)
                        .then(function(){{
                          current[filename]=oldMeta;

                          console.log(
                            'SLSAVEMIGRATE|'+
                            oldNamespace+
                            '|'+
                            filename
                          );
                        }});
                    }});
                }})
              ).then(function(){{
                return current;
              }});
            }}

            function slMigrateNamespaces(){{
              return localforage
                .getItem(namespace)
                .then(function(current){{
                  current=current||{{}};

                  var chain=Promise.resolve(current);

                  slLegacyNamespaces.forEach(
                    function(oldNamespace){{
                      chain=chain.then(
                        function(state){{
                          return localforage
                            .getItem(oldNamespace)
                            .then(function(folder){{
                              return slMergeOne(
                                oldNamespace,
                                folder,
                                state
                              );
                            }});
                        }}
                      );
                    }}
                  );

                  return chain.then(
                    function(state){{
                      return localforage
                        .setItem(
                          namespace,
                          state
                        );
                    }}
                  );
                }});
            }}

            window.restoreLocalFilesBeforeRun=function(){{
              var dep='sl-save-migrate-v106g';

              addRunDependency(dep);

              slMigrateNamespaces()
                .then(function(){{
                  slRestoreBase();
                  removeRunDependency(dep);
                }})
                .catch(function(e){{
                  console.error(
                    'SLSAVEMIGRATEERR|'+e
                  );

                  try{{
                    slRestoreBase();
                  }}finally{{
                    removeRunDependency(dep);
                  }}
                }});
            }};
          }})();
          '''

              path.write_text(
                  s+block,
                  encoding='utf-8'
              )

          for c in configs:
              p=c['html']

              s=p.read_text(
                  encoding='utf-8'
              )

              s=remove_legacy_touch(
                  s,
                  str(p)
              )

              s=s.replace(
                  'position:fixed;left:8px;top:8px;',
                  'position:fixed;left:8px;bottom:8px;'
              )

              if (
                  s.count(
                      c['permanent']
                  )<1
              ):
                  raise SystemExit(
                      f"PERMANENT NAMESPACE "
                      f"MISSING {p}: "
                      f"{c['permanent']}"
                  )

              # Namespace is deliberately NOT versioned.
              s=s.replace(
                  c['old_title'],
                  c['title']
              )

              s=s.replace(
                  c['old_cache'],
                  c['cache']
              )

              s=insert_transform_pack(
                  s,
                  c['cache'],
                  str(p)
              )

              p.write_text(
                  s,
                  encoding='utf-8'
              )

              patch_drive(
                  c['drive'],
                  c['legacy']
              )

          # Keep expanded browser error bridge for Fairy.
          # Namespace itself remains permanent.
          p=Path(
              'fairy_player/index.html'
          )

          s=p.read_text(
              encoding='utf-8'
          )

          old_bridge="""  var log=console.log.bind(console);
          console.log=function(){
            var a=[].slice.call(arguments),t=a.join(' ');
            try{marker(t);}catch(e){log('SLAUDIOJSERR|'+e);}
            if(/SLRUNTIMEERR|SLSCRIPTERR/.test(t))err(t);
            log.apply(console,a);
          };
          window.addEventListener('error',function(e){err('JS ERROR | '+e.message);});"""

          new_bridge="""  function report(t){
            t=String(t||'');
            if(/SLRUNTIMEERR|SLSCRIPTERR|Message:|NO SUCH FILE|PHYSFS ERROR|Skipping loading| - err(?:$|\\s)|SLFONTERR|SLAUDIOJSERR|SLTRANSFORMERR/i.test(t))err(t);
          }
          var log=console.log.bind(console),elog=console.error.bind(console);
          console.log=function(){
            var a=[].slice.call(arguments),t=a.join(' ');
            try{
              marker(t);
            }catch(e){
              report('SLAUDIOJSERR|'+e);
              log('SLAUDIOJSERR|'+e);
            }
            report(t);
            log.apply(console,a);
          };
          console.error=function(){
            var a=[].slice.call(arguments),t=a.join(' ');
            report(t);
            elog.apply(console,a);
          };
          window.addEventListener('error',function(e){
            err('JS ERROR | '+e.message);
          });
          window.addEventListener('unhandledrejection',function(e){
            var r=e&&e.reason;
            err(
              'PROMISE ERROR | '+
              (
                r&&r.message
                  ?r.message
                  :String(r)
              )
            );
          });"""

          if old_bridge in s:
              s=s.replace(
                  old_bridge,
                  new_bridge,
                  1
              )
          elif (
              'function report(t)'
              not in s
          ):
              raise SystemExit(
                  'FAIRY ERROR BRIDGE marker missing'
              )

          p.write_text(
              s,
              encoding='utf-8'
          )

          print(
              'SAVE_NAMESPACE_AND_BROWSER_FIX_OK'
          )
          PY

