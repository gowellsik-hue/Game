name: Deploy SLKnight V14.3z10.5e + SLFairy BOOT FIX

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  Z105_SHA: e19659507b466b87a671949532b02484bc1faaef
  Z104_SHA: e044e1b6c53646b4c4f21f2dfee4967a68fabbc4
  DUAL_BASE_SHA: 04ce66ec99abc10f77143de53650685db8949532
  CURRENT_Z10_SHA: f545634bafbe1e1e55aaf6489126ad17b07da382
  BASELINE_SHA: c6815cd461dba60ec131898e6d5dd8690dd915ae
  X2_SHA: 6d941bd643dda87b8267ba466e108d1904c22331
  Z1_SHA: 008b6abe81074b7af877806b45f2314004a74f66
  Z3_SHA: 5a46988b048764e8a99700998c1f4ab96a3ec5c1

  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a

  FAIRY_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLFairy_Source_v1.zip
  FAIRY_SHA256: 67b88b5fe0cde3c9f2fada889815f9aa7d0fc94b378025529e9950d55151c70e
  FAIRY_7Z_PASSWORD: http://nemo838.tistory.com/

  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout frozen z10.5 source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z105_SHA }}
          path: z105src

      - name: Checkout frozen z10.4 successful workflow
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z104_SHA }}
          path: z104src

      - name: Checkout frozen z10.2 dual base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.DUAL_BASE_SHA }}
          path: dualbase

      - name: Checkout frozen z10 workflow source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.CURRENT_Z10_SHA }}
          path: z10src

      - name: Checkout frozen V14.3l baseline
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.BASELINE_SHA }}
          path: baseline

      - name: Checkout frozen V14.3x2 native auto base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.X2_SHA }}
          path: x2

      - name: Checkout frozen V14.3z1 verified monster base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z1_SHA }}
          path: z1

      - name: Checkout frozen V14.3z3 current success
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z3_SHA }}
          path: z3

      - name: Install tools
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            autoconf \
            automake \
            cmake \
            curl \
            ffmpeg \
            freepats \
            git \
            imagemagick \
            libtool \
            make \
            mm-common \
            patch \
            pkg-config \
            python3 \
            rake \
            ruby \
            timidity \
            unzip \
            wget \
            xz-utils \
            fonts-nanum \
            p7zip-full \
            nodejs

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.MKXP_SRC_REF }}
          path: engine

      - name: Cache engine dependencies
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-${{ runner.os }}-${{ env.EMSDK_VER }}-onig25b

      - name: Extract successful z10.5 preparation steps
        run: |
          set -euo pipefail

          ruby -ryaml - <<'RB'
          doc=YAML.load_file(
            'z105src/.github/workflows/build-slknight-web.yml'
          )

          steps=doc
            .fetch('jobs')
            .fetch('build')
            .fetch('steps')

          wanted=[
            [
              'Extract already-passed z10.4 build steps',
              '/tmp/z105_00.sh'
            ],
            [
              'Run frozen successful build through repaired Fairy mappings',
              '/tmp/z105_01.sh'
            ],
            [
              'Canonicalize SLFairy protected data paths and title',
              '/tmp/z105_02.sh'
            ],
            [
              'Rebuild SLFairy mappings after canonicalization',
              '/tmp/z105_03.sh'
            ],
            [
              'Finalize browser boot bridge and cache isolation',
              '/tmp/z105_04.sh'
            ],
            [
              'Build Knight + Fairy launcher with cache-busted entry',
              '/tmp/z105_launcher.sh'
            ]
          ]

          wanted.each do |name,path|
            step=steps.find do |s|
              s['name']==name
            end

            abort(
              "Z105 STEP MISSING: #{name}"
            ) unless (
              step &&
              step['run']
            )

            File.write(
              path,
              step.fetch('run')
            )

            puts(
              "Z105_EXTRACTED #{name}"
            )
          end

          puts(
            "Z105_PREP_EXTRACT_OK count=#{wanted.length}"
          )
          RB

      - name: Run z10.5 successful preparation
        run: |
          set -euo pipefail

          for i in 0 1 2 3 4; do
            f="$(printf '/tmp/z105_%02d.sh' "$i")"

            echo "=========================================="
            echo "RUNNING $f"
            echo "=========================================="

            bash -e "$f"
          done

          echo Z105_PREPARATION_OK

      - name: Fix SLFairy pre-Main boot crashes
        run: |
          set -euo pipefail

          ruby -EUTF-8:UTF-8 -rzlib - fairy_player/gameasync/Data/Scripts.rxdata <<'RB'
          # encoding: UTF-8

          path=ARGV.fetch(0)
          scripts=Marshal.load(File.binread(path))

          def inflate(entry)
            Zlib::Inflate.inflate(entry[2]).force_encoding(Encoding::UTF_8)
          end

          def store(entry, source)
            entry[2]=Zlib::Deflate.deflate(source)
          end

          def entry_for(scripts, name)
            entry=scripts.find do |e|
              e.is_a?(Array) &&
                e.length>=3 &&
                e[1].to_s==name
            end

            abort(
              "FAIRY SCRIPT MISSING: #{name}"
            ) unless entry

            entry
          end

          scene_equip=entry_for(
            scripts,
            'Scene_Equip'
          )

          equip_src=inflate(
            scene_equip
          )

          equip_lifecycle=
            /    Graphics\.transition\r?\n    # 메인 루프\r?\n    loop do\r?\n.*?    @item_window5\.dispose\r?\n  end/m

          count=equip_src.scan(
            equip_lifecycle
          ).length

          abort(
            "FAIRY Scene_Equip lifecycle count=#{count}"
          ) unless count==1

          equip_src.sub!(
            equip_lifecycle,
            <<'RUBY'.chomp
    Graphics.transition
  end

  def dispose
    $game_switches[49] = false if $game_switches
    Graphics.freeze

    @help_window.dispose if @help_window != nil
    @left_window.dispose if @left_window != nil
    @right_window.dispose if @right_window != nil

    @item_window1.dispose if @item_window1 != nil
    @item_window2.dispose if @item_window2 != nil
    @item_window3.dispose if @item_window3 != nil
    @item_window4.dispose if @item_window4 != nil
    @item_window5.dispose if @item_window5 != nil
  end
RUBY
          )

          store(
            scene_equip,
            equip_src
          )

          id_sprite_entry=scripts.find do |e|
            next false unless (
              e.is_a?(Array) &&
              e.length>=3
            )

            begin
              inflate(e).include?(
                'class Sprite_Character < Sprite_Character'
              )
            rescue
              false
            end
          end

          abort(
            'FAIRY broken Sprite_Character ID script missing'
          ) unless id_sprite_entry

          id_output_entry=scripts.find do |e|
            next false unless (
              e.is_a?(Array) &&
              e.length>=3
            )

            begin
              source=inflate(e)

              source.include?(
                'class Game_Event < Game_Event'
              ) &&
                source.include?(
                  'class Game_Player < Game_Player'
                )
            rescue
              false
            end
          end

          abort(
            'FAIRY broken Game_Event ID script missing'
          ) unless id_output_entry

          id_sprite=<<'RUBY'
class Game_Character
  attr_accessor :sprite_id
end

class Sprite_Character
  alias sl_id_original_update update

  def create_id_sprite(text)
    bitmap=Bitmap.new(160,16)

    bitmap.font.name='NanumGothic'
    bitmap.font.size=12
    bitmap.font.bold=false

    bitmap.font.color.set(0,0,0)

    bitmap.draw_text(0,-1,160,16,text,1)
    bitmap.draw_text(0,1,160,16,text,1)
    bitmap.draw_text(-1,0,160,16,text,1)
    bitmap.draw_text(1,0,160,16,text,1)

    bitmap.font.color.set(255,255,255)
    bitmap.draw_text(0,0,160,16,text,1)

    @_id_sprite=Sprite.new(self.viewport)
    @_id_sprite.bitmap=bitmap
    @_id_sprite.opacity=255
    @_id_sprite.ox=80
    @_id_sprite.oy=14
    @_id_sprite.x=self.x
    @_id_sprite.y=self.y-self.oy/2
    @_id_sprite.z=9999
    @_id_sprite_visible=true
  end

  def dispose_id_sprite
    if @_id_sprite!=nil
      if (
        @_id_sprite.bitmap!=nil &&
        !@_id_sprite.bitmap.disposed?
      )
        @_id_sprite.bitmap.dispose
      end

      @_id_sprite.dispose
      @_id_sprite=nil
    end

    @_id_sprite_visible=false
  end

  def update_id_sprite
    if (
      @character.sprite_id!=nil &&
      @character.sprite_id.to_s!=''
    )
      create_id_sprite(
        @character.sprite_id
      ) unless @_id_sprite_visible

      @_id_sprite.x=self.x
      @_id_sprite.y=self.y-self.oy

    elsif @_id_sprite_visible
      dispose_id_sprite
    end
  end

  def update
    sl_id_original_update
    update_id_sprite
  end
end
RUBY

          id_output=<<'RUBY'
class Game_Event
  alias sl_id_original_event_refresh refresh

  def refresh
    sl_id_original_event_refresh

    text=@event.name.dup

    text.gsub!(
      /\x5b[Ii][Dd](.+?)\x5d/
    ) do
      @sprite_id=$1
    end

    @sprite_id=nil if (
      @erased ||
      @character_name==''
    )
  end
end

class Game_Player
  alias sl_id_original_player_refresh refresh

  def refresh
    sl_id_original_player_refresh

    if $game_party.actors.size>0
      @sprite_id=nil
    end
  end
end
RUBY

          store(
            id_sprite_entry,
            id_sprite
          )

          store(
            id_output_entry,
            id_output
          )

          File.binwrite(
            path,
            Marshal.dump(
              scripts
            )
          )

          puts(
            'FAIRY_PREMAIN_BOOT_PATCH_OK'
          )
          RB

          ruby -EUTF-8:UTF-8 -rzlib - fairy_player/gameasync/Data/Scripts.rxdata <<'RB'
          path=ARGV.fetch(0)
          scripts=Marshal.load(File.binread(path))

          def inflate(entry)
            Zlib::Inflate.inflate(entry[2]).force_encoding(Encoding::UTF_8)
          end

          scene=scripts.find do |e|
            e.is_a?(Array) &&
              e.length>=3 &&
              e[1].to_s=='Scene_Equip'
          end

          abort(
            'FAIRY Scene_Equip missing after patch'
          ) unless scene

          scene_src=inflate(
            scene
          )

          abort(
            'FAIRY Scene_Equip dispose missing after patch'
          ) unless scene_src.include?(
            'def dispose'
          )

          broken=[]

          scripts.each_with_index do |e,i|
            next unless (
              e.is_a?(Array) &&
              e.length>=3
            )

            begin
              source=inflate(e)
            rescue
              next
            end

            if source.include?(
              'class Sprite_Character < Sprite_Character'
            )
              broken << [
                i,
                'Sprite_Character self inheritance'
              ]
            end

            if source.include?(
              'class Game_Event < Game_Event'
            )
              broken << [
                i,
                'Game_Event self inheritance'
              ]
            end

            if source.include?(
              'class Game_Player < Game_Player'
            )
              broken << [
                i,
                'Game_Player self inheritance'
              ]
            end
          end

          abort(
            "FAIRY PREMAIN BROKEN SCRIPTS REMAIN: #{broken.inspect}"
          ) unless broken.empty?

          multi=scripts.find do |e|
            next false unless (
              e.is_a?(Array) &&
              e.length>=3
            )

            begin
              inflate(e).include?(
                'alias g7_ms_scene_equip_dispose dispose'
              )
            rescue
              false
            end
          end

          abort(
            'FAIRY multislot dispose wrapper missing'
          ) unless multi

          puts(
            'FAIRY_PREMAIN_BOOT_VERIFY_OK'
          )
          RB

      - name: Move JS error overlay to bottom
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          old = "position:fixed;left:8px;top:8px;"
          new = "position:fixed;left:8px;bottom:8px;"

          for name in (
              "player/index.html",
              "fairy_player/index.html",
          ):
              p=Path(name)
              s=p.read_text()

              count=s.count(old)

              if count != 1:
                  raise SystemExit(
                      f"JS ERROR OVERLAY MARKER {name} count={count}"
                  )

              s=s.replace(
                  old,
                  new,
                  1
              )

              p.write_text(s)

              print(
                  "JS_ERROR_BOTTOM_OK",
                  name
              )
          PY

          grep -Fq \
            'position:fixed;left:8px;bottom:8px;' \
            player/index.html

          grep -Fq \
            'position:fixed;left:8px;bottom:8px;' \
            fairy_player/index.html

          ! grep -Fq \
            'position:fixed;left:8px;top:8px;' \
            player/index.html

          ! grep -Fq \
            'position:fixed;left:8px;top:8px;' \
            fairy_player/index.html

      - name: Verify canonical Fairy files
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          required=[
              'fairy_player/index.html',
              'fairy_player/mkxp.js',
              'fairy_player/mkxp.wasm',
              'fairy_player/gameasync/Game.ini',
              'fairy_player/gameasync/Data/Scripts.rxdata',
              'fairy_player/gameasync/mapping.js',
              'fairy_player/gameasync/bitmap-map.js',
              'fairy_player/gameasync/Graphics/Titles/fairy_title.png',
              'fairy_player/js/dpad.js',
              'fairy_player/js/drive.js',
          ]

          for name in required:
              p=Path(name)

              if (
                  not p.is_file()
                  or
                  p.stat().st_size <= 0
              ):
                  raise SystemExit(
                      'FAIRY REQUIRED FILE BAD: '
                      +name
                  )

              print(
                  'FILE_OK',
                  name,
                  p.stat().st_size
              )

          canonical=[
              'Actors',
              'Classes',
              'Skills',
              'Items',
              'Weapons',
              'Armors',
              'Enemies',
              'Troops',
              'States',
              'Animations',
              'Tilesets',
              'CommonEvents',
              'System',
              'MapInfos',
          ]

          for base in canonical:
              p=Path(
                  'fairy_player/gameasync/Data/'
                  +base+
                  '.rxdata'
              )

              if (
                  not p.is_file()
                  or
                  p.stat().st_size <= 4
              ):
                  raise SystemExit(
                      'FAIRY CANONICAL DATA BAD: '
                      +str(p)
                  )

              print(
                  'DATA_OK',
                  base,
                  p.stat().st_size
              )

          map7=Path(
              'fairy_player/gameasync/Data/Map007.rxdata'
          )

          if (
              not map7.is_file()
              or
              map7.stat().st_size <= 4
          ):
              raise SystemExit(
                  'FAIRY MAP007 BAD'
              )

          if Path(
              'fairy_player/gameasync/Game.rgssad'
          ).exists():
              raise SystemExit(
                  'FAIRY RGSSAD STILL EXISTS'
              )

          print(
              'FAIRY_CANONICAL_FILE_VERIFY_OK'
          )
          PY

      - name: Verify Fairy HTML and JavaScript
        run: |
          set -euo pipefail

          grep -Fq \
            'slfairy_v105_engine' \
            fairy_player/index.html

          grep -Fq \
            'SLFairy V14.3z10.5' \
            fairy_player/index.html

          grep -Fq \
            'v143z105elf' \
            fairy_player/index.html

          grep -Fq \
            "hotButton(hot,0,'A',117)" \
            fairy_player/js/dpad.js

          grep -Fq \
            "hotButton(hot,1,'S',118)" \
            fairy_player/js/dpad.js

          grep -Fq \
            "hotButton(hot,2,'D',119)" \
            fairy_player/js/dpad.js

          grep -Fq \
            "hotButton(hot,3,'Q',120)" \
            fairy_player/js/dpad.js

          grep -Fq \
            "hotButton(hot,4,'F',116)" \
            fairy_player/js/dpad.js

          ! grep -Fq \
            "hotButton(hot,4,'Z',117)" \
            fairy_player/js/dpad.js

          node --check \
            fairy_player/js/dpad.js

          node --check \
            fairy_player/js/drive.js

          node --check \
            player/js/dpad.js

          node --check \
            player/js/drive.js

          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          for html in (
              'player/index.html',
              'fairy_player/index.html'
          ):
              source=Path(
                  html
              ).read_text()

              blocks=[]

              for match in re.finditer(
                  r'<script(?P<attrs>[^>]*)>'
                  r'(?P<body>.*?)'
                  r'</script>',
                  source,
                  re.S | re.I
              ):
                  attrs=match.group(
                      'attrs'
                  ).lower()

                  if 'src=' in attrs:
                      continue

                  body=match.group(
                      'body'
                  )

                  if body.strip():
                      blocks.append(
                          body
                      )

              if not blocks:
                  raise SystemExit(
                      'NO INLINE JS: '
                      +html
                  )

              for index,body in enumerate(
                  blocks
              ):
                  tmp=Path(
                      '/tmp/'
                      +Path(html).parent.name
                      +'_inline_'
                      +str(index)
                      +'.js'
                  )

                  tmp.write_text(
                      body
                  )

                  result=subprocess.run(
                      [
                          'node',
                          '--check',
                          str(tmp)
                      ],
                      capture_output=True,
                      text=True
                  )

                  if result.returncode != 0:
                      raise SystemExit(
                          'INLINE JS ERROR '
                          +html+
                          ' block='+
                          str(index)+
                          '\n'+
                          result.stderr
                      )

              print(
                  'INLINE_JS_OK',
                  html,
                  len(blocks)
              )

          print(
              'FAIRY_HTML_JS_VERIFY_OK'
          )
          PY

      - name: Verify all Fairy Ruby scripts
        run: |
          set -euo pipefail

          ruby \
            -EUTF-8:UTF-8 \
            -rzlib \
            - \
            fairy_player/gameasync/Data/Scripts.rxdata \
            <<'RB'

          scripts=Marshal.load(
            File.binread(
              ARGV[0]
            )
          )

          entries=scripts.select do |e|
            e.is_a?(Array) &&
              e.length>=3
          end

          names=entries.map do |e|
            e[1].to_s
          end

          required=[
            'Web Compatibility',
            'Mobile Diablo Assist',
            'Web Resolution 800x600',
            'Main',
            'Scene_Title',
            'Scene_Map',
            'Game_Map'
          ]

          required.each do |name|
            abort(
              "FAIRY SCRIPT MISSING: #{name}"
            ) unless names.include?(name)
          end

          random_refs=[]
          syntax_errors=[]
          title_ok=false

          entries.each_with_index do |e,i|
            begin
              code=
                Zlib::Inflate
                .inflate(
                  e[2]
                )
                .force_encoding(
                  Encoding::UTF_8
                )
            rescue Zlib::DataError
              next
            end

            if code.match?(
              /Data\/[A-Z]{20,}/
            )
              random_refs << [
                i,
                e[1].to_s
              ]
            end

            if e[1].to_s=='Scene_Title'
              title_ok=
                code.include?(
                  'RPG::Cache.title("fairy_title")'
                )
            end

            begin
              RubyVM::InstructionSequence.compile(
                code,
                "fairy_script_#{i}"
              )
            rescue SyntaxError => ex
              syntax_errors << [
                i,
                e[1].to_s,
                ex.message
              ]
            end
          end

          unless syntax_errors.empty?
            syntax_errors.each do |row|
              puts(
                "SYNTAX_ERROR " \
                "index=#{row[0]} " \
                "name=#{row[1]} " \
                "message=#{row[2]}"
              )
            end

            abort(
              "FAIRY RUBY SYNTAX ERRORS=#{syntax_errors.length}"
            )
          end

          unless random_refs.empty?
            abort(
              "FAIRY RANDOM DATA PATHS REMAIN: #{random_refs.inspect}"
            )
          end

          abort(
            'FAIRY ASCII TITLE PATCH MISSING'
          ) unless title_ok

          puts(
            "FAIRY_RUBY_COUNT=#{entries.length}"
          )

          puts(
            'FAIRY_ALL_RUBY_VERIFY_OK'
          )
          RB

      - name: Build Knight and Fairy launcher
        run: |
          set -euo pipefail

          bash -e \
            /tmp/z105_launcher.sh

          echo \
            Z105_LAUNCHER_EXECUTED

      - name: Verify final dual package
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          required=[
              'player/index.html',

              'player/knight/index.html',
              'player/knight/mkxp.js',
              'player/knight/mkxp.wasm',
              'player/knight/gameasync/Game.ini',
              'player/knight/gameasync/Data/Scripts.rxdata',

              'player/elf/index.html',
              'player/elf/mkxp.js',
              'player/elf/mkxp.wasm',
              'player/elf/gameasync/Game.ini',
              'player/elf/gameasync/Data/Scripts.rxdata',
              'player/elf/gameasync/Data/Actors.rxdata',
              'player/elf/gameasync/Data/System.rxdata',
              'player/elf/gameasync/Data/MapInfos.rxdata',
              'player/elf/gameasync/Data/Map007.rxdata',
              'player/elf/gameasync/Graphics/Titles/fairy_title.png',
          ]

          for name in required:
              p=Path(name)

              if (
                  not p.is_file()
                  or
                  p.stat().st_size <= 4
              ):
                  raise SystemExit(
                      'FINAL PACKAGE FILE BAD: '
                      +name+
                      ' size='+
                      (
                          str(
                              p.stat().st_size
                          )
                          if p.exists()
                          else
                          'MISSING'
                      )
                  )

              print(
                  'FINAL_FILE_OK',
                  name,
                  p.stat().st_size
              )

          root=Path(
              'player/index.html'
          ).read_text()

          knight=Path(
              'player/knight/index.html'
          ).read_text()

          fairy=Path(
              'player/elf/index.html'
          ).read_text()

          if 'knight/' not in root:
              raise SystemExit(
                  'ROOT KNIGHT LINK MISSING'
              )

          if 'elf/' not in root:
              raise SystemExit(
                  'ROOT FAIRY LINK MISSING'
              )

          if (
              'slknight_v14_engine'
              not in knight
          ):
              raise SystemExit(
                  'KNIGHT NAMESPACE MISSING'
              )

          if (
              'slfairy_v105_engine'
              not in fairy
          ):
              raise SystemExit(
                  'FAIRY NAMESPACE MISSING'
              )

          if (
              'SLFairy V14.3z10.5'
              not in fairy
          ):
              raise SystemExit(
                  'FAIRY TITLE MARKER MISSING'
              )

          if (
              'position:fixed;left:8px;bottom:8px;'
              not in knight
          ):
              raise SystemExit(
                  'KNIGHT ERROR OVERLAY NOT BOTTOM'
              )

          if (
              'position:fixed;left:8px;bottom:8px;'
              not in fairy
          ):
              raise SystemExit(
                  'FAIRY ERROR OVERLAY NOT BOTTOM'
              )

          print(
              'FINAL_DUAL_PACKAGE_VERIFY_OK'
          )
          PY

          echo \
            "TOTAL_FILES=$(find player -type f | wc -l)"

          du -sh \
            player

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player

  deploy:
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
