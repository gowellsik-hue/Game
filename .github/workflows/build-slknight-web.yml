
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R45
# BASE: approved successful V229R44, GitHub run 39598356143.
# FIX: all 88 cloned monsters regain independent recognition switches.
# FIX: wall-occluded or distant targets are not detected or chased.
# FIX: player becomes translucent near actual front/side wall tiles.
# KEEP: exact R44 movement/collision mask, 106 spawn coordinates and species,
#       original Baphomet event 13 at (156,100), stairs, art, audio and engine.
# ONLY: Game repository Pages, not game2; no invented engine or native spawns.
name: build-slknight-web.yml | V229R45 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R45 Restore the actually deployed approved R44 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39598356143
          name: github-pages
          github-token: ${{ github.token }}
          path: r44

      - name: V229R45 Restore the same R44 original strict movement graph
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39598356143
          name: SLKnight-V229R44-Wall-Collision-Player-Translucency-106-Monsters
          github-token: ${{ github.token }}
          path: r44-masks

      - name: V229R45 Verify unchanged R44 maps and original code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s r44/artifact.tar
          tar -xf r44/artifact.tar -C site
          cp r44-masks/r44-map-45-edges.bin build/
          cp r44-masks/r44-map-46-edges.bin build/
          cp r44-masks/r44-map-45-wall-overlap.bin build/
          cp r44-masks/r44-map-46-wall-overlap.bin build/
          python3 - <<'PY_BASE'
          from pathlib import Path
          import json,hashlib
          root=Path('site');pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          expected={'Data/Scripts.rxdata':'82c10608c869bdb25dfd9056fa1e2c9c11d9071a682e45ba4428e5b48c11974f',
                    f'Data/{pre}Map045.rxdata':'611b55b73d42d96f6527d3e97d0abd562efdc538391a91b4893f50e9fd117a7c',
                    f'Data/{pre}Map046.rxdata':'554ed7c437238f27f33f1073e6e286a83aa1736dcbf4c95229bb30cfdfe03c5a'}
          for name,sha in expected.items():
              p=root/'knight/gameasync'/name
              assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==sha,name
          for mid,n in ((45,288*144),(46,336*168)):
              assert (Path('build')/f'r44-map-{mid}-edges.bin').stat().st_size==n
          names={str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}
          assert len(names)==5472,len(names)
          assert 'V229R44' in (root/'knight/index.html').read_text('utf-8')
          pre='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          allowed={'index.html','knight/index.html','knight/gameasync/mapping.js',
                   'knight/gameasync/Data/Scripts.rxdata',pre+'Map045.rxdata',pre+'Map046.rxdata'}
          before={n:hashlib.sha256((root/n).read_bytes()).hexdigest() if n in allowed else None for n in names}
          Path('build/r45-baseline.json').write_text(json.dumps(before,sort_keys=True))
          print('PASS: byte-verified R44 approved baseline, 5472 file paths, strict wall masks unchanged')
          PY_BASE

      - name: V229R45 Fix 88 cloned monster recognition gates only
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r45-map-events.rb <<'R45_MONSTER_SOURCE'
          require 'json'; require 'digest'; require 'set'
          module RPG
           class Map;end;class MapInfo;end;class AudioFile;end;class Tileset;end
           class Event;class Page;class Condition;end;class Graphic;end;end;end
           class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          class Table
           def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
           def _dump(d=0);@raw;end
           def [](x,y=0,z=0);_,w,h,depth,_=@raw.unpack('V5');return nil if x<0 || y<0 || x>=w || y>=h || z<0 || z>=depth; @raw.byteslice(20+2*(x+y*w+z*w*h),2).unpack('v')[0];end
          end
          class Tone
           def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
           def _dump(d=0);@raw;end
          end
          class Color<Tone;end

          def iv(o,k);o.instance_variable_get('@'+k.to_s);end
          def sv(o,k,v);o.instance_variable_set('@'+k.to_s,v);end
          def chk(c,msg);raise msg unless c;end
          site=ARGV.fetch(0); out=ARGV.fetch(1)
          Dir.mkdir(out) unless Dir.exist?(out)
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          root=File.join(site,'knight/gameasync/Data')
          expected_hash={45=>'611b55b73d42d96f6527d3e97d0abd562efdc538391a91b4893f50e9fd117a7c',46=>'554ed7c437238f27f33f1073e6e286a83aa1736dcbf4c95229bb30cfdfe03c5a'}
          expected={45=>{'해골'=>18,'좀비'=>16,'스파토이'=>14},46=>{'버그베어'=>27,'켈베로스'=>25,'킹 버그베어'=>5,'바포메트'=>1}}
          clones=0;details={}
          [45,46].each do |mid|
           path=File.join(root,pre+('Map%03d.rxdata'%mid))
           chk(Digest::SHA256.file(path).hexdigest==expected_hash[mid],"Wrong source R44 map #{mid}")
           before=Marshal.load(File.binread(path));game=Marshal.load(File.binread(path))
           previous=iv(before,'events');events=iv(game,'events')
           chk(events.size==(mid==45 ? 53 : 62),"Map event size changed #{mid}")
           w,h=iv(game,'width'),iv(game,'height')
           edge=File.binread(File.join(out,"r44-map-#{mid}-edges.bin"))
           chk(edge.bytesize==w*h,"Missing original approved collision #{mid}")
           # Explicitly retain all terrain/wall tiles and their original map data.
           data=iv(game,'data')
           wall=Array.new(w*h)
           h.times{|y|w.times{|x|
             t=data[x,y,0]
             chk(t==384 || t==385,"Unexpected original tile #{t} at #{x},#{y}")
             wall[y*w+x]=t==385 ? 1 : 0
           }}
           File.binwrite(File.join(out,"r45-wall-#{mid}.bin"),wall.pack('C*'))
           changed=[]
           events.each do |id,e|
             name=iv(e,'name').to_s.dup.force_encoding('UTF-8').scrub
             next unless name.start_with?('[ID') && !name.include?('힐러') && !name.include?('바포메트')
             next unless id>=16
             pages=iv(e,'pages')
             chk(pages.size==4,"Wrong cloned mob page count: #{mid} / #{id}")
             cond=iv(pages[1],'condition')
             chk(!iv(cond,'switch1_valid'),"Cloned mob already gated unexpectedly: #{mid} / #{id}")
             prior=iv(cond,'switch1_id')
             sid=5000+(mid-45)*100+id
             sv(cond,'switch1_valid',true)
             sv(cond,'switch1_id',sid)
             route=iv(iv(pages[0],'move_route'),'list')
             matches=route.select{|m|iv(m,'code')==45 && iv(m,'parameters').is_a?(Array) && iv(m,'parameters')[0].to_s.dup.force_encoding('UTF-8').scrub.match(/^범위\(10,\d+,1\)$/)}
             chk(matches.size==1,"No unique detection script: #{mid}/#{id}")
             old_script=iv(matches[0],'parameters')[0]
             chk(old_script.include?(prior.to_s),"Wrong old detection ID #{mid}/#{id}")
             iv(matches[0],'parameters')[0]="범위(10,#{sid},1)"
             death=iv(pages[3],'list')
             chk(death.count{|c|iv(c,'code')==202}==3,"Clone respawn changed #{mid}/#{id}")
             reset=death.find{|c|iv(c,'code')==123 && iv(c,'parameters')[0]=='A'}
             chk(!reset.nil?,"Missing original death switch reset #{mid}/#{id}")
             ins=RPG::EventCommand.allocate
             sv(ins,'code',121);sv(ins,'parameters',[sid,sid,1]);sv(ins,'indent',0)
             death.insert(death.index(reset),ins)
             changed<<{'eventID'=>id,'oldDetectionSwitch'=>prior,'newDetectionSwitch'=>sid,'route'=>iv(matches[0],'parameters')[0]}
           end
           chk(changed.length==(mid==45 ? 39 : 49),"Unexpected # cloned mobs #{mid}/#{changed.length}")
           originalIDs=previous.keys.select{|id|id<16}
           originalIDs.each{|id|chk(Marshal.dump(previous.fetch(id))==Marshal.dump(events.fetch(id)),"Existing original event changed #{mid}/#{id}")}
           # Map terrain/walls, existing 106 monster locations, respawn destinations, sprites and other fields unchanged.
           chk(Marshal.dump(iv(before,'data'))==Marshal.dump(iv(game,'data')),"Terrain edited #{mid}")
           events.each{|id,ev|chk([iv(ev,'x'),iv(ev,'y')]==[iv(previous.fetch(id),'x'),iv(previous.fetch(id),'y')],"Spawn moved #{mid}/#{id}")}
           if mid==46
             boss=events.fetch(13)
             chk([iv(boss,'x'),iv(boss,'y')]==[156,100],"Boss moved")
           end
           File.binwrite(path,Marshal.dump(game))
           details[mid]={'clonesGated'=>changed.length,'switches'=>changed,'unchangedEvents'=>events.length}
           clones+=changed.length
           puts "R45 map #{mid}: cloned aggro gates restored #{changed.length}, all existing original events/XY preserved"
          end
          chk(clones==88,"Wrong clone count")
          File.write(File.join(out,'r45-clone-gate-audit.json'),JSON.pretty_generate(details))
          R45_MONSTER_SOURCE
          ruby -c /tmp/r45-map-events.rb
          ruby /tmp/r45-map-events.rb site build

      - name: V229R45 Compute player sprite/wall overlap from the same R44 collision
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r45-shadows.py <<'R45_SHADOW_SOURCE'
          from pathlib import Path
          import zlib,json,sys
          b=Path(sys.argv[1])
          result={}
          for mid,w,h in [(45,288,144),(46,336,168)]:
              edges=(b/f'r44-map-{mid}-edges.bin').read_bytes()
              walls=(b/f'r45-wall-{mid}.bin').read_bytes()
              assert len(edges)==len(walls)==w*h
              shadow=bytearray(w*h)
              # Actual 32px-tile player sprite rises 2-3 tiles above its foot.
              # Test both adjacent sides and the northern wall elevations, never just y+1.
              neighbors=[(dx,dy) for dy in (-2,-1,0) for dx in (-1,0,1) if dx or dy]
              neighbors.extend([(0,1)])
              for y in range(h):
                  for x in range(w):
                      k=y*w+x
                      if not edges[k]:continue
                      if any(0<=x+dx<w and 0<=y+dy<h and walls[(y+dy)*w+x+dx] for dx,dy in neighbors):
                          shadow[k]=1
              assert sum(shadow)==(1977 if mid==45 else 2718),('wall overlap count changed',mid,sum(shadow))
              (b/f'r45-wall-overlap-{mid}.bin').write_bytes(shadow)
              result[str(mid)]={'openTiles':sum(v!=0 for v in edges),'transparentNearWallTiles':sum(shadow),'fixedR44ShadowTiles':sum((b/f'r44-map-{mid}-wall-overlap.bin').read_bytes()) if (b/f'r44-map-{mid}-wall-overlap.bin').exists() else None,'compressedBytes':len(zlib.compress(shadow,9))}
          print(json.dumps(result,indent=2))
          (b/'r45-wall-opacity-audit.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          R45_SHADOW_SOURCE
          python3 -m py_compile /tmp/r45-shadows.py
          python3 /tmp/r45-shadows.py build

      - name: V229R45 Keep R44 collision; add actual wall LOS and player opacity
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r45-addon.rb <<'R45_ADDON_SOURCE'
          # V229R45: map-specific visibility and wall-overlap rules over R44 collision.
          # R44 movement edges are reused unchanged. No new engine or monster mechanics.
          module SLTI_V229R45
            SHADOW_45 = Zlib::Inflate.inflate('__R45_SHADOW45__'.unpack('m')[0])
            SHADOW_46 = Zlib::Inflate.inflate('__R45_SHADOW46__'.unpack('m')[0])

            def self.monster?(character)
              return false unless character.is_a?(Game_Event)
              mid = character.instance_variable_get(:@map_id)
              return false unless mid == 45 or mid == 46
              obj = character.instance_variable_get(:@event)
              return false if obj == nil
              id = obj.id
              if mid == 45
                return [3,4,5,6,8,9,10,11,12].include?(id) || id >= 16
              end
              return [4,5,6,8,9,10,12,13,15].include?(id) || id >= 16
            end

            def self.wall_overlap?(map_id,x,y)
              width = map_id == 45 ? 288 : (map_id == 46 ? 336 : 0)
              height = map_id == 45 ? 144 : (map_id == 46 ? 168 : 0)
              return false if x < 0 or y < 0 or x >= width or y >= height
              raw = map_id == 45 ? SHADOW_45 : SHADOW_46
              return raw[y * width + x, 1].unpack('C')[0] != 0
            end

            def self.edge?(mid,x,y,d)
              SLTI_V229R44.allowed?(mid,x,y,d)
            end

            # Supercover grid traversal: both crossing edges must be open at a corner.
            # Merely being within 10 tiles is not proof of visibility through wall tiles.
            def self.clear_line?(mid,ax,ay,bx,by)
              width = mid == 45 ? 288 : (mid == 46 ? 336 : 0)
              height = mid == 45 ? 144 : (mid == 46 ? 168 : 0)
              return false if width == 0
              return false unless ax >= 0 && ay >= 0 && bx >= 0 && by >= 0 &&
                                  ax < width && bx < width && ay < height && by < height
              raw = mid == 45 ? SLTI_V229R44::EDGES_45 : SLTI_V229R44::EDGES_46
              return false if raw[ay*width+ax,1].unpack('C')[0] == 0
              return false if raw[by*width+bx,1].unpack('C')[0] == 0
              dx = (bx-ax).abs
              dy = (by-ay).abs
              return true if dx == 0 && dy == 0
              sx = bx > ax ? 1 : -1
              sy = by > ay ? 1 : -1
              hd = sx > 0 ? 6 : 4
              vd = sy > 0 ? 2 : 8
              ix = 0; iy = 0; x = ax; y = ay
              while ix < dx || iy < dy
                a = (2*ix+1)*dy
                b = (2*iy+1)*dx
                if a == b
                  # A diagonal that only squeezes through a wall corner is NOT visible.
                  return false unless edge?(mid,x,y,hd) && edge?(mid,x,y,vd) &&
                                      edge?(mid,x+sx,y,vd) && edge?(mid,x,y+sy,hd)
                  x += sx; y += sy; ix += 1; iy += 1
                elsif a < b
                  return false unless edge?(mid,x,y,hd)
                  x += sx; ix += 1
                else
                  return false unless edge?(mid,x,y,vd)
                  y += sy; iy += 1
                end
              end
              return x == bx && y == by
            end

            def self.in_sight?(character,limit)
              return false if $game_map == nil || $game_player == nil
              dx = (character.x-$game_player.x).abs
              dy = (character.y-$game_player.y).abs
              return false if dx+dy >= limit
              return clear_line?($game_map.map_id,character.x,character.y,
                                 $game_player.x,$game_player.y)
            end
          end

          class Game_Character
            alias slti_r45_original_range 범위
            def 범위(dist_n,switch_id,mode)
              if SLTI_V229R45.monster?(self)
                if !SLTI_V229R45.in_sight?(self,dist_n.to_i)
                  if (mode == 1 || mode == 'on') && $game_switches[switch_id]
                    $game_switches[switch_id] = false
                  end
                  return
                end
              end
              slti_r45_original_range(dist_n,switch_id,mode)
            end
          end

          class Game_Event
            alias slti_r45_original_initialize initialize
            def initialize(map_id,event)
              # Clear stale detection switches whenever the dungeon is entered again.
              id = event.id
              own = (map_id == 45 && ([3,4,5,6,8,9,10,11,12].include?(id) || id >= 16)) ||
                    (map_id == 46 && ([4,5,6,8,9,10,12,15].include?(id) || id >= 16))
              if own
                gate = event.pages[1].condition
                $game_switches[gate.switch1_id] = false if gate.switch1_valid
              end
              slti_r45_original_initialize(map_id,event)
            end

            alias slti_r45_original_update update
            def update
              if SLTI_V229R45.monster?(self) && @page == @event.pages[1] &&
                 @page != nil && $game_player != nil
                gate = @page.condition
                if gate.switch1_valid && $game_switches[gate.switch1_id] &&
                   !SLTI_V229R45.in_sight?(self,10)
                  $game_switches[gate.switch1_id] = false
                  refresh
                end
              end
              slti_r45_original_update
            end

            alias slti_r45_original_toward_player move_toward_player
            def move_toward_player
              if SLTI_V229R45.monster?(self) && $game_player != nil &&
                 !SLTI_V229R45.in_sight?(self,10)
                return
              end
              slti_r45_original_toward_player
            end
          end
          R45_ADDON_SOURCE
          ruby -c /tmp/r45-addon.rb
          cat > /tmp/r45-patch-scripts.rb <<'R45_PATCH_SOURCE'
          require 'zlib';require 'digest';require 'base64';require 'json'
          path=ARGV.fetch(0);source=ARGV.fetch(1);build=ARGV.fetch(2)
          sha=Digest::SHA256.file(path).hexdigest
          raise "Wrong approved R44 scripts: #{sha}" unless sha=='82c10608c869bdb25dfd9056fa1e2c9c11d9071a682e45ba4428e5b48c11974f'
          scripts=Marshal.load(File.binread(path)); original=Marshal.load(File.binread(path))
          addon=File.binread(source)
          [45,46].each do |mid|
           raw=File.binread(File.join(build,"r45-wall-overlap-#{mid}.bin"))
           expect=mid==45 ? 288*144 : 336*168
           raise "Invalid shadow mask" unless raw.bytesize==expect
           token="__R45_SHADOW#{mid}__"
           raise 'Missing R45 insertion token' unless addon.include?(token)
           addon=addon.sub(token,Base64.strict_encode64(Zlib::Deflate.deflate(raw,9)))
          end
          old103=Zlib::Inflate.inflate(scripts.fetch(103)[2]);old28=Zlib::Inflate.inflate(scripts.fetch(28)[2]);old21=Zlib::Inflate.inflate(scripts.fetch(21)[2])
          raise 'R44 shadow site is absent' unless old28.scan('SLTI_V229R44.wall_overlap?').size==1
          raise 'Original monster range function is absent' unless old103.dup.force_encoding('UTF-8').scrub.include?('def 범위(dist_n, 스위치아이디, 방식)')
          raise 'R44 movement graph not present' unless old21.include?('module SLTI_V229R44') && old21.include?('def self.allowed?')
          scripts[103][2]=Zlib::Deflate.deflate(old103+"\n"+addon)
          scripts[28][2]=Zlib::Deflate.deflate(old28.sub('SLTI_V229R44.wall_overlap?','SLTI_V229R45.wall_overlap?'))
          # R44 map movement logic stays byte-identical.
          raise 'Original collision script was modified' unless scripts[21]==original[21]
          scripts.each_index{|i|raise "Unapproved edit to core script #{i}" if i!=28 && i!=103 && scripts[i]!=original[i]}
          File.binwrite(path,Marshal.dump(scripts))
          File.binwrite(File.join(build,'r45-script103.rb'),Zlib::Inflate.inflate(scripts.fetch(103)[2]))
          File.binwrite(File.join(build,'r45-script28.rb'),Zlib::Inflate.inflate(scripts.fetch(28)[2]))
          File.binwrite(File.join(build,'r45-script21-unchanged.rb'),old21)
          puts "PASS R45: only original range script103 and player sprite script28 modified; movement and 133 other script entries identical"
          R45_PATCH_SOURCE
          ruby -c /tmp/r45-patch-scripts.rb
          ruby /tmp/r45-patch-scripts.rb site/knight/gameasync/Data/Scripts.rxdata /tmp/r45-addon.rb build
          ruby -c build/r45-script103.rb
          ruby -c build/r45-script28.rb

      - name: V229R45 Run actual original Ruby vision and aggro regression cases
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r45-smoke.rb <<'R45_TEST_SOURCE'
          require 'json';require 'base64';require 'zlib';require 'set'
          module RPG
           class Map;end;class MapInfo;end;class AudioFile;end;class Tileset;end
           class Event;attr_reader :name,:pages,:id;class Page;attr_reader :condition,:move_route,:list;class Condition;attr_reader :switch1_valid,:switch1_id;end;class Graphic;end;end;end
           class EventCommand;attr_reader :code,:parameters;end;class MoveRoute;attr_reader :list;end;class MoveCommand;attr_reader :code,:parameters;end
          end
          class Table
           def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
           def _dump(d=0);@raw;end
          end
          class Tone
           def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);end
           def _dump(d=0);@raw;end
          end
          class Color<Tone;end
          class Game_Character
           attr_accessor :x,:y
           def move_toward_player; @moves=(@moves||0)+1;end
           def moves;@moves||0;end
          end
          class Game_Event<Game_Character
           def initialize(mid,evt)
            @map_id=mid;@event=evt;@x=evt.instance_variable_get(:@x);@y=evt.instance_variable_get(:@y)
            @page=evt.pages[0]
           end
           def update; @updates=(@updates||0)+1;end
           def refresh
            c=@event.pages[1].condition
            @page=c.switch1_valid && $game_switches[c.switch1_id] ? @event.pages[1] : @event.pages[0]
           end
          end
          class S
           def initialize;@h={};end
           def [](key);@h.fetch(key,false);end
           def []=(key,v);@h[key]=v;end
          end
          class Player
           attr_accessor :x,:y
           def initialize;@x=0;@y=0;end
          end
          class Map
           attr_accessor :map_id
           def initialize(mid);@map_id=mid;end
          end
          $game_switches=S.new;$game_player=Player.new;$game_map=Map.new(45)
          root=ARGV.fetch(0);site=ARGV.fetch(1)
          eval(File.binread(File.join(root,'r45-script21-unchanged.rb')),TOPLEVEL_BINDING,'R44GameMap')
          eval(File.binread(File.join(root,'r45-script103.rb')).force_encoding('UTF-8'),TOPLEVEL_BINDING,'R45Core')
          # Compare native symmetry and ray traversal against actual R44 walls.
          clear_total=0;blocked_total=0;pair_total=0;gates=0
          [45,46].each do |mid|
           $game_map.map_id=mid
           w,h=mid==45 ? [288,144] : [336,168]
           edges=File.binread(File.join(root,"r44-map-#{mid}-edges.bin"))
           shadow=File.binread(File.join(root,"r45-wall-overlap-#{mid}.bin"))
           walkable=[]
           h.times do |y|
            w.times do |x|
             i=y*w+x
             val=SLTI_V229R45.wall_overlap?(mid,x,y)
             raise "Alpha mask mismatch: #{mid} #{x} #{y}" unless val==(shadow.getbyte(i)!=0)
             walkable<<[x,y] if edges.getbyte(i)>0
            end
           end
           require 'digest';raise 'Wrong collision graph' unless Digest::SHA256.hexdigest(edges)==Digest::SHA256.hexdigest(mid==45 ? SLTI_V229R44::EDGES_45 : SLTI_V229R44::EDGES_46)
           # For every available edge, immediate neighbor must be visible; closed edges must not be visible.
           tests=0;blocked_edges=0;open_edges=0
           walkable.each_with_index do |(x,y),index|
            next unless index%5==0
            [[1,0,6],[-1,0,4],[0,1,2],[0,-1,8]].each do |dx,dy,d|
             nx=x+dx;ny=y+dy;next unless nx>=0 && ny>=0 && nx<w && ny<h && edges.getbyte(ny*w+nx)>0
             actual=SLTI_V229R45.clear_line?(mid,x,y,nx,ny)
             expected=SLTI_V229R44.allowed?(mid,x,y,d)
             raise "Different wall/vision graph #{mid} #{x} #{y} #{d}" unless expected==actual
             tests+=1;expected ? open_edges+=1 : blocked_edges+=1
            end
           end
           raise 'Not enough movement/vision checks' unless tests>100
           clear_total+=open_edges;blocked_total+=blocked_edges;pair_total+=tests
           path=File.join(site,'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap%03d.rxdata'%mid)
           events=Marshal.load(File.binread(path)).instance_variable_get(:@events)
           regular=events.values.select{|e|e.name.to_s.dup.force_encoding('UTF-8').scrub.start_with?('[ID') && !e.name.to_s.dup.force_encoding('UTF-8').scrub.include?('힐러') && !e.name.to_s.dup.force_encoding('UTF-8').scrub.include?('바포메트')}
           assert_count=mid==45 ? 48 : 57
           raise 'Changed monster count' unless regular.size==assert_count
           regular.each do |e|
            id=e.instance_variable_get(:@id)
            page=e.pages[1]
            cond=page.condition
            raise "Lost gate: #{mid} #{id}" unless cond.switch1_valid
            if id>=16
             unique_id=5000+(mid-45)*100+id
             raise "Wrong gate: #{mid} #{id}" unless cond.switch1_id==unique_id
             script=e.pages[0].move_route.list.select{|m|m.code==45}.map{|m|m.parameters[0].force_encoding('UTF-8')}
             raise 'Wrong detector route' unless script==["범위(10,#{unique_id},1)"]
             resets=e.pages[3].list.select{|m|m.code==121 && m.parameters==[unique_id,unique_id,1]}
             raise 'No unique respawn reset' unless resets.length==1
             gates+=1
            end
           end
           puts "PASS Map#{mid}: #{tests} wall-ray neighbor tests (#{open_edges} open; #{blocked_edges} blocked), alpha mask #{shadow.bytes.count(1)} cells, #{regular.size} monsters"
          end
          raise "Wrong # clones #{gates}" unless gates==88
          raise 'No blocked ray probes' unless blocked_total>0
          # Explicit gate test: same distance behind wall = false; same distance in corridor = true.
          [45,46].each do |mid|
           $game_map.map_id=mid
           w,h=mid==45 ? [288,144] : [336,168]
           edges=File.binread(File.join(root,"r44-map-#{mid}-edges.bin"))
           events=Marshal.load(File.binread(File.join(site,'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap%03d.rxdata'%mid))).instance_variable_get(:@events)
           cloned=events.values.find{|e|e.instance_variable_get(:@id)>=16}
           detector=Game_Event.new(mid,cloned)
           gate=cloned.pages[1].condition.switch1_id
           good=nil;bad=nil
           (0...edges.length).each do |k|
            next unless edges.getbyte(k)!=0
            x=k%w;y=k/w; dd=(x-detector.x).abs+(y-detector.y).abs
            next unless dd>0 && dd<10
            (SLTI_V229R45.clear_line?(mid,detector.x,detector.y,x,y) ? good ||= [x,y] : bad ||= [x,y])
            break if good && bad
           end
           raise "No comparable visible and blocked samples in R44 map #{mid}" unless good && bad
           $game_player.x,$game_player.y=good
           detector.범위(10,gate,1)
           raise 'Visible monster did not recognize player' unless $game_switches[gate]
           detector.refresh
           detector.move_toward_player
           raise 'Visible monster did not chase' unless detector.moves==1
           $game_player.x,$game_player.y=bad
           detector.update
           raise 'Wall-hidden monster kept old aggression switch' if $game_switches[gate]
           raise 'Wall-hidden monster stayed in aggressive page' unless detector.instance_variable_get(:@page)==cloned.pages[0]
           detector.move_toward_player
           raise 'Monster chased through a wall' unless detector.moves==1
           detector.범위(10,gate,1)
           raise 'Monster reacquired target through wall' if $game_switches[gate]
           puts "PASS map#{mid} LOS: clear #{good.inspect}, wall-separated #{bad.inspect}, reset/chase gate works"
          end
          puts "PASS V229R45: #{pair_total} original LOS edge tests, #{gates} unique clone aggro gates and both game-map LOS behavior checks"
          R45_TEST_SOURCE
          ruby -c /tmp/r45-smoke.rb
          ruby /tmp/r45-smoke.rb build site | tee build/r45-local-test.txt

      - name: V229R45 Refresh changed RGSS asset hash entries and display version
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r45-manifest.py <<'R45_MANIFEST_SOURCE'
          from pathlib import Path
          import hashlib,re
          root=Path('site')
          mapper=root/'knight/gameasync/mapping.js'
          text=mapper.read_text(encoding='utf-8')
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          for name in ['Data/Scripts.rxdata',f'Data/{pre}Map045.rxdata',f'Data/{pre}Map046.rxdata']:
              p=root/'knight/gameasync'/name
              needle=name+'?h='
              pat=re.escape(needle)+r'[0-9a-f]{32}'
              replacement=needle+hashlib.md5(p.read_bytes()).hexdigest()
              text,n=re.subn(pat,lambda _:replacement,text)
              assert n==1,(name,n)
          mapper.write_text(text,encoding='utf-8')
          for file in [root/'index.html',root/'knight/index.html']:
              data=file.read_text('utf-8')
              assert 'V229R44' in data,file
              file.write_text(data.replace('V229R44','V229R45').replace('v229r44','v229r45'),encoding='utf-8')
          print('PASS R45: updated 3 asset hashes and visible site version without altering other code')
          R45_MANIFEST_SOURCE
          python3 /tmp/r45-manifest.py
          node --check site/knight/gameasync/mapping.js

      - name: V229R45 Verify only approved map, script and version modifications
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r45-integrity.py <<'R45_INTEGRITY_SOURCE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          base=json.loads(Path('build/r45-baseline.json').read_text('utf-8'))
          paths={str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}
          assert len(paths)==len(base)==5472 and paths==set(base)
          pre='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          allowed={'index.html','knight/index.html','knight/gameasync/mapping.js',
                   'knight/gameasync/Data/Scripts.rxdata',pre+'Map045.rxdata',pre+'Map046.rxdata'}
          # Code above only reads R44 artifacts and writes these 6 exact game files.
          # Check all 6 actually changed; original script21 and all other script entries
          # were compared byte-for-byte before Scripts.rxdata was written.
          for name in allowed:
              digest=hashlib.sha256((root/name).read_bytes()).hexdigest()
              assert digest!=base[name],('Change absent',name)
          assert 'V229R45' in (root/'index.html').read_text('utf-8')
          assert 'V229R45' in (root/'knight/index.html').read_text('utf-8')
          report=json.loads(Path('build/r45-clone-gate-audit.json').read_text('utf-8'))
          assert sum(x['clonesGated'] for x in report.values())==88
          assert Path('build/r45-local-test.txt').exists()
          print('PASS R45: 5472 source filenames preserved; exactly 6 approved output files written, collision unchanged, 106 spawn XY preserved')
          Path('build/r45-integrity.json').write_text(json.dumps({'version':'V229R45','changedFiles':sorted(allowed),'cloneAggroGates':88,'monsterCount':106,'preservedBoss':{'id':13,'xy':[156,100]},'untested':['mobile live translucency visuals','post-deploy player testing']},indent=2))
          R45_INTEGRITY_SOURCE
          python3 /tmp/r45-integrity.py

      - name: V229R45 Upload original 106-monster LOS and opacity checks
        uses: actions/upload-artifact@v4
        with:
          name: SLKnight-V229R45-Original-Wall-LOS-Occlusion-106-Monsters
          path: |
            build/r45-clone-gate-audit.json
            build/r45-wall-opacity-audit.json
            build/r45-wall-overlap-45.bin
            build/r45-wall-overlap-46.bin
            build/r45-local-test.txt
            build/r45-integrity.json
          if-no-files-found: error
          retention-days: 30

      - name: V229R45 Upload same original Game SLKnight to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
