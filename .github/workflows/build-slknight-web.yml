          for p in [pre+'Map016.rxdata',pre+'Map021.rxdata',pre+'CommonEvents.rxdata',
                    'knight/assets/map-047-v241.pack']:
              assert after[p]==before[p],p
          print('PASS 5610 files, only Map025 and Scripts changed in game data')
          print('PASS no cloned event, no new common event, zero graphic edits')
          print('PASS original HTTP loader, original Kurtz, original Death Knight')
