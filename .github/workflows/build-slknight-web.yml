name: Deploy SLKnight V14.3z10.6g3 + SLFairy SAVE BOOT FIX

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

env:
  BASE168_SHA: e30b0c41dc7fe7ec49fa17501d198339f7006cf6
  F106_SHA: 0eb5b9776827f25860a37209d1bdb248d01cb7d3
  Z105_SHA: e19659507b466b87a671949532b02484bc1faaef
  Z104_SHA: e044e1b6c53646b4c4f21f2dfee4967a68fabbc4
  DUAL_BASE_SHA: 04ce66ec99abc10f77143de53650685db8949532
  CURRENT_Z10_SHA: f545634bafbe1e1e55aaf6489126ad17b07da382
  BASELINE_SHA: c6815cd461dba60ec131898e6d5dd8690dd915ae
  X2_SHA: 6d941bd643dda87b8267ba466e108d1904c22331
  Z1_SHA: 008b6abe81074b7af877806b45f2314004a74f66
  Z3_SHA: 5a46988b048764e8a99700998c1f4ab96a3ec5c1
  GAME_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLKnight_Android_JoiPlay.zip
  GAME_SHA256: 9f007d46d2410742aca5e14c3901f63586084007e7f52c4d199116191824132a
  FAIRY_URL: https://github.com/gowellsik-hue/Game/releases/download/v1.0.0/SLFairy_Source_v1.zip
  FAIRY_SHA256: 67b88b5fe0cde3c9f2fada889815f9aa7d0fc94b378025529e9950d55151c70e
  FAIRY_7Z_PASSWORD: http://nemo838.tistory.com/
  MKXP_SRC_REF: e0437fdc5be29507e78d148a2b3f02d26ee1c779
  EMSDK_VER: 3.1.37

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout proven 168 source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.BASE168_SHA }}
          path: base168

      - name: Checkout 10.6f source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.F106_SHA }}
          path: f106src

      - name: Checkout z10.5 source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z105_SHA }}
          path: z105src

      - name: Checkout z10.4 source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z104_SHA }}
          path: z104src

      - name: Checkout dual base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.DUAL_BASE_SHA }}
          path: dualbase

      - name: Checkout z10 source
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.CURRENT_Z10_SHA }}
          path: z10src

      - name: Checkout V14.3l baseline
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.BASELINE_SHA }}
          path: baseline

      - name: Checkout V14.3x2 auto base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.X2_SHA }}
          path: x2

      - name: Checkout V14.3z1 monster base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z1_SHA }}
          path: z1

      - name: Checkout V14.3z3 monster base
        uses: actions/checkout@v4
        with:
          repository: gowellsik-hue/Game
          ref: ${{ env.Z3_SHA }}
          path: z3

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake cmake curl ffmpeg freepats git imagemagick libtool make mm-common patch pkg-config python3 rake ruby timidity unzip wget xz-utils fonts-nanum p7zip-full nodejs

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: pulsejet/mkxp-web
          ref: ${{ env.MKXP_SRC_REF }}
          path: engine

      - name: Cache engine dependencies
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: mkxp-web-${{ runner.os }}-${{ env.EMSDK_VER }}-onig25b

      - name: Extract proven successful build steps
        run: |
          set -euo pipefail
          ruby -ryaml - <<'RB'
          doc=YAML.load_file('base168/.github/workflows/build-slknight-web.yml')
          steps=doc.fetch('jobs').fetch('build').fetch('steps')
          names=[
            'Extract stable 10.6f preparation only',
            'Build stable base through Fairy boot patch',
            'Fix Knight CE4 CE10 CE68 CE107 only',
            'Build transform preload packs without inline injection'
          ]
          names.each_with_index do |name,i|
            step=steps.find{|s|s['name']==name}
            abort "BASE168 STEP MISSING: #{name}" unless step&&step['run']
            File.write(format('/tmp/base168_%02d.sh',i),step['run'])
          end
          puts 'BASE168_STEPS_EXTRACTED'
          RB

      - name: Run proven base build and fixes
        run: |
          set -euo pipefail
          for i in 0 1 2 3; do
            bash -e "$(printf '/tmp/base168_%02d.sh' "$i")"
          done
          echo PROVEN_BASE_AND_FIXES_OK

      - name: Restore permanent saves and attach preload packs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          configs=[
              {
                  'html':Path('player/index.html'),
                  'drive':Path('player/js/drive.js'),
                  'namespace':'slknight_v14_engine',
                  'old_title':'SLKnight V14.3z100',
                  'title':'SLKnight V14.3z10.6g3',
                  'old_cache':'v143z100',
                  'cache':'v143z106g3knight',
                  'legacy':[
                      'slknight_v106d_engine',
                      'slknight_v106e_engine',
                      'slknight_v106f_engine'
                  ]
              },
              {
                  'html':Path('fairy_player/index.html'),
                  'drive':Path('fairy_player/js/drive.js'),
                  'namespace':'slfairy_v105_engine',
                  'old_title':'SLFairy V14.3z10.5',
                  'title':'SLFairy V14.3z10.6g3',
                  'old_cache':'v143z105elf',
                  'cache':'v143z106g3elf',
                  'legacy':[
                      'slfairy_v106_engine',
                      'slfairy_v106a_engine',
                      'slfairy_v106b_engine',
                      'slfairy_v106d_engine',
                      'slfairy_v106e_engine',
                      'slfairy_v106f_engine'
                  ]
              }
          ]

          def remove_legacy_touch(s,name):
              start="        if (!is_touch_device()) {"
              end="        resize();"
              if s.count(start)!=1:
                  raise SystemExit(f'LEGACY TOUCH START {name} count={s.count(start)}')
              a=s.index(start)
              b=s.index(end,a)+len(end)
              s=s[:a]+s[b:]
              if 'is_touch_device()' in s or "bindKey('d-up'" in s:
                  raise SystemExit(f'LEGACY TOUCH REMAINS {name}')
              return s

          def insert_pack(s,cache,name):
              tag=f'<script src="sltransform-v106g.js?v={cache}"></script>'
              if tag in s:
                  return s
              pat=re.compile(r'(<script[^>]*>.*?var\s+Module\s*=\s*\{.*?</script>)',re.S|re.I)
              m=pat.search(s)
              if not m:
                  raise SystemExit(f'MODULE SCRIPT BLOCK MISSING {name}')
              return s[:m.end()]+'\n'+tag+s[m.end():]

          def patch_drive(path,legacy):
              s=path.read_text(encoding='utf-8')
              marker='// SL_SAVE_NAMESPACE_MIGRATION_V106G3'
              if marker in s:
                  return
              if 'window.restoreLocalFilesBeforeRun' not in s:
                  raise SystemExit(f'RESTORE FUNCTION MISSING {path}')
              old=json.dumps(legacy,separators=(',',':'))
              lines=[
                  '',
                  marker,
                  '(function(){',
                  '  var base=window.restoreLocalFilesBeforeRun;',
                  f'  var old={old};',
                  '  function mt(x){var t=x&&Number(x.t);return Number.isFinite(t)?t:0;}',
                  '  function merge(ns,cur){',
                  '    return localforage.getItem(ns).then(function(folder){',
                  '      folder=folder||{};',
                  '      return Object.keys(folder).reduce(function(chain,key){',
                  '        return chain.then(function(){',
                  '          var om=folder[key]||{},cm=cur[key]||null;',
                  '          if(cm&&mt(cm)>=mt(om))return;',
                  '          return localforage.getItem(ns+key).then(function(buf){',
                  '            if(!buf)return;',
                  '            return localforage.setItem(namespace+key,buf).then(function(){cur[key]=om;});',
                  '          });',
                  '        });',
                  '      },Promise.resolve()).then(function(){return cur;});',
                  '    });',
                  '  }',
                  '  window.restoreLocalFilesBeforeRun=function(){',
                  "    var dep='sl-save-migrate-v106g3';",
                  '    addRunDependency(dep);',
                  '    localforage.getItem(namespace).then(function(cur){',
                  '      cur=cur||{};',
                  '      return old.reduce(function(chain,ns){',
                  '        return chain.then(function(state){return merge(ns,state);});',
                  '      },Promise.resolve(cur));',
                  '    }).then(function(cur){',
                  '      return localforage.setItem(namespace,cur);',
                  '    }).then(function(){',
                  '      base();',
                  '      removeRunDependency(dep);',
                  '    }).catch(function(e){',
                  "      console.error('SLSAVEMIGRATEERR|'+e);",
                  '      try{base();}finally{removeRunDependency(dep);}',
                  '    });',
                  '  };',
                  '})();',
                  ''
              ]
              path.write_text(s+'\n'.join(lines),encoding='utf-8')

          for c in configs:
              s=c['html'].read_text(encoding='utf-8')
              if c['namespace'] not in s:
                  raise SystemExit(f"PERMANENT NAMESPACE MISSING {c['html']}")
              s=remove_legacy_touch(s,str(c['html']))
              s=s.replace('position:fixed;left:8px;top:8px;','position:fixed;left:8px;bottom:8px;')
              s=s.replace(c['old_title'],c['title'])
              s=s.replace(c['old_cache'],c['cache'])
              s=insert_pack(s,c['cache'],str(c['html']))
              c['html'].write_text(s,encoding='utf-8')
              patch_drive(c['drive'],c['legacy'])

          print('SAVE_NAMESPACE_AND_PRELOAD_ATTACH_OK')
          PY

          node --check player/js/drive.js
          node --check fairy_player/js/drive.js
          node --check player/sltransform-v106g.js
          node --check fairy_player/sltransform-v106g.js

      - name: Verify generated browser
        run: |
          set -euo pipefail

          grep -Fq 'slknight_v14_engine' player/index.html
          grep -Fq 'SLKnight V14.3z10.6g3' player/index.html
          grep -Fq 'v143z106g3knight' player/index.html
          grep -Fq 'sltransform-v106g.js?v=v143z106g3knight' player/index.html
          ! grep -Fq 'slknight_v106f_engine' player/index.html

          grep -Fq 'slfairy_v105_engine' fairy_player/index.html
          grep -Fq 'SLFairy V14.3z10.6g3' fairy_player/index.html
          grep -Fq 'v143z106g3elf' fairy_player/index.html
          grep -Fq 'sltransform-v106g.js?v=v143z106g3elf' fairy_player/index.html
          ! grep -Fq 'slfairy_v106f_engine' fairy_player/index.html

          grep -Fq 'SL_SAVE_NAMESPACE_MIGRATION_V106G3' player/js/drive.js
          grep -Fq 'slknight_v106f_engine' player/js/drive.js
          grep -Fq 'SL_SAVE_NAMESPACE_MIGRATION_V106G3' fairy_player/js/drive.js
          grep -Fq 'slfairy_v106f_engine' fairy_player/js/drive.js

          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          for html in ('player/index.html','fairy_player/index.html'):
              s=Path(html).read_text(encoding='utf-8')
              blocks=[]
              for m in re.finditer(r'<script(?P<a>[^>]*)>(?P<b>.*?)</script>',s,re.S|re.I):
                  if 'src=' not in m.group('a').lower() and m.group('b').strip():
                      blocks.append(m.group('b'))
              if not blocks:
                  raise SystemExit('NO INLINE JS '+html)
              for i,body in enumerate(blocks):
                  p=Path(f'/tmp/inline_{Path(html).parent.name}_{i}.js')
                  p.write_text(body,encoding='utf-8')
                  subprocess.run(['node','--check',str(p)],check=True)
              print('INLINE_JS_OK',html,len(blocks))
          PY

          echo GENERATED_BROWSER_OK

      - name: Build dual site
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/knight site/elf
          cp -a player/. site/knight/
          cp -a fairy_player/. site/elf/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="ko">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
            <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
            <title>SLKnight + SLFairy</title>
            <style>
              html,body{margin:0;width:100%;height:100%;background:#080808;color:#fff;font-family:system-ui,sans-serif}
              .wrap{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px}
              .choices{display:flex;gap:16px}
              button{width:150px;height:160px;border:1px solid #777;border-radius:14px;background:#171717;color:#fff;font-size:25px}
            </style>
          </head>
          <body>
            <div class="wrap">
              <h1>Character Select</h1>
              <div class="choices">
                <button onclick="location.href='knight/?v='+Date.now()">Knight</button>
                <button onclick="location.href='elf/?v='+Date.now()">Elf</button>
              </div>
            </div>
          </body>
          </html>
          HTML
          touch site/.nojekyll
          rm -rf player
          mv site player

      - name: Final sanity check
        run: |
          set -euo pipefail
          for side in knight elf; do
            test -s player/$side/index.html
            test -s player/$side/mkxp.js
            test -s player/$side/mkxp.wasm
            test -s player/$side/gameasync/Data/Scripts.rxdata
            test -s player/$side/gameasync/mapping.js
            test -s player/$side/sltransform-v106g.js
            test -s player/$side/sltransform-v106g.data
          done
          grep -Fq 'slknight_v14_engine' player/knight/index.html
          grep -Fq 'SLKnight V14.3z10.6g3' player/knight/index.html
          grep -Fq 'slfairy_v105_engine' player/elf/index.html
          grep -Fq 'SLFairy V14.3z10.6g3' player/elf/index.html
          grep -Fq 'SL_SAVE_NAMESPACE_MIGRATION_V106G3' player/knight/js/drive.js
          grep -Fq 'SL_SAVE_NAMESPACE_MIGRATION_V106G3' player/elf/js/drive.js
          ! grep -Fq 'var slTransformSheets=' player/knight/index.html
          ! grep -Fq 'var slTransformSheets=' player/elf/index.html
          echo V106G3_FINAL_OK

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: player

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
