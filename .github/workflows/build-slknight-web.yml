
name: V211 | Fairy Eight Tile Range and Native Monster Hit Reactions

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Download V210 source while artifact exists
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: github-pages
          run-id: 38414475223
          github-token: ${{ github.token }}
          path: previous

      - name: Restore verified V210 source or published mirror
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          if test -s previous/artifact.tar; then
            tar -xf previous/artifact.tar -C site
            echo V211_USING_V210_ARTIFACT
          else
            echo V211_ARTIFACT_EXPIRED_USING_PUBLISHED_SITE
          fi
          cat > /tmp/v211_restore.py <<'PY_RESTORE'
          from pathlib import Path
          import hashlib, json, re, time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          BASE='https://gowellsik-hue.github.io/Game/'
          ROOT=Path('site')
          FIXED=('index.html','COPYING-mkxp-web.txt','manifest.webmanifest',
                 'mkxp.js','mkxp.wasm','js/drive.js','js/dpad.js','js/localforage.min.js')
          LOCK={
              'index.html': 'cb972e363a37790bef24aafceae5bd12aaa686934acc4a4c052402006341a3ba',
              'knight/index.html': '38b008e7e31b5a7f8eee1aac255641adf1c38a6927ecd8a2b4a29e71e7f1b8a4',
              'elf/index.html': 'b1c814361e6db6f251f5984643751c222564e29f5fc2a30f2c44a5dc90e059ef',
              'knight/gameasync/mapping.js': '764453d72365622f63b84f7af52e93c909b00d4092b7445ed17408e3ca15cac9',
              'elf/gameasync/mapping.js': '402da2dd38fb221b9f0c3668f11ee4ff29f1bf224eb72d9858b2e0e18d8a0fb0',
              'knight/gameasync/bitmap-map.js': 'f9f29fca97904ad924d32b5a743931fb166beddc7fa2f2ceacc4259e8500cf45',
              'elf/gameasync/bitmap-map.js': 'a17996d5aee6bf4767ef06dd499b35d3de10214e8d5bfd83ed0654c6fb0b8c26',
              'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOCommonEvents.rxdata': '38c1c0a4e4fe0641cbdceaf3e8b9c993b9835579a4112ddfcbaad045268d1ec8',
              'knight/gameasync/Data/Scripts.rxdata': '8966a677a9789f3e9c95a058659dcf22b51d98fb1c68dd946a4e6879cf2bbaec',
              'elf/gameasync/Data/Scripts.rxdata': '187010d41e952fba871b8b60bddd1e18993e7e2d8f789806c41da9a83b54d5ed',
              'elf/js/dpad.js': '52e1b860e2ad9c3f6194d7cf983bcf6fa1a43354650d71fd9fd11984761cde69',
              'knight/js/dpad.js': 'c137842818acf76a036127a0ffbae88e22affcba78ca70c3f1b4c76b52f86908',
              'elf/mkxp.js': 'c768aa2a62dfae5ee019668e31d2e55b04a176c529daae6a5a4393c1db21ae9d',
              'elf/mkxp.wasm': '83f6138820a3587ec569bca801d3032ec39edfda1cb49fbb90ab3928821966bd',
              'knight/mkxp.wasm': '83f6138820a3587ec569bca801d3032ec39edfda1cb49fbb90ab3928821966bd',
          }

          def fetch(url):
              for attempt in range(6):
                  try:
                      req=Request(url,headers={'User-Agent':'V211-Fairy-Recovery/1.0','Accept-Encoding':'identity'})
                      with urlopen(req,timeout=60) as response: return response.read()
                  except HTTPError as exc:
                      if exc.code not in (408,425,429,500,502,503,504) or attempt==5: raise
                  except (URLError,TimeoutError):
                      if attempt==5: raise
                  time.sleep(1+attempt*2)
              raise RuntimeError('Download exhausted: '+url)

          def download(job):
              name,url,md5=job
              data=fetch(url)
              if md5 and hashlib.md5(data).hexdigest()!=md5:
                  raise RuntimeError('Asset hash mismatch '+name)
              dest=ROOT/name
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(data)

          ROOT.mkdir(exist_ok=True)
          if not (ROOT/'elf/gameasync/Data/Scripts.rxdata').is_file():
              files={'index.html':(BASE+'index.html',None)}
              for game in ('knight','elf'):
                  for rel in FIXED:
                      files[game+'/'+rel]=(BASE+game+'/'+quote(rel,safe='/'),None)
                  fname=game+'/gameasync/mapping.js'
                  bs=fetch(BASE+fname+'?v=v211-source')
                  (ROOT/fname).parent.mkdir(parents=True,exist_ok=True)
                  (ROOT/fname).write_bytes(bs)
                  script=bs.decode('utf-8')
                  body=script.split('var mappingArray = ',1)[1].split('];',1)[0]+']'
                  mapping=json.loads(re.sub(r',\s*\]$',']',body))
                  for _,mapped in mapping:
                      rel,sep,digest=mapped.partition('?h=')
                      if '.' not in Path(rel).name:continue
                      dest=game+'/gameasync/'+rel
                      if dest in files:raise RuntimeError('Duplicate asset '+dest)
                      url=BASE+game+'/gameasync/'+quote(rel,safe='/')
                      if sep:url+='?h='+digest
                      files[dest]=(url,digest if sep else None)
              if len(files)!=5355:raise RuntimeError('Site asset count '+str(len(files)))
              jobs=[(n,u,h) for n,(u,h) in files.items() if not (ROOT/n).exists()]
              errors=[]
              with ThreadPoolExecutor(max_workers=18) as pool:
                  work={pool.submit(download,j):j[0] for j in jobs}
                  for i,done in enumerate(as_completed(work),1):
                      try:done.result()
                      except Exception as ex:errors.append(str(ex))
                      if i%400==0:print('Restored',i,'/',len(jobs),'errors',len(errors),flush=True)
              if errors:raise RuntimeError('Mirror failed: '+str(errors[:5]))
              if {str(p.relative_to(ROOT)) for p in ROOT.rglob('*') if p.is_file()}!=set(files):
                  raise RuntimeError('Incomplete published snapshot')

          for name,expected in LOCK.items():
              path=ROOT/name
              if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest()!=expected:
                  raise RuntimeError('V210 source hash does not match: '+name)
          all_files={str(p.relative_to(ROOT)):hashlib.sha256(p.read_bytes()).hexdigest()
                     for p in ROOT.rglob('*') if p.is_file()}
          if len(all_files)!=5355:raise RuntimeError('Incomplete source: '+str(len(all_files)))
          Path('/tmp/v211_original.json').write_text(json.dumps(all_files),encoding='utf-8')
          Path('/tmp/v211_original_scripts.rxdata').write_bytes((ROOT/'elf/gameasync/Data/Scripts.rxdata').read_bytes())
          print('V211_SOURCE_VERIFIED',len(all_files),'files')
          PY_RESTORE
          python3 /tmp/v211_restore.py

      - name: Restore native monster reactions and Fairy range
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v211_reaction.rb <<'RB_REACTION'
          # encoding: utf-8
          # V211 - enemy response uses existing monster hit graphics; unrelated scenes intact.
          module SLFairyTargetV206
            HIT_ASSETS = __V211_HIT_ASSET_ARRAY__
            @v211_hit_graphics_cache = {}

            def self.v211_hit_graphic(enemy)
              info = enemy.instance_variable_get(:@event)
              return nil unless info && $data_common_events
              key = [$game_map.map_id, enemy.id]
              return @v211_hit_graphics_cache[key] if @v211_hit_graphics_cache.has_key?(key)
              graphic = nil
              info.pages.each do |page|
                page.list.each do |cmd|
                  next unless cmd.code == 117
                  ce = $data_common_events[cmd.parameters[0]]
                  next unless ce && ce.name.to_s.dup.force_encoding('UTF-8').include?('맞음')
                  ce.list.each do |step|
                    next unless step.code == 209 && step.parameters[0] == 0
                    route = step.parameters[1]
                    next unless route && route.list
                    route.list.each do |move|
                      next unless move.code == 41
                      name = move.parameters[0].to_s.dup.force_encoding('UTF-8')
                      if name.include?('맞음') && HIT_ASSETS.include?(name)
                        graphic = name
                        break
                      end
                    end
                    break if graphic
                  end
                  break if graphic
                end
                break if graphic
              end
              @v211_hit_graphics_cache[key] = graphic
              graphic
            end

            # Original first-hit event arms the enemy touch/combat page. Simulate only
            # that page transition, never its touch-damage instructions at long range.
            def self.v211_activate_contact_page(enemy)
              data = enemy.instance_variable_get(:@event)
              return unless data && data.pages.size >= 2
              first = data.pages[0]
              next_page = data.pages[1]
              return unless enemy.instance_variable_get(:@page) == first
              condition = next_page.condition
              return unless condition.self_switch_valid && condition.self_switch_ch == 'A'
              return unless first.list.any? { |c| c.code == 123 && c.parameters == ['A', 0] }
              key = [$game_map.map_id, enemy.id, 'A']
              unless $game_self_switches[key]
                $game_self_switches[key] = true
                $game_map.need_refresh = true
                enemy.refresh
              end
            end

            def self.v211_react(enemy)
              return if enemy.instance_variable_get(:@erased)
              return if enemy.move_route_forcing
              hit = v211_hit_graphic(enemy)
              route = RPG::MoveRoute.new
              route.repeat = false
              route.skippable = true
              original = enemy.character_name
              direction = enemy.direction
              pattern = enemy.pattern
              hue = enemy.character_hue
              if hit
                route.list = [
                  RPG::MoveCommand.new(41, [hit, hue, direction, pattern]),
                  RPG::MoveCommand.new(15, [5]),
                  RPG::MoveCommand.new(41, [original, hue, direction, pattern]),
                  RPG::MoveCommand.new(0)
                ]
              else
                # Fungus and some other enemies have no native hit sheet.
                old_opacity = enemy.opacity
                route.list = [
                  RPG::MoveCommand.new(42, [110]),
                  RPG::MoveCommand.new(15, [4]),
                  RPG::MoveCommand.new(42, [old_opacity]),
                  RPG::MoveCommand.new(0)
                ]
              end
              enemy.force_move_route(route)
            end

            def self.v211_after_hit(enemy)
              v211_activate_contact_page(enemy)
              v211_react(enemy)
              # The original monster touch AI still controls actual counterattacks.
              # Only monsters we hit are provoked; NPCs and other monsters are untouched.
              if [0, 2, 4].include?(enemy.trigger) && !enemy.through
                enemy.instance_variable_set(:@sl_v211_alert_until, Graphics.frame_count + 180)
              end
            end
          end

          class Game_Event
            alias sl_v211_native_update update
            def update
              sl_v211_native_update
              deadline = @sl_v211_alert_until
              return unless deadline
              now = Graphics.frame_count
              if now >= deadline || @erased || @through || ![0, 2, 4].include?(@trigger)
                @sl_v211_alert_until = nil
                return
              end
              return if moving? || jumping? || move_route_forcing
              return unless ((now + @id.to_i) % 16) == 0
              dx = (@x - $game_player.x).abs
              dy = (@y - $game_player.y).abs
              move_toward_player if dx + dy > 1 && dx + dy <= 10
            end
          end
          RB_REACTION
          cat > /tmp/v211_patch.rb <<'RB_PATCH'
          # encoding: utf-8
          require 'zlib'
          path=ARGV.fetch(0)
          asset_dir=ARGV.fetch(1)
          all=Marshal.load(File.binread(path))
          selected=all.select{|x|x.is_a?(Array)&&x[1].to_s=='SLFairy Correct Bow Range and Real Damage V210'}
          abort "V210 combat count=#{selected.size}" unless selected.size==1
          entry=selected[0]
          src=Zlib::Inflate.inflate(entry[2]).force_encoding('UTF-8')
          from=<<'PRE'
              end
              1
            end

            # Build one validated damage spec per event from its original pages.
          PRE
          to=<<'POST'
              end
              # Some legacy starter characters have no equipment ID until the
              # first equipment screen is opened; Fairy attacks still use a bow.
              if ids.all? { |id| id.nil? || id.to_i == 0 }
                character = $game_player && $game_player.character_name.to_s.dup
                character.force_encoding('UTF-8')
                return BOW_RANGE if character.include?('요정') || character.include?('엘프')
              end
              1
            end

            # Build one validated damage spec per event from its original pages.
          POST
          abort 'Weapon fallback anchor mismatch' unless src.scan(from).length==1
          src.sub!(from,to)
          # Source actually contained this exact "damage add" assignment; keep native damage variables.
          needle="$game_variables[spec[0]] = $game_variables[spec[0]] + total\n"
          new=needle+"      v211_after_hit(enemy)\n"
          abort 'Actual damage anchor missing' unless src.scan(needle).size==1
          src.sub!(needle,new)
          # Keep actual hit amount text for confirming every application.
          needle="puts('SLV210|SHOT|'"
          abort 'Shot log not found' unless src.scan(needle).size==1
          src.sub!(needle,"puts('SLV211|SHOT|'")
          assets=Dir[File.join(asset_dir,'*.png')].map{|x|File.basename(x,'.png').dup.force_encoding('UTF-8')}.select{|n|n.include?('맞음')}.sort
          abort 'No native hit graphics' if assets.size<25
          extension=File.binread('/tmp/v211_reaction.rb').force_encoding('UTF-8')
          extension.sub!('__V211_HIT_ASSET_ARRAY__', assets.inspect)
          # Insert new helper after all original classes, preserving unedited visual source.
          src << "\n" << extension
          RubyVM::InstructionSequence.compile(src,'V211 Fairy full')
          entry[1]='SLFairy Monster Hit React and Eight Tile Bow V211'
          entry[2]=Zlib::Deflate.deflate(src)
          File.binwrite(path,Marshal.dump(all))
          puts "V211_PATCH_OK assets=#{assets.size} ruby_chars=#{src.length}"
          RB_PATCH
          ruby /tmp/v211_patch.rb \
            site/elf/gameasync/Data/Scripts.rxdata \
            site/elf/gameasync/Graphics/Characters

      - name: Update only Fairy code hash and cache label
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CACHE'
          from pathlib import Path
          import hashlib,re
          elf=Path('site/elf')
          source=elf/'gameasync/Data/Scripts.rxdata'
          mapping=elf/'gameasync/mapping.js'
          page=elf/'index.html'
          digest=hashlib.md5(source.read_bytes()).hexdigest()
          current=mapping.read_text(encoding='utf-8')
          pattern=r'(\["data/scripts",\s*"Data/Scripts\.rxdata\?h=)[0-9a-f]{32}("\],)'
          updated,count=re.subn(pattern,lambda m:m.group(1)+digest+m.group(2),current)
          if count!=1:raise SystemExit('V210 scripts mapping marker mismatch')
          mapping.write_text(updated,encoding='utf-8')
          html=page.read_text(encoding='utf-8')
          for a,b in (('gameasync/mapping.js?v=fairy210','gameasync/mapping.js?v=fairy211'),
                      ("box.textContent='V210 '+state", "box.textContent='V211 '+state")):
              if html.count(a)!=1:raise SystemExit('V210 HTML marker mismatch: '+a)
              html=html.replace(a,b,1)
          page.write_text(html,encoding='utf-8')
          print('V211_ELF_MAPPING_AND_DIAGNOSTIC_UPDATED')
          PY_CACHE

      - name: Test real Ettin and Fungus hit and range
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v211_smoke.rb <<'RB_SMOKE'
          # encoding: utf-8
          require 'zlib'
          module RPG
           class Map;end
           class Event;attr_reader :pages,:name;end
           class Event::Page;attr_reader :graphic,:list,:condition,:trigger;end
           class Event::Page::Condition;attr_reader :self_switch_valid,:self_switch_ch,:variable_valid,:variable_id,:variable_value;end
           class Event::Page::Graphic;attr_reader :character_name;end
           class EventCommand;attr_reader :code,:parameters;end
           class CommonEvent;attr_reader :name,:list;end
           class MoveRoute
            attr_accessor :list,:repeat,:skippable
            def initialize;@list=[];@repeat=true;@skippable=false;end
           end
           class MoveCommand
            attr_accessor :code,:parameters
            def initialize(code=0,parameters=[]);@code=code;@parameters=parameters;end
           end
           class AudioFile;end
           class Weapon;attr_accessor :name;end
           class Tileset;end
          end
          class O;attr_reader :b;def initialize(s);@b=s;end;def self._load(s);new(s);end;def _dump(i);@b;end;end
          class Tone<O;end;class Color<O;end
          class Table<O
           def [](x,y=0,z=0)
            dims=@b[0,16].unpack('L<4');nx,ny,nz=dims[1..3];return nil if x<0||y<0||z<0||x>=nx||y>=ny||z>=nz
            pos=(x+y*nx+z*nx*ny)*2+20;@b[pos,2].unpack1('s<')
           end
          end
          class Graphics;def self.frame_count;@frame ||=100;end;def self.frame_count=(x);@frame=x;end;end
          class Game_Player;end
          class Scene_Map;end
          class Game_Event;def update;end;end
          scripts=Marshal.load(File.binread(ARGV.fetch(0)))
          src=Zlib::Inflate.inflate(scripts.find{|x|x.is_a?(Array)&&x[1]=='SLFairy Monster Hit React and Eight Tile Bow V211'}[2]).force_encoding('UTF-8')
          module_src=src.split("\nclass Game_Player\n",2)[0]
          ext_src=src[src.index("\n# V211 - enemy response uses existing")..-1]
          eval(module_src,TOPLEVEL_BINDING,'V211 main')
          eval(ext_src,TOPLEVEL_BINDING,'V211 reaction')
          root=ARGV[1]
          $data_common_events=Marshal.load(File.binread(root+'/VIQLMRLKMVIPVMJHOCSULWPCHOJTMRVIAFODOARHCommonEvents.rxdata'))
          $data_weapons=Marshal.load(File.binread(root+'/VIQLMRLKMVIPVMJHOCSULWPCHOJTMRVIAFODOARHWeapons.rxdata'))
          $data_weapons.compact.each{|x|x.name=x.instance_variable_get(:@name).dup.force_encoding('UTF-8')}
          $game_self_switches={}
          $game_switches=Array.new(3000,false)
          $game_variables=Array.new(5000,0)
          $game_variables[619]=5
          class Player
           attr_accessor :x,:y,:direction,:character_name
           def initialize(x,y,d);@x,@y,@direction=x,y,d;@character_name='여요정';end
          end
          class Actor
           attr_accessor :weapon_id
           def initialize(id);@weapon_id=id;end
           def weapon_ids;[@weapon_id];end
          end
          $game_party=Struct.new(:actors).new([Actor.new(1)])
          $game_system=Struct.new(:map_interpreter).new(Struct.new(:running?).new(false))
          $game_temp=Struct.new(:message_window_showing).new(false)
          class FakeMap
           attr_reader :map_id,:events,:passages,:priorities,:data
           attr_accessor :need_refresh
           def initialize(id,root)
            @map_id=id
            @raw=Marshal.load(File.binread(root+sprintf('/VIQLMRLKMVIPVMJHOCSULWPCHOJTMRVIAFODOARHMap%03d.rxdata',id)))
            @data=@raw.instance_variable_get(:@data)
            $tilesets=Marshal.load(File.binread(root+'/VIQLMRLKMVIPVMJHOCSULWPCHOJTMRVIAFODOARHTilesets.rxdata'))
            ts=$tilesets[@raw.instance_variable_get(:@tileset_id)]
            @passages=ts.instance_variable_get(:@passages)
            @priorities=ts.instance_variable_get(:@priorities)
            @events={};@need_refresh=false
           end
           def raw_event(i);@raw.instance_variable_get(:@events)[i];end
           def valid?(x,y);x>=0&&y>=0&&x<@raw.instance_variable_get(:@width)&&y>=0&&y<@raw.instance_variable_get(:@height);end
          end
          class FakeEvent
           attr_reader :id,:x,:y,:character_name,:character_hue,:direction,:pattern,:opacity,:trigger,:last_route
           attr_accessor :through
           def initialize(raw,page_idx=0)
            @event=raw;@page=raw.instance_variable_get(:@pages)[page_idx];@id=raw.instance_variable_get(:@id);@x=raw.instance_variable_get(:@x);@y=raw.instance_variable_get(:@y);@direction=2;@pattern=0;@opacity=255;@through=false;@character_hue=0;@character_name=@page.graphic.character_name.dup.force_encoding('UTF-8');@trigger=@page.trigger;@last_route=nil;@starting=false;@erased=false;@move_route_forcing=false
           end
           def jumping?;false;end
           def moving?;false;end
           def move_route_forcing;@move_route_forcing;end
           def force_move_route(r);@last_route=r;end
           def screen_x;100;end
           def screen_y;100;end
           def refresh
            @page=@event.pages[1]
            @trigger=@page.trigger
            @character_name=@page.graphic.character_name.dup.force_encoding('UTF-8')
           end
          end
          $game_player=Player.new(91,53,6)
          $game_map=FakeMap.new(14,root)
          raw=$game_map.raw_event(27)
          ettin=FakeEvent.new(raw,1)
          $game_map.events[27]=ettin
          raise 'Bow = not 8' unless SLFairyTargetV206.weapon_range==8
          hit=SLFairyTargetV206.find($game_player,[0,1,2]);raise '2tile Ettin not selected' unless hit && hit[0].equal?(ettin) && hit[1]==2
          SLFairyTargetV206.define_singleton_method(:rand){|n|0}
          $game_variables[385]=100
          SLFairyTargetV206.attack($game_player,ettin,hit[2],2)
          raise 'damage failed' unless $game_variables[385]==106
          raise 'not alerted' unless ettin.instance_variable_get(:@sl_v211_alert_until)==Graphics.frame_count+180
          list=ettin.last_route.list
          raise 'no Ettin reaction sprite' unless list.any?{|a|a.code==41&&a.parameters[0].to_s.include?('맞음')}
          raise 'original model not restored' unless list.any?{|a|a.code==41&&a.parameters[0]=='에틴'}
          puts 'PASS: Ettin 2tiles native hit sprite, damage and enemy aggro'
          # starter equipment with no ID: Fairy still uses bow; melee explicit remains 1.
          $game_party.actors[0].weapon_id=0
          raise 'Starter Fairy no default bow reach' unless SLFairyTargetV206.weapon_range==8
          $game_party.actors[0].weapon_id=40
          raise 'Explicit melee should reach 1' unless SLFairyTargetV206.weapon_range==1
          puts 'PASS: Default Fairy ranged reach, explicit melee range'
          $game_party.actors[0].weapon_id=1
          $game_map=FakeMap.new(1,root)
          f=$game_map.raw_event(16);fungus=FakeEvent.new(f)
          $game_map.events[16]=fungus
          $game_player=Player.new(89,20,6)
          $game_variables[768]=0
          Graphics.frame_count=106
          hit=SLFairyTargetV206.find($game_player,[0,1,2]);raise '2tile Fungus not selected' unless hit&&hit[1]==2
          SLFairyTargetV206.attack($game_player,fungus,hit[2],2)
          raise 'Fungus did not arm original encounter page' unless $game_self_switches[[1,16,'A']]
          raise 'Fungus did not enter touch page' unless fungus.trigger==2
          raise 'Fungus no fallback hit flash' unless fungus.last_route.list.any?{|a|a.code==42&&a.parameters[0]==110}
          puts 'PASS: Fungus 2tiles, hit flash and native combat selfswitch'
          RB_SMOKE
          ruby /tmp/v211_smoke.rb \
            site/elf/gameasync/Data/Scripts.rxdata \
            site/elf/gameasync/Data

      - name: Verify Knight, save and other 5352 files unchanged
        shell: bash
        run: |
          set -euo pipefail
          ruby -rzlib - /tmp/v211_original_scripts.rxdata site/elf/gameasync/Data/Scripts.rxdata <<'RB_VERIFY'
          original=Marshal.load(File.binread(ARGV[0]))
          updated=Marshal.load(File.binread(ARGV[1]))
          abort 'Ruby script number changed' unless original.size==updated.size
          diff=(0...original.size).select{|i|original[i]!=updated[i]}
          abort "Unexpected script modifications: #{diff.inspect}" unless diff.size==1
          a,b=original[diff[0]],updated[diff[0]]
          abort 'Wrong script modified' unless a[1]=='SLFairy Correct Bow Range and Real Damage V210' && b[1]=='SLFairy Monster Hit React and Eight Tile Bow V211'
          code=Zlib::Inflate.inflate(b[2])
          abort 'Native hit graphics not bound' unless code.include?('v211_hit_graphic(enemy)')
          abort 'Native contact page missing' unless code.include?('v211_activate_contact_page(enemy)')
          abort 'Added stale version of direct damage' unless code.include?('$game_variables[spec[0]] = $game_variables[spec[0]] + total')
          abort 'Removed original NPC button path' unless code.include?('sl_fairy_v201_native_there(triggers)')
          %w[Scene_Title Scene_Menu Scene_Save Scene_Load Scene_Map].each do |name|
            old=original.find{|entry|entry.is_a?(Array) && entry[1]==name}
            cur=updated.find{|entry|entry.is_a?(Array) && entry[1]==name}
            abort "Core script changed: #{name}" unless old && cur && old==cur
          end
          RubyVM::InstructionSequence.compile(code,'V211')
          puts 'V211_ONLY_FAIRY_COMBAT_SCRIPT_CHANGED'
          RB_VERIFY
          python3 - <<'PY_FILES'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          old=json.loads(Path('/tmp/v211_original.json').read_text(encoding='utf-8'))
          current={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if set(current)!=set(old):raise SystemExit('File set changed')
          allowed={'elf/index.html','elf/gameasync/mapping.js','elf/gameasync/Data/Scripts.rxdata'}
          changed={p for p in current if current[p]!=old[p]}
          if changed!=allowed:raise SystemExit('Unintended file changes: '+str(changed))
          elf=root/'elf'
          mapping=(elf/'gameasync/mapping.js').read_text(encoding='utf-8')
          md5=hashlib.md5((elf/'gameasync/Data/Scripts.rxdata').read_bytes()).hexdigest()
          if 'Data/Scripts.rxdata?h='+md5 not in mapping:raise SystemExit('Fairy scripts hash stale')
          page=(elf/'index.html').read_text(encoding='utf-8')
          if 'gameasync/mapping.js?v=fairy211' not in page:raise SystemExit('Fairy page old cache')
          if 'slfairy_v105_engine' not in page:raise SystemExit('Fairy saved-data ID changed')
          if 'slknight_v14_engine' not in (root/'knight/index.html').read_text(encoding='utf-8'):
            raise SystemExit('Knight saved-data ID changed')
          print('V211_5355_FILES_VERIFIED_ONLY_3_FAIRY_FILES_CHANGED')
          PY_FILES
          node --check site/elf/js/dpad.js
          node --check site/knight/js/dpad.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
