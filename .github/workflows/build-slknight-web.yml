
name: V216 | Native Fairy Monster Sensor and One-Tile Attack

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slknight-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Restore V214 deployment if available
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: github-pages
          run-id: 38499329436
          github-token: ${{ github.token }}
          path: previous

      - name: Restore and lock exact V214 site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          if test -s previous/artifact.tar; then
            tar -xf previous/artifact.tar -C site
            echo V216_RESTORED_FROM_V214_ARTIFACT
          else
            echo V216_ARTIFACT_EXPIRED_TRY_VERIFIED_SITE
            python3 - <<'PY_RESTORE'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import urlopen, Request
          import hashlib, json, re, time
          root=Path('site'); base='https://gowellsik-hue.github.io/Game/'
          fixed=('index.html','COPYING-mkxp-web.txt','manifest.webmanifest','mkxp.js',
                 'mkxp.wasm','js/drive.js','js/dpad.js','js/localforage.min.js')
          def get(url):
              for attempt in range(6):
                  try:
                      with urlopen(Request(url,headers={'User-Agent':'V216-Native-Combat',
                           'Accept-Encoding':'identity'}), timeout=60) as r: return r.read()
                  except Exception:
                      if attempt==5: raise
                      time.sleep(1+2*attempt)
          files={'index.html':(base+'index.html',None)}
          for game in ('knight','elf'):
              for rel in fixed:
                  files[game+'/'+rel]=(base+game+'/'+quote(rel,safe='/'),None)
              name=game+'/gameasync/mapping.js'
              data=get(base+name+'?restore=v214')
              target=root/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
              body=data.decode('utf-8').split('var mappingArray = ',1)[1].split('];',1)[0]+']'
              for _,mapped in json.loads(re.sub(r',\s*\]$',']',body)):
                  rel,sep,md5=mapped.partition('?h=')
                  if '.' not in Path(rel).name: continue
                  if rel.startswith('/') or '..' in Path(rel).parts: raise RuntimeError('Unsafe asset '+rel)
                  name=game+'/gameasync/'+rel
                  if name in files: raise RuntimeError('Duplicate asset '+name)
                  url=base+game+'/gameasync/'+quote(rel,safe='/')
                  files[name]=(url+('?h='+md5 if sep else ''),md5 if sep else None)
          if len(files)!=5354: raise RuntimeError('Wrong V214 file count '+str(len(files)))
          def job(item):
              name,(url,digest)=item; raw=get(url)
              if digest and hashlib.md5(raw).hexdigest()!=digest:
                  raise RuntimeError('Published file mismatch: '+name)
              f=root/name;f.parent.mkdir(parents=True,exist_ok=True);f.write_bytes(raw)
          todo=[x for x in files.items() if not (root/x[0]).is_file()]
          with ThreadPoolExecutor(max_workers=16) as pool:
              futures=[pool.submit(job,x) for x in todo]
              for n,done in enumerate(as_completed(futures),1):
                  done.result()
                  if n%500==0:print('RECOVERED',n,'/',len(todo),flush=True)
          actual={str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}
          if actual!=set(files):raise RuntimeError('Incomplete restore')
          print('V216_BASE_SITE_RESTORED',len(actual))
          PY_RESTORE
          fi
          python3 - <<'PY_LOCK'
          from pathlib import Path
          import json,hashlib
          root=Path('site')
          locked={
            'knight/index.html':'38b008e7e31b5a7f8eee1aac255641adf1c38a6927ecd8a2b4a29e71e7f1b8a4',
            'knight/gameasync/Data/Scripts.rxdata':'8966a677a9789f3e9c95a058659dcf22b51d98fb1c68dd946a4e6879cf2bbaec',
            'elf/index.html':'cffd260640627580c751ad0055c22fcb5c54a65dffd6bdac0a2c8ef0eea54c3b',
            'elf/gameasync/mapping.js':'8b9c840e4e6dbca9045ca246f3830fb2f7dec275f9915c8b411dca62e1cd0c89',
            'elf/gameasync/Data/Scripts.rxdata':'8afa5c625f296502ee199f419f9ee50ee0ffc1626f17989ce3a2be6c8633f0a8',
            'elf/js/dpad.js':'52e1b860e2ad9c3f6194d7cf983bcf6fa1a43354650d71fd9fd11984761cde69'
          }
          current={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                   for p in root.rglob('*') if p.is_file()}
          if len(current)!=5354: raise SystemExit('Wrong V214 source count')
          for path,digest in locked.items():
              if current.get(path)!=digest: raise SystemExit('Wrong V214 baseline '+path)
          Path('/tmp/v216_original.json').write_text(json.dumps(current))
          Path('/tmp/v216_original_scripts.rxdata').write_bytes((root/'elf/gameasync/Data/Scripts.rxdata').read_bytes())
          print('V216_VERIFIED_EXACT_V214_BASELINE')
          PY_LOCK

      - name: Enable original monster range sensor and native C-key condition
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v216_patch.rb <<'RB_PATCH'
          # encoding: utf-8
          require 'zlib'
          source_file = ARGV.fetch(0)
          scripts = Marshal.load(File.binread(source_file))
          player = scripts.find { |e| e.is_a?(Array) && e[1] == 'Game_Player' }
          bridge = scripts.find { |e| e.is_a?(Array) && e[1] == 'SL214 Native Combat Restored' }
          abort 'Original V214 scripts missing' unless player && bridge
          raw = Zlib::Inflate.inflate(player[2]).force_encoding('UTF-8')
          crlf = raw.include?("\r\n")
          src = raw.gsub("\r\n", "\n")
          # Check precise V214 anchors and not touch any other scripts.
          start = src.index("  def check_event_trigger_there(triggers)\n")
          finish = src.index("  def check_event_trigger_touch(x, y)\n", start || 0)
          abort 'Original target method mismatch' unless start && finish && start < finish
          block = src[start...finish]
          abort 'Original V214 extension missing' unless block.include?('sl214_terrain_open?') && block.include?('enemy.start')
          abort 'Original end missing' unless block.scan("    return result\n  end\n").length == 1
          # Preflight original movement sensor only where the event itself declared one.
          prep = <<'PREP'
            # Run the event's ORIGINAL range sensor on an explicit attack keypress.
            # No damage, motion, switches, inventory, or monster AI is fabricated.
            def sl216_prepare_original_enemy(ev, distance)
              raw = ev.instance_variable_get(:@event)
              return false unless raw &&
                raw.name.to_s.dup.force_encoding('UTF-8').start_with?('[ID')
              return false if ev.instance_variable_get(:@erased)
              return true if ev.list && ev.list.size > 1
              page = ev.instance_variable_get(:@page)
              return false unless page && page.move_type == 3
              commands = page.move_route && page.move_route.list
              return false unless commands
              commands.each do |step|
                next unless step.code == 45
                line = step.parameters[0].to_s.dup.force_encoding('UTF-8').strip
                match = /\A범위\(\s*(\d+)\s*,\s*(\d+)\s*,\s*([12])\s*\)\z/.match(line)
                next unless match
                radius, switch_id, mode = match.captures.map { |v| v.to_i }
                next unless distance < radius && mode == 1
                before = $game_switches[switch_id]
                ev.send(:범위, radius, switch_id, mode)
                if !before && $game_switches[switch_id]
                  $game_map.need_refresh = true
                  ev.refresh
                end
                break
              end
              ev.list && ev.list.size > 1
            end

            # Explicit player attack: activate the same sensor that the event would
            # activate on its autonomous-movement turn. Leave NPCs and other events alone.
            def sl216_prepare_facing_original_enemy
              dx = (@direction == 6 ? 1 : @direction == 4 ? -1 : 0)
              dy = (@direction == 2 ? 1 : @direction == 8 ? -1 : 0)
              return if dx == 0 && dy == 0
              $game_map.events.values.each do |ev|
                forward = (ev.x - @x) * dx + (ev.y - @y) * dy
                cross = (ev.x - @x) * dy - (ev.y - @y) * dx
                next unless forward.between?(1, 8) && cross == 0
                next unless sl216_prepare_original_enemy(ev, forward)
                ev.turn_toward_player if forward == 1
              end
            end

            def sl216_ack_original_started_event
              dx = (@direction == 6 ? 1 : @direction == 4 ? -1 : 0)
              dy = (@direction == 2 ? 1 : @direction == 8 ? -1 : 0)
              return if dx == 0 && dy == 0
              selected = $game_map.events.values.find do |ev|
                raw = ev.instance_variable_get(:@event)
                next false unless raw &&
                  raw.name.to_s.dup.force_encoding('UTF-8').start_with?('[ID')
                forward = (ev.x - @x) * dx + (ev.y - @y) * dy
                cross = (ev.x - @x) * dy - (ev.y - @y) * dx
                forward.between?(1, 8) && cross == 0 &&
                  ev.instance_variable_get(:@starting) && ev.list &&
                  ev.list.size > 1 && ev.trigger == 2
              end
              SL216NativeInput.arm(selected) if selected
            end

          PREP
          src = src[0...start] + prep + src[start..-1]
          start = src.index("  def check_event_trigger_there(triggers)\n")
          finish = src.index("  def check_event_trigger_touch(x, y)\n", start)
          block = src[start...finish]
          anchor = "    # 정면의 좌표를 계산\n"
          abort 'Original native coordinate anchor missing' unless block.scan(anchor).size == 1
          block.sub!(anchor, "    sl216_prepare_facing_original_enemy if triggers == [0,1,2]\n" + anchor)
          # This guard was an erroneous second press check, because `update` already checks `Input.trigger?(C)`.
          old = "       triggers == [0,1,2] &&\n       Input.press?(Input::C) &&\n"
          abort 'Wrong V214 ranged C guard' unless block.scan(old).size == 1
          block.sub!(old, "       triggers == [0,1,2] &&\n")
          anchor = "    return result\n  end\n"
          abort 'Original target return missing' unless block.scan(anchor).size == 1
          block.sub!(anchor, "    sl216_ack_original_started_event if result && triggers == [0,1,2]\n" + anchor)
          src = src[0...start] + block + src[finish..-1]
          RubyVM::InstructionSequence.compile(src, 'V216 Native Game_Player')
          player[2] = Zlib::Deflate.deflate(crlf ? src.gsub("\n", "\r\n") : src)
          # Minimal event-specific key bridge; native branch execution resumes normally.
          ack = <<'ACK'
          # encoding: utf-8
          module SL216NativeInput
            @pending = nil
            def self.arm(event)
              @pending = [$game_map.map_id, event.id, Graphics.frame_count + 18]
            end
            def self.consume?(event_id)
              entry = @pending
              return false unless entry
              if $game_map.map_id != entry[0] || Graphics.frame_count > entry[2]
                @pending = nil
                return false
              end
              return false unless entry[1] == event_id
              @pending = nil
              true
            end
          end
          class Interpreter
            alias sl216_original_command_111 command_111
            def command_111
              if @parameters && @parameters[0] == 11 &&
                 @parameters[1] == Input::C && @event_id.to_i > 0 &&
                 SL216NativeInput.consume?(@event_id)
                # Native interpreter's true branch for "C key is pressed".
                @branch.delete(@list[@index].indent)
                return true
              end
              sl216_original_command_111
            end
          end
          ACK
          RubyVM::InstructionSequence.compile(ack, 'V216 Native input acknowledgement')
          bridge[1] = 'SL216 Native Monster Event Input'
          bridge[2] = Zlib::Deflate.deflate(ack)
          File.binwrite(source_file, Marshal.dump(scripts))
          puts 'V216_ONLY_NATIVE_RANGE_SENSOR_AND_C_KEY_HANDOFF'
          RB_PATCH
          ruby /tmp/v216_patch.rb site/elf/gameasync/Data/Scripts.rxdata

      - name: Refresh only Fairy scripts cache and version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CACHE'
          from pathlib import Path
          import hashlib,re
          elf=Path('site/elf'); data=elf/'gameasync/Data/Scripts.rxdata'; mapping=elf/'gameasync/mapping.js'
          md5=hashlib.md5(data.read_bytes()).hexdigest()
          s=mapping.read_text(encoding='utf-8')
          rx=r'(\["data/scripts",\s*"Data/Scripts\.rxdata\?h=)[0-9a-f]{32}("\],)'
          s,count=re.subn(rx,lambda m:m.group(1)+md5+m.group(2),s)
          if count!=1:raise SystemExit('Missing Scripts hash entry')
          mapping.write_text(s,encoding='utf-8')
          page=elf/'index.html'; html=page.read_text(encoding='utf-8')
          for old,new in (('gameasync/mapping.js?v=fairy214','gameasync/mapping.js?v=fairy216'),
                          ("box.textContent='V214 '+state","box.textContent='V216 '+state")):
              if html.count(old)!=1:raise SystemExit('Unknown Fairy HTML token: '+old)
              html=html.replace(old,new,1)
          page.write_text(html,encoding='utf-8')
          print('V216_ELF_CACHE_REFRESHED')
          PY_CACHE

      - name: Verify original engine and game data are preserved
        shell: bash
        run: |
          set -euo pipefail
          ruby - /tmp/v216_original_scripts.rxdata site/elf/gameasync/Data/Scripts.rxdata <<'RB_VERIFY'
          # encoding: utf-8
          require 'zlib'
          a=Marshal.load(File.binread(ARGV[0]));b=Marshal.load(File.binread(ARGV[1]))
          abort 'Script count changed' unless a.length==b.length
          changed=a.each_index.select{|i|a[i]!=b[i]}
          abort "Wrong edited Ruby scripts: #{changed.inspect}" unless changed.map{|i|a[i][1]}.sort==['Game_Player','SL214 Native Combat Restored'].sort
          b_player=b.find{|x|x.is_a?(Array)&&x[1]=='Game_Player'}
          b_addon=b.find{|x|x.is_a?(Array)&&x[1]=='SL216 Native Monster Event Input'}
          abort 'Required original scripts missing' unless b_player&&b_addon
          src=Zlib::Inflate.inflate(b_player[2]).force_encoding('UTF-8');ack=Zlib::Inflate.inflate(b_addon[2]).force_encoding('UTF-8')
          abort 'Native detection not connected' unless src.include?('sl216_prepare_facing_original_enemy') && src.include?('sl216_ack_original_started_event') && src.include?('enemy.start')
          abort 'Original movement sensor not used' unless src.include?('ev.send(:범위, radius, switch_id, mode)')
          abort 'Synthetic damage/motion unexpectedly introduced' if ack.include?('damage_spec')||ack.include?('Game_Event')||ack.include?('Game_Map')
          %w[Scene_Title Scene_Map Scene_Menu Scene_Save Scene_Load Game_Event].each do |name|
              x=a.find{|i|i.is_a?(Array)&&i[1]==name};y=b.find{|i|i.is_a?(Array)&&i[1]==name}
              abort "Core engine script changed #{name}" unless x&&x==y
          end
          RubyVM::InstructionSequence.compile(src.force_encoding('UTF-8'),'V216 Game_Player')
          RubyVM::InstructionSequence.compile(ack.force_encoding('UTF-8'),'V216 C key')
          puts 'V216_ONLY_NATIVE_PLAYER_TARGET_AND_EVENT_SCOPED_C_ACK'
          RB_VERIFY
          python3 - <<'PY_VERIFY'
          from pathlib import Path
          import json,hashlib
          root=Path('site');a=json.loads(Path('/tmp/v216_original.json').read_text())
          b={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if a.keys()!=b.keys():raise SystemExit('Game files added or removed')
          allowed={'elf/index.html','elf/gameasync/mapping.js','elf/gameasync/Data/Scripts.rxdata'}
          changed={p for p in a if a[p]!=b[p]}
          if changed!=allowed:raise SystemExit('Unexpected changes: '+repr(changed))
          elf=root/'elf';html=(elf/'index.html').read_text(encoding='utf-8')
          mapping=(elf/'gameasync/mapping.js').read_text(encoding='utf-8')
          md5=hashlib.md5((elf/'gameasync/Data/Scripts.rxdata').read_bytes()).hexdigest()
          if 'Data/Scripts.rxdata?h='+md5 not in mapping:raise SystemExit('Stale V216 Scripts cache')
          if 'gameasync/mapping.js?v=fairy216' not in html:raise SystemExit('Wrong browser cache version')
          if 'slfairy_v105_engine' not in html:raise SystemExit('Fairy save namespace modified')
          if 'slknight_v14_engine' not in (root/'knight/index.html').read_text(encoding='utf-8'):raise SystemExit('Knight save namespace modified')
          print('V216_ONLY_THREE_FAIRY_FILES_CHANGED_ALL_KNIGHT_AND_SAVE_FILES_PRESERVED')
          PY_VERIFY
          node --check site/elf/js/dpad.js
          node --check site/knight/js/dpad.js

      - name: Test real Ettin page activation and original attack input
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v216_test.rb <<'RB_SMOKE'
          # encoding: utf-8
          require 'zlib'
          module RPG
           class Map;end;class Event;attr_reader :name;end;class Event::Page;attr_reader :condition,:graphic,:move_type,:move_route,:trigger,:list;end
           class Event::Page::Condition;attr_reader :switch1_id,:switch1_valid,:switch2_id,:switch2_valid,:variable_valid,:variable_id,:variable_value,:self_switch_valid,:self_switch_ch;end
           class Event::Page::Graphic;end;class EventCommand;end;class CommonEvent;end
           class MoveRoute;attr_reader :list;end
           class MoveCommand;attr_reader :code,:parameters;end
           class AudioFile;end
          end
          class O;def initialize(b);@b=b;end;def self._load(b);new(b);end;def _dump(level);@b;end;end
          class Tone<O;end;class Color<O;end;class Table<O;end
          class Graphics;def self.frame_count;1234;end;end
          class Game_Character;attr_accessor :x,:y;end
          class Game_Event < Game_Character
           attr_reader :id,:trigger,:list,:starting,:character_name,:through
           def initialize(raw)
             @event=raw;@id=raw.instance_variable_get(:@id);@x=raw.instance_variable_get(:@x);@y=raw.instance_variable_get(:@y);@erased=false;@starting=false
             @direction=2;refresh
           end
           def refresh
             @page=@event.instance_variable_get(:@pages).reverse.find do |p|
               c=p.condition
               (!c.switch1_valid || $game_switches[c.switch1_id]) &&
               (!c.switch2_valid || $game_switches[c.switch2_id]) &&
               (!c.variable_valid || $game_variables[c.variable_id]>=c.variable_value) &&
               (!c.self_switch_valid || $game_self_switches[[$game_map.map_id,@id,c.self_switch_ch]])
             end
             @trigger=@page.trigger;@list=@page.list;@through=@page.instance_variable_get(:@through);
             @character_name=@page.graphic.instance_variable_get(:@character_name).dup.force_encoding('UTF-8')
           end
           def jumping?;false;end
           def over_trigger?;false;end
           def turn_toward_player;@direction=(@x>$game_player.x ? 4 : @x<$game_player.x ? 6 : @y>$game_player.y ? 8 : 2);end
           def start;@starting=true if @list.size > 1;end
          end
          class SwitchArray < Array
           def []=(n,val);super;$game_map.need_refresh = true if $game_map;end
          end
          class FakeMap
           attr_accessor :need_refresh
           attr_reader :map_id,:data,:passages,:priorities
           attr_accessor :events
           def initialize;@map_id=14;@events={};@data=self;@passages=[0,0,15];@priorities=[0,0,0];@need_refresh=false;end
           def valid?(x,y);x>=0&&x<110&&y>=0&&y<110;end
           def counter?(*args);false;end
           def [](*args);1;end
          end
          $game_map=FakeMap.new
          $game_switches=SwitchArray.new(2000,false)
          $game_variables=Array.new(3000,0)
          $game_self_switches={}
          $game_system=Struct.new(:map_interpreter).new(Struct.new(:running?).new(false))
          $game_temp=Struct.new(:message_window_showing).new(false)
          $game_party=Struct.new(:actors).new([Struct.new(:weapon_id).new(1)])
          $data_weapons=Array.new(100)
          $data_weapons[1]=Struct.new(:name).new('활(2handed)')
          $data_weapons[40]=Struct.new(:name).new('대검(2handed)')
          module Input
           C=13
           def self.press?(code);true;end
          end
          module SL216NativeInput;end
          s=Marshal.load(File.binread(ARGV.fetch(0)))
          s_player=Zlib::Inflate.inflate(s.find{|e|e.is_a?(Array)&&e[1]=='Game_Player'}[2]).force_encoding('UTF-8').gsub("\r\n","\n")
          s_ack=Zlib::Inflate.inflate(s.find{|e|e.is_a?(Array)&&e[1]=='SL216 Native Monster Event Input'}[2]).force_encoding('UTF-8')
          # Load exact original Game_Character range function.
          s_range=Zlib::Inflate.inflate(s[100][2]).force_encoding('UTF-8')
          eval(s_range,TOPLEVEL_BINDING,'Original Game_Character range')
          class Interpreter
           def command_111;:native;end
          end
          eval(s_ack,TOPLEVEL_BINDING,'Original Interpreter narrow C acknowledgement')
          class Game_Player < Game_Character
           def initialize(x);@x=x;@y=53;@direction=6;@character_name='여요정';end
          end
          start=s_player.index('  def sl214_terrain_open?')
          finish=s_player.index('  def check_event_trigger_touch',start)
          raise 'bad section' unless start&&finish
          Game_Player.class_eval(s_player[start...finish], 'Actual V216 targeting functions', 1)
          map=Marshal.load(File.binread(ARGV.fetch(1)))
          raw=map.instance_variable_get(:@events).fetch(27)
          enemy=Game_Event.new(raw)
          $game_map.events={27=>enemy}
          raise 'Expected inactive enemy to start' unless enemy.list.size==1 && enemy.trigger==0

          def case_at(x,weapon_id,expect)
           $game_switches[300]=false
           $game_map.need_refresh=false
           enemy=$game_map.events.fetch(27)
           enemy.refresh
           enemy.instance_variable_set(:@starting,false)
           $game_player=Game_Player.new(x)
           $game_party.actors[0].weapon_id=weapon_id
           result=$game_player.check_event_trigger_there([0,1,2])
           ok=[result,enemy.starting,enemy.list.size,enemy.trigger,$game_switches[300]]
           puts "at x=#{x} weapon=#{weapon_id} result=#{ok.inspect} expect #{expect}"
           raise 'wrong activation' unless result == expect && enemy.starting == expect
           return unless expect
           raise 'Event never switched to ORIGINAL combat page' unless enemy.trigger==2 && enemy.list.size==175 && $game_switches[300]
           i=Interpreter.new
           i.instance_variable_set(:@event_id,27)
           i.instance_variable_set(:@parameters,[11,Input::C])
           i.instance_variable_set(:@index,3)
           i.instance_variable_set(:@list,[nil,nil,nil,Struct.new(:indent).new(3)])
           i.instance_variable_set(:@branch,{3=>false})
           raise 'One-time C acknowledgement not passed' unless i.command_111==true
           raise 'A second C acknowledgement unexpectedly passed' if i.command_111==true
          end
          case_at(92,1,true) # 1 tile
          case_at(91,1,true) # 2 tile
          case_at(85,1,true) # 8 tile
          case_at(84,1,false) # 9 tile
          case_at(91,40,false) # melee 2 tile
          puts 'V216_REAL_ETTIN_MAP014_NATIVE_EVENT_AND_INPUT_ALL_PASS'
          RB_SMOKE
          ruby /tmp/v216_test.rb \
            site/elf/gameasync/Data/Scripts.rxdata \
            site/elf/gameasync/Data/VIQLMRLKMVIPVMJHOCSULWPCHOJTMRVIAFODOARHMap014.rxdata

