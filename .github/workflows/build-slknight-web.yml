
name: build-slknight-web.yml | V1.25 | Healer Baphomet, Holy Walk Icons, Hit Pictures

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Restore V1.24 deployed game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 42984046685
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify V1.24 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/artifact.tar
          mkdir -p site build
          tar -xf baseline/artifact.tar -C site
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          root = Path("site")
          files = {
              str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob("*") if p.is_file()
          }
          assert len(files) == 5618, ("V1.24 file count", len(files))

          pre = "knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"
          required = [
              "knight/gameasync/Data/Scripts.rxdata",
              pre + "CommonEvents.rxdata",
              pre + "Map016.rxdata",
              "knight/gameasync/bitmap-map.js",
              "knight/gameasync/mapping.js",
              "knight/gameasync/Graphics/Icons/홀리워크.png",
              "knight/js/sl-assets-v229r115.js",
              "knight/index.html",
              "index.html",
          ]
          assert all(p in files for p in required), "Incomplete V1.24 game"
          assert pre + "Map043.rxdata" not in files
          assert pre + "Map044.rxdata" not in files

          loader = (root / "knight/js/sl-assets-v229r115.js").read_text("utf8")
          assert "var version='V1.24';" in loader
          assert "SLKnight V1.24" in (root / "knight/index.html").read_text("utf8")

          Path("build/before.json").write_text(
              json.dumps(files, ensure_ascii=False), encoding="utf8"
          )
          print("PASS V1.24 deployed artifact: 5618 files")
          PY

      - name: Prepare original Holy Walk icons 622 and 623
        shell: bash
        run: |
          set -euo pipefail
          cat > build/icon622.b64 <<'ICON622'
          
          ICON622

          cat > build/icon623.b64 <<'ICON623'
          
          ICON623

          icon_dir=site/knight/gameasync/Graphics/Icons
          test -f "$icon_dir/홀리워크.png"
          test ! -e "$icon_dir/홀리워크버프.png"
          base64 -d build/icon622.b64 > "$icon_dir/홀리워크.png"
          base64 -d build/icon623.b64 > "$icon_dir/홀리워크버프.png"

          python3 - <<'PY'
          from pathlib import Path
          import struct
          root = Path("site/knight/gameasync/Graphics/Icons")
          for name, length, dims in [
              ("홀리워크.png", 2146, (32,32)),
              ("홀리워크버프.png", 2227, (38,37)),
          ]:
              data = (root/name).read_bytes()
              assert len(data) == length, (name, len(data))
              assert data[:8] == b"\x89PNG\r\n\x1a\n"
              assert struct.unpack(">II", data[16:24]) == dims, name
          print("PASS Sanctuary original icons 622/623")
          PY

      - name: Patch healer, hit pictures, and buff icon linkage
        shell: bash
        run: |
          set -euo pipefail
          cat > build/patch_v125.rb <<'RUBY_V125'
          # encoding: utf-8
          require 'json'
          require 'zlib'
          require 'digest'

          module RPG
            class Map; end
            class MapInfo; end
            class CommonEvent; end
            class Event
              class Page
                class Condition; end
                class Graphic; end
              end
            end
            class EventCommand; end
            class MoveRoute; end
            class MoveCommand; end
            class AudioFile; end
            class Tileset; end
          end

          [Color = Class.new, Tone = Class.new, Table = Class.new].each do |klass|
            klass.define_singleton_method(:_load) do |raw|
              obj = allocate
              obj.instance_variable_set(:@sl_raw_payload, raw)
              obj
            end
            klass.define_method(:_dump) do |_limit|
              instance_variable_get(:@sl_raw_payload)
            end
          end

          ROOT = File.expand_path(ARGV.fetch(0))
          KNIGHT = File.join(ROOT, 'knight')
          DATA = File.join(KNIGHT, 'gameasync/Data')
          PRE = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          def check(ok, message)
            raise message unless ok
          end

          def iv(obj, key)
            obj.instance_variable_get(key)
          end

          def data_file(name)
            File.join(DATA, "#{PRE}#{name}.rxdata")
          end

          def save(path, object)
            File.binwrite(path, Marshal.dump(object))
          end

          def decoded_name(raw)
            raw.to_s.dup.force_encoding('UTF-8').scrub
          end

          def replace_once(src, old, new_text, label)
            count = src.scan(old).length
            check(count == 1, "#{label}: #{count} matches")
            src.sub(old, new_text)
          end

          # Resolve the existing Baphomet character graphic.
          source_map = Marshal.load(File.binread(data_file('Map016')))
          source_event = iv(source_map, :@events).fetch(6)
          check(decoded_name(iv(source_event, :@name)).include?('바포메트'),
                'Map016 EV6 is not Baphomet')

          baphomet_graphics = iv(source_event, :@pages).map do |page|
            graphic = iv(page, :@graphic)
            graphic && decoded_name(iv(graphic, :@character_name))
          end.compact.reject(&:empty?).uniq

          if baphomet_graphics.length == 1
            baphomet = baphomet_graphics.first
          else
            fallback = File.join(KNIGHT,
              'gameasync/Graphics/Characters/바포메트.png')
            check(File.file?(fallback),
                  "Baphomet graphic cannot be identified: #{baphomet_graphics.inspect}")
            png = File.binread(fallback)
            check(png.byteslice(16,8).unpack('NN') == [500,400],
                  'Baphomet fallback is not the confirmed 4x4 original')
            baphomet = '바포메트'
          end

          check(!baphomet.start_with?('SL8_'),
                'Baphomet graphic requires different walking-frame handling')

          # Existing V1.24 event movement logic reads @sl_move_rate.
          # Change healer event data only, not the common movement engine.
          healer_ids = []
          healer_maps = []
          healer_graphics = 0
          cast_graphics = 0

          Dir.glob(File.join(DATA, "#{PRE}Map[0-9][0-9][0-9].rxdata")).sort.each do |path|
            mid = File.basename(path)[/Map(\d{3})\.rxdata$/, 1].to_i
            map = Marshal.load(File.binread(path))
            changed = false

            iv(map, :@events).each do |eid, event|
              next unless iv(event, :@name).to_s == '[ID힐러 마법사]'.b

              check(!event.instance_variable_defined?(:@sl_move_rate),
                    "Map#{mid} EV#{eid}: existing rate override")

              event.instance_variable_set(:@sl_move_rate, 32.0/12.0)
              healer_ids << [mid,eid]
              healer_maps << mid
              changed = true

              iv(event, :@pages).each do |page|
                graphic = iv(page, :@graphic)
                if graphic
                  original = iv(graphic, :@character_name).to_s
                  unless original.empty?
                    graphic.instance_variable_set(:@character_name, baphomet.b)
                    healer_graphics += 1
                  end
                end

                # Preserve the original cast timing, healing and commands.
                # Only prevent Black Elder/Black Elder Magic graphic switches.
                (iv(page, :@list) || []).each do |command|
                  next unless iv(command, :@code) == 209
                  params = iv(command, :@parameters)
                  next unless params.is_a?(Array)

                  route = params.find { |p| p.is_a?(RPG::MoveRoute) }
                  next unless route

                  (iv(route, :@list) || []).each do |step|
                    next unless iv(step, :@code) == 41

                    args = iv(step, :@parameters)
                    next unless args.is_a?(Array) && args[0].is_a?(String)

                    old_name = decoded_name(args[0])
                    next unless ['흑장로', '흑장로마법'].include?(old_name)

                    args[0] = baphomet.b
                    cast_graphics += 1
                  end
                end
              end
            end

            save(path, map) if changed
          end

          check(healer_ids.length == 39,
                "Healer coverage #{healer_ids.length}/39")
          check(healer_maps.uniq.length == 39,
                "Healer map coverage #{healer_maps.uniq.length}/39")
          check(healer_graphics >= 39,
                "Healer visual pages #{healer_graphics}")
          check(cast_graphics > 0,
                'No Black Elder casting graphic commands found')

          # Reuse the existing player 5F walking cadence for healer only.
          scripts_path = File.join(DATA, 'Scripts.rxdata')
          scripts = Marshal.load(File.binread(scripts_path))
          changed_script_names = []

          def patch_script(scripts, name)
            row = scripts.find do |entry|
              entry.is_a?(Array) && entry[1].to_s == name.b
            end
            check(row, "Missing script #{name}")
            old = Zlib::Inflate.inflate(row[2]).force_encoding('UTF-8')
            updated = yield(old)
            check(old != updated, "Unchanged script #{name}")
            RubyVM::InstructionSequence.compile(updated)
            row[2] = Zlib::Deflate.deflate(updated.b)
          end

          patch_script(scripts, 'Game_Character 2') do |src|
            old = 'if self.is_a?(Game_Player) && @sl_move_rate.to_f >= 1.0'
            new_text = "if (self.is_a?(Game_Player) || " \
              "(self.is_a?(Game_Event) && @event && " \
              "@event.name == '[ID힐러 마법사]')) && @sl_move_rate.to_f >= 1.0"

            check(src.include?('elsif rate >= 2.6') && src.include?("\n      5\n"),
                  'Existing 2.67x / 5F player walking branch missing')
            replace_once(src, old, new_text, 'healer walking condition')
          end
          changed_script_names << 'Game_Character 2'

          # The buff already has slot 23; change only its icon source.
          patch_script(scripts, '버프,물약 이미지 출력') do |src|
            replace_once(
              src,
              '$Buf_23.bitmap = RPG::Cache.icon("홀리워크")',
              '$Buf_23.bitmap = RPG::Cache.icon("홀리워크버프")',
              'Holy Walk upper-right buff icon'
            )
          end
          changed_script_names << '버프,물약 이미지 출력'

          save(scripts_path, scripts)

          # Remove only hit thumbnails so the original PNGs load directly.
          ces = Marshal.load(File.binread(data_file('CommonEvents')))
          hit_ids = [69,71,74,75,113,127,135,137]

          keys = hit_ids.flat_map do |id|
            list = iv(ces.fetch(id), :@list) || []
            list.filter_map do |command|
              next unless iv(command, :@code) == 231
              params = iv(command, :@parameters)
              next unless params.is_a?(Array)
              next unless params[1].is_a?(String)
              'graphics/pictures/' + decoded_name(params[1]).downcase
            end
          end.uniq

          check(keys.length == 95, "Hit graphics #{keys.length}/95")

          bitmap_path = File.join(KNIGHT, 'gameasync/bitmap-map.js')
          original_bitmap = File.binread(bitmap_path).force_encoding('UTF-8')
          selected = keys.to_h { |key| [key,true] }
          found = []

          filtered = original_bitmap.each_line.reject do |line|
            key = line[/^"([^"]+)": \[/,1]
            if key && selected[key]
              found << key
              true
            else
              false
            end
          end.join

          check(found.length == 95 && found.uniq.length == 95,
                "Hit bitmap mapping #{found.length}/95")
          check(filtered.start_with?('var bitmapSizeMapping = {') &&
                filtered.end_with?("};\n"),
                'Bitmap mapping structure changed')
          File.binwrite(bitmap_path, filtered)

          # Update only modified asset hashes and add the new buff icon key.
          mapping_path = File.join(KNIGHT, 'gameasync/mapping.js')
          mapping = File.binread(mapping_path).force_encoding('UTF-8')

          def replace_hash(mapping, token, path)
            pattern = Regexp.new(Regexp.escape(token) + '[0-9a-f]{32}')
            check(mapping.scan(pattern).length == 1,
                  "Missing mapping hash #{token}")
            mapping.sub(pattern, token + Digest::MD5.file(path).hexdigest)
          end

          changed_data = healer_maps.uniq.sort.map do |mid|
            data_file('Map%03d' % mid)
          end
          changed_data << scripts_path

          changed_data.each do |path|
            mapping = replace_hash(
              mapping, "Data/#{File.basename(path)}?h=", path
            )
          end

          icon_dir = File.join(KNIGHT, 'gameasync/Graphics/Icons')
          inventory_icon = File.join(icon_dir, '홀리워크.png')
          buff_icon = File.join(icon_dir, '홀리워크버프.png')

          mapping = replace_hash(
            mapping, 'Graphics/Icons/홀리워크.png?h=', inventory_icon
          )

          anchor = mapping.lines.find do |line|
            line.start_with?('["graphics/icons/홀리워크", ')
          end
          check(anchor && anchor.end_with?(",\n"),
                'Existing Holy Walk icon mapping missing')
          check(!mapping.include?('"graphics/icons/홀리워크버프"'),
                'Duplicate Holy Walk buff mapping')

          new_line = '["graphics/icons/홀리워크버프", ' \
            '"Graphics/Icons/홀리워크버프.png?h=' \
            "#{Digest::MD5.file(buff_icon).hexdigest}\"],\n"

          mapping = mapping.sub(anchor, anchor + new_line)
          File.binwrite(mapping_path, mapping)

          # Version/cache markers only.
          knight_index = File.join(KNIGHT, 'index.html')
          html = File.binread(knight_index).force_encoding('UTF-8')
          check(html.include?('V1.24') && html.include?('v1.24'),
                'V1.24 knight HTML missing')
          File.binwrite(
            knight_index, html.gsub('V1.24','V1.25').gsub('v1.24','v1.25')
          )

          root_index = File.join(ROOT, 'index.html')
          root_html = File.binread(root_index).force_encoding('UTF-8')
          check(root_html.include?('V1.24'),
                'V1.24 launcher marker missing')
          File.binwrite(
            root_index, root_html.gsub('V1.24','V1.25')
          )

          loader = File.join(KNIGHT, 'js/sl-assets-v229r115.js')
          loader_text = File.binread(loader).force_encoding('UTF-8')
          old_version = "var version='V1.24';"
          check(loader_text.scan(old_version).length == 1,
                'V1.24 loader marker missing')
          File.binwrite(
            loader,
            loader_text.sub(old_version, "var version='V1.25';")
          )

          File.write(
            'build/v125_healer_maps.json',
            JSON.generate(healer_maps.uniq.sort),
            mode: 'w:UTF-8'
          )
          File.write(
            'build/v125_hit_keys.json',
            JSON.generate(keys),
            mode: 'w:UTF-8'
          )

          puts "PASS: #{healer_ids.length} healer EV across #{healer_maps.uniq.length} maps"
          puts "PASS: Baphomet graphic #{baphomet}, #{healer_graphics} visual pages"
          puts "PASS: #{cast_graphics} Black Elder graphic changes redirected"
          puts 'PASS: healer 12F/tile, existing player 5F image cadence reused'
          puts 'PASS: original healing, pursuit, teleport and cast timing preserved'
          puts 'PASS: Holy Walk inventory 622, buff 623 on existing slot 23'
          puts "PASS: #{keys.length} hit picture thumbnails removed"
          RUBY_V125

          ruby -c build/patch_v125.rb
          ruby build/patch_v125.rb site
          node --check site/knight/gameasync/bitmap-map.js
          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js

      - name: Verify scope and changed files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re, struct

          root = Path("site")
          before = json.loads(Path("build/before.json").read_text("utf8"))
          after = {
              str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob("*") if p.is_file()
          }

          added = set(after) - set(before)
          removed = set(before) - set(after)
          changed = {
              p for p in before if p in after and before[p] != after[p]
          }

          buff = "knight/gameasync/Graphics/Icons/홀리워크버프.png"
          assert added == {buff}, ("Unexpected added files", sorted(added))
          assert not removed, ("Unexpected deleted files", sorted(removed))

          maps = json.loads(Path("build/v125_healer_maps.json").read_text("utf8"))
          keys = json.loads(Path("build/v125_hit_keys.json").read_text("utf8"))
          assert len(maps) == 39 and len(set(maps)) == 39
          assert len(keys) == 95 and len(set(keys)) == 95

          pre = "knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO"
          allowed = {pre + f"Map{mid:03d}.rxdata" for mid in maps}
          allowed |= {
              "knight/gameasync/Data/Scripts.rxdata",
              "knight/gameasync/bitmap-map.js",
              "knight/gameasync/mapping.js",
              "knight/gameasync/Graphics/Icons/홀리워크.png",
              "knight/index.html",
              "knight/js/sl-assets-v229r115.js",
              "index.html",
          }
          assert changed == allowed, (
              "Unapproved modified files",
              sorted(changed ^ allowed)
          )
          assert len(before) == 5618 and len(after) == 5619

          bitmap = (root/"knight/gameasync/bitmap-map.js").read_text("utf8")
          remaining = set(re.findall(r'^"([^"]+)": \[', bitmap, re.M))
          assert not remaining.intersection(keys)

          icon_dir = root/"knight/gameasync/Graphics/Icons"
          for name, size, dims in [
              ("홀리워크.png", 2146, (32,32)),
              ("홀리워크버프.png", 2227, (38,37))
          ]:
              png = (icon_dir/name).read_bytes()
              assert len(png) == size
              assert struct.unpack(">II",png[16:24]) == dims

          mapping = (root/"knight/gameasync/mapping.js").read_text("utf8")
          assert mapping.count('"graphics/icons/홀리워크", ') == 1
          assert mapping.count('"graphics/icons/홀리워크버프", ') == 1

          for name in [
              "홀리워크.png",
              "홀리워크버프.png",
          ]:
              file = icon_dir/name
              token = f"Graphics/Icons/{name}?h="
              assert mapping.count(token+hashlib.md5(file.read_bytes()).hexdigest()) == 1

          for mid in maps:
              file = root/(pre+f"Map{mid:03d}.rxdata")
              token = "Data/"+file.name+"?h="
              assert mapping.count(token+hashlib.md5(file.read_bytes()).hexdigest()) == 1

          scripts = root/"knight/gameasync/Data/Scripts.rxdata"
          token = "Data/Scripts.rxdata?h="
          assert mapping.count(token+hashlib.md5(scripts.read_bytes()).hexdigest()) == 1

          html = (root/"knight/index.html").read_text("utf8")
          assert "SLKnight V1.25" in html
          assert "bitmap-map.js?v=v1.25" in html
          assert "var version='V1.25';" in (
              root/"knight/js/sl-assets-v229r115.js"
          ).read_text("utf8")

          assert not (root/(pre+"Map043.rxdata")).exists()
          assert not (root/(pre+"Map044.rxdata")).exists()

          print("PASS: 39 healer EV, 95 hit images, icons 622/623")
          print("PASS: exact changed-file whitelist; no other game files modified")
          print("PASS: V1.24 monster speeds and removed maps retained")
          print("PASS: V1.25 cache/version and mapping hashes")
          PY

      - name: Publish V1.25 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
