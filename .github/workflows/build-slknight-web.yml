name: build-slknight-web.yml | V4.14 | Companion Separation and Ground Alignment

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Restore V4.14 central deletion baseline
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 46010973927
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify original game
        shell: bash
        run: |
          set -euo pipefail

          test -s baseline/artifact.tar

          mkdir -p site
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          import json

          root=Path('site')

          before={
              p.relative_to(root).as_posix():
                  hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          assert len(before)==6085

          script=root/'knight/gameasync/Data/Scripts.rxdata'

          assert hashlib.md5(
              script.read_bytes()
          ).hexdigest()=='de673e8cb737ab69af0213814bc5f9fc'

          image=root/'knight/gameasync/Graphics/Pictures/게이지(저사양)-상.png'

          assert hashlib.md5(
              image.read_bytes()
          ).hexdigest()=='c223b7d1cbe4e66dd84a70fd2786fc95'

          assert before[
              'knight/assets/shared-v229r115.pack'
          ].startswith('a235eb3ce5c38daa')

          assert before[
              'knight/gameasync/bitmap-map.js'
          ].startswith('738666fb2e2f514a')

          assert (
              root/'knight/js/sl-assets-v229r115.js'
          ).read_text('utf8').count(
              "var version='V4.14';"
          )==1

          Path('/tmp/sl414-before.json').write_text(
              json.dumps(before),
              'utf8'
          )

          print('PASS exact V4.14 baseline')
          PYTHON

      - name: Remove original lower HUD drawing
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sl414-direct-clear.rb <<'RUBY'
          # encoding: UTF-8
          require 'zlib'
          require 'digest'

          path=ARGV.fetch(0)
          raw=File.binread(path)

          raise 'Baseline script digest' unless
            Digest::MD5.hexdigest(raw)==
            'de673e8cb737ab69af0213814bc5f9fc'

          rows=Marshal.load(raw)

          raise 'Script count' unless rows.size==137

          before=rows.map{|r|Marshal.dump(r)}

          expected={
            123=>'플레이어 체력 출력',
            124=>'버프,물약 이미지 출력',
            127=>'게이지'
          }

          expected.each do |i,name|

            raise "Name #{i}" unless
              rows[i][1].dup.force_encoding('UTF-8')==name

            src=Zlib::Inflate.inflate(
              rows[i][2]
            ).force_encoding('UTF-8')

            s=src.gsub("\r\n","\n")
            t=s.dup

            case i

            when 123

              a="    @spr5 = Sprite.new\n"

              raise 'EXP sprite' unless
                t.scan(a).size==1

              t=t.sub(a){
                a+"    @spr5.visible = false\n"
              }

            when 124

              ids=%w[
                Ak Sk Dk Fk Zk Qk
                ok tk ttk sk1
                hk5 hk6 hk7 hk8
              ]

              ids.each do |id|

                a=/^([ \t]*\$#{id} = Sprite\.new[ \t]*\n)/

                raise "Native hotkey #{id}" unless
                  t.scan(a).size==2

                t=t.gsub(a){|m|
                  m+"  $#{id}.visible = false\n"
                }

              end

              raise 'Hotkey count' unless
                t.scan(
                  /^  \$\w+\.visible = false$/
                ).size==28

              raise 'Upper buff changed' unless
                t.lines.grep(/\$Buf_/)==
                s.lines.grep(/\$Buf_/)

            when 127

              calls=[]

              walk=lambda do |n|

                if n.is_a?(
                  RubyVM::AbstractSyntaxTree::Node
                )

                  if [:CALL,:FCALL].include?(n.type)

                    method_name=
                      n.type==:CALL ?
                      n.children[1] :
                      n.children[0]

                    if [
                      :draw_text,
                      :draw_actor_parameter,
                      :draw_actor_level,
                      :draw_actor_hp,
                      :draw_actor_sp
                    ].include?(method_name)

                      raise 'Multiline drawing' unless
                        n.first_lineno==n.last_lineno

                      calls<<[
                        n.first_lineno,
                        method_name
                      ]

                    end

                  end

                  n.children.each{
                    |c|walk.call(c)
                  }

                end

              end

              walk.call(
                RubyVM::AbstractSyntaxTree.parse(s)
              )

              raise 'Native output counts' unless
                calls.group_by{
                  |x|x[1]
                }.transform_values(&:size)=={
                  draw_text:158,
                  draw_actor_level:1,
                  draw_actor_hp:5,
                  draw_actor_sp:5,
                  draw_actor_parameter:32
                }

              lines=s.lines

              targets=calls.select do |line,method_name|

                (
                  method_name==:draw_text &&
                  line<=653 &&
                  !(177..191).include?(line) &&
                  line!=464
                ) ||
                [
                  :draw_actor_parameter,
                  :draw_actor_level
                ].include?(method_name)

              end

              raise 'Lower draw count' unless
                targets.group_by{
                  |x|x[1]
                }.transform_values(&:size)=={
                  draw_text:122,
                  draw_actor_level:1,
                  draw_actor_parameter:32
                }

              base_method=Zlib::Inflate.inflate(
                rows[98][2]
              ).force_encoding('UTF-8')

              raise 'Original AC calculation' unless
                base_method.include?(
                  '$agi = actor.pdef * 0.8 unless actor.instance_variable_get(:@sl46_stats_ready)'
                )

              targets.each do |line,method_name|

                original=lines[line-1]

                case line

                when 409

                  raise 'AC call' unless
                    original.strip==
                    'draw_actor_parameter($game_party.actors[0], 8, 395, 1)'

                  lines[line-1]=
                    "    10 - $game_party.actors[0].pdef\n"+
                    "    $agi = $game_party.actors[0].pdef * 0.8 unless $game_party.actors[0].instance_variable_get(:@sl46_stats_ready)\n"

                when 479

                  raise 'MR call' unless
                    original.strip==
                    'draw_actor_parameter($game_party.actors[0], 70, 395, 2)'

                  lines[line-1]=
                    "    $game_party.actors[0].mdef\n"

                else

                  lines[line-1]=''

                end

              end

              t=lines.join

              a="    $var3 = Window_Help2.new\n"

              raise 'Map name window' unless
                t.scan(a).size==1

              t=t.sub(a){
                a+
                "    $var3.visible = false\n"+
                "    $var3.contents_opacity = 0\n"
              }

              pattern=/^\s*(?:\$DPS[12]|dps[12]|\$atk|\$atkp|\$atkRating|\$game_variables\[\d+\]|\$hungry_persent|\$id_y|\$s|\$sy)\s*(?:\*=|=)/

              raise 'Original calculations changed' unless
                t.lines.grep(pattern)==
                s.lines.grep(pattern)

              calls.clear

              walk.call(
                RubyVM::AbstractSyntaxTree.parse(t)
              )

              raise 'Remaining output count' unless
                calls.group_by{
                  |x|x[1]
                }.transform_values(&:size)=={
                  draw_text:36,
                  draw_actor_hp:5,
                  draw_actor_sp:5
                }

              raise 'Unsupported clear_rect' if
                t.include?('clear_rect')

            end

            RubyVM::InstructionSequence.compile(t)

            raise "No edit #{i}" if s==t

            t=t.gsub("\n","\r\n") if
              src.include?("\r\n")

            rows[i][2]=Zlib::Deflate.deflate(t.b)

          end

          raise 'Unexpected script changes' unless
            rows.each_index.select{
              |i|Marshal.dump(rows[i])!=before[i]
            }==expected.keys

          File.binwrite(
            path,
            Marshal.dump(rows)
          )

          raise 'Roundtrip' unless
            Marshal.load(
              File.binread(path)
            )==rows

          puts 'PASS 155 lower drawing calls removed'
          puts 'PASS 46 upper drawing calls preserved'
          puts 'PASS original AC and MR calculations preserved'
          puts 'PASS original evasion calculation preserved'
          puts 'PASS original DPS calculation preserved'
          puts 'PASS 3 scripts changed'
          puts 'PASS 134 scripts unchanged'
          puts 'PASS no clear_rect call'
          puts Digest::MD5.file(path).hexdigest
          RUBY

          ruby -c /tmp/sl414-direct-clear.rb

          ruby /tmp/sl414-direct-clear.rb \
            site/knight/gameasync/Data/Scripts.rxdata

      - name: Remove entire original HUD background
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv \
            --system-site-packages /tmp/sl414-venv

          /tmp/sl414-venv/bin/python -c "import PIL" || \
            /tmp/sl414-venv/bin/python -m pip install \
              --quiet --disable-pip-version-check \
              'Pillow>=11,<13'

          /tmp/sl414-venv/bin/python - <<'PYTHON'
          from pathlib import Path
          from PIL import Image
          import hashlib
          import json
          import struct
          import base64
          import io
          import re

          root=Path('site')
          game=root/'knight/gameasync'

          name='게이지(저사양)-상'
          key='graphics/pictures/'+name
          rel='Graphics/Pictures/'+name+'.png'

          graphic=game/rel

          original=graphic.read_bytes()

          old_digest=hashlib.md5(
              original
          ).hexdigest()

          assert old_digest=='c223b7d1cbe4e66dd84a70fd2786fc95'

          im=Image.open(
              io.BytesIO(original)
          ).convert('RGBA')

          assert im.size==(800,600)

          im=Image.new(
              'RGBA',
              im.size,
              (0,0,0,0)
          )

          assert im.getbbox() is None

          buffer=io.BytesIO()

          im.save(
              buffer,
              format='PNG'
          )

          corrected=buffer.getvalue()

          graphic.write_bytes(corrected)

          new_digest=hashlib.md5(
              corrected
          ).hexdigest()

          assert new_digest!=old_digest

          packs=sorted(
              (root/'knight/assets').glob('*.pack')
          )

          assert len(packs)==50

          targets=[]

          for p in packs:

              with p.open('rb') as f:

                  header=f.read(4)

                  assert len(header)==4

                  length=struct.unpack(
                      '<I',
                      header
                  )[0]

                  assert 0<length<p.stat().st_size-4

                  info=json.loads(
                      f.read(length).decode('utf8')
                  )

                  for row in info['files']:

                      if row[0]==key:
                          targets.append(p)

          pack=root/'knight/assets/shared-v229r115.pack'

          assert targets==[pack],targets

          old_pack=pack.read_bytes()

          assert hashlib.sha256(
              old_pack
          ).hexdigest().startswith(
              'a235eb3ce5c38daa'
          )

          header_size=struct.unpack_from(
              '<I',
              old_pack,
              0
          )[0]

          index=json.loads(
              old_pack[4:4+header_size].decode('utf8')
          )

          payload=old_pack[4+header_size:]

          assert index['kind']=='shared'

          old_rows=index['files']

          assert len(old_rows)==2292

          assert len({
              row[0] for row in old_rows
          })==2292

          offset=0

          for row in old_rows:

              assert len(row)==3
              assert row[1]==offset
              assert row[2]>0

              offset+=row[2]

          assert offset==len(payload)

          matches=[
              i for i,row in enumerate(old_rows)
              if row[0]==key
          ]

          assert len(matches)==1

          target=matches[0]

          _,start,size=old_rows[target]

          assert payload[start:start+size]==original

          delta=len(corrected)-size

          new_payload=(
              payload[:start]+
              corrected+
              payload[start+size:]
          )

          new_rows=[]

          for i,(k,o,n) in enumerate(old_rows):

              if i==target:

                  new_rows.append([
                      k,
                      o,
                      len(corrected)
                  ])

              elif i>target:

                  new_rows.append([
                      k,
                      o+delta,
                      n
                  ])

              else:

                  new_rows.append([
                      k,
                      o,
                      n
                  ])

          unchanged=0

          for i in range(len(old_rows)):

              k,o,n=old_rows[i]
              k2,o2,n2=new_rows[i]

              assert k==k2

              old_bytes=payload[o:o+n]

              new_bytes=new_payload[o2:o2+n2]

              if i==target:

                  assert new_bytes==corrected
                  assert new_bytes!=old_bytes

              else:

                  assert old_bytes==new_bytes

                  unchanged+=1

          assert unchanged==2291

          assert (
              new_rows[-1][1]+new_rows[-1][2]
              ==len(new_payload)
          )

          index['files']=new_rows

          new_header=json.dumps(
              index,
              ensure_ascii=False,
              separators=(',',':')
          ).encode('utf8')

          pack.write_bytes(
              struct.pack('<I',len(new_header))+
              new_header+
              new_payload
          )

          pack_digest=hashlib.sha256(
              pack.read_bytes()
          ).hexdigest()[:16]

          print('PASS entire original HUD image transparent')
          print('PASS all 50 resource packs checked')
          print('PASS 2291 other packed resources unchanged')

          mapper=game/'mapping.js'

          old_mapping_digest=hashlib.sha256(
              mapper.read_bytes()
          ).hexdigest()[:16]

          s=mapper.read_text('utf8')

          old_marker=rel+'?h='+old_digest

          assert s.count(old_marker)==1

          s=s.replace(
              old_marker,
              rel+'?h='+new_digest
          )

          old_script_digest='de673e8cb737ab69af0213814bc5f9fc'

          script=game/'Data/Scripts.rxdata'

          script_digest=hashlib.md5(
              script.read_bytes()
          ).hexdigest()

          assert script_digest!=old_script_digest

          old_marker=(
              'Data/Scripts.rxdata?h='+
              old_script_digest
          )

          assert s.count(old_marker)==1

          s=s.replace(
              old_marker,
              'Data/Scripts.rxdata?h='+script_digest
          )

          mapper.write_text(
              s,
              'utf8'
          )

          mapping_digest=hashlib.sha256(
              mapper.read_bytes()
          ).hexdigest()[:16]

          bitmap_map=game/'bitmap-map.js'

          old_bitmap_digest=hashlib.sha256(
              bitmap_map.read_bytes()
          ).hexdigest()[:16]

          assert old_bitmap_digest=='738666fb2e2f514a'

          s=bitmap_map.read_text('utf8')

          pattern=re.compile(
              r'("'+re.escape(key)+
              r'":\s*\[800,600,"data:image/png;base64,)'+
              r'([A-Za-z0-9+/=]+)("\])'
          )

          matches=list(
              pattern.finditer(s)
          )

          assert len(matches)==1

          match=matches[0]

          thumb=Image.open(
              io.BytesIO(
                  base64.b64decode(
                      match.group(2)
                  )
              )
          ).convert('RGBA')

          assert thumb.size==(64,48)

          thumb=Image.new(
              'RGBA',
              thumb.size,
              (0,0,0,0)
          )

          assert thumb.getbbox() is None

          buffer=io.BytesIO()

          thumb.save(
              buffer,
              format='PNG'
          )

          encoded=base64.b64encode(
              buffer.getvalue()
          ).decode('ascii')

          s=(
              s[:match.start(2)]+
              encoded+
              s[match.end(2):]
          )

          bitmap_map.write_text(
              s,
              'utf8'
          )

          bitmap_digest=hashlib.sha256(
              bitmap_map.read_bytes()
          ).hexdigest()[:16]

          loader=root/'knight/js/sl-assets-v229r115.js'

          old_loader_digest=hashlib.sha256(
              loader.read_bytes()
          ).hexdigest()[:16]

          s=loader.read_text('utf8')

          old_pack_url=(
              'shared-v229r115.pack?v=V4.14&h='
              'a235eb3ce5c38daa'
          )

          new_pack_url=(
              'shared-v229r115.pack?v=V4.14&h='
              +pack_digest
          )

          assert s.count(old_pack_url)==1

          s=s.replace(
              old_pack_url,
              new_pack_url
          )

          assert s.count(
              "var version='V4.14';"
          )==1

          loader.write_text(
              s,
              'utf8'
          )

          loader_digest=hashlib.sha256(
              loader.read_bytes()
          ).hexdigest()[:16]

          page=root/'knight/index.html'

          s=page.read_text('utf8')

          references=[
              (
                  'gameasync/mapping.js?v=v4.14&h=',
                  old_mapping_digest,
                  mapping_digest,
                  1
              ),
              (
                  'gameasync/bitmap-map.js?v=v4.14&h=',
                  old_bitmap_digest,
                  bitmap_digest,
                  2
              ),
              (
                  'js/sl-assets-v229r115.js?v=v4.14&h=',
                  old_loader_digest,
                  loader_digest,
                  1
              )
          ]

          for prefix,old,new,count in references:

              assert old!=new

              assert s.count(
                  prefix+old
              )==count,(
                  prefix,
                  s.count(prefix+old)
              )

              s=s.replace(
                  prefix+old,
                  prefix+new
              )

              assert s.count(
                  prefix+new
              )==count

          assert 'V4.14' in s

          page.write_text(
              s,
              'utf8'
          )

          assert Image.open(
              graphic
          ).convert('RGBA').getbbox() is None

          verify=pack.read_bytes()

          size=struct.unpack_from(
              '<I',
              verify,
              0
          )[0]

          verify_index=json.loads(
              verify[4:4+size].decode('utf8')
          )

          verify_payload=verify[4+size:]

          matches=[
              row for row in verify_index['files']
              if row[0]==key
          ]

          assert len(matches)==1

          _,o,n=matches[0]

          assert (
              verify_payload[o:o+n]
              ==graphic.read_bytes()
          )

          assert (
              'Data/Scripts.rxdata?h='+script_digest
              in mapper.read_text('utf8')
          )

          assert (
              rel+'?h='+new_digest
              in mapper.read_text('utf8')
          )

          assert (
              new_pack_url
              in loader.read_text('utf8')
          )

          print('PASS original HUD image removed')
          print('PASS packed HUD image removed')
          print('PASS HUD thumbnail removed')
          print('PASS current script cache',script_digest)
          print('PASS current image cache',new_digest)
          print('PASS current pack cache',pack_digest)
          print('PASS current bitmap cache',bitmap_digest)
          PYTHON

      - name: Verify exact removal scope
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          import json

          root=Path('site')

          before=json.loads(
              Path('/tmp/sl414-before.json').read_text('utf8')
          )

          after={
              p.relative_to(root).as_posix():
                  hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          assert set(before)==set(after)

          assert len(after)==6085

          changed={
              k for k in before
              if before[k]!=after[k]
          }

          expected={
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/Graphics/Pictures/게이지(저사양)-상.png',
              'knight/assets/shared-v229r115.pack',
              'knight/gameasync/mapping.js',
              'knight/gameasync/bitmap-map.js',
              'knight/js/sl-assets-v229r115.js',
              'knight/index.html'
          }

          assert changed==expected,changed^expected

          assert all(
              before[k]==after[k]
              for k in before
              if k not in expected
          )

          print('PASS exact seven changed files')
          print('PASS 6078 original files unchanged')
          print('PASS original engine unchanged')
          print('PASS original maps unchanged')
          print('PASS original mobile controls unchanged')
          PYTHON

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/gameasync/bitmap-map.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: Upload V4.14 candidate
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
