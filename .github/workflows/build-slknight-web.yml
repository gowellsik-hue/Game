            mob.refresh
            assert.call(mob.instance_variable_get(:@page)==ev.pages[1],"Real engine ATTACK PAGE not active #{mid}/#{id}")
            near+=1;gatetests+=1
            $game_player.x=-999;$game_player.y=-999
            mob.범위(10,gate,1)
            assert.call($game_switches[gate],"Aggro cleared after sight loss #{mid}/#{id}")
            mob.refresh
            assert.call(mob.instance_variable_get(:@page)==ev.pages[1],"Aggro attack page lost #{mid}/#{id}")
            # Closed wall edges must remain blocked even if an event route toggles through.
            around=[[1,0,6],[-1,0,4],[0,1,2],[0,-1,8]].find do |ex,ey,d|
             $game_map.valid?(x+ex,y+ey) && !SLTI_V229R44.allowed?(mid,x,y,d)
            end
            if around
             mob.through=true
             assert.call(!mob.passable?(x,y,around[2]),"Mob passed closed wall while through ON: #{mid}/#{id}")
             mob.through=false
             blocked+=1
            end
            total+=1
           end
           # Closed adjacent wall sites cannot acquire a new mob.
           raw.bytes.each_with_index do |bit,k|
            next unless bit!=0 && (k%7)==0
            x=k%w;y=k/w
            [[1,0,6],[-1,0,4],[0,1,2],[0,-1,1]].each do |dx,dy,d|
             nx=x+dx;ny=y+dy
             next unless $game_map.valid?(nx,ny) && raw.getbyte(ny*w+nx)!=0
             dir=dy==-1 ? 8 : d
             next if SLTI_V229R44.allowed?(mid,x,y,dir)
             assert.call(!SLTI_V229R49.first_sight?(mid,x,y,nx,ny,10),"Sees across closed wall #{mid} #{x} #{y}")
             wallmove+=1
            end
           end
           # Visual wall pieces all render above all actors, alpha only on actual wall overlaps.
           key=SLTI_V229R49::PARTS.keys.find{|key|key.start_with?(mid.to_s+':') && SLTI_V229R49::PARTS[key].size>=3}
           raise "No wall texture for #{mid}" if key.nil?
           _,cxx,cyy=key.split(':');cx=cxx.to_i;cy=cyy.to_i
           part=SLTI_V229R49::PARTS[key].first
           pid,bx0,by0,bx1,by1=part
           left=(pid%4)*256+bx0*2;top=(pid/4)*128+by0*2
           hero=Sprite.new;hero.bitmap=Bitmap.new('');hero.src_rect.set(0,0,32,64)
           hero.ox=16;hero.oy=52;hero.x=left+16;hero.y=top+32+hero.oy;hero.z=900
           $game_map.display_x=cx*1024*4;$game_map.display_y=cy*1024*4
           scene=Spriteset_Map.new
           scene.instance_variable_set(:@slti_chunks,{[cx,cy]=>Sprite.new})
           scene.instance_variable_set(:@character_sprites,[hero])
           scene.update
           item=scene.instance_variable_get(:@slti_r49_walls)[[cx,cy]]
           assert.call(item && !item[1].empty?,"Original wall sprite not produced #{mid}")
           assert.call(item[1].all?{|z|z[0].z==4096},"Wall behind characters #{mid}")
           assert.call(item[1].any?{|z|z[0].opacity==148},"Overlapped wall not faded #{mid}")
           assert.call(item[1].any?{|z|z[0].opacity==255},"All walls faded #{mid}")
           assert.call(hero.opacity==255,"Player opacity modified #{mid}")
           scene.dispose
           counts[mid]={'monsters'=>mobs.size,'real_page1_activations'=>gatetests,'wall_probe_count'=>wallmove}
           puts "PASS Map#{mid} #{mobs.size} near FIRST detections + actual page1 with switch23 OFF; native wall rays=#{wallmove}; all wall Z=4096 and only walls fade"
          end
          assert.call(total==105 && near==105,'All original monster tests required')
          assert.call(wallmove>=10,'Not enough blocked native wall probes')
          puts "PASS V229R49 total #{total}: 105 real monster idle->attack transitions, 89 original switch23 and 16 zombie variable+combat guards removed, no deaggro, wall foreground and guarded through mode"
          R49_EMBEDDED
          R49_SITE=site R49_BUILD=build ruby /tmp/r49_test.rb | tee build/r49-regression.txt
          test "$(grep -c "^PASS Map" build/r49-regression.txt)" -eq 2

      - name: V229R49 Update three asset hashes and verify only six game files changed
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r49_final.py <<'R49_EMBEDDED'
          from pathlib import Path
          import hashlib,json,re
          site=Path('site');reports=Path('build')
          mapper=site/'knight/gameasync/mapping.js'
          s=mapper.read_text('utf-8')
          pre='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          for relative in ('Data/Scripts.rxdata',f'Data/{pre}Map045.rxdata',f'Data/{pre}Map046.rxdata'):
              p=site/'knight/gameasync'/relative
              n=relative+'?h='
              s,count=re.subn(re.escape(n)+r'[0-9a-f]{32}',lambda _:n+hashlib.md5(p.read_bytes()).hexdigest(),s)
              assert count==1,(relative,count)
          mapper.write_text(s,'utf-8')
          for file in (site/'index.html',site/'knight/index.html'):
              txt=file.read_text('utf-8')
              assert 'V229R48' in txt,file
              file.write_text(txt.replace('V229R48','V229R49').replace('v229r48','v229r49'),'utf-8')
          before=json.loads((reports/'r49-baseline.json').read_text('utf-8'))
          after={str(f.relative_to(site)):hashlib.sha256(f.read_bytes()).hexdigest() for f in site.rglob('*') if f.is_file()}
          assert before.keys()==after.keys() and len(after)==5517
          changed={k for k in after if before[k]!=after[k]}
          pre='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          allowed={'index.html','knight/index.html','knight/gameasync/mapping.js',
                   'knight/gameasync/Data/Scripts.rxdata',pre+'Map045.rxdata',pre+'Map046.rxdata'}
          assert changed==allowed,('Files changed outside approved scope',changed^allowed)
          audit=json.loads((reports/'r49-events.json').read_text('utf-8'))
          assert [audit['45']['monster_count'],audit['46']['monster_count']]==[48,57]
          assert [audit['45']['disabled_stale_second_conditions'],audit['46']['disabled_stale_second_conditions']]==[48,57]
          smoke=(reports/'r49-regression.txt').read_text('utf-8')
          assert '105 real monster idle->attack transitions' in smoke
          assert 'all wall Z=4096 and only walls fade' in smoke
          assert 'no deaggro' in smoke
          result={'version':'V229R49','base':'Successful deployed V229R48 run 39717031708',
                  'changedFiles':sorted(changed),'unchangedOriginalWallAndFloorPNGs':True,
                  'monsters':106,'regularMonsterFirstAttackPageVerified':105,'boss':{'map':46,'eventID':13,'xy':[156,100]},
                  'removedGlobalSwitch23PageConditions':89,'removedZombieVariablePageConditions':16,
                  'rewiredZombieCombatSwitch23Checks':16,'nativeCollisionGraphChanged':False,
                  'regularMonsterThroughBypassBlocked':True,'wallsAlwaysInFront':True,
                  'onlyWallAlphaModifiedOnOverlap':True,'originalPlayerAlphaUnchanged':True,
                  'mobileLivePlayVerified':False}
          (reports/'r49-integrity.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print('PASS R49 final: 106 monsters intact, 105 real idle/attack activations, foreground wall textures unchanged, exactly 6 approved game files modified')
          R49_EMBEDDED
          python3 /tmp/r49_final.py
          node --check site/knight/gameasync/mapping.js

      - name: V229R49 Upload monster activation and wall renderer regression records
        uses: actions/upload-artifact@v4
        with:
          name: SLKnight-V229R49-105-Monsters-Foreground-Walls-Regression
          path: |
            build/r49-events.json
            build/r49-regression.txt
            build/r49-integrity.json
          retention-days: 30
          if-no-files-found: error

      - name: V229R49 Deploy verified original SLKnight to the same GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
