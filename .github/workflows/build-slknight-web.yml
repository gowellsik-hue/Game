# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V276.7
# BASE: successful V241, run 41293648580 (5603 files).
# SOURCE: ordinary Death Knight Map019 EV18, NOT colosseum Map016 EV8.
# TARGET: Tower of Insolence 2F, Map025 EV29.
# PAGES: retain all five original functional pages.
# COMBAT: preserve 217 native commands and 17 attack registrations.
# HP: original 52 -> literal 520, no multiplier.
# MOVE: 8 selected Sanctuary Walk frames, 4 directions, speed 2.
# ATTACK: 5 normal / 1 strong / 1 magic, 25 frames per attack.
# HIT: separate hit animation deferred.
# IDLE: separate idle animation deferred.
# DEATH: all 17 Sanctuary Death frames, 4 directions.
# CORPSE: 200 frames after death animation.
# RESPAWN: 4300 frames after corpse removal.
# REENTRY: revive queen if Map025 was exited during death state.
# REWARD: retain 245 original reward commands and approved queen drops.
# SAFETY: original Scripts.rxdata, Map016 and Map019 unchanged.
# GRAPHICS: only original Sanctuary queen sprites, no DK sprite copy.

name: build-slknight-web.yml | V276.7 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Restore verified original V241 site
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41293648580
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: Restore original Sanctuary V247 character sheets
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41382471524
          name: github-pages
          github-token: ${{ github.token }}
          path: sprite-baseline

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Prepare original assets and checksum inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          mkdir -p site build build/v247
          test -s baseline/artifact.tar
          test -s sprite-baseline/artifact.tar

          tar -xf baseline/artifact.tar -C site

          mkdir -p build/v247/knight/gameasync/Graphics/Characters

          for name in Walk Idle Attack AltAttack Spell Hit Death; do
            tar -xf sprite-baseline/artifact.tar -C build/v247 \
              "./knight/gameasync/Graphics/Characters/SLZenith${name}.png"
          done

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          root=Path('site')
          before={
            str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
            for p in root.rglob('*') if p.is_file()
          }

          assert len(before)==5603,('Expected V241',len(before))
          assert (root/'knight/gameasync/Data/Scripts.rxdata').is_file()
          assert (root/'knight/assets/map-047-v241.pack').is_file()
          assert not any('/SLDK2F' in s for s in before)

          Path('build/original_sha256.json').write_text(
            json.dumps(before),encoding='utf-8'
          )

          print('PASS V241 baseline 5603 original files')
          PY

      - name: Create native Sanctuary queen graphics
        shell: bash
        run: |
          set -euo pipefail

          cat > build/build_art.py <<'QUEEN_ART'
          from pathlib import Path
          from PIL import Image
          import hashlib,json,os

          SRC=Path(os.environ.get(
            'ZQ_SOURCE_SHEETS',
            'build/v247/knight/gameasync/Graphics/Characters'
          ))
          DST=Path(os.environ.get(
            'ZQ_REVIEW_DIR','build/zq_review'
          ))/'Graphics'

          (DST/'Animations').mkdir(parents=True,exist_ok=True)
          (DST/'Characters').mkdir(parents=True,exist_ok=True)

          EXPECTED={
            'Walk':(
              '2a2ba621711dd02d754a7e5cd56954e4045c8609e9781e72a914bf5cec231cb4',12
            ),
            'Idle':(
              'dc5d453681ba72f148bc5341d847c6baa007d448d223162a6fe857feffb1a4d0',11
            ),
            'Attack':(
              '34fc818726622d37e5d93d31a805738ef283f87eef3d33ec46cd772fee15a425',13
            ),
            'AltAttack':(
              'ee7664745495d2de0fa7ab7e132cbcedc525a3aa7c4537776b51927968a4dd90',14
            ),
            'Spell':(
              'ffe2ae5755e7c3ed4a25cd70fa84afdff78069c5052ab6f20939d7c9849b2749',14
            ),
            'Hit':(
              '9c2eaa2eb3f22a60266a4a8e0f6793a97592ce35b847d0469e2ee32190fa40e4',2
            ),
            'Death':(
              'e5e59ced0d42ccf0f1e99ffa7bb8b3f7f4e1c80f3d880c0875d122c039ec009c',17
            )
          }

          sheets={}

          for key,(sha,n) in EXPECTED.items():
            p=SRC/('SLZenith'+key+'.png')

            assert p.exists(),key
            assert hashlib.sha256(p.read_bytes()).hexdigest()==sha,key

            im=Image.open(p).convert('RGBA')

            assert im.width%n==0,(key,im.width,n)
            assert im.height%4==0,(key,im.height)

            sheets[key]=(im,im.width//n,im.height//4,n)

          CW=max(v[1] for v in sheets.values())
          CH=max(v[2] for v in sheets.values())

          assert (CW,CH)==(168,144),(CW,CH)

          def crop(bank,d,i):
            im,w,h,n=sheets[bank]
            assert 0<=d<4
            assert 0<=i<n
            return im.crop((
              i*w,d*h,(i+1)*w,(d+1)*h
            ))

          def stamp(canvas,cell,box,destx,desty,foot=False):
            bw,bh=box
            offsetx=(bw-cell.width)//2
            offsety=(
              bh-cell.height if foot
              else (bh-cell.height)//2
            )
            canvas.alpha_composite(
              cell,(destx+offsetx,desty+offsety)
            )

          # Walking: 8 frames, 4 directions.
          WALK_FRAMES=[0,2,3,4,6,8,10,11]

          walk=Image.new('RGBA',(CW*8,CH*4))

          for d in range(4):
            for j,i in enumerate(WALK_FRAMES):
              stamp(
                walk,
                crop('Walk',d,i),
                (CW,CH),
                j*CW,d*CH,
                foot=True
              )

          walk.save(
            DST/'Characters'/'SLZQWalk.png',
            optimize=True
          )

          # Corpse character: original Death frame 16 is pattern 3.
          death_charset=Image.new('RGBA',(CW*4,CH*4))

          for d in range(4):
            for j,i in enumerate([0,4,8,16]):
              stamp(
                death_charset,
                crop('Death',d,i),
                (CW,CH),
                j*CW,d*CH,
                foot=True
              )

          death_charset.save(
            DST/'Characters'/'SLZQDeath.png',
            optimize=True
          )

          # Blank graphics during separate native death animation.
          blank=Image.new('RGBA',(CW*4,CH*4))
          blank.save(
            DST/'Characters'/'SLZQBlank.png',
            optimize=True
          )

          assets={}

          FRAME_BANKS={
            'normal':(
              [('Idle',i) for i in range(11)]
              +[('Attack',i) for i in range(13)]
              +[('Attack',12)]
            ),
            'strong':(
              [('Idle',i) for i in range(11)]
              +[('AltAttack',i) for i in range(14)]
            ),
            'magic':(
              [('Idle',i) for i in range(11)]
              +[('Spell',i) for i in range(14)]
            ),
            'death':[
              ('Death',i) for i in range(17)
            ]
          }

          for kind,frames in FRAME_BANKS.items():
            expected=17 if kind=='death' else 25
            assert len(frames)==expected,(kind,len(frames))

            for di,dir_id in enumerate((2,4,6,8)):
              name=f'SLZQ_{kind}_D{dir_id}'
              atlas=Image.new('RGBA',(960,960))

              for i,(bank,j) in enumerate(frames):
                stamp(
                  atlas,
                  crop(bank,di,j),
                  (192,192),
                  (i%5)*192,
                  (i//5)*192
                )

              atlas.save(
                DST/'Animations'/f'{name}.png',
                optimize=True
              )

              assets[name]={
                'frames':len(frames),
                'dir':dir_id,
                'kind':kind
              }

          assert len(assets)==16

          (DST/'manifest.json').write_text(
            json.dumps(assets,ensure_ascii=False,indent=2),
            encoding='utf-8'
          )

          print('PASS Sanctuary queen 8-frame walk')
          print('PASS 12 attack and 4 death native animations')
          print('PASS 17 original death frames, 4 directions')
          print('PASS no independent hit or idle animation')
          QUEEN_ART

          ZQ_SOURCE_SHEETS=build/v247/knight/gameasync/Graphics/Characters \
            ZQ_REVIEW_DIR=build/zq_review python3 build/build_art.py

      - name: Build queen from original Death Knight event
        shell: bash
        run: |
          set -euo pipefail

          cat > build/clone_queen.rb <<'QUEEN_NATIVE'
          # encoding: UTF-8

          require 'zlib'
          require 'digest'
          require 'fileutils'
          require 'json'

          module RPG
            class Map;end
            class Event
              class Page
                class Condition;end
                class Graphic;end
              end
            end
            class EventCommand;end
            class CommonEvent;end
            class AudioFile;end
            class MoveRoute;end
            class MoveCommand;end
            class Animation
              class Frame;end
              class Timing;end
            end
            class Tileset;end
          end

          class Table
            def self._load(bytes)
              x=allocate
              x.instance_variable_set(:@raw,bytes)
              x
            end
            def _dump(level=0)
              @raw
            end
          end

          class Tone
            def self._load(bytes)
              x=allocate
              x.instance_variable_set(:@raw,bytes)
              x
            end
            def _dump(level=0)
              @raw
            end
          end

          class Color<Tone;end

          def iv(o,k)
            o.instance_variable_get('@'+k.to_s)
          end

          def put(o,k,v)
            o.instance_variable_set('@'+k.to_s,v)
          end

          def clone(o)
            Marshal.load(Marshal.dump(o))
          end

          def ck(v,msg)
            raise(msg) unless v
          end

          def txt(v)
            v.to_s.dup.force_encoding('UTF-8').scrub
          end

          def ec(code,parameters=[],indent=0)
            c=RPG::EventCommand.allocate
            put(c,:code,code)
            put(c,:parameters,parameters)
            put(c,:indent,indent)
            c
          end

          def new_ce(src,id,name,list,trigger=0,switch=1)
            ce=RPG::CommonEvent.allocate

            src.instance_variables.each do |field|
              next if [
                :@id,:@name,:@list,:@trigger,:@switch_id
              ].include?(field)

              ce.instance_variable_set(
                field,
                clone(src.instance_variable_get(field))
              )
            end

            put(ce,:id,id)
            put(ce,:name,name)
            put(ce,:list,list)
            put(ce,:trigger,trigger)
            put(ce,:switch_id,switch)

            ce
          end

          def new_page(src,image,pattern=0)
            p=RPG::Event::Page.allocate

            src.instance_variables.each do |field|
              next if [:@graphic,:@list].include?(field)

              p.instance_variable_set(
                field,
                clone(src.instance_variable_get(field))
              )
            end

            graphic=RPG::Event::Page::Graphic.allocate
            g=iv(src,:graphic)

            g.instance_variables.each do |field|
              next if [
                :@character_name,:@pattern
              ].include?(field)

              graphic.instance_variable_set(
                field,
                clone(g.instance_variable_get(field))
              )
            end

            put(graphic,:character_name,image)
            put(graphic,:pattern,pattern)
            put(p,:graphic,graphic)

            p
          end

          GAME_ROOT=ENV.fetch(
            'ZQ_GAME_ROOT','site/knight/gameasync'
          )
          REVIEW_ROOT=ENV.fetch(
            'ZQ_REVIEW_DIR','build/zq_review'
          )

          ROOT=GAME_ROOT+'/Data/'
          PRE='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          MAP19=ROOT+PRE+'Map019.rxdata'
          MAP25=ROOT+PRE+'Map025.rxdata'
          COMMON=ROOT+PRE+'CommonEvents.rxdata'
          ANIMATIONS=ROOT+PRE+'Animations.rxdata'
          SCRIPTS=ROOT+'Scripts.rxdata'

          paths=[MAP19,MAP25,COMMON,ANIMATIONS,SCRIPTS]

          before=paths.map do |p|
            [p,Digest::SHA256.file(p).hexdigest]
          end.to_h

          map19=Marshal.load(File.binread(MAP19))
          map25=Marshal.load(File.binread(MAP25))
          common=Marshal.load(File.binread(COMMON))
          anims=Marshal.load(File.binread(ANIMATIONS))

          source=iv(map19,:events).fetch(18)
          native=iv(source,:pages)

          ck(
            txt(iv(source,:name)).include?('데스나이트'),
            'Wrong ordinary DK source'
          )

          ck(native.length==5,'Ordinary DK must have 5 pages')

          ck(
            native.map{|p|iv(p,:list).length}==
            [22,1,217,2,11],
            'Original DK page command counts changed'
          )

          ck(
            iv(native[3],:list)[0].
              instance_variable_get(:@parameters)==[691],
            'Original DK reward event missing'
          )

          ck(
            iv(native[4],:list).
              select{|c|iv(c,:code)==106}.
              map{|c|iv(c,:parameters)}==[[200],[4300]],
            'Original 200 and 4300 waits changed'
          )

          ck(common.length==1061,'Wrong original CE count')
          ck(anims.length==908,'Wrong original animation count')
          ck(!iv(map25,:events).key?(29),'EV29 already exists')

          HP=4988
          MAX_HP=520

          ATTACK=5991
          MAGIC=5992
          SPAWN=5994
          AGGRO=5995

          SPAWN_ROLL=5986
          ATTACK_ROLL=5987

          CE={
            hellfire:1061,
            hit:1062,
            gold:1063,
            cycle:1064,
            reward:1065,
            damage:1066,
            death_fx:1067
          }.freeze

          DIRS=[2,4,6,8].freeze

          # Runtime installer is embedded in the queen's
          # own event. Original Scripts.rxdata stays unchanged.
          ZENITH_RUNTIME=<<'ZQ_RUNTIME'
          class Sprite_Character
            unless method_defined?(:slzq_v2767_original_update)
              alias_method :slzq_v2767_original_update, :update

              def update
                slzq_v2767_original_update

                c=@character

                return unless c
                return unless c.is_a?(Game_Event)
                return unless $game_map.map_id==25
                return unless c.id==29

                # Sanctuary Walk: 8 frames x 4 directions.
                if c.character_name=="SLZQWalk" &&
                   @tile_id.to_i==0 &&
                   self.bitmap

                  w=self.bitmap.width/8
                  h=self.bitmap.height/4
                  dir=c.direction

                  if w>0 && h>0 && [2,4,6,8].include?(dir)
                    frame=0

                    attacking=(
                      c.respond_to?(:sl_attack_active?) &&
                      c.sl_attack_active?
                    )

                    if c.moving? && !attacking
                      rx=c.instance_variable_get(:@real_x)
                      ry=c.instance_variable_get(:@real_y)

                      if rx && ry
                        remaining=(
                          (c.x*128-rx).abs+
                          (c.y*128-ry).abs
                        )

                        progress=128-remaining
                        progress=0 if progress<0
                        progress=127 if progress>127

                        frame=progress/16
                      end
                    end

                    frame=0 if frame<0
                    frame=7 if frame>7

                    row=(dir-2)/2

                    self.src_rect.set(
                      frame*w,row*h,w,h
                    )

                    self.ox=w/2
                    self.oy=h
                    self.z=c.screen_z(h)
                  end
                end

                # Only the queen's 25-frame attacks advance
                # at one animation frame per Graphics tick.
                # Native death remains two ticks per frame.
                if c.respond_to?(:sl_attack_active?) &&
                   c.sl_attack_active? &&
                   @_animation &&
                   @_animation_duration.to_i>1

                  n=@_animation.animation_name.to_s

                  if /\ASLZQ_(normal|strong|magic)_D[2468]\z/ =~ n
                    @_animation_duration-=1

                    if @_animation_duration>0
                      update_animation
                    end
                  end
                end
              end
            end
          end
          ZQ_RUNTIME

          # Original passability and neighboring-event checks.
          tilesets=Marshal.load(
            File.binread(ROOT+PRE+'Tilesets.rxdata')
          )

          tileset=tilesets.fetch(iv(map25,:tileset_id))

          def table_info(t)
            bytes=iv(t,:raw)
            dim,x,y,z=bytes.unpack('V4')

            ck((1..3).include?(dim),'Invalid Table dimension')

            [
              x,y,z,
              bytes.byteslice(16,bytes.bytesize-16).unpack('s<*')
            ]
          end

          mw,mh,mz,mvals=table_info(iv(map25,:data))
          pw,ph,pz,pvals=table_info(iv(tileset,:passages))
          qw,qh,qz,qvals=table_info(iv(tileset,:priorities))

          ck(
            [mw,mh]==[
              iv(map25,:width),
              iv(map25,:height)
            ],
            'Map dimensions changed'
          )

          def tab3(data,xsize,ysize,x,y,z)
            data[x+y*xsize+z*xsize*ysize]
          end

          def passable_tile?(x,y,dir,mw,mh,mvals,pvals,qvals)
            return false if x<1 || y<1
            return false if x>=mw-1 || y>=mh-1

            bit=(1 << (dir/2-1)) & 15

            (2).downto(0) do |z|
              tile=tab3(mvals,mw,mh,x,y,z)

              return false if tile.nil?
              return false if pvals[tile].nil?
              return false if qvals[tile].nil?
              return false if pvals[tile]&bit!=0
              return false if pvals[tile]&15==15

              return true if qvals[tile]==0
            end

            true
          end

          occupied=iv(map25,:events).values.map do |e|
            [iv(e,:x),iv(e,:y)]
          end

          ref=iv(map25,:events).fetch(11)
          sx=iv(ref,:x)
          sy=iv(ref,:y)

          candidates=[]

          (1..12).each do |radius|
            (-radius..radius).each do |dy|
              (-radius..radius).each do |dx|
                next unless [dx.abs,dy.abs].max==radius

                x=sx+dx
                y=sy+dy

                next if occupied.include?([x,y])

                next unless DIRS.any? do |dir|
                  nx=x+(dir==6 ? 1 : dir==4 ? -1 : 0)
                  ny=y+(dir==2 ? 1 : dir==8 ? -1 : 0)

                  passable_tile?(
                    x,y,dir,mw,mh,mvals,pvals,qvals
                  ) &&
                  passable_tile?(
                    nx,ny,10-dir,mw,mh,mvals,pvals,qvals
                  )
                end

                candidates<<[x,y]
              end
            end
          end

          spawn=[]

          candidates.each do |xy|
            next unless spawn.all?{|old|
              (xy[0]-old[0]).abs+
              (xy[1]-old[1]).abs>=4
            }

            spawn<<xy
            break if spawn.size==3
          end

          ck(spawn.size==3,'No three passable spawn points')

          # --------------------------------------------------
          # Page 0: original 22 commands plus one runtime install.
          # All 22 original commands remain in original order.
          # --------------------------------------------------
          p0=new_page(native[0],'SLZQWalk')
          put(p0,:move_speed,2)

          list0=iv(native[0],:list).each_with_index.map do |src,i|
            code=iv(src,:code)
            p=clone(iv(src,:parameters))
            ind=iv(src,:indent)

            if code==122 && p[0]==259 && p[1]==259
              p[0]=SPAWN_ROLL
              p[1]=SPAWN_ROLL

            elsif code==111 && p[0]==1 && p[1]==259
              p[1]=SPAWN_ROLL

            elsif code==202 && [3,7,11].include?(i)
              k={3=>0,7=>1,11=>2}.fetch(i)
              p=[0,0,*spawn[k],0]

            elsif code==121 && p==[163,163,0]
              p=[SPAWN,SPAWN,0]
            end

            ec(code,p,ind)
          end

          ck(list0.size==22,'Native spawn list changed')

          list0.unshift(
            ec(355,[ZENITH_RUNTIME])
          )

          put(p0,:list,list0)

          ck(list0.size==23,'Runtime install missing')

          ck(
            list0.drop(1).each_with_index.all?{|c,i|
              [
                iv(c,:code),
                iv(c,:indent)
              ]==[
                iv(iv(native[0],:list)[i],:code),
                iv(iv(native[0],:list)[i],:indent)
              ]
            },
            'Original 22 spawn command structure changed'
          )

          # --------------------------------------------------
          # Page 1: original range detection and movement.
          # --------------------------------------------------
          p1=new_page(native[1],'SLZQWalk')
          put(p1,:move_speed,2)

          put(iv(p1,:condition),:switch1_id,SPAWN)

          route=iv(p1,:move_route)
          cmds=iv(route,:list)

          ck(
            cmds.map{|c|iv(c,:code)}==[9,45,0],
            'Original detection route changed'
          )

          ck(
            txt(iv(cmds[1],:parameters)[0])==
            '범위(10,728,1)',
            'Original detection range changed'
          )

          put(
            cmds[1],
            :parameters,
            ["범위(10,#{AGGRO},1)"]
          )

          put(
            p1,:list,
            iv(native[1],:list).map{|c|clone(c)}
          )

          # --------------------------------------------------
          # Page 2: original 217 combat commands.
          # --------------------------------------------------
          p2=new_page(native[2],'SLZQWalk')
          put(p2,:move_speed,2)
          put(iv(p2,:condition),:switch1_id,AGGRO)

          reg=0

          list2=iv(native[2],:list).map do |src|
            code=iv(src,:code)
            p=clone(iv(src,:parameters))
            ind=iv(src,:indent)

            if code==355 &&
               p[0].is_a?(String) &&
               p[0].b.include?(
                 'SLMonsterAttackContext.register('.b
               )

              ck(
                txt(p[0])==
                'SLMonsterAttackContext.register(133,$game_map.map_id,18) unless $game_switches[133]',
                'Original attack registration changed'
              )

              p=[
                "SLMonsterAttackContext.register("+
                "#{ATTACK},$game_map.map_id,29) "+
                "unless $game_switches[#{ATTACK}]"
              ]

              reg+=1

            elsif code==355 &&
                  p[0].is_a?(String) &&
                  p[0].b.include?('drawMHP'.b)

              # Literal HP 520, not 52 multiplied.
              p=[
                '$m.drawMHP("제니스 퀸",$game_variables[4988],520,2)'
              ]

            elsif code==122 &&
                  p[0]==276 &&
                  p[1]==276

              p[0]=HP
              p[1]=HP

            elsif code==111 &&
                  p[0]==1 &&
                  p[1]==276

              p[1]=HP

            elsif code==121 &&
                  p[0]==p[1] &&
                  p[0]==133

              p[0]=ATTACK
              p[1]=ATTACK
            end

            ec(code,p,ind)
          end

          ck(reg==17,'Original attack registrations lost')
