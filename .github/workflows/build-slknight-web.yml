
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V231
# BASE: Successful V229R157 GitHub Pages artifact, run 41171116883.
# FIX: V230 failed because RPG::AudioFile was undefined during Marshal.load.
# FIX: Register the original RPG map/event classes before reading Map047.
# SCOPE: Original Sanctuary S32 Layer5 opacity behavior on Map047.
#
# BEFORE:
# - Map047 displays flattened Panorama graphics.
# - Original Layer5 opacity cells are not used for the player.
#
# AFTER:
# - Read original S32 Layer4 and Layer5 records.
# - Project Layer5 positions onto Map047.
# - Fade player to at most 150 opacity behind native objects.
# - Restore original player opacity outside those positions.
#
# PRESERVE:
# - Original Map047 art and 384/385 collision data.
# - Four-direction movement and all existing game scripts.
# - All seven NPCs including Pandora.
# - Map047 97-image preload.
# - Other maps, monsters, items, saves and controls.
# - Map045 and Map046 remain deleted.
#
# APPLICATION: Not applied. GitHub build verification pending.

name: build-slknight-web.yml | V231 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-slknight-web.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: V231 Download verified V229R157 game
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 41171116883
          name: github-pages
          github-token: ${{ github.token }}
          path: baseline

      - name: V231 Verify and preserve original game
        shell: bash
        run: |
          set -euo pipefail

          test -s baseline/artifact.tar
          mkdir -p site build original
          tar -xf baseline/artifact.tar -C site

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path('site')

          before = {
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          prefix = (
              'knight/gameasync/Data/'
              'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          )

          if len(before) != 5504:
              raise ValueError('Unexpected original file count')

          index = (root / 'knight/index.html').read_text('utf8')

          if 'V229R157' not in index:
              raise ValueError('Wrong baseline version')

          for map_id in (45, 46):
              name = prefix + f'Map{map_id:03d}.rxdata'
              if name in before:
                  raise ValueError('Deleted dungeon returned')

          if prefix + 'Map047.rxdata' not in before:
              raise ValueError('Original Map047 missing')

          panorama = (
              'knight/gameasync/Graphics/Panoramas/'
              'SLTI_47_C7_4.png'
          )

          expected = (
              'd1f321ba3012e9422e909b2ba4865dfc'
              'faf188cb0671c459597f935537a26991'
          )

          if before[panorama] != expected:
              raise ValueError('Original Panorama changed')

          preload = 'knight/assets/map-047-v229r151.pack'

          if preload not in before:
              raise ValueError('Map047 preload missing')

          Path('build/before.json').write_text(
              json.dumps(before, sort_keys=True),
              encoding='utf8'
          )

          print('PASS V229R157 original game')
          print('PASS Map047 original Panorama')
          print('PASS Map045/046 remain absent')
          print('PASS Map047 preload present')
          PY

      - name: V231 Download original Sanctuary S32 archive index
        shell: bash
        run: |
          set -euo pipefail

          gh release download v1.0.0 \
            -R gowellsik-hue/Game \
            -p 'Sanctuary.of.Aden.-.Copy.zip' \
            -D original \
            --clobber

          test -s original/Sanctuary.of.Aden.-.Copy.zip

      - name: V231 Extract native Layer4 and Layer5 positions
        shell: bash
        run: |
          set -euo pipefail

          cat > build/read-layer5.py <<'PY'
          from pathlib import Path
          from collections import Counter
          import functools
          import json
          import re
          import struct
          import subprocess
          import zlib

          ROOT = Path('original')
          STEM = 'Sanctuary.of.Aden.-.Copy'
          ZIP_TAIL = ROOT / (STEM + '.zip')

          raw_index = ZIP_TAIL.read_bytes()

          entries = []
          pos = 0

          while True:
              pos = raw_index.find(b'PK\x01\x02', pos)

              if pos < 0 or pos + 46 > len(raw_index):
                  break

              header = struct.unpack_from(
                  '<IHHHHHHIIIHHHHHII',
                  raw_index,
                  pos
              )

              name_len = header[10]
              extra_len = header[11]
              comment_len = header[12]

              end = (
                  pos + 46 +
                  name_len +
                  extra_len +
                  comment_len
              )

              if name_len < 1 or name_len > 1024:
                  pos += 4
                  continue

              if end > len(raw_index):
                  pos += 4
                  continue

              name_bytes = raw_index[
                  pos + 46:
                  pos + 46 + name_len
              ]

              encoding = (
                  'utf8' if header[3] & 0x800
                  else 'cp949'
              )

              name = name_bytes.decode(
                  encoding,
                  errors='replace'
              ).replace('\\', '/')

              if re.search(
                  r'(?:^|/)map/0/[0-9a-f]{8}\.s32$',
                  name,
                  re.IGNORECASE
              ):
                  entries.append({
                      'name': name,
                      'method': header[4],
                      'crc': header[7],
                      'compressed': header[8],
                      'size': header[9],
                      'disk': header[13],
                      'offset': header[16]
                  })

              pos = end

          if len(entries) < 32:
              raise ValueError(
                  'Insufficient original Map0 S32 files: '
                  + str(len(entries))
              )

          @functools.lru_cache(maxsize=4)
          def read_volume(disk):
              if disk < 0 or disk > 45:
                  raise ValueError('Invalid archive disk')

              if disk < 45:
                  filename = STEM + '.z%02d' % (disk + 1)
              else:
                  filename = STEM + '.zip'

              target = ROOT / filename

              if not target.is_file():
                  subprocess.run([
                      'gh',
                      'release',
                      'download',
                      'v1.0.0',
                      '-R',
                      'gowellsik-hue/Game',
                      '-p',
                      filename,
                      '-D',
                      str(ROOT),
                      '--clobber'
                  ], check=True)

              return target.read_bytes()

          def advance(disk, offset, count):
              while count:
                  available = len(read_volume(disk)) - offset

                  if available < 0:
                      raise ValueError('Invalid ZIP offset')

                  taken = min(count, available)
                  count -= taken
                  offset += taken

                  if offset == len(read_volume(disk)):
                      disk += 1
                      offset = 0

              return disk, offset

          def read_span(disk, offset, length):
              output = bytearray()

              while len(output) < length:
                  data = read_volume(disk)

                  if offset > len(data):
                      raise ValueError('ZIP offset outside disk')

                  taken = min(
                      length - len(output),
                      len(data) - offset
                  )

                  if taken <= 0:
                      disk += 1
                      offset = 0
                      continue

                  output.extend(data[offset:offset+taken])
                  offset += taken

                  if offset == len(data):
                      disk += 1
                      offset = 0

              return bytes(output)

          def extract(entry):
              disk = entry['disk']
              offset = entry['offset']

              header = read_span(disk, offset, 30)

              if header[:4] != b'PK\x03\x04':
                  raise ValueError(
                      'Invalid original S32 header: '
                      + entry['name']
                  )

              name_len, extra_len = struct.unpack_from(
                  '<HH',
                  header,
                  26
              )

              disk, offset = advance(
                  disk,
                  offset,
                  30 + name_len + extra_len
              )

              compressed = read_span(
                  disk,
                  offset,
                  entry['compressed']
              )

              if entry['method'] == 8:
                  data = zlib.decompress(compressed, -15)
              elif entry['method'] == 0:
                  data = compressed
              else:
                  raise ValueError(
                      'Unsupported original compression'
                  )

              if len(data) != entry['size']:
                  raise ValueError('Original S32 size mismatch')

              if zlib.crc32(data) & 0xffffffff != entry['crc']:
                  raise ValueError('Original S32 CRC mismatch')

              return data

          def parse_s32(data, filename):
              offset = 128 * 64 * 4

              layer2_count = struct.unpack_from(
                  '<H',
                  data,
                  offset
              )[0]

              offset += 2 + layer2_count * 6

              # Original Layer3: 64 x 64 x 4 bytes.
              offset += 64 * 64 * 4

              group_count = struct.unpack_from(
                  '<i',
                  data,
                  offset
              )[0]

              offset += 4

              if not 0 <= group_count <= 100000:
                  raise ValueError('Invalid Layer4 group count')

              groups = set()

              for _ in range(group_count):
                  group_id, count = struct.unpack_from(
                      '<hH',
                      data,
                      offset
                  )

                  groups.add(group_id & 0xffff)
                  offset += 4 + count * 7

              layer5_count = struct.unpack_from(
                  '<i',
                  data,
                  offset
              )[0]

              offset += 4

              if not 0 <= layer5_count <= 200000:
                  raise ValueError('Invalid Layer5 record count')

              if offset + layer5_count * 5 > len(data):
                  raise ValueError('Truncated original Layer5')

              layer5 = []

              for index in range(layer5_count):
                  x, y, group_id, layer_type = (
                      struct.unpack_from(
                          '<BBHB',
                          data,
                          offset + index * 5
                      )
                  )

                  layer5.append((
                      x,
                      y,
                      group_id,
                      layer_type
                  ))

              stem = filename.rsplit('/', 1)[-1].split('.')[0]

              block_x = int(stem[:4], 16)
              block_y = int(stem[4:8], 16)

              origin_x = (
                  (block_x - 0x7fff) * 64 +
                  0x7fff - 63
              )

              origin_y = (
                  (block_y - 0x7fff) * 64 +
                  0x7fff - 63
              )

              return origin_x, origin_y, groups, layer5

          parsed = [
              parse_s32(
                  extract(entry),
                  entry['name']
              )
              for entry in entries
          ]

          valid_groups = set()

          for _, _, groups, _ in parsed:
              valid_groups.update(groups)

          cells = set()
          type_counts = Counter()

          original_count = 0
          matched_count = 0

          for origin_x, origin_y, _, layer5 in parsed:
              for x, y, group_id, layer_type in layer5:
                  original_count += 1

                  if group_id not in valid_groups:
                      continue

                  matched_count += 1
                  type_counts[layer_type] += 1

                  native_x = origin_x + x // 2
                  native_y = origin_y + y

                  # Existing Map047 projection from V229R152.
                  pixel_x = (
                      6 * (native_x + native_y - 65024)
                      - 1400
                  )

                  pixel_y = (
                      3 * (native_y - native_x)
                      - 83
                  )

                  map_x = pixel_x // 16
                  map_y = pixel_y // 16

                  if (
                      0 <= map_x < 363 and
                      0 <= map_y < 238
                  ):
                      cells.add((map_x, map_y))

          if not cells:
              raise ValueError(
                  'No valid native Layer5 cells on Map047'
              )

          result = {
              'nativeS32Files': len(parsed),
              'originalLayer5Records': original_count,
              'matchedLayer5Records': matched_count,
              'types': dict(type_counts),
              'cells': sorted(cells)
          }

          Path(
              'build/map047-native-layer5.json'
          ).write_text(
              json.dumps(result, sort_keys=True),
              encoding='utf8'
          )

          print('PASS genuine S32 files:', len(parsed))
          print('PASS original Layer5:', original_count)
          print('PASS matched Layer4:', matched_count)
          print('PASS Map047 opacity cells:', len(cells))
          print('PASS Layer5 types:', dict(type_counts))
          PY

          python3 -m py_compile build/read-layer5.py
          python3 build/read-layer5.py

      - name: V231 Add native player opacity behavior
        shell: bash
        run: |
          set -euo pipefail

          cat > build/add-opacity.rb <<'RUBY'
          require 'json'
          require 'zlib'
          require 'base64'
          require 'digest'

          root = 'site/knight/gameasync/Data'
          prefix = 'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'

          mapfile = File.join(
            root,
            prefix + 'Map047.rxdata'
          )

          scriptsfile = File.join(
            root,
            'Scripts.rxdata'
          )

          native = JSON.parse(
            File.read('build/map047-native-layer5.json')
          )

          # V231: Restore all original Marshal class definitions.
          # V230 defined only RPG::Map and failed at RPG::AudioFile.
          # These are serialization stubs, not gameplay replacements.
          module RPG
            class Map; end
            class MapInfo; end

            class Event
              class Page
                class Condition; end
                class Graphic; end
              end
            end

            class EventCommand; end
            class MoveCommand; end
            class MoveRoute; end
            class AudioFile; end
            class Tileset; end
          end

          class Table
            def self._load(raw)
              object = allocate
              object.instance_variable_set(:@raw, raw)
              object
            end

            def _dump(_depth)
              @raw
            end
          end

          class Tone
            def self._load(raw)
              object = allocate
              object.instance_variable_set(:@raw, raw)
              object
            end

            def _dump(_depth)
              @raw
            end
          end

          class Color
            def self._load(raw)
              object = allocate
              object.instance_variable_set(:@raw, raw)
              object
            end

            def _dump(_depth)
              @raw
            end
          end

          map = Marshal.load(
            File.binread(mapfile)
          )

          width = map.instance_variable_get(:@width)
          height = map.instance_variable_get(:@height)

          unless [width, height] == [363, 238]
            raise 'Unexpected Map047 dimensions'
          end

          table = map.instance_variable_get(:@data)
          raw = table.instance_variable_get(:@raw).b

          unless raw[0,20].unpack('V5') == [
            3,
            width,
            height,
            3,
            width * height * 3
          ]
            raise 'Unexpected original collision table'
          end

          original_collision = raw[
            20,
            width * height * 2
          ]

          expected_collision_hash = (
            '01e647ea7825d94808596cb601d597d9'
            '9cbd4cef32ea3261d7290359538561d0'
          )

          unless Digest::SHA256.hexdigest(
            original_collision
          ) == expected_collision_hash
            raise 'Map047 original collision changed'
          end

          collision = original_collision.unpack('v*')

          events = map.instance_variable_get(:@events)

          names = events.values.map do |event|
            event.instance_variable_get(:@name)
          end

          unless names.length == 7 &&
                 names.include?('[ID판도라]')
            raise 'Original seven NPCs changed'
          end

          mask = Array.new(
            (width * height + 7) / 8,
            0
          )

          accepted = 0

          native.fetch('cells').each do |x, y|
            unless x.between?(0, width-1) &&
                   y.between?(0, height-1)
              raise 'Native opacity coordinate outside Map047'
            end

            position = y * width + x

            # Preserve original passability and collision data.
            next unless collision[position] == 384

            mask[position >> 3] |= (
              1 << (position & 7)
            )

            accepted += 1
          end

          if accepted == 0
            raise 'No passable native Layer5 cells found'
          end

          encoded_mask = Base64.strict_encode64(
            Zlib::Deflate.deflate(
              mask.pack('C*'),
              9
            )
          )

          original_scripts = File.binread(scriptsfile)
          scripts = Marshal.load(original_scripts)

          unless scripts.is_a?(Array) &&
                 scripts.all? { |item|
                   item.is_a?(Array) &&
                   item.length >= 3 &&
                   item[2].is_a?(String)
                 }
            raise 'Unexpected original RGSS script structure'
          end

          decoded = scripts.map do |entry|
            Zlib::Inflate.inflate(entry[2])
          end

          main_index = scripts.each_index.find do |index|
            scripts[index][1].to_s.strip.downcase == 'main'
          end

          unless main_index
            main_index = decoded.each_index.find do |index|
              decoded[index].include?(
                '$scene = Scene_Title.new'
              ) || decoded[index].include?(
                '$scene=Scene_Title.new'
              )
            end
          end

          unless main_index
            raise 'Original Main script not found'
          end

          renderer_found = decoded[
            0...main_index
          ].any? do |source|
            source.include?('class Sprite_Character')
          end

          unless renderer_found
            raise 'Sprite_Character not defined before Main'
          end

          patch = <<'SOURCE'
          module SLNativeLayer5V231
            WIDTH = 363
            HEIGHT = 238

            RAW = Zlib::Inflate.inflate(
              '__MASK__'.unpack('m')[0]
            ).unpack('C*')

            def self.behind_object?(x, y)
              return false if x < 0 || y < 0
              return false if x >= WIDTH || y >= HEIGHT

              position = y * WIDTH + x
              byte = RAW[position >> 3]

              return false unless byte

              (byte & (1 << (position & 7))) != 0
            end
          end

          class Sprite_Character
            alias sl_v231_original_update update

            def update
              sl_v231_original_update

              return unless defined?($game_map)
              return unless $game_map
              return unless $game_map.map_id == 47

              return unless defined?($game_player)
              return unless $game_player

              return unless @character
              return unless @character.equal?($game_player)

              original_opacity = @character.opacity

              x = @character.x
              y = @character.y

              if SLNativeLayer5V231.behind_object?(x, y)
                self.opacity = [
                  original_opacity,
                  150
                ].min
              else
                self.opacity = original_opacity
              end
            end
          end
          SOURCE

          patch = patch.sub(
            '__MASK__',
            encoded_mask
          )

          File.binwrite(
            'build/sl-native-layer5-v231.rb',
            patch
          )

          new_id = scripts.map { |entry|
            entry[0].to_i
          }.max + 1

          scripts.insert(
            main_index,
            [
              new_id,
              'SLNativeLayer5V231',
              Zlib::Deflate.deflate(patch)
            ]
          )

          File.binwrite(
            scriptsfile,
            Marshal.dump(scripts)
          )

          verified = Marshal.load(
            File.binread(scriptsfile)
          )

          unless verified.count { |entry|
            entry[1] == 'SLNativeLayer5V231'
          } == 1
            raise 'Native opacity patch missing'
          end

          original_entries = Marshal.load(
            original_scripts
          )

          unchanged = verified.reject do |entry|
            entry[1] == 'SLNativeLayer5V231'
          end

          unless unchanged == original_entries
            raise 'Original scripts were unexpectedly changed'
          end

          puts 'PASS Map047 Marshal classes loaded'
          puts 'PASS native Layer5 mask imported'
          puts "PASS projected passable cells: #{accepted}"
          puts 'PASS player opacity behind object: 150 maximum'
          puts 'PASS original opacity restored on exit'
          puts 'PASS seven NPCs and collision unchanged'
          puts 'PASS original RGSS sections preserved'
          RUBY

          ruby -c build/add-opacity.rb
          ruby build/add-opacity.rb
          ruby -c build/sl-native-layer5-v231.rb

      - name: V231 Refresh game script cache and version
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          root = Path('site')
          game = root / 'knight/gameasync'

          script = game / 'Data/Scripts.rxdata'

          digest = hashlib.md5(
              script.read_bytes()
          ).hexdigest()

          mapping = game / 'mapping.js'

          original = mapping.read_text('utf8')

          pattern = (
              r'(Data/Scripts\.rxdata\?h=)'
              r'[0-9a-f]{32}'
          )

          updated, count = re.subn(
              pattern,
              lambda match: match.group(1) + digest,
              original
          )

          if count != 1:
              raise ValueError(
                  'Scripts.rxdata cache reference not unique'
              )

          mapping.write_text(
              updated,
              encoding='utf8'
          )

          for name in (
              'index.html',
              'knight/index.html'
          ):
              page = root / name
              old = page.read_text('utf8')

              if 'V229R157' not in old:
                  raise ValueError(
                      'Wrong original version in ' + name
                  )

              page.write_text(
                  old.replace(
                      'V229R157',
                      'V231'
                  ).replace(
                      'v229r157',
                      'v231'
                  ),
                  encoding='utf8'
              )

          asset = (
              root /
              'knight/js/sl-assets-v229r115.js'
          )

          text = asset.read_text('utf8')

          original_version = "var version='V229R157';"

          if text.count(original_version) != 1:
              raise ValueError(
                  'Original asset version mismatch'
              )

          text = text.replace(
              original_version,
              "var version='V231';"
          )

          if 'map-047-v229r151.pack' not in text:
              raise ValueError(
                  'Original map preload missing'
              )

          asset.write_text(
              text,
              encoding='utf8'
          )

          html = (
              root / 'knight/index.html'
          ).read_text('utf8')

          if (
              'js/sl-assets-v229r115.js?v=v231'
              not in html
          ):
              raise ValueError(
                  'Browser bootstrap version not updated'
              )

          print('PASS version V231')
          print('PASS script cache hash updated')
          print('PASS original Map047 preload preserved')
          PY

          node --check site/knight/gameasync/mapping.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/dpad.js

      - name: V231 Verify no unauthorized game changes
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path('site')

          before = json.loads(
              Path('build/before.json').read_text('utf8')
          )

          after = {
              str(p.relative_to(root)):
              hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*')
              if p.is_file()
          }

          allowed = {
              'knight/gameasync/Data/Scripts.rxdata',
              'knight/gameasync/mapping.js',
              'knight/js/sl-assets-v229r115.js',
              'index.html',
              'knight/index.html'
          }

          if set(before) != set(after):
              raise ValueError(
                  'Unexpected game file added or deleted'
              )

          changed = {
              path
              for path in before
              if before[path] != after[path]
          }

          if changed != allowed:
              raise ValueError(
                  'Unexpected modified files: '
                  + repr(sorted(changed ^ allowed))
              )

          prefix = (
              'knight/gameasync/Data/'
              'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          )

          for map_id in (45, 46):
              path = prefix + f'Map{map_id:03d}.rxdata'

              if path in after:
                  raise ValueError(
                      'Deleted dungeon returned'
                  )

          protected = [
              prefix + 'Map047.rxdata',
              'knight/assets/map-047-v229r151.pack',
              (
                  'knight/gameasync/Graphics/Panoramas/'
                  'SLTI_47_C7_4.png'
              )
          ]

          for path in protected:
              if before[path] != after[path]:
                  raise ValueError(
                      'Protected original changed: ' + path
                  )

          print('PASS only five intended files modified')
          print('PASS original Map047 map and collision')
          print('PASS NPCs and Pandora unchanged')
          print('PASS original terrain graphics unchanged')
          print('PASS Map047 preload unchanged')
          print('PASS Map045/046 remain deleted')
          print('PASS other maps and game resources unchanged')
          PY

      - name: V231 Publish original Layer5 opacity implementation
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
