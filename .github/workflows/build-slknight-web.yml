                :code
              ) == 44

              audio =
                (
                  iv(
                    cmd,
                    :parameters
                  ) ||
                  []
                )[0]

              next unless audio

              name =
                iv(
                  audio,
                  :name
                ).to_s.dup.force_encoding(
                  Encoding::UTF_8
