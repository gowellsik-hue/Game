# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R123
# BASE: verified R121 release (run 40641411815), not erroneous R122.
# USER-APPROVED ONLY: Map045 S32 (32657,32805) screen UP;
# Map045 S32 (32657,32807) screen RIGHT; reciprocal movement allowed.
# Replaces original two mask=3 entries with 8 and 4, respectively.
# Add only three reversible RPG grid edges; do not keep R122 wrong DOWN/LEFT gates.
# Keep all other 450 masks, map data, wall/door rules, original art and actor code.
name: build-slknight-web.yml | V229R123 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R123 Restore correct R121 baseline, excluding R122 wrong gates
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 40641411815
          name: github-pages
          github-token: ${{ github.token }}
          path: r121

      - name: V229R123 Open only 805 UP and 807 RIGHT
        shell: bash
        run: |
          set -euo pipefail
          test -s r121/artifact.tar
          mkdir -p site build
          tar -xf r121/artifact.tar -C site
          python3 - <<'BASE'
          from pathlib import Path
          import hashlib,json
          root=Path('site')
          before={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          assert len(before)==5566,('Wrong R121 file count',len(before))
          expected={
           'knight/gameasync/Data/Scripts.rxdata':'51bbd2b04e5a8e51a7ab95838ba3f7669009ffc1f66c1695c74ed35c6344e7ee',
           'knight/js/dpad.js':'2bd401adf130339d154ce6a8efd0127cefd9b1bc58bc60d1de68e8b6d8b7a791',
           'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap045.rxdata':'f47de87af6b4e607bf632818a711619dc8ca4e747196a123a76ac7db8ffc3ba6',
           'knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap046.rxdata':'dc89d908f5247442e08dddc11f5bcf6505a77890bd82ab59b790e00e3e5f024c'}
          for p,h in expected.items():assert before[p]==h,('Wrong baseline file',p)
          assert 'V229R121' in (root/'knight/index.html').read_text('utf8')
          Path('build/before.json').write_text(json.dumps(before,sort_keys=True))
          print('PASS original R121 deployed site, excluding all R122 changes')
          BASE
          cp site/knight/gameasync/Data/Scripts.rxdata build/scripts-r121.rxdata
          cat > build/patch.rb <<'PATCH'
          require 'zlib'
          old_file=ARGV.fetch(0)
          out_file=ARGV.fetch(1)
          scripts=Marshal.load(File.binread(old_file))
          raise 'Unexpected script count' unless scripts.size==136
          old=Zlib::Inflate.inflate(scripts[134][2])
          raise 'R122 leakage' if old.include?('SLTI_R122TwoOpen')
          raise 'Missing original 452 masks' unless old.include?('module SLTI_V229R97Corner')
          raise 'Missing original S32 graph' unless old.include?('module SLTI_Native66')
          raise 'Character coordinate correction returned' if old.include?('slti_native66_prepare') || old.include?('@slti_native66_')

          # The 452 source masks contain both marked S32 cells, but they
          # incorrectly encode DOWN+LEFT (=3). Fix exactly those two bytes:
          # (32657,32805) UP (=8), (32657,32807) RIGHT (=4).
          pattern=/data='([^']+)'\.unpack\('m'\)\[0\]\.unpack\('C\*'\)/
          matches=old.scan(pattern)
          raise 'Expected one static direction-mask payload' unless matches.size==1
          encoded=matches.first.first
          bytes=encoded.unpack('m')[0].unpack('C*')
          raise 'Wrong mask payload count' unless bytes.size==452*3
          wanted={[32657,32805]=>8,[32657,32807]=>4}
          seen={}
          i=0
          while i<bytes.size
            pt=[32576+bytes[i],32704+bytes[i+1]]
            if wanted.has_key?(pt)
              raise "Original mask changed at #{pt.inspect}" unless bytes[i+2]==3
              bytes[i+2]=wanted.fetch(pt)
              seen[pt]=true
            end
            i+=3
          end
          raise 'Wrong two selected S32 cells' unless seen.keys.sort==wanted.keys.sort
          replacement="data='#{[bytes.pack('C*')].pack('m0')}'.unpack('m')[0].unpack('C*')"
          new_script=old.sub(pattern,replacement)
          raise 'Direction-mask patch failed' if new_script==old

          # In the original 2x renderer these TWO S32 exits cover THREE RPG
          # 32px grid edges. Every edge is bidirectional. No general wall bypass.
          # 805 UP    [89,79] <-> [89,78]
          # 807 RIGHT [90,80] <-> [91,80] <-> [92,80]
          addition=<<'RUNTIME'

          # V229R123: only the two user-marked passages, screen UP and RIGHT.
          # All other S32 corners keep their pre-existing directional rules.
          module SLTI_R123TwoOpen
            WIDTH=288
            GATES={
              78*WIDTH+89=>2,
              79*WIDTH+89=>1,
              80*WIDTH+90=>8,
              80*WIDTH+91=>12,
              80*WIDTH+92=>4
            }.freeze
            def self.edge?(mid,x,y,d)
              return false unless mid==45 && x>=0 && x<288 && y>=0 && y<144
              bit=(d==8 ? 1 : d==2 ? 2 : d==4 ? 4 : d==6 ? 8 : 0)
              bit!=0 && (GATES.fetch(y*WIDTH+x,0)&bit)!=0
            end
          end

          # Preserve R44 collision and event checks everywhere except the
          # exact 3 approved, reversible boundary crossings.
          module SLTI_V229R44
            class << self
              alias slti_r123_original_allowed allowed?
              def allowed?(mid,x,y,d)
                return true if SLTI_R123TwoOpen.edge?(mid,x,y,d)
                slti_r123_original_allowed(mid,x,y,d)
              end
            end
          end

          class Game_Map
            alias slti_r123_original_passable passable?
            def passable?(x,y,d,self_event=nil)
              if SLTI_R123TwoOpen.edge?(@map_id,x,y,d)
                return slti_native66_original_passable(x,y,d,self_event)
              end
              slti_r123_original_passable(x,y,d,self_event)
            end
          end
          RUNTIME
          new_script+=addition
          raise 'Wrong original graph altered' unless new_script.sub(addition,'').sub(replacement,"data='#{encoded}'.unpack('m')[0].unpack('C*')")==old
          raise 'Wrong map coordinate offset' unless new_script.include?("if mid==45 || mid==46\n      px+=12\n      py+=6")
          raise 'R122 wrong gates retained' if new_script.include?('SLTI_R122TwoOpen')
          scripts[134][2]=Zlib::Deflate.deflate(new_script)
          before=Marshal.load(File.binread(old_file))
          scripts.each_with_index{|entry,i|raise "Unexpected script #{i} edited" unless i==134 || entry==before[i]}
          File.binwrite(out_file,Marshal.dump(scripts))
          File.binwrite('build/script134-r123.rb',new_script)
          puts 'PASS exactly 2 S32 mask edits; 3 reversible RPG edges; no other game code touched'
          PATCH
          ruby -c build/patch.rb
          ruby build/patch.rb build/scripts-r121.rxdata site/knight/gameasync/Data/Scripts.rxdata
          ruby -c build/script134-r123.rb

      - name: V229R123 Verify real movement directions and protected map content
        shell: bash
        run: |
          set -euo pipefail
          cat > build/audit.rb <<'AUDIT'
          require 'zlib'
          before=Marshal.load(File.binread(ARGV.fetch(0)))
          after=Marshal.load(File.binread(ARGV.fetch(1)))
          script=lambda{|a,i|Zlib::Inflate.inflate(a[i][2])}
          Object.class_eval(script.call(before,21))
          [23,24,25,27].each{|i|Object.class_eval(script.call(before,i))}
          class Game_Event < Game_Character;end
          class Game_Character
            def check_event_trigger_touch(*args);end
          end
          src=script.call(before,134)
          seg=lambda do |text,a,b|
            x=text.index(a);y=x && text.index(b,x)
            raise "Missing section #{a}" unless x && y
            text[x...y]
          end
          Object.class_eval(seg.call(src,"module SLTI_Native66\n","\n# Replace the old R42/R44 graph"))
          Object.class_eval(seg.call(src,"class Game_Map\n  alias slti_native66_original_passable passable?","\n# V229R97:"))
          Object.class_eval(seg.call(src,"module SLTI_V229R97Corner\n","\n# V229R84:"))
          i=src.index("# V229R84:");j=src.index("module SLTI_Native66\n",i);k=src.index("\n# V229R111:",j)
          Object.class_eval(src[j...k])
          masks_before=SLTI_V229R97Corner::MASKS.dup
          expected_masks={[32657,32805]=>8,[32657,32807]=>4}
          updated_script=script.call(after,134)
          Object.send(:remove_const,:SLTI_V229R97Corner)
          Object.class_eval(seg.call(updated_script,"module SLTI_V229R97Corner\n","\n# V229R84:"))
          changed=masks_before.keys.select{|pt|masks_before[pt]!=SLTI_V229R97Corner::MASKS[pt]}
          raise "Unapproved S32 mask changes #{changed.inspect}" unless changed.sort==expected_masks.keys.sort
          raise 'Incorrect two mask directions' unless expected_masks.all?{|pt,val|SLTI_V229R97Corner::MASKS[pt]==val}
          raise 'Mask count changed' unless SLTI_V229R97Corner::MASKS.size==452
          n=SLTI_Native66
          raise '805 UP S32 closed' unless n.native_target(45,32657,32805,8)==[32658,32804]
          raise '805 UP return closed' unless n.native_target(45,32658,32804,2)==[32657,32805]
          raise '807 RIGHT S32 closed' unless n.native_target(45,32657,32807,6)==[32658,32808]
          raise '807 RIGHT return closed' unless n.native_target(45,32658,32808,4)==[32657,32807]
          [[32657,32805],[32657,32807]].each do |x,y|
            [2,4].each{|d|raise 'R122 incorrect DOWN/LEFT retained' unless n.native_target(45,x,y,d)==nil}
          end
          raise 'R93 coordinates changed' unless n.project(45,32655,32806)==[1416,1290] && n.project(46,32655,32806)==[1416,1674]
          puts 'PASS 805 UP and 807 RIGHT + reverse; old DOWN/LEFT disabled; 450 other masks unchanged'

          class MockMap < Game_Map
            def initialize(mid)
              @map_id=mid
              @map=Struct.new(:width,:height).new(mid==45 ? 288 : 336,mid==45 ? 144 : 168)
              @events={};@passages=Array.new(999,0);@priorities=Array.new(999,0)
            end
            def valid?(x,y);x>=0 && y>=0 && x<@map.width && y<@map.height;end
          end
          $game_map=MockMap.new(45)
          $game_player=Game_Character.new
          $game_player.instance_variable_set(:@character_name,'Kn')
          DIRS={2=>[0,1],4=>[-1,0],6=>[1,0],8=>[0,-1]}
          def can?(x,y,d)
            $game_player.moveto(x,y)
            $game_player.passable?(x,y,d)
          end
          def snap(mid)
            $game_map=MockMap.new(mid)
            h={}
            (84..94).each{|x|(76..84).each{|y|DIRS.each_key{|d|h[[x,y,d]]=can?(x,y,d)}}}
            h
          end
          base1=snap(45);base2=snap(46)
          extra=updated_script[updated_script.index("\n# V229R123:")..-1]
          raise 'Missing only-approved runtime' unless extra.include?('module SLTI_R123TwoOpen')
          Object.class_eval(extra)
          actual1=snap(45);actual2=snap(46)
          raise '2F RGSS movement changed' unless actual2==base2
          expected=[[89,79,8],[89,78,2],[90,80,6],[91,80,4],[91,80,6],[92,80,4]].sort
          changed=(base1.keys.select{|k|base1[k]!=actual1[k]}).sort
          raise "Non-target RGSS movement changed: #{(changed-expected).inspect}" unless (changed-expected).empty?
          expected.each{|k|raise "Passage still blocked #{k}" unless actual1[k]}
          raise 'R122 gates remain' unless SLTI_R123TwoOpen::GATES=={
             78*288+89=>2,79*288+89=>1,80*288+90=>8,
             80*288+91=>12,80*288+92=>4}
          $game_map=MockMap.new(45)
          expected.each do |x,y,d|
            $game_player.moveto(x,y)
            target=[x+DIRS[d][0],y+DIRS[d][1]]
            case d
            when 2;$game_player.move_down
            when 4;$game_player.move_left
            when 6;$game_player.move_right
            when 8;$game_player.move_up
            end
            raise "Player movement failed #{[x,y,d]}" unless [$game_player.x,$game_player.y]==target
          end
          puts "PASS 3 bidirectional RPG edges and 6 player moves, #{base1.size} 1F moves inspected"
          puts "PASS #{base2.size} 2F moves unchanged"
          AUDIT
          ruby -c build/audit.rb
          ruby build/audit.rb build/scripts-r121.rxdata site/knight/gameasync/Data/Scripts.rxdata
          python3 - <<'FILES'
          from pathlib import Path
          import hashlib,json,re
          root=Path('site')
          scripts=root/'knight/gameasync/Data/Scripts.rxdata'
          mapping=root/'knight/gameasync/mapping.js'
          txt=mapping.read_text('utf8')
          txt,n=re.subn(r'(Data/Scripts\.rxdata\?h=)[0-9a-f]{32}',
                    lambda m:m.group(1)+hashlib.md5(scripts.read_bytes()).hexdigest(),txt)
          assert n==1,('Script cache key count',n)
          mapping.write_text(txt,encoding='utf8')
          for name in ('index.html','knight/index.html'):
            p=root/name
            txt=p.read_text('utf8')
            assert 'V229R121' in txt
            p.write_text(txt.replace('V229R121','V229R123').replace('v229r121','v229r123'),encoding='utf8')
          runtime=root/'knight/js/sl-assets-v229r115.js'
          txt=runtime.read_text('utf8')
          assert txt.count("var version='V229R121';")==1
          runtime.write_text(txt.replace("var version='V229R121';","var version='V229R123';"),encoding='utf8')
          before=json.loads(Path('build/before.json').read_text('utf8'))
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert before.keys()==after.keys() and len(before)==5566
          changed={p for p in before if before[p]!=after[p]}
          expected={'index.html','knight/index.html','knight/gameasync/mapping.js',
                    'knight/gameasync/Data/Scripts.rxdata','knight/js/sl-assets-v229r115.js'}
          assert changed==expected,('Other files changed',changed^expected)
          for p in before:
            if (p.startswith('knight/assets/') or p.startswith('knight/gameasync/Graphics/') or
                (p.startswith('knight/gameasync/Data/') and not p.endswith('Scripts.rxdata')) or
                p in ('knight/js/dpad.js','knight/js/drive.js')):
              assert before[p]==after[p],('Protected asset modified',p)
          assert 'js/sl-assets-v229r115.js?v=v229r123' in (root/'knight/index.html').read_text('utf8')
          print('PASS exactly five expected deployment files, all original map/wall/monster/asset files unchanged')
          FILES
          node --check site/knight/js/dpad.js
          node --check site/knight/js/drive.js
          node --check site/knight/js/sl-assets-v229r115.js
          node --check site/knight/gameasync/mapping.js

      - name: V229R123 Publish precisely two user-specified directions
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
