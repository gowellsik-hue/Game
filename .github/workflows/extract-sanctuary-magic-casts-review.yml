              row['offImages']=icons.get(str(row['offIcon']),[]) if row['offIcon'] is not None else []
              row['skillImages']=icons.get(str(row['shortcutIcon']),[]) if row['type']=='spell' else (row['buffImages'] if row['type']=='passive' else [])
          if any(not x['skillImages'] for x in spell_rows):
              raise RuntimeError('At least one original shortcut icon failed to decode')

