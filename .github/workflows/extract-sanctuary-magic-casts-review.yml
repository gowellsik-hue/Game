          from pathlib import Path
          from PIL import Image
          from collections import defaultdict
          import base64, csv, io, json, re, struct, zipfile, xml.etree.ElementTree as ET

          ROOT=Path('original/Sanctuary of Aden - Copy')
          OUT=Path('packages')
          OUT.mkdir(exist_ok=True)
          items=[]
          for e in ET.parse(OUT/'original-status-effects.xml').getroot():
              if e.tag!='effect' or not e.get('id','').isdigit():continue
              items.append({'type':'status','id':int(e.get('id')),'name':e.get('startMsgName') or f"effect {e.get('id')}", 'graphic':int(e.get('graphic')) if e.get('graphic','').isdigit() else None, 'icon':int(e.get('icon')) if e.get('icon','').isdigit() else None, 'offIcon':int(e.get('offIcon')) if e.get('offIcon','').isdigit() else None})
          assert len(items)==490
          assert any(x['name']=='HOLY_WALK_S' and x['graphic']==3936 and x['icon']==1561 and x['offIcon']==5244 for x in items)
          passive=OUT/'original-passive-spells.xml'
          # Passive skill icons are only included when original XML has a verified mapping.
          if passive.exists():
              try:
                  rt=ET.fromstring(passive.read_bytes())
                  for e in rt.iter():
                      if e.get('icon','').isdigit() and e.get('id','').isdigit() and e.get('desc'):
                          items.append({'type':'passive','id':int(e.get('id')),'name':e.get('desc').split(' (')[0], 'graphic':None,'icon':int(e.get('icon')),'offIcon':None})
              except ET.ParseError:
                  pass

          # Read the already-produced actual animated GIF manifest (same original SPR files).
          with zipfile.ZipFile(OUT/'part-01.zip') as z:
              html=z.read('Sanctuary-SPR-viewer.html').decode('utf-8')
          raw=re.search(r'<script id="manifest" type="application/json">(.*?)</script>',html,re.S)
          if not raw:raise RuntimeError('Existing GIF manifest missing')
          fx=defaultdict(list)
          for x in json.loads(raw.group(1)):
              if x['category']=='magic':fx[x['id']].append(x)
          for x in fx.values():x.sort(key=lambda v:v['sub'])
          for fxid in sorted(fx):
              if not any(row['graphic']==fxid for row in items):
                  items.append({'type':'effect','id':fxid,'name':'SPR '+str(fxid),'graphic':fxid,'icon':None,'offIcon':None})

          icon_rows=defaultdict(list)
          special={}
          # Keep all duplicates in original pack order. Do not invent client precedence.
          for idx in sorted(ROOT.glob('Sprite*.idx')):
              pak=idx.with_suffix('.pak')
              data=idx.read_bytes()
              count=struct.unpack_from('<I',data)[0]
              if len(data)!=4+count*28:raise RuntimeError('Incorrect original IDX '+idx.name)
              for i in range(count):
                  pos=4+i*28
                  off=struct.unpack_from('<I',data,pos)[0]
                  name=data[pos+4:pos+24].split(b'\0')[0].decode('cp949','replace')
                  size=struct.unpack_from('<I',data,pos+24)[0]
                  if name.lower().endswith('.tbt'):
                      if off+size>pak.stat().st_size:raise RuntimeError('Invalid TBT offset')
                      icon_rows[name[:-4]].append((pak,off,size,name))
                  if pak.stem=='Sprite' and name in ('SpellIcon.idx','SpellDesc-k.tbl'):
                      if name in special:raise RuntimeError('Duplicate '+name)
                      if off+size>pak.stat().st_size:raise RuntimeError('Invalid '+name+' offset')
                      special[name]=(pak,off,size)

          def original_special(name):
              if name not in special:raise RuntimeError('Missing original '+name)
              pak,off,size=special[name]
              with pak.open('rb') as f:
                  f.seek(off)
                  data=f.read(size)
              if len(data)!=size:raise RuntimeError('Truncated original '+name)
              return data

          spell_index=original_special('SpellIcon.idx')
          if len(spell_index)!=336:raise RuntimeError('Unexpected SpellIcon.idx length')
          spell_icons=struct.unpack('<168H',spell_index)
          assert sum(bool(x) for x in spell_icons)==129
          names={}
          desc=original_special('SpellDesc-k.tbl').decode('cp949')
          lines=desc.splitlines()
          if not lines or lines[0].strip()!='80':raise RuntimeError('Unexpected SpellDesc-k.tbl header')
          for line in lines[1:]:
              m=re.match(r'^(\d+)\s+(.+?)(?:\s+\([^()]*\))?\s*$',line.strip())
              if m:names[int(m.group(1))]=m.group(2)
          spell_rows=[{'type':'spell','id':slot,'name':names.get(slot,f'SpellIcon slot {slot}'),
                       'graphic':None,'icon':None,'offIcon':None,'shortcutIcon':icon_id}
                      for slot,icon_id in enumerate(spell_icons) if icon_id]
          items=spell_rows+items
          needed={str(v) for x in items for v in (x.get('icon'),x.get('offIcon'),x.get('shortcutIcon')) if v is not None}
          missing={str(v) for v in spell_icons if v}-icon_rows.keys()
          if missing:raise RuntimeError('Original shortcut icon files missing: '+str(sorted(missing,key=int)))

          def tbt_png(data):
              if len(data)<4:raise ValueError('short TBT')
              w,h=data[2],data[3]
              if not 0<w<=256 or not 0<h<=256:raise ValueError('invalid TBT size')
              p=4;rows=[];maxw=w
              for _ in range(h):
                  if p>=len(data):raise ValueError('truncated TBT row')
                  n=data[p];p+=1;line=[];x=0
                  for _ in range(n):
                      if p+2>len(data):raise ValueError('truncated TBT segment')
                      x+=data[p]//2; pixels=data[p+1];p+=2
                      if x+pixels>512 or p+pixels*2>len(data):raise ValueError('TBT pixel range')
                      for j in range(pixels):
