          set -euo pipefail
          python3 - <<'PY_NAMES'
          from pathlib import Path
          from collections import defaultdict
          import csv, io, json, re, struct, zipfile, hashlib, xml.etree.ElementTree as ET

          ROOT=Path('original/Sanctuary of Aden - Copy')
          OUT=Path('packages')
          LIB=OUT/'magic-icons-and-viewer.zip'
          with zipfile.ZipFile(LIB) as z:
              icons=json.loads(z.read('original/all-tbt-index.json'))
              catalog=json.loads(z.read('original/magic-catalog.json'))
          if len(icons)!=5154:raise RuntimeError('Original TBT count changed')
          icon_ids={int(x['id']) for x in icons}

          def csv_bytes(columns,rows):
              b=io.StringIO(newline='')
              w=csv.writer(b);w.writerow(columns);w.writerows(rows)
              return b.getvalue().encode('utf-8-sig')

          refs=[];seen=set();text_refs=[]
          ICON_KEYS={'icon','officon','onicon','shortcuticon','iconid','iconidx','iconnum',
                     'iconindex','bufficon','deactiveicon','activeicon','invgfx','invicon',
                     'inventoryicon','inventorygraphic','pictureicon','uiicon'}
          LABEL_KEYS=('name','korname','koreanname','displayname','label','title',
                      'desc','description','text','startmsgname','action')
          TEXT_KEYS=('name','label','title','desc','description','tooltip','message',
                     'startmsg','endmsg','text','textid','nameid','descid','stringid')
          CAND_EXT={'.tbl','.xml','.csv','.tsv','.txt','.ini','.json','.cfg',
                    '.properties','.lst','.dat','.db','.sqlite','.sqlite3','.str',
                    '.loc','.res','.msg','.lang','.sql','.idx'}
          NON_NAMES={'.spr','.tbt','.wav','.mp3','.mid','.ogg','.flac','.bmp',
                     '.png','.jpg','.jpeg','.gif','.webp','.dds','.tga',
                     '.ico','.cur','.avi','.mp4','.mkv','.mov','.wmv',
                     '.exe','.dll','.so','.pdb','.ttf','.otf','.fnt',
                     '.zip','.7z','.rar','.map','.tile'}
          NAME_WORDS=('name','item','weapon','armor','skill','spell','desc','text',
                      'string','message','icon','passive','action','motion','ui','resource')

          def icon_number(value):
              if isinstance(value,int):return value if value in icon_ids else None
              s=str(value).strip()
              if re.fullmatch(r'0[xX][0-9a-fA-F]+',s):return int(s,16) if int(s,16) in icon_ids else None
              if re.fullmatch(r'\d+',s):return int(s) if int(s) in icon_ids else None
              return None

          def add_ref(number,label,source,relationship):
              number=icon_number(number)
              if number is None:return
              label=str(label or '').strip()
              if not label or label.startswith('$'):return
              row=(number,label,source,relationship)
              if row not in seen:seen.add(row);refs.append(row)

          for row in catalog:
              kind=row.get('type')
              if kind=='spell':
                  add_ref(row.get('shortcutIcon'),row.get('name'),
                          'SpellDesc-k.tbl + SpellIcon.idx','original spell name')
              elif kind in ('status','passive'):
                  for key in ('icon','offIcon'):
                      add_ref(row.get(key),row.get('name'),
                              'effectlist2.xml' if kind=='status' else 'passiveSpells.xml',
                              kind+' '+key+' source reference')
          previous_ids={r[0] for r in refs}

          source_rows=[];index_rows=[];text_rows=[];string_map=defaultdict(list);icon_index_candidates=[]
          source_errors=[];raw_files=0;name_files=[];archive_number=0
          PART_LIMIT=175*1024*1024
          part_no=0;part_size=0;source_zip=None
          parts_dir=OUT/'name-source-parts';parts_dir.mkdir(exist_ok=True)

          def next_part():
              global part_no,part_size,source_zip
              if source_zip is not None:source_zip.close()
              part_no+=1;part_size=0
              source_zip=zipfile.ZipFile(parts_dir/f'name-sources-part-{part_no:02d}.zip','w',
                                         compression=zipfile.ZIP_DEFLATED,compresslevel=4)

          def store_raw(name,data):
              global archive_number,part_size,raw_files
              archive_number+=1;raw_files+=1
              name=re.sub(r'[^a-zA-Z0-9._/-]+','_',name.replace('\\','/'))
              name=name.lstrip('/').replace('../','')
              path=f'{archive_number:07d}-{name}'
              if source_zip is None:next_part()
              # Save every byte, splitting unusually large candidate records when needed.
              chunks=max(1,(len(data)+PART_LIMIT-1)//PART_LIMIT)
              for i in range(chunks):
                  chunk=data[i*PART_LIMIT:(i+1)*PART_LIMIT]
                  if part_size+len(chunk)>PART_LIMIT and part_size:next_part()
                  entry='raw/'+path+(f'.part{i+1:03d}-of-{chunks:03d}' if chunks>1 else '')
                  source_zip.writestr(entry,chunk)
                  part_size+=len(chunk)
              return path

          def save_unparsed_pak(path,reason):
              rel=path.relative_to(ROOT).as_posix()
              source_errors.append((rel,reason+' (raw preserved)'))
              chunks=[]
              with path.open('rb') as f:
                  index=0
                  while True:
                      raw=f.read(PART_LIMIT)
                      if not raw:break
                      index+=1
                      chunks.append(store_raw('unparsed-pack/'+rel+f'.part{index:03d}',raw))
              source_rows.append((rel,'unparsed pack',path.stat().st_size,
                                  'unparsed',0,' | '.join(chunks)))

          def decode_text(raw):
              choices=['utf-8-sig','utf-16','cp949']
              if raw[:200].count(b'\x00')>20:choices.insert(2,'utf-16-le')
              for encoding in choices:
                  try:
                      s=raw.decode(encoding)
                      if '\x00' in s[:300]:continue
                      if sum(ord(c)<32 and c not in '\r\n\t' for c in s[:2000])>20:continue
                      return s,encoding
                  except UnicodeError:pass
              return None,None

          def add_text_rows(text,source):
              count=0
              for lineno,line in enumerate(text.splitlines(),1):
                  match=re.match(r'^\s*(\d+)\s+(.+?)\s*$',line)
                  if not match:continue
                  key,value=match.groups()
                  if not value or len(value)>1000:continue
                  text_rows.append((source,key,value,lineno))
                  string_map[key].append((value,source))
                  count+=1
              return count

          def rows_with_keys(values,source,relation):
              norm={re.sub(r'[^a-z0-9]','',str(k).lower()):v for k,v in values.items()}
              labels=[str(norm[k]).strip() for k in LABEL_KEYS if k in norm and norm[k] is not None]
              label=next((v for v in labels if v and not v.startswith('$')),None)
              for k,v in norm.items():
                  if k not in ICON_KEYS:continue
                  if label:add_ref(v,label,source,relation+' '+k)
                  for text_key in TEXT_KEYS:
                      vtext=norm.get(text_key)
                      if vtext is None:continue
                      match=re.fullmatch(r'\$(\d+)',str(vtext).strip())
                      no=icon_number(v)
                      if match and no is not None:
                          text_refs.append((no,match.group(1),source,relation+' '+text_key))

          def xml_refs(root,source):
              n=0
              for e in root.iter():
                  attrs=dict(e.attrib)
                  for child in e:
                      if len(child)==0 and (child.text or '').strip():
                          attrs.setdefault(child.tag,(child.text or '').strip())
                  before=len(refs)
                  rows_with_keys(attrs,source,'XML '+e.tag)
                  n+=len(refs)-before
              return n

          def json_refs(data,source):
              stack=[data];processed=0
              while stack:
                  x=stack.pop()
                  processed+=1
                  if processed>1000000:raise RuntimeError('Overlarge JSON node count')
                  if isinstance(x,dict):
                      rows_with_keys(x,source,'JSON object')
                      stack.extend(x.values())
                  elif isinstance(x,list):stack.extend(x)

          def table_refs(text,source):
              sample=text[:2048]
              try:dialect=csv.Sniffer().sniff(sample,delimiters=',\t;|')
              except csv.Error:return
              try:
                  rdr=csv.DictReader(io.StringIO(text),dialect=dialect)
                  if not rdr.fieldnames:return
                  normalized={re.sub(r'[^a-z0-9]','',x.lower()) for x in rdr.fieldnames if x}
                  if not (normalized & ICON_KEYS and normalized & set(LABEL_KEYS)):return
                  for row in rdr:rows_with_keys(row,source,'delimited table')
              except (ValueError,csv.Error):pass

          def process_data(source,data):
              text,encoding=decode_text(data)
              if text is None:return 'nontext',0
              count=add_text_rows(text,source)
              suffix=Path(source).suffix.lower()
              if suffix=='.xml' or text.lstrip().startswith('<?xml'):
                  try:xml_refs(ET.fromstring(data if data.lstrip().startswith(b'<') else text),source)
                  except ET.ParseError:source_errors.append((source,'XML not parsed (raw saved)'))
              elif suffix=='.json' or text.lstrip().startswith(('{','[')):
                  try:json_refs(json.loads(text),source)
                  except (ValueError,TypeError):pass
              elif suffix in ('.csv','.tsv','.tbl','.txt','.dat','.sql'):
                  table_refs(text,source)
              return encoding,count

          metadata_files=[]
          # Complete census of every extracted IDX, not just Sprite or Text.
          for idx in sorted(ROOT.rglob('*.idx')):
              rel=idx.relative_to(ROOT).as_posix()
              data=idx.read_bytes()
              store_raw('index/'+rel,data)
              if len(data)<4:
                  source_errors.append((rel,'short IDX'));continue
              count=struct.unpack_from('<I',data)[0]
              if len(data)!=4+28*count:
                  source_errors.append((rel,'nonstandard IDX (raw saved)'))
                  pak=idx.with_suffix('.pak')
                  if pak.is_file():save_unparsed_pak(pak,'nonstandard paired index')
                  continue
              pak=idx.with_suffix('.pak')
              with_pak=pak.is_file()
              size=pak.stat().st_size if with_pak else 0
              handle=pak.open('rb') if with_pak else None
              try:
                  for i in range(count):
                      pos=4+28*i
                      offset=struct.unpack_from('<I',data,pos)[0]
                      name=data[pos+4:pos+24].split(b'\0',1)[0].decode('cp949','replace')
                      length=struct.unpack_from('<I',data,pos+24)[0]
                      extension=Path(name).suffix.lower()
                      stem=Path(name).stem.lower()
                      candidate=(extension in CAND_EXT or
                                 (bool(extension) and extension not in NON_NAMES and extension not in ('.pak',)) or
                                 (not extension and any(k in stem for k in NAME_WORDS)))
                      index_rows.append((rel,i,name,offset,length,int(candidate),int(with_pak)))
                      if not candidate:continue
                      if not with_pak:
                          source_errors.append((rel+':'+name,'candidate PAK missing'));continue
                      if length<1 or offset+length>size:
                          source_errors.append((rel+':'+name,'candidate offset outside PAK'));continue
                      handle.seek(offset);raw=handle.read(length)
                      if len(raw)!=length:
                          source_errors.append((rel+':'+name,'candidate short read'));continue
                      key=f'{rel}:{i:06d}:{name}'
                      stored=store_raw('pack/'+rel+'/'+f'{i:06d}-'+name,raw)
                      if extension=='.idx' and len(raw)%2==0:
                          values=struct.iter_unpack('<H',raw)
                          for slot,(number,) in enumerate(values):
                              if number in icon_ids and number:
                                  icon_index_candidates.append((key,slot,number,'candidate only, structure unverified'))
                      enc,rows=process_data(key,raw)
                      source_rows.append((key,'packed',len(raw),enc,rows,stored))
              finally:
                  if handle:handle.close()

          for pak in sorted(ROOT.rglob('*.pak')):
              if not pak.with_suffix('.idx').is_file():
                  save_unparsed_pak(pak,'unindexed candidate PAK')

          # Every loose text/data candidate from every directory, not a hand-picked XML list.
          for path in sorted(ROOT.rglob('*')):
              if not path.is_file() or path.suffix.lower() in ('.idx','.pak'):continue
              rel=path.relative_to(ROOT).as_posix()
              ext=path.suffix.lower()
              if not (ext in CAND_EXT or
                      (bool(ext) and ext not in NON_NAMES and ext not in ('.idx','.pak')) or
                      (not ext and any(k in path.stem.lower() for k in NAME_WORDS))):
                  continue
              raw=path.read_bytes()
              stored=store_raw('loose/'+rel,raw)
              decoded=OUT/'original-name-xml'/rel
              material=decoded.read_bytes() if decoded.is_file() else raw
              enc,rows=process_data(rel,material)
              source_rows.append((rel,'loose',len(raw),enc,rows,stored))

          # Text IDs and icon IDs are separate namespaces. Resolve only unambiguous
          # $text IDs as candidates; never promote them to verified icon names.
          text_candidates=[]
          for icon,text_id,source,relation in sorted(set(text_refs)):
              matches=sorted(set((name,path) for name,path in string_map.get(text_id,[])
                                 if name and re.search('[가-힣]',name)))
              for name,path in matches:
                  text_candidates.append((icon,text_id,name,path,source,relation))

          if source_zip:source_zip.close()
          per_icon=defaultdict(list)
          for row in refs:per_icon[row[0]].append(row)
          matrix=[]
          for row in icons:
              group=per_icon.get(int(row['id']),[])
              matrix.append((row['id'],row['pak'],
                             ' | '.join(sorted({r[1] for r in group if r[3]=='original spell name'})),
                             ' | '.join(sorted({r[1] for r in group if r[3]!='original spell name'}))))
          found_ids={r[0] for r in refs}
          summary={'tbt_records':len(icons),'unique_icon_ids':len(icon_ids),
                   'original_name_references':len(refs),'referenced_icon_ids':len(found_ids),
                   'additional_direct_icon_ids_beyond_base_catalog':len(found_ids-previous_ids),
                   'all_index_entries':len(index_rows),'name_candidate_sources':len(source_rows),
                   'raw_source_files_preserved':raw_files,'source_parts':part_no,
                   'original_text_rows_without_direct_icon_link':len(text_rows),
                   'unverified_icon_text_reference_candidates':len(text_candidates),
                   'unverified_packed_index_entries':len(icon_index_candidates),
                   'source_errors_or_unreadable_indexes':len(source_errors)}
          documents={
                'original/Original-Icon-Name-References.csv':csv_bytes(
                  ('icon_id','original_label','source','relationship'),sorted(refs)),
                'original/Original-Korean-Text-Names.csv':csv_bytes(
                  ('table','text_id_not_icon_id','original_text','source_line'),text_rows),
                'original/All-TBT-Original-Name-Links.csv':csv_bytes(
                  ('icon_id','pak','verified_spell_name','original_reference_label'),matrix),
                'original/Original-Name-Source-Census.csv':csv_bytes(
                  ('source','kind','bytes','decoded_as','text_id_rows','raw_archive_member'),source_rows),
                'original/Original-All-PAK-Entries.csv':csv_bytes(
                  ('index','entry_number','filename','offset','bytes','name_candidate','pak_available'),index_rows),
                'original/Original-Icon-Text-Reference-Candidates.csv':csv_bytes(
                  ('icon_id','text_id','candidate_korean_text','text_table','icon_source','relationship'),text_candidates),
                'original/Original-Packed-Icon-Index-Candidates.csv':csv_bytes(
                  ('index_source','array_slot','candidate_icon_id','interpretation'),icon_index_candidates),
                'original/Original-Name-Extraction-Errors.csv':csv_bytes(
                  ('source','error_or_uncertainty'),source_errors),
                'original/Name-Extraction-Summary.json':json.dumps(summary,ensure_ascii=False,indent=2).encode('utf-8')}
          for src,name in [('reports/original-name-archive-inventory.csv','original/Original-Release-File-Inventory.csv'),
                               ('reports/original-pack-name-inventory.csv','original/Original-Pack-Name-Inventory.csv'),
                               ('packages/original-name-xml-audit.json','original/Original-XML-Decode-Audit.json')]:
              if Path(src).is_file():documents[name]=Path(src).read_bytes()
          # Rewrite only the four pre-existing report entries, without duplicate ZIP members.
          temporary=LIB.with_suffix('.v17-tmp.zip')
          with zipfile.ZipFile(LIB,'r') as old, zipfile.ZipFile(temporary,'w') as new:
              for info in old.infolist():
                  if info.filename not in documents:new.writestr(info,old.read(info.filename))
              for name,data in documents.items():new.writestr(name,data,compress_type=zipfile.ZIP_DEFLATED,compresslevel=6)
          temporary.replace(LIB)
          with zipfile.ZipFile(LIB) as z:
              for name in documents:
                  if z.read(name)!=documents[name]:raise RuntimeError('Name output damaged: '+name)
          if len(matrix)!=5154 or any(row[0] not in icon_ids for row in refs):
              raise RuntimeError('Original name/icon census inconsistent')
          if LIB.stat().st_size>=480*1024*1024:
              raise RuntimeError('Name report archive exceeds upload size')
          for part in sorted(parts_dir.glob('*.zip')):
              if part.stat().st_size>=480*1024*1024:raise RuntimeError('Raw name-source part too large')
              with zipfile.ZipFile(part) as z:
                  if z.testzip() is not None:raise RuntimeError('Raw source ZIP damaged')
          print('ORIGINAL NAME EXTRACTION',json.dumps(summary,ensure_ascii=False),flush=True)
          PY_NAMES

