                          line.append((x+j,c))
                          x+=pixels
                  if x>maxw:maxw=x
                  rows.append(line)
              if maxw>512:raise ValueError('TBT oversize')
              im=Image.new('RGBA',(maxw,h))
              px=im.load()
              for y,line in enumerate(rows):
                  for x,c in line:
                      if c:
                          px[x,y]=(((c>>10)&31)*255//31,((c>>5)&31)*255//31,(c&31)*255//31,255)
              dst=io.BytesIO();im.save(dst,format='PNG')
              return dst.getvalue()

          icons=defaultdict(list);icon_errors=[];all_tbt_rows=[]
          lib=OUT/'magic-icons-and-viewer.zip'
          with zipfile.ZipFile(lib,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as dest:
              for key,rows in sorted(icon_rows.items(),key=lambda p:int(p[0])):
                  for pak,off,size,name in rows:
                      with pak.open('rb') as f:
