
# FILE: .github/workflows/audit-sanctuary-maps.yml
# VERSION: V5.5 / 44-map terrain + collision + native spawn handoff
name: audit-sanctuary-maps.yml | V5.5 | 44 Map Spawn Handoff

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/audit-sanctuary-maps.yml]

permissions:
  actions: read
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: V5.5 Restore verified V5.4 source without modifying it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source handoff
          gh run download 39125584203 -R "$GITHUB_REPOSITORY" -n Sanctuary-Map-V5.4-Spawn-Lifecycle-and-Boss-Overrides -D source
          for f in native-maps-v5.1.json collision-index-v5.2.json spawn-integration-v5.3.json lifecycle-evidence-v5.4.json boss-spawn-overrides-v5.4.json; do
            test -s "source/$f"
          done

      - name: V5.5 Package 44 original maps and classified spawn records
        run: |
          set -euo pipefail
          python3 - <<'PY_V55'
          import csv,hashlib,json,shutil,struct
          from collections import Counter
          from pathlib import Path
          src=Path('source');out=Path('handoff')
          def read(name):return json.loads((src/name).read_text(encoding='utf-8'))
          native=read('native-maps-v5.1.json')
          coll=read('collision-index-v5.2.json')['maps']
          spawns=read('spawn-integration-v5.3.json')['maps']
          lifecycle=read('lifecycle-evidence-v5.4.json')['events']
          boss=read('boss-spawn-overrides-v5.4.json')['bosses']
          evidence={(e['mapId'],e['eventId']):e for e in lifecycle}
          overrides={(e['mapId'],e['eventId']):e for e in boss}
          assert len(native)==len(coll)==len(spawns)==44
          assert len(evidence)==500 and len(overrides)==35
          (out/'maps').mkdir(parents=True,exist_ok=True)
          (out/'collision').mkdir(exist_ok=True)
          (out/'data').mkdir(exist_ok=True)
          totals=Counter();maplist=[];reviews=[];bossrows=[]
          for m in native:
              mid=m['mapId'];key=str(mid);c=coll[key];s=spawns[key]
              w=m['width'];h=m['height']
              assert (w,h)==(c['width'],c['height'])==(s['width'],s['height'])
              png=src/m['terrainPng'];maskfile=src/c['collisionFile']
              mask=maskfile.read_bytes()
              header=png.open('rb').read(24)
              assert header[:8]==b'\x89PNG\r\n\x1a\n'
              assert struct.unpack('>II',header[16:24])==(w*16,h*16)
              assert len(mask)==w*h
              shutil.copy2(png,out/m['terrainPng'])
              shutil.copy2(maskfile,out/c['collisionFile'])
              events=[]
              for e in s['events']:
                  eid=e['eventId'];ident=(mid,eid)
                  assert ident in evidence
                  positions=[e['initial']]+e['setupRelocations']+e['selfSwitchARelocations']
                  for p in positions:
                      x,y=p['x'],p['y']
                      flag=mask[y*w+x] if 0<=x<w and 0<=y<h else 255
                      state='UNKNOWN_TILE' if flag==255 else 'BLOCKED' if flag==15 else 'PASSABLE' if flag==0 else 'DIRECTION_LIMITED'
                      assert state==p['collision'] and flag==p['collisionMask'],ident
                      totals['coordinateCandidates']+=1
                      if state not in ('PASSABLE','DIRECTION_LIMITED'):
                          reviews.append(dict(mapId=mid,eventId=eid,monster=e['monsterName'],role=p['role'],x=x,y=y,collision=state))
                  b=overrides.get(ident)
                  if b:
                      totals['bossOverrides']+=1
                      for x,y in b['placementCandidates']:
                          assert 0<=x<w and 0<=y<h
                          flag=mask[y*w+x]
                          bossrows.append(dict(mapId=mid,eventId=eid,monster=e['monsterName'],x=x,y=y,collisionFlag=flag))
                  events.append(dict(eventId=eid,monsterName=e['monsterName'],evidence=e['evidence'],arenaOrSpecial=e['arenaOrSpecial'],
                      initial=e['initial'],setupRelocations=e['setupRelocations'],selfSwitchARelocations=e['selfSwitchARelocations'],
                      pagesWithoutRelocation=e['conditionPagesWithoutRelocation'],lifecycleEvidence=evidence[ident],bossOverride=b))
                  totals['monsterEvents']+=1
              filename=f'data/map-{mid:03d}.json'
              packaged=dict(version='V5.5',mapId=mid,mapName=m['mapName'],width=w,height=h,
                  coordinateSystem='SLKnight_RPG_Maker',terrainPng=m['terrainPng'],collisionFile=c['collisionFile'],
                  directionalCollision='bit0=down; bit1=left; bit2=right; bit3=up; 255=unknown',
                  collisionIsStaticOnly=True,monsterEvents=events,portalsNotImplemented=True)
              (out/filename).write_text(json.dumps(packaged,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
              maplist.append(dict(mapId=mid,name=m['mapName'],data=filename,terrain=m['terrainPng'],collision=c['collisionFile'],
                  terrainSha256=hashlib.sha256(png.read_bytes()).hexdigest(),collisionSha256=hashlib.sha256(mask).hexdigest(),monsterEvents=len(events)))
              totals['maps']+=1
          assert totals['maps']==44 and totals['monsterEvents']==500 and totals['coordinateCandidates']==1708
          assert totals['bossOverrides']==35 and len(bossrows)==21 and len(reviews)==37
          assert sum(r['collision']=='BLOCKED' for r in reviews)==35
          assert sum(r['collision']=='UNKNOWN_TILE' for r in reviews)==2
          assert all(row['collisionFlag']==0 for row in bossrows)
          for name,rows,fields in [('spawn-review-v5.5.csv',reviews,['mapId','eventId','monster','role','x','y','collision']),
                                   ('boss-fixed-positions-v5.5.csv',bossrows,['mapId','eventId','monster','x','y','collisionFlag'])]:
              with (out/name).open('w',encoding='utf-8-sig',newline='') as f:
                  writer=csv.DictWriter(f,fieldnames=fields);writer.writeheader();writer.writerows(rows)
          manifest=dict(version='V5.5',status='INTEGRATION_INPUT_NOT_APPLIED',sourceRun=39125584203,
              coordinateSystem='SLKnight_RPG_Maker_not_Sanctuary_S32',sourceAssetsUnchanged=True,
              staticCollisionOnly=True,respawnExecutionNotFullyVerified=True,
              forcedBossCoordinatesAreCandidates=True,portalWarpImplementationExcluded=True,
              totals=dict(totals),bossForcedPositionCandidates=len(bossrows),spawnPositionsNeedingReview=len(reviews),maps=maplist)
          (out/'manifest-v5.5.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print('V5.5 HANDOFF VERIFIED',dict(totals),'review',len(reviews),'boss positions',len(bossrows))
          PY_V55
          test -s handoff/manifest-v5.5.json
          test -s handoff/data/map-044.json

      - name: V5.5 Upload separate integration handoff only
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Map-V5.5-44-Map-Integration-Handoff
          path: handoff/
          if-no-files-found: error
          retention-days: 30
