
# FILE: .github/workflows/audit-sanctuary-maps.yml
# VERSION: V6.8
# PURPOSE: Recover original Sanctuary executable bytes and disassemble the real
# native network/packet handling code; not SLKnight, map icons or external SQL.
# INPUT: original user-provided Sanctuary split ZIP on Game release v1.0.0.
# OUTPUT: the original recovered binaries, native disassembly and import evidence.
# LIMIT: static client bytes alone cannot reproduce server-generated first-spawn XY.
# READ ONLY: does not change any map, engine, monster, Pages or other workflows.
name: audit-sanctuary-maps.yml | V6.8 | Original Knight Scale Audit

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/audit-sanctuary-maps.yml]

permissions:
  contents: read
  actions: read

jobs:
  original-native-packet-code:
    name: V6.8 | Recover native Lineage code and trace packet entry points
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: V6.8 Download original Sanctuary native-code archive volumes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source native reports
          gh release download v1.0.0 -R gowellsik-hue/Game \
            -p 'Sanctuary.of.Aden.-.Copy.z01' \
            -p 'Sanctuary.of.Aden.-.Copy.zip' \
            -D source --clobber
          test "$(wc -c < source/Sanctuary.of.Aden.-.Copy.z01)" -eq 100000000
          test "$(wc -c < source/Sanctuary.of.Aden.-.Copy.zip)" -eq 38808950

      - name: V6.8 Extract genuine Lineage executable modules by ZIP CRC and SHA256
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v68-extract.py <<'PY'
          from pathlib import Path
          import hashlib, json, struct, zlib

          root=Path('source');out=Path('native');out.mkdir(exist_ok=True)
          stem='Sanctuary.of.Aden.-.Copy';pref='Sanctuary of Aden - Copy/'
          expected={
            'Lineage.exe':'2124b3da5f53123e0f94a85bd7f9edb2344925fdb4f53d0fc0653ea5c9241414',
            'lin.bin':'0d40fdf84d19e0ecc043766455fb9c5a215a5c39bbac858ca602f0bf5259f19e',
            'Login.dll':'34f438999d3415e1f0b63e204ea1807a223e3dafea9199137d44f55b77cc22ab',
            'npcipher.dll':'f2fbd16f7e62b2279439e6f753917f0605564c1bc9559ef1b31f7ff90cc69259'
          }
          tail=(root/(stem+'.zip')).read_bytes();a=tail.rfind(b'PK\x05\x06')
          assert a>=0
          end=struct.unpack_from('<4s4H2IH',tail,a)
          assert end[1]==45 and end[4]==15389
          entries={};off=0
          while True:
            off=tail.find(b'PK\x01\x02',off)
            if off<0:break
            h=struct.unpack_from('<4s6H3I5H2I',tail,off)
            nl,el,cl=h[10],h[11],h[12];n=off+46+nl+el+cl
            assert 0<nl<=4096 and n<=len(tail)
            name=tail[off+46:off+46+nl].decode('utf-8' if h[3]&0x800 else 'cp949',errors='replace').replace('\\','/')
            rel=name[len(pref):] if name.startswith(pref) else name
            if rel in expected:entries[rel]=(name,h)
            off=n
          assert set(entries)==set(expected)
          data=(root/(stem+'.z01')).read_bytes()
          results=[]
          for rel,(name,h) in entries.items():
            flags,method,crc,packed,unpacked=h[3],h[4],h[7],h[8],h[9]
            disk,local_offset=h[13],h[16]
            assert disk==0 and not flags&1 and method in (0,8)
            local=struct.unpack_from('<4s5H3I2H',data,local_offset)
            assert local[0]==b'PK\x03\x04' and local[2]==flags and local[3]==method
            nl,el=local[9],local[10];p=local_offset+30+nl+el
            local_name=data[local_offset+30:local_offset+30+nl].decode('utf-8' if flags&0x800 else 'cp949',errors='replace').replace('\\','/')
            assert local_name==name
            assert p+packed<=len(data)
            payload=data[p:p+packed]
            raw=payload if method==0 else zlib.decompress(payload,-15)
            digest=hashlib.sha256(raw).hexdigest()
            assert len(raw)==unpacked and zlib.crc32(raw)&0xffffffff==crc and digest==expected[rel],rel
            (out/rel).write_bytes(raw)
            results.append({'filename':rel,'bytes':len(raw),'sha256':digest,'crcVerified':True})
            print('EXTRACTED ORIGINAL',rel,len(raw),digest,flush=True)
          Path('reports/native-source-provenance.json').write_text(json.dumps(results,indent=2))
          PY
          python3 -m py_compile /tmp/v68-extract.py
          python3 /tmp/v68-extract.py

      - name: V6.8 Disassemble original native packet handling and locate call sites
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import collections, csv, hashlib, json, math, re, struct, subprocess

          root=Path('native');out=Path('reports')
          api_rx=re.compile(r'(?i)recv|send|socket|connect|wsa|readfile|writefile|getprocaddress|loadlibrary|decrypt|crypt|packet|npc|spawn|monster')
          rows=[];probes=[]
          for binary in ('Lineage.exe','lin.bin','Login.dll','npcipher.dll'):
            p=root/binary;b=p.read_bytes()
            assert b[:2]==b'MZ'
            peoff=struct.unpack_from('<I',b,0x3c)[0]
            assert b[peoff:peoff+4]==b'PE\0\0'
            machine,nsec,_,_,_,optsize,_=struct.unpack_from('<HHIIIHH',b,peoff+4)
            opt=peoff+24;magic=struct.unpack_from('<H',b,opt)[0]
            entry=struct.unpack_from('<I',b,opt+16)[0]
            base=struct.unpack_from('<I',b,opt+28)[0] if magic==0x10b else struct.unpack_from('<Q',b,opt+24)[0]
            sections=[]
            for i in range(nsec):
              pos=opt+optsize+i*40
              name,vsize,va,rsize,rptr,_,_,_,_,flags=struct.unpack_from('<8sIIIIIIHHI',b,pos)
              data=b[rptr:rptr+rsize];cnt=collections.Counter(data)
              entropy=-sum((n/len(data))*math.log2(n/len(data)) for n in cnt.values()) if data else 0
              sections.append({'name':name.rstrip(b'\0').decode('latin1'), 'rva':va,'vsize':vsize,
                               'rawSize':rsize,'rawOffset':rptr,'entropy':round(entropy,3),
                               'executable':bool(flags&0x20000000)})
            dump=subprocess.run(['objdump','-p',str(p)],capture_output=True,text=True,errors='replace')
            (out/(binary+'.pe-header.txt')).write_text(dump.stdout[-250000:],encoding='utf-8')
            imported=[line.strip() for line in dump.stdout.splitlines() if api_rx.search(line)]
            (out/(binary+'.packet-api-hits.txt')).write_text('\n'.join(imported)+'\n',encoding='utf-8')
            scan=subprocess.run(['strings','-a','-n','6',str(p)],capture_output=True,text=True,errors='replace')
            hits=[x for x in scan.stdout.splitlines() if api_rx.search(x)]
            (out/(binary+'.packet-string-hits.txt')).write_text('\n'.join(hits[:1000])+'\n',encoding='utf-8')
            cmd=['objdump','-d','-M','intel',str(p)]
            asm_path=out/(binary+'.native-disassembly.asm')
            with asm_path.open('w') as handle:
              dis=subprocess.run(cmd,stdout=handle,stderr=subprocess.PIPE,text=True)
            # The full source disassembly, not merely a signature check, is uploaded.
            result={'source':binary,'machine':hex(machine),'imageBase':hex(base),
                    'entryRVA':hex(entry),'entryVA':hex(base+entry),'sections':sections,
                    'networkImportCandidates':imported[:150],
                    'networkStringCandidates':hits[:100],
                    'objdumpReturnCode':dis.returncode,
                    'sourceSHA256':hashlib.sha256(b).hexdigest()}
            probes.append(result)
            rows.append({'binary':binary,'entryVA':hex(base+entry),'nativeSections':len(sections),
                         'highEntropySections':sum(s['entropy']>7.2 for s in sections),
                         'networkImportClues':len(imported),'networkStringClues':len(hits),
                         'nativeDisassemblyBytes':(out/(binary+'.native-disassembly.asm')).stat().st_size})
            print('ORIGINAL NATIVE CODE',binary,'entry',hex(base+entry),
                  'imports',len(imported),'strings',len(hits),'ASM bytes',rows[-1]['nativeDisassemblyBytes'],flush=True)
          (out/'v68-native-entry-and-network-code.json').write_text(json.dumps(probes,indent=2))
          with (out/'v68-real-client-code-summary.csv').open('w',newline='') as f:
            w=csv.DictWriter(f,fieldnames=list(rows[0]));w.writeheader();w.writerows(rows)
          (out/'README.txt').write_text(
            'V6.8 original Sanctuary native-code recovery, not SLKnight or external SQL.\n'
            'Native binaries are source-CRC and SHA256 verified.\n'
            'PE headers, sections, network API/string clues, full native assembly are output.\n'
            'Static code locations are not monster first-spawn records.\n'
            'An actual first-entry packet or server entity table is required for precise XY.\n'
            'No game or Pages files modified.\n')
          PY

      - name: V6.8 Upload recovered native code and real disassembly
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Map-V6.8-Original-Native-Packet-Code-Extraction
          path: |
            native/
            reports/
          retention-days: 30
          if-no-files-found: error
          compression-level: 1
