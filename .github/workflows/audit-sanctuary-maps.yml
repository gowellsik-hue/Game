
# FILE: .github/workflows/audit-sanctuary-maps.yml
# VERSION: V6.4
# GOAL: original Sanctuary of Aden 1F/2F monster spawn full ARCHIVE source search.
# This corrects the omission of native monster spawn in V2 / V5.0-V5.5 / V6.1-V6.3.
# V5.0-V5.5 spawn rows came from SLKnight RPG Maker, NOT Sanctuary's server.
# Archive contains 15,389 records; the original V2 extracted just 44 selected files.
# Output is evidence only: NO guessed mob counts, spawn coordinates or respawn times.
# A verified client map boundary does not prove the live server spawn list.
# Keep workflow filename and title; change version only.
# NO game build, map, event, monster-stat or GitHub Pages modifications.
name: audit-sanctuary-maps.yml | V6.4 | Original Knight Scale Audit

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/audit-sanctuary-maps.yml]

permissions:
  contents: read
  actions: read

jobs:
  full-original-spawn-source-search:
    name: V6.4 | Full original ZIP inventory and dungeon NPC spawn-source audit
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: V6.4 Download original Sanctuary ZIP last volume and central directory
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source reports
          gh release download v1.0.0 -R "$GITHUB_REPOSITORY" \
            -p 'Sanctuary.of.Aden.-.Copy.zip' -D source --clobber
          test -s source/Sanctuary.of.Aden.-.Copy.zip
          echo 'PASS authentic source ZIP last volume; no game source was modified'

      - name: V6.4 Restore verified V6.3 original world-coordinate boundaries
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39385472903
          name: Sanctuary-Map-V6.3-Native-Passage-and-Wall-Groups-Handoff
          github-token: ${{ github.token }}
          path: v63

      - name: V6.4 Build source inventory from ALL 15,389 original archive members
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v64-original-spawn-audit.py <<'PY_V64'
          #!/usr/bin/env python3
          """Sanctuary V6.4: source inventory and conservative original spawn source search.
          No assumptions about existence of original server spawn table in the client archive.
          """
          from pathlib import Path
          from collections import Counter
          import csv, hashlib, json, os, re, struct, sys, zlib

          ROOT=Path('source')
          OUT=Path('reports')
          STEM='Sanctuary.of.Aden.-.Copy'
          PREFIX='Sanctuary of Aden - Copy/'
          TEXT_EXT={'.csv','.tsv','.txt','.xml','.json','.sql','.db','.sqlite','.sqlite3','.ini','.cfg','.conf','.properties','.yaml','.yml','.lua','.java','.cs','.py','.js','.dat','.bin','.tbl','.list','.idx','.jsonl'}
          STRONG=('spawn','respawn','regen','mobspawn','npcspawn','spawnlist','monster','mob','npc','creature','server')
          MEDIUM=('zone','map_config','mapconfig','mapsystem','map_system','location','position','coord','script','world','region')
          DB_EXT={'.sql','.db','.sqlite','.sqlite3','.csv','.tsv','.json','.jsonl'}
          MAX_FILES=300
          MAX_VOLUMES=12
          MAX_ONE_FILE=12_000_000

          def entry_name(data,flags):
              return data.decode('utf-8' if flags&0x800 else 'cp949',errors='replace').replace('\\','/')

          def dump_json(path,obj):
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(json.dumps(obj,ensure_ascii=False,indent=2),encoding='utf-8')

          def directory():
              path=ROOT/(STEM+'.zip');data=path.read_bytes()
              where=data.rfind(b'PK\x05\x06')
              if where<0 or where+22>len(data):raise RuntimeError('Split ZIP central directory absent')
              end=struct.unpack_from('<4s4H2IH',data,where)
              last_disk,total=end[1],end[4]
              if total in (0,65535):raise RuntimeError('Unsupported ZIP64 or empty directory')
              records=[];off=0
              while True:
                  off=data.find(b'PK\x01\x02',off)
                  if off<0:break
                  if off+46>len(data):break
                  h=struct.unpack_from('<4s6H3I5H2I',data,off)
                  flags,method,crc,packed,unpacked=h[3],h[4],h[7],h[8],h[9]
                  name_len,extra_len,comment_len,disk,local_offset=h[10],h[11],h[12],h[13],h[16]
                  finish=off+46+name_len+extra_len+comment_len
                  if not (0<name_len<=4096 and finish<=len(data)):
                      off+=4;continue
                  name=entry_name(data[off+46:off+46+name_len],flags)
                  # Keep every central-directory entry, including directories and odd root files.
                  rel=name[len(PREFIX):] if name.startswith(PREFIX) else name
                  records.append({'name':name,'rel':rel,'method':method,'flags':flags,'crc32':crc,
                                  'packed':packed,'unpacked':unpacked,'disk':disk,'offset':local_offset})
                  off=finish
              if len(records)>total or not records:raise RuntimeError('Malformed catalog')
              return last_disk,total,records

          def priority(e):
              name=e['rel'].lower();ext=Path(name).suffix
              score=0;tags=[]
              if any(k in name for k in STRONG):score+=130;tags.append('spawn-or-NPC-name')
              if any(k in name for k in MEDIUM):score+=52;tags.append('map-zone-or-coordinate-name')
              if name.startswith('xml/'):score+=25;tags.append('original-xml')
              if ext in DB_EXT:score+=75;tags.append('structured-extension')
              elif ext in TEXT_EXT:score+=30;tags.append('text-or-data-extension')
              if ext in {'.pak','.spr','.til','.png','.jpg','.ogg','.wav','.mp3','.bmp','.gif','.tga'}:score=-1
              if ext not in TEXT_EXT:score=-1
              if e['unpacked']<=0 or e['unpacked']>MAX_ONE_FILE or e['name'].endswith('/'):score=-1
              if e['flags']&1 or e['method'] not in (0,8):score=-1
              if score>0 and not tags:score=-1
              return score,','.join(tags)

          def disk_name(d,last):
              return STEM+('.zip' if d==last else '.z%02d'%(d+1))

          def expected_disks(e,last):
              out={e['disk']}
              if e['disk']<last and e['offset']+e['packed']+8192>100_000_000:out.add(e['disk']+1)
              return out

          def select(entries,last):
              candidates=[]
              for e in entries:
                  score,tags=priority(e)
                  e['score']=score;e['tags']=tags
                  if score>0:candidates.append(e)
              candidates.sort(key=lambda e:(-e['score'],e['packed'],e['rel']))
              chosen=[];needed=set();skipped=[]
              for e in candidates:
                  disks={d for d in expected_disks(e,last) if d!=last}
                  if len(chosen)>=MAX_FILES or len(needed|disks)>MAX_VOLUMES:
                      skipped.append(e);continue
                  needed.update(disks);chosen.append(e)
              return candidates,chosen,skipped,needed

          def inventory():
              OUT.mkdir(exist_ok=True)
              last,total,entries=directory()
              if not os.environ.get('V64_TEST'):
                  assert last==45 and total==15389,(last,total)
              candidates,chosen,skipped,disks=select(entries,last)
              with (OUT/'original-archive-all-files.csv').open('w',encoding='utf-8-sig',newline='') as f:
                  w=csv.writer(f);w.writerow(['relativePath','unpackedBytes','packedBytes','startDisk','extension','sourceSearchPriority','candidateTags','selectedForContentInspection'])
                  selected={e['name'] for e in chosen}
                  for e in entries:w.writerow([e['rel'],e['unpacked'],e['packed'],e['disk'],Path(e['rel']).suffix.lower(),e['score'],e['tags'],int(e['name'] in selected)])
              selected={'lastDisk':last,'totalZipRecords':total,'indexedFiles':len(entries),
                        'sourceContentCandidates':len(candidates),'selectedFiles':len(chosen),
                        'skippedFiles':len(skipped),'downloadedPartDisks':sorted(disks),'selectionLimitMaxFiles':MAX_FILES,
                        'selectionLimitMaxVolumes':MAX_VOLUMES,'allNamesInventoried':len(entries)==total,
                        'contentScanIsComplete':len(skipped)==0,
                        'selected':chosen,'notInspected':skipped}
              dump_json(OUT/'source-extraction-plan.json',selected)
              (OUT/'required-volumes.txt').write_text('\n'.join(disk_name(d,last) for d in sorted(disks))+'\n',encoding='utf-8')
              print('V6.4 FULL SOURCE ARCHIVE CATALOG:',total,'entries;',len(entries),'files')
              print('Content candidate files:',len(candidates),'selected:',len(chosen),'skipped:',len(skipped))
              print('Need part volumes:',len(disks),sorted(disks))
              print('Top source candidates:')
              for e in candidates[:30]:print(' ',e['score'],e['rel'],e['unpacked'])

          def span(disk,pos,n,last):
              if n<0 or n>30_000_000:raise ValueError('Oversize read')
              result=bytearray()
              while len(result)<n:
                  if disk>last:raise IOError('Exceeded last split ZIP volume')
                  path=ROOT/disk_name(disk,last)
                  if not path.exists():raise FileNotFoundError(path)
                  size=path.stat().st_size
                  if pos>=size:
                      pos-=size;disk+=1;continue
                  with path.open('rb') as f:
                      f.seek(pos);piece=f.read(min(n-len(result),size-pos))
                  if not piece:raise IOError('Short ZIP read')
                  result.extend(piece);pos+=len(piece)
              return bytes(result)

          def extract(e,last):
              first=span(e['disk'],e['offset'],30,last)
              if first[:4]!=b'PK\x03\x04':raise ValueError('Local ZIP header missing for '+e['rel'])
              local=struct.unpack('<4s5H3I2H',first)
              flags,method,nlen,xlen=local[2],local[3],local[9],local[10]
              if flags&1 or method!=e['method']:raise ValueError('ZIP local flags or method mismatch')
              header=span(e['disk'],e['offset'],30+nlen+xlen,last)
              if entry_name(header[30:30+nlen],flags)!=e['name']:raise ValueError('ZIP member name mismatch')
              packed=span(e['disk'],e['offset']+30+nlen+xlen,e['packed'],last)
              raw=packed if method==0 else zlib.decompress(packed,-15)
              if len(raw)!=e['unpacked'] or zlib.crc32(raw)&0xffffffff != e['crc32']:
                  raise ValueError('CRC or size mismatch for '+e['rel'])
              return raw

          def decode(raw):
              if raw.startswith(b'X?xm'):return None,'X?xm-binary-container'
              if not raw or raw.count(b'\x00')>max(3,len(raw)//20):return None,'binary'
              for enc in ('utf-8-sig','cp949','latin-1'):
                  try:
                      txt=raw.decode(enc)
                  except UnicodeDecodeError:continue
                  printable=sum(c.isprintable() or c in '\r\n\t' for c in txt)/max(1,len(txt))
                  if printable>=.88:return txt,enc
              return None,'binary-or-unknown-encoding'

          def normalized(k):return re.sub(r'[^a-z0-9]','',str(k).lower())

          def find_column(keys,choices):
              norm={normalized(k):k for k in keys}
              for choice in choices:
                  if choice in norm:return norm[choice]
              return None

          def parse_structured(e,text,bounds):
              """Candidate CSV rows only; never label them as verified live Sanctuary server spawns."""
              ext=Path(e['rel'].lower()).suffix
              if ext not in ('.csv','.tsv','.txt'):return []
              sep='\t' if ext=='.tsv' else ','
              try:
                  r=csv.DictReader(text.splitlines(),delimiter=sep)
                  if not r.fieldnames:return []
                  keys=r.fieldnames
                  colmap=find_column(keys,('mapid','mapno','mapnumber','map'))
                  colx=find_column(keys,('locx','spawnx','posx','worldx','x'))
                  coly=find_column(keys,('locy','spawny','posy','worldy','y'))
                  colnpc=find_column(keys,('npctemplateid','npcid','monsterid','mobid','npc','monster','mob'))
                  if not(colmap and colx and coly and colnpc):return []
                  rows=[]
                  for line,row in enumerate(r,2):
                      try:
                          mid=int(row[colmap]);x=int(row[colx]);y=int(row[coly])
                      except (TypeError,ValueError,KeyError):continue
                      if mid not in (1,2):continue
                      ox,oy,w,h=bounds[mid]
                      rows.append({'sourcePath':e['rel'],'line':line,'mapID':mid,'worldX':x,'worldY':y,
                                   'npcIdOrName':str(row[colnpc]),'withinExtractedDungeonBounds':ox<=x<ox+w and oy<=y<oy+h,
                                   'evidenceClass':'STRUCTURED_CLIENT_ARCHIVE_CANDIDATE_NOT_SERVER_VERIFIED'})
                  return rows
              except (csv.Error,UnicodeError,ValueError):return []

          def inspect():
              plan=json.loads((OUT/'source-extraction-plan.json').read_text('utf-8'))
              v63=Path('v63')
              bounds={}
              for f in (1,2):
                  meta=json.loads((v63/f'native/floor-{f}-index.json').read_text('utf-8'))
                  bounds[f]=tuple(meta['origin'])+tuple(meta['size'])
              extracted=[];candidate_positions=[];file_errors=[]
              seen_disk_count=len(plan['downloadedPartDisks'])
              for n,e in enumerate(plan['selected'],1):
                  try:raw=extract(e,plan['lastDisk'])
                  except Exception as exc:
                      file_errors.append({'sourcePath':e['rel'],'error':str(exc)});continue
                  txt,encoding=decode(raw)
                  signature=raw[:32].hex()
                  ext=Path(e['rel']).suffix.lower()
                  suspicious=bool(re.search(r'(spawn|npc|monster|mob|regen|server)',e['rel'],re.I))
                  entry={'sourcePath':e['rel'],'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),
                         'sourceDisk':e['disk'],'crcVerified':True,'encoding':encoding,
                         'headerHex':signature,'possibleSpawnFileByName':suspicious,
                         'confirmedServerSpawnFile':False,'foundRows':0}
                  if txt is not None:
                      hits=[]
                      for ln,line in enumerate(txt.splitlines(),1):
                          if re.search(r'(?i)(spawn|respawn|regen|npc_templateid|npcid|monsterid|mobid|locx|locy|mapid)',line):
                              hits.append({'line':ln,'text':line[:250]})
                          if len(hits)>=30:break
                      entry['searchHits']=hits
                      rows=parse_structured(e,txt,bounds)
                      entry['foundRows']=len(rows)
                      candidate_positions.extend(rows)
                  extracted.append(entry)
                  if n%25==0:print('INSPECT',n,'of',len(plan['selected']),flush=True)
              with (OUT/'candidate-spawn-coordinates-NOT-verified.csv').open('w',encoding='utf-8-sig',newline='') as f:
                  cols=['sourcePath','line','mapID','worldX','worldY','npcIdOrName','withinExtractedDungeonBounds','evidenceClass']
                  w=csv.DictWriter(f,fieldnames=cols);w.writeheader();w.writerows(candidate_positions)
              dump_json(OUT/'inspected-source-file-evidence.json',extracted)
              dump_json(OUT/'source-extraction-errors.json',file_errors)
              ok=len(file_errors)==0
              qualified=sum(int(x['withinExtractedDungeonBounds']) for x in candidate_positions)
              report={'version':'V6.4','purpose':'find original Sanctuary monster spawn coordinates, not RPG Maker events',
                      'sourceArchive':'Sanctuary.of.Aden.-.Copy v1.0.0 public GitHub release split ZIP',
                      'zipEntries':plan['totalZipRecords'],'allFileNamesInspected':plan['allNamesInventoried'],
                      'potentialContentCandidates':plan['sourceContentCandidates'],
                      'candidateFilesContentInspected':len(extracted),
                      'candidateFilesNotInspected':plan['skippedFiles'],
                      'splitArchiveVolumeCountDownloaded':seen_disk_count,
                      'originalSourceCRCVerifiedForAllInspected':ok,
                      'inspectionErrors':len(file_errors),
                      'csvStructuredSpawnRowsCandidate':len(candidate_positions),
                      'candidateRowsWithinExtracted1F2FBounds':qualified,
                      'originalSanctuaryLiveServerSpawnCountVerified':False,
                      'originalSanctuaryLiveServerSpawnCoordinatesVerified':False,
                      'noCandidatesMeansNoServerRecords':False,
                      'gameFilesModified':False,
                      'finding':'SOURCE_CANDIDATES_ONLY' if candidate_positions else 'NO_VERIFIED_SPAWN_SOURCE_FOUND_IN_INSPECTED_FILES',
                      'remainingWork':'Inspect unscanned candidate files and actual Sanctuary server spawn DB or runtime packets if no authoritative client file exists.'}
              dump_json(OUT/'v64-spawn-source-results.json',report)
              (OUT/'README.txt').write_text('V6.4 ORIGINAL SPAWN SOURCE SEARCH / EVIDENCE ONLY\n\n'
                'original-archive-all-files.csv = all archive file names, not just the 44 V2 map files.\n'
                'source-extraction-plan.json = prioritized candidate files and omitted/uninspected files.\n'
                'inspected-source-file-evidence.json = CRC-checked file signatures + limited search excerpts.\n'
                'candidate-spawn-coordinates-NOT-verified.csv = source-schema candidate rows only.\n'
                'No rows does NOT mean the original dungeon had zero monsters.\n'
                'Layer5 S32 records are opacity/visual group candidates, NOT NPC spawn points.\n'
                'Old V5.0-V5.5 monster events are SLKnight RPG Maker data, NOT original Sanctuary server spawn data.\n'
                'No original monster counts, types, coordinates, or respawn schedules should be claimed verified until server-side evidence is found.\n'
                'No modifications or deployments of SLKnight game, maps, monster stats, event pages.\n',encoding='utf-8')
              print('V6.4 INSPECTION DONE:',len(extracted),'verified bytes,',len(candidate_positions),'unverified structured coordinate rows,',len(file_errors),'extraction errors')
              print('COVERAGE',plan['totalZipRecords'],'names,',len(extracted),'content files',plan['skippedFiles'],'candidate files unscanned')

          if __name__=='__main__':
              cmd=sys.argv[1]
              if cmd=='inventory':inventory()
              elif cmd=='inspect':inspect()
              else:raise SystemExit('expected inventory or inspect')
          PY_V64
          python3 -m py_compile /tmp/v64-original-spawn-audit.py
          python3 /tmp/v64-original-spawn-audit.py inventory

      - name: V6.4 Download prioritized real spawn/NPC/zone source files ONLY
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r volume; do
            test -z "$volume" && continue
            echo "Source ZIP volume: $volume"
            gh release download v1.0.0 -R "$GITHUB_REPOSITORY" \
              -p "$volume" -D source --clobber
          done < reports/required-volumes.txt
          python3 /tmp/v64-original-spawn-audit.py inspect

      - name: V6.4 Reject unsupported claims and verify source evidence integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_V64_CHECK'
          import json,csv
          from pathlib import Path
          p=Path('reports')
          r=json.loads((p/'v64-spawn-source-results.json').read_text('utf-8'))
          plan=json.loads((p/'source-extraction-plan.json').read_text('utf-8'))
          assert r['version']=='V6.4' and r['zipEntries']==15389
          assert r['allFileNamesInspected']
          assert r['candidateFilesContentInspected']==plan['selectedFiles']
          assert r['candidateFilesNotInspected']==plan['skippedFiles']
          assert r['inspectionErrors']==0
          assert r['originalSourceCRCVerifiedForAllInspected']
          assert not r['originalSanctuaryLiveServerSpawnCountVerified']
          assert not r['originalSanctuaryLiveServerSpawnCoordinatesVerified']
          assert not r['gameFilesModified']
          with (p/'original-archive-all-files.csv').open(encoding='utf-8-sig',newline='') as f:
              assert sum(1 for _ in csv.reader(f))==plan['indexedFiles']+1
          with (p/'candidate-spawn-coordinates-NOT-verified.csv').open(encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==r['csvStructuredSpawnRowsCandidate']
          assert all(x['evidenceClass']=='STRUCTURED_CLIENT_ARCHIVE_CANDIDATE_NOT_SERVER_VERIFIED' for x in rows)
          print('V6.4 PASS ALL ZIP central-directory filenames, authentic CRC-checked selected sources')
          print('Original Sanctuary 1F/2F source-based spawn candidates:',len(rows))
          print('Uninspected candidate files:',plan['skippedFiles'])
          print('CONFIRMED ORIGINAL SERVER SPAWN COUNT: UNKNOWN (not falsely assumed to be 0)')
          PY_V64_CHECK

      - name: V6.4 Upload original archive spawn-source evidence, not game changes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Map-V6.4-Original-Monster-Spawn-Source-Discovery
          path: reports/
          if-no-files-found: warn
          retention-days: 60
