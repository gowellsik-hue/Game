
name: "audit-sanctuary-maps.yml | V6.12 | Universal Original Map Extraction"

"on":
  workflow_dispatch:
    inputs:
      map_id:
        description: "Original map folder number (e.g. 1, 2, 4)"
        required: true
        default: "4"
        type: string
      x0:
        description: "Leftmost original world X"
        required: true
        default: "32512"
        type: string
      y0:
        description: "Topmost original world Y"
        required: true
        default: "33024"
        type: string
      size:
        description: "Square region side in original cells (64-1024, multiple of 64)"
        required: true
        default: "512"
        type: string
  push:
    branches: [main]
    paths: [.github/workflows/audit-sanctuary-maps.yml]

permissions:
  contents: read

jobs:
  extract-original-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      MAP_ID: ${{ inputs.map_id || '4' }}
      MAP_X0: ${{ inputs.x0 || '32512' }}
      MAP_Y0: ${{ inputs.y0 || '33024' }}
      MAP_SIZE: ${{ inputs.size || '512' }}
    steps:
      - name: Extract original map segments and tile files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p volumes source
          cat > /tmp/extract-original-map.py <<'PY'
          import hashlib
          import json
          import os
          import re
          import struct
          import subprocess
          import zlib
          from pathlib import Path

          REPO = 'gowellsik-hue/Game'
          RELEASE = 'v1.0.0'
          ARCHIVE = 'Sanctuary.of.Aden.-.Copy'
          VOLUMES = Path('volumes')
          OUTPUT = Path('source')
          PART_BYTES = 100000000
          LAST_DISK = 45
          MAP_ID = int(os.environ['MAP_ID'])
          X0 = int(os.environ['MAP_X0'])
          Y0 = int(os.environ['MAP_Y0'])
          SIZE = int(os.environ['MAP_SIZE'])
          assert 0 <= MAP_ID <= 9999, 'Invalid map folder number'
          assert 0 <= X0 < 65536 and 0 <= Y0 < 65536, 'Invalid world origin'
          assert 64 <= SIZE <= 1024 and SIZE % 64 == 0, 'Invalid map size'
          assert X0 + SIZE <= 65536 and Y0 + SIZE <= 65536, 'Region outside world coordinate range'

          def volume(disk):
              assert 0 <= disk <= LAST_DISK, ('Invalid archive disk', disk)
              name = f'{ARCHIVE}.z{disk + 1:02d}' if disk < LAST_DISK else f'{ARCHIVE}.zip'
              path = VOLUMES / name
              if not path.is_file():
                  subprocess.run(
                      ['gh', 'release', 'download', RELEASE, '-R', REPO,
                       '-p', name, '-D', str(VOLUMES), '--clobber'], check=True)
              assert path.stat().st_size == (PART_BYTES if disk < LAST_DISK else 38808950), name
              return path

          def disk_size(disk):
              return PART_BYTES if disk < LAST_DISK else volume(LAST_DISK).stat().st_size

          def take(disk, offset, length):
              result = []
              while length:
                  assert 0 <= disk <= LAST_DISK
                  available = disk_size(disk) - offset
                  if available == 0:
                      disk, offset = disk + 1, 0
                      continue
                  assert available > 0, ('Offset outside archive disk', disk, offset)
                  n = min(available, length)
                  with volume(disk).open('rb') as stream:
                      stream.seek(offset)
                      part = stream.read(n)
                  assert len(part) == n, ('Unexpected archive EOF', disk, offset)
                  result.append(part)
                  length -= n
                  disk, offset = disk + 1, 0
              return b''.join(result)

          def forward(disk, offset, length):
              while length:
                  n = min(length, disk_size(disk) - offset)
                  assert n > 0
                  length -= n
                  offset += n
                  if offset == disk_size(disk) and disk < LAST_DISK:
                      disk, offset = disk + 1, 0
              return disk, offset

          trailer = volume(LAST_DISK).read_bytes()
          eocd = trailer.rfind(b'PK\x05\x06')
          assert eocd >= 0, 'Archive central directory footer missing'
          _, last_disk, cd_disk, _, entries, cd_bytes, cd_offset, _ = struct.unpack_from(
              '<IHHHHIIH', trailer, eocd)
          assert last_disk == LAST_DISK and entries > 0 and cd_bytes > 0
          central = take(cd_disk, cd_offset, cd_bytes)
          records = {}
          pos = 0
          while pos < len(central):
              assert central[pos:pos+4] == b'PK\x01\x02', ('Central record mismatch', pos)
              fields = struct.unpack_from('<IHHHHHHIIIHHHHHII', central, pos)
              (_, _, _, flags, method, _, _, crc, packed, unpacked,
               name_len, extra_len, comment_len, disk, _, _, offset) = fields
              name_bytes = central[pos+46:pos+46+name_len]
              name = name_bytes.decode('utf-8' if flags & 0x800 else 'cp437')
              key = name.casefold()
              assert key not in records, ('Duplicate archive path', name)
              records[key] = dict(name=name, flags=flags, method=method, crc=crc,
                                  packed=packed, unpacked=unpacked, disk=disk, offset=offset)
              pos += 46 + name_len + extra_len + comment_len
          assert pos == cd_bytes and len(records) == entries, 'Incomplete central directory'

          def select_one(pattern):
              found = [r for r in records.values() if pattern.search(r['name'])]
              assert len(found) == 1, ('Original file not unique or missing', pattern.pattern, len(found))
              return found[0]

          tile_idx = select_one(re.compile(r'(?:^|/)Tile\.idx$', re.I))
          tile_pak = select_one(re.compile(r'(?:^|/)Tile\.pak$', re.I))
          map_pattern = re.compile(r'(?:^|/)map/(\d+)/([0-9a-f]{8})\.(s32|seg)$', re.I)
          available = {}
          for rec in records.values():
              match = map_pattern.search(rec['name'])
              if match and int(match.group(1)) == MAP_ID:
                  key = (match.group(2).lower(), match.group(3).lower())
                  assert key not in available, ('Duplicate original map block', key)
                  available[key] = rec
          assert available, ('No original terrain files for map', MAP_ID)

          stem_list = []
          missing = []
          selected = []
          for by in range(Y0 // 64, (Y0 + SIZE - 1) // 64 + 1):
              for bx in range(X0 // 64, (X0 + SIZE - 1) // 64 + 1):
                  stem = f'{bx + 0x7e00:04x}{by + 0x7e00:04x}'
                  present = [(ext, available[(stem, ext)]) for ext in ('s32', 'seg')
                             if (stem, ext) in available]
                  if not present:
                      missing.append(stem)
                      continue
                  stem_list.append(stem)
                  selected.extend(present)
          assert selected, 'No original map blocks overlap the requested region'

          def extract(rec, target):
              assert not rec['flags'] & 1, ('Encrypted archive file', rec['name'])
              disk, offset = rec['disk'], rec['offset']
              header = take(disk, offset, 30)
              if header[:4] != b'PK\x03\x04' and disk == 0 and offset == 0:
                  offset += 4
                  header = take(disk, offset, 30)
              assert header[:4] == b'PK\x03\x04', ('Local header missing', rec['name'])
              name_len, extra_len = struct.unpack_from('<HH', header, 26)
              disk, offset = forward(disk, offset, 30 + name_len + extra_len)
              compressed = take(disk, offset, rec['packed'])
              if rec['method'] == 8:
                  raw = zlib.decompress(compressed, -15)
              elif rec['method'] == 0:
                  raw = compressed
              else:
                  raise ValueError(('Unsupported ZIP compression', rec['name'], rec['method']))
              assert len(raw) == rec['unpacked'], ('Original size mismatch', rec['name'])
              assert (zlib.crc32(raw) & 0xffffffff) == rec['crc'], ('Original CRC mismatch', rec['name'])
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(raw)
              return dict(archive=rec['name'], file=target.relative_to(OUTPUT).as_posix(),
                          size=len(raw), sha256=hashlib.sha256(raw).hexdigest())

          outputs = []
          for _, rec in selected:
              target = OUTPUT / 'map' / str(MAP_ID) / Path(rec['name']).name
              outputs.append(extract(rec, target))
          for rec in (tile_idx, tile_pak):
              outputs.append(extract(rec, OUTPUT / Path(rec['name']).name))
          index = (OUTPUT / Path(tile_idx['name']).name).read_bytes()
          tile_count = struct.unpack_from('<I', index)[0]
          assert tile_count > 0 and len(index) == 4 + tile_count * 28, 'Original Tile.idx invalid'

          first = bytearray(2 * SIZE * SIZE)
          second = bytearray(2 * SIZE * SIZE)
          coverage = bytearray(SIZE * SIZE)
          preferred = {'s32': 0, 'seg': 0}
          for stem in stem_list:
              ext = 's32' if (stem, 's32') in available else 'seg'
              preferred[ext] += 1
              data = (OUTPUT / 'map' / str(MAP_ID) /
                      Path(available[(stem, ext)]['name']).name).read_bytes()
              layer1 = 32768 if ext == 's32' else 16384
              layer2_count = struct.unpack_from('<H', data, layer1)[0]
              layer3 = layer1 + 2 + layer2_count * (6 if ext == 's32' else 4)
              stride = 4 if ext == 's32' else 2
              assert layer3 + 4096 * stride <= len(data), ('Incomplete original Layer3', stem)
              block_x = (int(stem[:4], 16) - 0x7e00) * 64
              block_y = (int(stem[4:], 16) - 0x7e00) * 64
              for ly in range(64):
                  y = block_y + ly - Y0
                  if not 0 <= y < SIZE:
                      continue
                  for lx in range(64):
                      x = block_x + lx - X0
                      if not 0 <= x < SIZE:
                          continue
                      src = layer3 + (ly * 64 + lx) * stride
                      if ext == 's32':
                          a, b = struct.unpack_from('<HH', data, src)
                      else:
                          a, b = data[src], data[src + 1]
                      cell = y * SIZE + x
                      assert not coverage[cell], ('Overlapping original blocks', x, y)
                      struct.pack_into('<H', first, cell * 2, a)
                      struct.pack_into('<H', second, cell * 2, b)
                      coverage[cell] = 1
          (OUTPUT / 'layer3-attr1-u16le.bin').write_bytes(first)
          (OUTPUT / 'layer3-attr2-u16le.bin').write_bytes(second)
          (OUTPUT / 'original-cell-coverage.bin').write_bytes(coverage)
          metadata = dict(
              source='Sanctuary of Aden - Copy / v1.0.0',
              originalMapId=MAP_ID,
              bounds=dict(x0=X0, y0=Y0, x1Exclusive=X0+SIZE, y1Exclusive=Y0+SIZE),
              width=SIZE, height=SIZE,
              requestedBlocks=len(stem_list) + len(missing),
              sourceBlocks=len(stem_list), sourceFiles=len(selected),
              missingBlocks=missing,
              coveredCells=sum(coverage), totalCells=SIZE*SIZE,
              preferredSourceBlocks=preferred,
              tileIndexEntries=tile_count,
              layer3AttributesAreRaw=True,
              collisionMeaningVerified=False,
              gameFilesModified=False,
              files=outputs,
          )
          (OUTPUT / 'manifest.json').write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2), encoding='utf-8')
          print('PASS original map', MAP_ID, 'bounds', X0, Y0, SIZE,
                'blocks', len(stem_list), 'files', len(selected),
                'missing', len(missing), 'covered cells', sum(coverage), '/', SIZE*SIZE,
                flush=True)
          PY
          python3 -m py_compile /tmp/extract-original-map.py
          python3 -u /tmp/extract-original-map.py

      - name: Verify extracted source and derived attributes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path('source')
          m = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          n = m['width'] * m['height']
          assert m['width'] == m['height']
          assert m['requestedBlocks'] == m['sourceBlocks'] + len(m['missingBlocks'])
          assert m['sourceBlocks'] == sum(m['preferredSourceBlocks'].values())
          assert len(m['files']) == m['sourceFiles'] + 2
          coverage = (root / 'original-cell-coverage.bin').read_bytes()
          assert len(coverage) == n and sum(coverage) == m['coveredCells']
          assert (root / 'layer3-attr1-u16le.bin').stat().st_size == 2 * n
          assert (root / 'layer3-attr2-u16le.bin').stat().st_size == 2 * n
          for item in m['files']:
              path = root / item['file']
              assert path.is_file() and path.stat().st_size == item['size']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item['sha256']
          assert m['layer3AttributesAreRaw'] and not m['collisionMeaningVerified']
          assert not m['gameFilesModified']
          print('PASS source SHA256, coverage and Layer3 validation')
          PY

      - name: Upload original map extraction
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Original-Map-${{ env.MAP_ID }}-X${{ env.MAP_X0 }}-Y${{ env.MAP_Y0 }}-S${{ env.MAP_SIZE }}
          path: source/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
