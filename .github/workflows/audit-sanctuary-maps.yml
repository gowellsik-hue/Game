
# FILE: .github/workflows/build-slknight-web.yml
# VERSION: V229R43
# BASE: last successful V229R42 original SLKnight Pages (run 39389927826).
# CHANGE: approved 106 TI dungeon monsters on RGSS maps 45/46 only.
# Preserve 1 Baphomet, ID13, XY(156,100), original art/scripts/engine, audio, portals.
# 88 added monster events: isolated HP/attack switches and local three-way respawns.
# No connection to game2, no custom engine, no original Sanctuary claim for spawn XY.
name: build-slknight-web.yml | V229R43 | Clean Native Events and 2x Terrain

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-slknight-web.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: slknight-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: V229R43 Restore existing successful V229R42 SLKnight Pages
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39389927826
          name: github-pages
          github-token: ${{ github.token }}
          path: r42

      - name: V229R43 Restore original R42 passage flags for coordinate validation
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39389927826
          name: SLKnight-V229R42-Native-Directional-Collision-and-Route-Audit
          github-token: ${{ github.token }}
          path: r42-audit

      - name: V229R43 Restore and verify exact existing game before spawn edits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site build
          test -s r42/artifact.tar
          tar -xf r42/artifact.tar -C site
          python3 - <<'PY_BASE'
          import hashlib,json
          from pathlib import Path
          root=Path('site');base=root/'knight/gameasync/Data'
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          expected={
            'Map045.rxdata':'d9dc66271e48f051b0d35a2dce109777a14fd396f87fcd7d0e76b044b482e3ba',
            'Map046.rxdata':'c3f4cee70c9aff3459245727ccd49403079caa959aeebf00cf9eed99fb852059',
            'Scripts.rxdata':'83811b932c795aa959f6586f96542c701cb388a365df0a5f4e41a2d9f8f68e75'
          }
          for name,sha in expected.items():
            p=base/(prefix+name if name.startswith('Map') else name)
            assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==sha,name
          for mid,expected_size in [(45,288*144),(46,336*168)]:
            p=Path(f'r42-audit/r42-map-{mid}-edges.bin')
            assert p.is_file() and p.stat().st_size==expected_size
          baseline={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(baseline)==5472,len(baseline)
          assert 'V229R42' in (root/'index.html').read_text('utf-8')
          assert 'V229R42' in (root/'knight/index.html').read_text('utf-8')
          Path('build/r43-baseline.json').write_text(json.dumps(baseline,sort_keys=True))
          print('PASS: exact successful V229R42 baseline, original engine and R42 collision preserved')
          PY_BASE

