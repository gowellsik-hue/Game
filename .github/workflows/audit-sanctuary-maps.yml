
# FILE: .github/workflows/audit-sanctuary-maps.yml
# OWNER: MAP / Sanctuary 원본 맵 / 말던 1·2층
# VERSION: V3.9 / 포털 연결 근거 검증
name: 'MAP | 말던 1·2층 | V3.9 | 포털 연결 검증'
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/audit-sanctuary-maps.yml]
permissions:
  contents: read
  actions: read
jobs:
  sanctuary-map:
    name: 'MAP V3.9 | 말던 포털 검증'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 'MAP V3.9 | V3.8 맵 결과 불러오기'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reports
          gh run download 39098136092 -R "$GITHUB_REPOSITORY" -n Sanctuary-TI-Dungeon-V3.8-Portal-Regions -D reports
          test -s reports/topology-v3.8.json
          test -s reports/preview/index.html
      - name: 'MAP V3.9 | 포털 연결 근거·예외 분석'
        run: |
          set -euo pipefail
          python3 - <<'PY_MAP_V39'
          import collections,csv,html,json
          from pathlib import Path
          r=Path('reports');p=r/'preview'
          v=json.loads((r/'topology-v3.8.json').read_text())
          assert v['version']=='V3.8'
          a=[x for m in v['maps'].values() for x in m['portals']]
          assert len(a)==20
          by={(x['mapId'],x['name']):x for x in a}
          ids=collections.defaultdict(list)
          for x in a:ids[x['mapId'],x['portalId']].append(x)
          dup=[g for g in ids.values() if len(g)>1]
          bad=[x for x in a if x['nearestWalkable'] is None]
          assert len(dup)==2 and len(bad)==2
          pairs=[]
          def link(x,y,basis):
              pairs.append(dict(fromMap=x['mapId'],fromName=x['name'],fromXY=[x['x'],x['y']],toMap=y['mapId'],candidateName=y['name'],candidateXY=[y['x'],y['y']],basis=basis,arrivalVerified=False))
          x,y=by[1,'to2'],by[2,'to1']
          assert x['targetMapId']==2 and y['targetMapId']==1
          link(x,y,'서로 대상 맵 ID 일치; 목적지 XY 미확인')
          for n in ('01','02','03'):
              x,y=by[2,'bp'+n+'_in'],by[2,'bp'+n+'_out']
              assert x['targetMapId']==y['targetMapId']==2
              link(x,y,'이름만 짝; 실제 이동 미확인')
          report=dict(version='V3.9',source='V3.8',portalRecords=len(a),candidatePairs=pairs,verifiedDestinations=0,duplicateIds=[dict(mapId=g[0]['mapId'],portalId=g[0]['portalId'],positions=[[z['x'],z['y']] for z in g]) for g in dup],unreachable=[dict(mapId=z['mapId'],name=z['name'],xy=[z['x'],z['y']]) for z in bad])
          (r/'portal-links-v3.9.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          with (r/'portals-v3.9.csv').open('w',newline='',encoding='utf-8-sig') as f:
              w=csv.writer(f);w.writerow(['floor','name','x','y','targetMapId','portalId','walkableWithin6','duplicatedId','verifiedDestination'])
              for z in a:w.writerow([z['mapId'],z['name'],z['x'],z['y'],z['targetMapId'],z['portalId'],int(z['nearestWalkable'] is not None),int(len(ids[z['mapId'],z['portalId']])>1),0])
          rows=''.join('<tr>'+''.join('<td>'+html.escape(str(t))+'</td>' for t in (q['fromMap'],q['fromName'],q['fromXY'],q['toMap'],q['candidateName'],q['candidateXY'],q['basis']))+'</tr>' for q in pairs)
          page=f'''<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAP V3.9 말던 포털 연결 검증</title><style>body{{background:#121927;color:#eef;font:14px system-ui;margin:16px}}table{{border-collapse:collapse}}td,th{{padding:8px;border-bottom:1px solid #567}}a{{color:#9cf}}</style><h2>MAP | 말던 1·2층 | V3.9 | 포털 연결 검증</h2><a href="index.html">원본 지형</a> · <a href="regions.html">통행구역</a><p>포털 20건 · 연결 후보 4쌍 · 같은 ID 반복 2쌍 · 접근 불명 2건</p><p><strong>목적지 좌표는 아직 0건 검증.</strong> 아래 XY는 출발·후보의 원본 위치이며 이동 목적지로 확정하면 안 됨.</p><table><tr><th>층</th><th>포털</th><th>좌표</th><th>층</th><th>연결 후보</th><th>좌표</th><th>근거</th></tr>{rows}</table><p>동일 ID 반복: {html.escape(str([(g[0]['portalId'],[(z['x'],z['y']) for z in g]) for g in dup]))}</p><p>6칸 내 이동 불가: {html.escape(str([(z['name'],z['x'],z['y']) for z in bad]))}</p></html>'''
          (p/'portal-links.html').write_text(page)
          old=(p/'index.html').read_text()
          assert '</header>' in old
          (p/'index.html').write_text(old.replace('</header>',' <a href="portal-links.html" style="color:#ffdf4d">V3.9 포털 검증</a></header>',1))
          print('MAP V3.9:',len(a),'portals /',len(pairs),'pairs /',len(dup),'duplicate IDs /',len(bad),'unreachable')
          PY_MAP_V39
          test -s reports/portal-links-v3.9.json
          test -s reports/portals-v3.9.csv
          test -s reports/preview/portal-links.html
      - name: 'MAP V3.9 | 결과물 업로드'
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-MAP-TI-Dungeon-V3.9-Portal-Links
          path: reports/
          if-no-files-found: error
          retention-days: 30
