      - name: V229R43 Retarget original monsters and clone independent native RPG events
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r43-spawn-patch.rb <<'R43_RUBY'
          #!/usr/bin/env ruby
          # V229R43: maps 45 and 46 monster positions only. Clone original RPG Maker event templates.
          require 'csv';require 'json';require 'digest';require 'set'
          module RPG
           class Map;end;class MapInfo;end;class AudioFile;end;class Tileset;end
           class Event;class Page;class Condition;end;class Graphic;end;end;end
           class EventCommand;end;class MoveRoute;end;class MoveCommand;end
          end
          class Table
           def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
           def _dump(depth=0);@raw;end
          end
          class Tone
           def self._load(raw);o=allocate;o.instance_variable_set(:@raw,raw);o;end
           def _dump(depth=0);@raw;end
          end
          class Color<Tone;end

          def iv(object,key);object.instance_variable_get('@'+key.to_s);end
          def sv(object,key,value);object.instance_variable_set('@'+key.to_s,value);end
          def assert(value,message);raise RuntimeError,message unless value;end

          def what(name)
           s=name.to_s.dup.force_encoding('UTF-8').scrub
           return '바포메트' if s.include?('바포메트')
           return '킹버그베어' if s.include?('킹 버그베어') || s.include?('킹버그베어')
           %w[스파토이 해골 좀비 버그베어 켈베로스].find{|v|s.include?(v)}
          end

          site=ARGV.fetch(0);build=ARGV.fetch(1);data_csv=ARGV.fetch(2);masks=ARGV.fetch(3)
          Dir.mkdir(build) unless Dir.exist?(build)
          base=File.join(site,'knight/gameasync/Data');prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          expected_count={45=>{'해골'=>18,'좀비'=>16,'스파토이'=>14},46=>{'버그베어'=>27,'켈베로스'=>25,'킹버그베어'=>5,'바포메트'=>1}}
          expected_sha={45=>'d9dc66271e48f051b0d35a2dce109777a14fd396f87fcd7d0e76b044b482e3ba',46=>'c3f4cee70c9aff3459245727ccd49403079caa959aeebf00cf9eed99fb852059'}
          rows=CSV.read(data_csv,headers:true,encoding:'bom|utf-8').map(&:to_h)
          assert(rows.length==106,"Candidate CSV should have exactly 106 approved monsters")
          actual=rows.group_by{|r|[r['층'].to_i,what(r['몬스터'])]}.transform_values(&:length)
          expected_count.each{|mid,counts|counts.each{|monster,n|assert(actual[[mid-44,monster]]==n,"Monster mismatch #{mid} #{monster}: #{actual[[mid-44,monster]]}")}}
          assert(actual.size==7,'Unapproved monster species in CSV')
          created=[];global_clone=0

          [45,46].each do |mid|
           path=File.join(base,prefix+format('Map%03d.rxdata',mid))
           assert(Digest::SHA256.file(path).hexdigest==expected_sha[mid],"Wrong R42 source Map#{mid}")
           original=Marshal.load(File.binread(path));mapped=Marshal.load(File.binread(path))
           events=iv(mapped,'events');source=iv(original,'events')
           w=iv(mapped,'width');h=iv(mapped,'height')
           assert([w,h]==(mid==45 ? [288,144] : [336,168]),'Unexpected map dimensions')
           mask=File.binread(File.join(masks,format('r42-map-%d-edges.bin',mid)))
           assert(mask.bytesize==w*h,"Missing verified R42 collision map #{mid}")
           by_type=Hash.new{|h,k|h[k]=[]}
           source.each{|id,ev| m=what(iv(ev,'name'));by_type[m]<<id if m}
           assert(by_type.transform_values(&:size)==(mid==45 ? {'해골'=>3,'좀비'=>3,'스파토이'=>3} : {'버그베어'=>3,'켈베로스'=>3,'킹버그베어'=>2,'바포메트'=>1}),'Original mob events changed')
           if mid==46
            boss=source.fetch(13)
            assert([iv(boss,'x'),iv(boss,'y')]==[156,100] && what(iv(boss,'name'))=='바포메트','Baphomet must remain original ID13 at 156,100')
           end
           desired=rows.select{|row|row['층'].to_i==mid-44 && what(row['몬스터'])!='바포메트'}
           assert(desired.map{|r|[r['싱린X_투영'],r['싱린Y_투영']]}.uniq.length==desired.length,'Duplicate approved projected XY')
           positions=desired.map{|r|[r['싱린X_투영'].to_i,r['싱린Y_투영'].to_i]}.to_set
           positions.each do |x,y|
            assert(x>=0 && x<w && y>=0 && y<h,"Out of bounds: #{mid} #{x},#{y}")
            assert(mask.getbyte(y*w+x)>0,"Blocked approved position: #{mid} #{x},#{y}")
           end
           if mid==46
            assert(rows.count{|r|r['층']=='2' && what(r['몬스터'])=='바포메트' && r['싱린X_투영']=='156' && r['싱린Y_투영']=='100'}==1,'Missing single Baphomet')
            assert(!positions.include?([156,100]),'Normal monster on Baphomet tile')
           end
           others=source.reject{|id,e| what(iv(e,'name'))}.map{|id,e|[iv(e,'x'),iv(e,'y')]}.to_set
           assert((positions & others).empty?,"Spawn overlaps portal, healer or fixed event on #{mid}")

           def respawns(mask,w,h,start,seed,occupied)
            x,y=start
            # Reuse original 3-way random-respawn event logic, replacing stale template coords.
            # Only choose positions reachable by this map's original four-way collision grid.
            directions=[[0,-1,1,2],[0,1,2,1],[-1,0,4,8],[1,0,8,4]]
            q=[[x,y,0]];seen=Set[[x,y]];options=[]
            until q.empty?
             cx,cy,d=q.shift
             options << [cx,cy] if d>0 && d<=5 && !occupied.include?([cx,cy])
             next if d>=5
             src=mask.getbyte(cy*w+cx)
             directions.each do |dx,dy,bit,reverse|
              nx=cx+dx;ny=cy+dy
              next if nx<0 || ny<0 || nx>=w || ny>=h || seen.include?([nx,ny])
              next if src&bit==0 || mask.getbyte(ny*w+nx)&reverse==0
              seen.add([nx,ny]);q<<[nx,ny,d+1]
             end
            end
            # Use deterministic shuffled reachable cells; never respawn outside original passage.
            rng=Random.new(seed);options.shuffle!(random:rng)
            ([start]+options).uniq.take(3).then{|a|a+[start]*(3-a.size)}
           end

           chosen_per_type=Hash.new(0)
           desired.each do |row|
            mob=what(row['몬스터']);x=row['싱린X_투영'].to_i;y=row['싱린Y_투영'].to_i
            templates=by_type.fetch(mob)
            index=chosen_per_type[mob];chosen_per_type[mob]+=1
            if index < templates.length
             eid=templates[index];event=events.fetch(eid);cloned=false;template_id=eid
            else
             template_id=templates[index % templates.length];global_clone+=1
             eid=(events.keys.max || 0)+1
             event=Marshal.load(Marshal.dump(source.fetch(template_id)))
             sv(event,'id',eid);events[eid]=event;cloned=true
            end
            sv(event,'x',x);sv(event,'y',y)
            pages=iv(event,'pages')
            if cloned
             # Every clone gets its own HP, attack switch and (zombie) activation variable.
             assert(global_clone<=120,'Exceeded reserved RGSS variable IDs')
             hp_page=pages[2];old_hp=iv(iv(hp_page,'condition'),'variable_id')
             new_hp=4100+global_clone
             assert(old_hp.is_a?(Integer) && old_hp>0,"Missing original HP variable #{mob}")
             active=pages[1];cond=iv(active,'condition')
             old_gate=iv(cond,'switch1_id')
             assert(iv(cond,'switch1_valid'),"Original spawn gate missing #{mob}")
             sv(cond,'switch1_valid',false)  # Use original global dungeon condition and independent corpse self switch.
             old_attack=iv(active,'list').select{|cmd| iv(cmd,'code')==121}.map{|cmd|iv(cmd,'parameters')[0]}.uniq
             assert(old_attack.length==1,"Unexpected attack switch sharing in #{mob}: #{old_attack}")
             old_attack=old_attack[0];new_attack=4300+global_clone
             old_zombie= mob=='좀비' ? iv(iv(pages[1],'condition'),'variable_id') : nil
             new_zombie=4500+global_clone if old_zombie
             pages.each do |page|
              condition=iv(page,'condition')
              sv(condition,'variable_id',new_hp) if iv(condition,'variable_valid') && iv(condition,'variable_id')==old_hp
              sv(condition,'variable_id',new_zombie) if old_zombie && iv(condition,'variable_valid') && iv(condition,'variable_id')==old_zombie
              commands=iv(page,'list')
              commands.reject! do |cmd|
               code=iv(cmd,'code');p=iv(cmd,'parameters')
               code==121 && p[0]==old_gate && p[1]==old_gate
              end
              commands.each do |cmd|
               code=iv(cmd,'code');p=iv(cmd,'parameters')
               case code
               when 121
                if p[0]==old_attack && p[1]==old_attack
                 p[0]=new_attack;p[1]=new_attack
                end
               when 122
                if p[0]==old_hp && p[1]==old_hp
                 p[0]=new_hp;p[1]=new_hp
                elsif old_zombie && p[0]==old_zombie && p[1]==old_zombie
                 p[0]=new_zombie;p[1]=new_zombie
                end
                if p[3]==1 && p[4]==old_hp;p[4]=new_hp
                elsif old_zombie && p[3]==1 && p[4]==old_zombie;p[4]=new_zombie
                end
               when 111
                if p[0]==1 && p[1]==old_hp;p[1]=new_hp
                elsif old_zombie && p[0]==1 && p[1]==old_zombie;p[1]=new_zombie
                end
                p[1]=new_attack if p[0]==0 && p[1]==old_attack
               when 355,655
                next unless p[0].is_a?(String)
                text=p[0].dup
                text.gsub!(/\$game_variables\[#{old_hp}\]/,"$game_variables[#{new_hp}]")
                text.gsub!(/\$game_switches\[#{old_attack}\]/,"$game_switches[#{new_attack}]")
                if old_zombie
                 text.gsub!(/\$game_variables\[#{old_zombie}\]/,"$game_variables[#{new_zombie}]")
                end
                text.gsub!(/(SLMonsterAttackContext|SLBreathContext)\.register\(#{old_attack},\$game_map\.map_id,#{template_id}\)/,"\\1.register(#{new_attack},$game_map.map_id,#{eid})")
                p[0]=text
               end
              end
             end
             assert(iv(iv(pages[2],'condition'),'variable_id')==new_hp,"Clone HP not isolated #{eid}")
             assert(iv(iv(pages[1],'condition'),'switch1_valid')==false,"Clone gate not cleared #{eid}")
             assert(iv(iv(pages[1],'list').find{|cmd|iv(cmd,'code')==121},'parameters')[0]==new_attack,"Clone attack not isolated #{eid}")
            end
            # Original event death contains 3 RNG branches with fixed old-template XY.
            # Keep branch RNG and respawn waiting time; use new local reachable candidates.
            death=pages[3];assert(death && iv(iv(death,'condition'),'self_switch_valid'),"Missing original death/respawn event #{eid}")
            moves=iv(death,'list').select{|cmd| iv(cmd,'code')==202 && iv(cmd,'parameters')[0]==0 && iv(cmd,'parameters')[1]==0}
            assert(moves.length==3,"Missing 3 original random respawn destinations #{eid}: #{moves.length}")
            resp=respawns(mask,w,h,[x,y],mid*100000+eid,positions)
            moves.each_with_index do |cmd,i|
             p=iv(cmd,'parameters');p[2]=resp[i][0];p[3]=resp[i][1]
            end
            created << {'map'=>mid,'id'=>eid,'species'=>mob,'x'=>x,'y'=>y,'sourceEventID'=>template_id,'cloned'=>cloned,'respawnCandidates'=>resp}
           end
           if mid==46
            after=events.fetch(13)
            assert(Marshal.dump(source.fetch(13))==Marshal.dump(after),'Original Baphomet event modified')
           end
           # Map only gets approved monster position/clone updates. Original portals & scripts unchanged.
           before_other=source.reject{|id,e| what(iv(e,'name'))}
           before_other.each{|id,e|assert(Marshal.dump(e)==Marshal.dump(events.fetch(id)),"Non-monster original changed #{mid}:#{id}")}
           assert(created.count{|z|z['map']==mid}==expected_count[mid].values.sum-(mid==46 ? 1 : 0),'Incorrect monster count')
           File.binwrite(path,Marshal.dump(mapped))
           readback=Marshal.load(File.binread(path))
           assert(iv(readback,'events').length==(mid==45 ? 53 : 62),"Wrong total map event count #{mid}")
           puts "PATCHED Map#{mid} original_events=#{source.length} total_events=#{events.length} monsters=#{expected_count[mid].values.sum} SHA256=#{Digest::SHA256.file(path).hexdigest}"
          end
          # Same boss event is unchanged, included only in count and report.
          created << {'map'=>46,'id'=>13,'species'=>'바포메트','x'=>156,'y'=>100,'sourceEventID'=>13,'cloned'=>false,'respawnCandidates'=>[]}
          assert(created.length==106,"Incorrect total monsters #{created.length}")
          assert(created.count{|e|e['cloned']}==88,'Expected exactly 88 clones and 18 retained originals')
          assert(created.map{|z|[z['map'],z['id']]}.uniq.size==106,'Duplicate monster event ID')
          File.write(File.join(build,'r43-spawn-audit.json'),JSON.pretty_generate({'version'=>'V229R43','source'=>'V229R42 39389927826','monsterCount'=>106,'clonedMonsterEvents'=>88,'unchangedBossEventID'=>13,'bossCoords'=>[156,100],'monsters'=>created}))
          puts 'PASS: 106 monsters, 88 independent clones, 17 originals relocated, boss ID13 preserved'
          R43_RUBY
          ruby -c /tmp/r43-spawn-patch.rb
          ruby /tmp/r43-spawn-patch.rb site build build/r43-approved-spawns.csv r42-audit

      - name: V229R43 Refresh ONLY Map045 and Map046 asset hash keys and version strings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_MAP'
          from pathlib import Path
          import hashlib,re
          root=Path('site');mapping=root/'knight/gameasync/mapping.js'
          contents=mapping.read_text(encoding='utf-8')
          prefix='MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          expected_old={45:'c9c30a984659453b296b79f2aa478a86',46:'c511cf6be7b220b50a529d0a6fc40e5f'}
          for mid in (45,46):
            name=f'Data/{prefix}Map{mid:03d}.rxdata?h='
            actual=root/'knight/gameasync'/f'Data/{prefix}Map{mid:03d}.rxdata'
            pattern=re.escape(name)+r'[0-9a-f]{32}'
            old=name+expected_old[mid]
            assert contents.count(old)==1,f'Expected original R42 hash missing: {mid}'
            new=name+hashlib.md5(actual.read_bytes()).hexdigest()
            contents,count=re.subn(pattern,lambda _:new,contents)
            assert count==1,('Unexpected manifest entries',mid,count)
            print('Patched map manifest',mid,'MD5',new.rsplit('=',1)[-1])
          mapping.write_text(contents,encoding='utf-8')
          for file in (root/'index.html',root/'knight/index.html'):
            text=file.read_text(encoding='utf-8')
            assert 'V229R42' in text,('Missing R42 version',file)
            file.write_text(text.replace('V229R42','V229R43').replace('v229r42','v229r43'),encoding='utf-8')
          PY_MAP
          node --check site/knight/gameasync/mapping.js

      - name: V229R43 Reject all other game edits and verify 106 monsters
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import hashlib,json,re,csv
          root=Path('site');build=Path('build')
          before=json.loads((build/'r43-baseline.json').read_text())
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert len(before)==len(after)==5472 and before.keys()==after.keys()
          changed={name for name in before if before[name]!=after[name]}
          prefix='knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          allowed={'index.html','knight/index.html','knight/gameasync/mapping.js',prefix+'Map045.rxdata',prefix+'Map046.rxdata'}
          assert changed==allowed,('Unexpected files modified',changed^allowed)
          assert 'V229R43' in (root/'index.html').read_text('utf-8')
          assert 'V229R43' in (root/'knight/index.html').read_text('utf-8')
          report=json.loads((build/'r43-spawn-audit.json').read_text())
          assert report['monsterCount']==106 and report['clonedMonsterEvents']==88
          monsters=report['monsters'];assert len(monsters)==106
          assert sum(1 for m in monsters if m['species']=='바포메트')==1
          boss=next(m for m in monsters if m['species']=='바포메트')
          assert (boss['map'],boss['id'],boss['x'],boss['y'])==(46,13,156,100)
          distribution={(m,s):sum(1 for x in monsters if x['map']==m and x['species']==s) for m,s in [(45,'해골'),(45,'좀비'),(45,'스파토이'),(46,'버그베어'),(46,'켈베로스'),(46,'킹버그베어'),(46,'바포메트')]}
          assert list(distribution.values())==[18,16,14,27,25,5,1],distribution
          mapping=(root/'knight/gameasync/mapping.js').read_text('utf-8')
          for mid in (45,46):
            name='Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap%03d.rxdata'%mid
            f=root/'knight/gameasync'/name
            assert mapping.count(name+'?h='+hashlib.md5(f.read_bytes()).hexdigest())==1
          assert (root/'knight/gameasync/Data/Scripts.rxdata').is_file()
          summary={'version':'V229R43','base':'successful V229R42 run 39389927826',
                   'changedFiles':sorted(changed),'monsterDistribution':distribution and {f'{k[0]}:{k[1]}':v for k,v in distribution.items()},
                   'monsterEventsTotal':106,'baphometOriginalEventUnchanged':True,
                   'gameEngineModified':False,'originalOtherAssetsModified':False,'mobileLiveTestPassed':False}
          (build/'r43-integrity.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          print('PASS V229R43: 106 monsters, 1 original Baphomet, 88 independent clones; ONLY 5 allowed site files changed')
          PY_FINAL

      - name: V229R43 Upload exact spawn mapping and integrity results
        uses: actions/upload-artifact@v4
        with:
          name: SLKnight-V229R43-TI-Dungeon-106-Monster-Spawns
          path: |
            build/r43-approved-spawns.csv
            build/r43-spawn-audit.json
            build/r43-integrity.json
          retention-days: 30
          if-no-files-found: error

      - name: V229R43 Upload same SLKnight site to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

