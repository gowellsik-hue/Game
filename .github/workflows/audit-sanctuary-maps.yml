
# FILE: .github/workflows/audit-sanctuary-maps.yml
# VERSION: V6.10
# PURPOSE: Actually unpack 2,430,275 original native bytes using the recovered
#          V6.9 lin.bin decompressor; do not claim these are monster spawns.
# INPUT: successful V6.8 run 39455649091 and V6.9 run 39457763824.
# KEEP: exact workflow filename and Original Knight Scale Audit name.
# DO NOT modify SLKnight, maps, engine, Pages or any other workflow.
name: audit-sanctuary-maps.yml | V6.10 | Original Knight Scale Audit

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/audit-sanctuary-maps.yml]

permissions:
  contents: read
  actions: read

jobs:
  unpack-native-second-stage:
    name: V6.10 | Unpack actual original lin.bin second code stage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: V6.10 Restore original verified lin.bin from V6.8
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39455649091
          name: Sanctuary-Map-V6.8-Original-Native-Packet-Code-Extraction
          github-token: ${{ github.token }}
          path: source-v68

      - name: V6.10 Restore original decrypted first-stage bytes from V6.9
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39457763824
          name: Sanctuary-Map-V6.9-Original-Lin-Bin-Decrypted-Stage1
          github-token: ${{ github.token }}
          path: source-v69

      - name: V6.10 Execute the authentic native unpack algorithm
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          cat > /tmp/v610-unpack.py <<'PY_V610'
          from pathlib import Path
          import hashlib
          import struct
          import sys

          v68=Path(sys.argv[1]);v69=Path(sys.argv[2]);output=Path(sys.argv[3]);output.mkdir(parents=True,exist_ok=True)
          original=(v68/'native/lin.bin').read_bytes()
          first=(v69/'v69-decrypted-native-stage1.bin').read_bytes()
          sha=lambda x:hashlib.sha256(x).hexdigest()
          assert sha(original)=='0d40fdf84d19e0ecc043766455fb9c5a215a5c39bbac858ca602f0bf5259f19e'
          assert len(first)==4096 and sha(first)=='adad55081945b214b80e9c30788f7b3623aec5ee64ae383d0983a855432502a0'

          p=struct.unpack_from('<I',original,0x3c)[0];assert original[p:p+4]==b'PE\0\0'
          assert struct.unpack_from('<H',original,p+24)[0]==0x10b
          base=struct.unpack_from('<I',original,p+24+28)[0]
          count=struct.unpack_from('<H',original,p+6)[0]
          table=p+24+struct.unpack_from('<H',original,p+20)[0]
          sections={}
          for i in range(count):
              k=table+40*i
              name=original[k:k+8].rstrip(b'\0').decode('latin1')
              vsize,va,rsize,roff=struct.unpack_from('<IIII',original,k+8)
              sections[name]=(base+va,rsize,roff)
          assert 'hsebmuhf' in sections
          address,length,offset=sections['hsebmuhf']
          assert address==0x151e000 and length==0x1afa00
          assert first[:7]==bytes.fromhex('60 e8 00 00 00 00 58')
          read_u32=lambda pos:struct.unpack_from('<I',first,pos)[0]
          start=base+read_u32(0x66)-address
          unpack_dest=base+read_u32(0x5f)
          assert start==0x212 and unpack_dest==0x12cb014
          packed=first+original[offset+4096:offset+length]

          class Reader:
              def __init__(self, data, start):
                  self.data=data;self.index=start;self.flags=0x80;self.start=start
              def byte(self):
                  if self.index>=len(self.data):raise ValueError('Compressed input ended without native end marker')
                  value=self.data[self.index];self.index+=1;return value
              def bit(self):
                  old=self.flags
                  self.flags=(old<<1)&255
                  carry=old>>7
                  if not self.flags:
                      new=self.byte()
                      self.flags=((new<<1)|carry)&255
                      carry=new>>7
                  return carry
              def gamma(self):
                  value=1
                  while True:
                      value=(value<<1)|self.bit()
                      if not self.bit():return value
                      if value>0x1000000:raise ValueError('Unreasonable match length/offset')

          r=Reader(packed,start)
          out=bytearray([r.byte()])
          last_offset=0
          mode=2
          limit=8*1024*1024

          def copy_match(distance,nbytes):
              if not 0<distance<=len(out):
                  raise ValueError(f'Invalid native match: distance={distance}, written={len(out)}')
              if not 0<nbytes<=limit or len(out)+nbytes>limit:
                  raise ValueError('Native unpack output exceeds safety limit')
              if distance>=nbytes:
                  src=len(out)-distance
                  out.extend(out[src:src+nbytes])
              else:
                  for _ in range(nbytes):out.append(out[-distance])

          iterations=0
          while True:
              iterations+=1
              if iterations>5_000_000:raise ValueError('Native unpacker did not terminate')
              if r.bit()==0:
                  out.append(r.byte())
                  mode=2
                  continue
              if r.bit()==0:
                  candidate=r.gamma()-mode
                  mode=1
                  if candidate==0:
                      count=r.gamma()
                      copy_match(last_offset,count)
                  else:
                      last_offset=((candidate-1)<<8)|r.byte()
                      count=r.gamma()
                      if last_offset>=0x7d00:count+=2
                      elif last_offset>=0x500:count+=1
                      elif last_offset<=0x7f:count+=2
                      copy_match(last_offset,count)
                  continue
              if r.bit()==0:
                  value=r.byte()
                  if value==0:break
                  last_offset=value>>1
                  copy_match(last_offset,2+(value&1))
                  mode=1
                  continue
              distance=0
              for _ in range(4):distance=(distance<<1)|r.bit()
              out.append(out[-distance] if distance else 0)
              mode=2

          assert len(out)==2430275,(len(out),'unexpected native output size')
          assert sha(out)=='861cc32c6070c3643e6c0fa39a1579fc73fe59b1992d3cbc60ccaa454ba264d1','Original unpacked bytes changed'
          entry_offset=struct.unpack_from('<i',out,1)[0]+5
          assert out[0]==0xe9 and entry_offset==0x1749,(hex(entry_offset))
          assert out[0x361:0x36b]==b'WinLicense',out[0x361:0x36b]
          (output/'v610-native-stage2-decompressed.bin').write_bytes(out)
          (output/'v610-native-stage2-entry.bin').write_bytes(out[entry_offset:entry_offset+1024])
          summary=(
              f'Original lin.bin SHA256: {sha(original)}\n'
              f'V6.9 stage1 SHA256: {sha(first)}\n'
              f'Source compressed bytes consumed: {r.index-r.start}\n'
              f'Original native decompression iterations: {iterations}\n'
              f'Stage2 destination: 0x{unpack_dest:08X}\n'
              f'Stage2 bytes: {len(out)}\n'
              f'Stage2 SHA256: {sha(out)}\n'
              f'Stage2 actual jump VA: 0x{unpack_dest+entry_offset:08X}\n'
              'WinLicense string in real decompressed code: yes\n'
              'Initial monster spawn IDs and XY: not present in this output as a verified spawn table\n'
              'Neither SLKnight nor external server data used; no game changes.\n'
          )
          (output/'v610-native-stage2-result.txt').write_text(summary,encoding='utf-8')
          print(summary)
          PY_V610
          python3 -m py_compile /tmp/v610-unpack.py
          python3 /tmp/v610-unpack.py source-v68 source-v69 reports
          objdump -D -b binary -m i386 -M intel \
            --adjust-vma=0x12CC75D \
            reports/v610-native-stage2-entry.bin \
            > reports/v610-native-stage2-entry.asm
          grep -iq '12cc75d:' reports/v610-native-stage2-entry.asm
          test "$(wc -c < reports/v610-native-stage2-decompressed.bin)" -eq 2430275
          cat reports/v610-native-stage2-result.txt

      - name: V6.10 Upload actual original native second-stage code
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Map-V6.10-Original-Lin-Bin-Unpacked-Stage2
          path: reports/
          retention-days: 60
          if-no-files-found: error
