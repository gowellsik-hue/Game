
# FILE: .github/workflows/audit-sanctuary-maps.yml
# VERSION: V6.5
# Original Sanctuary ZIP XML complete decrypt and NPC/spawn reference check.
# Based on successful MAP V6.4 run 39402429574 and native map V6.3 run 39385472903.
# V6.4 established 15,389 ZIP members; 160 original XML (159 encrypted, 1 plaintext).
# AES decryption method verified against six original Sanctuary map configuration files.
# Open-source algorithm source: tony1223/PakViewer src/Lin.Helper.Core/Xml/XmlCracker.cs
# MAP NPC pins are NOT live monster spawns. No real monster count assumed.
# NO changes to build-slknight-web.yml, maps, monsters, stats, pages, or gameplay.
name: audit-sanctuary-maps.yml | V6.5 | Original Knight Scale Audit

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/audit-sanctuary-maps.yml]

permissions:
  contents: read
  actions: read

jobs:
  decrypt-original-client-xml:
    name: V6.5 | Original 160 XML decrypted and NPC/spawn reference audit
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: V6.5 Restore successful V6.4 complete ZIP catalog
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39402429574
          name: Sanctuary-Map-V6.4-Original-Monster-Spawn-Source-Discovery
          github-token: ${{ github.token }}
          path: v64

      - name: V6.5 Restore V6.3 original TI dungeon world-coordinate boundaries
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39385472903
          name: Sanctuary-Map-V6.3-Native-Passage-and-Wall-Groups-Handoff
          github-token: ${{ github.token }}
          path: v63

      - name: V6.5 Download ONLY Sanctuary original archive z36 for all 160 XML
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original reports
          gh release download v1.0.0 -R "$GITHUB_REPOSITORY" \
            -p 'Sanctuary.of.Aden.-.Copy.z36' -D original --clobber
          test -s original/Sanctuary.of.Aden.-.Copy.z36
          command -v openssl
          openssl version
          echo 'Ready: source volume containing all original 160 client XML files'

      - name: V6.5 CRC-verify, decrypt ALL XML and separate NPC UI pins from monster spawn
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v65-original-xml-audit.py <<'PY_V65'
          #!/usr/bin/env python3
          """V6.5: decrypt every source-archive XML, classify original monster spawn references.
          Source decryption compatible with Lin.Helper.Core.Xml.XmlCracker (PakViewer).
          Never treat map UI NPC icons or static zones as monster spawns.
          """
          from pathlib import Path
          from collections import Counter
          import csv, hashlib, json, re, struct, subprocess, sys, zlib
          import xml.etree.ElementTree as ET

          PLAN = Path(sys.argv[1]); VOLUME = Path(sys.argv[2]); BOUNDS = Path(sys.argv[3]); OUT = Path(sys.argv[4])
          OUT.mkdir(parents=True, exist_ok=True)
          (OUT/'decoded-xml').mkdir(exist_ok=True)
          meta = json.loads(PLAN.read_text(encoding='utf-8'))
          assert meta['totalZipRecords']==15389 and meta['allNamesInventoried']
          assert meta['selectedFiles']==215 and meta['skippedFiles']==8
          assert VOLUME.stat().st_size==100000000, ('Incorrect source z36 volume size', VOLUME.stat().st_size)
          items=[x for x in meta['selected'] if x['rel'].startswith('xml/') and x['rel'].lower().endswith('.xml')]
          assert len(items)==160 and all(x['disk']==35 for x in items)
          assert not any(x['rel'].startswith('xml/') for x in meta['notInspected'])

          bnds={}
          for mid in (1,2):
              source=json.loads((BOUNDS/f'native/floor-{mid}-index.json').read_text(encoding='utf-8'))
              origin=source['origin'];size=source['size']
              bnds[mid]=(origin[0],origin[1],origin[0]+size[0],origin[1]+size[1])

          KEY='dc8401212a40200add25b9a70db9c94e'
          IV='3e0978aac4d53063300c5f9a807f2246'

          def digest(b): return hashlib.sha256(b).hexdigest()

          def extract(e,fp):
              fp.seek(e['offset'])
              h=fp.read(30)
              assert len(h)==30 and h[:4]==b'PK\x03\x04', ('Bad ZIP local header',e['rel'])
              p=struct.unpack('<4s5H3I2H',h)
              flag,method,nlen,elen=p[2],p[3],p[9],p[10]
              assert not flag&1 and method==e['method'],e['rel']
              name=fp.read(nlen).decode('utf-8' if flag&0x800 else 'cp949',errors='replace').replace('\\','/')
              assert name==e['name'],(name,e['name'])
              fp.seek(elen,1)
              compressed=fp.read(e['packed'])
              assert len(compressed)==e['packed']
              data=compressed if method==0 else zlib.decompress(compressed,-15)
              assert len(data)==e['unpacked'] and zlib.crc32(data)&0xffffffff==e['crc32'],e['rel']
              return data

          def decode(raw):
              if raw.startswith((b'<?xml',b'<',b'\xef\xbb\xbf')):return raw,'plaintext'
              if len(raw)<=4 or raw[0]!=0x58:return raw,'unknown-signature'
              payload=raw[4:]
              length=(len(payload)//16)*16
              encrypted=payload[:length]
              if encrypted:
                  result=subprocess.run(['openssl','enc','-d','-aes-128-cbc','-nopad','-K',KEY,'-iv',IV],
                                        input=encrypted,stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True)
                  assert len(result.stdout)==length
                  block=payload[length-16:length]
                  decrypted=result.stdout
              else:
                  block=bytes.fromhex(IV)
                  decrypted=b''
              decrypted+=bytes(a^b for a,b in zip(payload[length:],block))
              first=b'\xef' if raw[1:4]==b'\xbb\xbf<' else b'<'
              return first + raw[1:4] + decrypted,'PakViewer-AES128-CBC-tail-XOR'

          def parse_safe(blob):
              try:return ET.fromstring(blob),None
              except (ET.ParseError,LookupError,ValueError) as e:
                  reason=str(e)
                  for encoding in ('euc-kr','cp949','big5','shift_jis','utf-8'):
                      try:
                          s=blob.decode(encoding)
                          s=re.sub(r'(<\?xml[^>]*encoding\s*=\s*["\'])[^"\']+(["\'][^>]*\?>)',r'\1utf-8\2',s,count=1,flags=re.I)
                          return ET.fromstring(s.encode('utf-8')),None
                      except (UnicodeDecodeError,ET.ParseError,ValueError):continue
                  return None,reason

          def coord(el):
              a={k.lower():v for k,v in el.attrib.items()}
              for k in ('loc','pos','coord','position','location'):
                  if k in a:
                      numbers=re.match(r'^\s*(\d{3,6})\s*[, ]\s*(\d{3,6})(?:\b|\s*$)',a[k])
                      if numbers:return tuple(map(int,numbers.groups()))
              for x,y in (('x','y'),('locx','locy'),('worldx','worldy'),('posx','posy'),('spawnx','spawny')):
                  if x in a and y in a:
                      try:return (int(a[x]),int(a[y]))
                      except ValueError:pass
              return None

          spawn_re=re.compile(r'spawn|respawn|regen|monster|mob|creature',re.I)
          npc_re=re.compile(r'\bnpc\b|npc[_-]',re.I)
          summary=[];total_tags=Counter();map_npc=[];candidates=[];decrypt_counts=Counter();parse_fail=[];roots={};
          with VOLUME.open('rb') as fp:
              for e in sorted(items,key=lambda x:x['rel']):
                  raw=extract(e,fp)
                  plain=raw;layers=0;root=None;error=None
                  # The *_e.xml copies are double-encrypted; the first decrypt forcibly
                  # changes byte0 to '<', so restore byte0='X' before the second pass.
                  for _ in range(4):
                      root,error=parse_safe(plain)
                      if root is not None:break
                      if layers>=3 or not plain or plain[0] not in (0x58,0x3c):break
                      attempt=plain if plain[0]==0x58 else bytes([0x58])+plain[1:]
                      updated,method=decode(attempt)
                      if updated==plain or method in ('plaintext','unknown-signature'):break
                      plain=updated;layers+=1
                  decrypt_counts[str(layers)]+=1
                  path=OUT/'decoded-xml'/e['rel'].split('/',1)[1]
                  path.write_bytes(plain)
                  duplicate=e['rel'].endswith('_e.xml')
                  canonical=e['rel'][:-6] if duplicate else e['rel']
                  record={'relativePath':e['rel'],'canonicalSource':canonical,
                          'duplicateReencryptedCopy':duplicate,
                          'archiveSourceCRC32':e['crc32'],
                          'encryptedSHA256':digest(raw),'decryptedSHA256':digest(plain),
                          'bytes':len(raw),'decryptionLayers':layers,
                          'xmlValid':root is not None,'rootTag':root.tag if root is not None else None,
                          'xmlError':error,'mapUIIconMarkers':0,'spawnNamedElements':0,'reviewNpcElements':0}
                  if root is None:
                      parse_fail.append({'file':e['rel'],'error':error,'signature':plain[:32].hex()})
                      summary.append(record)
                      continue
                  # Keep both physical encrypted variants as evidence, but inventory only
                  # canonical originals; otherwise map UI NPC labels get counted twice.
                  if duplicate:
                      summary.append(record)
                      continue
                  roots[e['rel']]=root.tag
                  for el in root.iter():
                      tag=el.tag.rsplit('}',1)[-1] if isinstance(el.tag,str) else str(el.tag)
                      total_tags[tag]+=1
                      p=coord(el)
                      matches=[mid for mid,(x0,y0,x1,y1) in bnds.items() if p and x0<=p[0]<x1 and y0<=p[1]]
                      is_map_ui=e['rel'].startswith('xml/MapSystem') and tag.upper()=='NPC'
                      if is_map_ui:
                          record['mapUIIconMarkers']+=1
                          map_npc.append({'source':e['rel'],'tag':tag,'coordinates':p or '',
                                          'withinOriginalDungeonMapIDs':','.join(map(str,matches)),
                                          'attributes':json.dumps(el.attrib,ensure_ascii=False,sort_keys=True),
                                          'classification':'MAP_UI_NPC_ICON_NOT_LIVE_MONSTER_SPAWN'})
                          continue
                      matched_spawn=bool(spawn_re.search(tag) or any(spawn_re.search(k) for k in el.attrib))
                      matched_npc=bool(npc_re.search(tag) or any(npc_re.search(k) for k in el.attrib))
                      if matched_spawn or matched_npc:
                          record['spawnNamedElements']+=int(matched_spawn)
                          record['reviewNpcElements']+=int(matched_npc)
                          candidates.append({'source':e['rel'],'tag':tag,'coordinates':p or '',
                                            'withinOriginalDungeonMapIDs':','.join(map(str,matches)),
                                            'attributes':json.dumps(el.attrib,ensure_ascii=False,sort_keys=True),
                                            'classification':'UNVERIFIED_XML_CONFIG_REFERENCE_NOT_SERVER_SPAWN'})
                  summary.append(record)

          (OUT/'xml-source-index.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'xml-parse-errors.json').write_text(json.dumps(parse_fail,ensure_ascii=False,indent=2),encoding='utf-8')
          with (OUT/'xml-tags.csv').open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.writer(f);w.writerow(['tag','occurrences']);w.writerows(total_tags.most_common())
          for nm,records in [('npc-map-icons-NOT-spawns.csv',map_npc),('npc-and-spawn-xml-REFERENCES-NOT-verified.csv',candidates)]:
              with (OUT/nm).open('w',encoding='utf-8-sig',newline='') as f:
                  columns=['source','tag','coordinates','withinOriginalDungeonMapIDs','attributes','classification']
                  w=csv.DictWriter(f,fieldnames=columns);w.writeheader();w.writerows(records)

          known={'xml/CollisionZone.xml':'CollisionZoneList',
                 'xml/ExtMapAttr.xml':'ExtendedTileAttributes',
                 'xml/MapSystem.xml':'Map_System_Configulation',
                 'xml/MapSystem86.xml':'Map_System_Configulation',
                 'xml/map_config.xml':'map_config',
                 'xml/zone3.xml':'zoneinfo'}
          for name,expected in known.items():assert roots.get(name)==expected,(name,roots.get(name),expected)
          assert decrypt_counts==Counter({'0':1,'1':80,'2':79}),decrypt_counts
          assert len(summary)==160 and len(roots)==80
          hashes={r['relativePath']:r['decryptedSHA256'] for r in summary}
          for record in summary:
              if record['duplicateReencryptedCopy']:
                  assert record['canonicalSource'] in hashes,record['relativePath']
                  assert record['decryptedSHA256']==hashes[record['canonicalSource']],record['relativePath']
          assert sum(x['mapUIIconMarkers'] for x in summary)==1122
          stats={'version':'V6.5','status':'CLIENT_CONFIG_XML_DECODED_NOT_SERVER_SPAWN_DATABASE',
                 'sourceRunV64':39402429574,'sourceRunV63':39385472903,
                 'archiveMembersIndexed':15389,'sourceXMLTotal':len(items),
                 'uniqueCanonicalXML':len(roots),'duplicateReencryptedXML':80,
                 'xmlDecryptionDepths':dict(decrypt_counts),
                 'parsedXMLCount':len(roots),'parseFailures':len(parse_fail),
                 'mapSystemNpcMapIcons':len(map_npc),'nonMapIconNpcOrSpawnXmlReferences':len(candidates),
                 'originalMonsterSpawnCoordinatesVerified':False,'originalMonsterPopulationVerified':False,
                 'originalServerSpawnDatabaseFound':False,
                 'sandboxExecutableLaunched':False,'SLKnightDataModified':False,
                 'provenance':'PakViewer Lin.Helper.Core.Xml.XmlCracker compatible AES-128 CBC XOR tail, source ZIP CRC verified',
                 'notice':'Static NPC UI pins and zone definitions are NOT live monster spawn locations.'}
          (OUT/'v65-results.json').write_text(json.dumps(stats,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'README.txt').write_text('V6.5 XML source decoding / no SLKnight changes\n'
              'Original archive XML: 160 physical files; 80 unique configs, 80 doubled-encrypted copies.\n\n'
              'AES-128 CBC + XOR tail algorithm from open-source tony1223/PakViewer.\n'
              'All raw XML files are CRC-verified from original Sanctuary split ZIP.\n'
              'MapSystem NPC elements = map UI icon markers, NOT confirmed live monster spawns.\n'
              'Original LIVE Sanctuary server NPC spawns require authoritative server DB or packet logs.\n'
              'Any XML NPC/spawn mentions are unverified metadata references, NOT adopted as game monsters.\n'
              'No modifications to build-slknight-web.yml, monster counts or spawn positions.\n',encoding='utf-8')
          print('PASS V6.5',json.dumps(stats,ensure_ascii=False),flush=True)
          PY_V65
          python3 -m py_compile /tmp/v65-original-xml-audit.py
          python3 /tmp/v65-original-xml-audit.py \
            v64/source-extraction-plan.json \
            original/Sanctuary.of.Aden.-.Copy.z36 \
            v63 reports

      - name: V6.5 Verify source provenance, original XML decoding and result classification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY'
          from pathlib import Path
          import csv,json
          out=Path('reports')
          result=json.loads((out/'v65-results.json').read_text(encoding='utf-8'))
          assert result['version']=='V6.5'
          assert result['sourceXMLTotal']==160
          assert result['archiveMembersIndexed']==15389
          assert result['xmlDecryptionDepths']=={'0':1,'1':80,'2':79}
          assert result['uniqueCanonicalXML']==80
          assert result['duplicateReencryptedXML']==80
          assert result['mapSystemNpcMapIcons']==1122
          assert result['parsedXMLCount']==80
          assert not result['originalMonsterSpawnCoordinatesVerified']
          assert not result['originalMonsterPopulationVerified']
          assert not result['originalServerSpawnDatabaseFound']
          assert not result['sandboxExecutableLaunched']
          assert not result['SLKnightDataModified']
          assert len(list((out/'decoded-xml').glob('*.xml')))==160
          files={x['relativePath']:x for x in json.loads((out/'xml-source-index.json').read_text(encoding='utf-8'))}
          assert files['xml/MapSystem.xml']['rootTag']=='Map_System_Configulation'
          assert files['xml/zone3.xml']['rootTag']=='zoneinfo'
          assert files['xml/CollisionZone.xml']['rootTag']=='CollisionZoneList'
          assert files['xml/ExtMapAttr.xml']['rootTag']=='ExtendedTileAttributes'
          with (out/'npc-map-icons-NOT-spawns.csv').open(encoding='utf-8-sig',newline='') as fp:
              assert sum(1 for row in csv.reader(fp))==1123
          print('PASS V6.5: original XML decryption, 1122 map-UI NPC markers excluded from monster spawns')
          PY_VERIFY

      - name: V6.5 Upload 160 decrypted original client XML and monster reference report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Map-V6.5-All-Original-XML-NPC-and-Spawn-Reference-Evidence
          path: reports/
          if-no-files-found: error
          retention-days: 60
