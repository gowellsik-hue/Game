
# FILE: .github/workflows/audit-sanctuary-maps.yml
# VERSION: V6.2
# INPUT: successful V6.1 artifact 39381626131 (source S32, SEG, Layer3, Layer4, Layer5).
# PURPOSE: compare original paired horizontal/vertical edge rules with V6.1 raw maps.
# SOURCE RULE: https://github.com/tony1223/L1MapViewer/blob/main/plans/passrule_txt.md
# This is a CANDIDATE interpretation, not proof of Sanctuary's actual engine.
# Layer5 5-byte records are correlated with original Layer4 groups, not redrawn.
# No build-slknight-web.yml, original binaries, gameplay, map, or engine changes.
# Preserve original workflow title text, changing ONLY the version from V6.1.
name: audit-sanctuary-maps.yml | V6.2 | Original Knight Scale Audit

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/audit-sanctuary-maps.yml]

permissions:
  actions: read
  contents: read

jobs:
  analyze-native-direction-and-opacity:
    name: V6.2 | S32 directional edges and Layer5-to-Layer4 object linkage
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: V6.2 Restore unmodified validated V6.1 map audit
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39381626131
          name: Sanctuary-Map-V6.1-Original-Collision-and-Wall-Rule-Evidence
          github-token: ${{ github.token }}
          path: v61

      - name: V6.2 Verify source evidence and original provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CHECK'
          import json
          from pathlib import Path
          p=Path('v61')
          summary=json.loads((p/'summary/v61-main.json').read_text(encoding='utf-8'))
          assert summary['sourceBlocks']['s32']==28
          assert summary['sourceBlocks']['seg']==10
          assert summary['attributeDisagreementsS32']==3742
          assert not summary['collisionProven'] and not summary['wallOcclusionProven']
          assert len(list((p/'raw-layers').glob('*-s32/layer3.bin')))==28
          assert len(list((p/'raw-layers').glob('*-s32/layer4.bin')))==28
          assert len(list((p/'raw-layers').glob('*-s32/post-layer4.bin')))==28
          assert (p/'summary/layer7-portal-candidates.json').is_file()
          print('V6.2 PASS: only the authenticated 28 S32 blocks and V6.1 audit are being used')
          PY_CHECK

      - name: V6.2 Compute two-attribute four-direction edges and 39k opacity links
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          cat > /tmp/v62-directional-evidence.py <<'PY_AUDIT'
          from pathlib import Path
          from collections import Counter, defaultdict, deque
          from itertools import product
          import base64, csv, json, struct, sys, html

          root=Path(sys.argv[1]);out=Path(sys.argv[2]);out.mkdir(parents=True,exist_ok=True)
          meta=json.loads((root/'summary/v61-main.json').read_text('utf-8'))
          assert meta['version']=='V6.1' and meta['status']=='EVIDENCE_ONLY_UNVERIFIED_RULES'
          ports=json.loads((root/'summary/layer7-portal-candidates.json').read_text('utf-8'))
          assert len(ports)==20
          source={1:{},2:{}}
          opacity_rows=[];group_counts={1:Counter(),2:Counter()};l5_totals=Counter();s32_count=0
          for folder in sorted((root/'raw-layers').iterdir()):
              if not folder.is_dir() or not folder.name.endswith('-s32'):continue
              floor_str,block,_=folder.name.split('-')
              floor=int(floor_str)
              if floor not in (1,2):continue
              s32_count+=1
              bx=int(block[:4],16);by=int(block[4:],16)
              x0=32704+(bx-32767)*64;y0=32704+(by-32767)*64
              layer3=(folder/'layer3.bin').read_bytes()
              assert len(layer3)==16384,(folder,len(layer3))
              for i,(a,b) in enumerate(struct.iter_unpack('<HH',layer3)):
                  x=x0+i%64;y=y0+i//64
                  assert (x,y) not in source[floor]
                  source[floor][(x,y)]=(a,b)
              layer4=(folder/'layer4.bin').read_bytes()
              group_num=struct.unpack_from('<i',layer4,0)[0]
              pos=4;group_ids=set()
              for gi in range(group_num):
                  gid,n=struct.unpack_from('<hH',layer4,pos);pos+=4
                  group_ids.add(gid);group_counts[floor][gid]+=n
                  pos+=7*n
              assert pos==len(layer4)
              post=(folder/'post-layer4.bin').read_bytes()
              n5=struct.unpack_from('<i',post,0)[0]; assert 0<=n5<=100000
              assert 4+n5*5 <= len(post)
              for i in range(n5):
                  x,y,gid,t=struct.unpack_from('<BBHB',post,4+i*5)
                  exists=gid in group_ids
                  opacity_rows.append((floor,block,x,y,gid,t,int(exists)))
                  l5_totals[(floor,'total')]+=1
                  if not exists:l5_totals[(floor,'unlinked')]+=1
                  l5_totals[(floor,'type_'+str(t))]+=1
          assert s32_count==28 and {f:len(source[f]) for f in (1,2)}=={1:12*4096,2:16*4096}
          assert len(opacity_rows)==39789 and all(x[-1]==1 for x in opacity_rows)

          (out/'csv').mkdir(exist_ok=True);(out/'directional').mkdir(exist_ok=True)
          with (out/'csv/layer5-opacity-group-links.csv').open('w',newline='',encoding='utf-8-sig') as f:
              w=csv.writer(f);w.writerow(['floor','block','rawX','rawY','layer4GroupId','type','groupPresentInSameS32'])
              w.writerows(opacity_rows)

          report={'version':'V6.2','status':'CANDIDATE_ONLY','sourceRun':39381626131,
                  'sourceMap':'S32 priority; SEG not merged','passageRuleReference':'https://github.com/tony1223/L1MapViewer/blob/main/plans/passrule_txt.md',
                  'authenticSanctuaryEngineCodeExamined':False,'actualOriginalPassabilityProven':False,
                  'layer5TransparencyTriggerProven':False,'gameFilesModified':False,
                  'layer5Total':len(opacity_rows),'layer5AllTypes':dict(Counter(str(x[5]) for x in opacity_rows)),
                  'layer5AllReferencesResolveInSameBlock':all(x[-1] for x in opacity_rows),
                  'floorResults':{}}
          page_maps={}
          # Candidate FOUR-direction boundary rules according to L1MapViewer/MapTool research:
          # N(x,y) uses attr1(x,y); S(x,y) uses attr1(x,y+1);
          # W(x,y) uses attr2(x-1,y); E(x,y) uses attr2(x,y).
          # The coordinate-system and engine-identity assumptions are explicitly NOT proven.
          for floor in (1,2):
              grid=source[floor]
              xl=min(x for x,y in grid);yl=min(y for x,y in grid)
              xr=max(x for x,y in grid);yr=max(y for x,y in grid)
              width=xr-xl+1;height=yr-yl+1
              moves={};unrecip=[];pass_dir=Counter()
              dirs=[('N',0,-1,1),('S',0,1,2),('W',-1,0,4),('E',1,0,8)]
              for x,y in grid:
                  bits=0
                  for d,dx,dy,flag in dirs:
                      if (x+dx,y+dy) not in grid:continue
                      if d=='N':v=grid[x,y][0]
                      elif d=='S':v=grid[x,y+1][0]
                      elif d=='W':v=grid[x-1,y][1]
                      else:v=grid[x,y][1]
                      if not(v&1):bits|=flag;pass_dir[d]+=1
                  moves[x,y]=bits
              for (x,y),bits in moves.items():
                  for d,dx,dy,flag in dirs:
                      if bits&flag:
                          other=moves.get((x+dx,y+dy),0)
                          reverse={'N':2,'S':1,'W':8,'E':4}[d]
                          if not(other&reverse):unrecip.append((x,y,d))
              assert not unrecip,unrecip[:4]
              nodes_by_component={};component_of={};cid=0
              for xy in grid:
                  if xy in component_of:continue
                  todo=deque([xy]);component_of[xy]=cid;size=0
                  while todo:
                      x,y=todo.popleft();size+=1;bits=moves[x,y]
                      for d,dx,dy,flag in dirs:
                          n=(x+dx,y+dy)
                          if bits&flag and n not in component_of:
                              component_of[n]=cid;todo.append(n)
                  nodes_by_component[cid]=size;cid+=1
              port_reports=[]
              for p in ports:
                  if p['floor']!=floor:continue
                  x=p['estimatedWorldX'];y=p['estimatedWorldY']
                  own=component_of.get((x,y))
                  around=Counter(component_of[(x+dx,y+dy)] for dx,dy in product(range(-3,4),repeat=2)
                                 if (x+dx,y+dy) in component_of and moves[(x+dx,y+dy)]!=0)
                  port_reports.append({'name':p['name'],'worldX':x,'worldY':y,'targetMapID':p['targetMapID'],
                                       'tileInExtractedS32':own is not None,'componentAtPortal':own,
                                       'localNonIsolatedComponents':around.most_common(4),
                                       'originalWarpDestinationVerified':False})
              arr=bytearray([255])*(width*height)
              for (x,y),mask in moves.items():arr[(y-yl)*width+x-xl]=mask
              (out/f'directional/map-{floor}.bin').write_bytes(arr)
              old_open=sum(not(a&1) for a,b in grid.values())
              nedge=sum(z.bit_count() for z in moves.values())
              pagesize=sum(n>1 for n in nodes_by_component.values())
              stats={'floor':floor,'originX':xl,'originY':yl,'width':width,'height':height,
                     'knownCells':len(grid),'candidateEdgesDirected':nedge,
                     'candidateEdgesUndirected':nedge//2,'directionCounts':dict(pass_dir),
                     'symmetryViolations':len(unrecip),'graphComponentCount':cid,
                     'nonSingletonComponents':pagesize,'largestComponentSizes':sorted(nodes_by_component.values(),reverse=True)[:12],
                     'formerAttr1Bit0ClearCells':old_open,'edgeDerivedNonisolatedCells':sum(z!=0 for z in moves.values()),
                     'layer5OpacityRecords':l5_totals[(floor,'total')],
                     'layer5UnlinkedReferences':l5_totals[(floor,'unlinked')],
                     'portalCandidates':port_reports}
              report['floorResults'][str(floor)]=stats
              page_maps[str(floor)]={'originX':xl,'originY':yl,'width':width,'height':height,
                 'mask64':base64.b64encode(arr).decode(),'portals':[{'x':p['worldX'],'y':p['worldY'],'name':p['name']} for p in port_reports]}
              print('Map',floor,'known',len(grid),'edges',nedge//2,'components',cid,
                    'largest',stats['largestComponentSizes'][:3],'layer5',stats['layer5OpacityRecords'],flush=True)

          (out/'summary-v6.2.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          page='''<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>V6.2 Sanctuary directional passage evidence</title>
          <style>body{font:14px system-ui;background:#141923;color:#eee;padding:12px}canvas{max-width:98vw;image-rendering:pixelated;background:#080a10;border:1px solid #637}
          select,button{font:inherit}small{display:block;color:#b9cadb;margin:10px 0}</style>
          <h2>V6.2 / Sanctuary S32 directional passage candidate</h2>
          <label>Floor <select id="floor"><option value="1">1F</option><option value="2">2F</option></select></label>
          <label>View <select id="mode"><option value="directions">4-direction openness</option><option value="solid">isolated vs directional</option></select></label>
          <p id="stat"></p><canvas id="cv"></canvas><p id="point"></p>
          <small>Source: V6.1 raw S32 Layer3, candidate rule from public L1MapViewer/MapTool notes. White=4 directions; blue=2-3; amber=1; grey=isolated; yellow=unverified portal. THIS IS NOT A PROVEN NATIVE ENGINE RUNTIME.</small>
          <script id="data" type="application/json">__DATA__</script><script>
          'use strict';const maps=JSON.parse(document.getElementById('data').textContent);let m,raw;
          const sel=document.getElementById('floor'),mode=document.getElementById('mode'),cv=document.getElementById('cv'),ctx=cv.getContext('2d');
          function paint(){m=maps[sel.value];raw=Uint8Array.from(atob(m.mask64),c=>c.charCodeAt(0));cv.width=m.width;cv.height=m.height;
          const image=ctx.createImageData(m.width,m.height);let total=0;
          for(let i=0;i<raw.length;i++){const v=raw[i],k=i*4,degree=(v&1?1:0)+(v&2?1:0)+(v&4?1:0)+(v&8?1:0);
          let c=v===255?[2,4,8]:v===0?[58,64,77]:degree===1?[231,171,62]:degree===2?[76,135,221]:[224,236,239];
          if(mode.value==='solid'&&v!==255)c=v===0?[76,78,82]:[114,174,132];
          image.data[k]=c[0];image.data[k+1]=c[1];image.data[k+2]=c[2];image.data[k+3]=255;if(v!==255)total++}
          ctx.putImageData(image,0,0);for(const p of m.portals){const x=p.x-m.originX,y=p.y-m.originY;if(x<0||y<0||x>=m.width||y>=m.height)continue;ctx.fillStyle='#ffe04d';ctx.fillRect(x-1,y-1,3,3)}
          cv.style.width=Math.min(window.innerWidth-45,m.width*2)+'px';
          document.getElementById('stat').textContent=`floor ${sel.value}: ${total} S32 source cells, ${m.width}x${m.height} bounds`}
          sel.onchange=paint;mode.onchange=paint;cv.addEventListener('pointerup',e=>{const r=cv.getBoundingClientRect();const x=Math.floor((e.clientX-r.left)/r.width*cv.width),y=Math.floor((e.clientY-r.top)/r.height*cv.height);if(x<0||y<0||x>=cv.width||y>=cv.height)return;const v=raw[y*cv.width+x];document.getElementById('point').textContent=`world ${m.originX+x},${m.originY+y}: ${v===255?'no block': 'candidate directional bits '+v.toString(2).padStart(4,'0')}`});paint();
          </script>'''
          (out/'directional-preview-v6.2.html').write_text(page.replace('__DATA__',json.dumps(page_maps,ensure_ascii=False,separators=(',',':')).replace('<','\\u003c')),encoding='utf-8')
          (out/'README.txt').write_text('''V6.2 S32 candidate analysis ONLY.
          Passage algorithm source: https://github.com/tony1223/L1MapViewer/blob/main/plans/passrule_txt.md
          Layer3: attr1 controls N/S edges, attr2 controls W/E edges in cited community algorithm.
          Layer5: X,Y,GroupId,Type (5 bytes each), group references tested against Layer4.
          Not verified to be Sanctuary executable client or server movement implementation.
          Layer5 associations DO NOT prove fade alpha or trigger mechanism.
          No map collision, rendering, events, or build-slknight-web.yml changes made.
          ''',encoding='utf-8')
          assert report['floorResults']['1']['layer5OpacityRecords']==16646
          assert report['floorResults']['2']['layer5OpacityRecords']==23143
          print('V6.2 PASS direction data and opacity linkage; all evidence-only, no game code changed')
          PY_AUDIT
          python3 /tmp/v62-directional-evidence.py v61 audit

      - name: V6.2 Verify portal connectivity candidate and independent wall references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_FINAL'
          import csv,json
          from pathlib import Path
          p=Path('audit');r=json.loads((p/'summary-v6.2.json').read_text('utf-8'))
          assert r['status']=='CANDIDATE_ONLY'
          assert not r['actualOriginalPassabilityProven']
          assert not r['layer5TransparencyTriggerProven']
          assert r['gameFilesModified'] is False
          assert r['layer5Total']==39789 and r['layer5AllTypes']=={'0':39789}
          assert r['layer5AllReferencesResolveInSameBlock']
          counts=[]
          for f,expected,edge,portals in [('1',49152,9857,6),('2',65536,20876,14)]:
              z=r['floorResults'][f]
              assert z['knownCells']==expected and z['candidateEdgesUndirected']==edge
              assert z['symmetryViolations']==0 and z['layer5UnlinkedReferences']==0
              assert len(z['portalCandidates'])==portals
              path=p/f'directional/map-{f}.bin'
              assert path.stat().st_size==z['width']*z['height']
              counts.append(z['layer5OpacityRecords'])
          assert counts==[16646,23143]
          with (p/'csv/layer5-opacity-group-links.csv').open(encoding='utf-8-sig',newline='') as f:
              assert sum(1 for _ in csv.reader(f))==39790
          assert (p/'directional-preview-v6.2.html').stat().st_size>10000
          print('V6.2 PASS: 2 floors, 30733 symmetric edge connections, 39789 layer5 group links; no game changes')
          PY_FINAL
          python3 - <<'PY_JS'
          from pathlib import Path
          import re
          s=Path('audit/directional-preview-v6.2.html').read_text('utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert len(scripts)==1
          Path('/tmp/v62-preview.js').write_text(scripts[0],encoding='utf-8')
          PY_JS
          node --check /tmp/v62-preview.js

      - name: V6.2 Upload candidate passage and original Layer5 object-link audit only
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Map-V6.2-Original-Directional-and-Opacity-Link-Evidence
          path: audit/
          if-no-files-found: error
          retention-days: 60
