
# FILE: .github/workflows/audit-sanctuary-maps.yml
# VERSION: V6.1
# PURPOSE: Evidence-only reverse audit of Sanctuary map movement and wall rules.
# KEEP: existing workflow name format (version number only changed).
# KEEP: verified V6.0 knight sprite-scale output as a separate evidence job.
# DO NOT modify build-slknight-web.yml, gameplay, passability or map assets.
# SOURCE: exact original S32/SEG/XML extracted in the successful V2 run.
# WARNING: Attribute1 bit0 is a CANDIDATE, not proven Sanctuary collision.
name: audit-sanctuary-maps.yml | V6.1 | Original Knight Scale Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/audit-sanctuary-maps.yml]

permissions:
  contents: read
  actions: read

jobs:
  native-map-rule-evidence:
    name: V6.1 | Original S32 SEG movement and wall forensic audit
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: V6.1 Restore original V2 archive evidence (no new approximations)
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39045175890
          name: Sanctuary-TI-Dungeon-V2-Raw-and-Layer3
          github-token: ${{ github.token }}
          path: original-v2

      - name: V6.1 Verify original extraction SHA256 and expected file coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CHECK'
          from pathlib import Path
          import json,hashlib
          root=Path('original-v2')
          manifest=json.loads((root/'reports/extraction-manifest.json').read_text(encoding='utf-8'))
          assert len(manifest)==44,('Unexpected source count',len(manifest))
          for entry in manifest:
              file=root/'extracted'/entry['path']
              assert file.is_file(),entry['path']
              assert file.stat().st_size==entry['bytes'],entry['path']
              assert hashlib.sha256(file.read_bytes()).hexdigest()==entry['sha256'],entry['path']
              assert entry['crc32Verified'],entry['path']
          maps=list((root/'extracted/map').rglob('*.s32'))
          segs=list((root/'extracted/map').rglob('*.seg'))
          assert (len(maps),len(segs))==(28,10),(len(maps),len(segs))
          assert all((root/'extracted/xml'/name).is_file() for name in (
              'CollisionZone.xml','ExtMapAttr.xml','MapSystem.xml',
              'MapSystem86.xml','map_config.xml','zone3.xml'))
          assert sum(e.get('portalCandidateCount',0) for e in manifest)==20
          print('PASS: 44 authentic map binaries, all SHA256/ZIP CRC verified; 20 unverified portal candidates')
          PY_CHECK

      - name: V6.1 Decode BOTH Layer3 attributes and preserve ALL layers and XML bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/csv audit/raw-layers audit/xml audit/summary
          cat > /tmp/audit-map-rules-v61.py <<'PY_V61'
          from pathlib import Path
          from collections import Counter,defaultdict,deque
          import base64,csv,hashlib,json,math,struct,sys,zlib
          import xml.etree.ElementTree as ET

          source=Path(sys.argv[1]); out=Path(sys.argv[2]);
          manifest=json.loads((source/'reports/extraction-manifest.json').read_text(encoding='utf-8'))
          index={e['path']:e for e in manifest}
          def digest(raw):return hashlib.sha256(raw).hexdigest()
          def emit(obj,path):
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(json.dumps(obj,ensure_ascii=False,indent=2),encoding='utf-8')
          def take(data,position,length,where):
              if length<0 or position<0 or position+length>len(data):
                  raise ValueError(f'Truncated {where} at {position}: {length}/{len(data)}')
              return data[position:position+length]
          def pair_layer(data,pos,fmt):
              st=struct.Struct(fmt)
              raw=take(data,pos,4096*st.size,'layer3')
              pairs=[xy for xy in st.iter_unpack(raw)]
              assert len(pairs)==4096
              return pairs,raw
          def count_components(grid,w,h,bit):
              # Provisional bit test only, NOT the original engine's movement rule.
              traversable=[((v[bit]&1)==0) for v in grid]
              seen=bytearray(w*h);sizes=[]
              for i,open_ in enumerate(traversable):
                  if not open_ or seen[i]:continue
                  q=deque([i]);seen[i]=1;n=0
                  while q:
                      cur=q.popleft();n+=1;x=cur%w;y=cur//w
                      for dx,dy in ((1,0),(-1,0),(0,1),(0,-1)):
                          xx=x+dx;yy=y+dy
                          if 0<=xx<w and 0<=yy<h:
                              ni=yy*w+xx
                              if not seen[ni] and traversable[ni]:
                                  seen[ni]=1;q.append(ni)
                  sizes.append(n)
              return {'openCells':sum(traversable),'componentCount':len(sizes),
                      'topComponentSizes':sorted(sizes,reverse=True)[:12]}

          tile_summary=[]; raw_attrs={}; portals=[]; violations=[]
          totals=Counter(); all_raw={}; layer3_csv=out/'csv/layer3-all-values.csv'
          layer4_csv=out/'csv/layer4-objects-raw.csv'
          layer5_csv=out/'csv/layer5-6-7-candidates.csv'
          f3=layer3_csv.open('w',encoding='utf-8-sig',newline='')
          f4=layer4_csv.open('w',encoding='utf-8-sig',newline='')
          f5=layer5_csv.open('w',encoding='utf-8-sig',newline='')
          w3=csv.writer(f3);w4=csv.writer(f4);w5=csv.writer(f5)
          w3.writerow(['floor','sourceFile','format','worldX','worldY','cellX','cellY','attr1','attr2',
                       'attr1_hex','attr2_hex','firstBitDiffers','fullValueDiffers'])
          w4.writerow(['floor','sourceFile','format','groupIndex','groupID','objectIndex','rawHex'])
          w5.writerow(['floor','sourceFile','layer','index','rawHex','parsedValue','confidence'])
          for filepath in sorted((source/'extracted/map').rglob('*')):
              if filepath.suffix.lower() not in ('.s32','.seg'):continue
              floor=int(filepath.parent.name);ext=filepath.suffix.lower()[1:]
              rel=f'map/{floor}/{filepath.name}'
              data=filepath.read_bytes()
              assert digest(data)==index[rel]['sha256'],rel
              block=filepath.stem;bx=int(block[:4],16);by=int(block[4:],16)
              startx=(bx-0x7fff)*64+0x7fff-63
              starty=(by-0x7fff)*64+0x7fff-63
              stride=4 if ext=='s32' else 2
              tile_size=64*128*stride
              l1=take(data,0,tile_size,'layer1')
              pos=tile_size
              n2=struct.unpack('<H',take(data,pos,2,'layer2 count'))[0];pos+=2
              l2_stride=6 if ext=='s32' else 4
              l2=take(data,pos,n2*l2_stride,'layer2 objects');pos+=len(l2)
              layer3_start=pos
              pairs,l3=pair_layer(data,pos,'<HH' if ext=='s32' else '<BB')
              pos+=len(l3)
              assert layer3_start==index[rel]['layer3Start'],(rel,'Layer3 offset mismatch')
              count4=struct.unpack('<i',take(data,pos,4,'layer4 groups'))[0];pos+=4
              assert 0<=count4<=5000,(rel,'Bad Layer4 group count',count4)
              groups=[];objects=0;first_groups=[];l4_start=pos-4
              for gi in range(count4):
                  groupid,num=struct.unpack('<hH',take(data,pos,4,'layer4 group header'));pos+=4
                  assert num<=10000,(rel,gi,num)
                  payload=take(data,pos,num*(7 if ext=='s32' else 5),'layer4 payload')
                  size=7 if ext=='s32' else 5
                  for oi in range(num):
                      w4.writerow([floor,rel,ext,gi,groupid,oi,payload[oi*size:(oi+1)*size].hex()])
                  pos+=len(payload);objects+=num
                  if len(first_groups)<10:first_groups.append([groupid,num])
              l4=take(data,l4_start,pos-l4_start,'layer4 exact binary')
              after_layer4=pos
              extensions={'extensionBytes':len(data)-pos,'status':'notDecoded','records':[]}
              if ext=='s32':
                  try:
                      p=pos
                      n5=struct.unpack('<i',take(data,p,4,'layer5 count'))[0];p+=4
                      if not 0<=n5<=100000:raise ValueError('layer5 count out of range')
                      five=take(data,p,n5*5,'layer5 bytes');p+=len(five)
                      n6=struct.unpack('<i',take(data,p,4,'layer6 count'))[0];p+=4
                      if not 0<=n6<=100000:raise ValueError('layer6 count out of range')
                      six=take(data,p,n6*4,'layer6 bytes');p+=len(six)
                      n7=struct.unpack('<H',take(data,p,2,'layer7 count'))[0];p+=2
                      if n7>500:raise ValueError('layer7 count out of range')
                      for k in range(n5):w5.writerow([floor,rel,'layer5',k,five[k*5:k*5+5].hex(),'','raw-only'])
                      for k in range(n6):w5.writerow([floor,rel,'layer6',k,six[k*4:k*4+4].hex(),'','raw-only'])
                      for pi in range(n7):
                          name_len=take(data,p,1,'layer7 name length')[0];p+=1
                          text_bytes=take(data,p,name_len,'layer7 portal name');p+=name_len
                          xy_map=take(data,p,8,'layer7 portal fields');p+=8
                          xx,yy,destination,portalid=struct.unpack('<BBHI',xy_map)
                          name=text_bytes.decode('cp949',errors='replace')
                          portal={'floor':floor,'sourceFile':rel,'name':name,'localX':xx,'localY':yy,
                                  'estimatedWorldX':startx+xx//2,'estimatedWorldY':starty+yy,
                                  'targetMapID':destination,'portalID':portalid,
                                  'destinationCoordinateVerified':False}
                          portals.append(portal)
                          w5.writerow([floor,rel,'layer7',pi,(bytes([name_len])+text_bytes+xy_map).hex(),
                                       json.dumps(portal,ensure_ascii=False),'unverified-candidate'])
                      extensions={'status':'parsed-as-candidates','layer5Count':n5,'layer6Count':n6,
                                  'layer7Count':n7,'trailingBytes':len(data)-p,
                                  'trailingSHA256':digest(data[p:]) if p<len(data) else None}
                  except (ValueError,struct.error) as e:
                      extensions={'status':'undecoded-extension','reason':str(e),
                                  'extensionBytes':len(data)-after_layer4}
              outblock=out/'raw-layers'/f'{floor}-{block}-{ext}'
              outblock.mkdir(parents=True,exist_ok=True)
              for name,chunk in [('layer1.bin',l1),('layer2.bin',l2),('layer3.bin',l3),
                                 ('layer4.bin',l4),('post-layer4.bin',data[after_layer4:])]:
                  (outblock/name).write_bytes(chunk)
              diffs=0;bitdiff=0;bits_a=Counter();bits_b=Counter()
              for i,(a,b) in enumerate(pairs):
                  x=i%64;y=i//64
                  worldx=startx+x;worldy=starty+y
                  delta=int(a!=b);mismatch=int((a&1)!=(b&1))
                  diffs+=delta;bitdiff+=mismatch
                  for bit in range(16):
                      bits_a[bit]+=bool(a&(1<<bit));bits_b[bit]+=bool(b&(1<<bit))
                  w3.writerow([floor,rel,ext,worldx,worldy,x,y,a,b,hex(a),hex(b),mismatch,delta])
              counta=Counter(a for a,b in pairs);countb=Counter(b for a,b in pairs)
              record={'floor':floor,'sourceFile':rel,'extension':ext,
                      'startWorld':[startx,starty],'bytes':len(data),'sourceSHA256':digest(data),
                      'layer1Records':8192,'layer1Stride':stride,'layer1SHA256':digest(l1),
                      'layer2Records':n2,'layer2Stride':l2_stride,'layer2SHA256':digest(l2),
                      'layer3Offset':layer3_start,'layer3Records':4096,
                      'attr1Histogram':dict(sorted(counta.items())),
                      'attr2Histogram':dict(sorted(countb.items())),
                      'attr1SetBits':dict(sorted(bits_a.items())),
                      'attr2SetBits':dict(sorted(bits_b.items())),
                      'attributesDifferent':diffs,'firstBitDifferent':bitdiff,
                      'layer4Groups':count4,'layer4ObjectCount':objects,
                      'sampleLayer4Groups':first_groups,'afterLayer4Offset':after_layer4,
                      'remainingBytes':len(data)-after_layer4,'extensionEvidence':extensions,
                      'meaningOfAttributes':'UNVERIFIED',
                      'actualOriginalCollisionRuleVerified':False}
              tile_summary.append(record)
              raw_attrs[(floor,block,ext)]=pairs
              totals['mapBlocks']+=1;totals['cells']+=4096
              totals['attrDifferent']+=diffs;totals['bit0Different']+=bitdiff
              totals['objects']+=objects
              totals['s32' if ext=='s32' else 'seg']+=1
              print('SOURCE',rel,'A != B:',diffs,'bit0 differs:',bitdiff,
                    'objects:',objects,'extension:',extensions['status'],flush=True)
          f3.close();f4.close();f5.close()
          assert (totals['s32'],totals['seg'])==(28,10),totals
          # Matched S32/SEG are ALTERNATE FILES, not proven equivalent collision layers.
          comparisons=[]
          for floor,block,ext in sorted(raw_attrs):
              if ext!='s32' or (floor,block,'seg') not in raw_attrs:continue
              a=raw_attrs[(floor,block,'s32')];b=raw_attrs[(floor,block,'seg')]
              comparisons.append({'floor':floor,'block':block,
                                  'attr1Changed':sum(x[0]!=y[0] for x,y in zip(a,b)),
                                  'attr2Changed':sum(x[1]!=y[1] for x,y in zip(a,b)),
                                  'eitherChanged':sum(x!=y for x,y in zip(a,b)),
                                  'semanticsUnverified':True})
          assert len(comparisons)==10,len(comparisons)
          emit(tile_summary,out/'summary/source-map-layers.json')
          emit(comparisons,out/'summary/s32-vs-seg-comparison.json')
          emit(portals,out/'summary/layer7-portal-candidates.json')
          # V2's known portal records are ground-truth CANDIDATE counts only.
          expected_portals=sum(e.get('portalCandidateCount',0) for e in manifest)
          assert expected_portals==20,expected_portals
          if len(portals)!=20:
              violations.append('Layer7 parsing count differs from the V2 candidate tally; do not infer destinations')

          xml_reports=[]
          def entropy(data):
              if not data:return 0.0
              counts=Counter(data)
              return round(-sum((n/len(data))*math.log2(n/len(data)) for n in counts.values()),4)
          for path in sorted((source/'extracted/xml').glob('*.xml')):
              raw=path.read_bytes()
              # Preserve XML-like named files as bytes; most begin X?xm, NOT plain XML.
              (out/'xml'/path.name).write_bytes(raw)
              is_plain=raw.lstrip().startswith((b'<?xml',b'<'))
              probe=[];actual_xml=False
              if is_plain:
                  try:ET.fromstring(raw);actual_xml=True
                  except ET.ParseError:pass
              if not actual_xml:
                  for off in (4,8,16,20,24,32):
                      try:
                          raw_dec=zlib.decompress(raw[off:])
                          if len(raw_dec)>2000000:continue
                          ET.fromstring(raw_dec)
                          (out/'xml'/(path.name+'.decoded.xml')).write_bytes(raw_dec)
                          probe.append({'offset':off,'validXML':True,'decodedBytes':len(raw_dec)})
                          actual_xml=True;break
                      except (zlib.error,ET.ParseError):pass
              xml_reports.append({'file':path.name,'bytes':len(raw),'sha256':digest(raw),
                                  'signatureASCII':''.join(chr(c) if 32<=c<=126 else '.' for c in raw[:16]),
                                  'first32Hex':raw[:32].hex(),'entropyBitsPerByte':entropy(raw),
                                  'startsWithXQuestionXm':raw.startswith(b'X?xm'),
                                  'headerFirst20Hex':raw[:20].hex(),
                                  'readableXMLVerified':actual_xml,
                                  'probe':probe,
                                  'decodingRule':'UNVERIFIED' if not actual_xml else 'XML syntax verified'})
          assert len(xml_reports)==6,len(xml_reports)
          emit(xml_reports,out/'summary/xml-binary-container-evidence.json')
          # Compare positions of the two independent attributes at a global 1F/2F scale.
          differences=[]
          for rec in tile_summary:
              if rec['extension']!='s32':continue
              if not rec['attributesDifferent']:continue
              key=(rec['floor'],Path(rec['sourceFile']).stem,'s32')
              x0,y0=rec['startWorld']
              for idx,(a,b) in enumerate(raw_attrs[key]):
                  if a==b:continue
                  differences.append([rec['floor'],x0+idx%64,y0+idx//64,a,b,rec['sourceFile']])
          with (out/'csv/s32-attribute-disagreements.csv').open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.writer(f);w.writerow(['floor','worldX','worldY','attribute1','attribute2','sourceFile'])
              w.writerows(differences)
          emit({'version':'V6.1','status':'EVIDENCE_ONLY_UNVERIFIED_RULES',
                'source':'Sanctuary original V2 map/1 and map/2 (ZIP CRC and SHA256 verified)',
                'sourceBlocks':dict(totals),'attributeDisagreementsS32':len(differences),
                'pairwiseS32SegComparisons':len(comparisons),
                'portalCandidatesV2':expected_portals,'portalCandidatesParsed':len(portals),
                'xmlNamedBinaryFiles':len(xml_reports),
                'collisionProven':False,'wallOcclusionProven':False,
                'originalEngineVerified':False,'sourceRouteVerified':False,
                'warnings':violations},out/'summary/v61-main.json')
          note='''V6.1 | Sanctuary map-rule evidence ONLY
          
          1. Source files: 28 original S32 and 10 SEG in map/1 and map/2.
          2. Both independent Layer3 attributes are dumped IN FULL with world coordinates.
          3. S32 and SEG may represent different layers; differences do NOT establish which is collision.
          4. Layers1/2/3/4 and all post-Layer4 bytes are preserved for each block.
          5. Layer4 objects contain unknown binary fields. Do NOT assume wall footprints from them.
          6. Named XML files are X?xm-format binary; readable-XML probe results are in JSON.
          7. Layer7 portals are candidate entry records. DESTINATION COORDINATES NOT VERIFIED.
          8. Source collision algorithm and transparent-wall draw order require executable/code evidence.
          9. No game/YML runtime files are altered and no inferred collision is applied.
          
          PRIMARY RESULTS:
          summary/v61-main.json
          csv/layer3-all-values.csv
          csv/s32-attribute-disagreements.csv
          csv/layer4-objects-raw.csv
          csv/layer5-6-7-candidates.csv
          summary/xml-binary-container-evidence.json
          summary/s32-vs-seg-comparison.json
          summary/layer7-portal-candidates.json
          raw-layers/*/*.bin and xml/*.xml
          '''
          (out/'README.txt').write_text('\n'.join(x.strip() for x in note.splitlines())+'\n',encoding='utf-8')
          print('PASS V6.1 source evidence: 28 S32, 10 SEG, 6 binary XML,',
                len(differences),'S32 coordinate disagreements; collision NOT yet proven')
          PY_V61
          python3 /tmp/audit-map-rules-v61.py original-v2 audit

      - name: V6.1 Check generated audit; forbid guesses or applied game changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY'
          from pathlib import Path
          import csv,json
          p=Path('audit')
          main=json.loads((p/'summary/v61-main.json').read_text(encoding='utf-8'))
          assert main['status']=='EVIDENCE_ONLY_UNVERIFIED_RULES'
          assert not main['collisionProven'] and not main['wallOcclusionProven']
          assert main['sourceBlocks']['s32']==28 and main['sourceBlocks']['seg']==10
          assert len(json.loads((p/'summary/source-map-layers.json').read_text()))==38
          assert len(json.loads((p/'summary/s32-vs-seg-comparison.json').read_text()))==10
          assert len(json.loads((p/'summary/xml-binary-container-evidence.json').read_text()))==6
          with (p/'csv/layer3-all-values.csv').open(encoding='utf-8-sig',newline='') as f:
              count=sum(1 for row in csv.reader(f))-1
          assert count==38*4096,('Missing original layer3 values',count)
          assert len(list(p.glob('raw-layers/*/layer1.bin')))==38
          assert len(list(p.glob('raw-layers/*/layer3.bin')))==38
          assert len(list(p.glob('xml/*.xml')))==6
          print('PASS 155648 Layer3 full records; 38 original blocks; 6 original binary XML files')
          PY_VERIFY

      - name: V6.1 Upload map movement and wall rule forensic evidence
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Map-V6.1-Original-Collision-and-Wall-Rule-Evidence
          path: audit/
          if-no-files-found: error
          retention-days: 60

  preserve-v60-knight-evidence:
    name: V6.1 | Preserve verified V6.0 knight scale evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: V6.1 Restore the last successful V6.0 knight-scale evidence
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39189983981
          name: Sanctuary-V6.0-Knight-Sprite-Scale-Evidence
          github-token: ${{ github.token }}
          path: legacy-v60

      - name: V6.1 Verify preserved V6.0 knight audit is intact
        shell: bash
        run: |
          set -euo pipefail
          test -s legacy-v60/scale-audit.json
          test -s legacy-v60/frames/character-scale-candidates.json
          test -s legacy-v60/frames/original-vs-single-knight.png
          test -s legacy-v60/Sprite.idx.original
          python3 - <<'PY_SCALE'
          import json
          from pathlib import Path
          p=Path('legacy-v60')
          report=json.loads((p/'scale-audit.json').read_text(encoding='utf-8'))
          assert report, 'Original sprite scale audit was empty'
          assert len(list((p/'frames').glob('61-*.png')))>=16
          print('PASS original V6.0 knight-scale evidence preserved. No sprite modifications.')
          PY_SCALE

      - name: V6.1 Re-upload preserved original knight scale results
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-V6.1-Preserved-V6.0-Knight-Scale-Evidence
          path: legacy-v60/
          if-no-files-found: error
          retention-days: 60
