
# FILE: .github/workflows/audit-sanctuary-maps.yml
# VERSION: V4.1 / Original terrain movement
name: V4.1 | TI Dungeon Original Terrain Movement

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/audit-sanctuary-maps.yml]

permissions:
  actions: read
  contents: read

jobs:
  terrain-movement:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: V4.1 Restore verified V4.0 maps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reports
          gh run download 39099232450 -R "$GITHUB_REPOSITORY" -n Sanctuary-TI-Dungeon-V4.0-Runtime-Map -D reports
          test -s reports/runtime-v4.0.json
          test -s reports/preview/map-index.json

      - name: V4.1 Build original terrain walking preview
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,re,struct
          from pathlib import Path

          root=Path('reports')
          preview=root/'preview'
          src=json.loads((root/'runtime-v4.0.json').read_text())
          index=json.loads((preview/'map-index.json').read_text())
          assert src['version']=='V4.0'
          pack={}

          for mid,expected in (('1',12),('2',16)):
              m=src['maps'][mid]
              tiles=m['tiles']
              assert len(tiles)==expected
              assert len(base64.b64decode(m['collisionBase64']))==m['width']*m['height']

              for t in tiles:
                  head=(preview/t['src']).open('rb').read(24)
                  assert head[:8]==b'\x89PNG\r\n\x1a\n'
                  assert struct.unpack('>II',head[16:24])==(1536,768)

              def projected(wx,wy):
                  bx=(wx-32704)//64+32767
                  by=(wy-32704)//64+32767
                  key=f'{bx:04x}{by:04x}.png'
                  block=next((t for t in tiles if t['src'].endswith('/'+key)),None)
                  if not block:return None
                  dx=wx-(32704+(bx-32767)*64)
                  dy=wy-(32704+(by-32767)*64)
                  return block['x']+12*(dx+dy),block['y']+378+6*(dy-dx)

              start=m['spawnForMovementTest']
              assert projected(start['x'],start['y']) is not None
              assert all(projected(p['x'],p['y']) for p in m['portals'])
              assert len(m['portals'])==(6 if mid=='1' else 14)

              m['mapWidth']=index[mid]['width']
              m['mapHeight']=index[mid]['height']
              pack[mid]=m

          page=r"""<!doctype html><html lang="ko">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>TI Dungeon V4.1 Original Terrain Movement</title>
          <style>
          *{box-sizing:border-box}
          body{margin:0;background:#101823;color:#eff7ff;font:14px system-ui}
          header{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:7px}
          button,select{font:inherit;background:#293c53;color:#fff;border:1px solid #5f748c;border-radius:7px;padding:7px}
          #scene{height:calc(100dvh - 208px);min-height:185px;overflow:hidden;position:relative;background:#070d13;touch-action:none}
          #world{position:absolute;left:0;top:0;transform-origin:0 0}
          #world img{position:absolute;max-width:none;image-rendering:pixelated;pointer-events:none}
          .pin{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
          .portal{width:13px;height:13px;background:#ffe061;border:2px solid #483000;border-radius:50%;opacity:.8;z-index:2}
          #player{width:19px;height:19px;background:#fa536c;border:3px solid white;border-radius:50%;box-shadow:0 0 9px #f56;z-index:9}
          #pad{display:grid;grid-template-columns:repeat(3,67px);gap:5px;justify-content:center;margin:7px}
          #pad button{height:40px;font-size:22px;touch-action:none;padding:0}
          #state{padding:4px 9px;min-height:22px}
          small{color:#abc0d4}
          </style>

          <header>
          <b>TI Dungeon V4.1</b>
          <select id="floor"><option value="1">1F</option><option value="2">2F</option></select>
          <select id="jump"><option value="">Start</option></select>
          <button id="minus">-</button><button id="plus">+</button>
          <a href="index.html" style="color:#cce7ff">Map</a>
          </header>

          <div id="scene"><div id="world"></div></div>
          <div id="state"></div>
          <div id="pad">
          <span></span><button data-dir="0,-1">&#9650;</button><span></span>
          <button data-dir="-1,0">&#9664;</button><button data-dir="0,1">&#9660;</button><button data-dir="1,0">&#9654;</button>
          </div>
          <small style="display:block;text-align:center">Original terrain. Collision bit 0 is provisional. Yellow = portal candidate; no automatic warp.</small>

          <script id="data" type="application/json">__DATA__</script>
          <script>
          'use strict';
          const maps=JSON.parse(document.getElementById('data').textContent);
          const floor=document.getElementById('floor');
          const jump=document.getElementById('jump');
          const world=document.getElementById('world');
          const scene=document.getElementById('scene');
          const state=document.getElementById('state');
          let map,mask,x,y,scale=1,player,repeat=null;

          function placement(wx,wy){
            const bx=Math.floor((wx-32704)/64)+32767;
            const by=Math.floor((wy-32704)/64)+32767;
            const key=bx.toString(16).padStart(4,'0')+by.toString(16).padStart(4,'0')+'.png';
            const block=map.tiles.find(t=>t.src.endsWith('/'+key));
            if(!block)return null;
            const sx=32704+(bx-32767)*64,sy=32704+(by-32767)*64;
            const dx=wx-sx,dy=wy-sy;
            return {x:block.x+12*(dx+dy),y:block.y+378+6*(dy-dx)};
          }

          function camera(){
            const p=placement(x,y);
            if(!p){state.textContent='Unmapped coordinate';return;}
            player.style.left=p.x+'px';
            player.style.top=p.y+'px';
            world.style.transform=`translate(${scene.clientWidth/2-p.x*scale}px,${scene.clientHeight/2-p.y*scale}px) scale(${scale})`;
            const near=map.portals.filter(v=>Math.abs(v.x-x)<=1&&Math.abs(v.y-y)<=1).map(v=>v.name).join(', ');
            state.textContent=`Map ${map.mapId} | X ${x}, Y ${y} | zoom ${scale.toFixed(2)}${near?' | portal: '+near:''}`;
          }

          function walk(dx,dy){
            const nx=x+dx,ny=y+dy,ix=nx-map.originX,iy=ny-map.originY;
            if(ix<0||iy<0||ix>=map.width||iy>=map.height)return;
            const v=mask[iy*map.width+ix];
            if(v===255||(v&1)||!placement(nx,ny))return;
            x=nx;y=ny;camera();
          }

          function stop(){
            if(repeat!==null){clearInterval(repeat);repeat=null;}
          }

          function open(){
            stop();
            map=maps[floor.value];
            mask=Uint8Array.from(atob(map.collisionBase64),c=>c.charCodeAt(0));
            x=map.spawnForMovementTest.x;
            y=map.spawnForMovementTest.y;
            world.replaceChildren();
            world.style.width=map.mapWidth+'px';
            world.style.height=map.mapHeight+'px';

            for(const t of map.tiles){
              const im=new Image();
              im.src=t.src;
              im.style.left=t.x+'px';
              im.style.top=t.y+'px';
              im.width=1536;im.height=768;im.draggable=false;
              world.append(im);
            }
            for(const p of map.portals){
              const pos=placement(p.x,p.y);
              if(!pos)continue;
              const dot=document.createElement('div');
              dot.className='pin portal';
              dot.style.left=pos.x+'px';
              dot.style.top=pos.y+'px';
              dot.title=p.name+' (unverified portal)';
              world.append(dot);
            }

            player=document.createElement('div');
            player.id='player';player.className='pin';
            world.append(player);
            jump.replaceChildren(new Option('Start',''));
            map.portals.forEach(p=>{
              const option=new Option(p.name,p.name);
              option.disabled=!p.nearestWalkable;
              jump.add(option);
            });
            camera();
          }

          floor.onchange=open;
          jump.onchange=()=>{
            if(!jump.value){
              x=map.spawnForMovementTest.x;y=map.spawnForMovementTest.y;
            }else{
              const p=map.portals.find(v=>v.name===jump.value);
              if(!p||!p.nearestWalkable)return;
              x=p.nearestWalkable.x;y=p.nearestWalkable.y;
            }
            camera();
          };

          document.getElementById('minus').onclick=()=>{scale=Math.max(.5,scale/1.25);camera()};
          document.getElementById('plus').onclick=()=>{scale=Math.min(2.5,scale*1.25);camera()};

          for(const b of document.querySelectorAll('[data-dir]')){
            const [dx,dy]=b.dataset.dir.split(',').map(Number);
            b.onpointerdown=e=>{
              e.preventDefault();stop();walk(dx,dy);
              repeat=setInterval(()=>walk(dx,dy),130);
            };
            b.onpointerup=b.onpointercancel=b.onpointerleave=stop;
          }
          window.addEventListener('pointerup',stop);
          document.onkeydown=e=>{
            const dir={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],KeyW:[0,-1],KeyS:[0,1],KeyA:[-1,0],KeyD:[1,0]}[e.code];
            if(dir){e.preventDefault();walk(...dir);}
          };
          window.addEventListener('resize',()=>{if(player)camera()});
          open();
          </script></html>"""

          (preview/'terrain-walk-v4.1.html').write_text(
              page.replace('__DATA__',json.dumps(pack,ensure_ascii=False,separators=(',',':')).replace('<','\\u003c')),
              encoding='utf-8'
          )
          index_file=preview/'index.html'
          index_html=index_file.read_text(encoding='utf-8')
          assert '</header>' in index_html
          index_file.write_text(
              index_html.replace('</header>',' <a href="terrain-walk-v4.1.html" style="color:#ffd86f">V4.1 WALK</a></header>',1),
              encoding='utf-8'
          )
          (root/'terrain-walk-v4.1-check.json').write_text(json.dumps({
              'version':'V4.1','terrainBlocks':28,'floorTiles':229376,
              'portalCandidates':20,'actualWarpDestinationsVerified':0,
              'monsterSpawnsVerified':0
          },indent=2))
          script=re.findall(r'<script>(.*?)</script>',(preview/'terrain-walk-v4.1.html').read_text(),re.S)[-1]
          Path('/tmp/terrain-v4.1.js').write_text(script)
          print('V4.1 ORIGINAL TERRAIN MOVEMENT READY')

          PY
          node --check /tmp/terrain-v4.1.js
          test -s reports/preview/terrain-walk-v4.1.html

      - name: V4.1 Upload terrain movement preview
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-TI-Dungeon-V4.1-Original-Terrain-Walk
          path: reports/
          if-no-files-found: error
          retention-days: 30
