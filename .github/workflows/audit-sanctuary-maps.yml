
name: Sanctuary of Aden TI Dungeon Original Terrain V3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-sanctuary-maps.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: sanctuary-ti-terrain-v3
  cancel-in-progress: false

jobs:
  terrain:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Restore verified V2 dungeon source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous/v2 source reports
          gh run download 39045175890 --repo "$GITHUB_REPOSITORY" --name Sanctuary-TI-Dungeon-V2-Raw-and-Layer3 --dir previous/v2
          test -s previous/v2/extracted/map/1/7ffe8000.s32
          test -s previous/v2/extracted/map/2/7fff8000.s32

      - name: Download original Tile.idx and Tile.pak ZIP volumes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for part in zip z32 z33 z34 z35; do
            gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" --pattern "Sanctuary.of.Aden.-.Copy.$part" --dir source --clobber
            test -s "source/Sanctuary.of.Aden.-.Copy.$part"
          done

      - name: Render original S32 terrain and object layers
        shell: bash
        run: |
