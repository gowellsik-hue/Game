
# FILE: .github/workflows/audit-sanctuary-maps.yml
# VERSION: V6.7
# CONTINUES: V6.6 (failed as original first-spawn evidence; external SQL is excluded).
# GOAL: Locate original Sanctuary first-entry monster placement evidence for native maps 1/2.
# Original 15,389-file archive inventory: V6.4, run 39402429574.
# V6.5 found no confirmed spawn list in all 160 original client XML files.
# Check native executables and archived source types; never infer NPC positions from
# SQL of a different server, S32 walkable cells, sprite IDX, map icons or RPG events.
# If an actual map-entry server snapshot/packet capture is absent, state UNKNOWN.
# READ ONLY: no changes to builds, maps, monsters, Pages, or other workflows.
name: audit-sanctuary-maps.yml | V6.7 | Original Knight Scale Audit

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/audit-sanctuary-maps.yml]

permissions:
  contents: read
  actions: read

jobs:
  original-first-spawn-source-gate:
    name: V6.7 | Native first-entry monster spawn evidence gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: V6.7 Restore verified original 15389-file Sanctuary inventory
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39402429574
          name: Sanctuary-Map-V6.4-Original-Monster-Spawn-Source-Discovery
          github-token: ${{ github.token }}
          path: v64

      - name: V6.7 Fetch exact original Sanctuary ZIP directory and client binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source reports
          for part in \
            Sanctuary.of.Aden.-.Copy.zip \
            Sanctuary.of.Aden.-.Copy.z01 \
            Sanctuary.of.Aden.-.Copy.z35; do
            gh release download v1.0.0 -R gowellsik-hue/Game \
              -p "$part" -D source --clobber
            test -s "source/$part"
          done
          test "$(wc -c < source/Sanctuary.of.Aden.-.Copy.zip)" -eq 38808950
          test "$(wc -c < source/Sanctuary.of.Aden.-.Copy.z01)" -eq 100000000
          test "$(wc -c < source/Sanctuary.of.Aden.-.Copy.z35)" -eq 100000000
          echo 'Downloaded original Sanctuary client archive volumes (not external L1J).'

      - name: V6.7 Inspect authentic client binaries and first-spawn data availability
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v67-original-spawn-source.py <<'PY_V67'
          #!/usr/bin/env python3
          """Read-only, original Sanctuary client provenance audit. NOT a spawn generator."""
          from pathlib import Path
          import csv
          import hashlib
          import json
          import re
          import struct
          import subprocess
          import zlib
          from collections import Counter

          SRC = Path('source')
          OUT = Path('reports')
          V64 = Path('v64')
          STEM = 'Sanctuary.of.Aden.-.Copy'
          PREFIX = 'Sanctuary of Aden - Copy/'
          TARGETS = [
              'Lineage.exe', 'Login.exe', 'Redemption.exe', 'Launcher.exe',
              'Login.dll', 'Redemption.dll', 'npcipher.dll', 'lin.bin',
              'TW13032701.exe', 'TW13032701.bin',
          ]
          OUT.mkdir(exist_ok=True)

          plan = json.loads((V64 / 'source-extraction-plan.json').read_text('utf-8'))
          previous = json.loads((V64 / 'v64-spawn-source-results.json').read_text('utf-8'))
          with (V64 / 'original-archive-all-files.csv').open(encoding='utf-8-sig', newline='') as f:
              archive_inventory = list(csv.DictReader(f))
          assert plan['totalZipRecords'] == len(archive_inventory) == 15389
          assert plan['allNamesInventoried']
          assert previous['inspectionErrors'] == 0
          assert previous['csvStructuredSpawnRowsCandidate'] == 0
          assert previous['candidateFilesNotInspected'] == 8
          assert all(x['rel'].startswith('Sprite') and x['rel'].endswith('.idx')
                     for x in plan['notInspected'])

          # Split ZIP: only the last .zip holds the central directory. Reuse the
          # header/CRC semantics proven by the V6.4 successful archive inspector.
          directory = (SRC / (STEM + '.zip')).read_bytes()
          tail = directory.rfind(b'PK\x05\x06')
          assert tail >= 0, 'Split ZIP end-of-central-directory not found'
          end = struct.unpack_from('<4s4H2IH', directory, tail)
          last_disk, central_total = end[1], end[4]
          assert last_disk == 45 and central_total == 15389
          entries = {}
          off = 0
          while True:
              off = directory.find(b'PK\x01\x02', off)
              if off < 0:
                  break
              if off + 46 > len(directory):
                  break
              h = struct.unpack_from('<4s6H3I5H2I', directory, off)
              flags, method = h[3], h[4]
              crc, packed, unpacked = h[7], h[8], h[9]
              nl, el, cl = h[10], h[11], h[12]
              disk, offset = h[13], h[16]
              finish = off + 46 + nl + el + cl
              if not (0 < nl <= 4096 and finish <= len(directory)):
                  off += 4
                  continue
              raw_name = directory[off + 46:off + 46 + nl]
              name = raw_name.decode('utf-8' if flags & 0x800 else 'cp949', errors='replace')
              name = name.replace('\\', '/')
              rel = name[len(PREFIX):] if name.startswith(PREFIX) else name
              entries[rel] = (name, flags, method, crc, packed, unpacked, disk, offset)
              off = finish
          assert len(entries) == 15389, ('Central directory mismatch', len(entries))
          assert set(entries) == {x['relativePath'] for x in archive_inventory}

          def volume(index):
              return SRC / (STEM + ('.zip' if index == last_disk else '.z%02d' % (index + 1)))

          def read_span(disk, position, length):
              out = bytearray()
              while len(out) < length:
                  p = volume(disk)
                  if not p.is_file():
                      raise RuntimeError('Missing original archive volume ' + p.name)
                  size = p.stat().st_size
                  if position >= size:
                      position -= size
                      disk += 1
                      continue
                  with p.open('rb') as f:
                      f.seek(position)
                      chunk = f.read(min(length - len(out), size - position))
                  if not chunk:
                      raise RuntimeError('Truncated original volume ' + p.name)
                  out.extend(chunk)
                  position += len(chunk)
              return bytes(out)

          def authentic_member(rel):
              name, flags, method, crc, packed, unpacked, disk, offset = entries[rel]
              assert not flags & 1 and method in (0, 8), rel
              assert unpacked <= 10_000_000, ('Unexpected huge executable', rel)
              head = read_span(disk, offset, 30)
              assert head[:4] == b'PK\x03\x04', ('Bad local header', rel)
              meta = struct.unpack('<4s5H3I2H', head)
              local_flags, local_method = meta[2], meta[3]
              nl, el = meta[9], meta[10]
              assert local_flags == flags and local_method == method, rel
              local_head = read_span(disk, offset, 30 + nl + el)
              local_name = local_head[30:30 + nl].decode(
                  'utf-8' if flags & 0x800 else 'cp949', errors='replace').replace('\\', '/')
              assert local_name == name, ('Wrong original source member', rel)
              packed_data = read_span(disk, offset + 30 + nl + el, packed)
              raw = packed_data if method == 0 else zlib.decompress(packed_data, -15)
              assert len(raw) == unpacked, ('Wrong unpacked byte count', rel)
              assert zlib.crc32(raw) & 0xffffffff == crc, ('Original ZIP CRC fail', rel)
              return raw

          inspections = []
          for rel in TARGETS:
              assert rel in entries, ('Original archive executable is missing', rel)
              raw = authentic_member(rel)
              # GitHub artifact contains only findings/hashes, never original binaries.
              binary = Path('/tmp') / ('v67-' + Path(rel).name)
              binary.write_bytes(raw)
              pe = len(raw) > 64 and raw[:2] == b'MZ'
              if pe:
                  pos = int.from_bytes(raw[60:64], 'little')
                  pe = pos + 4 <= len(raw) and raw[pos:pos + 4] == b'PE\x00\x00'
              proc = subprocess.run(['objdump', '-p', str(binary)], capture_output=True,
                                    text=True, errors='replace', check=False)
              imports = sorted({word for word in
                  ('WSARecv', 'WSASend', 'recv', 'send', 'socket', 'connect', 'WSAStartup')
                  if re.search(r'(?i)\b' + re.escape(word) + r'\b', proc.stdout)}) if pe else []
              # Strings and WinSock imports are just reverse-engineering hints, not spawn records.
              ascii_strings = re.findall(rb'[\x20-\x7e]{6,}', raw)
              marker_counts = {m: sum(1 for s in ascii_strings if m in s.lower())
                               for m in (b'spawn', b'monster', b'packet', b'npc')}
              inspections.append({
                  'sourceFile': rel, 'sourceBytes': len(raw),
                  'sourceSHA256': hashlib.sha256(raw).hexdigest(),
                  'ZIPCRCVerified': True, 'WindowsPE': bool(pe),
                  'networkImportHints': ','.join(imports),
                  'spawnStringHints': marker_counts[b'spawn'],
                  'monsterStringHints': marker_counts[b'monster'],
                  'packetStringHints': marker_counts[b'packet'],
                  'npcStringHints': marker_counts[b'npc'],
                  'isOriginalFirstEntrySpawnRecord': False,
              })
              binary.unlink(missing_ok=True)
              print('CHECKED ORIGINAL', rel, len(raw), 'bytes; PE=', bool(pe),
                    'imports=', ','.join(imports), flush=True)

          names = list(entries)
          path_ext = Counter(Path(p).suffix.lower() for p in names)
          server_db = sorted(p for p in names if Path(p).suffix.lower() in
                             ('.sql', '.db', '.sqlite', '.sqlite3'))
          native_packet_captures = sorted(p for p in names if Path(p).suffix.lower() in
                                          ('.pcap', '.pcapng', '.cap', '.etl'))
          original_logs = sorted(p for p in names if p.startswith('log/'))
          # Archived crash/error logs are NOT snapshots of monsters on map entry.
          # Likewise original S32 map passages and client map NPC UI pins are NOT spawns.
          verified = False
          summary = {
              'version': 'V6.7',
              'targetNativeMaps': [1, 2],
              'firstSpawnEvidenceStatus': 'ORIGINAL_RUNTIME_OR_SERVER_SNAPSHOT_NOT_FOUND',
              'originalArchiveEntries': len(entries),
              'originalExecutableBinariesCRCChecked': len(inspections),
              'originalClientXMLAlreadyAuditedInV65': 160,
              'v64PreviouslySkippedFiles': [x['rel'] for x in plan['notInspected']],
              'skippedFilesAreSpriteIndexesNotProvenSpawnRecords': True,
              'serverDatabasePathsInOriginalClientArchive': server_db,
              'nativePacketCapturePathsInOriginalClientArchive': native_packet_captures,
              'archivedErrorLogFileCount': len(original_logs),
              'networkImportsAreOnlyCodeHintsNotSpawnEvidence': True,
              'verifiedOriginalFirstEntrySpawnSnapshot': verified,
              'verifiedMonsterIDs': None,
              'verifiedMonsterNames': None,
              'verifiedMonsterCountByFloor': None,
              'verifiedIndividualFirstSpawnXY': None,
              'noSpawnsObservedMeansEmptyMap': False,
              'derivedFromExternalL1J': False,
              'derivedFromMapWalkableCells': False,
              'derivedFromSLKnightEvents': False,
              'gameFilesModified': False,
              'requiredNextSource': 'Real Sanctuary server-side first-entry entity list or a decoded native client map-entry entity stream.',
          }
          assert not server_db and not native_packet_captures
          assert len(inspections) == len(TARGETS)
          assert summary['verifiedMonsterCountByFloor'] is None
          with (OUT / 'v67-native-client-binary-evidence.csv').open('w', encoding='utf-8-sig', newline='') as f:
              w = csv.DictWriter(f, fieldnames=list(inspections[0]))
              w.writeheader()
              w.writerows(inspections)
          (OUT / 'v67-first-entry-spawn-evidence.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'README.txt').write_text(
              'V6.7 | ORIGINAL SANCTUARY FIRST-ENTRY SPAWN EVIDENCE GATE\n'
              'Source: original Sanctuary split ZIP, CRC-verified client binaries.\n'
              'V6.4: 15,389 files; eight skipped files are Sprite*.idx.\n'
              'V6.5: 160 original client XML did not confirm initial monster spawns.\n'
              'No native server spawn DB or original packet capture is in the archive.\n'
              'PE imports and string hits are analysis hints only; no coordinates inferred.\n'
              'UNKNOWN is NOT zero monsters. No L1J SQL or SLKnight events were used.\n'
              'Required next evidence: native server initial entity list or decoded\n'
              'Sanctuary map-entry packets with NPC IDs and actual first X/Y.\n'
              'No modification to original client or Game/Pages.\n', encoding='utf-8')
          print('::warning::V6.7 NO VERIFIED NATIVE FIRST-SPAWN SNAPSHOT: '
                'exact monster IDs, first X/Y and counts remain UNKNOWN', flush=True)
          PY_V67
          python3 -m py_compile /tmp/v67-original-spawn-source.py
          python3 /tmp/v67-original-spawn-source.py

      - name: V6.7 Verify evidence has not been mistaken for a monster placement list
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CHECK'
          import csv, json
          from pathlib import Path
          p = Path('reports')
          result = json.loads((p / 'v67-first-entry-spawn-evidence.json').read_text('utf-8'))
          assert result['version'] == 'V6.7'
          assert result['originalArchiveEntries'] == 15389
          assert result['originalExecutableBinariesCRCChecked'] == 10
          assert result['targetNativeMaps'] == [1, 2]
          assert result['firstSpawnEvidenceStatus'] == 'ORIGINAL_RUNTIME_OR_SERVER_SNAPSHOT_NOT_FOUND'
          assert not result['verifiedOriginalFirstEntrySpawnSnapshot']
          assert result['verifiedIndividualFirstSpawnXY'] is None
          assert result['verifiedMonsterCountByFloor'] is None
          assert not result['derivedFromExternalL1J']
          assert not result['derivedFromMapWalkableCells']
          assert not result['derivedFromSLKnightEvents']
          assert not result['gameFilesModified']
          with (p / 'v67-native-client-binary-evidence.csv').open(encoding='utf-8-sig') as f:
              assert len(list(csv.DictReader(f))) == 10
          print('V6.7 AUDIT COMPLETE. Original Sanctuary first-entry spawn remains UNVERIFIED.')
          PY_CHECK
          {
            echo '### V6.7 | Original Sanctuary first-entry spawn'
            echo 'Native maps: 1F and 2F.'
            echo 'Original executable files: 10 CRC-verified.'
            echo 'Result: NO original server entity snapshot or decoded packet capture.'
            echo 'Monster types, numbers and individual first-spawn X/Y: UNKNOWN, NOT ZERO.'
            echo 'No gameplay or Pages modifications.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: V6.7 Upload original first-entry spawn source verification report
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Map-V6.7-Native-First-Spawn-Evidence-Gate
          path: reports/
          retention-days: 60
          if-no-files-found: error
