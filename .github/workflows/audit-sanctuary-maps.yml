
# FILE: .github/workflows/audit-sanctuary-maps.yml
# VERSION: V5.0 / SLKnight 44 maps monster spawn coordinates
name: V5.0 | 44 Map Monster Spawn Coordinate Extraction

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/audit-sanctuary-maps.yml]

permissions:
  contents: read
  actions: read

jobs:
  map-spawn:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: V5.0 Restore verified V229R9 game maps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous source reports
          gh run download 39100666926 -R "$GITHUB_REPOSITORY" -n github-pages -D previous
          test -s previous/artifact.tar
          tar -xf previous/artifact.tar -C source --wildcards '*/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap*.rxdata'
          test -s source/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap044.rxdata
          command -v ruby >/dev/null || (sudo apt-get update -qq && sudo apt-get install -qq -y ruby)
          ruby --version

      - name: V5.0 Extract original event locations and monster relocations
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/map-spawn-v5.rb <<'RUBY_SPAWN_V50'
          require 'json'
          require 'csv'
          require 'fileutils'
          module RPG
            class AudioFile;end; class Cache;end; class Map;end; class MapInfo;end
            class Event
              class Page
                class Condition;end; class Graphic;end
              end
            end
            class EventCommand;end; class MoveRoute;end; class MoveCommand;end
          end
          class Table
            def self._load(s); allocate; end
          end
          class Tone
            def self._load(s); s; end
          end
          class Color
            def self._load(s); s; end
          end
          src=ARGV[0]||'source/Data'
          dest=ARGV[1]||'reports'
          FileUtils.mkdir_p(dest)
          def attr(o,key);o.instance_variable_get('@'+key);end
          def utf(s);s.to_s.dup.force_encoding('UTF-8').scrub;end
          folder=File.join(src,'MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO')
          files=Dir[folder+'Map[0-9][0-9][0-9].rxdata'].sort
          raise "Expected 44 playable source files, got #{files.size}" unless files.size==44
          infos=Marshal.load(File.binread(folder+'MapInfos.rxdata'))
          monsters=[];ambiguous=[];points=[];event_total=0;flagged=[];region_stats=[]
          files.each do |file|
            map_id=File.basename(file).match(/Map(\d{3})\.rxdata$/)[1].to_i
            map=Marshal.load(File.binread(file))
            events=attr(map,'events') || {}
            width=attr(map,'width');height=attr(map,'height')
            event_total+=events.size
            name=utf(attr(infos[map_id],'name'))
            count=0
            events.each do |event_id,event|
              pages=attr(event,'pages') || []
              e_name=utf(attr(event,'name'))
              commands=pages.flat_map{|p| attr(p,'list') || []}
              combat=commands.any?{|c|attr(c,'code')==117 && attr(c,'parameters')[0]==62}
              # Boss scripts are kept separate when their combat event does not call CE62.
              boss_candidate=!combat && e_name.match?(/(기르타스|바알|안타라스)/) && !e_name.start_with?('EV')
              next unless combat || boss_candidate
              x=attr(event,'x');y=attr(event,'y')
              unless x.is_a?(Integer) && y.is_a?(Integer) && x.between?(0,width-1) && y.between?(0,height-1)
                raise "Bad initial event coordinate on map #{map_id} event #{event_id}"
              end
              evidence=combat ? 'COMBAT_EVENT_CE62' : 'BOSS_NAME_UNVERIFIED'
              rel=[]
              pages.each_with_index do |page,index|
                graphic=attr(page,'graphic')
                graphic_name=utf(attr(graphic,'character_name'))
                is_death=graphic_name.include?('죽음')
                (attr(page,'list')||[]).each do |c|
                  next unless attr(c,'code')==202
                  p=attr(c,'parameters')
                  next unless p.is_a?(Array) && p.size>=5
                  target,mode,cx,cy,_direction=p
                  if target==0 && mode==0 && cx.is_a?(Integer) && cy.is_a?(Integer)
                    item={'x'=>cx,'y'=>cy,'page'=>index,'deathPage'=>is_death,'insideMap'=>cx.between?(0,width-1) && cy.between?(0,height-1),'type'=>'SCRIPTED_RELOCATION_CANDIDATE'}
                    rel<<item unless rel.any?{|r|r['x']==cx && r['y']==cy && r['page']==index}
                    flagged<<[map_id,event_id,e_name,cx,cy] unless item['insideMap']
                  elsif target==0
                    flagged<<[map_id,event_id,e_name,'VARIABLE_OR_NON_LITERAL',p]
                  end
                end
              end
              record={'source'=>'SLKnight_RPG_Maker_RxData','mapId'=>map_id,'mapName'=>name,'eventId'=>event_id,'monsterName'=>e_name,'initialX'=>x,'initialY'=>y,'evidence'=>evidence,'arenaOrSpecial'=>[16,43,44].include?(map_id),'relocations'=>rel}
              (combat ? monsters : ambiguous)<<record
              # The first point is the actual stored initial location, not guaranteed live spawn.
              points << [map_id,name,event_id,e_name,'INITIAL_EVENT',x,y,'',evidence,record['arenaOrSpecial'],true]
              rel.each{|q| points << [map_id,name,event_id,e_name,'SCRIPTED_RELOCATION',q['x'],q['y'],q['page'],evidence,record['arenaOrSpecial'],q['insideMap']]}
              count+=1
            end
            region_stats << {'mapId'=>map_id,'mapName'=>name,'width'=>width,'height'=>height,'events'=>events.size,'combatOrBossCandidates'=>count}
          end
          raise "Unexpected game event count #{event_total}" unless event_total==845
          raise "Low monster count #{monsters.size}" unless monsters.size>=400
          headers=['sourceMapId','mapName','eventId','monsterName','pointType','x','y','pageIndex','evidence','specialArena','withinMap']
          CSV.open(File.join(dest,'monster-spawn-points-v5.0.csv'),'w',write_headers:true,headers:headers,encoding:'UTF-8') { |csv| points.each{|p| csv<<p} }
          manifest={version:'V5.0',sourceGame:'SLKnight RPG Maker map event database',notSanctuaryS32Coordinates:true,monsterCandidates:monsters.size,unverifiedBossCandidates:ambiguous.size,eventsExamined:event_total,sourceMaps:files.size,coordinateRows:points.size,nonLiteralOrOutOfBoundsRelocations:flagged,monsterEvents:monsters,unverifiedBossEvents:ambiguous,maps:region_stats,portalWarpLinksIncluded:false}
          File.write(File.join(dest,'monster-spawn-index-v5.0.json'),JSON.pretty_generate(manifest))
          puts "MAP V5.0 OK: 44 maps, #{event_total} events, #{monsters.size} combat, #{ambiguous.size} boss candidates, #{points.size} coordinate rows, #{flagged.size} location exceptions"
          RUBY_SPAWN_V50
          ruby -c /tmp/map-spawn-v5.rb
          ruby /tmp/map-spawn-v5.rb source/knight/gameasync/Data reports
          test -s reports/monster-spawn-index-v5.0.json
          test -s reports/monster-spawn-points-v5.0.csv

      - name: V5.0 Upload monster spawn coordinate audit
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Map-V5.0-Monster-Spawn-Coordinates
          path: reports/
          if-no-files-found: error
          retention-days: 30
