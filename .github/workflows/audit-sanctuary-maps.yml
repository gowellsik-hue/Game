
name: V4.0 | TI Dungeon Runtime Map and Movement Test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/audit-sanctuary-maps.yml]
permissions:
  contents: read
  actions: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Restore V3.9 verified map data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reports
          gh run download 39098802617 -R "$GITHUB_REPOSITORY" -n Sanctuary-MAP-TI-Dungeon-V3.9-Portal-Links -D reports
          test -s reports/topology-v3.8.json
          test -s reports/preview/index.html

      - name: Export V4.0 runtime maps and test movement
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,collections,json,struct
          from pathlib import Path

          root=Path('reports')
          view=root/'preview'
          topology=json.loads((root/'topology-v3.8.json').read_text())['maps']
          images=json.loads((view/'map-index.json').read_text())
          runtime={};routes={};checks={}

          for mid,expected in [('1',12),('2',16)]:
              d=json.loads((root/f'map-{mid}-collision.json').read_text())
              t=topology[mid]
              w,h=d['width'],d['height']
              mask=base64.b64decode(d['flags'])
              regions=base64.b64decode(t['regions'])
              assert len(mask)==len(regions)==w*h
              assert len(images[mid]['blocks'])==expected

              for tile in images[mid]['blocks']:
                  header=(view/tile['src']).read_bytes()[:24]
                  assert header[:8]==b'\x89PNG\r\n\x1a\n'
                  assert struct.unpack('>II',header[16:24])==(1536,768)

              anchor='to2' if mid=='1' else 'to1'
              portal=next(z for z in t['portals'] if z['name']==anchor)
              near=portal['nearestWalkable']
              assert near and near['regionSize']>0
              start=(near['y']-d['originY'])*w+near['x']-d['originX']
              assert mask[start]!=255 and mask[start]&1==0

              distance=[-1]*(w*h)
              distance[start]=0
              q=collections.deque([start])
              while q:
                  cur=q.popleft()
                  x=cur%w;y=cur//w
                  for nx,ny in ((x-1,y),(x+1,y),(x,y-1),(x,y+1)):
                      if 0<=nx<w and 0<=ny<h:
                          i=ny*w+nx
                          if distance[i]<0 and mask[i]!=255 and not(mask[i]&1):
                              distance[i]=distance[cur]+1
                              q.append(i)

              count=sum(v>=0 for v in distance)
              assert count==near['regionSize']
              route=[]
              for p in t['portals']:
                  pt=p['nearestWalkable'];steps=None
                  if pt:
                      i=(pt['y']-d['originY'])*w+pt['x']-d['originX']
                      steps=distance[i] if distance[i]>=0 else None
                  route.append(dict(name=p['name'],x=p['x'],y=p['y'],stepsFromStart=steps,targetMapId=p['targetMapId'],destinationVerified=False))

              runtime[mid]=dict(mapId=int(mid),originX=d['originX'],originY=d['originY'],width=w,height=h,collisionBase64=d['flags'],collisionLegend='255=unknown; bit0=blocked candidate',regionsBase64=t['regions'],tileRoot='preview/',tiles=images[mid]['blocks'],spawnForMovementTest=dict(x=near['x'],y=near['y']),portals=t['portals'])
              routes[mid]=route
              checks[mid]=dict(mapBlocks=expected,reachable=count,regions=len(t['regionSizes']),portals=len(route))
              print('V4.0 MAP',mid,checks[mid])

          assert sum(v['portals'] for v in checks.values())==20
          (root/'runtime-v4.0.json').write_text(json.dumps(dict(version='V4.0',collisionVerification='provisional Layer3 bit0',verifiedWarpDestinations=0,verifiedMonsterSpawns=0,maps=runtime),ensure_ascii=False,separators=(',',':')))
          (root/'routes-v4.0.json').write_text(json.dumps(dict(version='V4.0',movement='4 directions, no warps',maps=routes,checks=checks),ensure_ascii=False,indent=2))

          page='''<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>TI Dungeon V4.0 Movement Test</title>
          <style>body{margin:9px;background:#121b28;color:#eaf3ff;text-align:center;font:14px system-ui}select,button,a{font:inherit;padding:9px;background:#263a52;color:white;border:1px solid #536880;border-radius:7px}canvas{width:min(92vw,440px);image-rendering:pixelated;background:#0e1622;border:1px solid #657383}#pad{display:grid;grid-template-columns:repeat(3,70px);justify-content:center;gap:5px;margin:auto}#pad button{height:55px;font-size:20px}</style>
          <h3>말던 이동 검사 V4.0</h3><select id="floor"><option value="1">1층</option><option value="2">2층</option></select> <a href="index.html">원본 지형</a><p id="info"></p>
          <canvas id="cv" width="360" height="360"></canvas>
          <div id="pad"><span></span><button data-d="0,-1">▲</button><span></span><button data-d="-1,0">◀</button><button data-d="0,1">▼</button><button data-d="1,0">▶</button></div>
          <p>방향키·WASD·화면 버튼 이동. 포털 자동이동 없음.</p>
          <script id="data" type="application/json">__DATA__</script><script>
          const maps=JSON.parse(document.getElementById('data').textContent),sel=document.getElementById('floor'),cv=document.getElementById('cv'),ctx=cv.getContext('2d'),info=document.getElementById('info');let m,b,x,y;
          function open(){m=maps[sel.value];b=Uint8Array.from(atob(m.collisionBase64),c=>c.charCodeAt(0));x=m.spawnForMovementTest.x;y=m.spawnForMovementTest.y;draw()}
          function walk(dx,dy){const nx=x+dx,ny=y+dy,ix=nx-m.originX,iy=ny-m.originY;if(ix>=0&&iy>=0&&ix<m.width&&iy<m.height){const v=b[iy*m.width+ix];if(v!==255&&!(v&1)){x=nx;y=ny}}draw()}
          function draw(){ctx.fillStyle='#111a29';ctx.fillRect(0,0,360,360);const size=12,range=15;for(let yy=-range;yy<=range;yy++)for(let xx=-range;xx<=range;xx++){let tx=x+xx-m.originX,ty=y+yy-m.originY,v=tx>=0&&ty>=0&&tx<m.width&&ty<m.height?b[ty*m.width+tx]:255;ctx.fillStyle=v===255?'#070e16':v&1?'#344257':'#91af95';ctx.fillRect(180+xx*size-5,180+yy*size-5,11,11)}for(const p of m.portals){let px=p.x-x,py=p.y-y;if(Math.abs(px)<=range&&Math.abs(py)<=range){ctx.fillStyle='#efc84c';ctx.fillRect(180+px*size-4,180+py*size-4,9,9)}}ctx.fillStyle='#f36869';ctx.beginPath();ctx.arc(180,180,5,0,Math.PI*2);ctx.fill();const hit=m.portals.filter(p=>Math.abs(p.x-x)<=1&&Math.abs(p.y-y)<=1).map(p=>p.name+' → map '+p.targetMapId).join(', ');info.textContent=`맵 ${m.mapId} (${x}, ${y})${hit?' / 포털 후보 '+hit+' (이동 미확인)':''}`}
          sel.onchange=open;for(const btn of document.querySelectorAll('[data-d]'))btn.onclick=()=>{const [dx,dy]=btn.dataset.d.split(',').map(Number);walk(dx,dy)};document.onkeydown=e=>{const d={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]}[e.code];if(d){e.preventDefault();walk(...d)}};open();
          </script></html>'''
          (view/'movement-v4.0.html').write_text(page.replace('__DATA__',json.dumps(runtime,ensure_ascii=False,separators=(',',':'))))
          assert (view/'movement-v4.0.html').stat().st_size>100000
          PY
          test -s reports/runtime-v4.0.json
          test -s reports/routes-v4.0.json

      - name: Upload V4.0 map runtime and movement test
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-TI-Dungeon-V4.0-Runtime-Map
          path: reports/
          if-no-files-found: error
          retention-days: 30
