      - name: Upload original dungeon map preview V3
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-TI-Dungeon-V3-Original-Terrain
          path: reports/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Upload terrain diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-TI-Dungeon-V3-Failure
          path: reports/
          if-no-files-found: warn
          retention-days: 14
