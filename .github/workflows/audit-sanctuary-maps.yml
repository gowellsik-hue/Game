
# FILE: .github/workflows/audit-sanctuary-maps.yml
# VERSION: V5.3 / Original monster spawn, setup relocation, self-switch A relocation
name: audit-sanctuary-maps.yml | V5.3 | Monster Spawn Branch Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/audit-sanctuary-maps.yml]
permissions:
  contents: read
  actions: read
jobs:
  classify-spawns:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: V5.3 Restore V5.2 collision masks and game event pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reports previous source
          gh run download 39123602635 -R "$GITHUB_REPOSITORY" -n Sanctuary-Map-V5.2-44-Collision-Spawn-Audit -D reports
          gh run download 39100666926 -R "$GITHUB_REPOSITORY" -n github-pages -D previous
          test -s reports/collision-index-v5.2.json
          test -s reports/monster-spawn-index-v5.0.json
          test -s previous/artifact.tar
          tar -xf previous/artifact.tar -C source --wildcards \
            './knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIOMap*.rxdata'
          command -v ruby >/dev/null || (sudo apt-get update -qq && sudo apt-get install -qq -y ruby)

      - name: V5.3 Decode original event-page conditions and relocations
        run: |
          set -euo pipefail
          cat > /tmp/spawn-v5.3.rb <<'RUBY_V53'
          require 'json'
          module RPG
            class AudioFile;end; class Map;end
            class Event
              class Page
                class Condition;end; class Graphic;end
              end
            end
            class EventCommand;end; class MoveRoute;end; class MoveCommand;end
          end
          class Table;def self._load(s);allocate;end;end
          class Tone;def self._load(s);s;end;end
          class Color;def self._load(s);s;end;end
          def at(o,k);o.instance_variable_get('@'+k);end
          def utf(s);s.to_s.dup.force_encoding('UTF-8').scrub;end
          source=JSON.parse(File.read('reports/monster-spawn-index-v5.0.json'))
          original=source['monsterEvents']+source['unverifiedBossEvents']
          by_map=original.group_by{|e|e['mapId']}
          base='source/knight/gameasync/Data/MMUQTFCAEUWWMMVPHJPLWSKVJOHMECOINFTBCWIO'
          records=[]
          by_map.sort.each do |mid,list|
            map=Marshal.load(File.binread("#{base}Map%03d.rxdata" % mid))
            game_events=at(map,'events')||{}
            list.each do |ref|
              event=game_events.fetch(ref['eventId'])
              raise 'Initial event mismatch' unless at(event,'x')==ref['initialX'] && at(event,'y')==ref['initialY']
              pages=[]
              (at(event,'pages')||[]).each_with_index do |page,i|
                con=at(page,'condition'); commands=at(page,'list')||[]
                selfa=!!at(con,'self_switch_valid') && at(con,'self_switch_ch')=='A'
                flags={
                  switch1:(at(con,'switch1_id') if at(con,'switch1_valid')),
                  switch2:(at(con,'switch2_id') if at(con,'switch2_valid')),
                  variable:( {id:at(con,'variable_id'),minimum:at(con,'variable_value')} if at(con,'variable_valid')),
                  selfSwitch:(at(con,'self_switch_ch') if at(con,'self_switch_valid'))
                }.compact
                moves=[];seen={}
                commands.each do |c|
                  next unless at(c,'code')==202
                  p=at(c,'parameters')
                  next unless p.is_a?(Array) && p.size>=5 && p[0]==0 && p[1]==0 && p[2].is_a?(Integer) && p[3].is_a?(Integer)
                  key=[p[2],p[3]];next if seen[key]
                  seen[key]=true
                  moves<<{x:p[2],y:p[3],pageIndex:i,indent:at(c,'indent').to_i,
                    role:(selfa ? 'SELF_SWITCH_A_RELOCATION' : 'SCRIPTED_SETUP_RELOCATION')}
                end
                pages<<{index:i,trigger:at(page,'trigger'),conditions:flags,
                  graphic:utf(at(at(page,'graphic'),'character_name')),
                  combatCall62:commands.any?{|c|at(c,'code')==117 && at(c,'parameters')[0]==62},
                  hasBranches:commands.any?{|c|at(c,'code')==111},
                  relocations:moves}
              end
              expected=ref['relocations'].map{|r|[r['page'],r['x'],r['y']]}.sort
              actual=pages.flat_map{|p|p[:relocations].map{|v|[v[:pageIndex],v[:x],v[:y]]}}.sort
              raise "Relocation mismatch #{mid}/#{ref['eventId']}" unless expected==actual
              records<<{mapId:mid,mapName:ref['mapName'],eventId:ref['eventId'],monsterName:ref['monsterName'],
                initialX:ref['initialX'],initialY:ref['initialY'],evidence:ref['evidence'],
                arenaOrSpecial:ref['arenaOrSpecial'],pages:pages}
            end
          end
          raise 'Monster event coverage mismatch' unless records.size==500
          positions=records.sum{|e|1+e[:pages].sum{|p|p[:relocations].size}}
          raise "Coordinate coverage mismatch #{positions}" unless positions==1708
          File.write('reports/spawn-event-pages-v5.3.json',JSON.generate(records))
          puts "V5.3 ORIGINAL PAGES: #{records.size} events / #{positions} positions"
          RUBY_V53
          ruby -c /tmp/spawn-v5.3.rb
          ruby /tmp/spawn-v5.3.rb

      - name: V5.3 Classify spawn roles and static-collision exceptions
        run: |
          set -euo pipefail
          cat > /tmp/spawn-v5.3.py <<'PY_V53'
          import csv,json,collections
          from pathlib import Path
          root=Path('reports')
          events=json.loads((root/'spawn-event-pages-v5.3.json').read_text())
          maps=json.loads((root/'collision-index-v5.2.json').read_text())['maps']
          v52=json.loads((root/'audit-summary-v5.2.json').read_text())['totals']
          masks={mid:(root/m['collisionFile']).read_bytes() for mid,m in maps.items()}
          counts=collections.Counter();rows=[];issues=[];pack={}
          def add(e,kind,x,y,page=None):
              mid=str(e['mapId']);m=maps[mid];w=m['width'];h=m['height']
              inside=0<=x<w and 0<=y<h
              v=masks[mid][y*w+x] if inside else 255
              state='OUT_OF_BOUNDS' if not inside else 'UNKNOWN_TILE' if v==255 else 'BLOCKED' if v==15 else 'PASSABLE' if v==0 else 'DIRECTION_LIMITED'
              out={k:e[k] for k in ('mapId','mapName','eventId','monsterName','evidence','arenaOrSpecial')}
              out.update(role=kind,x=x,y=y,pageIndex=page['index'] if page else None,
                pageTrigger=page['trigger'] if page else None,
                pageConditions=page['conditions'] if page else {},
                branchSelectionUnverified=bool(page and page['hasBranches']),
                collision=state,collisionMask=v,actualSpawnVerified=False)
              rows.append(out);counts[kind]+=1;counts['collision_'+state]+=1
              if state not in ('PASSABLE','DIRECTION_LIMITED'):
                  issues.append(out)
              return out
          for mid,m in sorted(maps.items(),key=lambda t:int(t[0])):
              pack[mid]={'mapId':int(mid),'mapName':m['mapName'],'width':m['width'],'height':m['height'],
                'terrainPng':m['terrainPng'],'collisionFile':m['collisionFile'],'events':[]}
          for e in events:
              entry={k:e[k] for k in ('mapId','eventId','monsterName','evidence','arenaOrSpecial')}
              entry['initial']=add(e,'INITIAL_EVENT',e['initialX'],e['initialY'])
              entry['setupRelocations']=[];entry['selfSwitchARelocations']=[]
              entry['conditionPagesWithoutRelocation']=[]
              for page in e['pages']:
                  if page['conditions'].get('selfSwitch')=='A' and not page['relocations']:
                      entry['conditionPagesWithoutRelocation'].append(page['index'])
                      counts['selfSwitchAPagesWithoutRelocation']+=1
                  for p in page['relocations']:
                      item=add(e,p['role'],p['x'],p['y'],page)
                      key='selfSwitchARelocations' if p['role']=='SELF_SWITCH_A_RELOCATION' else 'setupRelocations'
                      entry[key].append(item)
              pack[str(e['mapId'])]['events'].append(entry)
          assert len(events)==500 and len(rows)==1708
          counts['selfSwitchAPages']=sum(p['conditions'].get('selfSwitch')=='A' for e in events for p in e['pages'])
          counts['selfSwitchAPagesWithRelocation']=sum(p['conditions'].get('selfSwitch')=='A' and bool(p['relocations']) for e in events for p in e['pages'])
          counts['eventsWithoutSelfSwitchAPage']=sum(not any(p['conditions'].get('selfSwitch')=='A' for p in e['pages']) for e in events)
          assert counts['selfSwitchAPages']==484 and counts['selfSwitchAPagesWithRelocation']==401
          assert counts['INITIAL_EVENT']==500
          assert counts['SCRIPTED_SETUP_RELOCATION']==109
          assert counts['SELF_SWITCH_A_RELOCATION']==1099
          assert counts['collision_BLOCKED']==v52['points_BLOCKED']==35
          assert counts['collision_UNKNOWN_TILE']==v52['points_UNKNOWN_TILE']==2
          assert len(issues)==37
          data={'version':'V5.3','source':'SLKnight/RPG Maker native game events','notSanctuaryS32Coordinates':True,
            'staticCollisionOnly':True,'realSpawnTimersVerified':False,'deathSwitchAIsInferredNotVerified':True,
            'actualWarpDestinationsIncluded':False,'maps':pack}
          (root/'spawn-integration-v5.3.json').write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')))
          (root/'spawn-summary-v5.3.json').write_text(json.dumps({'version':'V5.3','events':len(events),'positions':len(rows),'counts':dict(counts),'unresolvedPositions':len(issues),
            'interpretation':'Self-switch A page relocation is a possible post-death relocation, not a proven live spawn.'},ensure_ascii=False,indent=2))
          cols=['mapId','mapName','eventId','monsterName','evidence','arenaOrSpecial','role','x','y','pageIndex','pageTrigger','pageConditions','branchSelectionUnverified','collision','collisionMask','actualSpawnVerified']
          def writecsv(path,items):
              with (root/path).open('w',encoding='utf-8-sig',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=cols);w.writeheader()
                  for r in items:
                      val=r.copy();val['pageConditions']=json.dumps(val['pageConditions'],ensure_ascii=False,separators=(',',':'))
                      w.writerow(val)
          writecsv('spawn-candidates-v5.3.csv',rows)
          writecsv('spawn-review-v5.3.csv',issues)
          print('V5.3 CLASSIFIED',json.dumps(dict(counts),ensure_ascii=False))
          PY_V53
          python3 /tmp/spawn-v5.3.py
          test -s reports/spawn-integration-v5.3.json
          test -s reports/spawn-candidates-v5.3.csv
          test -s reports/spawn-review-v5.3.csv

      - name: V5.3 Upload 44-map classified spawn package
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Map-V5.3-Classified-Monster-Spawns
          path: reports/
          if-no-files-found: error
          retention-days: 30
