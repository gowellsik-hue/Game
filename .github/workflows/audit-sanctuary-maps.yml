# FILE: .github/workflows/audit-sanctuary-maps.yml
# VERSION: V6.11
# PURPOSE: Bypass further WinLicense layer-by-layer updates. Recover the distinct
#          authentic TW13032701 native client from the original Sanctuary archive;
#          trace real native socket receive call sites toward monster packet handlers.
# SOURCE: user-supplied original Sanctuary release, not SLKnight or L1J SQL.
# IMPORTANT: native socket call sites are NOT original initial monster spawn XY.
# KEEP: workflow file/title unchanged except version; no changes to game or Pages.
name: audit-sanctuary-maps.yml | V6.11 | Original Knight Scale Audit

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/audit-sanctuary-maps.yml]

permissions:
  contents: read
  actions: read

jobs:
  alternate-original-client-receiver:
    name: V6.11 | Locate native packet receive and its code path
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: V6.11 Download distinct original client volume directly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source reports
          gh release download v1.0.0 -R gowellsik-hue/Game \
            -p 'Sanctuary.of.Aden.-.Copy.z35' \
            -D source --clobber
          test "$(wc -c < source/Sanctuary.of.Aden.-.Copy.z35)" -eq 100000000
      - name: V6.11 Extract original game client and trace packet receiver references
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v611-native-receiver.py <<'PY_V611'
          from pathlib import Path
          from collections import Counter
          from math import log2
          import csv, hashlib, json, re, struct, subprocess, sys, zlib
          ZIP_VOLUME = 'Sanctuary.of.Aden.-.Copy.z35'
          EXPECTED = 'Sanctuary of Aden - Copy/TW13032701.bin'
          EXPECTED_SHA = '049e0579c193a666665eec0c10c4e28e8aa2184f1c0d26c1767e77212e6beda4'
          def unzip_original(volume, out):
              data = Path(volume).read_bytes()
              start = 73614956
              hdr = struct.unpack_from('<IHHHHHIIIHH', data, start)
              signature, _, flags, method, _, _, _, _, _, name_len, extra_len = hdr
              assert signature == 0x04034B50, 'Archive local ZIP header mismatch'
              name = data[start+30:start+30+name_len].decode('utf-8' if flags & 0x800 else 'cp949')
              assert name.replace('\\', '/') == EXPECTED, name
              assert method == 8 and not(flags & 1), 'Expected unencrypted deflate'
              raw_offset = start + 30 + name_len + extra_len
              packed_size, unpacked_size, crc = 2332239, 2582376, 2104511809
              assert raw_offset + packed_size <= len(data), 'Unexpected volume boundary'
              extracted = zlib.decompress(data[raw_offset:raw_offset+packed_size], -15)
              assert len(extracted) == unpacked_size and zlib.crc32(extracted) & 0xffffffff == crc
              assert hashlib.sha256(extracted).hexdigest() == EXPECTED_SHA
              Path(out).write_bytes(extracted)
              return extracted
          def u16(b,o): return struct.unpack_from('<H',b,o)[0]
          def u32(b,o): return struct.unpack_from('<I',b,o)[0]
          def inspect_exe(data, out):
              assert data[:2] == b'MZ'
              peoff = u32(data,0x3c);assert data[peoff:peoff+4] == b'PE\0\0'
              number = u16(data,peoff+6)
              opt_size = u16(data,peoff+20)
              opt = peoff+24
              magic=u16(data,opt);assert magic == 0x10b, 'Expected native 32-bit PE'
              base=u32(data,opt+28)
              entry=base+u32(data,opt+16)
              import_rva=u32(data,opt+104)
              sections=[]
              for i in range(number):
                  off=opt+opt_size+i*40
                  name=data[off:off+8].rstrip(b'\0').decode('ascii','replace')
                  size, rva, packed, raw, _, _, _, _, flags=struct.unpack_from('<IIIIIIHHI',data,off+8)
                  blob=data[raw:raw+packed]; cnt=Counter(blob)
                  entropy=round(-sum((n/len(blob))*log2(n/len(blob)) for n in cnt.values()),3) if blob else 0
                  sections.append(dict(name=name,rva=rva,virtual_size=size,file_offset=raw,raw_size=packed,
                                       flags=flags,executable=bool(flags & 0x20000000),entropy=entropy))
              def from_rva(rva):
                  if rva < u32(data,opt+60): return rva
                  for sec in sections:
                      if sec['rva'] <= rva < sec['rva']+max(sec['virtual_size'],sec['raw_size']):
                          offset = rva-sec['rva']
                          if offset < sec['raw_size']:
                              return sec['file_offset']+offset
                  raise ValueError('Unmapped or BSS RVA '+hex(rva))
              def string(rva):
                  pos=from_rva(rva)
                  end=data.find(b'\0',pos,min(len(data),pos+1024))
                  assert end>pos
                  return data[pos:end].decode('latin1','replace')
              imports=[]
              if import_rva:
                  try: desc=from_rva(import_rva)
                  except ValueError: desc=None
                  if desc is not None:
                      for di in range(300):
                          o=desc+di*20
                          if o+20>len(data):break
                          orig, _, _, name_rva, first = struct.unpack_from('<IIIII',data,o)
                          if not(orig or name_rva or first):break
                          try:
                              dll=string(name_rva)
                              thunk=orig or first
                              for ti in range(6000):
                                  to=from_rva(thunk+ti*4)
                                  val=u32(data,to)
                                  if not val:break
                                  if val & 0x80000000:
                                      imp='#'+str(val & 0xffff)
                                  else:
                                      imp=string(val+2)
                                  imports.append((dll,imp,base+first+ti*4))
                          except (ValueError,AssertionError,struct.error):
                              continue
              pattern=re.compile(r'^(?:recv|recvfrom|wsa(recv|recvfrom|send|sendto|socket[a-z]?)|send|sendto|socket|connect|wsaconnect|select|ioctlsocket|closesocket|gethostbyname|getaddrinfo|ntohl|htons)$',re.I)
              target=[(dll,api,va) for dll,api,va in imports if re.search(r'ws2_32|wsock32',dll,re.I) and pattern.fullmatch(api)]
              calls=[]
              for dll,api,iat_va in target:
                  if not pattern.fullmatch(api): continue
                  for sec in sections:
                      if not sec['executable']:continue
                      blob=data[sec['file_offset']:sec['file_offset']+sec['raw_size']]
                      for op in (b'\xff\x15', b'\xff\x25'):
                          needle=op+struct.pack('<I',iat_va)
                          pos=0
                          while True:
                              hit=blob.find(needle,pos)
                              if hit<0:break
                              va=base+sec['rva']+hit
                              local=data[sec['file_offset']+max(0,hit-40):sec['file_offset']+min(len(blob),hit+50)]
                              calls.append((dll,api,hex(iat_va),hex(va),'call' if op==b'\xff\x15' else 'jmp',local.hex()))
                              pos=hit+1
              # Also resolve near-call instructions which target an import jump thunk.
              thunks={}
              for dll,api,iat_va in target:
                  jmp=b'\xff\x25'+struct.pack('<I',iat_va)
                  for sec in sections:
                      if not sec['executable']:continue
                      blob=data[sec['file_offset']:sec['file_offset']+sec['raw_size']]
                      pos=0
                      while True:
                          hit=blob.find(jmp,pos)
                          if hit<0:break
                          thunks[base+sec['rva']+hit]=(dll,api,iat_va)
                          pos=hit+1
              for sec in sections:
                  if not sec['executable']:continue
                  blob=data[sec['file_offset']:sec['file_offset']+sec['raw_size']]
                  pos=0
                  while True:
                      hit=blob.find(b'\xe8',pos)
                      if hit<0 or hit+5>len(blob):break
                      source_va=base+sec['rva']+hit
                      dest=(source_va+5+struct.unpack_from('<i',blob,hit+1)[0])&0xffffffff
                      if dest in thunks:
                          dll,api,iat_va=thunks[dest]
                          lo=max(0,hit-32);hi=min(len(blob),hit+48)
                          calls.append((dll,api,hex(iat_va),hex(source_va),'call-via-import-thunk',blob[lo:hi].hex()))
                      pos=hit+1
              out=Path(out);out.mkdir(exist_ok=True)
              with (out/'native-packet-call-sites.csv').open('w',newline='') as f:
                  writer=csv.writer(f);writer.writerow(['DLL','API','importVA','callSiteVA','operation','originalByteContext']);writer.writerows(calls)
              (out/'native-imports.json').write_text(json.dumps({'imageBase':hex(base),'entryVA':hex(entry),'nativePESections':sections,
                               'imports':[{'dll':d,'api':a,'iatVA':hex(x)} for d,a,x in imports],
                               'nativePacketCallSites':len(calls)},indent=2))
              notes=[f'Original EXE SHA256: {hashlib.sha256(data).hexdigest()}',
                  f'Native entry: 0x{entry:08X}', f'Native import entries: {len(imports)}',
                  f'Socket and relevant API imports: {len(target)}',
                  f'Static native socket call sites: {len(calls)}',
                  f'Executable sections: {sum(s["executable"] for s in sections)}',
                  'Spawn IDs, counts and XY: not claimed from API call sites alone.',
                  'Zero static socket call sites means no native receiver is identifiable from this PE without runtime evidence.']
              (out/'native-packet-trace-results.txt').write_text('\n'.join(notes)+'\n',encoding='utf-8')
              print('\n'.join(notes))
              subprocess.run(['objdump','-d','-M','intel',str(out/'native-game-client.bin')],
                  stdout=(out/'native-game-client.asm').open('w'),stderr=subprocess.DEVNULL,check=False)
          if __name__ == '__main__':
              if len(sys.argv)==3 and sys.argv[1]=='--test':
                  path=Path(sys.argv[2]);dest=Path('reports');dest.mkdir(exist_ok=True)
                  (dest/'native-game-client.bin').write_bytes(path.read_bytes())
                  inspect_exe(path.read_bytes(),dest)
              else:
                  volume=Path(sys.argv[1]);dest=Path(sys.argv[2]);dest.mkdir(exist_ok=True)
                  raw=unzip_original(volume,dest/'native-game-client.bin')
                  inspect_exe(raw,dest)
          PY_V611
          python3 -m py_compile /tmp/v611-native-receiver.py
          python3 /tmp/v611-native-receiver.py \
            source/Sanctuary.of.Aden.-.Copy.z35 reports
          test -s reports/native-game-client.bin
          test -s reports/native-imports.json
          test -s reports/native-packet-trace-results.txt
          cat reports/native-packet-trace-results.txt
      - name: V6.11 Upload genuine client and packet call-site candidates
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Map-V6.11-Original-Alternate-Client-Receive-Tracing
          path: reports/
          retention-days: 60
          compression-level: 1
          if-no-files-found: error
