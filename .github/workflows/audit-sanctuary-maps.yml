
# FILE: .github/workflows/audit-sanctuary-maps.yml
# VERSION: V6.9
# PURPOSE: Actually decrypt the first protected native-code stage of original lin.bin.
# SOURCE: successful V6.8 native executable recovery, run 39455649091.
# This extracts executable code, NOT a claimed monster spawn list.
# No SLKnight, external SQL, map events, monster balancing, or Pages changes.
name: audit-sanctuary-maps.yml | V6.9 | Original Knight Scale Audit

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/audit-sanctuary-maps.yml]

permissions:
  contents: read
  actions: read

jobs:
  decrypt-native-game-code:
    name: V6.9 | Decrypt original lin.bin first protected code stage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: V6.9 Restore source-verified original lin.bin from V6.8
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39455649091
          name: Sanctuary-Map-V6.8-Original-Native-Packet-Code-Extraction
          github-token: ${{ github.token }}
          path: original

      - name: V6.9 Execute original entry-stub XOR/add decryption on native bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          cat > /tmp/v69-decrypt.py <<'PY_V69'
          from pathlib import Path
          import hashlib, json, struct

          binary = Path('original/native/lin.bin').read_bytes()
          manifest = json.loads(Path('original/reports/native-source-provenance.json').read_text())
          source = next(x for x in manifest if x['filename'] == 'lin.bin')
          sha = hashlib.sha256(binary).hexdigest()
          assert source['sha256'] == sha, 'Wrong original lin.bin'
          assert sha == '0d40fdf84d19e0ecc043766455fb9c5a215a5c39bbac858ca602f0bf5259f19e'

          def u32(blob, pos):
              return struct.unpack_from('<I', blob, pos)[0]

          assert binary[:2] == b'MZ'
          pe = u32(binary, 0x3c)
          assert binary[pe:pe+4] == b'PE\0\0'
          assert struct.unpack_from('<H', binary, pe+24)[0] == 0x10b
          base = u32(binary, pe+24+28)
          entry = base + u32(binary, pe+24+16)
          sections = {}
          count = struct.unpack_from('<H', binary, pe+6)[0]
          table = pe + 24 + struct.unpack_from('<H', binary, pe+20)[0]
          for i in range(count):
              pos = table + 40*i
              name = binary[pos:pos+8].rstrip(b'\0').decode('ascii', 'replace')
              virtual_size, rva, raw_size, offset = struct.unpack_from('<IIII', binary, pos+8)
              sections[name] = (base+rva, raw_size, offset)

          def read_va(address, size):
              for start, length, off in sections.values():
                  if start <= address and address+size <= start+length:
                      return binary[off+address-start:off+address-start+size]
              raise ValueError('Address outside original file-backed section: '+hex(address))

          # These instructions are extracted from the ACTUAL PE entry point.
          stub = read_va(entry, 0x70)
          assert stub[:14] == bytes.fromhex('56 50 53 e8 01 00 00 00 cc 58 89 c3 40 2d')
          assert stub[0x12] == 0x2d and stub[0x17] == 0x05
          assert stub[0x24] == 0xbb and stub[0x29] == 0x68 and stub[0x2e] == 0x68
          assert stub[0x33:0x38] == bytes.fromhex('53 50 e8 0a 00')
          assert stub[0x5e:0x62] == bytes.fromhex('31 06 01 1e')

          # call/pop returns entry+8. Original instructions calculate the decryption VA.
          target = (entry+9-u32(stub,0x0e)-u32(stub,0x13)+u32(stub,0x18)) & 0xffffffff
          count_bytes = u32(stub,0x25)
          add_key = u32(stub,0x2a)
          xor_key = u32(stub,0x2f)
          assert entry == 0x016ce000
          assert target == 0x0151e000 and count_bytes == 4096
          assert target == sections['hsebmuhf'][0]
          encrypted = read_va(target, count_bytes)
          decoded = bytearray(count_bytes)
          for pos in range(0, count_bytes, 4):
              value = u32(encrypted, pos)
              value = ((value ^ xor_key) + add_key) & 0xffffffff
              struct.pack_into('<I', decoded, pos, value)

          # Real x86 pushad/call/pop and the native LZ back-reference unpack routine.
          assert decoded[:7] == bytes.fromhex('60 e8 00 00 00 00 58')
          assert decoded[0xbf:0xc9] == bytes.fromhex('60 8b 74 24 24 8b 7c 24 28 fc')
          assert decoded[0x5e] == 0xb8 and decoded[0x65] == 0xb9
          assert decoded[0x6e:0x73] == bytes.fromhex('e8 4c 00 00 00')
          stream_address = base + u32(decoded,0x66)
          unpack_destination = base + u32(decoded,0x5f)
          next_unpack_function = target+0xbf
          assert stream_address == 0x0151e212
          assert unpack_destination == 0x012cb014

          out = Path('reports')
          (out/'v69-decrypted-native-stage1.bin').write_bytes(decoded)
          result = (
              'V6.9 original protected lin.bin decryption\n'
              f'Original lin.bin SHA256: {sha}\n'
              f'Original entry VA: 0x{entry:08X}\n'
              f'Decrypted stage1 VA: 0x{target:08X}\n'
              f'Decrypted bytes: {count_bytes}\n'
              f'Stage1 SHA256: {hashlib.sha256(decoded).hexdigest()}\n'
              f'Native unpack function: 0x{next_unpack_function:08X}\n'
              f'Native compressed stream start: 0x{stream_address:08X}\n'
              f'Native unpack destination: 0x{unpack_destination:08X}\n'
              'Status: REAL FIRST CODE STAGE RECOVERED; FULL GAME NOT YET UNPACKED.\n'
              'Monster initial spawn IDs and XY: NOT EXTRACTED.\n'
          )
          (out/'v69-native-stage1-result.txt').write_text(result)
          print(result, flush=True)
          PY_V69
          python3 /tmp/v69-decrypt.py
          objdump -D -b binary -m i386 -M intel \
            --adjust-vma=0x151e000 \
            reports/v69-decrypted-native-stage1.bin \
            > reports/v69-decrypted-native-stage1.asm
          test -s reports/v69-decrypted-native-stage1.asm
          grep -q '151e0bf:' reports/v69-decrypted-native-stage1.asm
          cat reports/v69-native-stage1-result.txt

      - name: V6.9 Upload actual decrypted executable code and assembly
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Map-V6.9-Original-Lin-Bin-Decrypted-Stage1
          path: reports/
          retention-days: 60
          if-no-files-found: error
