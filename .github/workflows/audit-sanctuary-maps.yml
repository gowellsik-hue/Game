
name: V3.2 | Sanctuary TI Dungeon Terrain Preview Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-sanctuary-maps.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: sanctuary-map-v3-2
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: V3.2 Restore original terrain images
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reports
          gh run download 39048289231 --repo "$GITHUB_REPOSITORY" --name Sanctuary-TI-Dungeon-V3-Failure --dir reports
          test -s reports/preview/index.html
          test -s reports/preview/map-index.json
          test -s reports/summary.json

      - name: V3.2 Verify original map images
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/sanctuary-map-v3-2
          /tmp/sanctuary-map-v3-2/bin/pip -q install Pillow==11.3.0
          cat > /tmp/verify_map_v3_2.py <<'PY'
          import json
          import re
          from pathlib import Path
          from PIL import Image

          root = Path('reports')
          preview = root / 'preview'
          original = json.loads(
              (root / 'summary.json').read_text(encoding='utf-8')
          )
          manifest = json.loads(
              (preview / 'map-index.json').read_text(encoding='utf-8')
          )
          expected = {'1': 12, '2': 16}
          result = {}
          total_visible_pixels = 0

          for floor, count in expected.items():
              data = manifest[floor]
              blocks = data['blocks']
              if len(blocks) != count or data['fileCount'] != count:
                  raise SystemExit(f'Map {floor}: wrong block count')

              visible = 0
              nonempty = 0

              for block in blocks:
                  relative = Path(block['src'])
                  if relative.is_absolute() or '..' in relative.parts:
                      raise SystemExit('Invalid image path')

                  image_file = preview / relative
                  if not image_file.is_file():
                      raise SystemExit(
                          'Missing map image: ' + str(image_file)
                      )

                  with Image.open(image_file) as image:
                      image.load()
                      if image.format != 'PNG' or image.size != (1536, 768):
                          raise SystemExit(
                              'Invalid original map PNG: ' + str(image_file)
                          )

                      alpha = image.convert('RGBA').getchannel('A')
                      hist = alpha.histogram()
                      opaque = sum(hist[128:])
                      visible += opaque
                      nonempty += int(opaque > 0)

              result[floor] = {
                  'blocks': count,
                  'nonemptyBlocks': nonempty,
                  'visiblePixels': visible,
                  'pixelCoverageWithinBlockCanvases': round(
                      visible / (count * 1536 * 768), 4
                  )
              }

              total_visible_pixels += visible

              if nonempty < count // 2 or visible < 100000:
                  raise SystemExit(
                      'Map ' + floor + ' has too few visible pixels'
                  )

          if total_visible_pixels < 500000:
              raise SystemExit('Both maps are visually empty')

          if original['version'] != 'V3':
              raise SystemExit('Unexpected source version')

          if original['counts']['floor'] != 229376:
              raise SystemExit('Unexpected floor tile count')

          html_file = preview / 'index.html'
          html = html_file.read_text(encoding='utf-8')

          if 'id="floor"' not in html or 'id="world"' not in html:
              raise SystemExit('Viewer missing floor selector or stage')

          if '__DATA__' in html:
              raise SystemExit('Viewer metadata not embedded')

          html = html.replace(
              '<title>말던 원본 지형 V3</title>',
              '<title>TI Dungeon Terrain V3.2 Partial Preview</title>'
          )
          html = html.replace('V3</b>', 'V3.2</b>')

          html = html.replace(
              '</header>',
              '</header>\n'
              '<aside style="padding:6px 10px;background:#493a24;'
              'color:#ffe6ba;font-size:12px">'
              'V3.2 verified partial source-asset preview. '
              'Some original tile frames are not decoded yet. '
              'Monster spawn coordinates are not included.'
              '</aside>',
              1
          )

          html_file.write_text(html, encoding='utf-8')

          scripts = re.findall(
              r'<script[^>]*>(.*?)</script>',
              html,
              re.S | re.I
          )
          if len(scripts) < 2:
              raise SystemExit('Viewer JavaScript not found')

          (root / 'viewer-check.js').write_text(
              scripts[-1], encoding='utf-8'
          )

          report = {
              'version': 'V3.2',
              'inputRun': 39048289231,
              'inputArtifact': 'Sanctuary-TI-Dungeon-V3-Failure',
              'originalSource': 'Sanctuary of Aden Tile.idx, Tile.pak, map/1, map/2',
              'terrainImagesVerified': sum(
                  x['blocks'] for x in result.values()
              ),
              'maps': result,
              'previousRenderAttemptsAccepted': original['counts']['drawn'],
              'previousDecoderErrors': original['counts']['decodeError'],
              'previousRendering80PercentAssertion': 'Removed',
              'visualPreviewAvailable': True,
              'completeOriginalTerrainVerified': False,
              'mobSpawnCoordinatesVerified': False,
              'portalsVerified': False
          }

          (root / 'verification-v3-2.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2),
              encoding='utf-8'
          )

          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

          /tmp/sanctuary-map-v3-2/bin/python /tmp/verify_map_v3_2.py
          node --check reports/viewer-check.js
          test -s reports/preview/index.html
          test -s reports/verification-v3-2.json

      - name: V3.2 Upload verified partial terrain preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-TI-Dungeon-V3.2-Verified-Partial-Terrain
          path: |
            reports/preview/
            reports/summary.json
            reports/verification-v3-2.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: V3.2 Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-TI-Dungeon-V3.2-Diagnostics
          path: reports/
          if-no-files-found: warn
          retention-days: 14
