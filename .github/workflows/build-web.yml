name: Deploy modern DiabloWebAI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout modern DiabloWebAI
        uses: actions/checkout@v4
        with:
          repository: levidehaan/diablowebai
          ref: 4becbb4c81323dc8982504ecb2a5f338434c9772
          path: app

      - name: Verify modern WASM loader
        shell: bash
        run: |
          set -e

          echo "=== MODERN LOADER ==="

          grep -n \
            "await module.ready" \
            app/src/api/game.worker.js

          grep -n \
            "return module" \
            app/src/api/game.worker.js

          echo "MODERN_LOADER_OK"

      - name: Fix upstream package-lock mismatch
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("app/package.json")
          data = json.loads(
              p.read_text(encoding="utf-8")
          )

          dev = data.get(
              "devDependencies",
              {}
          )

          removed = dev.pop(
              "canvas",
              None
          )

          p.write_text(
              json.dumps(
                  data,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print(
              "Removed canvas:",
              removed
          )
          PY

          python3 - <<'PY'
          import json
          from pathlib import Path

          package = json.loads(
              Path(
                  "app/package.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          lock = json.loads(
              Path(
                  "app/package-lock.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          root = lock["packages"][""]

          for section in [
              "dependencies",
              "devDependencies"
          ]:
              a = package.get(
                  section,
                  {}
              )

              b = root.get(
                  section,
                  {}
              )

              if a != b:
                  print(
                      "ERROR:",
                      section,
                      "still mismatched"
                  )

                  print(
                      "package-only:",
                      sorted(
                          set(a) - set(b)
                      )
                  )

                  print(
                      "lock-only:",
                      sorted(
                          set(b) - set(a)
                      )
                  )

                  raise SystemExit(1)

          print(
              "PACKAGE_LOCK_SYNC_OK"
          )
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Show Node versions
        shell: bash
        run: |
          node --version
          npm --version

      - name: Install dependencies
        working-directory: app
        shell: bash
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
        run: |
          set -e

          npm ci \
            --legacy-peer-deps \
            --no-audit \
            --no-fund \
            --ignore-scripts

      - name: Build modern DiabloWebAI
        working-directory: app
        shell: bash
        env:
          PUBLIC_URL: .
          NODE_ENV: production
          CI: false
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          set -e

          npm run build

      - name: Ensure shareware MPQ
        shell: bash
        run: |
          set -e

          test -s \
            app/public/spawn.mpq

          cp -f \
            app/public/spawn.mpq \
            app/build/spawn.mpq

          test -s \
            app/build/spawn.mpq

          echo "=== SPAWN.MPQ ==="

          ls -lh \
            app/build/spawn.mpq

      - name: Install cache clearing service worker
        shell: bash
        run: |
          set -e

          cat > app/build/service-worker.js <<'EOF'
          self.addEventListener(
            'install',
            function () {
              self.skipWaiting();
            }
          );

          self.addEventListener(
            'activate',
            function (event) {
              event.waitUntil(
                (async function () {
                  const keys =
                    await caches.keys();

                  await Promise.all(
                    keys.map(
                      function (key) {
                        return caches.delete(
                          key
                        );
                      }
                    )
                  );

                  await self.clients.claim();

                  const windows =
                    await self.clients.matchAll({
                      type: 'window',
                      includeUncontrolled: true
                    });

                  for (
                    const client
                    of windows
                  ) {
                    try {
                      client.navigate(
                        client.url
                      );
                    } catch (e) {
                    }
                  }
                })()
              );
            }
          );

          self.addEventListener(
            'fetch',
            function () {
            }
          );
          EOF

          touch \
            app/build/.nojekyll

      - name: Verify modern build
        shell: bash
        run: |
          set -e

          echo "=== INDEX ==="

          test -s \
            app/build/index.html

          ls -lh \
            app/build/index.html

          echo "=== SPAWN ==="

          test -s \
            app/build/spawn.mpq

          ls -lh \
            app/build/spawn.mpq

          echo "=== DEVILUTIONX ROOT WASM ==="

          test -s \
            app/build/devilutionx.wasm

          ls -lh \
            app/build/devilutionx.wasm

          echo "=== DEVILUTIONX ROOT JS ==="

          test -s \
            app/build/devilutionx.js

          ls -lh \
            app/build/devilutionx.js

          echo "=== WASM DATA ==="

          test -s \
            app/build/wasm/devilutionx.data

          test -s \
            app/build/wasm/devilutionx.wasm

          test -s \
            app/build/wasm/devilutionx.js

          ls -lh \
            app/build/wasm/devilutionx.data \
            app/build/wasm/devilutionx.wasm \
            app/build/wasm/devilutionx.js

          echo "=== BUNDLED WASM ==="

          find \
            app/build \
            -type f \
            -name '*.wasm' \
            -exec ls -lh {} \;

          echo "=== WORKERS ==="

          WORKERS="$(
            find \
              app/build \
              -type f \
              -name '*.worker.js' \
              | wc -l
          )"

          if [ "$WORKERS" -lt 1 ]; then
            echo "ERROR: worker missing"
            exit 1
          fi

          find \
            app/build \
            -type f \
            -name '*.worker.js' \
            -exec ls -lh {} \;

          echo "MODERN_DIABLOWEBAI_OK"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: modern-diablowebai
          path: app/build/
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build

  deploy:
    needs: build
    runs-on: ubuntu-22.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
