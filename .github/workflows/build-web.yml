name: Build and Deploy DiabloWeb AutoAttack

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-22.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Game repo
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # DiabloWeb source pinned to the version used around the
      # current working gh-pages production build.
      # ------------------------------------------------------------
      - name: Checkout DiabloWeb source
        uses: actions/checkout@v4
        with:
          repository: d07RiV/diabloweb
          ref: 998629fd5d9f87ba9693cf1409cf2acea603c06e
          path: diabloweb

      # We only need the original SPAWN.MPQ from the working site.
      - name: Checkout original DiabloWeb production
        uses: actions/checkout@v4
        with:
          repository: d07RiV/diabloweb
          ref: gh-pages
          path: production

      # Exact old web engine used by DiabloWeb.
      - name: Checkout DiabloWeb engine
        uses: actions/checkout@v4
        with:
          repository: d07RiV/devilution
          ref: 798b5122731ae4b5e0c91348e5c44cf79354a94e
          path: engine

      # ------------------------------------------------------------
      # Emscripten
      # ------------------------------------------------------------
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 1.39.20
          actions-cache-folder: emsdk-cache

      # ------------------------------------------------------------
      # Add automatic attack to the original engine
      # ------------------------------------------------------------
      - name: Patch engine for automatic attack
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("engine/Source/diablo.cpp")
          s = p.read_text(encoding="utf-8")

          insert_anchor = """void game_loop(BOOL bStartup)
          {
          """

          if insert_anchor not in s:
              raise SystemExit(
                  "ERROR: game_loop anchor not found"
              )

          auto_attack = r'''
          static int FindMobileAutoAttackTarget()
          {
          	int best = -1;
          	int bestDistance = 9999;

          	const int px = plr[myplr].WorldX;
          	const int py = plr[myplr].WorldY;

          	for (int n = 0; n < nummonsters; n++) {
          		const int mi = monstactive[n];

          		if (mi < 0 || mi >= MAXMONSTERS)
          			continue;

          		MonsterStruct &m = monster[mi];

          		if (m._mDelFlag)
          			continue;

          		if (m._mhitpoints <= 0)
          			continue;

          		if (CanTalkToMonst(mi))
          			continue;

          		const int dx = abs(m._mx - px);
          		const int dy = abs(m._my - py);

          		const int distance =
          		    dx > dy ? dx : dy;

          		/*
          		 * Maximum scan radius.
          		 * Melee attacks still obey the game's own
          		 * attack/path rules.
          		 */
          		if (distance > 8)
          			continue;

          		if (distance >= bestDistance)
          			continue;

          		best = mi;
          		bestDistance = distance;
          	}

          	return best;
          }

          static void TryMobileAutoAttack()
          {
          	if (leveltype == DTYPE_TOWN)
          		return;

          	if (PauseMode == 2)
          		return;

          	if (deathflag)
          		return;

          	if (gmenu_exception())
          		return;

          	if (
          	    stextflag ||
          	    spselflag ||
          	    qtextflag
          	)
          		return;

          	if (
          	    questlog ||
          	    doomflag ||
          	    dropGoldFlag
          	)
          		return;

          	if (track_isscrolling())
          		return;

          	PlayerStruct &player = plr[myplr];

          	/*
          	 * Do not interrupt movement, attack animation,
          	 * hit recovery, spell casting, etc.
          	 */
          	if (player._pmode != PM_STAND)
          		return;

          	const int target =
          	    FindMobileAutoAttackTarget();

          	if (target < 0)
          		return;

          	if (player._pwtype == WT_RANGED) {
          		NetSendCmdParam1(
          		    TRUE,
          		    CMD_RATTACKID,
          		    target
          		);
          	} else {
          		NetSendCmdParam1(
          		    TRUE,
          		    CMD_ATTACKID,
          		    target
          		);
          	}
          }

          '''

          s = s.replace(
              insert_anchor,
              auto_attack + insert_anchor,
              1
          )

          old_logic = """\tif (!gmenu_exception() && sgnTimeoutCurs == 0) {
          		CheckCursMove();
          		track_process();
          	}
          	if (gbProcessPlayers) {
          """

          new_logic = """\tif (!gmenu_exception() && sgnTimeoutCurs == 0) {
          		CheckCursMove();
          		track_process();
          		TryMobileAutoAttack();
          	}
          	if (gbProcessPlayers) {
          """

          if old_logic not in s:
              raise SystemExit(
                  "ERROR: game_logic anchor not found"
              )

          s = s.replace(
              old_logic,
              new_logic,
              1
          )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print("AUTO_ATTACK_PATCH_OK")
          PY

      # ------------------------------------------------------------
      # Enable Diablo + DiabloSpawn web builds.
      # ------------------------------------------------------------
      - name: Patch engine build script
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("engine/build.js")
          s = p.read_text(encoding="utf-8")

          s = s.replace(
              " -s BINARYEN_TRAP_MODE='clamp'",
              ""
          )

          old = """//run_build('-O3 -g -DZ_SOLO', 'Diablo', ['Source']).catch(e => console.error(e.message));
          //run_build('-O3 -g -DZ_SOLO -DSPAWN', 'DiabloSpawn', ['Source']).catch(e => console.error(e.message));
          run_build('-O3 -g -DZ_SOLO', 'MpqCmp', ['Source/rmpq', 'Source/zlib', 'mpqcmp']).catch(e => console.error(e.message));
          """

          new = """(async () => {
            await run_build(
              '-O3 -g -DZ_SOLO',
              'Diablo',
              ['Source']
            );

            await run_build(
              '-O3 -g -DZ_SOLO -DSPAWN',
              'DiabloSpawn',
              ['Source']
            );
          })().catch(e => {
            console.error(e);
            process.exitCode = 1;
          });
          """

          if old not in s:
              raise SystemExit(
                  "ERROR: build.js target block not found"
              )

          s = s.replace(
              old,
              new,
              1
          )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print("BUILD_SCRIPT_PATCH_OK")
          PY

      - name: Verify engine patch
        shell: bash
        run: |
          set -e

          grep -n \
            "FindMobileAutoAttackTarget" \
            engine/Source/diablo.cpp

          grep -n \
            "TryMobileAutoAttack" \
            engine/Source/diablo.cpp

          grep -n \
            "DiabloSpawn" \
            engine/build.js \
            | tail -10

      # ------------------------------------------------------------
      # Compile the engine.
      # This produces matching WASM + JSCC pairs.
      # ------------------------------------------------------------
      - name: Build modified engine
        working-directory: engine
        shell: bash
        run: |
          set -e

          emcc --version
          node --version

          node build.js

      - name: Verify modified engine
        shell: bash
        run: |
          set -e

          test -s engine/Diablo.wasm
          test -s engine/DiabloSpawn.wasm
          test -s engine/Diablo.jscc
          test -s engine/DiabloSpawn.jscc

          echo "=== ENGINE BUILD OK ==="

          ls -lh \
            engine/Diablo.wasm \
            engine/DiabloSpawn.wasm \
            engine/Diablo.jscc \
            engine/DiabloSpawn.jscc

      # ------------------------------------------------------------
      # Put the matching engine pair into DiabloWeb source.
      # ------------------------------------------------------------
      - name: Replace DiabloWeb engine
        shell: bash
        run: |
          set -e

          test -d diabloweb/src/api

          cp \
            engine/Diablo.wasm \
            diabloweb/src/api/Diablo.wasm

          cp \
            engine/DiabloSpawn.wasm \
            diabloweb/src/api/DiabloSpawn.wasm

          cp \
            engine/Diablo.jscc \
            diabloweb/src/api/Diablo.jscc

          cp \
            engine/DiabloSpawn.jscc \
            diabloweb/src/api/DiabloSpawn.jscc

          echo "=== ENGINE REPLACED ==="

          ls -lh \
            diabloweb/src/api/Diablo.wasm \
            diabloweb/src/api/DiabloSpawn.wasm \
            diabloweb/src/api/Diablo.jscc \
            diabloweb/src/api/DiabloSpawn.jscc

      # ------------------------------------------------------------
      # Restore the original shareware MPQ.
      # ------------------------------------------------------------
      - name: Add SPAWN.MPQ
        shell: bash
        run: |
          set -e

          test -s production/spawn.mpq

          cp \
            production/spawn.mpq \
            diabloweb/public/spawn.mpq

          test -s diabloweb/public/spawn.mpq

          stat -c \
            "%n : %s bytes" \
            diabloweb/public/spawn.mpq

      # ------------------------------------------------------------
      # The package-lock at this historical source commit contains
      # four unresolved git-conflict blocks.
      #
      # At commit 998629fd the LOWER/Stashed side matches package.json:
      # node-sass 4.14.1
      # react-dev-utils 11.0.4
      # @babel/core 7.4.3
      # ------------------------------------------------------------
      - name: Repair historical package-lock
        working-directory: diabloweb
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path("package-lock.json")

          lines = p.read_text(
              encoding="utf-8"
          ).splitlines(True)

          out = []
          state = "normal"
          conflicts = 0

          for line in lines:

              if line.startswith("<<<<<<< "):
                  if state != "normal":
                      raise SystemExit(
                          "ERROR: nested conflict"
                      )

                  conflicts += 1
                  state = "upper"
                  continue

              if state == "upper":

                  if line.startswith("======="):
                      state = "lower"

                  continue

              if state == "lower":

                  if line.startswith(">>>>>>> "):
                      state = "normal"
                      continue

                  # Keep the Stashed changes side.
                  out.append(line)
                  continue

              out.append(line)

          if state != "normal":
              raise SystemExit(
                  "ERROR: unterminated conflict"
              )

          fixed = "".join(out)

          data = json.loads(fixed)

          p.write_text(
              json.dumps(
                  data,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print(
              "Resolved conflicts:",
              conflicts
          )

          print(
              "node-sass:",
              data["dependencies"]["node-sass"]["version"]
          )

          print(
              "react-dev-utils:",
              data["dependencies"]["react-dev-utils"]["version"]
          )

          print(
              "@babel/core:",
              data["dependencies"]["@babel/core"]["version"]
          )

          print("LOCKFILE_REPAIR_OK")
          PY

          if grep -nE \
            '^(<<<<<<<|=======|>>>>>>>)' \
            package-lock.json
          then
            echo "ERROR: conflict markers remain"
            exit 1
          fi

      # ------------------------------------------------------------
      # Point React build directly at /Game/.
      # ------------------------------------------------------------
      - name: Set GitHub Pages path
        working-directory: diabloweb
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("package.json")

          data = json.loads(
              p.read_text(encoding="utf-8")
          )

          data["homepage"] = (
              "https://gowellsik-hue.github.io/Game"
          )

          p.write_text(
              json.dumps(
                  data,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print(
              "homepage:",
              data["homepage"]
          )
          PY

      # node-sass 4.14.1 supports Node 14.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 14.21.3

      - name: Show Node versions
        shell: bash
        run: |
          node --version
          npm --version

      # package.json and repaired package-lock are from
      # the same historical DiabloWeb version.
      - name: Install DiabloWeb dependencies
        working-directory: diabloweb
        shell: bash
        run: |
          set -e

          npm ci \
            --no-audit \
            --no-fund

      # ------------------------------------------------------------
      # Rebuild frontend so webpack bundles the NEW JSCC together
      # with the NEW WASM.
      # ------------------------------------------------------------
      - name: Build DiabloWeb
        working-directory: diabloweb
        shell: bash
        env:
          CI: false
        run: |
          set -e

          npm run build

      # ------------------------------------------------------------
      # Final deployment site.
      # ------------------------------------------------------------
      - name: Prepare Pages site
        shell: bash
        run: |
          set -e

          rm -rf _site
          mkdir -p _site

          cp -a \
            diabloweb/build/. \
            _site/

          test -s _site/index.html
          test -s _site/spawn.mpq

          echo "=== SPAWN.MPQ ==="

          stat -c \
            "%n : %s bytes" \
            _site/spawn.mpq

          echo "=== WASM ==="

          find \
            _site \
            -type f \
            -name '*.wasm' \
            -exec ls -lh {} \;

          echo "=== DiabloSpawn ==="

          SPAWN_WASM="$(
            find _site \
              -type f \
              -name 'DiabloSpawn*.wasm' \
              | head -1
          )"

          if [ -z "$SPAWN_WASM" ]; then
            echo "ERROR: built DiabloSpawn WASM missing"
            exit 1
          fi

          test -s "$SPAWN_WASM"

          echo \
            "DiabloSpawn = $SPAWN_WASM"

          echo "=== /Game/ path ==="

          grep -o \
            "/Game/[^\"']*" \
            _site/index.html \
            | head -20 \
            || true

          if grep -RIn \
            "/diabloweb/" \
            _site
          then
            echo \
              "ERROR: old /diabloweb/ path remains"
            exit 1
          fi

          echo "FINAL_SITE_OK"

      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: diabloweb-autoattack
          path: _site/
          if-no-files-found: error

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
