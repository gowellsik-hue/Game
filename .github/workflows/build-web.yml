
name: "build-web.yml | V23 | Original SPR61 hero sprite trial"
run-name: "build-web.yml | V23 | Original SPR61 168 keys 545 frames"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: build-web-yml-v23-spr61
  cancel-in-progress: false

jobs:
  build_v23:
    name: "build-web.yml | V23 | Independent Sanctuary trial"
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: "V23 | Restore successful original game"
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39201817637
          name: Sanctuary-Mobile-V23-Original-SPR61-Trial
          github-token: ${{ github.token }}
          path: restored

      - name: "V23 | Build independent website"
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p site
          cp -a restored/dist/mobile/. site/

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("site")

          html = (root / "index.html").read_text(
              encoding="utf-8"
          )

          title = (
              "<title>Sanctuary of Aden Mobile V23 "
              "· Filtered Motion Timeline and Frame Review</title>"
          )

          assert html.count(title) == 1

          html = html.replace(
              title,
              "<title>Sanctuary V23 Independent Test</title>",
              1
          )

          label = "<strong>Sanctuary Mobile V23</strong>"
          assert html.count(label) == 1

          html = html.replace(
              label,
              "<strong>Sanctuary V23 · 독립 시험판</strong>",
              1
          )

          (root / "index.html").write_text(
              html, encoding="utf-8"
          )

          (root / "Sanctuary-V23-SPR61-Test.html").write_text(
              html, encoding="utf-8"
          )

          (root / ".nojekyll").touch()

          manifest = json.loads(
              (root / "manifest.json").read_text(
                  encoding="utf-8"
              )
          )

          assert manifest["actors"]["hero"]["sprite_id"] == 2786
          assert manifest["actors"]["knight61"]["sprite_id"] == 61

          actions = manifest["actors"]["knight61"]["actions"]

          assert len(actions) == 168
          assert sum(map(len, actions.values())) == 545

          assert len(list(
              (root / "assets").glob("*.png")
          )) == 4161

          assert len(list(
              (root / "tiles").glob("*.png")
          )) == 218

          for filename in (
              "index.html",
              "game.js",
              "game-data.js",
              "game.css",
              "monster-pack.js",
              "motion-review.js"
          ):
              assert (root / filename).is_file(), filename

          print("V23 INDEPENDENT WEBSITE READY")
          PY

          node --check site/game.js
          node --check site/motion-review.js

      - name: "V23 | Upload independent website"
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Test-V23-Independent-Site
          path: site/
          retention-days: 90
          if-no-files-found: error

      - name: "V23 | Publish only to Sanctuary-Test"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SANCTUARY_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "::error::SANCTUARY_DEPLOY_TOKEN is missing"
            echo "Game Pages remains unchanged."
            exit 1
          fi

          target="gowellsik-hue/Sanctuary-Test"

          actor="$(gh api user --jq .login)"

          if [ "$actor" != "gowellsik-hue" ]; then
            echo "::error::Incorrect publishing account"
            exit 1
          fi

          if gh repo view "$target" \
            --json name --jq .name >/dev/null 2>&1
          then
            echo "Independent repository exists"
          else
            gh api --method POST user/repos \
              -f name=Sanctuary-Test \
              -F private=false \
              -F auto_init=true \
              --jq .full_name

            echo "Independent repository created"
          fi

          gh auth setup-git

          git clone \
            "https://github.com/$target.git" \
            sanctuary-deploy

          git -C sanctuary-deploy checkout -B main

          rsync -a --delete \
            --exclude=".git/" \
            site/ sanctuary-deploy/

          git -C sanctuary-deploy config \
            user.name "github-actions[bot]"

          git -C sanctuary-deploy config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git -C sanctuary-deploy add -A

          if ! git -C sanctuary-deploy \
            diff --cached --quiet
          then
            git -C sanctuary-deploy commit \
              -m "Sanctuary V23 independent release"

            git -C sanctuary-deploy push origin HEAD:main
          fi

          if gh api "repos/$target/pages" \
            --silent >/dev/null 2>&1
          then
            echo "Independent Pages already configured"
          else
            printf '%s' \
              '{"build_type":"legacy","source":{"branch":"main","path":"/"}}' \
              | gh api --method POST \
                  "repos/$target/pages" \
                  --input - >/dev/null
          fi

          pages_url="$(
            gh api "repos/$target/pages" --jq .html_url
          )"

          echo "Independent site: $pages_url"

          echo "Game Pages was not modified."

          echo "V23 site: $pages_url" \
            >> "$GITHUB_STEP_SUMMARY"
