name: Build and Deploy DiabloWeb AutoAttack

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-22.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Game repo
        uses: actions/checkout@v4

      - name: Checkout original working DiabloWeb site
        uses: actions/checkout@v4
        with:
          repository: d07RiV/diabloweb
          ref: gh-pages
          path: production

      - name: Checkout DiabloWeb engine source
        uses: actions/checkout@v4
        with:
          repository: d07RiV/devilution
          ref: 798b5122731ae4b5e0c91348e5c44cf79354a94e
          path: engine

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 1.39.20
          actions-cache-folder: emsdk-cache

      - name: Patch engine for automatic attack
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path("engine/Source/diablo.cpp")
          src = path.read_text(encoding="utf-8")

          anchor = """void game_loop(BOOL bStartup)
          {
          """

          if anchor not in src:
              raise SystemExit(
                  "ERROR: game_loop anchor not found"
              )

          auto_attack = r'''
          static int FindMobileAutoAttackTarget()
          {
          	int best = -1;
          	int bestDistance = 9999;

          	const int px = plr[myplr].WorldX;
          	const int py = plr[myplr].WorldY;

          	for (int n = 0; n < nummonsters; n++) {
          		const int mi = monstactive[n];

          		if (mi < 0 || mi >= MAXMONSTERS)
          			continue;

          		MonsterStruct &m = monster[mi];

          		if (m._mDelFlag)
          			continue;

          		if (m._mhitpoints <= 0)
          			continue;

          		if (CanTalkToMonst(mi))
          			continue;

          		const int dx = abs(m._mx - px);
          		const int dy = abs(m._my - py);

          		const int distance =
          		    dx > dy ? dx : dy;

          		if (distance > 8)
          			continue;

          		if (distance >= bestDistance)
          			continue;

          		best = mi;
          		bestDistance = distance;
          	}

          	return best;
          }

          static void TryMobileAutoAttack()
          {
          	if (leveltype == DTYPE_TOWN)
          		return;

          	if (PauseMode == 2)
          		return;

          	if (deathflag)
          		return;

          	if (gmenu_exception())
          		return;

          	if (
          	    stextflag ||
          	    spselflag ||
          	    qtextflag
          	)
          		return;

          	if (
          	    questlog ||
          	    doomflag ||
          	    dropGoldFlag
          	)
          		return;

          	if (track_isscrolling())
          		return;

          	PlayerStruct &player = plr[myplr];

          	/*
          	 * 이동 중에는 자동공격하지 않는다.
          	 * 공격 애니메이션이 끝나고 다시
          	 * PM_STAND가 되면 다음 공격을 한다.
          	 */
          	if (player._pmode != PM_STAND)
          		return;

          	const int target =
          	    FindMobileAutoAttackTarget();

          	if (target < 0)
          		return;

          	if (player._pwtype == WT_RANGED) {
          		NetSendCmdParam1(
          		    TRUE,
          		    CMD_RATTACKID,
          		    target
          		);
          	} else {
          		NetSendCmdParam1(
          		    TRUE,
          		    CMD_ATTACKID,
          		    target
          		);
          	}
          }

          '''

          src = src.replace(
              anchor,
              auto_attack + anchor,
              1
          )

          old_logic = """\tif (!gmenu_exception() && sgnTimeoutCurs == 0) {
          		CheckCursMove();
          		track_process();
          	}
          	if (gbProcessPlayers) {
          """

          new_logic = """\tif (!gmenu_exception() && sgnTimeoutCurs == 0) {
          		CheckCursMove();
          		track_process();
          		TryMobileAutoAttack();
          	}
          	if (gbProcessPlayers) {
          """

          if old_logic not in src:
              raise SystemExit(
                  "ERROR: game_logic anchor not found"
              )

          src = src.replace(
              old_logic,
              new_logic,
              1
          )

          path.write_text(
              src,
              encoding="utf-8"
          )

          print("AUTO_ATTACK_PATCH_OK")
          PY

      - name: Enable Diablo and DiabloSpawn WASM build
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path("engine/build.js")
          src = path.read_text(encoding="utf-8")

          src = src.replace(
              " -s BINARYEN_TRAP_MODE='clamp'",
              ""
          )

          old = """//run_build('-O3 -g -DZ_SOLO', 'Diablo', ['Source']).catch(e => console.error(e.message));
          //run_build('-O3 -g -DZ_SOLO -DSPAWN', 'DiabloSpawn', ['Source']).catch(e => console.error(e.message));
          run_build('-O3 -g -DZ_SOLO', 'MpqCmp', ['Source/rmpq', 'Source/zlib', 'mpqcmp']).catch(e => console.error(e.message));
          """

          new = """(async () => {
            await run_build(
              '-O3 -g0 -DZ_SOLO',
              'Diablo',
              ['Source']
            );

            await run_build(
              '-O3 -g0 -DZ_SOLO -DSPAWN',
              'DiabloSpawn',
              ['Source']
            );
          })().catch(e => {
            console.error(e);
            process.exitCode = 1;
          });
          """

          if old not in src:
              raise SystemExit(
                  "ERROR: build.js target block not found"
              )

          src = src.replace(
              old,
              new,
              1
          )

          path.write_text(
              src,
              encoding="utf-8"
          )

          print("BUILD_JS_PATCH_OK")
          PY

      - name: Verify source patch
        shell: bash
        run: |
          set -e

          echo "=== Auto attack ==="

          grep -n \
            "FindMobileAutoAttackTarget" \
            engine/Source/diablo.cpp

          grep -n \
            "TryMobileAutoAttack" \
            engine/Source/diablo.cpp

          echo "=== Build targets ==="

          grep -n \
            "DiabloSpawn" \
            engine/build.js \
            | tail -10

      - name: Build modified engine
        working-directory: engine
        shell: bash
        run: |
          set -e

          echo "=== Emscripten ==="
          emcc --version

          echo "=== Build ==="
          node build.js

      - name: Verify engine output
        shell: bash
        run: |
          set -e

          test -s engine/Diablo.wasm
          test -s engine/DiabloSpawn.wasm

          echo "=== New WASM ==="

          ls -lh \
            engine/Diablo.wasm \
            engine/DiabloSpawn.wasm

      - name: Prepare original production site
        shell: bash
        run: |
          set -e

          rm -rf _site
          mkdir -p _site

          cp -a production/. _site/

          rm -rf _site/.git
          rm -rf _site/.github

          test -s _site/index.html
          test -s _site/spawn.mpq

          echo "ORIGINAL_SITE_OK"

      - name: Locate original WASM files
        shell: bash
        run: |
          set -e

          DIABLO_FILE="$(
            find _site/static/media \
              -maxdepth 1 \
              -type f \
              -name 'Diablo.*.wasm' \
              | head -1
          )"

          SPAWN_FILE="$(
            find _site/static/media \
              -maxdepth 1 \
              -type f \
              -name 'DiabloSpawn.*.wasm' \
              | head -1
          )"

          if [ -z "$DIABLO_FILE" ]; then
            echo "ERROR: original Diablo wasm not found"
            exit 1
          fi

          if [ -z "$SPAWN_FILE" ]; then
            echo "ERROR: original DiabloSpawn wasm not found"
            exit 1
          fi

          echo "DIABLO_FILE=$DIABLO_FILE" \
            >> "$GITHUB_ENV"

          echo "SPAWN_FILE=$SPAWN_FILE" \
            >> "$GITHUB_ENV"

          echo "=== Original WASM ==="

          ls -lh \
            "$DIABLO_FILE" \
            "$SPAWN_FILE"

      - name: Check WASM JS compatibility
        shell: bash
        run: |
          set -e

          node <<'NODE'
          const fs = require("fs");

          function info(path) {
            const bytes = fs.readFileSync(path);
            const mod = new WebAssembly.Module(bytes);

            return {
              imports:
                WebAssembly.Module
                  .imports(mod)
                  .map(x =>
                    x.module + ":" +
                    x.name + ":" +
                    x.kind
                  )
                  .sort(),

              exports:
                WebAssembly.Module
                  .exports(mod)
                  .map(x =>
                    x.name + ":" +
                    x.kind
                  )
                  .sort()
            };
          }

          function compare(oldFile, newFile, label) {
            const a = info(oldFile);
            const b = info(newFile);

            const oldImports =
              new Set(a.imports);

            const newImports =
              new Set(b.imports);

            const missingImports =
              b.imports.filter(
                x => !oldImports.has(x)
              );

            console.log(
              label,
              "old imports:",
              a.imports.length
            );

            console.log(
              label,
              "new imports:",
              b.imports.length
            );

            console.log(
              label,
              "old exports:",
              a.exports.length
            );

            console.log(
              label,
              "new exports:",
              b.exports.length
            );

            /*
             * New WASM must not suddenly require
             * JS imports that the original worker
             * does not provide.
             */
            if (missingImports.length) {
              console.error(
                "ERROR:",
                label,
                "requires new JS imports:"
              );

              console.error(
                missingImports.join("\n")
              );

              process.exit(1);
            }
          }

          compare(
            process.env.DIABLO_FILE,
            "engine/Diablo.wasm",
            "Diablo"
          );

          compare(
            process.env.SPAWN_FILE,
            "engine/DiabloSpawn.wasm",
            "DiabloSpawn"
          );

          console.log(
            "WASM_IMPORT_COMPATIBILITY_OK"
          );
          NODE

      - name: Replace only WASM engine
        shell: bash
        run: |
          set -e

          cp \
            engine/Diablo.wasm \
            "$DIABLO_FILE"

          cp \
            engine/DiabloSpawn.wasm \
            "$SPAWN_FILE"

          echo "=== Replaced WASM ==="

          ls -lh \
            "$DIABLO_FILE" \
            "$SPAWN_FILE"

      - name: Rewrite site path for Game
        shell: bash
        run: |
          set -e

          echo \
            "Replacing /diabloweb/ with /Game/ ..."

          while IFS= read -r file
          do
            sed -i \
              's#/diabloweb/#/Game/#g' \
              "$file"
          done < <(
            grep -RIl \
              "/diabloweb/" \
              _site \
              || true
          )

          echo \
            "=== Remaining old paths ==="

          if grep -RIn \
            "/diabloweb/" \
            _site
          then
            echo \
              "ERROR: old path still exists"
            exit 1
          fi

          echo "PATH_REWRITE_OK"

      - name: Refresh WASM precache revisions
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          site = Path("_site")

          manifests = list(
              site.glob(
                  "precache-manifest*.js"
              )
          )

          if not manifests:
              raise SystemExit(
                  "ERROR: precache manifest not found"
              )

          manifest = manifests[0]

          text = manifest.read_text(
              encoding="utf-8"
          )

          wasm_files = [
              p
              for p in (
                  site /
                  "static" /
                  "media"
              ).glob("*.wasm")
              if (
                  p.name.startswith("Diablo.")
                  or
                  p.name.startswith(
                      "DiabloSpawn."
                  )
              )
          ]

          for wasm in wasm_files:
              revision = hashlib.md5(
                  wasm.read_bytes()
              ).hexdigest()

              name = re.escape(
                  wasm.name
              )

              pattern = (
                  r'("revision":\s*")'
                  r'[^"]+'
                  r'(",\s*"url":\s*"'
                  r'[^"]*'
                  + name +
                  r'")'
              )

              text, count = re.subn(
                  pattern,
                  r'\g<1>' +
                  revision +
                  r'\g<2>',
                  text,
                  count=1
              )

              if count != 1:
                  raise SystemExit(
                      "ERROR: could not update "
                      + wasm.name
                      + " precache revision"
                  )

              print(
                  wasm.name,
                  revision
              )

          manifest.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "PRECACHE_REFRESH_OK"
          )
          PY

      - name: Final site verification
        shell: bash
        run: |
          set -e

          echo "=== SPAWN.MPQ ==="

          test -s _site/spawn.mpq

          stat -c \
            "%n : %s bytes" \
            _site/spawn.mpq

          echo "=== WASM files ==="

          find \
            _site/static/media \
            -maxdepth 1 \
            -type f \
            -name '*.wasm' \
            -exec ls -lh {} \;

          echo "=== AutoAttack WASM size ==="

          test -s "$DIABLO_FILE"
          test -s "$SPAWN_FILE"

          echo "=== /Game/ references ==="

          grep -o \
            "/Game/[^\"']*" \
            _site/index.html \
            | head -20 \
            || true

          echo "FINAL_SITE_OK"

      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: diabloweb-autoattack
          path: _site/
          if-no-files-found: error

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
