
name: "V16.2 | Sanctuary of Aden Mobile | Multi-Monster Motion Review (Fix)"
run-name: "V16.2 | Sanctuary of Aden Mobile | Multi-Monster Motion Review (Fix)"

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml
      - "mobile-monsters/packs/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sanctuary-mobile-v16-2
  cancel-in-progress: false

jobs:
  mobile-v16-2:
    name: "V16.2 | Multi-Monster Motion Review | Repair and Verify"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "V16.2 | Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "V16.2 | Repair pinned V16 and rebuild from verified V15"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/mobile reports
          git show 84bc8622ebecf8167cebe2bffb9d03527127cbf3:.github/workflows/build-web.yml > reports/pinned-v16.yml
          python3 -m venv /tmp/sanctuary-v16-2
          /tmp/sanctuary-v16-2/bin/pip -q install 'PyYAML==6.0.2' 'Pillow==11.3.0'
          cat > reports/replay_v16.py <<'PY_REPLAY'
          import os,subprocess,yaml,re,base64,hashlib
          from pathlib import Path
          source=Path('reports/pinned-v16.yml').read_text(encoding='utf-8')
          assert 'Sanctuary of Aden Mobile V16 Multi-Monster Motion Review' in source
          fixes=(('7IH?u9E9^','7IH%?u9E9^'),('PqCf=w`<XJ','PqCf=w`{<XJ'),('P&dSg<~xHJo','P&dSg<~XhJo'))
          for old,new in fixes:
              if source.count(old)!=1:raise SystemExit('V16 source mismatch at '+old)
              source=source.replace(old,new,1)
          match=re.search(r"blob=base64.b85decode\(''.join\(\((.*?)\)\)\)",source,re.S)
          if not match:raise SystemExit('V16 pinned bundle not found')
          sections=re.findall(r"'([^']+)'",match.group(1))
          archive=base64.b85decode(''.join(sections))
          expected='94f1b1f01c017f7a66811c5e9da11eda2ecc677b22f87df446a2bb55e8eec6e3'
          if hashlib.sha256(archive).hexdigest()!=expected:raise SystemExit('V16 source checksum mismatch')
          steps=yaml.safe_load(source)['jobs']['build']['steps']
          names=('Restore verified V15 mobile game','Install multi-monster motion bridge','Verify actor-specific motion trials and original assets')
          env=dict(os.environ);env['PATH']='/tmp/sanctuary-v16-2/bin:'+env['PATH']
          for name in names:
              found=[step for step in steps if step.get('name')==name and isinstance(step.get('run'),str)]
              if len(found)!=1:raise SystemExit('V16 pinned step missing: '+name)
              print('V16.2 executing:',name,flush=True)
              subprocess.run(['bash','-e','-o','pipefail','-c',found[0]['run']],env=env,check=True)
          print('V16.2: validated source and original gameplay regressions passed',flush=True)
          PY_REPLAY
          /tmp/sanctuary-v16-2/bin/python reports/replay_v16.py

      - name: "V16.2 | Stamp visible version and verify assets"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERSION'
          from pathlib import Path
          import hashlib,json
          root=Path('dist/mobile')
          index=root/'index.html'
          info_path=root/'build-info.json'
          html=index.read_text(encoding='utf-8')
          info=json.loads(info_path.read_text(encoding='utf-8'))
          if info.get('package')!=16 or info.get('runtime')!=16:raise SystemExit('V16 runtime not found')
          if info.get('source_run')!=39050704098:raise SystemExit('V15 source was changed')
          if html.count('V16')<4 or 'V16.2' in html:raise SystemExit('Game version text mismatch')
          html=html.replace('V16','V16.2')
          index.write_text(html,encoding='utf-8')
          info.update(version='16.2',display_version='V16.2')
          info['workflow_fix']='Restored 3 altered characters in pinned V16 Base85 source'
          info['sha256']['index.html']=hashlib.sha256(index.read_bytes()).hexdigest()
          info_path.write_text(json.dumps(info,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          with (root/'README_KO.txt').open('a',encoding='utf-8') as file:
              file.write('\nV16.2: Multi-monster review repair, original V15 combat unchanged.\n')
          for name,sha in info['sha256'].items():
              if hashlib.sha256((root/name).read_bytes()).hexdigest()!=sha:raise SystemExit('Hash mismatch: '+name)
          assert html.count('V16.2')>=4
          assert len(list((root/'assets').glob('*.png')))>=3616
          assert len(list((root/'tiles').glob('*.png')))==218
          assert len(list((root/'motion-gifs/v18').glob('*.gif')))==40
          print('V16.2 PASS: labels, sprites, monster reviews and original game assets')
          PY_VERSION
          node --check dist/mobile/game.js
          node --check dist/mobile/motion-review.js
          printf '%s\n' 'V16.2 verified: pinned V15 combat + multi-monster review and stable version labels.' >> "$GITHUB_STEP_SUMMARY"

      - name: "V16.2 | Upload playable mobile game"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Mobile-V16.2-Multi-Monster-Review
          path: dist/mobile/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: "V16.2 | Upload diagnostics"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Mobile-V16.2-Diagnostics
          path: reports/
          if-no-files-found: warn
          retention-days: 14
