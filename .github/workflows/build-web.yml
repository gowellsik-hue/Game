
name: "build-web.yml | V25 | Original SPR61 hero sprite trial"
run-name: "build-web.yml | V25 | Independent Sanctuary-Test preview"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: build-web-yml-v25-independent-preview
  cancel-in-progress: false

jobs:
  build_v25:
    name: "build-web.yml | V25 | Verify V24 and package independent preview"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: "V25 | Restore successful V24 independent build"
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39209378592
          name: Sanctuary-Test-V24-Independent-Site
          github-token: ${{ github.token }}
          path: restored

      - name: "V25 | Verify original files and produce versioned standalone HTML"
        shell: bash
        run: |
          set -euo pipefail
          test -s restored/index.html
          mkdir -p site
          cp -a restored/. site/
          python3 - <<'PY_V25'
          import hashlib
          import json
          import re
          from html.parser import HTMLParser
          from pathlib import Path

          root = Path('site')
          info_path = root / 'build-info.json'
          info = json.loads(info_path.read_text(encoding='utf-8'))
          assert (info['package'], info['runtime'], info['display_version']) == (24, 24, 'V24')
          for name, expected in info['sha256'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest() == expected, 'V24 source changed: ' + name

          manifest = json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert manifest['actors']['hero']['sprite_id'] == 2786
          actor = manifest['actors']['knight61']
          assert actor['sprite_id'] == 61
          assert len(actor['actions']) == 168
          assert sum(map(len, actor['actions'].values())) == 545
          assert len(list((root/'assets').glob('*.png'))) == 4161
          assert len(list((root/'assets').glob('knight61-61-*.png'))) == 545
          assert len(list((root/'tiles').glob('*.png'))) == 218
          assert not (root/'native-world').exists()

          html = (root/'index.html').read_text(encoding='utf-8')
          assert len(re.findall(r'\bV24\b', html)) == 5, 'Unexpected input HTML version markers'
          html = re.sub(r'\bV24\b', 'V25', html)
          assert not re.search(r'\bV(?:19|23|24)\b', html)
          assert 'gowellsik-hue.github.io/Game/' not in html
          (root/'index.html').write_text(html, encoding='utf-8')
          (root/'Sanctuary-V25-SPR61-Test.html').write_text(html, encoding='utf-8')
          (root/'Sanctuary-V24-SPR61-Test.html').unlink()
          (root/'V24-build-report.json').unlink()
          (root/'.nojekyll').touch()

          # Keep engine data unchanged; only V25 display and packaging metadata are new.
          info['sha256'].pop('Sanctuary-V24-SPR61-Test.html', None)
          info.update(
              version='25', package=25, runtime=25, display_version='V25',
              v25_source_version='V24', v25_source_run=39209378592,
              v25_source_artifact='Sanctuary-Test-V24-Independent-Site',
              v25_mode='independent_browser_preview',
              v25_preview_branch='sanctuary-preview',
              v25_preview_url='https://raw.githack.com/gowellsik-hue/Game/sanctuary-preview/index.html',
              v25_game_code_changed=False,
              v25_game_data_changed=False,
              v25_map_changed=False,
              v25_scale_changed=False
          )
          for name in ('index.html', 'Sanctuary-V25-SPR61-Test.html'):
              info['sha256'][name] = hashlib.sha256((root/name).read_bytes()).hexdigest()
          info_path.write_text(json.dumps(info, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          class Dependencies(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.files=[]
              def handle_starttag(self, tag, attrs):
                  pairs=dict(attrs)
                  if tag=='script' and pairs.get('src'):
                      self.files.append(pairs['src'])
                  if tag=='link' and pairs.get('href'):
                      self.files.append(pairs['href'])
          dep=Dependencies()
          dep.feed(html)
          for name in dep.files:
              assert '://' not in name and not name.startswith('/')
              assert (root/name).is_file(), 'Missing static dependency: '+name
          for name, expected in info['sha256'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest() == expected, name

          report = {
              'version':'V25',
              'sourceRun':39209378592,
              'originalHeroSprite':2786,
              'candidateSprite':61,
              'candidateSpriteKeys':168,
              'candidateSpriteFrames':545,
              'engineDataModified':False,
              'originalGamePagesModified':False,
              'hostType':'raw.githack.com independent preview',
              'hostIsGitHubPages':False,
              'previewBranch':'sanctuary-preview',
              'publicationStatus':'pending until publish_v25 succeeds'
          }
          (root/'V25-build-report.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2)+'\n', encoding='utf-8'
          )
          (root/'Sanctuary-Preview-Branch-Marker.json').write_text(
              json.dumps({'purpose':'Sanctuary independent preview',
                          'branch':'sanctuary-preview', 'version':'V25'}, indent=2)+'\n',
              encoding='utf-8'
          )
          print('V25_PACKAGE_PASS: independent game, 168 keys, 545 frames, V25 UI')
          PY_V25
          node --check site/game.js
          node --check site/motion-review.js
          node --check site/monster-pack.js

      - name: "V25 | Upload independently playable site artifact"
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Test-V25-Independent-Preview
          path: site/
          retention-days: 90
          if-no-files-found: error

  publish_v25:
    name: "build-web.yml | V25 | Publish preview at a different address"
    needs: build_v25
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: "V25 | Restore this run's new versioned site"
        uses: actions/download-artifact@v4
        with:
          name: Sanctuary-Test-V25-Independent-Preview
          path: site

      - name: "V25 | Publish to isolated preview branch using built-in token"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='sanctuary-preview'
          test -s site/index.html
          test -s site/Sanctuary-V25-SPR61-Test.html
          test -s site/Sanctuary-Preview-Branch-Marker.json
          gh auth setup-git
          git init -q -b temp-publisher publisher
          git -C publisher remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if git -C publisher ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; then
            git -C publisher fetch -q --depth=1 origin "refs/heads/$branch"
            git -C publisher checkout -q -b "$branch" FETCH_HEAD
            test -s publisher/Sanctuary-Preview-Branch-Marker.json || {
              echo '::error::Preview branch exists but is not our managed site; refusing overwrite.'
              exit 1
            }
          else
            git -C publisher checkout -q --orphan "$branch"
          fi
          rsync -a --delete --exclude='.git/' site/ publisher/
          git -C publisher config user.name 'github-actions[bot]'
          git -C publisher config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C publisher add -A
          if ! git -C publisher diff --cached --quiet; then
            git -C publisher commit -qm 'Publish Sanctuary independent preview V25'
            git -C publisher push -q origin "HEAD:refs/heads/$branch"
          fi
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/contents/index.html?ref=$branch" --jq .sha)"
          test -n "$actual" && test "$actual" != null
          short="$(git -C publisher rev-parse --short HEAD)"
          preview="https://raw.githack.com/${GITHUB_REPOSITORY}/${branch}/index.html"
          echo "V25_PUBLIC_PREVIEW_PUSHED: $preview (commit $short)"
          {
            echo '### V25 independent preview branch successfully published'
            echo "- Open: $preview"
            echo "- Versioned HTML: https://raw.githack.com/${GITHUB_REPOSITORY}/${branch}/Sanctuary-V25-SPR61-Test.html"
            echo '- This is a third-party preview, not the Sanctuary-Test GitHub Pages site.'
            echo '- Original Game GitHub Pages settings and source branch were not modified.'
            echo '- First visit may show a raw.githack.com confirmation screen.'
          } >> "$GITHUB_STEP_SUMMARY"
