
name: "build-web.yml | V20 | SLKnight Native 44 Maps and 500 Source Events"
run-name: "build-web.yml | V20 | SLKnight Native 44 Maps and 500 Source Events"

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: build-web-yml-v20
  cancel-in-progress: false

jobs:
  build_web_v20:
    name: "build-web.yml | V20 | Restore, Integrate and Verify"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "build-web.yml | V20 | Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "build-web.yml | V20 | Prepare runtime"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports dist/mobile

      - name: "build-web.yml | V20 | Restore verified V19 game"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh run download 39125690585 --repo "$GITHUB_REPOSITORY" --name Sanctuary-Mobile-V19-Timeline-Filters-Frame-Review --dir dist/mobile; then
            echo 'build-web.yml | V20 | V19 original game restored from verified successful run'
          else
            rm -rf dist/mobile && mkdir -p dist/mobile
            git show 3db5a28b357df526d3164093d48501ec9de43084:.github/workflows/build-web.yml > reports/pinned-v19.yml
            python3 -m venv /tmp/sanctuary-v20
            /tmp/sanctuary-v20/bin/pip -q install 'PyYAML==6.0.2' 'Pillow==11.3.0'
            cat > reports/restore_v19.py <<'PY_RESTORE_V19'
          import os,subprocess,yaml
          from pathlib import Path
          steps=yaml.safe_load(Path('reports/pinned-v19.yml').read_text(encoding='utf-8'))['jobs']['build_web_v19']['steps']
          names=('build-web.yml | V19 | Restore verified V18','build-web.yml | V19 | Add mode and SPR filters and frame stepping','build-web.yml | V19 | Validate unchanged game and review features')
          env=dict(os.environ);env['PATH']='/tmp/sanctuary-v20/bin:'+env['PATH']
          for name in names:
              matched=[s for s in steps if s.get('name')==name and isinstance(s.get('run'),str)]
              if len(matched)!=1:raise SystemExit('Missing pinned V19 step '+name)
              subprocess.run(['bash','-e','-o','pipefail','-c',matched[0]['run']],env=env,check=True)
              print('build-web.yml | V20 | restored V19:',name,flush=True)
          PY_RESTORE_V19
            /tmp/sanctuary-v20/bin/python reports/restore_v19.py
          fi
          test -f dist/mobile/game.js
          test -f dist/mobile/manifest.json

      - name: "build-web.yml | V20 | Download confirmed SLKnight map source"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reports/map54
          gh run download 39125584203 --repo "$GITHUB_REPOSITORY" --name Sanctuary-Map-V5.4-Spawn-Lifecycle-and-Boss-Overrides --dir reports/map54
          test -f reports/map54/native-maps-v5.1.json
          test -f reports/map54/spawn-integration-v5.3.json
          test -f reports/map54/collision-index-v5.2.json
          test -f reports/map54/spawn-runtime-summary-v5.4.json
          test -f reports/map54/maps/map-044.png
          echo 'build-web.yml | V20 | 44 original RPG Maker maps, static collision and event sources downloaded'
      - name: "build-web.yml | V20 | Install real 44 maps, directional tile collision and original event markers"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          cat > reports/native-world.js <<'JS_NATIVE_V20'
          /* build-web.yml | V20 | Original SLKnight map movement - not Sanctuary S32 coordinates */
          (()=>{'use strict';
          const DATA=window.SANCTUARY_NATIVE_MAPS;
          if(!DATA||DATA.schema!=='slknight.native-world.v20'||DATA.differentFromSanctuaryS32!==true||DATA.maps.length!==44)throw Error('V20 native map manifest is invalid');
          const el=id=>document.getElementById(id),overlay=el('nativeOverlay'),canvas=el('nativeCanvas'),ctx=canvas.getContext('2d',{alpha:false});
          const keyDown=new Set(),held=new Set(),dirs=[[-1,0,2,4],[1,0,4,2],[0,-1,8,1],[0,1,1,8]];
          const HERO=window.SANCTUARY_MANIFEST?.actors?.hero;
          if(!HERO?.actions)throw Error('V20 cannot find preserved V19 original hero SPR');
          const images=new Map();let active=false,current=null,mask=null,terrain=null,loadVersion=0,last=0,sw=1,sh=1,dpr=1,zoom=35,showMarkers=true,route=[],hero={x:.5,y:.5,dir:0,step:0,moving:false},spawn=null,eventMessage='',frames=0;
          function decodeMask(encoded,size){
           const binary=atob(encoded),output=new Uint8Array(size);let ptr=0,off=0;
           while(ptr<binary.length){const value=binary.charCodeAt(ptr++);let shift=0,count=0,byte;
            do{if(ptr>=binary.length||shift>28)throw Error('Malformed native collision runs');byte=binary.charCodeAt(ptr++);count|=(byte&127)<<shift;shift+=7}while(byte&128);
            if(!count||off+count>size)throw Error('Native collision size overflow');output.fill(value,off,off+count);off+=count;
           }
           if(off!==size)throw Error('Native collision size mismatch');return output;
          }
          function bit(x,y){if(!current||x<0||y<0||x>=current.width||y>=current.height)return 255;return mask[y*current.width+x]}
          function passable(x,y){const b=bit(x,y);return b!==255&&b!==15}
          function canStep(x,y,nx,ny){
           if(!passable(x,y)||!passable(nx,ny))return false;
           const dx=nx-x,dy=ny-y;if(Math.abs(dx)+Math.abs(dy)!==1)return false;
           const d=dirs.find(v=>v[0]===dx&&v[1]===dy);return !!d&&!(bit(x,y)&d[2])&&!(bit(nx,ny)&d[3]);
          }
          function closestWalkable(mapMask,map,w,h,x,y){let best=null,score=Infinity;
           for(let iy=0;iy<h;iy++)for(let ix=0;ix<w;ix++){const value=mapMask[iy*w+ix];if(value===15||value===255)continue;
           const s=(ix-x)**2+(iy-y)**2;if(s<score){score=s;best={x:ix,y:iy}}}
           return best;
          }
          function clearMovement(){route=[];held.clear();keyDown.clear();hero.moving=false}
          function report(text){eventMessage=text;el('nativeEventDetail').textContent=text}
          function status(){if(!current)return;el('nativeLocation').textContent=`#${current.id} ${current.name} · ${current.width}×${current.height} · 위치 ${Math.floor(hero.x)},${Math.floor(hero.y)} · 초기 이벤트 ${current.events.length}개 / 통과 가능 ${current.events.filter(e=>e.placed).length}개`}
          function resize(){if(!active)return;dpr=Math.min(2,window.devicePixelRatio||1);sw=Math.max(1,canvas.clientWidth);sh=Math.max(1,canvas.clientHeight);canvas.width=Math.round(sw*dpr);canvas.height=Math.round(sh*dpr)}
          function cacheHero(url){if(!url)return null;let image=images.get(url);if(image)return image;image=new Image();image.decoding='async';image.src=url;images.set(url,image);if(images.size>120)images.delete(images.keys().next().value);return image}
          function drawHero(){
           const mode=hero.moving?'walk':'idle';const base=mode==='walk'?0:32,actorKey=String(base+hero.dir);
           const actions=HERO.actions[actorKey]||HERO.actions[String(base)]||HERO.actions['0']||[];
           const index=actions.length?(hero.moving?Math.floor(hero.step*7):Math.floor(hero.step*3))%actions.length:0;
           const im=cacheHero(actions[index]),cx=sw/2,cy=sh/2;
           ctx.fillStyle='#090e1699';ctx.beginPath();ctx.ellipse(cx,cy+8,13,5,0,0,2*Math.PI);ctx.fill();
           if(im?.complete&&im.naturalWidth){const factor=Math.min(.57,42/im.naturalHeight);const w=im.naturalWidth*factor,h=im.naturalHeight*factor;ctx.drawImage(im,cx-w/2,cy+8-h,w,h)}
           else{ctx.fillStyle='#ffe5a5';ctx.fillRect(cx-8,cy-20,16,27)}
           ctx.strokeStyle='#fbe2a1';ctx.strokeRect(cx-3,cy+8,6,3);
          }
          function drawTerrain(){
           ctx.fillStyle='#151e21';ctx.fillRect(0,0,sw,sh);if(!current||!terrain?.complete||!terrain.naturalWidth)return;
           const left=hero.x-sw/(2*zoom),top=hero.y-sh/(2*zoom),right=hero.x+sw/(2*zoom),bottom=hero.y+sh/(2*zoom);
           const x1=Math.max(0,left),y1=Math.max(0,top),x2=Math.min(current.width,right),y2=Math.min(current.height,bottom);
           if(x2>x1&&y2>y1){ctx.imageSmoothingEnabled=false;ctx.drawImage(terrain,x1*16,y1*16,(x2-x1)*16,(y2-y1)*16,(x1-left)*zoom,(y1-top)*zoom,(x2-x1)*zoom,(y2-y1)*zoom)}
           if(showMarkers){
            const minx=left-1,miny=top-1,maxx=right+1,maxy=bottom+1;
            for(const e of current.events){if(!e.placed||e.x<minx||e.y<miny||e.x>maxx||e.y>maxy)continue;
             const px=sw/2+(e.x+.5-hero.x)*zoom,py=sh/2+(e.y+.5-hero.y)*zoom;
             ctx.fillStyle=e.evidence==='COMBAT_EVENT_CE62'?'#ffb44d':'#b5a6ba';ctx.strokeStyle='#221d13';ctx.lineWidth=2;
             ctx.beginPath();ctx.arc(px,py,Math.max(4,zoom*.15),0,2*Math.PI);ctx.fill();ctx.stroke();
             if(zoom>=27){ctx.font='11px system-ui';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#111e1e';ctx.strokeText(e.name,px,py-10);ctx.fillStyle='#ffefc8';ctx.fillText(e.name,px,py-10)}
            }
           }
           if(route.length){const p=route[route.length-1];const x=sw/2+(p.x+.5-hero.x)*zoom,y=sh/2+(p.y+.5-hero.y)*zoom;
            ctx.strokeStyle='#a1dfd3';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,6,0,2*Math.PI);ctx.stroke();}
           drawHero();
          }
          function bfs(tx,ty){
           if(!current)return [];const w=current.width,h=current.height;
           const startx=Math.floor(hero.x),starty=Math.floor(hero.y),start=starty*w+startx,target=ty*w+tx;
           if(!passable(tx,ty)||start===target)return [];
           const seen=new Int32Array(w*h);seen.fill(-1);seen[start]=start;const queue=new Int32Array(w*h);queue[0]=start;let head=0,tail=1;
           while(head<tail){const i=queue[head++],x=i%w,y=Math.floor(i/w);
            for(const [dx,dy] of dirs){const nx=x+dx,ny=y+dy;
             if(!canStep(x,y,nx,ny))continue;
             const ni=ny*w+nx;if(seen[ni]>=0)continue;seen[ni]=i;queue[tail++]=ni;
             if(ni===target){head=tail;break}
            }
           }
           if(seen[target]<0)return [];
           const path=[];let idx=target;
           while(idx!==start&&path.length<=w*h){path.push({x:idx%w,y:Math.floor(idx/w)});idx=seen[idx]}
           return path.reverse();
          }
          function moveAllowed(nx,ny){
           if(!current)return false;
           const x=Math.floor(hero.x),y=Math.floor(hero.y),tx=Math.floor(nx),ty=Math.floor(ny);
           if(x===tx&&y===ty)return passable(x,y);
           if(Math.abs(tx-x)+Math.abs(ty-y)===1)return canStep(x,y,tx,ty);
           if(Math.abs(tx-x)===1&&Math.abs(ty-y)===1)return (canStep(x,y,tx,y)&&canStep(tx,y,tx,ty))||(canStep(x,y,x,ty)&&canStep(x,ty,tx,ty));
           return false;
          }
          function moveAxis(dx,dy,dt){const n=Math.hypot(dx,dy);if(!n)return false;dx/=n;dy/=n;
           const nx=hero.x+dx*2.8*dt,ny=hero.y+dy*2.8*dt;let moved=false;
           if(moveAllowed(nx,hero.y)){hero.x=nx;moved=true}
           if(moveAllowed(hero.x,ny)){hero.y=ny;moved=true}
           if(moved)hero.dir=Math.abs(dx)>Math.abs(dy)?(dx>=0?0:4):(dy>=0?2:6);
           return moved;
          }
          function tick(dt){
           let dx=0,dy=0;
           if(held.has('left')||keyDown.has('ArrowLeft')||keyDown.has('a'))dx--;
           if(held.has('right')||keyDown.has('ArrowRight')||keyDown.has('d'))dx++;
           if(held.has('up')||keyDown.has('ArrowUp')||keyDown.has('w'))dy--;
           if(held.has('down')||keyDown.has('ArrowDown')||keyDown.has('s'))dy++;
           let moving=false;
           if(dx||dy){route=[];moving=moveAxis(dx,dy,dt)}
           else if(route.length){const next=route[0],cx=next.x+.5,cy=next.y+.5,deltaX=cx-hero.x,deltaY=cy-hero.y,distance=Math.hypot(deltaX,deltaY);
            if(distance<.1)route.shift();
            else{const step=Math.min(distance,2.8*dt);moving=moveAxis(deltaX/distance,deltaY/distance,step/2.8);
             if(!moving)route=[];else if(Math.hypot(cx-hero.x,cy-hero.y)<.1)route.shift()}
           }
           hero.moving=moving;hero.step+=dt;
           if(++frames%9===0)status();
          }
          function loop(t){if(!active)return;const dt=last?Math.min(.05,(t-last)/1000):0;last=t;
           tick(dt);ctx.setTransform(dpr,0,0,dpr,0,0);drawTerrain();requestAnimationFrame(loop)}
          async function enterMap(id){
           const m=DATA.maps.find(x=>x.id===Number(id));if(!m)throw Error('Unknown original map');
           const serial=++loadVersion;clearMovement();current=m;status();report('원본 맵 이미지 로딩: '+m.name);
           const decoded=decodeMask(m.mask,m.width*m.height),start=closestWalkable(decoded,m.width,m.height,(m.width-1)/2,(m.height-1)/2);
           if(serial!==loadVersion)return;
           mask=decoded;spawn=start;
           hero.x=(start?.x??m.width/2)+.5;hero.y=(start?.y??m.height/2)+.5;hero.step=0;hero.dir=0;
           const image=new Image();image.decoding='async';terrain=null;
           image.onload=()=>{if(serial!==loadVersion)return;terrain=image;report(start?`맵 진입: ${m.name} · 임시 입장 위치 ${start.x},${start.y} (원본 포털 좌표 미검증)`:`${m.name}: 정적 충돌 데이터에 통과 가능한 타일이 없어 이동 불가`)};
           image.onerror=()=>{if(serial===loadVersion)report('원본 지형 이미지 불러오기 실패: '+m.terrain)};
           image.src=m.terrain;
           status();
          }
          function enter(){if(active)return;active=true;window.SANCTUARY_NATIVE_WORLD_ACTIVE=true;overlay.hidden=false;last=0;frames=0;resize();
           const chosen=Number(el('nativeMapSelect').value)||29;if(!current||current.id!==chosen)enterMap(chosen);else status();requestAnimationFrame(loop)}
          function leave(){if(!active)return;active=false;window.SANCTUARY_NATIVE_WORLD_ACTIVE=false;overlay.hidden=true;clearMovement();last=0}
          function canvasTap(e){
           if(!active||!current)return;const box=canvas.getBoundingClientRect(),px=e.clientX-box.left,py=e.clientY-box.top;
           const worldX=hero.x+(px-sw/2)/zoom,worldY=hero.y+(py-sh/2)/zoom,tx=Math.floor(worldX),ty=Math.floor(worldY);
           const found=current.events.find(x=>x.placed&&Math.abs(x.x+.5-worldX)<.6&&Math.abs(x.y+.5-worldY)<.6);
           if(found){report(`원본 이벤트 ${found.eventId} · ${found.name} · 좌표 ${found.x},${found.y} · ${found.evidence} · 실제 등장 미검증`);return}
           if(!passable(tx,ty)){report(`좌표 ${tx},${ty} : 원본 정적 충돌에서 이동 불가`);return}
           const next=bfs(tx,ty);if(!next.length){report(`좌표 ${tx},${ty} : 연결된 이동 경로 없음`);return}route=next;
           report(`원본 경로 ${route.length}칸 · ${tx},${ty} · 정적 타일 충돌 기준`)
          }
          for(const m of DATA.maps){const option=document.createElement('option');option.value=String(m.id);option.textContent=`${String(m.id).padStart(2,'0')} · ${m.name} (${m.width}×${m.height})`+(m.walkable?'':' · 이동 불가');el('nativeMapSelect').appendChild(option)}
          el('nativeMapSelect').value='29';
          el('nativeEnter').onclick=enter;el('nativeClose').onclick=leave;
          el('nativeMapSelect').onchange=()=>enterMap(el('nativeMapSelect').value);
          el('nativeMarkers').onclick=()=>{showMarkers=!showMarkers;el('nativeMarkers').textContent=showMarkers?'이벤트 위치 ON':'이벤트 위치 OFF'};
          el('nativeCenter').onclick=()=>{route=[];report('이동 경로 취소 · 현재 플레이어 위치 유지')};
          for(const [direction,id] of [['up','nativeUp'],['down','nativeDown'],['left','nativeLeft'],['right','nativeRight']]){
           const button=el(id);button.addEventListener('pointerdown',e=>{if(!active)return;held.add(direction);route=[];button.setPointerCapture?.(e.pointerId);e.preventDefault()});
           for(const event of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(event,()=>held.delete(direction));
          }
          canvas.addEventListener('pointerup',canvasTap);
          window.addEventListener('keydown',e=>{if(!active||e.target?.tagName==='SELECT')return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','a','w','s','d'].includes(e.key)){keyDown.add(e.key);route=[];e.preventDefault()}});
          window.addEventListener('keyup',e=>keyDown.delete(e.key));window.addEventListener('blur',()=>{held.clear();keyDown.clear()});
          window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,120));
          window.SANCTUARY_NATIVE_WORLD={enter,leave,select:enterMap,canStep:(x,y,nx,ny)=>canStep(x,y,nx,ny),state:()=>({active,mapId:current?.id,player:{...hero},markers:current?.events.length||0,passableMarkers:current?.events.filter(e=>e.placed).length||0,routeLength:route.length,loaded:!!terrain,warning:eventMessage})};
          console.info('build-web.yml | V20 | SLKnight 44 native maps linked; combat and unverified monster spawns remain disabled');
          })();
          JS_NATIVE_V20
          cat > reports/native-world.css <<'CSS_NATIVE_V20'
          #nativeEnter{position:absolute;right:9px;top:85px;z-index:15;background:#556e48;color:#fff5c8;border:1px solid #abc78d;padding:8px 7px;font-size:11px;border-radius:7px;touch-action:manipulation}
          #nativeOverlay{position:fixed;inset:0;z-index:900;background:#16231e;color:#f9efcb;overflow:hidden;font:13px system-ui,sans-serif}
          #nativeOverlay[hidden]{display:none}
          #nativeCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;image-rendering:pixelated}
          #nativeHead{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:2;padding:9px 10px 7px;background:#132923ec;display:grid;grid-template-columns:1fr auto;gap:5px 8px;box-shadow:0 4px 14px #070d0bbb}
          #nativeHead strong{grid-column:1;font-size:12px;color:#f4e6b4;align-self:center}
          .nativeHeadBtns{grid-column:2;grid-row:1;display:flex}
          #nativeHead button{padding:7px 8px;font-size:11px;background:#4d604a;color:white;border:1px solid #829a80;border-radius:5px}
          #nativeHead label{grid-column:1/3;font-size:10px;color:#c3dfc7}
          #nativeMapSelect{grid-column:1/3;width:100%;box-sizing:border-box;background:#2a4536;color:white;border:1px solid #8ea48a;border-radius:5px;padding:7px 6px;min-height:37px;font-size:13px}
          #nativeLocation{grid-column:1/3;font-size:11px;line-height:1.4;color:#e4e3cb}
          #nativeInfo{position:absolute;z-index:2;top:155px;left:10px;max-width:min(74vw,340px);padding:6px 8px;background:#142721d9;border:1px solid #658069;border-radius:5px;line-height:1.4;font-size:10px}
          #nativeDpad{position:absolute;bottom:calc(60px + env(safe-area-inset-bottom,0px));left:12px;z-index:3;width:158px;height:158px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:4px;touch-action:none}
          #nativeDpad button{background:#283d36d8;color:#f1e9d0;border:1px solid #9ab19a;border-radius:12px;touch-action:none;user-select:none;font-size:19px;font-weight:bold}
          #nativeUp{grid-column:2;grid-row:1}#nativeLeft{grid-column:1;grid-row:2}#nativeRight{grid-column:3;grid-row:2}#nativeDown{grid-column:2;grid-row:3}
          #nativeBottom{position:absolute;right:10px;bottom:calc(74px + env(safe-area-inset-bottom,0px));width:min(46vw,250px);z-index:3;display:grid;gap:6px}
          #nativeBottom button{background:#284c46ec;color:#f2e5bb;border:1px solid #91b2a7;border-radius:6px;padding:10px 5px;font-size:11px;touch-action:manipulation}
          #nativeEventDetail{font-size:10px;line-height:1.45;padding:7px;background:#112924ed;border:1px solid #6e8d70;border-radius:6px;max-height:104px;overflow-y:auto;overflow-wrap:anywhere}
          #nativeWarning{position:absolute;bottom:env(safe-area-inset-bottom,0px);left:0;right:0;z-index:2;background:#101f1cee;text-align:center;color:#deca91;padding:6px 4px;font-size:10px}
          @media(orientation:landscape) and (max-height:560px){#nativeHead{grid-template-columns:1fr auto;gap:2px 8px;padding:4px 8px}#nativeHead label{display:none}#nativeHead strong{font-size:11px}#nativeMapSelect{grid-column:1/3;padding:2px 5px;min-height:29px}#nativeLocation{font-size:10px}#nativeInfo{top:88px;font-size:9px;max-width:240px}#nativeDpad{width:120px;height:120px;bottom:23px;left:8px}#nativeDpad button{font-size:15px;border-radius:8px}#nativeBottom{width:210px;bottom:28px;right:8px}#nativeBottom button{padding:5px;font-size:10px}#nativeEventDetail{max-height:65px;font-size:9px}#nativeWarning{font-size:9px;padding:2px}}
          CSS_NATIVE_V20
          cat > reports/build_native.py <<'PY_BUILD_NATIVE_V20'
          from pathlib import Path
          import base64, hashlib, json, shutil, sys, zipfile, struct
          
          source=Path(sys.argv[1] if len(sys.argv)>1 else '/mnt/data/sanctuary_v20/map54')
          game=Path(sys.argv[2] if len(sys.argv)>2 else '/mnt/data/sanctuary_v20/v19')
          archive=Path(sys.argv[3] if len(sys.argv)>3 else '/mnt/data/Sanctuary-Map-V5.4-Spawn-Lifecycle-and-Boss-Overrides.zip')
          assert (game/'manifest.json').is_file(),game
          root=game/'native-world'
          (root/'maps').mkdir(parents=True,exist_ok=True)
          
          native=json.loads((source/'native-maps-v5.1.json').read_text(encoding='utf-8'))
