
name: Sanctuary of Aden Mobile V7.2 Combat Rebuild

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sanctuary-mobile-v7-2
  cancel-in-progress: false

jobs:
  build:
    name: Restore verified V6 and rebuild V7 combat directly
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout verified repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore successful V6 without failed V7 dependencies
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p src reports dist/mobile
          if gh run download 38875478252 --repo "$GITHUB_REPOSITORY" --name Sanctuary-Mobile-V6-MultiSPR-Original-Map4 --dir dist/mobile; then
            echo "Verified V6 artifact restored"
          else
            rm -rf dist/mobile
            mkdir -p dist/mobile
            git cat-file -e 'aa1d4be10745a30f1bf9569c0f8ba76e0513cbee^{commit}'
            git show aa1d4be10745a30f1bf9569c0f8ba76e0513cbee:.github/workflows/build-web.yml > reports/verified-v6.yml
            python -m pip install --disable-pip-version-check 'PyYAML==6.0.2' 'Pillow==11.3.0'
            cat > src/rebuild_v6.py <<'PY_REBUILD'
          import os
          import subprocess
          from pathlib import Path
          import yaml

          pinned=Path('reports/verified-v6.yml')
          data=yaml.safe_load(pinned.read_text(encoding='utf-8'))
          steps=data['jobs']['build']['steps']
          required=[
              'Prepare isolated build',
              'Download 46 original client pieces',
              'Extract Sprite, Tile and real Aden Map 4',
              'Install decoder and restore V4 mobile engine',
              'Restore pinned V5 tile decoder and expand original SPR actions',
              'Validate eight directional motions and original map'
          ]
          env=dict(os.environ)
          envfile=Path(env['GITHUB_ENV'])
          for name in required:
              found=[x for x in steps if x.get('name')==name and isinstance(x.get('run'),str)]
              if len(found)!=1:
                  raise SystemExit('Required verified V6 stage not found: '+name)
              print('Rebuilding verified V6:',name,flush=True)
              subprocess.run(['bash','-e','-o','pipefail','-c',found[0]['run']],check=True,env=env)
              if envfile.exists():
                  for line in envfile.read_text(encoding='utf-8').splitlines():
                      if '=' not in line:
                          continue
                      key,value=line.split('=',1)
                      if key.isidentifier():
                          env[key]=value
          print('Pinned V6 source reconstruction complete')
          PY_REBUILD
            python src/rebuild_v6.py
          fi
          python3 - <<'PY_CHECK_V6'
          import json
          from pathlib import Path
          root=Path('dist/mobile')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          if manifest.get('version')!=6 or len(manifest.get('actors',{}))!=8:
              raise SystemExit('Successful V6 source package was not restored')
          if manifest.get('map',{}).get('size')!=[192,192]:
              raise SystemExit('Verified original S32 Map 4 is missing')
          if len(list((root/'assets').glob('*.png')))<3000 or len(list((root/'tiles').glob('*.png')))<100:
              raise SystemExit('Original V6 SPR/TIL resources are incomplete')
          print('Successful V6 package validated')
          PY_CHECK_V6

      - name: Apply freshly rebuilt V7.2 combat patch
        shell: bash
        run: |
          set -euo pipefail
          cat > src/patch_v7.py <<'PY_PATCH'
          from pathlib import Path
          import json
          import re
          import sys

          root = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('dist/mobile')
          html_path = root / 'index.html'
          manifest_path = root / 'manifest.json'
          html = html_path.read_text(encoding='utf-8')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('version') != 6 or len(manifest.get('actors', {})) != 8 or manifest.get('map', {}).get('size') != [192, 192]:
              raise SystemExit('Expected the successful V6 game package')


          def swap(source, old, new, label):
              hits = source.count(old)
              if hits != 1:
                  raise ValueError(f'{label}: expected 1 matching block, got {hits}')
              return source.replace(old, new, 1)


          def span(source, opening, closing, replacement, label):
              if source.count(opening) != 1 or source.count(closing) != 1:
                  raise ValueError(f'{label}: source delimiters are not unique')
              p = source.index(opening)
              q = source.index(closing, p + len(opening))
              return source[:p] + replacement + '\n' + source[q:]


          html = swap(html, 'Sanctuary of Aden Mobile V6 · Multi Sprite Animations', 'Sanctuary of Aden Mobile V7.2 · Original Map Combat', 'page title')
          html = swap(html, 'Sanctuary Mobile V6</strong>', 'Sanctuary Mobile V7.2</strong>', 'HUD version')
          html = swap(html, '<button id="again" type="button">다시 시작</button>', '''<button id="again" type="button">다시 시작</button>
          <div id="targetPanel" hidden><strong id="targetLabel">선택 대상</strong><span id="targetHP"></span><div id="targetGauge"><div id="targetFill"></div></div></div>''', 'target panel')
          html = swap(html, '<div id="keys"><button id="autoBtn" class="good">자동 ON</button><button id="hitBtn">공격</button><button id="potion">물약 10</button></div>', '<div id="keys"><button id="autoBtn" class="good">자동 ON</button><button id="hitBtn">공격</button><button id="potion">물약 10</button><button id="targetNext">다음 몹</button><button id="targetClear">타겟 해제</button></div>', 'target buttons')
          html = swap(html, '</style>', '''#targetPanel{position:absolute;left:8px;top:calc(143px + env(safe-area-inset-top));min-width:144px;max-width:48vw;z-index:5;padding:8px;border:1px solid #b7aa7b;background:#0c1b1de8;border-radius:9px;font-size:11px;pointer-events:none}
          #targetPanel[hidden]{display:none}
          #targetPanel strong,#targetPanel span{display:block}
          #targetPanel strong{color:#ffe1a1;font-size:13px}
          #targetGauge{height:6px;background:#4e2d2b;margin-top:5px;border-radius:5px;overflow:hidden}
          #targetFill{height:100%;width:100%;background:#f08069}
          #targetNext,#targetClear{font-size:11px;padding:7px 4px}
          #targetNext{grid-column:1;grid-row:3}
          #targetClear{grid-column:2;grid-row:3}
          @media(max-height:445px){#targetPanel{top:calc(95px + env(safe-area-inset-top));min-width:114px}}
          </style>''', 'target styles')

          js_sections = re.findall(r'<script>([\s\S]*?)</script>', html)
          if len(js_sections) != 1:
              raise ValueError('Exactly one game script required')
          js = js_sections[0]
          js = swap(js, 'let labPage=0,selectedKey=0,toastUntil=0,showBlocked=false,showObjects=true,showTextures=true;', 'let labPage=0,selectedKey=0,toastUntil=0,showBlocked=false,showObjects=true,showTextures=true;\nlet selectedMob=null,queuedAttack=false,damageNumbers=[];', 'preserve all V6 rendering toggles')
          js = swap(js, "mobs=Array.from({length:7},(_,i)=>makeMob(i));refresh();msg('7종 원본 SPR 그래픽·이동·공격 모션 시험',3)", "selectedMob=null;queuedAttack=false;damageNumbers=[];mobs=Array.from({length:7},(_,i)=>makeMob(i));refresh();targetHUD();msg('원본 SPR 7종 · 몬스터를 터치해 선택',3)", 'game reset')
          js = swap(js, 'visual:ROSTER[(id+score)%ROSTER.length],hp:35,anim:0', 'visual:ROSTER[id%ROSTER.length],hp:35,maxHp:35,pendingHit:false,impactAt:0,anim:0', 'stable actor sprite')

          combat_helpers = '''function targetHUD(){const panel=el('targetPanel');if(!selectedMob||selectedMob.dead){panel.hidden=true;return}panel.hidden=false;el('targetLabel').textContent='원본 SPR '+D.actors[selectedMob.visual].sprite_id;el('targetHP').textContent='HP '+Math.max(0,Math.ceil(selectedMob.hp))+' / '+selectedMob.maxHp;el('targetFill').style.width=clamp(selectedMob.hp/selectedMob.maxHp*100,0,100)+'%'}
          function targetChoose(mob,follow=true){if(!mob||mob.dead)return;selectedMob=mob;queuedAttack=false;if(follow){hero.goalMob=mob;hero.goalMobRepath=0;hero.path=[]}targetHUD()}
          function targetForget(){selectedMob=null;queuedAttack=false;hero.goalMob=null;hero.path=[];targetHUD()}
          function targetInRange(radius){if(selectedMob&&!selectedMob.dead)return dist(hero,selectedMob)<=radius?selectedMob:null;return nearest(radius)}
          function damageText(unit,value,color){damageNumbers.push({x:unit.x,y:unit.y,value:String(value),color,until:clock+.85});if(damageNumbers.length>50)damageNumbers.shift()}
          function drawTargetRing(){if(!selectedMob||selectedMob.dead)return;let p=screen(selectedMob.x,selectedMob.y);ctx.save();ctx.strokeStyle='#ffe079';ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse(p.x,p.y+19,25,10,0,0,Math.PI*2);ctx.stroke();ctx.restore()}
          function drawDamageText(){ctx.save();ctx.textAlign='center';ctx.font='bold 18px system-ui';ctx.lineWidth=3;ctx.strokeStyle='#241a17';for(const fx of damageNumbers){let left=fx.until-clock;if(left<=0)continue;let p=screen(fx.x,fx.y),py=p.y-53-(.85-left)*34;ctx.globalAlpha=clamp(left*2,0,1);ctx.strokeText(fx.value,p.x,py);ctx.fillStyle=fx.color;ctx.fillText(fx.value,p.x,py)}ctx.restore()}
          '''
          js = swap(js, 'function setMode(a,newMode)', combat_helpers + 'function setMode(a,newMode)', 'target helpers')

          js = span(js, 'function tryAttack(){', 'function applyHit(){', '''function tryAttack(manual=false){if(open||hero.dead||hero.attackCd>0)return false;if(safe(hero.x,hero.y)){if(manual)msg('안전지대에서는 공격할 수 없습니다',.7);return false}const target=targetInRange(1.7);if(!target&&selectedMob&&!selectedMob.dead){if(manual)queuedAttack=true;hero.goalMob=selectedMob;hero.goalMobRepath=0;hero.path=[];if(manual)msg('선택 대상에게 접근',.8);return false}if(!target&&!manual)return false;hero.attackCd=.54;hero.attackUntil=clock+.42;hero.damageAt=clock+.21;hero.damageDone=false;hero.hitTarget=target;queuedAttack=false;if(target){let dx=target.x-hero.x,dy=target.y-hero.y;hero.dir=facing((dx-dy)*TW/2,(dx+dy)*TH/2)}setMode(hero,'attack');return true}''', 'attack timing and facing')
          js = span(js, 'function applyHit(){', 'function drink(){', '''function applyHit(){hero.damageDone=true;const mob=hero.hitTarget;hero.hitTarget=null;if(!mob||mob.dead||dist(hero,mob)>1.85)return;mob.hp=Math.max(0,mob.hp-12);mob.hurtUntil=clock+.25;damageText(mob,'-12','#ffe5b3');if(mob.hp===0){mob.dead=true;mob.deadAt=clock;score++;setMode(mob,'death');if(mob===selectedMob)targetForget()}else setMode(mob,'hit');targetHUD();refresh()}''', 'player impact')
          js = swap(js, "potions--;hero.hp=Math.min(100,hero.hp+40);refresh()", "potions--;const amount=Math.min(40,100-hero.hp);hero.hp+=amount;damageText(hero,'+'+amount,'#9affc1');refresh()", 'potion impact text')
          js = swap(js, "hero.path=route;hero.goalMob=null;msg('원본 S32 이동 경로 '+route.length+'칸',.8);return true", "targetForget();hero.path=route;msg('원본 S32 이동 경로 '+route.length+'칸',.8);return true", 'tap map clears target')
          js = span(js, 'function update(dt){', 'function iso(x,y){', '''function update(dt){if(open)return;clock+=dt;damageNumbers=damageNumbers.filter(x=>x.until>clock);hero.anim+=dt;if(hero.dead)return;hero.attackCd=Math.max(0,hero.attackCd-dt);if(!hero.damageDone&&clock>=hero.damageAt)applyHit();if(selectedMob&&selectedMob.dead)targetForget();
          let dx=stickVector.x,dy=stickVector.y;if(pressed.ArrowLeft||pressed.a)dx--;if(pressed.ArrowRight||pressed.d)dx++;if(pressed.ArrowUp||pressed.w)dy--;if(pressed.ArrowDown||pressed.s)dy++;
          let moving=false,n=Math.hypot(dx,dy);if(n>.06){hero.path=[];hero.goalMob=null;queuedAttack=false;dx/=n;dy/=n;let wx=dx/2+dy,wy=dy-dx/2,wl=Math.hypot(wx,wy);moving=moveFoot(hero,wx/wl*dt*2.8,wy/wl*dt*2.8);if(moving)hero.dir=facing(dx,dy)}
          else if(hero.goalMob&&!hero.goalMob.dead){if(dist(hero,hero.goalMob)>1.3){if(clock>=hero.goalMobRepath){hero.path=findPath(hero,hero.goalMob,8000);hero.goalMobRepath=clock+.55}moving=travel(hero,hero.path,dt,2.8)}else{hero.path=[];if((auto||queuedAttack)&&hero.attackCd<=0)tryAttack(false)}}
          else moving=travel(hero,hero.path,dt,2.8);
          if(clock<hero.attackUntil)setMode(hero,'attack');else if(clock<hero.hurtUntil)setMode(hero,'hit');else setMode(hero,moving?'walk':'idle');
          for(const mob of mobs){if(mob.dead){if(clock-mob.deadAt>3)mobs[mob.id]=makeMob(mob.id);continue}mob.anim+=dt;mob.attackCd=Math.max(0,mob.attackCd-dt);if(mob.pendingHit&&clock>=mob.impactAt){mob.pendingHit=false;if(!safe(hero.x,hero.y)&&dist(mob,hero)<=1.4&&!hero.dead){hero.hp=Math.max(0,hero.hp-7);hero.hurtUntil=clock+.25;damageText(hero,'-7','#ffaaaa');if(hero.hp===0){hero.dead=true;hero.deadAt=clock;hero.path=[];queuedAttack=false;setMode(hero,'death');msg('전투 불능 · 다시 시작 버튼',5)}}}
          let distance=dist(mob,hero),mobMoved=false;if(distance<7&&!safe(hero.x,hero.y)&&!safe(mob.x,mob.y)&&!hero.dead){if(distance>1.1){if(clock>=mob.repath){mob.path=findPath(mob,hero,8000);mob.repath=clock+.95}mobMoved=travel(mob,mob.path,dt,.7)}else if(mob.attackCd<=0){mob.attackCd=1.35;mob.attackUntil=clock+.38;mob.impactAt=clock+.19;mob.pendingHit=true;const mx=hero.x-mob.x,my=hero.y-mob.y;mob.dir=facing((mx-my)*TW/2,(mx+my)*TH/2)}}
          if(clock<mob.attackUntil)setMode(mob,'attack');else if(clock<mob.hurtUntil)setMode(mob,'hit');else setMode(mob,mobMoved?'walk':'idle')}
          if(auto&&!hero.goalMob&&hero.attackCd<=0&&targetInRange(1.7))tryAttack(false);targetHUD();refresh()}''', 'replace V6 combat update')
          js = swap(js, "mctx.fillStyle='#fff6b9';mctx.fillRect(hero.x-OX-3,hero.y-OY-3,6,6)", "if(selectedMob&&!selectedMob.dead){mctx.strokeStyle='#ffdf70';mctx.lineWidth=2;mctx.strokeRect(selectedMob.x-OX-4,selectedMob.y-OY-4,8,8)}mctx.fillStyle='#fff6b9';mctx.fillRect(hero.x-OX-3,hero.y-OY-3,6,6)", 'minimap target')
          js = swap(js, 'ctx.imageSmoothingEnabled=false;ground();let order=', 'ctx.imageSmoothingEnabled=false;ground();drawTargetRing();let order=', 'target ring drawing')
          js = swap(js, 'for(let a of order){if(a.ob)drawObject(a.ob);else drawActor(a.unit,a.type)};', 'for(let a of order){if(a.ob)drawObject(a.ob);else drawActor(a.unit,a.type)};drawDamageText();', 'floating damage rendering')
          js = swap(js, "el('hitBtn').addEventListener('pointerdown',e=>{e.preventDefault();tryAttack()});", '''el('targetNext').onclick=()=>{const alive=mobs.filter(m=>!m.dead).sort((a,b)=>dist(a,hero)-dist(b,hero));if(!alive.length){msg('선택할 몬스터가 없습니다');return}const next=alive[(alive.indexOf(selectedMob)+1)%alive.length];targetChoose(next,true);msg('SPR '+D.actors[next.visual].sprite_id+' 선택',.8)};
          el('targetClear').onclick=()=>{targetForget();msg('타겟 해제',.7)};
          el('hitBtn').addEventListener('pointerdown',e=>{e.preventDefault();tryAttack(true)});''', 'mobile targeting controls')
          js = swap(js, "if(e.key===' '&&!e.repeat)tryAttack();", "if(e.key===' '&&!e.repeat)tryAttack(true);", 'keyboard attack')
          js = swap(js, "hero.path=[];hero.goalMob=null}\npad.addEventListener('pointerdown'", "hero.path=[];hero.goalMob=null;queuedAttack=false}\npad.addEventListener('pointerdown'", 'cancel chase on joystick')
          js = swap(js, "if(target&&Math.hypot(target.x-x,target.y-y)<1.2){hero.goalMob=target;hero.goalMobRepath=0;hero.path=[];msg('몬스터 대상으로 경로 탐색',1)}else setDestination(x,y)", "if(target&&Math.hypot(target.x-x,target.y-y)<1.2){targetChoose(target,true);msg('SPR '+D.actors[target.visual].sprite_id+' 선택 · 자동 접근',1)}else setDestination(x,y)", 'tap to select target')
          js = swap(js, 'mapped={hero:{},enemy:{}};persist()', 'mapped=Object.fromEntries(Object.keys(D.actors).map(k=>[k,{}]));persist()', 'reset all actor mappings')
          js = swap(js, "let file=JSON.stringify({version:4,ids:{hero:2786,enemy:3215},mapping:mapped},null,2);", "let file=JSON.stringify({version:7,ids:Object.fromEntries(Object.entries(D.actors).map(([k,v])=>[k,v.sprite_id])),mapping:mapped},null,2);", 'complete mapping export')
          js = swap(js, "a.download='sanctuary-v4-motion-map.json'", "a.download='sanctuary-v7-motion-map.json'", 'mapping export filename')

          html = swap(html, js_sections[0], js, 'game script')
          manifest['version'] = 7
          manifest['status'] = 'ORIGINAL_S32_TIL_SPR_TARGETED_COMBAT_PROTOTYPE'
          manifest['combat_note'] = 'Demo HP/damage/animation timing; not verified original-game balance'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          start_tag = '<script id="manifest" type="application/json">'
          a = html.find(start_tag)
          b = html.find('</script>', a + len(start_tag))
          if a < 0 or b < 0:
              raise ValueError('Embedded manifest tag missing')
          html = html[:a + len(start_tag)] + json.dumps(manifest, ensure_ascii=False, separators=(',', ':')) + html[b:]
          html_path.write_text(html, encoding='utf-8')
          (root / 'README_KO.txt').write_text('Sanctuary of Aden Mobile V7.2\nV6 원본 S32, TIL, SPR 자산 유지\n타겟 선택, 자동 접근, 공격 타이밍, 몬스터 반격 시점, 피해 숫자 표시\n원본 몬스터 이름 및 실제 공격 수치는 검증되지 않은 테스트 값입니다.\n', encoding='utf-8')
          print('V7.2 patch:', len(js), 'JavaScript bytes; actors:', len(manifest['actors']))
          PY_PATCH
          python3 -m py_compile src/patch_v7.py
          python3 src/patch_v7.py dist/mobile

      - name: Validate graphics, JavaScript and combat timing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY'
          from pathlib import Path
          import json,re
          root=Path('dist/mobile')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          html=(root/'index.html').read_text(encoding='utf-8')
          if manifest.get('version')!=7 or len(manifest.get('actors',{}))!=8:
              raise SystemExit('V7.2 manifest is incomplete')
          world=manifest['map']
          if world['size']!=[192,192] or len(world['flags'])!=36864 or len(world['objects'])<10000:
              raise SystemExit('Original map, collision or objects missing')
          frames=list((root/'assets').glob('*.png'))
          atlases=list((root/'tiles').glob('*.png'))
          if len(frames)<3000 or len(atlases)<100:
              raise SystemExit('Original SPR and TIL assets missing')
          for ident in ('targetPanel','targetLabel','targetNext','targetClear','autoBtn','hitBtn','lab','minimap','textureToggle','objectToggle'):
              if 'id="'+ident+'"' not in html:
                  raise SystemExit('Missing V7.2 control: '+ident)
          tag='<script id="manifest" type="application/json">'
          a=html.find(tag)
          b=html.find('</script>',a+len(tag))
          if a<0 or b<0 or json.loads(html[a+len(tag):b])!=manifest:
              raise SystemExit('Embedded manifest does not match generated manifest')
          js=re.findall(r'<script>([\s\S]*?)</script>',html)
          if len(js)!=1 or js[0].count('showTextures=true')!=1:
              raise SystemExit('JavaScript entrypoint or texture state invalid')
          Path('reports/game.js').write_text(js[0],encoding='utf-8')
          print('Original SPR frames:',len(frames),'TIL atlases:',len(atlases),'S32 objects:',len(world['objects']))
          PY_VERIFY
          node --check reports/game.js
          cat > reports/smoke.cjs <<'NODE_SMOKE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const html=fs.readFileSync('dist/mobile/index.html','utf8');
          const json=html.match(/<script id="manifest" type="application\/json">([\s\S]*?)<\/script>/)?.[1];
          let code=html.match(/<script>([\s\S]*?)<\/script>/)?.[1];
          assert(json&&code,'Embedded manifest and game script required');
          const entry='begin();requestAnimationFrame(render);';
          assert(code.includes(entry),'Expected V6 startup path');
          code=code.replace(entry,'begin();globalThis.QA={hero:()=>hero,mobs:()=>mobs,select:(i,follow=false)=>targetChoose(mobs[i],follow),auto:v=>{auto=v},flags:()=>({showTextures,showObjects,showBlocked})};requestAnimationFrame(render);');
          let now=0,frames=[],elements=new Map(),events={};
          const canvas=()=>new Proxy({createImageData(w,h){return {data:new Uint8ClampedArray(w*h*4)}},getImageData(){return {data:new Uint8ClampedArray(192*192*4)}},measureText(t){return {width:String(t).length*9}}},{get:(t,k)=>k in t?t[k]:()=>{},set:(t,k,v)=>(t[k]=v,true)});
          class E{
            constructor(id){this.id=id;this.style={};this.listeners={};this.hidden=id==='lab'||id==='targetPanel';this.classList={add(){},remove(){},toggle(){}};this.textContent=id==='manifest'?json:id==='autoBtn'?'자동 ON':'';this.value={labActor:'hero',labMode:'idle',labDir:'0',labSpeed:'110',labFrame:'-1'}[id]||'0';this.children=[];this.clientWidth=390;this.clientHeight=844;this.width=192;this.height=192;this.naturalWidth=24;this.files=[];}
            getContext(){return canvas()}
            addEventListener(k,fn){(this.listeners[k]??=[]).push(fn)}
            click(){this.onclick?.();this.fire('click')}
            fire(k){for(const f of this.listeners[k]||[])f({preventDefault(){},pointerId:1,clientX:160,clientY:200})}
            appendChild(e){this.children.push(e)}replaceChildren(...xs){this.children=xs}setPointerCapture(){}getBoundingClientRect(){return{left:0,top:0,width:140,height:140}}remove(){}
          }
          const doc={getElementById(id){if(!elements.has(id))elements.set(id,new E(id));return elements.get(id)},createElement:tag=>new E(tag),body:new E('body')};
          class Image{constructor(){this.complete=true;this.naturalWidth=24;this.naturalHeight=24;}set src(v){this._src=v}get src(){return this._src}}
          const stored=new Map();
          const sandbox={document:doc,window:{addEventListener(k,fn){events[k]=fn}},devicePixelRatio:1,Image,requestAnimationFrame(f){frames.push(f)},performance:{now:()=>now},localStorage:{getItem:k=>stored.get(k)||null,setItem:(k,v)=>stored.set(k,v)},Math,JSON,Int32Array,Uint8ClampedArray,console,URL:{createObjectURL:()=>'',revokeObjectURL(){}},Blob,setTimeout(){},confirm:()=>true};
          vm.runInNewContext(code,sandbox,{timeout:20000});
          function frame(){now+=16.6667;const f=frames.shift();assert(f,'Animation loop stopped');f(now)}
          function run(n){for(let i=0;i<n;i++)frame()}
          const get=id=>doc.getElementById(id);
          run(4);
          assert(get('targetPanel').hidden,'Panel should start hidden');
          for(const btn of ['textureToggle','objectToggle','overlayToggle']){get(btn).click();run(1);get(btn).click();run(1)}
          assert(sandbox.QA.flags().showTextures===true,'TIL toggle unavailable');
          get('targetNext').click();assert(!get('targetPanel').hidden,'Target cycle failed');
          get('targetClear').click();assert(get('targetPanel').hidden,'Target clear failed');
          get('autoBtn').click();assert(get('autoBtn').textContent==='자동 OFF','Auto toggle failed');
          get('labOpen').click();assert(!get('lab').hidden,'SPR lab open failed');run(2);get('labClose').click();assert(get('lab').hidden,'SPR lab close failed');
          const hero=sandbox.QA.hero(),mobs=sandbox.QA.mobs(),m=mobs[0];
          sandbox.QA.auto(false);
          for(let i=0;i<mobs.length;i++){const v=mobs[i];v.x=hero.x+(i?25:.8);v.y=hero.y;v.attackCd=100;v.pendingHit=false;v.path=[]}
          hero.attackCd=0;sandbox.QA.select(0,false);
          get('hitBtn').fire('pointerdown');assert(m.hp===35,'Damage applied before animation');
          run(7);assert(m.hp===35,'Player impact fired too early');
          run(10);assert(m.hp===23,'Player hit did not land after windup');
          hero.hp=100;hero.attackCd=100;m.x=hero.x+.6;m.y=hero.y;m.attackCd=0;m.pendingHit=false;m.attackUntil=0;
          run(2);assert(m.pendingHit&&hero.hp===100,'Enemy hit must not be immediate');
          run(15);assert(hero.hp===93,'Enemy timed hit failed');
          get('again').click();assert(get('targetPanel').hidden,'Reset did not clear selected target');
          run(6);
          console.log('V7.2 NODE RUNTIME PASS: target, assets, modal, impact delay, enemy retaliation, reset');
          NODE_SMOKE
          node reports/smoke.cjs
          {
            echo 'Sanctuary Mobile V7.2'
            echo 'Restores successful V6 S32/TIL/SPR build; never extracts or executes failed V7 code.'
            echo 'Adds target selection, manual approach, attack-facing, delayed player/monster impacts and floating damage.'
            echo 'Asset checks, JavaScript syntax and runtime combat timing tests completed.'
            echo 'Monster names and combat values remain prototype data.'
            echo 'SLKnight workflows and Pages remain unchanged.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload V7.2 standalone mobile game
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Mobile-V7-2-Combat-Rebuilt
          path: dist/mobile/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Mobile-V7-2-Diagnostics
          path: reports/
          if-no-files-found: warn
          retention-days: 14
