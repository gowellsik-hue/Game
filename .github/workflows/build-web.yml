
name: Sanctuary of Aden Mobile V14 Orc Motion Review

on:
  push:
    branches: [main]
    paths: [.github/workflows/build-web.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sanctuary-mobile-v14
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore successful V13 game
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/mobile reports
          if gh run download 39046152609 --repo "$GITHUB_REPOSITORY" --name Sanctuary-Mobile-V13-Motion-Inspection --dir dist/mobile; then
            echo 'Successful V13 build restored'
          else
            rm -rf dist/mobile
            mkdir -p dist/mobile
            git show a0bc44e87e447f41ce46742e8e96e104441e24e3:.github/workflows/build-web.yml > reports/pinned-v13.yml
            python3 -m venv /tmp/sanctuary-v14
            /tmp/sanctuary-v14/bin/pip -q install 'PyYAML==6.0.2' 'Pillow==11.3.0'
            cat > reports/rebuild_v13.py <<'PY_RESTORE'
          import os,subprocess,yaml
          from pathlib import Path
          steps=yaml.safe_load(Path('reports/pinned-v13.yml').read_text(encoding='utf-8'))['jobs']['build']['steps']
          env=dict(os.environ)
          env['PATH']='/tmp/sanctuary-v14/bin:'+env['PATH']
          for name in ('Restore successful V12 mobile game','Add in-field animation A/B and observation logging','Verify source sprites and V13 playable controls'):
              found=[s for s in steps if s.get('name')==name and isinstance(s.get('run'),str)]
              if len(found)!=1:raise SystemExit('Verified V13 step not found: '+name)
              subprocess.run(['bash','-e','-o','pipefail','-c',found[0]['run']],env=env,check=True)
              print('Rebuilt:',name,flush=True)
          PY_RESTORE
            /tmp/sanctuary-v14/bin/python reports/rebuild_v13.py
          fi

      - name: Add independent 40-slot original motion review
        shell: bash
        run: |
          set -euo pipefail
          cat > reports/motion-review.js <<'JS_REVIEW'
          (() => {
          'use strict';
          const root=document.getElementById('reviewPanel');
          const base=window.SANCTUARY_MANIFEST?.actors?.mob56;
          const source=window.SANCTUARY_MONSTER_PACK;
          const actor=source?.actors?.mob56;
          if(!root||!base||!actor){if(root)root.textContent='SPR 56 검수 자료가 없습니다.';return;}
          const MODES=['idle','walk','attack','hit','death'];
          const NAMES={idle:'대기',walk:'이동',attack:'공격',hit:'피격',death:'사망'};
          const BASE={idle:32,walk:0,attack:8,hit:16,death:24};
          const STORE='sanctuary-v14-orc-review-v1';
          const el=id=>document.getElementById(id);
          const body=el('reviewBody'),grid=el('reviewGrid'),lab=document.getElementById('lab');
          function visible(){return !body.hidden&&!document.hidden&&(!lab||!lab.hidden)}
          const canvases=[el('reviewOld'),el('reviewNew')],contexts=canvases.map(c=>c.getContext('2d'));
          const buttons=new Map(),images=new Map();
          let selectedMode='idle',selectedDir=0,started=0,raf=0;
          let decisions={};
          function validDecision(x){return x==='ok'||x==='question';}
          function takeDecisions(data){
           if(data?.schema!=='sanctuary.motion-review.v1'||data.spriteId!==56||data.sourceRun!==source.sourceRun||typeof data.decisions!=='object'||!data.decisions)return false;
           const next={};
           for(const [key,value] of Object.entries(data.decisions))if(/^(idle|walk|attack|hit|death):[0-7]$/.test(key)&&validDecision(value))next[key]=value;
           decisions=next;return true;
          }
          try{const saved=JSON.parse(localStorage.getItem(STORE)||'null');if(saved)takeDecisions(saved)}catch(e){}
          function snapshot(){return {schema:'sanctuary.motion-review.v1',spriteId:56,sourceRun:source.sourceRun,warning:'Original action identity, direction orientation and animation timing remain unverified',decisions:{...decisions}};}
          function persist(){try{localStorage.setItem(STORE,JSON.stringify(snapshot()))}catch(e){}refreshMarks()}
          function identity(){return selectedMode+':'+selectedDir}
          for(const mode of MODES){
           const group=document.createElement('div');group.className='reviewRow';
           const label=document.createElement('strong');label.textContent=NAMES[mode];group.appendChild(label);
           const row=document.createElement('div');row.className='reviewSlots';
           for(let dir=0;dir<8;dir++){
            const button=document.createElement('button');button.type='button';button.textContent=String(dir);button.setAttribute('aria-label',NAMES[mode]+' 방향 '+dir);button.onclick=()=>select(mode,dir);
            buttons.set(mode+':'+dir,button);row.appendChild(button);
           }
           group.appendChild(row);grid.appendChild(group);
          }
          function refreshMarks(){
           for(const [key,button] of buttons){button.dataset.review=decisions[key]||'none';button.classList.toggle('selected',key===identity());button.setAttribute('aria-pressed',String(key===identity()))}
           const count=Object.values(decisions).filter(validDecision).length;
           const ok=Object.values(decisions).filter(x=>x==='ok').length;
           const issue=count-ok;
           el('reviewProgress').textContent='검토 '+count+'/40 · 정상 '+ok+' · 의심 '+issue;
          }
          function select(mode,dir){if(!MODES.includes(mode)||!Number.isInteger(dir)||dir<0||dir>7)return;selectedMode=mode;selectedDir=dir;started=performance.now();
           const key=BASE[mode]+dir;const row=actor.actions?.[mode]?.directions?.[dir];
           const old=base.actions?.[String(key)]||[];
           el('reviewSelection').textContent=NAMES[mode]+' · 방향 슬롯 '+dir+' · 기존 키 '+key+' ('+old.length+'장) / V18 후보 '+(row?.key??'-')+' ('+(row?.frames?.length||0)+'장)';
           el('reviewTiming').textContent='기존 미확정 비교속도 110ms · V18 후보 '+(actor.actions?.[mode]?.delayMs||'?')+'ms · 반복 재생은 검수용이며 전투 속도와 무관';
           refreshMarks();wake();
          }
          function imageOf(path){if(!path)return null;if(images.has(path))return images.get(path);const image=new Image();image.decoding='async';image.src=path;images.set(path,image);if(images.size>160)images.delete(images.keys().next().value);return image;}
          function paint(ctx,canvas,frames,delay,time,caption){
           const w=canvas.width,h=canvas.height;ctx.fillStyle='#162b28';ctx.fillRect(0,0,w,h);
           const frame=frames.length?Math.floor(time/delay)%frames.length:0;
           const image=imageOf(frames[frame]);
           if(image&&image.complete&&image.naturalWidth>0){const scale=Math.min(3.3,(w-12)/image.naturalWidth,(h-28)/image.naturalHeight);
           ctx.imageSmoothingEnabled=false;ctx.drawImage(image,(w-image.naturalWidth*scale)/2,(h-image.naturalHeight*scale)/2-8,image.naturalWidth*scale,image.naturalHeight*scale);
           }else{ctx.fillStyle='#a7baa8';ctx.textAlign='center';ctx.font='12px system-ui';ctx.fillText(frames.length?'원본 이미지 로딩 중':'프레임 없음',w/2,h/2)}
           ctx.textAlign='center';ctx.font='11px system-ui';ctx.fillStyle='#f0e1aa';ctx.fillText(caption+' · '+(frames.length?frame+1+'/'+frames.length:'0'),w/2,h-7);
          }
          function loop(t){
           if(!visible()){raf=0;return}
           const mode=selectedMode,dir=selectedDir,row=actor.actions?.[mode]?.directions?.[dir];const elapsed=Math.max(0,t-started);
           paint(contexts[0],canvases[0],base.actions?.[String(BASE[mode]+dir)]||[],110,elapsed,'기존 추정');
           paint(contexts[1],canvases[1],row?.frames||[],Math.max(60,Math.min(500,Number(actor.actions?.[mode]?.delayMs)||110)),elapsed,'V18 후보');
           raf=requestAnimationFrame(loop);
          }
          function wake(){if(!raf&&visible()){started=performance.now();raf=requestAnimationFrame(loop)}}
          el('reviewToggle').onclick=()=>{body.hidden=!body.hidden;el('reviewToggle').textContent=body.hidden?'40동작 검수 열기':'검수 화면 접기';if(!body.hidden){started=performance.now();wake()}};
          el('reviewPrev').onclick=()=>{let i=MODES.indexOf(selectedMode)*8+selectedDir;i=(i+39)%40;select(MODES[Math.floor(i/8)],i%8)};
          el('reviewNext').onclick=()=>{let i=MODES.indexOf(selectedMode)*8+selectedDir;i=(i+1)%40;select(MODES[Math.floor(i/8)],i%8)};
          el('reviewOk').onclick=()=>{decisions[identity()]='ok';persist()};
          el('reviewQuestion').onclick=()=>{decisions[identity()]='question';persist()};
          el('reviewUnset').onclick=()=>{delete decisions[identity()];persist()};
          el('reviewClear').onclick=()=>{if(!confirm('40개 동작의 검토 표시를 전부 초기화할까요?'))return;decisions={};persist()};
          el('reviewExport').onclick=()=>{const data=JSON.stringify(snapshot(),null,2);const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='sanctuary-v14-orc56-review.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};
          el('reviewImport').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{if(!takeDecisions(JSON.parse(await file.text())))throw Error('검수 스키마 또는 SPR 출처가 다릅니다');persist()}catch(err){alert('검수 파일을 불러올 수 없습니다: '+err.message)}e.target.value=''};
          document.addEventListener('visibilitychange',wake);
          document.getElementById('labOpen')?.addEventListener?.('click',wake);
          select('idle',0);
          window.SANCTUARY_REVIEW_READY=true;
          })();
          JS_REVIEW
          cat > reports/patch_v14.py <<'PY_PATCH'
          from pathlib import Path
          import hashlib,json,sys
          root=Path(sys.argv[1] if len(sys.argv)>1 else 'dist/mobile')
          htmlfile=root/'index.html';cssfile=root/'game.css';meta=root/'build-info.json'
          html=htmlfile.read_text(encoding='utf-8');css=cssfile.read_text(encoding='utf-8')
          info=json.loads(meta.read_text(encoding='utf-8'))
          assert info['package']==13 and info['runtime']==13 and info['sha256']['game.js']=='6f73183bd0ee929a0705bf1a67b68e5d4a57913ec6d3b2b456beb49f3fb83e4f'

          def once(s,old,new,label):
              n=s.count(old)
              if n!=1:raise SystemExit(f'{label}: expected one occurrence, found {n}')
              return s.replace(old,new,1)
          html=once(html,'Sanctuary of Aden Mobile V13 · Combat Motion Inspection','Sanctuary of Aden Mobile V14 · 40 Motion Review','title')
          html=once(html,'Sanctuary Mobile V13</strong>','Sanctuary Mobile V14</strong>','HUD')
          html=once(html,'</section>\n<div id="labTools">','''</section>
          <section id="reviewPanel" aria-label="오크 40개 모션 비교 검수">
          <div class="reviewHead"><strong>V14 · SPR 56 원본 40동작 검수</strong><button id="reviewToggle" type="button">40동작 검수 열기</button></div>
          <div id="reviewBody" hidden>
          <p>원본 SPR 대기·이동·공격·피격·사망 후보를 8방향씩 비교합니다. 방향·액션 의미·타이밍은 아직 미확정이며, 검토 표시는 게임 매핑에 적용되지 않습니다.</p>
          <div id="reviewProgress">검토 0/40</div>
          <div id="reviewGrid"></div>
          <div id="reviewSelection"></div>
          <div class="reviewCompare"><div><strong>기존 기본 배정</strong><canvas id="reviewOld" width="220" height="170"></canvas></div><div><strong>V18 추출 후보</strong><canvas id="reviewNew" width="220" height="170"></canvas></div></div>
          <div id="reviewTiming"></div>
          <div class="reviewActions"><button id="reviewPrev">이전 방향</button><button id="reviewNext">다음 방향</button><button id="reviewOk">눈으로 확인 · 정상</button><button id="reviewQuestion">확인 필요</button><button id="reviewUnset">표시 취소</button><button id="reviewExport">검토 JSON 저장</button><label class="reviewImportLabel">검토 JSON 불러오기<input id="reviewImport" type="file" accept=".json,application/json"></label><button id="reviewClear">검토 전체 초기화</button></div>
          </div></section>
          <div id="labTools">''','review section')
          html=once(html,'<script src="game.js"></script>','<script src="game.js"></script>\n<script src="motion-review.js"></script>','review script loading')
          css+='''
          #reviewPanel{margin:9px 0;padding:10px;background:#172b29;border:1px solid #879682;border-radius:10px;color:#e7e4ce}
          .reviewHead{display:flex;align-items:center;justify-content:space-between;gap:8px}
          .reviewHead strong{font-size:13px}.reviewHead button{font-size:12px;padding:8px}
          #reviewBody[hidden]{display:none}#reviewBody{display:grid;gap:9px;padding-top:10px}
          #reviewBody p{font-size:11px;color:#c5d4c6;line-height:1.5;margin:0}
          #reviewGrid{display:grid;gap:5px}
          .reviewRow{display:grid;grid-template-columns:36px minmax(0,1fr);gap:5px;align-items:center}
          .reviewRow strong{font-size:11px;text-align:center}
          .reviewSlots{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px}
          .reviewSlots button{min-width:0;padding:6px 0;font-size:10px;background:#2d4642;border:1px solid #64746b}
          .reviewSlots button[data-review=ok]{border-color:#7ebd8a;color:#baf3c5}
          .reviewSlots button[data-review=question]{border-color:#e8a06d;color:#ffd3ad}
          .reviewSlots button.selected{outline:2px solid #f2d780;background:#4d5b4b}
          #reviewProgress,#reviewSelection,#reviewTiming{font-size:11px;line-height:1.5}
          .reviewCompare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
          .reviewCompare>div{min-width:0;text-align:center;font-size:11px}
          .reviewCompare canvas{display:block;width:100%;height:auto;max-height:190px;border:1px solid #647b70;border-radius:7px;background:#162b28}
          .reviewActions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
          .reviewActions button,.reviewImportLabel{font-size:11px;padding:8px 4px;text-align:center}
          .reviewImportLabel{display:block;cursor:pointer;border-radius:6px;background:#38574d}
          .reviewImportLabel input{display:none}
          @media (orientation:landscape) and (max-height:600px){.reviewCompare canvas{max-height:130px}#reviewPanel{margin:4px 0;padding:6px}}
          '''
          (root/'motion-review.js').write_bytes(Path(sys.argv[2] if len(sys.argv)>2 else 'motion-review.js').read_bytes())
          htmlfile.write_text(html,encoding='utf-8');cssfile.write_text(css,encoding='utf-8')
          info.update(package=14,runtime=14,source_run=39046152609)
          info['sha256']={n:hashlib.sha256((root/n).read_bytes()).hexdigest() for n in ['index.html','game.css','game.js','game-data.js','manifest.json','monster-pack.json','monster-pack.js','motion-review.js']}
          meta.write_text(json.dumps(info,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root/'README_KO.txt').write_text((root/'README_KO.txt').read_text(encoding='utf-8')+'\nV14: 모션 연구실에서 오크 SPR 56 원본 5동작 x 8방향 40칸을 기존 기본 후보와 V18 추출 후보로 나란히 비교합니다. 검토 표시는 브라우저에 저장되고 JSON으로 내보낼 수 있습니다. 방향/속도는 검증 전이며 게임 전투 코드는 변경하지 않았습니다.\n',encoding='utf-8')
          print('V14 patched; game.js unchanged:',info['sha256']['game.js'])
          PY_PATCH
          python3 -m py_compile reports/patch_v14.py
          python3 reports/patch_v14.py dist/mobile reports/motion-review.js
          node --check dist/mobile/game.js
          node --check dist/mobile/motion-review.js

      - name: Verify all original sprites and review actions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY'
          from pathlib import Path
          import hashlib,json
          root=Path('dist/mobile')
          info=json.loads((root/'build-info.json').read_text(encoding='utf-8'))
          data=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          pack=json.loads((root/'monster-pack.json').read_text(encoding='utf-8'))
          assert info['package']==14 and info['source_run']==39046152609
          assert info['sha256']['game.js']=='6f73183bd0ee929a0705bf1a67b68e5d4a57913ec6d3b2b456beb49f3fb83e4f'
          assert info['sha256']['manifest.json']=='3f1cdb0f22376e763888628465b6601f5e9c72eeda8a9194a356dcba2c205c95'
          assert info['sha256']['monster-pack.json']=='4b1601df4afcca77e0416d222c4a81c2bafb370eddbe75d75256981cc43010c1'
          assert len(data['map']['objects'])==59963 and len(data['map']['flags'])==36864
          assert len(list((root/'tiles').glob('*.png')))==218
          assert len(list((root/'assets').glob('*.png')))>=3616
          assert len(list((root/'motion-gifs/v18').glob('*.gif')))==40
          assert pack['sourceRun']==39033202150 and pack['actors']['mob56']['provenance']['actionDefinitionsVerified'] is False
          for mode in ('idle','walk','attack','hit','death'):
              rows=pack['actors']['mob56']['actions'][mode]['directions']
              assert len(rows)==8
              for row in rows:
                  assert row['frames'] and all((root/f).is_file() for f in row['frames'])
          for file,digest in info['sha256'].items():
              assert hashlib.sha256((root/file).read_bytes()).hexdigest()==digest,file
          html=(root/'index.html').read_text(encoding='utf-8')
          assert html.index('src="game.js"')<html.index('src="motion-review.js"')
          assert 'id="reviewGrid"' in html and 'id="reviewImport"' in html
          print('V14 assets: map, 3616 SPR, 218 TIL, 40 V18 GIF; all review controls verified')
          PY_VERIFY
          node --check dist/mobile/motion-review.js
          cat > reports/review_smoke.cjs <<'NODE_SMOKE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const root=process.argv[2]||'dist/mobile';
          const pack=JSON.parse(fs.readFileSync(root+'/monster-pack.json','utf8'));
          const manifest=JSON.parse(fs.readFileSync(root+'/manifest.json','utf8'));
          const nodes=new Map(),values=new Map(),listeners={};
          let filename='',blob=null,clock=1000,frames=[];
          class Element{
           constructor(id){this.id=id;this.style={};this.className='';this.dataset={};this.children=[];this.hidden=id==='reviewBody';this.textContent='';this.value='';this.width=220;this.height=170;this.files=[];this.attributes={};this.classList={toggle(){},add(){},remove(){}};}
           appendChild(x){this.children.push(x);return x}remove(){}setAttribute(k,v){this.attributes[k]=v}
           click(){if(this.download)filename=this.download;this.onclick?.()}
           getContext(){return{fillRect(){},drawImage(){},fillText(){},imageSmoothingEnabled:false}}
          }
          const document={getElementById(id){if(!nodes.has(id))nodes.set(id,new Element(id));return nodes.get(id)},createElement:tag=>new Element(tag),body:new Element('body'),addEventListener(k,f){listeners[k]=f},hidden:false};
          class Image{constructor(){this.complete=true;this.naturalWidth=24;this.naturalHeight=32}set src(v){this._src=v}get src(){return this._src}}
          const window={SANCTUARY_MANIFEST:manifest,SANCTUARY_MONSTER_PACK:pack};
          const env={window,document,Image,Blob,Math,JSON,console,performance:{now:()=>clock},requestAnimationFrame(fn){frames.push(fn);return frames.length},localStorage:{getItem:k=>values.get(k)||null,setItem:(k,v)=>values.set(k,v)},URL:{createObjectURL(b){blob=b;return 'blob:test'},revokeObjectURL(){}},setTimeout(){},confirm:()=>true,alert(msg){throw Error(msg)}};
          vm.runInNewContext(fs.readFileSync(root+'/motion-review.js','utf8'),env,{timeout:10000});
          const el=id=>document.getElementById(id);
          const rows=el('reviewGrid').children;
          assert.equal(rows.length,5);assert(rows.every(x=>x.children[1].children.length===8));
          assert(window.SANCTUARY_REVIEW_READY);
          el('reviewToggle').click();assert.equal(el('reviewBody').hidden,false);
          assert(el('reviewSelection').textContent.includes('기존 키 32'));
          for(let i=0;i<4;i++){const f=frames.shift();assert(f);clock+=110;f(clock)}
          el('reviewOk').click();assert(el('reviewProgress').textContent.includes('1/40'));
          el('reviewNext').click();assert(el('reviewSelection').textContent.includes('방향 슬롯 1'));
          el('reviewQuestion').click();assert(el('reviewProgress').textContent.includes('2/40'));
          el('reviewExport').click();assert.equal(filename,'sanctuary-v14-orc56-review.json');assert(blob);
          (async()=>{
           const saved=JSON.parse(await blob.text());assert.equal(saved.schema,'sanctuary.motion-review.v1');assert.equal(saved.decisions['idle:0'],'ok');assert.equal(saved.decisions['idle:1'],'question');
           el('reviewClear').click();assert(el('reviewProgress').textContent.includes('0/40'));
           const event={target:{files:[{text:async()=>JSON.stringify(saved)}],value:'fixture'}};
           await el('reviewImport').onchange(event);assert(el('reviewProgress').textContent.includes('2/40'));
           assert.equal(event.target.value,'');
           el('reviewPrev').click();assert(el('reviewSelection').textContent.includes('방향 슬롯 0'));
           el('reviewUnset').click();assert(el('reviewProgress').textContent.includes('1/40'));
           el('reviewToggle').click();assert.equal(el('reviewBody').hidden,true);
           assert.equal(JSON.parse(values.get('sanctuary-v14-orc-review-v1')).decisions['idle:1'],'question');
           console.log('V14 SMOKE PASS: 40 original slots, side-by-side, direction navigation, review persist/export/import/reset');
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE_SMOKE
          node --check reports/review_smoke.cjs
          node reports/review_smoke.cjs dist/mobile
          echo 'V14: V13 original engine retained. Orc SPR56 review 5 actions x 8 directions, A/B preview, local markers, JSON export/import.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload V14 mobile package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Mobile-V14-Orc-40-Motion-Review
          path: dist/mobile/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Mobile-V14-Diagnostics
          path: reports/
          if-no-files-found: warn
          retention-days: 14
