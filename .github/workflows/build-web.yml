
name: Sanctuary of Aden Mobile V6 Directional Combat and SPR Roster

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanctuary-mobile-v6
  cancel-in-progress: false

jobs:
  build:
    name: Build V6 original S32 terrain and eight actor SPR motion sets
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout pinned V4 base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare isolated build
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip unzip p7zip-full
          mkdir -p downloads client src reports dist/mobile
          df -h .

      - name: Download 46 original client pieces
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" --pattern 'Sanctuary.of.Aden.-.Copy.*' --dir downloads
          python3 - <<'PY_PARTS'
          from pathlib import Path
          root=Path('downloads')
          paths=[root/f'Sanctuary.of.Aden.-.Copy.z{i:02d}' for i in range(1,46)]
          paths.append(root/'Sanctuary.of.Aden.-.Copy.zip')
          if any(not p.is_file() for p in paths):
              raise SystemExit('Original archive is incomplete')
          if any(p.stat().st_size!=100000000 for p in paths[:-1]):
              raise SystemExit('Unexpected split archive part size')
          if not paths[-1].stat().st_size:
              raise SystemExit('Final ZIP segment is empty')
          print('Archive verified:',len(paths),'pieces')
          PY_PARTS

      - name: Extract Sprite, Tile and real Aden Map 4
        shell: bash
        run: |
          set -euo pipefail
          if ! zip -s 0 downloads/Sanctuary.of.Aden.-.Copy.zip --out joined.zip > reports/reconstruction.log 2>&1; then
            tail -n 100 reports/reconstruction.log
            exit 1
          fi
          test -s joined.zip
          rm -rf downloads
          if ! 7z x joined.zip -oclient -y '-ir!Sprite.idx' '-ir!Sprite.pak' '-ir!Tile.idx' '-ir!Tile.pak' > reports/extraction.log 2>&1; then
            tail -n 100 reports/extraction.log
            exit 1
          fi
          python3 - <<'PY_MAPS'
          from zipfile import ZipFile
          with ZipFile('joined.zip') as z:
              prefix='Sanctuary of Aden - Copy/map/4/'
              names=[prefix+f'{x:04x}{y:04x}.s32' for x in range(0x8004,0x8007) for y in range(0x8008,0x800b)]
              for name in names:
                  info=z.getinfo(name)
                  if not 49152<=info.file_size<1000000:
                      raise SystemExit('Invalid original map: '+name)
                  z.extract(name,'client')
          PY_MAPS
          rm -f joined.zip
          python3 - <<'PY_PATHS'
          from pathlib import Path
          import os
          matches=sorted(Path('client').rglob('Sprite.idx'))
          if len(matches)!=1:
              raise SystemExit('Unique Sprite.idx was not found')
          folder=matches[0].parent
          files={'SPR_IDX':folder/'Sprite.idx','SPR_PAK':folder/'Sprite.pak',
                 'TILE_IDX':folder/'Tile.idx','TILE_PAK':folder/'Tile.pak','MAP_DIR':folder/'map/4'}
          for key,path in files.items():
              if not path.exists() or (path.is_file() and not path.stat().st_size):
                  raise SystemExit('Missing source: '+key+' '+str(path))
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              for key,path in files.items():
                  f.write(key+'='+str(path.resolve())+'\n')
          print('Source extraction verified')
          PY_PATHS
          df -h .

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install decoder and restore V4 mobile engine
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
          git cat-file -e '27f55d9bb3db3d9de7a037f896c936624fe765a7^{commit}'
          git show 27f55d9bb3db3d9de7a037f896c936624fe765a7:.github/workflows/build-web.yml > reports/pinned-v4.yml
          python3 - <<'PY_RESTORE'
          from pathlib import Path
          raw=Path('reports/pinned-v4.yml').read_text(encoding='utf-8')
          for name,delimiter in [('builder.py','PY_BUILDER'),('index.template.html','HTML_GAME')]:
              head="          cat > src/"+name+" <<'"+delimiter+"'\n"
              tail='          '+delimiter+'\n'
              if raw.count(head)!=1:
                  raise SystemExit('Pinned V4 source not found: '+name)
              section=raw.split(head,1)[1].split(tail,1)[0]
              content=''.join(line[10:] if line.startswith('          ') else line for line in section.splitlines(True))
              Path('src',name).write_text(content,encoding='utf-8')
          print('Pinned, previously successful V4 engine restored')
          PY_RESTORE

      - name: Restore pinned V5 tile decoder and expand original SPR actions
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 'fe7c554c7c6e469f7df5b7c117b2c8ec48781aca^{commit}'
          git show fe7c554c7c6e469f7df5b7c117b2c8ec48781aca:.github/workflows/build-web.yml > reports/pinned-v5.yml
          python3 - <<'PY_V5_RESTORE'
          from pathlib import Path
          raw=Path('reports/pinned-v5.yml').read_text(encoding='utf-8')
          for name,delimiter in [('map_builder.py','PY_MAP'),('upgrade.py','PY_UPGRADE')]:
              head="          cat > src/"+name+" <<'"+delimiter+"'\n"
              tail='          '+delimiter+'\n'
              if raw.count(head)!=1 or tail not in raw.split(head,1)[1]:
                  raise SystemExit('Pinned V5 source not found: '+name)
              section=raw.split(head,1)[1].split(tail,1)[0]
              if any(line.strip() and not line.startswith('          ') for line in section.splitlines()):
                  raise SystemExit('Unexpected V5 source indentation: '+name)
              content=''.join(line[10:] if line.startswith('          ') else line for line in section.splitlines(True))
              Path('src',name).write_text(content,encoding='utf-8')
          print('Pinned V5 TIL decoder and renderer recovered')
          PY_V5_RESTORE
          python src/upgrade.py
          cat > src/patch_v6.py <<'PY_V6'
          from pathlib import Path

          root = Path('src')
          builder = root / 'builder.py'
          html_path = root / 'index.template.html'
          b = builder.read_text(encoding='utf-8')
          s = html_path.read_text(encoding='utf-8')

          def change(value, old, new, label):
              count = value.count(old)
              if count != 1:
                  raise ValueError(f'{label}: expected one match, found {count}')
              return value.replace(old, new, 1)

          b = change(b, "IDS = {'hero': 2786, 'enemy': 3215}", "IDS = {'hero': 2786, 'enemy': 3215, 'mob56': 56, 'mob1022': 1022, 'mob54': 54, 'mob998': 998, 'mob1002': 1002, 'mob55': 55}", 'sprite roster')
          b = change(b, "frames = unpack_spr(read((sid, key)), limit=4)", "frames = unpack_spr(read((sid, key)), limit=14 if key < 40 else 4)", 'full action frames')
          builder.write_text(b, encoding='utf-8')

          s = change(s, 'Sanctuary of Aden Mobile V5 · Original Tile Artwork', 'Sanctuary of Aden Mobile V6 · Multi Sprite Animations', 'title')
          s = change(s, 'Sanctuary Mobile V5</strong>', 'Sanctuary Mobile V6</strong>', 'hud title')
          s = change(s, '원본 TIL 지형·오브젝트 + SPR 모션', '원본 지형 + 8방향 모션 + 다종 SPR 몬스터', 'hud subtitle')
          s = change(s,
              '현재 SPR 번호는 원본 그래픽 키이며 걷기·공격·8방향을 뜻한다는 근거가 없습니다. 직접 재생해 확인한 키만 아래 슬롯에 지정하세요.',
              '0~7 이동, 8~15 공격, 16~23 피격, 24~31 사망, 32~39 대기 모션 후보입니다. 실제 SPR 이미지를 비교해 도출한 기본 배정으로, 모든 캐릭터에 동일하게 적용된다는 원본 정의는 아직 미확인입니다. 직접 확인한 키로 덮어쓸 수 있습니다.',
              'motion research caveat')
          s = change(s,
              '<label>원본 에셋<select id="labActor"><option value="hero">2786 (시범 플레이어)</option><option value="enemy">3215 (시범 몬스터)</option></select></label>',
              '<label>원본 에셋<select id="labActor"></select></label>',
              'dynamic actor menu')
          s = change(s,
              "let score=0,potions=10,hero,mobs=[],mapped={hero:{},enemy:{}};",
              "const ROSTER=['enemy','mob56','mob1022','mob54','mob998','mob1002','mob55'];\nlet score=0,potions=10,hero,mobs=[],mapped=Object.fromEntries(Object.keys(D.actors).map(k=>[k,{}]));",
              'roster state')
          s = change(s,
              "function paths(actor,mode,dir){let selected=mapped[actor]?.[mode]?.[dir];if(selected!==undefined&&D.actors[actor].actions[selected])return D.actors[actor].actions[selected];return D.actors[actor].actions[String(dir)]||D.actors[actor].actions['0']||[]}",
              """const GROUP_BASE={walk:0,attack:8,hit:16,death:24,idle:32};
          function paths(actor,mode,dir){const a=D.actors[actor]?.actions;if(!a)return [];let assigned=mapped[actor]?.[mode]?.[dir];if(assigned!==undefined&&a[String(assigned)])return a[String(assigned)];let first=GROUP_BASE[mode]??0;let alternatives=[first+dir,mode==='idle'?24+dir:32+dir,mode==='death'?16+dir:0+dir,0+dir];for(let k of alternatives){const seq=a[String(k)];if(seq?.length)return seq}return []}
          """.strip(),
              'visual action octets')
          s = change(s,
              'mobs=Array.from({length:5},(_,i)=>makeMob(i));refresh();msg(\'원본 3×3 S32 맵 · 벽 통과 불가 · 지도를 누르면 이동\',3)',
              "mobs=Array.from({length:7},(_,i)=>makeMob(i));refresh();msg('7종 원본 SPR 그래픽·이동·공격 모션 시험',3)",
              'seven original sprite units')
          s = change(s,
              "return {id,x:candidate.x,y:candidate.y,hp:35,anim:0,dir:id%8,mode:'idle',dead:false,deadAt:0,attackCd:rnd(.3,1.5),attackUntil:0,hurtUntil:0,path:[],repath:0}}",
              "return {id,x:candidate.x,y:candidate.y,visual:ROSTER[(id+score)%ROSTER.length],hp:35,anim:0,dir:id%8,mode:'idle',dead:false,deadAt:0,attackCd:rnd(.3,1.5),attackUntil:0,hurtUntil:0,path:[],repath:0}}",
              'monster visual assignment')
          s = change(s,
              "hero.dead=true;hero.path=[];setMode(hero,'death');msg('전투 불능 · 다시 시작 버튼',5)",
              "hero.dead=true;hero.deadAt=clock;hero.path=[];setMode(hero,'death');msg('전투 불능 · 다시 시작 버튼',5)",
              'hero death sequence origin')
          s = change(s,
              "function update(dt){if(open||hero.dead)return;clock+=dt;hero.anim+=dt;",
              "function update(dt){if(open)return;clock+=dt;if(hero.dead){hero.anim+=dt;return}hero.anim+=dt;",
              'death animation continuity')
          s = change(s,
              "let p=screen(unit.x,unit.y),foot=p.y+17,seq=paths(type,unit.mode,unit.dir),frame=seq.length?seq[Math.min(seq.length-1,Math.floor(unit.anim*9)%seq.length)]:null,im=frame?img(frame):null;",
              "let p=screen(unit.x,unit.y),foot=p.y+17,seq=paths(type,unit.mode,unit.dir),duration=unit.mode==='attack'?.42:unit.mode==='hit'?.26:unit.mode==='death'?1.25:0,elapsed=unit.dead?Math.max(0,clock-unit.deadAt):unit.anim,fi=seq.length?(duration?Math.min(seq.length-1,Math.floor(elapsed/duration*seq.length)):Math.floor(elapsed*9)%seq.length):0,frame=seq.length?seq[fi]:null,im=frame?img(frame):null;",
              'complete action playback')
          s = change(s,
              "if(type==='enemy'&&unit.hp<35&&!unit.dead)",
              "if(type!=='hero'&&unit.hp<35&&!unit.dead)",
              'enemy health status')
          s = change(s,
              "...mobs.map(m=>({unit:m,type:'enemy',depth:m.x+m.y+.1}))",
              "...mobs.map(m=>({unit:m,type:m.visual||'enemy',depth:m.x+m.y+.1}))",
              'distinct visual sprite id')
          s = change(s,
              "function countSlots(a){return Object.values(mapped[a]).reduce((n,x)=>n+Object.keys(x).length,0)}",
              "function countSlots(a){return Object.values(mapped[a]||{}).reduce((n,x)=>n+Object.keys(x).length,0)}",
              'safe mapping slot counter')
          s = change(s,
              "let next={hero:{},enemy:{}};for(let a of ['hero','enemy'])for(let m of KEYS)",
              "let next=Object.fromEntries(Object.keys(D.actors).map(k=>[k,{}]));for(let a of Object.keys(D.actors))for(let m of KEYS)",
              'multi actor saved mapping')
          s = change(s,
              "for(let id of ['labActor','labMode','labDir'])el(id).onchange=()=>syncLab(id==='labActor');",
              """const options=el('labActor');for(const [key,entry] of Object.entries(D.actors)){let o=document.createElement('option');o.value=key;o.textContent='SPR '+entry.sprite_id+(key==='hero'?' · 플레이어 시험':' · 원본 몬스터 후보');options.appendChild(o)}
          for(let id of ['labActor','labMode','labDir'])el(id).onchange=()=>{let wanted=(GROUP_BASE[action()]??0)+Number(facingSlot());if(D.actors[actor()].actions[String(wanted)]){selectedKey=wanted;labPage=Math.floor(listKeys().indexOf(wanted)/16)}syncLab(id==='labActor')};""",
              'dynamic motion lab actors')
          s = change(s,
              "el('previewInfo').textContent='SPR '+D.actors[actor()].sprite_id+'-'+selectedKey+'.spr · '+rawSeq().length+' 프레임 · 모션 성격 미검증'",
              "el('previewInfo').textContent='SPR '+D.actors[actor()].sprite_id+'-'+selectedKey+'.spr · '+rawSeq().length+' 프레임 · 8개 단위 모션 후보, 원본 확정 아님'",
              'motion uncertainty label')
          s = change(s,
              "'맵 4 | TIL '+M.tile_decode.decoded_variants+'칸 · 오브젝트 '+M.objects.length",
              "'Map 4 | TIL '+M.tile_decode.decoded_variants+'종 · SPR '+ROSTER.length+'종'",
              'hud sprite counts')
          html_path.write_text(s, encoding='utf-8')
          print('PATCH_V6_OK', len(b), len(s))
          PY_V6
          python src/patch_v6.py
          python -m py_compile src/builder.py src/map_builder.py src/patch_v6.py
          python src/builder.py --idx "$SPR_IDX" --pak "$SPR_PAK" --template src/index.template.html --output dist/mobile
          python src/map_builder.py --map-dir "$MAP_DIR" --tile-idx "$TILE_IDX" --tile-pak "$TILE_PAK" --output dist/mobile/manifest.json
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import json
          output=Path('dist/mobile')
          data_file=output/'manifest.json'
          data=json.loads(data_file.read_text(encoding='utf-8'))
          data['version']=6
          data['status']='REAL_MAP_AND_MULTIPLE_SPR_DIRECTIONAL_ACTION_CANDIDATES'
          data['action_group_candidates']={'walk':[0,7],'attack':[8,15],'hit':[16,23],'death':[24,31],'idle':[32,39]}
          data['actor_identity_verified']=False
          data['motion_sequence_verified_for_every_actor']=False
          data['reference_limit']='Eight-direction groups observed in selected original sprites; exact original action semantics require further validation'
          data_file.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          page=output/'index.html'
          html=page.read_text(encoding='utf-8')
          tag='<script id="manifest" type="application/json">'
          start=html.find(tag)
          end=html.find('</script>',start+len(tag))
          if start<0 or end<0:
              raise SystemExit('Manifest injection target absent')
          html=html[:start+len(tag)]+json.dumps(data,ensure_ascii=False,separators=(',',':'))+html[end:]
          page.write_text(html,encoding='utf-8')
          (output/'README_KO.txt').write_text(
              'Sanctuary of Aden Mobile V6\n'
              '원본 아덴 S32, TIL 지형과 오브젝트가 유지됩니다.\n'
              '원본 SPR 8개 ID의 이동·공격 등 방향별 모션 후보를 표시합니다.\n'
              '모션 연구실에서 실제 프레임을 비교하고 매핑을 수정할 수 있습니다.\n'
              '몬스터 명칭 및 모든 동작 의미는 아직 원작 기준으로 확정되지 않았습니다.\n'
              '기존 SLKnight 빌드 및 GitHub Pages에는 영향을 주지 않습니다.\n',
              encoding='utf-8')
          print('V6 finalize complete:',len(data['actors']),'sprite IDs')
          PY_FINAL

      - name: Validate eight directional motions and original map
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY'
          from pathlib import Path
          import json,re
          out=Path('dist/mobile')
          data=json.loads((out/'manifest.json').read_text(encoding='utf-8'))
          html=(out/'index.html').read_text(encoding='utf-8')
          expected={'hero':2786,'enemy':3215,'mob56':56,'mob1022':1022,'mob54':54,'mob998':998,'mob1002':1002,'mob55':55}
          if {k:v['sprite_id'] for k,v in data['actors'].items()}!=expected:
              raise SystemExit('Eight original SPR identities are incomplete')
          for key in expected:
              actions=data['actors'][key]['actions']
              if not all(str(k) in actions for k in range(16)):
                  raise SystemExit('Walk/attack directional files missing: '+key)
              if any(not (out/file).is_file() for k in range(16) for file in actions[str(k)]):
                  raise SystemExit('Missing original SPR PNG data: '+key)
          if len(data['actors']['hero']['actions']['8'])<8 or len(data['actors']['mob56']['actions']['8'])<4:
              raise SystemExit('Original attack frames were truncated')
          count=len(list((out/'assets').glob('*.png')))
          if count<3000:
              raise SystemExit('Insufficient original SPR frames: '+str(count))
          world=data['map']
          if world['size']!=[192,192] or len(world['blocks'])!=9 or world['tile_decode']['atlases']<100:
              raise SystemExit('V5 original TIL terrain lost')
          if len(world['objects'])<10000 or len(world['flags'])!=192*192:
              raise SystemExit('S32 native obstacles and objects incomplete')
          if any(text not in html for text in ['Sanctuary Mobile V6','id="lab"','id="field"','id="minimap"']):
              raise SystemExit('V6 mobile interface is incomplete')
          if html.count('<script id="manifest" type="application/json">')!=1:
              raise SystemExit('Manifest embedded more than once')
          match=re.search(r'<script>([\s\S]*?)</script>',html)
          if match is None:
              raise SystemExit('Game JavaScript missing')
          Path('reports/game.js').write_text(match.group(1),encoding='utf-8')
          print('V6 actors:',expected)
          print('Original SPR images:',count)
          print('Original tile atlases:',world['tile_decode']['atlases'])
          print('Original S32 objects:',len(world['objects']))
          PY_VERIFY
          node --check reports/game.js
          {
            echo 'Sanctuary Mobile V6'
            echo 'Original Map4 S32 and TIL artwork retained.'
            echo 'Eight original sprite IDs, full directional motion frames for groups 0-39.'
            echo 'Attack, hit, death and walk frames use separate action group candidates.'
            echo 'Monster names and full original action meaning are not verified.'
            echo 'Existing SLKnight GitHub Pages deployment is not changed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload independent playable mobile V6
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Mobile-V6-MultiSPR-Original-Map4
          path: dist/mobile/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Mobile-V6-Diagnostics
          path: reports/
          if-no-files-found: warn
          retention-days: 14
