
name: "build-web.yml | V24 | Original SPR61 hero sprite trial"
run-name: "build-web.yml | V24 | Independent Sanctuary-Test publication"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: build-web-yml-v24-independent-spr61
  cancel-in-progress: false

jobs:
  build_v24:
    name: "build-web.yml | V24 | Verify and package independent site"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      deploy_enabled: ${{ steps.check_deploy.outputs.enabled }}
    steps:
      - name: "V24 | Restore verified successful V23 input"
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39201817637
          name: Sanctuary-Mobile-V23-Original-SPR61-Trial
          github-token: ${{ github.token }}
          path: restored

      - name: "V24 | Build independent HTML and update all displayed version labels"
        shell: bash
        run: |
          set -euo pipefail
          test -s restored/dist/mobile/index.html
          mkdir -p site
          cp -a restored/dist/mobile/. site/
          python3 - <<'PY_V24'
          import hashlib
          import json
          import re
          from html.parser import HTMLParser
          from pathlib import Path

          root = Path('site')
          info_file = root / 'build-info.json'
          info = json.loads(info_file.read_text(encoding='utf-8'))
          assert (info['package'], info['runtime'], info['display_version']) == (23, 23, 'V23')

          # Verify V23 before touching its files. Engine and data stay byte-identical.
          original_hashes = info['sha256'].copy()
          for filename, expected in original_hashes.items():
              assert hashlib.sha256((root / filename).read_bytes()).hexdigest() == expected, filename

          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['actors']['hero']['sprite_id'] == 2786
          assert manifest['actors']['knight61']['sprite_id'] == 61
          actions = manifest['actors']['knight61']['actions']
          assert len(actions) == 168 and sum(map(len, actions.values())) == 545
          assert len(list((root / 'assets').glob('*.png'))) == 4161
          assert len(list((root / 'assets').glob('knight61-61-*.png'))) == 545
          assert len(list((root / 'tiles').glob('*.png'))) == 218
          assert not (root / 'native-world').exists()

          page = (root / 'index.html').read_text(encoding='utf-8')
          expected_counts = {'V23': 3, 'V19': 2}
          for label, count in expected_counts.items():
              found = len(re.findall(r'\b' + label + r'\b', page))
              assert found == count, ('Original V23 HTML format changed', label, found)
          page = re.sub(r'\bV(?:19|23)\b', 'V24', page)
          assert re.search(r'\bV(?:19|23)\b', page) is None
          assert 'gowellsik-hue.github.io/Game/' not in page
          (root / 'index.html').write_text(page, encoding='utf-8')
          (root / 'Sanctuary-V24-SPR61-Test.html').write_text(page, encoding='utf-8')
          (root / '.nojekyll').touch()

          # V24 is a newly versioned independent package of the successful V23 engine.
          info.update({
              'version': '24',
              'display_version': 'V24',
              'package': 24,
              'runtime': 24,
              'v24_source_runtime': 23,
              'v24_source_run': 39201817637,
              'v24_source_artifact': 'Sanctuary-Mobile-V23-Original-SPR61-Trial',
              'v24_target_repository': 'gowellsik-hue/Sanctuary-Test',
              'v24_html': 'Sanctuary-V24-SPR61-Test.html',
              'v24_game_code_changed': False,
              'v24_map_changed': False,
              'v24_sprite_scale_changed': False,
          })
          for filename in ('index.html', 'Sanctuary-V24-SPR61-Test.html'):
              info['sha256'][filename] = hashlib.sha256((root / filename).read_bytes()).hexdigest()
          info_file.write_text(json.dumps(info, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          class Dependencies(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attributes):
                  attrs = dict(attributes)
                  if tag == 'script' and 'src' in attrs:
                      self.links.append(attrs['src'])
                  if tag == 'link' and 'href' in attrs:
                      self.links.append(attrs['href'])

          deps = Dependencies()
          deps.feed(page)
          for filename in deps.links:
              assert '://' not in filename and not filename.startswith('/')
              assert (root / filename).is_file(), 'Missing relative asset: ' + filename
          for filename, expected in info['sha256'].items():
              assert hashlib.sha256((root / filename).read_bytes()).hexdigest() == expected, filename

          (root / 'V24-build-report.json').write_text(json.dumps({
              'version': 'V24',
              'sourceVersion': 'V23',
              'sourceRun': 39201817637,
              'separateLaunchHtml': 'Sanctuary-V24-SPR61-Test.html',
              'siteRootHtml': 'index.html',
              'originalSprite61Keys': 168,
              'originalSprite61Frames': 545,
              'gameCodeChanged': False,
              'GamePagesModified': False,
              'publicationStateAtBuild': 'READY_NOT_YET_PUBLISHED',
              'publicationDependsOnDeploymentCredential': True,
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('V24_BUILD_PASS: 168 SPR keys, 545 frames, V24 UI, separate Pages package')
          PY_V24
          node --check site/game.js
          node --check site/motion-review.js
          echo '### V24 independent site files verified: original Game Pages unchanged.' >> "$GITHUB_STEP_SUMMARY"

      - name: "V24 | Upload independent website artifact"
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Test-V24-Independent-Site
          path: site/
          if-no-files-found: error
          retention-days: 90

      - name: "V24 | Check optional independent deployment credential"
        id: check_deploy
        shell: bash
        env:
          DEPLOY_TOKEN: ${{ secrets.SANCTUARY_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$DEPLOY_TOKEN" ]; then
            echo 'enabled=yes' >> "$GITHUB_OUTPUT"
            echo 'V24: publishing credential available; independent deployment will run.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'enabled=no' >> "$GITHUB_OUTPUT"
            echo 'V24: build SUCCESS, site artifact uploaded; independent site NOT published because SANCTUARY_DEPLOY_TOKEN is absent.' >> "$GITHUB_STEP_SUMMARY"
            echo '::warning::V24 site is ready, but online publication was skipped. Game Pages was not changed.'
          fi

  deploy_v24:
    name: "build-web.yml | V24 | Publish to Sanctuary-Test only"
    needs: build_v24
    if: needs.build_v24.outputs.deploy_enabled == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: "V24 | Download verified V24 site from this run"
        uses: actions/download-artifact@v4
        with:
          name: Sanctuary-Test-V24-Independent-Site
          path: site

      - name: "V24 | Publish independent repository; never alter Game Pages"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SANCTUARY_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          target='gowellsik-hue/Sanctuary-Test'
          test -s site/index.html
          test -s site/Sanctuary-V24-SPR61-Test.html
          test -s site/V24-build-report.json
          actor="$(gh api user --jq .login)"
          if [ "$actor" != 'gowellsik-hue' ]; then
            echo "::error::The deploy token belongs to $actor, not gowellsik-hue."
            exit 1
          fi

          if gh repo view "$target" --json name --jq .name >/dev/null 2>&1; then
            echo 'V24: independent repository exists.'
          else
            gh api --method POST user/repos \
              -f name=Sanctuary-Test -F private=false -F auto_init=true \
              --jq .full_name
            echo 'V24: independent repository created.'
          fi

          gh auth setup-git
          git clone -q "https://github.com/$target.git" published
          git -C published checkout -q -B main
          rsync -a --delete --exclude='.git/' site/ published/
          git -C published config user.name 'github-actions[bot]'
          git -C published config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C published add -A
          if ! git -C published diff --cached --quiet; then
            git -C published commit -qm 'Publish independent Sanctuary V24 SPR61 test'
            git -C published push -q origin HEAD:main
          fi

          if gh api "repos/$target/pages" --silent >/dev/null 2>&1; then
            current="$(gh api "repos/$target/pages" --jq '[.build_type, (.source.branch // ""), (.source.path // "")] | join("|")')"
            if [ "$current" != 'legacy|main|/' ]; then
              printf '%s' '{"build_type":"legacy","source":{"branch":"main","path":"/"}}' | \
                gh api --method PUT "repos/$target/pages" --input - >/dev/null
            fi
          else
            printf '%s' '{"build_type":"legacy","source":{"branch":"main","path":"/"}}' | \
              gh api --method POST "repos/$target/pages" --input - >/dev/null
          fi
          page_url="$(gh api "repos/$target/pages" --jq .html_url)"
          echo "V24: independent Pages configured at $page_url"
          echo "V24: separate site configured at $page_url (publication may take additional time)." >> "$GITHUB_STEP_SUMMARY"
          echo 'Original Game Pages configuration was not touched.' >> "$GITHUB_STEP_SUMMARY"
