name: Build and Deploy DiabloWeb AutoAttack

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-22.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Game repo
        uses: actions/checkout@v4

      - name: Checkout original DiabloWeb source
        uses: actions/checkout@v4
        with:
          repository: d07RiV/diabloweb
          ref: master
          path: diabloweb

      - name: Checkout original DiabloWeb production files
        uses: actions/checkout@v4
        with:
          repository: d07RiV/diabloweb
          ref: gh-pages
          path: production

      - name: Checkout original DiabloWeb engine
        uses: actions/checkout@v4
        with:
          repository: d07RiV/devilution
          ref: 798b5122731ae4b5e0c91348e5c44cf79354a94e
          path: engine

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 1.39.20
          actions-cache-folder: emsdk-cache

      - name: Patch engine for mobile auto attack
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          # ============================================================
          # Patch Source/diablo.cpp
          # ============================================================

          path = Path("engine/Source/diablo.cpp")
          src = path.read_text(encoding="utf-8")

          anchor = """void game_loop(BOOL bStartup)
          {
          """

          if anchor not in src:
              raise SystemExit("ERROR: game_loop anchor not found")

          auto_attack = r'''
          static int FindMobileAutoAttackTarget()
          {
          	int best = -1;
          	int bestDistance = 9999;

          	const int px = plr[myplr].WorldX;
          	const int py = plr[myplr].WorldY;

          	for (int n = 0; n < nummonsters; n++) {
          		const int mi = monstactive[n];

          		if (mi < 0 || mi >= MAXMONSTERS)
          			continue;

          		MonsterStruct &m = monster[mi];

          		if (m._mDelFlag)
          			continue;

          		if (m._mhitpoints <= 0)
          			continue;

          		if (CanTalkToMonst(mi))
          			continue;

          		const int dx = abs(m._mx - px);
          		const int dy = abs(m._my - py);
          		const int distance = dx > dy ? dx : dy;

          		if (distance > 8)
          			continue;

          		if (distance >= bestDistance)
          			continue;

          		best = mi;
          		bestDistance = distance;
          	}

          	return best;
          }

          static void TryMobileAutoAttack()
          {
          	if (leveltype == DTYPE_TOWN)
          		return;

          	if (PauseMode == 2)
          		return;

          	if (deathflag)
          		return;

          	if (gmenu_exception())
          		return;

          	if (stextflag || spselflag || qtextflag)
          		return;

          	if (questlog || doomflag || dropGoldFlag)
          		return;

          	if (track_isscrolling())
          		return;

          	PlayerStruct &player = plr[myplr];

          	/*
          	 * 플레이어가 서 있는 상태에서만 새 공격 명령을 보냄.
          	 * 이동 / 공격 애니메이션 / 피격 / 주문 행동을
          	 * 자동공격이 계속 끊는 것을 방지함.
          	 */
          	if (player._pmode != PM_STAND)
          		return;

          	const int target = FindMobileAutoAttackTarget();

          	if (target < 0)
          		return;

          	if (player._pwtype == WT_RANGED)
          		NetSendCmdParam1(TRUE, CMD_RATTACKID, target);
          	else
          		NetSendCmdParam1(TRUE, CMD_ATTACKID, target);
          }

          '''

          src = src.replace(
              anchor,
              auto_attack + anchor,
              1
          )

          old_logic = """\tif (!gmenu_exception() && sgnTimeoutCurs == 0) {
          		CheckCursMove();
          		track_process();
          	}
          	if (gbProcessPlayers) {
          """

          new_logic = """\tif (!gmenu_exception() && sgnTimeoutCurs == 0) {
          		CheckCursMove();
          		track_process();
          		TryMobileAutoAttack();
          	}
          	if (gbProcessPlayers) {
          """

          if old_logic not in src:
              raise SystemExit(
                  "ERROR: game_logic anchor not found"
              )

          src = src.replace(
              old_logic,
              new_logic,
              1
          )

          path.write_text(
              src,
              encoding="utf-8"
          )

          print("diablo.cpp patched")


          # ============================================================
          # Patch build.js
          # ============================================================

          path = Path("engine/build.js")
          src = path.read_text(encoding="utf-8")

          # Old Emscripten option cleanup.
          src = src.replace(
              " -s BINARYEN_TRAP_MODE='clamp'",
              ""
          )

          old_tail = """//run_build('-O3 -g -DZ_SOLO', 'Diablo', ['Source']).catch(e => console.error(e.message));
          //run_build('-O3 -g -DZ_SOLO -DSPAWN', 'DiabloSpawn', ['Source']).catch(e => console.error(e.message));
          run_build('-O3 -g -DZ_SOLO', 'MpqCmp', ['Source/rmpq', 'Source/zlib', 'mpqcmp']).catch(e => console.error(e.message));
          """

          new_tail = """(async () => {
            await run_build(
              '-O3 -g -DZ_SOLO',
              'Diablo',
              ['Source']
            );

            await run_build(
              '-O3 -g -DZ_SOLO -DSPAWN',
              'DiabloSpawn',
              ['Source']
            );
          })().catch(e => {
            console.error(e);
            process.exitCode = 1;
          });
          """

          if old_tail not in src:
              raise SystemExit(
                  "ERROR: build.js build target anchor not found"
              )

          src = src.replace(
              old_tail,
              new_tail,
              1
          )

          path.write_text(
              src,
              encoding="utf-8"
          )

          print("build.js patched")
          print("PATCH_OK")
          PY

      - name: Show auto attack patch
        shell: bash
        run: |
          set -e

          echo "=== AutoAttack functions ==="
          grep -n "FindMobileAutoAttackTarget" \
            engine/Source/diablo.cpp

          grep -n "TryMobileAutoAttack" \
            engine/Source/diablo.cpp

          echo "=== Build targets ==="
          grep -n "DiabloSpawn" \
            engine/build.js \
            | tail -10

      - name: Build Diablo and DiabloSpawn
        working-directory: engine
        shell: bash
        run: |
          set -e

          echo "=== Emscripten ==="
          emcc --version

          echo "=== Node ==="
          node --version

          echo "=== Building engine ==="
          node build.js

      - name: Verify engine build
        shell: bash
        run: |
          set -e

          test -s engine/Diablo.wasm
          test -s engine/DiabloSpawn.wasm
          test -s engine/Diablo.jscc
          test -s engine/DiabloSpawn.jscc

          echo "=== Engine build OK ==="

          ls -lh \
            engine/Diablo.wasm \
            engine/DiabloSpawn.wasm \
            engine/Diablo.jscc \
            engine/DiabloSpawn.jscc

      - name: Replace DiabloWeb engine source
        shell: bash
        run: |
          set -e

          test -d diabloweb/src/api

          cp \
            engine/Diablo.wasm \
            diabloweb/src/api/Diablo.wasm

          cp \
            engine/DiabloSpawn.wasm \
            diabloweb/src/api/DiabloSpawn.wasm

          cp \
            engine/Diablo.jscc \
            diabloweb/src/api/Diablo.jscc

          cp \
            engine/DiabloSpawn.jscc \
            diabloweb/src/api/DiabloSpawn.jscc

          echo "=== Replaced DiabloWeb engine ==="

          ls -lh \
            diabloweb/src/api/Diablo.wasm \
            diabloweb/src/api/DiabloSpawn.wasm \
            diabloweb/src/api/Diablo.jscc \
            diabloweb/src/api/DiabloSpawn.jscc

      - name: Add SPAWN.MPQ
        shell: bash
        run: |
          set -e

          test -s production/spawn.mpq

          cp \
            production/spawn.mpq \
            diabloweb/public/spawn.mpq

          echo "=== SPAWN.MPQ ==="

          stat -c "%n : %s bytes" \
            diabloweb/public/spawn.mpq

      - name: Set GitHub Pages path
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("diabloweb/package.json")

          data = json.loads(
              p.read_text(encoding="utf-8")
          )

          data["homepage"] = (
              "https://gowellsik-hue.github.io/Game"
          )

          p.write_text(
              json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print(
              "homepage:",
              data["homepage"]
          )
          PY

      - name: Repair broken DiabloWeb package-lock
        working-directory: diabloweb
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path("package-lock.json")

          original = p.read_text(
              encoding="utf-8"
          )

          lines = original.splitlines(True)

          output = []
          state = "normal"
          conflicts = 0

          for line in lines:

              if line.startswith("<<<<<<< "):
                  if state != "normal":
                      raise SystemExit(
                          "ERROR: nested conflict marker"
                      )

                  conflicts += 1
                  state = "upper"
                  continue

              if state == "upper":

                  if line.startswith("======="):
                      state = "lower"

                  continue

              if state == "lower":

                  if line.startswith(">>>>>>> "):
                      state = "normal"
                      continue

                  # Keep the newer Stashed changes side.
                  output.append(line)
                  continue

              output.append(line)

          if state != "normal":
              raise SystemExit(
                  "ERROR: unterminated conflict marker"
              )

          fixed = "".join(output)

          # Validate before npm touches the file.
          data = json.loads(fixed)

          p.write_text(
              json.dumps(
                  data,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print(
              "Resolved conflict blocks:",
              conflicts
          )

          print(
              "package-lock version:",
              data.get("lockfileVersion")
          )

          print(
              "PACKAGE_LOCK_JSON_OK"
          )
          PY

          echo "=== Conflict marker check ==="

          if grep -nE \
            '^(<<<<<<<|=======|>>>>>>>)' \
            package-lock.json
          then
            echo \
              "ERROR: conflict markers still remain"
            exit 1
          fi

          echo "LOCKFILE_REPAIR_OK"

      - name: Setup Node for original DiabloWeb
        uses: actions/setup-node@v4
        with:
          node-version: 14.21.3
          cache: npm
          cache-dependency-path: diabloweb/package-lock.json

      - name: Show Node versions
        shell: bash
        run: |
          node --version
          npm --version

      - name: Install DiabloWeb dependencies
        working-directory: diabloweb
        shell: bash
        run: |
          set -e

          npm ci \
            --no-audit \
            --no-fund

      - name: Build DiabloWeb
        working-directory: diabloweb
        env:
          CI: false
        shell: bash
        run: |
          set -e

          npm run build

      - name: Prepare Pages site
        shell: bash
        run: |
          set -e

          rm -rf _site
          mkdir -p _site

          cp -a \
            diabloweb/build/. \
            _site/

          echo \
            "=== Rewrite /diabloweb/ -> /Game/ ==="

          while IFS= read -r file
          do
            sed -i \
              's#/diabloweb/#/Game/#g' \
              "$file"
          done < <(
            grep -RIl \
              "/diabloweb/" \
              _site \
              || true
          )

          echo \
            "=== Check remaining old paths ==="

          if grep -RIn \
            "/diabloweb/" \
            _site
          then
            echo \
              "ERROR: old /diabloweb/ path remains"
            exit 1
          fi

          echo \
            "=== SPAWN.MPQ check ==="

          test -s _site/spawn.mpq

          stat -c \
            "%n : %s bytes" \
            _site/spawn.mpq

          echo \
            "=== WASM files ==="

          find \
            _site \
            -type f \
            -name '*.wasm' \
            -exec ls -lh {} \;

          echo \
            "=== DiabloSpawn WASM ==="

          find \
            _site \
            -type f \
            -name 'DiabloSpawn*.wasm' \
            -exec ls -lh {} \;

          echo \
            "=== /Game/ references ==="

          grep -o \
            "/Game/[^\"']*" \
            _site/index.html \
            | head -20 \
            || true

          echo \
            "=== Site root ==="

          ls -lah _site

      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: diabloweb-autoattack
          path: _site/
          if-no-files-found: error

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
