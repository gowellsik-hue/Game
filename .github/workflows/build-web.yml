name: Deploy DiabloWeb Mobile Pack V3

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: levidehaan/diablowebai
          ref: 4becbb4c81323dc8982504ecb2a5f338434c9772
          path: app

      - name: Checkout Devilution engine
        uses: actions/checkout@v4
        with:
          repository: d07RiV/devilution
          ref: 798b5122731ae4b5e0c91348e5c44cf79354a94e
          path: engine

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 1.39.20
          actions-cache-folder: emsdk-cache

      - name: Patch engine
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import re
          from pathlib import Path

          def replace_once(text, old, new, name):
              if old not in text:
                  raise SystemExit(
                      "PATCH FAILED: " + name
                  )
              return text.replace(old, new, 1)

          # ==================================================
          # 1. AUTO ATTACK + AUTO LOOT
          # ==================================================

          p = Path("engine/Source/diablo.cpp")
          text = p.read_text(encoding="utf-8")

          anchor = """void game_loop(BOOL bStartup)
          {
          """

          if anchor not in text:
              raise SystemExit(
                  "ERROR: game_loop anchor missing"
              )

          mobile_code = r'''
          /*
           * MOBILE PACK V3
           *
           * AutoAttack V2
           * AutoLoot V2
           */

          static int FindMobileAdjacentAttackDirection()
          {
          	PlayerStruct &player = plr[myplr];

          	for (int dir = 0; dir < 8; dir++) {
          		const int x =
          		    player.WorldX + offset_x[dir];

          		const int y =
          		    player.WorldY + offset_y[dir];

          		if (
          		    x < 0 ||
          		    y < 0 ||
          		    x >= MAXDUNX ||
          		    y >= MAXDUNY
          		) {
          			continue;
          		}

          		const int cell =
          		    dMonster[x][y];

          		if (cell == 0)
          			continue;

          		const int mi =
          		    cell > 0
          		        ? cell - 1
          		        : -(cell + 1);

          		if (
          		    mi < 0 ||
          		    mi >= MAXMONSTERS
          		) {
          			continue;
          		}

          		MonsterStruct &monsterRef =
          		    monster[mi];

          		if (monsterRef._mDelFlag)
          			continue;

          		if (monsterRef._mhitpoints <= 0)
          			continue;

          		if (CanTalkToMonst(mi))
          			continue;

          		return dir;
          	}

          	return -1;
          }

          static int FindMobileRangedTarget()
          {
          	PlayerStruct &player =
          	    plr[myplr];

          	int best = -1;
          	int bestDistance = 9999;

          	for (
          	    int n = 0;
          	    n < nummonsters;
          	    n++
          	) {
          		const int mi =
          		    monstactive[n];

          		if (
          		    mi < 0 ||
          		    mi >= MAXMONSTERS
          		) {
          			continue;
          		}

          		MonsterStruct &monsterRef =
          		    monster[mi];

          		if (monsterRef._mDelFlag)
          			continue;

          		if (monsterRef._mhitpoints <= 0)
          			continue;

          		if (CanTalkToMonst(mi))
          			continue;

          		const int dx =
          		    abs(
          		        monsterRef._mfutx -
          		        player.WorldX
          		    );

          		const int dy =
          		    abs(
          		        monsterRef._mfuty -
          		        player.WorldY
          		    );

          		const int distance =
          		    dx > dy ? dx : dy;

          		if (distance > 8)
          			continue;

          		if (
          		    distance >=
          		    bestDistance
          		) {
          			continue;
          		}

          		best = mi;
          		bestDistance = distance;
          	}

          	return best;
          }

          static void TryMobileAutoAttack()
          {
          	if (leveltype == DTYPE_TOWN)
          		return;

          	if (PauseMode == 2)
          		return;

          	if (deathflag)
          		return;

          	if (gmenu_exception())
          		return;

          	if (
          	    stextflag ||
          	    spselflag ||
          	    qtextflag ||
          	    questlog ||
          	    doomflag ||
          	    dropGoldFlag ||
          	    talkflag
          	) {
          		return;
          	}

          	if (
          	    chrflag ||
          	    invflag ||
          	    sbookflag ||
          	    helpflag
          	) {
          		return;
          	}

          	if (track_isscrolling())
          		return;

          	if (sgbMouseDown != 0)
          		return;

          	PlayerStruct &player =
          	    plr[myplr];

          	if (player._pHitPoints <= 0)
          		return;

          	if (
          	    player._pmode != PM_STAND
          	) {
          		return;
          	}

          	if (
          	    player.walkpath[0] !=
          	    WALK_NONE
          	) {
          		return;
          	}

          	if (
          	    player.destAction !=
          	    ACTION_NONE
          	) {
          		return;
          	}

          	if (
          	    player._pwtype ==
          	    WT_RANGED
          	) {
          		const int target =
          		    FindMobileRangedTarget();

          		if (target < 0)
          			return;

          		const int tx =
          		    monster[target]._mfutx;

          		const int ty =
          		    monster[target]._mfuty;

          		const int dir =
          		    GetDirection(
          		        player.WorldX,
          		        player.WorldY,
          		        tx,
          		        ty
          		    );

          		StartRangeAttack(
          		    myplr,
          		    dir,
          		    tx,
          		    ty
          		);

          		return;
          	}

          	const int dir =
          	    FindMobileAdjacentAttackDirection();

          	if (dir < 0)
          		return;

          	StartAttack(
          	    myplr,
          	    dir
          	);
          }

          static DWORD gMobileAutoLootNextTick = 0;

          static int FindMobileAutoLootTarget()
          {
          	PlayerStruct &player =
          	    plr[myplr];

          	int best = -1;
          	int bestDistance = 9999;

          	for (
          	    int n = 0;
          	    n < numitems;
          	    n++
          	) {
          		const int ii =
          		    itemactive[n];

          		if (
          		    ii < 0 ||
          		    ii >= MAXITEMS
          		) {
          			continue;
          		}

          		ItemStruct &groundItem =
          		    item[ii];

          		if (
          		    groundItem._itype ==
          		    ITYPE_NONE
          		) {
          			continue;
          		}

          		if (
          		    groundItem._iSelFlag == 0
          		) {
          			continue;
          		}

          		const int dx =
          		    abs(
          		        groundItem._ix -
          		        player.WorldX
          		    );

          		const int dy =
          		    abs(
          		        groundItem._iy -
          		        player.WorldY
          		    );

          		const int distance =
          		    dx > dy ? dx : dy;

          		/*
          		 * Magnetic pickup radius.
          		 *
          		 * Player does NOT walk to item.
          		 */
          		if (distance > 3)
          			continue;

          		if (
          		    distance >=
          		    bestDistance
          		) {
          			continue;
          		}

          		best = ii;
          		bestDistance = distance;
          	}

          	return best;
          }

          static void TryMobileAutoLoot()
          {
          	/*
          	 * Direct pickup only in single player.
          	 */
          	if (gbMaxPlayers != 1)
          		return;

          	if (leveltype == DTYPE_TOWN)
          		return;

          	if (PauseMode == 2)
          		return;

          	if (deathflag)
          		return;

          	if (gmenu_exception())
          		return;

          	if (
          	    stextflag ||
          	    spselflag ||
          	    qtextflag ||
          	    questlog ||
          	    doomflag ||
          	    dropGoldFlag ||
          	    talkflag
          	) {
          		return;
          	}

          	if (
          	    chrflag ||
          	    invflag ||
          	    sbookflag ||
          	    helpflag
          	) {
          		return;
          	}

          	if (track_isscrolling())
          		return;

          	PlayerStruct &player =
          	    plr[myplr];

          	if (player._pHitPoints <= 0)
          		return;

          	/*
          	 * Allow pickup while standing OR walking.
          	 *
          	 * This fixes items being missed while
          	 * the player walks past them.
          	 */
          	if (
          	    player._pmode != PM_STAND &&
          	    player._pmode != PM_WALK &&
          	    player._pmode != PM_WALK2 &&
          	    player._pmode != PM_WALK3
          	) {
          		return;
          	}

          	/*
          	 * Don't interfere with an object,
          	 * NPC, manual pickup, etc.
          	 */
          	if (
          	    player.destAction !=
          	    ACTION_NONE
          	) {
          		return;
          	}

          	/*
          	 * Item currently held by mouse cursor.
          	 */
          	if (
          	    pcurs >=
          	    CURSOR_FIRSTITEM
          	) {
          		return;
          	}

          	const DWORD now =
          	    _GetTickCount();

          	if (
          	    now <
          	    gMobileAutoLootNextTick
          	) {
          		return;
          	}

          	const int target =
          	    FindMobileAutoLootTarget();

          	if (target < 0)
          		return;

          	const int x =
          	    item[target]._ix;

          	const int y =
          	    item[target]._iy;

          	/*
          	 * Diablo's own auto placement:
          	 *
          	 * gold -> stack / inventory
          	 * potion -> belt first
          	 * equipment -> inventory
          	 */
          	AutoGetItem(
          	    myplr,
          	    target
          	);

          	bool stillOnFloor = false;

          	if (
          	    x >= 0 &&
          	    y >= 0 &&
          	    x < MAXDUNX &&
          	    y < MAXDUNY
          	) {
          		stillOnFloor =
          		    dItem[x][y] != 0;
          	}

          	if (stillOnFloor) {
          		/*
          		 * Usually inventory full.
          		 */
          		gMobileAutoLootNextTick =
          		    now + 1000;
          	} else {
          		/*
          		 * Next nearby item almost
          		 * immediately.
          		 */
          		gMobileAutoLootNextTick =
          		    now + 50;
          	}
          }

          '''

          text = text.replace(
              anchor,
              mobile_code + anchor,
              1
          )

          old_logic = """\tif (!gmenu_exception() && sgnTimeoutCurs == 0) {
          		CheckCursMove();
          		track_process();
          	}
          	if (gbProcessPlayers) {
          """

          new_logic = """\tif (!gmenu_exception() && sgnTimeoutCurs == 0) {
          		CheckCursMove();
          		track_process();
          		TryMobileAutoAttack();
          		TryMobileAutoLoot();
          	}
          	if (gbProcessPlayers) {
          """

          text = replace_once(
              text,
              old_logic,
              new_logic,
              "game loop"
          )

          p.write_text(
              text,
              encoding="utf-8"
          )

          print("AUTOATTACK_AUTOLOOT_OK")

          # ==================================================
          # 2. WALK SPEED
          #
          # Original:
          # 8 ticks per tile
          #
          # New:
          # 6 ticks per tile
          #
          # Velocity is adjusted proportionally so
          # interpolation still reaches the same position.
          # ==================================================

          p = Path("engine/Source/player.cpp")
          text = p.read_text(encoding="utf-8")

          old_vel = """int PWVel[3][3] = {
          	{ 2048, 1024, 512 },
          	{ 2048, 1024, 512 },
          	{ 2048, 1024, 512 }
          };"""

          new_vel = """int PWVel[3][3] = {
          	{ 2731, 1365, 683 },
          	{ 2731, 1365, 683 },
          	{ 2731, 1365, 683 }
          };"""

          text = replace_once(
              text,
              old_vel,
              new_vel,
              "PWVel"
          )

          old_anim = """int AnimLenFromClass[3] = {
          	8, 8, 8
          };"""

          new_anim = """int AnimLenFromClass[3] = {
          	6, 6, 6
          };"""

          text = replace_once(
              text,
              old_anim,
              new_anim,
              "walk animation length"
          )

          walk_count = text.count(
              "anim_len = 8;"
          )

          if walk_count != 3:
              raise SystemExit(
                  "ERROR: unexpected walk function count: " +
                  str(walk_count)
              )

          text = text.replace(
              "anim_len = 8;",
              "anim_len = 6;"
          )

          town_vel = """			} else {
          				xvel3 = 2048;
          				xvel = 1024;
          				yvel = 512;
          			}"""

          town_vel_new = """			} else {
          				xvel3 = 2731;
          				xvel = 1365;
          				yvel = 683;
          			}"""

          text = replace_once(
              text,
              town_vel,
              town_vel_new,
              "town walk velocity"
          )

          p.write_text(
              text,
              encoding="utf-8"
          )

          print("WALK_SPEED_133_OK")

          # ==================================================
          # 3. NEW WARRIOR STARTS WITH SHORT BOW
          # ==================================================

          p = Path("engine/Source/items.cpp")
          text = p.read_text(encoding="utf-8")

          club = """			SetPlrHandItem(&plr[p].HoldItem, IDI_WARRCLUB);
          			GetPlrHandSeed(&plr[p].HoldItem);
          			AutoPlace(p, 0, 1, 3, TRUE);"""

          club_bow = """			SetPlrHandItem(&plr[p].HoldItem, IDI_WARRCLUB);
          			GetPlrHandSeed(&plr[p].HoldItem);
          			AutoPlace(p, 0, 1, 3, TRUE);

          			/*
          			 * Mobile pack:
          			 * give Warrior a Short Bow as
          			 * an alternate ranged weapon.
          			 */
          			SetPlrHandItem(&plr[p].HoldItem, IDI_ROGUE);
          			GetPlrHandSeed(&plr[p].HoldItem);
          			AutoPlace(p, 1, 2, 3, TRUE);"""

          text = replace_once(
              text,
              club,
              club_bow,
              "new Warrior bow"
          )

          p.write_text(
              text,
              encoding="utf-8"
          )

          print("NEW_WARRIOR_BOW_OK")

          # ==================================================
          # 4. EXISTING WARRIOR SAVE:
          #    if no bow exists, give one when loaded.
          # ==================================================

          p = Path("engine/Source/pfile.cpp")
          text = p.read_text(encoding="utf-8")

          old_load = """  UnPackPlayer(&pkplr, myplr, FALSE);
            gbValidSaveFile = pfile_archive_contains_game(archive, save_num);
            pfile_SFileCloseArchive(archive);
          }"""

          new_load = """  UnPackPlayer(&pkplr, myplr, FALSE);

            /*
             * Mobile pack:
             * Existing Warrior saves also receive
             * one Short Bow if they do not own any bow.
             */
            if (plr[myplr]._pClass == PC_WARRIOR) {
              BOOL hasBow = FALSE;

              for (
                int i = 0;
                i < NUM_INVLOC;
                i++
              ) {
                if (
                  plr[myplr]
                    .InvBody[i]
                    ._itype ==
                  ITYPE_BOW
                ) {
                  hasBow = TRUE;
                }
              }

              for (
                int i = 0;
                i < plr[myplr]._pNumInv;
                i++
              ) {
                if (
                  plr[myplr]
                    .InvList[i]
                    ._itype ==
                  ITYPE_BOW
                ) {
                  hasBow = TRUE;
                }
              }

              if (!hasBow) {
                SetPlrHandItem(
                  &plr[myplr].HoldItem,
                  IDI_ROGUE
                );

                GetPlrHandSeed(
                  &plr[myplr].HoldItem
                );

                BOOL placed = FALSE;

                for (
                  int slot = 0;
                  slot < 20 && !placed;
                  slot++
                ) {
                  placed =
                    AutoPlace(
                      myplr,
                      slot,
                      2,
                      3,
                      TRUE
                    );
                }

                if (placed) {
                  CalcPlrInv(
                    myplr,
                    TRUE
                  );
                }

                plr[myplr]
                  .HoldItem
                  ._itype =
                  ITYPE_NONE;
              }
            }

            gbValidSaveFile = pfile_archive_contains_game(archive, save_num);
            pfile_SFileCloseArchive(archive);
          }"""

          text = replace_once(
              text,
              old_load,
              new_load,
              "existing Warrior bow"
          )

          p.write_text(
              text,
              encoding="utf-8"
          )

          print("EXISTING_WARRIOR_BOW_OK")

          # ==================================================
          # 5. RUNTIME VERSION
          # ==================================================

          p = Path("engine/Source/main.cpp")
          text = p.read_text(encoding="utf-8")

          declaration = """EMSCRIPTEN_KEEPALIVE void DApi_Render(unsigned int time);
          """

          declaration_new = """EMSCRIPTEN_KEEPALIVE void DApi_Render(unsigned int time);
          EMSCRIPTEN_KEEPALIVE int DApi_AutoAttackVersion();
          EMSCRIPTEN_KEEPALIVE int DApi_AutoLootVersion();
          EMSCRIPTEN_KEEPALIVE int DApi_MobilePackVersion();
          """

          text = replace_once(
              text,
              declaration,
              declaration_new,
              "version declarations"
          )

          definition = """EMSCRIPTEN_KEEPALIVE void* DApi_SyncTextPtr() {
          """

          definition_new = """EMSCRIPTEN_KEEPALIVE int DApi_AutoAttackVersion() {
            return 2;
          }

          EMSCRIPTEN_KEEPALIVE int DApi_AutoLootVersion() {
            return 2;
          }

          EMSCRIPTEN_KEEPALIVE int DApi_MobilePackVersion() {
            return 3;
          }

          EMSCRIPTEN_KEEPALIVE void* DApi_SyncTextPtr() {
          """

          text = replace_once(
              text,
              definition,
              definition_new,
              "version definitions"
          )

          p.write_text(
              text,
              encoding="utf-8"
          )

          # ==================================================
          # 6. BUILD BOTH FULL + SPAWN ENGINE
          # ==================================================

          p = Path("engine/build.js")
          text = p.read_text(encoding="utf-8")

          text = text.replace(
              " -s BINARYEN_TRAP_MODE='clamp'",
              ""
          )

          old_build = """//run_build('-O3 -g -DZ_SOLO', 'Diablo', ['Source']).catch(e => console.error(e.message));
          //run_build('-O3 -g -DZ_SOLO -DSPAWN', 'DiabloSpawn', ['Source']).catch(e => console.error(e.message));
          run_build('-O3 -g -DZ_SOLO', 'MpqCmp', ['Source/rmpq', 'Source/zlib', 'mpqcmp']).catch(e => console.error(e.message));
          """

          new_build = """(async () => {
            await run_build(
              '-O3 -g -DZ_SOLO',
              'Diablo',
              ['Source']
            );

            await run_build(
              '-O3 -g -DZ_SOLO -DSPAWN',
              'DiabloSpawn',
              ['Source']
            );
          })().catch(e => {
            console.error(e);
            process.exitCode = 1;
          });
          """

          text = replace_once(
              text,
              old_build,
              new_build,
              "engine build targets"
          )

          p.write_text(
              text,
              encoding="utf-8"
          )

          print("MOBILE_PACK_V3_PATCH_OK")
          PY

      - name: Verify engine source
        shell: bash
        run: |
          set -e

          grep -Fq \
            "TryMobileAutoAttack" \
            engine/Source/diablo.cpp

          grep -Fq \
            "distance > 3" \
            engine/Source/diablo.cpp

          grep -Fq \
            "2731, 1365, 683" \
            engine/Source/player.cpp

          grep -Fq \
            "6, 6, 6" \
            engine/Source/player.cpp

          grep -Fq \
            "IDI_ROGUE" \
            engine/Source/items.cpp

          grep -Fq \
            "hasBow" \
            engine/Source/pfile.cpp

          grep -Fq \
            "DApi_MobilePackVersion" \
            engine/Source/main.cpp

          echo "MOBILE_PACK_V3_SOURCE_OK"

      - name: Build engine
        working-directory: engine
        shell: bash
        run: |
          set -e
          emcc --version
          node build.js

      - name: Verify engine output
        shell: bash
        run: |
          set -e

          test -s engine/Diablo.jscc
          test -s engine/Diablo.wasm
          test -s engine/DiabloSpawn.jscc
          test -s engine/DiabloSpawn.wasm

          grep -Fq \
            "DApi_MobilePackVersion" \
            engine/Diablo.jscc

          grep -Fq \
            "DApi_MobilePackVersion" \
            engine/DiabloSpawn.jscc

          echo "MOBILE_PACK_V3_ENGINE_OK"

      - name: Patch frontend
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import json
          import re
          import shutil
          from pathlib import Path

          def replace_once(text, old, new, name):
              if old not in text:
                  raise SystemExit(
                      "PATCH FAILED: " + name
                  )
              return text.replace(
                  old,
                  new,
                  1
              )

          app = Path("app")
          engine = Path("engine")

          # package mismatch
          p = app / "package.json"
          data = json.loads(
              p.read_text(encoding="utf-8")
          )

          data.get(
              "devDependencies",
              {}
          ).pop(
              "canvas",
              None
          )

          p.write_text(
              json.dumps(
                  data,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          # disable service worker
          p = app / "src/index.js"
          text = p.read_text(
              encoding="utf-8"
          )

          text = replace_once(
              text,
              """serviceWorker.register({
            onUpdate() {
            },
          });""",
              "serviceWorker.unregister();",
              "service worker"
          )

          p.write_text(
              text,
              encoding="utf-8"
          )

          # copy rebuilt engine pair
          out = app / "public/wasm"
          out.mkdir(
              parents=True,
              exist_ok=True
          )

          for src, dst in {
              "Diablo.jscc":
                  "Diablo.js",
              "Diablo.wasm":
                  "Diablo.wasm",
              "DiabloSpawn.jscc":
                  "DiabloSpawn.js",
              "DiabloSpawn.wasm":
                  "DiabloSpawn.wasm",
          }.items():
              shutil.copy2(
                  engine / src,
                  out / dst
              )

          diablo_size = (
              engine /
              "Diablo.wasm"
          ).stat().st_size

          spawn_size = (
              engine /
              "DiabloSpawn.wasm"
          ).stat().st_size

          # game worker
          p = app / "src/api/game.worker.js"
          text = p.read_text(
              encoding="utf-8"
          )

          for line in [
              "import DiabloBinary from './Diablo.wasm';\n",
              "import DiabloModule from './Diablo.jscc';\n",
              "import SpawnBinary from './DiabloSpawn.wasm';\n",
              "import SpawnModule from './DiabloSpawn.jscc';\n",
          ]:
              text = text.replace(
                  line,
                  ""
              )

          text = re.sub(
              r"const DiabloSize = \d+;\s*"
              r"const SpawnSize = \d+;",
              (
                  f"const DiabloSize = {diablo_size};\n"
                  f"const SpawnSize = {spawn_size};"
              ),
              text,
              count=1
          )

          start = text.find(
              "async function initWasm("
          )

          end = text.find(
              "\nasync function init_game",
              start
          )

          if start < 0 or end < 0:
              raise SystemExit(
                  "PATCH FAILED: initWasm"
              )

          loader = r'''async function initWasm(spawn, progress) {
            const base =
              `${process.env.PUBLIC_URL}/wasm`;

            const scriptName =
              spawn
                ? "DiabloSpawn.js"
                : "Diablo.js";

            const wasmName =
              spawn
                ? "DiabloSpawn.wasm"
                : "Diablo.wasm";

            const factoryName =
              spawn
                ? "DiabloSpawn"
                : "Diablo";

            if (
              typeof worker[factoryName]
              !== "function"
            ) {
              importScripts(
                `${base}/${scriptName}?v=${CACHE_VERSION}`
              );
            }

            const factory =
              worker[factoryName];

            if (
              typeof factory !== "function"
            ) {
              throw new Error(
                `Missing ${factoryName} factory`
              );
            }

            const binary =
              await axios.request({
                url:
                  `${base}/${wasmName}?v=${CACHE_VERSION}`,
                responseType:
                  "arraybuffer",
                onDownloadProgress:
                  progress,
              });

            const module =
              factory({
                wasmBinary:
                  binary.data,
              });

            const readyModule =
              module && module.ready
                ? await module.ready
                : await module;

            if (
              !readyModule ||
              typeof readyModule._DApi_Init
                !== "function" ||
              typeof readyModule._DApi_Render
                !== "function"
            ) {
              throw new Error(
                "Diablo engine initialization failed"
              );
            }

            if (
              typeof readyModule
                ._DApi_MobilePackVersion
                !== "function"
            ) {
              throw new Error(
                "MOBILE PACK ENGINE MISSING"
              );
            }

            const version =
              readyModule
                ._DApi_MobilePackVersion();

            if (version !== 3) {
              throw new Error(
                "WRONG MOBILE PACK VERSION: " +
                version
              );
            }

            console.log(
              "[Worker] MOBILE_PACK_V3"
            );

            progress({
              loaded:
                binary.data.byteLength
            });

            return readyModule;
          }
          '''

          text = (
              text[:start] +
              loader +
              text[end:]
          )

          # disable neural detector
          detector = r'''  // Initialize Game Event Detector for AI quest system
            try {
              gameEventDetector.initialize(wasm);
              console.log('[Worker] Game Event Detector initialized');
            } catch (e) {
              console.warn('[Worker] Game Event Detector init failed:', e);
            }
          '''

          text = replace_once(
              text,
              detector,
              """  console.log('[Worker] NEURAL_EVENT_DETECTOR_DISABLED');
          """,
              "event detector"
          )

          old_loop = r'''  setInterval(() => {
              call_api("DApi_Render", Math.floor(performance.now()));

              // Process game events for AI/quest system
              try {
                gameEventDetector.processFrame();

                // Flush and send events to main thread
                if (gameEventDetector.hasPendingEvents()) {
                  const events = gameEventDetector.flushEvents();
                  worker.postMessage({
                    action: 'game_events',
                    events: events
                  });
                }
              } catch (e) {
                // Don't spam errors - event detection is non-critical
              }
            }, 50);
          '''

          new_loop = r'''  setInterval(() => {
              call_api(
                "DApi_Render",
                Math.floor(performance.now())
              );
            }, 50);
          '''

          text = replace_once(
              text,
              old_loop,
              new_loop,
              "render loop"
          )

          p.write_text(
              text,
              encoding="utf-8"
          )

          # disable neural startup
          p = app / "src/api/loader.js"
          text = p.read_text(
              encoding="utf-8"
          )

          neural = r'''          // Initialize NeuralGameController with the worker
                    // Note: WASM module is not directly accessible here, controller will
                    // work through worker messages
                    neuralGameController.initialize(null, worker).then(() => {
                      console.log('[Loader] NeuralGameController initialized');
                    }).catch(err => {
                      console.warn('[Loader] NeuralGameController init failed:', err);
                    });

          '''

          text = replace_once(
              text,
              neural,
              """          console.log('[Loader] NEURAL_STARTUP_DISABLED');

          """,
              "neural startup"
          )

          worker_marker = """      const worker = new Worker();

                let packetQueue = [];"""

          worker_new = """      const worker = new Worker();

                worker.addEventListener(
                  "error",
                  event => {
                    reject(
                      new Error(
                        event.message ||
                        "Game worker crashed"
                      )
                    );
                  }
                );

                let packetQueue = [];"""

          text = replace_once(
              text,
              worker_marker,
              worker_new,
              "worker handler"
          )

          p.write_text(
              text,
              encoding="utf-8"
          )

          print("FRONTEND_PATCH_OK")
          PY

      - name: Patch webpack output
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "app/config/webpack.config.js"
          )

          text = p.read_text(
              encoding="utf-8"
          )

          text = text.replace(
              "futureEmitAssets: true,",
              "futureEmitAssets: false,",
              1
          )

          p.write_text(
              text,
              encoding="utf-8"
          )

          p = Path("app/scripts/build.js")
          text = p.read_text(
              encoding="utf-8"
          )

          marker = (
              "const isInteractive = "
              "process.stdout.isTTY;"
          )

          helper = r'''
          const isInteractive = process.stdout.isTTY;

          function forceWriteAssets(stats) {
            const assets =
              stats.compilation.assets || {};

            const names =
              Object.keys(assets);

            if (!names.length) {
              throw new Error(
                "No webpack assets"
              );
            }

            for (const name of names) {
              let source =
                assets[name].source();

              if (
                source instanceof Uint8Array &&
                !Buffer.isBuffer(source)
              ) {
                source =
                  Buffer.from(source);
              }

              if (
                typeof source !== "string" &&
                !Buffer.isBuffer(source)
              ) {
                source =
                  Buffer.from(source);
              }

              const output =
                path.join(
                  paths.appBuild,
                  name
                );

              fs.ensureDirSync(
                path.dirname(output)
              );

              fs.writeFileSync(
                output,
                source
              );
            }
          }
          '''

          if marker not in text:
              raise SystemExit(
                  "PATCH FAILED: build marker"
              )

          text = text.replace(
              marker,
              helper,
              1
          )

          marker2 = (
              "      return resolve({\n"
              "        stats,"
          )

          replacement2 = (
              "      forceWriteAssets(stats);\n"
              "\n"
              "      return resolve({\n"
              "        stats,"
          )

          if marker2 not in text:
              raise SystemExit(
                  "PATCH FAILED: build resolve"
              )

          text = text.replace(
              marker2,
              replacement2,
              1
          )

          p.write_text(
              text,
              encoding="utf-8"
          )

          print("WEBPACK_PATCH_OK")
          PY

      - name: Verify runtime source
        shell: bash
        run: |
          set -e

          test -s app/public/wasm/Diablo.js
          test -s app/public/wasm/Diablo.wasm
          test -s app/public/wasm/DiabloSpawn.js
          test -s app/public/wasm/DiabloSpawn.wasm

          grep -Fq \
            "DApi_MobilePackVersion" \
            app/public/wasm/DiabloSpawn.js

          grep -Fq \
            "MOBILE_PACK_V3" \
            app/src/api/game.worker.js

          grep -Fq \
            "NEURAL_STARTUP_DISABLED" \
            app/src/api/loader.js

          echo "MOBILE_PACK_V3_RUNTIME_OK"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
        run: |
          set -e
          npm ci \
            --legacy-peer-deps \
            --no-audit \
            --no-fund \
            --ignore-scripts

      - name: Build frontend
        working-directory: app
        env:
          PUBLIC_URL: /Game
          NODE_ENV: production
          CI: false
          NODE_OPTIONS: --openssl-legacy-provider
          GENERATE_SOURCEMAP: false
          INLINE_RUNTIME_CHUNK: false
        run: |
          set -e
          npm run build

      - name: Create index
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          build = Path("app/build")
          public = Path("app/public")
          js = build / "static/js"
          css = build / "static/css"

          runtime = sorted(
              js.glob(
                  "runtime~main.*.js"
              )
          )

          chunks = sorted(
              p
              for p in js.glob(
                  "*.chunk.js"
              )
              if p.name[0].isdigit()
          )

          main = sorted(
              js.glob(
                  "main.*.js"
              )
          )

          styles = sorted(
              css.glob(
                  "main.*.css"
              )
          )

          if not runtime or not main:
              raise SystemExit(
                  "MAIN BUNDLE MISSING"
              )

          html = (
              public /
              "index.html"
          ).read_text(
              encoding="utf-8"
          )

          html = html.replace(
              "%PUBLIC_URL%",
              "/Game"
          )

          css_tags = "\n".join(
              (
                  '<link rel="stylesheet" '
                  f'href="/Game/static/css/{p.name}">'
              )
              for p in styles
          )

          js_tags = "\n".join(
              (
                  '<script '
                  f'src="/Game/static/js/{p.name}">'
                  '</script>'
              )
              for p in (
                  runtime +
                  chunks +
                  main
              )
          )

          html = html.replace(
              "</head>",
              css_tags + "\n</head>"
          )

          html = html.replace(
              "</body>",
              js_tags + "\n</body>"
          )

          (
              build /
              "index.html"
          ).write_text(
              html,
              encoding="utf-8"
          )

          print("INDEX_OK")
          PY

      - name: Prepare Pages
        shell: bash
        run: |
          set -e

          rm -f \
            app/build/service-worker.js

          find \
            app/build \
            -maxdepth 1 \
            -name 'precache-manifest*' \
            -delete

          touch app/build/.nojekyll

          test -s app/build/index.html
          test -s app/build/spawn.mpq
          test -s app/build/wasm/Diablo.js
          test -s app/build/wasm/Diablo.wasm
          test -s app/build/wasm/DiabloSpawn.js
          test -s app/build/wasm/DiabloSpawn.wasm

          grep -Fq \
            "DApi_MobilePackVersion" \
            app/build/wasm/DiabloSpawn.js

          GAME_WORKER="$(
            grep -l \
              "MOBILE_PACK_V3" \
              app/build/*.worker.js \
              | head -1
          )"

          if [ -z "$GAME_WORKER" ]; then
            echo "MOBILE PACK WORKER MISSING"
            exit 1
          fi

          find \
            app/build/static/js \
            -type f \
            -name 'main.*.js' \
            -size +0c \
            | grep -q .

          echo "GAME_WORKER=$GAME_WORKER"
          echo "MOBILE_PACK_V3_SITE_READY"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build

  deploy:
    needs: build
    runs-on: ubuntu-22.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
