name: Build Diablo Mobile Web

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Game repo
        uses: actions/checkout@v4

      - name: Checkout DevilutionX
        uses: actions/checkout@v4
        with:
          repository: diasurgical/DevilutionX
          ref: 4138a829e991a7d528c7d8240e0c7a73c5b22948
          path: DevilutionX

      - name: Apply auto-attack and mobile controls
        run: |
          echo "" | base64 -d > /tmp/apply_mods.py
          python3 /tmp/apply_mods.py

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Configure web build
        working-directory: DevilutionX
        run: |
          emcmake cmake -S . -B build-em -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Build web version
        working-directory: DevilutionX
        run: cmake --build build-em -j2

      - name: Prepare Pages site
        run: |
          rm -rf _site
          mkdir -p _site

          cp DevilutionX/build-em/index.html _site/index.html
          cp DevilutionX/build-em/devilutionx.js _site/
          cp DevilutionX/build-em/devilutionx.wasm _site/
          cp DevilutionX/build-em/devilutionx.data _site/
          cp DevilutionX/build-em/file-manager.js _site/

      - name: Download shareware SPAWN.MPQ
        run: |
          curl -L --fail --retry 3 \
            https://d07riv.github.io/diabloweb/spawn.mpq \
            -o _site/spawn.mpq

          ls -lh _site/spawn.mpq

      - name: Enable automatic SPAWN.MPQ loading
        run: |
          python3 -c "from pathlib import Path; p=Path('_site/index.html'); s=p.read_text(); old='preRun: [],'; new=\"preRun: [function() { FS.createPreloadedFile('/', 'spawn.mpq', 'spawn.mpq', true, true); }],\"; assert old in s; p.write_text(s.replace(old,new,1))"

      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: diablo-mobile-autoattack-web
          path: _site/
          if-no-files-found: error

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
