name: Deploy modern DiabloWebAI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout DiabloWebAI
        uses: actions/checkout@v4
        with:
          repository: levidehaan/diablowebai
          ref: 4becbb4c81323dc8982504ecb2a5f338434c9772
          path: app

      - name: Fix package lock mismatch
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("app/package.json")
          data = json.loads(
              p.read_text(encoding="utf-8")
          )

          removed = data.get(
              "devDependencies",
              {}
          ).pop(
              "canvas",
              None
          )

          p.write_text(
              json.dumps(
                  data,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print(
              "Removed canvas:",
              removed
          )
          PY

      - name: Patch webpack output
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          webpack = Path(
              "app/config/webpack.config.js"
          )

          text = webpack.read_text(
              encoding="utf-8"
          )

          text = text.replace(
              "futureEmitAssets: true,",
              "futureEmitAssets: false,",
              1
          )

          webpack.write_text(
              text,
              encoding="utf-8"
          )

          build = Path(
              "app/scripts/build.js"
          )

          text = build.read_text(
              encoding="utf-8"
          )

          marker = (
              "const isInteractive = "
              "process.stdout.isTTY;"
          )

          helper = r'''
          const isInteractive = process.stdout.isTTY;

          function forceWriteAssets(stats) {
            const assets =
              stats &&
              stats.compilation &&
              stats.compilation.assets
                ? stats.compilation.assets
                : {};

            const names =
              Object.keys(assets);

            console.log(
              "[FORCE-EMIT] asset count:",
              names.length
            );

            if (names.length === 0) {
              throw new Error(
                "Webpack compilation produced no assets"
              );
            }

            for (const name of names) {
              const asset =
                assets[name];

              let source =
                asset.source();

              if (
                source instanceof Uint8Array &&
                !Buffer.isBuffer(source)
              ) {
                source =
                  Buffer.from(source);
              }

              if (
                typeof source !== "string" &&
                !Buffer.isBuffer(source)
              ) {
                source =
                  Buffer.from(source);
              }

              const output =
                path.join(
                  paths.appBuild,
                  name
                );

              fs.ensureDirSync(
                path.dirname(output)
              );

              fs.writeFileSync(
                output,
                source
              );

              console.log(
                "[FORCE-EMIT]",
                name
              );
            }
          }
          '''

          if marker not in text:
              raise SystemExit(
                  "ERROR: build marker not found"
              )

          text = text.replace(
              marker,
              helper,
              1
          )

          resolve_marker = (
              "      return resolve({\n"
              "        stats,"
          )

          replacement = (
              "      forceWriteAssets(stats);\n"
              "\n"
              "      return resolve({\n"
              "        stats,"
          )

          if resolve_marker not in text:
              raise SystemExit(
                  "ERROR: resolve marker not found"
              )

          text = text.replace(
              resolve_marker,
              replacement,
              1
          )

          build.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "Webpack force-emission patch installed"
          )
          PY

          grep -n \
            "futureEmitAssets" \
            app/config/webpack.config.js

          grep -n \
            "forceWriteAssets" \
            app/scripts/build.js

      - name: Verify modern WASM loader
        shell: bash
        run: |
          set -e

          grep -n \
            "await module.ready" \
            app/src/api/game.worker.js

          grep -n \
            "return module" \
            app/src/api/game.worker.js

          echo "MODERN_LOADER_OK"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        shell: bash
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
        run: |
          set -e

          npm ci \
            --legacy-peer-deps \
            --no-audit \
            --no-fund \
            --ignore-scripts

      - name: Build real application
        working-directory: app
        shell: bash
        env:
          PUBLIC_URL: /Game
          NODE_ENV: production
          CI: false
          NODE_OPTIONS: --openssl-legacy-provider
          GENERATE_SOURCEMAP: false
          INLINE_RUNTIME_CHUNK: false
        run: |
          set -e

          npm run build

      - name: Verify emitted application
        shell: bash
        run: |
          set -e

          echo "=== BUILD ROOT ==="
          ls -lah app/build

          echo "=== STATIC ==="

          test -d \
            app/build/static

          find \
            app/build/static \
            -type f \
            -exec ls -lh {} \;

          echo "=== INDEX ==="

          test -s \
            app/build/index.html

          cat \
            app/build/index.html

          echo "=== MAIN JS ==="

          MAIN_JS="$(
            find \
              app/build/static/js \
              -type f \
              -name 'main.*.js' \
              | head -1
          )"

          if [ -z "$MAIN_JS" ]; then
            echo "ERROR: main JS missing"
            exit 1
          fi

          test -s "$MAIN_JS"
          ls -lh "$MAIN_JS"

          echo "=== GAME WORKER ==="

          WORKER="$(
            find \
              app/build \
              -type f \
              -name '*.worker.js' \
              | head -1
          )"

          if [ -z "$WORKER" ]; then
            echo "ERROR: worker missing"
            exit 1
          fi

          test -s "$WORKER"
          ls -lh "$WORKER"

          echo "=== INDEX SCRIPT ==="

          if ! grep -q \
            '/Game/static/js/' \
            app/build/index.html
          then
            echo \
              "ERROR: index does not load application JS"
            exit 1
          fi

          echo "=== SPAWN MPQ ==="

          test -s \
            app/build/spawn.mpq

          ls -lh \
            app/build/spawn.mpq

          echo "=== WASM FILES ==="

          find \
            app/build \
            -type f \
            -name '*.wasm' \
            -exec ls -lh {} \;

          test -s \
            app/build/wasm/devilutionx.wasm

          test -s \
            app/build/wasm/devilutionx.data

          echo "REAL_APPLICATION_OK"

      - name: Disable Jekyll
        shell: bash
        run: |
          touch \
            app/build/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: modern-diablowebai
          path: app/build/
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build

  deploy:
    needs: build
    runs-on: ubuntu-22.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
