
name: Sanctuary of Aden Mobile V15 Reviewed Motion Trials

on:
  push:
    branches: [main]
    paths: [.github/workflows/build-web.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sanctuary-mobile-v15
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified V14 mobile game
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/mobile reports
          if gh run download 39047847796 --repo "$GITHUB_REPOSITORY" --name Sanctuary-Mobile-V14-Orc-40-Motion-Review --dir dist/mobile; then
            echo 'Verified V14 artifact restored'
          else
            rm -rf dist/mobile
            mkdir -p dist/mobile
            git show bae2c1566bb1e80bcb4d012109e5360acf02f049:.github/workflows/build-web.yml > reports/verified-v14.yml
            python3 -m venv /tmp/sanctuary-v15
            /tmp/sanctuary-v15/bin/pip -q install 'PyYAML==6.0.2' 'Pillow==11.3.0'
            cat > reports/rebuild_v14.py <<'PY_RESTORE'
          import os,subprocess,yaml
          from pathlib import Path
          steps=yaml.safe_load(Path('reports/verified-v14.yml').read_text(encoding='utf-8'))['jobs']['build']['steps']
          env=dict(os.environ)
          env['PATH']='/tmp/sanctuary-v15/bin:'+env['PATH']
          for name in ('Restore successful V13 game','Add independent 40-slot original motion review','Verify all original sprites and review actions'):
           matched=[item for item in steps if item.get('name')==name and isinstance(item.get('run'),str)]
           if len(matched)!=1:raise SystemExit('Pinned V14 build step missing: '+name)
           subprocess.run(['bash','-e','-o','pipefail','-c',matched[0]['run']],check=True,env=env)
           print('V14 rebuilt:',name,flush=True)
          PY_RESTORE
            /tmp/sanctuary-v15/bin/python reports/rebuild_v14.py
          fi

      - name: Install approved-slot-only animation trial
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          cat > reports/patch_v15.py <<'PY_PATCH'
          from pathlib import Path
          import hashlib, json, sys
          root = Path(sys.argv[1] if len(sys.argv)>1 else 'dist/mobile')
          hf,jf,rf,cf,inf=(root/n for n in ('index.html','game.js','motion-review.js','game.css','build-info.json'))
          html=hf.read_text(encoding='utf-8')
          js=jf.read_text(encoding='utf-8')
          review=rf.read_text(encoding='utf-8')
          css=cf.read_text(encoding='utf-8')
          info=json.loads(inf.read_text(encoding='utf-8'))
          assert info['package']==14 and info['runtime']==14, 'V14 required'
          assert info['sha256']['game.js']=='6f73183bd0ee929a0705bf1a67b68e5d4a57913ec6d3b2b456beb49f3fb83e4f'
          assert info['sha256']['motion-review.js']=='55c000096597907aef5806865b402137e06dfced1f327b30223f28a8ee844486'
          for immutable in ['game-data.js','manifest.json','monster-pack.json','monster-pack.js']:
           assert hashlib.sha256((root/immutable).read_bytes()).hexdigest()==info['sha256'][immutable], immutable

          def sub(s,old,new,label):
           n=s.count(old)
           if n!=1:raise SystemExit(f'{label}: expected 1 occurrence, got {n}')
           return s.replace(old,new,1)

          js=sub(js,'function paths(actor,mode,dir){', '''function candidateFor(actor,mode,dir){
           const policy=window.SANCTUARY_MOTION_TRIAL;
           return policy?.active?policy.active(actor,mode,dir):motionPackEnabled;
          }
          function paths(actor,mode,dir){''','central candidate policy')
          js=sub(js,'const packRow=motionPackEnabled?packActors[actor]?.actions?.[mode]?.directions?.[dir]:null;', 'const packRow=candidateFor(actor,mode,dir)?packActors[actor]?.actions?.[mode]?.directions?.[dir]:null;', 'candidate source')
          js=sub(js,'const row=motionPackEnabled?group?.directions?.[dir]:null;', 'const row=candidateFor(actor,mode,dir)?group?.directions?.[dir]:null;', 'description source')
          js=sub(js,'const group=motionPackEnabled?packActors[actor]?.actions?.[mode]:null;', 'const group=candidateFor(actor,mode,dir)?packActors[actor]?.actions?.[mode]:null;', 'visual speed')
          js=sub(js,'const signature=[m.visual,m.mode,m.dir,motionPackEnabled].join(\'|\');', "const signature=[m.visual,m.mode,m.dir,candidateFor(m.visual,m.mode,m.dir),window.SANCTUARY_MOTION_TRIAL?.mode()||'legacy'].join('|');",'trace policy identity')
          js=sub(js,'candidateEnabled:motionPackEnabled,hp:Math.ceil(m.hp)', "candidateEnabled:candidateFor(m.visual,m.mode,m.dir),trialMode:window.SANCTUARY_MOTION_TRIAL?.mode()||'legacy',hp:Math.ceil(m.hp)",'trace policy values')
          js=sub(js,"if(!toggle.hidden)toggle.textContent=motionPackEnabled?'추출 후보 OFF · 기존과 비교':'추출 후보 ON · 실제 전투 비교';", "if(!toggle.hidden){const trial=window.SANCTUARY_MOTION_TRIAL?.mode()||(motionPackEnabled?'all':'legacy');toggle.textContent=trial==='all'?'모든 후보 OFF · 기존 동작':trial==='approved'?'정상 표시만 ON · 전체 후보로':'전체 후보 ON · 비교';}", 'field policy label')
          js=sub(js,"candidateEnabled:motionPackEnabled,events:observedMotions.slice()", "candidateEnabled:motionPackEnabled,trialMode:window.SANCTUARY_MOTION_TRIAL?.mode()||(motionPackEnabled?'all':'legacy'),events:observedMotions.slice()",'session export')
          js=sub(js,"el('packToggle').textContent=motionPackEnabled?'추출 후보 적용 중 · 끄기':'추출 후보 적용하기';", "const trialMode=window.SANCTUARY_MOTION_TRIAL?.mode()||(motionPackEnabled?'all':'legacy');el('packToggle').textContent=trialMode==='all'?'전체 후보 적용 중 · 끄기':trialMode==='approved'?'정상 표시만 적용 중 · 전체 후보로':'추출 후보 적용하기';",'lab button policy label')
          js=sub(js,"(motionPackEnabled?'후보 적용 ON':'기존 동작 유지')+' · 수동 배정 우선'", "(trialMode==='approved'?'정상 표시만 시험':trialMode==='all'?'전체 후보 시험':'기존 동작 유지')+' · 수동 배정 우선'", 'lab info policy label')
          old='''function toggleMotionCandidate(){
           motionPackEnabled=!motionPackEnabled;
           try{localStorage.setItem(MOTION_PACK_KEY,String(motionPackEnabled))}catch(e){}
           refreshPackLab();targetHUD();msg(motionPackEnabled?'V18 후보 모션 ON (원본 의미 미확정)':'기존 V11 모션으로 복귀',1.5);
          }'''
          new='''function toggleMotionCandidate(){
           const current=window.SANCTUARY_MOTION_TRIAL?.mode()||(motionPackEnabled?'all':'legacy');
           const next=current==='all'?'legacy':'all';
           motionPackEnabled=next==='all';
           try{localStorage.setItem(MOTION_PACK_KEY,String(motionPackEnabled))}catch(e){}
           window.SANCTUARY_MOTION_TRIAL?.setMode(next);
           refreshPackLab();targetHUD();msg(next==='all'?'V18 전체 후보 시험 (원본 의미 미확정)':'기존 동작으로 복귀',1.5);
          }'''
          js=sub(js,old,new,'legacy toggle compatibility')

          html=sub(html,'Sanctuary of Aden Mobile V14 · 40 Motion Review','Sanctuary of Aden Mobile V15 · Reviewed Slot Trials','title')
          html=sub(html,'Sanctuary Mobile V14</strong>','Sanctuary Mobile V15</strong>','HUD')
          html=sub(html,'<div id="reviewProgress">검토 0/40</div>', '''<div id="reviewProgress">검토 0/40</div>
          <div id="reviewTrialPanel">
           <div id="reviewTrialInfo">전투 모션 후보 시험: 기존 동작 (기본값)</div>
           <div id="reviewTrialButtons"><button id="reviewTrialLegacy" type="button">기존 동작</button><button id="reviewTrialApproved" type="button">정상 표시 슬롯만</button><button id="reviewTrialAll" type="button">모든 후보</button></div>
           <button id="reviewTrialExport" type="button">시험 설정 JSON 저장</button>
           <small>정상 표시는 사용자가 눈으로 검수한 결과이며, 원작 동작·방향 검증을 의미하지 않습니다. 수동 SPR 배정이 항상 우선합니다.</small>
          </div>''','review trial controls')
          html=sub(html,'V14 · SPR 56 원본 40동작 검수','V15 · SPR 56 원본 40동작 시험 검수','panel heading')
          css+='''
          #reviewTrialPanel{display:grid;gap:6px;background:#102522;border:1px solid #8a9e87;border-radius:8px;padding:8px}
          #reviewTrialInfo{font-size:11px;line-height:1.5;color:#f1dca1}
          #reviewTrialButtons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
          #reviewTrialButtons button{min-width:0;padding:8px 2px;font-size:10px;background:#314c42}
          #reviewTrialButtons button[data-active="true"]{background:#537059;outline:2px solid #ecdc99;color:#fff5cf}
          #reviewTrialExport{font-size:11px;padding:8px 5px}
          #reviewTrialPanel small{font-size:10px;color:#c3d0c2;line-height:1.5}
          '''

          review=sub(review,"const STORE='sanctuary-v14-orc-review-v1';", "const STORE='sanctuary-v14-orc-review-v1';\nconst TRIAL_STORE='sanctuary-v15-reviewed-trial-mode';", 'policy store')
          review=sub(review,"function persist(){try{localStorage.setItem(STORE,JSON.stringify(snapshot()))}catch(e){}refreshMarks()}", "function persist(){try{localStorage.setItem(STORE,JSON.stringify(snapshot()))}catch(e){}refreshMarks();refreshTrial()}", 'review decision sync')
          trialjs='''let trialMode='legacy';
          try{
           const setting=localStorage.getItem(TRIAL_STORE);
           if(['legacy','approved','all'].includes(setting))trialMode=setting;
           else if(localStorage.getItem('sanctuary-v12-monster-pack-on')==='true')trialMode='all';
          }catch(e){}
          function trialActive(actorName,actionName,direction){
           if(trialMode==='legacy')return false;
           if(trialMode==='all')return true;
           return actorName==='mob56'&&Number.isInteger(direction)&&direction>=0&&direction<8&&decisions[actionName+':'+direction]==='ok';
          }
          function refreshTrial(){
           const ok=Object.values(decisions).filter(x=>x==='ok').length;
           const labels={legacy:'기존 동작',approved:'정상 표시 슬롯만',all:'모든 추출 후보'};
           el('reviewTrialInfo').textContent='전투 모션 후보 시험: '+labels[trialMode]+' · 정상 표시 '+ok+'/40 · 원본 의미 미확정';
           for(const [kind,id] of [['legacy','reviewTrialLegacy'],['approved','reviewTrialApproved'],['all','reviewTrialAll']]){
            el(id).dataset.active=String(trialMode===kind);
            el(id).setAttribute('aria-pressed',String(trialMode===kind));
           }
          }
          function setTrialMode(next){
           if(!['legacy','approved','all'].includes(next))return false;
           trialMode=next;
           try{localStorage.setItem(TRIAL_STORE,next);localStorage.setItem('sanctuary-v12-monster-pack-on',String(next==='all'))}catch(e){}
           refreshTrial();return true;
          }
          window.SANCTUARY_MOTION_TRIAL={mode:()=>trialMode,active:trialActive,setMode:setTrialMode,status:(mode,dir)=>decisions[mode+':'+dir]||'none',approvedCount:()=>Object.values(decisions).filter(v=>v==='ok').length};
          for(const [kind,id] of [['legacy','reviewTrialLegacy'],['approved','reviewTrialApproved'],['all','reviewTrialAll']])el(id).onclick=()=>setTrialMode(kind);
          el('reviewTrialExport').onclick=()=>{
           const result={schema:'sanctuary.motion-trial.v1',version:15,sourceRun:source.sourceRun,spriteId:56,mode:trialMode,review:snapshot(),approvedSlots:Object.keys(decisions).filter(x=>decisions[x]==='ok'),warning:'Human reviewed only; original action identity and timing are not verified; no gameplay mechanics changed'};
           const url=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));
           const anchor=document.createElement('a');anchor.href=url;anchor.download='sanctuary-v15-reviewed-motion-trial.json';document.body.appendChild(anchor);anchor.click();anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
          };
          refreshTrial();
          '''
          review=sub(review,"document.addEventListener('visibilitychange',wake);",trialjs+"document.addEventListener('visibilitychange',wake);",'trial event wiring')

          hf.write_text(html,encoding='utf-8'); jf.write_text(js,encoding='utf-8'); rf.write_text(review,encoding='utf-8'); cf.write_text(css,encoding='utf-8')
          info.update(package=15,runtime=15,source_run=39047847796)
          info['sha256']={n:hashlib.sha256((root/n).read_bytes()).hexdigest() for n in ['index.html','game.css','game.js','game-data.js','manifest.json','monster-pack.json','monster-pack.js','motion-review.js']}
          inf.write_text(json.dumps(info,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          readme=root/'README_KO.txt'
          readme.write_text(readme.read_text(encoding='utf-8')+'\nV15: 40개 모션의 사용자 정상 표시만 골라 필드 시각 동작에 시험 적용, 전체 후보/기존 복귀, 선택 상태 저장 및 JSON 내보내기. 공격 판정/속도/HP/맵 데이터는 V14 동일하며 원작 모션 검증을 의미하지 않습니다.\n',encoding='utf-8')
          print('V15 patched',len(js),'engine characters',len(review),'review characters',info['sha256']['game.js'])
          PY_PATCH
          python3 -m py_compile reports/patch_v15.py
          python3 reports/patch_v15.py dist/mobile
          node --check dist/mobile/game.js
          node --check dist/mobile/motion-review.js

      - name: Verify original assets and mobile combat
        shell: bash
        run: |
          set -euo pipefail
          cat > reports/verify_v15.py <<'PY_VERIFY'
          from pathlib import Path
          import hashlib,json
          root=Path('dist/mobile')
          info=json.loads((root/'build-info.json').read_text(encoding='utf-8'))
          world=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          pack=json.loads((root/'monster-pack.json').read_text(encoding='utf-8'))
          assert info['package']==15 and info['runtime']==15 and info['source_run']==39047847796
          assert len(world['actors'])==8 and world['map']['size']==[192,192]
          assert len(world['map']['flags'])==36864 and len(world['map']['objects'])==59963
          assert len(list((root/'assets').glob('*.png')))>=3616
          assert len(list((root/'tiles').glob('*.png')))==218
          assert len(list((root/'motion-gifs/v18').glob('*.gif')))==40
          assert pack['sourceRun']==39033202150
          assert pack['actors']['mob56']['provenance']['actionDefinitionsVerified'] is False
          for name in ('game-data.js','manifest.json','monster-pack.json','monster-pack.js'):
           assert info['sha256'][name]=={'game-data.js':'1a50224f083c193c33eab137798bfb6ddccf1b1dea54f3d9055e601c0fbabf57','manifest.json':'3f1cdb0f22376e763888628465b6601f5e9c72eeda8a9194a356dcba2c205c95','monster-pack.json':'4b1601df4afcca77e0416d222c4a81c2bafb370eddbe75d75256981cc43010c1','monster-pack.js':'070ef55992c9823e1e7e82df696d673ca13c0b4d2e92e1c7da271a26a3c729a4'}[name]
          for name,sha in info['sha256'].items():
           assert hashlib.sha256((root/name).read_bytes()).hexdigest()==sha,name
          html=(root/'index.html').read_text(encoding='utf-8')
          js=(root/'game.js').read_text(encoding='utf-8')
          assert all(f'id="{x}"' in html for x in ['reviewTrialLegacy','reviewTrialApproved','reviewTrialAll','reviewTrialExport','reviewGrid','lab','targetNext'])
          assert 'function candidateFor(' in js and 'function tryAttack(' in js
          assert html.index('src="game.js"')<html.index('src="motion-review.js"')
          print('V15 VALIDATED: 3616 SPR, 218 TIL, 59963 map objects, 40 GIF; base gameplay retained')
          PY_VERIFY
          python3 reports/verify_v15.py
          node --check dist/mobile/game-data.js
          node --check dist/mobile/monster-pack.js
          cat > reports/smoke.cjs <<'JS_SMOKE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const root=process.argv[2]||'dist/mobile';
          const read=n=>fs.readFileSync(root+'/'+n,'utf8');
          const pack=JSON.parse(read('monster-pack.json')),manifest=JSON.parse(read('manifest.json'));
          const gameSource=read('game.js'),reviewSource=read('motion-review.js');
          const startup="begin();refreshAssetStatus();window.SANCTUARY_GAME_READY=true;el('bootNotice').hidden=true;requestAnimationFrame(render);";
          assert(gameSource.includes(startup));
          const game=gameSource.replace(startup,"begin();window.QA={paths,describeMotion,visualFPS,candidateFor,mapped,hero:()=>hero,mobs:()=>mobs,clock:()=>clock};refreshAssetStatus();window.SANCTUARY_GAME_READY=true;el('bootNotice').hidden=true;requestAnimationFrame(render);");
          function makeSession(store){
           const nodes=new Map(),events={},frames=[];let now=1000,createdBlob=null,downloadName='';
           const context2d=()=>new Proxy({createImageData(w,h){return{data:new Uint8ClampedArray(w*h*4)}},getImageData(){return{data:new Uint8ClampedArray(192*192*4)}},measureText(s){return{width:String(s).length*8}}},{get(o,k){return k in o?o[k]:()=>{}},set(o,k,v){o[k]=v;return true}});
           class Element{
            constructor(id){this.id=id;this.style={setProperty(){}};this.dataset={};this.listeners={};this.children=[];this.hidden=['lab','settingsPanel','reviewBody','targetPanel','fieldPackToggle','packPreview'].includes(id);this.textContent='';this.value={labActor:'hero',labMode:'idle',labDir:'0',labSpeed:'110',labFrame:'-1',frameRate:'30',controlSize:'normal'}[id]||'0';this.classList={toggle(){},add(){},remove(){}};this.width=192;this.height=192;this.clientWidth=390;this.clientHeight=844;this.files=[];}
            getContext(){return context2d()} addEventListener(k,f){(this.listeners[k]??=[]).push(f)}setAttribute(k,v){this[k]=v}setPointerCapture(){}remove(){}removeAttribute(k){delete this[k]}
            appendChild(c){this.children.push(c);return c} replaceChildren(...items){this.children=items}
            getBoundingClientRect(){return{left:0,top:0,width:390,height:844}}
            click(){if(this.download)downloadName=this.download;this.onclick?.();for(const f of this.listeners.click||[])f({preventDefault(){}})}
           }
           const document={getElementById(id){if(!nodes.has(id))nodes.set(id,new Element(id));return nodes.get(id)},createElement:id=>new Element(id),documentElement:new Element('html'),addEventListener(k,f){events[k]=f},body:new Element('body'),hidden:false};
           class Image{constructor(){this.complete=true;this.naturalWidth=25;this.naturalHeight=30}set src(v){this._src=v;this.onload?.()}get src(){return this._src}}
           const window={SANCTUARY_MANIFEST:manifest,SANCTUARY_MONSTER_PACK:pack,devicePixelRatio:2,addEventListener(k,f){events[k]=f},visualViewport:{addEventListener(){}}};
           const env={document,window,Image,Math,JSON,Int32Array,Uint8ClampedArray,console,confirm:()=>true,Blob,setTimeout(){},alert(msg){throw Error(msg)},devicePixelRatio:2,performance:{now:()=>now},requestAnimationFrame(fn){frames.push(fn);return frames.length},localStorage:{getItem:k=>store.get(k)||null,setItem:(k,v)=>store.set(k,String(v))},URL:{createObjectURL(blob){createdBlob=blob;return 'blob:mock'},revokeObjectURL(){}}};
           vm.runInNewContext(game,env,{timeout:15000});vm.runInNewContext(reviewSource,env,{timeout:5000});
           const el=id=>document.getElementById(id);
           const frame=()=>{now+=35;const fn=frames.shift();assert(fn,'Animation loop terminated');fn(now)};
           return{el,window,store,frame,getExport:()=>({blob:createdBlob,name:downloadName}),events};
          }
          (async()=>{
          const storage=new Map();const s=makeSession(storage),el=s.el,p=s.window.SANCTUARY_MOTION_TRIAL,q=s.window.QA;
          assert.equal(s.window.SANCTUARY_GAME_READY,true);
          assert.equal(s.window.SANCTUARY_REVIEW_READY,true);
          assert.equal(p.mode(),'legacy');assert.equal(p.approvedCount(),0);
          assert.equal(el('reviewGrid').children.length,5);
          assert(el('reviewGrid').children.every(row=>row.children[1].children.length===8));
          for(let i=0;i<10;i++)s.frame();
          let mob=q.mobs().find(x=>x.visual==='mob56');assert(mob);
          const hp=mob.hp,cd=mob.attackCd;
          assert.equal(q.describeMotion('mob56','idle',0).source,'기존 기본 추정');
          el('reviewToggle').click();el('reviewOk').click();
          assert.equal(p.approvedCount(),1);assert.equal(p.status('idle',0),'ok');
          el('reviewNext').click();el('reviewQuestion').click();assert.equal(p.status('idle',1),'question');
          el('reviewTrialApproved').click();assert.equal(p.mode(),'approved');
          assert.equal(q.candidateFor('mob56','idle',0),true);
          assert.equal(q.candidateFor('mob56','idle',1),false);
          assert.equal(q.candidateFor('mob56','walk',0),false);
          assert.equal(q.candidateFor('mob1022','idle',0),false);
          assert.equal(q.describeMotion('mob56','idle',0).source,'V18 추출 후보');
          assert.equal(q.describeMotion('mob56','idle',1).source,'기존 기본 추정');
          assert.equal(q.visualFPS('mob56','idle',0),1000/220);
          assert.equal(q.visualFPS('mob56','idle',1),9);
          q.mapped.mob56.idle={'0':'32'};
          assert.equal(q.describeMotion('mob56','idle',0).source,'수동 배정');
          assert.equal(q.visualFPS('mob56','idle',0),9);
          assert.equal(q.paths('mob56','idle',0).join(','),manifest.actors.mob56.actions['32'].join(','));
          delete q.mapped.mob56.idle;
          assert.equal(mob.hp,hp);assert.equal(mob.attackCd,cd);
          el('reviewTrialAll').click();assert.equal(p.mode(),'all');assert.equal(q.candidateFor('mob56','idle',1),true);
          el('reviewTrialLegacy').click();assert.equal(p.mode(),'legacy');assert.equal(q.candidateFor('mob56','idle',0),false);
          el('reviewTrialApproved').click();assert.equal(p.mode(),'approved');
          el('reviewTrialExport').click();const file=s.getExport();assert.equal(file.name,'sanctuary-v15-reviewed-motion-trial.json');
          assert(file.blob);const exported=JSON.parse(await file.blob.text());assert.equal(exported.schema,'sanctuary.motion-trial.v1');assert.equal(exported.approvedSlots.length,1);assert.equal(exported.approvedSlots[0],'idle:0');
          assert.equal(exported.mode,'approved');assert.equal(exported.review.sourceRun,39033202150);
