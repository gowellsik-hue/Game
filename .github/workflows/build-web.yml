      - name: Verify unchanged assets and motion bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY'
          from pathlib import Path
          import hashlib,json
          base=Path('dist/mobile')
          d=json.loads((base/'manifest.json').read_text(encoding='utf-8'))
          i=json.loads((base/'build-info.json').read_text(encoding='utf-8'))
          p=json.loads((base/'monster-pack.json').read_text(encoding='utf-8'))
          assert i['package']==12 and i['runtime']==12 and i['source_run']==39036538203
          assert len(d['actors'])==8 and d['map']['size']==[192,192]
          assert len(d['map']['objects'])==59963 and len(d['map']['flags'])==36864
          assert len(list((base/'tiles').glob('*.png')))==218
          assert len(list((base/'assets').glob('*.png')))>=3616
          assert len(list((base/'motion-gifs/v18').glob('*.gif')))==40
          assert i['sha256']['manifest.json']=='3f1cdb0f22376e763888628465b6601f5e9c72eeda8a9194a356dcba2c205c95'
          assert i['sha256']['game-data.js']=='1a50224f083c193c33eab137798bfb6ddccf1b1dea54f3d9055e601c0fbabf57'
          assert p['actors']['mob56']['sprite_id']==56
          a=p['actors']['mob56']['actions']
          assert all(len(a[k]['directions'])==8 for k in ('idle','walk','attack','hit','death'))
          assert p['actors']['mob56']['provenance']['actionDefinitionsVerified'] is False
          for name,digest in i['sha256'].items():
              assert hashlib.sha256((base/name).read_bytes()).hexdigest()==digest,name
          for mode,part in a.items():
              for row in part['directions']:
                  assert all((base/f).is_file() for f in row['frames'])
                  assert hashlib.sha256((base/row['gif']).read_bytes()).hexdigest()==row['gifSHA256']
          html=(base/'index.html').read_text(encoding='utf-8')
          assert html.index('src="game-data.js"')<html.index('src="monster-pack.js"')<html.index('src="game.js"')
          print('V12 VERIFIED: 3616 original SPR PNG, 218 TIL, 59963 objects, 40 V18 GIF and 8-direction metadata')
