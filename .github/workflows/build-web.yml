name: Deploy proven DiabloWebAI base

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout proven DiabloWebAI base
        uses: actions/checkout@v4
        with:
          repository: levidehaan/diablowebai
          ref: 4becbb4c81323dc8982504ecb2a5f338434c9772
          path: app

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: app
        run: npm install --legacy-peer-deps

      - name: Build proven base
        working-directory: app
        env:
          PUBLIC_URL: .
          NODE_ENV: production
          CI: false
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm run build

      - name: Verify playable build
        shell: bash
        run: |
          set -e

          test -s app/build/index.html
          test -s app/build/spawn.mpq

          echo "=== index ==="
          ls -lh app/build/index.html

          echo "=== spawn.mpq ==="
          ls -lh app/build/spawn.mpq

          echo "=== wasm ==="
          find app/build \
            -type f \
            -name '*.wasm' \
            -exec ls -lh {} \;

          echo "=== workers ==="
          find app/build \
            -maxdepth 1 \
            -type f \
            -name '*.worker.js' \
            -exec ls -lh {} \;

          echo "PROVEN_BASE_BUILD_OK"

      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: diabloweb-proven-base
          path: app/build/
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
