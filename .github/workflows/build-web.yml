
name: Sanctuary of Aden Mobile V9 Modular Build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sanctuary-mobile-v9
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified V8.1 game
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/mobile
          if ! gh run download 38977628656 --repo "$GITHUB_REPOSITORY" --name Sanctuary-Mobile-V8-1-Responsive-Gameplay --dir dist/mobile; then
            rm -rf dist/mobile
            mkdir -p dist/mobile
            git show 36fdf528db010b5f07caff1f527ac1f8c099fa77:.github/workflows/build-web.yml > /tmp/v81.yml
            python3 -m venv /tmp/sanctuary-venv
            /tmp/sanctuary-venv/bin/pip -q install 'PyYAML==6.0.2' 'Pillow==11.3.0'
            cat > /tmp/restore.py <<'PY_RESTORE'
          import os, subprocess, yaml
          from pathlib import Path
          workflow=yaml.safe_load(Path('/tmp/v81.yml').read_text())
          steps=workflow['jobs']['build']['steps']
          names=['Restore verified V7.2 game package','Build V8 mobile screen and navigation patch','Validate sprites, tiles, mobile input and path traversal']
          env=dict(os.environ)
          env['PATH']='/tmp/sanctuary-venv/bin:'+env['PATH']
          for name in names:
              found=[s for s in steps if s.get('name')==name]
              if len(found)!=1:raise SystemExit('Missing pinned V8.1 step: '+name)
              subprocess.run(['bash','-e','-o','pipefail','-c',found[0]['run']],env=env,check=True)
              print('Rebuilt:',name,flush=True)
          PY_RESTORE
            /tmp/sanctuary-venv/bin/python /tmp/restore.py
          fi

      - name: Split HTML into reusable game files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_SPLIT'
          from pathlib import Path
          import hashlib, json, re
          root=Path('dist/mobile'); page=root/'index.html'
          html=page.read_text(encoding='utf-8')
          data=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert data['version']==8 and len(data['actors'])==8 and data['map']['size']==[192,192]
          def unique(pattern,label):
              hits=list(re.finditer(pattern,html))
              if len(hits)!=1:raise SystemExit(label+' is not unique')
              return hits[0]
          css=unique(r'<style>([\s\S]*?)</style>','CSS')
          manifest=unique(r'<script id="manifest" type="application/json">([\s\S]*?)</script>','map data')
          script=unique(r'<script>([\s\S]*?)</script>','game JS')
          if json.loads(manifest.group(1))!=data:raise SystemExit('Game data mismatch')
          old="const D=JSON.parse(document.getElementById('manifest').textContent);"
          if script.group(1).count(old)!=1:raise SystemExit('Engine data entrypoint changed')
          game=script.group(1).replace(old,"const D=window.SANCTUARY_MANIFEST;if(!D)throw Error('Missing game data');",1)
          (root/'game.css').write_text(css.group(1).lstrip('\n'),encoding='utf-8')
          (root/'game.js').write_text(game.lstrip('\n'),encoding='utf-8')
          (root/'game-data.js').write_text('window.SANCTUARY_MANIFEST='+json.dumps(data,ensure_ascii=False,separators=(',',':'))+';\n',encoding='utf-8')
          html=html.replace(css.group(0),'<link rel="stylesheet" href="game.css">',1)
          html=html.replace(manifest.group(0),'<script src="game-data.js"></script>',1)
          html=html.replace(script.group(0),'<script src="game.js"></script>',1)
          html=html.replace('Sanctuary of Aden Mobile V8 · Mobile Gameplay','Sanctuary of Aden Mobile V9 · Modular Runtime',1)
          html=html.replace('Sanctuary Mobile V8</strong>','Sanctuary Mobile V9</strong>',1)
          if '<style>' in html or '<script>' in html or html.index('game-data.js')>html.index('game.js'):
              raise SystemExit('Modular script loading order invalid')
          page.write_text(html,encoding='utf-8')
          info={'package':9,'engine':8,'source_run':38977628656,'sha256':{n:hashlib.sha256((root/n).read_bytes()).hexdigest() for n in ['game.css','game.js','game-data.js','manifest.json']}}
          (root/'build-info.json').write_text(json.dumps(info,indent=2)+'\n',encoding='utf-8')
          (root/'README_KO.txt').write_text((root/'README_KO.txt').read_text(encoding='utf-8')+'\nV9: 게임 기능을 변경하지 않고 HTML/CSS/JS/맵 데이터만 분리했습니다. 폴더 전체를 함께 실행하세요.\n',encoding='utf-8')
          print('V9 modularized: index=',page.stat().st_size,'game JS=',(root/'game.js').stat().st_size)
          PY_SPLIT

      - name: Verify original assets and test mobile runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CHECK'
          from pathlib import Path
          import json
          p=Path('dist/mobile'); d=json.loads((p/'manifest.json').read_text())
          assert len(d['map']['flags'])==36864 and len(d['map']['objects'])==59963
          assert len(list((p/'assets').glob('*.png')))==3616
          assert len(list((p/'tiles').glob('*.png')))==218
          html=(p/'index.html').read_text(encoding='utf-8')
          assert html.index('src="game-data.js"')<html.index('src="game.js"')
          assert len(html)<15000 and 'href="game.css"' in html
          content=(p/'game-data.js').read_text(encoding='utf-8')
          assert json.loads(content.removeprefix('window.SANCTUARY_MANIFEST=').removesuffix(';\n'))==d
          print('Original V8.1 assets and external data verified')
          PY_CHECK
          node --check dist/mobile/game.js
          node --check dist/mobile/game-data.js
          mkdir -p reports
          cat > reports/smoke.cjs <<'JS_TEST'
          const fs=require('fs'),vm=require('vm'),a=require('assert');
          const root='dist/mobile/';const code=fs.readFileSync(root+'game.js','utf8');
          const data=JSON.parse(fs.readFileSync(root+'manifest.json','utf8'));
          let frames=[],now=0,dom=new Map(),listeners={};
          const canvas=()=>new Proxy({createImageData(w,h){return{data:new Uint8ClampedArray(w*h*4)}},getImageData(){return{data:new Uint8ClampedArray(192*192*4)}},measureText(s){return{width:String(s).length*10}}},{get(o,k){return k in o?o[k]:()=>{}},set(o,k,v){o[k]=v;return true}});
          class E{constructor(id){this.id=id;this.style={setProperty(){}};this.listeners={};this.hidden=['lab','settingsPanel','targetPanel'].includes(id);this.textContent='';this.value={frameRate:'30',controlSize:'normal',labActor:'hero',labMode:'idle',labDir:'0',labSpeed:'110',labFrame:'-1'}[id]||'0';this.classList={add(){},remove(){},toggle(){}};this.clientWidth=390;this.clientHeight=844;this.width=192;this.height=192;this.children=[];this.files=[]}getContext(){return canvas()}addEventListener(k,f){(this.listeners[k]??=[]).push(f)}click(){this.onclick?.();this.fire('click')}fire(k,x={}){for(const f of this.listeners[k]||[])f({pointerId:1,clientX:150,clientY:400,preventDefault(){},...x})}appendChild(e){this.children.push(e)}replaceChildren(...x){this.children=x}setPointerCapture(){}getBoundingClientRect(){return{left:0,top:0,width:390,height:844}}remove(){}}
          const doc={getElementById(id){if(id==='manifest')throw Error('Old inline manifest dependency');if(!dom.has(id))dom.set(id,new E(id));return dom.get(id)},createElement:id=>new E(id),documentElement:new E('html'),addEventListener(k,f){listeners[k]=f},body:new E('body'),hidden:false};
          class Image{constructor(){this.complete=true;this.naturalWidth=24;this.naturalHeight=24}set src(v){this._src=v}get src(){return this._src}}
          const store=new Map();const win={SANCTUARY_MANIFEST:data,devicePixelRatio:2,addEventListener(k,f){listeners[k]=f},visualViewport:{addEventListener(){}}};
          const env={document:doc,window:win,devicePixelRatio:2,Image,Math,JSON,Int32Array,Uint8ClampedArray,Blob,console,confirm:()=>true,setTimeout(){},URL:{createObjectURL:()=>'',revokeObjectURL(){}},requestAnimationFrame(f){frames.push(f)},performance:{now:()=>now},localStorage:{getItem:k=>store.get(k)||null,setItem:(k,v)=>store.set(k,String(v))}};
          vm.runInNewContext(code,env,{timeout:15000});
          function frame(){now+=33.34;let fn=frames.shift();a(fn,'Animation stopped');fn(now)}
          const el=id=>doc.getElementById(id);for(let i=0;i<5;i++)frame();
          el('settingsToggle').click();a(!el('settingsPanel').hidden);el('zoomIn').click();a.equal(el('zoomValue').textContent,'110%');el('settingsClose').click();a(el('settingsPanel').hidden);
          el('targetNext').click();a(!el('targetPanel').hidden);el('targetClear').click();a(el('targetPanel').hidden);
          el('labOpen').click();a(!el('lab').hidden);el('labClose').click();a(el('lab').hidden);
          for(let i=0;i<5;i++)frame();console.log('V9 startup, mobile buttons, motion lab: PASS');
          JS_TEST
          node --check reports/smoke.cjs
          node reports/smoke.cjs

      - name: Upload modular mobile game
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Mobile-V9-Modular-Runtime
          path: dist/mobile/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Mobile-V9-Diagnostics
          path: reports/
          if-no-files-found: warn
          retention-days: 14
