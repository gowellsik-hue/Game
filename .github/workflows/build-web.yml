name: Build DiabloWeb AutoAttack Engine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout DiabloWeb
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout original DiabloWeb engine
        uses: actions/checkout@v4
        with:
          repository: d07RiV/devilution
          ref: 798b5122731ae4b5e0c91348e5c44cf79354a94e
          path: engine

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 1.39.20
          actions-cache-folder: emsdk-cache

      - name: Patch engine for mobile auto attack
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          # ------------------------------------------------------------
          # Patch Source/diablo.cpp
          # ------------------------------------------------------------

          path = Path("engine/Source/diablo.cpp")
          src = path.read_text(encoding="utf-8")

          anchor = """void game_loop(BOOL bStartup)
          {
          """

          if anchor not in src:
              raise SystemExit("ERROR: game_loop anchor not found")

          auto_attack = r'''
          static int FindMobileAutoAttackTarget()
          {
          	int best = -1;
          	int bestDistance = 9999;

          	const int px = plr[myplr].WorldX;
          	const int py = plr[myplr].WorldY;

          	for (int n = 0; n < nummonsters; n++) {
          		const int mi = monstactive[n];

          		if (mi < 0 || mi >= MAXMONSTERS)
          			continue;

          		MonsterStruct &m = monster[mi];

          		if (m._mDelFlag)
          			continue;

          		if (m._mhitpoints <= 0)
          			continue;

          		if (CanTalkToMonst(mi))
          			continue;

          		const int dx = abs(m._mx - px);
          		const int dy = abs(m._my - py);
          		const int distance = dx > dy ? dx : dy;

          		if (distance > 8)
          			continue;

          		if (distance >= bestDistance)
          			continue;

          		best = mi;
          		bestDistance = distance;
          	}

          	return best;
          }

          static void TryMobileAutoAttack()
          {
          	if (leveltype == DTYPE_TOWN)
          		return;

          	if (PauseMode == 2)
          		return;

          	if (deathflag)
          		return;

          	if (gmenu_exception())
          		return;

          	if (stextflag || spselflag || qtextflag)
          		return;

          	if (questlog || doomflag || dropGoldFlag)
          		return;

          	if (track_isscrolling())
          		return;

          	PlayerStruct &player = plr[myplr];

          	/*
          	 * Only issue a new command when the player is standing.
          	 * This prevents auto attack from interrupting walking,
          	 * attack animations, hit recovery and spell actions.
          	 */
          	if (player._pmode != PM_STAND)
          		return;

          	const int target = FindMobileAutoAttackTarget();

          	if (target < 0)
          		return;

          	if (player._pwtype == WT_RANGED)
          		NetSendCmdParam1(TRUE, CMD_RATTACKID, target);
          	else
          		NetSendCmdParam1(TRUE, CMD_ATTACKID, target);
          }

          '''

          src = src.replace(anchor, auto_attack + anchor, 1)

          old_logic = """\tif (!gmenu_exception() && sgnTimeoutCurs == 0) {
          		CheckCursMove();
          		track_process();
          	}
          	if (gbProcessPlayers) {
          """

          new_logic = """\tif (!gmenu_exception() && sgnTimeoutCurs == 0) {
          		CheckCursMove();
          		track_process();
          		TryMobileAutoAttack();
          	}
          	if (gbProcessPlayers) {
          """

          if old_logic not in src:
              raise SystemExit("ERROR: game_logic anchor not found")

          src = src.replace(old_logic, new_logic, 1)

          path.write_text(src, encoding="utf-8")

          print("diablo.cpp patched")


          # ------------------------------------------------------------
          # Patch build.js
          # ------------------------------------------------------------

          path = Path("engine/build.js")
          src = path.read_text(encoding="utf-8")

          # Removed from later Emscripten versions and unnecessary here.
          src = src.replace(
              " -s BINARYEN_TRAP_MODE='clamp'",
              ""
          )

          old_tail = """//run_build('-O3 -g -DZ_SOLO', 'Diablo', ['Source']).catch(e => console.error(e.message));
          //run_build('-O3 -g -DZ_SOLO -DSPAWN', 'DiabloSpawn', ['Source']).catch(e => console.error(e.message));
          run_build('-O3 -g -DZ_SOLO', 'MpqCmp', ['Source/rmpq', 'Source/zlib', 'mpqcmp']).catch(e => console.error(e.message));
          """

          new_tail = """(async () => {
            await run_build('-O3 -g -DZ_SOLO', 'Diablo', ['Source']);
            await run_build('-O3 -g -DZ_SOLO -DSPAWN', 'DiabloSpawn', ['Source']);
          })().catch(e => {
            console.error(e);
            process.exitCode = 1;
          });
          """

          if old_tail not in src:
              raise SystemExit("ERROR: build.js build target anchor not found")

          src = src.replace(old_tail, new_tail, 1)

          path.write_text(src, encoding="utf-8")

          print("build.js patched")
          print("PATCH_OK")
          PY

      - name: Show patched auto attack code
        run: |
          grep -n "FindMobileAutoAttackTarget" engine/Source/diablo.cpp
          grep -n "TryMobileAutoAttack" engine/Source/diablo.cpp
          grep -n "DiabloSpawn" engine/build.js | tail -10

      - name: Build Diablo and DiabloSpawn
        working-directory: engine
        shell: bash
        run: |
          set -e
          emcc --version
          node --version
          node build.js

      - name: Verify build outputs
        shell: bash
        run: |
          set -e

          test -s engine/Diablo.wasm
          test -s engine/DiabloSpawn.wasm
          test -s engine/Diablo.jscc
          test -s engine/DiabloSpawn.jscc

          ls -lh \
            engine/Diablo.wasm \
            engine/DiabloSpawn.wasm \
            engine/Diablo.jscc \
            engine/DiabloSpawn.jscc

      - name: Replace DiabloWeb engine
        shell: bash
        run: |
          set -e

          if [ ! -d src/api ]; then
            echo "ERROR: src/api does not exist"
            echo "This workflow must run inside the DiabloWeb repository."
            exit 1
          fi

          cp engine/Diablo.wasm src/api/Diablo.wasm
          cp engine/DiabloSpawn.wasm src/api/DiabloSpawn.wasm

          cp engine/Diablo.jscc src/api/Diablo.jscc
          cp engine/DiabloSpawn.jscc src/api/DiabloSpawn.jscc

      - name: Commit rebuilt engine
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/api/Diablo.wasm \
            src/api/DiabloSpawn.wasm \
            src/api/Diablo.jscc \
            src/api/DiabloSpawn.jscc

          if git diff --cached --quiet; then
            echo "No engine changes to commit."
          else
            git commit -m "Build mobile auto-attack engine"
            git push
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiabloWeb-autoattack
          path: |
            engine/Diablo.wasm
            engine/DiabloSpawn.wasm
            engine/Diablo.jscc
            engine/DiabloSpawn.jscc
          if-no-files-found: error
