name: Build DiabloWeb Auto Attack

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Game repo
        uses: actions/checkout@v4

      - name: Checkout original DiabloWeb source
        uses: actions/checkout@v4
        with:
          repository: d07RiV/diabloweb
          ref: master
          path: diabloweb

      - name: Checkout DiabloWeb engine source
        uses: actions/checkout@v4
        with:
          repository: d07RiV/devilution
          ref: master
          path: devilution

      - name: Add automatic normal attack
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("devilution/Source/diablo.cpp")
          s = p.read_text(encoding="utf-8")

          # Forward declaration so run_game_loop can call it.
          decl_anchor = """BOOL StartGame(BOOL bNewGame, BOOL bSinglePlayer)
          {
            return TRUE;
          }

          """

          declaration = """BOOL StartGame(BOOL bNewGame, BOOL bSinglePlayer)
          {
            return TRUE;
          }

          void TryAutoAttack();

          """

          if decl_anchor not in s:
              raise SystemExit("ERROR: StartGame anchor not found")

          s = s.replace(decl_anchor, declaration, 1)

          loop_anchor = """void run_game_loop(unsigned int uMsg)
          {
          }
          """

          loop_patch = """void run_game_loop(unsigned int uMsg)
          {
              TryAutoAttack();
          }
          """

          if loop_anchor not in s:
              raise SystemExit("ERROR: run_game_loop anchor not found")

          s = s.replace(loop_anchor, loop_patch, 1)

          function_anchor = """BOOL LeftMouseCmd(BOOL bShift)
          {
          """

          auto_attack = r"""
          static int AutoAttackTarget = -1;

          void TryAutoAttack()
          {
              if (leveltype == DTYPE_TOWN
                  || PauseMode == 2
                  || deathflag
                  || stextflag
                  || qtextflag
                  || doomflag
                  || invflag
                  || chrflag
                  || sbookflag
                  || pcurs >= CURSOR_FIRSTITEM) {
                  AutoAttackTarget = -1;
                  return;
              }

              if (pcursmonst == -1) {
                  AutoAttackTarget = -1;
                  return;
              }

              if (plr[myplr]._pmode != PM_STAND) {
                  return;
              }

              if (AutoAttackTarget == pcursmonst) {
                  return;
              }

              if (plr[myplr]._pwtype == WT_RANGED) {
                  if (CanTalkToMonst(pcursmonst)) {
                      NetSendCmdParam1(TRUE, CMD_ATTACKID, pcursmonst);
                  } else {
                      NetSendCmdParam1(TRUE, CMD_RATTACKID, pcursmonst);
                  }
              } else {
                  NetSendCmdParam1(TRUE, CMD_ATTACKID, pcursmonst);
              }

              AutoAttackTarget = pcursmonst;
          }

          """

          if function_anchor not in s:
              raise SystemExit("ERROR: LeftMouseCmd anchor not found")

          s = s.replace(function_anchor, auto_attack + function_anchor, 1)

          p.write_text(s, encoding="utf-8")

          print("AUTO_ATTACK_PATCH_OK")
          PY

          grep -n "TryAutoAttack" devilution/Source/diablo.cpp

      - name: Enable DiabloSpawn WASM build
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("devilution/build.js")
          s = p.read_text(encoding="utf-8")

          old = "//run_build('-O3 -g -DZ_SOLO -DSPAWN', 'DiabloSpawn', ['Source']).catch(e => console.error(e.message));"
          new = "run_build('-O3 -g -DZ_SOLO -DSPAWN', 'DiabloSpawn', ['Source']).catch(e => { console.error(e); process.exitCode = 1; });"

          if old not in s:
              raise SystemExit("ERROR: DiabloSpawn build line not found")

          s = s.replace(old, new, 1)

          old_mpq = "run_build('-O3 -g -DZ_SOLO', 'MpqCmp', ['Source/rmpq', 'Source/zlib', 'mpqcmp']).catch(e => console.error(e.message));"
          s = s.replace(old_mpq, "// " + old_mpq, 1)

          p.write_text(s, encoding="utf-8")
          PY

          tail -n 8 devilution/build.js

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 1.39.20

      - name: Build modified DiabloSpawn WASM
        working-directory: devilution
        run: |
          node build.js

          test -s DiabloSpawn.wasm
          test -s DiabloSpawn.jscc

          ls -lh DiabloSpawn.wasm DiabloSpawn.jscc

      - name: Replace DiabloWeb SPAWN engine
        run
