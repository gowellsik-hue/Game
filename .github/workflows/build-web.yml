
name: Sanctuary of Aden Mobile V16 Multi-Monster Motion Review

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml
      - mobile-monsters/packs/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sanctuary-mobile-v16
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified V15 mobile game
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/mobile reports
          if gh run download 39050704098 --repo "$GITHUB_REPOSITORY" --name Sanctuary-Mobile-V15-Reviewed-Motion-Trials --dir dist/mobile; then
            echo 'Verified V15 artifact restored'
          else
            rm -rf dist/mobile
            mkdir -p dist/mobile
            git show 7d2078cc8c1cb74caa85fb0cef6ff47155f22e54:.github/workflows/build-web.yml > reports/pinned-v15.yml
            python3 -m venv /tmp/sanctuary-v16-build
            /tmp/sanctuary-v16-build/bin/pip -q install 'PyYAML==6.0.2' 'Pillow==11.3.0'
            cat > reports/rebuild_v15.py <<'PY_RESTORE'
          import os,subprocess,yaml
          from pathlib import Path
          items=yaml.safe_load(Path('reports/pinned-v15.yml').read_text(encoding='utf-8'))['jobs']['build']['steps']
          env=dict(os.environ)
          env['PATH']='/tmp/sanctuary-v16-build/bin:'+env['PATH']
          for name in ('Restore verified V14 mobile game','Install approved-slot-only animation trial','Verify original assets and mobile combat'):
              found=[item for item in items if item.get('name')==name and isinstance(item.get('run'),str)]
              if len(found)!=1:raise SystemExit('Pinned V15 step missing: '+name)
              subprocess.run(['bash','-e','-o','pipefail','-c',found[0]['run']],env=env,check=True)
              print('V15 rebuilt:',name,flush=True)
          PY_RESTORE
            /tmp/sanctuary-v16-build/bin/python reports/rebuild_v15.py
          fi

