name: Deploy DiabloWebAI proven engine

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout modern frontend
        uses: actions/checkout@v4
        with:
          repository: levidehaan/diablowebai
          ref: 4becbb4c81323dc8982504ecb2a5f338434c9772
          path: app

      - name: Checkout proven production engine
        uses: actions/checkout@v4
        with:
          repository: d07RiV/diabloweb
          ref: 998629fd5d9f87ba9693cf1409cf2acea603c06e
          path: proven

      - name: Patch frontend and install proven engine
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import json
          import re
          import shutil
          from pathlib import Path

          app = Path("app")
          proven = Path("proven")

          # ---------------------------------
          # package-lock mismatch
          # ---------------------------------

          package = app / "package.json"

          data = json.loads(
              package.read_text(
                  encoding="utf-8"
              )
          )

          data.get(
              "devDependencies",
              {}
          ).pop(
              "canvas",
              None
          )

          package.write_text(
              json.dumps(
                  data,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          # ---------------------------------
          # disable service worker
          # ---------------------------------

          index = app / "src/index.js"

          text = index.read_text(
              encoding="utf-8"
          )

          old = """serviceWorker.register({
            onUpdate() {
            },
          });"""

          if old not in text:
              raise SystemExit(
                  "service worker block not found"
              )

          text = text.replace(
              old,
              "serviceWorker.unregister();",
              1
          )

          index.write_text(
              text,
              encoding="utf-8"
          )

          # ---------------------------------
          # install exact production engine
          # ---------------------------------

          wasm_dir = app / "public/wasm"

          wasm_dir.mkdir(
              parents=True,
              exist_ok=True
          )

          copies = {
              "Diablo.jscc":
                  "Diablo.js",
              "Diablo.wasm":
                  "Diablo.wasm",
              "DiabloSpawn.jscc":
                  "DiabloSpawn.js",
              "DiabloSpawn.wasm":
                  "DiabloSpawn.wasm",
          }

          for src, dst in copies.items():
              shutil.copy2(
                  proven / "src/api" / src,
                  wasm_dir / dst
              )

          # ---------------------------------
          # worker: stop bundling broken
          # rebuilt WASM/JSCC
          # ---------------------------------

          worker = (
              app /
              "src/api/game.worker.js"
          )

          text = worker.read_text(
              encoding="utf-8"
          )

          imports = [
              "import DiabloBinary from './Diablo.wasm';\n",
              "import DiabloModule from './Diablo.jscc';\n",
              "import SpawnBinary from './DiabloSpawn.wasm';\n",
              "import SpawnModule from './DiabloSpawn.jscc';\n",
          ]

          for line in imports:
              text = text.replace(
                  line,
                  ""
              )

          text = re.sub(
              r"const DiabloSize = \d+;\s*"
              r"const SpawnSize = \d+;",
              (
                  "const DiabloSize = 1519717;\n"
                  "const SpawnSize = 1381584;"
              ),
              text,
              count=1
          )

          start = text.find(
              "async function initWasm("
          )

          end = text.find(
              "\nasync function init_game",
              start
          )

          if start < 0 or end < 0:
              raise SystemExit(
                  "initWasm block not found"
              )

          new_loader = r'''async function initWasm(spawn, progress) {
            const base =
              `${process.env.PUBLIC_URL}/wasm`;

            const scriptName =
              spawn
                ? "DiabloSpawn.js"
                : "Diablo.js";

            const wasmName =
              spawn
                ? "DiabloSpawn.wasm"
                : "Diablo.wasm";

            const factoryName =
              spawn
                ? "DiabloSpawn"
                : "Diablo";

            if (
              typeof worker[factoryName]
              !== "function"
            ) {
              importScripts(
                `${base}/${scriptName}?v=${CACHE_VERSION}`
              );
            }

            const factory =
              worker[factoryName];

            if (
              typeof factory
              !== "function"
            ) {
              throw new Error(
                `Missing ${factoryName} module factory`
              );
            }

            const binary =
              await axios.request({
                url:
                  `${base}/${wasmName}?v=${CACHE_VERSION}`,
                responseType:
                  "arraybuffer",
                onDownloadProgress:
                  progress,
              });

            let module =
              factory({
                wasmBinary:
                  binary.data,
              });

            if (
              module &&
              module.ready
            ) {
              module =
                await module.ready;
            } else {
              module =
                await module;
            }

            if (
              !module ||
              typeof module._DApi_Init
                !== "function" ||
              typeof module._DApi_Render
                !== "function" ||
              typeof module._DApi_Mouse
                !== "function"
            ) {
              throw new Error(
                "Proven Diablo engine API initialization failed"
              );
            }

            progress({
              loaded:
                binary.data.byteLength
            });

            return module;
          }
          '''

          text = (
              text[:start]
              + new_loader
              + text[end:]
          )

          worker.write_text(
              text,
              encoding="utf-8"
          )

          # ---------------------------------
          # catch worker crashes
          # ---------------------------------

          loader = (
              app /
              "src/api/loader.js"
          )

          text = loader.read_text(
              encoding="utf-8"
          )

          marker = """      const worker = new Worker();

                let packetQueue = [];"""

          replacement = """      const worker = new Worker();

                worker.addEventListener(
                  "error",
                  event => {
                    const message =
                      event && event.message
                        ? event.message
                        : "Game worker crashed";

                    console.error(
                      "[Loader] worker:",
                      message
                    );

                    reject(
                      new Error(message)
                    );
                  }
                );

                worker.addEventListener(
                  "messageerror",
                  () => {
                    reject(
                      new Error(
                        "Game worker message error"
                      )
                    );
                  }
                );

                let packetQueue = [];"""

          if marker in text:
              text = text.replace(
                  marker,
                  replacement,
                  1
              )

          loader.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "PROVEN_ENGINE_PATCH_OK"
          )
          PY

      - name: Patch webpack output
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          webpack = Path(
              "app/config/webpack.config.js"
          )

          text = webpack.read_text(
              encoding="utf-8"
          )

          text = text.replace(
              "futureEmitAssets: true,",
              "futureEmitAssets: false,",
              1
          )

          webpack.write_text(
              text,
              encoding="utf-8"
          )

          build = Path(
              "app/scripts/build.js"
          )

          text = build.read_text(
              encoding="utf-8"
          )

          marker = (
              "const isInteractive = "
              "process.stdout.isTTY;"
          )

          helper = r'''
          const isInteractive = process.stdout.isTTY;

          function forceWriteAssets(stats) {
            const assets =
              stats.compilation.assets || {};

            const names =
              Object.keys(assets);

            if (!names.length) {
              throw new Error(
                "No webpack assets"
              );
            }

            console.log(
              "[FORCE-EMIT]",
              names.length
            );

            for (const name of names) {
              let source =
                assets[name].source();

              if (
                source instanceof Uint8Array &&
                !Buffer.isBuffer(source)
              ) {
                source =
                  Buffer.from(source);
              }

              if (
                typeof source !== "string" &&
                !Buffer.isBuffer(source)
              ) {
                source =
                  Buffer.from(source);
              }

              const output =
                path.join(
                  paths.appBuild,
                  name
                );

              fs.ensureDirSync(
                path.dirname(output)
              );

              fs.writeFileSync(
                output,
                source
              );
            }
          }
          '''

          if marker not in text:
              raise SystemExit(
                  "build marker missing"
              )

          text = text.replace(
              marker,
              helper,
              1
          )

          marker2 = (
              "      return resolve({\n"
              "        stats,"
          )

          replacement = (
              "      forceWriteAssets(stats);\n"
              "\n"
              "      return resolve({\n"
              "        stats,"
          )

          if marker2 not in text:
              raise SystemExit(
                  "resolve marker missing"
              )

          text = text.replace(
              marker2,
              replacement,
              1
          )

          build.write_text(
              text,
              encoding="utf-8"
          )
          PY

      - name: Verify proven engine
        shell: bash
        run: |
          set -e

          test -s \
            app/public/wasm/Diablo.js

          test -s \
            app/public/wasm/DiabloSpawn.js

          test -s \
            app/public/wasm/Diablo.wasm

          test -s \
            app/public/wasm/DiabloSpawn.wasm

          test "$(
            stat -c%s \
              app/public/wasm/Diablo.wasm
          )" -eq 1519717

          test "$(
            stat -c%s \
              app/public/wasm/DiabloSpawn.wasm
          )" -eq 1381584

          node --check \
            app/public/wasm/Diablo.js

          node --check \
            app/public/wasm/DiabloSpawn.js

          grep -q \
            "DiabloSpawn.js" \
            app/src/api/game.worker.js

          grep -q \
            "module.ready" \
            app/src/api/game.worker.js

          echo \
            "PROVEN_ENGINE_OK"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        shell: bash
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
        run: |
          set -e

          npm ci \
            --legacy-peer-deps \
            --no-audit \
            --no-fund \
            --ignore-scripts

      - name: Build
        working-directory: app
        shell: bash
        env:
          PUBLIC_URL: /Game
          NODE_ENV: production
          CI: false
          NODE_OPTIONS: --openssl-legacy-provider
          GENERATE_SOURCEMAP: false
          INLINE_RUNTIME_CHUNK: false
        run: |
          set -e

          npm run build

      - name: Create index HTML
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          build = Path("app/build")
          public = Path("app/public")

          jsdir = (
              build /
              "static" /
              "js"
          )

          cssdir = (
              build /
              "static" /
              "css"
          )

          runtime = sorted(
              jsdir.glob(
                  "runtime~main.*.js"
              )
          )

          chunks = sorted(
              p for p
              in jsdir.glob(
                  "*.chunk.js"
              )
              if p.name[0].isdigit()
          )

          main = sorted(
              jsdir.glob(
                  "main.*.js"
              )
          )

          css = sorted(
              cssdir.glob(
                  "main.*.css"
              )
          )

          if not runtime or not main:
              raise SystemExit(
                  "main JS missing"
              )

          html = (
              public /
              "index.html"
          ).read_text(
              encoding="utf-8"
          )

          html = html.replace(
              "%PUBLIC_URL%",
              "/Game"
          )

          css_tags = "\n".join(
              f'<link rel="stylesheet" '
              f'href="/Game/static/css/{p.name}">'
              for p in css
          )

          scripts = (
              runtime +
              chunks +
              main
          )

          js_tags = "\n".join(
              f'<script '
              f'src="/Game/static/js/{p.name}">'
              f'</script>'
              for p in scripts
          )

          html = html.replace(
              "</head>",
              css_tags +
              "\n</head>"
          )

          html = html.replace(
              "</body>",
              js_tags +
              "\n</body>"
          )

          (
              build /
              "index.html"
          ).write_text(
              html,
              encoding="utf-8"
          )

          print(
              "INDEX_OK"
          )
          PY

      - name: Clean cache and verify build
        shell: bash
        run: |
          set -e

          rm -f \
            app/build/service-worker.js

          find \
            app/build \
            -maxdepth 1 \
            -name 'precache-manifest*' \
            -delete

          touch \
            app/build/.nojekyll

          test -s \
            app/build/index.html

          test -s \
            app/build/spawn.mpq

          test -s \
            app/build/wasm/Diablo.wasm

          test -s \
            app/build/wasm/DiabloSpawn.wasm

          test "$(
            stat -c%s \
              app/build/wasm/Diablo.wasm
          )" -eq 1519717

          test "$(
            stat -c%s \
              app/build/wasm/DiabloSpawn.wasm
          )" -eq 1381584

          find \
            app/build/static/js \
            -name 'main.*.js' \
            -size +0c \
            | grep -q .

          GAME_WORKER="$(
            grep -l \
              "DiabloSpawn.js" \
              app/build/*.worker.js \
              | head -1
          )"

          if [ -z "$GAME_WORKER" ]; then
            echo \
              "ERROR: game worker missing"
            exit 1
          fi

          if grep -Fq \
            "Module parse failed" \
            "$GAME_WORKER"
          then
            echo \
              "ERROR: broken worker"
            exit 1
          fi

          echo \
            "GAME_WORKER=$GAME_WORKER"

          echo \
            "PROVEN_RUNTIME_BUILD_OK"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: diablowebai-proven-engine
          path: app/build/
          if-no-files-found: error

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build

  deploy:
    needs: build
    runs-on: ubuntu-22.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
