name: Deploy DiabloWeb playable baseline

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: levidehaan/diablowebai
          ref: 4becbb4c81323dc8982504ecb2a5f338434c9772
          path: app

      - name: Checkout proven engine
        uses: actions/checkout@v4
        with:
          repository: d07RiV/diabloweb
          ref: 998629fd5d9f87ba9693cf1409cf2acea603c06e
          path: proven

      - name: Patch application
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import json
          import re
          import shutil
          from pathlib import Path

          app = Path("app")
          proven = Path("proven")

          def replace_once(text, old, new, name):
              if old not in text:
                  raise SystemExit("PATCH FAILED: " + name)
              return text.replace(old, new, 1)

          # package.json
          p = app / "package.json"
          data = json.loads(p.read_text(encoding="utf-8"))
          data.get("devDependencies", {}).pop("canvas", None)
          p.write_text(
              json.dumps(data, indent=2) + "\n",
              encoding="utf-8"
          )

          # Disable service worker
          p = app / "src/index.js"
          text = p.read_text(encoding="utf-8")

          old = """serviceWorker.register({
            onUpdate() {
            },
          });"""

          text = replace_once(
              text,
              old,
              "serviceWorker.unregister();",
              "service worker"
          )

          p.write_text(text, encoding="utf-8")

          # Proven engine
          out = app / "public/wasm"
          out.mkdir(parents=True, exist_ok=True)

          files = {
              "Diablo.jscc": "Diablo.js",
              "Diablo.wasm": "Diablo.wasm",
              "DiabloSpawn.jscc": "DiabloSpawn.js",
              "DiabloSpawn.wasm": "DiabloSpawn.wasm",
          }

          for src, dst in files.items():
              shutil.copy2(
                  proven / "src/api" / src,
                  out / dst
              )

          # Game worker
          p = app / "src/api/game.worker.js"
          text = p.read_text(encoding="utf-8")

          for line in [
              "import DiabloBinary from './Diablo.wasm';\n",
              "import DiabloModule from './Diablo.jscc';\n",
              "import SpawnBinary from './DiabloSpawn.wasm';\n",
              "import SpawnModule from './DiabloSpawn.jscc';\n",
          ]:
              text = text.replace(line, "")

          text = re.sub(
              r"const DiabloSize = \d+;\s*const SpawnSize = \d+;",
              "const DiabloSize = 1519717;\nconst SpawnSize = 1381584;",
              text,
              count=1
          )

          start = text.find("async function initWasm(")
          end = text.find("\nasync function init_game", start)

          if start < 0 or end < 0:
              raise SystemExit("PATCH FAILED: initWasm")

          new_loader = r'''async function initWasm(spawn, progress) {
            const base = `${process.env.PUBLIC_URL}/wasm`;
            const scriptName = spawn ? "DiabloSpawn.js" : "Diablo.js";
            const wasmName = spawn ? "DiabloSpawn.wasm" : "Diablo.wasm";
            const factoryName = spawn ? "DiabloSpawn" : "Diablo";

            if (typeof worker[factoryName] !== "function") {
              importScripts(`${base}/${scriptName}?v=${CACHE_VERSION}`);
            }

            const factory = worker[factoryName];

            if (typeof factory !== "function") {
              throw new Error(`Missing ${factoryName} factory`);
            }

            const binary = await axios.request({
              url: `${base}/${wasmName}?v=${CACHE_VERSION}`,
              responseType: "arraybuffer",
              onDownloadProgress: progress,
            });

            const module = factory({
              wasmBinary: binary.data,
            });

            const readyModule =
              module && module.ready
                ? await module.ready
                : await module;

            if (
              !readyModule ||
              typeof readyModule._DApi_Init !== "function" ||
              typeof readyModule._DApi_Render !== "function"
            ) {
              throw new Error("Diablo engine initialization failed");
            }

            progress({ loaded: binary.data.byteLength });
            return readyModule;
          }
          '''

          text = text[:start] + new_loader + text[end:]

          detector = r'''  // Initialize Game Event Detector for AI quest system
            try {
              gameEventDetector.initialize(wasm);
              console.log('[Worker] Game Event Detector initialized');
            } catch (e) {
              console.warn('[Worker] Game Event Detector init failed:', e);
            }
          '''

          text = replace_once(
              text,
              detector,
              """  console.log('[Worker] NEURAL_EVENT_DETECTOR_DISABLED');
          """,
              "event detector"
          )

          old_loop = r'''  setInterval(() => {
              call_api("DApi_Render", Math.floor(performance.now()));

              // Process game events for AI/quest system
              try {
                gameEventDetector.processFrame();

                // Flush and send events to main thread
                if (gameEventDetector.hasPendingEvents()) {
                  const events = gameEventDetector.flushEvents();
                  worker.postMessage({
                    action: 'game_events',
                    events: events
                  });
                }
              } catch (e) {
                // Don't spam errors - event detection is non-critical
              }
            }, 50);
          '''

          new_loop = r'''  setInterval(() => {
              call_api(
                "DApi_Render",
                Math.floor(performance.now())
              );
            }, 50);
          '''

          text = replace_once(
              text,
              old_loop,
              new_loop,
              "render loop"
          )

          p.write_text(text, encoding="utf-8")

          # Loader: disable automatic neural scan
          p = app / "src/api/loader.js"
          text = p.read_text(encoding="utf-8")

          neural = r'''          // Initialize NeuralGameController with the worker
                    // Note: WASM module is not directly accessible here, controller will
                    // work through worker messages
                    neuralGameController.initialize(null, worker).then(() => {
                      console.log('[Loader] NeuralGameController initialized');
                    }).catch(err => {
                      console.warn('[Loader] NeuralGameController init failed:', err);
                    });

          '''

          text = replace_once(
              text,
              neural,
              """          console.log('[Loader] NEURAL_STARTUP_DISABLED');

          """,
              "neural startup"
          )

          worker_create = "      const worker = new Worker();"

          worker_create_new = """      const worker = new Worker();

                worker.onerror = event => {
                  reject(
                    new Error(
                      event.message || "Game worker crashed"
                    )
                  );
                };"""

          text = replace_once(
              text,
              worker_create,
              worker_create_new,
              "worker error handler"
          )

          p.write_text(text, encoding="utf-8")

          print("APP_PATCH_OK")
          PY

      - name: Patch webpack
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/config/webpack.config.js")
          text = p.read_text(encoding="utf-8")

          text = text.replace(
              "futureEmitAssets: true,",
              "futureEmitAssets: false,",
              1
          )

          p.write_text(text, encoding="utf-8")

          p = Path("app/scripts/build.js")
          text = p.read_text(encoding="utf-8")

          marker = "const isInteractive = process.stdout.isTTY;"

          helper = r'''
          const isInteractive = process.stdout.isTTY;

          function forceWriteAssets(stats) {
            const assets = stats.compilation.assets || {};

            for (const name of Object.keys(assets)) {
              let source = assets[name].source();

              if (
                source instanceof Uint8Array &&
                !Buffer.isBuffer(source)
              ) {
                source = Buffer.from(source);
              }

              if (
                typeof source !== "string" &&
                !Buffer.isBuffer(source)
              ) {
                source = Buffer.from(source);
              }

              const output = path.join(
                paths.appBuild,
                name
              );

              fs.ensureDirSync(path.dirname(output));
              fs.writeFileSync(output, source);
            }
          }
          '''

          if marker not in text:
              raise SystemExit("PATCH FAILED: build marker")

          text = text.replace(marker, helper, 1)

          marker = """      return resolve({
                stats,"""

          replacement = """      forceWriteAssets(stats);

                return resolve({
                stats,"""

          if marker not in text:
              raise SystemExit("PATCH FAILED: build resolve")

          text = text.replace(
              marker,
              replacement,
              1
          )

          p.write_text(text, encoding="utf-8")

          print("WEBPACK_PATCH_OK")
          PY

      - name: Verify source
        shell: bash
        run: |
          set -e

          test -s app/public/wasm/Diablo.js
          test -s app/public/wasm/Diablo.wasm
          test -s app/public/wasm/DiabloSpawn.js
          test -s app/public/wasm/DiabloSpawn.wasm

          grep -Fq \
            "NEURAL_STARTUP_DISABLED" \
            app/src/api/loader.js

          grep -Fq \
            "NEURAL_EVENT_DETECTOR_DISABLED" \
            app/src/api/game.worker.js

          echo "SOURCE_OK"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
        run: |
          npm ci \
            --legacy-peer-deps \
            --no-audit \
            --no-fund \
            --ignore-scripts

      - name: Build
        working-directory: app
        env:
          PUBLIC_URL: /Game
          NODE_ENV: production
          CI: false
          NODE_OPTIONS: --openssl-legacy-provider
          GENERATE_SOURCEMAP: false
          INLINE_RUNTIME_CHUNK: false
        run: |
          npm run build

      - name: Create index
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          build = Path("app/build")
          public = Path("app/public")
          js = build / "static/js"
          css = build / "static/css"

          runtime = sorted(js.glob("runtime~main.*.js"))
          chunks = sorted(
              p for p in js.glob("*.chunk.js")
              if p.name[0].isdigit()
          )
          main = sorted(js.glob("main.*.js"))
          styles = sorted(css.glob("main.*.css"))

          if not runtime or not main:
              raise SystemExit("MAIN BUNDLE MISSING")

          html = (
              public / "index.html"
          ).read_text(encoding="utf-8")

          html = html.replace(
              "%PUBLIC_URL%",
              "/Game"
          )

          css_tags = "\n".join(
              f'<link rel="stylesheet" href="/Game/static/css/{p.name}">'
              for p in styles
          )

          js_tags = "\n".join(
              f'<script src="/Game/static/js/{p.name}"></script>'
              for p in runtime + chunks + main
          )

          html = html.replace(
              "</head>",
              css_tags + "\n</head>"
          )

          html = html.replace(
              "</body>",
              js_tags + "\n</body>"
          )

          (build / "index.html").write_text(
              html,
              encoding="utf-8"
          )

          print("INDEX_OK")
          PY

      - name: Prepare Pages
        shell: bash
        run: |
          set -e

          rm -f app/build/service-worker.js

          find app/build \
            -maxdepth 1 \
            -name 'precache-manifest*' \
            -delete

          touch app/build/.nojekyll

          python3 - <<'PY'
          from pathlib import Path

          required = [
              "app/build/index.html",
              "app/build/spawn.mpq",
              "app/build/wasm/Diablo.js",
              "app/build/wasm/Diablo.wasm",
              "app/build/wasm/DiabloSpawn.js",
              "app/build/wasm/DiabloSpawn.wasm",
          ]

          for name in required:
              p = Path(name)
              if not p.exists() or p.stat().st_size == 0:
                  raise SystemExit(
                      "MISSING: " + name
                  )

          mains = list(
              Path(
                  "app/build/static/js"
              ).glob(
                  "main.*.js"
              )
          )

          workers = list(
              Path(
                  "app/build"
              ).glob(
                  "*.worker.js"
              )
          )

          if not mains:
              raise SystemExit("MAIN JS MISSING")

          if not workers:
              raise SystemExit("WORKER MISSING")

          print("SITE_READY")
          PY

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build

  deploy:
    needs: build
    runs-on: ubuntu-22.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
