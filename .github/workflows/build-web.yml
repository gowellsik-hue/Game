name: Build and Deploy DiabloWeb AutoAttack

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-22.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Game repo
        uses: actions/checkout@v4

      - name: Checkout original DiabloWeb source
        uses: actions/checkout@v4
        with:
          repository: d07RiV/diabloweb
          ref: master
          path: diabloweb

      - name: Checkout original DiabloWeb production files
        uses: actions/checkout@v4
        with:
          repository: d07RiV/diabloweb
          ref: gh-pages
          path: production

      - name: Checkout original DiabloWeb engine
        uses: actions/checkout@v4
        with:
          repository: d07RiV/devilution
          ref: 798b5122731ae4b5e0c91348e5c44cf79354a94e
          path: engine

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 1.39.20
          actions-cache-folder: emsdk-cache

      - name: Patch engine for mobile auto attack
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path("engine/Source/diablo.cpp")
          src = path.read_text(encoding="utf-8")

          anchor = """void game_loop(BOOL bStartup)
          {
          """

          if anchor not in src:
              raise SystemExit("ERROR: game_loop anchor not found")

          auto_attack = r'''
          static int FindMobileAutoAttackTarget()
          {
          	int best = -1;
          	int bestDistance = 9999;

          	const int px = plr[myplr].WorldX;
          	const int py = plr[myplr].WorldY;

          	for (int n = 0; n < nummonsters; n++) {
          		const int mi = monstactive[n];

          		if (mi < 0 || mi >= MAXMONSTERS)
          			continue;

          		MonsterStruct &m = monster[mi];

          		if (m._mDelFlag)
          			continue;

          		if (m._mhitpoints <= 0)
          			continue;

          		if (CanTalkToMonst(mi))
          			continue;

          		const int dx = abs(m._mx - px);
          		const int dy = abs(m._my - py);
          		const int distance = dx > dy ? dx : dy;

          		if (distance > 8)
          			continue;

          		if (distance >= bestDistance)
          			continue;

          		best = mi;
          		bestDistance = distance;
          	}

          	return best;
          }

          static void TryMobileAutoAttack()
          {
          	if (leveltype == DTYPE_TOWN)
          		return;

          	if (PauseMode == 2)
          		return;

          	if (deathflag)
          		return;

          	if (gmenu_exception())
          		return;

          	if (stextflag || spselflag || qtextflag)
          		return;

          	if (questlog || doomflag || dropGoldFlag)
          		return;

          	if (track_isscrolling())
          		return;

          	PlayerStruct &player = plr[myplr];

          	if (player._pmode != PM_STAND)
          		return;

          	const int target = FindMobileAutoAttackTarget();

          	if (target < 0)
          		return;

          	if (player._pwtype == WT_RANGED)
          		NetSendCmdParam1(TRUE, CMD_RATTACKID, target);
          	else
          		NetSendCmdParam1(TRUE, CMD_ATTACKID, target);
          }

          '''

          src = src.replace(anchor, auto_attack + anchor, 1)

          old_logic = """\tif (!gmenu_exception() && sgnTimeoutCurs == 0) {
          		CheckCursMove();
          		track_process();
          	}
          	if (gbProcessPlayers) {
          """

          new_logic = """\tif (!gmenu_exception() && sgnTimeoutCurs == 0) {
          		CheckCursMove();
          		track_process();
          		TryMobileAutoAttack();
          	}
          	if (gbProcessPlayers) {
          """

          if old_logic not in src:
              raise SystemExit("ERROR: game_logic anchor not found")

          src = src.replace(old_logic, new_logic, 1)
          path.write_text(src, encoding="utf-8")

          path = Path("engine/build.js")
          src = path.read_text(encoding="utf-8")

          src = src.replace(
              " -s BINARYEN_TRAP_MODE='clamp'",
              ""
          )

          old_tail = """//run_build('-O3 -g -DZ_SOLO', 'Diablo', ['Source']).catch(e => console.error(e.message));
          //run_build('-O3 -g -DZ_SOLO -DSPAWN', 'DiabloSpawn', ['Source']).catch(e => console.error(e.message));
          run_build('-O3 -g -DZ_SOLO', 'MpqCmp', ['Source/rmpq', 'Source/zlib', 'mpqcmp']).catch(e => console.error(e.message));
          """

          new_tail = """(async () => {
            await run_build('-O3 -g -DZ_SOLO', 'Diablo', ['Source']);
            await run_build('-O3 -g -DZ_SOLO -DSPAWN', 'DiabloSpawn', ['Source']);
          })().catch(e => {
            console.error(e);
            process.exitCode = 1;
          });
          """

          if old_tail not in src:
              raise SystemExit("ERROR: build.js build target anchor not found")

          src = src.replace(old_tail, new_tail, 1)
          path.write_text(src, encoding="utf-8")

          print("PATCH_OK")
          PY

      - name: Build Diablo and DiabloSpawn
        working-directory: engine
        shell: bash
        run: |
          set -e
          emcc --version
          node build.js

      - name: Verify engine build
        shell: bash
        run: |
          set -e

          test -s engine/Diablo.wasm
          test -s engine/DiabloSpawn.wasm
          test -s engine/Diablo.jscc
          test -s engine/DiabloSpawn.jscc

          ls -lh \
            engine/Diablo.wasm \
            engine/DiabloSpawn.wasm \
            engine/Diablo.jscc \
            engine/DiabloSpawn.jscc

      - name: Replace DiabloWeb engine source
        shell: bash
        run: |
          set -e

          test -d diabloweb/src/api

          cp engine/Diablo.wasm \
            diabloweb/src/api/Diablo.wasm

          cp engine/DiabloSpawn.wasm \
            diabloweb/src/api/DiabloSpawn.wasm

          cp engine/Diablo.jscc \
            diabloweb/src/api/Diablo.jscc

          cp engine/DiabloSpawn.jscc \
            diabloweb/src/api/DiabloSpawn.jscc

          ls -lh \
            diabloweb/src/api/Diablo.wasm \
            diabloweb/src/api/DiabloSpawn.wasm \
            diabloweb/src/api/Diablo.jscc \
            diabloweb/src/api/DiabloSpawn.jscc

      - name: Add SPAWN.MPQ
        shell: bash
        run: |
          set -e

          test -s production/spawn.mpq

          cp production/spawn.mpq \
            diabloweb/public/spawn.mpq

          stat -c "%n : %s bytes" \
            diabloweb/public/spawn.mpq

      - name: Set GitHub Pages path
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("diabloweb/package.json")

          data = json.loads(
              p.read_text(encoding="utf-8")
          )

          data["homepage"] = \
              "https://gowellsik-hue.github.io/Game"

          p.write_text(
              json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print(data["homepage"])
          PY

      - name: Setup Node for original DiabloWeb
        uses: actions/setup-node@v4
        with:
          node-version: 14.21.3
          cache: npm
          cache-dependency-path: diabloweb/package-lock.json

      - name: Install DiabloWeb dependencies
        working-directory: diabloweb
        run: npm ci

      - name: Build DiabloWeb
        working-directory: diabloweb
        env:
          CI: false
        run: npm run build

      - name: Prepare Pages site
        shell: bash
        run: |
          set -e

          rm -rf _site
          mkdir -p _site

          cp -a diabloweb/build/. _site/

          while IFS= read -r file; do
            sed -i \
              's#/diabloweb/#/Game/#g' \
              "$file"
          done < <(
            grep -RIl "/diabloweb/" _site || true
          )

          if grep -RIn "/diabloweb/" _site; then
            echo "ERROR: old /diabloweb/ path remains"
            exit 1
          fi

          test -s _site/spawn.mpq

          echo "=== WASM files ==="

          find _site \
            -type f \
            -name '*.wasm' \
            -exec ls -lh {} \;

          echo "=== DiabloSpawn check ==="

          find _site \
            -type f \
            -name 'DiabloSpawn*.wasm' \
            -exec ls -lh {} \;

          echo "=== Game paths ==="

          grep -o \
            "/Game/[^\"']*" \
            _site/index.html \
            | head -20 \
            || true

      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: diabloweb-autoattack
          path: _site/
          if-no-files-found: error

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
