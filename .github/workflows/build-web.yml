name: Deploy modern DiabloWebAI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout DiabloWebAI
        uses: actions/checkout@v4
        with:
          repository: levidehaan/diablowebai
          ref: 4becbb4c81323dc8982504ecb2a5f338434c9772
          path: app

      - name: Fix package mismatch
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("app/package.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          data.get("devDependencies", {}).pop("canvas", None)
          p.write_text(
              json.dumps(data, indent=2) + "\n",
              encoding="utf-8"
          )
          print("PACKAGE_OK")
          PY

      - name: Disable service worker
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/index.js")
          text = p.read_text(encoding="utf-8")

          old = """serviceWorker.register({
            onUpdate() {
            },
          });"""

          if old not in text:
              raise SystemExit(
                  "service worker block not found"
              )

          text = text.replace(
              old,
              "serviceWorker.unregister();",
              1
          )

          p.write_text(
              text,
              encoding="utf-8"
          )

          print("SERVICE_WORKER_DISABLED")
          PY

      - name: Patch webpack emission
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          webpack = Path(
              "app/config/webpack.config.js"
          )

          text = webpack.read_text(
              encoding="utf-8"
          )

          text = text.replace(
              "futureEmitAssets: true,",
              "futureEmitAssets: false,",
              1
          )

          webpack.write_text(
              text,
              encoding="utf-8"
          )

          build = Path(
              "app/scripts/build.js"
          )

          text = build.read_text(
              encoding="utf-8"
          )

          marker = (
              "const isInteractive = "
              "process.stdout.isTTY;"
          )

          helper = r'''
          const isInteractive = process.stdout.isTTY;

          function forceWriteAssets(stats) {
            const assets =
              stats.compilation.assets || {};

            const names =
              Object.keys(assets);

            console.log(
              "[FORCE-EMIT]",
              names.length
            );

            if (!names.length) {
              throw new Error(
                "No webpack assets"
              );
            }

            for (const name of names) {
              let source =
                assets[name].source();

              if (
                source instanceof Uint8Array &&
                !Buffer.isBuffer(source)
              ) {
                source =
                  Buffer.from(source);
              }

              if (
                typeof source !== "string" &&
                !Buffer.isBuffer(source)
              ) {
                source =
                  Buffer.from(source);
              }

              const output =
                path.join(
                  paths.appBuild,
                  name
                );

              fs.ensureDirSync(
                path.dirname(output)
              );

              fs.writeFileSync(
                output,
                source
              );

              console.log(
                "[WRITE]",
                name
              );
            }
          }
          '''

          if marker not in text:
              raise SystemExit(
                  "build marker not found"
              )

          text = text.replace(
              marker,
              helper,
              1
          )

          marker2 = (
              "      return resolve({\n"
              "        stats,"
          )

          replacement = (
              "      forceWriteAssets(stats);\n"
              "\n"
              "      return resolve({\n"
              "        stats,"
          )

          if marker2 not in text:
              raise SystemExit(
                  "resolve marker not found"
              )

          text = text.replace(
              marker2,
              replacement,
              1
          )

          build.write_text(
              text,
              encoding="utf-8"
          )

          print("WEBPACK_PATCH_OK")
          PY

      - name: Verify WASM loader
        shell: bash
        run: |
          set -e
          grep -q \
            "await module.ready" \
            app/src/api/game.worker.js

          grep -q \
            "return module" \
            app/src/api/game.worker.js

          echo "LOADER_OK"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        shell: bash
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
        run: |
          set -e
          npm ci \
            --legacy-peer-deps \
            --no-audit \
            --no-fund \
            --ignore-scripts

      - name: Build
        working-directory: app
        shell: bash
        env:
          PUBLIC_URL: /Game
          NODE_ENV: production
          CI: false
          NODE_OPTIONS: --openssl-legacy-provider
          GENERATE_SOURCEMAP: false
          INLINE_RUNTIME_CHUNK: false
        run: |
          set -e
          npm run build

      - name: Create HTML
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          build = Path("app/build")
          public = Path("app/public")
          jsdir = build / "static" / "js"
          cssdir = build / "static" / "css"

          runtime = sorted(
              jsdir.glob(
                  "runtime~main.*.js"
              )
          )

          chunks = sorted(
              p for p
              in jsdir.glob("*.chunk.js")
              if p.name[0].isdigit()
          )

          main = sorted(
              jsdir.glob(
                  "main.*.js"
              )
          )

          css = (
              sorted(
                  cssdir.glob(
                      "main.*.css"
                  )
              )
              if cssdir.exists()
              else []
          )

          if not runtime:
              raise SystemExit(
                  "main runtime missing"
              )

          if not main:
              raise SystemExit(
                  "main bundle missing"
              )

          html = (
              public /
              "index.html"
          ).read_text(
              encoding="utf-8"
          )

          html = html.replace(
              "%PUBLIC_URL%",
              "/Game"
          )

          css_tags = "\n".join(
              f'<link rel="stylesheet" '
              f'href="/Game/static/css/{p.name}">'
              for p in css
          )

          scripts = (
              runtime +
              chunks +
              main
          )

          js_tags = "\n".join(
              f'<script src="/Game/static/js/{p.name}">'
              f'</script>'
              for p in scripts
          )

          html = html.replace(
              "</head>",
              css_tags + "\n</head>"
          )

          html = html.replace(
              "</body>",
              js_tags + "\n</body>"
          )

          (
              build /
              "index.html"
          ).write_text(
              html,
              encoding="utf-8"
          )

          print(
              "INDEX_CREATED"
          )
          PY

      - name: Clean old cache files
        shell: bash
        run: |
          set -e

          rm -f \
            app/build/service-worker.js

          find \
            app/build \
            -maxdepth 1 \
            -name 'precache-manifest*' \
            -delete

          touch \
            app/build/.nojekyll

      - name: Verify deploy files
        shell: bash
        run: |
          set -e

          test -s app/build/index.html
          test -s app/build/spawn.mpq

          find \
            app/build/static/js \
            -type f \
            -name 'main.*.js' \
            -size +0c \
            | grep -q .

          find \
            app/build \
            -maxdepth 1 \
            -type f \
            -name '*.worker.js' \
            -size +0c \
            | grep -q .

          find \
            app/build/static/media \
            -type f \
            -name 'Diablo.*.wasm' \
            -size +0c \
            | grep -q .

          find \
            app/build/static/media \
            -type f \
            -name 'DiabloSpawn.*.wasm' \
            -size +0c \
            | grep -q .

          test -s \
            app/build/wasm/devilutionx.wasm

          test -s \
            app/build/wasm/devilutionx.data

          grep -q \
            '/Game/static/js/main.' \
            app/build/index.html

          echo "REAL_APPLICATION_OK"

          echo "=== JS ==="
          find \
            app/build/static/js \
            -type f \
            -exec ls -lh {} \;

          echo "=== WORKERS ==="
          find \
            app/build \
            -maxdepth 1 \
            -type f \
            -name '*.worker.js' \
            -exec ls -lh {} \;

          echo "=== WASM ==="
          find \
            app/build/static/media \
            -type f \
            -name '*.wasm' \
            -exec ls -lh {} \;

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: modern-diablowebai
          path: app/build/
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build

  deploy:
    needs: build
    runs-on: ubuntu-22.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
