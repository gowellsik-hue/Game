
name: "build-web.yml | V17 | Field-to-Lab Motion Inspection"
run-name: "build-web.yml | V17 | Field-to-Lab Motion Inspection"

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: build-web-yml-v17
  cancel-in-progress: false

jobs:
  build_web_v17:
    name: "build-web.yml | V17 | Field-to-Lab Build and Validation"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "build-web.yml | V17 | Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "build-web.yml | V17 | Restore successful V16.2 game"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/mobile reports
          if gh run download 39099412471 --repo "$GITHUB_REPOSITORY" --name Sanctuary-Mobile-V16.2-Multi-Monster-Review --dir dist/mobile; then
            echo 'build-web.yml | V17 | V16.2 success artifact restored'
          else
            rm -rf dist/mobile
            mkdir -p dist/mobile
            git show 2e5b2c17e88d28411946518fabe857773d061e94:.github/workflows/build-web.yml > reports/pinned-v16-2.yml
            python3 -m venv /tmp/sanctuary-v17-base
            /tmp/sanctuary-v17-base/bin/pip -q install 'PyYAML==6.0.2' 'Pillow==11.3.0'
            cat > reports/restore_v16_2.py <<'PY_RESTORE'
          import os,subprocess,yaml
          from pathlib import Path
          steps=yaml.safe_load(Path('reports/pinned-v16-2.yml').read_text(encoding='utf-8'))['jobs']['mobile-v16-2']['steps']
          env=dict(os.environ);env['PATH']='/tmp/sanctuary-v17-base/bin:'+env['PATH']
          for name in ('V16.2 | Repair pinned V16 and rebuild from verified V15','V16.2 | Stamp visible version and verify assets'):
              found=[s for s in steps if s.get('name')==name and isinstance(s.get('run'),str)]
              if len(found)!=1:raise SystemExit('Pinned V16.2 step missing: '+name)
              subprocess.run(['bash','-e','-o','pipefail','-c',found[0]['run']],env=env,check=True)
              print('build-web.yml | V17 | rebuilt:',name,flush=True)
          PY_RESTORE
            /tmp/sanctuary-v17-base/bin/python reports/restore_v16_2.py
          fi

      - name: "build-web.yml | V17 | Add field-to-lab target inspection"
        shell: bash
        run: |
          set -euo pipefail
          cat > reports/patch_v17.py <<'PY_PATCH'
          from pathlib import Path
          import hashlib,json,sys

          root=Path(sys.argv[1] if len(sys.argv)>1 else '/mnt/data/sanctuary_v17/base')
          htmlfile=root/'index.html'
          gamefile=root/'game.js'
          reviewfile=root/'motion-review.js'
          cssfile=root/'game.css'
          metafile=root/'build-info.json'
          html=htmlfile.read_text(encoding='utf-8')
          game=gamefile.read_text(encoding='utf-8')
          review=reviewfile.read_text(encoding='utf-8')
          css=cssfile.read_text(encoding='utf-8')
          meta=json.loads(metafile.read_text(encoding='utf-8'))
          assert meta['version']=='16.2' and meta['runtime']==16,meta
          assert meta['source_run']==39050704098
          expected_game='de05e1c89227f69907774bcbb051519cdb7c7b884a82a8c8c388d1ae446caf28'
          expected_review='8af26301b8129fe1819da6d4e8ecc2b4fd5b8b4d64c595db6d6ef2d39da05f2e'
          assert hashlib.sha256(gamefile.read_bytes()).hexdigest()==expected_game
          assert hashlib.sha256(reviewfile.read_bytes()).hexdigest()==expected_review
          for unchanged in ('game-data.js','manifest.json','monster-pack.json','monster-pack.js'):
              assert hashlib.sha256((root/unchanged).read_bytes()).hexdigest()==meta['sha256'][unchanged]

          def replace_one(text,old,new,label):
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'V17 {label}: expected 1 source location, saw {count}')
              return text.replace(old,new,1)

          html=replace_one(html,'Sanctuary of Aden Mobile V16.2 · Multi-Monster Motion Review','Sanctuary of Aden Mobile V17 · Field-to-Lab Motion Review','HTML title')
          html=replace_one(html,'Sanctuary Mobile V16.2</strong>','Sanctuary Mobile V17</strong>','HUD title')
          html=replace_one(html,'원본 SPR 동작 검증 V16.2</strong>','원본 SPR 동작 검증 V17</strong>','Lab title')
          html=replace_one(html,'V16.2 · 몬스터별 독립 모션 검수','V17 · 필드 연결 모션 검수','review title')
          html=replace_one(html,'<button id="fieldPackToggle" type="button" hidden>오크 후보 모션 켜기</button></div>',
              '<button id="fieldPackToggle" type="button" hidden>추출 후보 모션</button><button id="fieldInspect" type="button">이 몬스터 현재 모션 검수</button></div>',
              'field inspect button')
          html=replace_one(html,'<div id="reviewCoverage"></div>',
              '<div id="reviewCoverage"></div><div id="reviewFieldSnapshot" hidden></div>',
              'field snapshot label')

          game=replace_one(game,
              'function targetHUD(){',
              "window.SANCTUARY_GET_FIELD_TARGET=()=>{const m=selectedMob;if(!m||m.dead)return null;return {actor:m.visual,mode:m.mode,dir:m.dir,mobId:m.id,spriteId:D.actors[m.visual].sprite_id,hp:Math.ceil(m.hp)}};\nfunction targetHUD(){",
              'instant-on-click live target getter')
          game=replace_one(game,
              "if(!selectedMob||selectedMob.dead){panel.hidden=true;updateFieldMotion();return}panel.hidden=false;el('targetLabel')",
              "if(!selectedMob||selectedMob.dead){window.SANCTUARY_FIELD_TARGET=null;panel.hidden=true;updateFieldMotion();return}window.SANCTUARY_FIELD_TARGET={actor:selectedMob.visual,mode:selectedMob.mode,dir:selectedMob.dir,mobId:selectedMob.id,spriteId:D.actors[selectedMob.visual].sprite_id,hp:Math.ceil(selectedMob.hp)};panel.hidden=false;el('targetLabel')",
              'safe current target snapshot')

          review=replace_one(review,
              "function changeActor(id,syncLab){\n if(!actorKeys.includes(id))return false;",
              "function changeActor(id,syncLab){\n if(!actorKeys.includes(id))return false;\n el('reviewFieldSnapshot').hidden=true;",
              'clear old field snapshot on actor change')
          review=replace_one(review,
              "el('reviewToggle').onclick=()=>{body.hidden=!body.hidden;el('reviewToggle').textContent=body.hidden?'모션 검수 열기':'검수 화면 접기';wake()};",
              """function inspectField(snapshot){
           if(!snapshot||!actorKeys.includes(snapshot.actor))return false;
           const mode=actions.includes(snapshot.mode)?snapshot.mode:'idle';
           const dir=Number.isInteger(snapshot.dir)&&snapshot.dir>=0&&snapshot.dir<=7?snapshot.dir:0;
           if(el('lab').hidden)el('labOpen').click();
           if(body.hidden)el('reviewToggle').click();
           changeActor(snapshot.actor,true);select(mode,dir);
           const note=el('reviewFieldSnapshot');note.hidden=false;
           note.textContent='필드 선택 기록 · SPR '+world.actors[snapshot.actor].sprite_id+' · '+names[mode]+' · 방향 '+dir+' · 개체 '+String(snapshot.mobId??'?')+' · HP '+String(snapshot.hp??'?')+' · 검수 시점의 동작';
           el('reviewPanel').scrollIntoView?.({block:'start'});
           wake();return true;
          }
          el('reviewToggle').onclick=()=>{body.hidden=!body.hidden;el('reviewToggle').textContent=body.hidden?'모션 검수 열기':'검수 화면 접기';wake()};
          el('fieldInspect').onclick=()=>inspectField(window.SANCTUARY_GET_FIELD_TARGET?.()||window.SANCTUARY_FIELD_TARGET);
          """,
              'field to lab button and navigation')
          review=replace_one(review,
              'import:takeImported,select:changeActor};',
              'import:takeImported,select:changeActor,inspectField};',
              'public inspection bridge')
          css+='''
          /* build-web.yml | V17 | Field-to-Lab Motion Review */
          #fieldInspect{display:block;width:100%;font-size:10px;padding:7px 4px;margin-top:6px;background:#75603a;color:#fff5d2;border:1px solid #c2a66f;border-radius:6px;touch-action:manipulation}
          #reviewFieldSnapshot{font-size:11px;line-height:1.5;color:#f7e5aa;border:1px solid #bd985d;border-radius:6px;background:#354239;padding:8px}
          #reviewFieldSnapshot[hidden]{display:none}
          @media (orientation:landscape) and (max-height:600px){#fieldInspect{padding:5px 2px;font-size:10px}}
          '''
          htmlfile.write_text(html,encoding='utf-8')
          gamefile.write_text(game,encoding='utf-8')
          reviewfile.write_text(review,encoding='utf-8')
          cssfile.write_text(css,encoding='utf-8')
          meta.update(version='17',display_version='V17',package=17,runtime=17,previous_version='V16.2',previous_run=39099412471)
          meta['sha256']={f:hashlib.sha256((root/f).read_bytes()).hexdigest() for f in ['index.html','game.css','game.js','game-data.js','manifest.json','monster-pack.json','monster-pack.js','motion-review.js','motion-coverage.json']}
          metafile.write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          with (root/'README_KO.txt').open('a',encoding='utf-8') as f:
              f.write('\nV17 build-web.yml: field target > current motion review, exact actor/mode/direction capture; mob stats, combat, map and SPR unchanged.\n')
          print('build-web.yml | V17 | field-to-lab review patch applied; files verified')
          PY_PATCH
          python3 -m py_compile reports/patch_v17.py
          python3 reports/patch_v17.py dist/mobile
          node --check dist/mobile/game.js
          node --check dist/mobile/motion-review.js

      - name: "build-web.yml | V17 | Run asset and browser-bridge regression checks"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY'
          from pathlib import Path
          import hashlib,json
          root=Path('dist/mobile')
          info=json.loads((root/'build-info.json').read_text(encoding='utf-8'))
          world=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          pack=json.loads((root/'monster-pack.json').read_text(encoding='utf-8'))
          assert info['package']==17 and info['runtime']==17 and info['display_version']=='V17'
          assert info['previous_run']==39099412471 and info['previous_version']=='V16.2'
          assert info['sha256']['manifest.json']=='3f1cdb0f22376e763888628465b6601f5e9c72eeda8a9194a356dcba2c205c95'
          assert info['sha256']['game-data.js']=='1a50224f083c193c33eab137798bfb6ddccf1b1dea54f3d9055e601c0fbabf57'
          assert info['sha256']['monster-pack.json']=='06e28349f7ca6da1fe2bda9b28653cb0e2f08c13c998b02de7689ffd6cd8ea26'
          for name,digest in info['sha256'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest,name
          assert len(world['map']['flags'])==36864 and len(world['map']['objects'])==59963
          assert len(list((root/'assets').glob('*.png')))>=3616
          assert len(list((root/'tiles').glob('*.png')))==218
          assert len(list((root/'motion-gifs/v18').glob('*.gif')))==40
          assert pack['actors']['mob56']['provenance']['actionDefinitionsVerified'] is False
          html=(root/'index.html').read_text(encoding='utf-8')
          assert all(token in html for token in ('Sanctuary Mobile V17','원본 SPR 동작 검증 V17','V17 · 필드 연결 모션 검수','id="fieldInspect"','id="reviewFieldSnapshot"'))
          assert html.index('src="game.js"')<html.index('src="motion-review.js"')
          print('build-web.yml | V17 | assets and version confirmed; all 7 original actors preserved')
          PY_VERIFY
          cat > reports/smoke_v17.cjs <<'JS_SMOKE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const root=process.argv[2]||'/mnt/data/sanctuary_v17/staging';
          const world=JSON.parse(fs.readFileSync(root+'/manifest.json','utf8'));
          const pack=JSON.parse(fs.readFileSync(root+'/monster-pack.json','utf8'));
          const elements=new Map(),events={};
          class Element{
           constructor(id){this.id=id;this.hidden=['lab','reviewBody','reviewFieldSnapshot'].includes(id);this.value='';this.dataset={};this.children=[];this.disabled=false;this.textContent='';this.attributes={};this.style={};this.classList={toggle(){},add(){},remove(){}};this.width=220;this.height=170}
           appendChild(node){this.children.push(node);return node}
           addEventListener(name,fn){(this.events??={})[name]=fn}
           setAttribute(k,v){this.attributes[k]=v}
           getContext(){return{fillRect(){},drawImage(){},fillText(){},imageSmoothingEnabled:false}}
           scrollIntoView(){this.didScroll=true}
           click(){this.onclick?.()}
          }
          const el=id=>{if(!elements.has(id))elements.set(id,new Element(id));return elements.get(id)};
          const document={getElementById:el,createElement:id=>new Element(id),body:new Element('body'),hidden:false,addEventListener(k,v){events[k]=v}};
          const storage=new Map();
          const window={SANCTUARY_MANIFEST:world,SANCTUARY_MONSTER_PACK:pack,SANCTUARY_FIELD_TARGET:null,SANCTUARY_GET_FIELD_TARGET(){return this.SANCTUARY_FIELD_TARGET}};
          el('labOpen').onclick=()=>{el('lab').hidden=false};
          el('labActor').onchange=()=>{};
          const env={window,document,Math,Number,Object,Array,String,JSON,Boolean,performance:{now:()=>1000},requestAnimationFrame:()=>1,Image:class{},localStorage:{getItem:k=>storage.get(k)||null,setItem:(k,v)=>storage.set(k,v)},console,confirm:()=>true,alert:msg=>{throw Error(msg)}};
          vm.runInNewContext(fs.readFileSync(root+'/motion-review.js','utf8'),env,{timeout:10000});
          const api=window.SANCTUARY_MOTION_TRIAL;
          assert(window.SANCTUARY_REVIEW_READY);
          assert.equal(api.actors().length,7);
          assert.equal(api.hasPack('mob56'),true);
          assert.equal(api.approvedCount('mob56'),0);
          assert.equal(api.inspectField({actor:'mob56',mode:'attack',dir:6,mobId:1,spriteId:56,hp:35}),true);
          assert.equal(el('lab').hidden,false);
          assert.equal(el('reviewBody').hidden,false);
          assert.equal(el('reviewActor').value,'mob56');
          assert(el('reviewSelection').textContent.includes('공격 · 방향 6'));
          assert(el('reviewFieldSnapshot').textContent.includes('개체 1'));
          assert(el('reviewPanel').didScroll);
          assert.equal(api.inspectField({actor:'mob1022',mode:'hit',dir:3,mobId:2,spriteId:1022,hp:17}),true);
          assert.equal(el('reviewActor').value,'mob1022');
          assert(el('reviewSelection').textContent.includes('피격 · 방향 3'));
          assert.equal(el('reviewTrialAll').disabled,true);
          assert.equal(el('reviewOk').disabled,true);
          assert.equal(api.inspectField({actor:'enemy',mode:'walk',dir:7,mobId:0,spriteId:3215,hp:34}),true);
          assert(el('reviewSelection').textContent.includes('이동 · 방향 7'));
          assert.equal(api.inspectField({actor:'wrong',mode:'walk',dir:1}),false);
          window.SANCTUARY_FIELD_TARGET={actor:'mob56',mode:'death',dir:4,mobId:9,spriteId:56,hp:1};
          el('fieldInspect').click();
          assert.equal(el('reviewActor').value,'mob56');
          assert(el('reviewSelection').textContent.includes('사망 · 방향 4'));
          assert(el('reviewFieldSnapshot').textContent.includes('HP 1'));
          assert.equal(api.approvedCount('mob56'),0);
          assert.equal(api.mode('mob56'),'legacy');
          console.log('build-web.yml | V17 PASS: field click, 7 actors, attack/hit/death slots, missing-pack safety, record isolation, lab navigation');
          JS_SMOKE
          node --check reports/smoke_v17.cjs
          node reports/smoke_v17.cjs dist/mobile
          printf '%s\n' 'build-web.yml | V17 | field-to-lab motion inspection, original S32/SPR/TIL, monster trials and combat preserved.' >> "$GITHUB_STEP_SUMMARY"

      - name: "build-web.yml | V17 | Upload mobile game"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Mobile-V17-Field-to-Lab
          path: dist/mobile/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: "build-web.yml | V17 | Upload diagnostics"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Mobile-V17-Diagnostics
          path: reports/
          if-no-files-found: warn
          retention-days: 14
