          let pad=el('pad'),knob=el('knob');function padMove(e){let r=pad.getBoundingClientRect(),radius=r.width*.31,x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,n=Math.hypot(x,y);if(n>radius){x=x*radius/n;y=y*radius/n}stickVector={x:x/radius,y:y/radius};knob.style.left=(r.width/2+x)+'px';knob.style.top=(r.height/2+y)+'px';hero.path=[];hero.goalMob=null}
