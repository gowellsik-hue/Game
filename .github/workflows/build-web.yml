
name: "build-web.yml | V26 | Original SPR61 hero sprite trial"
run-name: "build-web.yml | V26 | Verify live Sanctuary-Test GitHub Pages"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: build-web-yml-v26-sanctuary-pages
  cancel-in-progress: false

jobs:
  publish_v26:
    name: "build-web.yml | V26 | Publish and verify separate GitHub Pages"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: "V26 | Require authorization for an independent GitHub repository"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SANCTUARY_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::SANCTUARY_DEPLOY_TOKEN is missing. A separate GitHub Pages repository cannot be created by the Game GITHUB_TOKEN.'
            echo '::error::V26 NOT published. The existing Game site was not touched.'
            exit 1
          fi
          actor="$(gh api user --jq .login)"
          if [ "$actor" != 'gowellsik-hue' ]; then
            echo "::error::Publishing token belongs to $actor, not gowellsik-hue."
            exit 1
          fi
          echo 'V26 | Owner verified; independent GitHub Pages deployment authorized.'

      - name: "V26 | Download successful V25 input (not a preview deployment)"
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39211727897
          name: Sanctuary-Test-V25-Independent-Preview
          github-token: ${{ github.token }}
          path: source

      - name: "V26 | Prepare the actual GitHub Pages website"
        shell: bash
        run: |
          set -euo pipefail
          test -s source/index.html
          mkdir -p site
          cp -a source/. site/
          python3 - <<'PY_V26'
          import hashlib
          import json
          import re
          from html.parser import HTMLParser
          from pathlib import Path

          p = Path('site')
          info_path = p / 'build-info.json'
          info = json.loads(info_path.read_text(encoding='utf-8'))
          assert (info['package'], info['runtime'], info['display_version']) == (25, 25, 'V25')
          for name, sha in info['sha256'].items():
              assert hashlib.sha256((p / name).read_bytes()).hexdigest() == sha, 'V25 input changed: ' + name

          manifest = json.loads((p / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['actors']['hero']['sprite_id'] == 2786
          sprite = manifest['actors']['knight61']
          assert sprite['sprite_id'] == 61
          assert len(sprite['actions']) == 168
          assert sum(map(len, sprite['actions'].values())) == 545
          assert len(list((p / 'assets').glob('*.png'))) == 4161
          assert len(list((p / 'assets').glob('knight61-61-*.png'))) == 545
          assert len(list((p / 'tiles').glob('*.png'))) == 218
          assert not (p / 'native-world').exists()

          original = (p / 'index.html').read_text(encoding='utf-8')
          assert len(re.findall(r'\bV25\b', original)) == 5, 'V25 HTML markers changed'
          new_html = re.sub(r'\bV25\b', 'V26', original)
          assert re.search(r'\bV(?:19|23|24|25)\b', new_html) is None
          assert 'raw.githack.com' not in new_html
          assert 'gowellsik-hue.github.io/Game/' not in new_html
          (p / 'index.html').write_text(new_html, encoding='utf-8')
          (p / 'Sanctuary-V26-SPR61-Test.html').write_text(new_html, encoding='utf-8')
          (p / 'Sanctuary-V25-SPR61-Test.html').unlink()
          (p / 'V25-build-report.json').unlink()
          (p / 'Sanctuary-Preview-Branch-Marker.json').unlink()
          (p / '.nojekyll').touch()

          info['sha256'].pop('Sanctuary-V25-SPR61-Test.html', None)
          for key in ('v25_mode', 'v25_preview_branch', 'v25_preview_url'):
              info.pop(key, None)
          info.update({
              'version': '26',
              'package': 26,
              'runtime': 26,
              'display_version': 'V26',
              'v26_source_version': 'V25',
              'v26_source_run': 39211727897,
              'v26_site_repo': 'gowellsik-hue/Sanctuary-Test',
              'v26_pages_url': 'https://gowellsik-hue.github.io/Sanctuary-Test/',
              'v26_game_code_changed': False,
              'v26_game_data_changed': False,
              'v26_map_changed': False,
              'v26_scale_changed': False,
          })
          for name in ('index.html', 'Sanctuary-V26-SPR61-Test.html'):
              info['sha256'][name] = hashlib.sha256((p / name).read_bytes()).hexdigest()
          info_path.write_text(json.dumps(info, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          class LocalFiles(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.files = []
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  if tag == 'script' and d.get('src'):
                      self.files.append(d['src'])
                  elif tag == 'link' and d.get('href'):
                      self.files.append(d['href'])
          links = LocalFiles()
          links.feed(new_html)
          for name in links.files:
              assert '://' not in name and not name.startswith('/') and '..' not in name
              assert (p / name).is_file(), 'Missing relative web resource: ' + name
          for name, sha in info['sha256'].items():
              assert hashlib.sha256((p / name).read_bytes()).hexdigest() == sha, 'V26 SHA mismatch: ' + name

          report = {
              'version': 'V26',
              'source': 'V25 successful GitHub Actions run 39211727897',
              'sourceHeroSprite': 2786,
              'originalKnightSprite': 61,
              'originalKnightFrames': 545,
              'page': 'https://gowellsik-hue.github.io/Sanctuary-Test/',
              'githubRepository': 'gowellsik-hue/Sanctuary-Test',
              'publishState': 'NOT_PUBLISHED_UNTIL_V26_LIVE_HTTP_CHECK_PASSES',
              'originalGamePagesModified': False,
              'gameLogicModified': False,
          }
          (p / 'V26-build-report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (p / 'Sanctuary-Site-Marker.json').write_text(json.dumps({
              'site': 'Sanctuary-Test', 'owner': 'gowellsik-hue', 'version': 'V26'
          }, indent=2) + '\n', encoding='utf-8')
          print('V26_PACKAGE_VERIFIED', len(links.files), 'local assets; 545 original SPR frames')
          PY_V26
          node --check site/game.js
          node --check site/motion-review.js
          node --check site/monster-pack.js

      - name: "V26 | Archive GitHub Pages release for audit"
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Test-V26-GitHub-Pages
          path: site/
          if-no-files-found: error
          retention-days: 90

      - name: "V26 | Create or update separate Sanctuary-Test repository only"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SANCTUARY_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          target='gowellsik-hue/Sanctuary-Test'
          created=no
          if gh api "repos/$target" --silent >/dev/null 2>&1; then
            echo 'V26 | Independent repository already exists.'
            if ! gh api "repos/$target/contents/Sanctuary-Site-Marker.json?ref=main" --jq .sha >/dev/null 2>&1; then
              echo '::error::Existing Sanctuary-Test is not marked as our managed site. Refusing to overwrite it.'
              exit 1
            fi
          else
            gh api --method POST user/repos \
              -f name=Sanctuary-Test \
              -f description='Independent Sanctuary of Aden browser build' \
              -F private=false -F auto_init=true --jq .full_name
            created=yes
          fi
          gh auth setup-git
          for attempt in $(seq 1 10); do
            if git clone -q "https://github.com/$target.git" published; then
              break
            fi
            if [ "$attempt" -eq 10 ]; then
              echo '::error::Cannot clone independent Sanctuary-Test repository.'
              exit 1
            fi
            sleep 3
          done
          if git -C published show-ref --verify --quiet refs/remotes/origin/main; then
            git -C published checkout -q -B main origin/main
          else
            git -C published checkout -q -B main
          fi
          rsync -a --delete --exclude='.git/' site/ published/
          git -C published config user.name 'github-actions[bot]'
          git -C published config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C published add -A
          if ! git -C published diff --cached --quiet; then
            git -C published commit -qm 'Publish independent Sanctuary V26 GitHub Pages'
            git -C published push -q origin HEAD:refs/heads/main
          fi
          default_branch="$(gh api "repos/$target" --jq .default_branch)"
          if [ "$default_branch" != main ]; then
            gh api --method PATCH "repos/$target" -f default_branch=main >/dev/null
          fi
          local_sha="$(git -C published rev-parse HEAD)"
          remote_sha="$(gh api "repos/$target/git/ref/heads/main" --jq .object.sha)"
          if [ "$local_sha" != "$remote_sha" ]; then
            echo '::error::Independent GitHub repository commit does not match the packaged V26 site.'
            exit 1
          fi
          echo "V26_GITHUB_REPOSITORY_PUSHED $target $remote_sha created=$created"
          echo "V26_SITE_REPO=$target" >> "$GITHUB_STEP_SUMMARY"

      - name: "V26 | Configure GitHub Pages in Sanctuary-Test repository"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SANCTUARY_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          target='gowellsik-hue/Sanctuary-Test'
          source_json='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          if gh api "repos/$target/pages" --silent >/dev/null 2>&1; then
            current="$(gh api "repos/$target/pages" --jq '[.build_type, (.source.branch // ""), (.source.path // "")] | join("|")')"
            if [ "$current" != 'legacy|main|/' ]; then
              printf '%s' "$source_json" | gh api --method PUT "repos/$target/pages" --input - >/dev/null
            fi
          else
            printf '%s' "$source_json" | gh api --method POST "repos/$target/pages" --input - >/dev/null
          fi
          result="$(gh api "repos/$target/pages" --jq .html_url)"
          case "$result" in
            https://gowellsik-hue.github.io/Sanctuary-Test/|https://gowellsik-hue.github.io/Sanctuary-Test)
              echo "V26_GITHUB_PAGES_CONFIGURED $result" ;;
            *) echo "::error::Unexpected GitHub Pages URL: $result"; exit 1 ;;
          esac
          # Trigger a Pages build explicitly; a concurrently queued build is harmless.
          if gh api --method POST "repos/$target/pages/builds" >/dev/null 2>&1; then
            echo 'V26 | Requested a Pages build.'
          else
            echo 'V26 | Pages build already queued, or a new build request was not accepted.'
          fi

      - name: "V26 | Verify the real public GitHub Pages URL is live"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SANCTUARY_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          url='https://gowellsik-hue.github.io/Sanctuary-Test/'
          expected_js_sha="$(sha256sum site/game.js | awk '{print $1}')"
          live=no
          for attempt in $(seq 1 48); do
            if curl --fail --silent --location --max-time 20 \
                "${url}?build=V26-${GITHUB_RUN_ID}-${attempt}" -o /tmp/v26-live-index.html; then
              if grep -Fq 'Sanctuary of Aden Mobile V26' /tmp/v26-live-index.html && \
                 grep -Fq 'game-data.js' /tmp/v26-live-index.html; then
                if curl --fail --silent --location --max-time 20 \
                    "${url}game.js?build=V26-${GITHUB_RUN_ID}-${attempt}" -o /tmp/v26-live-game.js; then
                  live_js_sha="$(sha256sum /tmp/v26-live-game.js | awk '{print $1}')"
                  if [ "$live_js_sha" = "$expected_js_sha" ]; then
                    live=yes
                    break
                  fi
                fi
              fi
            fi
            echo "V26 | Waiting for real Pages HTML and JS (${attempt}/48)"
            sleep 10
          done
          if [ "$live" != yes ]; then
            echo '::error::Separate GitHub repository may be configured, but the V26 GitHub Pages HTML/JS were not publicly reachable. V26 deployment is NOT successful.'
            exit 1
          fi
          echo "V26_GITHUB_PAGES_LIVE $url"
          {
            echo '### V26 LIVE GITHUB PAGES VERIFIED'
            echo "- Live independent site: $url"
            echo '- HTML displays V26, and the served JavaScript SHA256 matches the V26 package.'
            echo '- Original Game Pages was not modified.'
          } >> "$GITHUB_STEP_SUMMARY"
