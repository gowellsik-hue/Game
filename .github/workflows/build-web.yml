
name: "build-web.yml | V18 | Field Motion Timeline and Death Inspection"
run-name: "build-web.yml | V18 | Field Motion Timeline and Death Inspection"

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: build-web-yml-v18
  cancel-in-progress: false

jobs:
  build_web_v18:
    name: "build-web.yml | V18 | Restore, Patch and Verify"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "build-web.yml | V18 | Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "build-web.yml | V18 | Restore V17 verified game"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/mobile reports
          if gh run download 39101354382 --repo "$GITHUB_REPOSITORY" --name Sanctuary-Mobile-V17-Field-to-Lab --dir dist/mobile; then
            echo 'build-web.yml | V18 | verified V17 artifact restored'
          else
            rm -rf dist/mobile
            mkdir -p dist/mobile
            git show 38b2a2d16eb4a22bf8346dc2b1391f7e4e14e6c4:.github/workflows/build-web.yml > reports/pinned-v17.yml
            python3 -m venv /tmp/sanctuary-v18-base
            /tmp/sanctuary-v18-base/bin/pip -q install 'PyYAML==6.0.2' 'Pillow==11.3.0'
            cat > reports/restore_v17.py <<'PY_RESTORE'
          import os,subprocess,yaml
          from pathlib import Path
          steps=yaml.safe_load(Path('reports/pinned-v17.yml').read_text(encoding='utf-8'))['jobs']['build_web_v17']['steps']
          env=dict(os.environ);env['PATH']='/tmp/sanctuary-v18-base/bin:'+env['PATH']
          for name in ('build-web.yml | V17 | Restore successful V16.2 game','build-web.yml | V17 | Add field-to-lab target inspection','build-web.yml | V17 | Run asset and browser-bridge regression checks'):
              matches=[x for x in steps if x.get('name')==name and isinstance(x.get('run'),str)]
              if len(matches)!=1:raise SystemExit('V17 pinned step not found: '+name)
              subprocess.run(['bash','-e','-o','pipefail','-c',matches[0]['run']],check=True,env=env)
              print('build-web.yml | V18 | restored:',name,flush=True)
          PY_RESTORE
            /tmp/sanctuary-v18-base/bin/python reports/restore_v17.py
          fi

      - name: "build-web.yml | V18 | Add field motion history"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          cat > reports/patch_v18.py <<'PY_PATCH'
          from pathlib import Path
          import hashlib, json, sys

          root = Path(sys.argv[1] if len(sys.argv)>1 else 'dist/mobile')
          files = {k:root/k for k in ('index.html','game.js','motion-review.js','game.css','build-info.json')}
          html,game,review,css = (files[k].read_text(encoding='utf-8') for k in ('index.html','game.js','motion-review.js','game.css'))
          info=json.loads(files['build-info.json'].read_text(encoding='utf-8'))
          assert info['package']==17 and info['runtime']==17 and info['display_version']=='V17'
          assert info['sha256']['game.js']=='730fd30f098b9b6d8266a22df9904825d9b982468ad8812828ae761dc18c12b6'
          assert info['sha256']['motion-review.js']=='f69bfae29c287927b36f5148d393719eafb26507bca3be8645c614b2a403b7ec'
          for name,expected in info['sha256'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==expected,name

          def once(s, a, b, purpose):
              n=s.count(a)
              if n!=1: raise SystemExit(f'V18 {purpose}: expected one source, found {n}')
              return s.replace(a,b,1)

          html=once(html,'Sanctuary of Aden Mobile V17 · Field-to-Lab Motion Review','Sanctuary of Aden Mobile V18 · Field Motion Timeline','window title')
          html=once(html,'Sanctuary Mobile V17</strong>','Sanctuary Mobile V18</strong>','field version')
          html=once(html,'원본 SPR 동작 검증 V17</strong>','원본 SPR 동작 검증 V18</strong>','lab version')
          html=once(html,'V17 · 필드 연결 모션 검수','V18 · 필드 모션 이력·사망 검수','review version')
          html=once(html,'<button id="fieldInspect" type="button">이 몬스터 현재 모션 검수</button>',
           '''<button id="fieldInspect" type="button">이 몬스터 현재 모션 검수</button><button id="fieldHistory" type="button">최근 공격·피격 이력</button>''','target history button')
          html=once(html,'<div id="reviewBody" hidden>',
           '''<section id="timelinePanel" aria-label="필드 몬스터 최근 동작 기록">
           <div class="timelineHead"><strong>V18 · 최근 모션 기록 (사망 이후에도 유지)</strong><button id="timelineToggle" type="button">이력 열기</button></div>
           <div id="timelineStatus">게임에서 몬스터를 선택하면 기록이 표시됩니다.</div>
           <div id="timelineBody" hidden>
           <div class="timelineControls"><button id="timelineAll" type="button">전체 몬스터 보기</button><button id="timelineExport" type="button">이력 JSON 저장</button><button id="timelineClear" type="button">이력 지우기</button></div>
           <div id="timelineItems" role="list"></div>
           <small>마지막 160개 상태 변경만 보관합니다. 사망은 즉시 기록하고, 항목을 누르면 해당 SPR·동작·방향 슬롯으로 이동합니다. 재시작하면 기록이 초기화됩니다.</small>
           </div></section>
           <div id="reviewBody" hidden>''','motion timeline panel')

          game=once(game,'let selectedMob=null,queuedAttack=false,damageNumbers=[];',
           '''let selectedMob=null,queuedAttack=false,damageNumbers=[];
          // V18: visual-only history; never participates in hit or AI calculations.
          const fieldHistory=[],historySignatures=new Map(),FIELD_HISTORY_CAP=160;
          let fieldSpawnSeq=0,historyFocus=null;''','bounded history state')
          game=once(game,'function updateFieldMotion(){',
           '''function recordFieldMotion(m){
           if(!m||!Number.isInteger(m.spawnSerial))return;
           const key=m.mode+'|'+m.dir;
           if(historySignatures.get(m.spawnSerial)===key)return;
           historySignatures.set(m.spawnSerial,key);
           const desc=describeMotion(m.visual,m.mode,m.dir);
           fieldHistory.push({time:Number(clock.toFixed(2)),lifeId:m.spawnSerial,mobId:m.id,actor:m.visual,
            spriteId:D.actors[m.visual].sprite_id,mode:m.mode,dir:m.dir,hp:Math.ceil(m.hp),
            sprKey:desc.key,frameCount:desc.frames,source:desc.source,
            trialMode:window.SANCTUARY_MOTION_TRIAL?.mode(m.visual)||'legacy'});
           if(fieldHistory.length>FIELD_HISTORY_CAP)fieldHistory.shift();
          }
          window.SANCTUARY_FIELD_HISTORY={
           events:(scope='focus',limit=40)=>{
            const selected=scope==='all'||!historyFocus?fieldHistory:fieldHistory.filter(e=>e.lifeId===historyFocus.lifeId);
            return selected.slice(-Math.max(1,Math.min(160,Math.floor(Number(limit)||40)))).reverse().map(e=>({...e}));
           },
           focus:()=>historyFocus?{...historyFocus}:null,
           clear:()=>{fieldHistory.length=0;historySignatures.clear()},
           length:()=>fieldHistory.length
          };
          function updateFieldMotion(){''','history API')
          game=once(game,'function begin(){clock=0;motionLast.clear();',
           '''function begin(){clock=0;fieldHistory.length=0;historySignatures.clear();historyFocus=null;fieldSpawnSeq=0;motionLast.clear();''','restart isolation')
          game=once(game,'return {id,x:candidate.x,y:candidate.y,visual:ROSTER[id%ROSTER.length]',
           'return {id,spawnSerial:++fieldSpawnSeq,x:candidate.x,y:candidate.y,visual:ROSTER[id%ROSTER.length]','spawn identifier')
          game=once(game,'function targetChoose(mob,follow=true){if(!mob||mob.dead)return;selectedMob=mob;queuedAttack=false;',
           'function targetChoose(mob,follow=true){if(!mob||mob.dead)return;selectedMob=mob;historyFocus={lifeId:mob.spawnSerial,actor:mob.visual,mobId:mob.id,spriteId:D.actors[mob.visual].sprite_id};queuedAttack=false;','keep inspected target')
          game=once(game,"setMode(mob,'death');if(mob===selectedMob)targetForget()",
           "setMode(mob,'death');recordFieldMotion(mob);if(mob===selectedMob)targetForget()",'immediate death trace')
          game=once(game,'if(clock-mob.deadAt>3)mobs[mob.id]=makeMob(mob.id)',
           'if(clock-mob.deadAt>3){historySignatures.delete(mob.spawnSerial);mobs[mob.id]=makeMob(mob.id)}','bounded respawn signatures')
          game=once(game,'for(const mob of mobs)observeMotion(mob);',
           'for(const mob of mobs){recordFieldMotion(mob);observeMotion(mob)}','every original monster observation')

          review=once(review,"note.textContent='필드 선택 기록 · SPR '+world.actors[snapshot.actor].sprite_id+' · '+names[mode]+' · 방향 '+dir+' · 개체 '+String(snapshot.mobId??'?')+' · HP '+String(snapshot.hp??'?')+' · 검수 시점의 동작';",
           '''note.textContent=(Number.isFinite(snapshot.time)?'모션 이력 '+snapshot.time.toFixed(2)+'초':'필드 선택 기록')+' · SPR '+world.actors[snapshot.actor].sprite_id+' · '+names[mode]+' · 방향 '+dir+' · 개체 '+String(snapshot.mobId??'?')+' · HP '+String(snapshot.hp??'?')+' · 원본 키 '+String(snapshot.sprKey??'-')+' · '+String(snapshot.source??'검수 시점의 동작');''','history in review note')
          review=once(review,"el('fieldInspect').onclick=()=>inspectField(window.SANCTUARY_GET_FIELD_TARGET?.()||window.SANCTUARY_FIELD_TARGET);",
           '''el('fieldInspect').onclick=()=>inspectField(window.SANCTUARY_GET_FIELD_TARGET?.()||window.SANCTUARY_FIELD_TARGET);
          // Field-to-lab history uses the same actor/direction selector as live inspection.
          const historySource=()=>window.SANCTUARY_FIELD_HISTORY;
          const timeline=el('timelineItems'),timelineBody=el('timelineBody');
          let historyAll=false;
          function refreshTimeline(){
           const source=historySource(),focus=source?.focus(),events=source?.events(historyAll?'all':'focus',40)||[];
           el('timelineStatus').textContent=(historyAll?'전체 몬스터':'마지막 선택 몬스터'+(focus?' · SPR '+focus.spriteId:''))+' · '+events.length+'건 표시 · 총 '+(source?.length()||0)+'건';
           el('timelineAll').textContent=historyAll?'마지막 선택 몬스터만':'전체 몬스터 보기';
           timeline.replaceChildren();
           if(!events.length){const empty=document.createElement('div');empty.className='timelineEmpty';empty.textContent='표시할 모션 기록이 없습니다.';timeline.appendChild(empty);return}
           for(const entry of events){
            const button=document.createElement('button');button.type='button';button.className='timelineEvent';
            button.dataset.mode=entry.mode;button.dataset.life=String(entry.lifeId);
            button.textContent=entry.time.toFixed(2)+'초 · SPR '+entry.spriteId+' · '+names[entry.mode]+' · 방향 '+entry.dir+' · HP '+entry.hp+' · 키 '+entry.sprKey;
            button.setAttribute('aria-label','필드 기록 '+names[entry.mode]+' 방향 '+entry.dir+' 검수');
            button.onclick=()=>inspectField(entry);
            timeline.appendChild(button);
           }
          }
          el('timelineToggle').onclick=()=>{timelineBody.hidden=!timelineBody.hidden;el('timelineToggle').textContent=timelineBody.hidden?'이력 열기':'이력 접기';if(!timelineBody.hidden)refreshTimeline()};
          el('timelineAll').onclick=()=>{historyAll=!historyAll;refreshTimeline()};
          el('timelineClear').onclick=()=>{if(confirm('현재 플레이 중 수집한 모션 이력을 지울까요?')){historySource()?.clear();refreshTimeline()}};
          el('timelineExport').onclick=()=>saveFile('sanctuary-v18-field-motion-history.json',{schema:'sanctuary.field-motion-history.v1',version:18,focus:historySource()?.focus(),events:historySource()?.events('all',160)||[]});
          el('fieldHistory').onclick=()=>{if(el('lab').hidden)el('labOpen').click();if(timelineBody.hidden)el('timelineToggle').click();else refreshTimeline();el('timelinePanel').scrollIntoView?.({block:'start'})};
          el('labOpen').addEventListener('click',refreshTimeline);''','history controls')
          css+='''
          /* build-web.yml | V18 | Field Motion Timeline */
          #fieldHistory{display:block;width:100%;margin-top:5px;padding:6px 3px;font-size:10px;background:#345c59;color:#e9f4e7;border:1px solid #759c91;border-radius:6px;touch-action:manipulation}
          #timelinePanel{margin-top:9px;background:#122a29;border:1px solid #8aa49a;border-radius:8px;padding:8px;color:#e9e9d4}
          .timelineHead{display:flex;gap:8px;align-items:center;justify-content:space-between}
          .timelineHead strong{font-size:12px;color:#f4e0af}.timelineHead button{font-size:11px;padding:7px}
          #timelineStatus{font-size:11px;line-height:1.5;margin-top:6px;color:#c7d9ca}
          #timelineBody[hidden]{display:none}#timelineBody{display:grid;gap:7px;margin-top:7px}
          .timelineControls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
          .timelineControls button{padding:8px 3px;font-size:10px;min-width:0}
          #timelineItems{display:grid;gap:5px;max-height:230px;overflow-y:auto;overscroll-behavior:contain}
          .timelineEvent{text-align:left;font-size:11px;padding:8px 7px;background:#274441;border:1px solid #536f64;border-radius:6px;line-height:1.45;min-height:38px}
          .timelineEvent[data-mode="death"]{border-color:#ce8b84;color:#ffccc4}
          .timelineEvent[data-mode="hit"]{border-color:#c5aa77;color:#ffe6b8}
          .timelineEmpty{font-size:11px;padding:9px;text-align:center;color:#c7d9ca}
          #timelineBody small{font-size:10px;line-height:1.5;color:#b6c5b9}
          @media (orientation:landscape) and (max-height:600px){#timelineItems{max-height:120px}#fieldHistory{padding:4px 3px}}
          '''
          for name,value in [('index.html',html),('game.js',game),('motion-review.js',review),('game.css',css)]:
              files[name].write_text(value,encoding='utf-8')
          info.update(package=18,runtime=18,version='18',display_version='V18',previous_version='V17',previous_run=39101354382)
          info['sha256']={name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in info['sha256']}
          files['build-info.json'].write_text(json.dumps(info,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          with (root/'README_KO.txt').open('a',encoding='utf-8') as f:
              f.write('\nV18 | build-web.yml | Recent field motion history (160 events), immediate death capture, actor/direction inspection, original combat unchanged.\n')
          print('build-web.yml | V18 | PATCH PASS',len(game),len(review),info['sha256']['game.js'])
          PY_PATCH
          python3 -m py_compile reports/patch_v18.py
          python3 reports/patch_v18.py dist/mobile
          node --check dist/mobile/game.js
          node --check dist/mobile/motion-review.js

      - name: "build-web.yml | V18 | Validate combat, assets and history"
        shell: bash
        run: |
          set -euo pipefail
          cat > reports/verify_v18.py <<'PY_VERIFY'
          from pathlib import Path
          import hashlib,json,sys
          root=Path(sys.argv[1] if len(sys.argv)>1 else 'dist/mobile')
          info=json.loads((root/'build-info.json').read_text(encoding='utf-8'))
          world=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          pack=json.loads((root/'monster-pack.json').read_text(encoding='utf-8'))
          assert info['package']==18 and info['runtime']==18 and info['display_version']=='V18'
          assert info['previous_version']=='V17' and info['previous_run']==39101354382
          assert len(world['actors'])==8 and len(world['map']['flags'])==36864
          assert len(world['map']['objects'])==59963
          assert len(list((root/'assets').glob('*.png')))==3616
          assert len(list((root/'tiles').glob('*.png')))==218
          assert len(list((root/'motion-gifs/v18').glob('*.gif')))==40
          assert info['sha256']['manifest.json']=='3f1cdb0f22376e763888628465b6601f5e9c72eeda8a9194a356dcba2c205c95'
          assert info['sha256']['game-data.js']=='1a50224f083c193c33eab137798bfb6ddccf1b1dea54f3d9055e601c0fbabf57'
          assert info['sha256']['monster-pack.json']=='06e28349f7ca6da1fe2bda9b28653cb0e2f08c13c998b02de7689ffd6cd8ea26'
          assert pack['actors']['mob56']['provenance']['actionDefinitionsVerified'] is False
          for name,digest in info['sha256'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest,name
          html=(root/'index.html').read_text(encoding='utf-8')
          assert all(x in html for x in ('Sanctuary Mobile V18','원본 SPR 동작 검증 V18','V18 · 필드 모션 이력·사망 검수','id="timelinePanel"','id="timelineItems"','id="fieldHistory"'))
          assert html.index('src="game.js"')<html.index('src="motion-review.js"')
          game=(root/'game.js').read_text(encoding='utf-8')
          assert 'const fieldHistory=[]' in game and 'FIELD_HISTORY_CAP=160' in game
          assert "setMode(mob,'death');recordFieldMotion(mob);if(mob===selectedMob)targetForget()" in game
          assert 'historyFocus={lifeId:mob.spawnSerial' in game
          assert "window.SANCTUARY_FIELD_HISTORY=" in game
          assert "mob.attackCd=1.35" in game and "hero.attackCd=.54" in game
          print('build-web.yml | V18 VERIFIED: original map, sprites, 40 GIFs, unchanged attack rules, history and death capture')
          PY_VERIFY
          python3 reports/verify_v18.py dist/mobile
          cat > reports/smoke_v18.cjs <<'JS_SMOKE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const root=process.argv[2]||'dist/mobile',read=n=>fs.readFileSync(root+'/'+n,'utf8');
          const world=JSON.parse(read('manifest.json')),pack=JSON.parse(read('monster-pack.json'));
          const nodes=new Map(),listeners={},storage=new Map();let saved=null,download='';
          class NodeEl{
           constructor(id){this.id=id;this.hidden=['lab','reviewBody','timelineBody','reviewFieldSnapshot'].includes(id);this.dataset={};this.children=[];this.disabled=false;this.value='';this.textContent='';this.style={};this.attrs={};this.classList={toggle(){},add(){},remove(){}};this.width=220;this.height=170;this.events={}}
           appendChild(x){this.children.push(x);return x}replaceChildren(...xs){this.children=xs}remove(){}
           setAttribute(k,v){this.attrs[k]=v}addEventListener(k,f){this.events[k]=f}scrollIntoView(){this.scrolled=true}
           getContext(){return{fillRect(){},drawImage(){},fillText(){},imageSmoothingEnabled:false}}
           click(){if(this.download)download=this.download;this.onclick?.();this.events.click?.()}
          }
          const el=id=>{if(!nodes.has(id))nodes.set(id,new NodeEl(id));return nodes.get(id)};
          const document={getElementById:el,createElement:id=>new NodeEl(id),body:new NodeEl('body'),hidden:false,addEventListener(k,f){listeners[k]=f}};
          const history=[
           {time:4.3,lifeId:2,mobId:1,actor:'mob56',spriteId:56,mode:'death',dir:4,hp:0,sprKey:'28',source:'기존 기본 추정'},
           {time:4.0,lifeId:2,mobId:1,actor:'mob56',spriteId:56,mode:'hit',dir:4,hp:12,sprKey:'20',source:'기존 기본 추정'},
           {time:3.7,lifeId:7,mobId:6,actor:'mob1022',spriteId:1022,mode:'attack',dir:2,hp:35,sprKey:'10',source:'기존 기본 추정'}
           ];
          const focus={lifeId:2,mobId:1,actor:'mob56',spriteId:56};
          const window={SANCTUARY_MANIFEST:world,SANCTUARY_MONSTER_PACK:pack,SANCTUARY_FIELD_HISTORY:{
           events:(scope='focus',limit=40)=>history.filter(e=>scope==='all'||e.lifeId===focus.lifeId).slice(0,limit),
           focus:()=>focus,clear:()=>{history.length=0},length:()=>history.length},
           SANCTUARY_GET_FIELD_TARGET:()=>({actor:'mob56',mode:'walk',dir:3,mobId:1,spriteId:56,hp:23})};
          el('labOpen').onclick=()=>{el('lab').hidden=false};el('labActor').value='mob56';
          const env={window,document,Math,Number,Object,Array,String,JSON,Boolean,performance:{now:()=>1000},requestAnimationFrame:()=>1,Image:class{},Blob,URL:{createObjectURL(b){saved=b;return'blob:mock'},revokeObjectURL(){}},setTimeout(){},localStorage:{getItem:k=>storage.get(k)||null,setItem:(k,v)=>storage.set(k,v)},console,confirm:()=>true,alert:m=>{throw Error(m)}};
          vm.runInNewContext(read('motion-review.js'),env,{timeout:10000});
          assert(window.SANCTUARY_REVIEW_READY);
          el('labOpen').click();el('timelineToggle').click();
          assert.equal(el('timelineBody').hidden,false);
          assert.equal(el('timelineItems').children.length,2);
          assert(el('timelineStatus').textContent.includes('SPR 56'));
          el('timelineItems').children[0].click();
          assert.equal(el('reviewBody').hidden,false);
          assert.equal(el('reviewActor').value,'mob56');
          assert(el('reviewSelection').textContent.startsWith('사망 · 방향 4'));
          assert(el('reviewFieldSnapshot').textContent.includes('4.30초'));
          el('timelineAll').click();assert.equal(el('timelineItems').children.length,3);
          el('timelineItems').children[2].click();assert.equal(el('reviewActor').value,'mob1022');
          assert(el('reviewSelection').textContent.includes('공격 · 방향 2'));
          assert.equal(el('reviewTrialAll').disabled,true);
          el('fieldHistory').click();assert(el('timelinePanel').scrolled);
          (async()=>{
           el('timelineExport').click();assert.equal(download,'sanctuary-v18-field-motion-history.json');
           const data=JSON.parse(await saved.text());assert.equal(data.schema,'sanctuary.field-motion-history.v1');assert.equal(data.events.length,3);
           el('timelineClear').click();assert.equal(history.length,0);assert.equal(el('timelineItems').children.length,1);
           el('fieldInspect').click();assert(el('reviewSelection').textContent.includes('이동 · 방향 3'));
           assert(!el('reviewFieldSnapshot').textContent.includes('4.30초'));
           assert.equal(window.SANCTUARY_MOTION_TRIAL.approvedCount('mob56'),0);
           console.log('build-web.yml | V18 PASS: focus filter, death/hit review, other actor, record navigation, export, clear, live target');
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS_SMOKE
          node --check reports/smoke_v18.cjs
          node reports/smoke_v18.cjs dist/mobile
          printf '%s\n' 'build-web.yml | V18 | original combat and map unchanged; field motion history and death replay tested.' >> "$GITHUB_STEP_SUMMARY"

      - name: "build-web.yml | V18 | Upload playable game"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Mobile-V18-Field-Motion-History
          path: dist/mobile/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: "build-web.yml | V18 | Upload diagnostics"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Mobile-V18-Diagnostics
          path: reports/
          if-no-files-found: warn
          retention-days: 14
