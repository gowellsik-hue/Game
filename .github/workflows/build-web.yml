          def encode_rle(raw):
              packed=bytearray();i=0
              while i<len(raw):
                  value=raw[i];j=i+1
                  while j<len(raw) and raw[j]==value:j+=1
                  packed.append(value)
                  count=j-i
                  while count>=128:packed.append((count&127)|128);count>>=7
                  packed.append(count)
                  i=j
              return base64.b64encode(packed).decode('ascii')
          
          
          def decode_rle(s):
              raw=base64.b64decode(s);out=bytearray();i=0
              while i<len(raw):
                  value=raw[i];i+=1
                  count=0;shift=0
                  while 1:
                      b=raw[i];i+=1;count|=(b&127)<<shift
                      if not b&128:break
                      shift+=7
                  out.extend([value]*count)
              return bytes(out)
          
