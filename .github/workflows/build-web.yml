      - name: Validate authentic map and mobile motion package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY'
          from pathlib import Path
          import json,re
          root=Path('dist/mobile')
          data=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          html=(root/'index.html').read_text(encoding='utf-8')
          world=data.get('map')
          if not world or world['id']!=4 or world['size']!=[192,192] or len(world['blocks'])!=9:
              raise SystemExit('Original Map 4 data missing')
          if len(world['flags'])!=192*192 or len(world['floorA'])!=192*192 or len(world['floorB'])!=192*192:
              raise SystemExit('Unexpected S32 tile grid size')
          if world['collision_count']<=0 or world['safe_count']<=0:
              raise SystemExit('Map traversal and safe-zone attributes not decoded')
          if len(world['tileColors'])<100:
              raise SystemExit('Original Tile.pak sampled colors missing')
          if not all(str(k) in item['actions'] for item in data['actors'].values() for k in range(8)):
              raise SystemExit('V3 sprite fallback keys missing')
          files=[f for a in data['actors'].values() for frames in a['actions'].values() for f in frames]
          if len(files)<32 or any(not (root/f).is_file() or (root/f).stat().st_size<80 for f in files):
              raise SystemExit('PNG output missing or invalid')
          match=re.search(r'<script>([\s\S]*?)</script>',html)
          if match is None or 'id="minimap"' not in html or 'id="lab"' not in html:
              raise SystemExit('Mobile map UI or motion lab missing')
          if '/*MANIFEST_DATA*/' in html:
              raise SystemExit('Manifest substitution failed')
          Path('reports/game.js').write_text(match.group(1),encoding='utf-8')
          print('MAP 4:',len(world['blocks']),'S32 blocks;',world['collision_count'],'blocked cells;',world['safe_count'],'safe cells')
          print('SPR PNG files:',len(files),'estimated tile colors:',len(world['tileColors']))
          PY_VERIFY
          node --check reports/game.js
          {
            echo 'Sanctuary Mobile V4: Original Map 4'
            echo 'S32 Layer3 passability and safe-area flags are connected to movement and enemy AI.'
            echo 'S32 Layer1 indices and Tile.pak color samples provide preview terrain.'
            echo 'TIL textures are not yet fully reconstructed and monster sprite identity is not verified.'
            echo 'Original V3 SPR inspector, JSON motion mapping, touch pad, attacks and potions remain included.'
            echo 'The separate SLKnight Pages deployment is not modified.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload independent mobile V4
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Mobile-V4-Original-Map4
          path: dist/mobile/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Mobile-V4-Diagnostics
          path: reports/
          if-no-files-found: warn
          retention-days: 14
