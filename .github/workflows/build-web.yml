
name: Sanctuary of Aden Mobile V3 Motion Lab

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanctuary-mobile-v3
  cancel-in-progress: false

jobs:
  build:
    name: Build original SPR motion lab and playable mobile preview
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Prepare runner
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip unzip p7zip-full
          mkdir -p downloads client src reports dist/mobile
          df -h .

      - name: Download verified 46 archive pieces
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" --pattern 'Sanctuary.of.Aden.-.Copy.*' --dir downloads
          python3 - <<'PY_PARTS'
          from pathlib import Path
          base = Path('downloads')
          parts = [base / f'Sanctuary.of.Aden.-.Copy.z{i:02d}' for i in range(1, 46)]
          parts.append(base / 'Sanctuary.of.Aden.-.Copy.zip')
          if any(not p.is_file() for p in parts):
              raise SystemExit('Original archive is incomplete')
          if any(p.stat().st_size != 100000000 for p in parts[:-1]):
              raise SystemExit('One of the 45 segments has unexpected size')
          if parts[-1].stat().st_size <= 0:
              raise SystemExit('Final ZIP segment is empty')
          print('Verified original archive:', len(parts), 'pieces')
          PY_PARTS

      - name: Restore Sprite.idx and Sprite.pak
        shell: bash
        run: |
          set -euo pipefail
          if ! zip -s 0 downloads/Sanctuary.of.Aden.-.Copy.zip --out joined.zip > reports/reconstruct.log 2>&1; then
            tail -n 60 reports/reconstruct.log
            exit 1
          fi
          test -s joined.zip
          rm -rf downloads
          if ! 7z x joined.zip -oclient -y '-ir!Sprite.idx' '-ir!Sprite.pak' > reports/extract.log 2>&1; then
            tail -n 80 reports/extract.log
            exit 1
          fi
          rm -f joined.zip
          python3 - <<'PY_PATH'
          from pathlib import Path
          import os
          paths = sorted(Path('client').rglob('Sprite.idx'))
          if len(paths) != 1:
              raise SystemExit(f'Unexpected Sprite.idx count: {len(paths)}')
          idx = paths[0]
          pak = idx.with_suffix('.pak')
          if not pak.is_file() or not pak.stat().st_size:
              raise SystemExit(f'Sprite.pak unavailable: {pak}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'SPR_IDX={idx.resolve()}\n')
              env.write(f'SPR_PAK={pak.resolve()}\n')
          print('IDX:', idx, idx.stat().st_size)
          print('PAK:', pak, pak.stat().st_size)
          PY_PATH
          df -h .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PNG conversion library
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'Pillow==11.3.0'

      - name: Convert action-key catalog and build mobile motion lab
        shell: bash
        run: |
          set -euo pipefail
          cat > src/builder.py <<'PY_BUILDER'
          import argparse
          import csv
          import json
          import re
          import struct
          import zipfile
          from pathlib import Path
          from PIL import Image

          IDS = {'hero': 2786, 'enemy': 3215}

          def u16(data, offset):
              return struct.unpack_from('<H', data, offset)[0]

          def u32(data, offset):
              return struct.unpack_from('<I', data, offset)[0]

          def rgba(c):
              return ((c >> 10 & 31) * 255 // 31,
                      (c >> 5 & 31) * 255 // 31,
                      (c & 31) * 255 // 31, 255)

          def unpack_spr(data, limit=4):
              if len(data) < 20:
                  raise ValueError('short SPR')
              pos = 0
              count = data[pos]
              pos += 1
              palette = None
              if count == 255:
                  n = data[pos] or 256
                  pos += 1
                  palette = list(struct.unpack_from('<' + str(n) + 'H', data, pos))
                  pos += n * 2
                  count = data[pos]
                  pos += 1
              if not 1 <= count <= 200:
                  raise ValueError('invalid frame count')
              frames = []
              for _ in range(count):
                  pos += 12
                  refs = []
                  n = u16(data, pos)
                  pos += 2
                  if n > 1000:
                      raise ValueError('invalid tile references')
                  for _ in range(n):
                      a, b, typ, ix = struct.unpack_from('<bbBH', data, pos)
                      pos += 5
                      refs.append((a, b, ix))
                  frames.append(refs)
              nblocks = u32(data, pos)
              pos += 4
              if nblocks > 100000:
                  raise ValueError('invalid block count')
              offsets = struct.unpack_from('<' + str(nblocks) + 'I', data, pos)
              pos += 4 * nblocks + 4
              start = pos
              required = {ix for fr in frames[:limit] for _, _, ix in fr}
              if any(ix >= nblocks for ix in required):
                  raise ValueError('block id outside table')
              blocks = {}
              for ix in required:
                  p = start + offsets[ix]
                  sx, sy, _, rows = struct.unpack_from('<BBBB', data, p)
                  p += 4
                  if sx > 24 or sy > 24 or sy + rows > 24:
                      raise ValueError('invalid block dimensions')
                  pix = []
                  for y in range(sy, sy + rows):
                      x = sx
                      segs = data[p]
                      p += 1
                      for _ in range(segs):
                          x += data[p] // 2
                          length = data[p + 1]
                          p += 2
                          if x + length > 24:
                              raise ValueError('block row out of range')
                          for _ in range(length):
                              if palette is not None:
                                  raw = palette[data[p]]
                                  p += 1
                              else:
                                  raw = u16(data, p)
                                  p += 2
                              if raw != 32768:
                                  pix.append((x, y, rgba(raw)))
                              x += 1
                  blocks[ix] = pix
              layouts = []
              for refs in frames[:limit]:
                  if not refs:
                      continue
                  places = []
                  for a, b, ix in refs:
                      adj = a - 1 if a < 0 else a
                      half = int(adj / 2)
                      places.append((24 * (b + a - half), 12 * (b - half), ix))
                  layouts.append(places)
              if not layouts:
                  raise ValueError('no drawn frames')
              left = min(x for layout in layouts for x, _, _ in layout)
              top = min(y for layout in layouts for _, y, _ in layout)
              right = max(x + 24 for layout in layouts for x, _, _ in layout)
              bottom = max(y + 24 for layout in layouts for _, y, _ in layout)
              w, h = right - left, bottom - top
              if not (1 <= w <= 512 and 1 <= h <= 512):
                  raise ValueError('SPR frame exceeds safety bounds')
              result = []
              for places in layouts:
                  image = Image.new('RGBA', (w, h), (0, 0, 0, 0))
                  pix = image.load()
                  for x, y, ix in places:
                      for bx, by, color in blocks[ix]:
                          pix[x - left + bx, y - top + by] = color
                  result.append(image)
              if not result:
                  raise ValueError('no drawn frames')
              return result

          def catalog_idx(data):
              count = u32(data, 0)
              if len(data) != 4 + count * 28:
                  raise ValueError('unsupported Sprite.idx format')
              result = {}
              for j in range(count):
                  pos = 4 + j * 28
                  name = data[pos + 4:pos + 24].split(b'\x00', 1)[0]
                  try:
                      name = name.decode('ascii').lower().replace('\\', '/').split('/')[-1]
                  except UnicodeDecodeError:
                      continue
                  match = re.fullmatch(r'(\d+)-(\d+)\.spr', name)
                  if match and int(match[1]) in IDS.values():
                      name_key = (int(match[1]), int(match[2]))
                      if name_key in result:
                          raise ValueError('duplicate sprite in main pak: ' + name)
                      result[name_key] = (u32(data, pos), u32(data, pos + 24))
              return result

          def build(args):
              root = args.output
              assets = root / 'assets'
              assets.mkdir(parents=True, exist_ok=True)
              source = {}
              if args.sample_zip:
                  z = zipfile.ZipFile(args.sample_zip)
                  for name in z.namelist():
                      match = re.fullmatch(r'sprite_samples/(\d+)/Sprite__(\d+)-(\d+)\.spr', name)
                      if match and match[1] == match[2] and int(match[1]) in IDS.values():
                          source[(int(match[1]), int(match[3]))] = name
                  def read(key):
                      return z.read(source[key])
              else:
                  source = catalog_idx(args.idx.read_bytes())
                  pak = args.pak.open('rb')
                  size = args.pak.stat().st_size
                  def read(key):
                      pos, length = source[key]
                      if not (0 < length <= 20000000 and 0 <= pos <= size - length):
                          raise ValueError('invalid PAK record')
                      pak.seek(pos)
                      data = pak.read(length)
                      if len(data) != length:
                          raise ValueError('short PAK read')
                      return data
              results = {}
              errors = []
              for actor, sid in IDS.items():
                  choices = sorted(key[1] for key in source if key[0] == sid)
                  if not choices:
                      raise ValueError(f'No SPR files found for {sid}')
                  actions = {}
                  for key in choices:
                      try:
                          frames = unpack_spr(read((sid, key)), limit=4)
                          paths = []
                          for i, image in enumerate(frames):
                              name = f'{actor}-{sid}-{key}-{i}.png'
                              image.save(assets / name, optimize=True)
                              paths.append('assets/' + name)
                          actions[str(key)] = paths
                      except Exception as exc:
                          errors.append({'actor': actor, 'sprite_id': sid, 'key': key, 'reason': str(exc)[:180]})
                  if len(actions) < 8 or not all(str(x) in actions for x in range(8)):
                      raise ValueError('Required 0..7 prototype sprites unavailable for ' + actor)
                  results[actor] = {
                      'sprite_id': sid,
                      'actions': actions,
                      'total_indexed': len(choices),
                      'converted': len(actions),
                      'keys_are_verified_actions': False
                  }
              if args.sample_zip:
                  z.close()
              else:
                  pak.close()
              catalog = {
                  'version': 3,
                  'status': 'SPR_MOTION_VERIFICATION_LAB',
                  'actors': results,
                  'provenance': 'Sanctuary of Aden original client Sprite.idx / Sprite.pak',
                  'annotation': 'Sprite numeric keys and performer IDs are not verified identities, directions, or animation categories',
                  'decode_errors': len(errors)
              }
              (root / 'manifest.json').write_text(json.dumps(catalog, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
              html = args.template.read_text(encoding='utf-8')
              needle = '/*MANIFEST_DATA*/'
              if html.count(needle) != 1:
                  raise ValueError('HTML manifest location was not unique')
              html = html.replace(needle, json.dumps(catalog, ensure_ascii=False, separators=(',', ':')))
              (root / 'index.html').write_text(html, encoding='utf-8')
              with (root / 'decode_errors.csv').open('w', newline='', encoding='utf-8-sig') as f:
                  w = csv.DictWriter(f, fieldnames=['actor', 'sprite_id', 'key', 'reason'])
                  w.writeheader()
                  w.writerows(errors)
              with (root / 'sprite_inventory.csv').open('w', newline='', encoding='utf-8-sig') as f:
                  w = csv.writer(f)
                  w.writerow(['actor', 'sprite_id', 'key', 'png_frames', 'evidence'])
                  for actor, item in results.items():
                      for key, paths in item['actions'].items():
                          w.writerow([actor, item['sprite_id'], key, len(paths), 'SPR image decoded; actual motion identity unverified'])
              (root / 'README_KO.txt').write_text(
                  'Sanctuary of Aden V3 모바일 모션 연구실\n'
                  'index.html을 열어 모바일 테스트 게임을 실행할 수 있습니다.\n'
                  '연구실에서 SPR 숫자키를 직접 확인하고 각 방향/동작에 연결할 수 있습니다.\n'
                  '저장한 매핑은 브라우저 로컬에만 적용되며 JSON으로 내보낼 수 있습니다.\n'
                  '0~7의 초기 표시 매핑은 검증되지 않은 임시값입니다.\n'
                  '이 빌드는 원작 맵·모션·밸런스를 완성한 버전이 아닙니다.\n', encoding='utf-8')
              print(json.dumps({'total_png': len(list(assets.glob('*.png'))),
                                'keys_converted': {actor: obj['converted'] for actor, obj in results.items()},
                                'decode_errors': len(errors)}, ensure_ascii=False))

          if __name__ == '__main__':
              parser = argparse.ArgumentParser()
              parser.add_argument('--idx', type=Path)
              parser.add_argument('--pak', type=Path)
              parser.add_argument('--sample-zip', type=Path)
              parser.add_argument('--template', type=Path, required=True)
              parser.add_argument('--output', type=Path, required=True)
              opt = parser.parse_args()
              if not opt.sample_zip and (not opt.idx or not opt.pak):
                  parser.error('Use --idx and --pak or --sample-zip')
              build(opt)
          PY_BUILDER
          cat > src/index.template.html <<'HTML_GAME'
          <!doctype html>
          <html lang="ko">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
          <title>Sanctuary of Aden Mobile V3</title>
          <style>
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          html,body{height:100%;margin:0;overflow:hidden;background:#101a1b;color:#eee7d5;font:14px system-ui,'Malgun Gothic',sans-serif}
          button,select,input{font:inherit;color:inherit}
          button{cursor:pointer;touch-action:manipulation;background:#334b47;border:1px solid #b1a77a82;padding:10px;border-radius:10px;color:#faf3da;font-weight:700}
          button:active{filter:brightness(1.2)}
          button.selected{background:#81744d;border-color:#ffe0a1}
          button.good{background:#376344;border-color:#a1d49a}
          #stage{position:fixed;inset:0;touch-action:none;overflow:hidden}
          #field{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}
          #hud{position:absolute;left:8px;top:calc(7px + env(safe-area-inset-top));pointer-events:none;background:#0c1b1dde;padding:9px 11px;border:1px solid #9ca67d88;border-radius:11px;min-width:146px}
          #hud strong{display:block;color:#fce19b;font-size:14px}
          #hud small{font-size:11px;color:#adc5be}
          #life{height:10px;border-radius:8px;border:1px solid #a0aaa0;overflow:hidden;background:#472825;margin:6px 0}
          #lifebar{width:100%;height:100%;background:#df7770}
          #counts{margin-top:4px;font-size:12px}
          #labOpen{position:absolute;right:9px;top:calc(8px + env(safe-area-inset-top));background:#4d664c}
          #tip{position:absolute;top:calc(82px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:6px 10px;background:#10201eee;color:#f1e8ca;border:1px solid #a3a0788e;border-radius:9px;max-width:75vw;text-align:center;font-size:11px;pointer-events:none;transition:opacity .3s}
          #pad{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:12px;width:140px;height:140px;border:2px solid #c1d2bf88;border-radius:50%;background:#193332aa;touch-action:none}
          #knob{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:59px;height:59px;border-radius:50%;border:2px solid #d1bf85;background:#45655b;pointer-events:none}
          #pad span{position:absolute;bottom:4px;left:0;right:0;font-size:10px;text-align:center;color:#eee8c0;pointer-events:none}
          #keys{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));right:12px;display:grid;grid-template-columns:75px 84px;gap:7px}
          #hitBtn{grid-column:2;grid-row:1/3;background:#874e3f;font-size:18px;border-radius:22px}
          #again{position:absolute;right:10px;top:calc(58px + env(safe-area-inset-top));padding:6px 9px;font-size:11px}
          #lab{position:fixed;inset:0;z-index:30;background:#0d1619f7;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 9px) 10px calc(env(safe-area-inset-bottom) + 8px);gap:8px;overflow:hidden}
          #lab[hidden]{display:none}
          #labHead{display:flex;gap:8px;justify-content:space-between;align-items:center}
          #labHead strong{font-size:17px;color:#ffe5a5}
          #labScroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding-bottom:10px}
          #labTools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
          #labTools label{font-size:11px;color:#cdd6ca;display:flex;flex-direction:column;gap:3px}
          #labTools select,#labTools input,#searchKey{width:100%;background:#15272c;border:1px solid #77877d;padding:9px 6px;border-radius:8px;min-width:0}
          #labPreview{display:block;width:100%;height:196px;image-rendering:pixelated;background:#243d32;border:1px solid #6a7469;border-radius:10px;touch-action:none}
          #previewInfo,#mapInfo{font-size:12px;color:#e5e3cd;line-height:1.5;padding:7px 0;white-space:pre-wrap}
          #labActions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
          #paging{display:flex;gap:6px;align-items:center;justify-content:space-between;margin:10px 0}
          #paging button{padding:7px}
          #gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
          #gallery button{padding:4px;min-width:0;text-align:center;font-size:11px;overflow:hidden}
          #gallery img{height:72px;width:100%;object-fit:contain;image-rendering:pixelated;display:block;background:#2e4037;border-radius:5px}
          #gallery span{display:block;padding-top:4px}
          #exports{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
          #exports button,#exports label{flex:1;min-width:110px;font-size:12px;padding:9px 6px;text-align:center;border:1px solid #8e987c;border-radius:8px;background:#334947}
          #exports input{display:none}
          #note{color:#d8bb83;font-size:12px;line-height:1.5;margin:6px 0}
          @media(max-width:385px){#pad{width:115px;height:115px}#knob{width:50px;height:50px}#keys{grid-template-columns:63px 72px;gap:5px}#keys button{padding:8px 4px;font-size:11px}#hitBtn{font-size:14px!important}#gallery{grid-template-columns:repeat(3,minmax(0,1fr))}}
          @media(max-height:445px){#pad{width:111px;height:111px}#keys{grid-template-columns:66px 76px}#hud{padding:5px 7px}#labPreview{height:130px}}
          </style>
          </head>
          <body>
          <div id="stage">
          <canvas id="field"></canvas>
          <div id="hud"><strong>Sanctuary Mobile V3</strong><small>SPR 동작 실험판</small><div id="life"><div id="lifebar"></div></div><small id="hpText">HP 100/100</small><div id="counts">처치 0</div><small id="gameState">시범 캐릭터</small></div>
          <button id="labOpen" type="button">SPR 모션 연구실</button>
          <button id="again" type="button">다시 시작</button>
          <div id="tip">이동·공격 테스트 · 동작은 연구실에서 지정</div>
          <div id="pad"><div id="knob"></div><span>이동</span></div>
          <div id="keys"><button id="autoBtn" class="good">자동 ON</button><button id="hitBtn">공격</button><button id="potion">물약 10</button></div>
          </div>
          <div id="lab" hidden>
          <div id="labHead"><strong>원본 SPR 동작 검증 V3</strong><button id="labClose">게임 복귀</button></div>
          <div id="labScroll">
          <div id="note">현재 SPR 번호는 원본 그래픽 키이며 걷기·공격·8방향을 뜻한다는 근거가 없습니다. 직접 재생해 확인한 키만 아래 슬롯에 지정하세요.</div>
          <div id="labTools">
          <label>원본 에셋<select id="labActor"><option value="hero">2786 (시범 플레이어)</option><option value="enemy">3215 (시범 몬스터)</option></select></label>
          <label>배정할 동작<select id="labMode"><option value="idle">대기</option><option value="walk">이동</option><option value="attack">공격</option><option value="hit">피격</option><option value="death">사망</option></select></label>
          <label>게임 방향 슬롯<select id="labDir"><option value="0">방향 0</option><option value="1">방향 1</option><option value="2">방향 2</option><option value="3">방향 3</option><option value="4">방향 4</option><option value="5">방향 5</option><option value="6">방향 6</option><option value="7">방향 7</option></select></label>
          <label>SPR 숫자키<input id="searchKey" type="number" min="0" max="99999" value="0"></label>
          <label>프레임 간격<select id="labSpeed"><option value="70">70 ms</option><option value="110" selected>110 ms</option><option value="160">160 ms</option><option value="240">240 ms</option><option value="350">350 ms</option></select></label>
          <label>프레임 선택<select id="labFrame"><option value="-1">자동 재생</option><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label>
          </div>
          <div id="previewInfo"></div>
          <canvas id="labPreview" width="600" height="330"></canvas>
          <div id="labActions"><button id="assign" class="good">이 방향에 연결</button><button id="unassign">이 슬롯 지우기</button></div>
          <div id="mapInfo"></div>
          <div id="paging"><button id="prevPage">이전</button><span id="pageInfo">1 / 1</span><button id="nextPage">다음</button></div>
          <div id="gallery"></div>
          <div id="exports"><button id="downloadMap">매핑 JSON 내보내기</button><label>JSON 불러오기<input id="uploadMap" type="file" accept=".json,application/json"></label><button id="clearMap">매핑 전체 초기화</button></div>
          <div id="note">매핑은 현재 브라우저에만 저장됩니다. 원본 동작 목록의 의미를 자동 판정하지 않습니다. 저장한 매핑은 즉시 게임의 대기·이동·공격·피격·사망 표시 순서에 적용됩니다.</div>
          </div>
          </div>
          <script id="manifest" type="application/json">/*MANIFEST_DATA*/</script>
          <script>
          (()=>{'use strict';
          const data=JSON.parse(document.getElementById('manifest').textContent),get=id=>document.getElementById(id);
