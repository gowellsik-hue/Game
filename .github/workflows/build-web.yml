name: Deploy modern DiabloWebAI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout DiabloWebAI
        uses: actions/checkout@v4
        with:
          repository: levidehaan/diablowebai
          ref: 4becbb4c81323dc8982504ecb2a5f338434c9772
          path: app

      - name: Fix upstream package mismatch
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("app/package.json")

          data = json.loads(
              p.read_text(
                  encoding="utf-8"
              )
          )

          removed = data.get(
              "devDependencies",
              {}
          ).pop(
              "canvas",
              None
          )

          p.write_text(
              json.dumps(
                  data,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print(
              "Removed canvas:",
              removed
          )
          PY

      - name: Disable service worker registration
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "app/src/index.js"
          )

          text = p.read_text(
              encoding="utf-8"
          )

          old = """serviceWorker.register({
            onUpdate() {
            },
          });"""

          if old not in text:
              raise SystemExit(
                  "ERROR: service worker "
                  "registration block not found"
              )

          text = text.replace(
              old,
              "serviceWorker.unregister();",
              1
          )

          p.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "SERVICE_WORKER_DISABLED"
          )
          PY

      - name: Patch webpack file emission
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          webpack = Path(
              "app/config/webpack.config.js"
          )

          text = webpack.read_text(
              encoding="utf-8"
          )

          text = text.replace(
              "futureEmitAssets: true,",
              "futureEmitAssets: false,",
              1
          )

          webpack.write_text(
              text,
              encoding="utf-8"
          )

          build = Path(
              "app/scripts/build.js"
          )

          text = build.read_text(
              encoding="utf-8"
          )

          marker = (
              "const isInteractive = "
              "process.stdout.isTTY;"
          )

          helper = r'''
          const isInteractive = process.stdout.isTTY;

          function forceWriteAssets(stats) {
            const assets =
              stats &&
              stats.compilation &&
              stats.compilation.assets
                ? stats.compilation.assets
                : {};

            const names =
              Object.keys(assets);

            console.log(
              "[FORCE-EMIT] asset count:",
              names.length
            );

            if (names.length === 0) {
              throw new Error(
                "Webpack compilation produced no assets"
              );
            }

            for (const name of names) {
              const asset =
                assets[name];

              let source =
                asset.source();

              if (
                source instanceof Uint8Array &&
                !Buffer.isBuffer(source)
              ) {
                source =
                  Buffer.from(source);
              }

              if (
                typeof source !== "string" &&
                !Buffer.isBuffer(source)
              ) {
                source =
                  Buffer.from(source);
              }

              const output =
                path.join(
                  paths.appBuild,
                  name
                );

              fs.ensureDirSync(
                path.dirname(output)
              );

              fs.writeFileSync(
                output,
                source
              );

              console.log(
                "[FORCE-EMIT]",
                name
              );
            }
          }
          '''

          if marker not in text:
              raise SystemExit(
                  "ERROR: build marker not found"
              )

          text = text.replace(
              marker,
              helper,
              1
          )

          resolve_marker = (
              "      return resolve({\n"
              "        stats,"
          )

          replacement = (
              "      forceWriteAssets(stats);\n"
              "\n"
              "      return resolve({\n"
              "        stats,"
          )

          if resolve_marker not in text:
              raise SystemExit(
                  "ERROR: resolve marker not found"
              )

          text = text.replace(
              resolve_marker,
              replacement,
              1
          )

          build.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "FORCE_EMIT_PATCH_OK"
          )
          PY

          grep -n \
            "futureEmitAssets" \
            app/config/webpack.config.js

          grep -n \
            "forceWriteAssets" \
            app/scripts/build.js

      - name: Verify modern WASM loader
        shell: bash
        run: |
          set -e

          grep -n \
            "await module.ready" \
            app/src/api/game.worker.js

          grep -n \
            "return module" \
            app/src/api/game.worker.js

          echo "MODERN_LOADER_OK"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        shell: bash
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
        run: |
          set -e

          npm ci \
            --legacy-peer-deps \
            --no-audit \
            --no-fund \
            --ignore-scripts

      - name: Build application
        working-directory: app
        shell: bash
        env:
          PUBLIC_URL: /Game
          NODE_ENV: production
          CI: false
          NODE_OPTIONS: --openssl-legacy-provider
          GENERATE_SOURCEMAP: false
          INLINE_RUNTIME_CHUNK: false
        run: |
          set -e

          npm run build

      - name: Create application HTML
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("app")
          build = root / "build"
          public = root / "public"

          jsdir = (
              build /
              "static" /
              "js"
          )

          cssdir = (
              build /
              "static" /
              "css"
          )

          if not jsdir.exists():
              raise SystemExit(
                  "ERROR: static/js missing"
              )

          runtime_main = sorted(
              jsdir.glob(
                  "runtime~main.*.js"
              )
          )

          shared = sorted(
              p for p
              in jsdir.glob(
                  "*.chunk.js"
              )
              if p.name[0].isdigit()
          )

          main = sorted(
              jsdir.glob(
                  "main.*.js"
              )
          )

          css = (
              sorted(
                  cssdir.glob(
                      "main.*.css"
                  )
              )
              if cssdir.exists()
              else []
          )

          if not runtime_main:
              raise SystemExit(
                  "ERROR: main runtime missing"
              )

          if not main:
              raise SystemExit(
                  "ERROR: main bundle missing"
              )

          print(
              "runtime:",
              [p.name for p in runtime_main]
          )

          print(
              "shared:",
              [p.name for p in shared]
          )

          print(
              "main:",
              [p.name for p in main]
          )

          print(
              "css:",
              [p.name for p in css]
          )

          html = (
              public /
              "index.html"
          ).read_text(
              encoding="utf-8"
          )

          html = html.replace(
              "%PUBLIC_URL%",
              "/Game"
          )

          css_tags = "\n".join(
              (
                  '<link rel="stylesheet" '
                  f'href="/Game/static/css/{p.name}">'
              )
              for p in css
          )

          scripts = (
              runtime_main
              + shared
              + main
          )

          script_tags = "\n".join(
              (
                  '<script '
                  f'src="/Game/static/js/{p.name}">'
                  '</script>'
              )
              for p in scripts
          )

          html = html.replace(
              "</head>",
              css_tags
              + "\n</head>"
          )

          html = html.replace(
              "</body>",
              script_tags
              + "\n</body>"
          )

          (
              build /
              "index.html"
          ).write_text(
              html,
              encoding="utf-8"
          )

          storage_runtime = sorted(
              jsdir.glob(
                  "runtime~storage.*.js"
              )
          )

          storage_shared = sorted(
              jsdir.glob(
                  "0.*.chunk.js"
              )
          )

          storage_bundle = sorted(
              jsdir.glob(
                  "storage.*.js"
              )
          )

          storage_html = (
              public /
              "storage.html"
          ).read_text(
              encoding="utf-8"
          )

          storage_scripts = (
              storage_runtime
              + storage_shared
              + storage_bundle
          )

          storage_tags = "\n".join(
              (
                  '<script '
                  f'src="/Game/static/js/{p.name}">'
                  '</script>'
              )
              for p in storage_scripts
          )

          storage_html = (
              storage_html.replace(
                  "</body>",
                  storage_tags
                  + "\n</body>"
              )
          )

          (
              build /
              "storage.html"
          ).write_text(
              storage_html,
              encoding="utf-8"
          )

          print(
              "INDEX_HTML_CREATED"
          )

          print(
              "index size:",
              (
                  build /
                  "index.html"
              ).stat().st_size
          )
          PY

      - name: Remove stale service worker
        shell: bash
        run: |
          set -e

          rm -f \
            app/build/service-worker.js

          find \
            app/build \
            -maxdepth 1 \
            -name 'precache-manifest*' \
            -delete

          touch \
            app/build/.nojekyll

      - name: Verify real application
        shell: bash
        run: |
          set -e

          echo "=== INDEX ==="

          test -s \
            app/build/index.html

          cat \
            app/build/index.html

          echo "=== MAIN JS ==="

          MAIN_JS="$(
            find \
              app/build/static/js \
              -type f \
              -name 'main.*.js' \
              | head -1
          )"

          if [ -z "$MAIN_JS" ]; then
            echo "ERROR: main JS missing"
            exit 1
          fi

          test -s "$MAIN_JS"
          ls -lh "$MAIN_JS"

          echo "=== WORKERS ==="

          WORKER_COUNT="$(
            find \
              app/build \
              -maxdepth 1 \
              -type f \
              -name '*.worker.js' \
              | wc -l
          )"

          echo \
            "WORKER_COUNT=$WORKER_COUNT"

          if [ "$WORKER_COUNT" -lt 1 ]; then
            echo "ERROR: worker missing"
            exit 1
          fi

          find \
            app/build \
            -maxdepth 1 \
            -type f \
            -name '*.worker.js' \
            -exec ls -lh {} \;

          echo "=== INDEX REFERENCES ==="

          grep \
            "/Game/static/js/" \
            app/build/index.html

          grep \
            "/Game/static/css/" \
            app/build/index.html \
            || true

          if ! grep -q \
            "/Game/static/js/main." \
            app/build/index.html
          then
            echo \
              "ERROR: main JS not referenced"
            exit 1
          fi

          echo "=== SPAWN ==="

          test -s \
            app/build/spawn.mpq

          ls -lh \
            app/build/spawn.mpq

          echo "=== DIABLO WASM ==="

          DIABLO_WASM="$(
            find \
              app/build/static/media \
              -type f \
              -name 'Diablo.*.wasm' \
              | head -1
          )"

          SPAWN_WASM="$(
            find \
              app/build/static/media \
              -type f \
              -name 'DiabloSpawn.*.wasm' \
              | head -1
          )"

          if [ -z "$DIABLO_WASM" ]; then
            echo \
              "ERROR: Diablo WASM missing"
            exit 1
          fi

          if [ -z "$SPAWN_WASM" ]; then
            echo \
              "ERROR: DiabloSpawn WASM missing"
            exit 1
          fi

          test -s "$DIABLO_WASM"
          test -s "$SPAWN_WASM"

          ls -lh \
            "$DIABLO
