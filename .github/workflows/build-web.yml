
name: "build-web.yml | V19 | Motion Timeline Filters and Frame Review"
run-name: "build-web.yml | V19 | Motion Timeline Filters and Frame Review"

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: build-web-yml-v19
  cancel-in-progress: false

jobs:
  build_web_v19:
    name: "build-web.yml | V19 | Patch and Regression Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "build-web.yml | V19 | Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "build-web.yml | V19 | Restore verified V18"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/mobile reports
          if gh run download 39124414637 --repo "$GITHUB_REPOSITORY" --name Sanctuary-Mobile-V18-Field-Motion-History --dir dist/mobile; then
            echo 'build-web.yml | V19 | restored successful V18 artifact'
          else
            rm -rf dist/mobile
            mkdir -p dist/mobile
            git show 9d4cbd39312272ee16368fcc9e2098c57a9c5ae2:.github/workflows/build-web.yml > reports/pinned-v18.yml
            python3 -m venv /tmp/sanctuary-v19
            /tmp/sanctuary-v19/bin/pip -q install 'PyYAML==6.0.2' 'Pillow==11.3.0'
            cat > reports/rebuild_v18.py <<'PY_RESTORE'
          import os,subprocess,yaml
          from pathlib import Path
          source=Path('reports/pinned-v18.yml').read_text(encoding='utf-8')
          steps=yaml.safe_load(source)['jobs']['build_web_v18']['steps']
          env=dict(os.environ);env['PATH']='/tmp/sanctuary-v19/bin:'+env['PATH']
          for name in ('build-web.yml | V18 | Restore V17 verified game','build-web.yml | V18 | Add field motion history','build-web.yml | V18 | Validate combat, assets and history'):
              selected=[step for step in steps if step.get('name')==name and isinstance(step.get('run'),str)]
              if len(selected)!=1:raise SystemExit('V18 pinned step missing: '+name)
              subprocess.run(['bash','-e','-o','pipefail','-c',selected[0]['run']],env=env,check=True)
              print('build-web.yml | V19 | rebuilt V18:',name,flush=True)
          PY_RESTORE
            /tmp/sanctuary-v19/bin/python reports/rebuild_v18.py
          fi

      - name: "build-web.yml | V19 | Add mode and SPR filters and frame stepping"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          cat > reports/patch_v19.py <<'END_PATCH_V19_PY'
          from pathlib import Path
          import hashlib,json,sys
          
          root=Path(sys.argv[1] if len(sys.argv)>1 else '/mnt/data/sanctuary_v19/base')
          files={n:root/n for n in ('index.html','game.js','motion-review.js','game.css','build-info.json')}
          info=json.loads(files['build-info.json'].read_text(encoding='utf-8'))
          if (info.get('package'),info.get('runtime'),info.get('display_version'))!=(18,18,'V18'):
              raise SystemExit('ERROR: V18 base required')
          for name,checksum in info['sha256'].items():
              if hashlib.sha256((root/name).read_bytes()).hexdigest()!=checksum:
                  raise SystemExit('ERROR: unexpected V18 source '+name)
          html=files['index.html'].read_text(encoding='utf-8')
          review=files['motion-review.js'].read_text(encoding='utf-8')
          css=files['game.css'].read_text(encoding='utf-8')
          
          def once(s,a,b,what):
              n=s.count(a)
              if n!=1:raise SystemExit(f'V19 {what} source count {n}, expected 1')
              return s.replace(a,b,1)
          
          html=once(html,'Sanctuary of Aden Mobile V18 · Field Motion Timeline','Sanctuary of Aden Mobile V19 · Filtered Motion Timeline and Frame Review','page title')
          html=once(html,'Sanctuary Mobile V18</strong>','Sanctuary Mobile V19</strong>','HUD version')
          html=once(html,'원본 SPR 동작 검증 V18</strong>','원본 SPR 동작 검증 V19</strong>','lab version')
          html=once(html,'V18 · 필드 모션 이력·사망 검수','V19 · 이력 필터·프레임 검수','review title')
          html=once(html,'V18 · 최근 모션 기록 (사망 이후에도 유지)','V19 · 필드 모션 기록 (사망 유지)','timeline title')
          html=once(html,' <div class="timelineControls"><button id="timelineAll" type="button">전체 몬스터 보기</button><button id="timelineExport" type="button">이력 JSON 저장</button><button id="timelineClear" type="button">이력 지우기</button></div>', ''' <div class="timelineFilters">
           <label>동작 필터<select id="timelineMode"><option value="all">전체 동작</option><option value="attack">공격</option><option value="hit">피격</option><option value="death">사망</option><option value="walk">이동</option><option value="idle">대기</option></select></label>
           <label>SPR 필터<select id="timelineSprite"><option value="all">모든 몬스터</option></select></label></div>
           <div class="timelineControls"><button id="timelineAll" type="button">전체 몬스터 보기</button><button id="timelineRefresh" type="button">이력 새로고침</button><button id="timelineExport" type="button">이력 JSON 저장</button><button id="timelineClear" type="button">이력 지우기</button></div>''','timeline filters')
          html=once(html,'<div id="reviewTiming"></div>','''<div id="reviewTiming"></div>
          <div id="reviewFrameBar"><button id="reviewPause" type="button">⏸ 일시정지</button><button id="reviewFramePrev" type="button">◀ 이전 프레임</button><button id="reviewFrameNext" type="button">다음 프레임 ▶</button></div>
          <div id="reviewFrameStatus" aria-live="polite">자동 재생 · 왼쪽 기존 SPR / 오른쪽 추출 후보</div>''','frame step UI')
          html=once(html,'마지막 160개 상태 변경만 보관합니다.','최대 160개 상태 변경을 보관합니다. 필터는 기록을 삭제하지 않습니다.','timeline help')
          review=once(review,'const images=new Map(),buttons=new Map(),canvases=', 'let framePaused=false,frameStep=0;\nconst images=new Map(),buttons=new Map(),canvases=', 'frame pause state')
          review=once(review,'selectedMode=mode;selectedDir=dir;started=performance.now();','selectedMode=mode;selectedDir=dir;started=performance.now();frameStep=0;','selection resets stepping')
          review=once(review,'function paint(ctx,canvas,frames,delay,t,label){','function paint(ctx,canvas,frames,delay,t,label,step=null){','frame paint signature')
          review=once(review,'const index=frames.length?Math.floor(t/delay)%frames.length:0,img=loaded(frames[index]);','const index=frames.length?(step===null?Math.floor(t/delay):step)%frames.length:0,img=loaded(frames[index]);','manual frame indexing')
          start=review.index('function loop(t){')
          end=review.index('function saveFile(',start)
          old=review[start:end]
          new='''function frameCount(){
           const original=world.actors[current].actions?.[String(bases[selectedMode]+selectedDir)]||[];
           const candidate=candidates[current]?.actions?.[selectedMode]?.directions?.[selectedDir]?.frames||[];
           return Math.max(original.length,candidate.length,1);
          }
          function loop(t){
           if(!visible()){raf=0;return}
           const row=candidates[current]?.actions?.[selectedMode]?.directions?.[selectedDir],elapsed=framePaused?0:Math.max(0,t-started);
           const original=world.actors[current].actions?.[String(bases[selectedMode]+selectedDir)]||[];
           const candidate=row?.frames||[],newDelay=Math.max(60,Math.min(500,Number(candidates[current]?.actions?.[selectedMode]?.delayMs)||110));
           paint(contexts[0],canvases[0],original,110,elapsed,'기존 원본',framePaused?frameStep:null);
           paint(contexts[1],canvases[1],candidate,newDelay,elapsed,'추출 후보',framePaused?frameStep:null);
           const indexOf=(rows,delay)=>rows.length?(framePaused?frameStep%rows.length:Math.floor(elapsed/delay)%rows.length)+1:0;
           el('reviewFrameStatus').textContent=(framePaused?'프레임 정지 · '+(frameStep+1)+'/'+frameCount():'자동 재생')+' · 기존 '+indexOf(original,110)+'/'+original.length+' · 후보 '+indexOf(candidate,newDelay)+'/'+candidate.length;
           raf=framePaused?0:requestAnimationFrame(loop);
          }
          function wake(){if(!raf&&visible()){if(!framePaused)started=performance.now();raf=requestAnimationFrame(loop)}}
          function stepFrames(delta){
           if(!framePaused){framePaused=true;el('reviewPause').textContent='▶ 재생'}
           frameStep=(frameStep+delta+frameCount())%frameCount();wake();
          }
          el('reviewPause').onclick=()=>{framePaused=!framePaused;frameStep=0;started=performance.now();el('reviewPause').textContent=framePaused?'▶ 재생':'⏸ 일시정지';wake()};
          el('reviewFramePrev').onclick=()=>stepFrames(-1);
          el('reviewFrameNext').onclick=()=>stepFrames(1);
          '''
          review=review[:start]+new+review[end:]
          old='''function refreshTimeline(){
           const source=historySource(),focus=source?.focus(),events=source?.events(historyAll?'all':'focus',40)||[];
           el('timelineStatus').textContent=(historyAll?'전체 몬스터':'마지막 선택 몬스터'+(focus?' · SPR '+focus.spriteId:''))+' · '+events.length+'건 표시 · 총 '+(source?.length()||0)+'건';
           el('timelineAll').textContent=historyAll?'마지막 선택 몬스터만':'전체 몬스터 보기';
           timeline.replaceChildren();
           if(!events.length){const empty=document.createElement('div');empty.className='timelineEmpty';empty.textContent='표시할 모션 기록이 없습니다.';timeline.appendChild(empty);return}
           for(const entry of events){
            const button=document.createElement('button');button.type='button';button.className='timelineEvent';
            button.dataset.mode=entry.mode;button.dataset.life=String(entry.lifeId);
            button.textContent=entry.time.toFixed(2)+'초 · SPR '+entry.spriteId+' · '+names[entry.mode]+' · 방향 '+entry.dir+' · HP '+entry.hp+' · 키 '+entry.sprKey;
            button.setAttribute('aria-label','필드 기록 '+names[entry.mode]+' 방향 '+entry.dir+' 검수');
            button.onclick=()=>inspectField(entry);
            timeline.appendChild(button);
           }
          }'''
          new='''const spriteFilter=el('timelineSprite');
          for(const id of actorKeys){const option=document.createElement('option');option.value=String(world.actors[id].sprite_id);option.textContent='SPR '+option.value;spriteFilter.appendChild(option)}
          function refreshTimeline(){
           const source=historySource(),focus=source?.focus(),all=source?.events(historyAll?'all':'focus',160)||[];
           const mode=el('timelineMode').value||'all',sprite=spriteFilter.value||'all';
           const filtered=all.filter(entry=>(mode==='all'||entry.mode===mode)&&(sprite==='all'||String(entry.spriteId)===sprite));
           const events=filtered.slice(0,40);
           el('timelineStatus').textContent=(historyAll?'전체 몬스터':'마지막 선택 몬스터'+(focus?' · SPR '+focus.spriteId:''))+' · 필터 '+filtered.length+'건 / 기록 '+all.length+'건 · 화면 '+events.length+'건 · 총 '+(source?.length()||0)+'건';
           el('timelineAll').textContent=historyAll?'마지막 선택 몬스터만':'전체 몬스터 보기';
           timeline.replaceChildren();
           if(!events.length){const empty=document.createElement('div');empty.className='timelineEmpty';empty.textContent='조건에 맞는 모션 기록이 없습니다.';timeline.appendChild(empty);return}
           for(const entry of events){
            const button=document.createElement('button');button.type='button';button.className='timelineEvent';
            button.dataset.mode=entry.mode;button.dataset.life=String(entry.lifeId);
            button.textContent=entry.time.toFixed(2)+'초 · SPR '+entry.spriteId+' · '+names[entry.mode]+' · 방향 '+entry.dir+' · HP '+entry.hp+' · 키 '+entry.sprKey;
            button.setAttribute('aria-label','필드 기록 '+names[entry.mode]+' 방향 '+entry.dir+' 검수');
            button.onclick=()=>inspectField(entry);
            timeline.appendChild(button);
           }
          }'''
          review=once(review,old,new,'filters preserve full 160 history')
          review=once(review,"el('timelineAll').onclick=()=>{historyAll=!historyAll;refreshTimeline()};", '''el('timelineAll').onclick=()=>{historyAll=!historyAll;refreshTimeline()};
          el('timelineMode').onchange=refreshTimeline;
          spriteFilter.onchange=refreshTimeline;
          el('timelineRefresh').onclick=refreshTimeline;''','timeline controls')
          review=once(review,"el('timelineExport').onclick=()=>saveFile('sanctuary-v18-field-motion-history.json',{schema:'sanctuary.field-motion-history.v1',version:18,focus:historySource()?.focus(),events:historySource()?.events('all',160)||[]});", "el('timelineExport').onclick=()=>saveFile('sanctuary-v19-field-motion-history.json',{schema:'sanctuary.field-motion-history.v1',version:19,view:{scope:historyAll?'all':'focus',mode:el('timelineMode').value,sprite:spriteFilter.value},focus:historySource()?.focus(),events:historySource()?.events('all',160)||[]});",'unfiltered history export')
          review=once(review,'hasPack:id=>Boolean(candidates[id]),actors:()=>actorKeys.slice(),reviewed:',"hasPack:id=>Boolean(candidates[id]),actors:()=>actorKeys.slice(),frameState:()=>({paused:framePaused,step:frameStep,actor:current,mode:selectedMode,dir:selectedDir}),reviewed:",'frame state testing API')
          css+='''
          /* build-web.yml | V19 | Filtered Motion Timeline and Frame-by-Frame Review */
          .timelineFilters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
          .timelineFilters label{display:grid;gap:3px;font-size:10px;color:#e8e2bb;min-width:0}
          .timelineFilters select{width:100%;min-height:35px;padding:6px 5px;border:1px solid #708a7c;border-radius:6px;background:#193b35;color:#f9ecc6;font-size:12px}
          .timelineControls{grid-template-columns:repeat(2,minmax(0,1fr))}
          #reviewFrameBar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
          #reviewFrameBar button{min-width:0;font-size:11px;padding:8px 3px;touch-action:manipulation}
          #reviewPause{background:#455b46;color:#fff1b7}
          #reviewFrameStatus{font-size:11px;line-height:1.5;color:#f2e4a9;text-align:center}
          @media (orientation:landscape) and (max-height:600px){#reviewFrameBar button{font-size:10px;padding:5px 2px}}
          '''
          for name,value in [('index.html',html),('motion-review.js',review),('game.css',css)]:
              files[name].write_text(value,encoding='utf-8')
          info.update(package=19,runtime=19,version='19',display_version='V19',previous_version='V18',previous_run=39124414637)
          for name in ('index.html','motion-review.js','game.css'):
              info['sha256'][name]=hashlib.sha256(files[name].read_bytes()).hexdigest()
          files['build-info.json'].write_text(json.dumps(info,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          with (root/'README_KO.txt').open('a',encoding='utf-8') as f:
              f.write('\nV19 | build-web.yml | Mode+SPR filters over full 160-event motion history; pause/play and independent original-vs-candidate PNG frame stepping; no game engine, map, or combat changes.\n')
          print('build-web.yml | V19 | PATCH PASS: review',len(review),'game engine SHA',info['sha256']['game.js'])
          END_PATCH_V19_PY
          python3 -m py_compile reports/patch_v19.py
          python3 reports/patch_v19.py dist/mobile
          node --check dist/mobile/game.js
          node --check dist/mobile/motion-review.js

      - name: "build-web.yml | V19 | Validate unchanged game and review features"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          cat > reports/verify_v19.py <<'END_VERIFY_V19_PY'
          from pathlib import Path
          import hashlib,json,sys
          r=Path(sys.argv[1] if len(sys.argv)>1 else 'dist/mobile')
          meta=json.loads((r/'build-info.json').read_text(encoding='utf-8'))
          world=json.loads((r/'manifest.json').read_text(encoding='utf-8'))
          pack=json.loads((r/'monster-pack.json').read_text(encoding='utf-8'))
          assert meta['package']==19 and meta['runtime']==19 and meta['version']=='19' and meta['display_version']=='V19'
          assert meta['previous_version']=='V18' and meta['previous_run']==39124414637
          fixed={
           'game.js':'c771e27cb46acfbb44501b001c5308cd4241b8fcf7c60b51eb00b477fd306d9a',
           'game-data.js':'1a50224f083c193c33eab137798bfb6ddccf1b1dea54f3d9055e601c0fbabf57',
           'manifest.json':'3f1cdb0f22376e763888628465b6601f5e9c72eeda8a9194a356dcba2c205c95',
           'monster-pack.json':'06e28349f7ca6da1fe2bda9b28653cb0e2f08c13c998b02de7689ffd6cd8ea26',
           'monster-pack.js':'070ef55992c9823e1e7e82df696d673ca13c0b4d2e92e1c7da271a26a3c729a4',
          }
          for name,sha in fixed.items():assert meta['sha256'][name]==sha,(name,'original base changed')
          for name,sha in meta['sha256'].items():assert hashlib.sha256((r/name).read_bytes()).hexdigest()==sha,name
          assert len(world['actors'])==8 and len(world['map']['flags'])==36864
          assert len(world['map']['objects'])==59963
          assert len(list((r/'assets').glob('*.png')))==3616
          assert len(list((r/'tiles').glob('*.png')))==218
          assert len(list((r/'motion-gifs/v18').glob('*.gif')))==40
          assert pack['actors']['mob56']['provenance']['actionDefinitionsVerified'] is False
          html=(r/'index.html').read_text(encoding='utf-8')
          review=(r/'motion-review.js').read_text(encoding='utf-8')
          assert 'Sanctuary Mobile V19' in html and '원본 SPR 동작 검증 V19' in html and 'V19 · 이력 필터·프레임 검수' in html
          assert all(f'id="{x}"' in html for x in ('timelineMode','timelineSprite','timelineRefresh','timelineExport','reviewPause','reviewFramePrev','reviewFrameNext','reviewFrameStatus'))
          assert html.index('src="game.js"')<html.index('src="motion-review.js"')
          assert 'frameState:()=>({paused:framePaused,step:frameStep' in review
          assert "source?.events(historyAll?'all':'focus',160)" in review
          assert 'filtered.slice(0,40)' in review
          assert 'framePaused?frameStep:null' in review
          assert 'sanctuary-v19-field-motion-history.json' in review
          print('build-web.yml | V19 | PASS: unchanged 44K engine, 3616 original SPR, 218 TIL, 40 GIF, 59963 map objects, full history filters and frame control')
          END_VERIFY_V19_PY
          cat > reports/smoke_v19.cjs <<'END_SMOKE_V19_CJS'
          const fs=require('fs'),vm=require('vm'),assert=require('node:assert/strict');
          const r=process.argv[2]||'dist/mobile';
          const read=n=>fs.readFileSync(r+'/'+n,'utf8');
          const world=JSON.parse(read('manifest.json')),pack=JSON.parse(read('monster-pack.json'));
          const elems=new Map(),events={},storage=new Map(),pending=[];
          let now=1100,downloadName='',saveBlob=null;
          class E{
           constructor(id){this.id=id;this.hidden=['lab','reviewBody','timelineBody','reviewFieldSnapshot'].includes(id);this.value='';this.dataset={};this.attrs={};this.children=[];this.textContent='';this.disabled=false;this.files=[];this.style={};this.classList={toggle(){},add(){},remove(){}};this.width=220;this.height=170;this.listeners={};}
           getContext(){return{fillRect(){},drawImage(){},fillText(){},imageSmoothingEnabled:false}};
           addEventListener(k,f){(this.listeners[k]??=[]).push(f)}
           appendChild(x){this.children.push(x);return x}
           replaceChildren(...xs){this.children=xs}remove(){}
           setAttribute(k,v){this.attrs[k]=v}scrollIntoView(){this.scrolled=true}
           click(){if(this.download)downloadName=this.download;this.onclick?.();for(const f of this.listeners.click||[])f({preventDefault(){}})}
          }
          const el=id=>{if(!elems.has(id))elems.set(id,new E(id));return elems.get(id)};
          const document={getElementById:el,createElement:id=>new E(id),body:new E('body'),hidden:false,addEventListener(k,fn){events[k]=fn}};
          const all=[];
          for(let i=0;i<112;i++)all.push({time:175-i/10,lifeId:1,mobId:0,actor:'mob56',spriteId:56,mode:'idle',dir:i%8,hp:45,sprKey:'32'});
          all.push({time:40,lifeId:1,mobId:0,actor:'mob56',spriteId:56,mode:'death',dir:4,hp:0,sprKey:'28',source:'기존 기본 추정'});
          for(let i=0;i<38;i++)all.push({time:30-i/10,lifeId:2,mobId:1,actor:'mob1022',spriteId:1022,mode:'attack',dir:i%8,hp:30,sprKey:'8'});
          const focus={lifeId:1,mobId:0,actor:'mob56',spriteId:56};
          const history={events:(scope='focus',limit=40)=>all.filter(x=>scope==='all'||x.lifeId===focus.lifeId).slice(0,limit),focus:()=>focus,length:()=>all.length,clear(){all.length=0}};
          const window={SANCTUARY_MANIFEST:world,SANCTUARY_MONSTER_PACK:pack,SANCTUARY_FIELD_HISTORY:history,SANCTUARY_GET_FIELD_TARGET:()=>({actor:'mob56',mode:'attack',dir:5,mobId:0,spriteId:56,hp:45})};
          el('labOpen').onclick=()=>{el('lab').hidden=false};el('labActor').value='mob56';
          const env={window,document,Math,Number,Object,Array,String,JSON,Boolean,performance:{now:()=>now},requestAnimationFrame(fn){pending.push(fn);return pending.length},Image:class{constructor(){this.complete=true;this.naturalWidth=24;this.naturalHeight=32}set src(p){this._src=p}},Blob,URL:{createObjectURL(b){saveBlob=b;return 'blob:review'},revokeObjectURL(){}},setTimeout(){},localStorage:{getItem:k=>storage.get(k)||null,setItem:(k,v)=>storage.set(k,v)},console,confirm:()=>true,alert:x=>{throw Error(x)}};
          vm.runInNewContext(read('motion-review.js'),env,{timeout:10000});
          function frame(){assert(pending.length>0,'missing paint frame');now+=120;pending.shift()(now)}
          (async()=>{
           assert(window.SANCTUARY_REVIEW_READY);
           assert.equal(window.SANCTUARY_MOTION_TRIAL.actors().length,7);
           assert.equal(window.SANCTUARY_MOTION_TRIAL.mode('mob56'),'legacy');
           el('labOpen').click();el('reviewToggle').click();frame();
           assert.equal(window.SANCTUARY_MOTION_TRIAL.frameState().paused,false);
           el('reviewPause').click();frame();
           assert.equal(window.SANCTUARY_MOTION_TRIAL.frameState().paused,true);
           assert(el('reviewFrameStatus').textContent.includes('프레임 정지'));
           el('reviewFrameNext').click();frame();assert.equal(window.SANCTUARY_MOTION_TRIAL.frameState().step,1);
