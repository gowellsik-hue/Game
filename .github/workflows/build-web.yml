name: Deploy modern DiabloWebAI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout modern DiabloWebAI
        uses: actions/checkout@v4
        with:
          repository: levidehaan/diablowebai
          ref: 4becbb4c81323dc8982504ecb2a5f338434c9772
          path: app

      - name: Patch upstream build
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import json
          from pathlib import Path

          package = Path("app/package.json")
          data = json.loads(
              package.read_text(
                  encoding="utf-8"
              )
          )

          removed = data.get(
              "devDependencies",
              {}
          ).pop(
              "canvas",
              None
          )

          package.write_text(
              json.dumps(
                  data,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print(
              "Removed canvas:",
              removed
          )

          webpack = Path(
              "app/config/webpack.config.js"
          )

          text = webpack.read_text(
              encoding="utf-8"
          )

          old = (
              "futureEmitAssets: true,"
          )

          new = (
              "futureEmitAssets: false,"
          )

          if old not in text:
              raise SystemExit(
                  "ERROR: futureEmitAssets "
                  "setting not found"
              )

          text = text.replace(
              old,
              new,
              1
          )

          webpack.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "futureEmitAssets disabled"
          )
          PY

          grep -n \
            "futureEmitAssets" \
            app/config/webpack.config.js

      - name: Verify modern WASM loader
        shell: bash
        run: |
          set -e

          grep -n \
            "await module.ready" \
            app/src/api/game.worker.js

          grep -n \
            "return module" \
            app/src/api/game.worker.js

          echo "MODERN_LOADER_OK"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Show versions
        shell: bash
        run: |
          node --version
          npm --version

      - name: Install dependencies
        working-directory: app
        shell: bash
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
        run: |
          set -e

          npm install \
            --legacy-peer-deps \
            --no-audit \
            --no-fund

      - name: Build modern DiabloWebAI
        working-directory: app
        shell: bash
        env:
          PUBLIC_URL: /Game
          NODE_ENV: production
          CI: false
          NODE_OPTIONS: --openssl-legacy-provider
          GENERATE_SOURCEMAP: false
          INLINE_RUNTIME_CHUNK: false
        run: |
          set -e

          npm run build

      - name: Inspect real build output
        shell: bash
        run: |
          set -e

          echo "=== BUILD ROOT ==="

          ls -lah \
            app/build

          echo "=== STATIC FILES ==="

          find \
            app/build/static \
            -type f \
            -maxdepth 4 \
            -exec ls -lh {} \;

          echo "=== WORKERS ==="

          find \
            app/build \
            -type f \
            -name '*.worker.js' \
            -exec ls -lh {} \;

          echo "=== INDEX ==="

          cat \
            app/build/index.html

      - name: Verify actual application bundle
        shell: bash
        run: |
          set -e

          test -s \
            app/build/index.html

          test -s \
            app/build/spawn.mpq

          echo "=== JS COUNT ==="

          JS_COUNT="$(
            find \
              app/build/static/js \
              -type f \
              -name '*.js' \
              | wc -l
          )"

          echo \
            "JS_COUNT=$JS_COUNT"

          if [ "$JS_COUNT" -lt 1 ]; then
            echo \
              "ERROR: webpack emitted no JS"
            exit 1
          fi

          echo "=== MAIN JS ==="

          MAIN_COUNT="$(
            find \
              app/build/static/js \
              -type f \
              -name 'main.*.js' \
              | wc -l
          )"

          echo \
            "MAIN_COUNT=$MAIN_COUNT"

          if [ "$MAIN_COUNT" -lt 1 ]; then
            echo \
              "ERROR: main JS missing"
            exit 1
          fi

          echo "=== WORKER COUNT ==="

          WORKER_COUNT="$(
            find \
              app/build \
              -type f \
              -name '*.worker.js' \
              | wc -l
          )"

          echo \
            "WORKER_COUNT=$WORKER_COUNT"

          if [ "$WORKER_COUNT" -lt 1 ]; then
            echo \
              "ERROR: game worker missing"
            exit 1
          fi

          echo "=== INDEX SCRIPT CHECK ==="

          if ! grep -q \
            "static/js/" \
            app/build/index.html
          then
            echo \
              "ERROR: index has no JS bundle"
            exit 1
          fi

          echo "=== WASM ==="

          test -s \
            app/build/wasm/devilutionx.wasm

          test -s \
            app/build/wasm/devilutionx.js

          test -s \
            app/build/wasm/devilutionx.data

          ls -lh \
            app/build/wasm/devilutionx.wasm \
            app/build/wasm/devilutionx.js \
            app/build/wasm/devilutionx.data

          echo "=== SPAWN.MPQ ==="

          ls -lh \
            app/build/spawn.mpq

          echo "REAL_GAME_BUILD_OK"

      - name: Disable Jekyll
        shell: bash
        run: |
          touch \
            app/build/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: modern-diablowebai
          path: app/build/
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build

  deploy:
    needs: build
    runs-on: ubuntu-22.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
