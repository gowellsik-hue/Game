name: Deploy Original DiabloWeb

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Game repo
        uses: actions/checkout@v4

      - name: Checkout original DiabloWeb production site
        uses: actions/checkout@v4
        with:
          repository: d07RiV/diabloweb
          ref: gh-pages
          path: diabloweb-original

      - name: Prepare exact original site
        run: |
          rm -rf _site
          mkdir -p _site

          cp -a diabloweb-original/. _site/

          # Remove git metadata only
          rm -rf _site/.git
          rm -rf _site/.github

          echo "=== DiabloWeb site files ==="
          ls -lah _site

          echo "=== SPAWN.MPQ check ==="
          test -s _site/spawn.mpq
          stat -c "%n : %s bytes" _site/spawn.mpq

          echo "=== index.html check ==="
          test -s _site/index.html

      - name: Upload downloadable copy
        uses: actions/upload-artifact@v4
        with:
          name: original-diabloweb
          path: _site/
          if-no-files-found: error

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
