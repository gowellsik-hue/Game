
name: "V16.1 | Sanctuary Mobile | Multi-Monster Motion Review"
run-name: "V16.1 | Sanctuary Mobile | Verified Build"

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml
      - "mobile-monsters/packs/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sanctuary-mobile-v16-1
  cancel-in-progress: false

jobs:
  mobile-v16-1:
    name: "V16.1 | Restore, Repair and Validate"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "V16.1 | Checkout pinned source"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "V16.1 | Rebuild verified V16 engine from pinned commit"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reports
          git show 84bc8622ebecf8167cebe2bffb9d03527127cbf3:.github/workflows/build-web.yml > reports/pinned-v16.yml
          python3 -m venv /tmp/sanctuary-v16-1
          /tmp/sanctuary-v16-1/bin/pip -q install 'PyYAML==6.0.2' 'Pillow==11.3.0'
          cat > reports/replay_v16.py <<'PY_REPLAY'
          import os,subprocess,yaml
          from pathlib import Path
          source=Path('reports/pinned-v16.yml').read_text(encoding='utf-8')
          if 'Sanctuary of Aden Mobile V16 Multi-Monster Motion Review' not in source:
              raise SystemExit('Pinned V16 source does not match expected version')
          if source.count('$'+'{{')!=2:
              raise SystemExit('Unexpected original GitHub expression tokens')
          steps=yaml.safe_load(source)['jobs']['build']['steps']
          required=(
              'Restore verified V15 mobile game',
              'Install multi-monster motion bridge',
              'Verify actor-specific motion trials and original assets',
          )
          env=dict(os.environ)
          env['PATH']='/tmp/sanctuary-v16-1/bin:'+env['PATH']
          for name in required:
              hits=[x for x in steps if x.get('name')==name and isinstance(x.get('run'),str)]
              if len(hits)!=1:
                  raise SystemExit('Missing pinned build step: '+name)
              print('V16.1 RUN:',name,flush=True)
              subprocess.run(['bash','-e','-o','pipefail','-c',hits[0]['run']],env=env,check=True)
          print('V16.1: all V16 original build and regression tests passed',flush=True)
          PY_REPLAY
          /tmp/sanctuary-v16-1/bin/python reports/replay_v16.py

      - name: "V16.1 | Stamp version on game, HUD and motion lab"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_STAMP'
          from pathlib import Path
          import hashlib,json
          root=Path('dist/mobile')
          html_path=root/'index.html'
          info_path=root/'build-info.json'
          info=json.loads(info_path.read_text(encoding='utf-8'))
          if info.get('package')!=16 or info.get('runtime')!=16:
              raise SystemExit('Expected verified V16 runtime')
          if info.get('source_run')!=39050704098:
              raise SystemExit('Unexpected V15 source artifact')
          html=html_path.read_text(encoding='utf-8')
          original_labels=html.count('V16')
          if original_labels<4 or 'V16.1' in html:
              raise SystemExit('Original game version labels do not match')
          html=html.replace('V16','V16.1')
          html_path.write_text(html,encoding='utf-8')
          info['version']='16.1'
          info['display_version']='V16.1'
          info['workflow_fix']='GitHub expression collision in prior Base85 source'
          info['sha256']['index.html']=hashlib.sha256(html_path.read_bytes()).hexdigest()
          info_path.write_text(json.dumps(info,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          with (root/'README_KO.txt').open('a',encoding='utf-8') as f:
              f.write('\nV16.1: GitHub workflow parser fixed; V16 combat and monster functions unchanged.\n')
          for filename,digest in info['sha256'].items():
              if hashlib.sha256((root/filename).read_bytes()).hexdigest()!=digest:
                  raise SystemExit('Modified or corrupted game file: '+filename)
          assert html.count('V16.1')>=4
          assert len(list((root/'assets').glob('*.png')))>=3616
          assert len(list((root/'tiles').glob('*.png')))==218
          assert len(list((root/'motion-gifs/v18').glob('*.gif')))==40
          print('V16.1 VERIFIED: title, HUD, motion lab, original sprites and combat')
          PY_STAMP
          node --check dist/mobile/game.js
          node --check dist/mobile/motion-review.js
          printf '%s\n' 'V16.1 PASS | GitHub workflow parsing fixed; V16 runtime and original assets preserved.' >> "$GITHUB_STEP_SUMMARY"

      - name: "V16.1 | Upload mobile game"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Mobile-V16.1-Multi-Monster-Review
          path: dist/mobile/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: "V16.1 | Upload failure logs"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Mobile-V16.1-Diagnostics
          path: reports/
          if-no-files-found: warn
          retention-days: 14
