          el('clearMap').onclick=()=>{if(!confirm('전체 모션 매핑을 지울까요?'))return;mapped={hero:{},enemy:{}};persist()};
          el('downloadMap').onclick=()=>{let file=JSON.stringify({version:4,ids:{hero:2786,enemy:3215},mapping:mapped},null,2);let url=URL.createObjectURL(new Blob([file],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='sanctuary-v4-motion-map.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)};
          el('uploadMap').onchange=async e=>{let file=e.target.files?.[0];if(!file)return;try{importMapping(JSON.parse(await file.text()));msg('모션 매핑 불러오기 완료')}catch(error){alert('불러오기 실패: '+error.message)}e.target.value=''};
          el('autoBtn').onclick=()=>{auto=!auto;el('autoBtn').textContent=auto?'자동 ON':'자동 OFF';el('autoBtn').classList.toggle('good',auto)};
          el('hitBtn').addEventListener('pointerdown',e=>{e.preventDefault();tryAttack()});el('potion').onclick=drink;el('again').onclick=begin;
