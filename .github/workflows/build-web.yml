          if hashlib.sha256(blob).hexdigest()!='94f1b1f01c017f7a66811c5e9da11eda2ecc677b22f87df446a2bb55e8eec6e3':raise SystemExit('V16 embedded bundle SHA-256 mismatch')
          allowed={'merge_packs.py','patch_v16.py','motion-review.js','verify_v16.py','smoke.cjs'}
          with zipfile.ZipFile(io.BytesIO(blob)) as archive:
              if set(archive.namelist())!=allowed:raise SystemExit('Unexpected files in V16 bundle')
              for name in sorted(allowed):
                  Path('reports',name).write_bytes(archive.read(name))
          print('V16 embedded game source verified')
          PY_UNPACK
          python3 -m py_compile reports/merge_packs.py reports/patch_v16.py
          node --check reports/motion-review.js
          python3 reports/merge_packs.py dist/mobile mobile-monsters/packs
          python3 reports/patch_v16.py dist/mobile reports/motion-review.js
          node --check dist/mobile/game.js
          node --check dist/mobile/motion-review.js

      - name: Verify actor-specific motion trials and original assets
        shell: bash
        run: |
          set -euo pipefail
          python3 reports/verify_v16.py
          node --check reports/smoke.cjs
          node --check dist/mobile/game-data.js
          node --check dist/mobile/monster-pack.js
          node reports/smoke.cjs dist/mobile
          mkdir -p reports/mock-packs reports/mock-mobile
          python3 - <<'PY_FIXTURE'
          import json
          from pathlib import Path
          world=json.loads(Path('dist/mobile/manifest.json').read_text(encoding='utf-8'))
          actor=world['actors']['mob1022']
          rows=[{'key':32+d,'frames':actor['actions'][str(32+d)]} for d in range(8)]
          sample={'schema':'sanctuary.monster-motion.v1','sourceRun':7777777,'actors':{'mob1022':{'sprite_id':actor['sprite_id'],'name':'Integration test only','actions':{'idle':{'delayMs':180,'directions':rows}}}}}
          Path('reports/mock-packs/second-actor.json').write_text(json.dumps(sample,ensure_ascii=False),encoding='utf-8')
          PY_FIXTURE
          cp -a dist/mobile/. reports/mock-mobile/
          python3 reports/merge_packs.py reports/mock-mobile reports/mock-packs
          node --check reports/mock-mobile/monster-pack.js
          node reports/smoke.cjs reports/mock-mobile
          rm -rf reports/mock-packs reports/mock-mobile
          printf '%s\n' 'V16: V15 map, original combat and SPR unchanged; independent review, legacy migration and second actor pack tested.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload V16 mobile game
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Mobile-V16-Multi-Monster-Motion-Review
          path: dist/mobile/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Mobile-V16-Diagnostics
          path: reports/
          if-no-files-found: warn
          retention-days: 14
