name: Deploy DiabloWeb AutoAttack

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: levidehaan/diablowebai
          ref: 4becbb4c81323dc8982504ecb2a5f338434c9772
          path: app

      - name: Checkout Devilution engine
        uses: actions/checkout@v4
        with:
          repository: d07RiV/devilution
          ref: 798b5122731ae4b5e0c91348e5c44cf79354a94e
          path: engine

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 1.39.20
          actions-cache-folder: emsdk-cache

      - name: Add auto attack to engine
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("engine/Source/diablo.cpp")
          text = p.read_text(encoding="utf-8")

          anchor = """void game_loop(BOOL bStartup)
          {
          """

          if anchor not in text:
              raise SystemExit(
                  "ERROR: game_loop anchor missing"
              )

          autoattack = r'''
          static int FindMobileAutoAttackTarget()
          {
          	int best = -1;
          	int bestDistance = 9999;

          	PlayerStruct &player = plr[myplr];

          	const int px = player.WorldX;
          	const int py = player.WorldY;

          	const int maxDistance =
          	    player._pwtype == WT_RANGED
          	        ? 8
          	        : 1;

          	for (int n = 0; n < nummonsters; n++) {
          		const int mi = monstactive[n];

          		if (mi < 0 || mi >= MAXMONSTERS)
          			continue;

          		MonsterStruct &m = monster[mi];

          		if (m._mDelFlag)
          			continue;

          		if (m._mhitpoints <= 0)
          			continue;

          		if (CanTalkToMonst(mi))
          			continue;

          		const int dx = abs(m._mx - px);
          		const int dy = abs(m._my - py);

          		const int distance =
          		    dx > dy ? dx : dy;

          		if (distance > maxDistance)
          			continue;

          		if (distance >= bestDistance)
          			continue;

          		best = mi;
          		bestDistance = distance;
          	}

          	return best;
          }

          static void TryMobileAutoAttack()
          {
          	if (leveltype == DTYPE_TOWN)
          		return;

          	if (PauseMode == 2)
          		return;

          	if (deathflag)
          		return;

          	if (gmenu_exception())
          		return;

          	if (stextflag || spselflag || qtextflag)
          		return;

          	if (questlog || doomflag || dropGoldFlag)
          		return;

          	if (track_isscrolling())
          		return;

          	if (sgbMouseDown != 0)
          		return;

          	PlayerStruct &player = plr[myplr];

          	/*
          	 * Never interrupt movement, attacks,
          	 * hit recovery or spell animations.
          	 */
          	if (player._pmode != PM_STAND)
          		return;

          	const int target =
          	    FindMobileAutoAttackTarget();

          	if (target < 0)
          		return;

          	if (player._pwtype == WT_RANGED) {
          		NetSendCmdParam1(
          		    TRUE,
          		    CMD_RATTACKID,
          		    target
          		);
          	} else {
          		NetSendCmdParam1(
          		    TRUE,
          		    CMD_ATTACKID,
          		    target
          		);
          	}
          }

          '''

          text = text.replace(
              anchor,
              autoattack + anchor,
              1
          )

          old = """\tif (!gmenu_exception() && sgnTimeoutCurs == 0) {
          		CheckCursMove();
          		track_process();
          	}
          	if (gbProcessPlayers) {
          """

          new = """\tif (!gmenu_exception() && sgnTimeoutCurs == 0) {
          		CheckCursMove();
          		track_process();
          		TryMobileAutoAttack();
          	}
          	if (gbProcessPlayers) {
          """

          if old not in text:
              raise SystemExit(
                  "ERROR: game loop logic anchor missing"
              )

          text = text.replace(
              old,
              new,
              1
          )

          p.write_text(
              text,
              encoding="utf-8"
          )

          print("AUTOATTACK_PATCH_OK")

          p = Path("engine/build.js")
          text = p.read_text(encoding="utf-8")

          text = text.replace(
              " -s BINARYEN_TRAP_MODE='clamp'",
              ""
          )

          old = """//run_build('-O3 -g -DZ_SOLO', 'Diablo', ['Source']).catch(e => console.error(e.message));
          //run_build('-O3 -g -DZ_SOLO -DSPAWN', 'DiabloSpawn', ['Source']).catch(e => console.error(e.message));
          run_build('-O3 -g -DZ_SOLO', 'MpqCmp', ['Source/rmpq', 'Source/zlib', 'mpqcmp']).catch(e => console.error(e.message));
          """

          new = """(async () => {
            await run_build(
              '-O3 -g -DZ_SOLO',
              'Diablo',
              ['Source']
            );

            await run_build(
              '-O3 -g -DZ_SOLO -DSPAWN',
              'DiabloSpawn',
              ['Source']
            );
          })().catch(e => {
            console.error(e);
            process.exitCode = 1;
          });
          """

          if old not in text:
              raise SystemExit(
                  "ERROR: build targets anchor missing"
              )

          text = text.replace(
              old,
              new,
              1
          )

          p.write_text(
              text,
              encoding="utf-8"
          )

          print("ENGINE_BUILD_PATCH_OK")
          PY

      - name: Verify auto attack source
        shell: bash
        run: |
          set -e

          grep -n \
            "FindMobileAutoAttackTarget" \
            engine/Source/diablo.cpp

          grep -n \
            "TryMobileAutoAttack" \
            engine/Source/diablo.cpp

          grep -n \
            "CMD_ATTACKID" \
            engine/Source/diablo.cpp

          grep -n \
            "CMD_RATTACKID" \
            engine/Source/diablo.cpp

          echo "AUTOATTACK_SOURCE_OK"

      - name: Build auto attack engine
        working-directory: engine
        shell: bash
        run: |
          set -e

          emcc --version
          node --version

          node build.js

      - name: Verify engine build
        shell: bash
        run: |
          set -e

          test -s engine/Diablo.wasm
          test -s engine/DiabloSpawn.wasm
          test -s engine/Diablo.jscc
          test -s engine/DiabloSpawn.jscc

          ls -lh \
            engine/Diablo.wasm \
            engine/DiabloSpawn.wasm \
            engine/Diablo.jscc \
            engine/DiabloSpawn.jscc

          echo "AUTOATTACK_ENGINE_BUILT"

      - name: Patch frontend
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import json
          import re
          import shutil
          from pathlib import Path

          app = Path("app")
          engine = Path("engine")

          def replace_once(text, old, new, name):
              if old not in text:
                  raise SystemExit(
                      "PATCH FAILED: " + name
                  )
              return text.replace(
                  old,
                  new,
                  1
              )

          # --------------------------------
          # package mismatch
          # --------------------------------

          p = app / "package.json"

          data = json.loads(
              p.read_text(
                  encoding="utf-8"
              )
          )

          data.get(
              "devDependencies",
              {}
          ).pop(
              "canvas",
              None
          )

          p.write_text(
              json.dumps(
                  data,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          # --------------------------------
          # service worker off
          # --------------------------------

          p = app / "src/index.js"

          text = p.read_text(
              encoding="utf-8"
          )

          old = """serviceWorker.register({
            onUpdate() {
            },
          });"""

          text = replace_once(
              text,
              old,
              "serviceWorker.unregister();",
              "service worker"
          )

          p.write_text(
              text,
              encoding="utf-8"
          )

          # --------------------------------
          # install paired rebuilt engine
          # --------------------------------

          out = app / "public/wasm"

          out.mkdir(
              parents=True,
              exist_ok=True
          )

          shutil.copy2(
              engine / "Diablo.jscc",
              out / "Diablo.js"
          )

          shutil.copy2(
              engine / "Diablo.wasm",
              out / "Diablo.wasm"
          )

          shutil.copy2(
              engine / "DiabloSpawn.jscc",
              out / "DiabloSpawn.js"
          )

          shutil.copy2(
              engine / "DiabloSpawn.wasm",
              out / "DiabloSpawn.wasm"
          )

          diablo_size = (
              engine /
              "Diablo.wasm"
          ).stat().st_size

          spawn_size = (
              engine /
              "DiabloSpawn.wasm"
          ).stat().st_size

          print(
              "Diablo WASM:",
              diablo_size
          )

          print(
              "Spawn WASM:",
              spawn_size
          )

          # --------------------------------
          # game worker
          # --------------------------------

          p = (
              app /
              "src/api/game.worker.js"
          )

          text = p.read_text(
              encoding="utf-8"
          )

          for line in [
              "import DiabloBinary from './Diablo.wasm';\n",
              "import DiabloModule from './Diablo.jscc';\n",
              "import SpawnBinary from './DiabloSpawn.wasm';\n",
              "import SpawnModule from './DiabloSpawn.jscc';\n",
          ]:
              text = text.replace(
                  line,
                  ""
              )

          text = re.sub(
              r"const DiabloSize = \d+;\s*"
              r"const SpawnSize = \d+;",
              (
                  f"const DiabloSize = {diablo_size};\n"
                  f"const SpawnSize = {spawn_size};"
              ),
              text,
              count=1
          )

          start = text.find(
              "async function initWasm("
          )

          end = text.find(
              "\nasync function init_game",
              start
          )

          if start < 0 or end < 0:
              raise SystemExit(
                  "PATCH FAILED: initWasm"
              )

          new_loader = r'''async function initWasm(spawn, progress) {
            const base =
              `${process.env.PUBLIC_URL}/wasm`;

            const scriptName =
              spawn
                ? "DiabloSpawn.js"
                : "Diablo.js";

            const wasmName =
              spawn
                ? "DiabloSpawn.wasm"
                : "Diablo.wasm";

            const factoryName =
              spawn
                ? "DiabloSpawn"
                : "Diablo";

            if (
              typeof worker[factoryName]
              !== "function"
            ) {
              importScripts(
                `${base}/${scriptName}?v=${CACHE_VERSION}`
              );
            }

            const factory =
              worker[factoryName];

            if (
              typeof factory !== "function"
            ) {
              throw new Error(
                `Missing ${factoryName} factory`
              );
            }

            const binary =
              await axios.request({
                url:
                  `${base}/${wasmName}?v=${CACHE_VERSION}`,
                responseType:
                  "arraybuffer",
                onDownloadProgress:
                  progress,
              });

            const module =
              factory({
                wasmBinary:
                  binary.data,
              });

            const readyModule =
              module && module.ready
                ? await module.ready
                : await module;

            if (
              !readyModule ||
              typeof readyModule._DApi_Init
                !== "function" ||
              typeof readyModule._DApi_Render
                !== "function" ||
              typeof readyModule._DApi_Mouse
                !== "function"
            ) {
              throw new Error(
                "AutoAttack Diablo engine initialization failed"
              );
            }

            progress({
              loaded:
                binary.data.byteLength
            });

            return readyModule;
          }
          '''

          text = (
              text[:start]
              + new_loader
              + text[end:]
          )

          # --------------------------------
          # disable expensive AI scanning
          # --------------------------------

          detector = r'''  // Initialize Game Event Detector for AI quest system
            try {
              gameEventDetector.initialize(wasm);
              console.log('[Worker] Game Event Detector initialized');
            } catch (e) {
              console.warn('[Worker] Game Event Detector init failed:', e);
            }
          '''

          text = replace_once(
              text,
              detector,
              """  console.log('[Worker] NEURAL_EVENT_DETECTOR_DISABLED');
          """,
              "event detector"
          )

          old_loop = r'''  setInterval(() => {
              call_api("DApi_Render", Math.floor(performance.now()));

              // Process game events for AI/quest system
              try {
                gameEventDetector.processFrame();

                // Flush and send events to main thread
                if (gameEventDetector.hasPendingEvents()) {
                  const events = gameEventDetector.flushEvents();
                  worker.postMessage({
                    action: 'game_events',
                    events: events
                  });
                }
              } catch (e) {
                // Don't spam errors - event detection is non-critical
              }
            }, 50);
          '''

          new_loop = r'''  setInterval(() => {
              call_api(
                "DApi_Render",
                Math.floor(performance.now())
              );
            }, 50);
          '''

          text = replace_once(
              text,
              old_loop,
              new_loop,
              "render loop"
          )

          p.write_text(
              text,
              encoding="utf-8"
          )

          # --------------------------------
          # loader: no memory scan
          # --------------------------------

          p = (
              app /
              "src/api/loader.js"
          )

          text = p.read_text(
              encoding="utf-8"
          )

          neural = r'''          // Initialize NeuralGameController with the worker
                    // Note: WASM module is not directly accessible here, controller will
                    // work through worker messages
                    neuralGameController.initialize(null, worker).then(() => {
                      console.log('[Loader] NeuralGameController initialized');
                    }).catch(err => {
                      console.warn('[Loader] NeuralGameController init failed:', err);
                    });

          '''

          text = replace_once(
              text,
              neural,
              """          console.log('[Loader] NEURAL_STARTUP_DISABLED');

          """,
              "neural startup"
          )

          marker = """      const worker = new Worker();

                let packetQueue = [];"""

          replacement = """      const worker = new Worker();

                worker.addEventListener(
                  "error",
                  event => {
                    reject(
                      new Error(
                        event.message ||
                        "Game worker crashed"
                      )
                    );
                  }
                );

                let packetQueue = [];"""

          text = replace_once(
              text,
              marker,
              replacement,
              "worker error handler"
          )

          p.write_text(
              text,
              encoding="utf-8"
          )

          print("FRONTEND_PATCH_OK")
          PY

      - name: Patch webpack output
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "app/config/webpack.config.js"
          )

          text = p.read_text(
              encoding="utf-8"
          )

          text = text.replace(
              "futureEmitAssets: true,",
              "futureEmitAssets: false,",
              1
          )

          p.write_text(
              text,
              encoding="utf-8"
          )

          p = Path(
              "app/scripts/build.js"
          )

          text = p.read_text(
              encoding="utf-8"
          )

          marker = (
              "const isInteractive = "
              "process.stdout.isTTY;"
          )

          helper = r'''
          const isInteractive = process.stdout.isTTY;

          function forceWriteAssets(stats) {
            const assets =
              stats.compilation.assets || {};

            const names =
              Object.keys(assets);

            if (!names.length) {
              throw new Error(
                "No webpack assets"
              );
            }

            for (const name of names) {
              let source =
                assets[name].source();

              if (
                source instanceof Uint8Array &&
                !Buffer.isBuffer(source)
              ) {
                source =
                  Buffer.from(source);
              }

              if (
                typeof source !== "string" &&
                !Buffer.isBuffer(source)
              ) {
                source =
                  Buffer.from(source);
              }

              const output =
                path.join(
                  paths.appBuild,
                  name
                );

              fs.ensureDirSync(
                  path.dirname(output)
              );

              fs.writeFileSync(
                output,
                source
              );
            }
          }
          '''

          if marker not in text:
              raise SystemExit(
                  "PATCH FAILED: build marker"
              )

          text = text.replace(
              marker,
              helper,
              1
          )

          marker2 = (
              "      return resolve({\n"
              "        stats,"
          )

          replacement2 = (
              "      forceWriteAssets(stats);\n"
              "\n"
              "      return resolve({\n"
              "        stats,"
          )

          if marker2 not in text:
              raise SystemExit(
                  "PATCH FAILED: build resolve"
              )

          text = text.replace(
              marker2,
              replacement2,
              1
          )

          p.write_text(
              text,
              encoding="utf-8"
          )

          print("WEBPACK_PATCH_OK")
          PY

      - name: Verify patched runtime source
        shell: bash
        run: |
          set -e

          grep -Fq \
            "TryMobileAutoAttack" \
            engine/Source/diablo.cpp

          grep -Fq \
            "CMD_ATTACKID" \
            engine/Source/diablo.cpp

          grep -Fq \
            "CMD_RATTACKID" \
            engine/Source/diablo.cpp

          test -s \
            app/public/wasm/Diablo.js

          test -s \
            app/public/wasm/Diablo.wasm

          test -s \
            app/public/wasm/DiabloSpawn.js

          test -s \
            app/public/wasm/DiabloSpawn.wasm

          grep -Fq \
            "NEURAL_STARTUP_DISABLED" \
            app/src/api/loader.js

          echo "AUTOATTACK_RUNTIME_SOURCE_OK"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
        run: |
          set -e

          npm ci \
            --legacy-peer-deps \
            --no-audit \
            --no-fund \
            --ignore-scripts

      - name: Build frontend
        working-directory: app
        env:
          PUBLIC_URL: /Game
          NODE_ENV: production
          CI: false
          NODE_OPTIONS: --openssl-legacy-provider
          GENERATE_SOURCEMAP: false
          INLINE_RUNTIME_CHUNK: false
        run: |
          set -e
          npm run build

      - name: Create index
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          build = Path("app/build")
          public = Path("app/public")

          js = (
              build /
              "static/js"
          )

          css = (
              build /
              "static/css"
          )

          runtime = sorted(
              js.glob(
                  "runtime~main.*.js"
              )
          )

          chunks = sorted(
              p
              for p in js.glob(
                  "*.chunk.js"
              )
              if p.name[0].isdigit()
          )

          main = sorted(
              js.glob(
                  "main.*.js"
              )
          )

          styles = sorted(
              css.glob(
                  "main.*.css"
              )
          )

          if not runtime:
              raise SystemExit(
                  "RUNTIME JS MISSING"
              )

          if not main:
              raise SystemExit(
                  "MAIN JS MISSING"
              )

          html = (
              public /
              "index.html"
          ).read_text(
              encoding="utf-8"
          )

          html = html.replace(
              "%PUBLIC_URL%",
              "/Game"
          )

          css_tags = "\n".join(
              (
                  '<link rel="stylesheet" '
                  f'href="/Game/static/css/{p.name}">'
              )
              for p in styles
          )

          scripts = (
              runtime +
              chunks +
              main
          )

          js_tags = "\n".join(
              (
                  '<script '
                  f'src="/Game/static/js/{p.name}">'
                  '</script>'
              )
              for p in scripts
          )

          html = html.replace(
              "</head>",
              css_tags +
              "\n</head>"
          )

          html = html.replace(
              "</body>",
              js_tags +
              "\n</body>"
          )

          (
              build /
              "index.html"
          ).write_text(
              html,
              encoding="utf-8"
          )

          print("INDEX_OK")
          PY

      - name: Prepare Pages
        shell: bash
        run: |
          set -e

          rm -f \
            app/build/service-worker.js

          find \
            app/build \
            -maxdepth 1 \
            -name 'precache-manifest*' \
            -delete

          touch \
            app/build/.nojekyll

          test -s \
            app/build/index.html

          test -s \
            app/build/spawn.mpq

          test -s \
            app/build/wasm/Diablo.js

          test -s \
            app/build/wasm/Diablo.wasm

          test -s \
            app/build/wasm/DiabloSpawn.js

          test -s \
            app/build/wasm/DiabloSpawn.wasm

          find \
            app/build/static/js \
            -type f \
            -name 'main.*.js' \
            -size +0c \
            | grep -q .

          find \
            app/build \
            -maxdepth 1 \
            -type f \
            -name '*.worker.js' \
            -size +0c \
            | grep -q .

          echo "AUTOATTACK_SITE_READY"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build

  deploy:
    needs: build
    runs-on: ubuntu-22.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
