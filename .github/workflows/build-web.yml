      - name: Upload V12 mobile game
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Mobile-V12-Monster-Bridge
          path: dist/mobile/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Mobile-V12-Diagnostics
          path: reports/
          if-no-files-found: warn
          retention-days: 14
