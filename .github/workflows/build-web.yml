
name: Sanctuary of Aden Mobile V12 Monster Motion Bridge

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml
      - mobile-monsters/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sanctuary-mobile-v12
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore successful V11 mobile game
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/mobile reports
          if gh run download 39036538203 --repo "$GITHUB_REPOSITORY" --name Sanctuary-Mobile-V11-Render-Optimized --dir dist/mobile; then
            echo 'V11 success artifact restored'
          else
            rm -rf dist/mobile
            mkdir -p dist/mobile
            git show 604d85bf4baa1ce4594145b04bb1efd7881a1c52:.github/workflows/build-web.yml > reports/verified-v11.yml
            python3 -m venv /tmp/sanctuary-build
            /tmp/sanctuary-build/bin/pip -q install 'PyYAML==6.0.2' 'Pillow==11.3.0'
            cat > reports/rebuild_v11.py <<'PY_REBUILD'
          import os,subprocess,yaml
          from pathlib import Path
          steps=yaml.safe_load(Path('reports/verified-v11.yml').read_text(encoding='utf-8'))['jobs']['build']['steps']
          env=dict(os.environ)
          env['PATH']='/tmp/sanctuary-build/bin:'+env['PATH']
          for name in ('Restore verified V10 mobile runtime','Optimize visible terrain and sprite loading','Validate complete original assets and V11 mobile gameplay'):
              matched=[step for step in steps if step.get('name')==name and 'run' in step]
              if len(matched)!=1:raise SystemExit('V11 pinned step unavailable: '+name)
              subprocess.run(['bash','-e','-o','pipefail','-c',matched[0]['run']],check=True,env=env)
              print('V11 rebuilt:',name,flush=True)
          PY_REBUILD
            /tmp/sanctuary-build/bin/python reports/rebuild_v11.py
          fi

      - name: Restore V18 original Orc motion evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reports/v18
          gh run download 39033202150 --repo "$GITHUB_REPOSITORY" --name Sanctuary-V18-Orc-GIF-Motions --dir reports/v18
          test -s reports/v18/mapping-v18.json
          test -s reports/v18/summary-v18.json

