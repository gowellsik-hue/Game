      - name: Verify files and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY'
          from pathlib import Path
          import json
          import re
          root = Path('dist/mobile')
          data = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          html = (root / 'index.html').read_text(encoding='utf-8')
          if '/*MANIFEST_DATA*/' in html:
              raise SystemExit('Manifest injection failed')
          for actor in ['hero', 'enemy']:
              actions = data['actors'][actor]['actions']
              if not all(str(key) in actions for key in range(8)):
                  raise SystemExit('Required fallback sprite keys missing for ' + actor)
              if len(actions) < 8:
                  raise SystemExit('No sprite action selection available')
              for paths in actions.values():
                  for file in paths:
                      if not (root / file).is_file() or (root / file).stat().st_size < 80:
                          raise SystemExit('Invalid image output: ' + file)
          js = re.search(r'<script>([\s\S]*?)</script>', html)
          if js is None:
              raise SystemExit('Embedded JavaScript not found')
          Path('reports/engine.js').write_text(js.group(1), encoding='utf-8')
          if 'id="lab"' not in html or 'id="field"' not in html:
              raise SystemExit('Game or motion-lab UI missing')
          print('Converted sprite keys:', {k: v['converted'] for k, v in data['actors'].items()})
          print('Generated frame PNG count:', len(list((root/'assets').glob('*.png'))))
          print('Decode warnings:', data['decode_errors'])
          PY_VERIFY
          node --check reports/engine.js
          {
            echo 'Sanctuary of Aden V3'
            echo ''
            echo 'Original Sprite.idx and Sprite.pak decoded into a browseable mobile sprite action catalog.'
            echo 'Game movement and combat remain playable while verified motion maps can be assigned per direction.'
            echo 'Unverified names, directions and action categories are never automatically treated as original client data.'
            echo 'GitHub Pages and the separate SLKnight workflow are unchanged.'
            echo 'Download the Sanctuary-Mobile-V3-Motion-Lab artifact and open index.html.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mobile game and motion inspector
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Mobile-V3-Motion-Lab
          path: dist/mobile/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Upload extraction diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Mobile-V3-Diagnostics
          path: reports/
          if-no-files-found: warn
          retention-days: 14
