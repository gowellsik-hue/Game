name: Deploy DiabloWeb playable baseline

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout modern frontend
        uses: actions/checkout@v4
        with:
          repository: levidehaan/diablowebai
          ref: 4becbb4c81323dc8982504ecb2a5f338434c9772
          path: app

      - name: Checkout proven DiabloWeb engine
        uses: actions/checkout@v4
        with:
          repository: d07RiV/diabloweb
          ref: 998629fd5d9f87ba9693cf1409cf2acea603c06e
          path: proven

      - name: Patch application
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import json
          import re
          import shutil
          from pathlib import Path

          app = Path("app")
          proven = Path("proven")

          # ==================================================
          # 1. Fix upstream package mismatch
          # ==================================================

          package = app / "package.json"

          data = json.loads(
              package.read_text(
                  encoding="utf-8"
              )
          )

          data.get(
              "devDependencies",
              {}
          ).pop(
              "canvas",
              None
          )

          package.write_text(
              json.dumps(
                  data,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print("PACKAGE_FIXED")

          # ==================================================
          # 2. Disable service worker
          # ==================================================

          index = app / "src/index.js"

          text = index.read_text(
              encoding="utf-8"
          )

          old = """serviceWorker.register({
            onUpdate() {
            },
          });"""

          if old not in text:
              raise SystemExit(
                  "ERROR: service worker block not found"
              )

          text = text.replace(
              old,
              "serviceWorker.unregister();",
              1
          )

          index.write_text(
              text,
              encoding="utf-8"
          )

          print("SERVICE_WORKER_DISABLED")

          # ==================================================
          # 3. Install proven Diablo engine pair
          # ==================================================

          wasm_dir = app / "public/wasm"

          wasm_dir.mkdir(
              parents=True,
              exist_ok=True
          )

          copies = {
              "Diablo.jscc":
                  "Diablo.js",
              "Diablo.wasm":
                  "Diablo.wasm",
              "DiabloSpawn.jscc":
                  "DiabloSpawn.js",
              "DiabloSpawn.wasm":
                  "DiabloSpawn.wasm",
          }

          for src, dst in copies.items():
              shutil.copy2(
                  proven / "src/api" / src,
                  wasm_dir / dst
              )

          print("PROVEN_ENGINE_INSTALLED")

          # ==================================================
          # 4. Patch game worker
          # ==================================================

          worker = (
              app /
              "src/api/game.worker.js"
          )

          text = worker.read_text(
              encoding="utf-8"
          )

          # Do not let Webpack parse JSCC.
          imports = [
              "import DiabloBinary from './Diablo.wasm';\n",
              "import DiabloModule from './Diablo.jscc';\n",
              "import SpawnBinary from './DiabloSpawn.wasm';\n",
              "import SpawnModule from './DiabloSpawn.jscc';\n",
          ]

          for line in imports:
              text = text.replace(
                  line,
                  ""
              )

          # Exact proven engine binary sizes.
          text = re.sub(
              r"const DiabloSize = \d+;\s*"
              r"const SpawnSize = \d+;",
              (
                  "const DiabloSize = 1519717;\n"
                  "const SpawnSize = 1381584;"
              ),
              text,
              count=1
          )

          # Replace modern JSCC loader with direct proven-engine loader.
          start = text.find(
              "async function initWasm("
          )

          end = text.find(
              "\nasync function init_game",
              start
          )

          if start < 0 or end < 0:
              raise SystemExit(
                  "ERROR: initWasm block not found"
              )

          new_loader = r'''async function initWasm(spawn, progress) {
            const base =
              `${process.env.PUBLIC_URL}/wasm`;

            const scriptName =
              spawn
                ? "DiabloSpawn.js"
                : "Diablo.js";

            const wasmName =
              spawn
                ? "DiabloSpawn.wasm"
                : "Diablo.wasm";

            const factoryName =
              spawn
                ? "DiabloSpawn"
                : "Diablo";

            if (
              typeof worker[factoryName]
              !== "function"
            ) {
              importScripts(
                `${base}/${scriptName}?v=${CACHE_VERSION}`
              );
            }

            const factory =
              worker[factoryName];

            if (
              typeof factory
              !== "function"
            ) {
              throw new Error(
                `Missing ${factoryName} module factory`
              );
            }

            const binary =
              await axios.request({
                url:
                  `${base}/${wasmName}?v=${CACHE_VERSION}`,
                responseType:
                  "arraybuffer",
                onDownloadProgress:
                  progress,
              });

            const module =
              factory({
                wasmBinary:
                  binary.data,
              });

            const readyModule =
              module && module.ready
                ? await module.ready
                : await module;

            if (
              !readyModule ||
              typeof readyModule._DApi_Init
                !== "function" ||
              typeof readyModule._DApi_Render
                !== "function" ||
              typeof readyModule._DApi_Mouse
                !== "function" ||
              typeof readyModule._DApi_Key
                !== "function"
            ) {
              throw new Error(
                "Proven Diablo engine API initialization failed"
              );
            }

            progress({
              loaded:
                binary.data.byteLength
            });

            return readyModule;
          }
          '''

          text = (
              text[:start]
              + new_loader
              + text[end:]
          )

          # ==================================================
          # 5. Disable GameEventDetector startup
          # ==================================================

          detector_init = r'''  // Initialize Game Event Detector for AI quest system
            try {
              gameEventDetector.initialize(wasm);
              console.log('[Worker] Game Event Detector initialized');
            } catch (e) {
              console.warn('[Worker] Game Event Detector init failed:', e);
            }
          '''

          if detector_init in text:
              text = text.replace(
                  detector_init,
                  """  // Neural event detector disabled for baseline gameplay.
            console.log('[Worker] Neural event detector disabled');
          """,
                  1
              )
          else:
              print(
                  "NOTE: detector init block not found"
              )

          # ==================================================
          # 6. PURE render loop.
          #
          # Remove neural processFrame from the 50ms game loop.
          # ==================================================

          old_render = r'''  setInterval(() => {
              call_api("DApi_Render", Math.floor(performance.now()));

              // Process game events for AI/quest system
              try {
                gameEventDetector.processFrame();

                // Flush and send events to main thread
                if (gameEventDetector.hasPendingEvents()) {
                  const events = gameEventDetector.flushEvents();
                  worker.postMessage({
                    action: 'game_events',
                    events: events
                  });
                }
              } catch (e) {
                // Don't spam errors - event detection is non-critical
              }
            }, 50);
          '''

          new_render = r'''  setInterval(() => {
              call_api(
                "DApi_Render",
                Math.floor(performance.now())
              );
            }, 50);
          '''

          if old_render not in text:
              raise SystemExit(
                  "ERROR: render loop block not found"
              )

          text = text.replace(
              old_render,
              new_render,
              1
          )

          worker.write_text(
              text,
              encoding="utf-8"
          )

          print("GAME_WORKER_BASELINE_OK")

          # ==================================================
          # 7. Disable automatic NeuralGameController startup
          #
          # THIS is the mobile freeze culprit:
          #
          # loaded
          # -> NeuralGameController
          # -> LevelInjector
          # -> scanMemory
          # -> 128 MB heap scan
          # ==================================================

          loader = (
              app /
              "src/api/loader.js"
          )

          text = loader.read_text(
              encoding="utf-8"
          )

          neural_block = r'''          // Initialize NeuralGameController with the worker
                    // Note: WASM module is not directly accessible here, controller will
                    // work through worker messages
                    neuralGameController.initialize(null, worker).then(() => {
                      console.log('[Loader] NeuralGameController initialized');
                    }).catch(err => {
                      console.warn('[Loader] NeuralGameController init failed:', err);
                    });

          '''

          if neural_block not in text:
              raise SystemExit(
                  "ERROR: NeuralGameController startup block not found"
              )

          text = text.replace(
              neural_block,
              """          // Neural startup deliberately disabled.
                    // Automatic memory scanning freezes the game worker
                    // on mobile because the WASM heap is 128 MB.
                    console.log(
                      '[Loader] NEURAL_STARTUP_DISABLED'
                    );

          """,
              1
          )

          # ==================================================
          # 8. Add worker error reporting
          # ==================================================

          marker = """      const worker = new Worker();

                let packetQueue = [];"""

          replacement = """      const worker = new Worker();

                worker.addEventListener(
                  "error",
                  event => {
                    const message =
                      event && event.message
                        ? event.message
                        : "Game worker crashed";

                    console.error(
                      "[Loader] Game worker error:",
                      message
                    );

                    reject(
                      new Error(message)
                    );
                  }
                );

                worker.addEventListener(
                  "messageerror",
                  () => {
                    reject(
                      new Error(
                        "Game worker message error"
                      )
                    );
                  }
                );

                let packetQueue = [];"""

          if marker not in text:
              raise SystemExit(
                  "ERROR: worker creation block not found"
              )

          text = text.replace(
              marker,
              replacement,
              1
          )

          loader.write_text(
              text,
              encoding="utf-8"
          )

          print("NEURAL_STARTUP_DISABLED")
          print("PATCH_COMPLETE")
          PY

      - name: Patch webpack output
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          webpack = Path(
              "app/config/webpack.config.js"
          )

          text = webpack.read_text(
              encoding="utf-8"
          )

          text = text.replace(
              "futureEmitAssets: true,",
              "futureEmitAssets: false,",
              1
          )

          webpack.write_text(
              text,
              encoding="utf-8"
          )

          build = Path(
              "app/scripts/build.js"
          )

          text = build.read_text(
              encoding="utf-8"
          )

          marker = (
              "const isInteractive = "
              "process.stdout.isTTY;"
          )

          helper = r'''
          const isInteractive = process.stdout.isTTY;

          function forceWriteAssets(stats) {
            const assets =
              stats.compilation.assets || {};

            const names =
              Object.keys(assets);

            console.log(
              "[FORCE-EMIT]",
              names.length
            );

            if (!names.length) {
              throw new Error(
                "No webpack assets"
              );
            }

            for (const name of names) {
              let source =
                assets[name].source();

              if (
                source instanceof Uint8Array &&
                !Buffer.isBuffer(source)
              ) {
                source =
                  Buffer.from(source);
              }

              if (
                typeof source !== "string" &&
                !Buffer.isBuffer(source)
              ) {
                source =
                  Buffer.from(source);
              }

              const output =
                path.join(
                  paths.appBuild,
                  name
                );

              fs.ensureDirSync(
                path.dirname(output)
              );

              fs.writeFileSync(
                output,
                source
              );
            }
          }
          '''

          if marker not in text:
              raise SystemExit(
                  "ERROR: build marker missing"
              )

          text = text.replace(
              marker,
              helper,
              1
          )

          marker2 = (
              "      return resolve({\n"
              "        stats,"
          )

          replacement = (
              "      forceWriteAssets(stats);\n"
              "\n"
              "      return resolve({\n"
              "        stats,"
          )

          if marker2 not in text:
              raise SystemExit(
                  "ERROR: resolve marker missing"
              )

          text = text.replace(
              marker2,
              replacement,
              1
          )

          build.write_text(
              text,
              encoding="utf-8"
          )

          print("WEBPACK_OUTPUT_PATCH_OK")
          PY

      - name: Verify source patches
        shell: bash
        run: |
          set -e

          test -s \
            app/public/wasm/Diablo.js

          test -s \
            app/public/wasm/DiabloSpawn.js

          test -s \
            app/public/wasm/Diablo.wasm

          test -s \
            app/public/wasm/DiabloSpawn.wasm

          test "$(
            stat -c%s \
              app/public/wasm/Diablo.wasm
          )" -eq 1519717

          test "$(
            stat -c%s \
              app/public/wasm/DiabloSpawn.wasm
          )" -eq 1381584

          node --check \
            app/public/wasm/Diablo.js

          node --check \
            app/public/wasm/DiabloSpawn.js

          grep -q \
            "NEURAL_STARTUP_DISABLED" \
            app/src/api/loader.js

          if grep -q \
            "neuralGameController.initialize(null, worker)" \
            app/src/api/loader.js
          then
            echo \
              "ERROR: neural startup still enabled"
            exit 1
          fi

          if grep -q \
            "gameEventDetector.processFrame()" \
            app/src/api/game.worker.js
          then
            echo \
              "ERROR: neural frame processing still enabled"
            exit 1
          fi

          grep -q \
            'call_api(' \
            app/src/api/game.worker.js

          grep -q \
            '"DApi_Render"' \
            app/src/api/game.worker.js

          echo \
            "BASELINE_SOURCE_OK"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        shell: bash
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
        run: |
          set -e

          npm ci \
            --legacy-peer-deps \
            --no-audit \
            --no-fund \
            --ignore-scripts

      - name: Build
        working-directory: app
        shell: bash
        env:
          PUBLIC_URL: /Game
          NODE_ENV: production
          CI: false
          NODE_OPTIONS: --openssl-legacy-provider
          GENERATE_SOURCEMAP: false
          INLINE_RUNTIME_CHUNK: false
        run: |
          set -e

          npm run build

      - name: Create index HTML
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          build = Path(
              "app/build"
          )

          public = Path(
              "app/public"
          )

          jsdir = (
              build /
              "static" /
              "js"
          )

          cssdir = (
              build /
              "static" /
              "css"
          )

          runtime = sorted(
              jsdir.glob(
                  "runtime~main.*.js"
              )
          )

          chunks = sorted(
              p for p
              in jsdir.glob(
                  "*.chunk.js"
              )
              if p.name[0].isdigit()
          )

          main = sorted(
              jsdir.glob(
                  "main.*.js"
              )
          )

          css = sorted(
              cssdir.glob(
                  "main.*.css"
              )
          )

          if not runtime:
              raise SystemExit(
                  "ERROR: runtime JS missing"
              )

          if not main:
              raise SystemExit(
                  "ERROR: main JS missing"
              )

          html = (
              public /
              "index.html"
          ).read_text(
              encoding="utf-8"
          )

          html = html.replace(
              "%PUBLIC_URL%",
              "/Game"
          )

          css_tags = "\n".join(
              f'<link rel="stylesheet" '
              f'href="/Game/static/css/{p.name}">'
              for p in css
          )

          scripts = (
              runtime +
              chunks +
              main
          )

          js_tags = "\n".join(
              f'<script '
              f'src="/Game/static/js/{p.name}">'
              f'</script>'
              for p in scripts
          )

          html = html.replace(
              "</head>",
              css_tags +
              "\n</head>"
          )

          html = html.replace(
              "</body>",
              js_tags +
              "\n</body>"
          )

          (
              build /
              "index.html"
          ).write_text(
              html,
              encoding="utf-8"
          )

          print("INDEX_OK")
          PY

      - name: Clean cache files
        shell: bash
        run: |
          set -e

          rm -f \
            app/build/service-worker.js

          find \
            app/build \
            -maxdepth 1 \
            -name 'precache-manifest*' \
            -delete

          touch \
            app/build/.nojekyll

      - name: Verify final runtime
        shell: bash
        run: |
          set -e

          test -s \
            app/build/index.html

          test -s \
            app/build/spawn.mpq

          test -s \
            app/build/wasm/Diablo.js

          test -s \
            app/build/wasm/Diablo.wasm

          test -s \
            app/build/wasm/DiabloSpawn.js

          test -s \
            app/build/wasm/DiabloSpawn.wasm

          test "$(
            stat -c%s \
              app/build/wasm/Diablo.wasm
          )" -eq 1519717

          test "$(
            stat -c%s \
              app/build/wasm/DiabloSpawn.wasm
          )" -eq 1381584

          find \
            app/build/static/js \
            -type f \
            -name 'main.*.js' \
            -size +0c \
            | grep -q .

          GAME_WORKER="$(
            grep -l \
              "DiabloSpawn.js" \
              app/build/*.worker.js \
              | head -1
          )"

          if [ -z "$GAME_WORKER" ]; then
            echo \
              "ERROR: game worker missing"
            exit 1
          fi

          if grep -Fq \
            "Module parse failed" \
            "$GAME_WORKER"
          then
            echo \
              "ERROR: broken worker"
            exit 1
          fi

          if grep -Fq \
            "Game Event Detector initialized" \
            "$GAME_WORKER"
          then
            echo \
              "ERROR: neural detector remains enabled"
            exit 1
          fi

          if grep -Fq \
            "processFrame()" \
            "$GAME_WORKER"
          then
            echo \
              "ERROR: neural frame loop remains enabled"
            exit 1
          fi

          MAIN_JS="$(
            find \
              app/build/static/js \
              -type f \
              -name 'main.*.js' \
              | head -1
          )"

          if grep -Fq \
            "NeuralGameController initialized" \
            "$MAIN_JS"
          then
            echo \
              "ERROR: neural startup code remains"
            exit 1
          fi

          echo \
            "GAME_WORKER=$GAME_WORKER"

          echo \
            "PURE_GAME_BASELINE_OK"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: diabloweb-playable-baseline
          path: app/build/
          if-no-files-found: error

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build

  deploy:
    needs: build
    runs-on: ubuntu-22.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
