
name: Sanctuary of Aden Mobile V7 Targeting and Combat Timing

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sanctuary-mobile-v7
  cancel-in-progress: false

jobs:
  build:
    name: Build V7 target selection and timed combat on verified V6
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out original source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore verified V6 mobile package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p src reports dist/mobile
          if gh run download 38875478252 --repo "$GITHUB_REPOSITORY" --name Sanctuary-Mobile-V6-MultiSPR-Original-Map4 --dir dist/mobile; then
            echo "VERIFIED V6 ARTIFACT RESTORED"
          else
            rm -rf dist/mobile
            mkdir -p dist/mobile
            git cat-file -e 'aa1d4be10745a30f1bf9569c0f8ba76e0513cbee^{commit}'
            git show aa1d4be10745a30f1bf9569c0f8ba76e0513cbee:.github/workflows/build-web.yml > reports/pinned-v6.yml
            python -m pip install --disable-pip-version-check 'PyYAML==6.0.2' 'Pillow==11.3.0'
            cat > src/rebuild_v6.py <<'PY_REBUILD'
          import os
          import subprocess
          from pathlib import Path
          import yaml

          filename = Path('reports/pinned-v6.yml')
          workflow = yaml.safe_load(filename.read_text(encoding='utf-8'))
          steps = workflow['jobs']['build']['steps']
          needed = [
              'Prepare isolated build',
              'Download 46 original client pieces',
              'Extract Sprite, Tile and real Aden Map 4',
              'Install decoder and restore V4 mobile engine',
              'Restore pinned V5 tile decoder and expand original SPR actions',
              'Validate eight directional motions and original map'
          ]
          env = dict(os.environ)
          for name in needed:
              matches = [item for item in steps if item.get('name') == name and 'run' in item]
              if len(matches) != 1:
                  raise SystemExit('Pinned V6 step missing or duplicated: ' + name)
              print('REBUILD V6:', name, flush=True)
              subprocess.run(
                  ['bash', '-e', '-o', 'pipefail', '-c', matches[0]['run']],
                  env=env, check=True
              )
              env_path = Path(env['GITHUB_ENV'])
              if env_path.exists():
                  for line in env_path.read_text(encoding='utf-8').splitlines():
                      if '=' in line:
                          key, value = line.split('=', 1)
                          if key.isidentifier():
                              env[key] = value
          print('VERIFIED V6 SOURCE REBUILD COMPLETE')
          PY_REBUILD
            python src/rebuild_v6.py
          fi
          python3 - <<'PY_CHECK_V6'
          import json
          from pathlib import Path
          root=Path('dist/mobile')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          if manifest.get('version') != 6 or len(manifest.get('actors',{})) != 8:
              raise SystemExit('V6 original multi-SPR package is missing')
          if manifest.get('map',{}).get('size') != [192,192]:
              raise SystemExit('V6 original map is missing')
          if not (root/'index.html').is_file():
              raise SystemExit('V6 entrypoint missing')
          print('RESTORED V6 PACKAGE:',len(manifest['actors']),'SPR IDs')
          PY_CHECK_V6

      - name: Upgrade V6 to V7 targeting and timed combat
        shell: bash
        run: |
          set -euo pipefail
          cat > src/patch_v7.py <<'PY_PATCH'
          from pathlib import Path
          import json
          import re
          import sys

          root = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('dist/mobile')
          page = root / 'index.html'
          manifest_file = root / 'manifest.json'
          html = page.read_text(encoding='utf-8')
          manifest = json.loads(manifest_file.read_text(encoding='utf-8'))
          if manifest.get('version') != 6 or len(manifest.get('actors', {})) != 8 or manifest.get('map',{}).get('size') != [192,192]:
              raise SystemExit('Expected successful V6 mobile package with original map and eight SPR actors')

          def replace(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise ValueError(f'{label}: expected exactly one match, got {n}')
              return text.replace(old,new,1)

          html = replace(html,'Sanctuary of Aden Mobile V6 · Multi Sprite Animations','Sanctuary of Aden Mobile V7 · Combat Targeting', 'title')
          html = replace(html,'Sanctuary Mobile V6</strong>','Sanctuary Mobile V7</strong>', 'hud')
          html = replace(html,'<button id="again" type="button">다시 시작</button>', '<button id="again" type="button">다시 시작</button><div id="targetPanel" hidden><b id="targetName">SPR ID</b><span id="targetHP">HP --</span><div id="targetGauge"><div id="targetFill"></div></div></div>', 'target panel')
          html = replace(html, '<div id="keys"><button id="autoBtn" class="good">자동 ON</button><button id="hitBtn">공격</button><button id="potion">물약 10</button></div>', '<div id="keys"><button id="autoBtn" class="good">자동 ON</button><button id="hitBtn">공격</button><button id="potion">물약 10</button><button id="targetBtn">다음 몹</button><button id="clearTargetBtn">선택 해제</button></div>', 'target buttons')
          html = replace(html, '</style>', '''#targetPanel{position:absolute;top:calc(139px + env(safe-area-inset-top));left:8px;min-width:148px;max-width:46vw;padding:6px 9px;border:1px solid #c2a47899;border-radius:9px;background:#0b1c1fda;pointer-events:none;color:#f4e5bc;font-size:11px;z-index:3}
          #targetPanel[hidden]{display:none}
          #targetPanel b{display:block;color:#ffe9af;font-size:13px}
          #targetPanel span{display:block;color:#e8d8c5}
          #targetGauge{height:6px;background:#6c2925;margin-top:5px;border-radius:5px;overflow:hidden}
          #targetFill{height:100%;width:100%;background:#e56e5f}
          #targetBtn,#clearTargetBtn{font-size:11px;padding:8px 3px}
          #targetBtn{grid-column:1;grid-row:3}
          #clearTargetBtn{grid-column:2;grid-row:3}
          @media(max-height:440px){#targetPanel{top:calc(88px + env(safe-area-inset-top));left:8px;min-width:115px}}
          </style>''','target css')

          original = re.search(r'<script>([\s\S]*?)</script>',html)
          if not original:
              raise ValueError('Embedded V6 game script missing')
          js = original.group(1)
          js = replace(js,'let labPage=0,selectedKey=0,toastUntil=0,showBlocked=false,showObjects=true,showTextures=true;', 'let labPage=0,selectedKey=0,toastUntil=0,showBlocked=false,showObjects=true;\nlet selectedMob=null,damageNumbers=[];', 'combat state')
          js = replace(js,"mobs=Array.from({length:7},(_,i)=>makeMob(i));refresh();msg('7종 원본 SPR 그래픽·이동·공격 모션 시험',3)","selectedMob=null;damageNumbers=[];mobs=Array.from({length:7},(_,i)=>makeMob(i));refresh();updateTargetPanel();msg('7종 SPR · 터치 타겟 선택·반격 타이밍 테스트',3)", 'reset target')
          js = replace(js, "visual:ROSTER[(id+score)%ROSTER.length],hp:35,anim:0", "visual:ROSTER[id%ROSTER.length],hp:35,maxHp:35,attackAt:0,attackDone:true,anim:0", 'stable monster sprites')
          js = replace(js,'function setMode(a,newMode)', '''function battleTarget(radius){if(selectedMob&&!selectedMob.dead&&dist(hero,selectedMob)<radius)return selectedMob;return nearest(radius)}
          function chooseMonster(target,approach=true){if(!target||target.dead)return;selectedMob=target;if(approach){hero.goalMob=target;hero.goalMobRepath=0;hero.path=[]}updateTargetPanel()}
          function updateTargetPanel(){let panel=el('targetPanel');if(!selectedMob||selectedMob.dead){panel.hidden=true;return}panel.hidden=false;el('targetName').textContent='원본 SPR '+D.actors[selectedMob.visual].sprite_id;el('targetHP').textContent='HP '+Math.max(0,Math.ceil(selectedMob.hp))+' / '+selectedMob.maxHp;el('targetFill').style.width=clamp(selectedMob.hp/selectedMob.maxHp*100,0,100)+'%'}
          function numberFx(unit,value,color){damageNumbers.push({x:unit.x,y:unit.y,text:String(value),color:color,expires:clock+.8});if(damageNumbers.length>50)damageNumbers.shift()}
          function drawTargetRing(){if(!selectedMob||selectedMob.dead)return;let p=screen(selectedMob.x,selectedMob.y);ctx.save();ctx.strokeStyle='#ffdd6d';ctx.lineWidth=2.7;ctx.beginPath();ctx.ellipse(p.x,p.y+19,26,10,0,0,Math.PI*2);ctx.stroke();ctx.restore()}
          function drawDamageNumbers(){ctx.save();ctx.textAlign='center';ctx.font='bold 17px system-ui';ctx.lineWidth=3;ctx.strokeStyle='#1c1715';for(const fx of damageNumbers){let p=screen(fx.x,fx.y),remaining=fx.expires-clock;ctx.globalAlpha=clamp(remaining*2,0,1);ctx.fillStyle=fx.color;let y=p.y-51-(.8-remaining)*34;ctx.strokeText(fx.text,p.x,y);ctx.fillText(fx.text,p.x,y)}ctx.restore()}
          function setMode(a,newMode)''', 'combat helpers')
          js = replace(js, "function tryAttack(){if(open||hero.dead||hero.attackCd>0)return;if(safe(hero.x,hero.y)){msg('안전지대에서는 공격할 수 없습니다',.7);return}hero.attackCd=.54;hero.attackUntil=clock+.42;hero.damageAt=clock+.21;hero.damageDone=false;hero.hitTarget=nearest(1.75);setMode(hero,'attack');if(!hero.hitTarget)msg('공격 거리 밖',.6)}", '''function tryAttack(manual=false){if(open||hero.dead||hero.attackCd>0)return;if(safe(hero.x,hero.y)){if(manual)msg('안전지대에서는 공격할 수 없습니다',.7);return}let target=battleTarget(1.75);if(!target){if(manual&&selectedMob&&!selectedMob.dead){chooseMonster(selectedMob,true);msg('선택한 몬스터에게 접근',.8)}else if(manual)msg('공격 사정거리 밖',.6);return}hero.attackCd=.54;hero.attackUntil=clock+.42;hero.damageAt=clock+.21;hero.damageDone=false;hero.hitTarget=target;let dx=target.x-hero.x,dy=target.y-hero.y;hero.dir=facing((dx-dy)*TW/2,(dx+dy)*TH/2);setMode(hero,'attack')}''', 'attack and facing')
          js = replace(js, "function applyHit(){hero.damageDone=true;let mob=hero.hitTarget;if(!mob||mob.dead||dist(hero,mob)>1.85)return;mob.hp-=12;mob.hurtUntil=clock+.26;if(mob.hp<=0){mob.dead=true;mob.deadAt=clock;score++;setMode(mob,'death');refresh()}else setMode(mob,'hit')}", '''function applyHit(){hero.damageDone=true;let mob=hero.hitTarget;if(!mob||mob.dead||dist(hero,mob)>1.85)return;mob.hp=Math.max(0,mob.hp-12);mob.hurtUntil=clock+.26;numberFx(mob,'-12','#ffe4a2');if(mob.hp<=0){mob.dead=true;mob.deadAt=clock;score++;setMode(mob,'death');if(mob===selectedMob){selectedMob=null;hero.goalMob=null;hero.path=[]}refresh()}else setMode(mob,'hit');updateTargetPanel()}''', 'player hit resolution')
          js = replace(js, "function drink(){if(hero.dead){msg('다시 시작하세요');return}if(!potions){msg('물약이 없습니다');return}if(hero.hp>=100){msg('HP가 가득합니다');return}potions--;hero.hp=Math.min(100,hero.hp+40);refresh()}", "function drink(){if(hero.dead){msg('다시 시작하세요');return}if(!potions){msg('물약이 없습니다');return}if(hero.hp>=100){msg('HP가 가득합니다');return}potions--;let heal=Math.min(40,100-hero.hp);hero.hp+=heal;numberFx(hero,'+'+heal,'#8dffc0');refresh()}", 'potion feedback')
          js = replace(js, 'hero.path=route;hero.goalMob=null;msg(\'원본 S32 이동 경로 \'+route.length+\'칸\',.8);return true', "hero.path=route;hero.goalMob=null;selectedMob=null;updateTargetPanel();msg('원본 S32 이동 경로 '+route.length+'칸',.8);return true", 'target clear when moving')
          js = replace(js, 'if(open)return;clock+=dt;if(hero.dead){hero.anim+=dt;return}hero.anim+=dt;', '''if(open)return;clock+=dt;damageNumbers=damageNumbers.filter(v=>v.expires>clock);if(hero.dead){hero.anim+=dt;return}if(selectedMob&&selectedMob.dead){selectedMob=null;hero.goalMob=null;updateTargetPanel()}hero.anim+=dt;''', 'combat update lifecycle')
          js = replace(js, 'if(auto&&hero.attackCd<=0)tryAttack()', 'if(auto&&hero.attackCd<=0)tryAttack(false)', 'auto chase')
          js = replace(js, 'for(const mob of mobs){if(mob.dead){if(clock-mob.deadAt>3)mobs[mob.id]=makeMob(mob.id);continue}mob.anim+=dt;mob.attackCd=Math.max(0,mob.attackCd-dt);let dis=dist(mob,hero),mobMoved=false;', '''for(const mob of mobs){if(mob.dead){if(clock-mob.deadAt>3)mobs[mob.id]=makeMob(mob.id);continue}mob.anim+=dt;mob.attackCd=Math.max(0,mob.attackCd-dt);if(!mob.attackDone&&clock>=mob.attackAt){mob.attackDone=true;if(!safe(hero.x,hero.y)&&dist(mob,hero)<1.4){hero.hp=Math.max(0,hero.hp-7);hero.hurtUntil=clock+.28;numberFx(hero,'-7','#ff9696');if(hero.hp<=0){hero.dead=true;hero.deadAt=clock;hero.path=[];setMode(hero,'death');msg('전투 불능 · 다시 시작 버튼',5)}refresh()}}let dis=dist(mob,hero),mobMoved=false;''', 'enemy hit resolution')
          js = replace(js,"else if(mob.attackCd<=0){mob.attackCd=1.35;mob.attackUntil=clock+.38;hero.hp=Math.max(0,hero.hp-7);hero.hurtUntil=clock+.28;if(hero.hp<=0){hero.dead=true;hero.deadAt=clock;hero.path=[];setMode(hero,'death');msg('전투 불능 · 다시 시작 버튼',5)}refresh()}","else if(mob.attackCd<=0){mob.attackCd=1.35;mob.attackUntil=clock+.38;mob.attackAt=clock+.18;mob.attackDone=false}",'delayed enemy impact')
          js = replace(js, 'if(auto&&!hero.goalMob&&hero.attackCd<=0&&nearest(1.65))tryAttack();', 'if(auto&&!hero.goalMob&&hero.attackCd<=0&&battleTarget(1.65))tryAttack(false);', 'auto attack targeting')
          js = replace(js, "let alternatives=[first+dir,mode==='idle'?24+dir:32+dir,mode==='death'?16+dir:0+dir,0+dir];", "let alternatives=mode==='idle'?[first+dir,dir]:mode==='death'?[first+dir,16+dir,dir]:[first+dir,dir];", 'prevent death animation for idle')
          js = replace(js, "ctx.imageSmoothingEnabled=false;ground();let order=", "ctx.imageSmoothingEnabled=false;ground();drawTargetRing();let order=", 'draw selected ring')
          js = replace(js, 'for(let a of order){if(a.ob)drawObject(a.ob);else drawActor(a.unit,a.type)};', 'for(let a of order){if(a.ob)drawObject(a.ob);else drawActor(a.unit,a.type)};drawDamageNumbers();', 'draw floating hit text')
          js = replace(js, "el('hitBtn').addEventListener('pointerdown',e=>{e.preventDefault();tryAttack()});", """el('targetBtn').onclick=()=>{let living=mobs.filter(m=>!m.dead).sort((a,b)=>dist(a,hero)-dist(b,hero));if(!living.length){msg('선택할 몬스터가 없습니다');return}let at=living.indexOf(selectedMob);chooseMonster(living[(at+1)%living.length],true);msg('몬스터 타겟 '+D.actors[selectedMob.visual].sprite_id,.8)};
          el('clearTargetBtn').onclick=()=>{selectedMob=null;hero.goalMob=null;hero.path=[];updateTargetPanel();msg('타겟 해제',.7)};
          el('hitBtn').addEventListener('pointerdown',e=>{e.preventDefault();tryAttack(true)});""", 'mobile target buttons')
          js = replace(js, "if(e.key===' '&&!e.repeat)tryAttack();", "if(e.key===' '&&!e.repeat)tryAttack(true);", 'keyboard manual attack')
          js = replace(js,"if(target&&Math.hypot(target.x-x,target.y-y)<1.2){hero.goalMob=target;hero.goalMobRepath=0;hero.path=[];msg('몬스터 대상으로 경로 탐색',1)}else setDestination(x,y)","if(target&&Math.hypot(target.x-x,target.y-y)<1.2){chooseMonster(target,true);msg('SPR '+D.actors[target.visual].sprite_id+' 선택 · 자동 접근',1)}else setDestination(x,y)",'tap target selection')
          js = replace(js,"mctx.fillStyle='#fff6b9';mctx.fillRect(hero.x-OX-3,hero.y-OY-3,6,6)","if(selectedMob&&!selectedMob.dead){mctx.strokeStyle='#ffe060';mctx.lineWidth=2;mctx.strokeRect(selectedMob.x-OX-4,selectedMob.y-OY-4,8,8)}mctx.fillStyle='#fff6b9';mctx.fillRect(hero.x-OX-3,hero.y-OY-3,6,6)", 'minimap targeting')

          html = html[:original.start(1)] + js + html[original.end(1):]
          manifest['version'] = 7
          manifest['status'] = 'S32_TIL_SPR_COMBAT_TARGETING_PROTOTYPE'
          manifest['v7_rules'] = {'monster_identities':'unverified original SPR IDs', 'stats':'test values', 'timing':'test hit timing, not original client rates', 'source':'Successful V6 build artifact, original S32/TIL/SPR retained'}
          manifest_file.write_text(json.dumps(manifest,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          tag = '<script id="manifest" type="application/json">'
          a=html.find(tag)
          b=html.find('</script>',a+len(tag))
          if a<0 or b<0:raise ValueError('Manifest embedding location missing')
          html=html[:a+len(tag)] + json.dumps(manifest,ensure_ascii=False,separators=(',',':')) + html[b:]
          page.write_text(html,encoding='utf-8')
          (root/'README_KO.txt').write_text('Sanctuary Mobile V7\nV6 원본 Map 4 S32 + TIL/SPR 보존\n대상 선택, 타겟 이동, 공격 방향 보정, 타격 프레임 시간 차, 피해량 표시\n몬스터 이름과 원작 전투 수치는 검증 전입니다.\n',encoding='utf-8')
          print('V7_PATCH_OK',len(js),'game JavaScript bytes',len(manifest['actors']),'actors')
          PY_PATCH
          python src/patch_v7.py dist/mobile

      - name: Validate V7 original assets and browser gameplay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VALIDATE'
          from pathlib import Path
          import json,re
          root=Path('dist/mobile')
          m=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          page=(root/'index.html').read_text(encoding='utf-8')
          if m.get('version')!=7 or len(m['actors'])!=8:
              raise SystemExit('V7 actors or manifest missing')
          world=m['map']
          if world['size']!=[192,192] or len(world['flags'])!=192*192 or len(world['objects'])<10000:
              raise SystemExit('Original V6 S32 map not preserved')
          if len(list((root/'tiles').glob('*.png')))<100:
              raise SystemExit('Original TIL atlas not preserved')
          if len(list((root/'assets').glob('*.png')))<3000:
              raise SystemExit('Original SPR frames not preserved')
          for ident in ['targetPanel','targetBtn','clearTargetBtn','lab','minimap','hitBtn','potion']:
              if 'id="'+ident+'"' not in page:
                  raise SystemExit('V7 game control missing: '+ident)
          tag='<script id="manifest" type="application/json">'
          a=page.find(tag)
          b=page.find('</script>',a+len(tag))
          if a<0 or b<0 or json.loads(page[a+len(tag):b]) != m:
              raise SystemExit('Embedded V7 manifest mismatched')
          matches=re.findall(r'<script>([\s\S]*?)</script>',page)
          if len(matches)!=1:
              raise SystemExit('Standalone JavaScript entrypoint invalid')
          Path('reports/game.js').write_text(matches[0],encoding='utf-8')
          print('V7 VALIDATION OK; images:',len(list((root/'assets').glob('*.png'))),'tiles:',len(list((root/'tiles').glob('*.png'))))
          PY_VALIDATE
          node --check reports/game.js
          cat > reports/smoke.cjs <<'NODE_SMOKE'
          const fs=require('fs'),vm=require('vm');
          const source=fs.readFileSync('reports/game.js','utf8');
          const HTML=fs.readFileSync('dist/mobile/index.html','utf8');
          const manifest=HTML.match(/<script id="manifest" type="application\/json">([\s\S]*?)<\/script>/)[1];
          let counter=0, frames=[], callbacks={}, elements={};
          let allCreated=[];
          function context(){let pixels;return new Proxy({
            createImageData(w,h){return {data:new Uint8ClampedArray(w*h*4)}},
            putImageData(img){pixels=img},
            getImageData(){return pixels||{data:new Uint8ClampedArray(192*192*4)}},
            measureText(t){return {width:t.length*10}}
          },{get(t,key){return (key in t)?t[key]:()=>{}},set(t,k,v){t[k]=v;return true}})}
          class Element{
            constructor(id=''){this.id=id;this.listeners={};this.style={};this.textContent=id==='manifest'?manifest:'';this.value=id==='labSpeed'?'110':id==='labFrame'?'-1':id==='labMode'?'idle':id==='labActor'?'hero':id==='labDir'?'0':'0';this.hidden=false;this.classList={add(){},remove(){},toggle(){}};this.clientWidth=360;this.clientHeight=640;this.width=192;this.height=192;this.files=[];this.complete=true;this.naturalWidth=24;this.naturalHeight=24;this.children=[];}
            getContext(){return context()}addEventListener(name,f){(this.listeners[name]??=[]).push(f)}
            setPointerCapture(){}getBoundingClientRect(){return {left:0,top:0,width:140,height:140}}
            click(){this.onclick?.();(this.listeners.click||[]).forEach(f=>f({preventDefault(){}}))}
            pointerdown(){(this.listeners.pointerdown||[]).forEach(f=>f({pointerId:1,clientX:160,clientY:180,preventDefault(){}}))}
            appendChild(v){this.children.push(v)}replaceChildren(...children){this.children=children}remove(){}setAttribute(){}
          }
          let doc={getElementById(id){return elements[id]??(elements[id]=new Element(id))},createElement(n){const x=new Element(n);allCreated.push(x);return x},body:new Element('body')};
          class Image{constructor(){this.complete=true;this.naturalWidth=24;this.naturalHeight=24;this.onload=null;this.onerror=null}set src(v){this._src=v}get src(){return this._src}}
          let storage=new Map(),logs=[],interval=[];
          let store={getItem:k=>storage.get(k)||null,setItem:(k,v)=>storage.set(k,v)};
          let env={document:doc,window:{addEventListener(){},devicePixelRatio:1},devicePixelRatio:1,Image,requestAnimationFrame(fn){frames.push(fn)},localStorage:store,performance:{now(){return counter}},Math,JSON,Int32Array,Uint8ClampedArray,console:{log(){},warn(...args){logs.push(args.join(' '))}},URL:{createObjectURL(){return 'blob:test'},revokeObjectURL(){}},Blob,confirm(){return true},setTimeout(fn){interval.push(fn)}};
          vm.runInNewContext(source,env,{timeout:6000});
          function frame(ms){let cb=frames.shift();if(!cb)throw Error('No animation frame');counter+=ms;cb(counter)}
          let get=id=>doc.getElementById(id);
          if(!get('targetPanel').hidden)throw Error('Target panel should initially be hidden');
          for(let i=0;i<3;i++)frame(16.7);
          get('targetBtn').click();if(get('targetPanel').hidden)throw Error('Target selection failed');
          console.log('selected',get('targetName').textContent,'HP',get('targetHP').textContent);
          for(let i=0;i<5;i++)frame(16.7);
          get('hitBtn').pointerdown();for(let i=0;i<5;i++)frame(16.7);
          get('clearTargetBtn').click();if(!get('targetPanel').hidden)throw Error('Clearing target failed');
          get('autoBtn').click();if(!get('autoBtn').textContent.includes('OFF'))throw Error('Auto toggle failed');
          get('labOpen').click();if(get('lab').hidden)throw Error('Motion lab did not open');
          get('labClose').click();if(!get('lab').hidden)throw Error('Motion lab did not close');
          get('again').click();if(!get('targetPanel').hidden)throw Error('Reset target failed');
          console.log('MOBILE V7 SMOKE PASS; frames',counter,'warnings',logs.length);
          NODE_SMOKE
          node reports/smoke.cjs
          {
            echo 'Sanctuary Mobile V7'
            echo 'V6 original S32 Map4, TIL textures, 8 SPR actors, motion lab retained.'
            echo 'V7 adds target cycling, tap targeting, automatic approach, attack facing, delayed enemy hits and floating damage.'
            echo 'Original monster names, original action semantics, and original combat statistics remain unverified.'
            echo 'Existing SLKnight workflows and Pages remain unchanged.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload V7 standalone mobile game
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Mobile-V7-Combat-Targeting
          path: dist/mobile/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Upload V7 diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Mobile-V7-Diagnostics
          path: reports/
          if-no-files-found: warn
          retention-days: 14
