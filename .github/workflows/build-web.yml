
name: "build-web.yml | V22 | Sanctuary original S32 recovery"
run-name: "build-web.yml | V22 | Restore verified V19 without SLKnight maps"

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: build-web-yml-v22-original-s32
  cancel-in-progress: false

jobs:
  original_s32_recovery:
    name: "build-web.yml | V22 | Verified Sanctuary-only recovery"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: "V22 | Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "V22 | Restore successful Sanctuary V19 without V20 patches"
        uses: actions/download-artifact@v4
        with:
          repository: gowellsik-hue/Game
          run-id: 39125690585
          name: Sanctuary-Mobile-V19-Timeline-Filters-Frame-Review
          github-token: ${{ github.token }}
          path: dist/mobile

      - name: "V22 | Audit original source, integrity and prohibited cross-imports"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          cat > reports/verify_v22.py <<'PY_V22'
          import hashlib
          import json
          from pathlib import Path

          root = Path('dist/mobile')
          def require(condition, message):
              if not condition:
                  raise SystemExit('V22 VERIFICATION FAILED: ' + message)

          required = (
              'index.html', 'game.js', 'game-data.js', 'game.css',
              'manifest.json', 'monster-pack.js', 'monster-pack.json',
              'motion-review.js', 'build-info.json'
          )
          for name in required:
              require((root / name).is_file(), 'missing ' + name)

          info = json.loads((root / 'build-info.json').read_text(encoding='utf-8'))
          require((info.get('package'), info.get('runtime'), info.get('display_version')) == (19, 19, 'V19'),
                  'pinned successful V19 source is required')
          require(info.get('previous_run') is not None, 'V19 history missing')
          checksums = info.get('sha256', {})
          require(len(checksums) >= 9, 'incomplete V19 checksums')
          for relative_path, expected in sorted(checksums.items()):
              file = root / relative_path
              require(file.is_file(), 'missing pinned file: ' + relative_path)
              actual = hashlib.sha256(file.read_bytes()).hexdigest()
              require(actual == expected, 'source SHA mismatch: ' + relative_path)

          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          game = (root / 'game.js').read_text(encoding='utf-8')
          data = (root / 'game-data.js').read_text(encoding='utf-8')
          html = (root / 'index.html').read_text(encoding='utf-8')
          tiled_map = manifest.get('map', {})
          require('Sanctuary of Aden' in manifest.get('provenance',''), 'non-Sanctuary SPR source')
          require('Sprite.idx' in manifest.get('provenance',''), 'source SPR provenance missing')
          require((tiled_map.get('id'), tiled_map.get('size')) == (4, [192, 192]), 'original S32 test map mismatch')
          require(tiled_map.get('origin') == [33024, 33280], 'original S32 coordinates changed')
          require(len(tiled_map.get('flags', [])) == 192 * 192, 'S32 terrain/collision flags changed')
          require(len(tiled_map.get('objects', [])) == 59963, 'original S32 objects changed')
          require(manifest.get('actors', {}).get('hero', {}).get('sprite_id') == 2786,
                  'V19 hero SPR changed without original identity verification')
          require('window.SANCTUARY_MANIFEST=' in data, 'Sanctuary manifest loader missing')
          require('const TW=64, TH=32' in game, 'original V19 tile projection changed')
          require('let scale=1.04' in game, 'V19 sprite projection was modified')
          require('src="game.js"' in html, 'original Sanctuary runtime missing')
          require('SLKnight' not in game and 'SLKnight' not in data and 'SLKnight' not in html,
                  'SLKnight runtime import forbidden')
          require('native-world' not in html and 'native-world' not in game,
                  'V20 non-Sanctuary map overlay still present')
          require(not (root / 'native-world').exists(), 'V20 SLKnight native-world directory still present')
          require(not list(root.glob('**/map-044.png')), 'SLKnight map image still present')

          png_assets = len(list((root / 'assets').glob('*.png')))
          tile_assets = len(list((root / 'tiles').glob('*.png')))
          require((png_assets, tile_assets) == (3616, 218), 'V19 graphics inventory mismatch')

          evidence = {
              'workflowVersion': 'V22',
              'gameRuntimeVersion': 'V19 (unchanged, verified)',
              'status': 'SUCCESSFUL_V19_BASELINE_RECOVERED_NO_GAME_CODE_CHANGES',
              'restoreSource': 'GitHub Actions run 39125690585',
              'originalSource': manifest['provenance'],
              'map': {'id': tiled_map['id'], 'origin': tiled_map['origin'],
                      'size': tiled_map['size'], 'objects': len(tiled_map['objects']),
                      'flags': len(tiled_map['flags'])},
              'sprites': {'heroCurrentV19SPR': 2786, 'heroIdentityVerified': False,
                          'pngFrames': png_assets},
              'tilePNGCount': tile_assets,
              'v20SLKnight44MapImportsPresent': False,
              'originalClientMapFullyPorted': False,
              'originalClientCollisionFullyVerified': False,
              'knight61CrossSourceScaleApplied': False,
              'gameCodeModified': False,
              'reasonForNoScaleChange': 'SPR 61 / Singlin proportions near 1x do not validate the V19 hero SPR 2786 identity or a uniform scale factor',
              'sourceSHA256Validated': sorted(checksums),
          }
          target = Path('reports/V22-original-recovery-audit.json')
          target.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('V22_ORIGINAL_SANCTUARY_RECOVERY_PASS', json.dumps(evidence, ensure_ascii=False))
          PY_V22
          python3 reports/verify_v22.py
          node --check dist/mobile/game.js
          node --check dist/mobile/motion-review.js
          node --check dist/mobile/monster-pack.js
          cat reports/V22-original-recovery-audit.json >> "$GITHUB_STEP_SUMMARY"

      - name: "V22 | Upload verified original Sanctuary mobile build"
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Mobile-V22-V19-Original-S32-Recovered
          path: |
            dist/mobile/
            reports/V22-original-recovery-audit.json
          if-no-files-found: error
          retention-days: 90
