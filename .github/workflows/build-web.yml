
name: Sanctuary of Aden Mobile V13 Combat Motion Inspection

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-web.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sanctuary-mobile-v13
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore successful V12 mobile game
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/mobile reports
          if gh run download 39041076096 --repo "$GITHUB_REPOSITORY" --name Sanctuary-Mobile-V12-Monster-Bridge --dir dist/mobile; then
            echo 'Successful V12 artifact restored'
          else
            rm -rf dist/mobile
            mkdir -p dist/mobile
            git show 2d2ef2b91a487252a51ed29eeebb576e03fe56b8:.github/workflows/build-web.yml > reports/pinned-v12.yml
            python3 -m venv /tmp/sanctuary-v13
            /tmp/sanctuary-v13/bin/pip -q install 'PyYAML==6.0.2' 'Pillow==11.3.0'
            cat > reports/rebuild_v12.py <<'PY_RESTORE'
          import os,subprocess,yaml
          from pathlib import Path
          items=yaml.safe_load(Path('reports/pinned-v12.yml').read_text(encoding='utf-8'))['jobs']['build']['steps']
          env=dict(os.environ);env['PATH']='/tmp/sanctuary-v13/bin:'+env['PATH']
          names=('Restore successful V11 mobile game','Restore V18 original Orc motion evidence','Build V12 data-driven monster bridge','Verify unchanged assets and motion bridge')
          for name in names:
              hits=[item for item in items if item.get('name')==name and isinstance(item.get('run'),str)]
              if len(hits)!=1:raise SystemExit('V12 pinned step unavailable: '+name)
              subprocess.run(['bash','-e','-o','pipefail','-c',hits[0]['run']],env=env,check=True)
              print('Rebuilt V12:',name,flush=True)
          PY_RESTORE
            /tmp/sanctuary-v13/bin/python reports/rebuild_v12.py
          fi

      - name: Add in-field animation A/B and observation logging
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          cat > reports/patch_v13.py <<'PY_PATCH'
          from pathlib import Path
          import json,hashlib,sys
          root=Path(sys.argv[1] if len(sys.argv)>1 else 'dist/mobile')
          index=root/'index.html'; script=root/'game.js'; stylesheet=root/'game.css'; infofile=root/'build-info.json'
          html=index.read_text(encoding='utf-8');js=script.read_text(encoding='utf-8');css=stylesheet.read_text(encoding='utf-8')
          meta=json.loads(infofile.read_text(encoding='utf-8'))
          if meta.get('package')!=12 or meta.get('source_run')!=39036538203:raise SystemExit('Expected verified V12 source')
          def replace(s,old,new,label):
              count=s.count(old)
              if count!=1:raise SystemExit(f'V13 {label} mismatch: {count}')
              return s.replace(old,new,1)
          html=replace(html,'Sanctuary of Aden Mobile V12 · Monster Motion Bridge','Sanctuary of Aden Mobile V13 · Combat Motion Inspection','title')
          html=replace(html,'Sanctuary Mobile V12</strong>','Sanctuary Mobile V13</strong>','HUD label')
          html=replace(html,'<div id="targetGauge"><div id="targetFill"></div></div></div>',
          '''<div id="targetGauge"><div id="targetFill"></div></div>
          <div id="fieldMotionInfo" aria-live="off"></div>
          <button id="fieldPackToggle" type="button" hidden>오크 후보 모션 켜기</button></div>''','field A/B panel')
          html=replace(html,'<div id="packStatus"></div>', '''<div id="packStatus"></div>
          <div id="packCount">실전 모션 로그 0건</div>''','session log counter')
          html=replace(html,'<div class="packButtons"><button id="packFocusOrc" type="button">SPR 56 보기</button><button id="packToggle" type="button">추출 후보 적용하기</button></div>', '''<div class="packButtons"><button id="packFocusOrc" type="button">SPR 56 보기</button><button id="packToggle" type="button">추출 후보 적용하기</button><button id="packExport" type="button">실전 로그 JSON 저장</button><button id="packClear" type="button">로그 비우기</button></div>''','log controls')
          css+='''
          #targetPanel{pointer-events:auto}
          #fieldMotionInfo{font-size:10px;white-space:pre-line;line-height:1.5;color:#bce5c6;margin-top:5px;overflow-wrap:anywhere}
          #fieldPackToggle{display:block;width:100%;font-size:10px;padding:6px 3px;margin-top:6px;background:#2f554e}
          #fieldPackToggle[hidden]{display:none}
          #packCount{color:#bce5c6;font-size:11px}
          #packExport,#packClear{font-size:12px;padding:8px 5px}
          @media (orientation:landscape) and (max-height:600px){#targetPanel{left:210px;top:calc(8px + env(safe-area-inset-top));max-width:152px}}
          '''
          js=replace(js,"const packActors={};const MOTION_PACK_KEY='sanctuary-v12-monster-pack-on';", "const packActors={};const MOTION_PACK_KEY='sanctuary-v12-monster-pack-on';\nconst observedMotions=[],motionLast=new Map(),MOTION_LOG_CAP=240;",'trace storage')
          anchor='function resize(){'
          helper='''function describeMotion(actor,mode,dir){
           const actions=D.actors[actor]?.actions||{};
           const manual=mapped[actor]?.[mode]?.[dir];
           if(manual!==undefined&&actions[String(manual)])return {source:'수동 배정',key:String(manual),frames:actions[String(manual)].length};
           const group=packActors[actor]?.actions?.[mode];
           const row=motionPackEnabled?group?.directions?.[dir]:null;
           if(row?.frames?.length)return {source:'V18 추출 후보',key:String(row.key),frames:row.frames.length,delayMs:group.delayMs};
           const base=GROUP_BASE[mode]??0;
           const keys=[base+dir,mode==='idle'?24+dir:32+dir,mode==='death'?16+dir:dir,dir];
           for(const key of keys)if(actions[String(key)]?.length)return {source:'기존 기본 추정',key:String(key),frames:actions[String(key)].length};
           return {source:'미배정',key:'-',frames:0};
          }
          function visualFPS(actor,mode,dir){
           if(mode!=='idle'&&mode!=='walk')return 9;
           if(mapped[actor]?.[mode]?.[dir]!==undefined)return 9;
           const group=motionPackEnabled?packActors[actor]?.actions?.[mode]:null;
           const delay=group?.directions?.[dir]?.frames?.length?Number(group.delayMs):0;
           return delay>0?1000/clamp(delay,60,500):9;
          }
          function observeMotion(m){
           if(!m||!packActors[m.visual])return;
           const signature=[m.visual,m.mode,m.dir,motionPackEnabled].join('|');
           if(motionLast.get(m.id)===signature)return;
           motionLast.set(m.id,signature);
           const motion=describeMotion(m.visual,m.mode,m.dir);
           observedMotions.push({time:Number(clock.toFixed(2)),mobId:m.id,spriteId:D.actors[m.visual].sprite_id,mode:m.mode,direction:m.dir,source:motion.source,sprKey:motion.key,frameCount:motion.frames,candidateEnabled:motionPackEnabled,hp:Math.ceil(m.hp)});
           if(observedMotions.length>MOTION_LOG_CAP)observedMotions.shift();
          }
          function updateFieldMotion(){
           const info=el('fieldMotionInfo'),toggle=el('fieldPackToggle'),m=selectedMob;
           if(!m||m.dead){info.textContent='';toggle.hidden=true;return}
           const data=describeMotion(m.visual,m.mode,m.dir);
           info.textContent=m.mode+' · 방향 '+m.dir+' · 원본 키 '+data.key+' ('+data.frames+'프레임)\\n'+data.source;
           toggle.hidden=!packActors[m.visual];
           if(!toggle.hidden)toggle.textContent=motionPackEnabled?'추출 후보 OFF · 기존과 비교':'추출 후보 ON · 실제 전투 비교';
          }
          function exportMotionLog(){
           const payload={schema:'sanctuary.motion-observations.v1',engine:'V13',sourceRun:39041076096,originalSpriteProvenance:'V18 (unverified actions and directions)',candidateEnabled:motionPackEnabled,events:observedMotions.slice()};
           const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));
           const link=document.createElement('a');link.href=url;link.download='sanctuary-v13-motion-observations.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
          }
          '''
          js=replace(js,anchor,helper+anchor,'motion inspection functions')
          js=replace(js,"function begin(){clock=0;lastHudStamp=-1;score=0;potions=10;", "function begin(){clock=0;motionLast.clear();lastHudStamp=-1;score=0;potions=10;", 'reset trace state')
          old="function targetHUD(){const panel=el('targetPanel');if(!selectedMob||selectedMob.dead){panel.hidden=true;return}panel.hidden=false;el('targetLabel').textContent='원본 SPR '+D.actors[selectedMob.visual].sprite_id;el('targetHP').textContent='HP '+Math.max(0,Math.ceil(selectedMob.hp))+' / '+selectedMob.maxHp;el('targetFill').style.width=clamp(selectedMob.hp/selectedMob.maxHp*100,0,100)+'%'}"
          new="function targetHUD(){const panel=el('targetPanel');if(!selectedMob||selectedMob.dead){panel.hidden=true;updateFieldMotion();return}panel.hidden=false;el('targetLabel').textContent='원본 SPR '+D.actors[selectedMob.visual].sprite_id;el('targetHP').textContent='HP '+Math.max(0,Math.ceil(selectedMob.hp))+' / '+selectedMob.maxHp;el('targetFill').style.width=clamp(selectedMob.hp/selectedMob.maxHp*100,0,100)+'%';updateFieldMotion()}"
          js=replace(js,old,new,'live target HUD')
          js=replace(js,"if(auto&&!hero.goalMob&&hero.attackCd<=0&&targetInRange(1.7))tryAttack(false);if(lastHudStamp<0||clock-lastHudStamp>=.14){", "for(const mob of mobs)observeMotion(mob);if(auto&&!hero.goalMob&&hero.attackCd<=0&&targetInRange(1.7))tryAttack(false);if(lastHudStamp<0||clock-lastHudStamp>=.14){",'record frame transitions')
          js=replace(js,'Math.floor(elapsed*9)%seq.length','Math.floor(elapsed*visualFPS(type,unit.mode,unit.dir))%seq.length','opt-in candidate visual frames')
          js=replace(js,"el('packStatus').textContent=Object.keys(packActors).length+'종 등록 · '+(motionPackEnabled?'후보 적용 ON':'기존 동작 유지')+' · 수동 배정 우선';", "el('packStatus').textContent=Object.keys(packActors).length+'종 등록 · '+(motionPackEnabled?'후보 적용 ON':'기존 동작 유지')+' · 수동 배정 우선';el('packCount').textContent='실전 모션 로그 '+observedMotions.length+'건 (최대 '+MOTION_LOG_CAP+'건)';", 'lab trace summary')
          block="""el('packToggle').onclick=()=>{
           motionPackEnabled=!motionPackEnabled;
           try{localStorage.setItem(MOTION_PACK_KEY,String(motionPackEnabled))}catch(e){}
           refreshPackLab();msg(motionPackEnabled?'검증 전 모션 후보를 적용했습니다':'기존 모션으로 복귀했습니다',1.5);
          };"""
          repl="""function toggleMotionCandidate(){
           motionPackEnabled=!motionPackEnabled;
           try{localStorage.setItem(MOTION_PACK_KEY,String(motionPackEnabled))}catch(e){}
           refreshPackLab();targetHUD();msg(motionPackEnabled?'V18 후보 모션 ON (원본 의미 미확정)':'기존 V11 모션으로 복귀',1.5);
          }
          el('packToggle').onclick=toggleMotionCandidate;
          el('fieldPackToggle').onclick=toggleMotionCandidate;
          el('packExport').onclick=exportMotionLog;
          el('packClear').onclick=()=>{observedMotions.length=0;motionLast.clear();refreshPackLab();msg('실전 모션 로그 초기화',1)};"""
          js=replace(js,block,repl,'shared A/B toggle and log controls')
          index.write_text(html,encoding='utf-8');script.write_text(js,encoding='utf-8');stylesheet.write_text(css,encoding='utf-8')
          meta.update(package=13,runtime=13,source_run=39041076096)
          meta['sha256']={name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in ['index.html','game.css','game.js','game-data.js','manifest.json','monster-pack.json','monster-pack.js']}
          infofile.write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root/'README_KO.txt').write_text((root/'README_KO.txt').read_text(encoding='utf-8')+'\nV13: 선택한 몹의 동작/방향/실제 SPR 키를 필드에 표시합니다. V18 후보를 전투 중 즉시 ON/OFF로 비교할 수 있으며 실전 모션 전환을 JSON으로 저장할 수 있습니다. 후보 idle/walk 프레임 속도는 검증 전 수치이며 전투 피해, 공격 간격, 충돌 등 게임 규칙은 V12와 동일합니다.\n',encoding='utf-8')
          print('V13 patch OK; output JS size=',script.stat().st_size,'event cap=240')
          PY_PATCH
          python3 -m py_compile reports/patch_v13.py
          python3 reports/patch_v13.py dist/mobile

      - name: Verify source sprites and V13 playable controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY'
          from pathlib import Path
          import hashlib,json
          root=Path('dist/mobile')
          info=json.loads((root/'build-info.json').read_text(encoding='utf-8'))
          original=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          pack=json.loads((root/'monster-pack.json').read_text(encoding='utf-8'))
          assert info['package']==13 and info['runtime']==13 and info['source_run']==39041076096
          assert len(original['actors'])==8 and original['map']['size']==[192,192]
          assert len(original['map']['objects'])==59963 and len(original['map']['flags'])==36864
          assert len(list((root/'assets').glob('*.png')))>=3616
          assert len(list((root/'tiles').glob('*.png')))==218
          assert len(list((root/'motion-gifs/v18').glob('*.gif')))==40
          assert info['sha256']['manifest.json']=='3f1cdb0f22376e763888628465b6601f5e9c72eeda8a9194a356dcba2c205c95'
          assert info['sha256']['game-data.js']=='1a50224f083c193c33eab137798bfb6ddccf1b1dea54f3d9055e601c0fbabf57'
          assert info['sha256']['monster-pack.json']=='4b1601df4afcca77e0416d222c4a81c2bafb370eddbe75d75256981cc43010c1'
          assert pack['actors']['mob56']['provenance']['actionDefinitionsVerified'] is False
          for name,digest in info['sha256'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest,name
          html=(root/'index.html').read_text(encoding='utf-8')
          game=(root/'game.js').read_text(encoding='utf-8')
          for item in ('fieldMotionInfo','fieldPackToggle','packExport','packClear','packCount'):
              assert 'id="'+item+'"' in html,item
          assert html.index('src="game-data.js"')<html.index('src="monster-pack.js"')<html.index('src="game.js"')
          assert 'function observeMotion(' in game and 'function visualFPS(' in game
          print('V13 verified: original map, 8 SPR actors, 40 V18 GIFs, A/B controls, bounded session trace')
          PY_VERIFY
          node --check dist/mobile/game.js
          node --check dist/mobile/game-data.js
          node --check dist/mobile/monster-pack.js
          cat > reports/smoke.cjs <<'JS_SMOKE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const root=process.argv[2]||'dist/mobile';
          const text=name=>fs.readFileSync(root+'/'+name,'utf8');
          const pack=JSON.parse(text('monster-pack.json'));
          const manifest=JSON.parse(text('manifest.json'));
          let source=text('game.js');
          const startup="begin();refreshAssetStatus();window.SANCTUARY_GAME_READY=true;el('bootNotice').hidden=true;requestAnimationFrame(render);";
          assert(source.includes(startup),'V12 startup changed unexpectedly');
          source=source.replace(startup,"begin();window.QA={mob:()=>mobs.find(m=>m.visual==='mob56'),hero:()=>hero,choose:targetChoose,mode:setMode,observe:observeMotion,describe:describeMotion,visualFPS,logs:()=>observedMotions,packOn:()=>motionPackEnabled,manual:mapped,roster:ROSTER};refreshAssetStatus();window.SANCTUARY_GAME_READY=true;el('bootNotice').hidden=true;requestAnimationFrame(render);");
          let frames=[],now=0,nodes=new Map(),events={},downloadFile=null,downloadBlob=null;
          function canvas(){return new Proxy({createImageData(w,h){return{data:new Uint8ClampedArray(w*h*4)}},getImageData(){return{data:new Uint8ClampedArray(192*192*4)}},measureText(x){return{width:String(x).length*8}}},{get(o,k){return k in o?o[k]:()=>{}},set(o,k,v){o[k]=v;return true}})}
          class Element{
           constructor(id){this.id=id;this.style={setProperty(){}};this.listeners={};this.hidden=['lab','settingsPanel','targetPanel','fieldPackToggle','packPreview'].includes(id);this.textContent='';this.value={labActor:'hero',labMode:'idle',labDir:'0',labFrame:'-1',labSpeed:'110',frameRate:'30',controlSize:'normal'}[id]||'0';this.classList={add(){},remove(){},toggle(){}};this.clientWidth=390;this.clientHeight=844;this.width=192;this.height=192;this.children=[];this.files=[];}
           getContext(){return canvas()}addEventListener(n,f){(this.listeners[n]??=[]).push(f)}click(){if(this.download)downloadFile=this.download;this.onclick?.();this.fire('click')}
           fire(n,args={}){for(const f of this.listeners[n]||[])f({pointerId:1,clientX:130,clientY:310,preventDefault(){},...args})}
           appendChild(e){this.children.push(e)}replaceChildren(...x){this.children=x}setPointerCapture(){}remove(){}removeAttribute(k){delete this[k]}
           getBoundingClientRect(){return{left:0,top:0,width:390,height:844}}
          }
          const doc={getElementById(id){if(!nodes.has(id))nodes.set(id,new Element(id));return nodes.get(id)},createElement:id=>new Element(id),documentElement:new Element('html'),addEventListener(k,f){events[k]=f},body:new Element('body'),hidden:false};
          class Image{constructor(){this.complete=true;this.naturalWidth=24;this.naturalHeight=24}set src(v){this._src=v;this.onload?.()}get src(){return this._src}}
          const store=new Map(),win={SANCTUARY_MANIFEST:manifest,SANCTUARY_MONSTER_PACK:pack,devicePixelRatio:2,addEventListener(k,f){events[k]=f},visualViewport:{addEventListener(){}}};
          const env={document:doc,window:win,Image,Math,JSON,Int32Array,Uint8ClampedArray,Blob,console,setTimeout(){},confirm:()=>true,devicePixelRatio:2,performance:{now:()=>now},requestAnimationFrame(f){frames.push(f)},URL:{createObjectURL(blob){downloadBlob=blob;return 'blob:mock'},revokeObjectURL(){}},localStorage:{getItem:k=>store.get(k)||null,setItem:(k,v)=>store.set(k,String(v))}};
          vm.runInNewContext(source,env,{timeout:20000});
          const el=id=>doc.getElementById(id);
          function frame(){now+=34;const fn=frames.shift();assert(fn,'Render stopped');fn(now)}
          for(let i=0;i<5;i++)frame();
          assert(win.SANCTUARY_GAME_READY,'startup failed');
          assert.equal(win.QA.roster.length,7,'roster mutated');
          const mob=win.QA.mob();assert(mob,'Orc must be in field');
          assert.equal(win.QA.packOn(),false,'V13 default candidate must be off');
          win.QA.choose(mob,false);assert(!el('targetPanel').hidden,'target selection failed');
          assert(!el('fieldPackToggle').hidden,'in-field toggle hidden for Orc');
          assert(el('fieldMotionInfo').textContent.includes('기존 기본 추정'),'source label wrong');
          const oldDamage=mob.hp,oldAttack=mob.attackCd;
          el('fieldPackToggle').click();assert(win.QA.packOn(),'in-field candidate not activated');
          assert(win.QA.describe('mob56','idle',0).source==='V18 추출 후보');
          assert(Math.abs(win.QA.visualFPS('mob56','idle',0)-1000/220)<.0001,'candidate idle preview interval wrong');
          assert.equal(mob.hp,oldDamage,'candidate changed combat HP');assert.equal(mob.attackCd,oldAttack,'candidate changed combat cooldown');
          assert(el('fieldMotionInfo').textContent.includes('V18 추출 후보'),'live selected target did not update');
          win.QA.manual.mob56.idle={'0':'32'};
          assert.equal(win.QA.describe('mob56','idle',0).source,'수동 배정','manual source must override candidate');
          assert.equal(win.QA.visualFPS('mob56','idle',0),9,'manual should keep baseline animation speed');
          delete win.QA.manual.mob56.idle;
          win.QA.mode(mob,'attack');mob.dir=2;win.QA.observe(mob);
          win.QA.mode(mob,'hit');win.QA.observe(mob);
          win.QA.mode(mob,'death');win.QA.observe(mob);
          assert(win.QA.logs().some(x=>x.mode==='attack'&&x.direction===2),'attack direction not logged');
          assert(win.QA.logs().some(x=>x.mode==='hit'),'hit transition not logged');
          assert(win.QA.logs().some(x=>x.mode==='death'),'death transition not logged');
          const logCount=win.QA.logs().length;win.QA.observe(mob);assert.equal(logCount,win.QA.logs().length,'same motion must not duplicate');
          for(let i=0;i<310;i++){mob.dir=i%8;mob.mode=i%2?'walk':'idle';win.QA.observe(mob)}
          assert(win.QA.logs().length<=240,'ring buffer cap failed');
          el('labOpen').click();assert(!el('lab').hidden);assert(el('packCount').textContent.includes('240'),'lab trace count missing');
          el('packExport').click();assert.equal(downloadFile,'sanctuary-v13-motion-observations.json');assert(downloadBlob,'JSON blob not produced');
          (async()=>{
           const result=JSON.parse(await downloadBlob.text());assert.equal(result.schema,'sanctuary.motion-observations.v1');assert.equal(result.events.length,240);assert(result.events.some(e=>e.spriteId===56));
           el('packClear').click();assert.equal(win.QA.logs().length,0,'clear log failed');
           el('packToggle').click();assert(!win.QA.packOn(),'lab candidate toggle failed');
           el('labClose').click();assert(el('lab').hidden);
           el('settingsToggle').click();assert(!el('settingsPanel').hidden);el('settingsClose').click();assert(el('settingsPanel').hidden);
           events.orientationchange();for(let i=0;i<5;i++)frame();
           console.log('V13 PASS: field A/B, source/SPR key, manual priority, sample FPS, motion trace export, map and UI');
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS_SMOKE
          node --check reports/smoke.cjs
          node reports/smoke.cjs dist/mobile
          echo 'V13: V12 combat preserved; original Orc candidate field toggle, source key and session JSON log verified.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload V13 mobile game
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Mobile-V13-Motion-Inspection
          path: dist/mobile/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Mobile-V13-Diagnostics
          path: reports/
          if-no-files-found: warn
          retention-days: 14
