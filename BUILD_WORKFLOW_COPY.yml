name: Build Diablo Mobile Web

on:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout DevilutionX
        uses: actions/checkout@v4
        with:
          repository: diasurgical/DevilutionX
          path: DevilutionX

      - name: Apply patches
        working-directory: DevilutionX
        run: |
          git apply ../patches/0001-mobile-autoattack.patch
          git apply ../patches/0002-web-mobile-touch-layout.patch

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Configure
        working-directory: DevilutionX
        run: emcmake cmake -S . -B build-em -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: DevilutionX
        run: cmake --build build-em -j2

      - name: Copy mobile files
        run: |
          cp mobile-index.html DevilutionX/build-em/mobile-index.html
          cp preset/diablo-mobile-ko.ini DevilutionX/build-em/diablo-mobile-ko.ini

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: diablo-mobile-autoattack-web
          path: DevilutionX/build-em/
